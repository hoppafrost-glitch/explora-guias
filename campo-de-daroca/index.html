function b64utf8(s){const b=new TextEncoder().encode(s);let x="";for(let i=0;i<b.length;i+=8192) x+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(x);}
let PUBCFG=null;
const ub=buf=>{const u=new Uint8Array(buf);let s="";for(let i=0;i<u.length;i++) s+=String.fromCharCode(u[i]);return btoa(s);};
const bu=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pbk(pass,salt,it){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:it,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);}
async function sealToken(tok,pass){const it=310000,salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},await pbk(pass,salt,it),new TextEncoder().encode(tok));
  return {v:1,kdf:"PBKDF2-SHA256",it,salt:ub(salt),iv:ub(iv),ct:ub(ct)};}
async function unlockToken(pass){
  if(!PUBCFG){try{const r=await fetch("publish.json",{cache:"no-store"});if(r.ok) PUBCFG=await r.json();}catch(e){}}
  if(!PUBCFG||!PUBCFG.ct) throw new Error("nocfg");
  try{const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:bu(PUBCFG.iv)},await pbk(pass,bu(PUBCFG.salt),PUBCFG.it||310000),bu(PUBCFG.ct));return new TextDecoder().decode(pt);}
  catch(e){throw new Error("pass");}}
async function ghPut(tok,path,text,message){const P=DATA.publish||{};if(!P.repo) throw new Error("sin repositorio");
  const api=`https://api.github.com/repos/${P.repo}/contents/${(P.path||"")+path}`;const br=P.branch||"main";
  const h={Authorization:"Bearer "+tok,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  let sha;const g=await fetch(api+"?ref="+br,{headers:h,cache:"no-store"});if(g.ok) sha=(await g.json()).sha; else if(g.status!==404) throw new Error("HTTP "+g.status);
  const body={message,content:b64utf8(text),branch:br};if(sha) body.sha=sha;
  const r=await fetch(api,{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},h),body:JSON.stringify(body)});
  if(!r.ok) throw new Error("HTTP "+r.status);}

/* ---------- Contenido publicado por la comarca (contenido.json) ---------- */
const SITE=DATA.siteUrl||"";
const today=()=>new Date().toISOString().slice(0,10);
let EVENTS=(DATA.eventos||[]).slice(), NEGOCIOS=(DATA.negocios||[]).slice(), AVISOS=[], PREMIO=null, REMOTE={};
function mergeL(a,b){return Object.assign({},a||{},b||{});}
function applyPoiPatch(id,e){const p=BYID[id];if(!p||!e) return;
  ["name","desc","visit"].forEach(k=>{if(e[k]) p[k]=mergeL(p[k],e[k]);});
  if(e.status) p.status=e.status;
  if(e.cat&&CATS[e.cat]&&e.cat!==p.cat){p.cat=e.cat;if(markers[p.id]) markers[p.id].setIcon(pinIcon(p));}}
function addPoi(a){if(!a||!a.id||BYID[a.id]||!CATS[a.cat]) return;POIS.push(a);BYID[a.id]=a;if(typeof markers!=="undefined"&&!markers[a.id]) addMarker(a);}
function applyContent(c){if(!c||typeof c!=="object") return;
  (c.added||[]).forEach(addPoi);
  Object.keys(c.pois||{}).forEach(id=>applyPoiPatch(id,c.pois[id]));
  if(Array.isArray(c.avisos)) AVISOS=c.avisos.slice();
  if(Array.isArray(c.eventos)) EVENTS=c.eventos.slice();
  if(Array.isArray(c.negocios)) NEGOCIOS=c.negocios.slice();
  if(c.premio) PREMIO=c.premio;}
function applyLocal(){EDITS.added.forEach(addPoi);Object.keys(EDITS.byId).forEach(id=>applyPoiPatch(id,EDITS.byId[id]));
  if(Array.isArray(EDITS.avisos)) AVISOS=EDITS.avisos.slice();
  if(Array.isArray(EDITS.eventos)) EVENTS=EDITS.eventos.slice();
  if(EDITS.premio) PREMIO=EDITS.premio;}
function hasLocal(){return !!(Object.keys(EDITS.byId).length||EDITS.added.length||EDITS.avisos||EDITS.eventos||EDITS.premio);}
function buildContent(){const pois={};
  Object.keys(REMOTE.pois||{}).forEach(id=>pois[id]=Object.assign({},REMOTE.pois[id]));
  Object.keys(EDITS.byId).forEach(id=>{const a=pois[id]||{},b=EDITS.byId[id];pois[id]=Object.assign({},a,b,{name:mergeL(a.name,b.name),desc:mergeL(a.desc,b.desc),visit:mergeL(a.visit,b.visit)});});
  const added=(REMOTE.added||[]).filter(a=>!EDITS.added.some(b=>b.id===a.id)).concat(EDITS.added);
  const c={version:1,updated:new Date().toISOString(),pois,added,avisos:AVISOS};
  if(EDITS.eventos||REMOTE.eventos) c.eventos=EVENTS;
  if(PREMIO&&L10(PREMIO)) c.premio=PREMIO;
  return c;}
function activeAvisos(poi){const d=today();return AVISOS.filter(a=>a&&(!a.hasta||a.hasta>=d)&&(poi?a.poi===poi:!a.poi));}
function avisosHTML(poi){const L=activeAvisos(poi);if(!L.length) return "";
  return L.map(a=>`<div class="aviso ${a.tipo==="cierre"?"warn":""}" role="note"><b>${esc(t(a.tipo==="cierre"?"avisoCierre":"avisoInfo"))}</b><span>${esc(L10(a.txt))}${a.hasta?` <span class="small">· ${esc(t("avisoHasta",{d:fmtDate(a.hasta)}))}</span>`:""}</span></div>`).join("");}
function fmtDate(s){try{return new Date(s+"T12:00:00").toLocaleDateString(LANGS.find(l=>l[0]===lang)[2],{day:"numeric",month:"long",year:"numeric"});}catch(e){return s;}}
async function loadRemote(){if(!/^https?:/.test(location.protocol)) return false;
  try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),4000);
    const r=await fetch("contenido.json",{cache:"no-store",signal:ctl.signal});clearTimeout(tm);
    if(!r.ok) return false;REMOTE=await r.json();applyContent(REMOTE);applyLocal();return true;}catch(e){return false;}}

/* ---------- Estadísticas anónimas, sin cookies ---------- */
const STATS=DATA.stats||"";
let sentVisit=false;
function track(kind,id){try{
  if(!sentVisit&&kind!=="visita"){sentVisit=true;track("visita");}
  if(!STATS) return;
  const u=STATS+"?p="+encodeURIComponent("/"+kind+(id?"/"+id:""))+"&t="+encodeURIComponent(lang)+"&e=true&rnd="+Math.random().toString(36).slice(2,8);
  const im=new Image();im.referrerPolicy="no-referrer";im.src=u;}catch(e){}}

/* ---------- Pasaporte de sellos ---------- */
const PASS_KEY="rbx-pass-v1";
let PASS={};try{PASS=JSON.parse(store.get(PASS_KEY)||"{}")||{};}catch(e){PASS={};}
const STAMP_KM=0.3;
const passDemo=()=>store.get("rbx-passdemo")==="1";
function stamp(id,how){if(!BYID[id]||PASS[id]) return false;PASS[id]={t:Date.now(),h:how};store.set(PASS_KEY,JSON.stringify(PASS));track("sello",id);return true;}
const nStamps=()=>Object.keys(PASS).filter(id=>BYID[id]).length;
function routeDone(r){return r.stops.every(id=>PASS[id]);}
function stampBoxHTML(p){const s=PASS[p.id];
  return `<div class="stampbox${s?" done":""}" style="--c:var(${CATS[p.cat].color})"><div class="seal" aria-hidden="true">${s?svgI("check"):svgI("stamp")}</div>
   <div class="stack" style="gap:2px;min-width:0;flex:1"><b>${esc(t(s?"passStamped":"passStampTitle"))}</b><span class="small">${esc(s?t("passStampedOn",{d:new Date(s.t).toLocaleDateString(LANGS.find(l=>l[0]===lang)[2])}):t("passStampText"))}</span></div>
   ${s?`<button type="button" class="btn sm" id="topass">${esc(t("passOpen"))}</button>`:`<button type="button" class="btn primary sm" id="dostamp">${esc(t("passStampBtn"))}</button>`}</div>`;}
function bindStamp(p){const b=$("#dostamp");if(b) b.onclick=()=>tryStamp(p);const o=$("#topass");if(o) o.onclick=()=>setTab("pasaporte");}
function tryStamp(p){
  const ok=()=>{stamp(p.id,"gps");toast(t("passGot"));renderPlace();};
  if(passDemo()){ok();return;}
  if(!navigator.geolocation){toast(t("locErr"));return;}
  toast(t("locating"));
  try{navigator.geolocation.getCurrentPosition(pos=>{const d=hav({lat:pos.coords.latitude,lon:pos.coords.longitude},p);
    if(d<=STAMP_KM) ok(); else toast(t("passFar",{n:d<10?nf().format(d):Math.round(d)}));},
    ()=>toast(t("locErr")),{timeout:12000,maximumAge:30000,enableHighAccuracy:true});}catch(e){toast(t("locErr"));}}
function renderPass(){
  const v=$("#v-pasaporte");const n=nStamps(),N=POIS.length;
  const towns=[...new Set(POIS.map(p=>p.town))].sort((a,b)=>a.localeCompare(b,"es"));
  const routes=DATA.routes.map(r=>({r,k:r.stops.filter(id=>PASS[id]).length}));
  const canDiploma=n>=5||routes.some(x=>x.k===x.r.stops.length);
  v.innerHTML=`<div class="stack" style="gap:4px"><div class="eyebrow">${esc(t("tabPass"))}</div><h2>${esc(t("passTitle"))}</h2><p class="lede">${esc(t("passIntro"))}</p></div>
   ${passDemo()?`<div class="aviso"><b>${esc(t("passDemoTag"))}</b><span>${esc(t("passDemoText"))}</span></div>`:""}
   <div class="passhead"><div class="ring" style="--p:${(n/N*100).toFixed(1)}"><b>${n}</b><span>/ ${N}</span></div>
    <div class="stack" style="gap:3px"><b>${esc(t("passCount",{n,N}))}</b><span class="small">${esc(t("passHow"))}</span></div></div>
   ${PREMIO&&L10(PREMIO)?`<div class="aviso prize"><b>${esc(t("passPrize"))}</b><span>${esc(L10(PREMIO))}</span></div>`:""}
   <div class="stack" style="gap:8px"><h3>${esc(t("passRoutes"))}</h3>
    ${routes.map(({r,k})=>`<button type="button" class="prow" data-r="${r.id}" style="--c:var(${CATS[r.cat].color})"><span class="t">${esc(L10(r.name))}</span><span class="pbar"><i style="width:${(k/r.stops.length*100).toFixed(0)}%"></i></span><span class="small">${k===r.stops.length?"✓ "+esc(t("passDone")):k+" / "+r.stops.length}</span></button>`).join("")}</div>
   <div class="stack" style="gap:6px"><h3>${esc(t("passAll"))}</h3>
    ${towns.map(tn=>`<div class="group-h">${esc(tn)}<span>${POIS.filter(p=>p.town===tn&&PASS[p.id]).length} / ${POIS.filter(p=>p.town===tn).length}</span></div>
     <div class="stamps">${POIS.filter(p=>p.town===tn).map(p=>`<button type="button" class="stamp${PASS[p.id]?" on":""}" data-id="${p.id}" style="--c:var(${CATS[p.cat].color})" aria-label="${esc(L10(p.name))}${PASS[p.id]?" · "+esc(t("passStamped")):""}"><span class="seal" aria-hidden="true">${PASS[p.id]?ICON(p.cat):""}</span><span class="nm">${esc(L10(p.name))}</span></button>`).join("")}</div>`).join("")}</div>
   <div class="card stack" style="gap:8px"><h3>${esc(t("passDiploma"))}</h3>
    <p class="small">${esc(t(canDiploma?"passDiplomaText":"passDiplomaLocked"))}</p>
    ${canDiploma?`<div class="field"><label for="dip-name">${esc(t("passYourName"))}</label><input id="dip-name" maxlength="40" autocomplete="name"></div>
    <button type="button" class="btn primary" id="dip-go" style="align-self:flex-start">${svgI("download")}<span>${esc(t("passDiplomaBtn"))}</span></button>`:""}</div>`;
  v.onclick=e=>{const b=e.target.closest("[data-id]");if(b){openPlace(b.dataset.id);return;}
    const r=e.target.closest("[data-r]");if(r){state.route=r.dataset.r;setTab("rutas",false);setHash("r-"+state.route);drawRoute(DATA.routes.find(x=>x.id===state.route));refreshMarkers();}};
  const g=$("#dip-go");if(g) g.onclick=()=>diploma(($("#dip-name").value||"").trim());
}
function diploma(name){
  const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const cs=getComputedStyle(document.documentElement);const col=v=>(cs.getPropertyValue(v)||"").trim()||"#17646C";
  x.fillStyle="#F7F4EC";x.fillRect(0,0,W,H);
  x.strokeStyle="#17646C";x.lineWidth=6;x.strokeRect(40,40,W-80,H-80);x.lineWidth=2;x.strokeRect(58,58,W-116,H-116);
  x.strokeStyle="#5B9BD5";x.lineWidth=10;x.lineCap="round";x.beginPath();x.moveTo(120,300);x.bezierCurveTo(330,200,420,380,600,300);x.bezierCurveTo(760,230,860,330,960,270);x.stroke();
  x.fillStyle="#18221E";x.textAlign="center";
  x.font="700 30px system-ui,sans-serif";x.fillText("COMARCA CAMPO DE DAROCA",W/2,150);
  x.font="700 76px Georgia,serif";x.fillText(t("passDipTitle"),W/2,410);
  x.font="400 34px system-ui,sans-serif";x.fillStyle="#56635D";x.fillText(t("passDipFor"),W/2,490);
  x.fillStyle="#18221E";x.font="700 60px Georgia,serif";x.fillText(name||t("passDipAnon"),W/2,570);
  const n=nStamps();x.font="400 36px system-ui,sans-serif";x.fillStyle="#18221E";x.fillText(t("passDipCount",{n,N:POIS.length}),W/2,645);
  const done=DATA.routes.filter(routeDone);
  x.font="400 28px system-ui,sans-serif";x.fillStyle="#56635D";
  done.slice(0,3).forEach((r,i)=>x.fillText("✓ "+L10(r.name),W/2,705+i*40));
  const cols=9,sz=58,gap=16,gx=(W-(cols*sz+(cols-1)*gap))/2,gy=840;
  POIS.slice(0,45).forEach((p,i)=>{const cx=gx+(i%cols)*(sz+gap)+sz/2,cy=gy+Math.floor(i/cols)*(sz+gap)+sz/2;
    x.beginPath();x.arc(cx,cy,sz/2-4,0,Math.PI*2);
    if(PASS[p.id]){x.fillStyle=col(CATS[p.cat].color);x.fill();}else{x.setLineDash([6,6]);x.strokeStyle="#B9C2BD";x.lineWidth=3;x.stroke();x.setLineDash([]);}});
  x.fillStyle="#56635D";x.font="400 24px system-ui,sans-serif";x.fillText(new Date().toLocaleDateString(LANGS.find(l=>l[0]===lang)[2],{day:"numeric",month:"long",year:"numeric"}),W/2,H-100);
  c.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="pasaporte-ribera-baja.png";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);track("diploma");},"image/png");
}

/* ---------- Agenda, dónde comer y dormir ---------- */
const MONTHS=m=>new Date(2026,m-1,15).toLocaleDateString(LANGS.find(l=>l[0]===lang)[2],{month:"long"});
function evOrder(e){const now=new Date();const cm=now.getMonth()+1;
  if(e.date){const d=new Date(e.date+"T12:00:00");const diff=(d-now)/864e5;return diff>=-1?diff:9999+diff;}
  const m=e.month||12;return ((m-cm+12)%12)*30.5;}
function renderAgenda(){
  const v=$("#v-agenda");const towns=[...new Set(TOWNS.map(x=>x.name))].sort((a,b)=>a.localeCompare(b,"es"));
  const f=state.agTown||"";const ev=EVENTS.filter(e=>!f||e.mun===f).filter(e=>!(e.date&&e.date<today())).sort((a,b)=>evOrder(a)-evOrder(b));
  const neg=NEGOCIOS.filter(n=>!f||n.mun===f);
  const types=[...new Set(neg.map(n=>n.type))];
  v.innerHTML=`<div class="stack" style="gap:4px"><div class="eyebrow">${esc(t("tabAgenda"))}</div><h2>${esc(t("agTitle"))}</h2><p class="lede">${esc(t("agIntro"))}</p></div>
   ${avisosHTML()}
   <div class="field"><label for="ag-town">${esc(t("fTown"))}</label><select id="ag-town"><option value="">${esc(t("allTowns"))}</option>${towns.map(x=>`<option ${x===f?"selected":""}>${esc(x)}</option>`).join("")}</select></div>
   <div class="stack" style="gap:8px"><h3>${esc(t("agEvents"))}</h3>
   ${ev.length?ev.map(e=>`<article class="ev">${e.date?`<div class="cal" aria-hidden="true"><span>${esc(new Date(e.date+"T12:00:00").toLocaleDateString(LANGS.find(l=>l[0]===lang)[2],{month:"short"}).replace(".",""))}</span><b>${+e.date.slice(8,10)}</b></div>`:`<div class="cal m" aria-hidden="true"><b>${esc(MONTHS(e.month).slice(0,3).replace(".",""))}</b></div>`}
     <div class="stack" style="gap:3px;min-width:0"><b>${esc(L10(e.name))}</b><span class="small"><b style="color:var(--ink)">${esc(e.mun)}</b> · ${esc(L10(e.when))}</span>${L10(e.desc)?`<p>${esc(L10(e.desc))}</p>`:""}${e.src?`<a class="small" href="${esc(e.src)}" target="_blank" rel="noopener">${esc(t("source"))}</a>`:""}</div></article>`).join(""):`<p class="small">${esc(t("agNone"))}</p>`}
   <p class="note">${esc(t("agNote"))}</p></div>
   ${neg.length?`<div class="stack" style="gap:8px"><h3>${esc(t("agStay"))}</h3>
    ${types.map(ty=>`<div class="group-h">${esc(t("neg_"+ty)||ty)}<span>${neg.filter(n=>n.type===ty).length}</span></div>${neg.filter(n=>n.type===ty).map(n=>`<div class="neg"><div class="stack" style="gap:2px;min-width:0"><b>${esc(n.name)}</b><span class="small">${esc(n.mun)}${n.addr?" · "+esc(n.addr):""}${n.cat?" · "+esc(n.cat):""}</span></div>${n.lat?`<a class="btn sm" href="https://www.google.com/maps/dir/?api=1&destination=${n.lat},${n.lon}" target="_blank" rel="noopener" aria-label="${esc(t("directions"))}: ${esc(n.name)}">${svgI("nav")}</a>`:""}</div>`).join("")}`).join("")}
    <p class="note">${esc(t("agStayNote"))}</p></div>`:""}
   <div class="card stack" style="gap:6px"><h3>${esc(t("agBiz"))}</h3><p class="small">${esc(t("agBizText"))}</p>
    ${DATA.contact?`<div class="actions">${DATA.contact.tel?`<a class="btn" href="tel:${esc(DATA.contact.tel.replace(/\s/g,""))}">${esc(DATA.contact.tel)}</a>`:""}${DATA.contact.web?`<a class="btn" href="${esc(DATA.contact.web)}" target="_blank" rel="noopener">${esc(t("agWeb"))}</a>`:""}</div>`:""}</div>`;
  $("#ag-town").onchange=e=>{state.agTown=e.target.value;renderAgenda();};
}

function nextEventText(){const e=EVENTS.filter(e=>!(e.date&&e.date<today())).sort((a,b)=>evOrder(a)-evOrder(b))[0];return e?t("agNext",{x:L10(e.name)+" · "+e.mun}):t("agCtaText");}
/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang=lang;
  $$("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));
  $("#langs").innerHTML=LANGS.map(([k,lab])=>`<button type="button" data-l="${k}" aria-pressed="${k===lang}" lang="${k}">${lab}</button>`).join("");
  $$(".layerbox button").forEach(b=>b.textContent=t("base_"+b.dataset.k));
  $("#legend").innerHTML=Object.keys(CATS).map(c=>`<div style="--c:var(${CATS[c].color})"><i></i>${esc(t("cat_"+c))}</div>`).join("");
  POIS.forEach(p=>{const el=markers[p.id].getElement();if(el) el.setAttribute("title",L10(p.name));});
  stopAudio();
  render(state.tab);
}
$("#langs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.l;store.set("rbx-lang",lang);applyLang();});
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.tab==="explorar") state.sel=null;setTab(b.dataset.tab);});
setBasemap("mapa",true);
function zoomClasses(){const z=map.getZoom(),el=$("#map");el.classList.toggle("zlow",z<11.4);el.classList.toggle("zfar",z<12);}
map.on("zoomend",zoomClasses);zoomClasses();

/* ---------- cover ---------- */
function showCover(){
  let seen=false;try{seen=sessionStorage.getItem(SP+"rbx-cover")==="1";}catch(e){}
  if(seen) return;
  const c=$("#cover");const key=DATA.coverPhoto||"rueda";const ph=PH[key];
  const draw=()=>{c.innerHTML=`${phHTML(key,"patrimonio",1280)}<div class="shade"></div>
    <div class="brandc"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="rgba(255,255,255,.16)"/><path d="M4 22c5-1 6-7 11-7s5 9 10 9 4-6 5-7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="23" cy="10" r="2.6" fill="#fff"/></svg><span>Campo de Daroca Explora</span></div>
    <div class="clangs">${LANGS.map(([k,lab])=>`<button type="button" data-l="${k}" aria-pressed="${k===lang}">${lab}</button>`).join("")}</div>
    <div class="in"><div class="kick">${esc(t("coverKicker"))}</div><h1>${clauses(t("coverTitle"))}</h1><p>${esc(t("coverText"))}</p>
    <div class="row2"><button type="button" class="cbtn main" id="c-go">${esc(t("coverCta"))}</button><button type="button" class="cbtn" id="c-routes">${esc(t("coverRoutes"))}</button></div></div>
    ${ph?`<div class="credit">${esc(t("photo"))}: <a href="${esc(ph.page)}" target="_blank" rel="noopener">${esc(ph.author)}</a> · ${esc(ph.license)}</div>`:""}`;
    $("#c-go").onclick=()=>hideCover("inicio");$("#c-routes").onclick=()=>hideCover("rutas");
    $(".clangs",c).onclick=e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.l;store.set("rbx-lang",lang);applyLang();draw();};};
  draw();c.hidden=false;
  setTimeout(()=>{const g=$("#c-go");if(g) g.focus();},50);
}
function hideCover(tab){const c=$("#cover");c.hidden=true;c.innerHTML="";try{sessionStorage.setItem(SP+"rbx-cover","1");}catch(e){}
  if(tab&&tab!==state.tab) setTab(tab);setTimeout(()=>map.invalidateSize(),30);}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#cover").hidden) hideCover();});

/* ---------- hash routing ---------- */
function fromHash(){
  const h=(location.hash||"").slice(1);
  if(h&&!$("#cover").hidden){const c=$("#cover");c.hidden=true;c.innerHTML="";setTimeout(()=>map.invalidateSize(),30);}
  if(h.startsWith("p-")&&BYID[h.slice(2)]){state.sel=h.slice(2);track("ficha",state.sel);const p=BYID[state.sel];setTab("lugar",false);map.setView([p.lat,p.lon],14);return;}
  if(h.startsWith("r-")&&DATA.routes.some(r=>r.id===h.slice(2))){state.route=h.slice(2);setTab("rutas",false);drawRoute(DATA.routes.find(r=>r.id===state.route));return;}
  if(h.startsWith("s-")&&BYID[h.slice(2)]){const id=h.slice(2);track("qr",id);const got=stamp(id,"qr");state.sel=id;const p=BYID[id];setTab("lugar",false);setHash("p-"+id);map.setView([p.lat,p.lon],14);if(got) toast(t("passGot"));return;}
  if(h==="guias"){setTab("agenda",false);return;}
  if(["inicio","explorar","rutas","agenda","pasaporte","gestion"].includes(h)){setTab(h,false);return;}
  setTab("inicio",false);showCover();
}
window.addEventListener("hashchange",fromHash);
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(state.adding){stopAdding();if(state.tab==="gestion")renderAdmin();return;}const bk=$("#back")||$("#rback");if(bk&&!e.target.closest("input,textarea,select"))bk.click();});
applyLocal();
applyLang();
fromHash();
loadRemote().then(ok=>{if(ok){render(state.tab);refreshMarkers();}});
setTimeout(()=>map.invalidateSize(),60);
(function(){const b=$("#tomap"),mw=$("#mapwrap");if(!b||!mw) return;
  b.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
  const upd=()=>{const r=mw.getBoundingClientRect();if(isPhone()&&r.bottom<60) b.removeAttribute("data-off"); else b.setAttribute("data-off","");};
  window.addEventListener("scroll",upd,{passive:true});window.addEventListener("resize",upd);upd();})();
window.addEventListener("resize",()=>map.invalidateSize());
})();
</script>
