no sube junto a un tramo restaurado de muralla, pasa por el Torreón de los Tres Guitarros y alcanza el cerro de San Cristóbal. Allí está el Castillo Mayor, la principal fortificación del recinto, de origen musulmán. Desde arriba se entiende la forma de Daroca: una calle Mayor en el fondo del valle y la muralla trepando por las laderas.\n\nBuena parte de la cerca está deteriorada y en los últimos años ha habido derrumbes; por eso conviene seguir los caminos señalizados."}],"en":[{"h":"History","t":"Daroca began as a Muslim fortress. When Alfonso I conquered it in 1120, the Christians extended the defences as the town grew, and building continued until the 15th century. The charter of 1142 attracted settlers from Aragon, Catalonia, France, Castile and Navarre, and by the early 13th century Daroca had more than 4,000 inhabitants.\n\nThe result is the most extensive walled enclosure in Aragon: almost four kilometres of rammed earth, brick and stone, more than a hundred towers, three castles and several gates, among them the Alta, the Baja, the Arrabal and the Portal de Valencia. The walls saw action in the War of the Two Peters, the Peninsular War and the Carlist Wars."},{"h":"What to see","t":"From the Puerta Alta the path climbs beside a restored stretch of wall, passes the Torreón de los Tres Guitarros and reaches San Cristóbal hill. There stands the Castillo Mayor, the main fortification of the enclosure, of Muslim origin. From the top you can see how Daroca is laid out: Calle Mayor along the valley floor and the walls clambering up the slopes.\n\nMuch of the circuit has deteriorated and there have been collapses in recent years, so stick to the signposted paths."}],"fr":[{"h":"Histoire","t":"Daroca est née comme forteresse musulmane. Quand Alphonse Ier la conquit en 1120, les chrétiens étendirent les défenses à mesure que la ville grandissait, et les travaux se poursuivirent jusqu'au XVe siècle. Le fuero (charte) de 1142 attira des habitants d'Aragon, de Catalogne, de France, de Castille et de Navarre, et au début du XIIIe siècle Daroca dépassait les 4 000 habitants.\n\nLe résultat est l'enceinte la plus étendue d'Aragon : près de quatre kilomètres de pisé, de brique et de pierre, plus d'une centaine de tours, trois châteaux et plusieurs portes, dont l'Alta, la Baja, celle de l'Arrabal et le Portal de Valencia. Elle a servi pendant la guerre des Deux Pierre, la guerre d'Indépendance et les guerres carlistes."},{"h":"À voir","t":"Depuis la Puerta Alta, le chemin monte le long d'un tronçon restauré, passe par le Torreón de los Tres Guitarros et atteint la colline de San Cristóbal. Là se dresse le Castillo Mayor, principale fortification de l'enceinte, d'origine musulmane. D'en haut, on comprend la forme de Daroca : la Calle Mayor au fond de la vallée et les remparts qui escaladent les pentes.\n\nUne bonne partie de l'enceinte est dégradée et des effondrements se sont produits ces dernières années ; suivez donc les chemins balisés."}],"de":[{"h":"Geschichte","t":"Daroca entstand als muslimische Festung. Als Alfons I. die Stadt 1120 eroberte, erweiterten die Christen die Befestigungen mit dem Wachstum der Stadt, und gebaut wurde bis ins 15. Jahrhundert. Das Stadtrecht von 1142 zog Siedler aus Aragonien, Katalonien, Frankreich, Kastilien und Navarra an, und Anfang des 13. Jahrhunderts hatte Daroca über 4.000 Einwohner.\n\nDas Ergebnis ist die ausgedehnteste Stadtbefestigung Aragoniens: fast vier Kilometer aus Stampflehm, Backstein und Stein, über hundert Türme, drei Burgen und mehrere Tore, darunter die Puerta Alta, die Puerta Baja, das Tor des Arrabal und das Portal de Valencia. Sie spielte im Krieg der beiden Peter, im Unabhängigkeitskrieg und in den Carlistenkriegen eine Rolle."},{"h":"Sehenswert","t":"Von der Puerta Alta steigt der Weg an einem restaurierten Mauerabschnitt entlang, passiert den Torreón de los Tres Guitarros und erreicht den Hügel San Cristóbal. Dort steht das Castillo Mayor, die wichtigste Befestigung der Anlage, muslimischen Ursprungs. Von oben versteht man die Form Darocas: die Calle Mayor auf dem Talgrund und die Mauer, die die Hänge hinaufklettert.\n\nEin großer Teil der Mauer ist verfallen, in den letzten Jahren kam es zu Einstürzen; bleiben Sie daher auf den markierten Wegen."}],"pt":[{"h":"História","t":"Daroca nasceu como fortaleza muçulmana. Quando Afonso I a conquistou em 1120, os cristãos ampliaram as defesas à medida que a cidade crescia, e as obras prolongaram-se até ao século XV. O foral de 1142 atraiu povoadores de Aragão, Catalunha, França, Castela e Navarra, e no início do século XIII Daroca tinha mais de 4000 habitantes.\n\nO resultado é o recinto amuralhado mais extenso de Aragão: quase quatro quilómetros de taipa, tijolo e pedra, mais de cem torreões, três castelos e várias portas, entre elas a Alta, a Baja, a do Arrabal e o Portal de Valencia. Foi usado na guerra dos Dois Pedros, na Guerra Peninsular e nas guerras carlistas."},{"h":"O que ver","t":"Da Puerta Alta, o caminho sobe junto a um troço restaurado de muralha, passa pelo Torreón de los Tres Guitarros e chega ao monte de San Cristóbal. Ali fica o Castillo Mayor, a principal fortificação do recinto, de origem muçulmana. Lá de cima percebe-se a forma de Daroca: a Calle Mayor no fundo do vale e a muralha a trepar pelas encostas.\n\nGrande parte da cerca está degradada e nos últimos anos houve derrocadas; por isso convém seguir os caminhos sinalizados."}]},"status":"pending"},{"id":"laguna-gallocanta","town":"Gallocanta","cat":"naturaleza","lat":40.96667,"lon":-1.49722,"coord_src":"https://en.wikipedia.org/wiki/Laguna_de_Gallocanta","q":["Laguna de Gallocanta","Centro de Interpretación Laguna de Gallocanta"],"fq":["Category:Laguna de Gallocanta","Laguna de Gallocanta grullas","Gallocanta lagoon cranes"],"name":{"es":"Laguna de Gallocanta","en":"Gallocanta Lagoon","fr":"Lagune de Gallocanta","de":"Lagune von Gallocanta","pt":"Lagoa de Gallocanta"},"when":{"es":"Reserva natural · Paso de grullas de octubre a marzo","en":"Nature reserve · Crane passage from October to March","fr":"Réserve naturelle · Passage des grues d'octobre à mars","de":"Naturschutzgebiet · Kranichzug von Oktober bis März","pt":"Reserva natural · Passagem de grous de outubro a março"},"desc":{"es":"Una laguna salada de casi ocho kilómetros de largo y apenas medio metro de profundidad, a unos mil metros de altitud. Cada invierno decenas de miles de grullas la usan como dormidero, y su llegada al atardecer es el gran espectáculo de la comarca.","en":"A saline lagoon almost eight kilometres long and barely half a metre deep, at about a thousand metres above sea level. Every winter tens of thousands of cranes roost here, and their arrival at dusk is the great spectacle of the district.","fr":"Une lagune salée de près de huit kilomètres de long et d'à peine un demi-mètre de profondeur, à environ mille mètres d'altitude. Chaque hiver, des dizaines de milliers de grues y passent la nuit, et leur arrivée au crépuscule est le grand spectacle de la région.","de":"Eine Salzlagune von fast acht Kilometern Länge und kaum einem halben Meter Tiefe, auf rund tausend Metern Höhe. Jeden Winter nutzen Zehntausende Kraniche sie als Schlafplatz, und ihre Ankunft in der Abenddämmerung ist das große Schauspiel der Region.","pt":"Uma lagoa salgada com quase oito quilómetros de comprimento e apenas meio metro de profundidade, a cerca de mil metros de altitude. Todos os invernos dezenas de milhares de grous usam-na como dormitório, e a sua chegada ao entardecer é o grande espetáculo da comarca."},"visit":{"es":"Empieza en el Centro de Visitantes de Gallocanta (oficina de turismo, museo de aves y centro de interpretación; tel. 976 80 30 69). La pasarela y el observatorio están adaptados. Para ver grullas, mejor al amanecer o al atardecer, de octubre a marzo, con prismáticos y sin salir de los caminos.","en":"Start at the Gallocanta Visitor Centre (tourist office, bird museum and interpretation centre; tel. 976 80 30 69). The boardwalk and hide are accessible. To see cranes, go at dawn or dusk between October and March, with binoculars, and stay on the paths.","fr":"Commencez par le Centre des visiteurs de Gallocanta (office de tourisme, musée des oiseaux et centre d'interprétation ; tél. 976 80 30 69). La passerelle et l'observatoire sont accessibles. Pour voir les grues, venez à l'aube ou au crépuscule, d'octobre à mars, avec des jumelles, sans quitter les chemins.","de":"Beginnen Sie im Besucherzentrum Gallocanta (Fremdenverkehrsbüro, Vogelmuseum und Informationszentrum; Tel. 976 80 30 69). Steg und Beobachtungsstand sind barrierefrei. Kraniche sieht man am besten bei Sonnenaufgang oder -untergang, von Oktober bis März, mit Fernglas und ohne die Wege zu verlassen.","pt":"Comece no Centro de Visitantes de Gallocanta (posto de turismo, museu de aves e centro de interpretação; tel. 976 80 30 69). O passadiço e o observatório estão adaptados. Para ver grous, o melhor é ao amanhecer ou ao entardecer, de outubro a março, com binóculos e sem sair dos caminhos."},"src":"https://www.turismodearagon.com/ficha/reserva-natural-dirigida-de-la-laguna-de-gallocanta/","sources":["https://en.wikipedia.org/wiki/Laguna_de_Gallocanta","https://es.hispanopedia.com/wiki/Reserva_natural_dirigida_de_la_Laguna_de_Gallocanta","https://es.hispanopedia.com/wiki/Gallocanta","https://daroca.toools.es/wp-content/uploads/2026/03/Rutas-ornitologicas.pdf","https://daroca.toools.es/wp-content/uploads/2026/06/Folleto-LF-Guia-Campo-de-Daroca-V.1.pdf"],"art":{"es":[{"h":"El paisaje","t":"Gallocanta es una laguna endorreica: no tiene salida al mar y su nivel depende de la lluvia de otoño y primavera. Mide unos 7,7 kilómetros de largo y 2,8 de ancho, y su profundidad habitual ronda el medio metro. Hay años en que casi se seca y otros en que se llena.\n\nEstá protegida como Zona de Especial Protección para las Aves desde 1987, como humedal Ramsar desde 1994 y como Reserva Natural Dirigida desde 2006. La reserva toca los términos de Gallocanta, Berrueco, Las Cuerlas y Santed, y de Tornos y Bello, ya en Teruel."},{"h":"Qué ver","t":"La grulla común es la protagonista. Las primeras llegan a mediados de octubre; una parte pasa el invierno aquí y el resto sigue hacia el sur. Entre febrero y principios de marzo vuelven a pasar camino del norte. Al caer la tarde entran a dormir en la laguna en grandes bandos, con un sonido que se oye desde lejos.\n\nTodo el año se pueden ver aguilucho lagunero, tarro blanco, pato colorado, avutarda o calandria. Desde el centro de visitantes una ruta circular rodea la laguna con observatorios como La Reguera, Los Ojos o el de la ermita del Buen Acuerdo."},{"h":"Para entenderlo","t":"Si vas a ver grullas, respeta las distancias: son muy sensibles a las molestias y un coche parado en mal sitio puede levantar un bando entero."}],"en":[{"h":"The landscape","t":"Gallocanta is an endorheic lagoon: it has no outlet to the sea and its level depends on autumn and spring rain. It is about 7.7 kilometres long and 2.8 wide, and its usual depth is around half a metre. In some years it almost dries up; in others it fills.\n\nIt has been protected as a Special Protection Area for birds since 1987, as a Ramsar wetland since 1994 and as a Managed Nature Reserve since 2006. The reserve covers land in Gallocanta, Berrueco, Las Cuerlas and Santed, and in Tornos and Bello, over the border in Teruel."},{"h":"What to see","t":"The common crane is the star. The first arrive in mid-October; some spend the winter here and the rest continue south. Between February and early March they pass through again on their way north. At dusk they fly in to roost on the lagoon in great flocks, with a sound you can hear from far away.\n\nAll year round you can see marsh harrier, shelduck, red-crested pochard, great bustard or calandra lark. From the visitor centre a circular route goes round the lagoon, with hides such as La Reguera, Los Ojos or the one by the Buen Acuerdo hermitage."},{"h":"Understanding it","t":"If you go to see the cranes, keep your distance: they are very sensitive to disturbance, and a car stopped in the wrong place can put up an entire flock."}],"fr":[{"h":"Le paysage","t":"Gallocanta est une lagune endoréique : elle n'a pas d'écoulement vers la mer et son niveau dépend des pluies d'automne et de printemps. Elle mesure environ 7,7 kilomètres de long et 2,8 de large, et sa profondeur habituelle tourne autour d'un demi-mètre. Certaines années elle s'assèche presque ; d'autres, elle se remplit.\n\nElle est protégée comme Zone de protection spéciale pour les oiseaux depuis 1987, comme zone humide Ramsar depuis 1994 et comme Réserve naturelle dirigée depuis 2006. La réserve s'étend sur Gallocanta, Berrueco, Las Cuerlas et Santed, ainsi que sur Tornos et Bello, déjà dans la province de Teruel."},{"h":"À voir","t":"La grue cendrée est la vedette. Les premières arrivent à la mi-octobre ; une partie passe l'hiver ici et les autres poursuivent vers le sud. Entre février et début mars, elles repassent en route vers le nord. Au soir, elles viennent dormir sur la lagune en grandes troupes, avec un bruit qui s'entend de loin.\n\nToute l'année, on peut voir le busard des roseaux, le tadorne de Belon, la nette rousse, l'outarde barbue ou l'alouette calandre. Depuis le centre des visiteurs, un circuit fait le tour de la lagune, avec des observatoires comme La Reguera, Los Ojos ou celui de l'ermitage du Buen Acuerdo."},{"h":"Pour comprendre","t":"Si vous venez voir les grues, gardez vos distances : elles sont très sensibles au dérangement, et une voiture arrêtée au mauvais endroit peut faire s'envoler toute une troupe."}],"de":[{"h":"Die Landschaft","t":"Gallocanta ist eine endorheische Lagune: Sie hat keinen Abfluss zum Meer, und ihr Wasserstand hängt vom Regen im Herbst und Frühjahr ab. Sie ist etwa 7,7 Kilometer lang und 2,8 breit, ihre übliche Tiefe liegt bei rund einem halben Meter. In manchen Jahren trocknet sie fast aus, in anderen füllt sie sich.\n\nSie ist seit 1987 Vogelschutzgebiet, seit 1994 Ramsar-Feuchtgebiet und seit 2006 Naturschutzgebiet (Reserva Natural Dirigida). Das Schutzgebiet umfasst Flächen von Gallocanta, Berrueco, Las Cuerlas und Santed sowie von Tornos und Bello, die schon in der Provinz Teruel liegen."},{"h":"Sehenswert","t":"Der Graukranich ist der Star. Die ersten kommen Mitte Oktober; ein Teil überwintert hier, die übrigen ziehen weiter nach Süden. Zwischen Februar und Anfang März ziehen sie auf dem Weg nach Norden wieder durch. Bei Einbruch der Dunkelheit fliegen sie in großen Schwärmen zum Schlafen auf die Lagune, mit einem Rufen, das weithin zu hören ist.\n\nGanzjährig sieht man Rohrweihe, Brandgans, Kolbenente, Großtrappe oder Kalanderlerche. Vom Besucherzentrum führt ein Rundweg um die Lagune, mit Beobachtungsständen wie La Reguera, Los Ojos oder dem an der Einsiedelei Buen Acuerdo."},{"h":"Zum Verständnis","t":"Wenn Sie Kraniche beobachten, halten Sie Abstand: Sie reagieren sehr empfindlich auf Störungen, und ein an der falschen Stelle haltendes Auto kann einen ganzen Schwarm auffliegen lassen."}],"pt":[{"h":"A paisagem","t":"Gallocanta é uma lagoa endorreica: não tem saída para o mar e o seu nível depende da chuva de outono e primavera. Mede cerca de 7,7 quilómetros de comprimento e 2,8 de largura, e a profundidade habitual ronda o meio metro. Há anos em que quase seca e outros em que enche.\n\nEstá protegida como Zona de Proteção Especial para as Aves desde 1987, como zona húmida Ramsar desde 1994 e como Reserva Natural Dirigida desde 2006. A reserva abrange terras de Gallocanta, Berrueco, Las Cuerlas e Santed, e de Tornos e Bello, já na província de Teruel."},{"h":"O que ver","t":"O grou-comum é o protagonista. Os primeiros chegam em meados de outubro; uma parte passa aqui o inverno e os restantes seguem para sul. Entre fevereiro e o início de março voltam a passar a caminho do norte. Ao fim da tarde entram para dormir na lagoa em grandes bandos, com um som que se ouve ao longe.\n\nTodo o ano podem ver-se a águia-sapeira, o pato-branco, o pato-de-bico-vermelho, a abetarda ou a calhandra-real. Do centro de visitantes, um percurso circular dá a volta à lagoa, com observatórios como La Reguera, Los Ojos ou o da ermida do Buen Acuerdo."},{"h":"Para compreender","t":"Se for ver grous, respeite as distâncias: são muito sensíveis à perturbação, e um carro parado no sítio errado pode fazer levantar um bando inteiro."}]},"status":"pending"},{"id":"retablo-anento","town":"Anento","cat":"patrimonio","lat":41.06968,"lon":-1.3333,"coord_src":null,"q":["Iglesia de San Blas, Anento","Anento iglesia"],"fq":["Iglesia de San Blas Anento","Anento retablo gótico","Blasco de Grañén Anento"],"name":{"es":"Iglesia de San Blas y retablo gótico","en":"Church of San Blas and its Gothic altarpiece","fr":"Église San Blas et son retable gothique","de":"Kirche San Blas und ihr gotisches Retabel","pt":"Igreja de San Blas e retábulo gótico"},"when":{"es":"Siglo XIII y siglo XV · Gran retablo gótico","en":"13th and 15th centuries · Great Gothic altarpiece","fr":"XIIIe et XVe siècles · Grand retable gothique","de":"13. und 15. Jahrhundert · Großes gotisches Retabel","pt":"Séculos XIII e XV · Grande retábulo gótico"},"desc":{"es":"Una iglesia de una sola nave, entre el románico y el gótico, que guarda un retablo de más de siete metros atribuido a Blasco de Grañén. Es uno de los grandes retablos góticos de Aragón y se conserva en muy buen estado.","en":"A single-nave church, between Romanesque and Gothic, that holds an altarpiece more than seven metres high attributed to Blasco de Grañén. It is one of the great Gothic altarpieces of Aragon and is very well preserved.","fr":"Une église à nef unique, entre roman et gothique, qui abrite un retable de plus de sept mètres attribué à Blasco de Grañén. C'est l'un des grands retables gothiques d'Aragon, et il est très bien conservé.","de":"Eine einschiffige Kirche zwischen Romanik und Gotik, die ein über sieben Meter hohes Retabel birgt, das Blasco de Grañén zugeschrieben wird. Es ist eines der großen gotischen Retabel Aragoniens und sehr gut erhalten.","pt":"Uma igreja de nave única, entre o românico e o gótico, que guarda um retábulo com mais de sete metros atribuído a Blasco de Grañén. É um dos grandes retábulos góticos de Aragão e está muito bem conservado."},"visit":{"es":"El interior se ve con visita guiada, que se reserva en la Oficina de Turismo de Anento (plaza del Pilón, 1; tel. 687 07 99 38; ofanento@comarcadedaroca.com). Confirma horarios y precio al reservar. Calcula media hora.","en":"The interior is seen on a guided visit, booked at the Anento Tourist Office (Plaza del Pilón, 1; tel. 687 07 99 38; ofanento@comarcadedaroca.com). Confirm times and price when booking. Allow half an hour.","fr":"L'intérieur se découvre en visite guidée, à réserver à l'Office de tourisme d'Anento (plaza del Pilón, 1 ; tél. 687 07 99 38 ; ofanento@comarcadedaroca.com). Confirmez horaires et tarif en réservant. Comptez une demi-heure.","de":"Das Innere wird im Rahmen einer Führung gezeigt, die man beim Fremdenverkehrsbüro Anento bucht (Plaza del Pilón, 1; Tel. 687 07 99 38; ofanento@comarcadedaroca.com). Zeiten und Preis bei der Buchung bestätigen lassen. Etwa eine halbe Stunde einplanen.","pt":"O interior vê-se em visita guiada, que se reserva no Posto de Turismo de Anento (plaza del Pilón, 1; tel. 687 07 99 38; ofanento@comarcadedaroca.com). Confirme horários e preço ao reservar. Conte com meia hora."},"src":"https://daroca.toools.es/wp-content/uploads/2026/06/Anento.pdf","sources":["https://daroca.toools.es/wp-content/uploads/2026/06/Anento.pdf","https://lospueblosmasbonitosdeespana.org/en/recursos/iglesia-de-san-blas-anento","https://www.escapadarural.com/blog/anento-aragon-montana-aguallueve/","https://daroca.toools.es/wp-content/uploads/2026/06/Folleto-LF-Guia-Campo-de-Daroca-V.1.pdf"],"art":{"es":[{"h":"Historia","t":"La iglesia de San Blas se empezó en el siglo XIII en estilo románico y se terminó ya con formas del primer gótico: una nave rectangular de nueve tramos, arcos apuntados y bóveda de cañón apuntada. Ha sido restaurada en los últimos años.\n\nEl retablo mayor se atribuye a Blasco de Grañén, pintor de cámara del rey Juan II de Aragón. La documentación comarcal lo sitúa entre 1431 y 1456. Algunas fuentes recuerdan que la autoría no está documentada, por eso se habla de atribución."},{"h":"Qué ver","t":"Colócate en el centro de la nave y mira el retablo completo: supera los siete metros de altura y se organiza en nueve calles verticales, cada una con tres escenas. Abajo, en el banco, hay diez escenas de la Pasión de Cristo.\n\nFíjate en los fondos dorados, en la ropa de los personajes y en cómo cada escena funciona como una viñeta: el retablo era una forma de contar historias sagradas a quien no sabía leer.\n\nAl salir, sube por las calles de Anento hacia el castillo, del siglo XIV, que ya existía en 1357."}],"en":[{"h":"History","t":"The church of San Blas was begun in the 13th century in Romanesque style and finished with early Gothic forms: a rectangular nave of nine bays, pointed arches and a pointed barrel vault. It has been restored in recent years.\n\nThe high altarpiece is attributed to Blasco de Grañén, court painter to King John II of Aragon. The district's documentation dates it between 1431 and 1456. Some sources point out that the authorship is not documented, which is why it is described as an attribution."},{"h":"What to see","t":"Stand in the middle of the nave and take in the whole altarpiece: it is more than seven metres high and arranged in nine vertical columns, each with three scenes. Below, in the predella, are ten scenes of the Passion of Christ.\n\nNotice the gold backgrounds, the characters' clothing and how each scene works like a comic-strip panel: the altarpiece was a way of telling sacred stories to people who could not read.\n\nWhen you leave, walk up through Anento's streets towards the castle, from the 14th century, which already existed in 1357."}],"fr":[{"h":"Histoire","t":"L'église San Blas fut commencée au XIIIe siècle dans le style roman et achevée avec les formes du premier gothique : une nef rectangulaire de neuf travées, des arcs brisés et une voûte en berceau brisé. Elle a été restaurée ces dernières années.\n\nLe retable majeur est attribué à Blasco de Grañén, peintre de cour du roi Jean II d'Aragon. La documentation de la comarca le date entre 1431 et 1456. Certaines sources rappellent que l'auteur n'est pas documenté ; on parle donc d'attribution."},{"h":"À voir","t":"Placez-vous au milieu de la nef et regardez le retable en entier : il dépasse sept mètres de haut et s'organise en neuf travées verticales de trois scènes chacune. En bas, sur la prédelle, dix scènes de la Passion du Christ.\n\nObservez les fonds dorés, les vêtements des personnages et la façon dont chaque scène fonctionne comme une case de bande dessinée : le retable servait à raconter les histoires sacrées à ceux qui ne savaient pas lire.\n\nEn sortant, montez par les rues d'Anento vers le château, du XIVe siècle, qui existait déjà en 1357."}],"de":[{"h":"Geschichte","t":"Die Kirche San Blas wurde im 13. Jahrhundert im romanischen Stil begonnen und bereits mit Formen der Frühgotik vollendet: ein rechteckiges Schiff mit neun Jochen, Spitzbögen und ein spitzbogiges Tonnengewölbe. Sie wurde in den letzten Jahren restauriert.\n\nDas Hauptretabel wird Blasco de Grañén zugeschrieben, Hofmaler König Johanns II. von Aragonien. Die Unterlagen der Comarca datieren es zwischen 1431 und 1456. Einige Quellen weisen darauf hin, dass die Urheberschaft nicht belegt ist, deshalb spricht man von einer Zuschreibung."},{"h":"Sehenswert","t":"Stellen Sie sich in die Mitte des Schiffs und betrachten Sie das ganze Retabel: Es ist über sieben Meter hoch und in neun senkrechte Bahnen mit jeweils drei Szenen gegliedert. Unten, in der Predella, zehn Szenen aus der Passion Christi.\n\nAchten Sie auf die Goldgründe, die Kleidung der Figuren und darauf, wie jede Szene wie ein Comicbild funktioniert: Das Retabel erzählte heilige Geschichten für Menschen, die nicht lesen konnten.\n\nGehen Sie danach durch die Gassen von Anento hinauf zur Burg aus dem 14. Jahrhundert, die schon 1357 bestand."}],"pt":[{"h":"História","t":"A igreja de San Blas começou a ser construída no século XIII em estilo românico e foi terminada já com formas do primeiro gótico: uma nave retangular de nove tramos, arcos ogivais e abóbada de berço quebrado. Foi restaurada nos últimos anos.\n\nO retábulo-mor é atribuído a Blasco de Grañén, pintor de câmara do rei João II de Aragão. A documentação da comarca data-o entre 1431 e 1456. Algumas fontes lembram que a autoria não está documentada, e por isso fala-se de atribuição."},{"h":"O que ver","t":"Coloque-se no centro da nave e olhe para o retábulo completo: tem mais de sete metros de altura e organiza-se em nove ruas verticais, cada uma com três cenas. Em baixo, na predela, há dez cenas da Paixão de Cristo.\n\nRepare nos fundos dourados, nas roupas das personagens e em como cada cena funciona como uma vinheta de banda desenhada: o retábulo era uma forma de contar histórias sagradas a quem não sabia ler.\n\nÀ saída, suba pelas ruas de Anento até ao castelo, do século XIV, que já existia em 1357."}]},"status":"pending"},{"id":"aguallueve","town":"Anento","cat":"naturaleza","lat":41.07329,"lon":-1.32539,"coord_src":null,"q":["Aguallueve, Anento","Aguallueve de Anento"],"fq":["Aguallueve Anento","Anento Aguallueve","Torreón de San Cristóbal Anento"],"name":{"es":"Aguallueve","en":"Aguallueve","fr":"Aguallueve","de":"Aguallueve","pt":"Aguallueve"},"when":{"es":"Paraje natural · Pared de roca que gotea","en":"Natural site · A rock face that drips","fr":"Site naturel · Une paroi rocheuse qui goutte","de":"Naturdenkmal · Eine Felswand, die tropft","pt":"Sítio natural · Uma parede de rocha que goteja"},"desc":{"es":"A las afueras de Anento, el agua se filtra por una pared de roca caliza y cae goteando sobre musgo y piedra, como si lloviera bajo techo. Un sendero corto lo une con el pueblo y sube al torreón celtíbero que lo vigila.","en":"On the edge of Anento, water seeps through a limestone wall and drips over moss and stone, as if it were raining indoors. A short path links it with the village and climbs to the Celtiberian tower that watches over it.","fr":"À la sortie d'Anento, l'eau s'infiltre à travers une paroi calcaire et tombe goutte à goutte sur la mousse et la pierre, comme s'il pleuvait sous un toit. Un court sentier la relie au village et monte jusqu'à la tour celtibère qui la surveille.","de":"Am Rand von Anento sickert Wasser durch eine Kalksteinwand und tropft auf Moos und Stein, als regne es unter einem Dach. Ein kurzer Weg verbindet den Ort mit dem Dorf und führt hinauf zum keltiberischen Turm, der darüber wacht.","pt":"À saída de Anento, a água infiltra-se numa parede de calcário e cai a gotejar sobre musgo e pedra, como se chovesse debaixo de telha. Um trilho curto liga-a à aldeia e sobe até ao torreão celtibero que a vigia."},"visit":{"es":"Acceso libre todo el año por sendero señalizado desde el pueblo; se aparca junto a la oficina de turismo. Hay una ruta corta de 2,2 km (hora y media con calma) y otra de 4,4 km con 250 m de desnivel que sube al torreón. Bañarse en la balsa no está permitido.","en":"Free access all year by a signposted path from the village; park by the tourist office. There is a short route of 2.2 km (an hour and a half at an easy pace) and a longer one of 4.4 km with 250 m of climbing up to the tower. Bathing in the pool is not allowed.","fr":"Accès libre toute l'année par un sentier balisé depuis le village ; on se gare près de l'office de tourisme. Il existe un parcours court de 2,2 km (une heure et demie tranquillement) et un autre de 4,4 km avec 250 m de dénivelé qui monte jusqu'à la tour. La baignade dans le bassin est interdite.","de":"Ganzjährig frei zugänglich über einen markierten Weg vom Dorf aus; Parkplatz am Fremdenverkehrsbüro. Es gibt eine kurze Route von 2,2 km (anderthalb Stunden in Ruhe) und eine längere von 4,4 km mit 250 Höhenmetern hinauf zum Turm. Baden im Becken ist nicht erlaubt.","pt":"Acesso livre todo o ano por trilho sinalizado a partir da aldeia; estaciona-se junto ao posto de turismo. Há um percurso curto de 2,2 km (hora e meia com calma) e outro de 4,4 km com 250 m de desnível que sobe ao torreão. Não é permitido tomar banho no tanque."},"src":"https://www.escapadarural.com/blog/anento-aragon-montana-aguallueve/","sources":["https://www.escapadarural.com/blog/anento-aragon-montana-aguallueve/","https://es.hispanopedia.com/wiki/Anento","https://daroca.toools.es/wp-content/uploads/2026/06/Folleto-LF-Guia-Campo-de-Daroca-V.1.pdf"],"art":{"es":[{"h":"El paisaje","t":"El nombre lo dice todo: aquí el agua llueve de la roca. El terreno es kárstico, de piedra caliza que el agua atraviesa poco a poco. Al llegar a esta pared, sale por las grietas y se desliza hacia el suelo, empapando el musgo que la cubre. Se puede visitar en cualquier época del año; el caudal cambia con las lluvias.\n\nA los pies de la pared el Ayuntamiento construyó una balsa que recoge el agua de la montaña y la de lluvia para regar los campos."},{"h":"Qué ver","t":"Acércate a la pared y escucha: el sonido del goteo es parte de la visita. Después sigue la ruta larga, que sube hasta el Torreón de San Cristóbal, en lo alto del Aguallueve. Según el Ayuntamiento de Anento, se levantó con grandes bloques de piedra hacia el año 200 antes de Cristo, en época celtíbera.\n\nDesde arriba se ve Anento entero, con su castillo del siglo XIV y la iglesia de San Blas. El pueblo tiene alrededor de un centenar de vecinos empadronados, y los fines de semana recibe muchos más visitantes: si buscas tranquilidad, ven entre semana."}],"en":[{"h":"The landscape","t":"The name says it all: aguallueve means \"water rains\", and here the water rains from the rock. The ground is karst, limestone that water seeps through slowly. When it reaches this wall it emerges from the cracks and slides down, soaking the moss that covers it. It can be visited at any time of year; the flow changes with the rain.\n\nAt the foot of the wall the village council built a pool that collects water from the hillside and rainwater to irrigate the fields."},{"h":"What to see","t":"Go up to the wall and listen: the sound of the dripping is part of the visit. Then follow the longer route, which climbs to the Torreón de San Cristóbal, above the Aguallueve. According to Anento council, it was built with large stone blocks around 200 BC, in Celtiberian times.\n\nFrom the top you can see the whole of Anento, with its 14th-century castle and the church of San Blas. The village has around a hundred registered residents and receives many more visitors at weekends: if you want peace and quiet, come on a weekday."}],"fr":[{"h":"Le paysage","t":"Le nom dit tout : aguallueve signifie « l'eau pleut », et ici l'eau pleut de la roche. Le terrain est karstique, fait de calcaire que l'eau traverse lentement. En atteignant cette paroi, elle sort par les fissures et glisse vers le sol en imbibant la mousse qui la couvre. Le site se visite en toute saison ; le débit varie avec les pluies.\n\nAu pied de la paroi, la mairie a construit un bassin qui recueille l'eau de la montagne et celle de la pluie pour irriguer les champs."},{"h":"À voir","t":"Approchez-vous de la paroi et écoutez : le bruit des gouttes fait partie de la visite. Suivez ensuite le grand parcours, qui monte jusqu'au Torreón de San Cristóbal, au-dessus de l'Aguallueve. Selon la mairie d'Anento, il fut bâti avec de gros blocs de pierre vers 200 avant J.-C., à l'époque celtibère.\n\nD'en haut, on voit tout Anento, avec son château du XIVe siècle et l'église San Blas. Le village compte une centaine d'habitants recensés et reçoit bien plus de visiteurs le week-end : si vous cherchez le calme, venez en semaine."}],"de":[{"h":"Die Landschaft","t":"Der Name sagt alles: aguallueve bedeutet „Wasser regnet“, und hier regnet das Wasser aus dem Fels. Der Untergrund ist Karst, Kalkstein, durch den das Wasser langsam sickert. An dieser Wand tritt es aus den Spalten aus und gleitet nach unten, wobei es das Moos durchtränkt, das sie bedeckt. Man kann sie das ganze Jahr besuchen; die Wassermenge ändert sich mit dem Regen.\n\nAm Fuß der Wand baute die Gemeinde ein Becken, das Berg- und Regenwasser zur Bewässerung der Felder sammelt."},{"h":"Sehenswert","t":"Gehen Sie nah an die Wand und hören Sie zu: Das Tropfen gehört zum Besuch. Folgen Sie dann der längeren Route, die zum Torreón de San Cristóbal oberhalb des Aguallueve hinaufführt. Nach Angaben der Gemeinde Anento wurde er um 200 v. Chr., in keltiberischer Zeit, aus großen Steinblöcken errichtet.\n\nVon oben sieht man ganz Anento mit seiner Burg aus dem 14. Jahrhundert und der Kirche San Blas. Das Dorf hat rund hundert gemeldete Einwohner und an Wochenenden deutlich mehr Besucher: Wer Ruhe sucht, kommt unter der Woche."}],"pt":[{"h":"A paisagem","t":"O nome diz tudo: aguallueve significa \"a água chove\", e aqui a água chove da rocha. O terreno é cársico, de calcário que a água atravessa lentamente. Ao chegar a esta parede, sai pelas fendas e desliza até ao chão, encharcando o musgo que a cobre. Pode ser visitada em qualquer época do ano; o caudal muda com as chuvas.\n\nAo pé da parede, a câmara municipal construiu um tanque que recolhe a água da montanha e a da chuva para regar os campos."},{"h":"O que ver","t":"Aproxime-se da parede e escute: o som do gotejar faz parte da visita. Depois siga o percurso longo, que sobe até ao Torreón de San Cristóbal, no alto do Aguallueve. Segundo a câmara de Anento, foi construído com grandes blocos de pedra por volta do ano 200 a.C., em época celtibera.\n\nLá de cima vê-se Anento inteiro, com o castelo do século XIV e a igreja de San Blas. A aldeia tem cerca de uma centena de moradores recenseados e, aos fins de semana, recebe muitos mais visitantes: se procura sossego, venha durante a semana."}]},"status":"pending"},{"id":"murero-fosiles","town":"Murero","cat":"naturaleza","lat":41.1645,"lon":-1.4805,"coord_src":null,"q":["Yacimiento paleontológico de Murero","Rambla de Valdemiedes, Murero"],"fq":["Murero fossils","Murero yacimiento paleontológico","Paradoxides mureroensis"],"name":{"es":"Yacimiento y Sala Paleontológica de Murero","en":"Murero Fossil Site and Palaeontology Room","fr":"Gisement et Salle paléontologique de Murero","de":"Fossilfundstätte und Paläontologischer Saal Murero","pt":"Jazida e Sala Paleontológica de Murero"},"when":{"es":"Cámbrico, más de 500 millones de años · BIC","en":"Cambrian, over 500 million years old · BIC","fr":"Cambrien, plus de 500 millions d'années · BIC","de":"Kambrium, über 500 Millionen Jahre · BIC","pt":"Câmbrico, mais de 500 milhões de anos · BIC"},"desc":{"es":"En una rambla junto a Murero afloran rocas que fueron fondo de mar hace más de 500 millones de años, llenas de trilobites. Fue la primera localidad estrictamente paleontológica de España declarada Bien de Interés Cultural.","en":"In a gully near Murero, rocks that were sea floor more than 500 million years ago crop out, full of trilobites. It was the first purely palaeontological site in Spain to be declared a Bien de Interés Cultural.","fr":"Dans un ravin près de Murero affleurent des roches qui étaient un fond marin il y a plus de 500 millions d'années, riches en trilobites. Ce fut le premier site strictement paléontologique d'Espagne classé Bien de Interés Cultural.","de":"In einer Schlucht bei Murero treten Gesteine zutage, die vor über 500 Millionen Jahren Meeresboden waren, voller Trilobiten. Es war die erste rein paläontologische Fundstätte Spaniens, die zum Bien de Interés Cultural erklärt wurde.","pt":"Numa ribeira junto a Murero afloram rochas que foram fundo de mar há mais de 500 milhões de anos, cheias de trilobites. Foi a primeira localidade estritamente paleontológica de Espanha declarada Bien de Interés Cultural."},"visit":{"es":"El yacimiento está en la rambla de Valdemiedes, a 1,5 km al norte de Murero por la carretera de Villafeliche, con dos rutas señalizadas y paneles. Es de acceso libre: no se pueden recoger ni golpear piedras. La Sala Paleontológica del pueblo requiere reserva previa a través de la comarca.","en":"The site is in the Rambla de Valdemiedes, 1.5 km north of Murero on the road to Villafeliche, with two signposted routes and information panels. Access is free: do not collect or hammer stones. The village's Palaeontology Room must be booked in advance through the comarca.","fr":"Le gisement se trouve dans la Rambla de Valdemiedes, à 1,5 km au nord de Murero par la route de Villafeliche, avec deux parcours balisés et des panneaux. Accès libre : il est interdit de ramasser ou de frapper les pierres. La Salle paléontologique du village se visite sur réservation auprès de la comarca.","de":"Die Fundstätte liegt in der Rambla de Valdemiedes, 1,5 km nördlich von Murero an der Straße nach Villafeliche, mit zwei markierten Wegen und Infotafeln. Freier Zugang: Steine dürfen weder gesammelt noch angeschlagen werden. Der Paläontologische Saal im Dorf ist nur nach Voranmeldung über die Comarca zu besichtigen.","pt":"A jazida fica na Rambla de Valdemiedes, 1,5 km a norte de Murero pela estrada de Villafeliche, com dois percursos sinalizados e painéis. Acesso livre: não se podem recolher nem partir pedras. A Sala Paleontológica da aldeia requer reserva prévia através da comarca."},"src":"https://zaragozala.com/zaragoza-provincia/yacimiento-paleontologico-murero-fosiles-visita/","sources":["https://zaragozala.com/zaragoza-provincia/yacimiento-paleontologico-murero-fosiles-visita/","https://caminodelcid.org/en/servicios/murero-palaeontological-site-2058724","https://daroca.toools.es/wp-content/uploads/2026/06/Folleto%20accesible%20Daroca%20A4.pdf"],"art":{"es":[{"h":"Historia","t":"La primera referencia científica a los fósiles de Murero es de 1862, del paleontólogo francés Édouard de Verneuil. Desde entonces el yacimiento se ha estudiado sin parar. En 1997 los yacimientos cámbricos de las ramblas de Valdemiedes y Valdenegro fueron declarados Bien de Interés Cultural, la primera vez que en España se protegía así un lugar solo por sus fósiles.\n\nLa serie de rocas supera los 200 metros de espesor y abarca unos ocho millones de años. En ella se han identificado unas 80 especies de trilobites, además de esponjas, algas, braquiópodos y animales de cuerpo blando."},{"h":"Qué ver","t":"Hay dos recorridos señalizados, la ruta Paradoxides y la ruta de la Rambla. El nombre de la primera viene de Paradoxides mureroensis, un trilobites con el nombre del pueblo.\n\nCamina despacio y mira las superficies de las lajas: muchos fósiles son pequeños y planos y cuesta verlos al principio. Para los niños es casi un juego de búsqueda. Si encuentras algo llamativo, no lo muevas: avisa al Ayuntamiento.\n\nEn el pueblo, la Sala Paleontológica ayuda a entender lo que se ve en el campo."}],"en":[{"h":"History","t":"The first scientific reference to the Murero fossils dates from 1862, by the French palaeontologist Édouard de Verneuil. The site has been studied continuously ever since. In 1997 the Cambrian sites of the Valdemiedes and Valdenegro gullies were declared a Bien de Interés Cultural, the first time a place in Spain was protected in this way solely for its fossils.\n\nThe rock sequence is more than 200 metres thick and spans about eight million years. Around 80 species of trilobite have been identified in it, as well as sponges, algae, brachiopods and soft-bodied animals."},{"h":"What to see","t":"There are two signposted routes, the Paradoxides route and the Rambla route. The first takes its name from Paradoxides mureroensis, a trilobite named after the village.\n\nWalk slowly and look at the surfaces of the slabs: many fossils are small and flat and hard to spot at first. For children it is almost a treasure hunt. If you find something striking, do not move it: tell the village council.\n\nIn the village, the Palaeontology Room helps you understand what you see in the field."}],"fr":[{"h":"Histoire","t":"La première mention scientifique des fossiles de Murero date de 1862 et revient au paléontologue français Édouard de Verneuil. Depuis, le site n'a cessé d'être étudié. En 1997, les gisements cambriens des ravins de Valdemiedes et de Valdenegro furent classés Bien de Interés Cultural : c'était la première fois qu'en Espagne un lieu était ainsi protégé uniquement pour ses fossiles.\n\nLa série de roches dépasse 200 mètres d'épaisseur et couvre environ huit millions d'années. On y a identifié quelque 80 espèces de trilobites, ainsi que des éponges, des algues, des brachiopodes et des animaux à corps mou."},{"h":"À voir","t":"Deux parcours sont balisés : la route Paradoxides et la route de la Rambla. Le nom de la première vient de Paradoxides mureroensis, un trilobite qui porte le nom du village.\n\nMarchez lentement et observez la surface des dalles : beaucoup de fossiles sont petits et plats, difficiles à repérer au début. Pour les enfants, c'est presque une chasse au trésor. Si vous trouvez quelque chose de remarquable, ne le déplacez pas : prévenez la mairie.\n\nAu village, la Salle paléontologique aide à comprendre ce que l'on voit sur le terrain."}],"de":[{"h":"Geschichte","t":"Die erste wissenschaftliche Erwähnung der Fossilien von Murero stammt von 1862, vom französischen Paläontologen Édouard de Verneuil. Seitdem wird die Fundstätte ununterbrochen erforscht. 1997 wurden die kambrischen Fundstätten der Schluchten Valdemiedes und Valdenegro zum Bien de Interés Cultural erklärt; erstmals wurde in Spanien ein Ort allein wegen seiner Fossilien so geschützt.\n\nDie Gesteinsfolge ist über 200 Meter mächtig und umfasst etwa acht Millionen Jahre. Man hat darin rund 80 Trilobitenarten bestimmt, dazu Schwämme, Algen, Armfüßer und weichkörperige Tiere."},{"h":"Sehenswert","t":"Es gibt zwei markierte Wege, die Paradoxides-Route und die Rambla-Route. Der Name der ersten stammt von Paradoxides mureroensis, einem nach dem Dorf benannten Trilobiten.\n\nGehen Sie langsam und betrachten Sie die Oberflächen der Platten: Viele Fossilien sind klein und flach und anfangs schwer zu entdecken. Für Kinder ist es fast eine Schatzsuche. Wenn Sie etwas Auffälliges finden, bewegen Sie es nicht: Melden Sie es der Gemeinde.\n\nIm Dorf hilft der Paläontologische Saal, das im Gelände Gesehene zu verstehen."}],"pt":[{"h":"História","t":"A primeira referência científica aos fósseis de Murero data de 1862 e deve-se ao paleontólogo francês Édouard de Verneuil. Desde então a jazida tem sido estudada sem parar. Em 1997, as jazidas câmbricas das ribeiras de Valdemiedes e Valdenegro foram declaradas Bien de Interés Cultural, a primeira vez que em Espanha se protegia assim um lugar apenas pelos seus fósseis.\n\nA série de rochas tem mais de 200 metros de espessura e abrange cerca de oito milhões de anos. Nela identificaram-se umas 80 espécies de trilobites, além de esponjas, algas, braquiópodes e animais de corpo mole."},{"h":"O que ver","t":"Há dois percursos sinalizados, a rota Paradoxides e a rota da Rambla. O nome da primeira vem de Paradoxides mureroensis, uma trilobite com o nome da aldeia.\n\nCaminhe devagar e observe as superfícies das lajes: muitos fósseis são pequenos e planos e custam a ver ao princípio. Para as crianças é quase uma caça ao tesouro. Se encontrar algo que chame a atenção, não lhe mexa: avise a câmara municipal.\n\nNa aldeia, a Sala Paleontológica ajuda a perceber o que se vê no campo."}]},"status":"pending"},{"id":"pinsapar-orcajo","town":"Orcajo","cat":"naturaleza","lat":41.1145,"lon":-1.4805,"coord_src":null,"q":["Pinsapar de Orcajo","Orcajo, Zaragoza"],"fq":["Pinsapar de Orcajo","Abies pinsapo Orcajo","Orcajo Zaragoza"],"name":{"es":"Pinsapar de Orcajo y Museo del Reino Fungi","en":"Orcajo Spanish Fir Grove and Reino Fungi Museum","fr":"Sapinière d'Orcajo et Musée du Reino Fungi","de":"Igeltannenwald von Orcajo und Museum Reino Fungi","pt":"Pinsapal de Orcajo e Museu do Reino Fungi"},"when":{"es":"Arboleda singular · Pinsapos en el Sistema Ibérico","en":"Notable grove · Spanish firs in the Iberian Range","fr":"Bosquet remarquable · Sapins d'Espagne dans l'Ibérique","de":"Geschützter Baumbestand · Igeltannen im Iberischen Gebirge","pt":"Arvoredo singular · Abetos-de-espanha no Sistema Ibérico"},"desc":{"es":"En la sierra de Santa Cruz crece un bosquete de pinsapos, un abeto que de forma natural solo vive en las serranías de Málaga y Cádiz. Fuera de allí es el único pinsapar conocido en la Península. En el pueblo, un pequeño museo explica el mundo de las setas.","en":"In the Sierra de Santa Cruz grows a small stand of Spanish fir, a tree that grows naturally only in the mountains of Málaga and Cádiz. Outside that area it is the only known Spanish fir grove in the Peninsula. In the village, a small museum explains the world of mushrooms.","fr":"Dans la Sierra de Santa Cruz pousse un petit bois de sapins d'Espagne, un arbre qui ne vit naturellement que dans les montagnes de Málaga et de Cadix. En dehors de cette région, c'est la seule sapinière de ce type connue dans la péninsule. Au village, un petit musée présente le monde des champignons.","de":"In der Sierra de Santa Cruz wächst ein kleiner Bestand von Spanischen Tannen (Igeltannen), einem Baum, der natürlich nur in den Bergen von Málaga und Cádiz vorkommt. Außerhalb dieses Gebiets ist es der einzige bekannte Igeltannenwald der Halbinsel. Im Dorf erklärt ein kleines Museum die Welt der Pilze.","pt":"Na Sierra de Santa Cruz cresce um pequeno bosque de pinsapos (abetos-de-espanha), uma árvore que, em estado natural, só vive nas serras de Málaga e Cádis. Fora dali é o único pinsapal conhecido na Península. Na aldeia, um pequeno museu explica o mundo dos cogumelos."},"visit":{"es":"El pinsapar está en el monte público Fuentes del Villar, en la sierra de Santa Cruz; pregunta el acceso en la comarca o en el pueblo antes de ir. El Museo del Reino Fungi se visita con reserva previa a través de la web comarcal.","en":"The grove is in the Fuentes del Villar public forest, in the Sierra de Santa Cruz; ask about access at the comarca offices or in the village before you go. The Reino Fungi Museum is visited by prior booking through the comarca website.","fr":"La sapinière se trouve dans la forêt publique de Fuentes del Villar, dans la Sierra de Santa Cruz ; renseignez-vous sur l'accès auprès de la comarca ou au village avant d'y aller. Le Musée du Reino Fungi se visite sur réservation via le site de la comarca.","de":"Der Bestand liegt im öffentlichen Wald Fuentes del Villar in der Sierra de Santa Cruz; fragen Sie vor dem Besuch bei der Comarca oder im Dorf nach dem Zugang. Das Museum Reino Fungi ist nach Voranmeldung über die Website der Comarca zu besichtigen.","pt":"O pinsapal fica na mata pública de Fuentes del Villar, na Sierra de Santa Cruz; informe-se sobre o acesso na comarca ou na aldeia antes de ir. O Museu do Reino Fungi visita-se com reserva prévia através do site da comarca."},"src":"https://www.aragon.es/-/pinsapar-de-orcajo","sources":["https://www.aragon.es/-/pinsapar-de-orcajo","https://www.aragon.es/documents/20127/674325/DICTAMEN_CPNA_PINSAPAR_ORCAJO_201804.pdf/7ce69b05-673d-6753-bb3f-dfd80d00fca4","https://daroca.toools.es/wp-content/uploads/2026/06/Folleto-LF-Guia-Campo-de-Daroca-V.1.pdf"],"art":{"es":[{"h":"Historia","t":"Los pinsapares son restos de los bosques de coníferas que cubrían Europa hace millones de años. Hoy el pinsapo es una especie propia de la Serranía de Ronda y las sierras de Málaga y Cádiz. El de Orcajo no es natural: se introdujo en la sierra de Santa Cruz a principios del siglo XX, junto con otras especies de repoblación.\n\nAun así, el pinsapo se ha adaptado bien y se regenera por sí solo. En 2018 el Gobierno de Aragón declaró el conjunto arboleda singular, por su interés cultural e histórico más que ecológico."},{"h":"El paisaje","t":"El pinsapar ocupa unas 3,65 hectáreas y comparte el monte con otros árboles: la mitad de la masa es pino silvestre, una cuarta parte pinsapo y otra pino laricio. Los pinsapos se reconocen por sus acículas cortas y rígidas, dispuestas alrededor de la rama como un cepillo, y por su silueta de abeto.\n\nOrcajo es tierra de setas, y el Museo del Reino Fungi, dedicado a los hongos, completa la visita. En otoño, si sales al monte, recuerda que la recogida de setas puede estar regulada."}],"en":[{"h":"History","t":"Spanish fir groves are remnants of the conifer forests that covered Europe millions of years ago. Today the Spanish fir is native to the Serranía de Ronda and the mountains of Málaga and Cádiz. The Orcajo grove is not natural: the tree was introduced to the Sierra de Santa Cruz in the early 20th century, along with other species used for reforestation.\n\nEven so, the Spanish fir has adapted well and regenerates on its own. In 2018 the Government of Aragon declared the stand a notable grove, for its cultural and historical interest rather than its ecological value."},{"h":"The landscape","t":"The grove covers about 3.65 hectares and shares the hillside with other trees: half the stand is Scots pine, a quarter Spanish fir and another quarter black pine. Spanish firs can be recognised by their short, stiff needles, arranged all round the twig like a bottle brush, and by their fir-tree silhouette.\n\nOrcajo is mushroom country, and the Reino Fungi Museum, devoted to fungi, rounds off the visit. In autumn, if you head into the hills, remember that mushroom picking may be regulated."}],"fr":[{"h":"Histoire","t":"Les sapinières de sapin d'Espagne sont des vestiges des forêts de conifères qui couvraient l'Europe il y a des millions d'années. Aujourd'hui, cette espèce est propre à la Serranía de Ronda et aux montagnes de Málaga et de Cadix. Celle d'Orcajo n'est pas naturelle : l'arbre fut introduit dans la Sierra de Santa Cruz au début du XXe siècle, avec d'autres essences de reboisement.\n\nMalgré cela, il s'est bien adapté et se régénère seul. En 2018, le gouvernement d'Aragon a déclaré l'ensemble bosquet remarquable, pour son intérêt culturel et historique plus qu'écologique."},{"h":"Le paysage","t":"La sapinière occupe environ 3,65 hectares et partage la montagne avec d'autres arbres : la moitié du peuplement est du pin sylvestre, un quart du sapin d'Espagne et un autre quart du pin noir. On reconnaît le sapin d'Espagne à ses aiguilles courtes et rigides, disposées tout autour du rameau comme un goupillon, et à sa silhouette de sapin.\n\nOrcajo est une terre de champignons, et le Musée du Reino Fungi, consacré aux champignons, complète la visite. En automne, si vous partez en forêt, rappelez-vous que la cueillette peut être réglementée."}],"de":[{"h":"Geschichte","t":"Igeltannenwälder sind Überreste der Nadelwälder, die vor Millionen Jahren Europa bedeckten. Heute ist die Spanische Tanne in der Serranía de Ronda und den Bergen von Málaga und Cádiz heimisch. Der Bestand von Orcajo ist nicht natürlich: Der Baum wurde Anfang des 20. Jahrhunderts zusammen mit anderen Aufforstungsarten in die Sierra de Santa Cruz eingeführt.\n\nDennoch hat er sich gut angepasst und verjüngt sich von selbst. 2018 erklärte die Regierung von Aragonien den Bestand zum geschützten Baumbestand, eher wegen seines kulturellen und historischen als seines ökologischen Werts."},{"h":"Die Landschaft","t":"Der Bestand umfasst etwa 3,65 Hektar und teilt sich den Hang mit anderen Bäumen: Die Hälfte sind Waldkiefern, ein Viertel Igeltannen und ein weiteres Viertel Schwarzkiefern. Igeltannen erkennt man an ihren kurzen, steifen Nadeln, die rundum am Zweig sitzen wie eine Flaschenbürste, und an ihrer Tannensilhouette.\n\nOrcajo ist Pilzland, und das Museum Reino Fungi über die Welt der Pilze rundet den Besuch ab. Wer im Herbst in den Wald geht, sollte bedenken, dass das Pilzesammeln geregelt sein kann."}],"pt":[{"h":"História","t":"Os pinsapais são restos das florestas de coníferas que cobriam a Europa há milhões de anos. Hoje o pinsapo é uma espécie própria da Serranía de Ronda e das serras de Málaga e Cádis. O de Orcajo não é natural: foi introduzido na Sierra de Santa Cruz no início do século XX, juntamente com outras espécies de repovoamento.\n\nMesmo assim, o pinsapo adaptou-se bem e regenera-se sozinho. Em 2018, o Governo de Aragão declarou o conjunto arvoredo singular, mais pelo seu interesse cultural e histórico do que ecológico."},{"h":"A paisagem","t":"O pinsapal ocupa cerca de 3,65 hectares e partilha o monte com outras árvores: metade do povoamento é pinheiro-silvestre, um quarto pinsapo e outro quarto pinheiro-negro. Os pinsapos reconhecem-se pelas agulhas curtas e rígidas, dispostas à volta do ramo como uma escova, e pela silhueta de abeto.\n\nOrcajo é terra de cogumelos, e o Museu do Reino Fungi, dedicado aos fungos, completa a visita. No outono, se for ao monte, lembre-se de que a apanha de cogumelos pode estar regulamentada."}]},"status":"pending"},{"id":"hoces-rio-piedra","town":"Torralba de los Frailes","cat":"naturaleza","lat":41.06289,"lon":-1.70395,"coord_src":null,"q":["Hoces del río Piedra","Torralba de los Frailes"],"fq":["Hoces del río Piedra","Río Piedra Torralba de los Frailes","Aldehuela de Liestos hoces"],"name":{"es":"Hoces del Río Piedra","en":"Gorges of the River Piedra","fr":"Gorges du Río Piedra","de":"Schluchten des Río Piedra","pt":"Desfiladeiros do Río Piedra"},"when":{"es":"Espacio Red Natura · Cañón fluvial","en":"Natura 2000 site · River canyon","fr":"Site Natura 2000 · Canyon fluvial","de":"Natura-2000-Gebiet · Flusscanyon","pt":"Sítio da Rede Natura · Canhão fluvial"},"desc":{"es":"Entre Aldehuela de Liestos y Torralba de los Frailes, el río Piedra se encaja entre paredes verticales. Abajo, un bosque de ribera; arriba, cortados donde anidan buitres y otras rapaces.","en":"Between Aldehuela de Liestos and Torralba de los Frailes, the River Piedra cuts between vertical walls. Below, riverside woodland; above, cliffs where vultures and other birds of prey nest.","fr":"Entre Aldehuela de Liestos et Torralba de los Frailes, le Río Piedra s'encaisse entre des parois verticales. En bas, une forêt riveraine ; en haut, des falaises où nichent vautours et autres rapaces.","de":"Zwischen Aldehuela de Liestos und Torralba de los Frailes zwängt sich der Río Piedra zwischen senkrechte Wände. Unten Auwald, oben Felswände, in denen Geier und andere Greifvögel brüten.","pt":"Entre Aldehuela de Liestos e Torralba de los Frailes, o rio Piedra encaixa-se entre paredes verticais. Em baixo, um bosque ribeirinho; em cima, escarpas onde nidificam abutres e outras aves de rapina."},"visit":{"es":"Paraje de acceso libre por senderos desde Torralba de los Frailes y Aldehuela de Liestos. Pide en la Oficina de Turismo de Daroca la ruta y su dificultad antes de salir; lleva agua y calzado de montaña, y no te acerques al borde de los cortados.","en":"Freely accessible on paths from Torralba de los Frailes and Aldehuela de Liestos. Ask the Daroca Tourist Office about the route and its difficulty before setting out; carry water, wear walking boots and keep away from the cliff edges.","fr":"Site en accès libre par des sentiers depuis Torralba de los Frailes et Aldehuela de Liestos. Demandez à l'Office de tourisme de Daroca le parcours et sa difficulté avant de partir ; emportez de l'eau, portez des chaussures de randonnée et ne vous approchez pas du bord des falaises.","de":"Frei zugänglich über Wege ab Torralba de los Frailes und Aldehuela de Liestos. Erkundigen Sie sich vorher im Fremdenverkehrsamt Daroca nach Route und Schwierigkeit; nehmen Sie Wasser mit, tragen Sie Wanderschuhe und halten Sie Abstand zu den Felskanten.","pt":"Sítio de acesso livre por trilhos a partir de Torralba de los Frailes e Aldehuela de Liestos. Peça no Posto de Turismo de Daroca informação sobre o percurso e a sua dificuldade antes de sair; leve água, calçado de montanha e não se aproxime da beira das escarpas."},"src":"https://daroca.toools.es/wp-content/uploads/2026/03/Hoces-del-Rio-Piedra.pdf","sources":["https://daroca.toools.es/wp-content/uploads/2026/03/Hoces-del-Rio-Piedra.pdf","https://daroca.toools.es/wp-content/uploads/2026/06/Folleto-LF-Guia-Campo-de-Daroca-V.1.pdf"],"art":{"es":[{"h":"El paisaje","t":"Las hoces son un tramo del río Piedra en el que el agua ha excavado un cañón de cortados verticales, aguas arriba del Monasterio de Piedra. Están protegidas como Lugar de Interés Comunitario dentro de la Red Natura 2000 por sus hábitats mediterráneos, sus bosques de ribera y sus roquedos.\n\nEn el fondo del cañón crecen arces, fresnos, chopos y sauces. En las paredes se agarran la sabina negra, la hiedra y los zapatitos de la Virgen. Junto al agua vive el Apium repens, una pequeña planta considerada amenazada en Aragón."},{"h":"Qué ver","t":"Levanta la vista hacia los cantiles: es fácil ver buitres leonados planeando, y con suerte alimoches, halcones o el rastro del búho real. Muchas de las aves de la zona están protegidas, así que conviene ir en silencio y sin salir del camino.\n\nEl contraste es lo que hace especial el paseo: el páramo seco de arriba, a más de mil metros, y abajo la sombra húmeda del río.\n\nLa comarca incluye las hoces entre sus espacios naturales, junto al pinsapar de Orcajo y los sotos de los ríos Jiloca y Huerva."}],"en":[{"h":"The landscape","t":"The gorges are a stretch of the River Piedra where the water has carved a canyon of sheer cliffs, upstream of the Monasterio de Piedra. They are protected as a Site of Community Importance within the Natura 2000 network for their Mediterranean habitats, riverside woods and rocky outcrops.\n\nOn the canyon floor grow maples, ash, poplars and willows. On the walls cling Phoenician juniper, ivy and other rock plants. By the water lives Apium repens, a small plant considered threatened in Aragon."},{"h":"What to see","t":"Look up at the cliffs: griffon vultures are easy to spot as they glide, and with luck you may see Egyptian vultures, falcons or signs of the eagle owl. Many of the birds here are protected, so go quietly and stay on the path.\n\nThe contrast is what makes the walk special: the dry upland above, at over a thousand metres, and the damp shade of the river below.\n\nThe comarca includes the gorges among its natural areas, together with the Orcajo fir grove and the riverside woods of the Jiloca and Huerva."}],"fr":[{"h":"Le paysage","t":"Les gorges sont un tronçon du Río Piedra où l'eau a creusé un canyon aux parois verticales, en amont du Monasterio de Piedra. Elles sont protégées comme Site d'importance communautaire au sein du réseau Natura 2000 pour leurs habitats méditerranéens, leurs forêts riveraines et leurs rochers.\n\nAu fond du canyon poussent érables, frênes, peupliers et saules. Sur les parois s'accrochent le genévrier de Phénicie, le lierre et d'autres plantes rupestres. Au bord de l'eau vit l'ache rampante (Apium repens), une petite plante considérée comme menacée en Aragon."},{"h":"À voir","t":"Levez les yeux vers les falaises : il est facile de voir planer des vautours fauves et, avec de la chance, des percnoptères, des faucons ou des traces du grand-duc. Beaucoup d'oiseaux de la zone sont protégés ; marchez en silence et restez sur le sentier.\n\nC'est le contraste qui rend la promenade particulière : le plateau sec en haut, à plus de mille mètres, et en bas l'ombre humide de la rivière.\n\nLa comarca compte les gorges parmi ses espaces naturels, avec la sapinière d'Orcajo et les bois riverains du Jiloca et de la Huerva."}],"de":[{"h":"Die Landschaft","t":"Die Schluchten sind ein Abschnitt des Río Piedra, in dem das Wasser einen Canyon mit senkrechten Wänden gegraben hat, flussaufwärts vom Monasterio de Piedra. Sie sind als Gebiet von gemeinschaftlicher Bedeutung im Netz Natura 2000 geschützt, wegen ihrer mediterranen Lebensräume, Auwälder und Felsen.\n\nAuf dem Grund des Canyons wachsen Ahorn, Esche, Pappel und Weide. An den Wänden halten sich Phönizischer Wacholder, Efeu und andere Felspflanzen. Am Wasser lebt der Kriechende Sellerie (Apium repens), eine kleine Pflanze, die in Aragonien als bedroht gilt."},{"h":"Sehenswert","t":"Schauen Sie hinauf zu den Felswänden: Gänsegeier sieht man leicht kreisen, mit Glück auch Schmutzgeier, Falken oder Spuren des Uhus. Viele Vogelarten hier sind geschützt, also gehen Sie leise und bleiben Sie auf dem Weg.\n\nDer Kontrast macht den Spaziergang besonders: oben die trockene Hochfläche auf über tausend Metern, unten der feuchte Schatten des Flusses.\n\nDie Comarca zählt die Schluchten zu ihren Naturräumen, zusammen mit dem Igeltannenwald von Orcajo und den Auwäldern an Jiloca und Huerva."}],"pt":[{"h":"A paisagem","t":"Os desfiladeiros são um troço do rio Piedra em que a água escavou um canhão de escarpas verticais, a montante do Monasterio de Piedra. Estão protegidos como Sítio de Importância Comunitária da Rede Natura 2000 pelos seus habitats mediterrânicos, bosques ribeirinhos e rochedos.\n\nNo fundo do canhão crescem bordos, freixos, choupos e salgueiros. Nas paredes agarram-se a sabina-da-praia, a hera e outras plantas rupícolas. Junto à água vive o Apium repens, uma pequena planta considerada ameaçada em Aragão."},{"h":"O que ver","t":"Levante os olhos para as escarpas: é fácil ver grifos a planar e, com sorte, britangos, falcões ou sinais do bufo-real. Muitas das aves da zona estão protegidas, por isso convém ir em silêncio e sem sair do caminho.\n\nO contraste é o que torna o passeio especial: o planalto seco lá em cima, a mais de mil metros, e em baixo a sombra húmida do rio.\n\nA comarca inclui os desfiladeiros entre os seus espaços naturais, juntamente com o pinsapal de Orcajo e os bosques ribeirinhos do Jiloca e do Huerva."}]},"status":"pending"},{"id":"laguna-guialguerrero","town":"Cubel","cat":"naturaleza","lat":41.0811,"lon":-1.6104,"coord_src":"https://m.chebro.es/documents/20121/47454/MAS7673._Ficha_Laguna_de_Guialguerrero_2019.pdf/d2c35b51-ba5a-fb9f-b36e-267f3ec3744f","q":["Laguna de Guialguerrero","Guialguerrero, Cubel"],"fq":["Laguna de Guialguerrero","Guialguerrero Cubel","Cubel Zaragoza laguna"],"name":{"es":"Laguna de Guialguerrero","en":"Guialguerrero Lagoon","fr":"Lagune de Guialguerrero","de":"Lagune von Guialguerrero","pt":"Lagoa de Guialguerrero"},"when":{"es":"Humedal de montaña · 1.080 m de altitud","en":"Upland wetland · 1,080 m above sea level","fr":"Zone humide d'altitude · 1 080 m","de":"Feuchtgebiet im Hochland · 1.080 m Höhe","pt":"Zona húmida de montanha · 1080 m de altitude"},"desc":{"es":"Una laguna pequeña y tranquila en el término de Cubel, a unos dos kilómetros del pueblo. Forma parte de la tierra de lagunas de la comarca, y en ella aparecen a veces aves acuáticas raras.","en":"A small, quiet lagoon in the municipality of Cubel, about two kilometres from the village. It is part of the district's land of lagoons, and rare waterbirds sometimes turn up here.","fr":"Une petite lagune tranquille sur la commune de Cubel, à environ deux kilomètres du village. Elle fait partie de la terre de lagunes de la région, et des oiseaux d'eau rares y apparaissent parfois.","de":"Eine kleine, ruhige Lagune im Gemeindegebiet von Cubel, etwa zwei Kilometer vom Dorf entfernt. Sie gehört zum Lagunenland der Region, und manchmal tauchen hier seltene Wasservögel auf.","pt":"Uma lagoa pequena e tranquila no concelho de Cubel, a cerca de dois quilómetros da aldeia. Faz parte da terra de lagoas da comarca e nela aparecem por vezes aves aquáticas raras."},"visit":{"es":"Desde Cubel, toma la carretera de Torralba de los Frailes; tras unos 2 km, un desvío a la derecha de algo más de 1 km lleva a la orilla sur. Acceso libre. Lleva prismáticos y no te acerques a la orilla si hay aves posadas.","en":"From Cubel, take the road to Torralba de los Frailes; after about 2 km, a turning on the right of just over 1 km leads to the south shore. Free access. Bring binoculars and keep away from the shore if birds are settled.","fr":"Depuis Cubel, prenez la route de Torralba de los Frailes ; après environ 2 km, un embranchement à droite d'un peu plus d'1 km mène à la rive sud. Accès libre. Apportez des jumelles et ne vous approchez pas de la rive si des oiseaux sont posés.","de":"Von Cubel aus die Straße nach Torralba de los Frailes nehmen; nach etwa 2 km führt ein Abzweig nach rechts von gut 1 km zum Südufer. Freier Zugang. Fernglas mitnehmen und nicht ans Ufer gehen, wenn dort Vögel sitzen.","pt":"A partir de Cubel, siga a estrada de Torralba de los Frailes; após cerca de 2 km, um desvio à direita com pouco mais de 1 km leva à margem sul. Acesso livre. Leve binóculos e não se aproxime da margem se houver aves pousadas."},"src":"https://daroca.toools.es/wp-content/uploads/2026/03/Rutas-ornitologicas.pdf","sources":["https://daroca.toools.es/wp-content/uploads/2026/03/Rutas-ornitologicas.pdf","https://m.chebro.es/documents/20121/47454/MAS7673._Ficha_Laguna_de_Guialguerrero_2019.pdf/d2c35b51-ba5a-fb9f-b36e-267f3ec3744f","https://es.hispanopedia.com/wiki/Cubel","https://daroca.toools.es/wp-content/uploads/2026/06/Folleto-LF-Guia-Campo-de-Daroca-V.1.pdf"],"art":{"es":[{"h":"El paisaje","t":"Guialguerrero está a unos 1.080 metros de altitud, en el término municipal de Cubel. Es una laguna de cuenca interior, permanente y de aguas poco mineralizadas, con una superficie máxima de unas 7 hectáreas; en el muestreo de la Confederación Hidrográfica del Ebro de julio de 2019 tenía 2,6 metros de profundidad máxima.\n\nEsa misma ficha señala un exceso de algas y cianobacterias y califica su estado ecológico como malo: es un humedal frágil, sensible a lo que ocurre en los campos que lo rodean."},{"h":"Qué ver","t":"Las guías ornitológicas de la comarca hablan de una presencia irregular de aves acuáticas: hay días en que no se ve ninguna y otros en que aparecen especies muy raras en el interior, como la serreta chica o la malvasía cabeciblanca. Por eso merece la pena acercarse si vienes de Gallocanta. La comarca la incluye en su Tierra de Lagunas, junto a Gallocanta, la laguna de la Zaida y las balsas de Santed.\n\nEl nombre de la laguna se repite en la fiesta de la Virgen de Guía al Guerrero, que Cubel celebra el tercer domingo de agosto."}],"en":[{"h":"The landscape","t":"Guialguerrero lies at about 1,080 metres above sea level, in the municipality of Cubel. It is an inland-basin lagoon, permanent and with low-mineral water, with a maximum area of about 7 hectares; in the Ebro Basin Authority's survey of July 2019 its maximum depth was 2.6 metres.\n\nThe same report notes an excess of algae and cyanobacteria and rates its ecological status as poor: it is a fragile wetland, sensitive to what happens in the surrounding fields."},{"h":"What to see","t":"The district's birdwatching guides describe the presence of waterbirds as irregular: on some days there are none, on others species that are very rare inland appear, such as smew or white-headed duck. That makes it worth a detour if you are coming from Gallocanta. The comarca includes it in its Land of Lagoons, together with Gallocanta, the Zaida lagoon and the Santed pools.\n\nThe lagoon's name is echoed in the festival of the Virgen de Guía al Guerrero, which Cubel celebrates on the third Sunday in August."}],"fr":[{"h":"Le paysage","t":"Guialguerrero se trouve à environ 1 080 mètres d'altitude, sur la commune de Cubel. C'est une lagune de bassin intérieur, permanente et aux eaux peu minéralisées, d'une superficie maximale d'environ 7 hectares ; lors du relevé de la Confédération hydrographique de l'Èbre de juillet 2019, sa profondeur maximale était de 2,6 mètres.\n\nCe même rapport signale un excès d'algues et de cyanobactéries et juge son état écologique mauvais : c'est une zone humide fragile, sensible à ce qui se passe dans les champs alentour."},{"h":"À voir","t":"Les guides ornithologiques de la comarca parlent d'une présence irrégulière d'oiseaux d'eau : certains jours on n'en voit aucun, d'autres apparaissent des espèces très rares à l'intérieur des terres, comme le harle piette ou l'érismature à tête blanche. Le détour en vaut donc la peine si vous venez de Gallocanta. La comarca l'inclut dans sa Terre de lagunes, avec Gallocanta, la lagune de la Zaida et les bassins de Santed.\n\nLe nom de la lagune se retrouve dans la fête de la Virgen de Guía al Guerrero, que Cubel célèbre le troisième dimanche d'août."}],"de":[{"h":"Die Landschaft","t":"Guialguerrero liegt auf etwa 1.080 Metern Höhe im Gemeindegebiet von Cubel. Es ist eine ständig wasserführende Lagune in einem Binnenbecken mit gering mineralisiertem Wasser und einer Fläche von höchstens etwa 7 Hektar; bei der Messung der Ebro-Wasserbehörde im Juli 2019 betrug ihre größte Tiefe 2,6 Meter.\n\nDerselbe Bericht stellt einen Überschuss an Algen und Cyanobakterien fest und bewertet den ökologischen Zustand als schlecht: ein empfindliches Feuchtgebiet, das stark von den umliegenden Feldern beeinflusst wird."},{"h":"Sehenswert","t":"Die ornithologischen Führer der Comarca sprechen von einem unregelmäßigen Vorkommen von Wasservögeln: An manchen Tagen ist keiner zu sehen, an anderen erscheinen im Binnenland sehr seltene Arten wie Zwergsäger oder Weißkopf-Ruderente. Deshalb lohnt sich ein Abstecher, wenn Sie aus Gallocanta kommen. Die Comarca zählt sie zu ihrem Lagunenland, zusammen mit Gallocanta, der Lagune La Zaida und den Teichen von Santed.\n\nDer Name der Lagune klingt im Fest der Virgen de Guía al Guerrero nach, das Cubel am dritten Sonntag im August feiert."}],"pt":[{"h":"A paisagem","t":"Guialguerrero fica a cerca de 1080 metros de altitude, no concelho de Cubel. É uma lagoa de bacia interior, permanente e de águas pouco mineralizadas, com uma superfície máxima de cerca de 7 hectares; na amostragem da Confederação Hidrográfica do Ebro de julho de 2019 tinha 2,6 metros de profundidade máxima.\n\nA mesma ficha assinala um excesso de algas e cianobactérias e classifica o seu estado ecológico como mau: é uma zona húmida frágil, sensível ao que acontece nos campos à volta."},{"h":"O que ver","t":"Os guias ornitológicos da comarca falam de uma presença irregular de aves aquáticas: há dias em que não se vê nenhuma e outros em que aparecem espécies muito raras no interior, como o merganso-pequeno ou o pato-de-rabo-alçado. Por isso vale a pena o desvio se vier de Gallocanta. A comarca inclui-a na sua Terra de Lagoas, juntamente com Gallocanta, a lagoa da Zaida e os charcos de Santed.\n\nO nome da lagoa repete-se na festa da Virgen de Guía al Guerrero, que Cubel celebra no terceiro domingo de agosto."}]},"status":"pending"}],"towns":[{"name":"Acered","lat":41.017,"lon":-1.6,"minor":true},{"name":"Aldehuela de Liestos","lat":41.0645,"lon":-1.7011,"minor":true},{"name":"Anento","lat":41.07,"lon":-1.333},{"name":"Atea","lat":41.1601,"lon":-1.5546,"minor":true},{"name":"Badules","lat":41.15,"lon":-1.25,"minor":true},{"name":"Balconchán","lat":41.083,"lon":-1.45,"minor":true},{"name":"Berrueco","lat":40.9906,"lon":-1.4669,"minor":true},{"name":"Cerveruela","lat":41.2157,"lon":-1.2152,"minor":true},{"name":"Cubel","lat":41.0975,"lon":-1.6348},{"name":"Las Cuerlas","lat":40.967,"lon":-1.55,"minor":true},{"name":"Daroca","lat":41.1132,"lon":-1.417},{"name":"Fombuena","lat":41.15,"lon":-1.183,"minor":true},{"name":"Gallocanta","lat":40.995,"lon":-1.5069},{"name":"Herrera de los Navarros","lat":41.2094,"lon":-1.0808,"minor":true},{"name":"Langa del Castillo","lat":41.217,"lon":-1.4,"minor":true},{"name":"Lechón","lat":41.0865,"lon":-1.2842,"minor":true},{"name":"Luesma","lat":41.167,"lon":-1.15,"minor":true},{"name":"Mainar","lat":41.1922,"lon":-1.3042,"minor":true},{"name":"Manchones","lat":41.15,"lon":-1.467,"minor":true},{"name":"Murero","lat":41.167,"lon":-1.483},{"name":"Nombrevilla","lat":41.107,"lon":-1.3588,"minor":true},{"name":"Orcajo","lat":41.117,"lon":-1.483},{"name":"Retascón","lat":41.15,"l /* ---------- distance ---------- */
function hav(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lon-a.lon);const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}

const TILES={
  mapa:{url:"https://www.ign.es/wmts/ign-base?layer=IGNBaseTodo&style=default&tilematrixset=GoogleMapsCompatible&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/png&TileMatrix={z}&TileCol={x}&TileRow={y}",opt:{maxZoom:18,attribution:'Mapa base © <a href="https://www.ign.es">IGN</a>'}},
  ortofoto:{url:"https://www.ign.es/wmts/pnoa-ma?layer=OI.OrthoimageCoverage&style=default&tilematrixset=GoogleMapsCompatible&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/jpeg&TileMatrix={z}&TileCol={x}&TileRow={y}",opt:{maxZoom:19,attribution:'PNOA © <a href="https://www.ign.es">IGN</a>'}}

let tileLayer=null;
function setBasemap(k,silent){
  state.basemap=k; $$(".layerbox button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.k===k)));
  if(tileLayer){map.removeLayer(tileLayer);tileLayer=null;}
  $("#map").classList.remove("tiles-on");
  if(k==="ilustrado"){map.setMaxZoom(15);return;}
  map.setMaxZoom(18);
  const def=TILES[k]; let ok=0,bad=0,decided=false;
  tileLayer=L.tileLayer(def.url,def.opt);
  tileLayer.on("tileload",()=>{ok++; if(!decided){decided=true;$("#map").classList.add("tiles-on");}});
  tileLayer.on("tileerror",()=>{bad++; if(!decided&&bad>=3&&HASBASE){decided=true;map.removeLayer(tileLayer);tileLayer=null;state.basemap="ilustrado";map.setMaxZoom(15);$("#map").classList.remove("tiles-on");$$(".layerbox button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.k==="ilustrado")));if(!silent) toast(t("tilesBlocked"));}});
  tileLayer.addTo(map); tileLayer.bringToBack();
}

const markers={};
function pinIcon(p){return L.divIcon({className:"",html:`<div class="pin" style="--c:var(${CATS[p.cat].color})">${ICON(p.cat)}</div>`,iconSize:[30,30],iconAnchor:[4,30],popupAnchor:[11,-30]});}
function addMarker(p){
  const m=L.marker([p.lat,p.lon],{keyboard:true,title:L10(p.name),riseOnHover:true,icon:pinIcon(p)});

function pinEl(id){const m=markers[id];return m&&m.getElement()?m.getElement().querySelector(".pin"):null;}
function visible(p){
  if(!state.cats.has(p.cat)) return false;
  if(state.town&&p.town!==state.town) return false;
  if(state.q){const q=norm(state.q);const hay=norm(L10(p.name)+" "+p.town+" "+L10(p.desc)+" "+t("cat_"+p.cat));if(!hay.includes(q)) return false;}
  return true;
}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}
function refreshMarkers(){
  const inRoute=state.route?new Set(DATA.routes.find(r=>r.id===state.route).stops):null;
  POIS.forEach(p=>{const m=markers[p.id];const show=inRoute?inRoute.has(p.id):visible(p);
    if(show&&!map.hasLayer(m)) m.addTo(map); if(!show&&map.hasLayer(m)) map.removeLayer(m);
    const el=pinEl(p.id); if(el) el.classList.toggle("sel",state.sel===p.id);});

/* ---------- route drawing ---------- */
let routeGroup=L.layerGroup().addTo(map);
function drawRoute(r){
  routeGroup.clearLayers(); if(!r) return;
  const pts=r.stops.map(id=>BYID[id]).map(p=>[p.lat,p.lon]);
  const color=`var(${CATS[r.cat].color})`;
  const line=L.polyline(pts,{pane:"routes",className:"route-line",interactive:false});
  routeGroup.addLayer(line);
  setTimeout(()=>{const el=line.getElement();if(el) el.style.setProperty("--c",color);},0);
  r.stops.forEach((id,i)=>{const p=BYID[id];routeGroup.addLayer(L.marker([p.lat,p.lon],{pane:"stops",interactive:false,keyboard:false,icon:L.divIcon({className:"",html:`<div class="stopnum">${i+1}</div>`,iconSize:[0,0]})}));});
  map.flyToBounds(L.latLngBounds(pts),{padding:[50,50],duration:.8,maxZoom:15});
}
function routeStats(r){let km=0;const legs=[];for(let i=1;i<r.stops.length;i++){const d=hav(BYID[r.stops[i-1]],BYID[r.stops[i]])*1.25;legs.push(d);km+=d;}
  const speed={walk:4,bike:14,car:55}[r.mode];const mins=Math.round(km/speed*60+r.stops.length*(r.mode==="car"?35:20));return {km,legs,mins};}
function gmapsRoute(r){const pts=r.stops.map(id=>BYID[id]).map(p=>p.lat+","+p.lon);const mode={walk:"walking",bike:"bicycling",car:"driving"}[r.mode];
  return "https://www.google.com/maps/dir/?api=1&origin="+pts[0]+"&destination="+pts.at(-1)+(pts.length>2?"&waypoints="+encodeURIComponent(pts.slice(1,-1).join("|")):"")+"&travelmode="+mode;}
function fmtDur(m){const h=Math.floor(m/60),mm=m%60;return h?`${h} h${mm?" "+mm+" min":""}`:`${mm} min`;}

function nearList(list){return list.map(p=>({p,d:hav(state.me,p)})).sort((a,b)=>a.d-b.d).map(({p,d})=>rowHTML(p,`${p.town} · ${nf().format(d)} km`)).join("");}
let meMarker=null;
function nearMe(){
  if(state.me){state.me=null;if(meMarker){map.removeLayer(meMarker);meMarker=null;}renderExplore();return;}
  if(!navigator.geolocation){toast(t("locErr"));return;}
  toast(t("locating"));
  try{navigator.geolocation.getCurrentPosition(pos=>{
    state.me={lat:pos.coords.latitude,lon:pos.coords.longitude};
    if(meMarker) map.removeLayer(meMarker);
    const tt=$(".toast");if(tt) tt.hidden=true;
    meMarker=L.marker([state.me.lat,state.me.lon],{interactive:false,keyboard:false,zIndexOffset:1000,title:t("youAreHere"),icon:L.divIcon({className:"",html:'<div class="me-dot"></div>',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(map);

    if(far>40) toast(t("farAway",{n:Math.round(far)})); else map.flyTo([state.me.lat,state.me.lon],13,{duration:.7});
    renderExplore();
  },()=>toast(t("locErr")),{timeout:9000,maximumAge:60000});}catch(e){toast(t("locErr"));}
}

function bestVoice(code){const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];const base=code.slice(0,2);
  const c=vs.filter(v=>(v.lang||"").replace("_","-").toLowerCase().startsWith(base));if(!c.length) return null;
  const score=v=>{const n=v.name||"";let s=0;if(/natural|neural/i.test(n)) s+=50;if(/online/i.test(n)) s+=20;if(/premium|enhanced|mejorada|siri/i.test(n)) s+=30;if(/google/i.test(n)) s+=15;
    if((v.lang||"").replace("_","-").toLowerCase()===code.toLowerCase()) s+=10;if(/compact|espeak/i.test(n)) s-=30;return s;};
  return c.sort((a,b)=>score(b)-score(a))[0];}
function speakTTS(p){
  if(!("speechSynthesis" in window)){toast(t("noAudio"));setPP(false);return;}
  const go=()=>{const code=LANGS.find(l=>l[0]===lang)[2];const v=bestVoice(code);
    if(!v){toast(t("noVoice"));setPP(false);return;}
    const txt=[L10(p.name),L10(p.desc),L10(p.more)].filter(Boolean).join(". ");
    const parts=txt.match(/[^.!?;]+[.!?;]*/g)||[txt];speechSynthesis.cancel();ttsOn=true;setPP(true);
    parts.forEach((s,i)=>{const u=new SpeechSynthesisUtterance(s.trim());u.voice=v;u.lang=v.lang;u.rate=.95*audRate;
      if(i===parts.length-1) u.onend=()=>{ttsOn=false;setPP(false);};u.onerror=()=>{ttsOn=false;setPP(false);};speechSynthesis.speak(u);});};
  if(speechSynthesis.getVoices().length) go(); else {let done=false;const f=()=>{if(done) return;done=true;go();};speechSynthesis.addEventListener("voiceschanged",f,{once:true});setTimeout(f,900);}
}

function fmtDateEs(s){try{return new Date(s+"T12:00:00").toLocaleDateString("es-ES",{day:"numeric",month:"long",year:"numeric"});}catch(e){return s;}}
