/* Layout: one-screen app. Map is the stage; a reading panel sits beside it (stacked under it on phones).
   Palette drawn from the Ribera: limestone ground, Ebro teal, mudéjar brick, steppe ochre. */
:root{
  --bg:#ECEFEA; --panel:#FAFBF8; --panel-2:#F2F4EF; --ink:#18221E; --muted:#56635D; --faint:#646F6A;
  --line:#D5DBD3; --accent:#17646C; --accent-ink:#FFFFFF; --accent-soft:#D6E8E8;
  --land:#E2E6DB; --land-hi:#D5DCCB; --land-out:#EEF0EA; --edge:#9AA79C; --outline:#17646C;
  --water:#3C8D96; --water-soft:#BFDCDD; --label:#2E3A35;
  --c-pat:#A4502C; --c-gue:#5A6A33; --c-mus:#7A4A7F; --c-hid:#2A6CA1; --c-nat:#3C8550; --c-arq:#97702F; --c-cam:#B98A0E;
  --ok:#2E7D4F; --shadow:0 1px 2px rgba(20,34,30,.08),0 6px 18px rgba(20,34,30,.08);
  --f-display:"Spectral",Georgia,"Times New Roman",serif;
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --panel:#141C19; --panel-2:#19231F; --ink:#E5ECE8; --muted:#9FADA7; --faint:#7E8C86;
  --line:#26332E; --accent:#5DB6BE; --accent-ink:#0B1513; --accent-soft:#183437;
  --land:#1A2420; --land-hi:#21302A; --land-out:#111815; --edge:#3A4A43; --outline:#5DB6BE;
  --water:#3E8F98; --water-soft:#1B3A3D; --label:#C9D4CF;
  --c-pat:#E08A63; --c-gue:#A9B872; --c-mus:#C08BC5; --c-hid:#6FA9DA; --c-nat:#7CC48D; --c-arq:#D6AE68; --c-cam:#E5BD45;
  --ok:#69C08E; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --panel:#141C19; --panel-2:#19231F; --ink:#E5ECE8; --muted:#9FADA7; --faint:#7E8C86;

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

#app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:1001}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.brand svg{flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:1.28rem;line-height:1.1;letter-spacing:.01em}
.brand-sub{font-size:.74rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel-2)}
.langs button{border:0;background:transparent;padding:5px 10px;font-size:.78rem;font-weight:600;letter-spacing:.05em;cursor:pointer;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.demo-tag{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);border-radius:4px;padding:2px 6px}

main{display:grid;grid-template-columns:minmax(330px,410px) 1fr;min-height:0}
#panel{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
#mapwrap{position:relative;min-height:0;min-width:0}
#map{position:absolute;inset:0;background:var(--bg)}
@media (max-width:760px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(260px,46%) 1fr}
  #mapwrap{order:-1}
  #panel{border-right:0;border-top:1px solid var(--line)}

.note{font-size:.78rem;color:var(--faint);line-height:1.45}

/* Map */
.leaflet-container{font-family:var(--f-ui);background:var(--bg)}
.muni{fill:var(--land);stroke:var(--edge);stroke-width:.8}
.muni.out{fill:var(--land-out);stroke:var(--edge);stroke-opacity:.45;stroke-width:.6}
.muni.hl{fill:var(--land-hi)}
.comarca-outline{fill:none;stroke:var(--outline);stroke-width:2.2;stroke-dasharray:1 0}
.river-halo{stroke:var(--water-soft);stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.river{stroke:var(--water);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tiles-on .muni{fill-opacity:.0;stroke-opacity:.6}
.tiles-on .muni.out{fill-opacity:0}
.tiles-on .river,.tiles-on .river-halo{stroke-opacity:0}
.tiles-on .town-label,.tiles-on .river-label{display:none}
.tiles-on .comarca-outline{stroke-width:2.6;stroke-opacity:.85}
.route-line{stroke:var(--c);stroke-width:3.5;stroke-dasharray:2 7;stroke-linecap:round;fill:none}
.town-label{font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--label);white-space:nowrap;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 6px var(--bg);pointer-events:none;letter-spacing:.02em;transform:translate(-50%,7px);display:inline-block}
.town-label.out{font-weight:500;font-size:11px;color:var(--faint);font-style:italic}
.river-label{font-family:var(--f-display);font-style:italic;font-size:14px;color:var(--water);letter-spacing:.35em;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg);white-space:nowrap;pointer-events:none;transform:translate(-50%,-50%) rotate(-12deg);display:inline-block}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 6px;transform:rotate(-45deg);background:var(--c);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.35);border:2px solid var(--panel);transition:transform .15s}
.pin svg{width:15px;height:15px;transform:rotate(45deg);color:#fff}
.pin.sel{transform:rotate(-45deg) scale(1.28);border-color:var(--ink)}
.pin.dim{opacity:.28}
.zlow .pin{width:13px;height:13px;border-radius:50%;transform:translate(-2.5px,23.5px);border-width:1.5px}
.zlow .pin svg{display:none}
.zlow .pin.sel{transform:translate(-2.5px,23.5px) scale(1.6)}
.zfar .town-label.minor{display:none}
.stopnum{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--panel);font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--panel);transform:translate(14px,-40px);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.zlow .stopnum{transform:translate(4px,-14px)}
.leaflet-control-zoom a,.mapbtn{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:var(--shadow)!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 85%,transparent)!important;color:var(--muted)!important;font-size:10px!important}
.leaflet-control-attribution a{color:var(--accent)!important}
.leaflet-top.leaflet-left{left:env(safe-area-inset-left,0px)}
.layerbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;display:flex;flex-direction:column;gap:2px}
.layerbox button{border:0;background:none;text-align:left;padding:6px 10px;border-radius:6px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--muted)}
.layerbox button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.legend{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px 10px;font-size:.74rem;display:flex;flex-direction:column;gap:3px;max-width:180px}
.legend div{display:flex;align-items:center;gap:7px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
@media (max-width:760px){.legend{display:none}.layerbox{flex-direction:row;padding:3px;margin-left:max(10px,env(safe-area-inset-left,0px))!important}.layerbox button{padding:5px 8px;font-size:.72rem}.leaflet-bottom.leaflet-left{bottom:16px}}

/* Móvil: la página entera hace scroll; el mapa queda arriba y se va al bajar, así se lee a pantalla completa */
@media (max-width:760px){
  html,body{height:auto}
  #app{height:auto;display:block}
  main{display:flex;flex-direction:column}
  #mapwrap{order:-1;height:40vh;height:40svh;min-height:230px;flex:none}
  #panel{min-height:calc(100vh - 56px);min-height:calc(100svh - 56px)}
  nav.tabs{position:sticky;top:0;z-index:1002;background:var(--panel)}
  .view{overflow:visible;flex:none;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  #tomap{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:1500;display:flex;align-items:center;gap:7px;
    border:0;border-radius:999px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.86rem;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;
    transition:opacity .2s,transform .2s}
  #tomap svg{width:17px;height:17px}
  #tomap[data-off]{opacity:0;transform:translateY(12px);pointer-events:none}
}
@media (min-width:761px){#tomap{display:none}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:8px;font-size:.86rem;z-index:5000;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- avisos, pasaporte, agenda, gestión ---- */
.btn.primary span,.btn.primary{color:var(--accent-ink)}
.aviso{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--panel-2);border-radius:10px;padding:10px 12px;font-size:.88rem}
.aviso b{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.aviso.warn{border-left-color:#B4441F}.aviso.warn b{color:#B4441F}
.aviso.prize{border-left-color:#B8860B}.aviso.prize b{color:#8A6508}
.stampbox,.passcta{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel-2)}
.passcta{width:100%;cursor:pointer;font:inherit;color:var(--ink);text-align:left}
.passcta:hover{border-color:var(--accent)}
.passcta .go{margin-left:auto;font-size:1.4rem;color:var(--muted)}
.seal{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--c,var(--accent));color:var(--c,var(--accent))}
.seal svg{width:22px;height:22px}
.stampbox.done .seal{border-style:solid;background:var(--c);color:#fff}
.passcta.ag .seal{border-style:solid;border-radius:12px}
.passhead{display:flex;align-items:center;gap:16px}
.ring{--p:0;flex:none;width:92px;height:92px;border-radius:50%;display:grid;place-content:center;text-align:center;
  background:radial-gradient(closest-side,var(--panel) 78%,transparent 79%),conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
.ring b{font-size:1.6rem;line-height:1}.ring span{font-size:.75rem;color:var(--muted)}
.prow{display:grid;grid-template-columns:1fr;gap:4px;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);cursor:pointer;font:inherit;color:var(--ink)}
.prow .t{font-weight:600;font-size:.92rem}
.pbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.pbar i{display:block;height:100%;background:var(--c)}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin:6px 0 10px}
.stamp{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;cursor:pointer;font:inherit;color:var(--muted);padding:4px}
.stamp .seal{width:58px;height:58px;border-color:var(--line)}
.stamp.on .seal{border:2px solid var(--c);background:var(--c);color:#fff}
.stamp.on{color:var(--ink)}
.stamp .nm{font-size:.74rem;line-height:1.25;text-align:center;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ev{display:flex;gap:12px;border-bottom:1px solid var(--line);padding:10px 0}
.ev p{margin:2px 0 0;font-size:.88rem}
.cal{flex:none;width:52px;border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:center;background:var(--panel)}
.cal span{display:block;background:var(--accent);color:var(--accent-ink);font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 0}
.cal b{display:block;font-size:1.2rem;padding:4px 0}
.cal{align-self:flex-start}.cal.m{border:2px solid var(--accent)}.cal.m b{font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);padding:9px 0}
.bars.wide .bar{grid-template-columns:minmax(0,1.4fr) 1fr auto}.bars.wide .bar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.neg{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:8px 0}
.adm-nav{display:flex;flex-wrap:wrap;gap:6px}
.adm-nav a{font-size:.8rem;border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--ink);text-decoration:none;background:var(--panel-2)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.two-col{grid-template-columns:1fr}}
.foot-links{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;padding-bottom:8px}
.foot-links a{color:var(--muted)}
details summary{cursor:pointer;padding:4px 0}
.skip{position:absolute;left:-9999px;top:8px;z-index:9999;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;font-weight:700}
.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

</style>

<div id="cover" hidden></div>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<div id="app"><a class="skip" href="#panel" data-i="skipLink"></a>
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="var(--accent)"/><path d="M4 22c5-1 6-7 11-7s5 9 10 9 4-6 5-7" stroke="var(--accent-ink)" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="23" cy="10" r="2.6" fill="var(--accent-ink)"/></svg>
      <div style="min-width:0">
        <div class="brand-name">Campo de Daroca Explora</div>
        <div class="brand-sub" data-i="appSub"></div>
      </div>
    </div>
    <span class="demo-tag" data-i="demo"></span>
    <div class="langs" role="group" aria-label="Idioma / Language" id="langs"></div>
  </header>
  <main>
    <aside id="panel">
      <nav class="tabs" role="tablist" id="tabs">
        <button role="tab" data-tab="inicio" data-i="tabHome"></button>
        <button role="tab" data-tab="explorar" data-i="tabExplore"></button>
        <button role="tab" data-tab="rutas" data-i="tabRoutes"></button>
        <button role="tab" data-tab="agenda" data-i="tabAgenda"></button>
        <button role="tab" data-tab="pasaporte" data-i="tabPass"></button>
      </nav>
      <section class="view stack" id="v-inicio"></section>
      <section class="view stack" id="v-explorar" hidden></section>
      <section class="view stack" id="v-lugar" hidden></section>
      <section class="view stack" id="v-rutas" hidden></section>
      <section class="view stack" id="v-agenda" hidden></section>
      <section class="view stack" id="v-pasaporte" hidden></section>
      <section class="view stack" id="v-gestion" hidden></section>
    </aside>
    <div id="mapwrap"><div id="map" role="application" aria-label="Mapa"></div></div>
    <button type="button" id="tomap" data-off><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 4-6 3v13l6-3 6 3 6-3V4l-6 3-6-3z"/><path d="M9 4v13M15 7v13"/></svg><span data-i="tabMap"></span></button>
  </main>
</div>

as-castillo-g1","murallas-castillo-g2","murallas-castillo-g3"],"laguna-gallocanta":["laguna-gallocanta-g1","laguna-gallocanta-g2","laguna-gallocanta-g3"],"murero-fosiles":["murero-fosiles-g1","murero-fosiles-g2"],"hoces-rio-piedra":["hoces-rio-piedra-g1"],"aguallueve":["aguallueve-g1"]},"must":["puerta-baja","basilica-corporales","laguna-gallocanta","retablo-anento","aguallueve","mina-daroca","murero-fosiles","hoces-rio-piedra"],"coverPhoto":"puerta-baja","homeHero":"basilica-corporales","categories":{"patrimonio":{"color":"--c-pat","icon":"<path d=\"M4 21V10l8-6 8 6v11\"/><path d=\"M9.5 21v-5.5a2.5 2.5 0 0 1 5 0V21\"/>"},"memoria":{"color":"--c-gue","icon":"<path d=\"M6 21V4\"/><path d=\"M6 4h11l-2.5 4L17 12H6\"/>"},"museo":{"color":"--c-mus","icon":"<path d=\"M3 9.5 12 4l9 5.5\"/><path d=\"M5.5 11v7M10 11v7M14 11v7M18.5 11v7\"/><path d=\"M3 20.5h18\"/>"},"arqueologia":{"color":"--c-arq","icon":"<path d=\"M9 3h6\"/><path d=\"M10 3v3.2C7.2 8 6.3 11 7 14.5L9 20h6l2-5.5c.7-3.5-.2-6.5-3-8.3V3\"/>"},"hidraulico":{"color":"--c-hid","icon":"<circle cx=\"12\" cy=\"12\" r=\"7.5\"/><circle cx=\"12\" cy=\"12\" r=\"1.8\"/><path d=\"M12 4.5v15M4.5 12h15M6.7 6.7l10.6 10.6M17.3 6.7 6.7 17.3\"/>"},"naturaleza":{"color":"--c-nat","icon":"<path d=\"M2.5 11c2.8-2.6 5.6-2.6 8 .3 2.4-2.9 5.2-2.9 8-.3\"/><path d=\"M8 17c1.6-1.5 3.2-1.5 4.6.2 1.4-1.7 3-1.7 4.6-.2\"/>"},"camino":{"color":"--c-cam","icon":"<path d=\"M12 20.5 3.5 9.2a9.5 9.5 0 0 1 17 0z\"/><path d=\"M12 20.5 8 6.5M12 20.5V5M12 20.5l4-14\"/>"}},"pois":[{"id":"puerta-baja","town":"Daroca","cat":"patrimonio","lat":41.11276,"lon":-1.41699,"coord_src":null,"q":["Puerta Baja, Daroca","Puerta Baja de Daroca"],"fq":["Category:Daroca","Puerta Baja Daroca","Daroca Puerta Baja muralla"],"name":{"es":"Puerta Baja","en":"Puerta Baja (Lower Gate)","fr":"Puerta Baja (Porte Basse)","de":"Puerta Baja (Unteres Tor)","pt":"Puerta Baja (Porta Baixa)"},"when":{"es":"Siglos XIV-XV · Puerta monumental de la muralla","en":"14th-15th centuries · Monumental gate in the walls","fr":"XIVe-XVe siècles · Porte monumentale de l'enceinte","de":"14.-15. Jahrhundert · Monumentales Stadttor","pt":"Séculos XIV-XV · Porta monumental da muralha"},"desc":{"es":"Dos torres de más de veinte metros y un gran arco apuntado guardan la entrada baja de Daroca. Durante siglos fue lo primero que veían los viajeros al llegar a la ciudad, y hoy sigue siendo su imagen más reconocible.","en":"Two towers more than twenty metres high and a great pointed arch guard the lower entrance to Daroca. For centuries it was the first thing travellers saw on arriving in the town, and it is still its best-known image.","fr":"Deux tours de plus de vingt mètres et un grand arc brisé gardent l'entrée basse de Daroca. Pendant des siècles, ce fut la première chose que voyaient les voyageurs en arrivant en ville, et c'est encore son image la plus connue.","de":"Zwei über zwanzig Meter hohe Türme und ein großer Spitzbogen bewachen den unteren Eingang von Daroca. Jahrhundertelang war es das Erste, was Reisende bei ihrer Ankunft sahen, und es ist bis heute das bekannteste Bild der Stadt.","pt":"Duas torres com mais de vinte metros e um grande arco ogival guardam a entrada baixa de Daroca. Durante séculos foi a primeira coisa que os viajantes viam ao chegar à cidade, e continua a ser a sua imagem mais conhecida."},"visit":{"es":"Exterior de acceso libre a cualquier hora; se ve bien desde la carretera y desde el arranque de la calle Mayor. Bastan 15 minutos, más si se combina con la Fuente de los Veinte Caños, que está al lado. Para visitas guiadas por la ciudad, consulta en la Oficina de Turismo de Daroca (calle Mayor, 44).","en":"The exterior is freely accessible at any time; it is best seen from the road and from the start of Calle Mayor. Fifteen minutes is enough, longer if you combine it with the Fuente de los Veinte Caños next door. For guided tours of the town, ask at the Daroca Tourist Office (Calle Mayor, 44).","fr":"Extérieur en accès libre à toute heure ; on la voit bien depuis la route et depuis le début de la Calle Mayor. Un quart d'heure suffit, davantage si vous y ajoutez la Fuente de los Veinte Caños, juste à côté. Pour des visites guidées de la ville, renseignez-vous à l'Office de tourisme de Daroca (Calle Mayor, 44).","de":"Von außen jederzeit frei zugänglich; gut zu sehen von der Landstraße und vom Anfang der Calle Mayor. Eine Viertelstunde genügt, länger, wenn man den Brunnen Fuente de los Veinte Caños gleich daneben einbezieht. Für Stadtführungen wenden Sie sich an das Fremdenverkehrsamt Daroca (Calle Mayor, 44).","pt":"Exterior de acesso livre a qualquer hora; vê-se bem da estrada e do início da Calle Mayor. Bastam 15 minutos, mais se juntar a Fuente de los Veinte Caños, mesmo ao lado. Para visitas guiadas à cidade, informe-se no Posto de Turismo de Daroca (Calle Mayor, 44)."},"src":"https://daroca.toools.es/wp-content/uploads/2026/06/Puerta-baja-de-Daroca_pdf_accesible.pdf","sources":["https://daroca.toools.es/wp-content/uploads/2026/06/Puerta-baja-de-Daroca_pdf_accesible.pdf","https://daroca.toools.es/wp-content/uploads/2026/03/Historia-Daroca.pdf","https://en.wikipedia.org/wiki/Daroca"],"art":{"es":[{"h":"Historia","t":"La Puerta Baja se levantó entre los siglos XIV y XV con grandes bloques de piedra: primero una torre y después la otra. Pertenece al recinto amurallado de Daroca, que en 1366 recibió de Pedro IV el título de ciudad tras resistir un asedio en la guerra contra Pedro I de Castilla.\n\nEn el siglo XVI se modificó para colocar el escudo del emperador Carlos I, que todavía preside la fachada exterior. No es un castillo, aunque lo parezca: es una puerta de la muralla, la principal entrada a la ciudad desde el valle."},{"h":"Qué ver","t":"Fíjate en las almenas escalonadas, con forma de triple escalón, y en los matacanes, los balcones de piedra desde los que se podía lanzar objetos sobre quien atacara la puerta. Entre las dos torres se abre el arco apuntado por el que pasa todavía la calle.\n\nAntes de cruzar, mira el ancho de la calle Mayor. Es más amplia de lo habitual en una ciudad medieval por una razón práctica: ocupa el fondo de una rambla que, con las tormentas, podía bajar cargada de agua."},{"h":"Curiosidades","t":"Se llama Baja porque está en el punto más bajo del casco histórico; también se la conocía como puerta fondonera, por quedar al fondo de esa rambla. Según la tradición de los Corporales, la mula que traía la reliquia desde Valencia en 1239 cayó muerta junto a esta puerta, y por eso los paños se quedaron en Daroca."}],"en":[{"h":"History","t":"The Puerta Baja was built between the 14th and 15th centuries from large stone blocks: first one tower, then the other. It belongs to Daroca's walled enclosure; in 1366 Peter IV granted Daroca the title of city after it withstood a siege in the war against Peter I of Castile.\n\nIn the 16th century the gate was altered to display the coat of arms of Emperor Charles V, which still presides over the outer façade. Although it looks like a castle, it is not one: it is a gate in the walls, the main entrance to the town from the valley."},{"h":"What to see","t":"Look at the stepped battlements, shaped like a triple step, and at the machicolations, the stone balconies from which objects could be dropped on anyone attacking the gate. Between the two towers opens the pointed arch through which the street still passes.\n\nBefore going through, notice how wide Calle Mayor is. It is broader than usual for a medieval town for a practical reason: it runs along the bed of a gully which, in storms, could fill with rushing water."},{"h":"Did you know?","t":"It is called Baja (lower) because it stands at the lowest point of the old town; it was also known as the puerta fondonera, because it lay at the bottom of that gully. According to the tradition of the Corporals, the mule carrying the relic from Valencia in 1239 dropped dead beside this gate, and that is why the cloths stayed in Daroca."}],"fr":[{"h":"Histoire","t":"La Puerta Baja fut élevée entre le XIVe et le XVe siècle avec de grands blocs de pierre : d'abord une tour, puis l'autre. Elle appartient à l'enceinte de Daroca, à qui Pierre IV accorda en 1366 le titre de ville après qu'elle eut résisté à un siège pendant la guerre contre Pierre Ier de Castille.\n\nAu XVIe siècle, on la modifia pour y placer les armes de l'empereur Charles Quint, qui dominent toujours la façade extérieure. Ce n'est pas un château, même si elle en a l'air : c'est une porte de l'enceinte, la principale entrée de la ville depuis la vallée."},{"h":"À voir","t":"Observez les merlons à gradins, en forme de triple marche, et les mâchicoulis, ces balcons de pierre d'où l'on pouvait jeter des projectiles sur les assaillants. Entre les deux tours s'ouvre l'arc brisé sous lequel passe encore la rue.\n\nAvant de franchir la porte, regardez la largeur de la Calle Mayor. Elle est plus large que d'habitude dans une ville médiévale pour une raison pratique : elle occupe le fond d'un ravin qui, lors des orages, pouvait se remplir d'eau."},{"h":"Le saviez-vous ?","t":"On l'appelle Baja (basse) parce qu'elle se trouve au point le plus bas du centre historique ; on la connaissait aussi comme puerta fondonera, car elle était au fond de ce ravin. Selon la tradition des Corporaux, la mule qui apportait la relique depuis Valence en 1239 tomba morte près de cette porte, et c'est pourquoi les linges restèrent à Daroca."}],"de":[{"h":"Geschichte","t":"Die Puerta Baja entstand zwischen dem 14. und 15. Jahrhundert aus großen Steinblöcken: zuerst ein Turm, dann der andere. Sie gehört zur Stadtmauer von Daroca, dem Peter IV. 1366 den Titel einer Stadt verlieh, nachdem es im Krieg gegen Peter I. von Kastilien einer Belagerung standgehalten hatte.\n\nIm 16. Jahrhundert wurde das Tor umgebaut, um das Wappen Kaiser Karls V. anzubringen, das noch heute die Außenfassade beherrscht. Auch wenn es so aussieht, ist es keine Burg: Es ist ein Tor der Stadtmauer, der wichtigste Zugang zur Stadt vom Tal her."},{"h":"Sehenswert","t":"Achten Sie auf die abgestuften Zinnen in Form einer dreifachen Stufe und auf die Pechnasen, steinerne Erker, aus denen man Gegenstände auf Angreifer werfen konnte. Zwischen den beiden Türmen öffnet sich der Spitzbogen, durch den noch heute die Straße führt.\n\nBevor Sie hindurchgehen, sehen Sie sich die Breite der Calle Mayor an. Sie ist breiter als in einer mittelalterlichen Stadt üblich, und das aus praktischem Grund: Sie verläuft auf dem Grund einer Schlucht, die sich bei Gewittern mit Wasser füllen konnte."},{"h":"Wussten Sie schon?","t":"Sie heißt Baja (unten), weil sie am tiefsten Punkt der Altstadt liegt; man nannte sie auch puerta fondonera, weil sie am Grund dieser Schlucht stand. Nach der Überlieferung der Corporales brach das Maultier, das die Reliquie 1239 aus Valencia brachte, neben diesem Tor tot zusammen, und deshalb blieben die Tücher in Daroca."}],"pt":[{"h":"História","t":"A Puerta Baja foi erguida entre os séculos XIV e XV com grandes blocos de pedra: primeiro uma torre, depois a outra. Pertence à muralha de Daroca, que em 1366 recebeu de Pedro IV o título de cidade depois de resistir a um cerco na guerra contra Pedro I de Castela.\n\nNo século XVI foi modificada para colocar o brasão do imperador Carlos V, que ainda domina a fachada exterior. Não é um castelo, embora pareça: é uma porta da muralha, a principal entrada da cidade a partir do vale."},{"h":"O que ver","t":"Repare nas ameias escalonadas, em forma de degrau triplo, e nos matacães, as varandas de pedra de onde se podiam lançar objetos sobre quem atacasse a porta. Entre as duas torres abre-se o arco ogival por onde ainda passa a rua.\n\nAntes de atravessar, observe a largura da Calle Mayor. É mais larga do que o habitual numa cidade medieval por uma razão prática: ocupa o fundo de uma ribeira que, com as trovoadas, podia descer carregada de água."},{"h":"Curiosidades","t":"Chama-se Baja (baixa) porque está no ponto mais baixo do centro histórico; também era conhecida como puerta fondonera, por ficar no fundo dessa ribeira. Segundo a tradição dos Corporais, a mula que trazia a relíquia de Valência em 1239 caiu morta junto a esta porta, e por isso os panos ficaram em Daroca."}]},"status":"pending"},{"id":"veinte-canos","town":"Daroca","cat":"hidraulico","lat":41.11257,"lon":-1.41694,"coord_src":null,"q":["Fuente de los Veinte Caños, Daroca","Fuente de los 20 Caños Daroca"],"fq":["Fuente de los Veinte Caños Daroca","Daroca fuente veinte caños"],"name":{"es":"Fuente de los Veinte Caños","en":"Fountain of the Twenty Spouts","fr":"Fontaine des Vingt Becs","de":"Brunnen der Zwanzig Röhren","pt":"Fonte das Vinte Bicas"},"when":{"es":"1639 · Fuente manierista junto a la Puerta Baja","en":"1639 · Mannerist fountain beside the Puerta Baja","fr":"1639 · Fontaine maniériste près de la Puerta Baja","de":"1639 · Manieristischer Brunnen an der Puerta Baja","pt":"1639 · Fonte maneirista junto à Puerta Baja"},"desc":{"es":"Veinte caños de agua salen de otras tantas caras talladas en piedra. Construida en 1639, fue durante siglos el punto donde se abastecían vecinos y animales a la entrada de la ciudad.","en":"Twenty spouts of water flow from as many faces carved in stone. Built in 1639, for centuries it was where townspeople and animals drew water at the entrance to the town.","fr":"Vingt filets d'eau sortent d'autant de visages sculptés dans la pierre. Construite en 1639, elle fut pendant des siècles le point d'eau des habitants et des animaux à l'entrée de la ville.","de":"Aus zwanzig in Stein gemeißelten Gesichtern fließen zwanzig Wasserstrahlen. Der 1639 erbaute Brunnen war jahrhundertelang die Wasserstelle für Menschen und Tiere am Eingang der Stadt.","pt":"Vinte bicas de água saem de outros tantos rostos esculpidos em pedra. Construída em 1639, foi durante séculos o local onde moradores e animais se abasteciam à entrada da cidade."},"visit":{"es":"Acceso libre, junto a la Puerta Baja. Es una parada de cinco o diez minutos. El agua no es potable: procede de una acequia, no de la red de abastecimiento.","en":"Free access, next to the Puerta Baja. It is a five- to ten-minute stop. The water is not drinkable: it comes from an irrigation channel, not from the mains supply.","fr":"Accès libre, à côté de la Puerta Baja. Comptez cinq à dix minutes. L'eau n'est pas potable : elle provient d'un canal d'irrigation, pas du réseau de distribution.","de":"Frei zugänglich, neben der Puerta Baja. Ein Halt von fünf bis zehn Minuten. Das Wasser ist kein Trinkwasser: Es stammt aus einem Bewässerungskanal, nicht aus der Wasserleitung.","pt":"Acesso livre, junto à Puerta Baja. É uma paragem de cinco a dez minutos. A água não é potável: vem de uma levada de rega, não da rede de abastecimento."},"src":"https://daroca.toools.es/wp-content/uploads/2026/06/Fuente-de-los-20-canos_pdf_accesible.pdf","sources":["https://daroca.toools.es/wp-content/uploads/2026/06/Fuente-de-los-20-canos_pdf_accesible.pdf","https://es.hispanopedia.com/wiki/Daroca","https://daroca.toools.es/wp-content/uploads/2026/03/Historia-Daroca.pdf"],"art":{"es":[{"h":"Historia","t":"La fuente se construyó en 1639, en estilo manierista, con pilastras decoradas y figuras ornamentales. En lo alto luce el escudo de la ciudad. Tenía delante un largo abrevadero, hoy desaparecido, porque aquí bebían también las caballerías y el ganado que entraban o salían de Daroca.\n\nOriginalmente estaba al comienzo del paseo, junto a la Puerta Baja, y las dos formaban un conjunto que recibía al viajero. Durante generaciones fue un lugar de paso diario para llenar cántaros."},{"h":"Qué ver","t":"Cuenta las caras de piedra de la parte inferior: de la boca de cada una sale un caño, y son ellas las que dan nombre a la fuente. Mira después el remate con el escudo y la decoración de las pilastras.\n\nEl agua llega por la acequia del Río Molinar, que abastecía los barrios de fuera de la muralla, donde había molinos, talleres y antiguos baños públicos. Por eso no se recomienda beberla.\n\nDesde aquí tienes una buena vista de la Puerta Baja, a pocos pasos, y del arranque de la calle Mayor. Imagina el lugar con el abrevadero lleno de caballerías: era la última parada antes de entrar en la ciudad y la primera al salir."}],"en":[{"h":"History","t":"The fountain was built in 1639 in Mannerist style, with decorated pilasters and ornamental figures. At the top is the town's coat of arms. In front of it stood a long trough, now gone, because horses, mules and livestock entering or leaving Daroca also drank here.\n\nIt originally stood at the start of the promenade, beside the Puerta Baja, and together they formed an ensemble that welcomed travellers. For generations it was a daily stop for filling water jugs."},{"h":"What to see","t":"Count the stone faces along the lower part: a spout comes out of each mouth, and they give the fountain its name. Then look at the crowning piece with the coat of arms and at the decoration on the pilasters.\n\nThe water arrives along the Río Molinar channel, which supplied the districts outside the walls, where there were mills, workshops and old public baths. That is why drinking it is not recommended.\n\nFrom here you have a good view of the Puerta Baja, a few steps away, and of the start of Calle Mayor. Picture the scene with the trough full of horses and mules: this was the last stop before entering the town and the first on leaving it."}],"fr":[{"h":"Histoire","t":"La fontaine fut construite en 1639 dans le style maniériste, avec des pilastres décorés et des figures ornementales. En haut figurent les armes de la ville. Devant se trouvait un long abreuvoir, aujourd'hui disparu, car les chevaux, les mules et le bétail qui entraient à Daroca ou en sortaient y buvaient aussi.\n\nElle se trouvait à l'origine au début de la promenade, près de la Puerta Baja, et toutes deux formaient un ensemble qui accueillait le voyageur. Pendant des générations, on y venait chaque jour remplir les cruches."},{"h":"À voir","t":"Comptez les visages de pierre de la partie inférieure : de la bouche de chacun sort un bec, et ce sont eux qui donnent son nom à la fontaine. Regardez ensuite le couronnement avec les armes et le décor des pilastres.\n\nL'eau arrive par le canal du Río Molinar, qui alimentait les quartiers hors les murs, où se trouvaient des moulins, des ateliers et d'anciens bains publics. C'est pourquoi il est déconseillé de la boire.\n\nD'ici, vous avez une belle vue sur la Puerta Baja, à quelques pas, et sur le début de la Calle Mayor. Imaginez l'abreuvoir plein de chevaux et de mules : c'était la dernière halte avant d'entrer en ville et la première en sortant."}],"de":[{"h":"Geschichte","t":"Der Brunnen wurde 1639 im manieristischen Stil errichtet, mit verzierten Pilastern und Schmuckfiguren. Oben prangt das Stadtwappen. Davor lag eine lange Tränke, die heute verschwunden ist, denn hier tranken auch Pferde, Maultiere und Vieh, die nach Daroca hinein- oder hinauszogen.\n\nUrsprünglich stand er am Anfang der Promenade neben der Puerta Baja, und beide bildeten ein Ensemble, das die Reisenden empfing. Über Generationen kam man täglich hierher, um Krüge zu füllen."},{"h":"Sehenswert","t":"Zählen Sie die steinernen Gesichter im unteren Teil: Aus jedem Mund kommt eine Röhre, und sie geben dem Brunnen seinen Namen. Sehen Sie sich dann den Abschluss mit dem Wappen und den Schmuck der Pilaster an.\n\nDas Wasser kommt über den Kanal des Río Molinar, der die Viertel außerhalb der Mauern versorgte, wo es Mühlen, Werkstätten und alte öffentliche Bäder gab. Deshalb sollte man es nicht trinken.\n\nVon hier aus haben Sie einen guten Blick auf die Puerta Baja, nur wenige Schritte entfernt, und auf den Anfang der Calle Mayor. Stellen Sie sich die Tränke voller Pferde und Maultiere vor: Dies war der letzte Halt vor dem Betreten der Stadt und der erste beim Verlassen."}],"pt":[{"h":"História","t":"A fonte foi construída em 1639, em estilo maneirista, com pilastras decoradas e figuras ornamentais. No topo exibe o brasão da cidade. À frente tinha um longo bebedouro, hoje desaparecido, porque aqui bebiam também os cavalos, as mulas e o gado que entravam ou saíam de Daroca.\n\nOriginalmente ficava no início do passeio, junto à Puerta Baja, e as duas formavam um conjunto que recebia o viajante. Durante gerações foi um local de passagem diária para encher cântaros."},{"h":"O que ver","t":"Conte os rostos de pedra da parte inferior: da boca de cada um sai uma bica, e são eles que dão nome à fonte. Observe depois o remate com o brasão e a decoração das pilastras.\n\nA água chega pela levada do Río Molinar, que abastecia os bairros fora da muralha, onde havia moinhos, oficinas e antigos banhos públicos. Por isso não se recomenda bebê-la.\n\nDaqui tem uma boa vista da Puerta Baja, a poucos passos, e do início da Calle Mayor. Imagine o local com o bebedouro cheio de cavalos e mulas: era a última paragem antes de entrar na cidade e a primeira à saída."}]},"status":"pending"},{"id":"mina-daroca","town":"Daroca","cat":"hidraulico","lat":41.11348,"lon":-1.40855,"coord_src":null,"q":["La Mina, Daroca","Túnel de la Mina Daroca"],"fq":["Mina de Daroca","Daroca túnel de la Mina","La Mina Daroca"],"name":{"es":"Túnel de la Mina","en":"La Mina Tunnel","fr":"Tunnel de La Mina","de":"Tunnel La Mina","pt":"Túnel de La Mina"},"when":{"es":"1555-1560 · Túnel contra las avenidas","en":"1555-1560 · A tunnel against flash floods","fr":"1555-1560 · Un tunnel contre les crues","de":"1555-1560 · Ein Tunnel gegen Sturzfluten","pt":"1555-1560 · Um túnel contra as cheias"},"desc":{"es":"Un túnel de unos 600 metros excavado a mano en el siglo XVI para desviar las tormentas que inundaban la calle Mayor. No es una mina de mineral: es una obra de ingeniería hidráulica que hoy se puede recorrer a pie.","en":"A tunnel some 600 metres long, dug by hand in the 16th century to divert the storm waters that flooded Calle Mayor. It is not a mine for minerals: it is a feat of hydraulic engineering that you can walk through today.","fr":"Un tunnel d'environ 600 mètres creusé à la main au XVIe siècle pour détourner les orages qui inondaient la Calle Mayor. Ce n'est pas une mine de minerai : c'est un ouvrage d'ingénierie hydraulique que l'on peut aujourd'hui parcourir à pied.","de":"Ein etwa 600 Meter langer Tunnel, im 16. Jahrhundert von Hand gegraben, um die Unwetter umzuleiten, die die Calle Mayor überschwemmten. Er ist kein Bergwerk, sondern ein Wasserbauwerk, das man heute zu Fuß durchqueren kann.","pt":"Um túnel com cerca de 600 metros escavado à mão no século XVI para desviar as trovoadas que inundavam a Calle Mayor. Não é uma mina de minério: é uma obra de engenharia hidráulica que hoje se pode percorrer a pé."},"visit":{"es":"Se puede recorrer a pie; lleva una linterna por si acaso y calzado que no tema al barro. Calcula una media hora entre ida y vuelta. Si ha llovido mucho, pregunta antes en la Oficina de Turismo de Daroca.","en":"You can walk through it; take a torch just in case and footwear that does not mind mud. Allow about half an hour there and back. If it has rained heavily, check first at the Daroca Tourist Office.","fr":"On peut le parcourir à pied ; prenez une lampe par précaution et des chaussures qui ne craignent pas la boue. Comptez une demi-heure aller-retour. S'il a beaucoup plu, renseignez-vous d'abord à l'Office de tourisme de Daroca.","de":"Man kann ihn zu Fuß durchqueren; nehmen Sie sicherheitshalber eine Taschenlampe und Schuhe mit, denen Schlamm nichts ausmacht. Rechnen Sie mit einer halben Stunde für Hin- und Rückweg. Nach starkem Regen fragen Sie vorher im Fremdenverkehrsamt Daroca nach.","pt":"Pode ser percorrido a pé; leve uma lanterna por precaução e calçado que não tema a lama. Conte com cerca de meia hora entre ida e volta. Se tiver chovido muito, informe-se antes no Posto de Turismo de Daroca."},"src":"https://daroca.toools.es/wp-content/uploads/2026/06/El-tunel-de-La-Mina_pdf_accesible.pdf","sources":["https://daroca.toools.es/wp-content/uploads/2026/06/El-tunel-de-La-Mina_pdf_accesible.pdf","https://es.hispanopedia.com/wiki/Daroca","https://dbe.rah.es/biografias/14545/pierres-vedel"],"art":{"es":[{"h":"Historia","t":"Daroca está encajada entre los cerros de San Cristóbal y San Jorge. Cuando caían tormentas fuertes, el agua bajaba por los barrancos hasta la calle Mayor, la inundaba y causaba graves daños. En 1555 la ciudad contrató al ingeniero francés Pierres Vedel, que ya trabajaba en obras hidráulicas en Aragón, para atravesar el monte y sacar el agua por otro camino.\n\nDos cuadrillas excavaron desde lados opuestos con picos y palas, y en 1560 se encontraron en el centro. El resultado es un túnel de unos 600 metros de largo y más de seis de ancho y de alto. Felipe II lo visitó en 1585."},{"h":"Qué ver","t":"Piensa, al entrar, que todo se abrió a mano, con picos y palas, en cinco años. La sección es tan amplia que por ella pasaron durante siglos rebaños, vecinos que iban a sus huertos y, en tiempos de guerra, gente que buscaba refugio.\n\nEstá reconocida como Bien de Interés Cultural."},{"h":"Curiosidades","t":"En Daroca se dice \"vamos a pasar la Mina\" como quien propone una pequeña aventura, sobre todo con niños. El nombre del ingeniero aparece escrito como Vedel o Bedel según las fuentes."}],"en":[{"h":"History","t":"Daroca is squeezed between the hills of San Cristóbal and San Jorge. When heavy storms broke, water rushed down the ravines into Calle Mayor, flooding it and causing serious damage. In 1555 the town hired the French engineer Pierres Vedel, already working on hydraulic projects in Aragon, to cut through the hill and send the water another way.\n\nTwo teams dug from opposite sides with picks and shovels, and in 1560 they met in the middle. The result is a tunnel about 600 metres long and more than six metres wide and high. Philip II visited it in 1585."},{"h":"What to see","t":"As you go in, remember that all of it was opened by hand, with picks and shovels, in five years. The passage is so wide that for centuries flocks, neighbours heading to their vegetable plots and, in wartime, people seeking shelter all passed through it.\n\nIt is listed as a Bien de Interés Cultural, Aragon's highest heritage protection."},{"h":"Did you know?","t":"In Daroca people say \"let's go through the Mina\" as if suggesting a small adventure, especially with children. The engineer's name is spelt Vedel or Bedel depending on the source."}],"fr":[{"h":"Histoire","t":"Daroca est encaissée entre les collines de San Cristóbal et de San Jorge. Lors des gros orages, l'eau dévalait les ravins jusqu'à la Calle Mayor, l'inondait et causait de graves dégâts. En 1555, la ville engagea l'ingénieur français Pierres Vedel, qui travaillait déjà sur des ouvrages hydrauliques en Aragon, pour percer la colline et évacuer l'eau par un autre chemin.\n\nDeux équipes creusèrent depuis les côtés opposés avec pics et pelles, et en 1560 elles se rejoignirent au centre. Le résultat est un tunnel d'environ 600 mètres de long et de plus de six mètres de large et de haut. Philippe II le visita en 1585."},{"h":"À voir","t":"En entrant, pensez que tout a été ouvert à la main, avec pics et pelles, en cinq ans. La galerie est si large que pendant des siècles y sont passés des troupeaux, des habitants qui allaient à leurs potagers et, en temps de guerre, des gens qui cherchaient refuge.\n\nElle est classée Bien de Interés Cultural, la plus haute protection du patrimoine en Aragon."},{"h":"Le saviez-vous ?","t":"À Daroca, on dit « allons passer la Mina » comme on propose une petite aventure, surtout avec des enfants. Le nom de l'ingénieur s'écrit Vedel ou Bedel selon les sources."}],"de":[{"h":"Geschichte","t":"Daroca liegt eingezwängt zwischen den Hügeln San Cristóbal und San Jorge. Bei heftigen Gewittern stürzte das Wasser durch die Schluchten bis in die Calle Mayor, überflutete sie und richtete schwere Schäden an. 1555 beauftragte die Stadt den französischen Ingenieur Pierres Vedel, der bereits an Wasserbauten in Aragonien arbeitete, den Berg zu durchbohren und das Wasser auf anderem Weg abzuleiten.\n\nZwei Trupps gruben von entgegengesetzten Seiten mit Hacken und Schaufeln, und 1560 trafen sie sich in der Mitte. Das Ergebnis ist ein Tunnel von etwa 600 Metern Länge und mehr als sechs Metern Breite und Höhe. Philipp II. besuchte ihn 1585."},{"h":"Sehenswert","t":"Denken Sie beim Hineingehen daran, dass alles in fünf Jahren von Hand, mit Hacken und Schaufeln, geöffnet wurde. Der Durchgang ist so breit, dass jahrhundertelang Herden, Bewohner auf dem Weg zu ihren Gärten und in Kriegszeiten Schutzsuchende hindurchzogen.\n\nEr ist als Bien de Interés Cultural geschützt, die höchste Denkmalschutzstufe in Aragonien."},{"h":"Wussten Sie schon?","t":"In Daroca sagt man „Wir gehen durch die Mina“, als schlüge man ein kleines Abenteuer vor, vor allem mit Kindern. Der Name des Ingenieurs wird je nach Quelle Vedel oder Bedel geschrieben."}],"pt":[{"h":"História","t":"Daroca está encaixada entre os montes de San Cristóbal e San Jorge. Quando caíam trovoadas fortes, a água descia pelos barrancos até à Calle Mayor, inundava-a e causava graves estragos. Em 1555 a cidade contratou o engenheiro francês Pierres Vedel, que já trabalhava em obras hidráulicas em Aragão, para atravessar o monte e levar a água por outro caminho.\n\nDuas equipas escavaram de lados opostos com picaretas e pás e, em 1560, encontraram-se no centro. O resultado é um túnel com cerca de 600 metros de comprimento e mais de seis de largura e de altura. Filipe II visitou-o em 1585."},{"h":"O que ver","t":"Ao entrar, pense que tudo foi aberto à mão, com picaretas e pás, em cinco anos. A galeria é tão larga que por ela passaram durante séculos rebanhos, moradores a caminho das hortas e, em tempo de guerra, pessoas que procuravam refúgio.\n\nEstá classificada como Bien de Interés Cultural, a proteção máxima do património em Aragão."},{"h":"Curiosidades","t":"Em Daroca diz-se \"vamos passar a Mina\" como quem propõe uma pequena aventura, sobretudo com crianças. O nome do engenheiro aparece escrito como Vedel ou Bedel, consoante as fontes."}]},"status":"pending"},{"id":"basilica-corporales","town":"Daroca","cat":"patrimonio","lat":41.11522,"lon":-1.41379,"coord_src":null,"q":["Basílica de Santa María de los Sagrados Corporales, Daroca","Colegiata de Santa María, Daroca"],"fq":["Basílica de Santa María de los Sagrados Corporales Daroca","Colegiata de Santa María Daroca","Daroca basílica Corporales"],"name":{"es":"Basílica de Santa María de los Corporales","en":"Basilica of Santa María de los Corporales","fr":"Basilique Santa María de los Corporales","de":"Basilika Santa María de los Corporales","pt":"Basílica de Santa María de los Corporales"},"when":{"es":"Siglos XII-XVII · Templo de los Corporales","en":"12th-17th centuries · Church of the Holy Corporals","fr":"XIIe-XVIIe siècles · Église des Saints Corporaux","de":"12.-17. Jahrhundert · Kirche der Heiligen Korporalien","pt":"Séculos XII-XVII · Igreja dos Sagrados Corporais"},"desc":{"es":"La iglesia mayor de Daroca guarda desde 1239 los Sagrados Corporales, los paños de un milagro eucarístico que convirtió la ciudad en lugar de peregrinación. Por fuera, una torre gótica de piedra; por dentro, un templo amplio con capilla gótica y baldaquino barroco.","en":"Daroca's main church has kept the Holy Corporals since 1239: the cloths of a Eucharistic miracle that turned the town into a place of pilgrimage. Outside, a Gothic stone tower; inside, a spacious church with a Gothic chapel and a Baroque baldachin.","fr":"La grande église de Daroca conserve depuis 1239 les Saints Corporaux, les linges d'un miracle eucharistique qui fit de la ville un lieu de pèlerinage. Dehors, une tour gothique en pierre ; dedans, une vaste église avec une chapelle gothique et un baldaquin baroque.","de":"Die Hauptkirche von Daroca bewahrt seit 1239 die Heiligen Korporalien, die Tücher eines eucharistischen Wunders, das die Stadt zum Wallfahrtsort machte. Außen ein gotischer Steinturm, innen ein weiter Kirchenraum mit gotischer Kapelle und barockem Baldachin.","pt":"A igreja principal de Daroca guarda desde 1239 os Sagrados Corporais, os panos de um milagre eucarístico que fez da cidade um lugar de peregrinação. Por fora, uma torre gótica de pedra; por dentro, uma igreja ampla com capela gótica e baldaquino barroco."},"visit":{"es":"Es la parroquia de Daroca y se puede visitar fuera de los actos de culto. Las visitas guiadas, que incluyen el museo, se reservan en la Oficina de Turismo de Daroca (976 800 129, ofdaroca@comarcadedaroca.com). Hay un escalón en la entrada. Calcula entre 45 minutos y una hora con el museo.","en":"It is Daroca's parish church and can be visited outside services. Guided tours, which include the museum, are booked through the Daroca Tourist Office (976 800 129, ofdaroca@comarcadedaroca.com). There is a step at the entrance. Allow 45 minutes to an hour with the museum.","fr":"C'est l'église paroissiale de Daroca ; on peut la visiter en dehors des offices. Les visites guidées, qui incluent le musée, se réservent à l'Office de tourisme de Daroca (976 800 129, ofdaroca@comarcadedaroca.com). Il y a une marche à l'entrée. Comptez 45 minutes à une heure avec le musée.","de":"Sie ist die Pfarrkirche von Daroca und kann außerhalb der Gottesdienste besichtigt werden. Führungen, die das Museum einschließen, bucht man beim Fremdenverkehrsamt Daroca (976 800 129, ofdaroca@comarcadedaroca.com). Am Eingang gibt es eine Stufe. Mit Museum 45 Minuten bis eine Stunde einplanen.","pt":"É a igreja paroquial de Daroca e pode ser visitada fora dos atos de culto. As visitas guiadas, que incluem o museu, reservam-se no Posto de Turismo de Daroca (976 800 129, ofdaroca@comarcadedaroca.com). Há um degrau à entrada. Conte com 45 minutos a uma hora com o museu."},"src":"https://daroca.toools.es/wp-content/uploads/2026/06/Basilica-Sta-M-Corporales_pdf_accesible.pdf","sources":["https://daroca.toools.es/wp-content/uploads/2026/06/Basilica-Sta-M-Corporales_pdf_accesible.pdf","https://daroca.toools.es/wp-content/uploads/2026/03/Historia-Daroca.pdf","https://es.hispanopedia.com/wiki/Daroca","https://www.escapadarural.com/blog/que-hacer-un-finde-en-daroca-zaragoza/"],"art":{"es":[{"h":"Historia","t":"Se cree que la basílica ocupa el lugar de una antigua mezquita. De la iglesia medieval quedan partes del ábside románico y algunos muros; con los siglos se amplió, se elevó y cambió de orientación. En el siglo XIV fue colegiata y en 1890 el papa León XIII le dio el título de basílica menor.\n\nSu fama viene de los Corporales. Según la tradición, el 23 de febrero de 1239 tropas de Daroca, Teruel y Calatayud se preparaban para tomar el castillo de Chío, en Luchente (Valencia). Un ataque obligó a esconder las hostias consagradas en el corporal, que apareció manchado de sangre. Para decidir qué ciudad se lo quedaba, se dejó elegir a la mula que lo transportaba, que murió al llegar a Daroca."},{"h":"Qué ver","t":"En el exterior, la torre gótica de piedra y la Puerta del Perdón, de los siglos XIV y XV. Dentro llaman la atención las dimensiones, el conjunto barroco del baldaquino y la imagen de la Virgen de la Asunción.\n\nLa Capilla de los Corporales, de estilo gótico, custodia el paño, que se muestra a los fieles en ocasiones especiales. Busca también el órgano, de los siglos XV y XVI, y el altar mayor barroco del siglo XVII."}],"en":[{"h":"History","t":"The basilica is believed to stand on the site of an old mosque. Parts of the Romanesque apse and some walls survive from the medieval church; over the centuries it was enlarged, raised and reoriented. In the 14th century it was a collegiate church, and in 1890 Pope Leo XIII gave it the title of minor basilica.\n\nIts fame comes from the Corporals. According to tradition, on 23 February 1239 troops from Daroca, Teruel and Calatayud were preparing to take the castle of Chío, in Luchente (Valencia). An attack forced the priest to hide the consecrated hosts in the corporal, which was later found stained with blood. To decide which town should keep it, the mule carrying it was left to choose, and it died on reaching Daroca."},{"h":"What to see","t":"Outside, look for the Gothic stone tower and the Puerta del Perdón, from the 14th and 15th centuries. Inside, the sheer size of the church stands out, along with the Baroque baldachin and the image of the Virgin of the Assumption.\n\nThe Gothic Chapel of the Corporals guards the cloth, which is shown to the faithful on special occasions. Look also for the organ, from the 15th and 16th centuries, and the Baroque high altar of the 17th century."}],"fr":[{"h":"Histoire","t":"On pense que la basilique occupe l'emplacement d'une ancienne mosquée. De l'église médiévale subsistent des parties de l'abside romane et quelques murs ; au fil des siècles, elle fut agrandie, surélevée et réorientée. Au XIVe siècle, elle fut collégiale, et en 1890 le pape Léon XIII lui donna le titre de basilique mineure.\n\nSa renommée vient des Corporaux. Selon la tradition, le 23 février 1239, des troupes de Daroca, Teruel et Calatayud se préparaient à prendre le château de Chío, à Luchente (Valence). Une attaque obligea à cacher les hosties consacrées dans le corporal, que l'on retrouva taché de sang. Pour décider quelle ville le garderait, on laissa choisir la mule qui le transportait ; elle mourut en arrivant à Daroca."},{"h":"À voir","t":"À l'extérieur, la tour gothique en pierre et la Puerta del Perdón, des XIVe et XVe siècles. À l'intérieur, on remarque les dimensions, l'ensemble baroque du baldaquin et la statue de la Vierge de l'Assomption.\n\nLa chapelle gothique des Corporaux garde le linge, montré aux fidèles en des occasions particulières. Cherchez aussi l'orgue, des XVe et XVIe siècles, et le maître-autel baroque du XVIIe siècle."}],"de":[{"h":"Geschichte","t":"Man nimmt an, dass die Basilika an der Stelle einer alten Moschee steht. Von der mittelalterlichen Kirche sind Teile der romanischen Apsis und einige Mauern erhalten; im Lauf der Jahrhunderte wurde sie erweitert, erhöht und anders ausgerichtet. Im 14. Jahrhundert war sie Stiftskirche, und 1890 verlieh ihr Papst Leo XIII. den Titel einer Basilica minor.\n\nIhr Ruhm geht auf die Korporalien zurück. Der Überlieferung nach bereiteten sich am 23. Februar 1239 Truppen aus Daroca, Teruel und Calatayud darauf vor, die Burg Chío in Luchente (Valencia) einzunehmen. Ein Angriff zwang dazu, die geweihten Hostien im Korporale zu verstecken, das später blutbefleckt aufgefunden wurde. Um zu entscheiden, welche Stadt es behalten sollte, ließ man das Maultier wählen, das es trug; es starb bei der Ankunft in Daroca."},{"h":"Sehenswert","t":"Außen der gotische Steinturm und die Puerta del Perdón aus dem 14. und 15. Jahrhundert. Innen beeindrucken die Ausmaße, der barocke Baldachin und das Bild der Himmelfahrt Mariens.\n\nDie gotische Kapelle der Korporalien bewahrt das Tuch, das den Gläubigen zu besonderen Anlässen gezeigt wird. Achten Sie auch auf die Orgel aus dem 15. und 16. Jahrhundert und den barocken Hochaltar aus dem 17. Jahrhundert."}],"pt":[{"h":"História","t":"Julga-se que a basílica ocupa o lugar de uma antiga mesquita. Da igreja medieval restam partes da abside românica e algumas paredes; ao longo dos séculos foi ampliada, elevada e mudou de orientação. No século XIV foi colegiada e, em 1890, o papa Leão XIII deu-lhe o título de basílica menor.\n\nA sua fama vem dos Corporais. Segundo a tradição, a 23 de fevereiro de 1239, tropas de Daroca, Teruel e Calatayud preparavam-se para tomar o castelo de Chío, em Luchente (Valência). Um ataque obrigou a esconder as hóstias consagradas no corporal, que apareceu manchado de sangue. Para decidir que cidade ficava com ele, deixou-se escolher a mula que o transportava, que morreu ao chegar a Daroca."},{"h":"O que ver","t":"No exterior, a torre gótica de pedra e a Puerta del Perdón, dos séculos XIV e XV. No interior impressionam as dimensões, o conjunto barroco do baldaquino e a imagem da Virgem da Assunção.\n\nA Capela dos Corporais, de estilo gótico, guarda o pano, que é mostrado aos fiéis em ocasiões especiais. Procure também o órgão, dos séculos XV e XVI, e o altar-mor barroco do século XVII."}]},"status":"pending"},{"id":"museo-corporales","town":"Daroca","cat":"museo","lat":41.11642,"lon":-1.41259,"coord_src":null,"q":["Museo de los Corporales, Daroca","Museo Parroquial, Daroca"],"fq":["Custodia de los Corporales Daroca","Pere Moragues custodia Daroca","Bartolomé Bermejo Santa Engracia Daroca"],"name":{"es":"Museo de los Corporales","en":"Museum of the Corporals","fr":"Musée des Corporaux","de":"Museum der Korporalien","pt":"Museu dos Corporais"},"when":{"es":"Arte gótico y orfebrería · Dentro de la basílica","en":"Gothic art and silverwork · Inside the basilica","fr":"Art gothique et orfèvrerie · Dans la basilique","de":"Gotische Kunst und Goldschmiedekunst · In der Basilika","pt":"Arte gótica e ourivesaria · Dentro da basílica"},"desc":{"es":"El museo de la basílica reúne retablos góticos, tejidos litúrgicos y orfebrería ligados al culto de los Corporales. Sus piezas más conocidas son tablas de Bartolomé Bermejo y la custodia relicario que encargó el rey Pedro IV.","en":"The basilica's museum brings together Gothic altarpieces, liturgical textiles and silverwork linked to the cult of the Corporals. Its best-known pieces are panels by Bartolomé Bermejo and the reliquary monstrance commissioned by King Peter IV.","fr":"Le musée de la basilique réunit des retables gothiques, des textiles liturgiques et de l'orfèvrerie liés au culte des Corporaux. Ses pièces les plus connues sont des panneaux de Bartolomé Bermejo et l'ostensoir-reliquaire commandé par le roi Pierre IV.","de":"Das Museum der Basilika vereint gotische Retabel, liturgische Textilien und Goldschmiedearbeiten aus dem Kult um die Korporalien. Die bekanntesten Stücke sind Tafeln von Bartolomé Bermejo und die Reliquienmonstranz, die König Peter IV. in Auftrag gab.","pt":"O museu da basílica reúne retábulos góticos, têxteis litúrgicos e ourivesaria ligados ao culto dos Corporais. As peças mais conhecidas são tábuas de Bartolomé Bermejo e a custódia-relicário encomendada pelo rei Pedro IV."},"visit":{"es":"Se visita con la basílica, en visita guiada que hay que reservar en la Oficina de Turismo de Daroca (976 800 129). Hay escaleras para subir a la segunda planta, donde está la sala de tejidos. Confirma horarios al reservar.","en":"It is visited together with the basilica on a guided tour that must be booked through the Daroca Tourist Office (976 800 129). There are stairs up to the second floor, where the textiles room is. Confirm times when booking.","fr":"Il se visite avec la basilique, lors d'une visite guidée à réserver à l'Office de tourisme de Daroca (976 800 129). Un escalier mène au deuxième étage, où se trouve la salle des textiles. Confirmez les horaires en réservant.","de":"Es wird zusammen mit der Basilika im Rahmen einer Führung besichtigt, die beim Fremdenverkehrsamt Daroca (976 800 129) gebucht werden muss. Eine Treppe führt in den zweiten Stock zum Textilsaal. Zeiten bei der Buchung bestätigen lassen.","pt":"Visita-se com a basílica, em visita guiada que tem de ser reservada no Posto de Turismo de Daroca (976 800 129). Há escadas para subir ao segundo piso, onde fica a sala dos têxteis. Confirme os horários ao reservar."},"src":"https://daroca.toools.es/wp-content/uploads/2026/06/Folleto%20accesible%20Daroca%20A4.pdf","sources":["https://daroca.toools.es/wp-content/uploads/2026/06/Folleto%20accesible%20Daroca%20A4.pdf","https://www.enciclopedia.cat/lart-gotic-a-catalunya/la-custodia-reliquiari-dels-corporals-de-daroca","https://daroca.toools.es/wp-content/uploads/2026/03/Historia-Daroca.pdf"],"art":{"es":[{"h":"Historia","t":"La llegada de los Corporales en 1239 atrajo peregrinos durante siglos, entre ellos los Reyes Católicos. El museo reúne las piezas de arte que esa devoción dejó en la iglesia.\n\nLa pieza más valiosa es la custodia relicario que el rey Pedro IV encargó al orfebre barcelonés Pere Moragues. Se trabajaba en Zaragoza en 1384 y en 1386 el rey ordenó pagarla. Es de plata dorada con esmaltes, mide algo más de un metro y tiene forma de pequeño retablo, con una caja en la parte trasera para guardar la reliquia. Más tarde se le añadieron la base y las puertas, a finales del siglo XV, y una corona en el XVIII."},{"h":"Qué ver","t":"En la custodia, busca la Crucifixión en la parte alta y, abajo, a la Virgen coronada con los donantes, el rey Pedro y la reina Sibila de Fortiá. Los esmaltes repiten las barras de la Corona de Aragón.\n\nEn las salas de pintura hay retablos góticos y varias tablas del retablo de Santa Engracia de Bartolomé Bermejo, pintor cordobés que trabajó en Aragón en el siglo XV. La segunda planta reúne ornamentos y tejidos litúrgicos."}],"en":[{"h":"History","t":"The arrival of the Corporals in 1239 drew pilgrims for centuries, among them the Catholic Monarchs. The museum gathers the works of art that this devotion left in the church.\n\nThe most valuable piece is the reliquary monstrance that King Peter IV commissioned from the Barcelona silversmith Pere Moragues. It was being made in Zaragoza in 1384, and in 1386 the king ordered payment for it. It is of gilded silver with enamels, stands just over a metre high and is shaped like a small altarpiece, with a compartment at the back to hold the relic. The base and doors were added in the late 15th century, and a crown in the 18th."},{"h":"What to see","t":"On the monstrance, look for the Crucifixion at the top and, below, the crowned Virgin with the donors, King Peter and Queen Sibila de Fortiá. The enamels repeat the red and gold bars of the Crown of Aragon.\n\nIn the painting rooms there are Gothic altarpieces and several panels from the altarpiece of Saint Engracia by Bartolomé Bermejo, a painter from Córdoba who worked in Aragon in the 15th century. The second floor holds vestments and liturgical textiles."}],"fr":[{"h":"Histoire","t":"L'arrivée des Corporaux en 1239 attira des pèlerins pendant des siècles, parmi lesquels les Rois catholiques. Le musée rassemble les œuvres d'art que cette dévotion a laissées à l'église.\n\nLa pièce la plus précieuse est l'ostensoir-reliquaire que le roi Pierre IV commanda à l'orfèvre barcelonais Pere Moragues. On y travaillait à Saragosse en 1384, et en 1386 le roi en ordonna le paiement. Il est en argent doré avec des émaux, mesure un peu plus d'un mètre et a la forme d'un petit retable, avec un compartiment au dos pour la relique. On y ajouta plus tard le pied et les volets, à la fin du XVe siècle, puis une couronne au XVIIIe."},{"h":"À voir","t":"Sur l'ostensoir, cherchez la Crucifixion en haut et, en bas, la Vierge couronnée avec les donateurs, le roi Pierre et la reine Sibylle de Fortià. Les émaux reprennent les pals de la Couronne d'Aragon.\n\nDans les salles de peinture se trouvent des retables gothiques et plusieurs panneaux du retable de sainte Engrâce de Bartolomé Bermejo, peintre originaire de Cordoue qui travailla en Aragon au XVe siècle. Le deuxième étage réunit des ornements et des textiles liturgiques."}],"de":[{"h":"Geschichte","t":"Die Ankunft der Korporalien 1239 zog jahrhundertelang Pilger an, darunter die Katholischen Könige. Das Museum vereint die Kunstwerke, die diese Verehrung in der Kirche hinterlassen hat.\n\nDas wertvollste Stück ist die Reliquienmonstranz, die König Peter IV. beim Barceloneser Goldschmied Pere Moragues bestellte. 1384 wurde in Saragossa daran gearbeitet, 1386 ordnete der König die Bezahlung an. Sie besteht aus vergoldetem Silber mit Email, ist gut einen Meter hoch und hat die Form eines kleinen Altars, mit einem Fach auf der Rückseite für die Reliquie. Später kamen Fuß und Türen Ende des 15. Jahrhunderts sowie eine Krone im 18. Jahrhundert hinzu."},{"h":"Sehenswert","t":"Suchen Sie an der Monstranz oben die Kreuzigung und unten die gekrönte Muttergottes mit den Stiftern, König Peter und Königin Sibila de Fortià. Die Emails wiederholen die Streifen der Krone von Aragonien.\n\nIn den Gemäldesälen hängen gotische Retabel und mehrere Tafeln des Retabels der heiligen Engracia von Bartolomé Bermejo, einem aus Córdoba stammenden Maler, der im 15. Jahrhundert in Aragonien arbeitete. Im zweiten Stock sind Paramente und liturgische Textilien zu sehen."}],"pt":[{"h":"História","t":"A chegada dos Corporais em 1239 atraiu peregrinos durante séculos, entre eles os Reis Católicos. O museu reúne as obras de arte que essa devoção deixou na igreja.\n\nA peça mais valiosa é a custódia-relicário que o rei Pedro IV encomendou ao ourives barcelonês Pere Moragues. Trabalhava-se nela em Saragoça em 1384 e, em 1386, o rei mandou pagá-la. É de prata dourada com esmaltes, mede pouco mais de um metro e tem forma de pequeno retábulo, com uma caixa na parte de trás para guardar a relíquia. Mais tarde acrescentaram-se a base e as portas, no final do século XV, e uma coroa no século XVIII."},{"h":"O que ver","t":"Na custódia, procure a Crucificação na parte de cima e, em baixo, a Virgem coroada com os doadores, o rei Pedro e a rainha Sibila de Fortiá. Os esmaltes repetem as barras da Coroa de Aragão.\n\nNas salas de pintura há retábulos góticos e várias tábuas do retábulo de Santa Engrácia de Bartolomé Bermejo, pintor natural de Córdova que trabalhou em Aragão no século XV. O segundo piso reúne paramentos e têxteis litúrgicos."}]},"status":"pending"},{"id":"san-miguel","town":"Daroca","cat":"patrimonio","lat":41.11523,"lon":-1.41691,"coord_src":null,"q":["Iglesia de San Miguel, Daroca","San Miguel Arcángel, Daroca"],"fq":["Iglesia de San Miguel Daroca","San Miguel Daroca románico","Daroca San Miguel ábside"],"name":{"es":"Iglesia de San Miguel","en":"Church of San Miguel","fr":"Église San Miguel","de":"Kirche San Miguel","pt":"Igreja de San Miguel"},"when":{"es":"Siglos XII-XIII · Románico con pintura gótica","en":"12th-13th centuries · Romanesque with Gothic painting","fr":"XIIe-XIIIe siècles · Roman et peinture gothique","de":"12.-13. Jahrhundert · Romanik mit gotischer Malerei","pt":"Séculos XII-XIII · Românico com pintura gótica"},"desc":{"es":"Una de las iglesias románicas mejor conservadas de Daroca, con portada de arquivoltas y un ábside semicircular. Dentro guarda una pintura mural del siglo XIV con la Coronación de la Virgen y los doce apóstoles.","en":"One of the best-preserved Romanesque churches in Daroca, with an arched doorway and a semicircular apse. Inside it keeps a 14th-century wall painting of the Coronation of the Virgin and the Twelve Apostles.","fr":"L'une des églises romanes les mieux conservées de Daroca, avec un portail à voussures et une abside semi-circulaire. À l'intérieur, une peinture murale du XIVe siècle représente le Couronnement de la Vierge et les douze apôtres.","de":"Eine der am besten erhaltenen romanischen Kirchen Darocas, mit Archivoltenportal und halbrunder Apsis. Innen birgt sie ein Wandgemälde aus dem 14. Jahrhundert mit der Krönung Mariens und den zwölf Aposteln.","pt":"Uma das igrejas românicas mais bem conservadas de Daroca, com portal de arquivoltas e abside semicircular. No interior guarda uma pintura mural do século XIV com a Coroação da Virgem e os doze apóstolos."},"visit":{"es":"Se visita con guía dentro de la ruta de las artes medievales de Daroca, que se reserva en la Oficina de Turismo (976 800 129). La subida tiene calles empinadas. El exterior se puede ver libremente.","en":"It is visited with a guide as part of Daroca's medieval arts tour, booked at the Tourist Office (976 800 129). The way up involves steep streets. The exterior can be seen freely.","fr":"Elle se visite avec un guide dans le cadre de la visite des arts médiévaux de Daroca, à réserver à l'Office de tourisme (976 800 129). La montée se fait par des rues en pente. L'extérieur est visible librement.","de":"Sie wird mit Führung im Rahmen des Rundgangs zur mittelalterlichen Kunst in Daroca besichtigt, buchbar beim Fremdenverkehrsamt (976 800 129). Der Weg hinauf führt durch steile Gassen. Das Äußere ist frei zugänglich.","pt":"Visita-se com guia no percurso das artes medievais de Daroca, que se reserva no Posto de Turismo (976 800 129). A subida tem ruas íngremes. O exterior pode ser visto livremente."},"src":"https://daroca.toools.es/wp-content/uploads/2026/06/Iglesia-de-San-Miguel_pdf_accesible.pdf","sources":["https://daroca.toools.es/wp-content/uploads/2026/06/Iglesia-de-San-Miguel_pdf_accesible.pdf","https://es.hispanopedia.com/wiki/Daroca","https://daroca.toools.es/wp-content/uploads/2026/03/Historia-Daroca.pdf"],"art":{"es":[{"h":"Historia","t":"Las obras comenzaron a mediados del siglo XII y se alargaron tanto que el edificio mezcla estilos. Las partes más antiguas, el ábside y la portada, son románicas. Con el tiempo la iglesia dejó de usarse, perdió elementos como la torre y a comienzos del siglo XX ya no era parroquia. Una restauración posterior le devolvió su aspecto románico. Es Bien de Interés Cultural.\n\nTambién se la conoce como San Valero. Cada 28 de enero se enciende una hoguera en honor del santo y el 29 se celebra misa, el único día del año en que vuelve a tener culto."},{"h":"Qué ver","t":"La portada mira al sur y tiene varias arquivoltas con motivos geométricos; en el tímpano, una mandorla rodeada por los cuatro evangelistas. Rodea el edificio para ver el ábside, con columnas adosadas, arcos ciegos y ventanas de medio punto.\n\nDentro, el espacio es sobrio, de tres naves. En el ábside está la pintura mural del siglo XIV: la Coronación de la Virgen entre ángeles y, debajo, los doce apóstoles. No hay bancos sino sillas, porque la iglesia se usa como sala de conciertos: cada agosto acoge el Festival de Música Antigua."},{"h":"Para entenderlo","t":"San Miguel destaca también por su entorno: está en una zona de Daroca donde abundan el ladrillo y el mudéjar, así que su piedra románica llama la atención."}],"en":[{"h":"History","t":"Work began in the mid-12th century and went on for so long that the building mixes styles. The oldest parts, the apse and the doorway, are Romanesque. Over time the church fell out of use, lost features such as its tower, and by the early 20th century it was no longer a parish church. A later restoration gave it back its Romanesque look. It is a Bien de Interés Cultural.\n\nIt is also known as San Valero. Every 28 January a bonfire is lit in the saint's honour, and on the 29th Mass is said, the only day of the year when the church is used for worship again."},{"h":"What to see","t":"The doorway faces south and has several archivolts with geometric motifs; in the tympanum, a mandorla surrounded by the four Evangelists. Walk round the building to see the apse, with engaged columns, blind arches and round-headed windows.\n\nInside, the space is plain, with three naves. In the apse is the 14th-century wall painting: the Coronation of the Virgin among angels and, below, the Twelve Apostles. There are chairs rather than pews because the church is used as a concert hall: every August it hosts the Early Music Festival."},{"h":"Understanding it","t":"San Miguel also stands out because of its surroundings: it lies in a part of Daroca where brick and Mudéjar building dominate, so its Romanesque stonework catches the eye."}],"fr":[{"h":"Histoire","t":"Les travaux commencèrent au milieu du XIIe siècle et durèrent si longtemps que l'édifice mêle les styles. Les parties les plus anciennes, l'abside et le portail, sont romanes. Avec le temps, l'église cessa d'être utilisée, perdit des éléments comme son clocher et, au début du XXe siècle, n'était plus paroisse. Une restauration ultérieure lui a rendu son aspect roman. Elle est classée Bien de Interés Cultural.\n\nOn l'appelle aussi San Valero. Chaque 28 janvier, on allume un feu en l'honneur du saint et le 29 on y célèbre la messe, le seul jour de l'année où le culte y revient."},{"h":"À voir","t":"Le portail regarde vers le sud et compte plusieurs voussures à motifs géométriques ; au tympan, une mandorle entourée des quatre évangélistes. Faites le tour de l'édifice pour voir l'abside, avec ses colonnes engagées, ses arcs aveugles et ses fenêtres en plein cintre.\n\nÀ l'intérieur, l'espace est sobre, à trois nefs. Dans l'abside se trouve la peinture murale du XIVe siècle : le Couronnement de la Vierge parmi les anges et, au-dessous, les douze apôtres. Il n'y a pas de bancs mais des chaises, car l'église sert de salle de concert : chaque mois d'août, elle accueille le Festival de musique ancienne."},{"h":"Pour comprendre","t":"San Miguel se distingue aussi par son environnement : elle se trouve dans un quartier de Daroca où dominent la brique et l'art mudéjar, si bien que sa pierre romane attire le regard."}],"de":[{"h":"Geschichte","t":"Der Bau begann Mitte des 12. Jahrhunderts und zog sich so lange hin, dass das Gebäude verschiedene Stile vereint. Die ältesten Teile, Apsis und Portal, sind romanisch. Mit der Zeit wurde die Kirche nicht mehr genutzt, verlor Elemente wie den Turm und war Anfang des 20. Jahrhunderts keine Pfarrkirche mehr. Eine spätere Restaurierung gab ihr das romanische Aussehen zurück. Sie ist Bien de Interés Cultural.\n\nSie wird auch San Valero genannt. Jedes Jahr am 28. Januar wird zu Ehren des Heiligen ein Feuer entzündet, und am 29. wird eine Messe gefeiert, der einzige Tag im Jahr, an dem hier wieder Gottesdienst ist."},{"h":"Sehenswert","t":"Das Portal ist nach Süden gerichtet und hat mehrere Archivolten mit geometrischen Motiven; im Tympanon eine Mandorla, umgeben von den vier Evangelisten. Gehen Sie um das Gebäude herum, um die Apsis mit Dreiviertelsäulen, Blendbögen und Rundbogenfenstern zu sehen.\n\nInnen ist der Raum schlicht und dreischiffig. In der Apsis befindet sich das Wandgemälde aus dem 14. Jahrhundert: die Krönung Mariens zwischen Engeln und darunter die zwölf Apostel. Statt Bänken gibt es Stühle, weil die Kirche als Konzertsaal dient: Jeden August ist sie Spielstätte des Festivals für Alte Musik."},{"h":"Zum Verständnis","t":"San Miguel fällt auch wegen ihrer Umgebung auf: Sie liegt in einem Teil Darocas, in dem Backstein und Mudéjar-Bauten vorherrschen, sodass ihr romanisches Mauerwerk ins Auge sticht."}],"pt":[{"h":"História","t":"As obras começaram em meados do século XII e prolongaram-se tanto que o edifício mistura estilos. As partes mais antigas, a abside e o portal, são românicas. Com o tempo a igreja deixou de ser usada, perdeu elementos como a torre e, no início do século XX, já não era paroquial. Um restauro posterior devolveu-lhe o aspeto românico. É Bien de Interés Cultural.\n\nTambém é conhecida como San Valero. Todos os anos, a 28 de janeiro, acende-se uma fogueira em honra do santo e, a 29, celebra-se missa, o único dia do ano em que volta a haver culto."},{"h":"O que ver","t":"O portal está virado a sul e tem várias arquivoltas com motivos geométricos; no tímpano, uma mandorla rodeada pelos quatro evangelistas. Dê a volta ao edifício para ver a abside, com colunas adossadas, arcos cegos e janelas de volta perfeita.\n\nNo interior, o espaço é sóbrio, de três naves. Na abside está a pintura mural do século XIV: a Coroação da Virgem entre anjos e, por baixo, os doze apóstolos. Não há bancos, mas cadeiras, porque a igreja é usada como sala de concertos: todos os agostos acolhe o Festival de Música Antiga."},{"h":"Para compreender","t":"San Miguel destaca-se também pelo ambiente: fica numa zona de Daroca onde predominam o tijolo e o mudéjar, por isso a sua pedra românica chama a atenção."}]},"status":"pending"},{"id":"murallas-castillo","town":"Daroca","cat":"patrimonio","lat":41.11599,"lon":-1.4121,"coord_src":null,"q":["Castillo Mayor, Daroca","Puerta Alta, Daroca","Murallas de Daroca"],"fq":["Murallas de Daroca","Daroca walls","Castillo Mayor Daroca"],"name":{"es":"Murallas y Castillo Mayor","en":"Town Walls and Castillo Mayor","fr":"Remparts et Castillo Mayor","de":"Stadtmauer und Castillo Mayor","pt":"Muralhas e Castillo Mayor"},"when":{"es":"Siglos XI-XV · Casi 4 km de muralla","en":"11th-15th centuries · Almost 4 km of walls","fr":"XIe-XVe siècles · Près de 4 km de remparts","de":"11.-15. Jahrhundert · Fast 4 km Stadtmauer","pt":"Séculos XI-XV · Quase 4 km de muralha"},"desc":{"es":"Casi cuatro kilómetros de muralla rodean Daroca subiendo por los cerros que la encierran, con más de un centenar de torres y tres castillos. Desde la Puerta Alta se puede subir al Castillo Mayor y ver la ciudad entera a los pies.","en":"Almost four kilometres of walls ring Daroca, climbing the hills that enclose it, with more than a hundred towers and three castles. From the Puerta Alta you can climb to the Castillo Mayor and see the whole town at your feet.","fr":"Près de quatre kilomètres de remparts entourent Daroca en grimpant sur les collines qui l'enserrent, avec plus d'une centaine de tours et trois châteaux. Depuis la Puerta Alta, on peut monter au Castillo Mayor et voir toute la ville à ses pieds.","de":"Fast vier Kilometer Mauer umgeben Daroca und klettern die Hügel hinauf, die die Stadt einschließen, mit über hundert Türmen und drei Burgen. Von der Puerta Alta kann man zum Castillo Mayor aufsteigen und die ganze Stadt zu Füßen sehen.","pt":"Quase quatro quilómetros de muralha rodeiam Daroca subindo pelos montes que a cercam, com mais de uma centena de torres e três castelos. Da Puerta Alta pode subir-se ao Castillo Mayor e ver a cidade inteira a seus pés."},"visit":{"es":"La ruta del castillo y las murallas sale de la Puerta Alta y lleva unas dos horas, con cuestas fuertes y tramos de tierra: lleva calzado de montaña y agua. Hay lienzos en mal estado; no te subas a los muros. Pide el plano en la Oficina de Turismo de Daroca.","en":"The castle and walls route starts at the Puerta Alta and takes about two hours, with steep slopes and dirt stretches: wear walking boots and carry water. Some sections of wall are in poor condition; do not climb on them. Ask for the map at the Daroca Tourist Office.","fr":"Le circuit du château et des remparts part de la Puerta Alta et dure environ deux heures, avec de fortes pentes et des passages en terre : prévoyez des chaussures de randonnée et de l'eau. Certains pans sont en mauvais état ; ne montez pas sur les murs. Demandez le plan à l'Office de tourisme de Daroca.","de":"Der Rundweg zu Burg und Mauer beginnt an der Puerta Alta und dauert etwa zwei Stunden, mit steilen Anstiegen und unbefestigten Abschnitten: Wanderschuhe und Wasser mitnehmen. Manche Mauerabschnitte sind in schlechtem Zustand; klettern Sie nicht darauf. Den Plan gibt es im Fremdenverkehrsamt Daroca.","pt":"O percurso do castelo e das muralhas parte da Puerta Alta e demora cerca de duas horas, com subidas fortes e troços de terra: leve calçado de montanha e água. Há panos de muralha em mau estado; não suba aos muros. Peça o mapa no Posto de Turismo de Daroca."},"src":"https://en.wikipedia.org/wiki/Wall_of_Daroca","sources":["https://en.wikipedia.org/wiki/Wall_of_Daroca","https://daroca.toools.es/wp-content/uploads/2026/03/Historia-Daroca.pdf","https://es.hispanopedia.com/wiki/Daroca","https://www.escapadarural.com/blog/que-hacer-un-finde-en-daroca-zaragoza/"],"art":{"es":[{"h":"Historia","t":"Daroca nació como fortaleza musulmana. Cuando Alfonso I la conquistó en 1120, los cristianos ampliaron las defensas a medida que la ciudad crecía, y las obras siguieron hasta el siglo XV. El fuero de 1142 atrajo pobladores de Aragón, Cataluña, Francia, Castilla y Navarra, y a principios del siglo XIII Daroca superaba los 4.000 habitantes.\n\nEl resultado es el recinto amurallado más extenso de Aragón: casi cuatro kilómetros de tapial, ladrillo y piedra, más de cien torreones, tres castillos y varias puertas, entre ellas la Alta, la Baja, la del Arrabal y el Portal de Valencia. Se usó en la guerra de los Dos Pedros, en la de la Independencia y en las guerras carlistas."},{"h":"Qué ver","t":"Desde la Puerta Alta, el cami
