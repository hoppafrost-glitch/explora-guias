em Speicher.\n\nVerbinden Sie den Besuch mit einem Spaziergang durch den Ortskern, wo Sie Herrenhäuser mit Wappen sehen, und mit dem Hondo de la Unilla, einer kleinen Lagune eine Viertelstunde zu Fuß entfernt."},{"h":"Zum Verständnis","t":"Zwischen dem 16. und 19. Jahrhundert war Eis ein sehr geschätztes Gut: Es diente zur Konservierung von Lebensmitteln, zum Kühlen von Getränken und vor allem als Heilmittel gegen Fieber und Entzündungen. Eiskeller gehörten oft der Gemeinde, und ihre Nutzung wurde verpachtet.\n\nMit den Eisfabriken und der Elektrizität endete ihre Zeit zu Beginn des 20. Jahrhunderts. Viele gingen verloren; die erhaltenen, wie dieser, erzählen, wie man in einer der heißesten Gegenden Aragóns ohne Kühlschrank lebte.\n\nCandasnos an der Straße von Madrid nach Barcelona war immer ein Durchgangsort, und das Eis könnte auch Gasthäusern und Reisenden gedient haben."}],"pt":[{"h":"História","t":"Candasnos fica numa planície sem rios, entre os Monegros e a várzea do Cinca. Para beber e para o gado, os habitantes dependiam da água da chuva recolhida em charcas. A mais antiga é a Balsa Buena, que a tradição atribui aos romanos e que ainda abastece a povoação nas secas; a sua memória está até no brasão municipal.\n\nOutras charcas do concelho, como a del Tejar, a del Sas ou a Reguladora, recordam as secas de outrora.\n\nO poço e as charcas contam a mesma história que o brasão da povoação: a de uma comunidade que teve de aprender a guardar a água e o frio porque a natureza não lhos dava."},{"h":"O que ver","t":"O poço de gelo é uma construção escavada no solo e coberta, onde no inverno se empilhava a neve ou o gelo entre camadas de palha. Bem prensado, conservava-se até ao verão.\n\nAproxime-se depois da Balsa Buena e repare como se aproveita o declive do terreno para recolher a água da chuva. Numa paisagem tão plana, cada pequena depressão transforma-se num depósito.\n\nCombine a visita com um passeio pelo centro, onde verá casas senhoriais com brasões, e com o Hondo de la Unilla, uma pequena lagoa a um quarto de hora a pé."},{"h":"Para compreender","t":"Entre os séculos XVI e XIX, o gelo era um bem muito apreciado: servia para conservar alimentos, para arrefecer bebidas e, sobretudo, como remédio médico contra febres e inflamações. Os poços de gelo eram muitas vezes municipais e a sua exploração era arrendada.\n\nA chegada das fábricas de gelo e da eletricidade acabou com eles no início do século XX. Muitos perderam-se; os que restam, como este, contam como se vivia sem frigorífico numa das zonas mais quentes de Aragão.\n\nCandasnos, na estrada de Madrid para Barcelona, foi sempre local de passagem, e o gelo pode ter servido também estalagens e viajantes."}]},"status":"pending"},{"id":"camino-candasnos","town":"Candasnos","cat":"camino","lat":41.49989,"lon":0.06437,"coord_src":null,"q":["Camino de Santiago, Candasnos","Candasnos"],"fq":["Camino de Santiago Candasnos","Camino Ignaciano Candasnos","Candasnos Camino"],"name":{"es":"Caminos de peregrinos: Santiago e Ignaciano","en":"Pilgrim routes: St James and the Ignatian Way","fr":"Chemins de pèlerins : Saint-Jacques et Ignatien","de":"Pilgerwege: Jakobsweg und Ignatiusweg","pt":"Caminhos de peregrinos: Santiago e Inaciano"},"when":{"es":"Camino Catalán y Camino Ignaciano · Sendero","en":"Catalan Way and Ignatian Way · Trail","fr":"Chemin catalan et Chemin ignatien · Sentier","de":"Katalanischer Jakobsweg und Ignatiusweg · Wanderweg","pt":"Caminho Catalão e Caminho Inaciano · Trilho"},"desc":{"es":"Fraga y Candasnos son etapas del Camino de Santiago que llega desde Cataluña y del Camino Ignaciano, que sigue los pasos de San Ignacio hacia Montserrat. Entre ambos pueblos, kilómetros de secano abierto.","en":"Fraga and Candasnos are stages on the Way of St James arriving from Catalonia and on the Camino Ignaciano, which follows in the footsteps of St Ignatius towards Montserrat. Between the two lie kilometres of open dry farmland.","fr":"Fraga et Candasnos sont des étapes du chemin de Saint-Jacques venant de Catalogne et du Camino Ignaciano (Chemin ignatien), qui suit les pas de saint Ignace vers Montserrat. Entre les deux villages, des kilomètres de secano à perte de vue.","de":"Fraga und Candasnos sind Etappenorte des Jakobswegs, der aus Katalonien kommt, und des Camino Ignaciano, der den Spuren des heiligen Ignatius nach Montserrat folgt. Zwischen beiden Orten liegen Kilometer offenen Trockenlands.","pt":"Fraga e Candasnos são etapas do Caminho de Santiago que chega da Catalunha e do Caminho Inaciano, que segue os passos de Santo Inácio em direção a Montserrat. Entre as duas povoações, quilómetros de sequeiro aberto."},"visit":{"es":"El trazado está señalizado con flechas y se puede caminar un tramo corto desde Candasnos o Fraga. Son caminos sin sombra y con pocos servicios entre pueblos: lleva agua de sobra y evita las horas de calor en verano.","en":"The route is waymarked with arrows, and you can walk a short stretch from Candasnos or Fraga. These paths have no shade and few facilities between villages: take plenty of water and avoid the hottest hours in summer.","fr":"Le tracé est balisé par des flèches et l'on peut en parcourir un court tronçon depuis Candasnos ou Fraga. Ce sont des chemins sans ombre et avec peu de services entre les villages : emportez beaucoup d'eau et évitez les heures chaudes en été.","de":"Die Strecke ist mit Pfeilen markiert, und man kann einen kurzen Abschnitt ab Candasnos oder Fraga gehen. Die Wege sind schattenlos und haben zwischen den Orten nur wenige Einrichtungen: Nehmen Sie reichlich Wasser mit und meiden Sie im Sommer die heißen Stunden.","pt":"O traçado está sinalizado com setas e pode caminhar-se um troço curto a partir de Candasnos ou de Fraga. São caminhos sem sombra e com poucos serviços entre povoações: leve água de sobra e evite as horas de calor no verão."},"src":"https://caminoignaciano.org/19-20/","sources":["https://caminoignaciano.org/19-20/","https://www.gronze.com/etapa/lleida/fraga","https://www.loc.wiki/hiking-trails/cami-de-sant-jaume-camino-de-santiago-de-fraga-a-zaragoza-con-los-tracks-individualizados-por-tramo-40322403","https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597168","https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597252"],"art":{"es":[{"h":"Historia","t":"Desde la Edad Media, peregrinos de Cataluña y del Mediterráneo cruzaban el Bajo Cinca camino de Santiago. El Camino Catalán, o Camí de Sant Jaume, entra en Aragón por Fraga, después de una etapa de unos 33 kilómetros desde Lérida, y sigue hacia Candasnos, Peñalba, Bujaraloz, Pina y Zaragoza.\n\nEn la comarca quedan huellas de esa hospitalidad: el priorato de Santa María de Chalamera atendía a peregrinos en otra variante del camino, y la ermita de San Gregorio de Ontiñena fue albergue en la Edad Media.\n\nLos peregrinos medievales viajaban a pie, a veces durante meses, y dependían de la hospitalidad de monasterios, hospitales y ermitas. En tierras áridas como estas, cada pozo, cada balsa y cada albergue eran decisivos para continuar el viaje."},{"h":"Qué ver","t":"El Camino Ignaciano recorre el mismo territorio en sentido contrario, desde Loyola hacia Montserrat y Manresa, siguiendo el viaje que hizo San Ignacio en 1522. Una de sus etapas une Bujaraloz y Candasnos, unos 21 kilómetros pasando por Peñalba.\n\nEn Candasnos, la iglesia de la Asunción, con su mezcla de piedra románica y ladrillo gótico, es la parada natural del peregrino. Desde aquí el camino baja hacia la vega del Cinca y Fraga.\n\nSi solo quieres probar el camino, sal de Candasnos hacia Peñalba a primera hora y vuelve sobre tus pasos: en pocos kilómetros verás el paisaje que describen los peregrinos."},{"h":"El paisaje","t":"Entre Candasnos y Fraga el camino cruza la llanura de los Monegros: campos de cereal, granjas, algún canal y muy pocos árboles. Es un paisaje austero que muchos peregrinos recuerdan por su amplitud y su silencio.\n\nLa recompensa llega al final, cuando el terreno cae hacia el Cinca y aparece Fraga, con la torre de San Pedro sobre el río. Si caminas en verano, empieza al amanecer.\n\nEn días de viento, el cierzo sopla con fuerza en esta llanura: lleva ropa de abrigo incluso en primavera."}],"en":[{"h":"History","t":"Since the Middle Ages, pilgrims from Catalonia and the Mediterranean have crossed the Bajo Cinca on their way to Santiago. The Camino Catalán, or Camí de Sant Jaume (Catalan Way of St James), enters Aragón at Fraga, after a stage of about 33 kilometres from Lleida, and continues towards Candasnos, Peñalba, Bujaraloz, Pina and Zaragoza.\n\nTraces of that hospitality remain in the comarca: the priory of Santa María de Chalamera looked after pilgrims on another branch of the route, and the hermitage of San Gregorio in Ontiñena was a hostel in the Middle Ages.\n\nMedieval pilgrims travelled on foot, sometimes for months, and depended on the hospitality of monasteries, hospitals and hermitages. In arid lands like these, every well, every pond and every hostel was crucial to continuing the journey."},{"h":"What to see","t":"The Camino Ignaciano crosses the same territory in the opposite direction, from Loyola towards Montserrat and Manresa, following the journey St Ignatius made in 1522. One of its stages links Bujaraloz and Candasnos, about 21 kilometres via Peñalba.\n\nIn Candasnos, the church of La Asunción, with its mix of Romanesque stone and Gothic brick, is the pilgrim's natural stopping point. From here the route descends towards the Cinca floodplain and Fraga.\n\nIf you just want a taste of the route, set out from Candasnos towards Peñalba first thing in the morning and retrace your steps: within a few kilometres you will see the landscape the pilgrims describe."},{"h":"The landscape","t":"Between Candasnos and Fraga the route crosses the Monegros plain: cereal fields, farms, the odd canal and very few trees. It is an austere landscape that many pilgrims remember for its vastness and its silence.\n\nThe reward comes at the end, when the land drops towards the Cinca and Fraga appears, with the tower of San Pedro above the river. If you are walking in summer, start at dawn.\n\nOn windy days the cierzo (north-west wind) blows hard across this plain: take warm clothing even in spring."}],"fr":[{"h":"Histoire","t":"Depuis le Moyen Âge, des pèlerins de Catalogne et de la Méditerranée traversaient le Bajo Cinca en route vers Saint-Jacques. Le Chemin catalan, ou Camí de Sant Jaume, entre en Aragon par Fraga, après une étape d'environ 33 kilomètres depuis Lérida, et continue vers Candasnos, Peñalba, Bujaraloz, Pina et Saragosse.\n\nLa comarque conserve des traces de cette hospitalité : le prieuré de Santa María de Chalamera accueillait des pèlerins sur une autre variante du chemin, et l'ermitage de San Gregorio d'Ontiñena fut un refuge au Moyen Âge.\n\nLes pèlerins médiévaux voyageaient à pied, parfois pendant des mois, et dépendaient de l'hospitalité des monastères, des hôpitaux et des ermitages. Sur des terres arides comme celles-ci, chaque puits, chaque bassin et chaque refuge étaient décisifs pour poursuivre le voyage."},{"h":"À voir","t":"Le Camino Ignaciano parcourt le même territoire en sens inverse, de Loyola vers Montserrat et Manresa, sur les traces du voyage que fit saint Ignace en 1522. L'une de ses étapes relie Bujaraloz à Candasnos, environ 21 kilomètres en passant par Peñalba.\n\nÀ Candasnos, l'église de l'Asunción, avec son mélange de pierre romane et de brique gothique, est la halte naturelle du pèlerin. De là, le chemin descend vers la plaine du Cinca et Fraga.\n\nSi vous voulez seulement goûter au chemin, partez de Candasnos vers Peñalba tôt le matin et revenez sur vos pas : en quelques kilomètres, vous verrez le paysage que décrivent les pèlerins."},{"h":"Le paysage","t":"Entre Candasnos et Fraga, le chemin traverse la plaine des Monegros : champs de céréales, fermes, quelques canaux et très peu d'arbres. C'est un paysage austère dont beaucoup de pèlerins gardent le souvenir pour son immensité et son silence.\n\nLa récompense arrive à la fin, quand le terrain descend vers le Cinca et que Fraga apparaît, avec la tour de San Pedro au-dessus de la rivière. Si vous marchez en été, partez à l'aube.\n\nLes jours de vent, le cierzo souffle fort sur cette plaine : prévoyez des vêtements chauds, même au printemps."}],"de":[{"h":"Geschichte","t":"Seit dem Mittelalter durchquerten Pilger aus Katalonien und vom Mittelmeer den Bajo Cinca auf dem Weg nach Santiago. Der Camino Catalán oder Camí de Sant Jaume erreicht Aragón in Fraga, nach einer Etappe von etwa 33 Kilometern ab Lleida, und führt weiter nach Candasnos, Peñalba, Bujaraloz, Pina und Zaragoza.\n\nIn der Comarca gibt es Spuren dieser Gastfreundschaft: Das Priorat Santa María de Chalamera betreute Pilger auf einer anderen Variante des Weges, und die Einsiedelei San Gregorio in Ontiñena war im Mittelalter eine Herberge.\n\nDie mittelalterlichen Pilger reisten zu Fuß, manchmal monatelang, und waren auf die Gastfreundschaft von Klöstern, Hospitälern und Einsiedeleien angewiesen. In so trockenen Gegenden wie dieser waren jeder Brunnen, jeder Wasserspeicher und jede Herberge entscheidend, um die Reise fortzusetzen."},{"h":"Sehenswert","t":"Der Camino Ignaciano durchquert dasselbe Gebiet in umgekehrter Richtung, von Loyola nach Montserrat und Manresa, auf den Spuren der Reise, die der heilige Ignatius 1522 unternahm. Eine seiner Etappen verbindet Bujaraloz und Candasnos, etwa 21 Kilometer über Peñalba.\n\nIn Candasnos ist die Kirche de la Asunción mit ihrer Mischung aus romanischem Stein und gotischem Backstein der natürliche Halt für Pilger. Von hier aus führt der Weg hinunter in die Aue des Cinca und nach Fraga.\n\nWenn Sie den Weg nur ausprobieren möchten, brechen Sie früh am Morgen von Candasnos Richtung Peñalba auf und kehren Sie auf demselben Weg zurück: Schon nach wenigen Kilometern sehen Sie die Landschaft, die die Pilger beschreiben."},{"h":"Die Landschaft","t":"Zwischen Candasnos und Fraga durchquert der Weg die Ebene der Monegros: Getreidefelder, Höfe, hier und da ein Kanal und sehr wenige Bäume. Eine karge Landschaft, die vielen Pilgern wegen ihrer Weite und Stille in Erinnerung bleibt.\n\nDie Belohnung kommt am Ende, wenn das Gelände zum Cinca abfällt und Fraga mit dem Turm von San Pedro über dem Fluss auftaucht. Wenn Sie im Sommer gehen, brechen Sie im Morgengrauen auf.\n\nAn windigen Tagen bläst der Cierzo, der Nordwestwind, kräftig über diese Ebene: Nehmen Sie selbst im Frühjahr warme Kleidung mit."}],"pt":[{"h":"História","t":"Desde a Idade Média, peregrinos da Catalunha e do Mediterrâneo atravessavam o Bajo Cinca a caminho de Santiago. O Caminho Catalão, ou Camí de Sant Jaume, entra em Aragão por Fraga, depois de uma etapa de cerca de 33 quilómetros desde Lérida, e segue para Candasnos, Peñalba, Bujaraloz, Pina e Saragoça.\n\nNa comarca restam marcas dessa hospitalidade: o priorado de Santa María de Chalamera acolhia peregrinos noutra variante do caminho, e a ermida de San Gregorio de Ontiñena foi albergue na Idade Média.\n\nOs peregrinos medievais viajavam a pé, por vezes durante meses, e dependiam da hospitalidade de mosteiros, hospitais e ermidas. Em terras áridas como estas, cada poço, cada charca e cada albergue eram decisivos para continuar a viagem."},{"h":"O que ver","t":"O Caminho Inaciano percorre o mesmo território em sentido contrário, de Loyola em direção a Montserrat e Manresa, seguindo a viagem que Santo Inácio fez em 1522. Uma das suas etapas une Bujaraloz e Candasnos, cerca de 21 quilómetros passando por Peñalba.\n\nEm Candasnos, a igreja da Asunción, com a sua mistura de pedra românica e tijolo gótico, é a paragem natural do peregrino. Daqui o caminho desce em direção à várzea do Cinca e a Fraga.\n\nSe quiser apenas experimentar o caminho, saia de Candasnos em direção a Peñalba logo de manhã e volte pelos seus passos: em poucos quilómetros verá a paisagem que os peregrinos descrevem."},{"h":"A paisagem","t":"Entre Candasnos e Fraga o caminho atravessa a planície dos Monegros: campos de cereais, quintas, algum canal e muito poucas árvores. É uma paisagem austera que muitos peregrinos recordam pela sua amplitude e pelo seu silêncio.\n\nA recompensa chega no fim, quando o terreno desce para o Cinca e aparece Fraga, com a torre de San Pedro sobre o rio. Se caminhar no verão, comece ao amanhecer.\n\nEm dias de vento, o cierzo (vento do noroeste) sopra com força nesta planície: leve roupa de abrigo mesmo na primavera."}]},"status":"pending"}],"towns":[{"name":"Fraga","lat":41.52068,"lon":0.35163},{"name":"Mequinenza","lat":41.37417,"lon":0.3025},{"name":"Ballobar","lat":41.62047,"lon":0.19199},{"name":"Belver de Cinca","lat":41.68333,"lon":0.21389},{"name":"Candasnos","lat":41.50209,"lon":0.06217},{"name":"Chalamera","lat":41.66479,"lon":0.16294},{"name":"Ontiñena","lat":41.67619,"lon":0.08918},{"name":"Osso de Cinca","lat":41.665,"lon":0.19083},{"name":"Torrente de Cinca","lat":41.46667,"lon":0.33333},{"name":"Velilla de Cinca","lat":41.58684,"lon":0.26203},{"name":"Zaidín","lat":41.6,"lon":0.26667}],"context":[],"routes":[{"id":"castillos-del-cinca","cat":"patrimonio","mode":"car","stops":["torre-frailes","san-pedro-fraga","castillo-fraga","villa-fortunatus","san-valero-velilla","murallas-zaidin","santa-maria-chalamera"],"name":{"es":"Castillos y templos del Cinca","en":"Castles and churches of the Cinca","fr":"Châteaux et églises du Cinca","de":"Burgen und Kirchen am Cinca","pt":"Castelos e templos do Cinca"},"summary":{"es":"Un día remontando el Cinca de sur a norte: fortalezas de la frontera andalusí, la Fraga medieval, una villa romana y el románico de Chalamera.","en":"A day travelling up the Cinca from south to north: fortresses of the Andalusi frontier, medieval Fraga, a Roman villa and the Romanesque of Chalamera.","fr":"Une journée à remonter le Cinca du sud au nord : forteresses de la frontière andalouse, la Fraga médiévale, <script>
(function(){
"use strict";
if(!window.L){var mw=document.getElementById("mapwrap");if(mw) mw.innerHTML='<div class="maperr">No se ha podido cargar el mapa. Comprueba la conexión y recarga la página.</div>';return;}
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LANGS=[["es","ES","es-ES"],["en","EN","en-GB"],["fr","FR","fr-FR"],["de","DE","de-DE"],["pt","PT","pt-PT"]];
const SP=(DATA&&DATA.storePrefix)||"";
const store={get(k){try{return localStorage.getItem(SP+k)}catch(e){return null}},set(k,v){try{localStorage.setItem(SP+k,v)}catch(e){}}};
let lang=store.get("rbx-lang")||((navigator.language||"es").slice(0,2));
if(!LANGS.some(l=>l[0]===lang)) lang="es";
const t=(k,vars)=>{let s=(I18N[lang]&&I18N[lang][k])??I18N.es[k]??k; if(vars) for(const v in vars) s=s.replace("{"+v+"}",vars[v]); return s;};
const L10=(o)=>o?(typeof o==="string"?o:(o[lang]||o.es||"")):"";
const nf=()=>new Intl.NumberFormat(lang==="en"?"en-GB":lang,{maximumFractionDigits:1});

const CATS=DATA.categories; // {id:{color:"--c-pat", icon:"svgpath"}}
const ICON=id=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${CATS[id].icon}</svg>`;
const POIS=DATA.pois, BYID=Object.fromEntries(POIS.map(p=>[p.id,p]));
const TOWNS=DATA.towns;
const PH=DATA.photos||{};
const imgURL=(f,w)=>"https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(f)+"?width="+w;
const IMG_BASE=DATA.imgBase||"img/";
const localImg=(key,w)=>IMG_BASE+key+(w<=330?"-s":"")+".jpg";
const GAL=DATA.gallery||{};
const galleryOf=id=>[id].concat(GAL[id]||[]).filter(k=>PH[k]);
const creditHTML=ph=>`${esc(t(ph.context?"photoContext":"photo"))}: <a href="${esc(ph.page)}" target="_blank" rel="noopener">${esc(ph.author)}</a> · ${esc(ph.license)} · ${esc(ph.via||"Wikimedia Commons")}`;
const clauses=txt=>txt.split(/(?<=,)\s+/).map(x=>`<span class="nb">${esc(x)}</span>`).join(" ");
function phHTML(key,cat,w,cls,credit){const ph=PH[key];const c=CATS[cat]?CATS[cat].color:"--accent";
  return `<div class="ph ${cls||""}" style="--c:var(${c})">${CATS[cat]?ICON(cat):""}${ph?`<img src="${localImg(key,w)}" data-fb="${esc(imgURL(ph.file,w))}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">`:""}${credit&&ph?`<span class="credit">${creditHTML(ph)}</span>`:""}</div>`;}
document.addEventListener("error",e=>{const el=e.target;if(!el||el.tagName!=="IMG") return;
  if(el.dataset.fb&&!el.dataset.tried){el.dataset.tried="1";el.src=el.dataset.fb;return;}
  if(el.closest(".ph,.gal,.lb")) el.classList.add("broken");},true);
const state={cats:new Set(Object.keys(CATS)),town:"",q:"",sel:null,route:null,tab:"explorar",intro:store.get("rbx-intro")!=="0",basemap:"ilustrado",me:null,ed:{id:null,lang:"es",draft:null},adding:false};
/* ---------- local edits (demo of the content editor) ---------- */
const EDIT_KEY="rbx-edits-v1";
let EDITS={};try{EDITS=JSON.parse(store.get(EDIT_KEY)||"{}")||{};}catch(e){EDITS={};}
EDITS.byId=EDITS.byId||{};EDITS.added=Array.isArray(EDITS.added)?EDITS.added:[];
function saveEdits(){store.set(EDIT_KEY,JSON.stringify(EDITS));}

/* ---------- distance ---------- */
function hav(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lon-a.lon);const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}

/* ---------- toast ---------- */
let toastT;function toast(msg){let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);}el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},2600);}

/* ---------- map ---------- */
const map=L.map("map",{zoomControl:true,attributionControl:true,minZoom:9,maxZoom:18,zoomSnap:.25,
  maxBounds:DATA.maxBounds||[[40.85,-1.2],[41.95,0.45]],maxBoundsViscosity:.8,preferCanvas:false});
map.attributionControl.setPrefix(false);
const baseAttr=DATA.baseAttr||'Límites municipales: IGN-CNIG';
map.attributionControl.addAttribution(baseAttr);
const panes={};["base","river","routes","labels"].forEach((n,i)=>{panes[n]=map.createPane(n);panes[n].style.zIndex=350+i*10;});
panes.stops=map.createPane("stops");panes.stops.style.zIndex=650;panes.stops.style.pointerEvents="none";
panes.labels.style.pointerEvents="none";
const muniLayers={};
const HASBASE=!!(BASE&&BASE.features&&BASE.features.length);
const baseLayer=L.geoJSON(HASBASE?BASE:{type:"FeatureCollection",features:[]},{pane:"base",interactive:false,filter:f=>!f.properties.river,
  style:f=>f.properties.outline?{className:"comarca-outline",fill:false}:{className:"muni"+(f.properties.c?"":" out")},
  onEachFeature:(f,l)=>{if(f.properties.c) muniLayers[f.properties.n]=l;}}).addTo(map);
const riverFeat=HASBASE?BASE.features.find(f=>f.properties.river):null;
if(riverFeat){
  const ll=riverFeat.geometry.coordinates.map(c=>[c[1],c[0]]);
  L.polyline(ll,{pane:"river",className:"river-halo",interactive:false,smoothFactor:1}).addTo(map);
  L.polyline(ll,{pane:"river",className:"river",interactive:false,smoothFactor:1}).addTo(map);
}
// town & context labels
TOWNS.forEach(tw=>L.marker([tw.lat,tw.lon],{pane:"labels",interactive:false,keyboard:false,icon:L.divIcon({className:"",html:`<span class="town-label${tw.minor?" minor":""}">${esc(tw.name)}</span>`,iconSize:null})}).addTo(map));
(DATA.context||[]).forEach(tw=>L.marker([tw.lat,tw.lon],{pane:"labels",interactive:false,keyboard:false,icon:L.divIcon({className:"",html:`<span class="town-label out">${esc(tw.name)}</span>`,iconSize:null})}).addTo(map));
if(DATA.riverLabel) L.marker(DATA.riverLabel,{pane:"labels",interactive:false,keyboard:false,icon:L.divIcon({className:"",html:`<span class="river-label">${esc(DATA.riverName||"EBRO")}</span>`,iconSize:null})}).addTo(map);

const homeBounds=(()=>{if(DATA.fitPois) return L.latLngBounds(POIS.map(p=>[p.lat,p.lon]).concat(TOWNS.filter(t=>!t.minor).map(t=>[t.lat,t.lon]))).pad(0.08);
  if(HASBASE){const o=baseLayer.getLayers().find(l=>l.feature.properties.outline);return (o||baseLayer).getBounds();}
  return L.latLngBounds(POIS.map(p=>[p.lat,p.lon])).pad(0.15);})();
map.fitBounds(homeBounds,{padding:[16,16]});
map.setMaxZoom(15);

// basemaps (only used where the hosting allows external map tiles)
const TILES={
  mapa:{url:"https://www.ign.es/wmts/ign-base?layer=IGNBaseTodo&style=default&tilematrixset=GoogleMapsCompatible&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/png&TileMatrix={z}&TileCol={x}&TileRow={y}",opt:{maxZoom:18,attribution:'Mapa base © <a href="https://www.ign.es">IGN</a>'}},
  ortofoto:{url:"https://www.ign.es/wmts/pnoa-ma?layer=OI.OrthoimageCoverage&style=default&tilematrixset=GoogleMapsCompatible&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/jpeg&TileMatrix={z}&TileCol={x}&TileRow={y}",opt:{maxZoom:19,attribution:'PNOA © <a href="https://www.ign.es">IGN</a>'}}
};
let tileLayer=null;
function setBasemap(k,silent){
  state.basemap=k; $$(".layerbox button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.k===k)));
  if(tileLayer){map.removeLayer(tileLayer);tileLayer=null;}
  $("#map").classList.remove("tiles-on");
  if(k==="ilustrado"){map.setMaxZoom(15);return;}
  map.setMaxZoom(18);
  const def=TILES[k]; let ok=0,bad=0,decided=false;
  tileLayer=L.tileLayer(def.url,def.opt);
  tileLayer.on("tileload",()=>{ok++; if(!decided){decided=true;$("#map").classList.add("tiles-on");}});
  tileLayer.on("tileerror",()=>{bad++; if(!decided&&bad>=3&&HASBASE){decided=true;map.removeLayer(tileLayer);tileLayer=null;state.basemap="ilustrado";map.setMaxZoom(15);$("#map").classList.remove("tiles-on");$$(".layerbox button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.k==="ilustrado")));if(!silent) toast(t("tilesBlocked"));}});
  tileLayer.addTo(map); tileLayer.bringToBack();
}
const isPhone=()=>!!(window.matchMedia&&window.matchMedia("(max-width:760px)").matches);
const PHONE=window.matchMedia&&window.matchMedia("(max-width:760px)").matches;
const LayerCtl=L.Control.extend({options:{position:PHONE?"bottomleft":"topright"},onAdd(){const d=L.DomUtil.create("div","layerbox");L.DomEvent.disableClickPropagation(d);
  d.innerHTML=["mapa","ortofoto"].concat(HASBASE?["ilustrado"]:[]).map(k=>`<button type="button" data-k="${k}" aria-pressed="${k===state.basemap}"></button>`).join("");
  d.addEventListener("click",e=>{const b=e.target.closest("button");if(b) setBasemap(b.dataset.k);});return d;}});
map.addControl(new LayerCtl());
const LegendCtl=L.Control.extend({options:{position:"bottomright"},onAdd(){const d=L.DomUtil.create("div","legend");d.id="legend";return d;}});
map.addControl(new LegendCtl());

/* markers */
const markers={};
function pinIcon(p){return L.divIcon({className:"",html:`<div class="pin" style="--c:var(${CATS[p.cat].color})">${ICON(p.cat)}</div>`,iconSize:[30,30],iconAnchor:[4,30],popupAnchor:[11,-30]});}
function addMarker(p){
  const m=L.marker([p.lat,p.lon],{keyboard:true,title:L10(p.name),riseOnHover:true,icon:pinIcon(p)});
  m.on("click",()=>{if(state.adding){map.fire("click",{latlng:m.getLatLng()});return;} openPlace(p.id,{fly:false});});
  m.addTo(map); markers[p.id]=m;
}
POIS.forEach(addMarker);
function pinEl(id){const m=markers[id];return m&&m.getElement()?m.getElement().querySelector(".pin"):null;}
function visible(p){
  if(!state.cats.has(p.cat)) return false;
  if(state.town&&p.town!==state.town) return false;
  if(state.q){const q=norm(state.q);const hay=norm(L10(p.name)+" "+p.town+" "+L10(p.desc)+" "+t("cat_"+p.cat));if(!hay.includes(q)) return false;}
  return true;
}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}
function refreshMarkers(){
  const inRoute=state.route?new Set(DATA.routes.find(r=>r.id===state.route).stops):null;
  POIS.forEach(p=>{const m=markers[p.id];const show=inRoute?inRoute.has(p.id):visible(p);
    if(show&&!map.hasLayer(m)) m.addTo(map); if(!show&&map.hasLayer(m)) map.removeLayer(m);
    const el=pinEl(p.id); if(el) el.classList.toggle("sel",state.sel===p.id);});
  Object.entries(muniLayers).forEach(([n,l])=>{const el=l.getElement&&l.getElement();if(el) el.classList.toggle("hl",state.town===n);});
}

/* ---------- route drawing ---------- */
let routeGroup=L.layerGroup().addTo(map);
function drawRoute(r){
  routeGroup.clearLayers(); if(!r) return;
  const pts=r.stops.map(id=>BYID[id]).map(p=>[p.lat,p.lon]);
  const color=`var(${CATS[r.cat].color})`;
  const line=L.polyline(pts,{pane:"routes",className:"route-line",interactive:false});
  routeGroup.addLayer(line);
  setTimeout(()=>{const el=line.getElement();if(el) el.style.setProperty("--c",color);},0);
  r.stops.forEach((id,i)=>{const p=BYID[id];routeGroup.addLayer(L.marker([p.lat,p.lon],{pane:"stops",interactive:false,keyboard:false,icon:L.divIcon({className:"",html:`<div class="stopnum">${i+1}</div>`,iconSize:[0,0]})}));});
  map.flyToBounds(L.latLngBounds(pts),{padding:[50,50],duration:.8,maxZoom:15});
}
function routeStats(r){let km=0;const legs=[];for(let i=1;i<r.stops.length;i++){const d=hav(BYID[r.stops[i-1]],BYID[r.stops[i]])*1.25;legs.push(d);km+=d;}
  const speed={walk:4,bike:14,car:55}[r.mode];const mins=Math.round(km/speed*60+r.stops.length*(r.mode==="car"?35:20));return {km,legs,mins};}
function gmapsRoute(r){const pts=r.stops.map(id=>BYID[id]).map(p=>p.lat+","+p.lon);const mode={walk:"walking",bike:"bicycling",car:"driving"}[r.mode];
  return "https://www.google.com/maps/dir/?api=1&origin="+pts[0]+"&destination="+pts.at(-1)+(pts.length>2?"&waypoints="+encodeURIComponent(pts.slice(1,-1).join("|")):"")+"&travelmode="+mode;}
function fmtDur(m){const h=Math.floor(m/60),mm=m%60;return h?`${h} h${mm?" "+mm+" min":""}`:`${mm} min`;}

function nearMe(){
  if(state.me){state.me=null;if(meMarker){map.removeLayer(meMarker);meMarker=null;}renderExplore();return;}
  if(!navigator.geolocation){toast(t("locErr"));return;}
  toast(t("locating"));

    state.me={lat:pos.coords.latitude,lon:pos.coords.longitude};

    const tt=$(".toast");if(tt) tt.hidden=true;

const OFF_OK=()=>!!(window.RBX_SW&&"serviceWorker" in navigator&&"caches" in window);
const offKey=()=>"rbx-offline-"+lang;

function offlineCardHTML(){if(!OFF_OK()) return "";const done=store.get(offKey())==="1";
  return `<div class="offcard"><div class="offic">${svgI(done?"check":"download")}</div><div class="stack" style="gap:3px;min-width:0;flex:1">
   <b>${esc(t(done?"offDone":"offTitle"))}</b><span class="small">${esc(t(done?"offDoneText":"offText"))}</span>${(/iPhone|iPad|iPod/.test(navigator.userAgent)&&!(navigator.standalone))?`<span class="small" style="color:var(--ink)">${esc(t("offIos"))}</span>`:""}
   <div class="offbar" id="offbar" hidden><i></i></div></div>
   ${done?"":`<button type="button" class="btn primary sm" id="offgo">${esc(t("offBtn"))}</button>`}</div>`;}
function bindOffline(){const b=$("#offgo");if(!b) return;b.onclick=async()=>{
  b.disabled=true;const bar=$("#offbar");bar.hidden=false;const fill=bar.querySelector("i");
  const L=offlineList();let n=0,bad=0;const next=()=>L.shift();
  const worker=async()=>{let u;while((u=next())){try{const r=await fetch(u);if(!r.ok) bad++;else await r.blob();}catch(e){bad++;}n++;fill.style.width=(100*n/(n+L.length))+"%";b.textContent=Math.round(100*n/(n+L.length))+" %";}};
  await Promise.all([worker(),worker(),worker(),worker()]);
  if(bad>8){toast(t("offFail"));b.disabled=false;b.textContent=t("offBtn");return;}
  store.set(offKey(),"1");track("descarga",lang);toast(t("offDone"));renderHome();};}

let LB={list:[],i:0};
function openLightbox(list,i){if(!list.length) return;LB={list,i};let el=$("#lb");
  if(!el){el=document.createElement("div");el.id="lb";el.className="lb";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");document.body.appendChild(el);
    el.addEventListener("click",e=>{if(e.target.closest(".x")||e.target===el||e.target.classList.contains("stage")) closeLightbox();else if(e.target.closest(".p")) lbGo(-1);else if(e.target.closest(".n2")) lbGo(1);});
    let x0=null;el.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;},{passive:true});
    el.addEventListener("touchend",e=>{if(x0==null) return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>45) lbGo(dx<0?1:-1);x0=null;});}
  el.hidden=false;drawLightbox();}
function drawLightbox(){const el=$("#lb");const k=LB.list[LB.i];const ph=PH[k];const n=LB.list.length;
  el.innerHTML=`<button type="button" class="x" aria-label="${esc(t("close"))}">×</button>
   <div class="stage">${n>1?`<button type="button" class="nav p" aria-label="‹">‹</button>`:""}<img src="${localImg(k,960)}" data-fb="${esc(imgURL(ph.file,960))}" alt="" referrerpolicy="no-referrer">${n>1?`<button type="button" class="nav n2" aria-label="›">›</button>`:""}</div>
   <div class="bar"><span class="n">${LB.i+1} / ${n}</span><span>${creditHTML(ph)}</span></div>`;
  const nx=LB.list[(LB.i+1)%n];if(nx&&n>1){const im=new Image();im.src=localImg(nx,960);}}
function lbGo(d){const n=LB.list.length;LB.i=(LB.i+d+n)%n;drawLightbox();}
function closeLightbox(){const el=$("#lb");if(el) el.hidden=true;}
document.addEventListener("keydown",e=>{const el=$("#lb");if(!el||el.hidden) return;
  if(e.key==="Escape"){e.stopPropagation();closeLightbox();}else if(e.key==="ArrowRight") lbGo(1);else if(e.key==="ArrowLeft") lbGo(-1);},true);

const audioURL=(id,l)=>(DATA.audioBase||"audio/")+l+"/"+id+".mp3";
const fmtT=s=>{if(!isFinite(s)||s<0) s=0;const m=Math.floor(s/60),x=Math.round(s%60);return m+":"+String(x).padStart(2,"0");};
function playerHTML(p){const on=audKey===lang+"/"+p.id&&!AUD.paused||ttsOn;
  return `<div class="player" id="player"><button type="button" class="pp" id="pp" aria-label="${esc(t(on?"pause":"listen"))}">${svgI(on?"pause":"play")}</button>
   <div class="mid"><div class="lbl"><span>${esc(t("audioguide"))} · ${({es:"Español",en:"English",fr:"Français",de:"Deutsch",pt:"Português"})[lang]}</span><span id="ptime">${audKey===lang+"/"+p.id?fmtT(AUD.currentTime)+" / "+fmtT(AUD.duration):""}</span></div>
   <div class="track" id="ptrack"><i id="pbar" style="width:${audKey===lang+"/"+p.id&&AUD.duration?(100*AUD.currentTime/AUD.duration):0}%"></i></div></div>
   <button type="button" class="spd" id="pspd" aria-label="${esc(t("speed"))}">${audRate===1?"1×":audRate+"×"}</button></div>`;}
function bindPlayer(p){
  $("#pp").onclick=()=>toggleAudio(p);
  $("#pspd").onclick=()=>{audRate=audRate===1?1.25:audRate===1.25?0.85:1;AUD.playbackRate=audRate;$("#pspd").textContent=audRate+"×";};
  $("#ptrack").onclick=e=>{if(audKey!==lang+"/"+p.id||!AUD.duration) return;const r=e.currentTarget.getBoundingClientRect();AUD.currentTime=AUD.duration*Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));};
}
function updPlayer(){const pt=$("#ptime"),pb=$("#pbar");if(!pt||!pb||!state.sel||audKey!==lang+"/"+state.sel) return;
  pt.textContent=fmtT(AUD.currentTime)+" / "+fmtT(AUD.duration);pb.style.width=(AUD.duration?100*AUD.currentTime/AUD.duration:0)+"%";}
function setPP(on){const b=$("#pp");if(b){b.innerHTML=svgI(on?"pause":"play");b.setAttribute("aria-label",t(on?"pause":"listen"));}}
AUD.addEventListener("timeupdate",updPlayer);AUD.addEventListener("loadedmetadata",updPlayer);
AUD.addEventListener("play",()=>setPP(true));AUD.addEventListener("pause",()=>setPP(false));
AUD.addEventListener("ended",()=>{setPP(false);AUD.currentTime=0;updPlayer();});
AUD.addEventListener("error",()=>{if(!audKey) return;const [l,id]=audKey.split("/");audKey=null;const p=BYID[id];if(p&&l===lang) speakTTS(p);});
function toggleAudio(p){
  if(ttsOn){stopAudio();return;}
  const key=lang+"/"+p.id;
  if(audKey===key){if(AUD.paused){AUD.playbackRate=audRate;AUD.play().catch(()=>{});}else AUD.pause();return;}
  stopAudio();audKey=key;AUD.src=audioURL(p.id,lang);track("audio",p.id);AUD.playbackRate=audRate;
  AUD.play().catch(err=>{if(err&&err.name==="NotAllowedError") return;});
  setPP(true);
}
function stopAudio(){try{AUD.pause();}catch(e){}audKey=null;if(ttsOn){try{speechSynthesis.cancel();}catch(e){}ttsOn=false;}setPP(false);const pt=$("#ptime"),pb=$("#pbar");if(pt) pt.textContent="";if(pb) pb.style.width="0";}
/* Respaldo: voz del dispositivo, solo si existe en el idioma elegido (nunca leer francés con voz española). */
function bestVoice(code){const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];const base=code.slice(0,2);
  const c=vs.filter(v=>(v.lang||"").replace("_","-").toLowerCase().startsWith(base));if(!c.length) return null;
  const score=v=>{const n=v.name||"";let s=0;if(/natural|neural/i.test(n)) s+=50;if(/online/i.test(n)) s+=20;if(/premium|enhanced|mejorada|siri/i.test(n)) s+=30;if(/google/i.test(n)) s+=15;
    if((v.lang||"").replace("_","-").toLowerCase()===code.toLowerCase()) s+=10;if(/compact|espeak/i.test(n)) s-=30;return s;};
  return c.sort((a,b)=>score(b)-score(a))[0];}
function speakTTS(p){
  if(!("speechSynthesis" in window)){toast(t("noAudio"));setPP(false);return;}
  const go=()=>{const code=LANGS.find(l=>l[0]===lang)[2];const v=bestVoice(code);
    if(!v){toast(t("noVoice"));setPP(false);return;}
    const txt=[L10(p.name),L10(p.desc),L10(p.more)].filter(Boolean).join(". ");
    const parts=txt.match(/[^.!?;]+[.!?;]*/g)||[txt];speechSynthesis.cancel();ttsOn=true;setPP(true);
    parts.forEach((s,i)=>{const u=new SpeechSynthesisUtterance(s.trim());u.voice=v;u.lang=v.lang;u.rate=.95*audRate;
      if(i===parts.length-1) u.onend=()=>{ttsOn=false;setPP(false);};u.onerror=()=>{ttsOn=false;setPP(false);};speechSynthesis.speak(u);});};
  if(speechSynthesis.getVoices().length) go(); else {let done=false;const f=()=>{if(done) return;done=true;go();};speechSynthesis.addEventListener("voiceschanged",f,{once:true});setTimeout(f,900);}
}

function qrInto(el,text){try{const q=qrcode(0,"M");q.addData(text);q.make();el.innerHTML=q.createSvgTag({cellSize:3,margin:0,scalable:true});const s=el.querySelector("svg");if(s){s.querySelectorAll("rect").forEach(r=>{if((r.getAttribute("fill")||"").toLowerCase()==="#ffffff"||r.getAttribute("fill")==="white") r.setAttribute("fill","#fff");});s.setAttribute("role","img");s.setAttribute("aria-label","QR");}}catch(e){el.textContent="QR";}}
function copyText(s){const done=()=>toast(t("copied"));try{navigator.clipboard.writeText(s).then(done,()=>fallbackCopy(s,done));}catch(e){fallbackCopy(s,done);}}
function fallbackCopy(s,done){const ta=document.createElement("textarea");ta.value=s;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy");}catch(e){}document.body.removeChild(ta);if(ok) done(); else toast(s);}
function svgI(n){const P={audio:'<path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="1.5"/>',nav:'<path d="M3 11 21 3l-8 18-2-8-8-2z"/>',link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',map:'<path d="m9 4-6 3v13l6-3 6 3 6-3V4l-6 3-6-3z"/><path d="M9 4v13M15 7v13"/>',locate:'<circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/><circle cx="12" cy="12" r="7.5"/>',plus:'<path d="M12 5v14M5 12h14"/>',undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',check:'<path d="m5 12 5 5 9-10"/>',download:'<path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/>',book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5"/>',play:'<path d="M8 5.5v13l11-6.5z" fill="currentColor"/>',pause:'<rect x="6.5" y="5.5" width="3.5" height="13" rx="1" fill="currentColor"/><rect x="14" y="5.5" width="3.5" height="13" rx="1" fill="currentColor"/>',stamp:'<circle cx="12" cy="12" r="8.5"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',cal:'<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',photos:'<rect x="3" y="5" width="14" height="12" rx="2"/><path d="M7 21h12a2 2 0 0 0 2-2V9"/><circle cx="8" cy="9.5" r="1.5"/><path d="m3 15 4-3 4 3 3-2 3 2"/>'};
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;}

function b64utf8(s){const b=new TextEncoder().encode(s);let x="";for(let i=0;i<b.length;i+=8192) x+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(x);}
let PUBCFG=null;
const ub=buf=>{const u=new Uint8Array(buf);let s="";for(let i=0;i<u.length;i++) s+=String.fromCharCode(u[i]);return btoa(s);};
const bu=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pbk(pass,salt,it){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:it,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);}
async function sealToken(tok,pass){const it=310000,salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},await pbk(pass,salt,it),new TextEncoder().encode(tok));
  return {v:1,kdf:"PBKDF2-SHA256",it,salt:ub(salt),iv:ub(iv),ct:ub(ct)};}
async function unlockToken(pass){
  if(!PUBCFG){try{const r=await fetch("publish.json",{cache:"no-store"});if(r.ok) PUBCFG=await r.json();}catch(e){}}
  if(!PUBCFG||!PUBCFG.ct) throw new Error("nocfg");
  try{const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:bu(PUBCFG.iv)},await pbk(pass,bu(PUBCFG.salt),PUBCFG.it||310000),bu(PUBCFG.ct));return new TextDecoder().decode(pt);}
  catch(e){throw new Error("pass");}}
async function ghPut(tok,path,text,message){const P=DATA.publish||{};if(!P.repo) throw new Error("sin repositorio");
  const api=`https://api.github.com/repos/${P.repo}/contents/${(P.path||"")+path}`;const br=P.branch||"main";
  const h={Authorization:"Bearer "+tok,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  let sha;const g=await fetch(api+"?ref="+br,{headers:h,cache:"no-store"});if(g.ok) sha=(await g.json()).sha; else if(g.status!==404) throw new Error("HTTP "+g.status);
  const body={message,content:b64utf8(text),branch:br};if(sha) body.sha=sha;
  const r=await fetch(api,{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},h),body:JSON.stringify(body)});
  if(!r.ok) throw new Error("HTTP "+r.status);}

function mergeL(a,b){return Object.assign({},a||{},b||{});}
function applyPoiPatch(id,e){const p=BYID[id];if(!p||!e) return;
  ["name","desc","visit"].forEach(k=>{if(e[k]) p[k]=mergeL(p[k],e[k]);});
  if(e.status) p.status=e.status;
  if(e.cat&&CATS[e.cat]&&e.cat!==p.cat){p.cat=e.cat;if(markers[p.id]) markers[p.id].setIcon(pinIcon(p));}}
function addPoi(a){if(!a||!a.id||BYID[a.id]||!CATS[a.cat]) return;POIS.push(a);BYID[a.id]=a;if(typeof markers!=="undefined"&&!markers[a.id]) addMarker(a);}
function applyContent(c){if(!c||typeof c!=="object") return;
  (c.added||[]).forEach(addPoi);
  Object.keys(c.pois||{}).forEach(id=>applyPoiPatch(id,c.pois[id]));
  if(Array.isArray(c.avisos)) AVISOS=c.avisos.slice();
  if(Array.isArray(c.eventos)) EVENTS=c.eventos.slice();
  if(Array.isArray(c.negocios)) NEGOCIOS=c.negocios.slice();
  if(c.premio) PREMIO=c.premio;}
function applyLocal(){EDITS.added.forEach(addPoi);Object.keys(EDITS.byId).forEach(id=>applyPoiPatch(id,EDITS.byId[id]));
  if(Array.isArray(EDITS.avisos)) AVISOS=EDITS.avisos.slice();
  if(Array.isArray(EDITS.eventos)) EVENTS=EDITS.eventos.slice();
  if(EDITS.premio) PREMIO=EDITS.premio;}
function hasLocal(){return !!(Object.keys(EDITS.byId).length||EDITS.added.length||EDITS.avisos||EDITS.eventos||EDITS.premio);}
function buildContent(){const pois={};
  Object.keys(REMOTE.pois||{}).forEach(id=>pois[id]=Object.assign({},REMOTE.pois[id]));
  Object.keys(EDITS.byId).forEach(id=>{const a=pois[id]||{},b=EDITS.byId[id];pois[id]=Object.assign({},a,b,{name:mergeL(a.name,b.name),desc:mergeL(a.desc,b.desc),visit:mergeL(a.visit,b.visit)});});
  const added=(REMOTE.added||[]).filter(a=>!EDITS.added.some(b=>b.id===a.id)).concat(EDITS.added);
  const c={version:1,updated:new Date().toISOString(),pois,added,avisos:AVISOS};
  if(EDITS.eventos||REMOTE.eventos) c.eventos=EVENTS;
  if(PREMIO&&L10(PREMIO)) c.premio=PREMIO;
  return c;}

   ${PREMIO&&L10(PREMIO)?`<div class="aviso prize"><b>${esc(t("passPrize"))}</b><span>${esc(L10(PREMIO))}</span></div>`:""}
   <div class="stack" style="gap:8px"><h3>${esc(t("passRoutes"))}</h3>
    ${routes.map(({r,k})=>`<button type="button" class="prow" data-r="${r.id}" style="--c:var(${CATS[r.cat].color})"><span class="t">${esc(L10(r.name))}</span><span class="pbar"><i style="width:${(k/r.stops.length*100).toFixed(0)}%"></i></span><span class="small">${k===r.stops.length?"✓ "+esc(t("passDone")):k+" / "+r.stops.length}</span></button>`).join("")}</div>
   <div class="stack" style="gap:6px"><h3>${esc(t("passAll"))}</h3>
    ${towns.map(tn=>`<div class="group-h">${esc(tn)}<span>${POIS.filter(p=>p.town===tn&&PASS[p.id]).length} / ${POIS.filter(p=>p.town===tn).length}</span></div>
     <div class="stamps">${POIS.filter(p=>p.town===tn).map(p=>`<button type="button" class="stamp${PASS[p.id]?" on":""}" data-id="${p.id}" style="--c:var(${CATS[p.cat].color})" aria-label="${esc(L10(p.name))}${PASS[p.id]?" · "+esc(t("passStamped")):""}"><span class="seal" aria-hidden="true">${PASS[p.id]?ICON(p.cat):""}</span><span class="nm">${esc(L10(p.name))}</span></button>`).join("")}</div>`).join("")}</div>
   <div class="card stack" style="gap:8px"><h3>${esc(t("passDiploma"))}</h3>
    <p class="small">${esc(t(canDiploma?"passDiplomaText":"passDiplomaLocked"))}</p>
    ${canDiploma?`<div class="field"><label for="dip-name">${esc(t("passYourName"))}</label><input id="dip-name" maxlength="40" autocomplete="name"></div>
    <button type="button" class="btn primary" id="dip-go" style="align-self:flex-start">${svgI("download")}<span>${esc(t("passDiplomaBtn"))}</span></button>`:""}</div>`;
  v.onclick=e=>{const b=e.target.closest("[data-id]");if(b){openPlace(b.dataset.id);return;}
    const r=e.target.closest("[data-r]");if(r){state.route=r.dataset.r;setTab("rutas",false);setHash("r-"+state.route);drawRoute(DATA.routes.find(x=>x.id===state.route));refreshMarkers();}};
  const g=$("#dip-go");if(g) g.onclick=()=>diploma(($("#dip-name").value||"").trim());
}
function diploma(name){
  const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const cs=getComputedStyle(document.documentElement);const col=v=>(cs.getPropertyValue(v)||"").trim()||"#17646C";
  x.fillStyle="#F7F4EC";x.fillRect(0,0,W,H);
  x.strokeStyle="#17646C";x.lineWidth=6;x.strokeRect(40,40,W-80,H-80);x.lineWidth=2;x.strokeRect(58,58,W-116,H-116);
  x.strokeStyle="#5B9BD5";x.lineWidth=10;x.lineCap="round";x.beginPath();x.moveTo(120,300);x.bezierCurveTo(330,200,420,380,600,300);x.bezierCurveTo(760,230,860,330,960,270);x.stroke();
  x.fillStyle="#18221E";x.textAlign="center";
  x.font="700 30px system-ui,sans-serif";x.fillText("COMARCA DEL BAJO CINCA / BAIX CINCA",W/2,150);
  x.font="700 76px Georgia,serif";x.fillText(t("passDipTitle"),W/2,410);
  x.font="400 34px system-ui,sans-serif";x.fillStyle="#56635D";x.fillText(t("passDipFor"),W/2,490);
  x.fillStyle="#18221E";x.font="700 60px Georgia,serif";x.fillText(name||t("passDipAnon"),W/2,570);
  const n=nStamps();x.font="400 36px system-ui,sans-serif";x.fillStyle="#18221E";x.fillText(t("passDipCount",{n,N:POIS.length}),W/2,645);
  const done=DATA.routes.filter(routeDone);
  x.font="400 28px system-ui,sans-serif";x.fillStyle="#56635D";
  done.slice(0,3).forEach((r,i)=>x.fillText("✓ "+L10(r.name),W/2,705+i*40));
  const cols=9,sz=58,gap=16,gx=(W-(cols*sz+(cols-1)*gap))/2,gy=840;
  POIS.slice(0,45).forEach((p,i)=>{const cx=gx+(i%cols)*(sz+gap)+sz/2,cy=gy+Math.floor(i/cols)*(sz+gap)+sz/2;
    x.beginPath();x.arc(cx,cy,sz/2-4,0,Math.PI*2);
    if(PASS[p.id]){x.fillStyle=col(CATS[p.cat].color);x.fill();}else{x.setLineDash([6,6]);x.strokeStyle="#B9C2BD";x.lineWidth=3;x.stroke();x.setLineDash([]);}});
  x.fillStyle="#56635D";x.font="400 24px system-ui,sans-serif";x.fillText(new Date().toLocaleDateString(LANGS.find(l=>l[0]===lang)[2],{day:"numeric",month:"long",year:"numeric"}),W/2,H-100);
  c.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="pasaporte-ribera-baja.png";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);track("diploma");},"image/png");
}

/* ---------- Agenda, dónde comer y dormir ---------- */
const MONTHS=m=>new Date(2026,m-1,15).toLocaleDateString(LANGS.find(l=>l[0]===lang)[2],{month:"long"});
function evOrder(e){const now=new Date();const cm=now.getMonth()+1;
  if(e.date){const d=new Date(e.date+"T12:00:00");const diff=(d-now)/864e5;return diff>=-1?diff:9999+diff;}
  const m=e.month||12;return ((m-cm+12)%12)*30.5;}
function renderAgenda(){
  const v=$("#v-agenda");const towns=[...new Set(TOWNS.map(x=>x.name))].sort((a,b)=>a.localeCompare(b,"es"));
  const f=state.agTown||"";const ev=EVENTS.filter(e=>!f||e.mun===f).filter(e=>!(e.date&&e.date<today())).sort((a,b)=>evOrder(a)-evOrder(b));
  const neg=NEGOCIOS.filter(n=>!f||n.mun===f);
  const types=[...new Set(neg.map(n=>n.type))];
  v.innerHTML=`<div class="stack" style="gap:4px"><div class="eyebrow">${esc(t("tabAgenda"))}</div><h2>${esc(t("agTitle"))}</h2><p class="lede">${esc(t("agIntro"))}</p></div>
   ${avisosHTML()}
   <div class="field"><label for="ag-town">${esc(t("fTown"))}</label><select id="ag-town"><option value="">${esc(t("allTowns"))}</option>${towns.map(x=>`<option ${x===f?"selected":""}>${esc(x)}</option>`).join("")}</select></div>
   <div class="stack" style="gap:8px"><h3>${esc(t("agEvents"))}</h3>
   ${ev.length?ev.map(e=>`<article class="ev">${e.date?`<div class="cal" aria-hidden="true"><span>${esc(new Date(e.date+"T12:00:00").toLocaleDateString(LANGS.find(l=>l[0]===lang)[2],{month:"short"}).replace(".",""))}</span><b>${+e.date.slice(8,10)}</b></div>`:`<div class="cal m" aria-hidden="true"><b>${esc(MONTHS(e.month).slice(0,3).replace(".",""))}</b></div>`}
     <div class="stack" style="gap:3px;min-width:0"><b>${esc(L10(e.name))}</b><span class="small"><b style="color:var(--ink)">${esc(e.mun)}</b> · ${esc(L10(e.when))}</span>${L10(e.desc)?`<p>${esc(L10(e.desc))}</p>`:""}${e.src?`<a class="small" href="${esc(e.src)}" target="_blank" rel="noopener">${esc(t("source"))}</a>`:""}</div></article>`).join(""):`<p class="small">${esc(t("agNone"))}</p>`}
   <p class="note">${esc(t("agNote"))}</p></div>
   ${neg.length?`<div class="stack" style="gap:8px"><h3>${esc(t("agStay"))}</h3>
    ${types.map(ty=>`<div class="group-h">${esc(t("neg_"+ty)||ty)}<span>${neg.filter(n=>n.type===ty).length}</span></div>${neg.filter(n=>n.type===ty).map(n=>`<div class="neg"><div class="stack" style="gap:2px;min-width:0"><b>${esc(n.name)}</b><span class="small">${esc(n.mun)}${n.addr?" · "+esc(n.addr):""}${n.cat?" · "+esc(n.cat):""}</span></div>${n.lat?`<a class="btn sm" href="https://www.google.com/maps/dir/?api=1&destination=${n.lat},${n.lon}" target="_blank" rel="noopener" aria-label="${esc(t("directions"))}: ${esc(n.name)}">${svgI("nav")}</a>`:""}</div>`).join("")}`).join("")}
    <p class="note">${esc(t("agStayNote"))}</p></div>`:""}
   <div class="card stack" style="gap:6px"><h3>${esc(t("agBiz"))}</h3><p class="small">${esc(t("agBizText"))}</p>
    ${DATA.contact?`<div class="actions">${DATA.contact.tel?`<a class="btn" href="tel:${esc(DATA.contact.tel.replace(/\s/g,""))}">${esc(DATA.contact.tel)}</a>`:""}${DATA.contact.web?`<a class="btn" href="${esc(DATA.contact.web)}" target="_blank" rel="noopener">${esc(t("agWeb"))}</a>`:""}</div>`:""}</div>`;
  $("#ag-town").onchange=e=>{state.agTown=e.target.value;renderAgenda();};
}

function nextEventText(){const e=EVENTS.filter(e=>!(e.date&&e.date<today())).sort((a,b)=>evOrder(a)-evOrder(b))[0];return e?t("agNext",{x:L10(e.name)+" · "+e.mun}):t("agCtaText");}
/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang=lang;
  $$("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));
  $("#langs").innerHTML=LANGS.map(([k,lab])=>`<button type="button" data-l="${k}" aria-pressed="${k===lang}" lang="${k}">${lab}</button>`).join("");
  $$(".layerbox button").forEach(b=>b.textContent=t("base_"+b.dataset.k));
  $("#legend").innerHTML=Object.keys(CATS).map(c=>`<div style="--c:var(${CATS[c].color})"><i></i>${esc(t("cat_"+c))}</div>`).join("");
  POIS.forEach(p=>{const el=markers[p.id].getElement();if(el) el.setAttribute("title",L10(p.name));});
  stopAudio();
  render(state.tab);
}
$("#langs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.l;store.set("rbx-lang",lang);applyLang();});
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.tab==="explorar") state.sel=null;setTab(b.dataset.tab);});
setBasemap("mapa",true);
function zoomClasses(){const z=map.getZoom(),el=$("#map");el.classList.toggle("zlow",z<11.4);el.classList.toggle("zfar",z<12);}
map.on("zoomend",zoomClasses);zoomClasses();

/* ---------- cover ---------- */
function showCover(){
  let seen=false;try{seen=sessionStorage.getItem(SP+"rbx-cover")==="1";}catch(e){}
  if(seen) return;
  const c=$("#cover");const key=DATA.coverPhoto||"rueda";const ph=PH[key];
  const draw=()=>{c.innerHTML=`${phHTML(key,"patrimonio",1280)}<div class="shade"></div>
    <div class="brandc"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="rgba(255,255,255,.16)"/><path d="M4 22c5-1 6-7 11-7s5 9 10 9 4-6 5-7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="23" cy="10" r="2.6" fill="#fff"/></svg><span>Bajo Cinca Explora</span></div>
    <div class="clangs">${LANGS.map(([k,lab])=>`<button type="button" data-l="${k}" aria-pressed="${k===lang}">${lab}</button>`).join("")}</div>
    <div class="in"><div class="kick">${esc(t("coverKicker"))}</div><h1>${clauses(t("coverTitle"))}</h1><p>${esc(t("coverText"))}</p>
    <div class="row2"><button type="button" class="cbtn main" id="c-go">${esc(t("coverCta"))}</button><button type="button" class="cbtn" id="c-routes">${esc(t("coverRoutes"))}</button></div></div>
    ${ph?`<div class="credit">${esc(t("photo"))}: <a href="${esc(ph.page)}" target="_blank" rel="noopener">${esc(ph.author)}</a> · ${esc(ph.license)}</div>`:""}`;
    $("#c-go").onclick=()=>hideCover("inicio");$("#c-routes").onclick=()=>hideCover("rutas");
    $(".clangs",c).onclick=e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.l;store.set("rbx-lang",lang);applyLang();draw();};};
  draw();c.hidden=false;
  setTimeout(()=>{const g=$("#c-go");if(g) g.focus();},50);
}
function hideCover(tab){const c=$("#cover");c.hidden=true;c.innerHTML="";try{sessionStorage.setItem(SP+"rbx-cover","1");}catch(e){}
  if(tab&&tab!==state.tab) setTab(tab);setTimeout(()=>map.invalidateSize(),30);}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#cover").hidden) hideCover();});

/* ---------- hash routing ---------- */
function fromHash(){
  const h=(location.hash||"").slice(1);
  if(h&&!$("#cover").hidden){const c=$("#cover");c.hidden=true;c.innerHTML="";setTimeout(()=>map.invalidateSize(),30);}
  if(h.startsWith("p-")&&BYID[h.slice(2)]){state.sel=h.slice(2);track("ficha",state.sel);const p=BYID[state.sel];setTab("lugar",false);map.setView([p.lat,p.lon],14);return;}
  if(h.startsWith("r-")&&DATA.routes.some(r=>r.id===h.slice(2))){state.route=h.slice(2);setTab("rutas",false);drawRoute(DATA.routes.find(r=>r.id===state.route));return;}
  if(h.startsWith("s-")&&BYID[h.slice(2)]){const id=h.slice(2);track("qr",id);const got=stamp(id,"qr");state.sel=id;const p=BYID[id];setTab("lugar",false);setHash("p-"+id);map.setView([p.lat,p.lon],14);if(got) toast(t("passGot"));return;}
  if(h==="guias"){setTab("agenda",false);return;}
  if(["inicio","explorar","rutas","agenda","pasaporte","gestion"].includes(h)){setTab(h,false);return;}
  setTab("inicio",false);showCover();
}
window.addEventListener("hashchange",fromHash);
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(state.adding){stopAdding();if(state.tab==="gestion")renderAdmin();return;}const bk=$("#back")||$("#rback");if(bk&&!e.target.closest("input,textarea,select"))bk.click();});
applyLocal();
applyLang();
fromHash();
loadRemote().then(ok=>{if(ok){render(state.tab);refreshMarkers();}});
setTimeout(()=>map.invalidateSize(),60);
(function(){const b=$("#tomap"),mw=$("#mapwrap");if(!b||!mw) return;
  b.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
  const upd=()=>{const r=mw.getBoundingClientRect();if(isPhone()&&r.bottom<60) b.removeAttribute("data-off"); else b.setAttribute("data-off","");};
  window.addEventListener("scroll",upd,{passive:true});window.addEventListener("resize",upd);upd();})();
window.addEventListener("resize",()=>map.invalidateSize());
})();
</script>
