gem pelo caminho de sirga, e mineiros das minas próximas.\n\nAs barragens de Mequinenza e de Ribarroja mudaram tudo. No final dos anos 60 a maior parte da vila foi demolida e os habitantes mudaram-se para o novo núcleo. Entre o pouco que ficou de pé está a escola María Quintana, inaugurada em 1929, que hoje acolhe os museus."},{"h":"O que ver","t":"Reconhecem-se as ruas e os alicerces da igreja de Nuestra Señora de la Asunción, de 1803, cuja torre também caiu com as máquinas. A rota literária passa pelo Muro, que servia de dique e cais; pela casa natal de Jesús Moncada; pela Plaza de Armas; pela Calle de las Brujas (rua das Bruxas), a mais estreita; e pelo antigo campo de futebol, que inundava muitas vezes.\n\nJunto aos museus verá um llaut, um barco que podia carregar cerca de 30 toneladas de carvão, e uma turbina hidroelétrica de 420 toneladas: os dois ofícios que marcaram a história da vila."}]},"status":"pending"},{"id":"museo-mina-mequinenza","town":"Mequinenza","cat":"museo","lat":41.36153,"lon":0.29333,"coord_src":null,"q":["Museo de la Mina, Mequinenza","Museos de Mequinenza"],"fq":["Museo de la Mina Mequinenza","Museos de Mequinenza","Mequinenza mine museum"],"name":{"es":"Museo de la Mina y Museos de Mequinenza","en":"Mine Museum and Museums of Mequinenza","fr":"Musée de la Mine et Musées de Mequinenza","de":"Bergbaumuseum und Museen von Mequinenza","pt":"Museu da Mina e Museus de Mequinenza"},"when":{"es":"Más de siglo y medio de minería · Museo","en":"Over 150 years of mining · Museum","fr":"Plus d'un siècle et demi de mines · Musée","de":"Über 150 Jahre Bergbau · Museum","pt":"Mais de século e meio de mineração · Museu"},"desc":{"es":"Más de un kilómetro de galerías subterráneas para entender cómo se sacaba el carbón en Mequinenza. En el mismo edificio están el Museo de la Historia y el del Pasado Prehistórico, con recreaciones del arte rupestre de la zona.","en":"More than a kilometre of underground galleries to understand how coal was dug in Mequinenza. The same building houses the History Museum and the Prehistoric Past Museum, with reconstructions of the area's rock art.","fr":"Plus d'un kilomètre de galeries souterraines pour comprendre comment on extrayait le charbon à Mequinenza. Le même bâtiment abrite le Musée de l'Histoire et le Musée du Passé préhistorique, avec des reconstitutions de l'art rupestre de la région.","de":"Mehr als ein Kilometer unterirdischer Stollen, um zu verstehen, wie in Mequinenza Kohle gefördert wurde. Im selben Gebäude liegen das Geschichtsmuseum und das Museum der Vorgeschichte mit Nachbildungen der Felskunst der Gegend.","pt":"Mais de um quilómetro de galerias subterrâneas para perceber como se extraía o carvão em Mequinenza. No mesmo edifício ficam o Museu da História e o do Passado Pré-histórico, com recriações da arte rupestre da zona."},"visit":{"es":"Están en la avenida María Quintana, en el Pueblo Viejo. La mina se recorre en visita guiada, con casco. Los horarios cambian según la temporada: confírmalos en la web de los Museos de Mequinenza o en la oficina de turismo. Calcula al menos dos horas para los tres museos.","en":"They are on Avenida María Quintana, in the Old Town. The mine is visited on a guided tour, wearing a helmet. Opening times vary by season: check them on the Museos de Mequinenza website or at the tourist office. Allow at least two hours for the three museums.","fr":"Ils se trouvent avenue María Quintana, dans le Vieux Village. La mine se visite avec un guide, casque sur la tête. Les horaires varient selon la saison : vérifiez-les sur le site des Museos de Mequinenza ou à l'office de tourisme. Comptez au moins deux heures pour les trois musées.","de":"Sie liegen an der Avenida María Quintana im Alten Dorf. Das Bergwerk wird mit Führung und Helm besichtigt. Die Öffnungszeiten wechseln je nach Saison: auf der Website der Museos de Mequinenza oder im Tourismusbüro prüfen. Für alle drei Museen mindestens zwei Stunden einplanen.","pt":"Ficam na avenida María Quintana, na Aldeia Velha. A mina percorre-se em visita guiada, com capacete. Os horários mudam consoante a época: confirme-os no site dos Museos de Mequinenza ou no posto de turismo. Conte com pelo menos duas horas para os três museus."},"src":"https://www.museosdemequinenza.com/wp-content/uploads/2018/05/Museos-de-Mequinenza-web.pdf","sources":["https://www.museosdemequinenza.com/wp-content/uploads/2018/05/Museos-de-Mequinenza-web.pdf","https://www.erih.net/i-want-to-go-there/site/mequinenza-mine-museum","https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5490366","https://es.wikipedia.org/wiki/Mequinenza"],"art":{"es":[{"h":"Historia","t":"El carbón marcó la vida de Mequinenza durante más de siglo y medio. Se sacaba de galerías bajo el pueblo y se embarcaba en el Ebro; la última mina de la zona cerró en 2014.\n\nEl museo enseña ese mundo desde dentro: cómo vivían y trabajaban los mineros y cómo cambiaron los métodos de extracción, de las herramientas manuales a las máquinas rozadoras y las cintas transportadoras."},{"h":"Qué ver","t":"La visita guiada recorre alrededor de un kilómetro de túneles, a pie y en vagoneta, entre máquinas, herramientas y fotografías de las minas de la comarca.\n\nEl Museo de la Historia repasa la villa desde los primeros pobladores, los asedios del castillo, los llaguts del Ebro y la obra de Jesús Moncada. El Museo del Pasado Prehistórico presenta el Neolítico y las Edades del Bronce y del Hierro, con recreaciones del poblado de Los Castellets y del abrigo de Vall Major."},{"h":"Para entenderlo","t":"Mequinenza conserva varios abrigos con arte rupestre del arco mediterráneo, Patrimonio Mundial de la UNESCO desde 1998. Los abrigos están repartidos por barrancos del término y no son de visita libre; el museo es la forma más cómoda de conocerlos."}],"en":[{"h":"History","t":"Coal shaped life in Mequinenza for more than a century and a half. It was dug from galleries under the town and loaded onto boats on the Ebro; the last mine in the area closed in 2014.\n\nThe museum shows that world from the inside: how the miners lived and worked, and how extraction methods changed, from hand tools to cutting machines and conveyor belts."},{"h":"What to see","t":"The guided tour covers around a kilometre of tunnels, on foot and by mine wagon, among machines, tools and photographs from the comarca's mines.\n\nThe History Museum tells the town's story from the first settlers, through the sieges of the castle and the llaguts of the Ebro, to the work of Jesús Moncada. The Prehistoric Past Museum covers the Neolithic and the Bronze and Iron Ages, with reconstructions of the Los Castellets settlement and the Vall Major rock shelter."},{"h":"Background","t":"Mequinenza has several rock shelters with rock art of the Mediterranean Basin, a UNESCO World Heritage Site since 1998. The shelters are scattered along ravines in the municipality and are not open to the public; the museum is the easiest way to discover them."}],"fr":[{"h":"Histoire","t":"Le charbon a rythmé la vie de Mequinenza pendant plus d'un siècle et demi. On l'extrayait de galeries sous le village et on le chargeait sur des bateaux sur l'Èbre ; la dernière mine de la zone a fermé en 2014.\n\nLe musée montre ce monde de l'intérieur : comment vivaient et travaillaient les mineurs et comment ont évolué les méthodes d'extraction, des outils à main aux haveuses et aux bandes transporteuses."},{"h":"À voir","t":"La visite guidée parcourt environ un kilomètre de tunnels, à pied et en wagonnet, parmi des machines, des outils et des photographies des mines de la comarque.\n\nLe Musée de l'Histoire retrace la ville depuis les premiers habitants, en passant par les sièges du château et les llaguts de l'Èbre, jusqu'à l'œuvre de Jesús Moncada. Le Musée du Passé préhistorique présente le Néolithique et les âges du bronze et du fer, avec des reconstitutions du village de Los Castellets et de l'abri de Vall Major."},{"h":"Pour comprendre","t":"Mequinenza conserve plusieurs abris ornés d'art rupestre du bassin méditerranéen, inscrit au patrimoine mondial de l'UNESCO depuis 1998. Les abris sont dispersés dans les ravins de la commune et ne sont pas en accès libre ; le musée est la façon la plus simple de les découvrir."}],"de":[{"h":"Geschichte","t":"Über anderthalb Jahrhunderte prägte die Kohle das Leben in Mequinenza. Sie wurde aus Stollen unter dem Ort gefördert und auf dem Ebro verschifft; die letzte Grube der Gegend schloss 2014.\n\nDas Museum zeigt diese Welt von innen: wie die Bergleute lebten und arbeiteten und wie sich die Abbaumethoden wandelten, vom Handwerkzeug bis zu Schrämmaschinen und Förderbändern."},{"h":"Sehenswert","t":"Die Führung verläuft durch rund einen Kilometer Stollen, zu Fuß und mit der Grubenbahn, vorbei an Maschinen, Werkzeugen und Fotos aus den Bergwerken der Comarca.\n\nDas Geschichtsmuseum erzählt vom Ort seit den ersten Siedlern, von den Belagerungen der Burg, den Llaguts auf dem Ebro und vom Werk Jesús Moncadas. Das Museum der Vorgeschichte zeigt Jungsteinzeit, Bronze- und Eisenzeit mit Nachbildungen der Siedlung Los Castellets und des Felsdachs von Vall Major."},{"h":"Zum Verständnis","t":"Mequinenza besitzt mehrere Felsdächer mit Felskunst aus dem Mittelmeerraum, seit 1998 UNESCO-Welterbe. Sie liegen verstreut in Schluchten der Gemeinde und sind nicht frei zugänglich; das Museum ist der bequemste Weg, sie kennenzulernen."}],"pt":[{"h":"História","t":"O carvão marcou a vida de Mequinenza durante mais de século e meio. Era extraído de galerias por baixo da vila e embarcado no Ebro; a última mina da zona fechou em 2014.\n\nO museu mostra esse mundo por dentro: como viviam e trabalhavam os mineiros e como mudaram os métodos de extração, das ferramentas manuais às máquinas roçadoras e às correias transportadoras."},{"h":"O que ver","t":"A visita guiada percorre cerca de um quilómetro de túneis, a pé e de vagoneta, entre máquinas, ferramentas e fotografias das minas da comarca.\n\nO Museu da História percorre a vila desde os primeiros povoadores, passando pelos cercos do castelo e pelos llaguts do Ebro, até à obra de Jesús Moncada. O Museu do Passado Pré-histórico apresenta o Neolítico e as Idades do Bronze e do Ferro, com recriações do povoado de Los Castellets e do abrigo de Vall Major."},{"h":"Para perceber","t":"Mequinenza conserva vários abrigos com arte rupestre do arco mediterrânico, Património Mundial da UNESCO desde 1998. Os abrigos estão espalhados por ravinas do concelho e não são de visita livre; o museu é a forma mais cómoda de os conhecer."}]},"status":"pending"},{"id":"aiguabarreig","town":"Mequinenza","cat":"naturaleza","lat":41.3617,"lon":0.30441,"coord_src":null,"q":["Aiguabarreig, Mequinenza","Confluencia Segre Ebro Mequinenza"],"fq":["Aiguabarreig","Aiguabarreig Segre Ebre","Mequinenza confluencia Segre Ebro"],"name":{"es":"Aiguabarreig: la unión de los ríos","en":"Aiguabarreig: where the rivers meet","fr":"Aiguabarreig : la rencontre des rivières","de":"Aiguabarreig: wo die Flüsse sich treffen","pt":"Aiguabarreig: a união dos rios"},"when":{"es":"Ebro, Segre y Cinca · Espacio natural","en":"Ebro, Segre and Cinca · Natural area","fr":"Èbre, Sègre et Cinca · Espace naturel","de":"Ebro, Segre und Cinca · Naturraum","pt":"Ebro, Segre e Cinca · Espaço natural"},"desc":{"es":"Aiguabarreig significa 'mezcla de aguas'. Aquí el Segre, que poco antes ha recibido al Cinca, se une al Ebro, en una de las mayores confluencias fluviales de la península, con amplios sotos de ribera y muchas aves.","en":"Aiguabarreig means 'mixing of waters'. Here the Segre, which has just received the Cinca, joins the Ebro in one of the largest river confluences in the Iberian Peninsula, with broad riverside woodland and plenty of birds.","fr":"Aiguabarreig signifie « mélange des eaux ». Ici, le Sègre, qui vient de recevoir le Cinca, rejoint l'Èbre, dans l'une des plus grandes confluences de la péninsule Ibérique, avec de vastes bois de rive et de nombreux oiseaux.","de":"Aiguabarreig bedeutet ‚Mischung der Wasser‘. Hier mündet der Segre, der kurz zuvor den Cinca aufgenommen hat, in den Ebro, an einem der größten Flusszusammenflüsse der Iberischen Halbinsel, mit weiten Auwäldern und vielen Vögeln.","pt":"Aiguabarreig significa 'mistura de águas'. Aqui o Segre, que pouco antes recebeu o Cinca, junta-se ao Ebro, numa das maiores confluências fluviais da Península Ibérica, com amplos bosques ribeirinhos e muitas aves."},"visit":{"es":"Se contempla desde el castillo, desde el Pueblo Viejo y desde el embarcadero de la Comarca frente a los restos antiguos. Es un espacio natural protegido: no salgas de los caminos y lleva prismáticos si te gustan las aves.","en":"It can be seen from the castle, from the Old Town and from the Comarca's landing stage opposite the old remains. It is a protected natural area: keep to the paths and bring binoculars if you like birds.","fr":"On l'admire depuis le château, depuis le Vieux Village et depuis l'embarcadère de la Comarque face aux anciens vestiges. C'est un espace naturel protégé : restez sur les chemins et apportez des jumelles si vous aimez les oiseaux.","de":"Zu sehen von der Burg, vom Alten Dorf und vom Bootssteg der Comarca gegenüber den alten Resten. Es ist ein Schutzgebiet: Bitte auf den Wegen bleiben und für Vogelbeobachtung ein Fernglas mitbringen.","pt":"Contempla-se a partir do castelo, da Aldeia Velha e do cais da Comarca em frente aos vestígios antigos. É um espaço natural protegido: não saia dos caminhos e leve binóculos se gosta de aves."},"src":"https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5490366","sources":["https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5490366","https://es.wikipedia.org/wiki/R%C3%ADo_Cinca","https://es.wikipedia.org/wiki/Mequinenza","https://es.wikipedia.org/wiki/Bajo_Cinca"],"art":{"es":[{"h":"El paisaje","t":"El Cinca baja desde el Pirineo, cruza toda la comarca y se une al Segre; el Segre, a su vez, desemboca en el Ebro en Mequinenza. El nombre catalán alude a la mezcla de aguas de colores distintos que se ve en el encuentro.\n\nEl embalse de Mequinenza, construido entre 1957 y 1964, y después el de Ribarroja cambiaron el paisaje y anegaron la parte baja del valle, pero en los alrededores siguen amplios bosques de ribera que dan refugio a garzas y otras muchas aves. Es Zona de Especial Protección para las Aves, y la Estación Biológica del Aiguabarreig trabaja en su conservación desde 1993."},{"h":"Qué ver","t":"Desde el castillo se entiende el mapa de un vistazo. Abajo, el embalse forma meandros con nombres propios, como La Tumba o La Herradura.\n\nEl río también se vive: Mequinenza es conocida por la pesca deportiva, sobre todo del siluro, un pez que puede pasar de los dos metros, y por su campo de regatas de remo. El embarcadero del proyecto Entre Ríos de la Comarca da acceso al agua."}],"en":[{"h":"The landscape","t":"The Cinca flows down from the Pyrenees, crosses the whole comarca and joins the Segre; the Segre in turn flows into the Ebro at Mequinenza. The Catalan name refers to the mixing of different-coloured waters that can be seen where they meet.\n\nThe Mequinenza reservoir, built between 1957 and 1964, and later the Ribarroja reservoir changed the landscape and flooded the lower valley, but the surrounding area still has extensive riverside woodland that shelters herons and many other birds. It is a Special Protection Area for Birds, and the Aiguabarreig Biological Station has been working on its conservation since 1993."},{"h":"What to see","t":"From the castle you can take in the whole map at a glance. Below, the reservoir forms meanders with names of their own, such as La Tumba and La Herradura.\n\nThe river is also for enjoying: Mequinenza is known for sport fishing, above all for wels catfish, a fish that can grow to over two metres, and for its rowing course. The landing stage built by the Comarca's Entre Ríos project gives access to the water."}],"fr":[{"h":"Le paysage","t":"Le Cinca descend des Pyrénées, traverse toute la comarque et rejoint le Sègre ; le Sègre, à son tour, se jette dans l'Èbre à Mequinenza. Le nom catalan évoque le mélange d'eaux de couleurs différentes que l'on voit à leur rencontre.\n\nLe barrage de Mequinenza, construit entre 1957 et 1964, puis celui de Ribarroja ont transformé le paysage et noyé le fond de la vallée, mais les environs conservent de vastes bois de rive qui abritent des hérons et bien d'autres oiseaux. C'est une Zone de protection spéciale pour les oiseaux, et la Station biologique de l'Aiguabarreig œuvre à sa conservation depuis 1993."},{"h":"À voir","t":"Depuis le château, on saisit la carte d'un coup d'œil. En contrebas, la retenue forme des méandres aux noms bien à eux, comme La Tumba ou La Herradura.\n\nLa rivière se vit aussi : Mequinenza est connue pour la pêche sportive, surtout celle du silure, un poisson qui peut dépasser deux mètres, et pour son bassin d'aviron. L'embarcadère du projet Entre Ríos de la Comarque donne accès à l'eau."}],"de":[{"h":"Die Landschaft","t":"Der Cinca kommt aus den Pyrenäen, durchquert die ganze Comarca und mündet in den Segre; der Segre wiederum fließt bei Mequinenza in den Ebro. Der katalanische Name bezieht sich auf das Vermischen der verschiedenfarbigen Wasser, das man an der Mündung sieht.\n\nDer zwischen 1957 und 1964 gebaute Stausee von Mequinenza und später der von Ribarroja haben die Landschaft verändert und den unteren Talboden überflutet, doch ringsum gibt es noch ausgedehnte Auwälder, in denen Reiher und viele andere Vögel Zuflucht finden. Das Gebiet ist Vogelschutzgebiet, und die Biologische Station Aiguabarreig setzt sich seit 1993 für seinen Erhalt ein."},{"h":"Sehenswert","t":"Von der Burg aus erfasst man die ganze Karte auf einen Blick. Unten bildet der Stausee Mäander mit eigenen Namen wie La Tumba oder La Herradura.\n\nDer Fluss lässt sich auch erleben: Mequinenza ist bekannt für das Sportangeln, vor allem auf Welse, die über zwei Meter lang werden können, und für seine Ruderregattastrecke. Der Bootssteg des Projekts Entre Ríos der Comarca bietet Zugang zum Wasser."}],"pt":[{"h":"A paisagem","t":"O Cinca desce dos Pirenéus, atravessa toda a comarca e junta-se ao Segre; o Segre, por sua vez, desagua no Ebro em Mequinenza. O nome catalão alude à mistura de águas de cores diferentes que se vê no encontro.\n\nA albufeira de Mequinenza, construída entre 1957 e 1964, e depois a de Ribarroja mudaram a paisagem e inundaram a parte baixa do vale, mas nos arredores continuam amplos bosques ribeirinhos que dão abrigo a garças e muitas outras aves. É Zona de Proteção Especial para as Aves, e a Estação Biológica do Aiguabarreig trabalha na sua conservação desde 1993."},{"h":"O que ver","t":"Do castelo percebe-se o mapa de relance. Lá em baixo, a albufeira forma meandros com nomes próprios, como La Tumba ou La Herradura.\n\nO rio também se vive: Mequinenza é conhecida pela pesca desportiva, sobretudo do siluro, um peixe que pode ultrapassar os dois metros, e pela sua pista de regatas de remo. O cais do projeto Entre Ríos da Comarca dá acesso à água."}]},"status":"pending"},{"id":"santa-maria-chalamera","town":"Chalamera","cat":"patrimonio","lat":41.67877,"lon":0.15002,"coord_src":null,"q":["Ermita de Santa María de Chalamera","Santa María de Chalamera"],"fq":["Ermita de Santa María de Chalamera","Chalamera ermita Santa María","Chalamera Santa María románico"],"name":{"es":"Santa María de Chalamera","en":"Santa María de Chalamera","fr":"Santa María de Chalamera","de":"Santa María de Chalamera","pt":"Santa María de Chalamera"},"when":{"es":"Siglos XII-XIII · Románico","en":"12th-13th centuries · Romanesque","fr":"XIIe-XIIIe siècles · Roman","de":"12.-13. Jahrhundert · Romanik","pt":"Séculos XII-XIII · Românico"},"desc":{"es":"Una iglesia románica sobre un cerro, entre el Cinca y el Alcanadre. Aunque todos la llaman ermita, fue la iglesia de un priorato benedictino y acogió a peregrinos del Camino de Santiago.","en":"A Romanesque church on a hill between the Cinca and the Alcanadre. Although everyone calls it a hermitage, it was the church of a Benedictine priory and welcomed pilgrims on the Way of St James.","fr":"Une église romane sur une colline, entre le Cinca et l'Alcanadre. Bien que tout le monde l'appelle ermitage, ce fut l'église d'un prieuré bénédictin, qui accueillait les pèlerins du chemin de Saint-Jacques.","de":"Eine romanische Kirche auf einem Hügel zwischen Cinca und Alcanadre. Obwohl alle sie Einsiedelei nennen, war sie die Kirche eines Benediktinerpriorats und nahm Pilger auf dem Jakobsweg auf.","pt":"Uma igreja românica sobre um cerro, entre o Cinca e o Alcanadre. Embora todos lhe chamem ermida, foi a igreja de um priorado beneditino e acolheu peregrinos do Caminho de Santiago."},"visit":{"es":"Está a las afueras de Chalamera, sobre un cerro al oeste del pueblo. El exterior se ve libremente; para entrar hay que llamar al Ayuntamiento de Chalamera. Calcula 45 minutos con el paseo.","en":"It is on the outskirts of Chalamera, on a hill west of the village. The outside can be seen freely; to go inside, phone Chalamera town hall. Allow 45 minutes including the walk.","fr":"Elle se trouve à la sortie de Chalamera, sur une colline à l'ouest du village. L'extérieur se voit librement ; pour entrer, il faut appeler la mairie de Chalamera. Comptez 45 minutes avec la promenade.","de":"Sie liegt am Rand von Chalamera auf einem Hügel westlich des Dorfes. Von außen frei zu sehen; für einen Besuch des Inneren das Rathaus von Chalamera anrufen. Mit Spaziergang 45 Minuten einplanen.","pt":"Fica nos arredores de Chalamera, num cerro a oeste da aldeia. O exterior vê-se livremente; para entrar é preciso telefonar à câmara municipal de Chalamera. Conte com 45 minutos com o passeio."},"src":"https://www.boe.es/boe/dias/1976/04/29/pdfs/A08382-08383.pdf","sources":["https://www.boe.es/boe/dias/1976/04/29/pdfs/A08382-08383.pdf","https://revistas.iea.es/index.php/ARG/article/view/2168/2159","https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597168","https://es.wikipedia.org/wiki/Chalamera"],"art":{"es":[{"h":"Historia","t":"Hacia el año 1100 la iglesia de Chalamera se entregó para fundar una comunidad benedictina dependiente del monasterio de Alaón. Los monjes se asentaron probablemente después de la conquista de Fraga y Lérida en 1149, y en los años siguientes se empezó la iglesia románica.\n\nEl priorato tuvo priores desde 1163 hasta el siglo XVII y en 1748 pasó al Seminario de Lérida. En 1223 el papa Honorio III lo puso bajo protección pontificia. Fue también hospital y lugar de paso de peregrinos, en el Camino de Santiago catalán. En 1976 se declaró monumento histórico-artístico."},{"h":"Qué ver","t":"La iglesia tiene planta de cruz latina, ábside semicircular y una cúpula octogonal sobre el crucero. La portada oeste tiene seis arquivoltas y capiteles con animales, aves, guerreros y cabezas humanas.\n\nDentro destaca el frontal de altar, con dos leones que sostienen un crismón, tallado por una mano distinta y más antigua que la de los capiteles. Del claustro y del monasterio, junto al muro sur, solo quedan cimientos. Fuera, mira el paisaje: los dos ríos y la llanura del Bajo Cinca."}],"en":[{"h":"History","t":"Around the year 1100 the church of Chalamera was handed over to found a Benedictine community dependent on the monastery of Alaón. The monks probably settled after the conquest of Fraga and Lleida in 1149, and the Romanesque church was begun in the years that followed.\n\nThe priory had priors from 1163 until the 17th century, and in 1748 it passed to the Seminary of Lleida. In 1223 Pope Honorius III placed it under papal protection. It was also a hospital and a stopping place for pilgrims on the Catalan Way of St James. In 1976 it was declared a historic-artistic monument."},{"h":"What to see","t":"The church has a Latin-cross plan, a semicircular apse and an octagonal dome over the crossing. The west doorway has six archivolts and capitals with animals, birds, warriors and human heads.\n\nInside, the highlight is the altar frontal, with two lions holding up a Chi-Rho, carved by a different and older hand than the capitals. Of the cloister and the monastery, by the south wall, only the foundations remain. Outside, take in the landscape: the two rivers and the plain of the Bajo Cinca."}],"fr":[{"h":"Histoire","t":"Vers l'an 1100, l'église de Chalamera fut cédée pour fonder une communauté bénédictine dépendant du monastère d'Alaón. Les moines s'y installèrent sans doute après la conquête de Fraga et de Lérida en 1149, et l'église romane fut commencée dans les années suivantes.\n\nLe prieuré eut des prieurs de 1163 jusqu'au XVIIe siècle et passa en 1748 au Séminaire de Lérida. En 1223, le pape Honorius III le plaça sous protection pontificale. Ce fut aussi un hôpital et une étape pour les pèlerins, sur le chemin de Saint-Jacques catalan. En 1976, il fut déclaré monument historique et artistique."},{"h":"À voir","t":"L'église a un plan en croix latine, une abside semi-circulaire et une coupole octogonale sur la croisée. Le portail ouest compte six voussures et des chapiteaux ornés d'animaux, d'oiseaux, de guerriers et de têtes humaines.\n\nÀ l'intérieur, remarquez le devant d'autel, avec deux lions soutenant un chrisme, sculpté par une main différente et plus ancienne que celle des chapiteaux. Du cloître et du monastère, contre le mur sud, il ne reste que les fondations. Dehors, regardez le paysage : les deux rivières et la plaine du Bajo Cinca."}],"de":[{"h":"Geschichte","t":"Um das Jahr 1100 wurde die Kirche von Chalamera zur Gründung einer Benediktinergemeinschaft übergeben, die vom Kloster Alaón abhing. Die Mönche ließen sich wohl erst nach der Eroberung von Fraga und Lleida 1149 nieder, und in den folgenden Jahren begann der Bau der romanischen Kirche.\n\nDas Priorat hatte Prioren von 1163 bis ins 17. Jahrhundert und ging 1748 an das Priesterseminar von Lleida. 1223 stellte Papst Honorius III. es unter päpstlichen Schutz. Es war auch Hospital und Pilgerstation am katalanischen Jakobsweg. 1976 wurde es zum historisch-künstlerischen Denkmal erklärt."},{"h":"Sehenswert","t":"Die Kirche hat einen lateinischen Kreuzgrundriss, eine halbrunde Apsis und eine achteckige Kuppel über der Vierung. Das Westportal hat sechs Archivolten und Kapitelle mit Tieren, Vögeln, Kriegern und menschlichen Köpfen.\n\nIm Inneren fällt das Antependium auf, mit zwei Löwen, die ein Christusmonogramm tragen, gearbeitet von einer anderen, älteren Hand als die Kapitelle. Vom Kreuzgang und Kloster an der Südmauer sind nur Fundamente erhalten. Draußen lohnt der Blick über die beiden Flüsse und die Ebene des Bajo Cinca."}],"pt":[{"h":"História","t":"Por volta do ano 1100 a igreja de Chalamera foi entregue para fundar uma comunidade beneditina dependente do mosteiro de Alaón. Os monges instalaram-se provavelmente depois da conquista de Fraga e Lérida em 1149, e nos anos seguintes começou a igreja românica.\n\nO priorado teve priores desde 1163 até ao século XVII e em 1748 passou para o Seminário de Lérida. Em 1223 o papa Honório III colocou-o sob proteção pontifícia. Foi também hospital e local de passagem de peregrinos, no Caminho de Santiago catalão. Em 1976 foi declarado monumento histórico-artístico."},{"h":"O que ver","t":"A igreja tem planta em cruz latina, abside semicircular e uma cúpula octogonal sobre o cruzeiro. O portal oeste tem seis arquivoltas e capitéis com animais, aves, guerreiros e cabeças humanas.\n\nNo interior destaca-se o frontal de altar, com dois leões que seguram um crismón, esculpido por uma mão diferente e mais antiga do que a dos capitéis. Do claustro e do mosteiro, junto à parede sul, só restam os alicerces. Lá fora, aprecie a paisagem: os dois rios e a planície do Bajo Cinca."}]},"status":"pending"},{"id":"castillo-torrente","town":"Torrente de Cinca","cat":"patrimonio","lat":41.4728,"lon":0.33267,"coord_src":null,"q":["Castillo de Torrente de Cinca","Castillo, Torrente de Cinca"],"fq":["Castillo de Torrente de Cinca","Torrente de Cinca castillo","Torrent de Cinca castell"],"name":{"es":"Castillo de Torrente de Cinca","en":"Torrente de Cinca Castle","fr":"Château de Torrente de Cinca","de":"Burg von Torrente de Cinca","pt":"Castelo de Torrente de Cinca"},"when":{"es":"Origen andalusí · Encomienda hospitalaria","en":"Andalusi origin · Hospitaller commandery","fr":"Origine andalouse · Commanderie hospitalière","de":"Andalusischer Ursprung · Johanniterkommende","pt":"Origem andaluza · Comenda hospitalária"},"desc":{"es":"Los restos de una fortaleza sobre un risco, justo encima de las últimas casas de Torrente. Nació en época andalusí, cuando el Cinca era frontera, y fue durante siglos encomienda de la orden del Hospital.","en":"The remains of a fortress on a crag just above the last houses of Torrente. It was founded in the Andalusi period, when the Cinca was a frontier, and for centuries it was a commandery of the Order of the Hospital.","fr":"Les restes d'une forteresse sur un escarpement, juste au-dessus des dernières maisons de Torrente. Elle naquit à l'époque andalouse, quand le Cinca était une frontière, et fut pendant des siècles une commanderie de l'ordre de l'Hôpital.","de":"Die Reste einer Festung auf einem Felsen, direkt über den letzten Häusern von Torrente. Sie entstand in andalusischer Zeit, als der Cinca Grenzfluss war, und war jahrhundertelang eine Kommende des Johanniterordens.","pt":"Os restos de uma fortaleza sobre um penhasco, mesmo por cima das últimas casas de Torrente. Nasceu na época andaluza, quando o Cinca era fronteira, e foi durante séculos comenda da Ordem do Hospital."},"visit":{"es":"Se sube a pie desde el centro del pueblo. Los restos se ven por fuera; ten cuidado en los bordes del risco. Calcula media hora.","en":"Walk up from the village centre. The remains are seen from outside; take care near the edges of the crag. Allow half an hour.","fr":"On y monte à pied depuis le centre du village. Les vestiges se voient de l'extérieur ; attention aux bords de l'escarpement. Comptez une demi-heure.","de":"Zu Fuß vom Ortszentrum hinauf. Die Reste sind von außen zu sehen; an den Felskanten bitte vorsichtig sein. Eine halbe Stunde einplanen.","pt":"Sobe-se a pé a partir do centro da aldeia. Os restos veem-se por fora; tenha cuidado nas bordas do penhasco. Conte com meia hora."},"src":"https://www.enciclopedia.cat/EC-CATROM-2631901","sources":["https://www.enciclopedia.cat/EC-CATROM-2631901","https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597482","https://es.wikipedia.org/wiki/Bajo_Cinca"],"art":{"es":[{"h":"Historia","t":"Por el tipo de obra y la cerámica, el castillo se considera de origen islámico, de no más tarde del siglo XI. Torrente estaba en territorio musulmán y el río marcaba la línea de defensa frente a la orilla cristiana.\n\nEn 1149 pasó a manos cristianas, junto con Fraga, y hacia 1157 el conde de Pallars, señor de Fraga, lo convirtió en castillo con término propio. Hacia 1174-1175 su señorío se entregó a la orden del Hospital, que convirtió Torrente en una encomienda hasta el siglo XIX. En las guerras carlistas el castillo volvió a tener guarnición."},{"h":"Qué ver","t":"La muralla sigue la forma de la roca, de unos 45 metros de largo. En el lado sur queda una torre rectangular que protegía la única puerta, y en la parte alta oeste se conserva un aljibe con bóveda de cañón.\n\nEn el pueblo, la iglesia barroca de Santa María Magdalena sustituyó a otra quemada en la guerra de Sucesión, y a unos 2 km la ermita-monasterio de San Salvador, de 1550, ofrece otro mirador sobre la ribera. Pascual Madoz, a mediados del siglo XIX, aún hablaba de una pequeña fortaleza capaz para cien hombres."}],"en":[{"h":"History","t":"Judging by its masonry and pottery, the castle is thought to be of Islamic origin, dating from no later than the 11th century. Torrente lay in Muslim territory and the river marked the line of defence facing the Christian bank.\n\nIn 1149 it passed into Christian hands along with Fraga, and around 1157 the Count of Pallars, lord of Fraga, made it a castle with its own territory. Around 1174-1175 its lordship was given to the Order of the Hospital, which turned Torrente into a commandery until the 19th century. During the Carlist Wars the castle was garrisoned again."},{"h":"What to see","t":"The wall follows the shape of the rock, about 45 metres long. On the south side stands a rectangular tower that guarded the only gate, and in the upper western part a barrel-vaulted cistern survives.\n\nIn the village, the Baroque church of Santa María Magdalena replaced an earlier one burnt in the War of the Spanish Succession, and about 2 km away the hermitage-monastery of San Salvador, from 1550, offers another viewpoint over the river. In the mid-19th century Pascual Madoz still spoke of a small fortress able to hold a hundred men."}],"fr":[{"h":"Histoire","t":"D'après sa maçonnerie et sa céramique, le château est considéré d'origine islamique, au plus tard du XIe siècle. Torrente se trouvait en territoire musulman et la rivière marquait la ligne de défense face à la rive chrétienne.\n\nEn 1149, il passa aux mains chrétiennes en même temps que Fraga, et vers 1157 le comte de Pallars, seigneur de Fraga, en fit un château doté de son propre territoire. Vers 1174-1175, sa seigneurie fut confiée à l'ordre de l'Hôpital, qui fit de Torrente une commanderie jusqu'au XIXe siècle. Pendant les guerres carlistes, le château reçut de nouveau une garnison."},{"h":"À voir","t":"L'enceinte suit la forme du rocher, sur environ 45 mètres de long. Au sud subsiste une tour rectangulaire qui protégeait l'unique porte, et dans la partie haute, à l'ouest, une citerne voûtée en berceau.\n\nAu village, l'église baroque Santa María Magdalena a remplacé une église brûlée pendant la guerre de Succession, et à environ 2 km l'ermitage-monastère de San Salvador, de 1550, offre un autre belvédère sur la vallée. Au milieu du XIXe siècle, Pascual Madoz parlait encore d'une petite forteresse capable d'accueillir cent hommes."}],"de":[{"h":"Geschichte","t":"Nach Mauerwerk und Keramik gilt die Burg als islamischen Ursprungs, spätestens aus dem 11. Jahrhundert. Torrente lag auf muslimischem Gebiet, und der Fluss bildete die Verteidigungslinie gegenüber dem christlichen Ufer.\n\n1149 kam sie zusammen mit Fraga in christliche Hand, und um 1157 machte der Graf von Pallars, Herr von Fraga, sie zu einer Burg mit eigenem Gebiet. Um 1174-1175 ging die Herrschaft an den Johanniterorden, der Torrente bis ins 19. Jahrhundert als Kommende führte. In den Karlistenkriegen erhielt die Burg erneut eine Besatzung."},{"h":"Sehenswert","t":"Die Mauer folgt der Form des etwa 45 Meter langen Felsens. Auf der Südseite steht ein rechteckiger Turm, der das einzige Tor schützte, und im oberen Westteil ist eine tonnengewölbte Zisterne erhalten.\n\nIm Ort ersetzte die barocke Kirche Santa María Magdalena einen im Spanischen Erbfolgekrieg verbrannten Vorgängerbau, und etwa 2 km entfernt bietet die Einsiedelei und das Kloster San Salvador von 1550 einen weiteren Aussichtspunkt über das Flusstal. Mitte des 19. Jahrhunderts sprach Pascual Madoz noch von einer kleinen Festung für hundert Mann."}],"pt":[{"h":"História","t":"Pelo tipo de construção e pela cerâmica, o castelo é considerado de origem islâmica, o mais tardar do século XI. Torrente ficava em território muçulmano e o rio marcava a linha de defesa face à margem cristã.\n\nEm 1149 passou para mãos cristãs, juntamente com Fraga, e por volta de 1157 o conde de Pallars, senhor de Fraga, fez dele um castelo com território próprio. Por volta de 1174-1175 o senhorio foi entregue à Ordem do Hospital, que fez de Torrente uma comenda até ao século XIX. Nas guerras carlistas o castelo voltou a ter guarnição."},{"h":"O que ver","t":"A muralha segue a forma da rocha, com cerca de 45 metros de comprimento. No lado sul resta uma torre retangular que protegia a única porta, e na parte alta oeste conserva-se uma cisterna com abóbada de berço.\n\nNa aldeia, a igreja barroca de Santa María Magdalena substituiu outra queimada na guerra da Sucessão, e a cerca de 2 km a ermida-mosteiro de San Salvador, de 1550, oferece outro miradouro sobre a ribeira. Em meados do século XIX, Pascual Madoz ainda falava de uma pequena fortaleza com capacidade para cem homens."}]},"status":"pending"},{"id":"murallas-zaidin","town":"Zaidín","cat":"patrimonio","lat":41.60417,"lon":0.26222,"coord_src":null,"q":["Murallas de Zaidín","Castillo de Zaidín"],"fq":["Zaidín murallas","Castillo de Zaidín","Zaidín Huesca"],"name":{"es":"Murallas y castillo de Zaidín","en":"Walls and Castle of Zaidín","fr":"Remparts et château de Zaidín","de":"Mauern und Burg von Zaidín","pt":"Muralhas e castelo de Zaidín"},"when":{"es":"Edad Media y siglo XVI · Recinto amurallado","en":"Middle Ages and 16th century · Walled town","fr":"Moyen Âge et XVIe siècle · Enceinte fortifiée","de":"Mittelalter und 16. Jahrhundert · Ummauerter Ort","pt":"Idade Média e século XVI · Recinto amuralhado"},"desc":{"es":"Zaidín fue una villa amurallada con castillo señorial. Hoy se conserva un tramo de muralla con torres, visible desde la carretera de Fraga a Monzón.","en":"Zaidín was a walled town with a lord's castle. Today a stretch of wall with towers survives, visible from the road between Fraga and Monzón.","fr":"Zaidín était un bourg fortifié doté d'un château seigneurial. Il en reste un pan de muraille avec des tours, visible depuis la route de Fraga à Monzón.","de":"Zaidín war ein ummauerter Ort mit einer Herrenburg. Heute ist ein Mauerabschnitt mit Türmen erhalten, sichtbar von der Straße zwischen Fraga und Monzón.","pt":"Zaidín foi uma vila amuralhada com castelo senhorial. Hoje conserva-se um troço de muralha com torres, visível da estrada de Fraga a Monzón."},"visit":{"es":"El tramo conservado está a la izquierda de la carretera A-1234 en dirección a Alcolea. Se ve por fuera en un paseo corto; combínalo con la iglesia y la ermita de San Antón.","en":"The surviving stretch is on the left of the A-1234 road heading towards Alcolea. It is seen from outside on a short walk; combine it with the church and the hermitage of San Antón.","fr":"Le tronçon conservé se trouve à gauche de la route A-1234 en direction d'Alcolea. Il se voit de l'extérieur lors d'une courte promenade ; associez-le à l'église et à l'ermitage de San Antón.","de":"Der erhaltene Abschnitt liegt links der Straße A-1234 in Richtung Alcolea. Er ist von außen bei einem kurzen Spaziergang zu sehen; am besten mit der Kirche und der Einsiedelei San Antón verbinden.","pt":"O troço conservado fica à esquerda da estrada A-1234 em direção a Alcolea. Vê-se por fora num passeio curto; combine-o com a igreja e a ermida de San Antón."},"src":"https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597325","sources":["https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597325","https://es.wikipedia.org/wiki/Zaid%C3%ADn_(Huesca)","https://es.wikipedia.org/wiki/Bajo_Cinca"],"art":{"es":[{"h":"Historia","t":"En enero de 1092 el infante Pedro, futuro Pedro I de Aragón, entregó el castillo de Zaidín a Pedro Ramón de Erill. El castillo de los señores quedó dentro del recinto amurallado.\n\nLa muralla del siglo XVI se mantuvo hasta mediados del siglo XX y tenía cinco puertas: El Portal, La Porteta, El Forat, El Furigachó y una quinta con torre de defensa y vigía. El castillo de Zaidín figura entre los bienes de interés cultural de la comarca."},{"h":"Qué ver","t":"El tramo occidental mide unos 50 metros, con dos torres rectangulares en los extremos y dos cilíndricas en el centro.\n\nEn el pueblo, la iglesia de San Juan Bautista es barroca, levantada sobre una anterior románica; tiene planta de cruz latina, aunque ha perdido el brazo norte del crucero, y portada de arco de medio punto con pilastras. En las afueras, la ermita de San Antón, documentada desde 1600 y quizá levantada sobre un asentamiento prerromano, tiene vistas al río y es meta de la romería de enero. Para terminar, baja al embarcadero del proyecto Entre Ríos, junto al Cinca."}],"en":[{"h":"History","t":"In January 1092 the Infante Peter, later Peter I of Aragon, granted the castle of Zaidín to Pedro Ramón de Erill. The lords' castle stood inside the walled precinct.\n\nThe 16th-century wall survived until the mid-20th century and had five gates: El Portal, La Porteta, El Forat, El Furigachó and a fifth with a defence and watchtower. Zaidín castle is among the comarca's listed Bienes de Interés Cultural."},{"h":"What to see","t":"The western stretch is about 50 metres long, with two rectangular towers at the ends and two round ones in the middle.\n\nIn the village, the church of San Juan Bautista is Baroque, built over an earlier Romanesque one; it has a Latin-cross plan, though it has lost the north arm of the transept, and a round-arched doorway with pilasters. On the outskirts, the hermitage of San Antón, documented from 1600 and perhaps built on a pre-Roman settlement, has views of the river and is the goal of the January pilgrimage. To finish, go down to the Entre Ríos landing stage by the Cinca."}],"fr":[{"h":"Histoire","t":"En janvier 1092, l'infant Pierre, futur Pierre Ier d'Aragon, donna le château de Zaidín à Pedro Ramón de Erill. Le château des seigneurs se trouvait à l'intérieur de l'enceinte.\n\nLa muraille du XVIe siècle s'est maintenue jusqu'au milieu du XXe siècle et comptait cinq portes : El Portal, La Porteta, El Forat, El Furigachó et une cinquième dotée d'une tour de défense et de guet. Le château de Zaidín figure parmi les Biens d'intérêt culturel de la comarque."},{"h":"À voir","t":"Le tronçon ouest mesure environ 50 mètres, avec deux tours rectangulaires aux extrémités et deux tours rondes au centre.\n\nAu village, l'église San Juan Bautista est baroque, bâtie sur une église romane antérieure ; elle a un plan en croix latine, bien qu'elle ait perdu le bras nord du transept, et un portail en plein cintre avec pilastres. À la sortie du village, l'ermitage de San Antón, attesté depuis 1600 et peut-être bâti sur un site préromain, domine la rivière et accueille le pèlerinage de janvier. Pour finir, descendez à l'embarcadère du projet Entre Ríos, au bord du Cinca."}],"de":[{"h":"Geschichte","t":"Im Januar 1092 übergab Infant Peter, der spätere Peter I. von Aragonien, die Burg Zaidín an Pedro Ramón de Erill. Die Burg der Herren lag innerhalb des ummauerten Bezirks.\n\nDie Mauer aus dem 16. Jahrhundert blieb bis Mitte des 20. Jahrhunderts erhalten und hatte fünf Tore: El Portal, La Porteta, El Forat, El Furigachó und ein fünftes mit Wehr- und Wachturm. Die Burg von Zaidín zählt zu den Kulturgütern (Bienes de Interés Cultural) der Comarca."},{"h":"Sehenswert","t":"Der westliche Abschnitt ist etwa 50 Meter lang, mit zwei rechteckigen Türmen an den Enden und zwei runden in der Mitte.\n\nIm Ort ist die Kirche San Juan Bautista barock, über einem romanischen Vorgängerbau errichtet; sie hat einen lateinischen Kreuzgrundriss, auch wenn der nördliche Querhausarm fehlt, und ein Rundbogenportal mit Pilastern. Am Ortsrand liegt die seit 1600 belegte Einsiedelei San Antón, vielleicht auf einer vorrömischen Siedlung erbaut, mit Blick auf den Fluss; sie ist Ziel der Wallfahrt im Januar. Zum Abschluss geht es hinunter zum Bootssteg des Projekts Entre Ríos am Cinca."}],"pt":[{"h":"História","t":"Em janeiro de 1092 o infante Pedro, futuro Pedro I de Aragão, entregou o castelo de Zaidín a Pedro Ramón de Erill. O castelo dos senhores ficava dentro do recinto amuralhado.\n\nA muralha do século XVI manteve-se até meados do século XX e tinha cinco portas: El Portal, La Porteta, El Forat, El Furigachó e uma quinta com torre de defesa e vigia. O castelo de Zaidín figura entre os bens de interesse cultural da comarca."},{"h":"O que ver","t":"O troço ocidental mede cerca de 50 metros, com duas torres retangulares nas pontas e duas cilíndricas ao centro.\n\nNa vila, a igreja de San Juan Bautista é barroca, erguida sobre uma anterior românica; tem planta em cruz latina, embora tenha perdido o braço norte do transepto, e portal de arco de volta perfeita com pilastras. Nos arredores, a ermida de San Antón, documentada desde 1600 e talvez erguida sobre um povoado pré-romano, tem vistas para o rio e é a meta da romaria de janeiro. Para terminar, desça ao cais do projeto Entre Ríos, junto ao Cinca."}]},"status":"pending"},{"id":"san-valero-velilla","town":"Velilla de Cinca","cat":"arqueologia","lat":41.58434,"lon":0.26453,"coord_src":null,"q":["Ermita de San Valero, Velilla de Cinca","Mausoleo romano Velilla de Cinca"],"fq":["Ermita de San Valero Velilla de Cinca","Velilla de Cinca mausoleo romano","Velilla de Cinca San Valero"],"name":{"es":"Ermita de San Valero","en":"Hermitage of San Valero","fr":"Ermitage de San Valero","de":"Einsiedelei San Valero","pt":"Ermida de San Valero"},"when":{"es":"Mausoleo romano y ermita medieval","en":"Roman mausoleum and medieval hermitage","fr":"Mausolée romain et ermitage médiéval","de":"Römisches Mausoleum und mittelalterliche Kapelle","pt":"Mausoléu romano e ermida medieval"},"desc":{"es":"Una pequeña ermita levantada sobre un mausoleo romano, junto a la carretera de Velilla a Fraga. Es un buen ejemplo de cómo un monumento funerario antiguo se reaprovechó como lugar de culto.","en":"A small hermitage built on top of a Roman mausoleum, beside the road from Velilla to Fraga. It is a good example of how an ancient funerary monument was reused as a place of worship.","fr":"Un petit ermitage bâti sur un mausolée romain, au bord de la route de Velilla à Fraga. Un bon exemple de la manière dont un monument funéraire antique a été réutilisé comme lieu de culte.","de":"Eine kleine Einsiedelei, errichtet auf einem römischen Mausoleum an der Straße von Velilla nach Fraga. Ein gutes Beispiel dafür, wie ein antikes Grabmal als Andachtsort weiterverwendet wurde.","pt":"Uma pequena ermida erguida sobre um mausoléu romano, junto à estrada de Velilla a Fraga. É um bom exemplo de como um monumento funerário antigo foi reaproveitado como lugar de culto."},"visit":{"es":"Está junto a la carretera A-131, entre Velilla y Fraga, con fácil acceso y mesas y bancos. El exterior se ve libremente; parada de 15-20 minutos.","en":"It stands beside the A-131 road between Velilla and Fraga, with easy access and picnic tables and benches. The outside can be seen freely; a 15-20-minute stop.","fr":"Il se trouve au bord de la route A-131, entre Velilla et Fraga, facile d'accès, avec tables et bancs. L'extérieur se voit librement ; arrêt de 15 à 20 minutes.","de":"Sie liegt an der Straße A-131 zwischen Velilla und Fraga, leicht erreichbar, mit Tischen und Bänken. Von außen frei zu sehen; Halt von 15-20 Minuten.","pt":"Fica junto à estrada A-131, entre Velilla e Fraga, com acesso fácil e mesas e bancos. O exterior vê-se livremente; paragem de 15-20 minutos."},"src":"https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597349","sources":["https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597349","https://es.wikipedia.org/wiki/Velilla_de_Cinca","https://vici.org/vici/15403"],"art":{"es":[{"h":"Historia","t":"En época romana la vega del Cinca estaba poblada de villas, como la Fortunatus, a pocos kilómetros. Sobre un mausoleo de esa época se construyó en la Edad Media la ermita de San Valero, que aprovechó la obra antigua.\n\nEs un caso frecuente: un edificio sólido y respetado se reutiliza como lugar de culto y así llega hasta hoy. En el término de Velilla se conocen además otros restos romanos, señal de que la orilla del río estuvo habitada de forma continuada."},{"h":"Qué ver","t":"Rodea la ermita y busca en sus muros la obra romana sobre la que se apoya.\n\nEn Velilla puedes completar la visita con la iglesia de San Lorenzo, de portada barroca y torre de ladrillo con rasgos mudéjares, el paseo junto al Cinca y Los Castellassos, el punto más alto, con restos de una fortificación ibérica reutilizada en época medieval. El barranco de los Planos, canalizado a su paso por el pueblo, tiene un paseo arbolado, y el embarcadero del proyecto Entre Ríos da acceso al río. La ermita da nombre a una de las fiestas del pueblo: San Valero, el 29 de enero; la otra gran cita es San Lorenzo, el 10 de agosto."}],"en":[{"h":"History","t":"In Roman times the Cinca floodplain was dotted with villas, such as Villa Fortunatus, a few kilometres away. In the Middle Ages the hermitage of San Valero was built on top of a mausoleum from that period, making use of the ancient structure.\n\nIt is a common story: a solid, respected building is reused as a place of worship and so survives to the present day. Other Roman remains are also known in the municipality of Velilla, a sign that the riverbank was inhabited continuously."},{"h":"What to see","t":"Walk around the hermitage and look in its walls for the Roman work it rests on.\n\nIn Velilla you can round off the visit with the church of San Lorenzo, with its Baroque doorway and brick tower with Mudéjar features, the riverside path along the Cinca, and Los Castellassos, the highest point, with remains of an Iberian fortification reused in the Middle Ages. The Barranco de los Planos, channelled through the village, has a tree-lined walk, and the Entre Ríos landing stage gives access to the river. The hermitage gives its name to one of the village festivals: San Valero, on 29 January; the other big date is San Lorenzo, on 10 August."}],"fr":[{"h":"Histoire","t":"À l'époque romaine, la plaine du Cinca était parsemée de villas, comme la Villa Fortunatus, à quelques kilomètres. Au Moyen Âge, l'ermitage de San Valero fut construit sur un mausolée de cette époque, en réutilisant l'ouvrage antique.\n\nC'est un cas fréquent : un édifice solide et respecté devient lieu de culte et parvient ainsi jusqu'à nous. D'autres vestiges romains sont connus sur la commune de Velilla, signe que la rive fut habitée de façon continue."},{"h":"À voir","t":"Faites le tour de l'ermitage et cherchez dans ses murs l'ouvrage romain sur lequel il repose.\n\nÀ Velilla, complétez la visite avec l'église San Lorenzo, au portail baroque et au clocher de brique aux traits mudéjars, la promenade au bord du Cinca et Los Castellassos, le point culminant, avec les restes d'une fortification ibère réutilisée au Moyen Âge. Le ravin de los Planos, canalisé dans la traversée du village, est bordé d'une promenade arborée, et l'embarcadère du projet Entre Ríos donne accès à la rivière. L'ermitage donne son nom à l'une des fêtes du village : la Saint-Valère, le 29 janvier ; l'autre grand rendez-vous est la Saint-Laurent, le 10 août."}],"de":[{"h":"Geschichte","t":"In römischer Zeit war die Aue des Cinca mit Villen übersät, etwa der wenige Kilometer entfernten Villa Fortunatus. Im Mittelalter wurde die Einsiedelei San Valero auf einem Mausoleum aus jener Zeit errichtet und nutzte den antiken Bau weiter.\n\nEin häufiger Fall: Ein solides, geachtetes Gebäude wird zum Andachtsort und überdauert so bis heute. In der Gemeinde Velilla sind weitere römische Reste bekannt, ein Zeichen dafür, dass das Flussufer durchgehend besiedelt war."},{"h":"Sehenswert","t":"Gehen Sie um die Einsiedelei herum und suchen Sie in ihren Mauern das römische Mauerwerk, auf dem sie ruht.\n\nIn Velilla ergänzen die Kirche San Lorenzo mit barockem Portal und Backsteinturm mit Mudéjar-Zügen, der Uferweg am Cinca und Los Castellassos, der höchste Punkt mit Resten einer iberischen, im Mittelalter weitergenutzten Befestigung, den Besuch. Die Schlucht Barranco de los Planos, im Ort kanalisiert, hat einen baumbestandenen Spazierweg, und der Bootssteg des Projekts Entre Ríos führt zum Fluss. Die Einsiedelei gibt einem der Ortsfeste den Namen: San Valero am 29. Januar; der andere große Termin ist San Lorenzo am 10. August."}],"pt":[{"h":"História","t":"Na época romana a várzea do Cinca estava povoada de villae, como a Fortunatus, a poucos quilómetros. Sobre um mausoléu dessa época construiu-se na Idade Média a ermida de San Valero, que aproveitou a obra antiga.\n\nÉ um caso frequente: um edifício sólido e respeitado é reutilizado como lugar de culto e assim chega até hoje. No concelho de Velilla conhecem-se ainda outros vestígios romanos, sinal de que a margem do rio esteve habitada de forma contínua."},{"h":"O que ver","t":"Dê a volta à ermida e procure nas paredes a obra romana em que assenta.\n\nEm Velilla pode completar a visita com a igreja de San Lorenzo, de portal barroco e torre de tijolo com traços mudéjares, o passeio junto ao Cinca e Los Castellassos, o ponto mais alto, com restos de uma fortificação ibérica reutilizada na época medieval. A ravina de los Planos, canalizada na travessia da aldeia, tem um passeio arborizado, e o cais do projeto Entre Ríos dá acesso ao rio. A ermida dá nome a uma das festas da aldeia: San Valero, a 29 de janeiro; a outra grande data é San Lorenzo, a 10 de agosto."}]},"status":"pending"},{"id":"puente-ballobar","town":"Ballobar","cat":"camino","lat":41.61797,"lon":0.19449,"coord_src":null,"q":["Puente viejo de Ballobar","Puente medieval, Ballobar"],"fq":["Ballobar puente","Puente de Ballobar Alcanadre","Ballobar Huesca"],"name":{"es":"Puente viejo de Ballobar","en":"Old Bridge of Ballobar","fr":"Vieux pont de Ballobar","de":"Alte Brücke von Ballobar","pt":"Ponte velha de Ballobar"},"when":{"es":"Origen romano, rehecho hacia 1300 · Puente","en":"Roman origin, rebuilt around 1300 · Bridge","fr":"Origine romaine, reconstruit vers 1300 · Pont","de":"Römischer Ursprung, um 1300 erneuert · Brücke","pt":"Origem romana, refeita c. 1300 · Ponte"},"desc":{"es":"Un puente de piedra sobre el Alcanadre, de origen romano y rehecho hacia 1300. Durante siglos fue de pago y lo mantenía una cofradía; hoy se cruza libremente.","en":"A stone bridge over the Alcanadre, Roman in origin and rebuilt around 1300. For centuries it was a toll bridge maintained by a brotherhood; today it is free to cross.","fr":"Un pont de pierre sur l'Alcanadre, d'origine romaine et reconstruit vers 1300. Pendant des siècles, il fut à péage et entretenu par une confrérie ; aujourd'hui, on le traverse librement.","de":"Eine Steinbrücke über den Alcanadre, römischen Ursprungs und um 1300 erneuert. Jahrhundertelang war sie gebührenpflichtig und wurde von einer Bruderschaft unterhalten; heute ist die Überquerung frei.","pt":"Uma ponte de pedra sobre o Alcanadre, de origem romana e refeita por volta de 1300. Durante séculos foi de portagem e mantida por uma confraria; hoje atravessa-se livremente."},"visit":{"es":"Está en el mismo pueblo, junto al embarcadero de la Comarca. Se cruza a pie; calcula media hora con un paseo por el casco y la iglesia.","en":"It is in the village itself, next to the Comarca's landing stage. Cross it on foot; allow half an hour with a stroll through the old centre and the church.","fr":"Il se trouve dans le village même, près de l'embarcadère de la Comarque. On le traverse à pied ; comptez une demi-heure avec une promenade dans le centre et jusqu'à l'église.","de":"Sie liegt im Ort selbst, neben dem Bootssteg der Comarca. Zu Fuß zu überqueren; mit einem Bummel durch den Ortskern und zur Kirche eine halbe Stunde einplanen.","pt":"Fica na própria aldeia, junto ao cais da Comarca. Atravessa-se a pé; conte com meia hora com um passeio pelo centro e pela igreja."},"src":"https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5486868","sources":["https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5486868","https://es.wikipedia.org/wiki/Ballobar","https://es.wikipedia.org/wiki/Bajo_Cinca"],"art":{"es":[{"h":"Historia","t":"El puente tiene origen romano y fue reconstruido en gran parte hacia el año 1300, reutilizando algunas piedras antiguas. Hasta finales del siglo XIX tuvo una pequeña capilla a la salida.\n\nCruzar costaba dinero: una cofradía cobraba el peaje y con él mantenía el puente. El Diccionario de Pascual Madoz lo describe con cuatro arcos y pegado a los edificios del pueblo."},{"h":"Qué ver","t":"Cruza el puente y mira el río desde el embarcadero, construido con el programa Entre Ríos de la Comarca.\n\nSube después a la iglesia de la Asunción, románico-gótica, con ábside románico del siglo XII orientado al este. Por encima quedan los restos de El Castillazo, una gran torre medieval, y en lo alto la ermita de San Juan, con amplias vistas. Curiosidad: la antigua taberna de la calle del Horno fue escenario de la película Golpe de mano (1969)."},{"h":"Curiosidades","t":"En el barranco de las Hechiceras, cerca del pueblo, se ven cistas y restos de casas de piedra, y el lugar arrastra una larga tradición de historias de brujas y curanderas. Y la ermita de San Roque, a unos 15 km, recuerda una promesa: en tiempos de peste los vecinos pidieron protección al santo y se comprometieron a celebrar su fiesta cada año."}],"en":[{"h":"History","t":"The bridge is Roman in origin and was largely rebuilt around the year 1300, reusing some of the old stones. Until the end of the 19th century it had a small chapel at its far end.\n\nCrossing cost money: a brotherhood collected the toll and used it to maintain the bridge. Pascual Madoz's gazetteer describes it with four arches, attached to the buildings of the village."},{"h":"What to see","t":"Cross the bridge and look at the river from the landing stage, built under the Comarca's Entre Ríos programme.\n\nThen walk up to the church of the Asunción, Romanesque-Gothic, with a 12th-century Romanesque apse facing east. Above it are the remains of El Castillazo, a massive medieval tower, and at the top the hermitage of San Juan, with wide views. A curiosity: the old tavern in Calle del Horno was a location for the film Golpe de mano (1969)."},{"h":"Did you know?","t":"In the Barranco de las Hechiceras (Sorceresses' Ravine), near the village, you can see stone cists and remains of stone houses, and the place carries a long tradition of tales about witches and healers. And the hermitage of San Roque, about 15 km away, recalls a vow: in times of plague the villagers asked the saint for protection and promised to celebrate his feast every year."}],"fr":[{"h":"Histoire","t":"Le pont est d'origine romaine et fut en grande partie reconstruit vers l'an 1300, en réutilisant quelques pierres anciennes. Jusqu'à la fin du XIXe siècle, une petite chapelle se trouvait à sa sortie.\n\nLe passage était payant : une confrérie percevait le péage et l'utilisait pour entretenir le pont. Le dictionnaire de Pascual Madoz le décrit avec quatre arches, adossé aux maisons du village."},{"h":"À voir","t":"Traversez le pont et regardez la rivière depuis l'embarcadère, aménagé dans le cadre du programme Entre Ríos de la Comarque.\n\nMontez ensuite à l'église de l'Asunción, romano-gothique, avec une abside romane du XIIe siècle orientée à l'est. Au-dessus se trouvent les restes d'El Castillazo, une grande tour médiévale, et tout en haut l'ermitage de San Juan, avec une large vue. Curiosité : l'ancienne taverne de la Calle del Horno a servi de décor au film Golpe de mano (1969)."},{"h":"Le saviez-vous ?","t":"Dans le ravin de las Hechiceras (des Sorcières), près du village, on voit des cistes et des restes de maisons en pierre, et le lieu porte une longue tradition d'histoires de sorcières et de guérisseuses. Et l'ermitage de San Roque, à environ 15 km, rappelle un vœu : en temps de peste, les habitants demandèrent la protection du saint et promirent de célébrer sa fête chaque année."}],"de":[{"h":"Geschichte","t":"Die Brücke ist römischen Ursprungs und wurde um das Jahr 1300 weitgehend neu gebaut, wobei einige alte Steine wiederverwendet wurden. Bis Ende des 19. Jahrhunderts stand an ihrem Ende eine kleine Kapelle.\n\nDie Überquerung kostete Geld: Eine Bruderschaft erhob den Brückenzoll und unterhielt damit die Brücke. Das Lexikon von Pascual Madoz beschreibt sie mit vier Bögen, angebaut an die Häuser des Ortes."},{"h":"Sehenswert","t":"Überqueren Sie die Brücke und betrachten Sie den Fluss vom Bootssteg aus, der im Rahmen des Programms Entre Ríos der Comarca entstand.\n\nSteigen Sie danach zur Kirche de la Asunción hinauf, romanisch-gotisch, mit einer nach Osten ausgerichteten romanischen Apsis aus dem 12. Jahrhundert. Darüber liegen die Reste von El Castillazo, einem mächtigen mittelalterlichen Turm, und ganz oben die Einsiedelei San Juan mit weitem Blick. Kurios: Die alte Taverne in der Calle del Horno war Drehort des Films Golpe de mano (1969)."},{"h":"Wussten Sie schon?","t":"In der Schlucht Barranco de las Hechiceras (Hexenschlucht) nahe dem Ort sieht man Steinkisten und Reste von Steinhäusern, und der Ort ist mit vielen Geschichten über Hexen und Heilerinnen verbunden. Und die Einsiedelei San Roque, etwa 15 km entfernt, erinnert an ein Gelübde: In Pestzeiten baten die Bewohner den Heiligen um Schutz und versprachen, jedes Jahr sein Fest zu feiern."}],"pt":[{"h":"História","t":"A ponte tem origem romana e foi em grande parte reconstruída por volta do ano 1300, reaproveitando algumas pedras antigas. Até ao final do século XIX teve uma pequena capela à saída.\n\nAtravessar custava dinheiro: uma confraria cobrava a portagem e com ela mantinha a ponte. O Dicionário de Pascual Madoz descreve-a com quatro arcos e encostada aos edifícios da aldeia."},{"h":"O que ver","t":"Atravesse a ponte e observe o rio a partir do cais, construído com o programa Entre Ríos da Comarca.\n\nSuba depois à igreja da Asunción, românico-gótica, com abside românica do século XII virada a nascente. Por cima ficam os restos de El Castillazo, uma grande torre medieval, e no alto a ermida de San Juan, com amplas vistas. Curiosidade: a antiga taberna da Calle del Horno foi cenário do filme Golpe de mano (1969)."},{"h":"Curiosidades","t":"No barranco de las Hechiceras (das Feiticeiras), perto da aldeia, veem-se cistas e restos de casas de pedra, e o lugar carrega uma longa tradição de histórias de bruxas e curandeiras. E a ermida de San Roque, a cerca de 15 km, recorda uma promessa: em tempos de peste, os habitantes pediram proteção ao santo e comprometeram-se a celebrar a sua festa todos os anos."}]},"status":"pending"},{"id":"iglesia-belver","town":"Belver de Cinca","cat":"patrimonio","lat":41.68083,"lon":0.21639,"coord_src":null,"q":["Iglesia de la Asunción, Belver de Cinca","Iglesia parroquial, Belver de Cinca"],"fq":["Belver de Cinca iglesia","Iglesia de la Asunción Belver de Cinca","Belver de Cinca"],"name":{"es":"Iglesia de la Asunción de Belver","en":"Church of the Asunción, Belver","fr":"Église de l'Asunción de Belver","de":"Kirche de la Asunción in Belver","pt":"Igreja da Asunción de Belver"},"when":{"es":"Siglo XVI · Gótico aragonés y Renacimiento","en":"16th century · Aragonese Gothic and Renaissance","fr":"XVIe siècle · Gothique aragonais et Renaissance","de":"16. Jahrhundert · Aragonische Gotik und Renaissance","pt":"Século XVI · Gótico aragonês e Renascimento"},"desc":{"es":"Una iglesia gótico-aragonesa del siglo XVI con portada renacentista de 1592 y una girola que no tiene otra iglesia de la comarca. Alrededor, un casco con casonas de los siglos XVI y XVII.","en":"A 16th-century Aragonese Gothic church with a Renaissance doorway dated 1592 and an ambulatory found in no other church in the comarca. Around it, an old centre with 16th- and 17th-century mansions.","fr":"Une église gothique aragonaise du XVIe siècle, avec un portail Renaissance daté de 1592 et un déambulatoire qu'aucune autre église de la comarque ne possède. Autour, un centre ancien aux demeures des XVIe et XVIIe siècles.","de":"Eine aragonisch-gotische Kirche aus dem 16. Jahrhundert mit einem Renaissanceportal von 1592 und einem Chorumgang, den keine andere Kirche der Comarca besitzt. Ringsum ein Ortskern mit Herrenhäusern aus dem 16. und 17. Jahrhundert.","pt":"Uma igreja gótico-aragonesa do século XVI com portal renascentista de 1592 e uma charola que nenhuma outra igreja da comarca tem. À volta, um centro com casas senhoriais dos séculos XVI e XVII."},"visit":{"es":"Está en el centro de Belver. El exterior se ve en cualquier momento; el interior en horario de culto o con visita concertada en el Ayuntamiento. Calcula 45 minutos con el paseo por el casco.","en":"It is in the centre of Belver. The outside can be seen at any time; the interior during services or on a visit arranged with the town hall. Allow 45 minutes including a stroll through the old centre.","fr":"Elle se trouve au centre de Belver. L'extérieur se voit à tout moment ; l'intérieur pendant les offices ou lors d'une visite organisée avec la mairie. Comptez 45 minutes avec la promenade dans le centre ancien.","de":"Sie steht im Zentrum von Belver. Von außen jederzeit zu sehen; das Innere zu den Gottesdienstzeiten oder nach Absprache mit dem Rathaus. Mit Bummel durch den Ortskern 45 Minuten einplanen.","pt":"Fica no centro de Belver. O exterior vê-se a qualquer hora; o interior durante o culto ou com visita combinada com a câmara municipal. Conte com 45 minutos com o passeio pelo centro."},"src":"https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5487832","sources":["https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5487832","https://es.wikipedia.org/wiki/Belver_de_Cinca"],"art":{"es":[{"h":"Historia","t":"La parroquia, dedicada a la Asunción de Nuestra Señora, es un edificio gótico-aragonés del siglo XVI con muchas reformas posteriores. La portada renacentista, de estilo plateresco, lleva la fecha de 1592 y es lo primero que conviene mirar antes de entrar.\n\nBelver tuvo un castillo templario en el siglo XIII; de él quedan las mazmorras que se conservan en la Casa Camilo.\n\nEl pueblo creció entre huertas y grandes fincas como Monte Julia, Valonga y San Miguel, donde trabajaba buena parte de los vecinos como jornaleros. Hoy son explotaciones agrícolas modernas, algunas dedicadas al vino."},{"h":"Qué ver","t":"Dentro, la nave única se cubre con bóveda estrellada y la girola rodea la cabecera. La torre es cuadrada y se vuelve octogonal en el tercer cuerpo, con cuatro torrecillas en las esquinas y gárgolas.\n\nAl salir, recorre las calles del casco: Casa Prim, con portada de piedra de 1797, Casa Benito, Casa Pardo, Casa Camilo y Casa Batista, con portada del siglo XVI y escudo. La Casa Fox ocupa la antigua ermita de Nuestra Señora de Gracia. Muy cerca, el embarcadero del proyecto Entre Ríos permite bajar al Cinca."}],"en":[{"h":"History","t":"The parish church, dedicated to the Assumption of Our Lady, is a 16th-century Aragonese Gothic building with many later alterations. The Renaissance doorway, in Plateresque style, bears the date 1592 and is the first thing to look at before going in.\n\nBelver had a Templar castle in the 13th century; its dungeons survive in Casa Camilo.\n\nThe village grew among market gardens and large estates such as Monte Julia, Valonga and San Miguel, where many residents worked as day labourers. Today they are modern farms, some of them devoted to wine."},{"h":"What to see","t":"Inside, the single nave has a star vault and the ambulatory runs round the east end. The tower is square and becomes octagonal at the third stage, with four corner turrets and gargoyles.\n\nAfterwards, explore the streets of the old centre: Casa Prim, with a stone doorway dated 1797, Casa Benito, Casa Pardo, Casa Camilo and Casa Batista, with a 16th-century doorway and coat of arms. Casa Fox occupies the former hermitage of Nuestra Señora de Gracia. Close by, the Entre Ríos landing stage lets you go down to the Cinca."}],"fr":[{"h":"Histoire","t":"L'église paroissiale, dédiée à l'Assomption de Notre-Dame, est un édifice gothique aragonais du XVIe siècle, maintes fois remanié. Le portail Renaissance, de style plateresque, porte la date de 1592 et mérite un regard attentif avant d'entrer.\n\nBelver eut un château templier au XIIIe siècle ; il en reste les cachots conservés dans la Casa Camilo.\n\nLe village s'est développé entre les vergers et de grands domaines comme Monte Julia, Valonga et San Miguel, où travaillaient comme journaliers une bonne partie des habitants. Ce sont aujourd'hui des exploitations agricoles modernes, dont certaines produisent du vin."},{"h":"À voir","t":"À l'intérieur, la nef unique est couverte d'une voûte en étoile et le déambulatoire entoure le chevet. Le clocher est carré et devient octogonal au troisième niveau, avec quatre tourelles d'angle et des gargouilles.\n\nEn sortant, parcourez les rues du centre ancien : Casa Prim, avec un portail de pierre de 1797, Casa Benito, Casa Pardo, Casa Camilo et Casa Batista, avec un portail du XVIe siècle et un blason. La Casa Fox occupe l'ancien ermitage de Nuestra Señora de Gracia. Tout près, l'embarcadère du projet Entre Ríos permet de descendre jusqu'au Cinca."}],"de":[{"h":"Geschichte","t":"Die Pfarrkirche Mariä Himmelfahrt ist ein aragonisch-gotischer Bau des 16. Jahrhunderts mit vielen späteren Umbauten. Das Renaissanceportal im plateresken Stil trägt die Jahreszahl 1592 und verdient einen genauen Blick, bevor man eintritt.\n\nBelver hatte im 13. Jahrhundert eine Templerburg; erhalten sind ihre Verliese in der Casa Camilo.\n\nDer Ort wuchs zwischen Gärten und großen Gütern wie Monte Julia, Valonga und San Miguel, auf denen viele Bewohner als Tagelöhner arbeiteten. Heute sind es moderne Agrarbetriebe, einige davon im Weinbau."},{"h":"Sehenswert","t":"Innen überspannt ein Sterngewölbe das einschiffige Langhaus, und der Chorumgang umläuft das Chorhaupt. Der Turm ist quadratisch und wird im dritten Geschoss achteckig, mit vier Ecktürmchen und Wasserspeiern.\n\nGehen Sie danach durch die Gassen: Casa Prim mit Steinportal von 1797, Casa Benito, Casa Pardo, Casa Camilo und Casa Batista mit Portal aus dem 16. Jahrhundert und Wappen. Die Casa Fox nimmt die ehemalige Einsiedelei Nuestra Señora de Gracia ein. Ganz in der Nähe führt der Bootssteg des Projekts Entre Ríos hinunter zum Cinca."}],"pt":[{"h":"História","t":"A paroquial, dedicada à Assunção de Nossa Senhora, é um edifício gótico-aragonês do século XVI com muitas reformas posteriores. O portal renascentista, de estilo plateresco, tem a data de 1592 e é a primeira coisa a observar antes de entrar.\n\nBelver teve um castelo templário no século XIII; dele restam as masmorras conservadas na Casa Camilo.\n\nA aldeia cresceu entre hortas e grandes herdades como Monte Julia, Valonga e San Miguel, onde trabalhava como jornaleira boa parte da população. Hoje são explorações agrícolas modernas, algumas dedicadas ao vinho."},{"h":"O que ver","t":"No interior, a nave única tem abóbada estrelada e a charola rodeia a cabeceira. A torre é quadrada e torna-se octogonal no terceiro corpo, com quatro torreões nos cantos e gárgulas.\n\nÀ saída, percorra as ruas do centro: Casa Prim, com portal de pedra de 1797, Casa Benito, Casa Pardo, Casa Camilo e Casa Batista, com portal do século XVI e brasão. A Casa Fox ocupa a antiga ermida de Nuestra Señora de Gracia. Muito perto, o cais do projeto Entre Ríos permite descer até ao Cinca."}]},"status":"pending"}],"towns":[{"name":"Fraga","lat":41.52068,"lon":0.35163},{"name":"Mequinenza","lat":41.37417,"lon":0.3025},{"name":"Ballobar","lat":41.62047,"lon":0.19199},{"name":"Belver de Cinca","lat":41.68333,"lon":0.21389},{"name":"Candasnos","lat":41.50209,"lon":0.06217},{"name":"Chalamera","lat":41.66479,"lon":0.16294},{"name":"Ontiñena","lat":41.67619,"lon":0.08918},{"name":"Osso de Cinca","lat":41.665,"lon":0.19083},{"name":"Torrente de Cinca","lat":41.46667,"lon":0.33333},{"name":"Velilla de Cinca","lat":41.58684,"lon":0.26203},{"name":"Zaidín","lat":41.6,"lon":0.26667}],"context":[],"routes":[{"id":"castillos-del-cinca","cat":"patrimonio","mode":"car","stops":["castillo-torrente","torre-frailes","san-pedro-fraga if(riverFeat){

// town & context labels
TOWNS.forEach(tw=>L.marker([tw.lat,tw.lon],{pane:"labels",interactive:false,keyboard:false,icon:L.divIcon({className:"",html:`<span class="town-label${tw.minor?" minor":""}">${esc(tw.name)}</span>`,iconSize:null})}).addTo(map));
(DATA.context||[]).forEach(tw=>L.marker([tw.lat,tw.lon],{pane:"labels",interactive:false,keyboard:false,icon:L.divIcon({className:"",html:`<span class="town-label out">${esc(tw.name)}</span>`,iconSize:null})}).addTo(map));
if(DATA.riverLabel) L.marker(DATA.riverLabel,{pane:"labels",interactive:false,keyboard:false,icon:L.divIcon({className:"",html:`<span class="river-label">${esc(DATA.riverName||"EBRO")}</span>`,iconSize:null})}).addTo(map);

const homeBounds=(()=>{if(DATA.fitPois) return L.latLngBounds(POIS.map(p=>[p.lat,p.lon]).concat(TOWNS.filter(t=>!t.minor).map(t=>[t.lat,t.lon]))).pad(0.08);
  if(HASBASE){const o=baseLayer.getLayers().find(l=>l.feature.properties.outline);return (o||baseLayer).getBounds();}
  return L.latLngBounds(POIS.map(p=>[p.lat,p.lon])).pad(0.15);})();
map.fitBounds(homeBounds,{padding:[16,16]});
map.setMaxZoom(15);

// basemaps (only used where the hosting allows external map tiles)
const TILES={
  mapa:{url:"https://www.ign.es/wmts/ign-base?layer=IGNBaseTodo&style=default&tilematrixset=GoogleMapsCompatible&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/png&TileMatrix={z}&TileCol={x}&TileRow={y}",opt:{maxZoom:18,attribution:'Mapa base © <a href="https://www.ign.es">IGN</a>'}},
  ortofoto:{url:"https://www.ign.es/wmts/pnoa-ma?layer=OI.OrthoimageCoverage&style=default&tilematrixset=GoogleMapsCompatible&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/jpeg&TileMatrix={z}&TileCol={x}&TileRow={y}",opt:{maxZoom:19,attribution:'PNOA © <a href="https://www.ign.es">IGN</a>'}}
};
let tileLayer=null;
function setBasemap(k,silent){
  state.basemap=k; $$(".layerbox button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.k===k)));
  if(tileLayer){map.removeLayer(tileLayer);tileLayer=null;}
  $("#map").classList.remove("tiles-on");
  if(k==="ilustrado"){map.setMaxZoom(15);return;}
  map.setMaxZoom(18);
  const def=TILES[k]; let ok=0,bad=0,decided=false;
  tileLayer=L.tileLayer(def.url,def.opt);
  tileLayer.on("tileload",()=>{ok++; if(!decided){decided=true;$("#map").classList.add("tiles-on");}});
  tileLayer.on("tileerror",()=>{bad++; if(!decided&&bad>=3&&HASBASE){decided=true;map.removeLayer(tileLayer);tileLayer=null;state.basemap="ilustrado";map.setMaxZoom(15);$("#map").classList.remove("tiles-on");$$(".layerbox button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.k==="ilustrado")));if(!silent) toast(t("tilesBlocked"));}});
  tileLayer.addTo(map); tileLayer.bringToBack();
}
const isPhone=()=>!!(window.matchMedia&&window.matchMedia("(max-width:760px)").matches);
const PHONE=window.matchMedia&&window.matchMedia("(max-width:760px)").matches;
const LayerCtl=L.Control.extend({options:{position:PHONE?"bottomleft":"topright"},onAdd(){const d=L.DomUtil.create("div","layerbox");L.DomEvent.disableClickPropagation(d);
  d.innerHTML=["mapa","ortofoto"].concat(HASBASE?["ilustrado"]:[]).map(k=>`<button type="button" data-k="${k}" aria-pressed="${k===state.basemap}"></button>`).join("");
  d.addEventListener("click",e=>{const b=e.target.closest("button");if(b) setBasemap(b.dataset.k);});return d;}});
map.addControl(new LayerCtl());
const LegendCtl=L.Control.extend({options:{position:"bottomright"},onAdd(){const d=L.DomUtil.create("div","legend");d.id="legend";return d;}});
map.addControl(new LegendCtl());

/* markers */
const markers={};
function pinIcon(p){return L.divIcon({className:"",html:`<div class="pin" style="--c:var(${CATS[p.cat].color})">${ICON(p.cat)}</div>`,iconSize:[30,30],iconAnchor:[4,30],popupAnchor:[11,-30]});}
function addMarker(p){
  const m=L.marker([p.lat,p.lon],{keyboard:true,title:L10(p.name),riseOnHover:true,icon:pinIcon(p)});
  m.on("click",()=>{if(state.adding){map.fire("click",{latlng:m.getLatLng()});return;} openPlace(p.id,{fly:false});});
  m.addTo(map); markers[p.id]=m;
}
POIS.forEach(addMarker);
function pinEl(id){const m=markers[id];return m&&m.getElement()?m.getElement().querySelector(".pin"):null;}
function visible(p){
  if(!state.cats.has(p.cat)) return false;
  if(state.town&&p.town!==state.town) return false;
  if(state.q){const q=norm(state.q);const hay=norm(L10(p.name)+" "+p.town+" "+L10(p.desc)+" "+t("cat_"+p.cat));if(!hay.includes(q)) return false;}
  return true;
}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}
function refreshMarkers(){
  const inRoute=state.route?new Set(DATA.routes.find(r=>r.id===state.route).stops):null;
  POIS.forEach(p=>{const m=markers[p.id];const show=inRoute?inRoute.has(p.id):visible(p);
    if(show&&!map.hasLayer(m)) m.addTo(map); if(!show&&map.hasLayer(m)) map.removeLayer(m);
    const el=pinEl(p.id); if(el) el.classList.toggle("sel",state.sel===p.id);});
  Object.entries(muniLayers).forEach(([n,l])=>{const el=l.getElement&&l.getElement();if(el) el.classList.toggle("hl",state.town===n);});
}

/* ---------- route drawing ---------- */
let routeGroup=L.layerGroup().addTo(map);
function drawRoute(r){
  routeGroup.clearLayers(); if(!r) return;
  const pts=r.stops.map(id=>BYID[id]).map(p=>[p.lat,p.lon]);
  const color=`var(${CATS[r.cat].color})`;
  const line=L.polyline(pts,{pane:"routes",className:"route-line",interactive:false});
  routeGroup.addLayer(line);
  setTimeout(()=>{const el=line.getElement();if(el) el.style.setProperty("--c",color);},0);
  r.stops.forEach((id,i)=>{const p=BYID[id];routeGroup.addLayer(L.marker([p.lat,p.lon],{pane:"stops",interactive:false,keyboard:false,icon:L.divIcon({className:"",html:`<div class="stopnum">${i+1}</div>`,iconSize:[0,0]})}));});
  map.flyToBounds(L.latLngBounds(pts),{padding:[50,50],duration:.8,maxZoom:15});
}
function routeStats(r){let km=0;const legs=[];for(let i=1;i<r.stops.length;i++){const d=hav(BYID[r.stops[i-1]],BYID[r.stops[i]])*1.25;legs.push(d);km+=d;}
  const speed={walk:4,bike:14,car:55}[r.mode];const mins=Math.round(km/speed*60+r.stops.length*(r.mode==="car"?35:20));return {km,legs,mins};}
function gmapsRoute(r){const pts=r.stops.map(id=>BYID[id]).map(p=>p.lat+","+p.lon);const mode={walk:"walking",bike:"bicycling",car:"driving"}[r.mode];
  return "https://www.google.com/maps/dir/?api=1&origin="+pts[0]+"&destination="+pts.at(-1)+(pts.length>2?"&waypoints="+encodeURIComponent(pts.slice(1,-1).join("|")):"")+"&travelmode="+mode;}
function fmtDur(m){const h=Math.floor(m/60),mm=m%60;return h?`${h} h${mm?" "+mm+" min":""}`:`${mm} min`;}

/* ---------- views ---------- */
function setTab(tab,push=true){closeLightbox();
  state.tab=tab;
  $$("#tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab||(tab==="lugar"&&b.dataset.tab==="explorar"))));
  if(tab==="inicio"&&!state.route) map.flyToBounds(homeBounds,{padding:[16,16],duration:.6});
  $$(".view").forEach(v=>v.hidden=v.id!=="v-"+tab);
  if(tab!=="rutas"&&tab!=="lugar"&&state.route){state.route=null;drawRoute(null);}
  render(tab);
  if(push) setHash(tab==="lugar"?"p-"+state.sel:tab);
  if(isPhone()){const y=$("#panel").getBoundingClientRect().top+window.scrollY;
    if(tab==="lugar"||window.scrollY>y) window.scrollTo({top:y,behavior:tab==="lugar"?"smooth":"auto"});}
  else $("#v-"+tab).scrollTop=0;
}
function setHash(h){try{if(location.hash!=="#"+h) history.replaceState(null,"","#"+h);}catch(e){}}
function render(tab){({inicio:renderHome,explorar:renderExplore,lugar:renderPlace,rutas:renderRoutes,agenda:renderAgenda,pasaporte:renderPass,gestion:renderAdmin}[tab]||(()=>{}))();refreshMarkers();}

function renderExplore(){

  $("#near").onclick=nearMe;
