asa Prim or Casa Pardo even though families with other surnames live in them today.\n\nThe coats of arms on the façades indicated the status of infanzones, the minor rural nobility, who enjoyed tax privileges. Stone doorways were the way to display that position in a village where most people built with brick and rammed earth.\n\nBelver was a village of day labourers, and these large houses contrasted with the modest homes of the majority."}],"fr":[{"h":"Histoire","t":"Belver eut au XIIIe siècle un château de l'ordre du Temple. Selon l'historien Francisco Castillón, ses cachots servirent de prison à des chevaliers de l'ordre après la chute du château de Monzón en 1309, lorsque le Temple fut dissous. Ces cachots sont aujourd'hui conservés à l'intérieur de la Casa Camilo.\n\nAux XVIe et XVIIe siècles, avec la prospérité agricole, les familles aisées élevèrent des maisons de style Renaissance aragonaise, avec de grands portails de pierre et des blasons.\n\nLa dissolution du Temple au début du XIVe siècle fut un épisode dramatique en Aragon : les derniers Templiers résistèrent dans leurs châteaux, comme celui de Monzón, avant de se rendre et d'être emprisonnés."},{"h":"À voir","t":"Cherchez la Casa Prim, avec un grand portail de pierre daté de 1797 ; la Casa Batista, avec un portail du XVIe siècle et un blason en relief en creux ; et la Casa Ferrer, avec portail et blason du XVIIIe siècle. La Casa Benito, la Casa Pardo, la Casa Canalís et la Casa Camilo complètent la promenade.\n\nLa Casa Fox occupe l'ancien ermitage de Nuestra Señora de Gracia, dont les cryptes, selon la tradition, abritèrent des sépultures templières.\n\nMarchez lentement et levez les yeux : de nombreux détails, comme les avant-toits en bois, les grilles ou les petites fenêtres de pierre, passent inaperçus si l'on ne regarde qu'au niveau de la rue."},{"h":"Pour comprendre","t":"En Aragon, le nom d'une maison n'est pas celui d'une personne, mais celui de la famille et du patrimoine qui se transmettent de génération en génération. C'est pourquoi on parle de Casa Prim ou de Casa Pardo même si d'autres familles y vivent aujourd'hui.\n\nLes blasons sur les façades indiquaient la condition d'infanzones, la petite noblesse rurale, qui jouissait de privilèges fiscaux. Les portails de pierre étaient le moyen d'afficher ce rang dans un village où la plupart bâtissaient en brique et en pisé.\n\nBelver fut un village de journaliers, et ces grandes maisons contrastaient avec les habitations modestes de la majorité."}],"de":[{"h":"Geschichte","t":"Belver besaß im 13. Jahrhundert eine Burg des Templerordens. Laut dem Historiker Francisco Castillón dienten ihre Verliese als Gefängnis für Ordensritter nach dem Fall der Burg von Monzón 1309, als der Templerorden aufgelöst wurde. Heute sind diese Verliese in der Casa Camilo erhalten.\n\nIm 16. und 17. Jahrhundert errichteten wohlhabende Familien dank des landwirtschaftlichen Wohlstands Häuser im aragonesischen Renaissancestil mit großen Steinportalen und Wappen.\n\nDie Auflösung des Templerordens zu Beginn des 14. Jahrhunderts war in Aragón ein dramatisches Kapitel: Die letzten Templer leisteten in ihren Burgen wie der von Monzón Widerstand, bevor sie sich ergaben und eingekerkert wurden."},{"h":"Sehenswert","t":"Suchen Sie die Casa Prim mit einem großen, auf 1797 datierten Steinportal; die Casa Batista mit einem Portal aus dem 16. Jahrhundert und einem vertieften Reliefwappen; und die Casa Ferrer mit Portal und Wappen aus dem 18. Jahrhundert. Den Rundgang vervollständigen die Casa Benito, die Casa Pardo, die Casa Canalís und die Casa Camilo.\n\nDie Casa Fox nimmt die ehemalige Einsiedelei Nuestra Señora de Gracia ein, deren Krypten der Überlieferung nach Templergräber bargen.\n\nGehen Sie langsam und schauen Sie nach oben: Viele Details wie hölzerne Traufen, Gitter oder kleine Steinfenster bleiben unbemerkt, wenn man nur auf Straßenhöhe blickt."},{"h":"Zum Verständnis","t":"In Aragón ist der Name eines Hauses nicht der einer Person, sondern der der Familie und des Besitzes, die von Generation zu Generation weitergegeben werden. Deshalb spricht man von Casa Prim oder Casa Pardo, auch wenn heute Menschen mit anderen Nachnamen darin wohnen.\n\nDie Wappen an den Fassaden zeigten den Stand der Infanzones an, des niederen Landadels, der Steuerprivilegien genoss. Die Steinportale waren die Art, diese Stellung in einem Dorf zu zeigen, in dem die meisten mit Ziegel und Stampflehm bauten.\n\nBelver war ein Dorf der Tagelöhner, und diese großen Häuser standen im Kontrast zu den bescheidenen Wohnungen der Mehrheit."}],"pt":[{"h":"História","t":"Belver teve no século XIII um castelo da Ordem do Templo. Segundo o historiador Francisco Castillón, as suas masmorras serviram de prisão para cavaleiros da ordem após a queda do castelo de Monzón em 1309, quando o Templo foi dissolvido. Hoje essas masmorras conservam-se dentro da Casa Camilo.\n\nNos séculos XVI e XVII, com a prosperidade agrícola, as famílias abastadas ergueram casas de estilo aragonês renascentista, com grandes portais de pedra e brasões.\n\nA dissolução do Templo no início do século XIV foi um episódio dramático em Aragão: os últimos templários resistiram nos seus castelos, como o de Monzón, antes de se renderem e serem encarcerados."},{"h":"O que ver","t":"Procure a Casa Prim, com um grande portal de pedra datado de 1797; a Casa Batista, com portal do século XVI e brasão em baixo-relevo escavado; e a Casa Ferrer, com portal e brasão do século XVIII. Completam o passeio a Casa Benito, a Casa Pardo, a Casa Canalís e a Casa Camilo.\n\nA Casa Fox ocupa a antiga ermida de Nuestra Señora de Gracia, cujas criptas, segundo a tradição, guardaram enterramentos templários.\n\nCaminhe devagar e olhe para cima: muitos pormenores, como beirais de madeira, grades ou pequenas janelas de pedra, passam despercebidos se se olhar apenas à altura da rua."},{"h":"Para compreender","t":"Em Aragão, o nome de uma casa não é o de uma pessoa, mas o da família e do património que passam de geração em geração. Por isso fala-se de Casa Prim ou Casa Pardo, embora hoje vivam nelas pessoas com outros apelidos.\n\nOs brasões nas fachadas indicavam a condição de infanzones, a pequena nobreza rural, que tinha privilégios fiscais. Os portais de pedra eram a forma de mostrar essa posição numa povoação onde a maioria construía com tijolo e taipa.\n\nBelver foi uma povoação de jornaleiros, e estas casas grandes contrastavam com as habitações modestas da maioria."}]},"status":"pending"},{"id":"iglesia-osso","town":"Osso de Cinca","cat":"patrimonio","lat":41.66479,"lon":0.19242,"coord_src":null,"q":["Iglesia de Santa Margarita, Osso de Cinca","Iglesia parroquial, Osso de Cinca"],"fq":["Osso de Cinca iglesia","Iglesia de Santa Margarita Osso de Cinca","Osso de Cinca"],"name":{"es":"Iglesia de Santa Margarita","en":"Iglesia de Santa Margarita (Church of St Margaret)","fr":"Iglesia de Santa Margarita (église)","de":"Iglesia de Santa Margarita","pt":"Igreja de Santa Margarita"},"when":{"es":"Barroco en ladrillo · Parroquia","en":"Baroque in brick · Parish church","fr":"Baroque en brique · Paroisse","de":"Backsteinbarock · Pfarrkirche","pt":"Barroco em tijolo · Paróquia"},"desc":{"es":"Una iglesia barroca de ladrillo sobre basamento de piedra, con una torre de cuatro cuerpos que pasa del cuadrado al octógono. Es la silueta de Osso, en la orilla izquierda del Cinca.","en":"A Baroque brick church on a stone base, with a four-stage tower that changes from square to octagonal. It is the silhouette of Osso, on the left bank of the Cinca.","fr":"Une église baroque en brique sur un soubassement de pierre, avec une tour à quatre niveaux qui passe du carré à l'octogone. C'est la silhouette d'Osso, sur la rive gauche du Cinca.","de":"Eine barocke Backsteinkirche auf einem Steinsockel mit einem viergeschossigen Turm, der vom Quadrat zum Achteck übergeht. Sie ist die Silhouette von Osso am linken Ufer des Cinca.","pt":"Uma igreja barroca de tijolo sobre embasamento de pedra, com uma torre de quatro corpos que passa do quadrado ao octógono. É a silhueta de Osso, na margem esquerda do Cinca."},"visit":{"es":"Está en el centro del pueblo. El exterior se ve libremente; el interior en horario de culto. Calcula 20 minutos y sigue hasta la Casa Mora, en la calle Mayor.","en":"It is in the village centre. The exterior can be seen freely; the interior during services. Allow 20 minutes, then carry on to Casa Mora, on Calle Mayor.","fr":"Elle se trouve au centre du village. L'extérieur se voit librement ; l'intérieur pendant les offices. Comptez 20 minutes, puis continuez jusqu'à la Casa Mora, dans la calle Mayor.","de":"Sie steht im Ortszentrum. Von außen ist sie frei zu besichtigen, das Innere zu den Gottesdienstzeiten. Rechnen Sie mit 20 Minuten und gehen Sie weiter zur Casa Mora in der Calle Mayor.","pt":"Fica no centro da povoação. O exterior vê-se livremente; o interior no horário de culto. Conte com 20 minutos e siga até à Casa Mora, na calle Mayor."},"src":"https://www.bajocinca.es/osso-de-cinca/-/asset_publisher/Wul1Dqy2XZwM/content/id/1597220","sources":["https://www.bajocinca.es/osso-de-cinca/-/asset_publisher/Wul1Dqy2XZwM/content/id/1597220","https://es.hispanopedia.com/wiki/Osso_de_Cinca"],"art":{"es":[{"h":"Historia","t":"Osso de Cinca se extiende por la margen izquierda del río, en un valle entre los montes de la Encomienda y Calavera. Su parroquia está dedicada a Santa Margarita, patrona del pueblo, y es de estilo barroco, construida en ladrillo sobre un basamento de piedra.\n\nEl ladrillo fue el material habitual en la ribera, donde la piedra escaseaba y la arcilla abundaba. Las fuentes describen también rasgos mudéjares y una portada de influencia renacentista, señal de las distintas tradiciones que conviven en el edificio.\n\nLa iglesia preside un pueblo de calles sencillas, organizado a lo largo de la calle Mayor, donde se levanta también la Casa Mora, hoy Ayuntamiento.\n\nEl término incluye también el núcleo de Almudáfar, cuyo nombre de origen árabe recuerda el pasado andalusí de la ribera del Cinca."},{"h":"Qué ver","t":"La puerta está a los pies de la nave, con un arco de medio punto relleno de motivos geométricos, y remata en un frontón triangular abierto con bolas y hornacinas.\n\nLa torre es lo más llamativo: los dos primeros cuerpos son cuadrados, el tercero tiene las esquinas redondeadas y pilastras, y el cuarto es octogonal. Ese paso del cuadrado al octógono era muy apreciado por los maestros de obras aragoneses.\n\nRodea la iglesia para ver cómo el basamento de piedra protege el ladrillo de la humedad del suelo, una solución que verás repetida en muchas casas del pueblo."},{"h":"Tradiciones y fiestas","t":"Santa Margarita se celebra en torno al 20 de julio, con una cena popular la víspera, misa el día de la patrona, baile por la tarde y verbena por la noche. El primer domingo de mayo, la Fiesta de la Rosa reparte una rosa roja a cada asistente, y el 15 de mayo San Isidro sale al campo de fútbol con misa y comida popular.\n\nEn junio, una concentración ecuestre llena el pueblo de caballos. Completa la visita bajando al embarcadero del proyecto Entre Ríos, junto al Cinca."}],"en":[{"h":"History","t":"Osso de Cinca stretches along the left bank of the river, in a valley between the Encomienda and Calavera hills. Its parish church is dedicated to St Margaret, the village's patron saint, and is Baroque in style, built in brick on a stone base.\n\nBrick was the usual material along the riverside, where stone was scarce and clay plentiful. Sources also describe Mudéjar features and a Renaissance-influenced doorway, a sign of the different traditions that coexist in the building.\n\nThe church presides over a village of simple streets, laid out along Calle Mayor, where Casa Mora, now the Town Hall, also stands.\n\nThe municipality also includes the hamlet of Almudáfar, whose name of Arabic origin recalls the Andalusi past of the Cinca riverside."},{"h":"What to see","t":"The door is at the foot of the nave, with a round arch filled with geometric motifs, and is topped by an open triangular pediment with balls and niches.\n\nThe tower is the most striking feature: the first two stages are square, the third has rounded corners and pilasters, and the fourth is octagonal. That transition from square to octagon was much prized by Aragonese master builders.\n\nWalk round the church to see how the stone base protects the brick from ground damp, a solution you will see repeated in many houses in the village."},{"h":"Traditions and festivals","t":"St Margaret is celebrated around 20 July, with a communal dinner on the eve, mass on the patron saint's day, dancing in the afternoon and an open-air party at night. On the first Sunday in May, the Fiesta de la Rosa (Rose Festival) gives a red rose to everyone who attends, and on 15 May San Isidro is taken out to the football ground with mass and a communal meal.\n\nIn June, a horse gathering fills the village with horses. Round off your visit by going down to the Entre Ríos project landing stage beside the Cinca."}],"fr":[{"h":"Histoire","t":"Osso de Cinca s'étend sur la rive gauche de la rivière, dans une vallée entre les monts de la Encomienda et de Calavera. Son église paroissiale est dédiée à sainte Marguerite, patronne du village ; de style baroque, elle est construite en brique sur un soubassement de pierre.\n\nLa brique était le matériau habituel sur la rive, où la pierre était rare et l'argile abondante. Les sources décrivent aussi des traits mudéjars et un portail d'influence Renaissance, signe des différentes traditions qui cohabitent dans l'édifice.\n\nL'église domine un village aux rues simples, organisé le long de la calle Mayor, où s'élève aussi la Casa Mora, aujourd'hui mairie.\n\nLa commune comprend également le hameau d'Almudáfar, dont le nom d'origine arabe rappelle le passé andalou de la rive du Cinca."},{"h":"À voir","t":"La porte se trouve au fond de la nef, avec un arc en plein cintre rempli de motifs géométriques, et se termine par un fronton triangulaire ouvert orné de boules et de niches.\n\nLa tour est l'élément le plus frappant : les deux premiers niveaux sont carrés, le troisième a les angles arrondis et des pilastres, et le quatrième est octogonal. Ce passage du carré à l'octogone était très apprécié des maîtres d'œuvre aragonais.\n\nFaites le tour de l'église pour voir comment le soubassement de pierre protège la brique de l'humidité du sol, une solution que vous retrouverez dans de nombreuses maisons du village."},{"h":"Traditions et fêtes","t":"La Santa Margarita se fête autour du 20 juillet, avec un dîner populaire la veille, une messe le jour de la patronne, un bal l'après-midi et une fête nocturne le soir. Le premier dimanche de mai, la Fiesta de la Rosa offre une rose rouge à chaque participant, et le 15 mai la San Isidro se célèbre au terrain de football avec messe et repas populaire.\n\nEn juin, un rassemblement équestre remplit le village de chevaux. Complétez la visite en descendant à l'embarcadère du projet Entre Ríos, au bord du Cinca."}],"de":[{"h":"Geschichte","t":"Osso de Cinca erstreckt sich am linken Flussufer in einem Tal zwischen den Bergen de la Encomienda und Calavera. Seine Pfarrkirche ist Santa Margarita geweiht, der Schutzheiligen des Dorfes, und im Barockstil aus Backstein auf einem Steinsockel erbaut.\n\nBackstein war das übliche Material am Fluss, wo Stein knapp und Ton reichlich vorhanden war. Die Quellen beschreiben auch Mudéjar-Züge und ein von der Renaissance beeinflusstes Portal, Zeichen der verschiedenen Traditionen, die in dem Bau zusammenkommen.\n\nDie Kirche überragt ein Dorf mit schlichten Gassen entlang der Calle Mayor, an der auch die Casa Mora steht, heute Rathaus.\n\nZum Gemeindegebiet gehört auch der Ortsteil Almudáfar, dessen arabischstämmiger Name an die andalusische Vergangenheit der Cinca-Aue erinnert."},{"h":"Sehenswert","t":"Die Tür liegt am Westende des Schiffes, mit einem Rundbogen voller geometrischer Motive, und schließt mit einem offenen Dreiecksgiebel mit Kugeln und Nischen ab.\n\nDer Turm ist das Auffälligste: Die beiden unteren Geschosse sind quadratisch, das dritte hat abgerundete Ecken und Pilaster, das vierte ist achteckig. Dieser Übergang vom Quadrat zum Achteck war bei den aragonesischen Baumeistern sehr beliebt.\n\nGehen Sie um die Kirche herum, um zu sehen, wie der Steinsockel den Backstein vor der Bodenfeuchtigkeit schützt, eine Lösung, die Sie an vielen Häusern des Dorfes wiederfinden."},{"h":"Feste und Traditionen","t":"Santa Margarita wird um den 20. Juli gefeiert, mit einem gemeinsamen Abendessen am Vorabend, einer Messe am Tag der Schutzheiligen, Tanz am Nachmittag und einem Volksfest am Abend. Am ersten Sonntag im Mai wird bei der Fiesta de la Rosa jedem Teilnehmer eine rote Rose überreicht, und am 15. Mai zieht San Isidro zum Fußballplatz hinaus, mit Messe und gemeinsamem Essen.\n\nIm Juni füllt ein Reitertreffen das Dorf mit Pferden. Runden Sie den Besuch mit einem Abstecher zur Anlegestelle des Projekts Entre Ríos am Cinca ab."}],"pt":[{"h":"História","t":"Osso de Cinca estende-se pela margem esquerda do rio, num vale entre os montes da Encomienda e Calavera. A sua igreja paroquial é dedicada a Santa Margarida, padroeira da povoação, e é de estilo barroco, construída em tijolo sobre um embasamento de pedra.\n\nO tijolo foi o material habitual na ribeira, onde a pedra escasseava e a argila abundava. As fontes descrevem também traços mudéjares e um portal de influência renascentista, sinal das diferentes tradições que convivem no edifício.\n\nA igreja preside a uma povoação de ruas simples, organizada ao longo da calle Mayor, onde se ergue também a Casa Mora, hoje Câmara Municipal.\n\nO concelho inclui também o núcleo de Almudáfar, cujo nome de origem árabe recorda o passado al-andalusino da ribeira do Cinca."},{"h":"O que ver","t":"A porta fica ao fundo da nave, com um arco de volta perfeita preenchido com motivos geométricos, e remata num frontão triangular aberto com bolas e nichos.\n\nA torre é o mais impressionante: os dois primeiros corpos são quadrados, o terceiro tem os cantos arredondados e pilastras, e o quarto é octogonal. Essa passagem do quadrado ao octógono era muito apreciada pelos mestres de obras aragoneses.\n\nContorne a igreja para ver como o embasamento de pedra protege o tijolo da humidade do solo, uma solução que verá repetida em muitas casas da povoação."},{"h":"Tradições e festas","t":"Santa Margarida celebra-se por volta de 20 de julho, com um jantar popular na véspera, missa no dia da padroeira, baile à tarde e arraial à noite. No primeiro domingo de maio, a Fiesta de la Rosa oferece uma rosa vermelha a cada participante, e a 15 de maio San Isidro sai para o campo de futebol com missa e refeição popular.\n\nEm junho, uma concentração equestre enche a povoação de cavalos. Complete a visita descendo ao cais do projeto Entre Ríos, junto ao Cinca."}]},"status":"pending"},{"id":"casa-mora-osso","town":"Osso de Cinca","cat":"patrimonio","lat":41.6628,"lon":0.19303,"coord_src":null,"q":["Casa Mora, Osso de Cinca","Ayuntamiento de Osso de Cinca"],"fq":["Casa Mora Osso de Cinca","Osso de Cinca ayuntamiento","Osso de Cinca calle Mayor"],"name":{"es":"Casa Mora","en":"Casa Mora","fr":"Casa Mora","de":"Casa Mora","pt":"Casa Mora"},"when":{"es":"Siglo XVII · Casa aragonesa y Ayuntamiento","en":"17th century · Aragonese house and Town Hall","fr":"XVIIe siècle · Maison aragonaise et mairie","de":"17. Jh. · Aragonesisches Haus und Rathaus","pt":"Século XVII · Casa aragonesa e Câmara Municipal"},"desc":{"es":"Una casona aragonesa del siglo XVII, de ladrillo sobre piedra, rehabilitada como Ayuntamiento, museo y biblioteca. En su esquina, una pequeña capilla abierta guarda la figura de San Roque peregrino.","en":"A grand 17th-century Aragonese house, brick on stone, restored as the Town Hall, museum and library. On its corner, a small open chapel holds the figure of St Roch as a pilgrim.","fr":"Une grande demeure aragonaise du XVIIe siècle, en brique sur pierre, réhabilitée en mairie, musée et bibliothèque. À son angle, une petite chapelle ouverte abrite la figure de saint Roch pèlerin.","de":"Ein aragonesisches Herrenhaus aus dem 17. Jahrhundert, Backstein auf Stein, umgebaut zu Rathaus, Museum und Bibliothek. An seiner Ecke birgt eine kleine offene Kapelle die Figur des Pilgers San Roque.","pt":"Um casarão aragonês do século XVII, de tijolo sobre pedra, reabilitado como Câmara Municipal, museu e biblioteca. No seu canto, uma pequena capela aberta guarda a figura de São Roque peregrino."},"visit":{"es":"Está en la calle Mayor de Osso de Cinca. La fachada se ve libremente; el interior abre en horario municipal y con las exposiciones. Confirma en el Ayuntamiento. Calcula 20 minutos.","en":"It is on Calle Mayor in Osso de Cinca. The façade can be seen freely; the interior opens during council office hours and for exhibitions. Check with the Town Council. Allow 20 minutes.","fr":"Elle se trouve dans la calle Mayor d'Osso de Cinca. La façade se voit librement ; l'intérieur ouvre aux horaires municipaux et lors des expositions. Renseignez-vous à la mairie. Comptez 20 minutes.","de":"Sie liegt in der Calle Mayor von Osso de Cinca. Die Fassade ist frei zu besichtigen; das Innere ist zu den Öffnungszeiten der Gemeinde und bei Ausstellungen geöffnet. Bitte im Rathaus erfragen. Rechnen Sie mit 20 Minuten.","pt":"Fica na calle Mayor de Osso de Cinca. A fachada vê-se livremente; o interior abre no horário municipal e com as exposições. Confirme na Câmara Municipal. Conte com 20 minutos."},"src":"https://www.bajocinca.es/osso-de-cinca/-/asset_publisher/Wul1Dqy2XZwM/content/id/1597220","sources":["https://www.bajocinca.es/osso-de-cinca/-/asset_publisher/Wul1Dqy2XZwM/content/id/1597220","https://es.hispanopedia.com/wiki/Osso_de_Cinca"],"art":{"es":[{"h":"Historia","t":"La Casa Mora es una casa de estilo popular aragonés del siglo XVII, levantada en ladrillo visto sobre un primer cuerpo de piedra sillar. Es una de las casas principales del pueblo.\n\nSe rehabilitó en 2008 y hoy alberga la casa consistorial, un museo y sala de exposiciones, la biblioteca y un telecentro. Es un buen ejemplo de cómo un edificio privado puede convertirse en el centro de la vida de un pueblo pequeño.\n\nLa rehabilitación conservó la estructura de la casa y su aspecto exterior, de modo que el edificio sigue mostrando cómo vivía una familia acomodada de la ribera en el siglo XVII."},{"h":"Qué ver","t":"La casa tiene fachada a dos calles y se reparte en cuatro plantas. La puerta, con arco de medio punto, da a la calle Mayor. En la segunda planta busca el escudo nobiliario.\n\nEn la esquina se abre una pequeña capilla con la figura de San Roque peregrino, el santo al que se encomendaban los pueblos en tiempos de peste. El escudo se parece al de la casa María Roque de Albalate de Cinca, de la familia Guilleuma, lo que sugiere lazos entre las dos familias.\n\nSi coincide con alguna exposición, entra: el interior permite ver la distribución de una gran casa aragonesa, con sus plantas superpuestas y sus muros gruesos que mantienen el fresco en verano."},{"h":"Para entenderlo","t":"La combinación de piedra abajo y ladrillo arriba es típica de la arquitectura de la ribera del Cinca: la piedra protege el edificio de la humedad del suelo y el ladrillo, más barato y ligero, permite levantar las plantas altas.\n\nLas capillas de esquina, como la de San Roque, eran frecuentes en las casas importantes: ponían la calle bajo la protección del santo y mostraban la devoción de la familia. Después de la Casa Mora, baja al embarcadero del Cinca, habilitado por la Comarca."}],"en":[{"h":"History","t":"Casa Mora is a 17th-century house in the Aragonese vernacular style, built in exposed brick on a ground floor of ashlar stone. It is one of the principal houses in the village.\n\nIt was restored in 2008 and now houses the town hall, a museum and exhibition room, the library and a telecentre. It is a good example of how a private building can become the centre of life in a small village.\n\nThe restoration kept the structure of the house and its outward appearance, so the building still shows how a well-off riverside family lived in the 17th century."},{"h":"What to see","t":"The house has façades on two streets and is spread over four floors. The round-arched door opens onto Calle Mayor. On the second floor, look for the noble coat of arms.\n\nOn the corner is a small chapel with the figure of St Roch as a pilgrim, the saint to whom villages commended themselves in times of plague. The coat of arms resembles that of the María Roque house in Albalate de Cinca, belonging to the Guilleuma family, which suggests ties between the two families.\n\nIf there is an exhibition on, go in: the interior lets you see the layout of a large Aragonese house, with its stacked floors and thick walls that keep it cool in summer."},{"h":"Background","t":"The combination of stone below and brick above is typical of the architecture of the Cinca riverside: the stone protects the building from ground damp, and the brick, cheaper and lighter, allows the upper floors to be built.\n\nCorner chapels, like the one to St Roch, were common on important houses: they placed the street under the saint's protection and showed the family's devotion. After Casa Mora, go down to the landing stage on the Cinca, created by the Comarca."}],"fr":[{"h":"Histoire","t":"La Casa Mora est une maison de style populaire aragonais du XVIIe siècle, élevée en brique apparente sur un premier niveau en pierre de taille. C'est l'une des principales maisons du village.\n\nRéhabilitée en 2008, elle abrite aujourd'hui l'hôtel de ville, un musée et une salle d'exposition, la bibliothèque et un télécentre. C'est un bon exemple de la manière dont un édifice privé peut devenir le centre de la vie d'un petit village.\n\nLa réhabilitation a conservé la structure de la maison et son aspect extérieur, si bien que l'édifice montre toujours comment vivait une famille aisée de la rive au XVIIe siècle."},{"h":"À voir","t":"La maison a une façade sur deux rues et se répartit sur quatre niveaux. La porte, en arc en plein cintre, donne sur la calle Mayor. Au deuxième étage, cherchez le blason nobiliaire.\n\nÀ l'angle s'ouvre une petite chapelle abritant la figure de saint Roch pèlerin, le saint que les villages invoquaient en temps de peste. Le blason ressemble à celui de la maison María Roque d'Albalate de Cinca, de la famille Guilleuma, ce qui suggère des liens entre les deux familles.\n\nSi une exposition est en cours, entrez : l'intérieur permet de voir la distribution d'une grande maison aragonaise, avec ses niveaux superposés et ses murs épais qui gardent la fraîcheur en été."},{"h":"Pour comprendre","t":"La combinaison de la pierre en bas et de la brique en haut est typique de l'architecture de la rive du Cinca : la pierre protège l'édifice de l'humidité du sol, et la brique, moins chère et plus légère, permet d'élever les étages supérieurs.\n\nLes chapelles d'angle, comme celle de San Roque, étaient fréquentes dans les maisons importantes : elles plaçaient la rue sous la protection du saint et affichaient la dévotion de la famille. Après la Casa Mora, descendez à l'embarcadère du Cinca, aménagé par la Comarca."}],"de":[{"h":"Geschichte","t":"Die Casa Mora ist ein Haus im aragonesischen Volksstil aus dem 17. Jahrhundert, aus Sichtbackstein über einem ersten Geschoss aus Quadersteinen errichtet. Sie ist eines der Hauptgebäude des Dorfes.\n\n2008 wurde sie saniert und beherbergt heute das Rathaus, ein Museum mit Ausstellungsraum, die Bibliothek und ein Telezentrum. Ein gutes Beispiel dafür, wie ein Privatgebäude zum Mittelpunkt des Lebens in einem kleinen Dorf werden kann.\n\nBei der Sanierung blieben die Struktur des Hauses und sein Äußeres erhalten, sodass das Gebäude weiterhin zeigt, wie eine wohlhabende Familie am Fluss im 17. Jahrhundert lebte."},{"h":"Sehenswert","t":"Das Haus hat Fassaden zu zwei Straßen und verteilt sich auf vier Geschosse. Die Tür mit Rundbogen öffnet sich zur Calle Mayor. Suchen Sie im zweiten Obergeschoss das Adelswappen.\n\nAn der Ecke öffnet sich eine kleine Kapelle mit der Figur des Pilgers San Roque, des Heiligen, dem sich die Dörfer in Pestzeiten anvertrauten. Das Wappen ähnelt dem des Hauses María Roque in Albalate de Cinca, das der Familie Guilleuma gehörte, was auf Verbindungen zwischen beiden Familien hindeutet.\n\nWenn gerade eine Ausstellung läuft, gehen Sie hinein: Das Innere zeigt die Raumaufteilung eines großen aragonesischen Hauses mit übereinanderliegenden Geschossen und dicken Mauern, die im Sommer die Kühle halten."},{"h":"Zum Verständnis","t":"Die Kombination aus Stein unten und Backstein oben ist typisch für die Architektur der Cinca-Aue: Der Stein schützt das Gebäude vor der Bodenfeuchtigkeit, und der günstigere und leichtere Backstein erlaubt es, die oberen Geschosse zu errichten.\n\nEckkapellen wie die des San Roque waren an bedeutenden Häusern häufig: Sie stellten die Straße unter den Schutz des Heiligen und zeigten die Frömmigkeit der Familie. Gehen Sie nach der Casa Mora hinunter zur Anlegestelle am Cinca, die die Comarca angelegt hat."}],"pt":[{"h":"História","t":"A Casa Mora é uma casa de estilo popular aragonês do século XVII, erguida em tijolo à vista sobre um primeiro corpo de pedra de silharia. É uma das casas principais da povoação.\n\nFoi reabilitada em 2008 e hoje alberga os paços do concelho, um museu e sala de exposições, a biblioteca e um telecentro. É um bom exemplo de como um edifício privado se pode transformar no centro da vida de uma pequena povoação.\n\nA reabilitação conservou a estrutura da casa e o seu aspeto exterior, de modo que o edifício continua a mostrar como vivia uma família abastada da ribeira no século XVII."},{"h":"O que ver","t":"A casa tem fachada para duas ruas e distribui-se por quatro pisos. A porta, com arco de volta perfeita, dá para a calle Mayor. No segundo piso, procure o brasão nobiliárquico.\n\nNo canto abre-se uma pequena capela com a figura de São Roque peregrino, o santo a quem as povoações se encomendavam em tempos de peste. O brasão assemelha-se ao da casa María Roque de Albalate de Cinca, da família Guilleuma, o que sugere laços entre as duas famílias.\n\nSe coincidir com alguma exposição, entre: o interior permite ver a distribuição de uma grande casa aragonesa, com os seus pisos sobrepostos e as paredes grossas que mantêm o fresco no verão."},{"h":"Para compreender","t":"A combinação de pedra em baixo e tijolo em cima é típica da arquitetura da ribeira do Cinca: a pedra protege o edifício da humidade do solo e o tijolo, mais barato e leve, permite erguer os pisos superiores.\n\nAs capelas de esquina, como a de São Roque, eram frequentes nas casas importantes: colocavam a rua sob a proteção do santo e mostravam a devoção da família. Depois da Casa Mora, desça ao cais do Cinca, preparado pela Comarca."}]},"status":"pending"},{"id":"iglesia-ontinena","town":"Ontiñena","cat":"patrimonio","lat":41.67676,"lon":0.08899,"coord_src":null,"q":["Iglesia de Santa María la Mayor, Ontiñena","Iglesia parroquial, Ontiñena"],"fq":["Ontiñena iglesia","Iglesia de Santa María la Mayor Ontiñena","Ontiñena"],"name":{"es":"Iglesia de Santa María la Mayor","en":"Iglesia de Santa María la Mayor","fr":"Iglesia de Santa María la Mayor (église)","de":"Iglesia de Santa María la Mayor","pt":"Igreja de Santa María la Mayor"},"when":{"es":"Siglo XIII · Románico tardío y gótico","en":"13th century · Late Romanesque and Gothic","fr":"XIIIe siècle · Roman tardif et gothique","de":"13. Jh. · Spätromanik und Gotik","pt":"Século XIII · Românico tardio e gótico"},"desc":{"es":"Una iglesia del siglo XIII con portada románica tardía y ábside de aire cisterciense, base de sillería y remate de ladrillo. Guarda la Santa Reliquia, que da nombre a las fiestas de septiembre.","en":"A 13th-century church with a late Romanesque doorway and a Cistercian-style apse, with an ashlar base and a brick top. It holds the Santa Reliquia (Holy Relic), which gives its name to the September festivities.","fr":"Une église du XIIIe siècle au portail roman tardif et à l'abside d'allure cistercienne, avec une base en pierre de taille et un couronnement en brique. Elle conserve la Santa Reliquia, qui donne son nom aux fêtes de septembre.","de":"Eine Kirche aus dem 13. Jahrhundert mit spätromanischem Portal und einer Apsis zisterziensischer Prägung, Sockel aus Quadern und Abschluss aus Backstein. Sie bewahrt die Santa Reliquia, nach der die Feste im September benannt sind.","pt":"Uma igreja do século XIII com portal românico tardio e abside de ar cisterciense, base de silharia e remate de tijolo. Guarda a Santa Relíquia, que dá nome às festas de setembro."},"visit":{"es":"Está en el casco urbano de Ontiñena. El exterior se ve libremente; el interior en horario de culto. Calcula 30 minutos con un paseo por las calles del siglo XVIII y el Ayuntamiento.","en":"It is in the centre of Ontiñena. The exterior can be seen freely; the interior during services. Allow 30 minutes including a stroll past the 18th-century streets and the Town Hall.","fr":"Elle se trouve dans le centre d'Ontiñena. L'extérieur se voit librement ; l'intérieur pendant les offices. Comptez 30 minutes avec une promenade dans les rues du XVIIIe siècle et jusqu'à la mairie.","de":"Sie steht im Ortskern von Ontiñena. Von außen ist sie frei zu besichtigen, das Innere zu den Gottesdienstzeiten. Rechnen Sie mit 30 Minuten einschließlich Spaziergang durch die Gassen aus dem 18. Jahrhundert und zum Rathaus.","pt":"Fica no núcleo urbano de Ontiñena. O exterior vê-se livremente; o interior no horário de culto. Conte com 30 minutos com um passeio pelas ruas do século XVIII e pela Câmara Municipal."},"src":"https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597252","sources":["https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597252","https://es.hispanopedia.com/wiki/Onti%C3%B1ena"],"art":{"es":[{"h":"Historia","t":"La parroquia de Santa María la Mayor se levantó en el siglo XIII, cuando Ontiñena, en la orilla del Alcanadre, formaba parte de los territorios ganados en la frontera de los Monegros. Es de estilo gótico, aunque conserva la portada occidental en un románico tardío.\n\nSu retablo mayor, del siglo XV, fue destruido en 1936, al comienzo de la guerra civil; solo se conservan fotografías de él.\n\nOntiñena se asienta a la derecha del Alcanadre, al pie de la sierra que le da nombre. En su término hay yacimientos de época antigua, como el Puntal, fechado hacia los siglos III y II antes de Cristo, señal de que estas tierras estuvieron habitadas mucho antes de que se levantara la iglesia."},{"h":"Qué ver","t":"La portada occidental es la parte más antigua a la vista. Dentro hay una nave única con tres capillas laterales y un ábside poligonal de aspecto cisterciense, sobrio y luminoso.\n\nRodea el edificio para ver el cambio de materiales: la base es de sillería y la parte superior del ábside, de ladrillo. En el casco urbano hay varios edificios del siglo XVIII, entre ellos el Ayuntamiento, con reloj en la fachada.\n\nFíjate en el ábside desde la calle: su forma poligonal y sus muros lisos responden a la estética cisterciense, que buscaba la sencillez y la luz frente a la decoración abundante del románico."},{"h":"Tradiciones y fiestas","t":"La iglesia guarda la Santa Reliquia, un fragmento del Lignum Crucis, la madera de la cruz venerada en Santo Toribio de Liébana, que llegó a Ontiñena a finales del siglo XVIII. Desde entonces da nombre a las fiestas mayores, en torno al 8 de septiembre.\n\nEl 5 de febrero el pueblo celebra Santa Águeda, y el 9 de mayo sube en romería a la ermita de San Gregorio, en la sierra, a unos 16 kilómetros.\n\nEl Lignum Crucis de Santo Toribio, en Cantabria, es una de las reliquias más veneradas de España, y la llegada de un fragmento a un pueblo pequeño como Ontiñena fue un acontecimiento que todavía se recuerda cada septiembre."}],"en":[{"h":"History","t":"The parish church of Santa María la Mayor was built in the 13th century, when Ontiñena, on the bank of the Alcanadre, was part of the territories won on the Monegros frontier. It is Gothic in style, although it keeps its west doorway in a late Romanesque style.\n\nIts 15th-century high altarpiece was destroyed in 1936, at the beginning of the Civil War; only photographs of it survive.\n\nOntiñena sits on the right bank of the Alcanadre, at the foot of the range that gives it its name. In the municipality there are ancient sites, such as El Puntal, dated to around the 3rd and 2nd centuries BC, a sign that these lands were inhabited long before the church was built."},{"h":"What to see","t":"The west doorway is the oldest visible part. Inside there is a single nave with three side chapels and a polygonal apse of Cistercian appearance, sober and full of light.\n\nWalk round the building to see the change of materials: the base is ashlar and the upper part of the apse is brick. In the village centre there are several 18th-century buildings, including the Town Hall, with a clock on its façade.\n\nLook at the apse from the street: its polygonal shape and plain walls reflect the Cistercian aesthetic, which sought simplicity and light rather than the abundant decoration of the Romanesque."},{"h":"Traditions and festivals","t":"The church holds the Santa Reliquia, a fragment of the Lignum Crucis, the wood of the Cross venerated at Santo Toribio de Liébana, which arrived in Ontiñena at the end of the 18th century. Ever since, it has given its name to the main festivities, around 8 September.\n\nOn 5 February the village celebrates Santa Águeda (St Agatha), and on 9 May it goes on pilgrimage to the hermitage of San Gregorio, in the hills, about 16 kilometres away.\n\nThe Lignum Crucis of Santo Toribio, in Cantabria, is one of the most venerated relics in Spain, and the arrival of a fragment in a small village like Ontiñena was an event still remembered every September."}],"fr":[{"h":"Histoire","t":"L'église paroissiale Santa María la Mayor fut élevée au XIIIe siècle, quand Ontiñena, sur la rive de l'Alcanadre, faisait partie des territoires gagnés sur la frontière des Monegros. Elle est de style gothique, mais conserve son portail occidental de style roman tardif.\n\nSon retable majeur, du XVe siècle, fut détruit en 1936, au début de la guerre civile ; il n'en subsiste que des photographies.\n\nOntiñena s'étend sur la rive droite de l'Alcanadre, au pied de la sierra qui porte son nom. La commune compte des sites archéologiques anciens, comme le Puntal, daté des IIIe et IIe siècles avant J.-C., signe que ces terres furent habitées bien avant la construction de l'église."},{"h":"À voir","t":"Le portail occidental est la partie la plus ancienne visible. À l'intérieur, une nef unique avec trois chapelles latérales et une abside polygonale d'allure cistercienne, sobre et lumineuse.\n\nFaites le tour de l'édifice pour voir le changement de matériaux : la base est en pierre de taille et la partie haute de l'abside en brique. Le centre du village compte plusieurs édifices du XVIIIe siècle, dont la mairie, avec une horloge en façade.\n\nObservez l'abside depuis la rue : sa forme polygonale et ses murs lisses répondent à l'esthétique cistercienne, qui recherchait la simplicité et la lumière plutôt que l'abondante décoration du roman."},{"h":"Traditions et fêtes","t":"L'église conserve la Santa Reliquia, un fragment du Lignum Crucis, le bois de la croix vénéré à Santo Toribio de Liébana, arrivé à Ontiñena à la fin du XVIIIe siècle. Depuis, il donne son nom aux fêtes majeures, autour du 8 septembre.\n\nLe 5 février, le village célèbre la Santa Águeda, et le 9 mai il monte en pèlerinage à l'ermitage de San Gregorio, dans la sierra, à environ 16 kilomètres.\n\nLe Lignum Crucis de Santo Toribio, en Cantabrie, est l'une des reliques les plus vénérées d'Espagne, et l'arrivée d'un fragment dans un petit village comme Ontiñena fut un événement que l'on commémore encore chaque septembre."}],"de":[{"h":"Geschichte","t":"Die Pfarrkirche Santa María la Mayor entstand im 13. Jahrhundert, als Ontiñena am Ufer des Alcanadre zu den an der Grenze der Monegros gewonnenen Gebieten gehörte. Sie ist gotisch, bewahrt aber das Westportal in spätromanischem Stil.\n\nIhr Hochaltarretabel aus dem 15. Jahrhundert wurde 1936, zu Beginn des Bürgerkriegs, zerstört; erhalten sind nur Fotografien.\n\nOntiñena liegt rechts des Alcanadre am Fuß der gleichnamigen Sierra. Im Gemeindegebiet gibt es Fundstätten aus der Antike wie El Puntal, datiert etwa ins 3. und 2. Jahrhundert v. Chr. – ein Zeichen dafür, dass dieses Land lange vor dem Bau der Kirche bewohnt war."},{"h":"Sehenswert","t":"Das Westportal ist der älteste sichtbare Teil. Im Inneren gibt es ein einziges Schiff mit drei Seitenkapellen und eine polygonale Apsis zisterziensischer Prägung, schlicht und lichtdurchflutet.\n\nGehen Sie um das Gebäude herum, um den Materialwechsel zu sehen: Der Sockel ist aus Quadern, der obere Teil der Apsis aus Backstein. Im Ortskern gibt es mehrere Gebäude aus dem 18. Jahrhundert, darunter das Rathaus mit einer Uhr an der Fassade.\n\nBetrachten Sie die Apsis von der Straße aus: Ihre polygonale Form und die glatten Mauern folgen der zisterziensischen Ästhetik, die Schlichtheit und Licht dem üppigen Schmuck der Romanik vorzog."},{"h":"Feste und Traditionen","t":"Die Kirche bewahrt die Santa Reliquia, ein Fragment des Lignum Crucis, des in Santo Toribio de Liébana verehrten Kreuzesholzes, das Ende des 18. Jahrhunderts nach Ontiñena kam. Seitdem trägt das Hauptfest um den 8. September ihren Namen.\n\nAm 5. Februar feiert das Dorf Santa Águeda, und am 9. Mai zieht es in einer Wallfahrt zur Einsiedelei San Gregorio in der Sierra, etwa 16 Kilometer entfernt.\n\nDas Lignum Crucis von Santo Toribio in Kantabrien ist eine der am meisten verehrten Reliquien Spaniens, und die Ankunft eines Fragments in einem kleinen Dorf wie Ontiñena war ein Ereignis, an das man sich bis heute jeden September erinnert."}],"pt":[{"h":"História","t":"A paróquia de Santa María la Mayor foi erguida no século XIII, quando Ontiñena, na margem do Alcanadre, fazia parte dos territórios conquistados na fronteira dos Monegros. É de estilo gótico, embora conserve o portal ocidental num românico tardio.\n\nO seu retábulo-mor, do século XV, foi destruído em 1936, no início da Guerra Civil; só se conservam fotografias dele.\n\nOntiñena assenta à direita do Alcanadre, ao pé da serra que lhe dá nome. No seu concelho há sítios arqueológicos da Antiguidade, como o Puntal, datado por volta dos séculos III e II antes de Cristo, sinal de que estas terras foram habitadas muito antes de a igreja ser construída."},{"h":"O que ver","t":"O portal ocidental é a parte mais antiga à vista. No interior há uma nave única com três capelas laterais e uma abside poligonal de aspeto cisterciense, sóbria e luminosa.\n\nContorne o edifício para ver a mudança de materiais: a base é de silharia e a parte superior da abside, de tijolo. No núcleo urbano há vários edifícios do século XVIII, entre eles a Câmara Municipal, com relógio na fachada.\n\nObserve a abside a partir da rua: a sua forma poligonal e as paredes lisas respondem à estética cisterciense, que procurava a simplicidade e a luz face à decoração abundante do românico."},{"h":"Tradições e festas","t":"A igreja guarda a Santa Relíquia, um fragmento do Lignum Crucis, a madeira da cruz venerada em Santo Toribio de Liébana, que chegou a Ontiñena em finais do século XVIII. Desde então dá nome às festas maiores, por volta de 8 de setembro.\n\nA 5 de fevereiro a povoação celebra Santa Águeda, e a 9 de maio sobe em romaria à ermida de San Gregorio, na serra, a cerca de 16 quilómetros.\n\nO Lignum Crucis de Santo Toribio, na Cantábria, é uma das relíquias mais veneradas de Espanha, e a chegada de um fragmento a uma povoação pequena como Ontiñena foi um acontecimento que ainda se recorda todos os meses de setembro."}]},"status":"pending"},{"id":"vivero-ontinena","town":"Ontiñena","cat":"naturaleza","lat":41.67399,"lon":0.09138,"coord_src":null,"q":["Parque El Vivero, Ontiñena","Puente sobre el Alcanadre, Ontiñena"],"fq":["Ontiñena puente Alcanadre","Ontiñena río Alcanadre","Ontiñena parque"],"name":{"es":"El Alcanadre: puente, Vivero y fuente románica","en":"The Alcanadre: bridge, El Vivero and Romanesque fountain","fr":"L'Alcanadre : pont, Vivero et fontaine romane","de":"Der Alcanadre: Brücke, Vivero und Brunnen","pt":"O Alcanadre: ponte, Vivero e fonte românica"},"when":{"es":"Río Alcanadre · Parque y patrimonio del agua","en":"Alcanadre river · Park and water heritage","fr":"Rivière Alcanadre · Parc et patrimoine de l'eau","de":"Fluss Alcanadre · Park und Wassererbe","pt":"Rio Alcanadre · Parque e património da água"},"desc":{"es":"Ontiñena vive a la orilla del Alcanadre. Un puente de tres grandes arcos, un parque arbolado junto al río y una fuente románica entre huertos forman un paseo tranquilo a pie.","en":"Ontiñena lives on the banks of the Alcanadre. A bridge with three large arches, a tree-lined park by the river and a Romanesque fountain among the vegetable plots make for a peaceful walk.","fr":"Ontiñena vit au bord de l'Alcanadre. Un pont à trois grandes arches, un parc arboré au bord de la rivière et une fontaine romane au milieu des potagers composent une paisible promenade à pied.","de":"Ontiñena lebt am Ufer des Alcanadre. Eine Brücke mit drei großen Bögen, ein baumbestandener Park am Fluss und ein romanischer Brunnen zwischen Gärten bilden einen ruhigen Spaziergang.","pt":"Ontiñena vive à beira do Alcanadre. Uma ponte de três grandes arcos, um parque arborizado junto ao rio e uma fonte românica entre hortas formam um passeio tranquilo a pé."},"visit":{"es":"Todo está a poca distancia del casco y se recorre a pie en una hora. El parque El Vivero tiene fuentes, merenderos y juegos infantiles; enfrente está el embarcadero. La fuente románica queda a unos 200 m del pueblo, en el paraje de los Huertos.","en":"Everything is a short distance from the village centre and can be covered on foot in an hour. El Vivero park has drinking fountains, picnic areas and a children's playground; the landing stage is opposite. The Romanesque fountain is about 200 m from the village, in the area known as Los Huertos.","fr":"Tout se trouve à peu de distance du centre et se parcourt à pied en une heure. Le parc El Vivero dispose de fontaines, d'aires de pique-nique et de jeux pour enfants ; en face se trouve l'embarcadère. La fontaine romane est à environ 200 m du village, au lieu-dit los Huertos.","de":"Alles liegt nahe am Ortskern und lässt sich zu Fuß in einer Stunde erkunden. Der Park El Vivero hat Brunnen, Picknickplätze und Spielgeräte für Kinder; gegenüber liegt die Anlegestelle. Der romanische Brunnen befindet sich etwa 200 m vom Dorf entfernt in der Flur Los Huertos.","pt":"Tudo fica a pouca distância do centro e percorre-se a pé em uma hora. O parque El Vivero tem fontes, merendeiros e parque infantil; em frente fica o cais. A fonte românica fica a cerca de 200 m da povoação, no sítio de los Huertos."},"src":"https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597252","sources":["https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597252","https://es.hispanopedia.com/wiki/Onti%C3%B1ena"],"art":{"es":[{"h":"El paisaje","t":"El Alcanadre baja desde la sierra de Guara y atraviesa los Monegros antes de unirse al Cinca. En Ontiñena su ribera forma un pasillo verde de chopos y huertos en medio del secano, con sabinas, enebros y pinos en las lomas.\n\nEn el río y sus orillas viven aves, reptiles, pequeños mamíferos y peces, y en los cortados cercanos crían rapaces. Es un buen lugar para pasear al atardecer.\n\nEn otoño las choperas se vuelven amarillas y el contraste con el secano de los alrededores es todavía más marcado. Es un buen momento para pasear por la orilla."},{"h":"Qué ver","t":"El puente sobre el Alcanadre tiene tres grandes arcos y conviene cruzarlo a pie para verlo bien y asomarse al río. Junto a la orilla, el parque El Vivero es una zona verde arbolada con fuentes, merenderos, juegos infantiles y pista deportiva; enfrente, el embarcadero del programa Entre Ríos da acceso al agua.\n\nA unos 200 metros del casco, en el paraje de los Huertos y junto al río, está la fuente románica, una de las piezas más antiguas del patrimonio del pueblo.\n\nEl parque es un buen lugar para comer al aire libre: tiene sombra, fuentes y merenderos, y los niños disponen de juegos y espacio para correr."},{"h":"Para entenderlo","t":"Las fuentes junto a los huertos eran imprescindibles antes del agua corriente: daban de beber a personas y animales y servían para regar a mano los cultivos cercanos. Muchas se construyeron con piedra bien labrada y se cuidaron durante siglos.\n\nLos puentes, por su parte, decidían la vida de los pueblos de ribera: sin ellos, el paso dependía de barcas y vados que las crecidas hacían peligrosos. Ballobar, río abajo, conserva un puente medieval sobre el mismo Alcanadre.\n\nEn el término, la sierra que da nombre al pueblo cierra el horizonte; entre ella y el río se extienden los huertos que todavía hoy riegan las acequias."}],"en":[{"h":"The landscape","t":"The Alcanadre comes down from the Sierra de Guara and crosses Los Monegros before joining the Cinca. At Ontiñena its banks form a green corridor of poplars and vegetable plots amid the dry farmland, with Spanish junipers, common junipers and pines on the hills.\n\nBirds, reptiles, small mammals and fish live in and along the river, and birds of prey breed on the nearby cliffs. It is a good place for a walk at sunset.\n\nIn autumn the poplar groves turn yellow and the contrast with the surrounding dry farmland is even more marked. It is a good time for a stroll along the bank."},{"h":"What to see","t":"The bridge over the Alcanadre has three large arches and is best crossed on foot to see it properly and look down at the river. Beside the bank, El Vivero park is a wooded green space with drinking fountains, picnic areas, a children's playground and a sports court; opposite, the Entre Ríos programme landing stage gives access to the water.\n\nAbout 200 metres from the village centre, in the area known as Los Huertos and beside the river, is the Romanesque fountain, one of the oldest pieces of the village's heritage.\n\nThe park is a good place for a picnic: it has shade, drinking fountains and picnic areas, and children have play equipment and room to run around."},{"h":"Background","t":"Fountains beside the vegetable plots were essential before running water: they provided drinking water for people and animals and were used to water nearby crops by hand. Many were built of well-dressed stone and cared for over centuries.\n\nBridges, for their part, shaped life in riverside villages: without them, crossing depended on boats and fords that floods made dangerous. Ballobar, downstream, preserves a medieval bridge over the same Alcanadre.\n\nWithin the municipality, the range that gives the village its name closes off the horizon; between it and the river lie the vegetable plots that are still watered by irrigation channels today."}],"fr":[{"h":"Le paysage","t":"L'Alcanadre descend de la sierra de Guara et traverse les Monegros avant de rejoindre le Cinca. À Ontiñena, sa rive forme un couloir vert de peupliers et de potagers au milieu du secano, avec des genévriers thurifères, des genévriers communs et des pins sur les collines.\n\nLa rivière et ses berges abritent oiseaux, reptiles, petits mammifères et poissons, et les rapaces nichent dans les escarpements voisins. C'est un bon endroit pour se promener au coucher du soleil.\n\nEn automne, les peupleraies jaunissent et le contraste avec le secano environnant est encore plus marqué. C'est un bon moment pour se promener le long de la rive."},{"h":"À voir","t":"Le pont sur l'Alcanadre compte trois grandes arches ; mieux vaut le traverser à pied pour bien le voir et contempler la rivière. Au bord de l'eau, le parc El Vivero est un espace vert arboré avec fontaines, aires de pique-nique, jeux pour enfants et terrain de sport ; en face, l'embarcadère du programme Entre Ríos donne accès à l'eau.\n\nÀ environ 200 mètres du centre, au lieu-dit los Huertos et au bord de la rivière, se trouve la fontaine romane, l'une des pièces les plus anciennes du patrimoine du village.\n\nLe parc est un bon endroit pour pique-niquer : il offre de l'ombre, des fontaines et des aires de pique-nique, et les enfants disposent de jeux et d'espace pour courir."},{"h":"Pour comprendre","t":"Les fontaines près des potagers étaient indispensables avant l'eau courante : elles abreuvaient les personnes et les animaux et servaient à arroser à la main les cultures voisines. Beaucoup furent construites en pierre bien taillée et entretenues pendant des siècles.\n\nLes ponts, quant à eux, déterminaient la vie des villages riverains : sans eux, le passage dépendait de barques et de gués que les crues rendaient dangereux. Ballobar, en aval, conserve un pont médiéval sur ce même Alcanadre.\n\nSur la commune, la sierra qui donne son nom au village ferme l'horizon ; entre elle et la rivière s'étendent les potagers qu'irriguent encore aujourd'hui les canaux."}],"de":[{"h":"Die Landschaft","t":"Der Alcanadre kommt aus der Sierra de Guara und durchquert die Monegros, bevor er in den Cinca mündet. In Ontiñena bildet sein Ufer einen grünen Korridor aus Pappeln und Gärten inmitten des Trockenlandes, mit Sadebäumen, Wacholder und Kiefern auf den Hügeln.\n\nIm Fluss und an seinen Ufern leben Vögel, Reptilien, kleine Säugetiere und Fische, und an den nahen Steilhängen brüten Greifvögel. Ein schöner Ort für einen Spaziergang bei Sonnenuntergang.\n\nIm Herbst färben sich die Pappelhaine gelb, und der Kontrast zum Trockenland der Umgebung wird noch deutlicher. Eine gute Zeit für einen Spaziergang am Ufer."},{"h":"Sehenswert","t":"Die Brücke über den Alcanadre hat drei große Bögen; man sollte sie zu Fuß überqueren, um sie gut zu sehen und auf den Fluss zu blicken. Am Ufer ist der Park El Vivero eine baumbestandene Grünanlage mit Brunnen, Picknickplätzen, Spielgeräten und Sportplatz; gegenüber bietet die Anlegestelle des Programms Entre Ríos Zugang zum Wasser.\n\nEtwa 200 Meter vom Ortskern entfernt, in der Flur Los Huertos am Fluss, steht der romanische Brunnen, eines der ältesten Stücke des Kulturerbes des Dorfes.\n\nDer Park ist ein guter Ort für ein Picknick: Er hat Schatten, Brunnen und Picknicktische, und Kinder finden Spielgeräte und Platz zum Toben."},{"h":"Zum Verständnis","t":"Die Brunnen neben den Gärten waren vor der Zeit des fließenden Wassers unverzichtbar: Sie gaben Menschen und Tieren zu trinken und dienten dazu, die nahen Kulturen von Hand zu bewässern. Viele wurden aus gut behauenem Stein gebaut und über Jahrhunderte gepflegt.\n\nDie Brücken wiederum entschieden über das Leben der Dörfer am Fluss: Ohne sie hing der Übergang von Booten und Furten ab, die bei Hochwasser gefährlich wurden. Ballobar, flussabwärts, besitzt eine mittelalterliche Brücke über denselben Alcanadre.\n\nIm Gemeindegebiet schließt die Sierra, die dem Dorf ihren Namen gibt, den Horizont ab; zwischen ihr und dem Fluss erstrecken sich die Gärten, die bis heute von den Kanälen bewässert werden."}],"pt":[{"h":"A paisagem","t":"O Alcanadre desce da serra de Guara e atravessa os Monegros antes de se juntar ao Cinca. Em Ontiñena, a sua ribeira forma um corredor verde de choupos e hortas no meio do sequeiro, com sabinas, zimbros e pinheiros nas colinas.\n\nNo rio e nas suas margens vivem aves, répteis, pequenos mamíferos e peixes, e nas escarpas próximas nidificam aves de rapina. É um bom lugar para passear ao entardecer.\n\nNo outono os choupais ficam amarelos e o contraste com o sequeiro dos arredores é ainda mais marcado. É um bom momento para passear pela margem."},{"h":"O que ver","t":"A ponte sobre o Alcanadre tem três grandes arcos e vale a pena atravessá-la a pé para a ver bem e espreitar o rio. Junto à margem, o parque El Vivero é uma zona verde arborizada com fontes, merendeiros, parque infantil e campo desportivo; em frente, o cais do programa Entre Ríos dá acesso à água.\n\nA cerca de 200 metros do centro, no sítio de los Huertos e junto ao rio, fica a fonte românica, uma das peças mais antigas do património da povoação.\n\nO parque é um bom lugar para comer ao ar livre: tem sombra, fontes e merendeiros, e as crianças dispõem de diversões e espaço para correr."},{"h":"Para compreender","t":"As fontes junto às hortas eram imprescindíveis antes da água canalizada: davam de beber a pessoas e animais e serviam para regar à mão as culturas próximas. Muitas foram construídas com pedra bem trabalhada e cuidadas durante séculos.\n\nAs pontes, por sua vez, decidiam a vida das povoações ribeirinhas: sem elas, a passagem dependia de barcos e vaus que as cheias tornavam perigosos. Ballobar, rio abaixo, conserva uma ponte medieval sobre o mesmo Alcanadre.\n\nNo concelho, a serra que dá nome à povoação fecha o horizonte; entre ela e o rio estendem-se as hortas que ainda hoje são regadas pelas levadas."}]},"status":"pending"},{"id":"iglesia-candasnos","town":"Candasnos","cat":"patrimonio","lat":41.50355,"lon":0.06404,"coord_src":null,"q":["Iglesia de la Asunción, Candasnos","Iglesia parroquial, Candasnos"],"fq":["Candasnos iglesia","Iglesia de la Asunción Candasnos","Candasnos"],"name":{"es":"Iglesia de la Asunción de Candasnos","en":"Iglesia de la Asunción de Candasnos","fr":"Iglesia de la Asunción de Candasnos (église)","de":"Iglesia de la Asunción de Candasnos","pt":"Igreja da Asunción de Candasnos"},"when":{"es":"Siglos XII-XIV · Románico y gótico","en":"12th-14th centuries · Romanesque and Gothic","fr":"XIIe-XIVe siècles · Roman et gothique","de":"12.–14. Jh. · Romanik und Gotik","pt":"Séculos XII-XIV · Românico e gótico"},"desc":{"es":"Una iglesia que empezó en piedra románica y terminó en ladrillo gótico: el cambio se ve a media altura. Dentro, el ábside conserva pinturas murales en el presbiterio.","en":"A church that began in Romanesque stone and was finished in Gothic brick: the change is visible halfway up. Inside, the apse preserves mural paintings in the presbytery.","fr":"Une église commencée en pierre romane et achevée en brique gothique : le changement se voit à mi-hauteur. À l'intérieur, l'abside conserve des peintures murales dans le presbytère.","de":"Eine Kirche, die in romanischem Stein begann und in gotischem Backstein endete: Der Wechsel ist auf halber Höhe zu sehen. Im Inneren bewahrt die Apsis Wandmalereien im Presbyterium.","pt":"Uma igreja que começou em pedra românica e terminou em tijolo gótico: a mudança vê-se a meia altura. No interior, a abside conserva pinturas murais no presbitério."},"visit":{"es":"Está en el centro de Candasnos. El exterior se ve libremente; el interior en horario de culto o preguntando en el Ayuntamiento. Calcula 30 minutos.","en":"It is in the centre of Candasnos. The exterior can be seen freely; the interior during services or by asking at the Town Council. Allow 30 minutes.","fr":"Elle se trouve au centre de Candasnos. L'extérieur se voit librement ; l'intérieur pendant les offices ou en s'adressant à la mairie. Comptez 30 minutes.","de":"Sie steht im Zentrum von Candasnos. Von außen ist sie frei zu besichtigen, das Innere zu den Gottesdienstzeiten oder auf Nachfrage im Rathaus. Rechnen Sie mit 30 Minuten.","pt":"Fica no centro de Candasnos. O exterior vê-se livremente; o interior no horário de culto ou perguntando na Câmara Municipal. Conte com 30 minutos."},"src":"https://www.bajocinca.es/candasnos/-/asset_publisher/arUvEBFVht7d/content/id/1597392","sources":["https://www.bajocinca.es/candasnos/-/asset_publisher/arUvEBFVht7d/content/id/1597392","https://caminoignaciano.org/19-20/","https://es.hispanopedia.com/wiki/Candasnos"],"art":{"es":[{"h":"Historia","t":"La iglesia de Nuestra Señora de la Asunción se empezó en el siglo XII en estilo románico, con piedra sillar. Su planta y el primer cuerpo son de esa época, y en los sillares aún se ven las marcas de los canteros, las señales con que cada uno firmaba su trabajo para cobrarlo.\n\nDesde el siglo XIV las obras continuaron ya en gótico. El edificio se ha restaurado recientemente y es el principal monumento del pueblo.\n\nLas marcas de cantero se repiten en muchas iglesias románicas de Aragón y permiten seguir a los mismos talleres de un edificio a otro."},{"h":"Qué ver","t":"Fíjate en el muro desde fuera: a media altura la piedra deja paso al ladrillo, y el ábside, que empieza semicircular, se vuelve poligonal, con ventanas de arcos apuntados. En un solo edificio se lee el paso del románico al gótico.\n\nDentro, la nave es única. Lo más valioso son el ábside y las pinturas murales del presbiterio, que conviene mirar con calma y con buena luz.\n\nBusca en los sillares de la parte baja las marcas de cantero: pequeños signos, como cruces, estrellas o letras, que cada maestro grababa en las piedras que labraba. Son la firma de los constructores medievales."},{"h":"Para entenderlo","t":"Candasnos está en el borde de los Monegros, en la llanura que separa el valle del Ebro de la vega del Cinca. Fue durante siglos lugar de paso de la carretera de Madrid a Barcelona, hoy la N-II, y del camino de los peregrinos.\n\nEn el casco urbano hay casas solariegas con escudos de familias infanzonas, y casas como la de Abió o la de Ballabriga conservan galerías de arcos de medio punto. Sus fiestas son San Marcos, el 25 de abril, y la Asunción y San Roque, el 15 y 16 de agosto.\n\nLa iglesia es también parada del Camino Ignaciano, que llega desde Bujaraloz y Peñalba, y del Camino de Santiago que viene de Fraga."}],"en":[{"h":"History","t":"The church of Nuestra Señora de la Asunción was begun in the 12th century in the Romanesque style, in ashlar stone. Its plan and lower section date from that time, and the ashlar blocks still bear masons' marks, the signs with which each mason signed his work in order to be paid for it.\n\nFrom the 14th century the work continued in the Gothic style. The building has recently been restored and is the village's main monument.\n\nMasons' marks recur in many Romanesque churches in Aragón and make it possible to follow the same workshops from one building to another."},{"h":"What to see","t":"Look at the wall from outside: halfway up the stone gives way to brick, and the apse, which starts out semicircular, becomes polygonal, with pointed-arch windows. In a single building you can read the transition from Romanesque to Gothic.\n\nInside, there is a single nave. The most valuable features are the apse and the mural paintings in the presbytery, which are worth looking at calmly and in good light.\n\nLook among the ashlar blocks of the lower part for the masons' marks: small signs, such as crosses, stars or letters, that each master carved on the stones he dressed. They are the signature of the medieval builders."},{"h":"Background","t":"Candasnos lies on the edge of Los Monegros, on the plain separating the Ebro valley from the Cinca floodplain. For centuries it was a stopping place on the Madrid-Barcelona road, now the N-II, and on the pilgrims' way.\n\nIn the village centre there are ancestral houses with the coats of arms of infanzón families, and houses such as Casa Abió and Casa Ballabriga keep galleries of round arches. Its festivals are San Marcos, on 25 April, and the Assumption and San Roque, on 15 and 16 August.\n\nThe church is also a stop on the Camino Ignaciano (Ignatian Way), which arrives from Bujaraloz and Peñalba, and on the Way of St James coming from Fraga."}],"fr":[{"h":"Histoire","t":"L'église Nuestra Señora de la Asunción fut commencée au XIIe siècle dans le style roman, en pierre de taille. Son plan et son premier niveau datent de cette époque, et l'on voit encore sur les pierres les marques des tailleurs, les signes par lesquels chacun signait son travail pour être payé.\n\nÀ partir du XIVe siècle, les travaux se poursuivirent dans le style gothique. L'édifice a été récemment restauré et c'est le principal monument du village.\n\nLes marques de tâcheron se retrouvent dans de nombreuses églises romanes d'Aragon et permettent de suivre les mêmes ateliers d'un édifice à l'autre."},{"h":"À voir","t":"Observez le mur depuis l'extérieur : à mi-hauteur, la pierre cède la place à la brique, et l'abside, d'abord semi-circulaire, devient polygonale, avec des fenêtres en arc brisé. Un seul édifice permet de lire le passage du roman au gothique.\n\nÀ l'intérieur, la nef est unique. Le plus précieux, ce sont l'abside et les peintures murales du presbytère, à contempler avec calme et sous une bonne lumière.\n\nCherchez sur les pierres de la partie basse les marques de tâcheron : de petits signes, comme des croix, des étoiles ou des lettres, que chaque maître gravait sur les pierres qu'il taillait. C'est la signature des bâtisseurs médiévaux."},{"h":"Pour comprendre","t":"Candasnos se trouve en bordure des Monegros, dans la plaine qui sépare la vallée de l'Èbre de la plaine du Cinca. Pendant des siècles, ce fut un lieu de passage sur la route de Madrid à Barcelone, l'actuelle N-II, et sur le chemin des pèlerins.\n\nLe village compte des demeures seigneuriales ornées des blasons de familles d'infanzones, et des maisons comme celles d'Abió ou de Ballabriga conservent des galeries d'arcs en plein cintre. Ses fêtes sont la San Marcos, le 25 avril, et l'Assomption et la San Roque, les 15 et 16 août.\n\nL'église est aussi une étape du Camino Ignaciano (Chemin ignatien), qui arrive de Bujaraloz et de Peñalba, et du chemin de Saint-Jacques qui vient de Fraga."}],"de":[{"h":"Geschichte","t":"Die Kirche Nuestra Señora de la Asunción wurde im 12. Jahrhundert im romanischen Stil aus Quadersteinen begonnen. Grundriss und erstes Geschoss stammen aus dieser Zeit, und an den Quadern sieht man noch die Steinmetzzeichen, mit denen jeder Steinmetz seine Arbeit signierte, um bezahlt zu werden.\n\nAb dem 14. Jahrhundert wurde im gotischen Stil weitergebaut. Das Gebäude wurde vor Kurzem restauriert und ist das wichtigste Baudenkmal des Dorfes.\n\nSteinmetzzeichen wiederholen sich in vielen romanischen Kirchen Aragóns und erlauben es, dieselben Werkstätten von Bau zu Bau zu verfolgen."},{"h":"Sehenswert","t":"Betrachten Sie die Mauer von außen: Auf halber Höhe weicht der Stein dem Backstein, und die Apsis, die halbrund beginnt, wird polygonal, mit spitzbogigen Fenstern. An einem einzigen Bau lässt sich der Übergang von der Romanik zur Gotik ablesen.\n\nIm Inneren hat die Kirche ein einziges Schiff. Am wertvollsten sind die Apsis und die Wandmalereien des Presbyteriums, die man in Ruhe und bei gutem Licht betrachten sollte.\n\nSuchen Sie an den Quadern im unteren Teil die Steinmetzzeichen: kleine Zeichen wie Kreuze, Sterne oder Buchstaben, die jeder Meister in die von ihm behauenen Steine ritzte. Sie sind die Signatur der mittelalterlichen Baumeister."},{"h":"Zum Verständnis","t":"Candasnos liegt am Rand der Monegros, in der Ebene, die das Ebrotal von der Aue des Cinca trennt. Jahrhundertelang war es Durchgangsort an der Straße von Madrid nach Barcelona, der heutigen N-II, und am Weg der Pilger.\n\nIm Ortskern gibt es Herrenhäuser mit Wappen von Infanzón-Familien, und Häuser wie die de Abió oder de Ballabriga bewahren Galerien mit Rundbögen. Die Feste des Dorfes sind San Marcos am 25. April sowie Mariä Himmelfahrt und San Roque am 15. und 16. August.\n\nDie Kirche ist auch Station des Camino Ignaciano (Ignatiusweg), der von Bujaraloz und Peñalba kommt, und des Jakobswegs, der von Fraga heraufführt."}],"pt":[{"h":"História","t":"A igreja de Nuestra Señora de la Asunción foi iniciada no século XII em estilo românico, com pedra de silharia. A sua planta e o primeiro corpo são dessa época, e nos silhares ainda se veem as marcas dos canteiros, os sinais com que cada um assinava o seu trabalho para receber o pagamento.\n\nA partir do século XIV as obras continuaram já em gótico. O edifício foi restaurado recentemente e é o principal monumento da povoação.\n\nAs marcas de canteiro repetem-se em muitas igrejas românicas de Aragão e permitem seguir as mesmas oficinas de um edifício para outro."},{"h":"O que ver","t":"Observe a parede por fora: a meia altura a pedra dá lugar ao tijolo, e a abside, que começa semicircular, torna-se poligonal, com janelas de arcos ogivais. Num só edifício lê-se a passagem do românico ao gótico.\n\nNo interior, a nave é única. O mais valioso são a abside e as pinturas murais do presbitério, que merecem ser vistas com calma e com boa luz.\n\nProcure nos silhares da parte baixa as marcas de canteiro: pequenos sinais, como cruzes, estrelas ou letras, que cada mestre gravava nas pedras que talhava. São a assinatura dos construtores medievais."},{"h":"Para compreender","t":"Candasnos fica na orla dos Monegros, na planície que separa o vale do Ebro da várzea do Cinca. Foi durante séculos local de passagem da estrada de Madrid para Barcelona, hoje a N-II, e do caminho dos peregrinos.\n\nNo núcleo urbano há casas senhoriais com brasões de famílias de infanzones, e casas como a de Abió ou a de Ballabriga conservam galerias de arcos de volta perfeita. As suas festas são San Marcos, a 25 de abril, e a Assunção e San Roque, a 15 e 16 de agosto.\n\nA igreja é também paragem do Caminho Inaciano, que chega de Bujaraloz e Peñalba, e do Caminho de Santiago que vem de Fraga."}]},"status":"pending"},{"id":"pozo-hielo-candasnos","town":"Candasnos","cat":"hidraulico","lat":41.50468,"lon":0.06278,"coord_src":null,"q":["Pozo de hielo, Candasnos","Balsa Buena, Candasnos"],"fq":["Candasnos pozo de hielo","Candasnos balsa","Candasnos"],"name":{"es":"Pozo de hielo y la Balsa Buena","en":"Ice well and the Balsa Buena","fr":"Glacière et Balsa Buena","de":"Eiskeller und Balsa Buena","pt":"Poço de gelo e a Balsa Buena"},"when":{"es":"Patrimonio del agua en el secano","en":"Water heritage in the dry lands","fr":"Patrimoine de l'eau en terre de secano","de":"Wassererbe im Trockenland","pt":"Património da água no sequeiro"},"desc":{"es":"En un pueblo de secano, guardar agua y hielo era cuestión de supervivencia. Candasnos conserva un pozo de hielo y la Balsa Buena, que según la tradición hicieron los romanos y que aún se usa en épocas de sequía.","en":"In a dry-farming village, storing water and ice was a matter of survival. Candasnos preserves an ice well and the Balsa Buena (Good Pond), which tradition says was made by the Romans and is still used in times of drought.","fr":"Dans un village de secano, conserver l'eau et la glace était une question de survie. Candasnos conserve une glacière et la Balsa Buena, un bassin creusé, selon la tradition, par les Romains et encore utilisé en période de sécheresse.","de":"In einem Dorf im Trockenland war das Speichern von Wasser und Eis eine Frage des Überlebens. Candasnos bewahrt einen Eiskeller und die Balsa Buena, einen Wasserspeicher, den der Überlieferung nach die Römer anlegten und der in Dürrezeiten noch genutzt wird.","pt":"Numa povoação de sequeiro, guardar água e gelo era uma questão de sobrevivência. Candasnos conserva um poço de gelo e a Balsa Buena (Charca Boa), que segundo a tradição foi feita pelos romanos e que ainda se usa em épocas de seca."},"visit":{"es":"El pozo de hielo está a las afueras, detrás del cuartel de la Guardia Civil y del silo, entre la N-II y el camino de la Balsa del Pozo. Las balsas se ven desde los caminos. Visita libre por fuera; calcula 45 minutos para ambos.","en":"The ice well is on the outskirts, behind the Guardia Civil barracks and the silo, between the N-II and the Balsa del Pozo track. The ponds can be seen from the tracks. Free to view from outside; allow 45 minutes for both.","fr":"La glacière se trouve à la sortie du village, derrière la caserne de la Guardia Civil et le silo, entre la N-II et le chemin de la Balsa del Pozo. Les bassins se voient depuis les chemins. Visite libre de l'extérieur ; comptez 45 minutes pour les deux.","de":"Der Eiskeller liegt am Ortsrand, hinter der Kaserne der Guardia Civil und dem Silo, zwischen der N-II und dem Weg zur Balsa del Pozo. Die Wasserspeicher sind von den Wegen aus zu sehen. Freie Besichtigung von außen; rechnen Sie für beides mit 45 Minuten.","pt":"O poço de gelo fica nos arredores, atrás do quartel da Guardia Civil e do silo, entre a N-II e o caminho da Balsa del Pozo. As charcas veem-se a partir dos caminhos. Visita livre por fora; conte com 45 minutos para ambos."},"src":"https://www.bajocinca.es/candasnos/-/asset_publisher/arUvEBFVht7d/content/id/1597392","sources":["https://www.bajocinca.es/candasnos/-/asset_publisher/arUvEBFVht7d/content/id/1597392","https://es.hispanopedia.com/wiki/Candasnos"],"art":{"es":[{"h":"Historia","t":"Candasnos está en una llanura sin ríos, entre los Monegros y la vega del Cinca. Para beber y para el ganado, los vecinos dependían del agua de lluvia recogida en balsas. La más antigua es la Balsa Buena, que la tradición atribuye a los romanos y que todavía abastece al pueblo en las sequías; su recuerdo está incluso en el escudo municipal.\n\nOtras balsas del término, como la del Tejar, la del Sas o la Reguladora, recuerdan las sequías de antaño.\n\nEl pozo y las balsas cuentan la misma historia que el escudo del pueblo: la de una comunidad que tuvo que aprender a guardar el agua y el frío porque la naturaleza no se los daba."},{"h":"Qué ver","t":"El pozo de hielo es una construcción excavada en el suelo y cubierta, donde en invierno se apilaba la nieve o el hielo entre capas de paja. Bien prensado, se conservaba hasta el verano.\n\nAcércate después a la Balsa Buena y fíjate en cómo se aprovecha la pendiente del terreno para recoger el agua de lluvia. En un paisaje tan llano, cada pequeña vaguada se convierte en un depósito.\n\nCombina la visita con un paseo por el casco, donde verás casas solariegas con escudos, y con el Hondo de la Unilla, una pequeña laguna a un cuarto de hora a pie."},{"h":"Para entenderlo","t":"Entre los siglos XVI y XIX, el hielo era un bien muy apreciado: servía para conservar alimentos, para enfriar bebidas y, sobre todo, como remedio médico contra fiebres e inflamaciones. Los pozos de hielo eran a menudo municipales y su explotación se arrendaba.\n\nLa llegada de las fábricas de hielo y de la electricidad acabó con ellos a comienzos del siglo XX. Muchos se perdieron; los que quedan, como este, cuentan cómo se vivía sin frigorífico en una de las zonas más calurosas de Aragón.\n\nCandasnos, en la carretera de Madrid a Barcelona, fue siempre lugar de paso, y el hielo pudo servir también a posadas y viajeros."}],"en":[{"h":"History","t":"Candasnos lies on a plain without rivers, between Los Monegros and the Cinca floodplain. For drinking and for their livestock, local people depended on rainwater collected in ponds. The oldest is the Balsa Buena, which tradition attributes to the Romans and which still supplies the village during droughts; it even features in the municipal coat of arms.\n\nOther ponds in the municipality, such as the Tejar, the Sas and the Reguladora, recall the droughts of the past.\n\nThe ice well and the ponds tell the same story as the village coat of arms: that of a community that had to learn to store water and cold because nature did not provide them."},{"h":"What to see","t":"The ice well is a covered structure dug into the ground, where in winter snow or ice was stacked between layers of straw. Well packed down, it kept until summer.\n\nThen go over to the Balsa Buena and notice how the slope of the ground is used to collect rainwater. In such a flat landscape, every small hollow becomes a reservoir.\n\nCombine the visit with a stroll through the village centre, where you will see ancestral houses with coats of arms, and with the Hondo de la Unilla, a small lagoon a quarter of an hour's walk away."},{"h":"Background","t":"Between the 16th and 19th centuries, ice was a highly prized commodity: it was used to preserve food, to cool drinks and, above all, as a medical remedy for fevers and inflammation. Ice wells were often municipally owned and their operation was leased out.\n\nThe arrival of ice factories and electricity put an end to them at the beginning of the 20th century. Many were lost; those that remain, like this one, tell how people lived without a fridge in one of the hottest areas of Aragón.\n\nCandasnos, on the Madrid-Barcelona road, was always a place of passage, and the ice may also have served inns and travellers."}],"fr":[{"h":"Histoire","t":"Candasnos se trouve dans une plaine sans rivières, entre les Monegros et la plaine du Cinca. Pour boire et pour le bétail, les habitants dépendaient de l'eau de pluie recueillie dans des bassins (balsas). Le plus ancien est la Balsa Buena, que la tradition attribue aux Romains et qui alimente encore le village en période de sécheresse ; son souvenir figure même sur le blason municipal.\n\nD'autres bassins de la commune, comme ceux del Tejar, del Sas ou la Reguladora, rappellent les sécheresses d'autrefois.\n\nLa glacière et les bassins racontent la même histoire que le blason du village : celle d'une communauté qui a dû apprendre à conserver l'eau et le froid parce que la nature ne les lui donnait pas."},{"h":"À voir","t":"La glacière est une construction creusée dans le sol et couverte, où l'on entassait en hiver la neige ou la glace entre des couches de paille. Bien tassée, elle se conservait jusqu'à l'été.\n\nRendez-vous ensuite à la Balsa Buena et observez comment on tire parti de la pente du terrain pour recueillir l'eau de pluie. Dans un paysage aussi plat, chaque petite dépression devient un réservoir.\n\nCombinez la visite avec une promenade dans le vieux centre, où vous verrez des demeures seigneuriales ornées de blasons, et avec le Hondo de la Unilla, une petite lagune à un quart d'heure à pied."},{"h":"Pour comprendre","t":"Entre le XVIe et le XIXe siècle, la glace était un bien très recherché : elle servait à conserver les aliments, à rafraîchir les boissons et, surtout, de remède médical contre les fièvres et les inflammations. Les glacières étaient souvent municipales et leur exploitation était affermée.\n\nL'arrivée des fabriques de glace et de l'électricité y mit fin au début du XXe siècle. Beaucoup ont disparu ; celles qui subsistent, comme celle-ci, racontent comment on vivait sans réfrigérateur dans l'une des zones les plus chaudes d'Aragon.\n\nCandasnos, sur la route de Madrid à Barcelone, a toujours été un lieu de passage, et la glace a pu servir aussi aux auberges et aux voyageurs."}],"de":[{"h":"Geschichte","t":"Candasnos liegt in einer flusslosen Ebene zwischen den Monegros und der Aue des Cinca. Für Mensch und Vieh waren die Einwohner auf Regenwasser angewiesen, das in Balsas (Wasserspeichern) gesammelt wurde. Die älteste ist die Balsa Buena, die die Überlieferung den Römern zuschreibt und die das Dorf bei Dürre bis heute versorgt; ihre Erinnerung findet sich sogar im Gemeindewappen.\n\nAndere Wasserspeicher im Gemeindegebiet, wie die del Tejar, die del Sas oder die Reguladora, erinnern an die Dürren früherer Zeiten.\n\nEiskeller und Wasserspeicher erzählen dieselbe Geschichte wie das Wappen des Dorfes: die einer Gemeinschaft, die lernen musste, Wasser und Kälte zu speichern, weil die Natur sie ihr nicht schenkte."},{"h":"Sehenswert","t":"Der Eiskeller ist ein in den Boden gegrabener und überdachter Bau, in dem im Winter Schnee oder Eis zwischen Strohschichten aufgeschichtet wurde. Gut gepresst, hielt es sich bis zum Sommer.\n\nGehen Sie danach zur Balsa Buena und achten Sie darauf, wie das Gefälle des Geländes genutzt wird, um Regenwasser aufzufangen. In einer so flachen Landschaft wird jede kleine Senke zu ein
