 water in summer.","fr":"La montée à la colline et au Tozal se fait à pied depuis le village, en 30 à 45 minutes aller-retour. L'embarcadère se trouve au bord de la rivière, en accès libre. Il n'y a pas de services aux belvédères : emportez de l'eau en été.","de":"Der Aufstieg zum Hügel und zum Tozal erfolgt zu Fuß vom Dorf aus, in etwa 30–45 Minuten hin und zurück. Die Anlegestelle liegt am Fluss und ist frei zugänglich. An den Aussichtspunkten gibt es keine Einrichtungen: Nehmen Sie im Sommer Wasser mit.","pt":"A subida ao cerro e ao Tozal faz-se a pé a partir da povoação, em cerca de 30-45 minutos ida e volta. O cais fica junto ao rio, com acesso livre. Não há serviços nos miradouros: leve água no verão."},"src":"https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597168","sources":["https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597168","https://es.hispanopedia.com/wiki/Chalamera"],"art":{"es":[{"h":"El paisaje","t":"El término de Chalamera queda entre el Cinca, al este, y el Alcanadre, al sur, unos cinco kilómetros antes de que se junten. Esa posición explica su paisaje: huertas en las vegas, secano en los altos y cortados de tierra sobre los ríos.\n\nDesde el mirador del Tozal se domina la planicie del Bajo Cinca, con los pueblos de la ribera y, en días claros, las sierras del sur. Al atardecer, la luz alarga las sombras de los campos.\n\nSi subes en primavera, verás los campos de cereal todavía verdes y las huertas en flor; en verano la llanura se vuelve dorada y la línea verde de los ríos destaca aún más. Lleva prismáticos: los cortados sobre el agua atraen a rapaces y otras aves."},{"h":"Historia","t":"La colina que los vecinos llaman El Castillo guarda el recuerdo de una fortaleza de la orden del Temple, de la que quedan pocos restos. En sus laderas hay cuevas excavadas en la tierra, y en el término se conocen asentamientos íberos y romanos, además de trincheras de la guerra civil.\n\nSubir hasta arriba permite entender por qué templarios y monjes se instalaron aquí: el alto vigilaba el paso de los dos ríos y el camino de los peregrinos.\n\nLas trincheras de la guerra civil que hay en el término recuerdan que el frente pasó cerca de estos ríos en 1938, cuando el Cinca volvió a ser, por última vez, una línea de defensa."},{"h":"Qué ver","t":"El embarcadero del Alcanadre lo acondicionó la Comarca en 2016, dentro de su proyecto Entre Ríos, como punto de acceso al río para piragüismo y otros deportes acuáticos. Es un buen lugar para ver la vegetación de ribera y las aves.\n\nEn verano, el parque de La Pardina, junto a la piscina municipal, es el punto de encuentro del pueblo. Si te sobra tiempo, cruza a Ballobar, en la otra orilla del Alcanadre, para ver su puente medieval.\n\nEl embarcadero es también un sitio agradable para descansar: el rumor del agua, la sombra de los árboles de ribera y la vista del río son el mejor final para la subida a los miradores."}],"en":[{"h":"The landscape","t":"The municipality of Chalamera lies between the Cinca, to the east, and the Alcanadre, to the south, about five kilometres before they meet. That position explains its landscape: market gardens on the floodplains, dry farmland on the heights and earth cliffs above the rivers.\n\nFrom the Tozal viewpoint you look out over the Bajo Cinca plain, with the riverside villages and, on clear days, the ranges to the south. At sunset the light lengthens the shadows across the fields.\n\nIf you come up in spring, you will see the cereal fields still green and the market gardens in flower; in summer the plain turns golden and the green line of the rivers stands out even more. Take binoculars: the cliffs above the water attract birds of prey and other birds."},{"h":"History","t":"The hill that locals call El Castillo holds the memory of a fortress of the Order of the Temple, of which few remains survive. On its slopes there are caves dug into the earth, and Iberian and Roman settlements are known in the municipality, as well as Civil War trenches.\n\nClimbing to the top helps you understand why Templars and monks settled here: the height watched over the crossing of the two rivers and the pilgrims' road.\n\nThe Civil War trenches in the municipality are a reminder that the front passed close to these rivers in 1938, when the Cinca became a line of defence once again, for the last time."},{"h":"What to see","t":"The landing stage on the Alcanadre was created by the Comarca in 2016, under its Entre Ríos project, as an access point to the river for canoeing and other water sports. It is a good place to see the riverside vegetation and the birds.\n\nIn summer, La Pardina park, next to the municipal swimming pool, is the village meeting point. If you have time to spare, cross to Ballobar, on the other bank of the Alcanadre, to see its medieval bridge.\n\nThe landing stage is also a pleasant place to rest: the murmur of the water, the shade of the riverside trees and the view of the river are the perfect finish to the climb up to the viewpoints."}],"fr":[{"h":"Le paysage","t":"Le territoire de Chalamera s'étend entre le Cinca, à l'est, et l'Alcanadre, au sud, environ cinq kilomètres avant leur confluence. Cette position explique son paysage : des huertas dans les plaines alluviales, du secano sur les hauteurs et des escarpements de terre au-dessus des rivières.\n\nDepuis le belvédère du Tozal, on domine la plaine du Bajo Cinca, avec les villages de la rive et, par temps clair, les sierras du sud. Au coucher du soleil, la lumière allonge les ombres des champs.\n\nSi vous montez au printemps, vous verrez les champs de céréales encore verts et les huertas en fleur ; en été, la plaine devient dorée et la ligne verte des rivières ressort encore davantage. Emportez des jumelles : les escarpements au-dessus de l'eau attirent rapaces et autres oiseaux."},{"h":"Histoire","t":"La colline que les habitants appellent El Castillo garde le souvenir d'une forteresse de l'ordre du Temple, dont il reste peu de vestiges. Sur ses flancs s'ouvrent des grottes creusées dans la terre, et l'on connaît sur la commune des établissements ibères et romains, ainsi que des tranchées de la guerre civile.\n\nMonter jusqu'en haut permet de comprendre pourquoi Templiers et moines s'installèrent ici : la hauteur surveillait le passage des deux rivières et le chemin des pèlerins.\n\nLes tranchées de la guerre civile présentes sur la commune rappellent que le front passa près de ces rivières en 1938, quand le Cinca redevint, pour la dernière fois, une ligne de défense."},{"h":"À voir","t":"L'embarcadère de l'Alcanadre a été aménagé par la Comarca en 2016, dans le cadre de son projet Entre Ríos, comme point d'accès à la rivière pour le canoë-kayak et d'autres sports nautiques. C'est un bon endroit pour observer la végétation riveraine et les oiseaux.\n\nEn été, le parc de La Pardina, à côté de la piscine municipale, est le lieu de rendez-vous du village. S'il vous reste du temps, passez à Ballobar, sur l'autre rive de l'Alcanadre, pour voir son pont médiéval.\n\nL'embarcadère est aussi un endroit agréable pour se reposer : le murmure de l'eau, l'ombre des arbres de la rive et la vue sur la rivière sont la meilleure conclusion à la montée aux belvédères."}],"de":[{"h":"Die Landschaft","t":"Das Gemeindegebiet von Chalamera liegt zwischen dem Cinca im Osten und dem Alcanadre im Süden, etwa fünf Kilometer vor ihrem Zusammenfluss. Diese Lage erklärt seine Landschaft: Gärten in den Auen, Trockenland auf den Höhen und Erdabbrüche über den Flüssen.\n\nVom Aussichtspunkt El Tozal überblickt man die Ebene des Bajo Cinca mit den Dörfern am Fluss und an klaren Tagen die Gebirgszüge im Süden. Bei Sonnenuntergang verlängert das Licht die Schatten der Felder.\n\nIm Frühjahr sehen Sie die Getreidefelder noch grün und die Gärten in Blüte; im Sommer färbt sich die Ebene golden, und das grüne Band der Flüsse sticht noch deutlicher hervor. Nehmen Sie ein Fernglas mit: Die Steilhänge über dem Wasser ziehen Greifvögel und andere Vögel an."},{"h":"Geschichte","t":"Der Hügel, den die Einheimischen El Castillo nennen, bewahrt die Erinnerung an eine Festung des Templerordens, von der nur wenige Reste geblieben sind. An seinen Hängen gibt es in die Erde gegrabene Höhlen, und im Gemeindegebiet sind iberische und römische Siedlungen sowie Schützengräben aus dem Bürgerkrieg bekannt.\n\nWer bis ganz nach oben steigt, versteht, warum Templer und Mönche sich hier niederließen: Die Anhöhe überwachte den Übergang über die beiden Flüsse und den Weg der Pilger.\n\nDie Schützengräben aus dem Bürgerkrieg im Gemeindegebiet erinnern daran, dass die Front 1938 nahe an diesen Flüssen verlief, als der Cinca ein letztes Mal zur Verteidigungslinie wurde."},{"h":"Sehenswert","t":"Die Anlegestelle am Alcanadre richtete die Comarca 2016 im Rahmen ihres Projekts Entre Ríos als Zugang zum Fluss für Kanufahren und andere Wassersportarten ein. Sie ist ein guter Ort, um die Ufervegetation und die Vögel zu beobachten.\n\nIm Sommer ist der Park La Pardina neben dem städtischen Schwimmbad der Treffpunkt des Dorfes. Wenn Sie noch Zeit haben, fahren Sie hinüber nach Ballobar am anderen Ufer des Alcanadre, um seine mittelalterliche Brücke zu sehen.\n\nDie Anlegestelle ist auch ein angenehmer Ort zum Ausruhen: das Rauschen des Wassers, der Schatten der Uferbäume und der Blick auf den Fluss sind der schönste Abschluss nach dem Aufstieg zu den Aussichtspunkten."}],"pt":[{"h":"A paisagem","t":"O concelho de Chalamera fica entre o Cinca, a leste, e o Alcanadre, a sul, uns cinco quilómetros antes de se juntarem. Essa posição explica a sua paisagem: hortas nas várzeas, sequeiro nos altos e escarpas de terra sobre os rios.\n\nDo miradouro do Tozal domina-se a planície do Bajo Cinca, com as povoações da ribeira e, em dias claros, as serras do sul. Ao entardecer, a luz alonga as sombras dos campos.\n\nSe subir na primavera, verá os campos de cereais ainda verdes e as hortas em flor; no verão a planície fica dourada e a linha verde dos rios destaca-se ainda mais. Leve binóculos: as escarpas sobre a água atraem aves de rapina e outras aves."},{"h":"História","t":"A colina a que os habitantes chamam El Castillo guarda a memória de uma fortaleza da Ordem do Templo, de que restam poucos vestígios. Nas suas encostas há grutas escavadas na terra, e no concelho conhecem-se povoamentos iberos e romanos, além de trincheiras da Guerra Civil.\n\nSubir até lá acima permite perceber porque templários e monges se instalaram aqui: o alto vigiava a passagem dos dois rios e o caminho dos peregrinos.\n\nAs trincheiras da Guerra Civil que existem no concelho recordam que a frente passou perto destes rios em 1938, quando o Cinca voltou a ser, pela última vez, uma linha de defesa."},{"h":"O que ver","t":"O cais do Alcanadre foi preparado pela Comarca em 2016, no âmbito do seu projeto Entre Ríos, como ponto de acesso ao rio para canoagem e outros desportos aquáticos. É um bom lugar para observar a vegetação ribeirinha e as aves.\n\nNo verão, o parque de La Pardina, junto à piscina municipal, é o ponto de encontro da povoação. Se lhe sobrar tempo, atravesse para Ballobar, na outra margem do Alcanadre, para ver a sua ponte medieval.\n\nO cais é também um lugar agradável para descansar: o murmúrio da água, a sombra das árvores ribeirinhas e a vista do rio são o melhor final para a subida aos miradouros."}]},"status":"pending"},{"id":"san-salvador-torrente","town":"Torrente de Cinca","cat":"patrimonio","lat":41.46852,"lon":0.31952,"coord_src":null,"q":["Ermita de San Salvador, Torrente de Cinca","San Salvador, Torrente de Cinca"],"fq":["Ermita de San Salvador Torrente de Cinca","Torrente de Cinca San Salvador","Torrente de Cinca mirador"],"name":{"es":"Ermita de San Salvador","en":"Ermita de San Salvador (Hermitage of the Saviour)","fr":"Ermita de San Salvador (ermitage)","de":"Ermita de San Salvador","pt":"Ermida de San Salvador"},"when":{"es":"1550 · Ermita-monasterio y mirador","en":"1550 · Hermitage-monastery and viewpoint","fr":"1550 · Ermitage-monastère et belvédère","de":"1550 · Einsiedelei-Kloster und Aussichtspunkt","pt":"1550 · Ermida-mosteiro e miradouro"},"desc":{"es":"Una ermita renacentista de 1550 en el punto más alto del término, junto a un antiguo convento de frailes trinitarios. Su mirador ofrece una de las mejores vistas de la ribera y el meandro del Cinca.","en":"A Renaissance hermitage from 1550 at the highest point of the municipality, next to a former convent of Trinitarian friars. Its viewpoint offers one of the best views of the riverside and the bend of the Cinca.","fr":"Un ermitage Renaissance de 1550 au point culminant de la commune, à côté d'un ancien couvent de frères trinitaires. Son belvédère offre l'une des plus belles vues sur la rive et le méandre du Cinca.","de":"Eine Renaissance-Einsiedelei von 1550 am höchsten Punkt des Gemeindegebiets, neben einem ehemaligen Trinitarierkloster. Ihr Aussichtspunkt bietet einen der schönsten Blicke auf die Flussaue und die Cinca-Schleife.","pt":"Uma ermida renascentista de 1550 no ponto mais alto do concelho, junto a um antigo convento de frades trinitários. O seu miradouro oferece uma das melhores vistas da ribeira e do meandro do Cinca."},"visit":{"es":"Está a unos 2 km del casco urbano; se sube en coche o a pie por camino. El mirador es de acceso libre. Para ver el interior pregunta en el Ayuntamiento de Torrente. Calcula una hora con el paseo.","en":"It is about 2 km from the village; you can drive up or walk along a track. The viewpoint is open to all. To see the interior, ask at the Torrente Town Council. Allow an hour including the walk.","fr":"Il se trouve à environ 2 km du village ; on y monte en voiture ou à pied par un chemin. Le belvédère est en accès libre. Pour voir l'intérieur, renseignez-vous à la mairie de Torrente. Comptez une heure avec la promenade.","de":"Sie liegt etwa 2 km vom Ortskern entfernt; man fährt mit dem Auto hinauf oder geht zu Fuß auf einem Weg. Der Aussichtspunkt ist frei zugänglich. Für das Innere fragen Sie im Rathaus von Torrente. Rechnen Sie mit einer Stunde einschließlich Spaziergang.","pt":"Fica a cerca de 2 km do núcleo urbano; sobe-se de carro ou a pé por caminho. O miradouro é de acesso livre. Para ver o interior, pergunte na Câmara Municipal de Torrente. Conte com uma hora com o passeio."},"src":"https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597482","sources":["https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597482","https://es.hispanopedia.com/wiki/Torrente_de_Cinca","https://es.hispanopedia.com/wiki/Fraga_(Huesca)"],"art":{"es":[{"h":"Historia","t":"La ermita-monasterio de San Salvador es de estilo renacentista y data de 1550. A lo largo de los siglos se amplió en numerosas ocasiones, y junto a ella vivió una comunidad de frailes trinitarios. El Ayuntamiento la ha restaurado recientemente.\n\nJunto con la iglesia parroquial, es uno de los dos monumentos más importantes de Torrente, y da nombre a las fiestas patronales del pueblo, en torno al 6 de agosto, día de la Transfiguración o del Salvador.\n\nLos trinitarios eran una orden dedicada en su origen a rescatar cautivos cristianos en el norte de África. Su presencia junto a la ermita muestra la importancia que llegó a tener este santuario de altura para los pueblos de la ribera."},{"h":"Curiosidades","t":"Las crónicas cuentan que en una de sus capillas se guardaba una vasija con aceite milagroso, al que se atribuían curaciones. La más famosa de todas, según la tradición, fue la del rey Felipe II.\n\nHistorias así eran frecuentes en los santuarios de altura: el esfuerzo de la subida, la reliquia y la vista amplia daban al lugar un aire especial para quienes venían a pedir salud o lluvia.\n\nLa ermita sigue siendo una referencia para los vecinos de Torrente, que la tienen como lugar de encuentro en sus fiestas. Y el nombre del santuario, el Salvador, es el mismo que el de las fiestas patronales de agosto."},{"h":"El paisaje","t":"Desde el mirador se abre toda la ribera del Cinca: el río dibuja un gran meandro entre huertas y choperas, con Fraga al norte y las tierras que bajan hacia Mequinenza al sur. A los pies, las casas de Torrente se agrupan bajo el risco del castillo.\n\nEs un buen lugar para venir a última hora de la tarde, cuando el sol baja por detrás de las lomas y la vega se tiñe de verde oscuro. Lleva agua en verano: arriba no hay sombra.\n\nLa ermita forma con el castillo y la iglesia el triángulo de lugares que conviene ver en Torrente: los tres se combinan en una mañana."}],"en":[{"h":"History","t":"The hermitage-monastery of San Salvador is Renaissance in style and dates from 1550. Over the centuries it was enlarged many times, and a community of Trinitarian friars lived beside it. The Town Council has recently restored it.\n\nTogether with the parish church, it is one of Torrente's two most important monuments, and it gives its name to the village's patronal festival, around 6 August, the feast of the Transfiguration or of the Saviour.\n\nThe Trinitarians were an order originally devoted to ransoming Christian captives in North Africa. Their presence beside the hermitage shows how important this hilltop sanctuary became for the riverside villages."},{"h":"Did you know?","t":"The chronicles tell that one of its chapels kept a vessel of miraculous oil, credited with healing powers. The most famous cure of all, according to tradition, was that of King Philip II.\n\nStories like this were common at hilltop sanctuaries: the effort of the climb, the relic and the wide view gave the place a special aura for those who came to pray for health or rain.\n\nThe hermitage is still a landmark for the people of Torrente, who use it as a meeting place during their festivals. And the sanctuary's name, el Salvador, is the same as that of the August patronal festival."},{"h":"The landscape","t":"From the viewpoint the whole Cinca riverside opens up: the river traces a great bend between market gardens and poplar groves, with Fraga to the north and the land sloping down towards Mequinenza to the south. Below, the houses of Torrente cluster beneath the castle crag.\n\nIt is a good place to come late in the afternoon, when the sun sinks behind the hills and the floodplain turns dark green. Take water in summer: there is no shade at the top.\n\nTogether with the castle and the church, the hermitage forms the trio of places worth seeing in Torrente: all three can be combined in a morning."}],"fr":[{"h":"Histoire","t":"L'ermitage-monastère de San Salvador est de style Renaissance et date de 1550. Il a été agrandi à de nombreuses reprises au fil des siècles, et une communauté de frères trinitaires vécut à ses côtés. La mairie l'a récemment restauré.\n\nAvec l'église paroissiale, c'est l'un des deux monuments les plus importants de Torrente, et il donne son nom aux fêtes patronales du village, autour du 6 août, jour de la Transfiguration ou du Sauveur.\n\nLes Trinitaires étaient un ordre voué à l'origine au rachat des captifs chrétiens en Afrique du Nord. Leur présence près de l'ermitage montre l'importance qu'atteignit ce sanctuaire de hauteur pour les villages de la rive."},{"h":"Le saviez-vous ?","t":"Les chroniques racontent que l'une de ses chapelles conservait un vase d'huile miraculeuse, à laquelle on attribuait des guérisons. La plus célèbre de toutes, selon la tradition, fut celle du roi Philippe II.\n\nCe genre d'histoires était fréquent dans les sanctuaires de hauteur : l'effort de la montée, la relique et la vue dégagée conféraient au lieu une aura particulière pour ceux qui venaient demander la santé ou la pluie.\n\nL'ermitage reste un repère pour les habitants de Torrente, qui en font un lieu de rassemblement lors de leurs fêtes. Et le nom du sanctuaire, le Salvador, est le même que celui des fêtes patronales d'août."},{"h":"Le paysage","t":"Depuis le belvédère, toute la rive du Cinca s'ouvre au regard : la rivière dessine un grand méandre entre huertas et peupleraies, avec Fraga au nord et les terres qui descendent vers Mequinenza au sud. À vos pieds, les maisons de Torrente se regroupent sous l'escarpement du château.\n\nC'est un bon endroit où venir en fin d'après-midi, quand le soleil descend derrière les collines et que la plaine se teinte de vert sombre. Emportez de l'eau en été : il n'y a pas d'ombre là-haut.\n\nAvec le château et l'église, l'ermitage forme le triangle de lieux à voir à Torrente : les trois se combinent en une matinée."}],"de":[{"h":"Geschichte","t":"Das Einsiedelei-Kloster San Salvador ist im Renaissancestil erbaut und stammt aus dem Jahr 1550. Im Laufe der Jahrhunderte wurde es mehrfach erweitert, und daneben lebte eine Gemeinschaft von Trinitariermönchen. Die Gemeinde hat es vor Kurzem restauriert.\n\nZusammen mit der Pfarrkirche ist es eines der beiden bedeutendsten Baudenkmäler von Torrente und gibt dem Patronatsfest des Dorfes seinen Namen, um den 6. August, den Tag der Verklärung oder des Erlösers.\n\nDie Trinitarier waren ein Orden, der sich ursprünglich dem Freikauf christlicher Gefangener in Nordafrika widmete. Ihre Anwesenheit neben der Einsiedelei zeigt, welche Bedeutung dieses Höhenheiligtum für die Dörfer am Fluss erlangte."},{"h":"Wissenswertes","t":"Chroniken berichten, dass in einer ihrer Kapellen ein Gefäß mit wundertätigem Öl aufbewahrt wurde, dem Heilungen zugeschrieben wurden. Die berühmteste von allen war der Überlieferung nach die von König Philipp II.\n\nSolche Geschichten waren in Höhenheiligtümern häufig: Die Mühe des Aufstiegs, die Reliquie und die weite Aussicht verliehen dem Ort eine besondere Ausstrahlung für jene, die kamen, um um Gesundheit oder Regen zu bitten.\n\nDie Einsiedelei ist für die Einwohner von Torrente bis heute ein Bezugspunkt und ein Treffpunkt bei ihren Festen. Und der Name des Heiligtums, El Salvador (der Erlöser), ist derselbe wie der des Patronatsfestes im August."},{"h":"Die Landschaft","t":"Vom Aussichtspunkt aus öffnet sich die ganze Aue des Cinca: Der Fluss zieht eine große Schleife zwischen Gärten und Pappelhainen, mit Fraga im Norden und dem Land, das nach Süden Richtung Mequinenza abfällt. Zu Füßen drängen sich die Häuser von Torrente unter dem Burgfelsen.\n\nAm schönsten ist es hier am späten Nachmittag, wenn die Sonne hinter den Hügeln versinkt und sich die Aue dunkelgrün färbt. Nehmen Sie im Sommer Wasser mit: Oben gibt es keinen Schatten.\n\nDie Einsiedelei bildet mit der Burg und der Kirche das Dreieck der Orte, die man in Torrente gesehen haben sollte: Alle drei lassen sich an einem Vormittag verbinden."}],"pt":[{"h":"História","t":"A ermida-mosteiro de San Salvador é de estilo renascentista e data de 1550. Ao longo dos séculos foi ampliada em numerosas ocasiões, e junto a ela viveu uma comunidade de frades trinitários. A Câmara Municipal restaurou-a recentemente.\n\nJuntamente com a igreja paroquial, é um dos dois monumentos mais importantes de Torrente, e dá nome às festas do padroeiro da povoação, por volta de 6 de agosto, dia da Transfiguração ou do Salvador.\n\nOs trinitários eram uma ordem dedicada, na sua origem, a resgatar cativos cristãos no Norte de África. A sua presença junto à ermida mostra a importância que este santuário de altitude chegou a ter para as povoações da ribeira."},{"h":"Curiosidades","t":"As crónicas contam que numa das suas capelas se guardava um vaso com azeite milagroso, ao qual se atribuíam curas. A mais famosa de todas, segundo a tradição, foi a do rei Filipe II.\n\nHistórias assim eram frequentes nos santuários de altitude: o esforço da subida, a relíquia e a vista ampla davam ao lugar um ar especial para quem vinha pedir saúde ou chuva.\n\nA ermida continua a ser uma referência para os habitantes de Torrente, que a têm como lugar de encontro nas suas festas. E o nome do santuário, o Salvador, é o mesmo das festas do padroeiro em agosto."},{"h":"A paisagem","t":"Do miradouro abre-se toda a ribeira do Cinca: o rio desenha um grande meandro entre hortas e choupais, com Fraga a norte e as terras que descem para Mequinenza a sul. A seus pés, as casas de Torrente agrupam-se sob o penhasco do castelo.\n\nÉ um bom lugar para vir ao fim da tarde, quando o sol desce por trás das colinas e a várzea se tinge de verde-escuro. Leve água no verão: lá em cima não há sombra.\n\nA ermida forma com o castelo e a igreja o triângulo de lugares que vale a pena ver em Torrente: os três combinam-se numa manhã."}]},"status":"pending"},{"id":"iglesia-torrente","town":"Torrente de Cinca","cat":"patrimonio","lat":41.47283,"lon":0.33463,"coord_src":null,"q":["Iglesia de Santa María Magdalena, Torrente de Cinca","Plaza de la Iglesia, Torrente de Cinca"],"fq":["Torrente de Cinca iglesia","Iglesia de Santa María Magdalena Torrente de Cinca","Torrente de Cinca"],"name":{"es":"Iglesia de Santa María Magdalena","en":"Iglesia de Santa María Magdalena (Church of St Mary Magdalene)","fr":"Iglesia de Santa María Magdalena (église)","de":"Iglesia de Santa María Magdalena","pt":"Igreja de Santa María Magdalena"},"when":{"es":"Siglo XVIII · Barroco aragonés","en":"18th century · Aragonese Baroque","fr":"XVIIIe siècle · Baroque aragonais","de":"18. Jh. · Aragonesischer Barock","pt":"Século XVIII · Barroco aragonês"},"desc":{"es":"La iglesia barroca que preside la plaza de Torrente, levantada a mediados del siglo XVIII tras el incendio de la anterior en la guerra de Sucesión. Muy cerca, un reloj de sol ideado por un torrentino ilustre.","en":"The Baroque church that presides over Torrente's square, built in the mid-18th century after the previous one burnt down in the War of the Spanish Succession. Close by is a sundial devised by a distinguished son of Torrente.","fr":"L'église baroque qui domine la place de Torrente, élevée au milieu du XVIIIe siècle après l'incendie de la précédente pendant la guerre de Succession. Tout près, un cadran solaire conçu par un illustre enfant du pays.","de":"Die Barockkirche am Hauptplatz von Torrente, Mitte des 18. Jahrhunderts errichtet, nachdem ihre Vorgängerin im Spanischen Erbfolgekrieg abgebrannt war. Ganz in der Nähe steht eine Sonnenuhr, erdacht von einem berühmten Sohn des Ortes.","pt":"A igreja barroca que preside à praça de Torrente, erguida em meados do século XVIII depois do incêndio da anterior na Guerra da Sucessão. Muito perto, um relógio de sol idealizado por um ilustre filho da terra."},"visit":{"es":"Está en el centro del casco urbano, en la plaza que lleva su nombre. El exterior se ve libremente; el interior en horario de culto. Calcula 30 minutos con el paseo por las calles cercanas.","en":"It is in the centre of the village, on the square that bears its name. The exterior can be seen freely; the interior during services. Allow 30 minutes including a stroll through the nearby streets.","fr":"Elle se trouve au centre du village, sur la place qui porte son nom. L'extérieur se voit librement ; l'intérieur pendant les offices. Comptez 30 minutes avec la promenade dans les rues voisines.","de":"Sie steht im Zentrum des Ortes, auf dem nach ihr benannten Platz. Von außen ist sie frei zu besichtigen, das Innere zu den Gottesdienstzeiten. Rechnen Sie mit 30 Minuten einschließlich Spaziergang durch die umliegenden Gassen.","pt":"Fica no centro do núcleo urbano, na praça com o seu nome. O exterior vê-se livremente; o interior no horário de culto. Conte com 30 minutos com o passeio pelas ruas próximas."},"src":"https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597482","sources":["https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597482","https://es.hispanopedia.com/wiki/Torrente_de_Cinca"],"art":{"es":[{"h":"Historia","t":"El templo anterior ardió durante la guerra de Sucesión, a comienzos del siglo XVIII, y a mediados de ese siglo se construyó la iglesia actual, de estilo barroco aragonés. Tiene planta basilical y tres naves.\n\nTras unas obras costosas, que renovaron la cubierta y la fachada, reconstruyeron el último piso de la torre campanario y pintaron el interior de las tres naves y el altar, volvió a abrir sus puertas en 2015.\n\nLa guerra de Sucesión, entre 1705 y 1714, golpeó con dureza a los pueblos del Cinca y del Segre, situados en la frontera entre los partidarios de los dos aspirantes al trono. La reconstrucción de la iglesia, décadas después, fue un esfuerzo colectivo del pueblo."},{"h":"Qué ver","t":"Fíjate en la torre, que marca la silueta del pueblo junto con el castillo. Dentro, la pintura restaurada devuelve el aspecto luminoso que buscaba el barroco, con las tres naves abiertas hacia el altar.\n\nEn una plazoleta cercana hay un reloj de sol inventado por el padre Manuel Cazador López, uno de los torrentinos ilustres. A pocos pasos, la Casa Ferrabrás, una casa solariega de tres alturas en piedra sillar, se reconstruyó por fases y en 2010 se convirtió en centro cultural, con biblioteca y salas de exposiciones.\n\nLa plaza que rodea la iglesia es el centro de la vida del pueblo: un buen lugar para sentarse y mirar la torre, recién restaurada, recortada contra el risco del castillo."},{"h":"Tradiciones y fiestas","t":"El calendario festivo de Torrente pasa por esta plaza: San Antón, el 17 de enero; San Isidro, el 15 de mayo, con romería; y las fiestas patronales de San Salvador, en torno al 6 de agosto.\n\nLa iglesia es también un buen punto de partida para recorrer el patrimonio menudo del pueblo: los lavaderos de 1933, la Fonteta y el puente acueducto de la acequia vieja, en la parte baja, camino del río."}],"en":[{"h":"History","t":"The previous church burnt down during the War of the Spanish Succession, at the beginning of the 18th century, and the present church, in the Aragonese Baroque style, was built in the middle of that century. It has a basilica plan and three naves.\n\nAfter costly works that renewed the roof and façade, rebuilt the top stage of the bell tower and repainted the interior of the three naves and the altar, it reopened its doors in 2015.\n\nThe War of the Spanish Succession, between 1705 and 1714, hit the towns of the Cinca and the Segre hard, lying as they did on the frontier between the supporters of the two claimants to the throne. Rebuilding the church, decades later, was a collective effort by the village."},{"h":"What to see","t":"Notice the tower, which shapes the village skyline together with the castle. Inside, the restored paintwork brings back the luminous look the Baroque sought, with the three naves opening towards the altar.\n\nIn a small square nearby there is a sundial invented by Father Manuel Cazador López, one of Torrente's distinguished natives. A few steps away, the Casa Ferrabrás, a three-storey ancestral house in ashlar stone, was rebuilt in stages and in 2010 became a cultural centre, with a library and exhibition rooms.\n\nThe square around the church is the centre of village life: a good place to sit and look at the newly restored tower, outlined against the castle crag."},{"h":"Traditions and festivals","t":"Torrente's festive calendar passes through this square: San Antón, on 17 January; San Isidro, on 15 May, with a pilgrimage; and the patronal festival of San Salvador, around 6 August.\n\nThe church is also a good starting point for exploring the village's smaller heritage: the 1933 washhouses, the Fonteta and the aqueduct bridge of the old irrigation channel, in the lower part, on the way to the river."}],"fr":[{"h":"Histoire","t":"L'église précédente brûla pendant la guerre de Succession, au début du XVIIIe siècle, et l'église actuelle, de style baroque aragonais, fut construite au milieu de ce siècle. Elle présente un plan basilical à trois nefs.\n\nAprès d'importants travaux, qui ont renouvelé la toiture et la façade, reconstruit le dernier étage du clocher et repeint l'intérieur des trois nefs et l'autel, elle a rouvert ses portes en 2015.\n\nLa guerre de Succession, entre 1705 et 1714, frappa durement les villages du Cinca et du Segre, situés à la frontière entre les partisans des deux prétendants au trône. La reconstruction de l'église, des décennies plus tard, fut un effort collectif du village."},{"h":"À voir","t":"Observez la tour, qui dessine la silhouette du village avec le château. À l'intérieur, la peinture restaurée rend l'aspect lumineux que recherchait le baroque, avec les trois nefs ouvertes vers l'autel.\n\nSur une placette voisine se trouve un cadran solaire inventé par le père Manuel Cazador López, l'un des enfants illustres de Torrente. À quelques pas, la Casa Ferrabrás, une demeure seigneuriale de trois étages en pierre de taille, a été reconstruite par phases et transformée en 2010 en centre culturel, avec bibliothèque et salles d'exposition.\n\nLa place qui entoure l'église est le centre de la vie du village : un bon endroit pour s'asseoir et regarder la tour, récemment restaurée, se découper sur l'escarpement du château."},{"h":"Traditions et fêtes","t":"Le calendrier festif de Torrente passe par cette place : la San Antón, le 17 janvier ; la San Isidro, le 15 mai, avec pèlerinage ; et les fêtes patronales de San Salvador, autour du 6 août.\n\nL'église est aussi un bon point de départ pour découvrir le petit patrimoine du village : les lavoirs de 1933, la Fonteta et le pont-aqueduc de l'acequia vieja (vieux canal), dans la partie basse, en direction de la rivière."}],"de":[{"h":"Geschichte","t":"Die frühere Kirche brannte zu Beginn des 18. Jahrhunderts während des Spanischen Erbfolgekriegs nieder, und Mitte dieses Jahrhunderts wurde die heutige Kirche im aragonesischen Barockstil errichtet. Sie hat einen basilikalen Grundriss und drei Schiffe.\n\nNach aufwendigen Arbeiten, bei denen Dach und Fassade erneuert, das oberste Geschoss des Glockenturms rekonstruiert und das Innere der drei Schiffe sowie der Altar ausgemalt wurden, öffnete sie 2015 wieder ihre Türen.\n\nDer Spanische Erbfolgekrieg von 1705 bis 1714 traf die Dörfer an Cinca und Segre hart, die an der Grenze zwischen den Anhängern der beiden Thronanwärter lagen. Der Wiederaufbau der Kirche Jahrzehnte später war eine gemeinsame Anstrengung des ganzen Dorfes."},{"h":"Sehenswert","t":"Achten Sie auf den Turm, der zusammen mit der Burg die Silhouette des Dorfes prägt. Im Inneren gibt die restaurierte Ausmalung den lichten Eindruck zurück, den der Barock anstrebte, mit drei zum Altar hin offenen Schiffen.\n\nAuf einem nahen Plätzchen steht eine Sonnenuhr, erfunden von Pater Manuel Cazador López, einem der berühmten Söhne Torrentes. Wenige Schritte entfernt wurde die Casa Ferrabrás, ein dreistöckiges Herrenhaus aus Quadersteinen, in mehreren Etappen wiederaufgebaut und 2010 zu einem Kulturzentrum mit Bibliothek und Ausstellungsräumen.\n\nDer Platz rund um die Kirche ist das Zentrum des Dorflebens: ein guter Ort, um sich hinzusetzen und den frisch restaurierten Turm vor dem Burgfelsen zu betrachten."},{"h":"Feste und Traditionen","t":"Der Festkalender von Torrente führt über diesen Platz: San Antón am 17. Januar; San Isidro am 15. Mai mit Wallfahrt; und das Patronatsfest San Salvador um den 6. August.\n\nDie Kirche ist auch ein guter Ausgangspunkt, um das kleine Kulturerbe des Dorfes zu erkunden: die Waschhäuser von 1933, die Fonteta und die Aquäduktbrücke des alten Bewässerungskanals im unteren Teil, auf dem Weg zum Fluss."}],"pt":[{"h":"História","t":"O templo anterior ardeu durante a Guerra da Sucessão, no início do século XVIII, e em meados desse século construiu-se a igreja atual, de estilo barroco aragonês. Tem planta basilical e três naves.\n\nDepois de obras dispendiosas, que renovaram a cobertura e a fachada, reconstruíram o último piso da torre sineira e pintaram o interior das três naves e o altar, voltou a abrir as portas em 2015.\n\nA Guerra da Sucessão, entre 1705 e 1714, atingiu duramente as povoações do Cinca e do Segre, situadas na fronteira entre os partidários dos dois pretendentes ao trono. A reconstrução da igreja, décadas depois, foi um esforço coletivo da povoação."},{"h":"O que ver","t":"Repare na torre, que marca a silhueta da povoação juntamente com o castelo. No interior, a pintura restaurada devolve o aspeto luminoso que o barroco procurava, com as três naves abertas para o altar.\n\nNuma pracinha próxima há um relógio de sol inventado pelo padre Manuel Cazador López, um dos filhos ilustres de Torrente. A poucos passos, a Casa Ferrabrás, uma casa senhorial de três pisos em pedra de silharia, foi reconstruída por fases e em 2010 tornou-se centro cultural, com biblioteca e salas de exposições.\n\nA praça que rodeia a igreja é o centro da vida da povoação: um bom lugar para se sentar e olhar para a torre, recém-restaurada, recortada contra o penhasco do castelo."},{"h":"Tradições e festas","t":"O calendário festivo de Torrente passa por esta praça: San Antón, a 17 de janeiro; San Isidro, a 15 de maio, com romaria; e as festas do padroeiro, San Salvador, por volta de 6 de agosto.\n\nA igreja é também um bom ponto de partida para percorrer o pequeno património da povoação: os lavadouros de 1933, a Fonteta e a ponte-aqueduto da acequia vieja (levada velha), na parte baixa, a caminho do rio."}]},"status":"pending"},{"id":"murallas-zaidin","town":"Zaidín","cat":"patrimonio","lat":41.60417,"lon":0.26222,"coord_src":null,"q":["Murallas de Zaidín","Castillo de Zaidín"],"fq":["Zaidín murallas","Castillo de Zaidín","Zaidín Huesca"],"name":{"es":"Murallas y castillo de Zaidín","en":"Walls and castle of Zaidín","fr":"Remparts et château de Zaidín","de":"Stadtmauer und Burg von Zaidín","pt":"Muralhas e castelo de Zaidín"},"when":{"es":"Edad Media y siglo XVI · Recinto amurallado","en":"Middle Ages and 16th century · Walled enclosure","fr":"Moyen Âge et XVIe siècle · Enceinte fortifiée","de":"Mittelalter und 16. Jh. · Ummauerter Ort","pt":"Idade Média e século XVI · Recinto amuralhado"},"desc":{"es":"Zaidín fue una villa amurallada con castillo señorial. Hoy se conserva un tramo de muralla con torres, visible desde la carretera de Fraga a Monzón.","en":"Zaidín was a walled town with a lord's castle. Today a stretch of wall with towers survives, visible from the road from Fraga to Monzón.","fr":"Zaidín fut une ville fortifiée dotée d'un château seigneurial. Il en subsiste un tronçon de muraille flanqué de tours, visible depuis la route de Fraga à Monzón.","de":"Zaidín war ein ummauerter Ort mit herrschaftlicher Burg. Erhalten ist heute ein Mauerabschnitt mit Türmen, der von der Straße zwischen Fraga und Monzón aus zu sehen ist.","pt":"Zaidín foi uma vila amuralhada com castelo senhorial. Hoje conserva-se um troço de muralha com torres, visível da estrada de Fraga para Monzón."},"visit":{"es":"El tramo conservado está a la izquierda de la carretera A-1234 en dirección a Alcolea. Se ve por fuera en un paseo corto; combínalo con la iglesia y la ermita de San Antón.","en":"The surviving stretch is on the left of the A-1234 road heading towards Alcolea. It can be seen from outside on a short walk; combine it with the church and the hermitage of San Antón.","fr":"Le tronçon conservé se trouve à gauche de la route A-1234 en direction d'Alcolea. Il se voit de l'extérieur lors d'une courte promenade ; combinez-le avec l'église et l'ermitage de San Antón.","de":"Der erhaltene Abschnitt liegt links der Straße A-1234 in Richtung Alcolea. Er ist von außen bei einem kurzen Spaziergang zu sehen; verbinden Sie ihn mit der Kirche und der Einsiedelei San Antón.","pt":"O troço conservado fica à esquerda da estrada A-1234 em direção a Alcolea. Vê-se por fora num passeio curto; combine-o com a igreja e a ermida de San Antón."},"src":"https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597325","sources":["https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597325","https://es.hispanopedia.com/wiki/Zaid%C3%ADn_(Huesca)","https://es.wikipedia.org/wiki/Zaid%C3%ADn_(Huesca)"],"art":{"es":[{"h":"Historia","t":"En enero de 1092 el infante Pedro, futuro Pedro I de Aragón, entregó el castillo de «Zaidi» a Pedro Ramón de Erill. Después la villa fue de realengo, pasó a los Moncada en el siglo XIII, estuvo ligada al monasterio de Scala Dei en el XIV y acabó en manos de los Bardají, que todavía la tenían en 1610.\n\nEl castillo de los señores quedaba dentro del recinto amurallado. La muralla del siglo XVI se mantuvo hasta mediados del siglo XX y tenía cinco puertas: El Portal, La Porteta, El Forat, El Furigachó y una quinta con torre de defensa y vigía.\n\nLa villa pasó por muchas manos en pocos siglos: reyes, nobles como los Moncada, un patriarca de Alejandría que la legó a una cartuja catalana y, por fin, los Bardají. Ese ir y venir explica que Zaidín se dotara de defensas sólidas."},{"h":"Qué ver","t":"El tramo occidental mide unos 50 metros, con dos torres rectangulares poco salientes en los extremos y dos cilíndricas en el centro. Fíjate en la base de las torres redondas: es troncocónica, en talud, y un collarín de piedra marca dónde empieza el cilindro.\n\nEse talud servía para alejar a los atacantes del pie del muro y para que los proyectiles rebotaran. Aunque buena parte de la cerca desapareció en el siglo XX, este lienzo basta para imaginar cómo era la villa cerrada.\n\nLa mejor perspectiva se tiene desde la propia carretera, aparcando con cuidado en las inmediaciones: desde allí se ve el lienzo completo con sus cuatro torres."},{"h":"Para entenderlo","t":"Los nombres de las puertas siguen vivos en el habla del pueblo, que mezcla aragonés y catalán como en toda la franja del Cinca: el Portal, la Porteta, el Forat (el agujero). Muchas casas se apoyaron en la muralla y la usaron como pared trasera, y así se salvaron algunos tramos.\n\nCompleta el paseo con la iglesia de San Juan Bautista, barroca, y con la ermita de San Antón, en las afueras. Para terminar, baja al embarcadero del proyecto Entre Ríos, junto al Cinca."}],"en":[{"h":"History","t":"In January 1092 Prince Peter, the future Peter I of Aragón, handed over the castle of «Zaidi» to Pedro Ramón de Erill. The town later belonged to the Crown, passed to the Moncadas in the 13th century, was linked to the monastery of Scala Dei in the 14th and ended up in the hands of the Bardají family, who still held it in 1610.\n\nThe lords' castle stood inside the walled enclosure. The 16th-century wall survived until the mid-20th century and had five gates: El Portal, La Porteta, El Forat, El Furigachó and a fifth with a defensive watchtower.\n\nThe town changed hands many times in a few centuries: kings, nobles such as the Moncadas, a Patriarch of Alexandria who bequeathed it to a Catalan Carthusian monastery and, finally, the Bardají family. All that coming and going explains why Zaidín provided itself with solid defences."},{"h":"What to see","t":"The western stretch is about 50 metres long, with two slightly projecting rectangular towers at the ends and two cylindrical ones in the middle. Notice the base of the round towers: it is truncated-cone shaped, sloping outwards, and a stone collar marks where the cylinder begins.\n\nThat slope served to keep attackers away from the foot of the wall and to make projectiles bounce off. Although much of the enclosure disappeared in the 20th century, this section is enough to picture what the walled town was like.\n\nThe best view is from the road itself, parking carefully nearby: from there you can see the whole section with its four towers."},{"h":"Background","t":"The names of the gates live on in the local speech, which mixes Aragonese and Catalan as it does all along the Cinca strip: el Portal, la Porteta, el Forat (the hole). Many houses were built against the wall and used it as their back wall, which is how some stretches were saved.\n\nComplete the walk with the Baroque church of San Juan Bautista and the hermitage of San Antón, on the outskirts. To finish, go down to the Entre Ríos project landing stage beside the Cinca."}],"fr":[{"h":"Histoire","t":"En janvier 1092, l'infant Pierre, futur Pierre Ier d'Aragon, remit le château de « Zaidi » à Pedro Ramón de Erill. La ville fut ensuite domaine royal, passa aux Moncada au XIIIe siècle, fut liée au monastère de Scala Dei au XIVe et finit entre les mains des Bardají, qui la possédaient encore en 1610.\n\nLe château des seigneurs se trouvait à l'intérieur de l'enceinte. La muraille du XVIe siècle subsista jusqu'au milieu du XXe siècle et comptait cinq portes : El Portal, La Porteta, El Forat, El Furigachó et une cinquième dotée d'une tour de défense et de guet.\n\nLa ville changea souvent de mains en quelques siècles : rois, nobles comme les Moncada, un patriarche d'Alexandrie qui la légua à une chartreuse catalane et, enfin, les Bardají. Ces allées et venues expliquent que Zaidín se soit dotée de solides défenses."},{"h":"À voir","t":"Le tronçon occidental mesure environ 50 mètres, avec deux tours rectangulaires peu saillantes aux extrémités et deux tours cylindriques au centre. Observez la base des tours rondes : elle est tronconique, en talus, et un cordon de pierre marque le début du cylindre.\n\nCe talus servait à éloigner les assaillants du pied du mur et à faire ricocher les projectiles. Même si une bonne partie de l'enceinte a disparu au XXe siècle, cette courtine suffit pour imaginer la ville close.\n\nLa meilleure perspective s'offre depuis la route elle-même, en se garant prudemment à proximité : de là, on voit toute la courtine avec ses quatre tours."},{"h":"Pour comprendre","t":"Les noms des portes restent vivants dans le parler local, qui mêle aragonais et catalan comme dans toute la frange du Cinca : el Portal, la Porteta, el Forat (le trou). De nombreuses maisons se sont adossées à la muraille et s'en sont servies comme mur arrière, ce qui a permis d'en sauver quelques tronçons.\n\nComplétez la promenade avec l'église baroque San Juan Bautista et avec l'ermitage de San Antón, à la sortie du village. Pour finir, descendez à l'embarcadère du projet Entre Ríos, au bord du Cinca."}],"de":[{"h":"Geschichte","t":"Im Januar 1092 übergab Infant Peter, der spätere Peter I. von Aragón, die Burg „Zaidi“ an Pedro Ramón de Erill. Danach war der Ort königlicher Besitz, ging im 13. Jahrhundert an die Moncada, war im 14. Jahrhundert mit dem Kloster Scala Dei verbunden und gelangte schließlich an die Bardají, die ihn 1610 noch besaßen.\n\nDie Burg der Herren lag innerhalb der Stadtmauer. Die Mauer aus dem 16. Jahrhundert blieb bis Mitte des 20. Jahrhunderts erhalten und hatte fünf Tore: El Portal, La Porteta, El Forat, El Furigachó und ein fünftes mit Wehr- und Wachturm.\n\nDer Ort wechselte in wenigen Jahrhunderten oft den Besitzer: Könige, Adlige wie die Moncada, ein Patriarch von Alexandria, der ihn einer katalanischen Kartause vermachte, und schließlich die Bardají. Dieses Hin und Her erklärt, warum Zaidín sich mit soliden Verteidigungsanlagen versah."},{"h":"Sehenswert","t":"Der westliche Abschnitt ist etwa 50 Meter lang, mit zwei wenig vorspringenden rechteckigen Türmen an den Enden und zwei runden in der Mitte. Achten Sie auf den Fuß der runden Türme: Er ist kegelstumpfförmig geböscht, und ein steinerner Ring markiert, wo der Zylinder beginnt.\n\nDiese Böschung sollte Angreifer vom Mauerfuß fernhalten und Geschosse abprallen lassen. Auch wenn ein großer Teil der Umfassung im 20. Jahrhundert verschwand, genügt dieser Abschnitt, um sich den geschlossenen Ort vorzustellen.\n\nDie beste Perspektive hat man von der Straße selbst, wenn man in der Nähe vorsichtig parkt: Von dort sieht man den ganzen Mauerabschnitt mit seinen vier Türmen."},{"h":"Zum Verständnis","t":"Die Namen der Tore leben in der Sprache des Dorfes weiter, die wie im gesamten Grenzstreifen am Cinca Aragonesisch und Katalanisch mischt: el Portal, la Porteta, el Forat (das Loch). Viele Häuser lehnten sich an die Mauer und nutzten sie als Rückwand, und so blieben einige Abschnitte erhalten.\n\nErgänzen Sie den Spaziergang mit der barocken Kirche San Juan Bautista und der Einsiedelei San Antón am Ortsrand. Gehen Sie zum Abschluss hinunter zur Anlegestelle des Projekts Entre Ríos am Cinca."}],"pt":[{"h":"História","t":"Em janeiro de 1092 o infante Pedro, futuro Pedro I de Aragão, entregou o castelo de «Zaidi» a Pedro Ramón de Erill. Depois a vila foi reguenga, passou para os Moncada no século XIII, esteve ligada ao mosteiro de Scala Dei no XIV e acabou nas mãos dos Bardají, que ainda a detinham em 1610.\n\nO castelo dos senhores ficava dentro do recinto amuralhado. A muralha do século XVI manteve-se até meados do século XX e tinha cinco portas: El Portal, La Porteta, El Forat, El Furigachó e uma quinta com torre de defesa e vigia.\n\nA vila passou por muitas mãos em poucos séculos: reis, nobres como os Moncada, um patriarca de Alexandria que a legou a uma cartuxa catalã e, por fim, os Bardají. Esse vaivém explica que Zaidín se tenha dotado de defesas sólidas."},{"h":"O que ver","t":"O troço ocidental mede cerca de 50 metros, com duas torres retangulares pouco salientes nas extremidades e duas cilíndricas no centro. Repare na base das torres redondas: é troncocónica, em talude, e um colar de pedra marca onde começa o cilindro.\n\nEsse talude servia para afastar os atacantes do pé do muro e para fazer ressaltar os projéteis. Embora boa parte da cerca tenha desaparecido no século XX, este pano basta para imaginar como era a vila fechada.\n\nA melhor perspetiva obtém-se da própria estrada, estacionando com cuidado nas imediações: dali vê-se o pano completo com as suas quatro torres."},{"h":"Para compreender","t":"Os nomes das portas continuam vivos na fala da povoação, que mistura aragonês e catalão como em toda a faixa do Cinca: el Portal, la Porteta, el Forat (o buraco). Muitas casas apoiaram-se na muralha e usaram-na como parede traseira, e assim se salvaram alguns troços.\n\nComplete o passeio com a igreja de San Juan Bautista, barroca, e com a ermida de San Antón, nos arredores. Para terminar, desça ao cais do projeto Entre Ríos, junto ao Cinca."}]},"status":"pending"},{"id":"iglesia-zaidin","town":"Zaidín","cat":"patrimonio","lat":41.60446,"lon":0.26373,"coord_src":null,"q":["Iglesia de San Juan Bautista, Zaidín","Iglesia parroquial, Zaidín"],"fq":["Zaidín iglesia","Iglesia de San Juan Bautista Zaidín","Zaidín"],"name":{"es":"Iglesia de San Juan Bautista","en":"Iglesia de San Juan Bautista (Church of St John the Baptist)","fr":"Iglesia de San Juan Bautista (église)","de":"Iglesia de San Juan Bautista","pt":"Igreja de San Juan Bautista"},"when":{"es":"Barroco sobre un templo románico · Parroquia","en":"Baroque over a Romanesque church · Parish church","fr":"Baroque sur une église romane · Paroisse","de":"Barock auf einer romanischen Kirche · Pfarrkirche","pt":"Barroco sobre um templo românico · Paróquia"},"desc":{"es":"La parroquia barroca de Zaidín, levantada sobre una iglesia románica anterior. Tres naves, cimborrio y una portada de medio punto con hornacina presiden el centro del pueblo.","en":"Zaidín's Baroque parish church, built over an earlier Romanesque church. Three naves, a lantern tower and a round-arched doorway with a niche preside over the village centre.","fr":"L'église paroissiale baroque de Zaidín, élevée sur une église romane antérieure. Trois nefs, une tour-lanterne et un portail en plein cintre surmonté d'une niche dominent le centre du village.","de":"Die barocke Pfarrkirche von Zaidín, errichtet über einer älteren romanischen Kirche. Drei Schiffe, ein Vierungsturm und ein Rundbogenportal mit Nische prägen das Ortszentrum.","pt":"A igreja paroquial barroca de Zaidín, erguida sobre uma igreja românica anterior. Três naves, zimbório e um portal de volta perfeita com nicho presidem ao centro da povoação."},"visit":{"es":"Está en el centro de Zaidín. El exterior se ve libremente; el interior, en horario de culto. Calcula 20-30 minutos y combínalo con las murallas, a pocos minutos a pie.","en":"It is in the centre of Zaidín. The exterior can be seen freely; the interior during services. Allow 20-30 minutes and combine it with the walls, a few minutes' walk away.","fr":"Elle se trouve au centre de Zaidín. L'extérieur se voit librement ; l'intérieur pendant les offices. Comptez 20 à 30 minutes et combinez-la avec les remparts, à quelques minutes à pied.","de":"Sie steht im Zentrum von Zaidín. Von außen ist sie frei zu besichtigen, das Innere zu den Gottesdienstzeiten. Rechnen Sie mit 20–30 Minuten und verbinden Sie den Besuch mit der Stadtmauer, wenige Gehminuten entfernt.","pt":"Fica no centro de Zaidín. O exterior vê-se livremente; o interior, no horário de culto. Conte com 20-30 minutos e combine-o com as muralhas, a poucos minutos a pé."},"src":"https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597325","sources":["https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597325","https://es.hispanopedia.com/wiki/Zaid%C3%ADn_(Huesca)"],"art":{"es":[{"h":"Historia","t":"La iglesia actual es barroca y se construyó sobre otra anterior de estilo románico, de la que apenas quedan huellas. Es habitual en la comarca: cuando los pueblos crecieron en los siglos XVII y XVIII, los viejos templos medievales se quedaron pequeños y se sustituyeron por otros más amplios.\n\nTiene planta de cruz latina, tres naves y cimborrio sobre el crucero, aunque ha perdido el brazo norte del crucero.\n\nLa parroquia es también la mejor pista del pasado de la villa: se levanta dentro del antiguo recinto amurallado, junto al lugar donde estuvo el castillo de los señores, en la parte más protegida del pueblo."},{"h":"Qué ver","t":"La puerta de la fachada se abre con un arco de medio punto entre pilastras, y encima tiene una hornacina enmarcada, a modo de pequeño retablo de piedra. Es la parte más cuidada del exterior.\n\nDentro, las tres naves y el cimborrio dan amplitud y luz. Busca la asimetría del crucero, que delata la pérdida de uno de sus brazos. Desde la iglesia, las calles del casco te llevan en pocos minutos al tramo de muralla con torres.\n\nAl salir, fíjate en las calles que rodean la iglesia: su trazado irregular y estrecho conserva la forma del pueblo medieval encerrado entre murallas, con las casas apoyadas unas en otras."},{"h":"Tradiciones y fiestas","t":"La iglesia está dedicada a San Juan Bautista, pero las fiestas grandes de Zaidín son las de la Asunción, el 15 de agosto. En enero, el 17, el pueblo celebra San Antón con una romería a su ermita, en las afueras, con vistas al río.\n\nZaidín tiene además un cine en la avenida San Antonio Abad, reformado en los primeros años de este siglo, que sigue siendo un espacio de encuentro para los vecinos.\n\nEl cine y la iglesia, a poca distancia, resumen dos caras de la vida de un pueblo de la ribera: la devoción y las fiestas por un lado, la vida social y el ocio por otro."}],"en":[{"h":"History","t":"The present church is Baroque and was built over an earlier Romanesque one, of which barely any traces remain. This is common in the comarca: when the villages grew in the 17th and 18th centuries, the old medieval churches became too small and were replaced by larger ones.\n\nIt has a Latin-cross plan, three naves and a lantern over the crossing, although it has lost the north arm of the transept.\n\nThe parish church is also the best clue to the town's past: it stands inside the old walled enclosure, next to the spot where the lords' castle stood, in the most protected part of the village."},{"h":"What to see","t":"The doorway in the façade opens with a round arch between pilasters, and above it is a framed niche, like a small stone altarpiece. It is the most carefully finished part of the exterior.\n\nInside, the three naves and the lantern give a sense of space and light. Look for the asymmetry of the transept, which gives away the loss of one of its arms. From the church, the streets of the old centre lead you in a few minutes to the stretch of wall with towers.\n\nAs you leave, notice the streets around the church: their narrow, irregular layout preserves the shape of the medieval village enclosed by walls, with the houses leaning against one another."},{"h":"Traditions and festivals","t":"The church is dedicated to St John the Baptist, but Zaidín's main festival is that of the Assumption, on 15 August. In January, on the 17th, the village celebrates San Antón with a pilgrimage to his hermitage, on the outskirts, overlooking the river.\n\nZaidín also has a cinema on Avenida San Antonio Abad, refurbished in the early years of this century, which is still a meeting place for local people.\n\nThe cinema and the church, a short distance apart, sum up two sides of life in a riverside village: devotion and festivals on the one hand, social life and leisure on the other."}],"fr":[{"h":"Histoire","t":"L'église actuelle est baroque et fut construite sur une autre, plus ancienne, de style roman, dont il ne reste presque aucune trace. C'est fréquent dans la comarque : quand les villages grandirent aux XVIIe et XVIIIe siècles, les vieilles églises médiévales devinrent trop petites et furent remplacées par d'autres, plus vastes.\n\nElle présente un plan en croix latine, trois nefs et une tour-lanterne sur la croisée, bien qu'elle ait perdu le bras nord du transept.\n\nL'église est aussi le meilleur indice du passé de la ville : elle s'élève à l'intérieur de l'ancienne enceinte, près de l'emplacement du château des seigneurs, dans la partie la mieux protégée du village."},{"h":"À voir","t":"La porte de la façade s'ouvre par un arc en plein cintre entre des pilastres, surmonté d'une niche encadrée, à la manière d'un petit retable de pierre. C'est la partie la plus soignée de l'extérieur.\n\nÀ l'intérieur, les trois nefs et la tour-lanterne donnent ampleur et lumière. Cherchez l'asymétrie du transept, qui trahit la perte de l'un de ses bras. Depuis l'église, les rues du vieux centre vous mènent en quelques minutes au tronçon de muraille flanqué de tours.\n\nEn sortant, observez les rues qui entourent l'église : leur tracé irrégulier et étroit conserve la forme du village médiéval enfermé dans ses remparts, avec des maisons appuyées les unes contre les autres."},{"h":"Traditions et fêtes","t":"L'église est dédiée à saint Jean-Baptiste, mais les grandes fêtes de Zaidín sont celles de l'Assomption, le 15 août. En janvier, le 17, le village célèbre la San Antón avec un pèlerinage à son ermitage, à la sortie du village, avec vue sur la rivière.\n\nZaidín possède en outre un cinéma sur l'avenida San Antonio Abad, rénové au début de ce siècle, qui reste un lieu de rencontre pour les habitants.\n\nLe cinéma et l'église, à peu de distance l'un de l'autre, résument deux facettes de la vie d'un village de la rive : la dévotion et les fêtes d'un côté, la vie sociale et les loisirs de l'autre."}],"de":[{"h":"Geschichte","t":"Die heutige Kirche ist barock und wurde über einer älteren romanischen errichtet, von der kaum Spuren geblieben sind. Das ist typisch für die Comarca: Als die Dörfer im 17. und 18. Jahrhundert wuchsen, wurden die alten mittelalterlichen Kirchen zu klein und durch größere ersetzt.\n\nSie hat einen Grundriss in Form eines lateinischen Kreuzes, drei Schiffe und einen Vierungsturm, hat jedoch den nördlichen Querhausarm verloren.\n\nDie Pfarrkirche ist zugleich der beste Hinweis auf die Vergangenheit des Ortes: Sie steht innerhalb der ehemaligen Ummauerung, neben der Stelle, an der die Burg der Herren stand, im am besten geschützten Teil des Dorfes."},{"h":"Sehenswert","t":"Das Fassadenportal öffnet sich mit einem Rundbogen zwischen Pilastern, darüber liegt eine gerahmte Nische, eine Art kleines Steinretabel. Es ist der sorgfältigste Teil des Äußeren.\n\nIm Inneren sorgen die drei Schiffe und der Vierungsturm für Weite und Licht. Achten Sie auf die Asymmetrie des Querhauses, die den Verlust eines seiner Arme verrät. Von der Kirche führen Sie die Gassen des Ortskerns in wenigen Minuten zum Mauerabschnitt mit Türmen.\n\nAchten Sie beim Hinausgehen auf die Gassen rund um die Kirche: Ihr unregelmäßiger, enger Verlauf bewahrt die Form des mittelalterlichen, von Mauern umschlossenen Dorfes mit aneinandergelehnten Häusern."},{"h":"Feste und Traditionen","t":"Die Kirche ist Johannes dem Täufer geweiht, doch die großen Feste von Zaidín sind die zu Mariä Himmelfahrt am 15. August. Im Januar, am 17., feiert das Dorf San Antón mit einer Wallfahrt zu seiner Einsiedelei am Ortsrand mit Blick auf den Fluss.\n\nZaidín hat außerdem ein Kino an der Avenida San Antonio Abad, das in den ersten Jahren dieses Jahrhunderts renoviert wurde und bis heute ein Treffpunkt der Einwohner ist.\n\nKino und Kirche, nicht weit voneinander entfernt, fassen zwei Seiten des Lebens in einem Dorf am Fluss zusammen: Frömmigkeit und Feste auf der einen, gesellschaftliches Leben und Freizeit auf der anderen Seite."}],"pt":[{"h":"História","t":"A igreja atual é barroca e foi construída sobre outra anterior de estilo românico, da qual quase não restam vestígios. É habitual na comarca: quando as povoações cresceram nos séculos XVII e XVIII, os velhos templos medievais ficaram pequenos e foram substituídos por outros mais amplos.\n\nTem planta em cruz latina, três naves e zimbório sobre o cruzeiro, embora tenha perdido o braço norte do transepto.\n\nA paróquia é também a melhor pista do passado da vila: ergue-se dentro do antigo recinto amuralhado, junto ao local onde existiu o castelo dos senhores, na parte mais protegida da povoação."},{"h":"O que ver","t":"A porta da fachada abre-se com um arco de volta perfeita entre pilastras e, por cima, tem um nicho emoldurado, à maneira de um pequeno retábulo de pedra. É a parte mais cuidada do exterior.\n\nNo interior, as três naves e o zimbório dão amplitude e luz. Procure a assimetria do transepto, que denuncia a perda de um dos seus braços. A partir da igreja, as ruas do centro levam-no em poucos minutos ao troço de muralha com torres.\n\nÀ saída, repare nas ruas que rodeiam a igreja: o seu traçado irregular e estreito conserva a forma da povoação medieval fechada entre muralhas, com as casas apoiadas umas nas outras."},{"h":"Tradições e festas","t":"A igreja é dedicada a São João Batista, mas as grandes festas de Zaidín são as da Assunção, a 15 de agosto. Em janeiro, no dia 17, a povoação celebra San Antón com uma romaria à sua ermida, nos arredores, com vistas para o rio.\n\nZaidín tem ainda um cinema na avenida San Antonio Abad, renovado nos primeiros anos deste século, que continua a ser um espaço de encontro para os habitantes.\n\nO cinema e a igreja, a pouca distância um do outro, resumem duas faces da vida de uma povoação da ribeira: a devoção e as festas, por um lado, a vida social e o lazer, por outro."}]},"status":"pending"},{"id":"san-anton-zaidin","town":"Zaidín","cat":"patrimonio","lat":41.61213,"lon":0.26931,"coord_src":null,"q":["Ermita de San Antón, Zaidín","San Antón, Zaidín"],"fq":["Ermita de San Antón Zaidín","Zaidín ermita","Zaidín San Antón"],"name":{"es":"Ermita de San Antón","en":"Ermita de San Antón (Hermitage of St Anthony)","fr":"Ermita de San Antón (ermitage)","de":"Ermita de San Antón","pt":"Ermida de San Antón"},"when":{"es":"Documentada en 1600 · Ermita y mirador","en":"Recorded in 1600 · Hermitage and viewpoint","fr":"Attesté en 1600 · Ermitage et belvédère","de":"Seit 1600 belegt · Einsiedelei und Aussichtspunkt","pt":"Documentada em 1600 · Ermida e miradouro"},"desc":{"es":"Una ermita en las afueras de Zaidín, quizá sobre un poblado prerromano, documentada al menos desde 1600. Cada 17 de enero el pueblo sube en romería, y desde arriba se ve toda la ribera del Cinca.","en":"A hermitage on the outskirts of Zaidín, perhaps built on a pre-Roman settlement, recorded since at least 1600. Every 17 January the village walks up in pilgrimage, and from the top you can see the whole Cinca riverside.","fr":"Un ermitage à la sortie de Zaidín, peut-être sur un village préromain, attesté au moins depuis 1600. Chaque 17 janvier, le village y monte en pèlerinage, et d'en haut on voit toute la rive du Cinca.","de":"Eine Einsiedelei am Ortsrand von Zaidín, vielleicht auf einer vorrömischen Siedlung, mindestens seit 1600 belegt. Jedes Jahr am 17. Januar zieht das Dorf in einer Wallfahrt hinauf, und von oben überblickt man die ganze Aue des Cinca.","pt":"Uma ermida nos arredores de Zaidín, talvez sobre um povoado pré-romano, documentada pelo menos desde 1600. Todos os anos a 17 de janeiro a povoação sobe em romaria, e lá de cima vê-se toda a ribeira do Cinca."},"visit":{"es":"Está a las afueras del pueblo; se llega a pie o en coche en pocos minutos. El entorno y las vistas son libres; el interior suele abrir el día de la romería. Calcula media hora.","en":"It is on the outskirts of the village; you can reach it on foot or by car in a few minutes. The surroundings and views are open to all; the interior usually opens on the day of the pilgrimage. Allow half an hour.","fr":"Il se trouve à la sortie du village ; on y arrive à pied ou en voiture en quelques minutes. Les abords et la vue sont libres ; l'intérieur ouvre généralement le jour du pèlerinage. Comptez une demi-heure.","de":"Sie liegt am Ortsrand; zu Fuß oder mit dem Auto ist sie in wenigen Minuten erreichbar. Umgebung und Aussicht sind frei zugänglich; das Innere ist meist am Wallfahrtstag geöffnet. Rechnen Sie mit einer halben Stunde.","pt":"Fica nos arredores da povoação; chega-se a pé ou de carro em poucos minutos. A envolvente e as vistas são de acesso livre; o interior costuma abrir no dia da romaria. Conte com meia hora."},"src":"https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597325","sources":["https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597325","https://es.hispanopedia.com/wiki/Zaid%C3%ADn_(Huesca)","https://es.wikipedia.org/wiki/Zaid%C3%ADn_(Huesca)"],"art":{"es":[{"h":"Historia","t":"Hay constancia de la ermita al menos desde el año 1600. Se levantó en un alto a las afueras del pueblo, posiblemente sobre un antiguo poblado prerromano, como ocurre con otras ermitas de la comarca que ocupan cerros habitados desde la Antigüedad.\n\nEstá dedicada a San Antonio Abad, San Antón, protector de los animales, una devoción muy extendida en los pueblos agrícolas, donde las caballerías eran imprescindibles para el trabajo del campo.\n\nLas ermitas de las afueras marcaban también los límites del pueblo y los caminos que salían hacia el campo. En ellas se pedía protección para el ganado y las cosechas, y alrededor de ellas se organizaban las romerías que todavía hoy reúnen a los vecinos.\n\nLa posición de la ermita, en un alto con buena vista sobre el río, recuerda la de otras de la comarca, como San Juan de Ballobar o San Salvador de Torrente."},{"h":"Tradiciones y fiestas","t":"El 17 de enero, día de San Antón, Zaidín sube en romería hasta la ermita. Es una de las primeras fiestas del año en la comarca y una cita de invierno que reúne a vecinos y gente de los alrededores.\n\nEn muchos pueblos aragoneses ese día se bendecían los animales y se encendían hogueras, y en Zaidín la devoción ha dejado huella en el callejero: la avenida principal se llama de San Antonio Abad.\n\nSi visitas Zaidín en otra época del año, la ermita sigue siendo un buen paseo corto para estirar las piernas y ver la ribera. En verano, mejor a primera hora o al atardecer."},{"h":"El paisaje","t":"Desde la ermita se divisa la ribera del Cinca: la vega cubierta de frutales, las choperas junto al agua y, en la otra orilla, las tierras de Velilla y Fraga. Es fácil imaginar por qué un poblado antiguo eligió este alto, con buena vista y cerca del río.\n\nVen a última hora del día para ver cómo cambia la luz sobre la huerta. Después, baja al embarcadero del proyecto Entre Ríos para ver el río de cerca."}],"en":[{"h":"History","t":"The hermitage is recorded since at least the year 1600. It was built on a height on the outskirts of the village, possibly on an old pre-Roman settlement, as with other hermitages in the comarca that occupy hills inhabited since Antiquity.\n\nIt is dedicated to St Anthony the Abbot, San Antón, protector of animals, a devotion very widespread in farming villages, where horses and mules were essential for work in the fields.\n\nHermitages on the outskirts also marked the boundaries of the village and the roads leading out into the countryside. People prayed in them for protection for their livestock and crops, and around them were organised the pilgrimages that still bring local people together today.\n\nThe hermitage's position, on a height with a good view over the river, recalls that of others in the comarca, such as San Juan in Ballobar and San Salvador in Torrente."},{"h":"Traditions and festivals","t":"On 17 January, St Anthony's Day, Zaidín walks up to the hermitage in pilgrimage. It is one of the first festivals of the year in the comarca and a winter gathering that brings together local people and visitors from the surrounding area.\n\nIn many Aragonese villages animals were blessed and bonfires lit on that day, and in Zaidín the devotion has left its mark on the street map: the main avenue is named after San Antonio Abad.\n\nIf you visit Zaidín at another time of year, the hermitage is still a good short walk to stretch your legs and see the riverside. In summer, it is best first thing in the morning or at sunset."},{"h":"The landscape","t":"From the hermitage you can make out the Cinca riverside: the floodplain covered with fruit orchards, the poplar groves beside the water and, on the far bank, the lands of Velilla and Fraga. It is easy to imagine why an ancient settlement chose this height, with a good view and close to the river.\n\nCome at the end of the day to watch the light change over the market gardens. Afterwards, go down to the Entre Ríos project landing stage to see the river up close."}],"fr":[{"h":"Histoire","t":"L'ermitage est attesté au moins depuis l'an 1600. Il fut élevé sur une hauteur à la sortie du village, peut-être sur un ancien village préromain, comme d'autres ermitages de la comarque qui occupent des collines habitées depuis l'Antiquité.\n\nIl est dédié à saint Antoine l'Abbé, San Antón, protecteur des animaux, une dévotion très répandue dans les villages agricoles, où les bêtes de trait étaient indispensables aux travaux des champs.\n\nLes ermitages des environs marquaient aussi les limites du village et les chemins qui partaient vers la campagne. On y demandait protection pour le bétail et les récoltes, et c'est autour d'eux que s'organisaient les pèlerinages qui rassemblent encore aujourd'hui les habitants.\n\nLa position de l'ermitage, sur une hauteur avec une belle vue sur la rivière, rappelle celle d'autres ermitages de la comarque, comme San Juan à Ballobar ou San Salvador à Torrente."},{"h":"Traditions et fêtes","t":"Le 17 janvier, jour de la San Antón, Zaidín monte en pèlerinage jusqu'à l'ermitage. C'est l'une des premières fêtes de l'année dans la comarque et un rendez-vous d'hiver qui rassemble habitants et gens des alentours.\n\nDans de nombreux villages aragonais, on bénissait ce jour-là les animaux et l'on allumait des feux de joie ; à Zaidín, cette dévotion a laissé sa trace dans le nom des rues : l'avenue principale porte le nom de San Antonio Abad.\n\nSi vous visitez Zaidín à une autre période de l'année, l'ermitage reste une bonne petite promenade pour se dégourdir les jambes et contempler la rive. En été, allez-y plutôt tôt le matin ou au coucher du soleil."},{"h":"Le paysage","t":"Depuis l'ermitage, on aperçoit la rive du Cinca : la plaine couverte de vergers, les peupleraies au bord de l'eau et, sur l'autre rive, les terres de Velilla et de Fraga. On comprend aisément pourquoi un village ancien choisit cette hauteur, avec une belle vue et proche de la rivière.\n\nVenez en fin de journée pour voir la lumière changer sur la huerta. Ensuite, descendez à l'embarcadère du projet Entre Ríos pour voir la rivière de près."}],"de":[{"h":"Geschichte","t":"Die Einsiedelei ist mindestens seit dem Jahr 1600 belegt. Sie wurde auf einer Anhöhe am Ortsrand errichtet, möglicherweise auf einer alten vorrömischen Siedlung, wie andere Einsiedeleien der Comarca, die auf seit der Antike bewohnten Hügeln stehen.\n\nSie ist dem heiligen Antonius dem Großen geweiht, San Antón, dem Schutzpatron der Tiere, eine in den Bauerndörfern weit verbreitete Verehrung, wo die Lasttiere für die Feldarbeit unverzichtbar waren.\n\nDie Einsiedeleien am Ortsrand markierten auch die Grenzen des Dorfes und die Wege, die aufs Feld hinausführten. Dort bat man um Schutz für Vieh und Ernte, und um sie herum organisierte man die Wallfahrten, die bis heute die Einwohner zusammenführen.\n\nDie Lage der Einsiedelei auf einer Anhöhe mit guter Sicht auf den Fluss erinnert an andere in der Comarca, etwa San Juan in Ballobar oder San Salvador in Torrente."},{"h":"Feste und Traditionen","t":"Am 17. Januar, dem Tag des San Antón, zieht Zaidín in einer Wallfahrt zur Einsiedelei hinauf. Es ist eines der ersten Feste des Jahres in der Comarca und ein Wintertermin, der Einheimische und Menschen aus der Umgebung zusammenbringt.\n\nIn vielen aragonesischen Dörfern wurden an diesem Tag die Tiere gesegnet und Feuer entzündet, und in Zaidín hat die Verehrung Spuren im Straßenverzeichnis hinterlassen: Die Hauptstraße heißt Avenida de San Antonio Abad.\n\nWenn Sie Zaidín zu einer anderen Jahreszeit besuchen, ist die Einsiedelei dennoch ein guter kurzer Spaziergang, um sich die Beine zu vertreten und die Aue zu betrachten. Im Sommer am besten früh am Morgen oder bei Sonnenuntergang."},{"h":"Die Landschaft","t":"Von der Einsiedelei aus überblickt man die Aue des Cinca: das mit Obstbäumen bedeckte Schwemmland, die Pappelhaine am Wasser und am anderen Ufer die Ländereien von Velilla und Fraga. Man kann sich leicht vorstellen, warum eine alte Siedlung diese Anhöhe wählte, mit guter Sicht und nahe am Fluss.\n\nKommen Sie am Ende des Tages, um zu sehen, wie sich das Licht über der Huerta verändert. Gehen Sie danach hinunter zur Anlegestelle des Projekts Entre Ríos, um den Fluss aus der Nähe zu sehen."}],"pt":[{"h":"História","t":"Há registo da ermida pelo menos desde o ano 1600. Foi erguida num alto nos arredores da povoação, possivelmente sobre um antigo povoado pré-romano, como acontece com outras ermidas da comarca que ocupam cerros habitados desde a Antiguidade.\n\nÉ dedicada a Santo Antão Abade, San Antón, protetor dos animais, uma devoção muito difundida nas povoações agrícolas, onde as cavalgaduras eram imprescindíveis para o trabalho do campo.\n\nAs ermidas dos arredores marcavam também os limites da povoação e os caminhos que saíam para o campo. Nelas pedia-se proteção para o gado e as colheitas, e à sua volta organizavam-se as romarias que ainda hoje reúnem os habitantes.\n\nA posição da ermida, num alto com boa vista sobre o rio, recorda a de outras da comarca, como San Juan de Ballobar ou San Salvador de Torrente."},{"h":"Tradições e festas","t":"A 17 de janeiro, dia de San Antón, Zaidín sobe em romaria até à ermida. É uma das primeiras festas do ano na comarca e um encontro de inverno que reúne habitantes e gente das redondezas.\n\nEm muitas povoações aragonesas, nesse dia benziam-se os animais e acendiam-se fogueiras, e em Zaidín a devoção deixou marca na toponímia: a avenida principal chama-se San Antonio Abad.\n\nSe visitar Zaidín noutra altura do ano, a ermida continua a ser um bom passeio curto para esticar as pernas e ver a ribeira. No verão, melhor logo de manhã ou ao entardecer."},{"h":"A paisagem","t":"Da ermida avista-se a ribeira do Cinca: a várzea coberta de árvores de fruto, os choupais junto à água e, na outra margem, as terras de Velilla e Fraga. É fácil imaginar porque um povoado antigo escolheu este alto, com boa vista e perto do rio.\n\nVenha ao fim do dia para ver como a luz muda sobre a horta. Depois, desça ao cais do projeto Entre Ríos para ver o rio de perto."}]},"status":"pending"},{"id":"san-valero-velilla","town":"Velilla de Cinca","cat":"arqueologia","lat":41.5861,"lon":0.25958,"coord_src":null,"q":["Ermita de San Valero, Velilla de Cinca","Mausoleo romano Velilla de Cinca"],"fq":["Ermita de San Valero Velilla de Cinca","Velilla de Cinca mausoleo romano","Velilla de Cinca San Valero"],"name":{"es":"Ermita de San Valero","en":"Ermita de San Valero (Hermitage of St Valerius)","fr":"Ermita de San Valero (ermitage)","de":"Ermita de San Valero","pt":"Ermida de San Valero"},"when":{"es":"Mausoleo romano y ermita medieval","en":"Roman mausoleum and medieval hermitage","fr":"Mausolée romain et ermitage médiéval","de":"Römisches Mausoleum und mittelalterliche Einsiedelei","pt":"Mausoléu romano e ermida medieval"},"desc":{"es":"Una pequeña ermita levantada sobre un mausoleo romano, junto a la carretera de Velilla a Fraga. Es un buen ejemplo de cómo un monumento funerario antiguo se reaprovechó como lugar de culto.","en":"A small hermitage built on a Roman mausoleum, beside the road from Velilla to Fraga. It is a good example of how an ancient funerary monument was reused as a place of worship.","fr":"Un petit ermitage élevé sur un mausolée romain, au bord de la route de Velilla à Fraga. C'est un bel exemple de la manière dont un monument funéraire antique a été réutilisé comme lieu de culte.","de":"Eine kleine Einsiedelei, errichtet auf einem römischen Mausoleum an der Straße von Velilla nach Fraga. Ein gutes Beispiel dafür, wie ein antikes Grabmonument als Kultstätte weitergenutzt wurde.","pt":"Uma pequena ermida erguida sobre um mausoléu romano, junto à estrada de Velilla para Fraga. É um bom exemplo de como um monumento funerário antigo foi reaproveitado como lugar de culto."},"visit":{"es":"Está junto a la carretera A-131, entre Velilla y Fraga, con fácil acceso y mesas y bancos. El exterior se ve libremente; parada de 15-20 minutos.","en":"It is beside the A-131 road, between Velilla and Fraga, with easy access and picnic tables and benches. The exterior can be seen freely; a 15-20-minute stop.","fr":"Il se trouve au bord de la route A-131, entre Velilla et Fraga, facile d'accès, avec tables et bancs. L'extérieur se voit librement ; arrêt de 15 à 20 minutes.","de":"Sie liegt an der Straße A-131 zwischen Velilla und Fraga, ist leicht zugänglich und hat Tische und Bänke. Von außen ist sie frei zu besichtigen; ein Halt von 15–20 Minuten.","pt":"Fica junto à estrada A-131, entre Velilla e Fraga, com acesso fácil e mesas e bancos. O exterior vê-se livremente; paragem de 15-20 minutos."},"src":"https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597349","sources":["https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597349","https://es.hispanopedia.com/wiki/Velilla_de_Cinca","https://vici.org/vici/15403"],"art":{"es":[{"h":"Historia","t":"En época romana la vega del Cinca estaba poblada de villas, como la Fortunatus, a pocos kilómetros. Junto al camino se levantó un mausoleo, el monumento funerario de alguna familia acomodada de la zona; el arqueólogo Félix Montón le dedicó un estudio en 1982.\n\nEn la Edad Media, probablemente en el siglo XIII, se construyó sobre él la ermita de San Valero, que aprovechó la obra antigua. Es un caso frecuente: un edificio sólido y respetado se reutiliza como lugar de culto y así llega hasta hoy.\n\nLos mausoleos romanos solían ser torres o edificios macizos, con una cámara para las urnas o los sarcófagos y una inscripción con el nombre del difunto. Su solidez los ha ayudado a sobrevivir cuando se les dio un nuevo uso."},{"h":"Qué ver","t":"Rodea la ermita y busca en sus muros la obra romana sobre la que se apoya: los sillares bien escuadrados de la parte baja contrastan con la fábrica más pobre de la ermita.\n\nLos romanos enterraban a sus muertos fuera de las poblaciones, junto a los caminos, para que los viajeros recordaran sus nombres. Que el mausoleo esté al borde de la carretera actual no es casualidad: el trazado
