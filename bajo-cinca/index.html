/* Layout: one-screen app. Map is the stage; a reading panel sits beside it (stacked under it on phones).
   Palette drawn from the Ribera: limestone ground, Ebro teal, mudéjar brick, steppe ochre. */
:root{
  --bg:#ECEFEA; --panel:#FAFBF8; --panel-2:#F2F4EF; --ink:#18221E; --muted:#56635D; --faint:#646F6A;
  --line:#D5DBD3; --accent:#17646C; --accent-ink:#FFFFFF; --accent-soft:#D6E8E8;
  --land:#E2E6DB; --land-hi:#D5DCCB; --land-out:#EEF0EA; --edge:#9AA79C; --outline:#17646C;
  --water:#3C8D96; --water-soft:#BFDCDD; --label:#2E3A35;
  --c-pat:#A4502C; --c-gue:#5A6A33; --c-mus:#7A4A7F; --c-hid:#2A6CA1; --c-nat:#3C8550; --c-arq:#97702F; --c-cam:#B98A0E;
  --ok:#2E7D4F; --shadow:0 1px 2px rgba(20,34,30,.08),0 6px 18px rgba(20,34,30,.08);
  --f-display:"Spectral",Georgia,"Times New Roman",serif;
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --panel:#141C19; --panel-2:#19231F; --ink:#E5ECE8; --muted:#9FADA7; --faint:#7E8C86;
  --line:#26332E; --accent:#5DB6BE; --accent-ink:#0B1513; --accent-soft:#183437;
  --land:#1A2420; --land-hi:#21302A; --land-out:#111815; --edge:#3A4A43; --outline:#5DB6BE;
  --water:#3E8F98; --water-soft:#1B3A3D; --label:#C9D4CF;
  --c-pat:#E08A63; --c-gue:#A9B872; --c-mus:#C08BC5; --c-hid:#6FA9DA; --c-nat:#7CC48D; --c-arq:#D6AE68; --c-cam:#E5BD45;
  --ok:#69C08E; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --panel:#141C19; --panel-2:#19231F; --ink:#E5ECE8; --muted:#9FADA7; --faint:#7E8C86;

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

#app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:1001}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.brand svg{flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:1.28rem;line-height:1.1;letter-spacing:.01em}
.brand-sub{font-size:.74rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel-2)}
.langs button{border:0;background:transparent;padding:5px 10px;font-size:.78rem;font-weight:600;letter-spacing:.05em;cursor:pointer;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.demo-tag{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);border-radius:4px;padding:2px 6px}

main{display:grid;grid-template-columns:minmax(330px,410px) 1fr;min-height:0}
#panel{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
#mapwrap{position:relative;min-height:0;min-width:0}
#map{position:absolute;inset:0;background:var(--bg)}
@media (max-width:760px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(260px,46%) 1fr}
  #mapwrap{order:-1}
  #panel{border-right:0;border-top:1px solid var(--line)}

.note{font-size:.78rem;color:var(--faint);line-height:1.45}

/* Map */
.leaflet-container{font-family:var(--f-ui);background:var(--bg)}
.muni{fill:var(--land);stroke:var(--edge);stroke-width:.8}
.muni.out{fill:var(--land-out);stroke:var(--edge);stroke-opacity:.45;stroke-width:.6}
.muni.hl{fill:var(--land-hi)}
.comarca-outline{fill:none;stroke:var(--outline);stroke-width:2.2;stroke-dasharray:1 0}
.river-halo{stroke:var(--water-soft);stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.river{stroke:var(--water);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tiles-on .muni{fill-opacity:.0;stroke-opacity:.6}
.tiles-on .muni.out{fill-opacity:0}
.tiles-on .river,.tiles-on .river-halo{stroke-opacity:0}
.tiles-on .town-label,.tiles-on .river-label{display:none}
.tiles-on .comarca-outline{stroke-width:2.6;stroke-opacity:.85}
.route-line{stroke:var(--c);stroke-width:3.5;stroke-dasharray:2 7;stroke-linecap:round;fill:none}
.town-label{font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--label);white-space:nowrap;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 6px var(--bg);pointer-events:none;letter-spacing:.02em;transform:translate(-50%,7px);display:inline-block}
.town-label.out{font-weight:500;font-size:11px;color:var(--faint);font-style:italic}
.river-label{font-family:var(--f-display);font-style:italic;font-size:14px;color:var(--water);letter-spacing:.35em;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg);white-space:nowrap;pointer-events:none;transform:translate(-50%,-50%) rotate(-12deg);display:inline-block}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 6px;transform:rotate(-45deg);background:var(--c);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.35);border:2px solid var(--panel);transition:transform .15s}
.pin svg{width:15px;height:15px;transform:rotate(45deg);color:#fff}
.pin.sel{transform:rotate(-45deg) scale(1.28);border-color:var(--ink)}
.pin.dim{opacity:.28}
.zlow .pin{width:13px;height:13px;border-radius:50%;transform:translate(-2.5px,23.5px);border-width:1.5px}
.zlow .pin svg{display:none}
.zlow .pin.sel{transform:translate(-2.5px,23.5px) scale(1.6)}
.zfar .town-label.minor{display:none}
.stopnum{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--panel);font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--panel);transform:translate(14px,-40px);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.zlow .stopnum{transform:translate(4px,-14px)}
.leaflet-control-zoom a,.mapbtn{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:var(--shadow)!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 85%,transparent)!important;color:var(--muted)!important;font-size:10px!important}
.leaflet-control-attribution a{color:var(--accent)!important}
.leaflet-top.leaflet-left{left:env(safe-area-inset-left,0px)}
.layerbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;display:flex;flex-direction:column;gap:2px}
.layerbox button{border:0;background:none;text-align:left;padding:6px 10px;border-radius:6px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--muted)}
.layerbox button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.legend{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px 10px;font-size:.74rem;display:flex;flex-direction:column;gap:3px;max-width:180px}
.legend div{display:flex;align-items:center;gap:7px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
@media (max-width:760px){.legend{display:none}.layerbox{flex-direction:row;padding:3px;margin-left:max(10px,env(safe-area-inset-left,0px))!important}.layerbox button{padding:5px 8px;font-size:.72rem}.leaflet-bottom.leaflet-left{bottom:16px}}

/* Móvil: la página entera hace scroll; el mapa queda arriba y se va al bajar, así se lee a pantalla completa */
@media (max-width:760px){
  html,body{height:auto}
  #app{height:auto;display:block}
  main{display:flex;flex-direction:column}
  #mapwrap{order:-1;height:40vh;height:40svh;min-height:230px;flex:none}
  #panel{min-height:calc(100vh - 56px);min-height:calc(100svh - 56px)}
  nav.tabs{position:sticky;top:0;z-index:1002;background:var(--panel)}
  .view{overflow:visible;flex:none;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  #tomap{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:1500;display:flex;align-items:center;gap:7px;
    border:0;border-radius:999px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.86rem;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;
    transition:opacity .2s,transform .2s}
  #tomap svg{width:17px;height:17px}
  #tomap[data-off]{opacity:0;transform:translateY(12px);pointer-events:none}
}
@media (min-width:761px){#tomap{display:none}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:8px;font-size:.86rem;z-index:5000;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- avisos, pasaporte, agenda, gestión ---- */
.btn.primary span,.btn.primary{color:var(--accent-ink)}
.aviso{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--panel-2);border-radius:10px;padding:10px 12px;font-size:.88rem}
.aviso b{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.aviso.warn{border-left-color:#B4441F}.aviso.warn b{color:#B4441F}
.aviso.prize{border-left-color:#B8860B}.aviso.prize b{color:#8A6508}
.stampbox,.passcta{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel-2)}
.passcta{width:100%;cursor:pointer;font:inherit;color:var(--ink);text-align:left}
.passcta:hover{border-color:var(--accent)}
.passcta .go{margin-left:auto;font-size:1.4rem;color:var(--muted)}
.seal{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--c,var(--accent));color:var(--c,var(--accent))}
.seal svg{width:22px;height:22px}
.stampbox.done .seal{border-style:solid;background:var(--c);color:#fff}
.passcta.ag .seal{border-style:solid;border-radius:12px}
.passhead{display:flex;align-items:center;gap:16px}
.ring{--p:0;flex:none;width:92px;height:92px;border-radius:50%;display:grid;place-content:center;text-align:center;
  background:radial-gradient(closest-side,var(--panel) 78%,transparent 79%),conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
.ring b{font-size:1.6rem;line-height:1}.ring span{font-size:.75rem;color:var(--muted)}
.prow{display:grid;grid-template-columns:1fr;gap:4px;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);cursor:pointer;font:inherit;color:var(--ink)}
.prow .t{font-weight:600;font-size:.92rem}
.pbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.pbar i{display:block;height:100%;background:var(--c)}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin:6px 0 10px}
.stamp{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;cursor:pointer;font:inherit;color:var(--muted);padding:4px}
.stamp .seal{width:58px;height:58px;border-color:var(--line)}
.stamp.on .seal{border:2px solid var(--c);background:var(--c);color:#fff}
.stamp.on{color:var(--ink)}
.stamp .nm{font-size:.74rem;line-height:1.25;text-align:center;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ev{display:flex;gap:12px;border-bottom:1px solid var(--line);padding:10px 0}
.ev p{margin:2px 0 0;font-size:.88rem}
.cal{flex:none;width:52px;border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:center;background:var(--panel)}
.cal span{display:block;background:var(--accent);color:var(--accent-ink);font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 0}
.cal b{display:block;font-size:1.2rem;padding:4px 0}
.cal{align-self:flex-start}.cal.m{border:2px solid var(--accent)}.cal.m b{font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);padding:9px 0}
.bars.wide .bar{grid-template-columns:minmax(0,1.4fr) 1fr auto}.bars.wide .bar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.neg{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:8px 0}
.adm-nav{display:flex;flex-wrap:wrap;gap:6px}
.adm-nav a{font-size:.8rem;border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--ink);text-decoration:none;background:var(--panel-2)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.two-col{grid-template-columns:1fr}}
.foot-links{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;padding-bottom:8px}
.foot-links a{color:var(--muted)}
details summary{cursor:pointer;padding:4px 0}
.skip{position:absolute;left:-9999px;top:8px;z-index:9999;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;font-weight:700}
.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

</style>

<div id="cover" hidden></div>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<div id="app"><a class="skip" href="#panel" data-i="skipLink"></a>
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="var(--accent)"/><path d="M4 22c5-1 6-7 11-7s5 9 10 9 4-6 5-7" stroke="var(--accent-ink)" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="23" cy="10" r="2.6" fill="var(--accent-ink)"/></svg>
      <div style="min-width:0">
        <div class="brand-name">Bajo Cinca Explora</div>
        <div class="brand-sub" data-i="appSub"></div>
      </div>
    </div>
    <span class="demo-tag" data-i="demo"></span>
    <div class="langs" role="group" aria-label="Idioma / Language" id="langs"></div>
  </header>
  <main>
    <aside id="panel">
      <nav class="tabs" role="tablist" id="tabs">
        <button role="tab" data-tab="inicio" data-i="tabHome"></button>
        <button role="tab" data-tab="explorar" data-i="tabExplore"></button>
        <button role="tab" data-tab="rutas" data-i="tabRoutes"></button>
        <button role="tab" data-tab="agenda" data-i="tabAgenda"></button>
        <button role="tab" data-tab="pasaporte" data-i="tabPass"></button>
      </nav>
      <section class="view stack" id="v-inicio"></section>
      <section class="view stack" id="v-explorar" hidden></section>
      <section class="view stack" id="v-lugar" hidden></section>
      <section class="view stack" id="v-rutas" hidden></section>
      <section class="view stack" id="v-agenda" hidden></section>
      <section class="view stack" id="v-pasaporte" hidden></section>
      <section class="view stack" id="v-gestion" hidden></section>
    </aside>
    <div id="mapwrap"><div id="map" role="application" aria-label="Mapa"></div></div>
    <button type="button" id="tomap" data-off><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 4-6 3v13l6-3 6 3 6-3V4l-6 3-6-3z"/><path d="M9 4v13M15 7v13"/></svg><span data-i="tabMap"></span></button>
  </main>
</div>

bar-g3"],"iglesia-belver":["iglesia-belver-g1"],"torre-frailes":["torre-frailes-g1"]},"must":["castillo-mequinenza","pueblo-viejo-mequinenza","museo-mina-mequinenza","villa-fortunatus","san-pedro-fraga","santa-maria-chalamera","aiguabarreig","torre-frailes"],"coverPhoto":"castillo-mequinenza","homeHero":"pueblo-viejo-mequinenza","categories":{"patrimonio":{"color":"--c-pat","icon":"<path d=\"M4 21V10l8-6 8 6v11\"/><path d=\"M9.5 21v-5.5a2.5 2.5 0 0 1 5 0V21\"/>"},"memoria":{"color":"--c-gue","icon":"<path d=\"M6 21V4\"/><path d=\"M6 4h11l-2.5 4L17 12H6\"/>"},"museo":{"color":"--c-mus","icon":"<path d=\"M3 9.5 12 4l9 5.5\"/><path d=\"M5.5 11v7M10 11v7M14 11v7M18.5 11v7\"/><path d=\"M3 20.5h18\"/>"},"arqueologia":{"color":"--c-arq","icon":"<path d=\"M9 3h6\"/><path d=\"M10 3v3.2C7.2 8 6.3 11 7 14.5L9 20h6l2-5.5c.7-3.5-.2-6.5-3-8.3V3\"/>"},"hidraulico":{"color":"--c-hid","icon":"<circle cx=\"12\" cy=\"12\" r=\"7.5\"/><circle cx=\"12\" cy=\"12\" r=\"1.8\"/><path d=\"M12 4.5v15M4.5 12h15M6.7 6.7l10.6 10.6M17.3 6.7 6.7 17.3\"/>"},"naturaleza":{"color":"--c-nat","icon":"<path d=\"M2.5 11c2.8-2.6 5.6-2.6 8 .3 2.4-2.9 5.2-2.9 8-.3\"/><path d=\"M8 17c1.6-1.5 3.2-1.5 4.6.2 1.4-1.7 3-1.7 4.6-.2\"/>"},"camino":{"color":"--c-cam","icon":"<path d=\"M12 20.5 3.5 9.2a9.5 9.5 0 0 1 17 0z\"/><path d=\"M12 20.5 8 6.5M12 20.5V5M12 20.5l4-14\"/>"}},"pois":[{"id":"villa-fortunatus","town":"Fraga","cat":"arqueologia","lat":41.55624,"lon":0.31854,"coord_src":"https://es.wikipedia.org/wiki/Villa_Fortunatus","q":["Villa Fortunatus, Fraga","Villa romana Fortunatus"],"fq":["Villa Fortunatus Fraga","Villa Fortunatus mosaico","Fortunatus Fraga basílica"],"name":{"es":"Villa Fortunatus","en":"Villa Fortunatus","fr":"Villa Fortunatus","de":"Villa Fortunatus","pt":"Villa Fortunatus"},"when":{"es":"Siglos I-V · Villa romana y basílica","en":"1st-5th centuries · Roman villa and basilica","fr":"Ier-Ve siècles · Villa romaine et basilique","de":"1.-5. Jahrhundert · Römische Villa und Basilika","pt":"Séculos I-V · Villa romana e basílica"},"desc":{"es":"Una gran casa de campo romana a orillas del Cinca, a unos 5 km de Fraga. Sus mosaicos del siglo IV y el que lleva el nombre de su dueño, Fortunatus, junto a un crismón, la convierten en el yacimiento de referencia de la comarca.","en":"A large Roman country house on the banks of the Cinca, about 5 km from Fraga. Its 4th-century mosaics, and the one bearing its owner's name, Fortunatus, beside a Chi-Rho, make it the comarca's key archaeological site.","fr":"Une grande maison de campagne romaine au bord du Cinca, à environ 5 km de Fraga. Ses mosaïques du IVe siècle, et celle qui porte le nom de son propriétaire, Fortunatus, à côté d'un chrisme, en font le site archéologique de référence de la comarque.","de":"Ein großes römisches Landgut am Ufer des Cinca, etwa 5 km von Fraga entfernt. Die Mosaiken aus dem 4. Jahrhundert und jenes mit dem Namen des Besitzers, Fortunatus, neben einem Christusmonogramm machen sie zur wichtigsten archäologischen Stätte der Comarca.","pt":"Uma grande casa de campo romana nas margens do Cinca, a cerca de 5 km de Fraga. Os mosaicos do século IV, e o que tem o nome do dono, Fortunatus, junto a um crismón, fazem dela o sítio arqueológico de referência da comarca."},"visit":{"es":"Está junto a la carretera A-1234, de Fraga hacia Zaidín, protegida por una gran cubierta. Se recorre por fuera en unos 30-45 minutos. Las condiciones de acceso y las visitas guiadas han cambiado con los años: confírmalas en la oficina de turismo de la Comarca, en Fraga.","en":"It lies beside the A-1234 road from Fraga towards Zaidín, protected by a large roof. You can walk round it in about 30-45 minutes. Access arrangements and guided tours have changed over the years, so check them at the Comarca tourist office in Fraga.","fr":"Elle se trouve au bord de la route A-1234, de Fraga vers Zaidín, protégée par une grande couverture. On en fait le tour en 30 à 45 minutes environ. Les conditions d'accès et les visites guidées ont changé au fil des ans : renseignez-vous à l'office de tourisme de la Comarque, à Fraga.","de":"Sie liegt an der Straße A-1234 von Fraga in Richtung Zaidín, geschützt von einem großen Schutzdach. Ein Rundgang von außen dauert etwa 30-45 Minuten. Zugangsregelung und Führungen haben sich im Laufe der Jahre geändert: Bitte im Tourismusbüro der Comarca in Fraga nachfragen.","pt":"Fica junto à estrada A-1234, de Fraga em direção a Zaidín, protegida por uma grande cobertura. Percorre-se por fora em cerca de 30-45 minutos. As condições de acesso e as visitas guiadas mudaram ao longo dos anos: confirme-as no posto de turismo da Comarca, em Fraga."},"src":"https://www.enciclopedia.cat/del-roma-al-romanic/villa-fortunatus-fraga","sources":["https://es.wikipedia.org/wiki/Villa_Fortunatus","https://www.enciclopedia.cat/del-roma-al-romanic/villa-fortunatus-fraga","https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5489201","https://uez.unizar.es/sites/uez/files/users/pjulian/Prensa/Colaboradores/170409_un_abandono_incalificable_-_felix_monton.pdf"],"art":{"es":[{"h":"Historia","t":"La villa se levantó en una terraza del río Cinca, entre dos barrancos, en la partida de Santa Quiteria. Las excavaciones indican que el lugar estuvo ocupado desde los primeros siglos de nuestra era y que su etapa más rica llegó en el Bajo Imperio, cuando la casa se amplió y sus salas se cubrieron de mosaicos, la mayoría del siglo IV.\n\nA finales del siglo IV o comienzos del V se pavimentó una sala con un mosaico que lleva el nombre FORTUNATUS partido por un crismón, el anagrama de Cristo. Por eso se piensa que el propietario era cristiano o simpatizaba con la nueva fe. Más tarde, ya en la Antigüedad tardía, parte de la casa se transformó en una basílica paleocristiana con baptisterio. Las campañas de 1968-1970 y de 1981-1986 sacaron a la luz la basílica y las termas."},{"h":"Qué ver","t":"Bajo la cubierta se distinguen los muros de las habitaciones alrededor del antiguo peristilo, la planta de la basílica con su ábside y la pila bautismal. La mayor parte de los mosaicos se conservan en el Museo de Zaragoza; algunos siguen en su sitio, enterrados para protegerlos.\n\nFíjate en la posición: la villa domina la vega del Cinca, la tierra que la hacía rica. Fue declarada Bien de Interés Cultural, en la categoría de zona arqueológica, en 2004."}],"en":[{"h":"History","t":"The villa was built on a terrace of the river Cinca, between two ravines, in the area known as Santa Quiteria. Excavations show that the site was occupied from the first centuries AD and that it reached its most prosperous stage in the Late Empire, when the house was enlarged and its rooms were covered with mosaics, most of them from the 4th century.\n\nAt the end of the 4th century or the beginning of the 5th, a room was paved with a mosaic bearing the name FORTUNATUS, split by a Chi-Rho, the monogram of Christ. This is why the owner is thought to have been a Christian or sympathetic to the new faith. Later, in Late Antiquity, part of the house was turned into an early Christian basilica with a baptistery. The excavation campaigns of 1968-1970 and 1981-1986 uncovered the basilica and the baths."},{"h":"What to see","t":"Under the roof you can make out the walls of the rooms around the old peristyle, the plan of the basilica with its apse, and the baptismal font. Most of the mosaics are kept in the Museo de Zaragoza; a few remain in place, buried to protect them.\n\nNotice the setting: the villa overlooks the Cinca floodplain, the land that made it rich. It was declared a Bien de Interés Cultural, as an archaeological zone, in 2004."}],"fr":[{"h":"Histoire","t":"La villa fut bâtie sur une terrasse du Cinca, entre deux ravins, au lieu-dit Santa Quiteria. Les fouilles montrent que le site fut occupé dès les premiers siècles de notre ère et qu'il connut sa période la plus riche au Bas-Empire, lorsque la maison fut agrandie et ses salles couvertes de mosaïques, pour la plupart du IVe siècle.\n\nÀ la fin du IVe siècle ou au début du Ve, une salle fut pavée d'une mosaïque portant le nom FORTUNATUS, coupé par un chrisme, le monogramme du Christ. On pense donc que le propriétaire était chrétien ou proche de la nouvelle foi. Plus tard, dans l'Antiquité tardive, une partie de la maison devint une basilique paléochrétienne avec baptistère. Les campagnes de 1968-1970 et de 1981-1986 ont mis au jour la basilique et les thermes."},{"h":"À voir","t":"Sous la couverture, on distingue les murs des pièces autour de l'ancien péristyle, le plan de la basilique avec son abside et la cuve baptismale. La plupart des mosaïques sont conservées au Museo de Zaragoza ; quelques-unes restent en place, enterrées pour les protéger.\n\nObservez l'emplacement : la villa domine la plaine du Cinca, la terre qui faisait sa richesse. Elle a été déclarée Bien de Interés Cultural, en tant que zone archéologique, en 2004."}],"de":[{"h":"Geschichte","t":"Die Villa entstand auf einer Flussterrasse des Cinca, zwischen zwei Schluchten, in der Flur Santa Quiteria. Die Ausgrabungen zeigen, dass der Ort seit den ersten Jahrhunderten n. Chr. bewohnt war und seine reichste Phase in der Spätantike erlebte, als das Haus erweitert und seine Räume mit Mosaiken ausgelegt wurden, die meisten aus dem 4. Jahrhundert.\n\nEnde des 4. oder Anfang des 5. Jahrhunderts erhielt ein Raum ein Mosaik mit dem Namen FORTUNATUS, geteilt durch ein Christusmonogramm. Deshalb nimmt man an, dass der Besitzer Christ war oder dem neuen Glauben nahestand. Später wurde ein Teil des Hauses in eine frühchristliche Basilika mit Taufkapelle umgewandelt. Die Grabungen von 1968-1970 und 1981-1986 legten die Basilika und die Thermen frei."},{"h":"Sehenswert","t":"Unter dem Schutzdach erkennt man die Mauern der Räume um das einstige Peristyl, den Grundriss der Basilika mit ihrer Apsis und das Taufbecken. Die meisten Mosaiken befinden sich im Museo de Zaragoza; einige liegen noch an Ort und Stelle, zum Schutz mit Erde bedeckt.\n\nAchten Sie auf die Lage: Die Villa überblickt die Aue des Cinca, das Land, das sie reich machte. 2004 wurde sie als archäologische Zone zum Bien de Interés Cultural erklärt."}],"pt":[{"h":"História","t":"A villa foi construída num terraço do rio Cinca, entre duas ravinas, no lugar de Santa Quiteria. As escavações indicam que o sítio foi ocupado desde os primeiros séculos da nossa era e que viveu a fase mais rica no Baixo Império, quando a casa foi ampliada e as salas se cobriram de mosaicos, na maioria do século IV.\n\nNo final do século IV ou início do V, uma sala foi pavimentada com um mosaico com o nome FORTUNATUS, dividido por um crismón, o monograma de Cristo. Por isso se pensa que o proprietário era cristão ou simpatizante da nova fé. Mais tarde, na Antiguidade Tardia, parte da casa foi transformada numa basílica paleocristã com batistério. As campanhas de 1968-1970 e de 1981-1986 puseram a descoberto a basílica e as termas."},{"h":"O que ver","t":"Sob a cobertura distinguem-se os muros das divisões em torno do antigo peristilo, a planta da basílica com a abside e a pia batismal. A maior parte dos mosaicos está no Museo de Zaragoza; alguns continuam no lugar, enterrados para os proteger.\n\nRepare na posição: a villa domina a várzea do Cinca, a terra que a tornava rica. Foi declarada Bien de Interés Cultural, como zona arqueológica, em 2004."}]},"status":"pending"},{"id":"san-pedro-fraga","town":"Fraga","cat":"patrimonio","lat":41.52224,"lon":0.34857,"coord_src":"https://es.wikipedia.org/wiki/Iglesia_de_San_Pedro_(Fraga)","q":["Iglesia de San Pedro, Fraga","Plaza de San Pedro, Fraga"],"fq":["Iglesia de San Pedro Fraga","Fraga San Pedro torre","Fraga casco antiguo iglesia"],"name":{"es":"Iglesia de San Pedro","en":"Church of San Pedro","fr":"Église San Pedro","de":"Kirche San Pedro","pt":"Igreja de San Pedro"},"when":{"es":"Siglos XII-XIII · Románico y gótico","en":"12th-13th centuries · Romanesque and Gothic","fr":"XIIe-XIIIe siècles · Roman et gothique","de":"12.-13. Jahrhundert · Romanik und Gotik","pt":"Séculos XII-XIII · Românico e gótico"},"desc":{"es":"La iglesia mayor de Fraga, en lo alto del casco antiguo. Se levantó donde estuvo la mezquita mayor y su torre de seis cuerpos es la silueta que identifica la ciudad desde el río.","en":"Fraga's main church, at the top of the old town. It was built where the great mosque once stood, and its six-stage tower is the silhouette that identifies the town from the river.","fr":"L'église principale de Fraga, en haut de la vieille ville. Elle fut construite à l'emplacement de la grande mosquée, et son clocher à six niveaux est la silhouette qui identifie la ville depuis la rivière.","de":"Die Hauptkirche von Fraga, hoch oben in der Altstadt. Sie entstand an der Stelle der einstigen Hauptmoschee, und ihr sechsgeschossiger Turm ist die Silhouette, an der man die Stadt vom Fluss aus erkennt.","pt":"A igreja principal de Fraga, no alto do centro histórico. Foi construída onde ficava a mesquita maior e a sua torre de seis corpos é a silhueta que identifica a cidade a partir do rio."},"visit":{"es":"Se llega a pie desde el paseo junto al Cinca subiendo por la calle Mayor hasta la plaza de San Pedro. Por fuera se ve en cualquier momento; el interior se puede visitar en horario de culto o con visita concertada. Confirma horarios en la oficina de turismo.","en":"Walk up from the riverside promenade along Calle Mayor to Plaza de San Pedro. The outside can be seen at any time; the interior can be visited during services or on an arranged visit. Check times at the tourist office.","fr":"On y monte à pied depuis la promenade du Cinca par la Calle Mayor jusqu'à la Plaza de San Pedro. L'extérieur se voit à tout moment ; l'intérieur se visite pendant les offices ou sur rendez-vous. Vérifiez les horaires à l'office de tourisme.","de":"Zu Fuß von der Uferpromenade am Cinca über die Calle Mayor hinauf zur Plaza de San Pedro. Von außen jederzeit zu sehen; das Innere ist zu den Gottesdienstzeiten oder nach Vereinbarung zugänglich. Zeiten bitte im Tourismusbüro erfragen.","pt":"Chega-se a pé a partir do passeio junto ao Cinca, subindo pela Calle Mayor até à Plaza de San Pedro. O exterior vê-se a qualquer hora; o interior pode ser visitado durante o culto ou com visita marcada. Confirme os horários no posto de turismo."},"src":"https://www.urbipedia.org/hoja/Iglesia_de_San_Pedro_(Fraga)","sources":["https://www.urbipedia.org/hoja/Iglesia_de_San_Pedro_(Fraga)","https://es.wikipedia.org/wiki/Fraga_(Huesca)","https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5489201"],"art":{"es":[{"h":"Historia","t":"Según la tradición, el templo tiene origen visigodo y en época andalusí fue la mezquita mayor de Fraga. Tras la conquista cristiana, en el siglo XII, pasó a ser iglesia, y el edificio actual se construyó entre finales del siglo XII y principios del XIII.\n\nCon los siglos sumó capas: la bóveda de crucería estrellada es tardogótica, el coro del siglo XVI hizo desaparecer el claustro medieval y a finales del XVIII se añadieron la galería y el alero de la fachada."},{"h":"Qué ver","t":"Busca la portada sur, en el brazo del crucero. Sus capiteles románicos, de hacia el primer tercio del siglo XIII, muestran escenas como San Miguel frente a un monstruo o las tentaciones de Cristo.\n\nDentro, la nave única mide unos 41,5 metros de largo por 10 de ancho. La torre tiene seis cuerpos y remata en un chapitel octogonal: los cuerpos bajos tienen arcos de medio punto, de tradición románica, y los altos ventanales góticos apuntados. Al salir, baja por la calle Mayor, el antiguo centro de la vida fragatina, con sus calles estrechas, aleros y escudos."}],"en":[{"h":"History","t":"According to tradition, the church has Visigothic origins and in the Andalusi period it was Fraga's great mosque. After the Christian conquest in the 12th century it became a church, and the present building was put up between the late 12th and early 13th centuries.\n\nOver the centuries it gained new layers: the star-ribbed vault is late Gothic, the 16th-century choir did away with the medieval cloister, and the gallery and the eaves of the façade were added at the end of the 18th century."},{"h":"What to see","t":"Look for the south doorway, in the arm of the transept. Its Romanesque capitals, from around the first third of the 13th century, show scenes such as Saint Michael facing a monster and the temptations of Christ.\n\nInside, the single nave is about 41.5 metres long and 10 wide. The tower has six stages and ends in an octagonal spire: the lower stages have round arches in the Romanesque tradition and the upper ones pointed Gothic windows. Afterwards, walk down Calle Mayor, once the heart of Fraga's life, with its narrow streets, eaves and coats of arms."}],"fr":[{"h":"Histoire","t":"Selon la tradition, l'église a une origine wisigothique et, à l'époque andalouse, elle fut la grande mosquée de Fraga. Après la conquête chrétienne, au XIIe siècle, elle devint église, et l'édifice actuel fut construit entre la fin du XIIe et le début du XIIIe siècle.\n\nAu fil des siècles, elle s'est enrichie de nouvelles couches : la voûte à liernes et tiercerons est de la fin du gothique, le chœur du XVIe siècle a fait disparaître le cloître médiéval, et la galerie et l'avant-toit de la façade furent ajoutés à la fin du XVIIIe siècle."},{"h":"À voir","t":"Cherchez le portail sud, dans le bras du transept. Ses chapiteaux romans, du premier tiers du XIIIe siècle environ, montrent des scènes comme saint Michel face à un monstre ou les tentations du Christ.\n\nÀ l'intérieur, la nef unique mesure environ 41,5 mètres de long sur 10 de large. Le clocher compte six niveaux et se termine par une flèche octogonale : les niveaux inférieurs ont des arcs en plein cintre, de tradition romane, et les niveaux supérieurs des baies gothiques en arc brisé. En sortant, descendez la Calle Mayor, ancien cœur de la vie de Fraga, avec ses rues étroites, ses avant-toits et ses blasons."}],"de":[{"h":"Geschichte","t":"Der Überlieferung nach geht die Kirche auf westgotische Zeit zurück und war in der andalusischen Epoche die Hauptmoschee Fragas. Nach der christlichen Eroberung im 12. Jahrhundert wurde sie zur Kirche, und der heutige Bau entstand zwischen dem späten 12. und dem frühen 13. Jahrhundert.\n\nIm Lauf der Jahrhunderte kamen neue Schichten hinzu: Das Sterngewölbe ist spätgotisch, der Chor aus dem 16. Jahrhundert verdrängte den mittelalterlichen Kreuzgang, und Ende des 18. Jahrhunderts wurden die Galerie und das Traufgesims der Fassade ergänzt."},{"h":"Sehenswert","t":"Suchen Sie das Südportal im Querhausarm. Seine romanischen Kapitelle aus dem ersten Drittel des 13. Jahrhunderts zeigen Szenen wie den heiligen Michael im Kampf mit einem Ungeheuer oder die Versuchung Christi.\n\nInnen misst das einschiffige Langhaus etwa 41,5 Meter Länge und 10 Meter Breite. Der Turm hat sechs Geschosse und endet in einem achteckigen Helm: Die unteren Geschosse haben Rundbögen romanischer Tradition, die oberen gotische Spitzbogenfenster. Gehen Sie danach die Calle Mayor hinunter, einst das Zentrum des Lebens in Fraga, mit engen Gassen, Dachvorsprüngen und Wappen."}],"pt":[{"h":"História","t":"Segundo a tradição, o templo tem origem visigótica e, na época andaluza, foi a mesquita maior de Fraga. Depois da conquista cristã, no século XII, passou a ser igreja, e o edifício atual foi construído entre o final do século XII e o início do XIII.\n\nCom os séculos foi somando camadas: a abóbada de nervuras estrelada é do gótico tardio, o coro do século XVI fez desaparecer o claustro medieval e, no final do século XVIII, acrescentaram-se a galeria e o beiral da fachada."},{"h":"O que ver","t":"Procure o portal sul, no braço do transepto. Os capitéis românicos, de cerca do primeiro terço do século XIII, mostram cenas como São Miguel diante de um monstro ou as tentações de Cristo.\n\nNo interior, a nave única mede cerca de 41,5 metros de comprimento por 10 de largura. A torre tem seis corpos e termina num coruchéu octogonal: os corpos de baixo têm arcos de volta perfeita, de tradição românica, e os de cima janelas góticas em ogiva. À saída, desça pela Calle Mayor, antigo centro da vida de Fraga, com ruas estreitas, beirais e brasões."}]},"status":"pending"},{"id":"castillo-fraga","town":"Fraga","cat":"patrimonio","lat":41.52279,"lon":0.35135,"coord_src":null,"q":["Castillo de Fraga","Castillo, Fraga, Huesca"],"fq":["Castillo de Fraga","Fraga castillo vista","Fraga Huesca panorámica"],"name":{"es":"Castillo de Fraga","en":"Fraga Castle","fr":"Château de Fraga","de":"Burg von Fraga","pt":"Castelo de Fraga"},"when":{"es":"Edad Media · Mirador sobre el Cinca","en":"Middle Ages · Viewpoint over the Cinca","fr":"Moyen Âge · Belvédère sur le Cinca","de":"Mittelalter · Aussichtspunkt über dem Cinca","pt":"Idade Média · Miradouro sobre o Cinca"},"desc":{"es":"En lo alto del casco antiguo, lo que hoy se llama castillo son las ruinas de la antigua iglesia de San Miguel, rehabilitadas como espacio para exposiciones y actos. Desde aquí se entiende Fraga: la ciudad vieja colgada sobre el Cinca y la vega a sus pies.","en":"At the top of the old town, what is now called the castle is in fact the ruins of the old church of San Miguel, restored as a space for exhibitions and events. From here Fraga makes sense: the old town clinging above the Cinca and the farmland below.","fr":"En haut de la vieille ville, ce que l'on appelle aujourd'hui le château correspond aux ruines de l'ancienne église San Miguel, réhabilitées en espace d'expositions et d'événements. D'ici, on comprend Fraga : la vieille ville accrochée au-dessus du Cinca et la plaine à ses pieds.","de":"Hoch über der Altstadt: Was heute Burg genannt wird, sind die Ruinen der alten Kirche San Miguel, restauriert als Raum für Ausstellungen und Veranstaltungen. Von hier aus versteht man Fraga: die Altstadt hoch über dem Cinca und die Aue zu ihren Füßen.","pt":"No alto do centro histórico, aquilo a que hoje se chama castelo são as ruínas da antiga igreja de San Miguel, reabilitadas como espaço para exposições e eventos. Daqui percebe-se Fraga: a cidade velha suspensa sobre o Cinca e a várzea a seus pés."},"visit":{"es":"Se sube a pie por las calles del casco antiguo desde la plaza de San Pedro. El exterior y las vistas son libres; el interior abre con exposiciones y actos. Confirma la programación en la oficina de turismo.","en":"Walk up through the streets of the old town from Plaza de San Pedro. The outside and the views are freely accessible; the interior opens for exhibitions and events. Check what's on at the tourist office.","fr":"On y monte à pied par les rues de la vieille ville depuis la Plaza de San Pedro. L'extérieur et la vue sont en accès libre ; l'intérieur ouvre lors d'expositions et d'événements. Consultez la programmation à l'office de tourisme.","de":"Zu Fuß durch die Gassen der Altstadt von der Plaza de San Pedro aus. Außenbereich und Aussicht sind frei zugänglich; das Innere öffnet bei Ausstellungen und Veranstaltungen. Programm im Tourismusbüro erfragen.","pt":"Sobe-se a pé pelas ruas do centro histórico a partir da Plaza de San Pedro. O exterior e as vistas são de acesso livre; o interior abre com exposições e eventos. Confirme a programação no posto de turismo."},"src":"https://es.wikipedia.org/wiki/Fraga_(Huesca)","sources":["https://es.wikipedia.org/wiki/Fraga_(Huesca)","https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5489201","https://es.wikipedia.org/wiki/Bajo_Cinca"],"art":{"es":[{"h":"Historia","t":"Fraga fue una plaza fuerte andalusí en la frontera del Cinca. En sus alrededores murió en 1134 el rey Alfonso I el Batallador, a causa de las heridas recibidas en la batalla de Fraga, y la ciudad no pasó a manos cristianas hasta 1149.\n\nEl conjunto que hoy conocemos como castillo corresponde a la antigua iglesia de San Miguel, que llegó en ruinas al siglo XX. Se rehabilitó como espacio expositivo y se inauguró en 2007 con una muestra dedicada al pintor Miguel Viladrich. Está protegido como Bien de Interés Cultural."},{"h":"Qué ver","t":"Lo primero son las vistas: el meandro del Cinca, los puentes que unen la ciudad vieja con la nueva, el parque de la Estacada en la otra orilla y, al fondo, la huerta.\n\nAl bajar, merece la pena pasar por el Palacio Montcada, antigua residencia de los señores de Fraga, que fue palacio del Gobernador, ayuntamiento y cárcel. Hoy es biblioteca y museo y guarda la pintura Boda fragatina, de Viladrich."},{"h":"Curiosidades","t":"El Cinca parte Fraga en dos: el casco antiguo en la orilla del castillo y la parte nueva en la otra, unidas por dos puentes. En mayo de 1810 las tropas españolas volaron el puente, y el puente colgante construido entre 1845 y 1847 se hundió en parte en 1852, con doce muertos."}],"en":[{"h":"History","t":"Fraga was an Andalusi stronghold on the Cinca frontier. King Alfonso I the Battler died near here in 1134 from wounds received at the battle of Fraga, and the town did not pass into Christian hands until 1149.\n\nThe complex now known as the castle corresponds to the old church of San Miguel, which reached the 20th century in ruins. It was restored as an exhibition space and opened in 2007 with a show devoted to the painter Miguel Viladrich. It is protected as a Bien de Interés Cultural."},{"h":"What to see","t":"First of all, the views: the bend of the Cinca, the bridges joining the old town and the new, the Estacada park on the far bank and, in the distance, the farmland.\n\nOn the way down, it is worth stopping at the Palacio Montcada, the former residence of the lords of Fraga, which has been the Governor's palace, town hall and prison. Today it is a library and museum and holds the painting Boda fragatina (A Fraga Wedding) by Viladrich."},{"h":"Did you know?","t":"The Cinca splits Fraga in two: the old town on the castle bank and the newer part on the other, linked by two bridges. In May 1810 Spanish troops blew up the bridge, and the suspension bridge built between 1845 and 1847 partly collapsed in 1852, killing twelve people."}],"fr":[{"h":"Histoire","t":"Fraga fut une place forte andalouse sur la frontière du Cinca. Le roi Alphonse Ier le Batailleur mourut près d'ici en 1134 des blessures reçues à la bataille de Fraga, et la ville ne passa aux mains chrétiennes qu'en 1149.\n\nL'ensemble aujourd'hui appelé château correspond à l'ancienne église San Miguel, arrivée en ruine au XXe siècle. Elle a été réhabilitée en espace d'exposition et inaugurée en 2007 avec une exposition consacrée au peintre Miguel Viladrich. Elle est protégée comme Bien de Interés Cultural."},{"h":"À voir","t":"D'abord la vue : le méandre du Cinca, les ponts qui relient la vieille ville et la ville nouvelle, le parc de la Estacada sur l'autre rive et, au loin, les vergers.\n\nEn redescendant, arrêtez-vous au Palacio Montcada, ancienne résidence des seigneurs de Fraga, qui fut palais du Gouverneur, mairie et prison. C'est aujourd'hui une bibliothèque et un musée qui conserve le tableau Boda fragatina (Noce à Fraga) de Viladrich."},{"h":"Le saviez-vous ?","t":"Le Cinca coupe Fraga en deux : la vieille ville sur la rive du château et la partie récente sur l'autre, reliées par deux ponts. En mai 1810, les troupes espagnoles firent sauter le pont, et le pont suspendu construit entre 1845 et 1847 s'effondra en partie en 1852, faisant douze morts."}],"de":[{"h":"Geschichte","t":"Fraga war eine andalusische Festung an der Cinca-Grenze. In der Nähe starb 1134 König Alfons I. der Kämpfer an den Wunden, die er in der Schlacht von Fraga erlitten hatte, und erst 1149 kam die Stadt in christliche Hand.\n\nDie heute als Burg bekannte Anlage ist die alte Kirche San Miguel, die das 20. Jahrhundert als Ruine erreichte. Sie wurde zu einem Ausstellungsraum umgebaut und 2007 mit einer Schau über den Maler Miguel Viladrich eröffnet. Sie steht als Bien de Interés Cultural unter Schutz."},{"h":"Sehenswert","t":"Zuerst die Aussicht: die Flussschleife des Cinca, die Brücken zwischen Alt- und Neustadt, der Park La Estacada am anderen Ufer und in der Ferne die Obstgärten.\n\nAuf dem Rückweg lohnt der Palacio Montcada, einst Residenz der Herren von Fraga, später Gouverneurspalast, Rathaus und Gefängnis. Heute beherbergt er Bibliothek und Museum mit dem Gemälde Boda fragatina (Hochzeit in Fraga) von Viladrich."},{"h":"Wussten Sie schon?","t":"Der Cinca teilt Fraga in zwei Hälften: die Altstadt am Burgufer und die neueren Viertel am anderen, verbunden durch zwei Brücken. Im Mai 1810 sprengten spanische Truppen die Brücke, und die zwischen 1845 und 1847 gebaute Hängebrücke stürzte 1852 teilweise ein, wobei zwölf Menschen starben."}],"pt":[{"h":"História","t":"Fraga foi uma praça-forte andaluza na fronteira do Cinca. Perto daqui morreu em 1134 o rei Afonso I, o Batalhador, devido aos ferimentos sofridos na batalha de Fraga, e a cidade só passou para mãos cristãs em 1149.\n\nO conjunto que hoje se conhece como castelo corresponde à antiga igreja de San Miguel, que chegou em ruínas ao século XX. Foi reabilitada como espaço expositivo e inaugurada em 2007 com uma exposição dedicada ao pintor Miguel Viladrich. Está protegida como Bien de Interés Cultural."},{"h":"O que ver","t":"Primeiro, as vistas: o meandro do Cinca, as pontes que unem a cidade velha à nova, o parque de La Estacada na outra margem e, ao fundo, os pomares.\n\nNa descida, vale a pena passar pelo Palacio Montcada, antiga residência dos senhores de Fraga, que foi palácio do Governador, câmara municipal e prisão. Hoje é biblioteca e museu e guarda a pintura Boda fragatina (Casamento em Fraga), de Viladrich."},{"h":"Curiosidades","t":"O Cinca divide Fraga em duas: o centro histórico na margem do castelo e a parte nova na outra, unidas por duas pontes. Em maio de 1810 as tropas espanholas fizeram explodir a ponte, e a ponte suspensa construída entre 1845 e 1847 ruiu em parte em 1852, causando doze mortos."}]},"status":"pending"},{"id":"torre-frailes","town":"Fraga","cat":"patrimonio","lat":41.49475,"lon":0.33242,"coord_src":null,"q":["Torre de los Frailes, Fraga","Torre dels Frares, Fraga"],"fq":["Torre de los Frailes Fraga","Torre dels Frares Fraga"],"name":{"es":"Torre de los Frailes","en":"Torre de los Frailes","fr":"Torre de los Frailes","de":"Torre de los Frailes","pt":"Torre de los Frailes"},"when":{"es":"Siglo XIII (probable) · Torre de almunia","en":"13th century (probably) · Farm-estate tower","fr":"XIIIe siècle (probable) · Tour de domaine agricole","de":"13. Jahrhundert (wahrscheinlich) · Gutsturm","pt":"Século XIII (provável) · Torre de quinta agrícola"},"desc":{"es":"Una torre de piedra de unos 13 metros, sola en la huerta al sur de Fraga. Marca una antigua almunia, una finca agrícola andalusí que después fue de templarios y hospitalarios.","en":"A stone tower about 13 metres high, standing alone in the farmland south of Fraga. It marks an old almunia, an Andalusi farming estate that later belonged to the Templars and the Hospitallers.","fr":"Une tour de pierre d'environ 13 mètres, isolée dans les vergers au sud de Fraga. Elle marque une ancienne almunia, un domaine agricole andalou qui appartint ensuite aux Templiers et aux Hospitaliers.","de":"Ein etwa 13 Meter hoher Steinturm, allein in den Gärten südlich von Fraga. Er markiert eine alte Almunia, ein andalusisches Landgut, das später den Templern und den Johannitern gehörte.","pt":"Uma torre de pedra com cerca de 13 metros, isolada nos pomares a sul de Fraga. Assinala uma antiga almúnia, uma quinta agrícola andaluza que depois pertenceu aos Templários e aos Hospitalários."},"visit":{"es":"Está al sur de Fraga, junto a la carretera hacia Mequinenza, cerca del acceso a la autovía. Se ve por fuera, en una parada corta de 10-15 minutos.","en":"It stands south of Fraga, next to the road towards Mequinenza, near the motorway junction. It is seen from outside, on a short 10-15-minute stop.","fr":"Elle se trouve au sud de Fraga, le long de la route de Mequinenza, près de l'accès à l'autoroute. Elle se voit de l'extérieur, lors d'un court arrêt de 10 à 15 minutes.","de":"Er steht südlich von Fraga an der Straße nach Mequinenza, nahe der Autobahnauffahrt. Er ist von außen zu sehen, bei einem kurzen Halt von 10-15 Minuten.","pt":"Fica a sul de Fraga, junto à estrada para Mequinenza, perto do acesso à autoestrada. Vê-se por fora, numa paragem curta de 10-15 minutos."},"src":"https://www.enciclopedia.cat/catalunya-romanica/torre-dels-frares-fraga","sources":["https://www.enciclopedia.cat/catalunya-romanica/torre-dels-frares-fraga","https://es.wikipedia.org/wiki/Fraga_(Huesca)","https://es.wikipedia.org/wiki/Bajo_Cinca"],"art":{"es":[{"h":"Historia","t":"La torre recuerda una almunia, una explotación agrícola de época musulmana, que pudo formar parte de la línea defensiva de Fraga a lo largo del Cinca. Tras la conquista de 1149 pasó por varias manos y un documento de 1296 ya habla de la almunia de los Templarios. Después fue de la orden del Hospital, y de ahí el nombre de los Frailes.\n\nSu origen se sitúa, con prudencia, en el siglo XIII, porque no hay excavaciones que lo confirmen. Hacia 1972 se desmontó por el trazado de la autopista y se volvió a levantar cerca de su emplazamiento original."},{"h":"Qué ver","t":"Es una torre casi cuadrada, de sillares de piedra caliza amarillenta, con muros de unos 90 cm. En el lado oeste hay una puerta de arco apuntado con una cruz en relieve encima, probablemente hospitalaria.\n\nSi te fijas, verás tres épocas: la torre defensiva con saeteras y entrada elevada, la reforma hospitalaria con la puerta a ras de suelo y ventanas del siglo XVI, y los cambios del siglo XIX. Las almenas y la terraza son reconstrucciones del siglo XX."}],"en":[{"h":"History","t":"The tower recalls an almunia, a farming estate of the Muslim period, which may have formed part of Fraga's defensive line along the Cinca. After the conquest of 1149 it changed hands several times, and a document of 1296 already mentions the almunia of the Templars. It later belonged to the Order of the Hospital, hence the name 'of the Friars'.\n\nIts origin is cautiously placed in the 13th century, as no excavations have confirmed it. Around 1972 it was taken down for the motorway route and rebuilt close to its original site."},{"h":"What to see","t":"It is an almost square tower of yellowish limestone ashlar, with walls about 90 cm thick. On the west side there is a pointed-arch doorway with a cross in relief above it, probably a Hospitaller one.\n\nLook closely and you will see three periods: the defensive tower with arrow slits and a raised entrance, the Hospitaller alterations with the ground-level door and 16th-century windows, and the 19th-century changes. The battlements and the roof terrace are 20th-century reconstructions."}],"fr":[{"h":"Histoire","t":"La tour rappelle une almunia, une exploitation agricole de l'époque musulmane, qui a pu faire partie de la ligne défensive de Fraga le long du Cinca. Après la conquête de 1149, elle changea plusieurs fois de mains, et un document de 1296 mentionne déjà l'almunia des Templiers. Elle appartint ensuite à l'ordre de l'Hôpital, d'où son nom « des Frères ».\n\nSon origine est située avec prudence au XIIIe siècle, faute de fouilles pour le confirmer. Vers 1972, elle fut démontée pour le tracé de l'autoroute et remontée près de son emplacement d'origine."},{"h":"À voir","t":"C'est une tour presque carrée, en pierre de taille calcaire jaunâtre, aux murs d'environ 90 cm. Sur le côté ouest s'ouvre une porte en arc brisé surmontée d'une croix en relief, probablement hospitalière.\n\nEn regardant bien, on distingue trois époques : la tour défensive avec ses meurtrières et son entrée surélevée, la transformation hospitalière avec la porte au niveau du sol et des fenêtres du XVIe siècle, et les modifications du XIXe siècle. Les créneaux et la terrasse sont des reconstructions du XXe siècle."}],"de":[{"h":"Geschichte","t":"Der Turm erinnert an eine Almunia, ein Landgut aus muslimischer Zeit, das vielleicht Teil der Verteidigungslinie Fragas entlang des Cinca war. Nach der Eroberung von 1149 wechselte er mehrfach den Besitzer, und ein Dokument von 1296 spricht bereits von der Almunia der Templer. Später gehörte er dem Johanniterorden, daher der Name ‚der Mönche‘.\n\nSein Ursprung wird vorsichtig ins 13. Jahrhundert datiert, da Grabungen fehlen. Um 1972 wurde er für den Bau der Autobahn abgetragen und nahe seinem ursprünglichen Standort wieder aufgebaut."},{"h":"Sehenswert","t":"Der fast quadratische Turm besteht aus gelblichen Kalksteinquadern, die Mauern sind etwa 90 cm stark. Auf der Westseite öffnet sich ein Spitzbogentor mit einem Reliefkreuz darüber, vermutlich ein Johanniterkreuz.\n\nBei genauem Hinsehen erkennt man drei Epochen: den Wehrturm mit Schießscharten und Hocheingang, den Umbau der Johanniter mit ebenerdiger Tür und Fenstern aus dem 16. Jahrhundert sowie die Veränderungen des 19. Jahrhunderts. Zinnen und Terrasse sind Rekonstruktionen des 20. Jahrhunderts."}],"pt":[{"h":"História","t":"A torre recorda uma almúnia, uma exploração agrícola da época muçulmana, que pode ter feito parte da linha defensiva de Fraga ao longo do Cinca. Depois da conquista de 1149 passou por várias mãos, e um documento de 1296 já fala da almúnia dos Templários. Mais tarde pertenceu à Ordem do Hospital, daí o nome 'dos Frades'.\n\nA sua origem situa-se, com prudência, no século XIII, porque não há escavações que o confirmem. Por volta de 1972 foi desmontada por causa do traçado da autoestrada e voltou a ser erguida perto do local original."},{"h":"O que ver","t":"É uma torre quase quadrada, de cantaria de calcário amarelado, com muros de cerca de 90 cm. Do lado oeste há uma porta em arco quebrado com uma cruz em relevo por cima, provavelmente hospitalária.\n\nSe reparar bem, verá três épocas: a torre defensiva com seteiras e entrada elevada, a reforma hospitalária com a porta ao nível do chão e janelas do século XVI, e as alterações do século XIX. As ameias e o terraço são reconstruções do século XX."}]},"status":"pending"},{"id":"pilaret-santa-quiteria","town":"Fraga","cat":"arqueologia","lat":41.56222,"lon":0.31711,"coord_src":null,"q":["Pilaret de Santa Quiteria, Fraga","Torre del Pilaret, Fraga"],"fq":["Pilaret de Santa Quiteria","Torre del Pilaret Fraga"],"name":{"es":"El Pilaret de Santa Quiteria","en":"El Pilaret de Santa Quiteria","fr":"El Pilaret de Santa Quiteria","de":"El Pilaret de Santa Quiteria","pt":"El Pilaret de Santa Quiteria"},"when":{"es":"Íberos y Edad Media · Torre vigía","en":"Iberians and Middle Ages · Watchtower","fr":"Ibères et Moyen Âge · Tour de guet","de":"Iberer und Mittelalter · Wachturm","pt":"Iberos e Idade Média · Torre de vigia"},"desc":{"es":"En un cerro sobre la orilla izquierda del Cinca, cerca de la Villa Fortunatus, se juntan un poblado ibérico y una torre vigía medieval. Ambos están declarados Bien de Interés Cultural.","en":"On a hill above the left bank of the Cinca, near Villa Fortunatus, an Iberian settlement and a medieval watchtower share the same spot. Both are listed as Bienes de Interés Cultural.","fr":"Sur une colline dominant la rive gauche du Cinca, près de la Villa Fortunatus, un village ibère et une tour de guet médiévale se partagent le même site. Tous deux sont classés Bien de Interés Cultural.","de":"Auf einem Hügel über dem linken Ufer des Cinca, nahe der Villa Fortunatus, liegen eine iberische Siedlung und ein mittelalterlicher Wachturm beieinander. Beide sind als Bien de Interés Cultural geschützt.","pt":"Num cerro sobre a margem esquerda do Cinca, perto da Villa Fortunatus, juntam-se um povoado ibérico e uma torre de vigia medieval. Ambos estão classificados como Bien de Interés Cultural."},"visit":{"es":"Está a unos 5 km al norte de Fraga por la A-1234; se sube por una pista hasta la meseta. Es un lugar al aire libre, sin servicios: lleva calzado cómodo y respeta los restos. Calcula media hora.","en":"It is about 5 km north of Fraga along the A-1234; a track leads up to the plateau. It is an open-air site with no facilities: wear comfortable shoes and respect the remains. Allow half an hour.","fr":"Il se trouve à environ 5 km au nord de Fraga par l'A-1234 ; une piste monte jusqu'au plateau. C'est un site de plein air, sans services : prévoyez de bonnes chaussures et respectez les vestiges. Comptez une demi-heure.","de":"Etwa 5 km nördlich von Fraga an der A-1234; ein Feldweg führt hinauf zur Hochfläche. Freigelände ohne Einrichtungen: Bequeme Schuhe tragen und die Reste respektieren. Eine halbe Stunde einplanen.","pt":"Fica a cerca de 5 km a norte de Fraga pela A-1234; sobe-se por um caminho de terra até ao planalto. É um local ao ar livre, sem serviços: leve calçado confortável e respeite os vestígios. Conte com meia hora."},"src":"https://www.enciclopedia.cat/catalunya-romanica/torre-del-pilaret-de-santa-quiteria-fraga","sources":["https://www.enciclopedia.cat/catalunya-romanica/torre-del-pilaret-de-santa-quiteria-fraga","https://es.wikipedia.org/wiki/Fraga_(Huesca)","https://es.wikipedia.org/wiki/Bajo_Cinca"],"art":{"es":[{"h":"Historia","t":"En este cerro hubo un poblado ibérico desde las últimas décadas del siglo V a. C., que siguió habitado en época romana. En 1894 José Salarrullana de Dios encontró aquí una inscripción ibérica, hoy en paradero desconocido. Los hallazgos de cerámica a mano indican que el espolón ya se usó en la Edad del Bronce.\n\nLa torre es más tardía. Tenía foso y la puerta en alto, a la que solo se llegaba con escalera. Los especialistas dudan entre un origen andalusí y una obra de los siglos XIII-XIV; la hipótesis más prudente es un origen islámico con reformas cristianas, pendiente de estudio arqueológico."},{"h":"Qué ver","t":"La torre, de planta rectangular y unos 10 metros de altura, tiene dos partes: los tres metros de abajo son de mampostería y el resto es de tapial con muchos cantos rodados. Aún se ven las filas de agujeros del encofrado y, al este, un foso de unos 3 metros.\n\nDesde arriba se entiende su función: vigilar el valle del Cinca y el barranco que sube hacia los llanos del interior. El lado suroeste se ha derrumbado, así que mira desde fuera."}],"en":[{"h":"History","t":"An Iberian settlement stood on this hill from the last decades of the 5th century BC and remained inhabited in Roman times. In 1894 José Salarrullana de Dios found an Iberian inscription here, whose whereabouts are now unknown. Finds of handmade pottery show that the spur was already in use in the Bronze Age.\n\nThe tower is later. It had a ditch and a raised door that could only be reached by ladder. Specialists are divided between an Andalusi origin and a 13th-14th-century construction; the most cautious view is an Islamic origin with Christian alterations, awaiting archaeological study."},{"h":"What to see","t":"The tower, rectangular in plan and about 10 metres high, has two parts: the bottom three metres are rubble masonry and the rest is rammed earth with plenty of river cobbles. You can still see the rows of holes left by the formwork and, to the east, a ditch about 3 metres deep.\n\nFrom up here its purpose is clear: to watch over the Cinca valley and the ravine climbing towards the inland plains. The south-west side has collapsed, so look from outside."}],"fr":[{"h":"Histoire","t":"Un village ibère occupa cette colline à partir des dernières décennies du Ve siècle av. J.-C. et resta habité à l'époque romaine. En 1894, José Salarrullana de Dios y découvrit une inscription ibère, aujourd'hui introuvable. Des tessons de céramique modelée montrent que l'éperon était déjà utilisé à l'âge du bronze.\n\nLa tour est plus tardive. Elle avait un fossé et une porte en hauteur, accessible seulement par une échelle. Les spécialistes hésitent entre une origine andalouse et une construction des XIIIe-XIVe siècles ; l'hypothèse la plus prudente est une origine islamique avec des transformations chrétiennes, en attendant une étude archéologique."},{"h":"À voir","t":"La tour, de plan rectangulaire et haute d'environ 10 mètres, comporte deux parties : les trois mètres du bas sont en moellons et le reste en pisé chargé de galets. On voit encore les rangées de trous du coffrage et, à l'est, un fossé d'environ 3 mètres.\n\nD'en haut, on comprend sa fonction : surveiller la vallée du Cinca et le ravin qui monte vers les plaines de l'intérieur. Le côté sud-ouest s'est effondré : regardez de l'extérieur."}],"de":[{"h":"Geschichte","t":"Auf diesem Hügel lag seit den letzten Jahrzehnten des 5. Jahrhunderts v. Chr. eine iberische Siedlung, die bis in römische Zeit bewohnt blieb. 1894 fand José Salarrullana de Dios hier eine iberische Inschrift, deren Verbleib heute unbekannt ist. Handgeformte Keramik zeigt, dass der Sporn schon in der Bronzezeit genutzt wurde.\n\nDer Turm ist jünger. Er hatte einen Graben und eine hochgelegene Tür, die nur über eine Leiter erreichbar war. Fachleute schwanken zwischen andalusischem Ursprung und einem Bau des 13.-14. Jahrhunderts; am vorsichtigsten ist die Annahme eines islamischen Ursprungs mit christlichen Umbauten, bis archäologische Untersuchungen vorliegen."},{"h":"Sehenswert","t":"Der rechteckige, rund 10 Meter hohe Turm besteht aus zwei Teilen: Die unteren drei Meter sind Bruchsteinmauerwerk, der Rest Stampflehm mit vielen Flusskieseln. Noch sieht man die Lochreihen der Schalung und im Osten einen etwa 3 Meter tiefen Graben.\n\nVon oben wird seine Aufgabe klar: das Cinca-Tal und die Schlucht zu den Hochebenen im Landesinneren zu überwachen. Die Südwestseite ist eingestürzt, daher bitte nur von außen betrachten."}],"pt":[{"h":"História","t":"Neste cerro existiu um povoado ibérico desde as últimas décadas do século V a. C., que continuou habitado na época romana. Em 1894, José Salarrullana de Dios encontrou aqui uma inscrição ibérica, hoje em paradeiro desconhecido. Os achados de cerâmica feita à mão indicam que o esporão já era usado na Idade do Bronze.\n\nA torre é mais tardia. Tinha fosso e a porta em altura, a que só se chegava por escada. Os especialistas hesitam entre uma origem andaluza e uma obra dos séculos XIII-XIV; a hipótese mais prudente é uma origem islâmica com reformas cristãs, à espera de estudo arqueológico."},{"h":"O que ver","t":"A torre, de planta retangular e com cerca de 10 metros de altura, tem duas partes: os três metros de baixo são de alvenaria e o resto de taipa com muitos seixos rolados. Ainda se veem as filas de furos da cofragem e, a leste, um fosso de cerca de 3 metros.\n\nLá de cima percebe-se a sua função: vigiar o vale do Cinca e a ravina que sobe para as planícies do interior. O lado sudoeste ruiu, por isso observe de fora."}]},"status":"pending"},{"id":"castillo-mequinenza","town":"Mequinenza","cat":"patrimonio","lat":41.36497,"lon":0.2964,"coord_src":null,"q":["Castillo de Mequinenza","Castell de Mequinensa"],"fq":["Castillo de Mequinenza","Mequinenza castle","Castell de Mequinensa"],"name":{"es":"Castillo de Mequinenza","en":"Mequinenza Castle","fr":"Château de Mequinenza","de":"Burg von Mequinenza","pt":"Castelo de Mequinenza"},"when":{"es":"Siglos XIV-XV · Castillo-palacio de los Moncada","en":"14th-15th centuries · Castle-palace of the Moncadas","fr":"XIVe-XVe siècles · Château-palais des Moncada","de":"14.-15. Jahrhundert · Burgpalast der Moncada","pt":"Séculos XIV-XV · Castelo-palácio dos Moncada"},"desc":{"es":"Un castillo-palacio gótico sobre el cerro que vigila la unión del Ebro y el Segre, en la frontera entre Aragón y Cataluña. Lo levantaron los Moncada, señores de Mequinenza, y sufrió el asedio francés de 1810.","en":"A Gothic castle-palace on the hill overlooking the meeting of the Ebro and the Segre, on the border between Aragon and Catalonia. It was built by the Moncadas, lords of Mequinenza, and was besieged by the French in 1810.","fr":"Un château-palais gothique sur la colline qui surveille la rencontre de l'Èbre et du Sègre, à la frontière entre l'Aragon et la Catalogne. Il fut bâti par les Moncada, seigneurs de Mequinenza, et subit le siège français de 1810.","de":"Ein gotischer Burgpalast auf dem Hügel über dem Zusammenfluss von Ebro und Segre, an der Grenze zwischen Aragonien und Katalonien. Erbaut von den Moncada, den Herren von Mequinenza, wurde er 1810 von den Franzosen belagert.","pt":"Um castelo-palácio gótico sobre o cerro que vigia a união do Ebro e do Segre, na fronteira entre Aragão e a Catalunha. Foi erguido pelos Moncada, senhores de Mequinenza, e sofreu o cerco francês de 1810."},"visit":{"es":"Es propiedad de la Fundación Endesa y solo se visita por dentro con cita previa, a través de la oficina de turismo de Mequinenza. El exterior y las vistas desde el cerro se disfrutan libremente. Confirma días de visita antes de ir.","en":"It belongs to the Fundación Endesa and the interior can only be visited by appointment, through the Mequinenza tourist office. The outside and the views from the hill are freely accessible. Check visiting days before you go.","fr":"Il appartient à la Fondation Endesa et l'intérieur ne se visite que sur rendez-vous, auprès de l'office de tourisme de Mequinenza. L'extérieur et la vue depuis la colline sont en accès libre. Vérifiez les jours de visite avant de venir.","de":"Sie gehört der Fundación Endesa; das Innere ist nur nach Voranmeldung über das Tourismusbüro von Mequinenza zugänglich. Außenbereich und Aussicht vom Hügel sind frei. Besuchstage vorher erfragen.","pt":"É propriedade da Fundación Endesa e o interior só se visita com marcação prévia, através do posto de turismo de Mequinenza. O exterior e as vistas do cerro são de acesso livre. Confirme os dias de visita antes de ir."},"src":"https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5490366","sources":["https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5490366","https://es.wikipedia.org/wiki/Mequinenza","https://es.wikipedia.org/wiki/Asedio_de_Mequinenza","https://es.wikipedia.org/wiki/Bajo_Cinca"],"art":{"es":[{"h":"Historia","t":"En 1212 el rey Pedro II casó a su hija Constanza con Guillén Ramón de Moncada, y la dote incluía el señorío de Mequinenza. Desde entonces los Moncada fueron señores de la villa y, entre los siglos XIV y XV, construyeron el castillo actual, quizá sobre una fortaleza musulmana anterior.\n\nLa posición, sobre tres ríos, lo convirtió en objetivo de varias guerras: la civil catalana (1462-1472), la de Secesión (1640-1652) y la de Sucesión (1705-1714) dañaron la villa y el castillo. En 1810 el ejército francés del general Suchet abrió un camino en zigzag para subir la artillería hasta el cerro; tras días de bombardeo, la guarnición española se rindió el 8 de junio."},{"h":"Qué ver","t":"Desde fuera se aprecia la planta rectangular con torres y las defensas exteriores añadidas en la Edad Moderna, cuando el castillo se adaptó a la artillería.\n\nEl mejor premio es la vista: a un lado, el embalse; al otro, el Pueblo Viejo y la confluencia de los ríos. Imagina el valle antes de los pantanos, con el pueblo junto al agua y los llaguts cargados de carbón bajando por el Ebro."}],"en":[{"h":"History","t":"In 1212 King Peter II married his daughter Constance to Guillén Ramón de Moncada, and the dowry included the lordship of Mequinenza. From then on the Moncadas were lords of the town and, between the 14th and 15th centuries, they built the present castle, perhaps on top of an earlier Muslim fortress.\n\nIts position above three rivers made it a target in several wars: the Catalan Civil War (1462-1472), the Reapers' War (1640-1652) and the War of the Spanish Succession (1705-1714) all damaged the town and the castle. In 1810 General Suchet's French army cut a zigzag road to haul its artillery up the hill; after days of bombardment, the Spanish garrison surrendered on 8 June."},{"h":"What to see","t":"From outside you can make out the rectangular plan with towers and the outer defences added in the early modern period, when the castle was adapted to artillery.\n\nThe real reward is the view: the reservoir on one side; on the other, the Old Town and the meeting of the rivers. Imagine the valley before the dams, with the town by the water and the llaguts, the river barges, carrying coal down the Ebro."}],"fr":[{"h":"Histoire","t":"En 1212, le roi Pierre II maria sa fille Constance à Guillén Ramón de Moncada, et la dot comprenait la seigneurie de Mequinenza. Dès lors, les Moncada furent seigneurs de la ville et, entre le XIVe et le XVe siècle, ils construisirent le château actuel, peut-être sur une forteresse musulmane antérieure.\n\nSa position au-dessus de trois rivières en fit l'enjeu de plusieurs guerres : la guerre civile catalane (1462-1472), la guerre des Faucheurs (1640-1652) et la guerre de Succession d'Espagne (1705-1714) endommagèrent la ville et le château. En 1810, l'armée française du général Suchet traça un chemin en zigzag pour hisser l'artillerie sur la colline ; après des jours de bombardement, la garnison espagnole capitula le 8 juin."},{"h":"À voir","t":"De l'extérieur, on distingue le plan rectangulaire flanqué de tours et les défenses extérieures ajoutées à l'époque moderne, quand le château fut adapté à l'artillerie.\n\nLa plus belle récompense est la vue : d'un côté, le lac de barrage ; de l'autre, le Vieux Village et la confluence des rivières. Imaginez la vallée avant les barrages, avec le village au bord de l'eau et les llaguts, les barques fluviales, descendant l'Èbre chargés de charbon."}],"de":[{"h":"Geschichte","t":"1212 verheiratete König Peter II. seine Tochter Konstanze mit Guillén Ramón de Moncada; zur Mitgift gehörte die Herrschaft Mequinenza. Seither waren die Moncada Herren des Ortes und errichteten zwischen dem 14. und 15. Jahrhundert die heutige Burg, vielleicht auf einer älteren muslimischen Festung.\n\nDie Lage über drei Flüssen machte sie zum Ziel mehrerer Kriege: Der katalanische Bürgerkrieg (1462-1472), der Aufstand der Schnitter (1640-1652) und der Spanische Erbfolgekrieg (1705-1714) beschädigten Ort und Burg. 1810 ließ General Suchet einen Zickzackweg anlegen, um die französische Artillerie auf den Hügel zu bringen; nach tagelangem Beschuss ergab sich die spanische Besatzung am 8. Juni."},{"h":"Sehenswert","t":"Von außen erkennt man den rechteckigen Grundriss mit Türmen und die äußeren Verteidigungswerke der Frühen Neuzeit, als die Burg an die Artillerie angepasst wurde.\n\nDer schönste Lohn ist die Aussicht: auf der einen Seite der Stausee, auf der anderen das Alte Dorf und der Zusammenfluss. Stellen Sie sich das Tal vor den Stauseen vor, mit dem Dorf am Wasser und den Llaguts, den Flussbooten, die Kohle den Ebro hinabbrachten."}],"pt":[{"h":"História","t":"Em 1212 o rei Pedro II casou a filha Constança com Guillén Ramón de Moncada, e o dote incluía o senhorio de Mequinenza. Desde então os Moncada foram senhores da vila e, entre os séculos XIV e XV, construíram o castelo atual, talvez sobre uma fortaleza muçulmana anterior.\n\nA posição, sobre três rios, tornou-o alvo de várias guerras: a guerra civil catalã (1462-1472), a guerra dos Segadores (1640-1652) e a guerra da Sucessão Espanhola (1705-1714) danificaram a vila e o castelo. Em 1810 o exército francês do general Suchet abriu um caminho em ziguezague para subir a artilharia até ao cerro; após dias de bombardeamento, a guarnição espanhola rendeu-se a 8 de junho."},{"h":"O que ver","t":"De fora aprecia-se a planta retangular com torres e as defesas exteriores acrescentadas na Idade Moderna, quando o castelo foi adaptado à artilharia.\n\nO melhor prémio é a vista: de um lado, a albufeira; do outro, a Aldeia Velha e a confluência dos rios. Imagine o vale antes das barragens, com a vila junto à água e os llaguts, os barcos fluviais, a descer o Ebro carregados de carvão."}]},"status":"pending"},{"id":"pueblo-viejo-mequinenza","town":"Mequinenza","cat":"memoria","lat":41.36218,"lon":0.29705,"coord_src":null,"q":["Pueblo Viejo de Mequinenza","Poble Vell de Mequinensa"],"fq":["Pueblo Viejo de Mequinenza","Mequinenza poble vell","Mequinenza old town ruins"],"name":{"es":"Pueblo Viejo de Mequinenza","en":"Old Town of Mequinenza","fr":"Vieux Village de Mequinenza","de":"Altes Dorf von Mequinenza","pt":"Aldeia Velha de Mequinenza"},"when":{"es":"Derribado a finales de los años 60 · Memoria","en":"Demolished in the late 1960s · Memory","fr":"Démoli à la fin des années 1960 · Mémoire","de":"Ende der 1960er abgerissen · Erinnerung","pt":"Demolida no final dos anos 60 · Memória"},"desc":{"es":"Las calles y los cimientos del antiguo pueblo de Mequinenza, derribado y en parte cubierto por el agua del embalse de Ribarroja. Un pueblo de navegantes y mineros que el escritor Jesús Moncada convirtió en literatura.","en":"The streets and foundations of the old town of Mequinenza, demolished and partly covered by the waters of the Ribarroja reservoir. A town of boatmen and miners that the writer Jesús Moncada turned into literature.","fr":"Les rues et les fondations de l'ancien village de Mequinenza, démoli et en partie recouvert par les eaux du barrage de Ribarroja. Un village de bateliers et de mineurs que l'écrivain Jesús Moncada a transformé en littérature.","de":"Die Gassen und Fundamente des alten Mequinenza, abgerissen und teilweise vom Wasser des Ribarroja-Stausees bedeckt. Ein Dorf der Schiffer und Bergleute, das der Schriftsteller Jesús Moncada zu Literatur gemacht hat.","pt":"As ruas e os alicerces da antiga vila de Mequinenza, demolida e em parte coberta pelas águas da albufeira de Ribarroja. Uma vila de barqueiros e mineiros que o escritor Jesús Moncada transformou em literatura."},"visit":{"es":"Se pasea por los restos a pie desde los Museos de Mequinenza. La Ruta Literaria Jesús Moncada es guiada y se reserva con antelación en los propios museos. Calcula una hora y media.","en":"You can walk around the remains from the Museos de Mequinenza. The Jesús Moncada Literary Route is guided and must be booked in advance at the museums. Allow an hour and a half.","fr":"On parcourt les vestiges à pied depuis les Museos de Mequinenza. La Route littéraire Jesús Moncada est guidée et se réserve à l'avance auprès des musées. Comptez une heure et demie.","de":"Die Reste erkundet man zu Fuß, ausgehend von den Museos de Mequinenza. Die Literarische Route Jesús Moncada ist eine Führung und muss im Voraus in den Museen gebucht werden. Anderthalb Stunden einplanen.","pt":"Percorrem-se os vestígios a pé a partir dos Museos de Mequinenza. A Rota Literária Jesús Moncada é guiada e reserva-se com antecedência nos próprios museus. Conte com hora e meia."},"src":"https://www.museosdemequinenza.com/wp-content/uploads/2018/05/Pueblo-Viejo-de-Mequinenza-web.pdf","sources":["https://www.museosdemequinenza.com/wp-content/uploads/2018/05/Pueblo-Viejo-de-Mequinenza-web.pdf","https://www.museosdemequinenza.com/wp-content/uploads/2018/05/Museos-de-Mequinenza-web.pdf","https://es.wikipedia.org/wiki/Mequinenza","https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5490366"],"art":{"es":[{"h":"Historia","t":"El viejo Mequinenza vivía junto al Ebro, a los pies del castillo y cerca de la confluencia con el Segre. Sus vecinos eran navegantes que llevaban el carbón río abajo en llaguts, tirados desde la orilla por el camino de sirga, y mineros de las minas cercanas.\n\nLos embalses de Mequinenza y Ribarroja cambiaron todo. A finales de los años 60 la mayor parte del pueblo fue derribada y sus vecinos se trasladaron al nuevo núcleo. Entre lo poco que quedó en pie está el grupo escolar María Quintana, inaugurado en 1929, que hoy alberga los museos."},{"h":"Qué ver","t":"Se reconocen las calles y los cimientos de la iglesia de Nuestra Señora de la Asunción, de 1803, cuya torre también cayó con las máquinas. La ruta literaria pasa por el Muro, que hacía de dique y muelle; la casa natal de Jesús Moncada; la plaza de Armas; la calle de las Brujas, la más estrecha; y el antiguo campo de fútbol, que se inundaba a menudo.\n\nJunto a los museos verás un llaut, una barca que podía cargar unas 30 toneladas de carbón, y una turbina hidroeléctrica de 420 toneladas: los dos oficios que marcaron la historia del pueblo."}],"en":[{"h":"History","t":"Old Mequinenza lived beside the Ebro, at the foot of the castle and near the confluence with the Segre. Its people were boatmen who carried coal downriver in llaguts, towed from the bank along the towpath, and miners from the nearby pits.\n\nThe Mequinenza and Ribarroja reservoirs changed everything. In the late 1960s most of the town was demolished and its residents moved to the new town. Among the few buildings left standing is the María Quintana school, opened in 1929, which now houses the museums."},{"h":"What to see","t":"You can make out the streets and the foundations of the church of Nuestra Señora de la Asunción, from 1803, whose tower also fell to the machines. The literary route passes the Muro, which served as flood wall and quay; Jesús Moncada's birthplace; the Plaza de Armas; the Calle de las Brujas (Witches' Street), the narrowest; and the old football pitch, which often flooded.\n\nNext to the museums you will see a llaut, a boat that could carry about 30 tonnes of coal, and a 420-tonne hydroelectric turbine: the two trades that shaped the town's history."}],"fr":[{"h":"Histoire","t":"Le vieux Mequinenza vivait au bord de l'Èbre, au pied du château et près de la confluence avec le Sègre. Ses habitants étaient des bateliers qui descendaient le charbon dans des llaguts, halés depuis la rive par le chemin de halage, et des mineurs des mines voisines.\n\nLes barrages de Mequinenza et de Ribarroja ont tout changé. À la fin des années 1960, la plus grande partie du village fut démolie et ses habitants s'installèrent dans la nouvelle ville. Parmi les rares bâtiments restés debout figure le groupe scolaire María Quintana, inauguré en 1929, qui abrite aujourd'hui les musées."},{"h":"À voir","t":"On reconnaît les rues et les fondations de l'église Nuestra Señora de la Asunción, de 1803, dont le clocher tomba lui aussi sous les engins. La route littéraire passe par le Muro, qui servait de digue et de quai ; la maison natale de Jesús Moncada ; la Plaza de Armas ; la Calle de las Brujas (rue des Sorcières), la plus étroite ; et l'ancien terrain de football, souvent inondé.\n\nPrès des musées, vous verrez un llaut, une barque qui pouvait transporter environ 30 tonnes de charbon, et une turbine hydroélectrique de 420 tonnes : les deux métiers qui ont marqué l'histoire du village."}],"de":[{"h":"Geschichte","t":"Das alte Mequinenza lag am Ebro, zu Füßen der Burg und nahe der Mündung des Segre. Seine Bewohner waren Schiffer, die die Kohle in Llaguts flussabwärts brachten, vom Ufer aus auf dem Treidelpfad gezogen, und Bergleute aus den nahen Gruben.\n\nDie Stauseen von Mequinenza und Ribarroja veränderten alles. Ende der 1960er Jahre wurde der größte Teil des Dorfes abgerissen, und die Bewohner zogen in den neuen Ort. Zu den wenigen erhaltenen Gebäuden gehört die 1929 eröffnete Schule María Quintana, die heute die Museen beherbergt."},{"h":"Sehenswert","t":"Man erkennt die Gassen und die Fundamente der Kirche Nuestra Señora de la Asunción von 1803, deren Turm ebenfalls den Baggern zum Opfer fiel. Die literarische Route führt am Muro vorbei, der als Deich und Kai diente, am Geburtshaus von Jesús Moncada, an der Plaza de Armas, an der Calle de las Brujas (Hexengasse), der engsten, und am alten Fußballplatz, der oft überschwemmt war.\n\nNeben den Museen stehen ein Llaut, ein Boot, das rund 30 Tonnen Kohle laden konnte, und eine 420 Tonnen schwere Wasserkraftturbine: die beiden Berufe, die die Geschichte des Dorfes prägten."}],"pt":[{"h":"História","t":"A velha Mequinenza vivia junto ao Ebro, aos pés do castelo e perto da confluência com o Segre. Os seus habitantes eram barqueiros que levavam o carvão rio abaixo em llaguts, puxados a partir da mar
