 sigue un camino muy antiguo por la orilla del río.\n\nAprovecha las mesas y bancos que hay junto a la ermita para hacer una parada: es un buen punto intermedio en la ruta por el Cinca, entre Fraga y Zaidín.\n\nSan Valero, a quien está dedicada la ermita, fue obispo de Zaragoza en tiempos romanos y es el patrón de la ciudad; su culto está muy extendido por todo Aragón."},{"h":"Tradiciones y fiestas","t":"La ermita da nombre a las fiestas de invierno de Velilla: San Valero, el 29 de enero, y al día siguiente de forma más familiar el Sant Valeret, que los vecinos celebran como patronal en febrero. La otra gran cita del año es San Lorenzo, el 10 de agosto.\n\nEn el término de Velilla se conocen además otros restos romanos, como una necrópolis reutilizada después como villa, señal de que la orilla del río estuvo habitada de forma continuada."}],"en":[{"h":"History","t":"In Roman times the Cinca floodplain was dotted with villas, such as Fortunatus, a few kilometres away. A mausoleum was built beside the road, the funerary monument of some well-to-do local family; the archaeologist Félix Montón devoted a study to it in 1982.\n\nIn the Middle Ages, probably in the 13th century, the hermitage of San Valero was built on top of it, making use of the ancient structure. This is a common case: a solid, respected building is reused as a place of worship and so survives to the present day.\n\nRoman mausoleums were usually towers or massive buildings, with a chamber for urns or sarcophagi and an inscription bearing the name of the deceased. Their solidity has helped them survive when they were given a new use."},{"h":"What to see","t":"Walk around the hermitage and look in its walls for the Roman structure it rests on: the well-squared ashlar blocks of the lower part contrast with the hermitage's poorer masonry.\n\nThe Romans buried their dead outside their settlements, beside the roads, so that travellers would remember their names. That the mausoleum stands at the edge of today's road is no coincidence: the route follows a very old path along the riverbank.\n\nMake use of the tables and benches beside the hermitage to take a break: it is a good halfway point on the Cinca route, between Fraga and Zaidín.\n\nSan Valero, to whom the hermitage is dedicated, was Bishop of Zaragoza in Roman times and is the city's patron saint; his cult is widespread throughout Aragón."},{"h":"Traditions and festivals","t":"The hermitage gives its name to Velilla's winter festivities: San Valero, on 29 January, and, as a more family occasion the following day, Sant Valeret, which locals celebrate as their patronal festival in February. The other big date of the year is San Lorenzo, on 10 August.\n\nOther Roman remains are also known in the municipality of Velilla, such as a cemetery later reused as a villa, a sign that the riverbank was continuously inhabited."}],"fr":[{"h":"Histoire","t":"À l'époque romaine, la plaine du Cinca était parsemée de villas, comme la Fortunatus, à quelques kilomètres. Au bord du chemin s'éleva un mausolée, le monument funéraire d'une famille aisée de la région ; l'archéologue Félix Montón lui consacra une étude en 1982.\n\nAu Moyen Âge, probablement au XIIIe siècle, on construisit dessus l'ermitage de San Valero, qui tira parti de l'ouvrage antique. C'est un cas fréquent : un édifice solide et respecté est réutilisé comme lieu de culte et parvient ainsi jusqu'à nous.\n\nLes mausolées romains étaient généralement des tours ou des édifices massifs, avec une chambre pour les urnes ou les sarcophages et une inscription portant le nom du défunt. Leur solidité les a aidés à survivre lorsqu'on leur a donné un nouvel usage."},{"h":"À voir","t":"Faites le tour de l'ermitage et cherchez dans ses murs l'ouvrage romain sur lequel il repose : les pierres de taille bien équarries de la partie basse contrastent avec la maçonnerie plus pauvre de l'ermitage.\n\nLes Romains enterraient leurs morts hors des agglomérations, au bord des chemins, pour que les voyageurs se souviennent de leurs noms. Que le mausolée se trouve au bord de la route actuelle n'est pas un hasard : le tracé suit un chemin très ancien le long de la rivière.\n\nProfitez des tables et des bancs installés près de l'ermitage pour faire une pause : c'est une bonne étape intermédiaire sur la route du Cinca, entre Fraga et Zaidín.\n\nSan Valero (saint Valère), à qui est dédié l'ermitage, fut évêque de Saragosse à l'époque romaine et il est le patron de la ville ; son culte est très répandu dans tout l'Aragon."},{"h":"Traditions et fêtes","t":"L'ermitage donne son nom aux fêtes d'hiver de Velilla : la San Valero, le 29 janvier, et le lendemain, de manière plus familiale, le Sant Valeret, que les habitants célèbrent comme fête patronale en février. L'autre grand rendez-vous de l'année est la San Lorenzo, le 10 août.\n\nSur la commune de Velilla, on connaît aussi d'autres vestiges romains, comme une nécropole réutilisée ensuite comme villa, signe que la rive fut habitée de façon continue."}],"de":[{"h":"Geschichte","t":"In römischer Zeit war die Aue des Cinca mit Villen besiedelt, wie der Villa Fortunatus wenige Kilometer entfernt. Am Weg wurde ein Mausoleum errichtet, das Grabmonument einer wohlhabenden Familie der Gegend; der Archäologe Félix Montón widmete ihm 1982 eine Studie.\n\nIm Mittelalter, vermutlich im 13. Jahrhundert, wurde darauf die Einsiedelei San Valero gebaut, die den antiken Bau nutzte. Das ist ein häufiger Fall: Ein solides und respektiertes Gebäude wird als Kultstätte weiterverwendet und überdauert so bis heute.\n\nRömische Mausoleen waren meist Türme oder massive Bauten mit einer Kammer für Urnen oder Sarkophage und einer Inschrift mit dem Namen des Verstorbenen. Ihre Solidität half ihnen zu überleben, als man ihnen eine neue Funktion gab."},{"h":"Sehenswert","t":"Gehen Sie um die Einsiedelei herum und suchen Sie in ihren Mauern den römischen Bau, auf dem sie ruht: Die sauber behauenen Quader im unteren Teil heben sich vom einfacheren Mauerwerk der Einsiedelei ab.\n\nDie Römer bestatteten ihre Toten außerhalb der Siedlungen an den Wegen, damit die Reisenden sich an ihre Namen erinnerten. Dass das Mausoleum am Rand der heutigen Straße steht, ist kein Zufall: Die Trasse folgt einem sehr alten Weg am Flussufer.\n\nNutzen Sie die Tische und Bänke neben der Einsiedelei für eine Pause: Sie ist ein guter Zwischenstopp auf der Route entlang des Cinca, zwischen Fraga und Zaidín.\n\nSan Valero, dem die Einsiedelei geweiht ist, war in römischer Zeit Bischof von Zaragoza und ist der Schutzpatron der Stadt; seine Verehrung ist in ganz Aragón verbreitet."},{"h":"Feste und Traditionen","t":"Die Einsiedelei gibt den Winterfesten von Velilla ihren Namen: San Valero am 29. Januar und am folgenden Tag im familiäreren Rahmen der Sant Valeret, den die Einwohner im Februar als Patronatsfest feiern. Der andere große Termin des Jahres ist San Lorenzo am 10. August.\n\nIm Gemeindegebiet von Velilla sind außerdem weitere römische Überreste bekannt, etwa ein Gräberfeld, das später als Villa genutzt wurde – ein Zeichen dafür, dass das Flussufer durchgehend bewohnt war."}],"pt":[{"h":"História","t":"Na época romana, a várzea do Cinca estava povoada de villas, como a Fortunatus, a poucos quilómetros. Junto ao caminho ergueu-se um mausoléu, o monumento funerário de alguma família abastada da zona; o arqueólogo Félix Montón dedicou-lhe um estudo em 1982.\n\nNa Idade Média, provavelmente no século XIII, construiu-se sobre ele a ermida de San Valero, que aproveitou a obra antiga. É um caso frequente: um edifício sólido e respeitado é reutilizado como lugar de culto e assim chega até hoje.\n\nOs mausoléus romanos eram geralmente torres ou edifícios maciços, com uma câmara para as urnas ou os sarcófagos e uma inscrição com o nome do defunto. A sua solidez ajudou-os a sobreviver quando lhes foi dado um novo uso."},{"h":"O que ver","t":"Contorne a ermida e procure nas suas paredes a obra romana sobre a qual assenta: os silhares bem esquadriados da parte baixa contrastam com a alvenaria mais pobre da ermida.\n\nOs romanos enterravam os seus mortos fora das povoações, junto aos caminhos, para que os viajantes recordassem os seus nomes. Que o mausoléu esteja à beira da estrada atual não é por acaso: o traçado segue um caminho muito antigo pela margem do rio.\n\nAproveite as mesas e os bancos que existem junto à ermida para fazer uma paragem: é um bom ponto intermédio na rota pelo Cinca, entre Fraga e Zaidín.\n\nSão Valério, a quem a ermida é dedicada, foi bispo de Saragoça em tempos romanos e é o padroeiro da cidade; o seu culto está muito difundido por todo o Aragão."},{"h":"Tradições e festas","t":"A ermida dá nome às festas de inverno de Velilla: San Valero, a 29 de janeiro, e no dia seguinte, de forma mais familiar, o Sant Valeret, que os habitantes celebram como festa do padroeiro em fevereiro. O outro grande momento do ano é San Lorenzo, a 10 de agosto.\n\nNo concelho de Velilla conhecem-se ainda outros vestígios romanos, como uma necrópole reutilizada depois como villa, sinal de que a margem do rio esteve habitada de forma contínua."}]},"status":"pending"},{"id":"iglesia-velilla","town":"Velilla de Cinca","cat":"patrimonio","lat":41.5866,"lon":0.26157,"coord_src":null,"q":["Iglesia de San Lorenzo, Velilla de Cinca","Iglesia parroquial, Velilla de Cinca"],"fq":["Velilla de Cinca iglesia","Iglesia de San Lorenzo Velilla de Cinca","Velilla de Cinca"],"name":{"es":"Iglesia de San Lorenzo","en":"Iglesia de San Lorenzo (Church of St Lawrence)","fr":"Iglesia de San Lorenzo (église)","de":"Iglesia de San Lorenzo","pt":"Igreja de San Lorenzo"},"when":{"es":"Románico, barroco y mudéjar · Parroquia","en":"Romanesque, Baroque and Mudéjar · Parish church","fr":"Roman, baroque et mudéjar · Paroisse","de":"Romanik, Barock und Mudéjar · Pfarrkirche","pt":"Românico, barroco e mudéjar · Paróquia"},"desc":{"es":"La parroquia de Velilla mezcla épocas: cuerpo de origen románico, portada barroca con capiteles decorados y un campanario de ladrillo con rasgos mudéjares que se ve desde toda la vega.","en":"Velilla's parish church mixes periods: a body of Romanesque origin, a Baroque doorway with decorated capitals and a brick bell tower with Mudéjar features that can be seen from all over the floodplain.","fr":"L'église paroissiale de Velilla mêle les époques : un corps d'origine romane, un portail baroque aux chapiteaux décorés et un clocher en brique aux traits mudéjars visible de toute la plaine.","de":"Die Pfarrkirche von Velilla vereint mehrere Epochen: einen Baukörper romanischen Ursprungs, ein Barockportal mit verzierten Kapitellen und einen Glockenturm aus Ziegel mit Mudéjar-Zügen, der in der ganzen Aue zu sehen ist.","pt":"A igreja paroquial de Velilla mistura épocas: corpo de origem românica, portal barroco com capitéis decorados e um campanário de tijolo com traços mudéjares que se vê de toda a várzea."},"visit":{"es":"Está en el centro del pueblo. El exterior se ve libremente; el interior en horario de culto. Calcula 20 minutos y sigue después por el paseo arbolado del barranco de los Planos hasta el río.","en":"It is in the village centre. The exterior can be seen freely; the interior during services. Allow 20 minutes, then carry on along the tree-lined walk beside the Planos ravine down to the river.","fr":"Elle se trouve au centre du village. L'extérieur se voit librement ; l'intérieur pendant les offices. Comptez 20 minutes, puis continuez par la promenade arborée du barranco de los Planos jusqu'à la rivière.","de":"Sie steht im Ortszentrum. Von außen ist sie frei zu besichtigen, das Innere zu den Gottesdienstzeiten. Rechnen Sie mit 20 Minuten und gehen Sie danach über die baumbestandene Promenade am Barranco de los Planos bis zum Fluss.","pt":"Fica no centro da povoação. O exterior vê-se livremente; o interior no horário de culto. Conte com 20 minutos e siga depois pelo passeio arborizado do barranco de los Planos até ao rio."},"src":"https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597349","sources":["https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597349","https://es.hispanopedia.com/wiki/Velilla_de_Cinca"],"art":{"es":[{"h":"Historia","t":"Velilla aparece en la documentación desde comienzos del siglo XII como lugar de realengo. En junio de 1252 Jaime I entregó el castillo de Velilla a Ramón de Moncada, que en 1255 vendió el lugar al monasterio de Abengania, en la vecina Cataluña. A comienzos del siglo XVII seguía perteneciendo a esos frailes.\n\nLa iglesia de San Lorenzo refleja esa historia larga: un edificio de origen románico, reformado en época barroca, con una torre que remata en ladrillo.\n\nQue un pueblo aragonés perteneciera durante siglos a un monasterio situado en Cataluña no era raro en esta franja del Cinca y del Segre, donde las fronteras de los señoríos no coincidían con las de los reinos."},{"h":"Qué ver","t":"Empieza por la portada, de estilo barroco, con capiteles decorados. Después levanta la vista hacia el campanario: la parte alta, de ladrillo, muestra rasgos del arte mudéjar, la tradición de los alarifes musulmanes que siguió viva en Aragón durante siglos.\n\nEl contraste entre la piedra de la base y el ladrillo del remate es la mejor forma de leer el edificio: cada material corresponde a una época y a una manera de construir.\n\nAl salir de la iglesia, recorre las calles cercanas para ver la torre desde distintos ángulos: el campanario de ladrillo aparece y desaparece entre los tejados y sirve de referencia para orientarse en el pueblo."},{"h":"El paisaje","t":"Velilla vive pegada al Cinca. Desde la iglesia, el barranco de los Planos, canalizado a su paso por el pueblo, baja hasta la acequia vieja entre árboles que dan sombra en verano.\n\nUn camino acondicionado sigue la orilla del río y se puede recorrer a pie o en bicicleta, entre vegetación de ribera y aves. Al final, el embarcadero del proyecto Entre Ríos de la Comarca permite acercarse al agua y descansar.\n\nMuy cerca de las piscinas municipales, el bar Calypso es una parada habitual para tomar algo durante el paseo."}],"en":[{"h":"History","t":"Velilla appears in documents from the early 12th century as a royal possession. In June 1252 James I handed the castle of Velilla to Ramón de Moncada, who in 1255 sold the place to the monastery of Abengania, in neighbouring Catalonia. At the beginning of the 17th century it still belonged to those friars.\n\nThe church of San Lorenzo reflects that long history: a building of Romanesque origin, altered in the Baroque period, with a tower finished in brick.\n\nThat an Aragonese village belonged for centuries to a monastery in Catalonia was not unusual in this strip along the Cinca and the Segre, where the boundaries of lordships did not coincide with those of kingdoms."},{"h":"What to see","t":"Start with the doorway, in the Baroque style, with decorated capitals. Then look up at the bell tower: the upper part, in brick, shows features of Mudéjar art, the tradition of Muslim master builders that lived on in Aragón for centuries.\n\nThe contrast between the stone of the base and the brick of the top is the best way to read the building: each material belongs to a period and a way of building.\n\nAs you leave the church, wander the nearby streets to see the tower from different angles: the brick bell tower appears and disappears among the rooftops and serves as a landmark for finding your way around the village."},{"h":"The landscape","t":"Velilla lives right beside the Cinca. From the church, the Planos ravine, channelled as it passes through the village, runs down to the old irrigation channel between trees that give shade in summer.\n\nA purpose-built path follows the riverbank and can be walked or cycled, among riverside vegetation and birds. At the end, the Comarca's Entre Ríos project landing stage lets you get close to the water and rest.\n\nVery close to the municipal swimming pools, Bar Calypso is a regular stop for a drink during the walk."}],"fr":[{"h":"Histoire","t":"Velilla apparaît dans les documents dès le début du XIIe siècle comme domaine royal. En juin 1252, Jacques Ier remit le château de Velilla à Ramón de Moncada, qui vendit en 1255 le lieu au monastère d'Abengania, dans la Catalogne voisine. Au début du XVIIe siècle, il appartenait toujours à ces religieux.\n\nL'église San Lorenzo reflète cette longue histoire : un édifice d'origine romane, remanié à l'époque baroque, avec une tour couronnée de brique.\n\nQu'un village aragonais ait appartenu pendant des siècles à un monastère situé en Catalogne n'avait rien d'exceptionnel dans cette frange du Cinca et du Segre, où les limites des seigneuries ne coïncidaient pas avec celles des royaumes."},{"h":"À voir","t":"Commencez par le portail, de style baroque, aux chapiteaux décorés. Levez ensuite les yeux vers le clocher : la partie haute, en brique, présente des traits de l'art mudéjar, la tradition des maîtres d'œuvre musulmans restée vivante en Aragon pendant des siècles.\n\nLe contraste entre la pierre de la base et la brique du sommet est la meilleure façon de lire l'édifice : chaque matériau correspond à une époque et à une manière de bâtir.\n\nEn sortant de l'église, parcourez les rues voisines pour voir la tour sous différents angles : le clocher de brique apparaît et disparaît entre les toits et sert de repère pour s'orienter dans le village."},{"h":"Le paysage","t":"Velilla vit collée au Cinca. Depuis l'église, le barranco de los Planos, canalisé à la traversée du village, descend jusqu'à l'acequia vieja entre des arbres qui donnent de l'ombre en été.\n\nUn chemin aménagé suit la rive et se parcourt à pied ou à vélo, au milieu de la végétation riveraine et des oiseaux. Au bout, l'embarcadère du projet Entre Ríos de la Comarca permet de s'approcher de l'eau et de se reposer.\n\nTout près des piscines municipales, le bar Calypso est une halte habituelle pour prendre un verre pendant la promenade."}],"de":[{"h":"Geschichte","t":"Velilla erscheint seit Anfang des 12. Jahrhunderts als königlicher Besitz in den Urkunden. Im Juni 1252 übergab Jakob I. die Burg von Velilla an Ramón de Moncada, der den Ort 1255 an das Kloster Abengania im benachbarten Katalonien verkaufte. Zu Beginn des 17. Jahrhunderts gehörte er noch immer diesen Mönchen.\n\nDie Kirche San Lorenzo spiegelt diese lange Geschichte wider: ein Bau romanischen Ursprungs, in der Barockzeit umgestaltet, mit einem Turm, der in Ziegel endet.\n\nDass ein aragonesisches Dorf jahrhundertelang einem Kloster in Katalonien gehörte, war in diesem Streifen an Cinca und Segre nicht ungewöhnlich, wo die Grenzen der Herrschaften nicht mit denen der Königreiche übereinstimmten."},{"h":"Sehenswert","t":"Beginnen Sie mit dem barocken Portal und seinen verzierten Kapitellen. Heben Sie dann den Blick zum Glockenturm: Der obere Teil aus Ziegel zeigt Züge der Mudéjar-Kunst, der Tradition muslimischer Baumeister, die in Aragón über Jahrhunderte lebendig blieb.\n\nDer Kontrast zwischen dem Stein des Sockels und dem Ziegel des Abschlusses ist der beste Schlüssel zum Gebäude: Jedes Material steht für eine Epoche und eine Bauweise.\n\nGehen Sie nach dem Besuch durch die umliegenden Gassen, um den Turm aus verschiedenen Blickwinkeln zu sehen: Der Ziegelturm taucht zwischen den Dächern auf und verschwindet wieder und dient als Orientierungspunkt im Dorf."},{"h":"Die Landschaft","t":"Velilla lebt dicht am Cinca. Von der Kirche aus führt der Barranco de los Planos, im Ortsbereich kanalisiert, zwischen schattenspendenden Bäumen hinunter zum alten Bewässerungskanal.\n\nEin angelegter Weg folgt dem Flussufer und lässt sich zu Fuß oder mit dem Fahrrad zwischen Ufervegetation und Vögeln zurücklegen. Am Ende ermöglicht die Anlegestelle des Projekts Entre Ríos der Comarca, ans Wasser zu gehen und auszuruhen.\n\nGanz in der Nähe der städtischen Schwimmbäder ist die Bar Calypso ein beliebter Halt für eine Erfrischung während des Spaziergangs."}],"pt":[{"h":"História","t":"Velilla aparece na documentação desde o início do século XII como lugar reguengo. Em junho de 1252 Jaime I entregou o castelo de Velilla a Ramón de Moncada, que em 1255 vendeu o lugar ao mosteiro de Abengania, na vizinha Catalunha. No início do século XVII continuava a pertencer a esses frades.\n\nA igreja de San Lorenzo reflete essa longa história: um edifício de origem românica, reformado na época barroca, com uma torre rematada em tijolo.\n\nQue uma povoação aragonesa tenha pertencido durante séculos a um mosteiro situado na Catalunha não era raro nesta faixa do Cinca e do Segre, onde as fronteiras dos senhorios não coincidiam com as dos reinos."},{"h":"O que ver","t":"Comece pelo portal, de estilo barroco, com capitéis decorados. Depois levante o olhar para o campanário: a parte alta, de tijolo, mostra traços da arte mudéjar, a tradição dos mestres de obras muçulmanos que se manteve viva em Aragão durante séculos.\n\nO contraste entre a pedra da base e o tijolo do remate é a melhor forma de ler o edifício: cada material corresponde a uma época e a uma maneira de construir.\n\nAo sair da igreja, percorra as ruas próximas para ver a torre de diferentes ângulos: o campanário de tijolo aparece e desaparece entre os telhados e serve de referência para se orientar na povoação."},{"h":"A paisagem","t":"Velilla vive colada ao Cinca. A partir da igreja, o barranco de los Planos, canalizado na sua passagem pela povoação, desce até à acequia vieja (levada velha) entre árvores que dão sombra no verão.\n\nUm caminho preparado segue a margem do rio e pode ser percorrido a pé ou de bicicleta, entre vegetação ribeirinha e aves. No fim, o cais do projeto Entre Ríos da Comarca permite aproximar-se da água e descansar.\n\nMuito perto das piscinas municipais, o bar Calypso é uma paragem habitual para tomar alguma coisa durante o passeio."}]},"status":"pending"},{"id":"puente-ballobar","town":"Ballobar","cat":"patrimonio","lat":41.61827,"lon":0.19419,"coord_src":null,"q":["Puente viejo de Ballobar","Puente medieval, Ballobar"],"fq":["Ballobar puente","Puente de Ballobar Alcanadre","Ballobar Huesca"],"name":{"es":"Puente viejo de Ballobar","en":"Puente viejo de Ballobar (Ballobar Old Bridge)","fr":"Puente viejo de Ballobar (vieux pont)","de":"Alte Brücke von Ballobar","pt":"Ponte velha de Ballobar"},"when":{"es":"Origen romano, rehecho hacia 1300 · Puente","en":"Roman origin, rebuilt around 1300 · Bridge","fr":"Origine romaine, refait vers 1300 · Pont","de":"Römischer Ursprung, um 1300 erneuert · Brücke","pt":"Origem romana, refeita c. 1300 · Ponte"},"desc":{"es":"Un puente de piedra sobre el Alcanadre, de origen romano y rehecho hacia 1300. Durante siglos fue de pago y lo mantenía una cofradía; hoy se cruza libremente.","en":"A stone bridge over the Alcanadre, of Roman origin and rebuilt around 1300. For centuries it was a toll bridge maintained by a confraternity; today it can be crossed freely.","fr":"Un pont de pierre sur l'Alcanadre, d'origine romaine et refait vers 1300. Pendant des siècles, il fut payant et entretenu par une confrérie ; aujourd'hui, on le traverse librement.","de":"Eine Steinbrücke über den Alcanadre, römischen Ursprungs und um 1300 erneuert. Jahrhundertelang war sie gebührenpflichtig und wurde von einer Bruderschaft unterhalten; heute überquert man sie frei.","pt":"Uma ponte de pedra sobre o Alcanadre, de origem romana e refeita por volta de 1300. Durante séculos foi paga e mantida por uma confraria; hoje atravessa-se livremente."},"visit":{"es":"Está en el mismo pueblo, junto al embarcadero de la Comarca. Se cruza a pie; calcula media hora con un paseo por el casco.","en":"It is in the village itself, next to the Comarca's landing stage. Cross on foot; allow half an hour including a stroll through the old centre.","fr":"Il se trouve dans le village même, près de l'embarcadère de la Comarca. Il se traverse à pied ; comptez une demi-heure avec une promenade dans le vieux centre.","de":"Sie liegt mitten im Ort, neben der Anlegestelle der Comarca. Man überquert sie zu Fuß; rechnen Sie mit einer halben Stunde einschließlich Spaziergang durch den Ortskern.","pt":"Fica na própria povoação, junto ao cais da Comarca. Atravessa-se a pé; conte com meia hora com um passeio pelo centro."},"src":"https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5486868","sources":["https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5486868","https://es.hispanopedia.com/wiki/Ballobar","https://es.wikipedia.org/wiki/Bajo_Cinca"],"art":{"es":[{"h":"Historia","t":"El puente tiene origen romano y fue reconstruido en gran parte hacia el año 1300, reutilizando piedras almohadilladas del puente antiguo. Hasta finales del siglo XIX tuvo una pequeña capilla a la salida.\n\nCruzar costaba dinero: una cofradía cobraba el peaje y con él mantenía el puente. El Diccionario de Pascual Madoz, a mediados del siglo XIX, lo describe con cuatro arcos y pegado a los edificios del pueblo.\n\nEl puente era el paso obligado entre las dos orillas del Alcanadre en el camino que unía la ribera del Cinca con las tierras del oeste. Por eso se cuidó durante siglos y por eso valía la pena cobrar por cruzarlo."},{"h":"Qué ver","t":"Cruza despacio y busca en los sillares las piedras almohadilladas, con el borde rebajado y el centro abultado: son la firma de la obra romana reaprovechada. Mira también la forma de los arcos y los tajamares que cortan la corriente.\n\nDesde el embarcadero, construido con el programa Entre Ríos de la Comarca, se tiene la mejor vista del puente con el pueblo detrás.\n\nDespués de cruzar, sube por las calles del casco hacia la iglesia de la Asunción, con su ábside románico, y, si tienes fuerzas, hasta El Castillazo y la ermita de San Juan. En septiembre, Ballobar celebra además un mercadillo medieval."},{"h":"Curiosidades","t":"La palabra latina pontifex, que acabó designando a los sacerdotes y al papa, significa literalmente «el que hace puentes». Para los romanos, levantar un puente tenía algo de sagrado, y la capilla que hubo a la salida de este mantuvo esa idea hasta el siglo XIX.\n\nEn la calle del Horno, la antigua taberna del pueblo fue escenario de la película Golpe de mano (1969), de José Antonio de la Loma. Y en el barranco de las Hechiceras, cerca del pueblo, hay cistas y restos de casas de piedra, con una larga tradición de historias de brujas y curanderos."}],"en":[{"h":"History","t":"The bridge is of Roman origin and was largely rebuilt around the year 1300, reusing rusticated stones from the old bridge. Until the end of the 19th century it had a small chapel at its far end.\n\nCrossing cost money: a confraternity collected the toll and used it to maintain the bridge. Pascual Madoz's Dictionary, in the mid-19th century, describes it as having four arches and adjoining the village buildings.\n\nThe bridge was the obligatory crossing between the two banks of the Alcanadre on the road linking the Cinca riverside with the lands to the west. That is why it was cared for over the centuries, and why it was worth charging to cross it."},{"h":"What to see","t":"Cross slowly and look among the ashlar blocks for the rusticated stones, with their recessed edges and bulging centres: they are the signature of the reused Roman work. Look too at the shape of the arches and the cutwaters that break the current.\n\nFrom the landing stage, built under the Comarca's Entre Ríos programme, you get the best view of the bridge with the village behind it.\n\nAfter crossing, walk up through the streets of the old centre to the church of La Asunción, with its Romanesque apse, and, if you have the energy, up to El Castillazo and the hermitage of San Juan. In September Ballobar also holds a medieval market."},{"h":"Did you know?","t":"The Latin word pontifex, which came to mean priests and the Pope, literally means «bridge-maker». For the Romans, building a bridge had something sacred about it, and the chapel that once stood at the end of this one kept that idea alive until the 19th century.\n\nOn Calle del Horno, the village's old tavern was a location for the film Golpe de mano (1969), by José Antonio de la Loma. And in the Hechiceras (Sorceresses') ravine, near the village, there are stone cists and the remains of stone houses, with a long tradition of tales of witches and healers."}],"fr":[{"h":"Histoire","t":"Le pont est d'origine romaine et fut en grande partie reconstruit vers l'an 1300, en réutilisant des pierres à bossage de l'ancien pont. Jusqu'à la fin du XIXe siècle, une petite chapelle se dressait à sa sortie.\n\nTraverser coûtait de l'argent : une confrérie percevait le péage et l'utilisait pour entretenir le pont. Le Dictionnaire de Pascual Madoz, au milieu du XIXe siècle, le décrit avec quatre arches et accolé aux bâtiments du village.\n\nLe pont était le passage obligé entre les deux rives de l'Alcanadre sur le chemin qui reliait la rive du Cinca aux terres de l'ouest. C'est pourquoi on l'entretint pendant des siècles, et c'est pourquoi il valait la peine de faire payer sa traversée."},{"h":"À voir","t":"Traversez lentement et cherchez dans l'appareil les pierres à bossage, au bord ravalé et au centre bombé : c'est la signature de l'ouvrage romain réutilisé. Regardez aussi la forme des arches et les avant-becs qui fendent le courant.\n\nDepuis l'embarcadère, construit dans le cadre du programme Entre Ríos de la Comarca, on a la plus belle vue sur le pont avec le village en arrière-plan.\n\nAprès avoir traversé, montez par les rues du vieux centre vers l'église de l'Asunción, avec son abside romane, et, si vous en avez la force, jusqu'à El Castillazo et l'ermitage de San Juan. En septembre, Ballobar accueille en outre un marché médiéval."},{"h":"Le saviez-vous ?","t":"Le mot latin pontifex, qui finit par désigner les prêtres et le pape, signifie littéralement « celui qui fait les ponts ». Pour les Romains, construire un pont avait quelque chose de sacré, et la chapelle qui se trouvait à la sortie de celui-ci perpétua cette idée jusqu'au XIXe siècle.\n\nCalle del Horno, l'ancienne taverne du village servit de décor au film Golpe de mano (1969), de José Antonio de la Loma. Et dans le barranco de las Hechiceras (ravin des Sorcières), près du village, se trouvent des cistes et des vestiges de maisons de pierre, associés à une longue tradition d'histoires de sorcières et de guérisseurs."}],"de":[{"h":"Geschichte","t":"Die Brücke ist römischen Ursprungs und wurde um das Jahr 1300 großenteils neu gebaut, wobei Bossenquader der antiken Brücke wiederverwendet wurden. Bis Ende des 19. Jahrhunderts stand an ihrem Ende eine kleine Kapelle.\n\nDie Überquerung kostete Geld: Eine Bruderschaft erhob den Brückenzoll und unterhielt damit die Brücke. Das Wörterbuch von Pascual Madoz beschreibt sie Mitte des 19. Jahrhunderts mit vier Bögen und dicht an die Gebäude des Dorfes angebaut.\n\nDie Brücke war der unumgängliche Übergang zwischen den beiden Ufern des Alcanadre auf dem Weg, der die Aue des Cinca mit den Ländereien im Westen verband. Deshalb wurde sie jahrhundertelang gepflegt, und deshalb lohnte es sich, für die Überquerung Zoll zu verlangen."},{"h":"Sehenswert","t":"Gehen Sie langsam hinüber und suchen Sie zwischen den Quadern die Bossensteine mit abgesetztem Rand und gewölbter Mitte: Sie sind die Handschrift des wiederverwendeten römischen Bauwerks. Achten Sie auch auf die Form der Bögen und auf die Wellenbrecher, die die Strömung teilen.\n\nVon der Anlegestelle aus, die mit dem Programm Entre Ríos der Comarca gebaut wurde, hat man den schönsten Blick auf die Brücke mit dem Dorf dahinter.\n\nGehen Sie nach der Überquerung durch die Gassen des Ortskerns hinauf zur Kirche de la Asunción mit ihrer romanischen Apsis und, wenn die Kräfte reichen, bis zum Castillazo und zur Einsiedelei San Juan. Im September veranstaltet Ballobar außerdem einen mittelalterlichen Markt."},{"h":"Wissenswertes","t":"Das lateinische Wort pontifex, das schließlich die Priester und den Papst bezeichnete, bedeutet wörtlich „Brückenbauer“. Für die Römer hatte der Bau einer Brücke etwas Heiliges, und die Kapelle am Ende dieser Brücke hielt diese Vorstellung bis ins 19. Jahrhundert lebendig.\n\nIn der Calle del Horno war die alte Dorfschenke Drehort des Films Golpe de mano (1969) von José Antonio de la Loma. Und im Barranco de las Hechiceras (Schlucht der Zauberinnen) nahe dem Dorf gibt es Steinkisten und Reste von Steinhäusern, um die sich eine lange Tradition von Geschichten über Hexen und Heiler rankt."}],"pt":[{"h":"História","t":"A ponte tem origem romana e foi reconstruída em grande parte por volta do ano 1300, reutilizando pedras almofadadas da ponte antiga. Até finais do século XIX teve uma pequena capela à saída.\n\nAtravessar custava dinheiro: uma confraria cobrava a portagem e com ela mantinha a ponte. O Diccionario de Pascual Madoz, em meados do século XIX, descreve-a com quatro arcos e colada aos edifícios da povoação.\n\nA ponte era a passagem obrigatória entre as duas margens do Alcanadre no caminho que ligava a ribeira do Cinca às terras do oeste. Por isso foi cuidada durante séculos, e por isso valia a pena cobrar pela travessia."},{"h":"O que ver","t":"Atravesse devagar e procure nos silhares as pedras almofadadas, com a borda rebaixada e o centro saliente: são a assinatura da obra romana reaproveitada. Observe também a forma dos arcos e os talha-mares que cortam a corrente.\n\nDo cais, construído com o programa Entre Ríos da Comarca, tem-se a melhor vista da ponte com a povoação por trás.\n\nDepois de atravessar, suba pelas ruas do centro até à igreja da Asunción, com a sua abside românica, e, se tiver forças, até El Castillazo e à ermida de San Juan. Em setembro, Ballobar celebra ainda um mercado medieval."},{"h":"Curiosidades","t":"A palavra latina pontifex, que acabou por designar os sacerdotes e o papa, significa literalmente «aquele que faz pontes». Para os romanos, erguer uma ponte tinha algo de sagrado, e a capela que existiu à saída desta manteve essa ideia até ao século XIX.\n\nNa calle del Horno, a antiga taberna da povoação foi cenário do filme Golpe de mano (1969), de José Antonio de la Loma. E no barranco de las Hechiceras, perto da povoação, há cistas e restos de casas de pedra, com uma longa tradição de histórias de bruxas e curandeiros."}]},"status":"pending"},{"id":"iglesia-ballobar","town":"Ballobar","cat":"patrimonio","lat":41.62208,"lon":0.19123,"coord_src":null,"q":["Iglesia de la Asunción, Ballobar","Iglesia parroquial, Ballobar"],"fq":["Ballobar iglesia","Iglesia de la Asunción Ballobar","Ballobar"],"name":{"es":"Iglesia de la Asunción y ermita de Loreto","en":"Iglesia de la Asunción and the Ermita de Loreto","fr":"Iglesia de la Asunción et ermitage de Loreto","de":"Iglesia de la Asunción und Ermita de Loreto","pt":"Igreja da Asunción e ermida de Loreto"},"when":{"es":"Siglo XII · Románico-gótico","en":"12th century · Romanesque-Gothic","fr":"XIIe siècle · Roman-gothique","de":"12. Jh. · Romanik und Gotik","pt":"Século XII · Românico-gótico"},"desc":{"es":"Una iglesia de una sola nave con ábside románico del siglo XII orientado al este, en lo alto del casco de Ballobar. Más abajo, dentro del pueblo, la pequeña ermita de Loreto.","en":"A single-nave church with an east-facing 12th-century Romanesque apse, at the top of Ballobar's old centre. Further down, within the village, is the small hermitage of Loreto.","fr":"Une église à nef unique avec une abside romane du XIIe siècle orientée à l'est, au sommet du vieux Ballobar. Plus bas, dans le village, le petit ermitage de Loreto.","de":"Eine einschiffige Kirche mit nach Osten ausgerichteter romanischer Apsis aus dem 12. Jahrhundert, hoch oben im Ortskern von Ballobar. Weiter unten, mitten im Dorf, liegt die kleine Einsiedelei de Loreto.","pt":"Uma igreja de nave única com abside românica do século XII orientada a leste, no alto do centro de Ballobar. Mais abaixo, dentro da povoação, a pequena ermida de Loreto."},"visit":{"es":"Se sube a pie desde el puente por las calles del casco. El exterior se ve libremente; el interior en horario de culto. Calcula 30 minutos y sigue después hacia El Castillazo y la ermita de San Juan.","en":"Walk up from the bridge through the streets of the old centre. The exterior can be seen freely; the interior during services. Allow 30 minutes, then carry on towards El Castillazo and the hermitage of San Juan.","fr":"On y monte à pied depuis le pont par les rues du vieux centre. L'extérieur se voit librement ; l'intérieur pendant les offices. Comptez 30 minutes, puis continuez vers El Castillazo et l'ermitage de San Juan.","de":"Man steigt zu Fuß von der Brücke durch die Gassen des Ortskerns hinauf. Von außen ist sie frei zu besichtigen, das Innere zu den Gottesdienstzeiten. Rechnen Sie mit 30 Minuten und gehen Sie danach weiter zum Castillazo und zur Einsiedelei San Juan.","pt":"Sobe-se a pé a partir da ponte pelas ruas do centro. O exterior vê-se livremente; o interior no horário de culto. Conte com 30 minutos e siga depois para El Castillazo e a ermida de San Juan."},"src":"https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5486868","sources":["https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5486868","https://es.hispanopedia.com/wiki/Ballobar","https://www.festivalesdeespana.com/festival/fiestas-mayores-de-ballobar-asuncion-y-san-roque-ballobar"],"art":{"es":[{"h":"Historia","t":"La parroquia de Nuestra Señora de la Asunción es de estilo románico-gótico. Su parte más antigua es el ábside, románico del siglo XII, orientado al este como manda la tradición cristiana, hacia el lugar por donde sale el sol.\n\nEl resto del templo se fue completando con arcos apuntados, ya en época gótica. Es una iglesia sobria, sin grandes adornos, que muestra cómo se construía en los pueblos de la ribera en los siglos posteriores a la conquista.\n\nBallobar creció a la sombra de su cerro, entre el río y la ladera, y la iglesia se levantó en la parte alta del casco, cerca de los restos de El Castillazo, el torreón que defendía a los primeros pobladores cristianos."},{"h":"Qué ver","t":"La iglesia tiene una sola nave, cruzada por arcos fajones apuntados que nacen directamente de los muros, sin columnas ni capiteles. Esa sencillez deja ver bien la estructura.\n\nRodéala por fuera para ver el ábside semicircular. Dentro del casco, la ermita de Nuestra Señora de Loreto tenía una función práctica: en el siglo XVII se decía allí la misa de las once de los domingos, para que los vecinos del barrio no tuvieran que subir hasta la parroquia.\n\nAl bajar de la iglesia hacia el puente, pasa por la calle del Horno, donde la antigua taberna del pueblo sirvió de escenario para la película Golpe de mano, rodada en 1969.\n\nEs una buena primera parada en el pueblo antes de subir a la ermita de San Juan."},{"h":"Tradiciones y fiestas","t":"Las fiestas mayores de Ballobar, en torno al 15 y 16 de agosto, honran a la Asunción, titular de esta iglesia, y a San Roque, con procesión, comidas populares, orquestas y charangas. A finales de agosto se celebra además la Degollación del Bautista, ligada a la ermita de San Juan.\n\nEl lunes de Pascua todo el pueblo sube en romería a la ermita de San Roque, a unos 15 kilómetros, para cumplir el voto que hicieron los antepasados en tiempos de peste."}],"en":[{"h":"History","t":"The parish church of Nuestra Señora de la Asunción (Our Lady of the Assumption) is in the Romanesque-Gothic style. Its oldest part is the apse, 12th-century Romanesque, facing east as Christian tradition requires, towards the sunrise.\n\nThe rest of the church was completed with pointed arches, in the Gothic period. It is a sober church, without great ornament, which shows how people built in the riverside villages in the centuries after the conquest.\n\nBallobar grew up in the shadow of its hill, between the river and the slope, and the church was built in the upper part of the old centre, near the remains of El Castillazo, the tower that defended the first Christian settlers."},{"h":"What to see","t":"The church has a single nave, crossed by pointed transverse arches that spring directly from the walls, without columns or capitals. That simplicity lets you see the structure clearly.\n\nWalk round the outside to see the semicircular apse. Within the old centre, the hermitage of Nuestra Señora de Loreto had a practical purpose: in the 17th century the eleven o'clock Sunday mass was said there, so that the people of that neighbourhood did not have to climb up to the parish church.\n\nAs you go down from the church towards the bridge, pass along Calle del Horno, where the village's old tavern served as a location for the film Golpe de mano, shot in 1969.\n\nIt is a good first stop in the village before climbing up to the hermitage of San Juan."},{"h":"Traditions and festivals","t":"Ballobar's main festivities, around 15 and 16 August, honour the Assumption, to whom this church is dedicated, and San Roque, with a procession, communal meals, dance bands and brass bands. At the end of August the Beheading of St John the Baptist is also celebrated, linked to the hermitage of San Juan.\n\nOn Easter Monday the whole village goes on pilgrimage to the hermitage of San Roque, about 15 kilometres away, to fulfil the vow their ancestors made in times of plague."}],"fr":[{"h":"Histoire","t":"L'église paroissiale Nuestra Señora de la Asunción est de style roman-gothique. Sa partie la plus ancienne est l'abside, romane du XIIe siècle, orientée à l'est comme le veut la tradition chrétienne, vers le soleil levant.\n\nLe reste de l'édifice fut complété avec des arcs brisés, à l'époque gothique. C'est une église sobre, sans grande ornementation, qui montre comment on bâtissait dans les villages de la rive au cours des siècles qui suivirent la conquête.\n\nBallobar a grandi à l'ombre de sa colline, entre la rivière et le versant, et l'église fut élevée dans la partie haute du village, près des vestiges d'El Castillazo, la grosse tour qui défendait les premiers habitants chrétiens."},{"h":"À voir","t":"L'église compte une seule nef, rythmée par des arcs-doubleaux brisés qui naissent directement des murs, sans colonnes ni chapiteaux. Cette simplicité laisse bien voir la structure.\n\nFaites-en le tour par l'extérieur pour voir l'abside semi-circulaire. Dans le vieux centre, l'ermitage de Nuestra Señora de Loreto avait une fonction pratique : au XVIIe siècle, on y disait la messe de onze heures le dimanche, pour éviter aux habitants du quartier de monter jusqu'à l'église paroissiale.\n\nEn redescendant de l'église vers le pont, passez par la calle del Horno, où l'ancienne taverne du village servit de décor au film Golpe de mano, tourné en 1969.\n\nC'est une bonne première étape dans le village avant de monter à l'ermitage de San Juan."},{"h":"Traditions et fêtes","t":"Les fêtes majeures de Ballobar, autour des 15 et 16 août, honorent l'Assomption, titulaire de cette église, et saint Roch, avec procession, repas populaires, orchestres et fanfares. Fin août, on célèbre en outre la Décollation de saint Jean-Baptiste, liée à l'ermitage de San Juan.\n\nLe lundi de Pâques, tout le village monte en pèlerinage à l'ermitage de San Roque, à une quinzaine de kilomètres, pour accomplir le vœu fait par les ancêtres au temps de la peste."}],"de":[{"h":"Geschichte","t":"Die Pfarrkirche Nuestra Señora de la Asunción ist romanisch-gotisch. Ihr ältester Teil ist die romanische Apsis aus dem 12. Jahrhundert, nach christlicher Tradition nach Osten ausgerichtet, dorthin, wo die Sonne aufgeht.\n\nDer Rest der Kirche wurde in gotischer Zeit mit Spitzbögen ergänzt. Es ist eine schlichte Kirche ohne großen Schmuck, die zeigt, wie in den Jahrhunderten nach der Eroberung in den Dörfern am Fluss gebaut wurde.\n\nBallobar wuchs im Schutz seines Hügels zwischen Fluss und Hang, und die Kirche entstand im oberen Teil des Ortskerns, nahe den Resten des Castillazo, des Wehrturms, der die ersten christlichen Siedler schützte."},{"h":"Sehenswert","t":"Die Kirche hat ein einziges Schiff, das von spitzbogigen Gurtbögen überspannt wird, die direkt aus den Mauern wachsen, ohne Säulen oder Kapitelle. Diese Schlichtheit lässt die Konstruktion gut erkennen.\n\nGehen Sie außen herum, um die halbrunde Apsis zu sehen. Im Ortskern hatte die Einsiedelei Nuestra Señora de Loreto eine praktische Aufgabe: Im 17. Jahrhundert wurde dort sonntags die Elf-Uhr-Messe gelesen, damit die Bewohner des Viertels nicht bis zur Pfarrkirche hinaufsteigen mussten.\n\nGehen Sie auf dem Weg von der Kirche hinunter zur Brücke durch die Calle del Horno, wo die alte Dorfschenke als Drehort des 1969 gedrehten Films Golpe de mano diente.\n\nSie ist ein guter erster Halt im Dorf, bevor Sie zur Einsiedelei San Juan hinaufsteigen."},{"h":"Feste und Traditionen","t":"Die großen Feste von Ballobar um den 15. und 16. August ehren Mariä Himmelfahrt, die Patronin dieser Kirche, und San Roque, mit Prozession, gemeinsamen Mahlzeiten, Orchestern und Blaskapellen. Ende August wird außerdem die Enthauptung Johannes des Täufers gefeiert, die mit der Einsiedelei San Juan verbunden ist.\n\nAm Ostermontag zieht das ganze Dorf in einer Wallfahrt zur rund 15 Kilometer entfernten Einsiedelei San Roque, um das Gelübde zu erfüllen, das die Vorfahren in Pestzeiten ablegten."}],"pt":[{"h":"História","t":"A paróquia de Nuestra Señora de la Asunción é de estilo românico-gótico. A sua parte mais antiga é a abside, românica do século XII, orientada a leste como manda a tradição cristã, para o lugar onde nasce o sol.\n\nO resto do templo foi sendo completado com arcos ogivais, já na época gótica. É uma igreja sóbria, sem grandes ornamentos, que mostra como se construía nas povoações da ribeira nos séculos posteriores à conquista.\n\nBallobar cresceu à sombra do seu cerro, entre o rio e a encosta, e a igreja foi erguida na parte alta do centro, perto dos restos de El Castillazo, o torreão que defendia os primeiros povoadores cristãos."},{"h":"O que ver","t":"A igreja tem uma só nave, atravessada por arcos torais ogivais que nascem diretamente das paredes, sem colunas nem capitéis. Essa simplicidade deixa ver bem a estrutura.\n\nContorne-a por fora para ver a abside semicircular. Dentro do centro, a ermida de Nuestra Señora de Loreto tinha uma função prática: no século XVII dizia-se ali a missa das onze aos domingos, para que os habitantes do bairro não tivessem de subir até à igreja paroquial.\n\nAo descer da igreja em direção à ponte, passe pela calle del Horno, onde a antiga taberna da povoação serviu de cenário ao filme Golpe de mano, rodado em 1969.\n\nÉ uma boa primeira paragem na povoação antes de subir à ermida de San Juan."},{"h":"Tradições e festas","t":"As festas maiores de Ballobar, por volta de 15 e 16 de agosto, honram a Assunção, titular desta igreja, e São Roque, com procissão, refeições populares, orquestras e charangas. No final de agosto celebra-se ainda a Degolação do Batista, ligada à ermida de San Juan.\n\nNa segunda-feira de Páscoa, toda a povoação sobe em romaria à ermida de San Roque, a cerca de 15 quilómetros, para cumprir o voto feito pelos antepassados em tempos de peste."}]},"status":"pending"},{"id":"san-juan-ballobar","town":"Ballobar","cat":"arqueologia","lat":41.62347,"lon":0.19399,"coord_src":null,"q":["Ermita de San Juan, Ballobar","El Castillazo, Ballobar"],"fq":["Ermita de San Juan Ballobar","Ballobar ermita","Ballobar vista"],"name":{"es":"Ermita de San Juan y El Castillazo","en":"Ermita de San Juan and El Castillazo","fr":"Ermitage de San Juan et El Castillazo","de":"Ermita de San Juan und El Castillazo","pt":"Ermida de San Juan e El Castillazo"},"when":{"es":"Fortaleza antigua y torre medieval · Mirador","en":"Ancient fortress and medieval tower · Viewpoint","fr":"Forteresse antique et tour médiévale · Belvédère","de":"Antike Festung und Wehrturm · Aussichtspunkt","pt":"Fortaleza antiga e torre medieval · Miradouro"},"desc":{"es":"Por encima de la iglesia de Ballobar quedan los restos de El Castillazo, un gran torreón medieval, y en lo alto la ermita de San Juan, sobre una antigua fortaleza. Desde arriba se ve el encuentro del Alcanadre con la vega del Cinca.","en":"Above Ballobar's church stand the remains of El Castillazo, a large medieval tower, and at the top the hermitage of San Juan, on an old fortress. From up here you can see the Alcanadre meeting the Cinca floodplain.","fr":"Au-dessus de l'église de Ballobar subsistent les vestiges d'El Castillazo, une grande tour médiévale, et au sommet l'ermitage de San Juan, sur une ancienne forteresse. D'en haut, on voit l'Alcanadre rejoindre la plaine du Cinca.","de":"Oberhalb der Kirche von Ballobar liegen die Reste des Castillazo, eines großen mittelalterlichen Wehrturms, und ganz oben die Einsiedelei San Juan auf einer alten Festung. Von oben sieht man, wie der Alcanadre auf die Aue des Cinca trifft.","pt":"Acima da igreja de Ballobar restam os vestígios de El Castillazo, um grande torreão medieval, e no alto a ermida de San Juan, sobre uma antiga fortaleza. Lá de cima vê-se o encontro do Alcanadre com a várzea do Cinca."},"visit":{"es":"Se sube a pie desde la iglesia por la ladera. Los restos y la ermita se ven por fuera; el camino tiene pendiente, así que lleva calzado cómodo. Calcula una hora ida y vuelta.","en":"Walk up the hillside from the church. The remains and the hermitage can be seen from outside; the path is steep, so wear comfortable shoes. Allow an hour there and back.","fr":"On y monte à pied depuis l'église par le versant. Les vestiges et l'ermitage se voient de l'extérieur ; le chemin est en pente, prévoyez donc des chaussures confortables. Comptez une heure aller-retour.","de":"Man steigt zu Fuß von der Kirche den Hang hinauf. Reste und Einsiedelei sind von außen zu sehen; der Weg ist steil, tragen Sie also bequeme Schuhe. Rechnen Sie mit einer Stunde hin und zurück.","pt":"Sobe-se a pé a partir da igreja pela encosta. Os vestígios e a ermida veem-se por fora; o caminho é inclinado, por isso leve calçado confortável. Conte com uma hora ida e volta."},"src":"https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5486868","sources":["https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5486868","https://es.hispanopedia.com/wiki/Ballobar"],"art":{"es":[{"h":"Historia","t":"En la ladera, encima de la iglesia y en dirección a la ermita, están los restos de El Castillazo, un macizo torreón medieval que defendía a los primeros pobladores asentados junto al río.\n\nMás arriba, en lo alto de la montaña que cobija el pueblo, la ermita de San Juan ocupa el lugar de una antigua fortaleza que la tradición local considera romana. En el término hay además otros recuerdos defensivos, como La Forza, una llanura frente al Alcanadre donde existió la base de una gran fortaleza.\n\nEsa superposición de fortificaciones, desde la Antigüedad hasta la Edad Media, convierte la montaña de Ballobar en un pequeño resumen de la historia de la comarca: siempre hubo alguien que quiso vigilar el paso del río desde aquí.\n\nCerca del pueblo, en Valdragas y el barranco de las Hechiceras, hay cistas y restos de viviendas antiguas, más huellas de una ocupación muy antigua de estos cerros."},{"h":"El paisaje","t":"Las vistas desde la ermita son amplias: abajo, el pueblo y el puente viejo; enfrente, Chalamera y el Alcanadre; y hacia el este, la vega del Cinca. Los dos ríos se juntan a pocos kilómetros de aquí.\n\nEs fácil entender por qué se fortificó este cerro en distintas épocas: domina los vados y los caminos que unían las dos orillas.\n\nLa subida se hace por la ladera, entre matorral y tierra seca. Ve temprano o al atardecer y lleva agua; el esfuerzo se compensa con la vista y con el silencio que se respira arriba."},{"h":"Tradiciones y fiestas","t":"La ermita está dedicada a San Juan Bautista, y a finales de agosto Ballobar celebra la Degollación del Bautista. En el término hay otras dos ermitas con mucha devoción: la de Loreto, dentro del pueblo, y la de San Roque, a unos 15 kilómetros, meta de la romería del lunes de Pascua.\n\nA la izquierda del barranco de la Vansalada, el parque de la Sierra, de finales de los años setenta, tiene merendero, columpios y un circuito de ejercicio para completar la excursión."}],"en":[{"h":"History","t":"On the hillside, above the church and on the way to the hermitage, are the remains of El Castillazo, a massive medieval tower that defended the first settlers who made their homes beside the river.\n\nHigher up, at the top of the mountain that shelters the village, the hermitage of San Juan stands on the site of an old fortress that local tradition considers Roman. The municipality has other reminders of its defences, such as La Forza, a plain facing the Alcanadre where the base of a large fortress once stood.\n\nThat layering of fortifications, from Antiquity to the Middle Ages, makes the Ballobar mountain a small summary of the comarca's history: there was always someone who wanted to watch over the river crossing from here.\n\nNear the village, at Valdragas and in the Hechiceras ravine, there are stone cists and the remains of ancient dwellings, further traces of the very early occupation of these hills."},{"h":"The landscape","t":"The views from the hermitage are wide: below, the village and the old bridge; opposite, Chalamera and the Alcanadre; and to the east, the Cinca floodplain. The two rivers meet a few kilometres from here.\n\nIt is easy to see why this hill was fortified in different periods: it commands the fords and the roads linking the two banks.\n\nThe climb goes up the hillside, through scrub and dry earth. Go early or at sunset and take water; the effort is rewarded by the view and the silence at the top."},{"h":"Traditions and festivals","t":"The hermitage is dedicated to St John the Baptist, and at the end of August Ballobar celebrates the Beheading of St John the Baptist. The municipality has two other much-loved hermitages: Loreto, within the village, and San Roque, about 15 kilometres away, the destination of the Easter Monday pilgrimage.\n\nTo the left of the Vansalada ravine, the Parque de la Sierra, dating from the late 1970s, has a picnic area, swings and a fitness trail to round off the outing."}],"fr":[{"h":"Histoire","t":"Sur le versant, au-dessus de l'église et en direction de l'ermitage, se trouvent les vestiges d'El Castillazo, une massive tour médiévale qui défendait les premiers habitants installés au bord de la rivière.\n\nPlus haut, au sommet de la montagne qui abrite le village, l'ermitage de San Juan occupe l'emplacement d'une ancienne forteresse que la tradition locale tient pour romaine. La commune conserve d'autres souvenirs défensifs, comme La Forza, une plaine face à l'Alcanadre où s'élevait la base d'une grande forteresse.\n\nCette superposition de fortifications, de l'Antiquité au Moyen Âge, fait de la montagne de Ballobar un petit résumé de l'histoire de la comarque : il y eut toujours quelqu'un pour vouloir surveiller d'ici le passage de la rivière.\n\nPrès du village, à Valdragas et dans le barranco de las Hechiceras, se trouvent des cistes et des vestiges d'habitations anciennes, autres traces d'une occupation très ancienne de ces collines."},{"h":"Le paysage","t":"La vue depuis l'ermitage est vaste : en bas, le village et le vieux pont ; en face, Chalamera et l'Alcanadre ; et vers l'est, la plaine du Cinca. Les deux rivières se rejoignent à quelques kilomètres d'ici.\n\nOn comprend aisément pourquoi cette colline fut fortifiée à différentes époques : elle domine les gués et les chemins qui reliaient les deux rives.\n\nLa montée se fait par le versant, entre broussailles et terre sèche. Partez tôt ou au coucher du soleil et emportez de l'eau ; l'effort est récompensé par la vue et par le silence qui règne là-haut."},{"h":"Traditions et fêtes","t":"L'ermitage est dédié à saint Jean-Baptiste, et fin août Ballobar célèbre la Décollation de saint Jean-Baptiste. La commune compte deux autres ermitages très vénérés : celui de Loreto, dans le village, et celui de San Roque, à une quinzaine de kilomètres, but du pèlerinage du lundi de Pâques.\n\nÀ gauche du barranco de la Vansalada, le parc de la Sierra, de la fin des années soixante-dix, dispose d'une aire de pique-nique, de balançoires et d'un parcours sportif pour compléter l'excursion."}],"de":[{"h":"Geschichte","t":"Am Hang oberhalb der Kirche, in Richtung Einsiedelei, liegen die Reste des Castillazo, eines massiven mittelalterlichen Wehrturms, der die ersten am Fluss ansässigen Siedler schützte.\n\nWeiter oben, auf dem Gipfel des Berges, der das Dorf schützt, steht die Einsiedelei San Juan an der Stelle einer alten Festung, die die örtliche Überlieferung für römisch hält. Im Gemeindegebiet gibt es weitere Spuren der Verteidigung, etwa La Forza, eine Ebene gegenüber dem Alcanadre, auf der das Fundament einer großen Festung lag.\n\nDiese Überlagerung von Befestigungen von der Antike bis zum Mittelalter macht den Berg von Ballobar zu einer kleinen Zusammenfassung der Geschichte der Comarca: Immer gab es jemanden, der von hier aus den Flussübergang überwachen wollte.\n\nNahe dem Dorf, in Valdragas und im Barranco de las Hechiceras, gibt es Steinkisten und Reste alter Behausungen, weitere Spuren einer sehr frühen Besiedlung dieser Hügel."},{"h":"Die Landschaft","t":"Die Aussicht von der Einsiedelei ist weit: unten das Dorf und die alte Brücke, gegenüber Chalamera und der Alcanadre und nach Osten die Aue des Cinca. Die beiden Flüsse vereinen sich wenige Kilometer von hier.\n\nMan versteht leicht, warum dieser Hügel in verschiedenen Epochen befestigt wurde: Er beherrscht die Furten und Wege, die beide Ufer verbanden.\n\nDer Aufstieg führt über den Hang durch Gestrüpp und trockene Erde. Gehen Sie früh oder bei Sonnenuntergang und nehmen Sie Wasser mit; die Mühe wird durch die Aussicht und die Stille dort oben belohnt."},{"h":"Feste und Traditionen","t":"Die Einsiedelei ist Johannes dem Täufer geweiht, und Ende August feiert Ballobar die Enthauptung des Täufers. Im Gemeindegebiet gibt es zwei weitere viel verehrte Einsiedeleien: die de Loreto im Dorf und die San Roque, etwa 15 Kilometer entfernt, Ziel der Wallfahrt am Ostermontag.\n\nLinks des Barranco de la Vansalada bietet der Parque de la Sierra aus den späten 1970er-Jahren Picknickplatz, Schaukeln und einen Trimm-dich-Pfad, um den Ausflug abzurunden."}],"pt":[{"h":"História","t":"Na encosta, acima da igreja e em direção à ermida, ficam os restos de El Castillazo, um maciço torreão medieval que defendia os primeiros povoadores instalados junto ao rio.\n\nMais acima, no alto do monte que abriga a povoação, a ermida de San Juan ocupa o lugar de uma antiga fortaleza que a tradição local considera romana. No concelho há ainda outras memórias defensivas, como La Forza, uma planície em frente ao Alcanadre onde existiu a base de uma grande fortaleza.\n\nEssa sobreposição de fortificações, desde a Antiguidade até à Idade Média, faz do monte de Ballobar um pequeno resumo da história da comarca: houve sempre alguém que quis vigiar daqui a passagem do rio.\n\nPerto da povoação, em Valdragas e no barranco de las Hechiceras, há cistas e restos de habitações antigas, mais marcas de uma ocupação muito antiga destes cerros."},{"h":"A paisagem","t":"As vistas da ermida são amplas: em baixo, a povoação e a ponte velha; em frente, Chalamera e o Alcanadre; e para leste, a várzea do Cinca. Os dois rios juntam-se a poucos quilómetros daqui.\n\nÉ fácil perceber porque este cerro foi fortificado em diferentes épocas: domina os vaus e os caminhos que uniam as duas margens.\n\nA subida faz-se pela encosta, entre mato e terra seca. Vá cedo ou ao entardecer e leve água; o esforço é compensado pela vista e pelo silêncio que se respira lá em cima."},{"h":"Tradições e festas","t":"A ermida é dedicada a São João Batista, e no final de agosto Ballobar celebra a Degolação do Batista. No concelho há outras duas ermidas de grande devoção: a de Loreto, dentro da povoação, e a de San Roque, a cerca de 15 quilómetros, destino da romaria de segunda-feira de Páscoa.\n\nÀ esquerda do barranco de la Vansalada, o parque de la Sierra, do final dos anos setenta, tem merendeiro, baloiços e um circuito de manutenção para completar a excursão."}]},"status":"pending"},{"id":"iglesia-belver","town":"Belver de Cinca","cat":"patrimonio","lat":41.68113,"lon":0.21609,"coord_src":null,"q":["Iglesia de la Asunción, Belver de Cinca","Iglesia parroquial, Belver de Cinca"],"fq":["Belver de Cinca iglesia","Iglesia de la Asunción Belver de Cinca","Belver de Cinca"],"name":{"es":"Iglesia de la Asunción de Belver","en":"Iglesia de la Asunción de Belver","fr":"Iglesia de la Asunción de Belver (église)","de":"Iglesia de la Asunción de Belver","pt":"Igreja da Asunción de Belver"},"when":{"es":"Siglo XVI · Gótico aragonés y Renacimiento","en":"16th century · Aragonese Gothic and Renaissance","fr":"XVIe siècle · Gothique aragonais et Renaissance","de":"16. Jh. · Aragonesische Gotik und Renaissance","pt":"Século XVI · Gótico aragonês e Renascimento"},"desc":{"es":"Una iglesia gótico-aragonesa del siglo XVI con portada renacentista de 1592 y una girola que no tiene otra iglesia de la comarca.","en":"A 16th-century Aragonese Gothic church with a Renaissance doorway from 1592 and an ambulatory found in no other church in the comarca.","fr":"Une église de style gothique aragonais du XVIe siècle, avec un portail Renaissance de 1592 et un déambulatoire qu'aucune autre église de la comarque ne possède.","de":"Eine Kirche der aragonesischen Gotik aus dem 16. Jahrhundert mit einem Renaissanceportal von 1592 und einem Chorumgang, wie ihn keine andere Kirche der Comarca besitzt.","pt":"Uma igreja gótico-aragonesa do século XVI com portal renascentista de 1592 e uma charola que nenhuma outra igreja da comarca possui."},"visit":{"es":"Está en el centro de Belver. El exterior se ve en cualquier momento; el interior en horario de culto o con visita concertada en el Ayuntamiento. Calcula 45 minutos con el paseo por el casco.","en":"It is in the centre of Belver. The exterior can be seen at any time; the interior during services or on a visit arranged through the Town Council. Allow 45 minutes including a stroll through the old centre.","fr":"Elle se trouve au centre de Belver. L'extérieur se voit à tout moment ; l'intérieur pendant les offices ou sur rendez-vous auprès de la mairie. Comptez 45 minutes avec la promenade dans le vieux centre.","de":"Sie steht im Zentrum von Belver. Von außen ist sie jederzeit zu sehen, das Innere zu den Gottesdienstzeiten oder nach Vereinbarung mit dem Rathaus. Rechnen Sie mit 45 Minuten einschließlich Spaziergang durch den Ortskern.","pt":"Fica no centro de Belver. O exterior vê-se a qualquer momento; o interior no horário de culto ou com visita marcada na Câmara Municipal. Conte com 45 minutos com o passeio pelo centro."},"src":"https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5487832","sources":["https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5487832","https://es.hispanopedia.com/wiki/Belver_de_Cinca"],"art":{"es":[{"h":"Historia","t":"La parroquia, dedicada a la Asunción de Nuestra Señora, es un edificio gótico-aragonés del siglo XVI con muchas reformas posteriores. Tiene girola tras el presbiterio, cripta y coro.\n\nLa portada, renacentista de estilo plateresco, lleva la fecha de 1592 y medallones con San Pedro y San Pablo. Es lo primero que conviene mirar antes de entrar. En la restauración de 1997, según la historia local, se perdieron unos enterramientos medievales vinculados al pasado templario del pueblo.\n\nBelver tuvo en el siglo XIII un castillo de la orden del Temple, y la memoria templaria sigue muy presente en el pueblo: las mazmorras se conservan en una casa particular, la Casa Camilo."},{"h":"Qué ver","t":"Dentro, la nave única se cubre con bóveda estrellada y la girola, un pasillo que rodea la cabecera por detrás del altar, permite caminar alrededor del presbiterio. Es un recurso propio de grandes iglesias que en el Bajo Cinca solo tiene Belver.\n\nLa torre es cuadrada en sus dos primeros cuerpos y se vuelve octogonal en el tercero, con cuatro garitas en las esquinas y gárgolas; quedó sin terminar, como se aprecia en su remate.\n\nAntes de entrar, detente ante la portada de 1592: los medallones con San Pedro y San Pablo y la decoración plateresca, de inspiración italiana, muestran cómo llegaron las modas del Renacimiento a un pueblo de la ribera.\n\nAl salir, recorre las calles del casco para ver las casas solariegas de los siglos XVI al XVIII, con sus portadas de piedra y escudos."},{"h":"Tradiciones y fiestas","t":"Las fiestas de Belver honran a la titular de esta iglesia, la Asunción, el 15 de agosto, y a la Virgen del Pilar, el 12 de octubre.\n\nEl pueblo creció entre huertas y grandes fincas como Monte Julia, Valonga y San Miguel, donde trabajaba buena parte de los vecinos como jornaleros. Hoy son explotaciones agrícolas modernas, algunas dedicadas al vino. Muy cerca, el embarcadero del proyecto Entre Ríos permite bajar al Cinca."}],"en":[{"h":"History","t":"The parish church, dedicated to the Assumption of Our Lady, is a 16th-century Aragonese Gothic building with many later alterations. It has an ambulatory behind the presbytery, a crypt and a choir.\n\nThe doorway, Renaissance in the Plateresque style, bears the date 1592 and medallions with St Peter and St Paul. It is the first thing to look at before going in. During the 1997 restoration, according to local history, some medieval burials linked to the village's Templar past were lost.\n\nIn the 13th century Belver had a castle of the Order of the Temple, and the Templar memory is still very much alive in the village: its dungeons survive in a private house, Casa Camilo."},{"h":"What to see","t":"Inside, the single nave is covered by a star vault, and the ambulatory, a passage running round the east end behind the altar, lets you walk around the presbytery. It is a feature of great churches that, in the Bajo Cinca, only Belver has.\n\nThe tower is square in its first two stages and becomes octagonal in the third, with four corner turrets and gargoyles; it was left unfinished, as you can see from its top.\n\nBefore going in, pause in front of the 1592 doorway: the medallions with St Peter and St Paul and the Italian-inspired Plateresque decoration show how Renaissance fashions reached a riverside village.\n\nAs you leave, wander the streets of the old centre to see the ancestral houses from the 16th to the 18th centuries, with their stone doorways and coats of arms."},{"h":"Traditions and festivals","t":"Belver's festivals honour the patron of this church, the Assumption, on 15 August, and the Virgen del Pilar, on 12 October.\n\nThe village grew up among market gardens and large estates such as Monte Julia, Valonga and San Miguel, where many of its people worked as day labourers. Today they are modern farms, some of them devoted to wine. Close by, the Entre Ríos project landing stage lets you go down to the Cinca."}],"fr":[{"h":"Histoire","t":"L'église paroissiale, dédiée à l'Assomption de Notre-Dame, est un édifice de style gothique aragonais du XVIe siècle, maintes fois remanié par la suite. Elle possède un déambulatoire derrière le presbytère, une crypte et un chœur.\n\nLe portail, Renaissance de style plateresque, porte la date de 1592 et des médaillons figurant saint Pierre et saint Paul. C'est la première chose à regarder avant d'entrer. Lors de la restauration de 1997, selon l'histoire locale, on perdit des sépultures médiévales liées au passé templier du village.\n\nBelver eut au XIIIe siècle un château de l'ordre du Temple, et la mémoire templière reste très présente dans le village : les cachots sont conservés dans une maison particulière, la Casa Camilo."},{"h":"À voir","t":"À l'intérieur, la nef unique est couverte d'une voûte étoilée, et le déambulatoire, un passage qui contourne le chevet derrière l'autel, permet de faire le tour du presbytère. C'est un dispositif propre aux grandes églises que seule Belver possède dans le Bajo Cinca.\n\nLa tour est carrée sur ses deux premiers niveaux et devient octogonale au troisième, avec quatre échauguettes aux angles et des gargouilles ; elle est restée inachevée, comme le montre son sommet.\n\nAvant d'entrer, arrêtez-vous devant le portail de 1592 : les médaillons de saint Pierre et saint Paul et le décor plateresque, d'inspiration italienne, montrent comment les modes de la Renaissance arrivèrent dans un village de la rive.\n\nEn sortant, parcourez les rues du vieux centre pour voir les demeures seigneuriales des XVIe au XVIIIe siècles, avec leurs portails de pierre et leurs blasons."},{"h":"Traditions et fêtes","t":"Les fêtes de Belver honorent la titulaire de cette église, l'Assomption, le 15 août, et la Virgen del Pilar, le 12 octobre.\n\nLe village a grandi entre les huertas et de grands domaines comme Monte Julia, Valonga et San Miguel, où travaillait comme journaliers une bonne partie des habitants. Ce sont aujourd'hui des exploitations agricoles modernes, dont certaines sont consacrées au vin. Tout près, l'embarcadère du projet Entre Ríos permet de descendre au Cinca."}],"de":[{"h":"Geschichte","t":"Die Mariä Himmelfahrt geweihte Pfarrkirche ist ein Bau der aragonesischen Gotik aus dem 16. Jahrhundert mit vielen späteren Umbauten. Sie hat einen Chorumgang hinter dem Presbyterium, eine Krypta und einen Chor.\n\nDas Portal im plateresken Renaissancestil trägt die Jahreszahl 1592 und Medaillons mit den Heiligen Petrus und Paulus. Es ist das Erste, das man vor dem Eintreten betrachten sollte. Bei der Restaurierung von 1997 gingen laut Ortsgeschichte einige mittelalterliche Gräber verloren, die mit der Templervergangenheit des Dorfes in Verbindung standen.\n\nBelver besaß im 13. Jahrhundert eine Burg des Templerordens, und die Erinnerung an die Templer ist im Dorf sehr lebendig: Die Verliese sind in einem Privathaus erhalten, der Casa Camilo."},{"h":"Sehenswert","t":"Im Inneren wird das einzige Schiff von einem Sterngewölbe überdeckt, und der Chorumgang, ein Gang, der den Chorraum hinter dem Altar umläuft, erlaubt es, um das Presbyterium herumzugehen. Ein Element großer Kirchen, das im Bajo Cinca nur Belver besitzt.\n\nDer Turm ist in seinen beiden unteren Geschossen quadratisch und wird im dritten achteckig, mit vier Ecktürmchen und Wasserspeiern; er blieb unvollendet, wie man an seinem Abschluss erkennt.\n\nBleiben Sie vor dem Eintreten vor dem Portal von 1592 stehen: Die Medaillons mit Petrus und Paulus und der italienisch inspirierte platereske Schmuck zeigen, wie die Moden der Renaissance ein Dorf am Fluss erreichten.\n\nGehen Sie danach durch die Gassen des Ortskerns, um die Herrenhäuser aus dem 16. bis 18. Jahrhundert mit ihren Steinportalen und Wappen zu sehen."},{"h":"Feste und Traditionen","t":"Die Feste von Belver ehren die Patronin dieser Kirche, Mariä Himmelfahrt, am 15. August und die Virgen del Pilar am 12. Oktober.\n\nDas Dorf wuchs zwischen Gärten und großen Landgütern wie Monte Julia, Valonga und San Miguel, auf denen ein großer Teil der Einwohner als Tagelöhner arbeitete. Heute sind es moderne landwirtschaftliche Betriebe, einige davon dem Wein gewidmet. Ganz in der Nähe ermöglicht die Anlegestelle des Projekts Entre Ríos den Zugang zum Cinca."}],"pt":[{"h":"História","t":"A igreja paroquial, dedicada à Assunção de Nossa Senhora, é um edifício gótico-aragonês do século XVI com muitas reformas posteriores. Tem charola por trás do presbitério, cripta e coro.\n\nO portal, renascentista de estilo plateresco, ostenta a data de 1592 e medalhões com São Pedro e São Paulo. É a primeira coisa a observar antes de entrar. No restauro de 1997, segundo a história local, perderam-se uns enterramentos medievais ligados ao passado templário da povoação.\n\nBelver teve no século XIII um castelo da Ordem do Templo, e a memória templária continua muito presente na povoação: as masmorras conservam-se numa casa particular, a Casa Camilo."},{"h":"O que ver","t":"No interior, a nave única é coberta por abóbada estrelada e a charola, um corredor que rodeia a cabeceira por trás do altar, permite caminhar em volta do presbitério. É um recurso próprio de grandes igrejas que, no Bajo Cinca, só Belver tem.\n\nA torre é quadrada nos dois primeiros corpos e torna-se octogonal no terceiro, com quatro guaritas nos cantos e gárgulas; ficou por terminar, como se nota no seu remate.\n\nAntes de entrar, pare diante do portal de 1592: os medalhões com São Pedro e São Paulo e a decoração plateresca, de inspiração italiana, mostram como as modas do Renascimento chegaram a uma povoação da ribeira.\n\nÀ saída, percorra as ruas do centro para ver as casas senhoriais dos séculos XVI a XVIII, com os seus portais de pedra e brasões."},{"h":"Tradições e festas","t":"As festas de Belver honram a titular desta igreja, a Assunção, a 15 de agosto, e a Virgen del Pilar, a 12 de outubro.\n\nA povoação cresceu entre hortas e grandes herdades como Monte Julia, Valonga e San Miguel, onde boa parte dos habitantes trabalhava como jornaleiros. Hoje são explorações agrícolas modernas, algumas dedicadas ao vinho. Muito perto, o cais do projeto Entre Ríos permite descer ao Cinca."}]},"status":"pending"},{"id":"casas-belver","town":"Belver de Cinca","cat":"patrimonio","lat":41.68223,"lon":0.21719,"coord_src":null,"q":["Casa Prim, Belver de Cinca","Calle Mayor, Belver de Cinca"],"fq":["Belver de Cinca casas","Belver de Cinca casa solariega","Belver de Cinca calle"],"name":{"es":"Casas solariegas y mazmorras templarias","en":"Ancestral houses and Templar dungeons","fr":"Demeures seigneuriales et cachots templiers","de":"Herrenhäuser und Templerverliese","pt":"Casas senhoriais e masmorras templárias"},"when":{"es":"Siglos XIII-XVIII · Casas de piedra","en":"13th-18th centuries · Stone houses","fr":"XIIIe-XVIIIe siècles · Maisons de pierre","de":"13.–18. Jh. · Steinhäuser","pt":"Séculos XIII-XVIII · Casas de pedra"},"desc":{"es":"Grandes portadas de piedra, escudos y las mazmorras del castillo templario escondidas en una casa particular. El casco de Belver guarda casonas de los siglos XVI al XVIII entre calles tranquilas.","en":"Large stone doorways, coats of arms and the dungeons of the Templar castle hidden away in a private house. Belver's old centre preserves grand houses from the 16th to the 18th centuries along quiet streets.","fr":"De grands portails de pierre, des blasons et les cachots du château templier cachés dans une maison particulière. Le vieux Belver conserve de grandes demeures des XVIe au XVIIIe siècles dans des rues paisibles.","de":"Große Steinportale, Wappen und die Verliese der Templerburg, versteckt in einem Privathaus. Der Ortskern von Belver bewahrt Herrenhäuser aus dem 16. bis 18. Jahrhundert in ruhigen Gassen.","pt":"Grandes portais de pedra, brasões e as masmorras do castelo templário escondidas numa casa particular. O centro de Belver guarda casarões dos séculos XVI a XVIII entre ruas tranquilas."},"visit":{"es":"Se recorre a pie por fuera, libremente, en unos 45 minutos desde la iglesia. Son casas particulares: respeta la intimidad de los vecinos. Las mazmorras de Casa Camilo no son de visita pública.","en":"Explore the exteriors on foot, at your own pace, in about 45 minutes from the church. These are private homes: respect the residents' privacy. The dungeons at Casa Camilo are not open to the public.","fr":"La promenade se fait à pied, par l'extérieur, librement, en 45 minutes environ depuis l'église. Ce sont des maisons particulières : respectez l'intimité des habitants. Les cachots de la Casa Camilo ne se visitent pas.","de":"Man erkundet den Ortskern frei zu Fuß von außen, in etwa 45 Minuten ab der Kirche. Es sind Privathäuser: Respektieren Sie die Privatsphäre der Bewohner. Die Verliese der Casa Camilo sind nicht öffentlich zugänglich.","pt":"Percorre-se a pé por fora, livremente, em cerca de 45 minutos a partir da igreja. São casas particulares: respeite a privacidade dos habitantes. As masmorras da Casa Camilo não estão abertas ao público."},"src":"https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5487832","sources":["https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5487832","https://es.hispanopedia.com/wiki/Belver_de_Cinca"],"art":{"es":[{"h":"Historia","t":"Belver tuvo en el siglo XIII un castillo de la orden del Temple. Según el historiador Francisco Castillón, sus mazmorras sirvieron de prisión para caballeros de la orden tras la caída del castillo de Monzón en 1309, cuando el Temple fue disuelto. Hoy esas mazmorras se conservan dentro de la Casa Camilo.\n\nEn los siglos XVI y XVII, con la prosperidad agrícola, las familias acomodadas levantaron casas de estilo aragonés renacentista, con grandes portadas de piedra y escudos.\n\nLa disolución del Temple a comienzos del siglo XIV fue un episodio dramático en Aragón: los últimos templarios resistieron en sus castillos, como el de Monzón, antes de rendirse y ser encarcelados."},{"h":"Qué ver","t":"Busca la Casa Prim, con una gran portada de piedra fechada en 1797; la Casa Batista, con portada del siglo XVI y escudo en hueco relieve; y la Casa Ferrer, con portada y escudo del siglo XVIII. Completan el paseo la Casa Benito, la Casa Pardo, la Casa Canalís y la Casa Camilo.\n\nLa Casa Fox ocupa la antigua ermita de Nuestra Señora de Gracia, cuyas criptas, según la tradición, guardaron enterramientos templarios.\n\nCamina despacio y mira hacia arriba: muchos detalles, como aleros de madera, rejas o pequeñas ventanas de piedra, pasan desapercibidos si solo se mira a la altura de la calle."},{"h":"Para entenderlo","t":"En Aragón, el nombre de una casa no es el de una persona sino el de la familia y la hacienda que pasan de generación en generación. Por eso se habla de Casa Prim o Casa Pardo aunque hoy vivan en ellas otros apellidos.\n\nLos escudos en las fachadas indicaban la condición de infanzones, la pequeña nobleza rural, que tenía privilegios fiscales. Las portadas de piedra eran el modo de mostrar esa posición en un pueblo donde la mayoría construía con ladrillo y tapial.\n\nBelver fue un pueblo de jornaleros, y estas casas grandes contrastaban con las viviendas modestas de la mayoría."}],"en":[{"h":"History","t":"In the 13th century Belver had a castle of the Order of the Temple. According to the historian Francisco Castillón, its dungeons served as a prison for knights of the order after the fall of Monzón castle in 1309, when the Temple was dissolved. Today those dungeons survive inside Casa Camilo.\n\nIn the 16th and 17th centuries, with agricultural prosperity, well-off families built houses in the Aragonese Renaissance style, with large stone doorways and coats of arms.\n\nThe dissolution of the Temple at the beginning of the 14th century was a dramatic episode in Aragón: the last Templars held out in their castles, such as Monzón, before surrendering and being imprisoned."},{"h":"What to see","t":"Look for Casa Prim, with a large stone doorway dated 1797; Casa Batista, with a 16th-century doorway and a coat of arms in sunk relief; and Casa Ferrer, with an 18th-century doorway and coat of arms. Casa Benito, Casa Pardo, Casa Canalís and Casa Camilo complete the walk.\n\nCasa Fox occupies the former hermitage of Nuestra Señora de Gracia, whose crypts, according to tradition, held Templar burials.\n\nWalk slowly and look up: many details, such as wooden eaves, iron grilles and small stone windows, go unnoticed if you only look at street level."},{"h":"Background","t":"In Aragón, the name of a house is not that of a person but of the family and the estate passed down from generation to generation. That is why people speak of C
