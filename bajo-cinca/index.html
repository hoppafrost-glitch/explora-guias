lar María Quintana, el único edificio que se salvó del derribo del pueblo viejo, y enseña ese mundo desde dentro: cómo vivían y trabajaban los mineros y cómo cambiaron los métodos de extracción.\n\nDurante décadas, buena parte de las familias de Mequinenza vivió de la mina o del transporte del carbón. Hubo colonias mineras, como la de la Virgen del Pilar, con un gran edificio de tres plantas y 65 metros de longitud, y el lignito alimentó industrias de toda la cuenca del Ebro."},{"h":"Qué ver","t":"La visita guiada recorre más de 1.000 metros de galerías entre máquinas, herramientas y fotografías: de los picos y las vagonetas a las rozadoras y las cintas transportadoras. Se entra con casco, como un minero por un día.\n\nEl Museo de la Historia repasa la villa desde los primeros pobladores, con los asedios del castillo, los llaguts del Ebro y la obra de Jesús Moncada. El Museo del Pasado Prehistórico presenta el Neolítico y las Edades del Bronce y del Hierro, con recreaciones del poblado de Los Castellets y del abrigo de Vall Major."},{"h":"Para entenderlo","t":"Mequinenza conserva varios abrigos con arte rupestre del arco mediterráneo, Patrimonio Mundial de la UNESCO desde 1998. Están repartidos por barrancos del término y no son de visita libre; el museo es la forma más cómoda de conocerlos.\n\nEn el término también se han excavado poblados y necrópolis de la Edad del Bronce y de los campos de urnas, como Los Castellets, con una necrópolis de inhumación y otra de incineración. Tras la visita, sal al Pueblo Viejo: el museo y las calles derribadas se entienden mejor juntos."}],"en":[{"h":"History","t":"Coal shaped life in Mequinenza for more than a century and a half. The Carbonífera del Ebro company was founded in 1880; lignite was extracted from galleries beneath the municipality and shipped down the Ebro towards Fayón. The last mine in the area closed in 2014.\n\nThe museum occupies the old María Quintana school building, the only one to survive the demolition of the old town, and shows that world from the inside: how the miners lived and worked and how extraction methods changed.\n\nFor decades, many Mequinenza families made their living from the mine or from transporting coal. There were mining settlements, such as the Virgen del Pilar colony, with a large three-storey building 65 metres long, and the lignite fuelled industries throughout the Ebro basin."},{"h":"What to see","t":"The guided tour covers more than 1,000 metres of galleries among machinery, tools and photographs: from picks and wagons to cutting machines and conveyor belts. You go in wearing a helmet, a miner for a day.\n\nThe History Museum traces the town from its first settlers, with the sieges of the castle, the llaguts of the Ebro and the work of Jesús Moncada. The Prehistoric Past Museum presents the Neolithic and the Bronze and Iron Ages, with reconstructions of the Los Castellets settlement and the Vall Major rock shelter."},{"h":"Background","t":"Mequinenza has several rock shelters with rock art of the Mediterranean Basin, a UNESCO World Heritage Site since 1998. They are scattered through ravines in the municipality and cannot be visited freely; the museum is the easiest way to get to know them.\n\nBronze Age and Urnfield settlements and cemeteries have also been excavated in the municipality, such as Los Castellets, with one inhumation cemetery and another for cremations. After your visit, head out into the Pueblo Viejo: the museum and the demolished streets make more sense together."}],"fr":[{"h":"Histoire","t":"Le charbon a rythmé la vie de Mequinenza pendant plus d'un siècle et demi. La Carbonífera del Ebro fut fondée en 1880 ; le lignite était extrait de galeries creusées sous la commune et chargé sur l'Èbre en direction de Fayón. La dernière mine de la région a fermé en 2014.\n\nLe musée occupe l'ancien groupe scolaire María Quintana, le seul édifice épargné par la démolition du vieux village, et montre ce monde de l'intérieur : comment vivaient et travaillaient les mineurs et comment les méthodes d'extraction ont évolué.\n\nPendant des décennies, une bonne partie des familles de Mequinenza a vécu de la mine ou du transport du charbon. Il y eut des cités minières, comme celle de la Virgen del Pilar, avec un grand bâtiment de trois étages et 65 mètres de long, et le lignite alimenta des industries dans tout le bassin de l'Èbre."},{"h":"À voir","t":"La visite guidée parcourt plus de 1 000 mètres de galeries au milieu des machines, des outils et des photographies : des pics et des wagonnets aux haveuses et aux convoyeurs à bande. On entre casqué, comme un mineur d'un jour.\n\nLe Museo de la Historia retrace l'histoire de la ville depuis les premiers habitants, avec les sièges du château, les llaguts de l'Èbre et l'œuvre de Jesús Moncada. Le Museo del Pasado Prehistórico présente le Néolithique et les âges du bronze et du fer, avec des reconstitutions du village de Los Castellets et de l'abri de Vall Major."},{"h":"Pour comprendre","t":"Mequinenza conserve plusieurs abris ornés d'art rupestre de l'arc méditerranéen, inscrit au patrimoine mondial de l'UNESCO depuis 1998. Ils sont répartis dans les ravins de la commune et ne sont pas en accès libre ; le musée est le moyen le plus pratique de les découvrir.\n\nSur la commune, on a aussi fouillé des villages et des nécropoles de l'âge du bronze et des champs d'urnes, comme Los Castellets, avec une nécropole à inhumation et une autre à incinération. Après la visite, sortez dans le Pueblo Viejo : le musée et les rues démolies se comprennent mieux ensemble."}],"de":[{"h":"Geschichte","t":"Die Kohle prägte das Leben in Mequinenza mehr als anderthalb Jahrhunderte lang. Die Carbonífera del Ebro wurde 1880 gegründet; die Braunkohle wurde in Stollen unter dem Gemeindegebiet abgebaut und auf dem Ebro nach Fayón verschifft. Das letzte Bergwerk der Gegend schloss 2014.\n\nDas Museum befindet sich im ehemaligen Schulgebäude María Quintana, dem einzigen Bau, der dem Abriss des alten Dorfes entging, und zeigt diese Welt von innen: wie die Bergleute lebten und arbeiteten und wie sich die Abbaumethoden veränderten.\n\nJahrzehntelang lebte ein großer Teil der Familien von Mequinenza vom Bergbau oder vom Kohletransport. Es gab Bergarbeitersiedlungen wie die der Virgen del Pilar mit einem großen dreistöckigen, 65 Meter langen Gebäude, und die Braunkohle versorgte Industrien im gesamten Ebrobecken."},{"h":"Sehenswert","t":"Die Führung führt durch mehr als 1.000 Meter Stollen zwischen Maschinen, Werkzeugen und Fotografien: von Spitzhacken und Loren bis zu Schrämmaschinen und Förderbändern. Man geht mit Helm hinein, wie ein Bergmann für einen Tag.\n\nDas Museo de la Historia zeichnet die Geschichte des Ortes von den ersten Bewohnern an nach, mit den Belagerungen der Burg, den Llaguts auf dem Ebro und dem Werk von Jesús Moncada. Das Museo del Pasado Prehistórico stellt Jungsteinzeit, Bronze- und Eisenzeit vor, mit Nachbildungen der Siedlung Los Castellets und des Felsdachs von Vall Major."},{"h":"Zum Verständnis","t":"Mequinenza besitzt mehrere Felsdächer mit Felskunst des Mittelmeerraums, seit 1998 UNESCO-Welterbe. Sie verteilen sich auf Schluchten des Gemeindegebiets und sind nicht frei zugänglich; das Museum ist die bequemste Möglichkeit, sie kennenzulernen.\n\nIm Gemeindegebiet wurden außerdem Siedlungen und Gräberfelder der Bronzezeit und der Urnenfelderkultur ausgegraben, etwa Los Castellets mit einem Körpergräberfeld und einem Brandgräberfeld. Gehen Sie nach dem Besuch hinaus ins Pueblo Viejo: Museum und abgerissene Gassen erschließen sich gemeinsam besser."}],"pt":[{"h":"História","t":"O carvão marcou a vida de Mequinenza durante mais de século e meio. A Carbonífera del Ebro foi fundada em 1880; o lenhite era extraído de galerias sob o concelho e embarcado no Ebro em direção a Fayón. A última mina da zona fechou em 2014.\n\nO museu ocupa o antigo grupo escolar María Quintana, o único edifício que se salvou da demolição da povoação velha, e mostra esse mundo por dentro: como viviam e trabalhavam os mineiros e como mudaram os métodos de extração.\n\nDurante décadas, boa parte das famílias de Mequinenza viveu da mina ou do transporte do carvão. Houve colónias mineiras, como a da Virgen del Pilar, com um grande edifício de três pisos e 65 metros de comprimento, e o lenhite alimentou indústrias de toda a bacia do Ebro."},{"h":"O que ver","t":"A visita guiada percorre mais de 1.000 metros de galerias entre máquinas, ferramentas e fotografias: das picaretas e vagonetas às roçadoras e passadeiras transportadoras. Entra-se com capacete, como um mineiro por um dia.\n\nO Museo de la Historia percorre a história da vila desde os primeiros povoadores, com os cercos do castelo, os llaguts do Ebro e a obra de Jesús Moncada. O Museo del Pasado Prehistórico apresenta o Neolítico e as Idades do Bronze e do Ferro, com recriações do povoado de Los Castellets e do abrigo de Vall Major."},{"h":"Para compreender","t":"Mequinenza conserva vários abrigos com arte rupestre do arco mediterrânico, Património Mundial da UNESCO desde 1998. Estão espalhados por ravinas do concelho e não são de visita livre; o museu é a forma mais cómoda de os conhecer.\n\nNo concelho também foram escavados povoados e necrópoles da Idade do Bronze e dos campos de urnas, como Los Castellets, com uma necrópole de inumação e outra de incineração. Depois da visita, saia para o Pueblo Viejo: o museu e as ruas demolidas compreendem-se melhor juntos."}]},"status":"pending"},{"id":"aiguabarreig","town":"Mequinenza","cat":"naturaleza","lat":41.3617,"lon":0.3036,"coord_src":null,"q":["Aiguabarreig, Mequinenza","Confluencia Segre Ebro Mequinenza"],"fq":["Aiguabarreig","Aiguabarreig Segre Ebre","Mequinenza confluencia Segre Ebro"],"name":{"es":"Aiguabarreig: la unión de los ríos","en":"Aiguabarreig: where the rivers meet","fr":"Aiguabarreig : la rencontre des rivières","de":"Aiguabarreig: der Zusammenfluss","pt":"Aiguabarreig: a união dos rios"},"when":{"es":"Ebro, Segre y Cinca · Espacio natural","en":"Ebro, Segre and Cinca · Natural area","fr":"Èbre, Segre et Cinca · Espace naturel","de":"Ebro, Segre und Cinca · Naturraum","pt":"Ebro, Segre e Cinca · Espaço natural"},"desc":{"es":"Aiguabarreig significa «mezcla de aguas». Aquí el Segre, que poco antes ha recibido al Cinca, se une al Ebro, en una de las mayores confluencias fluviales de la península, con amplios sotos de ribera y muchas aves.","en":"Aiguabarreig means «mingling of waters». Here the Segre, which has just received the Cinca, joins the Ebro in one of the largest river confluences in the Iberian Peninsula, with broad riverside woodlands and plenty of birds.","fr":"Aiguabarreig signifie « mélange des eaux ». Ici, le Segre, qui vient de recevoir le Cinca, rejoint l'Èbre, dans l'une des plus grandes confluences fluviales de la péninsule, avec de vastes ripisylves et de nombreux oiseaux.","de":"Aiguabarreig bedeutet „Vermischung der Wasser“. Hier vereinigt sich der Segre, der kurz zuvor den Cinca aufgenommen hat, mit dem Ebro – einer der größten Flusszusammenflüsse der Iberischen Halbinsel, mit ausgedehnten Auwäldern und vielen Vögeln.","pt":"Aiguabarreig significa «mistura de águas». Aqui o Segre, que pouco antes recebeu o Cinca, une-se ao Ebro, numa das maiores confluências fluviais da Península, com amplos bosques ribeirinhos e muitas aves."},"visit":{"es":"Se contempla desde el castillo, desde el Pueblo Viejo y desde el embarcadero de la Comarca frente a los restos antiguos. Es un espacio natural protegido: no salgas de los caminos y lleva prismáticos si te gustan las aves.","en":"Take it in from the castle, from the Pueblo Viejo and from the Comarca's landing stage opposite the old remains. It is a protected natural area: keep to the paths, and take binoculars if you enjoy birdwatching.","fr":"On l'admire depuis le château, depuis le Pueblo Viejo et depuis l'embarcadère de la Comarca, face aux anciens vestiges. C'est un espace naturel protégé : ne quittez pas les chemins et emportez des jumelles si vous aimez les oiseaux.","de":"Man betrachtet ihn von der Burg, vom Pueblo Viejo und von der Anlegestelle der Comarca gegenüber den alten Überresten aus. Es ist ein geschütztes Naturgebiet: Bleiben Sie auf den Wegen und nehmen Sie ein Fernglas mit, wenn Sie Vögel mögen.","pt":"Contempla-se a partir do castelo, do Pueblo Viejo e do cais da Comarca em frente aos vestígios antigos. É um espaço natural protegido: não saia dos caminhos e leve binóculos se gosta de aves."},"src":"https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5490366","sources":["https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5490366","https://lamagiadeviajar.com/wp-content/uploads/old/articulos/pdf/MAGIA72Mequinenza.pdf","https://es.wikipedia.org/wiki/R%C3%ADo_Cinca","https://es.wikipedia.org/wiki/Mequinenza"],"art":{"es":[{"h":"El paisaje","t":"El Cinca baja desde el Pirineo, cruza toda la comarca y se une al Segre; el Segre, a su vez, desemboca en el Ebro en Mequinenza. Las aguas de los tres ríos forman un cauce de más de 500 metros de ancho, con islas y los bosques de ribera más extensos del nordeste peninsular.\n\nLos embalses de Mequinenza y Ribarroja cambiaron el paisaje y anegaron la parte baja del valle, pero en los alrededores siguen amplios sotos que dan refugio a la fauna.\n\nEn los días claros se aprecia la diferencia de color entre las aguas que llegan por cada río, más verdosas o más turbias según el caudal y las tierras que arrastran. Esa mezcla es la que da nombre al lugar."},{"h":"Qué ver","t":"Desde el castillo se entiende el mapa de un vistazo. Abajo, el embalse forma meandros con nombres propios, como La Tumba o La Herradura. Frente al Pueblo Viejo, el embarcadero del proyecto Entre Ríos de la Comarca da acceso al agua.\n\nEl río también se vive: Mequinenza es conocida por la pesca deportiva, sobre todo del siluro, y por el remo y el piragüismo. Al otro lado, en La Granja d'Escarp, el mirador de la illa dels Martinets permite asomarse a la confluencia desde Cataluña.\n\nLa mejor forma de entender la confluencia es combinar tres miradas: desde arriba, en el castillo; desde la orilla, en el Pueblo Viejo; y desde el agua, si tienes ocasión de salir en piragua o barca con alguna empresa local."},{"h":"Para entenderlo","t":"Es Zona de Especial Protección para las Aves, dentro de la ZEPA Matarraña-Aiguabarreig, con unas 87 especies citadas: garzas, rapaces y aves de ambientes esteparios, algunas amenazadas en Europa. También viven aquí nutrias, ciervos, cabras monteses, murciélagos, reptiles y anfibios.\n\nLa Estación Biológica del Aiguabarreig trabaja desde 1993 en la conservación, la investigación y la divulgación de este espacio. Si vienes a ver aves, las primeras horas del día y la primavera son los mejores momentos."}],"en":[{"h":"The landscape","t":"The Cinca comes down from the Pyrenees, crosses the whole comarca and joins the Segre; the Segre in turn flows into the Ebro at Mequinenza. The waters of the three rivers form a channel more than 500 metres wide, with islands and the most extensive riverside woodlands in the north-east of the peninsula.\n\nThe Mequinenza and Ribarroja reservoirs changed the landscape and flooded the lower part of the valley, but broad riverside thickets remain round about and give shelter to wildlife.\n\nOn clear days you can see the difference in colour between the waters arriving down each river, greener or murkier depending on the flow and the soil they carry. That mingling is what gives the place its name."},{"h":"What to see","t":"From the castle the whole map makes sense at a glance. Below, the reservoir forms meanders with names of their own, such as La Tumba (The Tomb) and La Herradura (The Horseshoe). Opposite the Pueblo Viejo, the landing stage built under the Comarca's Entre Ríos project gives access to the water.\n\nThe river is also there to be enjoyed: Mequinenza is known for sport fishing, especially for wels catfish, and for rowing and canoeing. On the other side, in La Granja d'Escarp, the illa dels Martinets viewpoint lets you look out over the confluence from Catalonia.\n\nThe best way to understand the confluence is to combine three viewpoints: from above, at the castle; from the bank, in the Pueblo Viejo; and from the water, if you get the chance to go out by canoe or boat with a local company."},{"h":"Background","t":"It is a Special Protection Area for Birds, part of the Matarraña-Aiguabarreig SPA, with about 87 species recorded: herons, birds of prey and steppe birds, some of them endangered in Europe. Otters, deer, Iberian ibex, bats, reptiles and amphibians also live here.\n\nThe Estació Biològica de l'Aiguabarreig (Aiguabarreig Biological Station) has been working on the conservation, research and public awareness of this area since 1993. If you are coming to see birds, early morning and spring are the best times."}],"fr":[{"h":"Le paysage","t":"Le Cinca descend des Pyrénées, traverse toute la comarque et rejoint le Segre ; le Segre, à son tour, se jette dans l'Èbre à Mequinenza. Les eaux des trois rivières forment un lit de plus de 500 mètres de large, avec des îles et les forêts riveraines les plus étendues du nord-est de la péninsule.\n\nLes barrages de Mequinenza et de Ribarroja ont modifié le paysage et noyé le bas de la vallée, mais de vastes ripisylves subsistent aux alentours et servent de refuge à la faune.\n\nPar temps clair, on distingue la différence de couleur entre les eaux qu'apporte chaque rivière, plus verdâtres ou plus troubles selon le débit et les terres qu'elles charrient. C'est ce mélange qui donne son nom au lieu."},{"h":"À voir","t":"Depuis le château, on saisit la carte d'un seul coup d'œil. En contrebas, le lac de barrage dessine des méandres aux noms bien à eux, comme La Tumba ou La Herradura. Face au Pueblo Viejo, l'embarcadère du projet Entre Ríos de la Comarca donne accès à l'eau.\n\nLa rivière se vit aussi : Mequinenza est réputée pour la pêche sportive, surtout celle du silure, ainsi que pour l'aviron et le canoë-kayak. De l'autre côté, à La Granja d'Escarp, le belvédère de l'illa dels Martinets permet d'observer la confluence depuis la Catalogne.\n\nLe meilleur moyen de comprendre la confluence est de combiner trois regards : d'en haut, depuis le château ; depuis la rive, au Pueblo Viejo ; et depuis l'eau, si vous avez l'occasion de sortir en canoë ou en bateau avec une entreprise locale."},{"h":"Pour comprendre","t":"C'est une zone de protection spéciale pour les oiseaux, intégrée à la ZEPA Matarraña-Aiguabarreig, avec quelque 87 espèces recensées : hérons, rapaces et oiseaux des milieux steppiques, certains menacés en Europe. On y trouve aussi des loutres, des cerfs, des bouquetins, des chauves-souris, des reptiles et des amphibiens.\n\nLa Estación Biológica del Aiguabarreig œuvre depuis 1993 à la conservation, à la recherche et à la sensibilisation autour de cet espace. Si vous venez observer les oiseaux, les premières heures du jour et le printemps sont les meilleurs moments."}],"de":[{"h":"Die Landschaft","t":"Der Cinca kommt aus den Pyrenäen, durchquert die ganze Comarca und vereinigt sich mit dem Segre; der Segre wiederum mündet in Mequinenza in den Ebro. Das Wasser der drei Flüsse bildet ein über 500 Meter breites Bett mit Inseln und den ausgedehntesten Auwäldern im Nordosten der Halbinsel.\n\nDie Stauseen von Mequinenza und Ribarroja veränderten die Landschaft und überfluteten den unteren Teil des Tals, doch in der Umgebung bieten weiterhin weite Auwälder der Tierwelt Zuflucht.\n\nAn klaren Tagen erkennt man den Farbunterschied zwischen den Wassern der einzelnen Flüsse, je nach Wassermenge und mitgeführtem Erdreich grünlicher oder trüber. Diese Vermischung gibt dem Ort seinen Namen."},{"h":"Sehenswert","t":"Von der Burg aus erschließt sich die Karte auf einen Blick. Unten bildet der Stausee Mäander mit eigenen Namen wie La Tumba oder La Herradura. Gegenüber dem Pueblo Viejo bietet die Anlegestelle des Projekts Entre Ríos der Comarca Zugang zum Wasser.\n\nDen Fluss kann man auch aktiv erleben: Mequinenza ist bekannt für das Sportangeln, vor allem auf Wels, sowie für Rudern und Kanufahren. Auf der anderen Seite, in La Granja d'Escarp, bietet der Aussichtspunkt der Illa dels Martinets einen Blick auf den Zusammenfluss von Katalonien aus.\n\nAm besten versteht man den Zusammenfluss, wenn man drei Blickwinkel kombiniert: von oben, von der Burg; vom Ufer, im Pueblo Viejo; und vom Wasser aus, wenn Sie die Gelegenheit haben, mit einem örtlichen Anbieter im Kanu oder Boot hinauszufahren."},{"h":"Zum Verständnis","t":"Das Gebiet ist Vogelschutzgebiet innerhalb der ZEPA Matarraña-Aiguabarreig, mit rund 87 nachgewiesenen Arten: Reiher, Greifvögel und Vögel der Steppenlandschaften, einige davon in Europa bedroht. Außerdem leben hier Fischotter, Hirsche, Steinböcke, Fledermäuse, Reptilien und Amphibien.\n\nDie Estación Biológica del Aiguabarreig arbeitet seit 1993 am Schutz, an der Erforschung und an der Vermittlung dieses Naturraums. Wenn Sie zur Vogelbeobachtung kommen, sind die frühen Morgenstunden und das Frühjahr die beste Zeit."}],"pt":[{"h":"A paisagem","t":"O Cinca desce dos Pirenéus, atravessa toda a comarca e une-se ao Segre; o Segre, por sua vez, desagua no Ebro em Mequinenza. As águas dos três rios formam um leito com mais de 500 metros de largura, com ilhas e os bosques ribeirinhos mais extensos do nordeste peninsular.\n\nAs albufeiras de Mequinenza e Ribarroja mudaram a paisagem e alagaram a parte baixa do vale, mas nos arredores continuam a existir amplos bosques ribeirinhos que dão refúgio à fauna.\n\nNos dias claros nota-se a diferença de cor entre as águas que chegam por cada rio, mais esverdeadas ou mais turvas conforme o caudal e as terras que arrastam. É essa mistura que dá nome ao lugar."},{"h":"O que ver","t":"Do castelo compreende-se o mapa num relance. Em baixo, a albufeira forma meandros com nomes próprios, como La Tumba ou La Herradura. Em frente ao Pueblo Viejo, o cais do projeto Entre Ríos da Comarca dá acesso à água.\n\nO rio também se vive: Mequinenza é conhecida pela pesca desportiva, sobretudo do siluro, e pelo remo e pela canoagem. Do outro lado, em La Granja d'Escarp, o miradouro da illa dels Martinets permite espreitar a confluência a partir da Catalunha.\n\nA melhor forma de compreender a confluência é combinar três olhares: de cima, no castelo; da margem, no Pueblo Viejo; e da água, se tiver ocasião de sair de canoa ou de barco com alguma empresa local."},{"h":"Para compreender","t":"É Zona de Proteção Especial para as Aves, dentro da ZEPA Matarraña-Aiguabarreig, com cerca de 87 espécies registadas: garças, aves de rapina e aves de meios estepários, algumas ameaçadas na Europa. Vivem também aqui lontras, veados, cabras-monteses, morcegos, répteis e anfíbios.\n\nA Estação Biológica do Aiguabarreig trabalha desde 1993 na conservação, na investigação e na divulgação deste espaço. Se vier observar aves, as primeiras horas do dia e a primavera são os melhores momentos."}]},"status":"pending"},{"id":"embalse-mequinenza","town":"Mequinenza","cat":"hidraulico","lat":41.37197,"lon":0.3047,"coord_src":null,"q":["Presa de Mequinenza","Embalse de Mequinenza"],"fq":["Category:Mequinenza Reservoir","Presa de Mequinenza","Embalse de Mequinenza","Mar de Aragón"],"name":{"es":"Presa de Mequinenza y Mar de Aragón","en":"Mequinenza Dam and the Mar de Aragón","fr":"Barrage de Mequinenza et Mar de Aragón","de":"Staudamm von Mequinenza und Mar de Aragón","pt":"Barragem de Mequinenza e Mar de Aragón"},"when":{"es":"1957-1966 · Presa y embalse","en":"1957-1966 · Dam and reservoir","fr":"1957-1966 · Barrage et lac de retenue","de":"1957–1966 · Staudamm und Stausee","pt":"1957-1966 · Barragem e albufeira"},"desc":{"es":"Una presa de hormigón de 79 metros que embalsa el Ebro a lo largo de unos 110 kilómetros. El llamado Mar de Aragón dio luz y riego, y se llevó por delante el viejo pueblo de Mequinenza.","en":"A 79-metre concrete dam that holds back the Ebro for about 110 kilometres. The so-called Mar de Aragón (Sea of Aragón) brought electricity and irrigation, and swept away the old town of Mequinenza.","fr":"Un barrage en béton de 79 mètres qui retient l'Èbre sur environ 110 kilomètres. La « mer d'Aragon », comme on l'appelle, a apporté électricité et irrigation, et a emporté le vieux village de Mequinenza.","de":"Eine 79 Meter hohe Betonstaumauer, die den Ebro auf rund 110 Kilometern Länge aufstaut. Das sogenannte Mar de Aragón brachte Strom und Bewässerung – und riss das alte Dorf Mequinenza mit sich.","pt":"Uma barragem de betão com 79 metros que represa o Ebro ao longo de cerca de 110 quilómetros. O chamado Mar de Aragón (Mar de Aragão) trouxe luz e rega, e levou consigo a velha povoação de Mequinenza."},"visit":{"es":"La presa se ve desde la carretera y desde los miradores del entorno del pueblo; la central no es visitable por libre. El embalse se disfruta desde las orillas, con pesca (con licencia), remo y paseos. Consulta actividades en la oficina de turismo.","en":"The dam can be seen from the road and from the viewpoints around the town; the power station cannot be visited independently. The reservoir is best enjoyed from its banks, with fishing (with a licence), rowing and walks. Ask about activities at the tourist office.","fr":"Le barrage se voit depuis la route et depuis les belvédères des environs du village ; la centrale ne se visite pas librement. Le lac se découvre depuis ses rives, avec pêche (avec permis), aviron et promenades. Renseignez-vous sur les activités à l'office de tourisme.","de":"Die Staumauer ist von der Straße und von den Aussichtspunkten rund um den Ort zu sehen; das Kraftwerk ist nicht frei zugänglich. Den Stausee genießt man von den Ufern aus, beim Angeln (mit Lizenz), Rudern und Spazierengehen. Informationen zu Aktivitäten erhalten Sie im Tourismusbüro.","pt":"A barragem vê-se da estrada e dos miradouros dos arredores da povoação; a central não é visitável livremente. A albufeira desfruta-se a partir das margens, com pesca (com licença), remo e passeios. Consulte as atividades no posto de turismo."},"src":"https://es.hispanopedia.com/wiki/Embalse_de_Mequinenza","sources":["https://es.hispanopedia.com/wiki/Embalse_de_Mequinenza","https://www.museosdemequinenza.com/wp-content/uploads/2018/05/Pueblo-Viejo-de-Mequinenza-web.pdf","https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5490366","https://lamagiadeviajar.com/wp-content/uploads/old/articulos/pdf/MAGIA72Mequinenza.pdf"],"art":{"es":[{"h":"Historia","t":"La concesión para aprovechar el Ebro en Mequinenza se otorgó a ENHER en 1955. Las obras empezaron a finales de esa década y el embalse comenzó a llenarse en julio de 1964; la presa se inauguró en 1966. Más abajo se levantó después la presa de Ribarroja, cuyo embalse acabó de cubrir la zona baja del viejo pueblo.\n\nEl precio fue alto: el antiguo Mequinenza fue derribado casi por completo y sus vecinos se trasladaron a un nuevo núcleo junto al Segre. El agua alcanzó también tierras de Fraga, Caspe, Chiprana, Sástago y Escatrón."},{"h":"Qué ver","t":"La presa es de gravedad, de hormigón, con 79 metros de altura sobre cimientos y 461 metros de coronación. A su pie funciona una central hidroeléctrica cuya potencia se amplió en 2010 hasta 384 megavatios.\n\nAguas arriba, el embalse ocupa unos 75 kilómetros cuadrados, con una anchura media de 600 metros y profundidades de más de 60. Junto al Pueblo Viejo verás una de sus turbinas originales, de 420 toneladas, convertida en escultura."},{"h":"Curiosidades","t":"El embalse es hoy un destino de pesca deportiva con decenas de competiciones al año. Su especie estrella, el siluro, llegó en los años setenta y se han capturado ejemplares de más de 100 kilos; también abundan la carpa, el black bass, el lucio y la perca.\n\nSus aguas tranquilas sirven además para remo, piragüismo y regatas. Para pescar en Mequinenza hace falta la licencia de Aragón o de Cataluña y el permiso del coto local."},{"h":"Para entenderlo","t":"Entre los años cincuenta y setenta, el Estado y las compañías eléctricas construyeron en el Ebro y sus afluentes una serie de grandes presas para producir electricidad y regular el río. Mequinenza, Ribarroja y, aguas abajo, Flix, forman una cadena que convirtió el Ebro en una escalera de embalses.\n\nPara los pueblos ribereños, aquello supuso un antes y un después: llegaron empleos y luz, pero se perdieron huertas, caminos y, en el caso de Mequinenza, el pueblo entero. Esa doble cara es la que recoge la literatura de Jesús Moncada y la que se explica en los Museos de Mequinenza."}],"en":[{"h":"History","t":"The concession to harness the Ebro at Mequinenza was granted to ENHER in 1955. Work began at the end of that decade and the reservoir started to fill in July 1964; the dam was inaugurated in 1966. Further downstream the Ribarroja dam was later built, and its reservoir finished covering the lower part of the old town.\n\nThe price was high: old Mequinenza was almost entirely demolished and its residents moved to a new settlement beside the Segre. The water also reached land belonging to Fraga, Caspe, Chiprana, Sástago and Escatrón."},{"h":"What to see","t":"It is a concrete gravity dam, 79 metres high above its foundations, with a crest 461 metres long. At its foot is a hydroelectric power station whose capacity was increased in 2010 to 384 megawatts.\n\nUpstream, the reservoir covers about 75 square kilometres, with an average width of 600 metres and depths of more than 60. Beside the Pueblo Viejo you will see one of its original turbines, weighing 420 tonnes, turned into a sculpture."},{"h":"Did you know?","t":"The reservoir is now a sport-fishing destination with dozens of competitions a year. Its star species, the wels catfish, arrived in the 1970s, and specimens of over 100 kilos have been caught; carp, black bass, pike and perch are also plentiful.\n\nIts calm waters are also used for rowing, canoeing and regattas. To fish at Mequinenza you need an Aragón or Catalonia licence and a permit for the local fishing reserve."},{"h":"Background","t":"Between the 1950s and the 1970s, the State and the electricity companies built a series of large dams on the Ebro and its tributaries to generate electricity and regulate the river. Mequinenza, Ribarroja and, further downstream, Flix form a chain that turned the Ebro into a staircase of reservoirs.\n\nFor the riverside towns it marked a before and after: jobs and electricity arrived, but market gardens, roads and, in Mequinenza's case, the entire town were lost. That double-edged story is the one told in Jesús Moncada's writing and explained in the Museos de Mequinenza."}],"fr":[{"h":"Histoire","t":"La concession pour exploiter l'Èbre à Mequinenza fut accordée à ENHER en 1955. Les travaux commencèrent à la fin de cette décennie et le lac commença à se remplir en juillet 1964 ; le barrage fut inauguré en 1966. Plus en aval, on construisit ensuite le barrage de Ribarroja, dont la retenue acheva de recouvrir la partie basse du vieux village.\n\nLe prix fut élevé : l'ancien Mequinenza fut presque entièrement démoli et ses habitants furent relogés dans un nouveau bourg au bord du Segre. L'eau atteignit aussi des terres de Fraga, Caspe, Chiprana, Sástago et Escatrón."},{"h":"À voir","t":"C'est un barrage-poids en béton, de 79 mètres de haut au-dessus des fondations et de 461 mètres de long au couronnement. À son pied fonctionne une centrale hydroélectrique dont la puissance a été portée en 2010 à 384 mégawatts.\n\nEn amont, la retenue couvre environ 75 kilomètres carrés, avec une largeur moyenne de 600 mètres et des profondeurs de plus de 60. Près du Pueblo Viejo, vous verrez l'une de ses turbines d'origine, de 420 tonnes, transformée en sculpture."},{"h":"Le saviez-vous ?","t":"Le lac est aujourd'hui une destination de pêche sportive, avec des dizaines de compétitions par an. Son espèce vedette, le silure, est arrivée dans les années soixante-dix et l'on a capturé des spécimens de plus de 100 kilos ; la carpe, le black-bass, le brochet et la perche y abondent aussi.\n\nSes eaux calmes accueillent en outre l'aviron, le canoë-kayak et des régates. Pour pêcher à Mequinenza, il faut un permis d'Aragon ou de Catalogne ainsi que l'autorisation du lot de pêche local."},{"h":"Pour comprendre","t":"Entre les années cinquante et soixante-dix, l'État et les compagnies d'électricité construisirent sur l'Èbre et ses affluents une série de grands barrages pour produire de l'électricité et réguler le fleuve. Mequinenza, Ribarroja et, plus en aval, Flix forment une chaîne qui a transformé l'Èbre en un escalier de retenues.\n\nPour les villages riverains, ce fut un tournant : l'emploi et l'électricité arrivèrent, mais on perdit des vergers, des chemins et, dans le cas de Mequinenza, le village tout entier. C'est ce double visage que restitue la littérature de Jesús Moncada et qu'expliquent les Museos de Mequinenza."}],"de":[{"h":"Geschichte","t":"Die Konzession zur Nutzung des Ebro in Mequinenza erhielt 1955 das Unternehmen ENHER. Die Bauarbeiten begannen Ende des Jahrzehnts, im Juli 1964 begann sich der Stausee zu füllen, und 1966 wurde die Staumauer eingeweiht. Flussabwärts entstand später die Staumauer von Ribarroja, deren Stausee schließlich den unteren Teil des alten Dorfes bedeckte.\n\nDer Preis war hoch: Das alte Mequinenza wurde fast vollständig abgerissen, und seine Bewohner zogen in einen neuen Ort am Segre. Das Wasser erreichte auch Ländereien von Fraga, Caspe, Chiprana, Sástago und Escatrón."},{"h":"Sehenswert","t":"Die Staumauer ist eine Schwergewichtsmauer aus Beton, 79 Meter hoch über dem Fundament und mit einer Kronenlänge von 461 Metern. An ihrem Fuß arbeitet ein Wasserkraftwerk, dessen Leistung 2010 auf 384 Megawatt erhöht wurde.\n\nFlussaufwärts bedeckt der Stausee rund 75 Quadratkilometer, mit einer durchschnittlichen Breite von 600 Metern und Tiefen von über 60 Metern. Neben dem Pueblo Viejo sehen Sie eine seiner ursprünglichen Turbinen, 420 Tonnen schwer und heute eine Skulptur."},{"h":"Wissenswertes","t":"Der Stausee ist heute ein Ziel für Sportangler mit Dutzenden Wettbewerben im Jahr. Seine Starart, der Wels, kam in den 1970er-Jahren hierher, und es wurden Exemplare von über 100 Kilo gefangen; häufig sind auch Karpfen, Schwarzbarsch, Hecht und Barsch.\n\nDas ruhige Wasser eignet sich außerdem zum Rudern, Kanufahren und für Regatten. Zum Angeln in Mequinenza braucht man die Angellizenz von Aragón oder Katalonien und die Erlaubnis des örtlichen Angelreviers."},{"h":"Zum Verständnis","t":"Zwischen den 1950er- und 1970er-Jahren bauten der Staat und die Stromgesellschaften am Ebro und seinen Nebenflüssen eine Reihe großer Staudämme, um Strom zu erzeugen und den Fluss zu regulieren. Mequinenza, Ribarroja und flussabwärts Flix bilden eine Kette, die den Ebro in eine Treppe aus Stauseen verwandelte.\n\nFür die Uferorte bedeutete das einen tiefen Einschnitt: Es kamen Arbeitsplätze und Strom, aber Gärten und Wege gingen verloren, im Fall von Mequinenza sogar das ganze Dorf. Diese zwei Seiten hält die Literatur von Jesús Moncada fest, und sie werden in den Museos de Mequinenza erläutert."}],"pt":[{"h":"História","t":"A concessão para aproveitar o Ebro em Mequinenza foi atribuída à ENHER em 1955. As obras começaram em finais dessa década e a albufeira começou a encher em julho de 1964; a barragem foi inaugurada em 1966. Mais abaixo foi construída depois a barragem de Ribarroja, cuja albufeira acabou de cobrir a zona baixa da velha povoação.\n\nO preço foi alto: a antiga Mequinenza foi demolida quase por completo e os seus habitantes mudaram-se para um novo núcleo junto ao Segre. A água alcançou também terras de Fraga, Caspe, Chiprana, Sástago e Escatrón."},{"h":"O que ver","t":"A barragem é de gravidade, de betão, com 79 metros de altura sobre as fundações e 461 metros de coroamento. Ao seu pé funciona uma central hidroelétrica cuja potência foi ampliada em 2010 para 384 megawatts.\n\nA montante, a albufeira ocupa cerca de 75 quilómetros quadrados, com uma largura média de 600 metros e profundidades de mais de 60. Junto ao Pueblo Viejo verá uma das suas turbinas originais, com 420 toneladas, transformada em escultura."},{"h":"Curiosidades","t":"A albufeira é hoje um destino de pesca desportiva com dezenas de competições por ano. A espécie-estrela, o siluro, chegou nos anos setenta e já foram capturados exemplares com mais de 100 quilos; também abundam a carpa, o achigã, o lúcio e a perca.\n\nAs suas águas tranquilas servem ainda para remo, canoagem e regatas. Para pescar em Mequinenza é necessária a licença de Aragão ou da Catalunha e a autorização da zona de pesca local."},{"h":"Para compreender","t":"Entre os anos cinquenta e setenta, o Estado e as companhias elétricas construíram no Ebro e nos seus afluentes uma série de grandes barragens para produzir eletricidade e regular o rio. Mequinenza, Ribarroja e, a jusante, Flix formam uma cadeia que transformou o Ebro numa escadaria de albufeiras.\n\nPara as povoações ribeirinhas, isso marcou um antes e um depois: chegaram empregos e luz, mas perderam-se hortas, caminhos e, no caso de Mequinenza, a povoação inteira. É essa dupla face que a literatura de Jesús Moncada retrata e que se explica nos Museos de Mequinenza."}]},"status":"pending"},{"id":"camino-sirga-mequinenza","town":"Mequinenza","cat":"camino","lat":41.36651,"lon":0.29311,"coord_src":null,"q":["Camino Natural del Ebro, Mequinenza","GR 99 Mequinenza"],"fq":["GR 99 Mequinenza","Camino Natural del Ebro Mequinenza","Camí de sirga Mequinenza"],"name":{"es":"Camino Natural del Ebro y camino de sirga","en":"Camino Natural del Ebro and the towpath","fr":"Camino Natural del Ebro et chemin de halage","de":"Camino Natural del Ebro und Treidelpfad","pt":"Camino Natural del Ebro e caminho de sirga"},"when":{"es":"GR 99 y Camino Jacobeo del Ebro · Sendero","en":"GR 99 and Ebro Way of St James · Trail","fr":"GR 99 et Chemin jacquaire de l'Èbre · Sentier","de":"GR 99 und Jakobsweg am Ebro · Wanderweg","pt":"GR 99 e Caminho Jacobeu do Ebro · Trilho"},"desc":{"es":"Por Mequinenza pasan el GR 99, que sigue el Ebro desde su nacimiento hasta el delta, y el Camino Jacobeo del Ebro. Caminar junto al agua recuerda el viejo camino de sirga por el que se arrastraban los llaguts.","en":"Mequinenza lies on the GR 99, which follows the Ebro from its source to the delta, and on the Camino Jacobeo del Ebro (Ebro Way of St James). Walking beside the water recalls the old towpath along which the llaguts were hauled.","fr":"Mequinenza est traversée par le GR 99, qui suit l'Èbre de sa source jusqu'au delta, et par le Camino Jacobeo del Ebro (Chemin jacquaire de l'Èbre). Marcher au bord de l'eau rappelle l'ancien chemin de halage par lequel on tirait les llaguts.","de":"Durch Mequinenza führen der GR 99, der dem Ebro von der Quelle bis zum Delta folgt, und der Camino Jacobeo del Ebro (Jakobsweg am Ebro). Wer am Wasser entlangwandert, denkt an den alten Treidelpfad, auf dem die Llaguts gezogen wurden.","pt":"Por Mequinenza passam o GR 99, que segue o Ebro desde a nascente até ao delta, e o Caminho Jacobeu do Ebro. Caminhar junto à água recorda o velho caminho de sirga por onde eram arrastados os llaguts."},"visit":{"es":"Los senderos están señalizados con marcas rojas y blancas y paneles. Puedes hacer un tramo corto junto al embalse desde el pueblo o una etapa completa. Lleva agua y protección solar: hay muchos tramos sin sombra.","en":"The trails are waymarked with red and white markings and information panels. You can walk a short stretch beside the reservoir from the town or a full stage. Take water and sun protection: many stretches have no shade.","fr":"Les sentiers sont balisés en rouge et blanc et équipés de panneaux. Vous pouvez faire un court tronçon le long du lac depuis le village ou une étape complète. Emportez de l'eau et une protection solaire : de nombreux tronçons sont dépourvus d'ombre.","de":"Die Wege sind mit rot-weißen Markierungen und Infotafeln ausgeschildert. Sie können eine kurze Strecke am Stausee vom Ort aus gehen oder eine ganze Etappe. Nehmen Sie Wasser und Sonnenschutz mit: Viele Abschnitte sind schattenlos.","pt":"Os trilhos estão sinalizados com marcas vermelhas e brancas e painéis. Pode fazer um troço curto junto à albufeira a partir da povoação ou uma etapa completa. Leve água e proteção solar: há muitos troços sem sombra."},"src":"https://es.hispanopedia.com/wiki/GR-99","sources":["https://es.hispanopedia.com/wiki/GR-99","https://lamagiadeviajar.com/wp-content/uploads/old/articulos/pdf/MAGIA72Mequinenza.pdf","https://www.museosdemequinenza.com/wp-content/uploads/2018/05/Pueblo-Viejo-de-Mequinenza-web.pdf","https://www.miteco.gob.es/en/ceneam/recursos/materiales/conservacion-medio-ambiente/camino_natural_del_ebro.html"],"art":{"es":[{"h":"Historia","t":"Antes de los embalses, el Ebro era una vía de transporte. Los llaguts de Mequinenza, barcas de hasta unos 30 metros de eslora, bajaban cargados de carbón hacia Fayón y más allá. Para remontar el río, hombres y caballerías tiraban de ellos con cuerdas desde la orilla, por el camino de sirga.\n\nEse camino dio título a la novela más conocida de Jesús Moncada, Camí de sirga, Premio Nacional de Literatura en 1988. Los embalses acabaron con la navegación tradicional y cubrieron buena parte de aquel sendero.\n\nLa navegación por el Ebro tenía un ritmo propio: los llaguts bajaban con la corriente cargados de lignito y volvían río arriba vacíos o con otras mercancías, tirados desde la orilla. En las orillas había puntos de amarre y posadas donde descansaban los navegantes."},{"h":"Qué ver","t":"El Camino Natural del Ebro, el GR 99, recorre unos 1.280 kilómetros desde Fontibre, en Cantabria, hasta el delta. En Mequinenza terminan y empiezan etapas: la 35 llega desde Vall de Freixes; la 36 sigue hacia Almatret y la 36.1 hacia Fayón, ambas de unos 21,6 kilómetros.\n\nUn paseo más corto por la ribera del embalse de Ribarroja pasa por el área recreativa de El Siluro y llega hasta el mas de Borbó, con vistas al agua y a la confluencia.\n\nSi caminas hacia Fayón, el sendero alterna tramos junto al agua con subidas a las lomas, desde donde se ven los meandros del embalse. Es terreno seco y abierto: el mejor momento es la primavera o el otoño."},{"h":"Para entenderlo","t":"El GR 99 fue el primero de los grandes itinerarios de la Red de Caminos Naturales del Ministerio de Agricultura. Está señalizado como Gran Recorrido, con balizas rojas y blancas y paneles al inicio y final de cada etapa.\n\nEn parte de su trazado coincide con el Camino Jacobeo del Ebro, que sube por el valle desde el Mediterráneo hacia Logroño para unirse al Camino Francés. Por eso no es raro cruzarse aquí con peregrinos camino de Santiago."}],"en":[{"h":"History","t":"Before the reservoirs, the Ebro was a transport route. Mequinenza's llaguts, boats up to about 30 metres long, went downriver loaded with coal towards Fayón and beyond. To go back upstream, men and draught animals hauled them with ropes from the bank, along the towpath.\n\nThat path gave its title to Jesús Moncada's best-known novel, Camí de sirga (The Towpath), winner of the Premio Nacional de Literatura in 1988. The reservoirs put an end to traditional navigation and covered much of that path.\n\nNavigation on the Ebro had a rhythm of its own: the llaguts went down with the current loaded with lignite and returned upstream empty or with other goods, hauled from the bank. Along the banks there were mooring points and inns where the boatmen rested."},{"h":"What to see","t":"The Camino Natural del Ebro, the GR 99, runs for about 1,280 kilometres from Fontibre, in Cantabria, to the delta. Stages end and begin in Mequinenza: stage 35 arrives from Vall de Freixes; stage 36 continues towards Almatret and stage 36.1 towards Fayón, both about 21.6 kilometres long.\n\nA shorter walk along the shore of the Ribarroja reservoir passes the El Siluro picnic area and continues to the mas de Borbó (Borbó farmhouse), with views over the water and the confluence.\n\nIf you walk towards Fayón, the trail alternates stretches beside the water with climbs up onto the ridges, from where you can see the meanders of the reservoir. It is dry, open terrain: spring or autumn is the best time."},{"h":"Background","t":"The GR 99 was the first of the major routes in the Ministry of Agriculture's Red de Caminos Naturales (Natural Paths Network). It is waymarked as a Gran Recorrido (long-distance footpath), with red and white markers and panels at the start and end of each stage.\n\nFor part of its course it coincides with the Camino Jacobeo del Ebro, which climbs the valley from the Mediterranean towards Logroño to join the Camino Francés. So it is not unusual to come across pilgrims on their way to Santiago here."}],"fr":[{"h":"Histoire","t":"Avant les barrages, l'Èbre était une voie de transport. Les llaguts de Mequinenza, des barques pouvant atteindre une trentaine de mètres de long, descendaient chargés de charbon vers Fayón et au-delà. Pour remonter le fleuve, des hommes et des bêtes de trait les tiraient avec des cordes depuis la rive, par le chemin de halage.\n\nCe chemin a donné son titre au roman le plus connu de Jesús Moncada, Camí de sirga (Le Chemin de halage), Prix national de littérature en 1988. Les barrages ont mis fin à la navigation traditionnelle et recouvert une bonne partie de ce sentier.\n\nLa navigation sur l'Èbre avait son propre rythme : les llaguts descendaient avec le courant, chargés de lignite, et remontaient vides ou avec d'autres marchandises, halés depuis la rive. Sur les berges se trouvaient des points d'amarrage et des auberges où les bateliers se reposaient."},{"h":"À voir","t":"Le Camino Natural del Ebro, le GR 99, parcourt environ 1 280 kilomètres depuis Fontibre, en Cantabrie, jusqu'au delta. À Mequinenza, des étapes se terminent et commencent : la 35 arrive de Vall de Freixes ; la 36 continue vers Almatret et la 36.1 vers Fayón, toutes deux d'environ 21,6 kilomètres.\n\nUne promenade plus courte le long du lac de Ribarroja passe par l'aire de loisirs d'El Siluro et mène jusqu'au mas de Borbó, avec vue sur l'eau et sur la confluence.\n\nSi vous marchez vers Fayón, le sentier alterne tronçons au bord de l'eau et montées sur les collines, d'où l'on voit les méandres du lac. C'est un terrain sec et découvert : le meilleur moment est le printemps ou l'automne."},{"h":"Pour comprendre","t":"Le GR 99 fut le premier des grands itinéraires du Réseau des chemins naturels du ministère de l'Agriculture. Il est balisé comme sentier de grande randonnée, avec des balises rouges et blanches et des panneaux au début et à la fin de chaque étape.\n\nSur une partie de son tracé, il coïncide avec le Camino Jacobeo del Ebro, qui remonte la vallée depuis la Méditerranée vers Logroño pour rejoindre le Camino Francés. Il n'est donc pas rare d'y croiser des pèlerins en route vers Saint-Jacques-de-Compostelle."}],"de":[{"h":"Geschichte","t":"Vor den Stauseen war der Ebro ein Verkehrsweg. Die Llaguts von Mequinenza, Boote von bis zu etwa 30 Metern Länge, fuhren mit Kohle beladen nach Fayón und weiter. Um flussaufwärts zu kommen, zogen Männer und Lasttiere sie mit Seilen vom Ufer aus, auf dem Treidelpfad.\n\nDieser Weg gab dem bekanntesten Roman von Jesús Moncada seinen Titel: Camí de sirga, spanischer Nationalpreis für Literatur 1988. Die Stauseen beendeten die traditionelle Flussschifffahrt und bedeckten einen großen Teil jenes Pfades.\n\nDie Schifffahrt auf dem Ebro hatte ihren eigenen Rhythmus: Die Llaguts fuhren mit der Strömung, beladen mit Braunkohle, hinab und kehrten leer oder mit anderen Waren flussaufwärts zurück, vom Ufer aus gezogen. An den Ufern gab es Anlegeplätze und Gasthäuser, in denen die Schiffer rasteten."},{"h":"Sehenswert","t":"Der Camino Natural del Ebro, der GR 99, verläuft über rund 1.280 Kilometer von Fontibre in Kantabrien bis zum Delta. In Mequinenza enden und beginnen Etappen: Die 35 kommt von Vall de Freixes; die 36 führt weiter nach Almatret und die 36.1 nach Fayón, beide etwa 21,6 Kilometer lang.\n\nEin kürzerer Spaziergang am Ufer des Stausees von Ribarroja führt am Rastplatz El Siluro vorbei bis zum Mas de Borbó, mit Blick auf das Wasser und den Zusammenfluss.\n\nWenn Sie Richtung Fayón wandern, wechseln sich Abschnitte am Wasser mit Anstiegen auf die Hügel ab, von denen man die Mäander des Stausees sieht. Das Gelände ist trocken und offen: Die beste Zeit sind Frühjahr und Herbst."},{"h":"Zum Verständnis","t":"Der GR 99 war die erste der großen Routen im Netz der Caminos Naturales des spanischen Landwirtschaftsministeriums. Er ist als Fernwanderweg (Gran Recorrido) mit rot-weißen Markierungen und Tafeln zu Beginn und am Ende jeder Etappe ausgeschildert.\n\nAuf einem Teil seiner Strecke deckt er sich mit dem Camino Jacobeo del Ebro, der vom Mittelmeer durch das Tal nach Logroño hinaufführt und dort auf den Camino Francés trifft. Deshalb begegnet man hier nicht selten Pilgern auf dem Weg nach Santiago."}],"pt":[{"h":"História","t":"Antes das albufeiras, o Ebro era uma via de transporte. Os llaguts de Mequinenza, barcos com até cerca de 30 metros de comprimento, desciam carregados de carvão em direção a Fayón e mais além. Para subir o rio, homens e cavalgaduras puxavam-nos com cordas a partir da margem, pelo caminho de sirga.\n\nEsse caminho deu título ao romance mais conhecido de Jesús Moncada, Camí de sirga, Prémio Nacional de Literatura em 1988. As albufeiras acabaram com a navegação tradicional e cobriram boa parte daquele trilho.\n\nA navegação no Ebro tinha um ritmo próprio: os llaguts desciam com a corrente carregados de lenhite e voltavam rio acima vazios ou com outras mercadorias, puxados a partir da margem. Nas margens havia pontos de amarração e estalagens onde os barqueiros descansavam."},{"h":"O que ver","t":"O Camino Natural del Ebro, o GR 99, percorre cerca de 1.280 quilómetros desde Fontibre, na Cantábria, até ao delta. Em Mequinenza terminam e começam etapas: a 35 chega de Vall de Freixes; a 36 segue para Almatret e a 36.1 para Fayón, ambas com cerca de 21,6 quilómetros.\n\nUm passeio mais curto pela margem da albufeira de Ribarroja passa pela área recreativa de El Siluro e chega ao mas de Borbó, com vistas para a água e para a confluência.\n\nSe caminhar em direção a Fayón, o trilho alterna troços junto à água com subidas às colinas, de onde se veem os meandros da albufeira. É terreno seco e aberto: o melhor momento é a primavera ou o outono."},{"h":"Para compreender","t":"O GR 99 foi o primeiro dos grandes itinerários da Rede de Caminhos Naturais do Ministério da Agricultura espanhol. Está sinalizado como Grande Rota, com balizas vermelhas e brancas e painéis no início e no fim de cada etapa.\n\nEm parte do seu traçado coincide com o Caminho Jacobeu do Ebro, que sobe pelo vale desde o Mediterrâneo em direção a Logroño para se juntar ao Caminho Francês. Por isso não é raro cruzar-se aqui com peregrinos a caminho de Santiago."}]},"status":"pending"},{"id":"santa-maria-chalamera","town":"Chalamera","cat":"patrimonio","lat":41.67877,"lon":0.15002,"coord_src":null,"q":["Ermita de Santa María de Chalamera","Santa María de Chalamera"],"fq":["Category:Santa María de Chalamera","Ermita de Santa María de Chalamera","Chalamera ermita Santa María","Chalamera Santa María románico"],"name":{"es":"Santa María de Chalamera","en":"Santa María de Chalamera","fr":"Santa María de Chalamera","de":"Santa María de Chalamera","pt":"Santa María de Chalamera"},"when":{"es":"Siglos XII-XIII · Románico","en":"12th-13th centuries · Romanesque","fr":"XIIe-XIIIe siècles · Roman","de":"12.–13. Jh. · Romanik","pt":"Séculos XII-XIII · Românico"},"desc":{"es":"Una iglesia románica sobre un cerro, entre el Cinca y el Alcanadre. Aunque todos la llaman ermita, fue la iglesia de un priorato benedictino y acogió a peregrinos del Camino de Santiago.","en":"A Romanesque church on a hilltop between the Cinca and the Alcanadre. Although everyone calls it a hermitage, it was the church of a Benedictine priory and took in pilgrims on the Way of St James.","fr":"Une église romane sur une colline, entre le Cinca et l'Alcanadre. Bien que tout le monde l'appelle ermitage, elle fut l'église d'un prieuré bénédictin et accueillit des pèlerins du chemin de Saint-Jacques.","de":"Eine romanische Kirche auf einem Hügel zwischen Cinca und Alcanadre. Auch wenn alle sie Einsiedelei nennen, war sie die Kirche eines Benediktinerpriorats und nahm Pilger auf dem Jakobsweg auf.","pt":"Uma igreja românica sobre um cerro, entre o Cinca e o Alcanadre. Embora todos lhe chamem ermida, foi a igreja de um priorado beneditino e acolheu peregrinos do Caminho de Santiago."},"visit":{"es":"Está a las afueras de Chalamera, sobre un cerro al oeste del pueblo. El exterior se ve libremente; para entrar hay que llamar al Ayuntamiento de Chalamera. Calcula 45 minutos con el paseo.","en":"It is on the outskirts of Chalamera, on a hill west of the village. The exterior can be seen freely; to go inside, call the Chalamera Town Council. Allow 45 minutes including the walk.","fr":"Elle se trouve à la sortie de Chalamera, sur une colline à l'ouest du village. L'extérieur se voit librement ; pour entrer, il faut appeler la mairie de Chalamera. Comptez 45 minutes avec la promenade.","de":"Sie liegt am Ortsrand von Chalamera auf einem Hügel westlich des Dorfes. Von außen ist sie frei zu besichtigen; für das Innere wenden Sie sich an das Rathaus von Chalamera. Rechnen Sie mit 45 Minuten einschließlich Spaziergang.","pt":"Fica nos arredores de Chalamera, sobre um cerro a oeste da povoação. O exterior vê-se livremente; para entrar é preciso contactar a Câmara Municipal de Chalamera. Conte com 45 minutos com o passeio."},"src":"https://www.boe.es/boe/dias/1976/04/29/pdfs/A08382-08383.pdf","sources":["https://www.boe.es/boe/dias/1976/04/29/pdfs/A08382-08383.pdf","https://revistas.iea.es/index.php/ARG/article/view/2168/2159","https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597168","https://www.festivalesdeespana.com/festival/romeria-de-san-marcos-a-la-ermita-de-chalamera"],"art":{"es":[{"h":"Historia","t":"Hacia el año 1100 la iglesia de Chalamera se entregó para fundar una comunidad benedictina dependiente del monasterio de Alaón. Los monjes se asentaron probablemente después de la conquista de Fraga y Lérida en 1149, y en los años siguientes se empezó la iglesia románica.\n\nEl priorato tuvo priores desde 1163 hasta el siglo XVII y en 1748 pasó al Seminario de Lérida. En 1223 el papa Honorio III lo puso bajo protección pontificia. Fue también hospital y lugar de paso de peregrinos, en el Camino de Santiago catalán. En 1976 se declaró monumento histórico-artístico.\n\nEl monasterio de Alaón, del que dependía, estaba en la Ribagorza, en el Pirineo: la fundación de Chalamera muestra cómo los grandes monasterios de montaña extendieron su influencia hacia las tierras llanas recién conquistadas."},{"h":"Qué ver","t":"La iglesia tiene planta de cruz latina, ábside semicircular y una cúpula octogonal sobre el crucero. La portada oeste tiene seis arquivoltas y capiteles con animales, aves, guerreros y cabezas humanas.\n\nDentro destaca el frontal de altar, con dos leones que sostienen un crismón, tallado por una mano distinta y más antigua que la de los capiteles. Del claustro y del monasterio, junto al muro sur, solo quedan cimientos.\n\nTómate tiempo con los capiteles de la portada: animales enfrentados, aves con las alas abiertas, guerreros y cabezas humanas forman un repertorio que el visitante medieval sabía leer como una pequeña lección sobre el bien y el mal."},{"h":"Tradiciones y fiestas","t":"Cada 25 de abril, día de San Marcos, los vecinos suben en procesión hasta la ermita. Se bendicen los términos, se celebra la misa y se reparten pastas bendecidas: una forma antigua de pedir buenas cosechas en una tierra que depende del agua.\n\nFuera, mira el paisaje: a un lado el Cinca, al otro el Alcanadre, que se juntan unos kilómetros más al sur, y la llanura del Bajo Cinca hasta donde alcanza la vista. Entenderás por qué los monjes y los peregrinos eligieron este alto."}],"en":[{"h":"History","t":"Around the year 1100 the church of Chalamera was handed over to found a Benedictine community dependent on the monastery of Alaón. The monks probably settled after the conquest of Fraga and Lleida in 1149, and in the following years work began on the Romanesque church.\n\nThe priory had priors from 1163 until the 17th century, and in 1748 it passed to the Seminary of Lleida. In 1223 Pope Honorius III placed it under papal protection. It was also a hospital and a stopping place for pilgrims on the Catalan Way of St James. In 1976 it was declared a historic-artistic monument.\n\nThe monastery of Alaón, on which it depended, was in Ribagorza, in the Pyrenees: the founding of Chalamera shows how the great mountain monasteries extended their influence into the newly conquered lowlands."},{"h":"What to see","t":"The church has a Latin-cross plan, a semicircular apse and an octagonal dome over the crossing. The west doorway has six archivolts and capitals with animals, birds, warriors and human heads.\n\nInside, the highlight is the altar frontal, with two lions holding a Chi-Rho, carved by a different and earlier hand than that of the capitals. Of the cloister and the monastery, next to the south wall, only foundations remain.\n\nTake your time with the doorway capitals: confronted animals, birds with outspread wings, warriors and human heads form a repertoire that the medieval visitor knew how to read as a short lesson on good and evil."},{"h":"Traditions and festivals","t":"Every 25 April, St Mark's Day, local people walk up to the hermitage in procession. The fields are blessed, mass is celebrated and blessed pastries are handed out: an age-old way of praying for good harvests in a land that depends on water.\n\nOutside, take in the landscape: on one side the Cinca, on the other the Alcanadre, which meet a few kilometres further south, and the Bajo Cinca plain as far as the eye can see. You will understand why the monks and pilgrims chose this height."}],"fr":[{"h":"Histoire","t":"Vers l'an 1100, l'église de Chalamera fut cédée pour fonder une communauté bénédictine dépendant du monastère d'Alaón. Les moines s'installèrent probablement après la conquête de Fraga et de Lérida en 1149, et l'église romane fut commencée dans les années suivantes.\n\nLe prieuré eut des prieurs de 1163 jusqu'au XVIIe siècle et passa en 1748 au séminaire de Lérida. En 1223, le pape Honorius III le plaça sous protection pontificale. Ce fut aussi un hôpital et une halte pour les pèlerins, sur le chemin de Saint-Jacques catalan. Il fut déclaré monument historique et artistique en 1976.\n\nLe monastère d'Alaón, dont il dépendait, se trouvait en Ribagorza, dans les Pyrénées : la fondation de Chalamera montre comment les grands monastères de montagne étendirent leur influence vers les plaines récemment conquises."},{"h":"À voir","t":"L'église a un plan en croix latine, une abside semi-circulaire et une coupole octogonale sur la croisée du transept. Le portail ouest compte six voussures et des chapiteaux ornés d'animaux, d'oiseaux, de guerriers et de têtes humaines.\n\nÀ l'intérieur, on remarque le devant d'autel, avec deux lions soutenant un chrisme, sculpté par une main différente et plus ancienne que celle des chapiteaux. Du cloître et du monastère, le long du mur sud, il ne reste que les fondations.\n\nPrenez le temps d'observer les chapiteaux du portail : animaux affrontés, oiseaux aux ailes déployées, guerriers et têtes humaines forment un répertoire que le visiteur médiéval savait lire comme une petite leçon sur le bien et le mal."},{"h":"Traditions et fêtes","t":"Chaque 25 avril, jour de la Saint-Marc, les habitants montent en procession jusqu'à l'ermitage. On bénit les terres, on célèbre la messe et l'on distribue des petits gâteaux bénits : une façon ancienne de demander de bonnes récoltes sur une terre qui dépend de l'eau.\n\nDehors, regardez le paysage : d'un côté le Cinca, de l'autre l'Alcanadre, qui se rejoignent quelques kilomètres plus au sud, et la plaine du Bajo Cinca à perte de vue. Vous comprendrez pourquoi moines et pèlerins choisirent cette hauteur."}],"de":[{"h":"Geschichte","t":"Um das Jahr 1100 wurde die Kirche von Chalamera zur Gründung einer Benediktinergemeinschaft übergeben, die vom Kloster Alaón abhing. Die Mönche ließen sich vermutlich nach der Eroberung von Fraga und Lleida 1149 nieder, und in den folgenden Jahren wurde mit dem Bau der romanischen Kirche begonnen.\n\nDas Priorat hatte von 1163 bis ins 17. Jahrhundert Prioren und ging 1748 an das Priesterseminar von Lleida über. 1223 stellte Papst Honorius III. es unter päpstlichen Schutz. Es war auch Hospital und Station für Pilger auf dem katalanischen Jakobsweg. 1976 wurde es zum historisch-künstlerischen Denkmal erklärt.\n\nDas Kloster Alaón, von dem es abhing, lag in der Ribagorza in den Pyrenäen: Die Gründung von Chalamera zeigt, wie die großen Bergklöster ihren Einfluss auf das frisch eroberte Flachland ausdehnten."},{"h":"Sehenswert","t":"Die Kirche hat einen Grundriss in Form eines lateinischen Kreuzes, eine halbrunde Apsis und eine achteckige Kuppel über der Vierung. Das Westportal besitzt sechs Archivolten und Kapitelle mit Tieren, Vögeln, Kriegern und menschlichen Köpfen.\n\nIm Inneren ragt das Antependium heraus, mit zwei Löwen, die ein Christusmonogramm tragen, gemeißelt von einer anderen und älteren Hand als die Kapitelle. Von Kreuzgang und Kloster an der Südmauer sind nur Fundamente erhalten.\n\nNehmen Sie sich Zeit für die Kapitelle des Portals: Einander gegenüberstehende Tiere, Vögel mit ausgebreiteten Flügeln, Krieger und menschliche Köpfe bilden ein Bildprogramm, das der mittelalterliche Betrachter als kleine Lehre über Gut und Böse zu lesen wusste."},{"h":"Feste und Traditionen","t":"Jedes Jahr am 25. April, dem Tag des heiligen Markus, ziehen die Einwohner in einer Prozession zur Einsiedelei hinauf. Die Fluren werden gesegnet, die Messe gefeiert und gesegnetes Gebäck verteilt: eine alte Form, um in einem Land, das vom Wasser abhängt, um gute Ernten zu bitten.\n\nSchauen Sie draußen in die Landschaft: auf der einen Seite der Cinca, auf der anderen der Alcanadre, die sich einige Kilometer weiter südlich vereinen, und die Ebene des Bajo Cinca, so weit das Auge reicht. Dann verstehen Sie, warum Mönche und Pilger diese Anhöhe wählten."}],"pt":[{"h":"História","t":"Por volta do ano 1100 a igreja de Chalamera foi entregue para fundar uma comunidade beneditina dependente do mosteiro de Alaón. Os monges instalaram-se provavelmente depois da conquista de Fraga e Lérida em 1149, e nos anos seguintes começou-se a construir a igreja românica.\n\nO priorado teve priores desde 1163 até ao século XVII e em 1748 passou para o Seminário de Lérida. Em 1223 o papa Honório III colocou-o sob proteção pontifícia. Foi também hospital e local de passagem de peregrinos, no Caminho de Santiago catalão. Em 1976 foi declarado monumento histórico-artístico.\n\nO mosteiro de Alaón, de que dependia, ficava na Ribagorza, nos Pirenéus: a fundação de Chalamera mostra como os grandes mosteiros de montanha estenderam a sua influência às terras planas recém-conquistadas."},{"h":"O que ver","t":"A igreja tem planta em cruz latina, abside semicircular e uma cúpula octogonal sobre o cruzeiro. O portal oeste tem seis arquivoltas e capitéis com animais, aves, guerreiros e cabeças humanas.\n\nNo interior destaca-se o frontal de altar, com dois leões que seguram um crismón, esculpido por uma mão diferente e mais antiga do que a dos capitéis. Do claustro e do mosteiro, junto ao muro sul, só restam alicerces.\n\nDemore-se nos capitéis do portal: animais frente a frente, aves de asas abertas, guerreiros e cabeças humanas formam um repertório que o visitante medieval sabia ler como uma pequena lição sobre o bem e o mal."},{"h":"Tradições e festas","t":"Todos os anos a 25 de abril, dia de São Marcos, os habitantes sobem em procissão até à ermida. Benzem-se os campos, celebra-se a missa e distribuem-se bolinhos benzidos: uma forma antiga de pedir boas colheitas numa terra que depende da água.\n\nLá fora, observe a paisagem: de um lado o Cinca, do outro o Alcanadre, que se juntam uns quilómetros mais a sul, e a planície do Bajo Cinca até onde a vista alcança. Perceberá porque os monges e os peregrinos escolheram este alto."}]},"status":"pending"},{"id":"sender-chalamera","town":"Chalamera","cat":"patrimonio","lat":41.66579,"lon":0.16414,"coord_src":null,"q":["Parque Ramón J. Sender, Chalamera","Iglesia de San Martín, Chalamera"],"fq":["Chalamera iglesia San Martín","Chalamera Ramón J. Sender","Chalamera Huesca"],"name":{"es":"San Martín y el parque de Ramón J. Sender","en":"San Martín and the Ramón J. Sender park","fr":"San Martín et le parc Ramón J. Sender","de":"San Martín und Ramón-J.-Sender-Park","pt":"San Martín e o parque de Ramón J. Sender"},"when":{"es":"Casa natal del escritor (1901) · Iglesia","en":"Writer's birthplace (1901) · Church","fr":"Maison natale de l'écrivain (1901) · Église","de":"Geburtshaus des Schriftstellers (1901) · Kirche","pt":"Casa natal do escritor (1901) · Igreja"},"desc":{"es":"En el centro de Chalamera, junto a la iglesia de San Martín, un parque ocupa el solar de la casa donde nació Ramón J. Sender. Un busto recuerda al autor de Réquiem por un campesino español.","en":"In the centre of Chalamera, next to the church of San Martín, a park occupies the site of the house where Ramón J. Sender was born. A bust commemorates the author of Réquiem por un campesino español (Requiem for a Spanish Peasant).","fr":"Au centre de Chalamera, à côté de l'église San Martín, un parc occupe l'emplacement de la maison où naquit Ramón J. Sender. Un buste rappelle l'auteur de Requiem pour un paysan espagnol.","de":"Im Zentrum von Chalamera, neben der Kirche San Martín, liegt ein Park auf dem Grundstück des Hauses, in dem Ramón J. Sender geboren wurde. Eine Büste erinnert an den Autor von Réquiem por un campesino español (Requiem für einen spanischen Landmann).","pt":"No centro de Chalamera, junto à igreja de San Martín, um parque ocupa o terreno da casa onde nasceu Ramón J. Sender. Um busto recorda o autor de Réquiem por un campesino español (Réquiem por um camponês espanhol)."},"visit":{"es":"Está en el centro del pueblo y se visita libremente en unos 20 minutos. La iglesia abre en horario de culto. Combínalo con la subida al cerro del castillo y con la ermita de Santa María.","en":"It is in the village centre and can be visited freely in about 20 minutes. The church opens during services. Combine it with the climb up the castle hill and the hermitage of Santa María.","fr":"Il se trouve au centre du village et se visite librement en une vingtaine de minutes. L'église ouvre pendant les offices. Combinez-le avec la montée à la colline du château et avec l'ermitage de Santa María.","de":"Der Park liegt im Ortszentrum und ist in etwa 20 Minuten frei zu besichtigen. Die Kirche ist zu den Gottesdienstzeiten geöffnet. Verbinden Sie den Besuch mit dem Aufstieg zum Burghügel und mit der Einsiedelei Santa María.","pt":"Fica no centro da povoação e visita-se livremente em cerca de 20 minutos. A igreja abre no horário de culto. Combine-o com a subida ao cerro do castelo e com a ermida de Santa María."},"src":"https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597168","sources":["https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/1597168","https://es.hispanopedia.com/wiki/Ram%C3%B3n_J._Sender","https://es.hispanopedia.com/wiki/Chalamera"],"art":{"es":[{"h":"Historia","t":"Ramón José Sender Garcés nació en Chalamera el 3 de febrero de 1901. Su padre trabajaba en los pueblos de la zona, y el niño pasó sus primeros años aquí, en Alcolea de Cinca y en Tauste. En 1935 ganó el Premio Nacional de Literatura con Míster Witt en el cantón.\n\nLa guerra lo marcó: su mujer, Amparo Barayón, y su hermano Manuel fueron fusilados en 1936. Sender vivió el resto de su vida en el exilio, en México y Estados Unidos, donde fue profesor universitario. Murió en San Diego, California, el 16 de enero de 1982.\n\nEn 1974 volvió de visita a España y en 1980 pidió recuperar la nacionalidad española, poco antes de morir."},{"h":"Qué ver","t":"El parque Ramón J. Sender ocupa el lugar de su casa natal y tiene un busto dedicado al escritor. Al lado se levanta la iglesia parroquial de San Martín, el templo del pueblo, dedicado al santo cuya fiesta, el 11 de noviembre, es la patronal de Chalamera.\n\nDesde aquí se puede subir a la colina que los vecinos llaman El Castillo, donde hubo una fortaleza templaria de la que quedan pocos restos, y al mirador del Tozal, con vistas sobre la llanura.\n\nLa iglesia de San Martín y el parque forman el centro del pueblo, a pocos pasos de la plaza. Es un buen lugar para empezar la visita y, si llevas un libro de Sender, para leer unas páginas a la sombra."},{"h":"Para entenderlo","t":"La Comarca recomienda leer Crónica del alba, el ciclo de nueve novelas en el que Sender recrea su infancia y juventud en el Alto Aragón a través de su alter ego, Pepe Garcés. Es la mejor manera de mirar estos pueblos con sus ojos.\n\nSu obra más leída, Réquiem por un campesino español, publicada primero como Mosén Millán en 1953, cuenta la historia de un joven de un pueblo aragonés en los días de la guerra. Muchos lectores reconocen en ella paisajes y costumbres como los del Cinca."}],"en":[{"h":"History","t":"Ramón José Sender Garcés was born in Chalamera on 3 February 1901. His father worked in the villages of the area, and the boy spent his early years here, in Alcolea de Cinca and in Tauste. In 1935 he won the Premio Nacional de Literatura with Míster Witt en el cantón (Mr Witt Among the Rebels).\n\nThe war left its mark on him: his wife, Amparo Barayón, and his brother Manuel were shot in 1936. Sender spent the rest of his life in exile, in Mexico and the United States, where he was a university lecturer. He died in San Diego, California, on 16 January 1982.\n\nIn 1974 he returned to Spain on a visit, and in 1980, shortly before his death, he applied to recover his Spanish nationality."},{"h":"What to see","t":"The Ramón J. Sender park occupies the site of his birthplace and has a bust dedicated to the writer. Next to it stands the parish church of San Martín, the village church, dedicated to the saint whose feast day, 11 November, is Chalamera's patronal festival.\n\nFrom here you can climb the hill that locals call El Castillo (The Castle), where there was a Templar fortress of which few remains survive, and the Tozal viewpoint, with views over the plain.\n\nThe church of San Martín and the park form the heart of the village, a few steps from the square. It is a good place to start your visit and, if you have brought a book by Sender, to read a few pages in the shade."},{"h":"Background","t":"The Comarca recommends reading Crónica del alba (Chronicle of Dawn), the cycle of nine novels in which Sender recreates his childhood and youth in Upper Aragón through his alter ego, Pepe Garcés. It is the best way to see these villages through his eyes.\n\nHis most widely read work, Réquiem por un campesino español, first published as Mosén Millán in 1953, tells the story of a young man from an Aragonese village in the days of the war. Many readers recognise in it landscapes and customs like those of the Cinca."}],"fr":[{"h":"Histoire","t":"Ramón José Sender Garcés naquit à Chalamera le 3 février 1901. Son père travaillait dans les villages des environs, et l'enfant passa ses premières années ici, à Alcolea de Cinca et à Tauste. En 1935, il remporta le Prix national de littérature avec Mister Witt en el cantón.\n\nLa guerre le marqua profondément : sa femme, Amparo Barayón, et son frère Manuel furent fusillés en 1936. Sender passa le reste de sa vie en exil, au Mexique et aux États-Unis, où il fut professeur d'université. Il mourut à San Diego, en Californie, le 16 janvier 1982.\n\nEn 1974, il revint en visite en Espagne et, en 1980, il demanda à recouvrer la nationalité espagnole, peu avant sa mort."},{"h":"À voir","t":"Le parc Ramón J. Sender occupe l'emplacement de sa maison natale et abrite un buste dédié à l'écrivain. À côté s'élève l'église paroissiale San Martín, l'église du village, dédiée au saint dont la fête, le 11 novembre, est la fête patronale de Chalamera.\n\nD'ici, on peut monter sur la colline que les habitants appellent El Castillo, où se dressait une forteresse templière dont il reste peu de vestiges, et au belvédère du Tozal, avec vue sur la plaine.\n\nL'église San Martín et le parc forment le centre du village, à quelques pas de la place. C'est un bon endroit pour commencer la visite et, si vous avez un livre de Sender, pour en lire quelques pages à l'ombre."},{"h":"Pour comprendre","t":"La Comarca recommande de lire Crónica del alba (Chronique de l'aube), le cycle de neuf romans dans lequel Sender recrée son enfance et sa jeunesse dans le Haut-Aragon à travers son alter ego, Pepe Garcés. C'est la meilleure façon de regarder ces villages avec ses yeux.\n\nSon œuvre la plus lue, Requiem pour un paysan espagnol, publiée d'abord sous le titre Mosén Millán en 1953, raconte l'histoire d'un jeune homme d'un village aragonais pendant les jours de la guerre. Beaucoup de lecteurs y reconnaissent des paysages et des coutumes semblables à ceux du Cinca."}],"de":[{"h":"Geschichte","t":"Ramón José Sender Garcés wurde am 3. Februar 1901 in Chalamera geboren. Sein Vater arbeitete in den Dörfern der Gegend, und der Junge verbrachte seine ersten Jahre hier, in Alcolea de Cinca und in Tauste. 1935 gewann er mit Míster Witt en el cantón den spanischen Nationalpreis für Literatur.\n\nDer Bürgerkrieg prägte ihn: Seine Frau Amparo Barayón und sein Bruder Manuel wurden 1936 erschossen. Sender verbrachte den Rest seines Lebens im Exil, in Mexiko und den Vereinigten Staaten, wo er als Universitätsprofessor lehrte. Er starb am 16. Januar 1982 in San Diego, Kalifornien.\n\n1974 kehrte er zu einem Besuch nach Spanien zurück, und 1980, kurz vor seinem Tod, beantragte er die Wiedererlangung der spanischen Staatsangehörigkeit."},{"h":"Sehenswert","t":"Der Parque Ramón J. Sender liegt an der Stelle seines Geburtshauses und besitzt eine dem Schriftsteller gewidmete Büste. Daneben erhebt sich die Pfarrkirche San Martín, das Gotteshaus des Dorfes, geweiht dem Heiligen, dessen Fest am 11. November das Patronatsfest von Chalamera ist.\n\nVon hier aus kann man auf den Hügel steigen, den die Einheimischen El Castillo nennen, wo eine Templerburg stand, von der nur wenige Reste geblieben sind, und zum Aussichtspunkt El Tozal mit Blick über die Ebene.\n\nDie Kirche San Martín und der Park bilden das Zentrum des Dorfes, wenige Schritte vom Platz entfernt. Ein guter Ort, um den Besuch zu beginnen und, wenn Sie ein Buch von Sender dabeihaben, im Schatten ein paar Seiten zu lesen."},{"h":"Zum Verständnis","t":"Die Comarca empfiehlt die Lektüre von Crónica del alba (Chronik der Morgenröte), dem neunteiligen Romanzyklus, in dem Sender seine Kindheit und Jugend im Hocharagón durch sein Alter Ego Pepe Garcés nachzeichnet. Es ist die beste Art, diese Dörfer mit seinen Augen zu sehen.\n\nSein meistgelesenes Werk, Réquiem por un campesino español, 1953 zunächst unter dem Titel Mosén Millán erschienen, erzählt die Geschichte eines jungen Mannes aus einem aragonesischen Dorf in den Tagen des Bürgerkriegs. Viele Leser erkennen darin Landschaften und Bräuche wie die am Cinca wieder."}],"pt":[{"h":"História","t":"Ramón José Sender Garcés nasceu em Chalamera a 3 de fevereiro de 1901. O pai trabalhava nas povoações da zona, e o menino passou aqui os primeiros anos, em Alcolea de Cinca e em Tauste. Em 1935 ganhou o Prémio Nacional de Literatura com Míster Witt en el cantón.\n\nA guerra marcou-o: a mulher, Amparo Barayón, e o irmão Manuel foram fuzilados em 1936. Sender viveu o resto da vida no exílio, no México e nos Estados Unidos, onde foi professor universitário. Morreu em San Diego, na Califórnia, a 16 de janeiro de 1982.\n\nEm 1974 voltou de visita a Espanha e em 1980 pediu para recuperar a nacionalidade espanhola, pouco antes de morrer."},{"h":"O que ver","t":"O parque Ramón J. Sender ocupa o lugar da sua casa natal e tem um busto dedicado ao escritor. Ao lado ergue-se a igreja paroquial de San Martín, o templo da povoação, dedicado ao santo cuja festa, a 11 de novembro, é a festa do padroeiro de Chalamera.\n\nDaqui pode subir-se à colina a que os habitantes chamam El Castillo, onde existiu uma fortaleza templária de que restam poucos vestígios, e ao miradouro do Tozal, com vistas sobre a planície.\n\nA igreja de San Martín e o parque formam o centro da povoação, a poucos passos da praça. É um bom lugar para começar a visita e, se levar um livro de Sender, para ler umas páginas à sombra."},{"h":"Para compreender","t":"A Comarca recomenda ler Crónica del alba, o ciclo de nove romances em que Sender recria a sua infância e juventude no Alto Aragão através do seu alter ego, Pepe Garcés. É a melhor maneira de olhar para estas povoações com os seus olhos.\n\nA sua obra mais lida, Réquiem por un campesino español, publicada primeiro como Mosén Millán em 1953, conta a história de um jovem de uma aldeia aragonesa nos dias da guerra. Muitos leitores reconhecem nela paisagens e costumes como os do Cinca."}]},"status":"pending"},{"id":"mirador-chalamera","town":"Chalamera","cat":"naturaleza","lat":41.66259,"lon":0.16514,"coord_src":null,"q":["Embarcadero río Alcanadre, Chalamera","Mirador del Tozal, Chalamera"],"fq":["Chalamera río Alcanadre","Chalamera embarcadero","Río Alcanadre Chalamera"],"name":{"es":"El Castillo, el Tozal y el embarcadero","en":"El Castillo, El Tozal and the landing stage","fr":"El Castillo, el Tozal et l'embarcadère","de":"El Castillo, El Tozal und die Anlegestelle","pt":"El Castillo, o Tozal e o cais"},"when":{"es":"Miradores y río Alcanadre · Naturaleza","en":"Viewpoints and the Alcanadre river · Nature","fr":"Belvédères et rivière Alcanadre · Nature","de":"Aussichtspunkte und Fluss Alcanadre · Natur","pt":"Miradouros e rio Alcanadre · Natureza"},"desc":{"es":"Chalamera está entre dos ríos, a pocos kilómetros de su encuentro. Sube a la colina del castillo templario y al mirador del Tozal para ver la llanura, y baja después al embarcadero del Alcanadre.","en":"Chalamera lies between two rivers, a few kilometres from where they meet. Climb the hill of the Templar castle and the Tozal viewpoint to look out over the plain, then head down to the landing stage on the Alcanadre.","fr":"Chalamera se trouve entre deux rivières, à quelques kilomètres de leur confluence. Montez sur la colline du château templier et au belvédère du Tozal pour voir la plaine, puis descendez à l'embarcadère de l'Alcanadre.","de":"Chalamera liegt zwischen zwei Flüssen, wenige Kilometer vor ihrem Zusammenfluss. Steigen Sie auf den Hügel der Templerburg und zum Aussichtspunkt El Tozal, um die Ebene zu überblicken, und gehen Sie danach hinunter zur Anlegestelle am Alcanadre.","pt":"Chalamera fica entre dois rios, a poucos quilómetros do seu encontro. Suba à colina do castelo templário e ao miradouro do Tozal para ver a planície, e desça depois ao cais do Alcanadre."},"visit":{"es":"La subida al cerro y al Tozal se hace a pie desde el pueblo, en unos 30-45 minutos ida y vuelta. El embarcadero está junto al río, con acceso libre. No hay servicios en los miradores: lleva agua en verano.","en":"The climb up the hill and to El Tozal is done on foot from the village, in about 30-45 minutes there and back. The landing stage is beside the river, with free access. There are no facilities at the viewpoints: take
