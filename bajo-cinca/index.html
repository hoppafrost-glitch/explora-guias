/* Layout: one-screen app. Map is the stage; a reading panel sits beside it (stacked under it on phones).
   Palette drawn from the Ribera: limestone ground, Ebro teal, mudéjar brick, steppe ochre. */
:root{
  --bg:#ECEFEA; --panel:#FAFBF8; --panel-2:#F2F4EF; --ink:#18221E; --muted:#56635D; --faint:#646F6A;
  --line:#D5DBD3; --accent:#17646C; --accent-ink:#FFFFFF; --accent-soft:#D6E8E8;
  --land:#E2E6DB; --land-hi:#D5DCCB; --land-out:#EEF0EA; --edge:#9AA79C; --outline:#17646C;
  --water:#3C8D96; --water-soft:#BFDCDD; --label:#2E3A35;
  --c-pat:#A4502C; --c-gue:#5A6A33; --c-mus:#7A4A7F; --c-hid:#2A6CA1; --c-nat:#3C8550; --c-arq:#97702F; --c-cam:#B98A0E;
  --ok:#2E7D4F; --shadow:0 1px 2px rgba(20,34,30,.08),0 6px 18px rgba(20,34,30,.08);
  --f-display:"Spectral",Georgia,"Times New Roman",serif;
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --panel:#141C19; --panel-2:#19231F; --ink:#E5ECE8; --muted:#9FADA7; --faint:#7E8C86;
  --line:#26332E; --accent:#5DB6BE; --accent-ink:#0B1513; --accent-soft:#183437;
  --land:#1A2420; --land-hi:#21302A; --land-out:#111815; --edge:#3A4A43; --outline:#5DB6BE;
  --water:#3E8F98; --water-soft:#1B3A3D; --label:#C9D4CF;
  --c-pat:#E08A63; --c-gue:#A9B872; --c-mus:#C08BC5; --c-hid:#6FA9DA; --c-nat:#7CC48D; --c-arq:#D6AE68; --c-cam:#E5BD45;
  --ok:#69C08E; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --panel:#141C19; --panel-2:#19231F; --ink:#E5ECE8; --muted:#9FADA7; --faint:#7E8C86;

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

#app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:1001}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.brand svg{flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:1.28rem;line-height:1.1;letter-spacing:.01em}
.brand-sub{font-size:.74rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel-2)}
.langs button{border:0;background:transparent;padding:5px 10px;font-size:.78rem;font-weight:600;letter-spacing:.05em;cursor:pointer;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.demo-tag{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);border-radius:4px;padding:2px 6px}

main{display:grid;grid-template-columns:minmax(330px,410px) 1fr;min-height:0}
#panel{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
#mapwrap{position:relative;min-height:0;min-width:0}
#map{position:absolute;inset:0;background:var(--bg)}
@media (max-width:760px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(260px,46%) 1fr}
  #mapwrap{order:-1}
  #panel{border-right:0;border-top:1px solid var(--line)}

.tbl th{color:var(--faint);font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em}
.tbl td.n{text-align:right}
.note{font-size:.78rem;color:var(--faint);line-height:1.45}

/* Map */
.leaflet-container{font-family:var(--f-ui);background:var(--bg)}
.muni{fill:var(--land);stroke:var(--edge);stroke-width:.8}
.muni.out{fill:var(--land-out);stroke:var(--edge);stroke-opacity:.45;stroke-width:.6}
.muni.hl{fill:var(--land-hi)}
.comarca-outline{fill:none;stroke:var(--outline);stroke-width:2.2;stroke-dasharray:1 0}
.river-halo{stroke:var(--water-soft);stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.river{stroke:var(--water);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tiles-on .muni{fill-opacity:.0;stroke-opacity:.6}
.tiles-on .muni.out{fill-opacity:0}
.tiles-on .river,.tiles-on .river-halo{stroke-opacity:0}
.tiles-on .town-label,.tiles-on .river-label{display:none}
.tiles-on .comarca-outline{stroke-width:2.6;stroke-opacity:.85}
.route-line{stroke:var(--c);stroke-width:3.5;stroke-dasharray:2 7;stroke-linecap:round;fill:none}
.town-label{font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--label);white-space:nowrap;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 6px var(--bg);pointer-events:none;letter-spacing:.02em;transform:translate(-50%,7px);display:inline-block}
.town-label.out{font-weight:500;font-size:11px;color:var(--faint);font-style:italic}
.river-label{font-family:var(--f-display);font-style:italic;font-size:14px;color:var(--water);letter-spacing:.35em;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg);white-space:nowrap;pointer-events:none;transform:translate(-50%,-50%) rotate(-12deg);display:inline-block}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 6px;transform:rotate(-45deg);background:var(--c);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.35);border:2px solid var(--panel);transition:transform .15s}
.pin svg{width:15px;height:15px;transform:rotate(45deg);color:#fff}
.pin.sel{transform:rotate(-45deg) scale(1.28);border-color:var(--ink)}
.pin.dim{opacity:.28}
.zlow .pin{width:13px;height:13px;border-radius:50%;transform:translate(-2.5px,23.5px);border-width:1.5px}
.zlow .pin svg{display:none}
.zlow .pin.sel{transform:translate(-2.5px,23.5px) scale(1.6)}
.zfar .town-label.minor{display:none}
.stopnum{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--panel);font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--panel);transform:translate(14px,-40px);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.zlow .stopnum{transform:translate(4px,-14px)}
.leaflet-control-zoom a,.mapbtn{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:var(--shadow)!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 85%,transparent)!important;color:var(--muted)!important;font-size:10px!important}
.leaflet-control-attribution a{color:var(--accent)!important}
.leaflet-top.leaflet-left{left:env(safe-area-inset-left,0px)}
.layerbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;display:flex;flex-direction:column;gap:2px}
.layerbox button{border:0;background:none;text-align:left;padding:6px 10px;border-radius:6px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--muted)}
.layerbox button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.legend{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px 10px;font-size:.74rem;display:flex;flex-direction:column;gap:3px;max-width:180px}
.legend div{display:flex;align-items:center;gap:7px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
@media (max-width:760px){.legend{display:none}.layerbox{flex-direction:row;padding:3px;margin-left:max(10px,env(safe-area-inset-left,0px))!important}.layerbox button{padding:5px 8px;font-size:.72rem}.leaflet-bottom.leaflet-left{bottom:16px}}

/* Móvil: la página entera hace scroll; el mapa queda arriba y se va al bajar, así se lee a pantalla completa */
@media (max-width:760px){
  html,body{height:auto}
  #app{height:auto;display:block}
  main{display:flex;flex-direction:column}
  #mapwrap{order:-1;height:40vh;height:40svh;min-height:230px;flex:none}
  #panel{min-height:calc(100vh - 56px);min-height:calc(100svh - 56px)}
  nav.tabs{position:sticky;top:0;z-index:1002;background:var(--panel)}
  .view{overflow:visible;flex:none;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  #tomap{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:1500;display:flex;align-items:center;gap:7px;
    border:0;border-radius:999px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.86rem;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;
    transition:opacity .2s,transform .2s}
  #tomap svg{width:17px;height:17px}
  #tomap[data-off]{opacity:0;transform:translateY(12px);pointer-events:none}
}
@media (min-width:761px){#tomap{display:none}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:8px;font-size:.86rem;z-index:5000;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- avisos, pasaporte, agenda, gestión ---- */
.btn.primary span,.btn.primary{color:var(--accent-ink)}
.aviso{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--panel-2);border-radius:10px;padding:10px 12px;font-size:.88rem}
.aviso b{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.aviso.warn{border-left-color:#B4441F}.aviso.warn b{color:#B4441F}
.aviso.prize{border-left-color:#B8860B}.aviso.prize b{color:#8A6508}
.stampbox,.passcta{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel-2)}
.passcta{width:100%;cursor:pointer;font:inherit;color:var(--ink);text-align:left}
.passcta:hover{border-color:var(--accent)}
.passcta .go{margin-left:auto;font-size:1.4rem;color:var(--muted)}
.seal{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--c,var(--accent));color:var(--c,var(--accent))}
.seal svg{width:22px;height:22px}
.stampbox.done .seal{border-style:solid;background:var(--c);color:#fff}
.passcta.ag .seal{border-style:solid;border-radius:12px}
.passhead{display:flex;align-items:center;gap:16px}
.ring{--p:0;flex:none;width:92px;height:92px;border-radius:50%;display:grid;place-content:center;text-align:center;
  background:radial-gradient(closest-side,var(--panel) 78%,transparent 79%),conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
.ring b{font-size:1.6rem;line-height:1}.ring span{font-size:.75rem;color:var(--muted)}
.prow{display:grid;grid-template-columns:1fr;gap:4px;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);cursor:pointer;font:inherit;color:var(--ink)}
.prow .t{font-weight:600;font-size:.92rem}
.pbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.pbar i{display:block;height:100%;background:var(--c)}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin:6px 0 10px}
.stamp{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;cursor:pointer;font:inherit;color:var(--muted);padding:4px}
.stamp .seal{width:58px;height:58px;border-color:var(--line)}
.stamp.on .seal{border:2px solid var(--c);background:var(--c);color:#fff}
.stamp.on{color:var(--ink)}
.stamp .nm{font-size:.74rem;line-height:1.25;text-align:center;overflow-wrap:break-word;hyphens:auto;max-width:100%}
.ev{display:flex;gap:12px;border-bottom:1px solid var(--line);padding:10px 0}
.ev p{margin:2px 0 0;font-size:.88rem}
.cal{flex:none;width:52px;border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:center;background:var(--panel)}
.cal span{display:block;background:var(--accent);color:var(--accent-ink);font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 0}
.cal b{display:block;font-size:1.2rem;padding:4px 0}
.cal{align-self:flex-start}.cal.m{border:2px solid var(--accent)}.cal.m b{font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);padding:9px 0}
.bars.wide .bar{grid-template-columns:minmax(0,1.4fr) 1fr auto}.bars.wide .bar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.neg{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:8px 0}
.adm-nav{display:flex;flex-wrap:wrap;gap:6px}
.adm-nav a{font-size:.8rem;border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--ink);text-decoration:none;background:var(--panel-2)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.two-col{grid-template-columns:1fr}}
.foot-links{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;padding-bottom:8px}
.foot-links a{color:var(--muted)}
details summary{cursor:pointer;padding:4px 0}
.skip{position:absolute;left:-9999px;top:8px;z-index:9999;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;font-weight:700}
.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

</style>

<div id="cover" hidden></div>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<div id="app"><a class="skip" href="#panel" data-i="skipLink"></a>
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="var(--accent)"/><path d="M4 22c5-1 6-7 11-7s5 9 10 9 4-6 5-7" stroke="var(--accent-ink)" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="23" cy="10" r="2.6" fill="var(--accent-ink)"/></svg>
      <div style="min-width:0">
        <div class="brand-name">Bajo Cinca Explora</div>
        <div class="brand-sub" data-i="appSub"></div>
      </div>
    </div>
    <span class="demo-tag" data-i="demo"></span>
    <div class="langs" role="group" aria-label="Idioma / Language" id="langs"></div>
  </header>
  <main>
    <aside id="panel">
      <nav class="tabs" role="tablist" id="tabs">
        <button role="tab" data-tab="inicio" data-i="tabHome"></button>
        <button role="tab" data-tab="explorar" data-i="tabExplore"></button>
        <button role="tab" data-tab="rutas" data-i="tabRoutes"></button>
        <button role="tab" data-tab="agenda" data-i="tabAgenda"></button>
        <button role="tab" data-tab="pasaporte" data-i="tabPass"></button>
      </nav>
      <section class="view stack" id="v-inicio"></section>
      <section class="view stack" id="v-explorar" hidden></section>
      <section class="view stack" id="v-lugar" hidden></section>
      <section class="view stack" id="v-rutas" hidden></section>
      <section class="view stack" id="v-agenda" hidden></section>
      <section class="view stack" id="v-pasaporte" hidden></section>
      <section class="view stack" id="v-gestion" hidden></section>
    </aside>
    <div id="mapwrap"><div id="map" role="application" aria-label="Mapa"></div></div>
    <button type="button" id="tomap" data-off><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 4-6 3v13l6-3 6 3 6-3V4l-6 3-6-3z"/><path d="M9 4v13M15 7v13"/></svg><span data-i="tabMap"></span></button>
  </main>
</div>

 d=\"M3 9.5 12 4l9 5.5\"/><path d=\"M5.5 11v7M10 11v7M14 11v7M18.5 11v7\"/><path d=\"M3 20.5h18\"/>"},"arqueologia":{"color":"--c-arq","icon":"<path d=\"M9 3h6\"/><path d=\"M10 3v3.2C7.2 8 6.3 11 7 14.5L9 20h6l2-5.5c.7-3.5-.2-6.5-3-8.3V3\"/>"},"hidraulico":{"color":"--c-hid","icon":"<circle cx=\"12\" cy=\"12\" r=\"7.5\"/><circle cx=\"12\" cy=\"12\" r=\"1.8\"/><path d=\"M12 4.5v15M4.5 12h15M6.7 6.7l10.6 10.6M17.3 6.7 6.7 17.3\"/>"},"naturaleza":{"color":"--c-nat","icon":"<path d=\"M2.5 11c2.8-2.6 5.6-2.6 8 .3 2.4-2.9 5.2-2.9 8-.3\"/><path d=\"M8 17c1.6-1.5 3.2-1.5 4.6.2 1.4-1.7 3-1.7 4.6-.2\"/>"},"camino":{"color":"--c-cam","icon":"<path d=\"M12 20.5 3.5 9.2a9.5 9.5 0 0 1 17 0z\"/><path d=\"M12 20.5 8 6.5M12 20.5V5M12 20.5l4-14\"/>"}},"pois":[{"id":"villa-fortunatus","town":"Fraga","cat":"arqueologia","lat":41.55622,"lon":0.31856,"coord_src":"https://es.wikipedia.org/wiki/Villa_Fortunatus","q":["Villa Fortunatus, Fraga","Villa romana Fortunatus"],"fq":["Category:Villa Fortunatus","Villa Fortunatus Fraga","Villa Fortunatus mosaico","Fortunatus Fraga basílica"],"name":{"es":"Villa Fortunatus","en":"Villa Fortunatus","fr":"Villa Fortunatus","de":"Villa Fortunatus","pt":"Villa Fortunatus"},"when":{"es":"Siglos II-VI · Villa romana y basílica","en":"2nd-6th centuries · Roman villa and basilica","fr":"IIe-VIe siècles · Villa romaine et basilique","de":"2.–6. Jh. · Römische Villa und Basilika","pt":"Séculos II-VI · Villa romana e basílica"},"desc":{"es":"Una gran casa de campo romana a orillas del Cinca, a unos 5 km de Fraga. Sus mosaicos del siglo IV y el que lleva el nombre de Fortunatus junto a un crismón la convierten en el yacimiento de referencia de la comarca.","en":"A large Roman country house on the banks of the Cinca, about 5 km from Fraga. Its 4th-century mosaics, including the one bearing the name Fortunatus beside a Chi-Rho, make it the comarca's (district's) leading archaeological site.","fr":"Une grande demeure rurale romaine au bord du Cinca, à environ 5 km de Fraga. Ses mosaïques du IVe siècle, dont celle qui porte le nom de Fortunatus à côté d'un chrisme, en font le site archéologique de référence de la comarque.","de":"Ein großes römisches Landgut am Ufer des Cinca, rund 5 km von Fraga entfernt. Seine Mosaiken aus dem 4. Jahrhundert, darunter jenes mit dem Namen Fortunatus neben einem Christusmonogramm, machen es zur bedeutendsten Fundstätte der Comarca.","pt":"Uma grande casa de campo romana nas margens do Cinca, a cerca de 5 km de Fraga. Os seus mosaicos do século IV e aquele que ostenta o nome de Fortunatus junto a um crismón fazem dela o sítio arqueológico de referência da comarca."},"visit":{"es":"Está junto a la carretera A-1234, de Fraga hacia Zaidín, protegida por una gran cubierta. Se recorre por fuera en unos 30-45 minutos. Las condiciones de acceso y las visitas guiadas han cambiado con los años: confírmalas en la oficina de turismo de la Comarca, en Fraga.","en":"It stands beside the A-1234 road from Fraga towards Zaidín, protected by a large roof. A walk around the outside takes about 30-45 minutes. Access arrangements and guided tours have changed over the years, so check them with the Comarca tourist office in Fraga.","fr":"Elle se trouve au bord de la route A-1234, de Fraga vers Zaidín, protégée par une vaste toiture. On en fait le tour par l'extérieur en 30 à 45 minutes environ. Les conditions d'accès et les visites guidées ont changé au fil des ans : renseignez-vous auprès de l'office de tourisme de la Comarca, à Fraga.","de":"Die Villa liegt an der Straße A-1234 von Fraga in Richtung Zaidín und wird von einem großen Schutzdach überspannt. Der Rundgang von außen dauert etwa 30–45 Minuten. Zugangsbedingungen und Führungen haben sich im Laufe der Jahre geändert: Erkundigen Sie sich am besten im Tourismusbüro der Comarca in Fraga.","pt":"Fica junto à estrada A-1234, de Fraga em direção a Zaidín, protegida por uma grande cobertura. Percorre-se por fora em cerca de 30-45 minutos. As condições de acesso e as visitas guiadas têm mudado ao longo dos anos: confirme-as no posto de turismo da Comarca, em Fraga."},"src":"https://es.wikipedia.org/wiki/Villa_Fortunatus","sources":["https://es.wikipedia.org/wiki/Villa_Fortunatus","https://es.hispanopedia.com/wiki/Villa_Fortunatus","https://www.enciclopedia.cat/del-roma-al-romanic/villa-fortunatus-fraga","https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5489201"],"art":{"es":[{"h":"Historia","t":"La villa se levantó en una terraza del río Cinca, entre dos barrancos, en la partida de Santa Quiteria. La romanización del Bajo Cinca empezó en el siglo II, y de esa época es la parte más antigua de la casa, el ala oeste. Entre finales del siglo III y comienzos del IV la vivienda se amplió, se unió a la parte nueva con una escalera y sus salas se cubrieron de mosaicos.\n\nUno de ellos lleva el nombre FORTUNATUS partido por un crismón, el anagrama de Cristo, con las letras alfa y omega. Por eso suele pensarse que el propietario era cristiano o simpatizaba con la nueva fe, aunque algunos investigadores han propuesto otras lecturas. Ya abandonada como vivienda, en la Antigüedad tardía parte de la casa se transformó en una basílica paleocristiana con baptisterio. José Salarrullana dio a conocer el lugar a finales del siglo XIX y las excavaciones del siglo XX sacaron a la luz la basílica y las termas."},{"h":"Qué ver","t":"Bajo la cubierta se distingue el peristilo, un patio porticado de unos 20,5 por 17 metros con un jardín central, un pequeño estanque y un pozo. Las habitaciones de los dueños estaban al oeste, la sala de recepción al sur y las termas y letrinas al este.\n\nLa basílica tenía tres naves y un ábside semicircular por dentro y cuadrado por fuera. A los pies queda el baptisterio, con la pila hundida en el suelo y rodeada por cuatro columnas; a su lado se reutilizó, boca abajo, un altar votivo romano. La mayor parte de los mosaicos se conserva en el Museo de Zaragoza."},{"h":"Curiosidades","t":"En la galería sur había un calendario agrícola de doce cuadros, uno por mes, con animales y frutos: un toro y mijo para mayo, un león y frambuesas para agosto, un oso y un madroño para noviembre. Dos de esos cuadros siguen en su sitio.\n\nLa villa fue declarada Bien de Interés Cultural, como zona arqueológica, en 2004, y en 2009 el Gobierno de Aragón la cubrió para protegerla. Fíjate en su posición: domina la vega del Cinca, la tierra que la hacía rica."},{"h":"Para entenderlo","t":"Una villa romana no era solo una casa: era el centro de una gran explotación agrícola, con viviendas para trabajadores, almacenes, prensas y establos alrededor de la residencia del dueño. La parte noble, con sus mosaicos, termas y jardín, servía para vivir con comodidad y para mostrar el rango del propietario ante sus visitas.\n\nLa vega del Cinca, con agua abundante y buena tierra, estaba salpicada de villas como esta en los siglos del Imperio. Muy cerca, la ermita de San Valero de Velilla se levanta sobre un mausoleo de la misma época, y en el cerro del Pilaret, a la vista, hubo un poblado ibérico anterior."}],"en":[{"h":"History","t":"The villa was built on a terrace above the river Cinca, between two ravines, in the area known as Santa Quiteria. The Romanisation of the Bajo Cinca began in the 2nd century, and the oldest part of the house, the west wing, dates from that time. Between the late 3rd and early 4th centuries the residence was enlarged, joined to the new section by a staircase, and its rooms were paved with mosaics.\n\nOne of them bears the name FORTUNATUS split by a Chi-Rho, the monogram of Christ, with the letters alpha and omega. This is why the owner is often thought to have been a Christian or sympathetic to the new faith, although some scholars have proposed other readings. Once it was no longer lived in, part of the house was converted in Late Antiquity into an early Christian basilica with a baptistery. José Salarrullana brought the site to light at the end of the 19th century, and 20th-century excavations uncovered the basilica and the baths."},{"h":"What to see","t":"Under the roof you can make out the peristyle, a colonnaded courtyard measuring about 20.5 by 17 metres, with a central garden, a small pool and a well. The owners' rooms lay to the west, the reception hall to the south, and the baths and latrines to the east.\n\nThe basilica had three naves and an apse that was semicircular inside and square outside. At its foot is the baptistery, with the font sunk into the floor and surrounded by four columns; next to it, a Roman votive altar was reused upside down. Most of the mosaics are kept in the Museo de Zaragoza."},{"h":"Did you know?","t":"The south gallery had an agricultural calendar of twelve panels, one for each month, with animals and fruits: a bull and millet for May, a lion and raspberries for August, a bear and a strawberry tree for November. Two of those panels are still in place.\n\nThe villa was declared a Bien de Interés Cultural (Site of Cultural Interest) as an archaeological zone in 2004, and in 2009 the Government of Aragón roofed it over to protect it. Notice its position: it overlooks the Cinca floodplain, the land that made it wealthy."},{"h":"Background","t":"A Roman villa was not just a house: it was the hub of a large farming estate, with workers' quarters, storerooms, presses and stables around the owner's residence. The grand part, with its mosaics, baths and garden, was for living in comfort and for displaying the owner's standing to visitors.\n\nThe Cinca floodplain, with plenty of water and good soil, was dotted with villas like this one during the centuries of the Empire. Close by, the hermitage of San Valero in Velilla stands on a mausoleum from the same period, and on the hill of El Pilaret, within sight, there was an earlier Iberian settlement."}],"fr":[{"h":"Histoire","t":"La villa fut bâtie sur une terrasse du Cinca, entre deux ravins, au lieu-dit Santa Quiteria. La romanisation du Bajo Cinca commença au IIe siècle, et c'est de cette époque que date la partie la plus ancienne de la maison, l'aile ouest. Entre la fin du IIIe siècle et le début du IVe, la demeure fut agrandie, reliée à la nouvelle partie par un escalier, et ses salles se couvrirent de mosaïques.\n\nL'une d'elles porte le nom FORTUNATUS coupé par un chrisme, le monogramme du Christ, accompagné des lettres alpha et oméga. On en déduit généralement que le propriétaire était chrétien ou sympathisant de la nouvelle foi, même si certains chercheurs ont proposé d'autres lectures. Une fois abandonnée comme habitation, une partie de la maison fut transformée, durant l'Antiquité tardive, en basilique paléochrétienne dotée d'un baptistère. José Salarrullana fit connaître le site à la fin du XIXe siècle, et les fouilles du XXe siècle mirent au jour la basilique et les thermes."},{"h":"À voir","t":"Sous la toiture, on distingue le péristyle, une cour à portiques d'environ 20,5 mètres sur 17, avec un jardin central, un petit bassin et un puits. Les appartements des maîtres se trouvaient à l'ouest, la salle de réception au sud, les thermes et les latrines à l'est.\n\nLa basilique comptait trois nefs et une abside semi-circulaire à l'intérieur et carrée à l'extérieur. Au fond se trouve le baptistère, avec sa cuve enfoncée dans le sol et entourée de quatre colonnes ; à côté, on a réutilisé, à l'envers, un autel votif romain. La plupart des mosaïques sont conservées au Musée de Saragosse."},{"h":"Le saviez-vous ?","t":"La galerie sud abritait un calendrier agricole de douze tableaux, un par mois, avec des animaux et des fruits : un taureau et du millet pour mai, un lion et des framboises pour août, un ours et un arbousier pour novembre. Deux de ces tableaux sont toujours en place.\n\nLa villa a été classée Bien d'intérêt culturel, en tant que zone archéologique, en 2004, et en 2009 le Gouvernement d'Aragon l'a couverte pour la protéger. Observez sa position : elle domine la plaine fertile du Cinca, la terre qui faisait sa richesse."},{"h":"Pour comprendre","t":"Une villa romaine n'était pas seulement une maison : c'était le centre d'un grand domaine agricole, avec des logements pour les travailleurs, des entrepôts, des pressoirs et des étables autour de la résidence du maître. La partie noble, avec ses mosaïques, ses thermes et son jardin, permettait de vivre confortablement et d'afficher le rang du propriétaire auprès de ses visiteurs.\n\nLa plaine du Cinca, riche en eau et en bonne terre, était parsemée de villas comme celle-ci aux siècles de l'Empire. Tout près, l'ermitage de San Valero de Velilla s'élève sur un mausolée de la même époque, et sur la colline du Pilaret, visible d'ici, se dressait auparavant un village ibère."}],"de":[{"h":"Geschichte","t":"Die Villa entstand auf einer Flussterrasse des Cinca zwischen zwei Schluchten, in der Flur Santa Quiteria. Die Romanisierung des Bajo Cinca begann im 2. Jahrhundert; aus dieser Zeit stammt der älteste Teil des Hauses, der Westflügel. Zwischen dem späten 3. und dem frühen 4. Jahrhundert wurde das Anwesen erweitert, über eine Treppe mit dem neuen Teil verbunden, und seine Räume erhielten Mosaikböden.\n\nEines dieser Mosaiken trägt den Namen FORTUNATUS, geteilt durch ein Christusmonogramm mit den Buchstaben Alpha und Omega. Deshalb nimmt man meist an, dass der Besitzer Christ war oder dem neuen Glauben nahestand, auch wenn einige Forscher andere Deutungen vorgeschlagen haben. Nachdem das Haus nicht mehr bewohnt war, wurde in der Spätantike ein Teil davon in eine frühchristliche Basilika mit Baptisterium umgewandelt. José Salarrullana machte den Ort Ende des 19. Jahrhunderts bekannt, und die Grabungen des 20. Jahrhunderts legten Basilika und Thermen frei."},{"h":"Sehenswert","t":"Unter dem Schutzdach erkennt man das Peristyl, einen von Säulengängen umgebenen Hof von etwa 20,5 mal 17 Metern mit einem Garten in der Mitte, einem kleinen Becken und einem Brunnen. Die Wohnräume der Eigentümer lagen im Westen, der Empfangssaal im Süden, Thermen und Latrinen im Osten.\n\nDie Basilika war dreischiffig und besaß eine Apsis, die innen halbrund und außen rechteckig war. Am Westende liegt das Baptisterium mit einem in den Boden eingelassenen, von vier Säulen umgebenen Taufbecken; daneben wurde ein römischer Votivaltar kopfüber wiederverwendet. Die meisten Mosaiken befinden sich heute im Museo de Zaragoza."},{"h":"Wissenswertes","t":"In der Südgalerie gab es einen landwirtschaftlichen Kalender aus zwölf Bildfeldern, eines für jeden Monat, mit Tieren und Früchten: ein Stier und Hirse für den Mai, ein Löwe und Himbeeren für den August, ein Bär und ein Erdbeerbaum für den November. Zwei dieser Felder sind noch an Ort und Stelle erhalten.\n\nDie Villa wurde 2004 als archäologische Zone zum Bien de Interés Cultural (Kulturgut von besonderem Interesse) erklärt, und 2009 ließ die Regierung von Aragón sie zum Schutz überdachen. Achten Sie auf ihre Lage: Sie überblickt die fruchtbare Flussaue des Cinca, das Land, das sie reich machte."},{"h":"Zum Verständnis","t":"Eine römische Villa war nicht nur ein Wohnhaus, sondern das Zentrum eines großen landwirtschaftlichen Betriebs, mit Unterkünften für die Arbeiter, Lagerräumen, Pressen und Ställen rund um die Residenz des Besitzers. Der herrschaftliche Teil mit Mosaiken, Thermen und Garten diente dem bequemen Wohnen und dazu, Besuchern den Rang des Eigentümers vor Augen zu führen.\n\nDie Aue des Cinca mit reichlich Wasser und gutem Boden war in den Jahrhunderten des Kaiserreichs mit Villen wie dieser übersät. Ganz in der Nähe steht die Einsiedelei San Valero in Velilla auf einem Mausoleum derselben Epoche, und auf dem Hügel des Pilaret, in Sichtweite, lag zuvor eine iberische Siedlung."}],"pt":[{"h":"História","t":"A villa ergueu-se num terraço do rio Cinca, entre duas ravinas, na zona de Santa Quiteria. A romanização do Bajo Cinca começou no século II, e dessa época é a parte mais antiga da casa, a ala oeste. Entre finais do século III e inícios do IV a habitação foi ampliada, ligada à parte nova por uma escadaria, e as suas salas cobriram-se de mosaicos.\n\nUm deles ostenta o nome FORTUNATUS dividido por um crismón, o monograma de Cristo, com as letras alfa e ómega. Por isso costuma pensar-se que o proprietário era cristão ou simpatizava com a nova fé, embora alguns investigadores tenham proposto outras leituras. Já abandonada como habitação, na Antiguidade tardia parte da casa foi transformada numa basílica paleocristã com batistério. José Salarrullana deu a conhecer o lugar em finais do século XIX e as escavações do século XX puseram a descoberto a basílica e as termas."},{"h":"O que ver","t":"Sob a cobertura distingue-se o peristilo, um pátio com pórticos de cerca de 20,5 por 17 metros, com um jardim central, um pequeno tanque e um poço. Os aposentos dos donos ficavam a oeste, a sala de receção a sul e as termas e latrinas a leste.\n\nA basílica tinha três naves e uma abside semicircular por dentro e quadrada por fora. Ao fundo fica o batistério, com a pia afundada no chão e rodeada por quatro colunas; ao lado foi reaproveitado, de pernas para o ar, um altar votivo romano. A maior parte dos mosaicos conserva-se no Museo de Zaragoza."},{"h":"Curiosidades","t":"Na galeria sul havia um calendário agrícola de doze quadros, um por mês, com animais e frutos: um touro e milho-miúdo para maio, um leão e framboesas para agosto, um urso e um medronheiro para novembro. Dois desses quadros continuam no lugar.\n\nA villa foi declarada Bien de Interés Cultural (Bem de Interesse Cultural), como zona arqueológica, em 2004, e em 2009 o Governo de Aragão cobriu-a para a proteger. Repare na sua posição: domina a várzea do Cinca, a terra que a tornava rica."},{"h":"Para compreender","t":"Uma villa romana não era apenas uma casa: era o centro de uma grande exploração agrícola, com habitações para os trabalhadores, armazéns, lagares e estábulos em redor da residência do dono. A parte nobre, com os seus mosaicos, termas e jardim, servia para viver com conforto e para mostrar a posição do proprietário perante as visitas.\n\nA várzea do Cinca, com água abundante e boa terra, estava salpicada de villas como esta nos séculos do Império. Muito perto, a ermida de San Valero de Velilla ergue-se sobre um mausoléu da mesma época, e no cerro do Pilaret, à vista, existiu um povoado ibérico anterior."}]},"status":"pending"},{"id":"san-pedro-fraga","town":"Fraga","cat":"patrimonio","lat":41.5223,"lon":0.34883,"coord_src":"https://es.wikipedia.org/wiki/Iglesia_de_San_Pedro_(Fraga)","q":["Iglesia de San Pedro, Fraga","Plaza de San Pedro, Fraga"],"fq":["Category:Church of San Pedro (Fraga)","Iglesia de San Pedro Fraga","Fraga San Pedro torre","Fraga casco antiguo iglesia"],"name":{"es":"Iglesia de San Pedro","en":"Iglesia de San Pedro (Church of St Peter)","fr":"Iglesia de San Pedro (église Saint-Pierre)","de":"Iglesia de San Pedro","pt":"Igreja de San Pedro"},"when":{"es":"Siglos XII-XIII · Románico y gótico","en":"12th-13th centuries · Romanesque and Gothic","fr":"XIIe-XIIIe siècles · Roman et gothique","de":"12.–13. Jh. · Romanik und Gotik","pt":"Séculos XII-XIII · Românico e gótico"},"desc":{"es":"La iglesia mayor de Fraga, en lo alto del casco antiguo. Se levantó donde estuvo la mezquita mayor y su torre de seis cuerpos es la silueta que identifica la ciudad desde el río.","en":"Fraga's main church, at the top of the old town. It was built where the great mosque once stood, and its six-stage tower is the silhouette that identifies the town from the river.","fr":"L'église principale de Fraga, au sommet de la vieille ville. Elle fut élevée à l'emplacement de la grande mosquée, et sa tour à six niveaux est la silhouette qui identifie la ville depuis la rivière.","de":"Die Hauptkirche von Fraga, hoch oben in der Altstadt. Sie wurde an der Stelle der einstigen Hauptmoschee errichtet, und ihr Turm mit sechs Geschossen ist die Silhouette, an der man die Stadt vom Fluss aus erkennt.","pt":"A igreja principal de Fraga, no alto do centro histórico. Foi erguida onde existiu a mesquita maior, e a sua torre de seis corpos é a silhueta que identifica a cidade a partir do rio."},"visit":{"es":"Se llega a pie desde el paseo junto al Cinca subiendo por la calle Mayor hasta la plaza de San Pedro. Por fuera se ve en cualquier momento; el interior se puede visitar en horario de culto o con visita concertada. Confirma horarios en la oficina de turismo.","en":"Walk up from the riverside promenade along the Cinca via Calle Mayor to Plaza de San Pedro. The outside can be seen at any time; the interior can be visited during services or on a pre-booked tour. Check opening times at the tourist office.","fr":"On y monte à pied depuis la promenade au bord du Cinca par la calle Mayor jusqu'à la plaza de San Pedro. L'extérieur se voit à tout moment ; l'intérieur se visite pendant les offices ou sur rendez-vous. Vérifiez les horaires auprès de l'office de tourisme.","de":"Zu Fuß erreicht man sie von der Uferpromenade am Cinca über die Calle Mayor hinauf bis zur Plaza de San Pedro. Von außen ist sie jederzeit zu sehen; das Innere kann während der Gottesdienstzeiten oder nach Vereinbarung besichtigt werden. Bitte erfragen Sie die Zeiten im Tourismusbüro.","pt":"Chega-se a pé a partir do passeio junto ao Cinca, subindo pela calle Mayor até à plaza de San Pedro. Por fora pode ver-se a qualquer momento; o interior pode ser visitado no horário de culto ou com visita marcada. Confirme os horários no posto de turismo."},"src":"https://www.urbipedia.org/hoja/Iglesia_de_San_Pedro_(Fraga)","sources":["https://www.urbipedia.org/hoja/Iglesia_de_San_Pedro_(Fraga)","https://es.wikipedia.org/wiki/Fraga_(Huesca)","https://es.hispanopedia.com/wiki/Fraga_(Huesca)","https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5489201","https://www.festivalesdeespana.com/festival/dia-de-la-faldeta-fraga/2025"],"art":{"es":[{"h":"Historia","t":"Según la tradición, el templo tiene origen visigodo y en época andalusí, cuando la ciudad se llamaba Medina Afraga, fue la mezquita mayor. Tras la conquista cristiana de 1149 pasó a ser iglesia, y el edificio actual se construyó entre finales del siglo XII y principios del XIII.\n\nCon los siglos sumó capas: la bóveda de crucería estrellada es tardogótica, el coro del siglo XVI hizo desaparecer el claustro medieval que había frente a la fachada y a finales del XVIII se añadieron la galería y el alero.\n\nLa iglesia fue durante siglos el centro religioso de una ciudad fronteriza, a medio camino entre Zaragoza y Lérida, y su tamaño refleja la importancia que tuvo Fraga en la Corona de Aragón."},{"h":"Qué ver","t":"Busca la portada sur, en el brazo del crucero. Sus capiteles románicos, de hacia el primer tercio del siglo XIII, muestran escenas como San Miguel frente a un monstruo o las tentaciones de Cristo.\n\nDentro, la nave única mide unos 41,5 metros de largo por 10 de ancho. La torre tiene seis cuerpos y remata en un chapitel octogonal: los cuerpos bajos tienen arcos de medio punto, de tradición románica, y los altos ventanales góticos apuntados. Desde la plaza se entiende por qué se eligió este punto: es el corazón del casco viejo, a medio camino entre el río y el castillo.\n\nAntes de entrar, rodea el templo para ver cómo encaja en la ladera: el edificio se adapta al desnivel del terreno, y desde la parte baja la torre parece aún más alta."},{"h":"Tradiciones y fiestas","t":"San Pedro es el escenario de uno de los momentos más vistosos del Día de la Faldeta, la fiesta de Interés Turístico Nacional que Fraga celebra en abril. Ese fin de semana se recrea aquí una boda fragatina de principios del siglo XX, con cortejo nupcial, jotas a los novios y cientos de mujeres vestidas con el traje tradicional.\n\nAl salir, baja por la calle Mayor, el antiguo centro de la vida fragatina, con sus calles estrechas, aleros, balcones de forja y escudos."}],"en":[{"h":"History","t":"According to tradition, the church has Visigothic origins and in the Andalusi period, when the town was called Medina Afraga, it was the great mosque. After the Christian conquest of 1149 it became a church, and the present building was constructed between the late 12th and early 13th centuries.\n\nOver the centuries it gained new layers: the star-ribbed vault is Late Gothic, the 16th-century choir did away with the medieval cloister in front of the façade, and the gallery and eaves were added at the end of the 18th century.\n\nFor centuries the church was the religious heart of a frontier town halfway between Zaragoza and Lleida, and its size reflects the importance Fraga held in the Crown of Aragón."},{"h":"What to see","t":"Look for the south doorway, in the transept arm. Its Romanesque capitals, from around the first third of the 13th century, show scenes such as St Michael facing a monster and the temptations of Christ.\n\nInside, the single nave is about 41.5 metres long and 10 wide. The tower has six stages and is topped by an octagonal spire: the lower stages have round arches, in the Romanesque tradition, and the upper ones pointed Gothic windows. From the square you can see why this spot was chosen: it is the heart of the old town, halfway between the river and the castle.\n\nBefore going in, walk around the church to see how it fits into the hillside: the building adapts to the slope of the ground, and from the lower side the tower looks even taller."},{"h":"Traditions and festivals","t":"San Pedro is the setting for one of the most colourful moments of the Día de la Faldeta, the festival of National Tourist Interest that Fraga holds in April. That weekend an early-20th-century Fraga wedding is re-enacted here, with a bridal procession, jotas sung to the couple and hundreds of women in traditional dress.\n\nAs you leave, head down Calle Mayor, once the centre of Fraga life, with its narrow streets, eaves, wrought-iron balconies and coats of arms."}],"fr":[{"h":"Histoire","t":"Selon la tradition, l'édifice est d'origine wisigothique et, à l'époque andalouse, quand la ville s'appelait Medina Afraga, il fut la grande mosquée. Après la conquête chrétienne de 1149, il devint église, et l'édifice actuel fut construit entre la fin du XIIe siècle et le début du XIIIe.\n\nAu fil des siècles, il s'enrichit de nouvelles strates : la voûte d'ogives étoilée est de style gothique tardif, le chœur du XVIe siècle fit disparaître le cloître médiéval qui se trouvait devant la façade, et la galerie et l'avant-toit furent ajoutés à la fin du XVIIIe.\n\nPendant des siècles, l'église fut le centre religieux d'une ville frontalière, à mi-chemin entre Saragosse et Lérida, et ses dimensions reflètent l'importance qu'eut Fraga au sein de la Couronne d'Aragon."},{"h":"À voir","t":"Cherchez le portail sud, dans le bras du transept. Ses chapiteaux romans, datant environ du premier tiers du XIIIe siècle, montrent des scènes comme saint Michel face à un monstre ou les tentations du Christ.\n\nÀ l'intérieur, la nef unique mesure environ 41,5 mètres de long sur 10 de large. La tour compte six niveaux et se termine par une flèche octogonale : les niveaux inférieurs ont des arcs en plein cintre, de tradition romane, et les niveaux supérieurs de hautes baies gothiques en arc brisé. Depuis la place, on comprend pourquoi ce lieu fut choisi : c'est le cœur de la vieille ville, à mi-chemin entre la rivière et le château.\n\nAvant d'entrer, faites le tour de l'église pour voir comment elle s'insère dans la pente : l'édifice s'adapte au dénivelé du terrain et, vue d'en bas, la tour paraît encore plus haute."},{"h":"Traditions et fêtes","t":"San Pedro est le cadre de l'un des moments les plus spectaculaires du Día de la Faldeta, la fête d'intérêt touristique national que Fraga célèbre en avril. Ce week-end-là, on y reconstitue un mariage fragatin du début du XXe siècle, avec cortège nuptial, jotas chantées aux mariés et des centaines de femmes vêtues du costume traditionnel.\n\nEn sortant, descendez la calle Mayor, ancien centre de la vie fragatine, avec ses ruelles étroites, ses avant-toits, ses balcons en fer forgé et ses blasons."}],"de":[{"h":"Geschichte","t":"Der Überlieferung nach geht die Kirche auf westgotische Zeit zurück, und in der andalusischen Epoche, als die Stadt Medina Afraga hieß, war sie die Hauptmoschee. Nach der christlichen Eroberung von 1149 wurde sie zur Kirche, und der heutige Bau entstand zwischen dem späten 12. und dem frühen 13. Jahrhundert.\n\nIm Laufe der Jahrhunderte kamen weitere Schichten hinzu: Das Sterngewölbe ist spätgotisch, der Chor aus dem 16. Jahrhundert ließ den mittelalterlichen Kreuzgang vor der Fassade verschwinden, und Ende des 18. Jahrhunderts wurden die Galerie und das Traufdach ergänzt.\n\nJahrhundertelang war die Kirche das religiöse Zentrum einer Grenzstadt auf halbem Weg zwischen Zaragoza und Lleida, und ihre Größe spiegelt die Bedeutung wider, die Fraga in der Krone Aragón hatte."},{"h":"Sehenswert","t":"Suchen Sie das Südportal im Querhausarm. Seine romanischen Kapitelle aus dem ersten Drittel des 13. Jahrhunderts zeigen Szenen wie den heiligen Michael im Kampf mit einem Ungeheuer oder die Versuchungen Christi.\n\nIm Inneren misst das einzige Schiff etwa 41,5 Meter in der Länge und 10 Meter in der Breite. Der Turm hat sechs Geschosse und endet in einem achteckigen Helm: Die unteren Geschosse zeigen Rundbögen in romanischer Tradition, die oberen spitzbogige gotische Fenster. Vom Platz aus versteht man, warum dieser Ort gewählt wurde: Er ist das Herz der Altstadt, auf halbem Weg zwischen Fluss und Burg.\n\nGehen Sie vor dem Betreten einmal um die Kirche herum, um zu sehen, wie sie sich in den Hang fügt: Der Bau passt sich dem Gefälle des Geländes an, und von unten wirkt der Turm noch höher."},{"h":"Feste und Traditionen","t":"San Pedro ist Schauplatz eines der farbenprächtigsten Momente des Día de la Faldeta, des Festes von nationalem touristischem Interesse, das Fraga im April feiert. An diesem Wochenende wird hier eine Fragatiner Hochzeit aus dem frühen 20. Jahrhundert nachgestellt, mit Hochzeitszug, Jotas für das Brautpaar und Hunderten von Frauen in der traditionellen Tracht.\n\nGehen Sie danach die Calle Mayor hinunter, einst das Zentrum des Fragatiner Lebens, mit engen Gassen, Dachvorsprüngen, schmiedeeisernen Balkonen und Wappen."}],"pt":[{"h":"História","t":"Segundo a tradição, o templo tem origem visigótica e, na época al-andalusina, quando a cidade se chamava Medina Afraga, foi a mesquita maior. Após a conquista cristã de 1149 passou a ser igreja, e o edifício atual foi construído entre finais do século XII e inícios do XIII.\n\nAo longo dos séculos foi somando camadas: a abóbada de nervuras estrelada é gótica tardia, o coro do século XVI fez desaparecer o claustro medieval que existia em frente à fachada e em finais do século XVIII foram acrescentados a galeria e o beiral.\n\nA igreja foi durante séculos o centro religioso de uma cidade de fronteira, a meio caminho entre Saragoça e Lérida, e o seu tamanho reflete a importância que Fraga teve na Coroa de Aragão."},{"h":"O que ver","t":"Procure o portal sul, no braço do transepto. Os seus capitéis românicos, de cerca do primeiro terço do século XIII, mostram cenas como São Miguel diante de um monstro ou as tentações de Cristo.\n\nNo interior, a nave única mede cerca de 41,5 metros de comprimento por 10 de largura. A torre tem seis corpos e termina num coruchéu octogonal: os corpos inferiores têm arcos de volta perfeita, de tradição românica, e os superiores janelas góticas ogivais. Da praça percebe-se porque foi escolhido este ponto: é o coração do centro histórico, a meio caminho entre o rio e o castelo.\n\nAntes de entrar, contorne o templo para ver como se encaixa na encosta: o edifício adapta-se ao desnível do terreno e, vista da parte baixa, a torre parece ainda mais alta."},{"h":"Tradições e festas","t":"San Pedro é o cenário de um dos momentos mais vistosos do Día de la Faldeta, a festa de Interesse Turístico Nacional que Fraga celebra em abril. Nesse fim de semana recria-se aqui um casamento fraguense do início do século XX, com cortejo nupcial, jotas dedicadas aos noivos e centenas de mulheres com o traje tradicional.\n\nÀ saída, desça pela calle Mayor, o antigo centro da vida fraguense, com as suas ruas estreitas, beirais, varandas de ferro forjado e brasões."}]},"status":"pending"},{"id":"castillo-fraga","town":"Fraga","cat":"patrimonio","lat":41.52319,"lon":0.35222,"coord_src":null,"q":["Castillo de Fraga","Castillo, Fraga, Huesca"],"fq":["Castillo de Fraga","Fraga castillo vista","Fraga Huesca panorámica"],"name":{"es":"Castillo de Fraga","en":"Castillo de Fraga (Fraga Castle)","fr":"Castillo de Fraga (château de Fraga)","de":"Castillo de Fraga","pt":"Castelo de Fraga"},"when":{"es":"Edad Media · Mirador sobre el Cinca","en":"Middle Ages · Viewpoint over the Cinca","fr":"Moyen Âge · Belvédère sur le Cinca","de":"Mittelalter · Aussichtspunkt über dem Cinca","pt":"Idade Média · Miradouro sobre o Cinca"},"desc":{"es":"En lo alto del casco antiguo, lo que hoy se llama castillo son las ruinas de la antigua iglesia de San Miguel, rehabilitadas como espacio para exposiciones y actos. Desde aquí se entiende Fraga: la ciudad vieja colgada sobre el Cinca y la vega a sus pies.","en":"At the top of the old town, what is now called the castle is in fact the ruins of the old church of San Miguel, restored as a venue for exhibitions and events. From here Fraga makes sense: the old town clinging above the Cinca and the floodplain at its feet.","fr":"Au sommet de la vieille ville, ce que l'on appelle aujourd'hui le château correspond aux ruines de l'ancienne église Saint-Michel, réhabilitées en espace d'expositions et d'événements. D'ici, on comprend Fraga : la vieille ville suspendue au-dessus du Cinca et la plaine fertile à ses pieds.","de":"Was hoch oben in der Altstadt heute Burg genannt wird, sind die Ruinen der alten Kirche San Miguel, die als Raum für Ausstellungen und Veranstaltungen hergerichtet wurden. Von hier aus versteht man Fraga: die Altstadt über dem Cinca und die Flussaue zu ihren Füßen.","pt":"No alto do centro histórico, aquilo a que hoje se chama castelo são as ruínas da antiga igreja de San Miguel, reabilitadas como espaço para exposições e eventos. Daqui compreende-se Fraga: a cidade velha suspensa sobre o Cinca e a várzea a seus pés."},"visit":{"es":"Se sube a pie por las calles del casco antiguo desde la plaza de San Pedro. El exterior y las vistas son libres; el interior abre con exposiciones y actos. Confirma la programación en la oficina de turismo.","en":"Walk up through the streets of the old town from Plaza de San Pedro. The exterior and the views are open to all; the interior opens for exhibitions and events. Check the programme at the tourist office.","fr":"On y monte à pied par les rues de la vieille ville depuis la plaza de San Pedro. L'extérieur et la vue sont en accès libre ; l'intérieur ouvre lors d'expositions et d'événements. Vérifiez la programmation auprès de l'office de tourisme.","de":"Man steigt zu Fuß durch die Gassen der Altstadt von der Plaza de San Pedro hinauf. Außenbereich und Aussicht sind frei zugänglich; das Innere öffnet zu Ausstellungen und Veranstaltungen. Das Programm erfahren Sie im Tourismusbüro.","pt":"Sobe-se a pé pelas ruas do centro histórico a partir da plaza de San Pedro. O exterior e as vistas são de acesso livre; o interior abre com exposições e eventos. Confirme a programação no posto de turismo."},"src":"https://es.hispanopedia.com/wiki/Fraga_(Huesca)","sources":["https://es.hispanopedia.com/wiki/Fraga_(Huesca)","https://es.wikipedia.org/wiki/Fraga_(Huesca)","https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5489201","https://aacadigital.com/articulos/el-primitivo-y-perdurable-encanto-simbolista-de-los-estaticos-personajes-de-viladrich/"],"art":{"es":[{"h":"Historia","t":"Fraga fue una plaza fuerte andalusí en la frontera del Cinca. El 17 de julio de 1134 las tropas musulmanas, llegadas de Córdoba, Valencia y Lérida, sorprendieron ante sus murallas al ejército de Alfonso I el Batallador, que murió poco después a causa de las heridas. La ciudad no pasó a manos cristianas hasta 1149.\n\nEl conjunto que hoy conocemos como castillo corresponde a la antigua iglesia de San Miguel, que llegó en ruinas al siglo XX. Se rehabilitó como espacio expositivo y está protegido como Bien de Interés Cultural.\n\nLa derrota de 1134 fue un golpe para el reino: Alfonso I murió sin hijos y su testamento, que dejaba el reino a las órdenes militares, abrió una crisis que acabó con la elección de su hermano Ramiro II. Fraga tuvo que esperar quince años más para ser conquistada, ya por Ramón Berenguer IV."},{"h":"Qué ver","t":"Lo primero son las vistas: el meandro del Cinca, los puentes que unen la ciudad vieja con la nueva, el parque de la Estacada en la otra orilla y, al fondo, la huerta.\n\nDentro, los muros de piedra de la vieja iglesia enmarcan exposiciones temporales. El edificio se inauguró en 2007 con una gran muestra dedicada al pintor Miguel Viladrich, que después viajó a Lérida y a Zaragoza.\n\nDesde el mirador se distinguen bien los dos mundos de Fraga: la ladera apretada de casas viejas y la ciudad moderna, llana y ordenada, en la otra orilla. Al bajar, pasa por el Palacio Montcada, antigua residencia de los señores, que guarda la pintura Boda fragatina del propio Viladrich."},{"h":"Curiosidades","t":"Viladrich, nacido en Torrelameu (Lérida) en 1887, pasó largas temporadas en Fraga, y el Ayuntamiento le cedió el castillo para instalar su taller. Pintó muchas escenas de la gente del lugar con un estilo propio, de figuras quietas y dibujo minucioso. Murió en el exilio, en Buenos Aires, en 1956.\n\nEl Cinca parte Fraga en dos. En mayo de 1810 las tropas españolas volaron el puente, y el puente colgante construido entre 1845 y 1847 se hundió en parte en 1852, con doce muertos."}],"en":[{"h":"History","t":"Fraga was an Andalusi stronghold on the Cinca frontier. On 17 July 1134 Muslim troops from Córdoba, Valencia and Lleida took the army of Alfonso I the Battler by surprise before its walls, and the king died shortly afterwards of his wounds. The town did not pass into Christian hands until 1149.\n\nThe complex we now know as the castle corresponds to the old church of San Miguel, which had fallen into ruin by the 20th century. It was restored as an exhibition space and is protected as a Bien de Interés Cultural.\n\nThe defeat of 1134 was a blow to the kingdom: Alfonso I died childless, and his will, which left the kingdom to the military orders, opened a crisis that ended with the election of his brother Ramiro II. Fraga had to wait another fifteen years to be conquered, this time by Ramon Berenguer IV."},{"h":"What to see","t":"First come the views: the bend of the Cinca, the bridges linking the old town with the new, the Parque de la Estacada on the far bank and, in the distance, the market gardens.\n\nInside, the stone walls of the old church frame temporary exhibitions. The building opened in 2007 with a major show devoted to the painter Miguel Viladrich, which later travelled to Lleida and Zaragoza.\n\nFrom the viewpoint you can clearly see Fraga's two worlds: the tightly packed hillside of old houses and, on the other bank, the flat, orderly modern town. On the way down, pass by the Palacio Montcada, the former residence of the local lords, which houses Viladrich's own painting Boda fragatina (A Fraga Wedding)."},{"h":"Did you know?","t":"Viladrich, born in Torrelameu (Lleida) in 1887, spent long periods in Fraga, and the Town Council let him set up his studio in the castle. He painted many scenes of local people in a style all his own, with still figures and meticulous draughtsmanship. He died in exile in Buenos Aires in 1956.\n\nThe Cinca splits Fraga in two. In May 1810 Spanish troops blew up the bridge, and the suspension bridge built between 1845 and 1847 partly collapsed in 1852, killing twelve people."}],"fr":[{"h":"Histoire","t":"Fraga fut une place forte andalouse sur la frontière du Cinca. Le 17 juillet 1134, les troupes musulmanes, venues de Cordoue, de Valence et de Lérida, surprirent devant ses remparts l'armée d'Alphonse Ier le Batailleur, qui mourut peu après des suites de ses blessures. La ville ne passa aux mains des chrétiens qu'en 1149.\n\nL'ensemble que nous appelons aujourd'hui château correspond à l'ancienne église Saint-Michel, parvenue en ruine au XXe siècle. Elle a été réhabilitée en espace d'exposition et est protégée comme Bien d'intérêt culturel.\n\nLa défaite de 1134 fut un coup dur pour le royaume : Alphonse Ier mourut sans enfants et son testament, qui léguait le royaume aux ordres militaires, ouvrit une crise qui se conclut par l'élection de son frère Ramire II. Fraga dut attendre quinze ans de plus pour être conquise, cette fois par Raimond-Bérenger IV."},{"h":"À voir","t":"D'abord, la vue : le méandre du Cinca, les ponts qui relient la vieille ville à la ville nouvelle, le parc de la Estacada sur l'autre rive et, au fond, la huerta.\n\nÀ l'intérieur, les murs de pierre de la vieille église encadrent des expositions temporaires. Le lieu a été inauguré en 2007 avec une grande exposition consacrée au peintre Miguel Viladrich, qui fut ensuite présentée à Lérida et à Saragosse.\n\nDepuis le belvédère, on distingue bien les deux visages de Fraga : le versant serré de vieilles maisons et la ville moderne, plate et ordonnée, sur l'autre rive. En redescendant, passez par le Palacio Montcada, ancienne résidence des seigneurs, qui conserve le tableau Boda fragatina (Mariage fragatin) de Viladrich lui-même."},{"h":"Le saviez-vous ?","t":"Viladrich, né à Torrelameu (Lérida) en 1887, fit de longs séjours à Fraga, et la mairie lui céda le château pour y installer son atelier. Il peignit de nombreuses scènes des habitants dans un style très personnel, aux figures immobiles et au dessin minutieux. Il mourut en exil, à Buenos Aires, en 1956.\n\nLe Cinca coupe Fraga en deux. En mai 1810, les troupes espagnoles firent sauter le pont, et le pont suspendu construit entre 1845 et 1847 s'effondra en partie en 1852, faisant douze morts."}],"de":[{"h":"Geschichte","t":"Fraga war eine andalusische Festung an der Grenzlinie des Cinca. Am 17. Juli 1134 überraschten muslimische Truppen aus Córdoba, Valencia und Lleida vor ihren Mauern das Heer Alfons’ I. des Kämpfers, der kurz darauf an seinen Verletzungen starb. Erst 1149 fiel die Stadt an die Christen.\n\nDas Ensemble, das wir heute als Burg kennen, ist die ehemalige Kirche San Miguel, die im 20. Jahrhundert nur noch als Ruine erhalten war. Sie wurde zum Ausstellungsraum umgebaut und steht als Bien de Interés Cultural unter Schutz.\n\nDie Niederlage von 1134 war ein schwerer Schlag für das Königreich: Alfons I. starb kinderlos, und sein Testament, das das Reich den Ritterorden vermachte, löste eine Krise aus, die mit der Wahl seines Bruders Ramiro II. endete. Fraga musste noch fünfzehn Jahre auf seine Eroberung warten, die dann Ramon Berenguer IV. gelang."},{"h":"Sehenswert","t":"Zuerst die Aussicht: die Flussschleife des Cinca, die Brücken zwischen Alt- und Neustadt, der Park La Estacada am anderen Ufer und im Hintergrund die Huerta, das bewässerte Gartenland.\n\nIm Inneren bilden die Steinmauern der alten Kirche den Rahmen für Wechselausstellungen. Eröffnet wurde das Gebäude 2007 mit einer großen Schau über den Maler Miguel Viladrich, die anschließend nach Lleida und Zaragoza weiterreiste.\n\nVom Aussichtspunkt aus erkennt man gut die zwei Welten Fragas: den dicht bebauten Hang mit alten Häusern und die moderne, flache und geordnete Stadt am anderen Ufer. Gehen Sie beim Abstieg am Palacio Montcada vorbei, dem einstigen Sitz der Stadtherren, in dem Viladrichs Gemälde Boda fragatina (Fragatiner Hochzeit) hängt."},{"h":"Wissenswertes","t":"Viladrich, 1887 in Torrelameu (Lleida) geboren, verbrachte lange Zeit in Fraga, und die Stadtverwaltung überließ ihm die Burg als Atelier. Er malte viele Szenen aus dem Leben der Einheimischen in einem eigenen Stil mit ruhenden Figuren und minutiöser Zeichnung. Er starb 1956 im Exil in Buenos Aires.\n\nDer Cinca teilt Fraga in zwei Hälften. Im Mai 1810 sprengten spanische Truppen die Brücke, und die zwischen 1845 und 1847 errichtete Hängebrücke stürzte 1852 teilweise ein; zwölf Menschen kamen dabei ums Leben."}],"pt":[{"h":"História","t":"Fraga foi uma praça-forte al-andalusina na fronteira do Cinca. A 17 de julho de 1134, as tropas muçulmanas, vindas de Córdova, Valência e Lérida, surpreenderam diante das suas muralhas o exército de Afonso I, o Batalhador, que morreu pouco depois em consequência dos ferimentos. A cidade só passou para mãos cristãs em 1149.\n\nO conjunto que hoje conhecemos como castelo corresponde à antiga igreja de San Miguel, que chegou em ruínas ao século XX. Foi reabilitado como espaço expositivo e está protegido como Bien de Interés Cultural.\n\nA derrota de 1134 foi um golpe para o reino: Afonso I morreu sem filhos e o seu testamento, que deixava o reino às ordens militares, abriu uma crise que terminou com a eleição do seu irmão Ramiro II. Fraga teve de esperar mais quinze anos para ser conquistada, já por Ramon Berenguer IV."},{"h":"O que ver","t":"Primeiro, as vistas: o meandro do Cinca, as pontes que unem a cidade velha à nova, o parque da Estacada na outra margem e, ao fundo, a horta.\n\nNo interior, os muros de pedra da velha igreja enquadram exposições temporárias. O edifício foi inaugurado em 2007 com uma grande mostra dedicada ao pintor Miguel Viladrich, que depois viajou para Lérida e Saragoça.\n\nDo miradouro distinguem-se bem os dois mundos de Fraga: a encosta apinhada de casas antigas e a cidade moderna, plana e ordenada, na outra margem. Ao descer, passe pelo Palacio Montcada, antiga residência dos senhores, que guarda a pintura Boda fragatina (Casamento fraguense) do próprio Viladrich."},{"h":"Curiosidades","t":"Viladrich, nascido em Torrelameu (Lérida) em 1887, passou longas temporadas em Fraga, e a Câmara Municipal cedeu-lhe o castelo para instalar o seu ateliê. Pintou muitas cenas da gente local com um estilo próprio, de figuras imóveis e desenho minucioso. Morreu no exílio, em Buenos Aires, em 1956.\n\nO Cinca divide Fraga em duas. Em maio de 1810 as tropas espanholas fizeram explodir a ponte, e a ponte suspensa construída entre 1845 e 1847 ruiu em parte em 1852, causando doze mortos."}]},"status":"pending"},{"id":"casco-antiguo-fraga","town":"Fraga","cat":"patrimonio","lat":41.52113,"lon":0.35185,"coord_src":null,"q":["Calle Mayor, Fraga","Paseo Barrón Cegonyé, Fraga","Atarazanas, Fraga"],"fq":["Fraga casco antiguo","Fraga calle Mayor","Dona de Faldetes Fraga","Fraga old town"],"name":{"es":"Casco antiguo y la Dona de Faldetes","en":"Old town and the Dona de Faldetes","fr":"Vieille ville et la Dona de Faldetes","de":"Altstadt und Dona de Faldetes","pt":"Centro histórico e a Dona de Faldetes"},"when":{"es":"De la Fraga medieval al siglo XX · Paseo","en":"From medieval Fraga to the 20th century · Walk","fr":"De la Fraga médiévale au XXe siècle · Promenade","de":"Vom mittelalterlichen Fraga ins 20. Jh. · Spaziergang","pt":"Da Fraga medieval ao século XX · Passeio"},"desc":{"es":"Calles empinadas, aleros, balcones de forja y escudos entre el río y el castillo. El paseo empieza junto a la estatua de la Dona de Faldetes, homenaje a las mujeres que vistieron el traje fragatino toda su vida.","en":"Steep streets, eaves, wrought-iron balconies and coats of arms between the river and the castle. The walk begins beside the statue of the Dona de Faldetes (Woman in Faldetas), a tribute to the women who wore Fraga's traditional dress all their lives.","fr":"Des rues en pente, des avant-toits, des balcons en fer forgé et des blasons entre la rivière et le château. La promenade commence près de la statue de la Dona de Faldetes, hommage aux femmes qui ont porté le costume fragatin toute leur vie.","de":"Steile Gassen, Dachvorsprünge, schmiedeeiserne Balkone und Wappen zwischen Fluss und Burg. Der Spaziergang beginnt an der Statue der Dona de Faldetes, einer Hommage an die Frauen, die ihr ganzes Leben lang die Fragatiner Tracht trugen.","pt":"Ruas íngremes, beirais, varandas de ferro forjado e brasões entre o rio e o castelo. O passeio começa junto à estátua da Dona de Faldetes, homenagem às mulheres que vestiram o traje fraguense toda a vida."},"visit":{"es":"Se recorre a pie, libremente, en una hora o algo más. Empieza en el paseo Barrón Cegonyé, junto al Cinca, y sube por la calle Mayor hasta San Pedro y el castillo. Las cuestas son pronunciadas: lleva calzado cómodo.","en":"Explore on foot, at your own pace, in an hour or a little more. Start on Paseo Barrón Cegonyé, beside the Cinca, and walk up Calle Mayor to San Pedro and the castle. The slopes are steep, so wear comfortable shoes.","fr":"Elle se fait à pied, librement, en une heure ou un peu plus. Partez du paseo Barrón Cegonyé, au bord du Cinca, et montez par la calle Mayor jusqu'à San Pedro et au château. Les montées sont raides : prévoyez des chaussures confortables.","de":"Die Altstadt erkundet man frei zu Fuß in gut einer Stunde. Beginnen Sie am Paseo Barrón Cegonyé am Cinca und gehen Sie die Calle Mayor hinauf bis San Pedro und zur Burg. Die Steigungen sind steil: Tragen Sie bequeme Schuhe.","pt":"Percorre-se a pé, livremente, em uma hora ou pouco mais. Comece no paseo Barrón Cegonyé, junto ao Cinca, e suba pela calle Mayor até San Pedro e ao castelo. As subidas são acentuadas: leve calçado confortável."},"src":"https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5489201","sources":["https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5489201","https://www.ultimahora.es/noticias/comunidades/2025/04/15/2368043/fraga-huesca-rinde-homenaje-mujeres-traje-tradicional-fiesta-faldeta.html","https://www.festivalesdeespana.com/festival/dia-de-la-faldeta-fraga/2025","https://es.hispanopedia.com/wiki/Fraga_(Huesca)"],"art":{"es":[{"h":"Historia","t":"La Fraga vieja creció en la ladera de la orilla derecha del Cinca, protegida por el castillo y abierta al río, que fue durante siglos su camino y su frontera. La calle Mayor era el centro de la vida: comercios, casas de los vecinos acomodados y el paso hacia la iglesia de San Pedro.\n\nEl barrio de las Atarazanas recuerda en su nombre el antiguo embarcadero, cuando el Cinca se usaba para transportar mercancías. Las casas de adobe, con arcos y aleros de madera, muestran una arquitectura popular adaptada al calor y a la falta de piedra.\n\nCon el tiempo, Fraga creció hacia la otra orilla y el casco antiguo perdió vecinos, pero conserva el trazado medieval, con calles que siguen las curvas de nivel y escaleras que salvan los desniveles más fuertes."},{"h":"Qué ver","t":"En el paseo Barrón Cegonyé está la estatua de la Dona de Faldetes, inaugurada en 1982 como monumento a la mujer fragatina. En el mismo paseo se ha descubierto recientemente un antiguo pozo de hielo, donde se guardaba la nieve o el hielo para conservar alimentos.\n\nDesde allí sube por la calle Mayor y las callejas que la rodean. Fíjate en los balcones de hierro forjado, en los escudos de piedra sobre algunas puertas y en los aleros que casi se tocan de lado a lado de la calle. Arriba esperan San Pedro y el castillo."},{"h":"Tradiciones y fiestas","t":"La faldeta es la falda del traje tradicional de Fraga. En 1977 la Peña Fragatina contó 214 mujeres que aún la vestían a diario, y de ese recuento nació la fiesta que hoy se celebra cada abril, el Día de la Faldeta, de Interés Turístico Nacional.\n\nEse fin de semana el casco antiguo vuelve a principios del siglo XX: escenas de oficios en las calles, una boda tradicional y un desfile con más de mil personas vestidas de época. El acto más emotivo es el homenaje a las Dones de Faldetes, las mujeres que nunca dejaron el traje."}],"en":[{"h":"History","t":"Old Fraga grew up on the hillside of the right bank of the Cinca, protected by the castle and open to the river, which for centuries was both its highway and its frontier. Calle Mayor was the centre of life: shops, the houses of well-off residents and the route up to the church of San Pedro.\n\nThe Atarazanas neighbourhood recalls in its name the old landing stage, from when the Cinca was used to carry goods. The adobe houses, with arches and wooden eaves, show a vernacular architecture adapted to the heat and the lack of stone.\n\nOver time Fraga spread to the other bank and the old town lost residents, but it keeps its medieval layout, with streets that follow the contours and steps that climb the steepest slopes."},{"h":"What to see","t":"On Paseo Barrón Cegonyé stands the statue of the Dona de Faldetes, unveiled in 1982 as a monument to the women of Fraga. On the same promenade an old ice well was recently discovered, where snow or ice was stored to preserve food.\n\nFrom there, climb Calle Mayor and the alleys around it. Notice the wrought-iron balconies, the stone coats of arms above some doorways and the eaves that almost touch across the street. San Pedro and the castle await at the top."},{"h":"Traditions and festivals","t":"The faldeta is the skirt of Fraga's traditional costume. In 1977 the Peña Fragatina counted 214 women who still wore it every day, and from that count was born the festival held every April, the Día de la Faldeta, of National Tourist Interest.\n\nThat weekend the old town goes back to the early 20th century: scenes of traditional trades in the streets, a traditional wedding and a parade with more than a thousand people in period dress. The most moving moment is the tribute to the Dones de Faldetes, the women who never gave up the costume."}],"fr":[{"h":"Histoire","t":"La vieille Fraga s'est développée sur le versant de la rive droite du Cinca, protégée par le château et ouverte sur la rivière, qui fut pendant des siècles à la fois sa route et sa frontière. La calle Mayor était le centre de la vie : commerces, maisons des habitants aisés et passage vers l'église San Pedro.\n\nLe quartier des Atarazanas rappelle par son nom l'ancien embarcadère, à l'époque où le Cinca servait à transporter des marchandises. Les maisons en adobe, avec arcs et avant-toits en bois, témoignent d'une architecture populaire adaptée à la chaleur et au manque de pierre.\n\nAvec le temps, Fraga s'est étendue sur l'autre rive et la vieille ville a perdu des habitants, mais elle conserve son tracé médiéval, avec des rues qui suivent les courbes de niveau et des escaliers qui franchissent les plus forts dénivelés."},{"h":"À voir","t":"Sur le paseo Barrón Cegonyé se dresse la statue de la Dona de Faldetes, inaugurée en 1982 en hommage à la femme fragatine. Sur cette même promenade, on a récemment découvert une ancienne glacière, où l'on stockait la neige ou la glace pour conserver les aliments.\n\nDe là, montez par la calle Mayor et les ruelles qui l'entourent. Observez les balcons en fer forgé, les blasons de pierre au-dessus de certaines portes et les avant-toits qui se touchent presque d'un côté à l'autre de la rue. En haut vous attendent San Pedro et le château."},{"h":"Traditions et fêtes","t":"La faldeta est la jupe du costume traditionnel de Fraga. En 1977, la Peña Fragatina recensa 214 femmes qui la portaient encore au quotidien, et de ce recensement est née la fête célébrée aujourd'hui chaque mois d'avril, le Día de la Faldeta, d'intérêt touristique national.\n\nCe week-end-là, la vieille ville revient au début du XXe siècle : scènes de métiers dans les rues, un mariage traditionnel et un défilé de plus de mille personnes en costume d'époque. Le moment le plus émouvant est l'hommage aux Dones de Faldetes, les femmes qui n'ont jamais abandonné le costume."}],"de":[{"h":"Geschichte","t":"Das alte Fraga wuchs am Hang des rechten Cinca-Ufers, geschützt von der Burg und offen zum Fluss, der jahrhundertelang zugleich Verkehrsweg und Grenze war. Die Calle Mayor war das Zentrum des Lebens: Geschäfte, Häuser wohlhabender Bürger und der Weg zur Kirche San Pedro.\n\nDas Viertel Las Atarazanas erinnert mit seinem Namen an die alte Anlegestelle aus der Zeit, als auf dem Cinca Waren transportiert wurden. Die Lehmziegelhäuser mit Bögen und hölzernen Traufen zeigen eine Volksarchitektur, die an Hitze und Steinmangel angepasst ist.\n\nMit der Zeit wuchs Fraga ans andere Ufer, und die Altstadt verlor Bewohner, bewahrt aber ihren mittelalterlichen Grundriss mit Gassen, die den Höhenlinien folgen, und Treppen, die die stärksten Steigungen überwinden."},{"h":"Sehenswert","t":"Am Paseo Barrón Cegonyé steht die Statue der Dona de Faldetes, 1982 als Denkmal für die Fragatiner Frau eingeweiht. An derselben Promenade wurde vor Kurzem ein alter Eiskeller entdeckt, in dem Schnee oder Eis zur Konservierung von Lebensmitteln gelagert wurde.\n\nGehen Sie von dort die Calle Mayor und die umliegenden Gässchen hinauf. Achten Sie auf die schmiedeeisernen Balkone, die steinernen Wappen über manchen Türen und die Dachvorsprünge, die sich über der Gasse fast berühren. Oben warten San Pedro und die Burg."},{"h":"Feste und Traditionen","t":"Die Faldeta ist der Rock der traditionellen Tracht von Fraga. 1977 zählte die Peña Fragatina 214 Frauen, die sie noch täglich trugen, und aus dieser Zählung entstand das Fest, das heute jeden April gefeiert wird: der Día de la Faldeta, ein Fest von nationalem touristischem Interesse.\n\nAn diesem Wochenende kehrt die Altstadt ins frühe 20. Jahrhundert zurück: Handwerksszenen in den Gassen, eine traditionelle Hochzeit und ein Umzug mit mehr als tausend Menschen in historischer Kleidung. Der bewegendste Moment ist die Ehrung der Dones de Faldetes, der Frauen, die die Tracht nie abgelegt haben."}],"pt":[{"h":"História","t":"A Fraga antiga cresceu na encosta da margem direita do Cinca, protegida pelo castelo e aberta ao rio, que foi durante séculos o seu caminho e a sua fronteira. A calle Mayor era o centro da vida: comércio, casas dos habitantes abastados e a passagem para a igreja de San Pedro.\n\nO bairro das Atarazanas recorda no nome o antigo cais de embarque, quando o Cinca era usado para transportar mercadorias. As casas de adobe, com arcos e beirais de madeira, mostram uma arquitetura popular adaptada ao calor e à falta de pedra.\n\nCom o tempo, Fraga cresceu para a outra margem e o centro histórico perdeu habitantes, mas conserva o traçado medieval, com ruas que seguem as curvas de nível e escadarias que vencem os desníveis mais fortes."},{"h":"O que ver","t":"No paseo Barrón Cegonyé está a estátua da Dona de Faldetes, inaugurada em 1982 como monumento à mulher fraguense. No mesmo passeio foi descoberto recentemente um antigo poço de gelo, onde se guardava a neve ou o gelo para conservar alimentos.\n\nDali, suba pela calle Mayor e pelas vielas que a rodeiam. Repare nas varandas de ferro forjado, nos brasões de pedra sobre algumas portas e nos beirais que quase se tocam de um lado ao outro da rua. Lá em cima esperam San Pedro e o castelo."},{"h":"Tradições e festas","t":"A faldeta é a saia do traje tradicional de Fraga. Em 1977 a Peña Fragatina contou 214 mulheres que ainda a vestiam diariamente, e dessa contagem nasceu a festa que hoje se celebra todos os meses de abril, o Día de la Faldeta, de Interesse Turístico Nacional.\n\nNesse fim de semana o centro histórico regressa ao início do século XX: cenas de ofícios nas ruas, um casamento tradicional e um desfile com mais de mil pessoas vestidas à época. O momento mais emotivo é a homenagem às Dones de Faldetes, as mulheres que nunca deixaram o traje."}]},"status":"pending"},{"id":"parque-estacada","town":"Fraga","cat":"naturaleza","lat":41.5226,"lon":0.3448,"coord_src":null,"q":["Parque de la Estacada, Fraga","La Pinada, Fraga"],"fq":["Parque de la Estacada Fraga","Fraga río Cinca","Fraga Cinca puente"],"name":{"es":"La Estacada y la orilla del Cinca","en":"La Estacada and the banks of the Cinca","fr":"La Estacada et la rive du Cinca","de":"La Estacada und das Cinca-Ufer","pt":"La Estacada e a margem do Cinca"},"when":{"es":"Parque fluvial · El Cinca en la ciudad","en":"Riverside park · The Cinca in the town","fr":"Parc fluvial · Le Cinca en ville","de":"Flusspark · Der Cinca in der Stadt","pt":"Parque fluvial · O Cinca na cidade"},"desc":{"es":"La mayor zona verde de Fraga, a la que todos llaman La Pinada, en la orilla nueva del Cinca. Desde aquí se ve de frente la ciudad vieja y se baja al río por un acceso habilitado en pleno centro.","en":"Fraga's largest green space, which everyone calls La Pinada (The Pine Grove), on the newer bank of the Cinca. From here you look straight across at the old town, and a purpose-built access leads down to the river right in the centre.","fr":"Le plus grand espace vert de Fraga, que tout le monde appelle La Pinada, sur la rive nouvelle du Cinca. D'ici, on voit la vieille ville de face et l'on descend à la rivière par un accès aménagé en plein centre.","de":"Die größte Grünanlage Fragas, von allen La Pinada genannt, am neuen Ufer des Cinca. Von hier blickt man direkt auf die Altstadt, und mitten im Zentrum führt ein angelegter Zugang hinunter zum Fluss.","pt":"A maior zona verde de Fraga, a que todos chamam La Pinada, na margem nova do Cinca. Daqui vê-se de frente a cidade velha e desce-se ao rio por um acesso preparado em pleno centro."},"visit":{"es":"Se llega a pie cruzando cualquiera de los dos puentes desde el casco antiguo. Es un parque público de acceso libre, con sombra y caminos llanos; ideal para descansar a media visita o al atardecer.","en":"Walk over either of the two bridges from the old town. It is a public park, free to enter, with shade and level paths; ideal for a rest halfway through your visit or at sunset.","fr":"On s'y rend à pied en traversant l'un des deux ponts depuis la vieille ville. C'est un parc public en accès libre, ombragé et aux chemins plats ; idéal pour se reposer au milieu de la visite ou au coucher du soleil.","de":"Sie erreichen den Park zu Fuß über eine der beiden Brücken aus der Altstadt. Er ist öffentlich und frei zugänglich, mit Schatten und ebenen Wegen; ideal für eine Pause während der Besichtigung oder bei Sonnenuntergang.","pt":"Chega-se a pé atravessando qualquer uma das duas pontes a partir do centro histórico. É um parque público de acesso livre, com sombra e caminhos planos; ideal para descansar a meio da visita ou ao entardecer."},"src":"https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5489201","sources":["https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5489201","https://elcruzado.es/categoria/comarcas/bajo-cinca/fraga/page/14","https://es.hispanopedia.com/wiki/Fraga_(Huesca)"],"art":{"es":[{"h":"El paisaje","t":"El Cinca divide Fraga en dos: el casco antiguo trepa por la ladera de una orilla y la ciudad moderna se extiende por la otra, unidas por dos puentes. La Estacada ocupa la orilla llana, con pinos y árboles de ribera que dan sombra en verano.\n\nDesde los caminos del parque se tiene la mejor vista de conjunto de la Fraga vieja: las casas escalonadas, la torre de San Pedro y, arriba, el castillo. Al caer la tarde la luz da de lleno en la ladera.\n\nEl parque es también un buen sitio para entender la vida del río: los sotos de chopos, sauces y tamarices que crecen en las orillas frenan las crecidas, dan sombra y sirven de refugio a garzas, martines pescadores y otras aves que se dejan ver con un poco de paciencia."},{"h":"Qué ver","t":"Pasea junto al agua y busca el acceso al río que la Comarca habilitó en el centro de la ciudad dentro de su programa Entre Ríos. Es un buen punto para ver aves de ribera y entender el caudal del Cinca, que baja desde el Pirineo.\n\nEl Ayuntamiento trabaja además en el proyecto Cinca Revive, que en 2025 terminó sus primeras actuaciones, con una inversión de unos 139.000 euros, para recuperar el bosque de ribera y unir el parque fluvial con
