la badina de Pescadores.\n\nSi cruzas por uno de los puentes al volver, detente a mitad: desde allí se ve el Cinca bajar entre las dos Fragas y se entiende por qué durante siglos el río fue, a la vez, frontera, camino y fuente de riqueza."},{"h":"Curiosidades","t":"Cruzar el Cinca no siempre fue sencillo. En mayo de 1810, durante la guerra de la Independencia, las tropas españolas volaron el puente de Fraga. El puente colgante que se construyó entre 1845 y 1847 se hundió en parte en 1852 y causó doce muertos.\n\nLos barrios de Litera y Miralsot, en el término municipal, completan una ciudad que es una de las más extensas de España por superficie, con más de 437 kilómetros cuadrados."}],"en":[{"h":"The landscape","t":"The Cinca divides Fraga in two: the old town climbs the hillside on one bank and the modern town spreads across the other, joined by two bridges. La Estacada occupies the flat bank, with pines and riverside trees that give shade in summer.\n\nFrom the park's paths you get the best overall view of old Fraga: the stepped houses, the tower of San Pedro and, up above, the castle. As the afternoon draws on, the light falls full on the hillside.\n\nThe park is also a good place to understand river life: the thickets of poplars, willows and tamarisks growing along the banks slow down floods, provide shade and shelter herons, kingfishers and other birds that you can spot with a little patience."},{"h":"What to see","t":"Stroll beside the water and look for the river access that the Comarca created in the town centre as part of its Entre Ríos (Between Rivers) programme. It is a good spot for watching riverside birds and getting a sense of the flow of the Cinca, which comes down from the Pyrenees.\n\nThe Town Council is also working on the Cinca Revive project, which completed its first works in 2025, with an investment of about 139,000 euros, to restore the riverside woodland and link the river park with the badina (river pool) of Pescadores.\n\nIf you cross one of the bridges on your way back, stop halfway: from there you can watch the Cinca flowing between the two Fragas and see why, for centuries, the river was at once frontier, highway and source of wealth."},{"h":"Did you know?","t":"Crossing the Cinca was not always easy. In May 1810, during the Peninsular War, Spanish troops blew up the Fraga bridge. The suspension bridge built between 1845 and 1847 partly collapsed in 1852, killing twelve people.\n\nThe outlying districts of Litera and Miralsot, within the municipality, complete a town that is one of the largest in Spain by area, covering more than 437 square kilometres."}],"fr":[{"h":"Le paysage","t":"Le Cinca divise Fraga en deux : la vieille ville grimpe sur le versant d'une rive et la ville moderne s'étend sur l'autre, reliées par deux ponts. La Estacada occupe la rive plate, avec des pins et des arbres de berge qui donnent de l'ombre en été.\n\nDepuis les allées du parc, on a la plus belle vue d'ensemble sur la vieille Fraga : les maisons étagées, la tour de San Pedro et, en haut, le château. En fin d'après-midi, la lumière inonde le versant.\n\nLe parc est aussi un bon endroit pour comprendre la vie de la rivière : les ripisylves de peupliers, de saules et de tamaris qui poussent sur les berges freinent les crues, donnent de l'ombre et servent de refuge aux hérons, martins-pêcheurs et autres oiseaux qui se laissent observer avec un peu de patience."},{"h":"À voir","t":"Promenez-vous au bord de l'eau et cherchez l'accès à la rivière que la Comarca a aménagé au centre-ville dans le cadre de son programme Entre Ríos. C'est un bon point pour observer les oiseaux des berges et mesurer le débit du Cinca, qui descend des Pyrénées.\n\nLa mairie mène par ailleurs le projet Cinca Revive, dont les premiers travaux se sont achevés en 2025, pour un investissement d'environ 139 000 euros, afin de restaurer la forêt riveraine et de relier le parc fluvial à la badina de Pescadores.\n\nSi vous traversez l'un des ponts au retour, arrêtez-vous au milieu : de là, on voit le Cinca descendre entre les deux Fraga et l'on comprend pourquoi, pendant des siècles, la rivière fut à la fois frontière, route et source de richesse."},{"h":"Le saviez-vous ?","t":"Traverser le Cinca n'a pas toujours été simple. En mai 1810, pendant la guerre d'indépendance espagnole, les troupes espagnoles firent sauter le pont de Fraga. Le pont suspendu construit entre 1845 et 1847 s'effondra en partie en 1852, faisant douze morts.\n\nLes hameaux de Litera et de Miralsot, sur le territoire municipal, complètent une commune qui est l'une des plus étendues d'Espagne en superficie, avec plus de 437 kilomètres carrés."}],"de":[{"h":"Die Landschaft","t":"Der Cinca teilt Fraga in zwei Teile: Die Altstadt klettert an einem Ufer den Hang hinauf, die moderne Stadt breitet sich am anderen aus, verbunden durch zwei Brücken. La Estacada liegt am flachen Ufer, mit Kiefern und Auwaldbäumen, die im Sommer Schatten spenden.\n\nVon den Parkwegen aus hat man den schönsten Gesamtblick auf das alte Fraga: die gestaffelten Häuser, den Turm von San Pedro und oben die Burg. Am späten Nachmittag fällt das Licht voll auf den Hang.\n\nDer Park ist auch ein guter Ort, um das Leben am Fluss zu verstehen: Die Auwälder aus Pappeln, Weiden und Tamarisken an den Ufern bremsen Hochwasser, spenden Schatten und bieten Reihern, Eisvögeln und anderen Vögeln Zuflucht, die sich mit etwas Geduld beobachten lassen."},{"h":"Sehenswert","t":"Spazieren Sie am Wasser entlang und suchen Sie den Flusszugang, den die Comarca im Rahmen ihres Programms Entre Ríos mitten in der Stadt angelegt hat. Er eignet sich gut, um Ufervögel zu beobachten und einen Eindruck von der Wassermenge des Cinca zu bekommen, der aus den Pyrenäen herabfließt.\n\nDie Stadtverwaltung arbeitet außerdem am Projekt Cinca Revive, das 2025 seine ersten Maßnahmen mit einer Investition von rund 139.000 Euro abschloss, um den Auwald wiederherzustellen und den Flusspark mit der Badina de Pescadores zu verbinden.\n\nWenn Sie auf dem Rückweg eine der Brücken überqueren, bleiben Sie in der Mitte stehen: Von dort sieht man den Cinca zwischen den beiden Teilen Fragas hindurchfließen und versteht, warum der Fluss jahrhundertelang zugleich Grenze, Verkehrsweg und Quelle des Wohlstands war."},{"h":"Wissenswertes","t":"Den Cinca zu überqueren war nicht immer einfach. Im Mai 1810, während des Unabhängigkeitskriegs, sprengten spanische Truppen die Brücke von Fraga. Die zwischen 1845 und 1847 errichtete Hängebrücke stürzte 1852 teilweise ein und forderte zwölf Todesopfer.\n\nDie Ortsteile Litera und Miralsot im Gemeindegebiet vervollständigen eine Stadt, die mit mehr als 437 Quadratkilometern zu den flächenmäßig größten Spaniens gehört."}],"pt":[{"h":"A paisagem","t":"O Cinca divide Fraga em duas: o centro histórico trepa pela encosta de uma margem e a cidade moderna estende-se pela outra, unidas por duas pontes. A Estacada ocupa a margem plana, com pinheiros e árvores ribeirinhas que dão sombra no verão.\n\nDos caminhos do parque tem-se a melhor vista de conjunto da Fraga antiga: as casas em socalcos, a torre de San Pedro e, lá em cima, o castelo. Ao cair da tarde a luz bate em cheio na encosta.\n\nO parque é também um bom lugar para compreender a vida do rio: os bosques de choupos, salgueiros e tamargueiras que crescem nas margens travam as cheias, dão sombra e servem de refúgio a garças, guarda-rios e outras aves que se deixam ver com um pouco de paciência."},{"h":"O que ver","t":"Passeie junto à água e procure o acesso ao rio que a Comarca preparou no centro da cidade, no âmbito do seu programa Entre Ríos. É um bom ponto para observar aves ribeirinhas e perceber o caudal do Cinca, que desce dos Pirenéus.\n\nA Câmara Municipal trabalha ainda no projeto Cinca Revive, que em 2025 concluiu as primeiras intervenções, com um investimento de cerca de 139.000 euros, para recuperar o bosque ribeirinho e unir o parque fluvial à badina de Pescadores.\n\nSe atravessar uma das pontes no regresso, pare a meio: dali vê-se o Cinca a descer entre as duas Fragas e percebe-se porque, durante séculos, o rio foi ao mesmo tempo fronteira, caminho e fonte de riqueza."},{"h":"Curiosidades","t":"Atravessar o Cinca nem sempre foi simples. Em maio de 1810, durante a Guerra da Independência, as tropas espanholas fizeram explodir a ponte de Fraga. A ponte suspensa construída entre 1845 e 1847 ruiu em parte em 1852 e causou doze mortos.\n\nOs bairros de Litera e Miralsot, no concelho, completam uma cidade que é uma das mais extensas de Espanha em superfície, com mais de 437 quilómetros quadrados."}]},"status":"pending"},{"id":"torre-frailes","town":"Fraga","cat":"patrimonio","lat":41.49475,"lon":0.33242,"coord_src":null,"q":["Torre de los Frailes, Fraga","Torre dels Frares, Fraga"],"fq":["Torre de los Frailes Fraga","Torre dels Frares Fraga"],"name":{"es":"Torre de los Frailes","en":"Torre de los Frailes (Friars' Tower)","fr":"Torre de los Frailes (tour des Frères)","de":"Torre de los Frailes","pt":"Torre de los Frailes"},"when":{"es":"Siglo XIII (probable) · Torre de almunia","en":"13th century (probably) · Almunia tower","fr":"XIIIe siècle (probable) · Tour d'almunia","de":"Vermutlich 13. Jh. · Turm einer Almunia","pt":"Século XIII (provável) · Torre de almunia"},"desc":{"es":"Una torre de piedra de unos 13 metros, sola en la huerta al sur de Fraga. Marca una antigua almunia, una finca agrícola andalusí que después fue de templarios y hospitalarios.","en":"A stone tower about 13 metres high, standing alone in the market gardens south of Fraga. It marks an old almunia, an Andalusi farming estate that later belonged to the Templars and the Hospitallers.","fr":"Une tour de pierre d'environ 13 mètres, isolée dans la huerta au sud de Fraga. Elle signale une ancienne almunia, un domaine agricole andalou qui appartint ensuite aux Templiers et aux Hospitaliers.","de":"Ein etwa 13 Meter hoher Steinturm, allein in der Huerta südlich von Fraga. Er markiert eine alte Almunia, ein andalusisches Landgut, das später den Templern und den Johannitern gehörte.","pt":"Uma torre de pedra com cerca de 13 metros, isolada na horta a sul de Fraga. Assinala uma antiga almunia, uma propriedade agrícola al-andalusina que depois pertenceu aos templários e aos hospitalários."},"visit":{"es":"Está al sur de Fraga, junto a la carretera hacia Mequinenza, cerca del acceso a la autovía. Se ve por fuera, en una parada corta de 10-15 minutos.","en":"It is south of Fraga, beside the road to Mequinenza, near the motorway junction. It can be seen from outside on a short 10-15-minute stop.","fr":"Elle se trouve au sud de Fraga, près de la route de Mequinenza, non loin de l'accès à l'autoroute. Elle se voit de l'extérieur, lors d'un court arrêt de 10 à 15 minutes.","de":"Der Turm steht südlich von Fraga an der Straße nach Mequinenza, nahe der Autobahnauffahrt. Er ist von außen zu sehen, bei einem kurzen Halt von 10–15 Minuten.","pt":"Fica a sul de Fraga, junto à estrada para Mequinenza, perto do acesso à autoestrada. Vê-se por fora, numa paragem curta de 10-15 minutos."},"src":"https://www.enciclopedia.cat/catalunya-romanica/torre-dels-frares-fraga","sources":["https://www.enciclopedia.cat/catalunya-romanica/torre-dels-frares-fraga","https://es.hispanopedia.com/wiki/Fraga_(Huesca)","https://es.wikipedia.org/wiki/Bajo_Cinca"],"art":{"es":[{"h":"Historia","t":"La torre recuerda una almunia, una explotación agrícola de época musulmana, que pudo formar parte de la línea defensiva de Fraga a lo largo del Cinca. Tras la conquista de 1149 pasó por varias manos y un documento de 1296 ya habla de la almunia de los Templarios. Después fue de la orden del Hospital, y de ahí el nombre de los Frailes.\n\nSu origen se sitúa, con prudencia, en el siglo XIII, porque no hay excavaciones que lo confirmen. Hacia 1972 se desmontó por el trazado de la autopista y se volvió a levantar cerca de su emplazamiento original.\n\nLa autopista que obligó a moverla es la AP-2, que une Zaragoza con el Mediterráneo; el traslado salvó la torre, aunque la separó de su lugar exacto."},{"h":"Qué ver","t":"Es una torre casi cuadrada, de sillares de piedra caliza amarillenta, con muros de unos 90 cm. En el lado oeste hay una puerta de arco apuntado con una cruz en relieve encima, probablemente hospitalaria.\n\nSi te fijas, verás tres épocas: la torre defensiva con saeteras y entrada elevada, la reforma hospitalaria con la puerta a ras de suelo y ventanas del siglo XVI, y los cambios del siglo XIX. Las almenas y la terraza son reconstrucciones del siglo XX.\n\nRodéala por completo si puedes: cada fachada cuenta una parte de su historia, y la luz de la tarde resalta el color dorado de la piedra."},{"h":"Para entenderlo","t":"Una almunia era una finca de recreo y de cultivo, con casa, huerta, riego y, a veces, una torre para vigilar y refugiarse. La vega del Cinca estaba salpicada de ellas en época andalusí.\n\nTras la conquista, las órdenes militares recibieron muchas de estas fincas como recompensa por su papel en la guerra. Templarios y hospitalarios las explotaban como granjas y las torres pasaban a ser casa del administrador, granero y símbolo del nuevo señor. Que esta haya sobrevivido rodeada de autopistas y polígonos la hace todavía más llamativa."}],"en":[{"h":"History","t":"The tower recalls an almunia, a farming estate from the Muslim period, which may have formed part of Fraga's defensive line along the Cinca. After the conquest of 1149 it passed through several hands, and a document of 1296 already refers to the almunia of the Templars. It later belonged to the Order of the Hospital, hence the name 'of the Friars'.\n\nIts origin is cautiously placed in the 13th century, as there have been no excavations to confirm it. Around 1972 it was dismantled to make way for the motorway and rebuilt close to its original site.\n\nThe motorway that forced it to move is the AP-2, linking Zaragoza with the Mediterranean; the move saved the tower, although it separated it from its exact location."},{"h":"What to see","t":"It is an almost square tower of yellowish limestone ashlar, with walls about 90 cm thick. On the west side there is a pointed-arch doorway with a cross in relief above it, probably Hospitaller.\n\nIf you look closely, you will see three periods: the defensive tower with arrow slits and a raised entrance, the Hospitaller alterations with the ground-level door and 16th-century windows, and the 19th-century changes. The battlements and the terrace are 20th-century reconstructions.\n\nWalk all the way round it if you can: each façade tells part of its story, and the afternoon light brings out the golden colour of the stone."},{"h":"Background","t":"An almunia was an estate for leisure and cultivation, with a house, market garden, irrigation and sometimes a tower for keeping watch and taking refuge. The Cinca floodplain was dotted with them in the Andalusi period.\n\nAfter the conquest, the military orders received many of these estates as a reward for their role in the war. Templars and Hospitallers ran them as farms, and the towers became the steward's house, granary and symbol of the new lord. That this one has survived, surrounded by motorways and industrial estates, makes it all the more striking."}],"fr":[{"h":"Histoire","t":"La tour rappelle une almunia, une exploitation agricole d'époque musulmane, qui a pu faire partie de la ligne défensive de Fraga le long du Cinca. Après la conquête de 1149, elle passa entre plusieurs mains, et un document de 1296 parle déjà de l'almunia des Templiers. Elle appartint ensuite à l'ordre de l'Hôpital, d'où son nom de « tour des Frères ».\n\nOn situe son origine, avec prudence, au XIIIe siècle, car aucune fouille ne l'a confirmé. Vers 1972, elle fut démontée pour le tracé de l'autoroute et remontée près de son emplacement d'origine.\n\nL'autoroute qui obligea à la déplacer est l'AP-2, qui relie Saragosse à la Méditerranée ; le transfert sauva la tour, même s'il la sépara de son emplacement exact."},{"h":"À voir","t":"C'est une tour presque carrée, en pierre de taille calcaire jaunâtre, aux murs d'environ 90 cm. Sur la face ouest s'ouvre une porte en arc brisé surmontée d'une croix en relief, probablement hospitalière.\n\nEn regardant bien, vous distinguerez trois époques : la tour défensive avec ses meurtrières et son entrée surélevée, la transformation hospitalière avec la porte au niveau du sol et des fenêtres du XVIe siècle, et les modifications du XIXe siècle. Les créneaux et la terrasse sont des reconstructions du XXe siècle.\n\nFaites-en le tour complet si possible : chaque façade raconte une partie de son histoire, et la lumière de l'après-midi fait ressortir la couleur dorée de la pierre."},{"h":"Pour comprendre","t":"Une almunia était un domaine d'agrément et de culture, avec maison, potager, irrigation et parfois une tour pour surveiller et se réfugier. La plaine du Cinca en était parsemée à l'époque andalouse.\n\nAprès la conquête, les ordres militaires reçurent nombre de ces domaines en récompense de leur rôle dans la guerre. Templiers et Hospitaliers les exploitaient comme des fermes, et les tours devenaient maison de l'intendant, grenier et symbole du nouveau seigneur. Que celle-ci ait survécu, cernée d'autoroutes et de zones industrielles, la rend d'autant plus remarquable."}],"de":[{"h":"Geschichte","t":"Der Turm erinnert an eine Almunia, einen landwirtschaftlichen Betrieb aus muslimischer Zeit, der möglicherweise Teil der Verteidigungslinie Fragas entlang des Cinca war. Nach der Eroberung von 1149 wechselte er mehrfach den Besitzer, und ein Dokument von 1296 spricht bereits von der Almunia der Templer. Danach gehörte er dem Johanniterorden, daher der Name „de los Frailes“ (der Ordensbrüder).\n\nSeine Entstehung wird mit Vorsicht ins 13. Jahrhundert datiert, da keine Grabungen dies bestätigen. Um 1972 wurde er wegen des Autobahnbaus abgetragen und nahe seinem ursprünglichen Standort wieder aufgebaut.\n\nDie Autobahn, die seine Versetzung erzwang, ist die AP-2, die Zaragoza mit dem Mittelmeer verbindet; die Umsetzung rettete den Turm, trennte ihn aber von seinem genauen Standort."},{"h":"Sehenswert","t":"Es ist ein fast quadratischer Turm aus gelblichen Kalksteinquadern mit etwa 90 cm dicken Mauern. Auf der Westseite befindet sich eine Spitzbogentür mit einem Reliefkreuz darüber, vermutlich ein Johanniterkreuz.\n\nBei genauem Hinsehen erkennen Sie drei Epochen: den Wehrturm mit Schießscharten und erhöhtem Eingang, den Umbau der Johanniter mit ebenerdiger Tür und Fenstern aus dem 16. Jahrhundert sowie die Veränderungen des 19. Jahrhunderts. Zinnen und Terrasse sind Rekonstruktionen des 20. Jahrhunderts.\n\nGehen Sie nach Möglichkeit einmal ganz um ihn herum: Jede Fassade erzählt einen Teil seiner Geschichte, und das Nachmittagslicht bringt die goldene Farbe des Steins zur Geltung."},{"h":"Zum Verständnis","t":"Eine Almunia war ein Land- und Lustgut mit Haus, Garten, Bewässerung und manchmal einem Turm zur Überwachung und als Zufluchtsort. In andalusischer Zeit war die Aue des Cinca mit solchen Gütern übersät.\n\nNach der Eroberung erhielten die Ritterorden viele dieser Güter als Belohnung für ihre Rolle im Krieg. Templer und Johanniter bewirtschafteten sie als Gutshöfe, und die Türme wurden zum Haus des Verwalters, zum Kornspeicher und zum Symbol des neuen Herrn. Dass gerade dieser Turm umgeben von Autobahnen und Gewerbegebieten überlebt hat, macht ihn umso bemerkenswerter."}],"pt":[{"h":"História","t":"A torre recorda uma almunia, uma exploração agrícola da época muçulmana, que pode ter feito parte da linha defensiva de Fraga ao longo do Cinca. Após a conquista de 1149 passou por várias mãos, e um documento de 1296 já fala da almunia dos Templários. Depois pertenceu à Ordem do Hospital, e daí o nome «dos Frades».\n\nA sua origem situa-se, com prudência, no século XIII, porque não há escavações que o confirmem. Por volta de 1972 foi desmontada por causa do traçado da autoestrada e voltou a ser erguida perto do local original.\n\nA autoestrada que obrigou a deslocá-la é a AP-2, que liga Saragoça ao Mediterrâneo; a trasladação salvou a torre, embora a tenha separado do seu lugar exato."},{"h":"O que ver","t":"É uma torre quase quadrada, de silhares de calcário amarelado, com paredes de cerca de 90 cm. No lado oeste há uma porta de arco ogival com uma cruz em relevo por cima, provavelmente hospitalária.\n\nSe reparar, verá três épocas: a torre defensiva com seteiras e entrada elevada, a reforma hospitalária com a porta ao nível do chão e janelas do século XVI, e as alterações do século XIX. As ameias e o terraço são reconstruções do século XX.\n\nContorne-a por completo, se puder: cada fachada conta uma parte da sua história, e a luz da tarde realça a cor dourada da pedra."},{"h":"Para compreender","t":"Uma almunia era uma propriedade de recreio e de cultivo, com casa, horta, rega e, por vezes, uma torre para vigiar e servir de refúgio. A várzea do Cinca estava salpicada delas na época al-andalusina.\n\nApós a conquista, as ordens militares receberam muitas destas propriedades como recompensa pelo seu papel na guerra. Templários e hospitalários exploravam-nas como quintas, e as torres passavam a ser casa do administrador, celeiro e símbolo do novo senhor. Que esta tenha sobrevivido rodeada de autoestradas e zonas industriais torna-a ainda mais notável."}]},"status":"pending"},{"id":"pilaret-santa-quiteria","town":"Fraga","cat":"arqueologia","lat":41.56222,"lon":0.31711,"coord_src":null,"q":["Pilaret de Santa Quiteria, Fraga","Torre del Pilaret, Fraga"],"fq":["Pilaret de Santa Quiteria","Torre del Pilaret Fraga"],"name":{"es":"El Pilaret de Santa Quiteria","en":"El Pilaret de Santa Quiteria","fr":"El Pilaret de Santa Quiteria","de":"El Pilaret de Santa Quiteria","pt":"El Pilaret de Santa Quiteria"},"when":{"es":"Íberos y Edad Media · Torre vigía","en":"Iberians and Middle Ages · Watchtower","fr":"Ibères et Moyen Âge · Tour de guet","de":"Iberer und Mittelalter · Wachturm","pt":"Iberos e Idade Média · Torre de vigia"},"desc":{"es":"En un cerro sobre la orilla izquierda del Cinca, cerca de la Villa Fortunatus, se juntan un poblado ibérico y una torre vigía medieval. Ambos están declarados Bien de Interés Cultural.","en":"On a hill above the left bank of the Cinca, near Villa Fortunatus, an Iberian settlement and a medieval watchtower stand together. Both are listed as a Bien de Interés Cultural.","fr":"Sur une colline dominant la rive gauche du Cinca, près de la Villa Fortunatus, se rejoignent un village ibère et une tour de guet médiévale. Tous deux sont classés Bien d'intérêt culturel.","de":"Auf einem Hügel über dem linken Cinca-Ufer, nahe der Villa Fortunatus, treffen eine iberische Siedlung und ein mittelalterlicher Wachturm zusammen. Beide sind als Bien de Interés Cultural geschützt.","pt":"Num cerro sobre a margem esquerda do Cinca, perto da Villa Fortunatus, juntam-se um povoado ibérico e uma torre de vigia medieval. Ambos estão classificados como Bien de Interés Cultural."},"visit":{"es":"Está a unos 5 km al norte de Fraga por la A-1234; se sube por una pista hasta la meseta. Es un lugar al aire libre, sin servicios: lleva calzado cómodo y respeta los restos. Calcula media hora.","en":"It is about 5 km north of Fraga on the A-1234; a track climbs up to the plateau. It is an open-air site with no facilities: wear comfortable shoes and respect the remains. Allow half an hour.","fr":"Le site se trouve à environ 5 km au nord de Fraga par l'A-1234 ; on monte par une piste jusqu'au plateau. C'est un lieu en plein air, sans services : prévoyez des chaussures confortables et respectez les vestiges. Comptez une demi-heure.","de":"Der Ort liegt etwa 5 km nördlich von Fraga an der A-1234; über eine Piste gelangt man auf die Hochfläche. Er liegt im Freien und hat keine Einrichtungen: Tragen Sie bequeme Schuhe und gehen Sie behutsam mit den Überresten um. Rechnen Sie mit einer halben Stunde.","pt":"Fica a cerca de 5 km a norte de Fraga pela A-1234; sobe-se por um caminho de terra até à meseta. É um lugar ao ar livre, sem serviços: leve calçado confortável e respeite os vestígios. Conte com meia hora."},"src":"https://www.enciclopedia.cat/catalunya-romanica/torre-del-pilaret-de-santa-quiteria-fraga","sources":["https://www.enciclopedia.cat/catalunya-romanica/torre-del-pilaret-de-santa-quiteria-fraga","https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5489201","https://es.wikipedia.org/wiki/Bajo_Cinca"],"art":{"es":[{"h":"Historia","t":"En este cerro hubo un poblado ibérico desde las últimas décadas del siglo V a. C., que siguió habitado en época romana. En 1894 José Salarrullana de Dios encontró aquí una inscripción ibérica, hoy en paradero desconocido. Los hallazgos de cerámica a mano indican que el espolón ya se usó en la Edad del Bronce.\n\nLa torre es más tardía. Tenía foso y la puerta en alto, a la que solo se llegaba con escalera. Los especialistas dudan entre un origen andalusí y una obra de los siglos XIII-XIV; la hipótesis más prudente es un origen islámico con reformas cristianas, pendiente de estudio arqueológico.\n\nEl nombre de Santa Quiteria, que comparten el cerro y la partida donde está la Villa Fortunatus, recuerda una antigua devoción de la zona."},{"h":"Qué ver","t":"La torre, de planta rectangular y unos 10 metros de altura, tiene dos partes: los tres metros de abajo son de mampostería y el resto es de tapial con muchos cantos rodados. Aún se ven las filas de agujeros del encofrado y, al este, un foso de unos 3 metros.\n\nEl lado suroeste se ha derrumbado, así que mírala desde fuera. Alrededor, en la meseta, el terreno guarda los restos del poblado ibérico: no hay estructuras a la vista, pero sí la forma del espolón, fácil de defender.\n\nAl subir, fíjate en el tapial de la torre: es tierra apisonada entre tablas de madera, mezclada con cal y cantos del río. Las filas de agujeros que ves son las huellas de los maderos que sujetaban esas tablas mientras la tierra se secaba."},{"h":"El paisaje","t":"Desde arriba se entiende la función del lugar: vigilar el valle del Cinca y el barranco que sube hacia los llanos del interior. Abajo, junto al río, queda la Villa Fortunatus, y la vega verde contrasta con las laderas secas de yeso y arcilla.\n\nEs el mismo paisaje que vieron íberos, romanos y andalusíes, cada uno desde su punto: el poblado en lo alto, la villa en la terraza fértil y la torre como ojo de la frontera."}],"en":[{"h":"History","t":"There was an Iberian settlement on this hill from the last decades of the 5th century BC, and it remained inhabited in Roman times. In 1894 José Salarrullana de Dios found an Iberian inscription here, whose whereabouts are now unknown. Finds of handmade pottery show that the spur was already in use in the Bronze Age.\n\nThe tower is later. It had a ditch and a raised door that could only be reached by ladder. Specialists are divided between an Andalusi origin and a 13th-14th-century construction; the most cautious hypothesis is an Islamic origin with Christian alterations, pending archaeological study.\n\nThe name Santa Quiteria, shared by the hill and the area where Villa Fortunatus lies, recalls an old local devotion."},{"h":"What to see","t":"The tower, rectangular in plan and about 10 metres high, has two parts: the bottom three metres are rubble masonry and the rest is rammed earth with many river pebbles. You can still see the rows of holes left by the formwork and, to the east, a ditch about 3 metres deep.\n\nThe south-west side has collapsed, so view it from outside. Around it, on the plateau, the ground holds the remains of the Iberian settlement: no structures are visible, but the shape of the easily defended spur is.\n\nAs you climb, look at the tower's rammed earth: it is earth packed between wooden boards, mixed with lime and river stones. The rows of holes you can see are the marks of the timbers that held those boards in place while the earth dried."},{"h":"The landscape","t":"From the top you can see what the place was for: watching over the Cinca valley and the ravine that climbs towards the inland plains. Below, beside the river, lies Villa Fortunatus, and the green floodplain contrasts with the dry slopes of gypsum and clay.\n\nIt is the same landscape that Iberians, Romans and Andalusis saw, each from their own vantage point: the settlement on the heights, the villa on the fertile terrace and the tower as the eye of the frontier."}],"fr":[{"h":"Histoire","t":"Cette colline accueillit un village ibère dès les dernières décennies du Ve siècle av. J.-C., qui resta habité à l'époque romaine. En 1894, José Salarrullana de Dios y découvrit une inscription ibère, aujourd'hui introuvable. Les découvertes de céramique modelée à la main indiquent que l'éperon était déjà occupé à l'âge du bronze.\n\nLa tour est plus tardive. Elle avait un fossé et une porte en hauteur, accessible seulement par une échelle. Les spécialistes hésitent entre une origine andalouse et une construction des XIIIe-XIVe siècles ; l'hypothèse la plus prudente est une origine islamique avec des transformations chrétiennes, en attente d'une étude archéologique.\n\nLe nom de Santa Quiteria, que partagent la colline et le lieu-dit où se trouve la Villa Fortunatus, rappelle une ancienne dévotion locale."},{"h":"À voir","t":"La tour, de plan rectangulaire et haute d'environ 10 mètres, comporte deux parties : les trois mètres inférieurs sont en maçonnerie de moellons et le reste en pisé avec de nombreux galets. On voit encore les rangées de trous du coffrage et, à l'est, un fossé d'environ 3 mètres.\n\nLe côté sud-ouest s'est effondré : contentez-vous donc de l'observer de l'extérieur. Tout autour, sur le plateau, le terrain renferme les vestiges du village ibère : aucune structure n'est visible, mais on perçoit bien la forme de l'éperon, facile à défendre.\n\nEn montant, observez le pisé de la tour : c'est de la terre damée entre des planches de bois, mélangée à de la chaux et à des galets de rivière. Les rangées de trous que vous voyez sont les traces des pièces de bois qui maintenaient ces planches pendant que la terre séchait."},{"h":"Le paysage","t":"D'en haut, on comprend la fonction du lieu : surveiller la vallée du Cinca et le ravin qui monte vers les plateaux de l'intérieur. En contrebas, près de la rivière, se trouve la Villa Fortunatus, et la plaine verdoyante contraste avec les versants secs de gypse et d'argile.\n\nC'est le même paysage qu'ont contemplé Ibères, Romains et Andalous, chacun depuis son point de vue : le village en hauteur, la villa sur la terrasse fertile et la tour comme œil de la frontière."}],"de":[{"h":"Geschichte","t":"Auf diesem Hügel bestand seit den letzten Jahrzehnten des 5. Jahrhunderts v. Chr. eine iberische Siedlung, die auch in römischer Zeit bewohnt blieb. 1894 fand José Salarrullana de Dios hier eine iberische Inschrift, deren Verbleib heute unbekannt ist. Funde handgeformter Keramik zeigen, dass der Bergsporn bereits in der Bronzezeit genutzt wurde.\n\nDer Turm ist jünger. Er besaß einen Graben und einen hoch gelegenen Eingang, der nur über eine Leiter erreichbar war. Die Fachleute schwanken zwischen einem andalusischen Ursprung und einem Bau des 13.–14. Jahrhunderts; die vorsichtigste Hypothese ist ein islamischer Ursprung mit christlichen Umbauten, was noch archäologisch zu untersuchen ist.\n\nDer Name Santa Quiteria, den der Hügel mit der Flur der Villa Fortunatus teilt, erinnert an eine alte Verehrung in der Gegend."},{"h":"Sehenswert","t":"Der Turm mit rechteckigem Grundriss ist etwa 10 Meter hoch und besteht aus zwei Teilen: Die unteren drei Meter sind aus Bruchsteinmauerwerk, der Rest aus Stampflehm mit vielen Flusskieseln. Noch immer sieht man die Reihen der Schalungslöcher und im Osten einen etwa 3 Meter breiten Graben.\n\nDie Südwestseite ist eingestürzt, betrachten Sie den Turm also von außen. Ringsum auf der Hochfläche birgt der Boden die Reste der iberischen Siedlung: Bauten sind nicht sichtbar, wohl aber die Form des leicht zu verteidigenden Sporns.\n\nAchten Sie beim Aufstieg auf den Stampflehm des Turms: Erde, zwischen Holzbretter gestampft und mit Kalk und Flusskieseln vermischt. Die Lochreihen sind die Spuren der Balken, die diese Bretter hielten, während die Erde trocknete."},{"h":"Die Landschaft","t":"Von oben versteht man die Funktion des Ortes: das Cinca-Tal und die Schlucht zu überwachen, die zu den Ebenen im Landesinneren hinaufführt. Unten am Fluss liegt die Villa Fortunatus, und die grüne Aue bildet einen Kontrast zu den trockenen Hängen aus Gips und Ton.\n\nEs ist dieselbe Landschaft, die Iberer, Römer und Andalusier sahen, jeder von seinem Standpunkt aus: die Siedlung auf der Höhe, die Villa auf der fruchtbaren Terrasse und der Turm als Auge der Grenze."}],"pt":[{"h":"História","t":"Neste cerro existiu um povoado ibérico desde as últimas décadas do século V a. C., que continuou habitado na época romana. Em 1894 José Salarrullana de Dios encontrou aqui uma inscrição ibérica, hoje em paradeiro desconhecido. Os achados de cerâmica feita à mão indicam que o esporão já era usado na Idade do Bronze.\n\nA torre é mais tardia. Tinha fosso e a porta em altura, à qual só se chegava por escada. Os especialistas hesitam entre uma origem al-andalusina e uma obra dos séculos XIII-XIV; a hipótese mais prudente é uma origem islâmica com reformas cristãs, à espera de estudo arqueológico.\n\nO nome de Santa Quiteria, partilhado pelo cerro e pela zona onde se encontra a Villa Fortunatus, recorda uma antiga devoção local."},{"h":"O que ver","t":"A torre, de planta retangular e cerca de 10 metros de altura, tem duas partes: os três metros de baixo são de alvenaria e o resto é de taipa com muitos seixos rolados. Ainda se veem as filas de buracos da cofragem e, a leste, um fosso de cerca de 3 metros.\n\nO lado sudoeste ruiu, por isso observe-a de fora. Em redor, na meseta, o terreno guarda os vestígios do povoado ibérico: não há estruturas à vista, mas percebe-se a forma do esporão, fácil de defender.\n\nAo subir, repare na taipa da torre: é terra calcada entre tábuas de madeira, misturada com cal e seixos do rio. As filas de buracos que vê são as marcas das traves que seguravam essas tábuas enquanto a terra secava."},{"h":"A paisagem","t":"Lá de cima percebe-se a função do lugar: vigiar o vale do Cinca e a ravina que sobe para as planícies do interior. Em baixo, junto ao rio, fica a Villa Fortunatus, e a várzea verde contrasta com as encostas secas de gesso e argila.\n\nÉ a mesma paisagem que iberos, romanos e al-andalusinos viram, cada um do seu ponto: o povoado no alto, a villa no terraço fértil e a torre como olho da fronteira."}]},"status":"pending"},{"id":"valcuerna","town":"Fraga","cat":"naturaleza","lat":41.51848,"lon":0.35383,"coord_src":null,"q":["Valcuerna, Fraga","Barranco de la Valcuerna"],"fq":["Valcuerna","Embalse de Mequinenza Valcuerna","Valcuerna Fraga"],"name":{"es":"La Valcuerna","en":"La Valcuerna","fr":"La Valcuerna","de":"La Valcuerna","pt":"La Valcuerna"},"when":{"es":"Barranco y embalse · Paisaje de secano","en":"Ravine and reservoir · Dry-farming landscape","fr":"Ravin et lac de barrage · Paysage de secano","de":"Schlucht und Stausee · Trockenlandschaft","pt":"Ravina e albufeira · Paisagem de sequeiro"},"desc":{"es":"Un largo barranco entre Candasnos y Fraga que desemboca en el embalse de Mequinenza. Hay acceso al agua, un refugio de pescadores y, con suerte, ciervos entre el monte bajo.","en":"A long ravine between Candasnos and Fraga that runs down into the Mequinenza reservoir. There is access to the water, an anglers' shelter and, with luck, deer among the scrub.","fr":"Un long ravin entre Candasnos et Fraga qui débouche sur le lac de barrage de Mequinenza. On y trouve un accès à l'eau, un refuge de pêcheurs et, avec un peu de chance, des cerfs dans la garrigue.","de":"Eine lange Schlucht zwischen Candasnos und Fraga, die in den Stausee von Mequinenza mündet. Es gibt einen Zugang zum Wasser, eine Anglerhütte und mit etwas Glück Hirsche im Buschland.","pt":"Uma longa ravina entre Candasnos e Fraga que desagua na albufeira de Mequinenza. Há acesso à água, um abrigo de pescadores e, com sorte, veados entre o mato rasteiro."},"visit":{"es":"Se llega en coche por pistas desde la zona de Candasnos; el último tramo es de tierra. No hay servicios: lleva agua y respeta las propiedades y la actividad de los pescadores. Mejor a primera o última hora del día.","en":"It is reached by car along tracks from the Candasnos area; the last stretch is unpaved. There are no facilities: take water and respect private property and the anglers' activity. Best first thing in the morning or late in the day.","fr":"On y accède en voiture par des pistes depuis le secteur de Candasnos ; le dernier tronçon est en terre. Il n'y a aucun service : emportez de l'eau et respectez les propriétés et l'activité des pêcheurs. Mieux vaut y aller tôt le matin ou en fin de journée.","de":"Man erreicht sie mit dem Auto über Pisten aus der Gegend von Candasnos; das letzte Stück ist unbefestigt. Es gibt keine Einrichtungen: Nehmen Sie Wasser mit und respektieren Sie Privatgrundstücke und die Angler. Am besten früh am Morgen oder am Abend.","pt":"Chega-se de carro por caminhos a partir da zona de Candasnos; o último troço é de terra batida. Não há serviços: leve água e respeite as propriedades e a atividade dos pescadores. Melhor logo de manhã cedo ou ao fim do dia."},"src":"https://www.bajocinca.es/candasnos/-/asset_publisher/arUvEBFVht7d/content/id/1597392","sources":["https://www.bajocinca.es/candasnos/-/asset_publisher/arUvEBFVht7d/content/id/1597392","https://es.hispanopedia.com/wiki/Candasnos","https://es.hispanopedia.com/wiki/Embalse_de_Mequinenza"],"art":{"es":[{"h":"El paisaje","t":"La Valcuerna es el contraste de la comarca: arriba, el secano llano de los Monegros con campos de cereal y monte bajo; abajo, un barranco que se va encajando hasta encontrar el agua azul del embalse de Mequinenza. El término de Candasnos llega hasta las orillas del arroyo de Valcuerna, su punto más bajo, a unos 160 metros de altitud.\n\nEn el fondo del valle, la vegetación se espesa y el silencio solo lo rompen las aves. Los ciervos se dejan ver a veces al atardecer, cuando bajan a beber.\n\nEn primavera, tras las lluvias, las laderas se cubren de un verde breve y de flores de romero y tomillo; en verano el color dominante es el ocre, y el agua del embalse parece todavía más azul por contraste."},{"h":"Qué ver","t":"La Comarca acondicionó el acceso al embalse dentro de su proyecto Entre Ríos, y junto al agua hay un refugio de pescadores. Es un buen sitio para entender cómo el Mar de Aragón, creado en los años sesenta, inundó el fondo de estos barrancos y los convirtió en brazos de agua.\n\nDesde la orilla se ven las laderas de yeso y arcilla, rayadas por la erosión, y las colas del embalse que se pierden hacia el oeste.\n\nSi te gusta la fotografía, el mejor momento es el atardecer: la luz baja dora las laderas de yeso y se refleja en el agua. Lleva prismáticos para buscar rapaces y, con suerte, algún ciervo en las laderas."},{"h":"Para entenderlo","t":"El embalse de Mequinenza se extiende unos 110 kilómetros río arriba y tiene más de 75 kilómetros cuadrados de superficie. Al llenarse, el agua entró en todos los barrancos laterales, como la Valcuerna, y creó un paisaje nuevo de bahías y entrantes.\n\nEsa agua tranquila atrae a pescadores de toda Europa, sobre todo por el siluro, un pez introducido en los años setenta que puede superar los dos metros. Si vas, recuerda que pescar exige licencia y las normas del coto.\n\nAntes del embalse, la Valcuerna era un barranco seco la mayor parte del año, que desaguaba en el Ebro solo con las tormentas."}],"en":[{"h":"The landscape","t":"La Valcuerna is the comarca's great contrast: above, the flat dry-farmed land of Los Monegros with cereal fields and scrub; below, a ravine that cuts ever deeper until it meets the blue water of the Mequinenza reservoir. The municipality of Candasnos reaches down to the banks of the Valcuerna stream, its lowest point, at about 160 metres above sea level.\n\nAt the bottom of the valley the vegetation thickens and the silence is broken only by birds. Deer can sometimes be seen at dusk, when they come down to drink.\n\nIn spring, after the rains, the slopes are covered in a brief green and in rosemary and thyme flowers; in summer the dominant colour is ochre, and the water of the reservoir looks even bluer by contrast."},{"h":"What to see","t":"The Comarca improved access to the reservoir as part of its Entre Ríos project, and there is an anglers' shelter beside the water. It is a good place to understand how the Mar de Aragón (Sea of Aragón), created in the 1960s, flooded the floors of these ravines and turned them into arms of water.\n\nFrom the shore you can see the gypsum and clay slopes, streaked by erosion, and the tail waters of the reservoir disappearing towards the west.\n\nIf you enjoy photography, the best time is sunset: the low light gilds the gypsum slopes and is reflected in the water. Take binoculars to look for birds of prey and, with luck, a deer or two on the slopes."},{"h":"Background","t":"The Mequinenza reservoir stretches about 110 kilometres upstream and has a surface area of more than 75 square kilometres. As it filled, the water entered every side ravine, such as La Valcuerna, creating a new landscape of bays and inlets.\n\nThat calm water attracts anglers from all over Europe, above all for the wels catfish, a fish introduced in the 1970s that can grow to more than two metres. If you go, remember that fishing requires a licence and compliance with the rules of the fishing reserve.\n\nBefore the reservoir, La Valcuerna was a dry ravine for most of the year, draining into the Ebro only during storms."}],"fr":[{"h":"Le paysage","t":"La Valcuerna incarne le contraste de la comarque : en haut, le secano plat des Monegros, avec ses champs de céréales et sa garrigue ; en bas, un ravin qui s'encaisse peu à peu jusqu'à rencontrer l'eau bleue du lac de Mequinenza. Le territoire de Candasnos s'étend jusqu'aux rives du ruisseau de Valcuerna, son point le plus bas, à environ 160 mètres d'altitude.\n\nAu fond de la vallée, la végétation s'épaissit et seul le chant des oiseaux rompt le silence. Les cerfs se montrent parfois au crépuscule, quand ils descendent boire.\n\nAu printemps, après les pluies, les versants se couvrent d'un vert éphémère et de fleurs de romarin et de thym ; en été, l'ocre domine, et l'eau du lac paraît encore plus bleue par contraste."},{"h":"À voir","t":"La Comarca a aménagé l'accès au lac dans le cadre de son projet Entre Ríos, et un refuge de pêcheurs se trouve au bord de l'eau. C'est un bon endroit pour comprendre comment le Mar de Aragón (mer d'Aragon), créé dans les années soixante, a inondé le fond de ces ravins pour les transformer en bras d'eau.\n\nDepuis la rive, on voit les versants de gypse et d'argile, striés par l'érosion, et les queues du lac qui se perdent vers l'ouest.\n\nSi vous aimez la photographie, le meilleur moment est le coucher du soleil : la lumière rasante dore les versants de gypse et se reflète dans l'eau. Emportez des jumelles pour repérer les rapaces et, avec un peu de chance, un cerf sur les pentes."},{"h":"Pour comprendre","t":"Le lac de Mequinenza s'étend sur environ 110 kilomètres en amont et couvre plus de 75 kilomètres carrés. En se remplissant, l'eau a envahi tous les ravins latéraux, comme la Valcuerna, et créé un paysage nouveau de baies et d'anses.\n\nCette eau calme attire des pêcheurs de toute l'Europe, surtout pour le silure, un poisson introduit dans les années soixante-dix qui peut dépasser deux mètres. Si vous y allez, rappelez-vous que la pêche exige un permis et le respect du règlement du lot de pêche.\n\nAvant le barrage, la Valcuerna était un ravin sec la plus grande partie de l'année, qui ne se déversait dans l'Èbre qu'au moment des orages."}],"de":[{"h":"Die Landschaft","t":"Die Valcuerna ist der große Kontrast der Comarca: oben das flache Trockenland der Monegros mit Getreidefeldern und Buschland, unten eine Schlucht, die sich immer tiefer einschneidet, bis sie auf das blaue Wasser des Stausees von Mequinenza trifft. Das Gemeindegebiet von Candasnos reicht bis an die Ufer des Baches Valcuerna, seinen tiefsten Punkt auf etwa 160 Metern Höhe.\n\nAuf dem Talgrund wird die Vegetation dichter, und die Stille wird nur von Vögeln unterbrochen. Hirsche zeigen sich manchmal in der Abenddämmerung, wenn sie zum Trinken herabkommen.\n\nIm Frühjahr, nach den Regenfällen, überziehen sich die Hänge mit einem kurzlebigen Grün und den Blüten von Rosmarin und Thymian; im Sommer dominiert Ocker, und das Wasser des Stausees wirkt im Kontrast noch blauer."},{"h":"Sehenswert","t":"Die Comarca hat im Rahmen ihres Projekts Entre Ríos den Zugang zum Stausee hergerichtet, und am Wasser steht eine Anglerhütte. Hier lässt sich gut nachvollziehen, wie das in den 1960er-Jahren entstandene Mar de Aragón (Aragonisches Meer) den Grund dieser Schluchten überflutete und sie in Wasserarme verwandelte.\n\nVom Ufer aus sieht man die von Erosion gefurchten Hänge aus Gips und Ton und die Ausläufer des Stausees, die sich nach Westen verlieren.\n\nFür Fotografen ist der Sonnenuntergang die beste Zeit: Das tief stehende Licht vergoldet die Gipshänge und spiegelt sich im Wasser. Nehmen Sie ein Fernglas mit, um nach Greifvögeln und mit etwas Glück nach Hirschen an den Hängen Ausschau zu halten."},{"h":"Zum Verständnis","t":"Der Stausee von Mequinenza erstreckt sich rund 110 Kilometer flussaufwärts und hat eine Fläche von über 75 Quadratkilometern. Beim Aufstauen drang das Wasser in alle Seitenschluchten wie die Valcuerna ein und schuf eine neue Landschaft aus Buchten und Einschnitten.\n\nDieses ruhige Wasser zieht Angler aus ganz Europa an, vor allem wegen des Welses, eines in den 1970er-Jahren eingeführten Fisches, der über zwei Meter lang werden kann. Denken Sie daran, dass zum Angeln eine Lizenz nötig ist und die Regeln des Angelreviers gelten.\n\nVor dem Stausee war die Valcuerna die meiste Zeit des Jahres eine trockene Schlucht, die nur bei Gewittern Wasser in den Ebro führte."}],"pt":[{"h":"A paisagem","t":"La Valcuerna é o contraste da comarca: em cima, o sequeiro plano dos Monegros com campos de cereais e mato rasteiro; em baixo, uma ravina que se vai encaixando até encontrar a água azul da albufeira de Mequinenza. O concelho de Candasnos chega até às margens do ribeiro de Valcuerna, o seu ponto mais baixo, a cerca de 160 metros de altitude.\n\nNo fundo do vale, a vegetação adensa-se e o silêncio só é quebrado pelas aves. Os veados deixam-se ver por vezes ao entardecer, quando descem para beber.\n\nNa primavera, depois das chuvas, as encostas cobrem-se de um verde breve e de flores de alecrim e tomilho; no verão a cor dominante é o ocre, e a água da albufeira parece ainda mais azul por contraste."},{"h":"O que ver","t":"A Comarca preparou o acesso à albufeira no âmbito do seu projeto Entre Ríos, e junto à água há um abrigo de pescadores. É um bom lugar para perceber como o Mar de Aragón (Mar de Aragão), criado nos anos sessenta, inundou o fundo destas ravinas e as transformou em braços de água.\n\nDa margem veem-se as encostas de gesso e argila, riscadas pela erosão, e as caudas da albufeira que se perdem para oeste.\n\nSe gosta de fotografia, o melhor momento é o entardecer: a luz rasante doura as encostas de gesso e reflete-se na água. Leve binóculos para procurar aves de rapina e, com sorte, algum veado nas encostas."},{"h":"Para compreender","t":"A albufeira de Mequinenza estende-se por cerca de 110 quilómetros rio acima e tem mais de 75 quilómetros quadrados de superfície. Ao encher, a água entrou em todas as ravinas laterais, como La Valcuerna, e criou uma paisagem nova de baías e reentrâncias.\n\nEssa água tranquila atrai pescadores de toda a Europa, sobretudo pelo siluro, um peixe introduzido nos anos setenta que pode ultrapassar os dois metros. Se for, lembre-se de que pescar exige licença e o cumprimento das regras da zona de pesca.\n\nAntes da albufeira, La Valcuerna era uma ravina seca durante a maior parte do ano, que só escoava para o Ebro com as trovoadas."}]},"status":"pending"},{"id":"castillo-mequinenza","town":"Mequinenza","cat":"patrimonio","lat":41.36497,"lon":0.29649,"coord_src":null,"q":["Castillo de Mequinenza","Castell de Mequinensa"],"fq":["Category:Castle of Mequinenza","Castillo de Mequinenza","Mequinenza castle","Castell de Mequinensa"],"name":{"es":"Castillo de Mequinenza","en":"Castillo de Mequinenza (Mequinenza Castle)","fr":"Castillo de Mequinenza (château de Mequinenza)","de":"Castillo de Mequinenza","pt":"Castelo de Mequinenza"},"when":{"es":"Siglos XIV-XV · Castillo-palacio de los Moncada","en":"14th-15th centuries · Castle-palace of the Moncadas","fr":"XIVe-XVe siècles · Château-palais des Moncada","de":"14.–15. Jh. · Burgpalast der Moncada","pt":"Séculos XIV-XV · Castelo-palácio dos Moncada"},"desc":{"es":"Un castillo-palacio gótico sobre el cerro que vigila la unión del Ebro y el Segre, en la frontera entre Aragón y Cataluña. Lo levantaron los Moncada, señores de Mequinenza, y sufrió el asedio francés de 1810.","en":"A Gothic castle-palace on the hill overlooking the meeting of the Ebro and the Segre, on the border between Aragón and Catalonia. It was built by the Moncadas, lords of Mequinenza, and withstood the French siege of 1810.","fr":"Un château-palais gothique sur la colline qui surveille la confluence de l'Èbre et du Segre, à la frontière entre l'Aragon et la Catalogne. Il fut élevé par les Moncada, seigneurs de Mequinenza, et subit le siège français de 1810.","de":"Ein gotischer Burgpalast auf dem Hügel, der über den Zusammenfluss von Ebro und Segre an der Grenze zwischen Aragón und Katalonien wacht. Erbaut wurde er von den Moncada, den Herren von Mequinenza, und er erlebte 1810 die französische Belagerung.","pt":"Um castelo-palácio gótico sobre o cerro que vigia a união do Ebro e do Segre, na fronteira entre Aragão e a Catalunha. Foi erguido pelos Moncada, senhores de Mequinenza, e sofreu o cerco francês de 1810."},"visit":{"es":"Es propiedad de la Fundación Endesa y solo se visita por dentro con cita previa, según disponibilidad, a través de los Museos de Mequinenza. El exterior y las vistas desde el cerro se disfrutan libremente. Confirma días de visita antes de ir.","en":"It is owned by the Fundación Endesa and the interior can only be visited by appointment, subject to availability, through the Museos de Mequinenza. The exterior and the views from the hill can be enjoyed freely. Check visiting days before you go.","fr":"Il appartient à la Fundación Endesa et ne se visite à l'intérieur que sur rendez-vous, selon les disponibilités, par l'intermédiaire des Museos de Mequinenza. L'extérieur et la vue depuis la colline sont en accès libre. Vérifiez les jours de visite avant d'y aller.","de":"Die Burg gehört der Fundación Endesa und kann von innen nur nach Voranmeldung und je nach Verfügbarkeit über die Museos de Mequinenza besichtigt werden. Außenbereich und Aussicht vom Hügel sind frei zugänglich. Erkundigen Sie sich vorher nach den Besuchstagen.","pt":"É propriedade da Fundación Endesa e só se visita por dentro com marcação prévia, conforme a disponibilidade, através dos Museos de Mequinenza. O exterior e as vistas do cerro desfrutam-se livremente. Confirme os dias de visita antes de ir."},"src":"https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5490366","sources":["https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5490366","https://es.wikipedia.org/wiki/Mequinenza","https://es.wikipedia.org/wiki/Asedio_de_Mequinenza","https://www.museosdemequinenza.com/wp-content/uploads/2018/05/Museos-de-Mequinenza-web.pdf","https://lamagiadeviajar.com/wp-content/uploads/old/articulos/pdf/MAGIA72Mequinenza.pdf"],"art":{"es":[{"h":"Historia","t":"En 1212 el rey Pedro II casó a su hija Constanza con Guillén Ramón de Moncada, y la dote incluía el señorío de Mequinenza. Desde entonces los Moncada fueron señores de la villa y, entre los siglos XIV y XV, construyeron el castillo actual, quizá sobre una fortaleza musulmana anterior.\n\nLa posición, sobre tres ríos, lo convirtió en objetivo de varias guerras: la civil catalana (1462-1472), la de Secesión (1640-1652) y la de Sucesión (1705-1714) dañaron la villa y el castillo. En 1810 el ejército francés del general Suchet abrió un camino en zigzag para subir la artillería hasta el cerro; tras días de bombardeo, la guarnición española se rindió el 8 de junio.\n\nLa visita interior se concierta en los Museos de Mequinenza, que gestionan las reservas en nombre de la Fundación Endesa, propietaria del edificio."},{"h":"Qué ver","t":"Desde fuera se aprecia la planta rectangular con torres y las defensas exteriores añadidas en la Edad Moderna, cuando el castillo se adaptó a la artillería. El interior solo se recorre en la visita concertada.\n\nEl mejor premio es la vista: a un lado, el embalse; al otro, el Pueblo Viejo y la confluencia de los ríos, que aquí forman un cauce de más de 500 metros de ancho.\n\nPara subir, sigue la carretera que sale del pueblo hacia el cerro. Arriba, rodea el recinto por fuera para ver cada lado de la fortaleza y las tres direcciones que vigilaba: el Ebro hacia Caspe, el Segre hacia Lérida y el valle hacia el mar."},{"h":"Para entenderlo","t":"Mequinenza está en un cruce: el Ebro llega desde Zaragoza, el Segre baja desde Lérida y trae ya las aguas del Cinca. Quien dominaba este cerro controlaba el paso de barcas, mercancías y ejércitos.\n\nPor eso el castillo se reforzó una y otra vez. Imagina el valle antes de los pantanos, con el pueblo junto al agua, los llaguts cargados de carbón bajando por el Ebro y las caballerías tirando de ellos desde el camino de sirga. El Museo de la Historia, en el Pueblo Viejo, recrea esos asedios."}],"en":[{"h":"History","t":"In 1212 King Peter II married his daughter Constance to Guillén Ramón de Moncada, and the dowry included the lordship of Mequinenza. From then on the Moncadas were lords of the town and, between the 14th and 15th centuries, they built the present castle, perhaps on an earlier Muslim fortress.\n\nIts position above three rivers made it a target in several wars: the Catalan Civil War (1462-1472), the Reapers' War (1640-1652) and the War of the Spanish Succession (1705-1714) all damaged the town and the castle. In 1810 General Suchet's French army cut a zigzag road to haul its artillery up the hill; after days of bombardment, the Spanish garrison surrendered on 8 June.\n\nVisits to the interior are arranged through the Museos de Mequinenza, which handle bookings on behalf of the Fundación Endesa, the building's owner."},{"h":"What to see","t":"From outside you can appreciate the rectangular plan with towers and the outer defences added in the early modern period, when the castle was adapted to artillery. The interior can only be seen on a pre-arranged visit.\n\nThe greatest reward is the view: on one side, the reservoir; on the other, the Pueblo Viejo (Old Town) and the confluence of the rivers, which here form a channel more than 500 metres wide.\n\nTo get there, follow the road that leads up from the town to the hill. At the top, walk round the outside of the enclosure to see each side of the fortress and the three directions it guarded: the Ebro towards Caspe, the Segre towards Lleida and the valley towards the sea."},{"h":"Background","t":"Mequinenza stands at a crossroads: the Ebro arrives from Zaragoza, and the Segre comes down from Lleida already carrying the waters of the Cinca. Whoever held this hill controlled the passage of boats, goods and armies.\n\nThat is why the castle was strengthened time and again. Picture the valley before the reservoirs, with the town beside the water, llaguts (river barges) loaded with coal heading down the Ebro and horses and mules hauling them from the towpath. The Museo de la Historia (History Museum), in the Pueblo Viejo, recreates those sieges."}],"fr":[{"h":"Histoire","t":"En 1212, le roi Pierre II maria sa fille Constance à Guillén Ramón de Moncada, et la dot comprenait la seigneurie de Mequinenza. Dès lors, les Moncada furent seigneurs de la ville et, entre le XIVe et le XVe siècle, ils construisirent le château actuel, peut-être sur une forteresse musulmane antérieure.\n\nSa position, au-dessus de trois rivières, en fit la cible de plusieurs guerres : la guerre civile catalane (1462-1472), la guerre des Faucheurs (1640-1652) et la guerre de Succession (1705-1714) endommagèrent la ville et le château. En 1810, l'armée française du général Suchet ouvrit un chemin en zigzag pour hisser l'artillerie jusqu'au sommet ; après des jours de bombardement, la garnison espagnole se rendit le 8 juin.\n\nLa visite intérieure se réserve auprès des Museos de Mequinenza, qui gèrent les réservations au nom de la Fundación Endesa, propriétaire de l'édifice."},{"h":"À voir","t":"De l'extérieur, on apprécie le plan rectangulaire flanqué de tours et les défenses extérieures ajoutées à l'époque moderne, lorsque le château fut adapté à l'artillerie. L'intérieur ne se découvre que lors de la visite sur rendez-vous.\n\nLa plus belle récompense est la vue : d'un côté, le lac de barrage ; de l'autre, le Pueblo Viejo et la confluence des rivières, qui forment ici un lit de plus de 500 mètres de large.\n\nPour monter, suivez la route qui part du village vers la colline. En haut, faites le tour de l'enceinte par l'extérieur pour voir chaque côté de la forteresse et les trois directions qu'elle surveillait : l'Èbre vers Caspe, le Segre vers Lérida et la vallée vers la mer."},{"h":"Pour comprendre","t":"Mequinenza se trouve à un carrefour : l'Èbre arrive de Saragosse, le Segre descend de Lérida en amenant déjà les eaux du Cinca. Qui tenait cette colline contrôlait le passage des barques, des marchandises et des armées.\n\nC'est pourquoi le château fut renforcé encore et encore. Imaginez la vallée avant les barrages, avec le village au bord de l'eau, les llaguts chargés de charbon descendant l'Èbre et les bêtes de trait les halant depuis le chemin de halage. Le Museo de la Historia, dans le Pueblo Viejo, fait revivre ces sièges."}],"de":[{"h":"Geschichte","t":"1212 verheiratete König Peter II. seine Tochter Konstanze mit Guillén Ramón de Moncada, und zur Mitgift gehörte die Herrschaft Mequinenza. Seitdem waren die Moncada Herren des Ortes und errichteten zwischen dem 14. und 15. Jahrhundert die heutige Burg, möglicherweise auf einer älteren muslimischen Festung.\n\nDie Lage über drei Flüssen machte sie zum Ziel mehrerer Kriege: Der katalanische Bürgerkrieg (1462–1472), der Aufstand der Katalanen (1640–1652) und der Spanische Erbfolgekrieg (1705–1714) beschädigten Ort und Burg. 1810 legte das französische Heer unter General Suchet einen Zickzackweg an, um die Artillerie auf den Hügel zu bringen; nach tagelangem Beschuss ergab sich die spanische Garnison am 8. Juni.\n\nDie Innenbesichtigung wird über die Museos de Mequinenza vereinbart, die die Reservierungen im Auftrag der Fundación Endesa, der Eigentümerin des Gebäudes, abwickeln."},{"h":"Sehenswert","t":"Von außen erkennt man den rechteckigen Grundriss mit Türmen und die äußeren Verteidigungsanlagen, die in der Neuzeit hinzukamen, als die Burg an die Artillerie angepasst wurde. Das Innere ist nur bei der vereinbarten Führung zugänglich.\n\nDie schönste Belohnung ist die Aussicht: auf der einen Seite der Stausee, auf der anderen das Pueblo Viejo (Altes Dorf) und der Zusammenfluss, an dem die Flüsse ein über 500 Meter breites Bett bilden.\n\nFolgen Sie für den Aufstieg der Straße, die vom Ort zum Hügel führt. Gehen Sie oben außen um die Anlage herum, um jede Seite der Festung und die drei Richtungen zu sehen, die sie überwachte: den Ebro nach Caspe, den Segre nach Lleida und das Tal zum Meer hin."},{"h":"Zum Verständnis","t":"Mequinenza liegt an einer Kreuzung: Der Ebro kommt von Zaragoza, der Segre fließt von Lleida herab und bringt bereits das Wasser des Cinca mit. Wer diesen Hügel beherrschte, kontrollierte den Verkehr von Booten, Waren und Heeren.\n\nDeshalb wurde die Burg immer wieder verstärkt. Stellen Sie sich das Tal vor den Stauseen vor, mit dem Dorf am Wasser, den mit Kohle beladenen Llaguts (Flussbooten), die den Ebro hinabfuhren, und den Lasttieren, die sie vom Treidelpfad aus zogen. Das Museo de la Historia im Pueblo Viejo stellt diese Belagerungen nach."}],"pt":[{"h":"História","t":"Em 1212 o rei Pedro II casou a sua filha Constança com Guillén Ramón de Moncada, e o dote incluía o senhorio de Mequinenza. Desde então os Moncada foram senhores da vila e, entre os séculos XIV e XV, construíram o castelo atual, talvez sobre uma fortaleza muçulmana anterior.\n\nA posição, sobre três rios, tornou-o alvo de várias guerras: a guerra civil catalã (1462-1472), a da Secessão (1640-1652) e a da Sucessão (1705-1714) danificaram a vila e o castelo. Em 1810 o exército francês do general Suchet abriu um caminho em ziguezague para levar a artilharia até ao cerro; após dias de bombardeamento, a guarnição espanhola rendeu-se a 8 de junho.\n\nA visita ao interior marca-se nos Museos de Mequinenza, que gerem as reservas em nome da Fundación Endesa, proprietária do edifício."},{"h":"O que ver","t":"De fora aprecia-se a planta retangular com torres e as defesas exteriores acrescentadas na Idade Moderna, quando o castelo foi adaptado à artilharia. O interior só se percorre na visita marcada.\n\nO melhor prémio é a vista: de um lado, a albufeira; do outro, o Pueblo Viejo (Povoação Velha) e a confluência dos rios, que aqui formam um leito com mais de 500 metros de largura.\n\nPara subir, siga a estrada que sai da povoação em direção ao cerro. Lá em cima, contorne o recinto por fora para ver cada lado da fortaleza e as três direções que vigiava: o Ebro para Caspe, o Segre para Lérida e o vale para o mar."},{"h":"Para compreender","t":"Mequinenza fica num cruzamento: o Ebro chega de Saragoça, o Segre desce de Lérida e traz já as águas do Cinca. Quem dominava este cerro controlava a passagem de barcos, mercadorias e exércitos.\n\nPor isso o castelo foi reforçado uma e outra vez. Imagine o vale antes das barragens, com a povoação junto à água, os llaguts carregados de carvão a descer o Ebro e as cavalgaduras a puxá-los a partir do caminho de sirga. O Museo de la Historia, no Pueblo Viejo, recria esses cercos."}]},"status":"pending"},{"id":"pueblo-viejo-mequinenza","town":"Mequinenza","cat":"memoria","lat":41.36218,"lon":0.29705,"coord_src":null,"q":["Pueblo Viejo de Mequinenza","Poble Vell de Mequinensa"],"fq":["Pueblo Viejo de Mequinenza","Mequinenza poble vell","Mequinenza old town ruins"],"name":{"es":"Pueblo Viejo de Mequinenza","en":"Pueblo Viejo de Mequinenza (Mequinenza Old Town)","fr":"Pueblo Viejo de Mequinenza (vieux village)","de":"Pueblo Viejo de Mequinenza","pt":"Pueblo Viejo de Mequinenza"},"when":{"es":"Derribado en los años 60 · Memoria","en":"Demolished in the 1960s · Memory","fr":"Démoli dans les années 1960 · Mémoire","de":"In den 1960er-Jahren abgerissen · Erinnerung","pt":"Demolido nos anos 60 · Memória"},"desc":{"es":"Las calles y los cimientos del antiguo pueblo de Mequinenza, derribado por el embalse de Ribarroja. Un pueblo de navegantes y mineros que el escritor Jesús Moncada convirtió en literatura.","en":"The streets and foundations of the old town of Mequinenza, demolished for the Ribarroja reservoir. A town of boatmen and miners that the writer Jesús Moncada turned into literature.","fr":"Les rues et les fondations de l'ancien village de Mequinenza, démoli à cause du barrage de Ribarroja. Un village de bateliers et de mineurs que l'écrivain Jesús Moncada a transformé en littérature.","de":"Die Gassen und Fundamente des alten Mequinenza, das für den Stausee von Ribarroja abgerissen wurde. Ein Dorf von Flussschiffern und Bergleuten, das der Schriftsteller Jesús Moncada zu Literatur machte.","pt":"As ruas e os alicerces da antiga povoação de Mequinenza, demolida por causa da albufeira de Ribarroja. Uma terra de barqueiros e mineiros que o escritor Jesús Moncada transformou em literatura."},"visit":{"es":"Se pasea por los restos a pie desde los Museos de Mequinenza. La Ruta Literaria Jesús Moncada es guiada y se reserva con antelación en los propios museos. Calcula una hora y media.","en":"Walk among the remains from the Museos de Mequinenza. The Jesús Moncada Literary Route is guided and must be booked in advance at the museums themselves. Allow an hour and a half.","fr":"On parcourt les vestiges à pied depuis les Museos de Mequinenza. La Ruta Literaria Jesús Moncada est guidée et se réserve à l'avance auprès des musées. Comptez une heure et demie.","de":"Man erkundet die Überreste zu Fuß, ausgehend von den Museos de Mequinenza. Die Ruta Literaria Jesús Moncada ist eine Führung und wird im Voraus direkt bei den Museen gebucht. Rechnen Sie mit anderthalb Stunden.","pt":"Passeia-se a pé pelos vestígios a partir dos Museos de Mequinenza. A Ruta Literaria Jesús Moncada é guiada e reserva-se com antecedência nos próprios museus. Conte com uma hora e meia."},"src":"https://www.museosdemequinenza.com/wp-content/uploads/2018/05/Pueblo-Viejo-de-Mequinenza-web.pdf","sources":["https://www.museosdemequinenza.com/wp-content/uploads/2018/05/Pueblo-Viejo-de-Mequinenza-web.pdf","https://www.museosdemequinenza.com/wp-content/uploads/2018/05/Museos-de-Mequinenza-web.pdf","https://lamagiadeviajar.com/wp-content/uploads/old/articulos/pdf/MAGIA72Mequinenza.pdf","https://es.wikipedia.org/wiki/Mequinenza","https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5490366"],"art":{"es":[{"h":"Historia","t":"El viejo Mequinenza vivía junto al Ebro, a los pies del castillo y cerca de la confluencia con el Segre. Sus vecinos eran navegantes que llevaban el carbón río abajo en llaguts, tirados desde la orilla por el camino de sirga, y mineros de las minas cercanas.\n\nLos embalses de Mequinenza y Ribarroja lo cambiaron todo. En los años sesenta la mayor parte del pueblo fue derribada y sus vecinos se trasladaron al nuevo núcleo, junto al Segre. Solo quedó en pie el grupo escolar María Quintana, inaugurado en 1929, que hoy alberga los museos."},{"h":"Qué ver","t":"La ruta recorre el Muro, que protegía la villa de las riadas y hacía de muelle para los llaguts; la casa natal de Jesús Moncada, con un pequeño texto colgado en la puerta dirigido a quien fuera a derribarla; el Cine Goya, el «cine de dalt»; la plaza de Armas; la calle de las Brujas, tan estrecha que dos personas no se cruzan; y la calle de las Piedras, con su empedrado.\n\nSe reconocen los cimientos de la iglesia de la Asunción, de 1803, donde estaba el altar de Santa Agatoclia, patrona del pueblo. Al final esperan el antiguo campo de fútbol, que se inundaba con las riadas, un llaut de unos 30 metros de eslora y una turbina de la central hidroeléctrica de 420 toneladas."},{"h":"Para entenderlo","t":"Jesús Moncada nació en Mequinenza y escribió en catalán. En Camí de sirga contó la vida y el final de su pueblo, y la novela obtuvo el Premio Nacional de Literatura en 1988. Por eso pasear por estas calles es también pasear por sus libros.\n\nLos dos objetos del final resumen la historia: el llaut, que podía cargar unas 30 toneladas de carbón, representa el oficio que vivía del río; la turbina, de la central terminada en 1966, la obra que acabó con el pueblo. Cada abril, por Sant Jordi, el Pueblo Viejo se llena de vecinos con una misa al aire libre y rutas teatralizadas."}],"en":[{"h":"History","t":"Old Mequinenza lived beside the Ebro, at the foot of the castle and close to the confluence with the Segre. Its people were boatmen who carried coal downriver in llaguts, hauled from the bank along the towpath, and miners from the nearby mines.\n\nThe Mequinenza and Ribarroja reservoirs changed everything. In the 1960s most of the town was demolished and its residents moved to the new settlement beside the Segre. Only the María Quintana school building, opened in 1929, was left standing, and today it houses the museums."},{"h":"What to see","t":"The route takes in the Muro (Wall), which protected the town from floods and served as a quay for the llaguts; the house where Jesús Moncada was born, with a short text hung on the door addressed to whoever was going to demolish it; the Cine Goya, the «cine de dalt» (upper cinema); the Plaza de Armas; Calle de las Brujas (Witches' Street), so narrow that two people cannot pass each other; and Calle de las Piedras (Street of Stones), with its cobbles.\n\nYou can make out the foundations of the church of La Asunción, from 1803, where the altar of Santa Agatoclia, the town's patron saint, stood. At the end you will find the old football pitch, which flooded whenever the river rose, a llaut about 30 metres long and a 420-tonne turbine from the hydroelectric power station."},{"h":"Background","t":"Jesús Moncada was born in Mequinenza and wrote in Catalan. In Camí de sirga (The Towpath) he told the story of the life and end of his town, and the novel won the Premio Nacional de Literatura (National Literature Prize) in 1988. Walking these streets is therefore also walking through his books.\n\nThe two objects at the end sum up the story: the llaut, which could carry about 30 tonnes of coal, represents the trade that lived off the river; the turbine, from the power station completed in 1966, the project that put an end to the town. Every April, for Sant Jordi, the Pueblo Viejo fills with local people for an open-air mass and dramatised tours."}],"fr":[{"h":"Histoire","t":"Le vieux Mequinenza vivait au bord de l'Èbre, au pied du château et près de la confluence avec le Segre. Ses habitants étaient des bateliers qui transportaient le charbon vers l'aval à bord de llaguts, halés depuis la rive par le chemin de halage, et des mineurs des mines voisines.\n\nLes barrages de Mequinenza et de Ribarroja ont tout changé. Dans les années soixante, la plus grande partie du village fut démolie et ses habitants furent relogés dans le nouveau bourg, au bord du Segre. Seul resta debout le groupe scolaire María Quintana, inauguré en 1929, qui abrite aujourd'hui les musées."},{"h":"À voir","t":"Le parcours passe par le Muro, qui protégeait la ville des crues et servait de quai aux llaguts ; la maison natale de Jesús Moncada, avec un petit texte accroché à la porte, adressé à celui qui viendrait la démolir ; le Cine Goya, le « cine de dalt » (cinéma d'en haut) ; la plaza de Armas ; la calle de las Brujas (rue des Sorcières), si étroite que deux personnes ne peuvent s'y croiser ; et la calle de las Piedras (rue des Pierres), avec son pavage.\n\nOn reconnaît les fondations de l'église de l'Asunción, de 1803, où se trouvait l'autel de Santa Agatoclia, patronne du village. À la fin vous attendent l'ancien terrain de football, inondé lors des crues, un llaut d'environ 30 mètres de long et une turbine de la centrale hydroélectrique de 420 tonnes."},{"h":"Pour comprendre","t":"Jesús Moncada est né à Mequinenza et écrivait en catalan. Dans Camí de sirga (Le Chemin de halage), il a raconté la vie et la fin de son village, et le roman a reçu le Prix national de littérature en 1988. Se promener dans ces rues, c'est donc aussi se promener dans ses livres.\n\nLes deux objets de la fin résument l'histoire : le llaut, qui pouvait transporter environ 30 tonnes de charbon, représente le métier qui vivait de la rivière ; la turbine, de la centrale achevée en 1966, l'ouvrage qui a mis fin au village. Chaque mois d'avril, à la Sant Jordi, le Pueblo Viejo se remplit d'habitants, avec une messe en plein air et des visites théâtralisées."}],"de":[{"h":"Geschichte","t":"Das alte Mequinenza lag am Ebro, zu Füßen der Burg und nahe dem Zusammenfluss mit dem Segre. Seine Bewohner waren Flussschiffer, die die Kohle in Llaguts flussabwärts brachten, vom Ufer aus auf dem Treidelpfad gezogen, und Bergleute aus den nahen Minen.\n\nDie Stauseen von Mequinenza und Ribarroja veränderten alles. In den 1960er-Jahren wurde der größte Teil des Dorfes abgerissen, und die Bewohner zogen in den neuen Ort am Segre. Stehen blieb nur das 1929 eröffnete Schulgebäude María Quintana, in dem heute die Museen untergebracht sind."},{"h":"Sehenswert","t":"Die Route führt am Muro vorbei, der Mauer, die den Ort vor Hochwasser schützte und den Llaguts als Kai diente; am Geburtshaus von Jesús Moncada mit einem kleinen Text an der Tür, gerichtet an den, der es abreißen würde; am Cine Goya, dem „cine de dalt“ (oberen Kino); an der Plaza de Armas; an der Calle de las Brujas (Hexengasse), so eng, dass zwei Personen nicht aneinander vorbeikommen; und an der Calle de las Piedras mit ihrem Pflaster.\n\nMan erkennt die Fundamente der Kirche de la Asunción von 1803, in der der Altar der Santa Agatoclia stand, der Schutzheiligen des Dorfes. Am Ende warten der alte Fußballplatz, der bei Hochwasser überflutet wurde, ein Llaut von etwa 30 Metern Länge und eine 420 Tonnen schwere Turbine des Wasserkraftwerks."},{"h":"Zum Verständnis","t":"Jesús Moncada wurde in Mequinenza geboren und schrieb auf Katalanisch. In Camí de sirga (Der Treidelpfad) erzählte er vom Leben und Ende seines Dorfes; der Roman erhielt 1988 den spanischen Nationalpreis für Literatur. Wer durch diese Gassen geht, spaziert deshalb auch durch seine Bücher.\n\nDie beiden Objekte am Ende fassen die Geschichte zusammen: Der Llaut, der etwa 30 Tonnen Kohle laden konnte, steht für das Handwerk, das vom Fluss lebte; die Turbine aus dem 1966 fertiggestellten Kraftwerk für das Bauwerk, das das Dorf auslöschte. Jedes Jahr im April, zu Sant Jordi, füllt sich das Pueblo Viejo mit Einheimischen, mit einer Messe unter freiem Himmel und szenischen Führungen."}],"pt":[{"h":"História","t":"A velha Mequinenza vivia junto ao Ebro, aos pés do castelo e perto da confluência com o Segre. Os seus habitantes eram barqueiros que levavam o carvão rio abaixo em llaguts, puxados a partir da margem pelo caminho de sirga, e mineiros das minas próximas.\n\nAs albufeiras de Mequinenza e Ribarroja mudaram tudo. Nos anos sessenta a maior parte da povoação foi demolida e os seus habitantes mudaram-se para o novo núcleo, junto ao Segre. Só ficou de pé o grupo escolar María Quintana, inaugurado em 1929, que hoje alberga os museus."},{"h":"O que ver","t":"O percurso passa pelo Muro, que protegia a vila das cheias e servia de cais para os llaguts; pela casa natal de Jesús Moncada, com um pequeno texto pendurado na porta dirigido a quem a fosse demolir; pelo Cine Goya, o «cine de dalt» (cinema de cima); pela plaza de Armas; pela calle de las Brujas, tão estreita que duas pessoas não se cruzam; e pela calle de las Piedras, com o seu empedrado.\n\nReconhecem-se os alicerces da igreja da Asunción, de 1803, onde estava o altar de Santa Agatoclia, padroeira da povoação. No fim esperam o antigo campo de futebol, que inundava com as cheias, um llaut de cerca de 30 metros de comprimento e uma turbina da central hidroelétrica com 420 toneladas."},{"h":"Para compreender","t":"Jesús Moncada nasceu em Mequinenza e escreveu em catalão. Em Camí de sirga contou a vida e o fim da sua terra, e o romance obteve o Prémio Nacional de Literatura em 1988. Por isso passear por estas ruas é também passear pelos seus livros.\n\nOs dois objetos do fim resumem a história: o llaut, que podia carregar cerca de 30 toneladas de carvão, representa o ofício que vivia do rio; a turbina, da central concluída em 1966, a obra que acabou com a povoação. Todos os anos em abril, pelo Sant Jordi, o Pueblo Viejo enche-se de habitantes com uma missa ao ar livre e percursos teatralizados."}]},"status":"pending"},{"id":"museo-mina-mequinenza","town":"Mequinenza","cat":"museo","lat":41.36153,"lon":0.29333,"coord_src":null,"q":["Museo de la Mina, Mequinenza","Museos de Mequinenza"],"fq":["Museo de la Mina Mequinenza","Museos de Mequinenza","Mequinenza mine museum"],"name":{"es":"Museo de la Mina y Museos de Mequinenza","en":"Museo de la Mina (Mine Museum) and Museos de Mequinenza","fr":"Museo de la Mina et Museos de Mequinenza","de":"Museo de la Mina und Museos de Mequinenza","pt":"Museo de la Mina e Museos de Mequinenza"},"when":{"es":"Más de siglo y medio de minería · Museo","en":"Over a century and a half of mining · Museum","fr":"Plus d'un siècle et demi de mines · Musée","de":"Über 150 Jahre Bergbau · Museum","pt":"Mais de século e meio de mineração · Museu"},"desc":{"es":"Más de un kilómetro de galerías subterráneas para entender cómo se sacaba el carbón en Mequinenza. En el mismo edificio están el Museo de la Historia y el del Pasado Prehistórico, con recreaciones del arte rupestre de la zona.","en":"More than a kilometre of underground galleries showing how coal was extracted in Mequinenza. The same building houses the History Museum and the Prehistoric Past Museum, with reconstructions of the area's rock art.","fr":"Plus d'un kilomètre de galeries souterraines pour comprendre comment on extrayait le charbon à Mequinenza. Le même bâtiment abrite le Museo de la Historia et le Museo del Pasado Prehistórico, avec des reconstitutions de l'art rupestre de la région.","de":"Mehr als ein Kilometer unterirdischer Stollen, die zeigen, wie in Mequinenza Kohle abgebaut wurde. Im selben Gebäude befinden sich das Museo de la Historia und das Museo del Pasado Prehistórico mit Nachbildungen der Felskunst der Gegend.","pt":"Mais de um quilómetro de galerias subterrâneas para perceber como se extraía o carvão em Mequinenza. No mesmo edifício ficam o Museo de la Historia e o Museo del Pasado Prehistórico, com recriações da arte rupestre da zona."},"visit":{"es":"Están en la avenida María Quintana, en el Pueblo Viejo. La mina se recorre en visita guiada, con casco. Los horarios cambian según la temporada: confírmalos en la web de los Museos de Mequinenza o en la oficina de turismo. Calcula al menos dos horas para los tres museos.","en":"They are on Avenida María Quintana, in the Pueblo Viejo. The mine is visited on a guided tour, wearing a helmet. Opening times vary with the season: check them on the Museos de Mequinenza website or at the tourist office. Allow at least two hours for all three museums.","fr":"Ils se trouvent avenida María Quintana, dans le Pueblo Viejo. La mine se parcourt en visite guidée, casque sur la tête. Les horaires varient selon la saison : vérifiez-les sur le site des Museos de Mequinenza ou à l'office de tourisme. Comptez au moins deux heures pour les trois musées.","de":"Die Museen liegen an der Avenida María Quintana im Pueblo Viejo. Das Bergwerk wird bei einer Führung mit Helm besichtigt. Die Öffnungszeiten ändern sich je nach Saison: Erkundigen Sie sich auf der Website der Museos de Mequinenza oder im Tourismusbüro. Planen Sie für alle drei Museen mindestens zwei Stunden ein.","pt":"Ficam na avenida María Quintana, no Pueblo Viejo. A mina percorre-se em visita guiada, com capacete. Os horários mudam conforme a época: confirme-os no site dos Museos de Mequinenza ou no posto de turismo. Conte com pelo menos duas horas para os três museus."},"src":"https://www.museosdemequinenza.com/wp-content/uploads/2018/05/Museos-de-Mequinenza-web.pdf","sources":["https://www.museosdemequinenza.com/wp-content/uploads/2018/05/Museos-de-Mequinenza-web.pdf","https://www.erih.net/i-want-to-go-there/site/mequinenza-mine-museum","https://es.hispanopedia.com/wiki/Mequinenza","https://www.bajocinca.es/qu%C3%A9-ver/-/asset_publisher/9zjA4GXYS339/content/id/5490366"],"art":{"es":[{"h":"Historia","t":"El carbón marcó la vida de Mequinenza durante más de siglo y medio. La Carbonífera del Ebro se fundó en 1880; el lignito se sacaba de galerías bajo el término y se embarcaba en el Ebro hacia Fayón. La última mina de la zona cerró en 2014.\n\nEl museo ocupa el antiguo grupo esco
