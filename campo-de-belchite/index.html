l é um edifício barroco com uma torre mudéjar do século XVI, embora o culto no cerro seja mais antigo: a revista La Magia de Viajar situa as suas origens no século XIII. Nuestra Señora del Pueyo é a padroeira de Belchite.\n\nO cerro foi palco de várias guerras: em 1809, durante a Guerra Peninsular, houve combates aqui, e em 1937 abriram-se trincheiras."},{"h":"Curiosidades","t":"O cerro ocupa cerca de 1,5 hectares e esconde um sítio arqueológico com restos celtibéricos e romanos, incluindo cerâmicas de oficinas conhecidas do Império. O povoado cresceu no século I, depois da fundação de Caesar Augusta, e pode ter chegado a ter cerca de mil habitantes. É possível que o santuário tenha sido erguido onde ficava a praça principal do povoado. Foi dado a conhecer nos anos noventa por Miguel Beltrán Lloris e José María Viladés; foi escavado pela primeira vez em 2010 e de forma intensiva entre 2012 e 2015.\n\nTodos os anos a romaria sai em procissão da igreja de Belchite, a cerca de 4 km, e, depois da missa, come-se no santuário ou no pinhal ao lado."}]},"status":"pending"},{"id":"granja-escuela","town":"Belchite","cat":"museo","lat":41.30524,"lon":-0.75094,"coord_src":null,"q":["Museo Etnológico de Belchite","Centro de Interpretación de las Estepas del Valle del Ebro, Belchite"],"fq":["Belchite museo etnologico","Centro de Interpretación de las Estepas Belchite"],"name":{"es":"Museo Etnológico y Centro de las Estepas","en":"Ethnological Museum and Steppe Centre","fr":"Musée ethnologique et Centre des steppes","de":"Ethnologisches Museum und Steppenzentrum","pt":"Museu Etnológico e Centro das Estepes"},"when":{"es":"Granja Escuela · Vida rural y estepa","en":"Granja Escuela · Rural life and steppe","fr":"Granja Escuela · Vie rurale et steppe","de":"Granja Escuela · Landleben und Steppe","pt":"Granja Escuela · Vida rural e estepe"},"desc":{"es":"Dos espacios en la antigua Granja Escuela del pueblo nuevo: uno sobre cómo se trabajaba el campo hasta bien entrado el siglo XX y otro sobre la estepa del valle del Ebro y sus aves.","en":"Two spaces in the former farm school of the new town: one about how the land was worked until well into the 20th century, the other about the Ebro Valley steppe and its birds.","fr":"Deux espaces dans l'ancienne ferme-école du nouveau village : l'un sur le travail de la terre jusqu'en plein XXe siècle, l'autre sur la steppe de la vallée de l'Èbre et ses oiseaux.","de":"Zwei Ausstellungen in der ehemaligen Landwirtschaftsschule des neuen Dorfes: eine darüber, wie das Land bis weit ins 20. Jahrhundert bewirtschaftet wurde, die andere über die Steppe des Ebrotals und ihre Vögel.","pt":"Dois espaços na antiga quinta-escola da povoação nova: um sobre como se trabalhava o campo até bem dentro do século XX e outro sobre a estepe do vale do Ebro e as suas aves."},"visit":{"es":"Abre sobre todo en fin de semana; los grupos y los colegios pueden concertar visita guiada. Confirma horarios en la oficina de turismo. Es una buena parada antes de salir a El Planerón.","en":"Mainly open at weekends; groups and schools can arrange a guided visit. Check opening times with the tourist office. A good stop before heading out to El Planerón.","fr":"Ouvert surtout le week-end ; les groupes et les écoles peuvent réserver une visite guidée. Vérifiez les horaires à l'office de tourisme. Une bonne étape avant de partir vers El Planerón.","de":"Vor allem am Wochenende geöffnet; Gruppen und Schulen können eine Führung vereinbaren. Öffnungszeiten beim Fremdenverkehrsamt erfragen. Ein guter Halt vor dem Ausflug nach El Planerón.","pt":"Abre sobretudo ao fim de semana; grupos e escolas podem marcar visita guiada. Confirme horários no posto de turismo. É uma boa paragem antes de seguir para El Planerón."},"src":"https://turismocampodebelchite.es/eng/museo-etnologico/l.46","sources":["https://turismocampodebelchite.es/eng/museo-etnologico/l.46","https://turismocampodebelchite.es/eng/centro-de-interpretacion-de-las-estepas-del-valle-del-ebro-adolfo-aragues/l.40","https://turismocampodebelchite.es/files/Campo%20de%20Belchite%2006%20Memoria%20de%20la%20contienda.pdf","https://turismocampodebelchite.es/campo-de-belchite-08-paisaje-singular/p.164"],"art":{"es":[{"h":"Historia","t":"La Granja Escuela se construyó al norte del pueblo nuevo y perteneció a la Sección Femenina. Hoy el edificio, en la Ronda Zaragoza, la misma calle de la oficina de turismo, reúne dos espacios de visita.\n\nEl Centro de Interpretación de las Estepas del Valle del Ebro 'Adolfo Aragües' se creó para complementar la Reserva Ornitológica de El Planerón y organiza visitas guiadas para escolares."},{"h":"Qué ver","t":"El Museo Etnológico tiene tres salas dedicadas a la siega, la trilla y las fibras vegetales, con herramientas y aperos usados en la zona hasta el siglo XX. Una cuarta sala guarda los gigantes y cabezudos de Belchite, las figuras que salen a la calle en las fiestas. Es una buena forma de entender el paisaje que rodea el pueblo: campos de cereal y olivares, con algunos árboles de más de 500 años.\n\nEl Centro de las Estepas explica, con maquetas, paneles interactivos y mapas, cómo es un paisaje que a primera vista parece vacío y las aves que viven en él, como la alondra de Dupont o las gangas."}],"en":[{"h":"History","t":"The Granja Escuela (farm school) was built to the north of the new town and belonged to the Sección Femenina. Today the building, on Ronda Zaragoza, the same street as the tourist office, houses two visitor spaces.\n\nThe 'Adolfo Aragües' Interpretation Centre of the Ebro Valley Steppes was created to complement the El Planerón Bird Reserve and runs guided visits for schools."},{"h":"What to see","t":"The Ethnological Museum has three rooms devoted to reaping, threshing and plant fibres, with tools and implements used in the area until the 20th century. A fourth room holds Belchite's gigantes y cabezudos, the giant and big-headed figures that parade through the streets at festival time. It is a good way to understand the landscape around the town: cereal fields and olive groves, with some trees more than 500 years old.\n\nThe Steppe Centre uses models, interactive panels and maps to explain a landscape that looks empty at first sight and the birds that live in it, such as Dupont's lark and the sandgrouse."}],"fr":[{"h":"Histoire","t":"La Granja Escuela (ferme-école) fut construite au nord du nouveau village et appartenait à la Sección Femenina. Aujourd'hui, le bâtiment, situé Ronda Zaragoza, la même rue que l'office de tourisme, réunit deux espaces de visite.\n\nLe Centre d'interprétation des steppes de la vallée de l'Èbre « Adolfo Aragües » a été créé pour compléter la Réserve ornithologique d'El Planerón et propose des visites guidées pour les scolaires."},{"h":"À voir","t":"Le Musée ethnologique compte trois salles consacrées à la moisson, au battage et aux fibres végétales, avec des outils et instruments utilisés dans la région jusqu'au XXe siècle. Une quatrième salle conserve les gigantes y cabezudos de Belchite, les géants et grosses têtes qui défilent dans les rues pendant les fêtes. C'est une bonne façon de comprendre le paysage qui entoure le village : champs de céréales et oliveraies, avec certains arbres de plus de 500 ans.\n\nLe Centre des steppes explique, à l'aide de maquettes, de panneaux interactifs et de cartes, un paysage qui semble vide au premier regard et les oiseaux qui y vivent, comme l'alouette de Dupont ou les gangas."}],"de":[{"h":"Geschichte","t":"Die Granja Escuela (Landwirtschaftsschule) wurde im Norden des neuen Dorfes errichtet und gehörte der Sección Femenina. Heute beherbergt das Gebäude an der Ronda Zaragoza, in derselben Straße wie das Fremdenverkehrsamt, zwei Ausstellungen.\n\nDas Informationszentrum der Steppen des Ebrotals 'Adolfo Aragües' entstand als Ergänzung zum Vogelschutzgebiet El Planerón und bietet Führungen für Schulklassen an."},{"h":"Sehenswert","t":"Das Ethnologische Museum hat drei Räume zu Ernte, Dreschen und Pflanzenfasern, mit Werkzeugen und Geräten, die in der Gegend bis ins 20. Jahrhundert verwendet wurden. Ein vierter Raum zeigt die gigantes y cabezudos von Belchite, die Riesen- und Großkopffiguren, die bei den Festen durch die Straßen ziehen. So versteht man die Landschaft rund um den Ort besser: Getreidefelder und Olivenhaine, manche Bäume über 500 Jahre alt.\n\nDas Steppenzentrum erklärt mit Modellen, interaktiven Tafeln und Karten eine Landschaft, die auf den ersten Blick leer wirkt, und die Vögel, die darin leben, etwa die Dupontlerche oder die Flughühner."}],"pt":[{"h":"História","t":"A Granja Escuela (quinta-escola) foi construída a norte da povoação nova e pertenceu à Sección Femenina. Hoje o edifício, na Ronda Zaragoza, a mesma rua do posto de turismo, reúne dois espaços de visita.\n\nO Centro de Interpretação das Estepes do Vale do Ebro 'Adolfo Aragües' foi criado para complementar a Reserva Ornitológica de El Planerón e organiza visitas guiadas para escolas."},{"h":"O que ver","t":"O Museu Etnológico tem três salas dedicadas à ceifa, à debulha e às fibras vegetais, com ferramentas e alfaias usadas na zona até ao século XX. Uma quarta sala guarda os gigantes y cabezudos de Belchite, as figuras de gigantes e cabeçudos que saem à rua nas festas. É uma boa forma de compreender a paisagem que rodeia a localidade: campos de cereal e olivais, com algumas árvores de mais de 500 anos.\n\nO Centro das Estepes explica, com maquetas, painéis interativos e mapas, uma paisagem que à primeira vista parece vazia e as aves que nela vivem, como a cotovia-de-dupont ou os cortiçóis."}]},"status":"pending"},{"id":"el-planeron","town":"Belchite","cat":"naturaleza","lat":41.38199,"lon":-0.61068,"coord_src":null,"q":["Reserva Ornitológica El Planerón","El Planerón, Belchite"],"fq":["El Planerón","Planerón Belchite estepa"],"name":{"es":"Reserva Ornitológica El Planerón","en":"El Planerón Bird Reserve","fr":"Réserve ornithologique d'El Planerón","de":"Vogelschutzgebiet El Planerón","pt":"Reserva Ornitológica de El Planerón"},"when":{"es":"Reserva desde 1992 · Estepa","en":"Reserve since 1992 · Steppe","fr":"Réserve depuis 1992 · Steppe","de":"Schutzgebiet seit 1992 · Steppe","pt":"Reserva desde 1992 · Estepe"},"desc":{"es":"Más de 700 hectáreas de estepa cerealista entre Codo y Belchite, gestionadas por SEO/BirdLife. Es un buen lugar para ver aves esteparias, sobre todo en primavera.","en":"More than 700 hectares of cereal steppe between Codo and Belchite, managed by SEO/BirdLife. A good place to see steppe birds, especially in spring.","fr":"Plus de 700 hectares de steppe céréalière entre Codo et Belchite, gérés par SEO/BirdLife. Un bon endroit pour observer les oiseaux des steppes, surtout au printemps.","de":"Mehr als 700 Hektar Getreidesteppe zwischen Codo und Belchite, betreut von SEO/BirdLife. Ein guter Ort, um Steppenvögel zu beobachten, vor allem im Frühling.","pt":"Mais de 700 hectares de estepe cerealífera entre Codo e Belchite, geridos pela SEO/BirdLife. Um bom lugar para observar aves estepárias, sobretudo na primavera."},"visit":{"es":"Acceso libre por un sendero autoguiado de algo más de 6 km que parte de la entrada de Codo (balsa, panel, aparcamiento y mirador). SEO/BirdLife organiza visitas guiadas con reserva previa. Mejor en primavera y al amanecer; en verano evita las horas de calor.","en":"Open access along a self-guided trail of just over 6 km that starts at the entrance to Codo (pond, information board, car park and viewpoint). SEO/BirdLife runs guided visits that must be booked in advance. Best in spring and at dawn; in summer avoid the hottest hours.","fr":"Accès libre par un sentier autoguidé d'un peu plus de 6 km qui part de l'entrée de Codo (bassin, panneau, parking et belvédère). SEO/BirdLife propose des visites guidées sur réservation. Idéal au printemps et à l'aube ; en été, évitez les heures chaudes.","de":"Frei zugänglich über einen selbstgeführten Pfad von gut 6 km, der am Ortseingang von Codo beginnt (Teich, Infotafel, Parkplatz und Aussichtspunkt). SEO/BirdLife bietet Führungen mit Voranmeldung an. Am besten im Frühling und bei Sonnenaufgang; im Sommer die heißesten Stunden meiden.","pt":"Acesso livre por um percurso autoguiado de pouco mais de 6 km que parte da entrada de Codo (charca, painel, estacionamento e miradouro). A SEO/BirdLife organiza visitas guiadas com reserva prévia. Melhor na primavera e ao amanhecer; no verão evite as horas de calor."},"src":"https://turismocampodebelchite.es/campo-de-belchite-08-paisaje-singular/p.164","sources":["https://turismocampodebelchite.es/campo-de-belchite-08-paisaje-singular/p.164","https://turismocampodebelchite.es/eng/belchite/l.205"],"art":{"es":[{"h":"El paisaje","t":"A primera vista El Planerón parece un llano sin nada: campos de cereal, matorral bajo y mucho cielo. Es justo lo que buscan las aves esteparias, que crían en el suelo y necesitan horizontes abiertos. La Sociedad Española de Ornitología (SEO/BirdLife) compró parte de estos terrenos en 1992 para crear la reserva.\n\nJunto con La Lomaza, otro refugio de fauna esteparia del término de Belchite, protege una parte de la estepa del valle del Ebro."},{"h":"Qué ver","t":"Las especies más buscadas son la alondra de Dupont, la terrera marismeña, la ganga ibérica y la ganga ortega. Al amanecer es cuando más fácil resulta ver bandos de aves acudiendo a beber. En invierno también merece la pena, bien abrigado. Lleva prismáticos y camina despacio: aquí se ve más esperando que andando. No salgas de los caminos para no molestar a las aves.\n\nAdemás del sendero desde Codo, una pista de unos nueve kilómetros une Codo y Belchite y se puede hacer a pie, en bicicleta o en coche. Las visitas guiadas de SEO/BirdLife se reservan por correo electrónico."}],"en":[{"h":"The landscape","t":"At first sight El Planerón looks like an empty plain: cereal fields, low scrub and a lot of sky. That is exactly what steppe birds need, as they nest on the ground and need open horizons. The Spanish Ornithological Society (SEO/BirdLife) bought part of this land in 1992 to create the reserve.\n\nTogether with La Lomaza, another refuge for steppe wildlife in the municipality of Belchite, it protects part of the Ebro Valley steppe."},{"h":"What to see","t":"The most sought-after species are Dupont's lark, the lesser short-toed lark, the pin-tailed sandgrouse and the black-bellied sandgrouse. Dawn is the easiest time to see flocks of birds coming to drink. It is also worth a visit in winter if you wrap up warm. Bring binoculars and walk slowly: here you see more by waiting than by walking. Stay on the paths so as not to disturb the birds.\n\nAs well as the trail from Codo, a track of about nine kilometres links Codo and Belchite and can be done on foot, by bike or by car. SEO/BirdLife's guided visits are booked by email."}],"fr":[{"h":"Le paysage","t":"Au premier regard, El Planerón ressemble à une plaine vide : champs de céréales, broussailles basses et beaucoup de ciel. C'est précisément ce que recherchent les oiseaux des steppes, qui nichent au sol et ont besoin d'horizons dégagés. La Société espagnole d'ornithologie (SEO/BirdLife) a acheté une partie de ces terres en 1992 pour créer la réserve.\n\nAvec La Lomaza, autre refuge de la faune des steppes sur la commune de Belchite, elle protège une partie de la steppe de la vallée de l'Èbre."},{"h":"À voir","t":"Les espèces les plus recherchées sont l'alouette de Dupont, l'alouette pispolette, le ganga cata et le ganga unibande. C'est à l'aube qu'on voit le plus facilement des groupes d'oiseaux venir boire. L'hiver vaut aussi le détour, bien couvert. Prenez des jumelles et marchez lentement : ici, on voit davantage en attendant qu'en marchant. Restez sur les chemins pour ne pas déranger les oiseaux.\n\nOutre le sentier depuis Codo, une piste d'environ neuf kilomètres relie Codo à Belchite et se parcourt à pied, à vélo ou en voiture. Les visites guidées de SEO/BirdLife se réservent par courriel."}],"de":[{"h":"Die Landschaft","t":"Auf den ersten Blick wirkt El Planerón wie eine leere Ebene: Getreidefelder, niedriges Gestrüpp und viel Himmel. Genau das brauchen Steppenvögel, die am Boden brüten und weite Horizonte benötigen. Die Spanische Ornithologische Gesellschaft (SEO/BirdLife) kaufte 1992 einen Teil dieses Landes, um das Schutzgebiet einzurichten.\n\nZusammen mit La Lomaza, einem weiteren Rückzugsgebiet für Steppentiere in der Gemeinde Belchite, schützt es einen Teil der Steppe des Ebrotals."},{"h":"Sehenswert","t":"Die gesuchtesten Arten sind Dupontlerche, Stummellerche, Spießflughuhn und Sandflughuhn. Bei Sonnenaufgang sieht man am leichtesten Vogeltrupps, die zum Trinken kommen. Auch im Winter lohnt sich ein Besuch, warm angezogen. Nehmen Sie ein Fernglas mit und gehen Sie langsam: Hier sieht man mehr durch Warten als durch Gehen. Bleiben Sie auf den Wegen, um die Vögel nicht zu stören.\n\nNeben dem Pfad ab Codo verbindet eine etwa neun Kilometer lange Piste Codo und Belchite; sie ist zu Fuß, mit dem Fahrrad oder mit dem Auto befahrbar. Führungen von SEO/BirdLife werden per E-Mail gebucht."}],"pt":[{"h":"A paisagem","t":"À primeira vista, El Planerón parece uma planície vazia: campos de cereal, mato baixo e muito céu. É exatamente o que procuram as aves estepárias, que nidificam no chão e precisam de horizontes abertos. A Sociedade Espanhola de Ornitologia (SEO/BirdLife) comprou parte destes terrenos em 1992 para criar a reserva.\n\nJuntamente com La Lomaza, outro refúgio de fauna estepária no concelho de Belchite, protege uma parte da estepe do vale do Ebro."},{"h":"O que ver","t":"As espécies mais procuradas são a cotovia-de-dupont, a calhandrinha-das-marismas, o cortiçol-de-barriga-branca e o cortiçol-de-barriga-preta. Ao amanhecer é mais fácil ver bandos de aves a chegar para beber. No inverno também vale a pena, bem agasalhado. Leve binóculos e caminhe devagar: aqui vê-se mais a esperar do que a andar. Não saia dos caminhos, para não incomodar as aves.\n\nAlém do percurso a partir de Codo, um caminho de terra de cerca de nove quilómetros liga Codo a Belchite e pode fazer-se a pé, de bicicleta ou de carro. As visitas guiadas da SEO/BirdLife reservam-se por correio eletrónico."}]},"status":"pending"},{"id":"casa-natal-goya","town":"Fuendetodos","cat":"museo","lat":41.34268,"lon":-0.95857,"coord_src":null,"q":["Casa Natal de Goya, Fuendetodos","Calle Zuloaga, Fuendetodos"],"fq":["Category:Casa natal de Goya","Casa natal de Goya Fuendetodos"],"name":{"es":"Casa Natal de Goya","en":"Goya's Birthplace","fr":"Maison natale de Goya","de":"Geburtshaus von Goya","pt":"Casa Natal de Goya"},"when":{"es":"Siglo XVIII · Goya nació aquí en 1746","en":"18th century · Goya was born here in 1746","fr":"XVIIIe siècle · Goya y est né en 1746","de":"18. Jahrhundert · Goya wurde hier 1746 geboren","pt":"Século XVIII · Goya nasceu aqui em 1746"},"desc":{"es":"La casa rural donde nació Francisco de Goya el 30 de marzo de 1746. Conserva el aspecto de una vivienda rural aragonesa de su época.","en":"The village house where Francisco de Goya was born on 30 March 1746. It keeps the look of a rural Aragonese home of the period.","fr":"La maison villageoise où naquit Francisco de Goya le 30 mars 1746. Elle garde l'aspect d'une demeure rurale aragonaise de l'époque.","de":"Das Dorfhaus, in dem Francisco de Goya am 30. März 1746 geboren wurde. Es bewahrt das Aussehen eines aragonesischen Bauernhauses seiner Zeit.","pt":"A casa de aldeia onde nasceu Francisco de Goya, a 30 de março de 1746. Conserva o aspeto de uma habitação rural aragonesa da época."},"visit":{"es":"Se visita por dentro, con entrada. Confirma horarios y días de cierre en la Fundación Fuendetodos Goya o en la oficina de turismo. El Museo del Grabado está a pocos metros.","en":"The interior can be visited with a ticket. Check opening times and closing days with the Fundación Fuendetodos Goya or the tourist office. The Engraving Museum is a few metres away.","fr":"L'intérieur se visite avec un billet. Vérifiez les horaires et jours de fermeture auprès de la Fundación Fuendetodos Goya ou de l'office de tourisme. Le Musée de la gravure est à quelques mètres.","de":"Innenbesichtigung mit Eintrittskarte. Öffnungszeiten und Ruhetage bei der Fundación Fuendetodos Goya oder beim Fremdenverkehrsamt erfragen. Das Radierungsmuseum liegt wenige Meter entfernt.","pt":"Visita-se o interior, com bilhete. Confirme horários e dias de encerramento na Fundación Fuendetodos Goya ou no posto de turismo. O Museu da Gravura fica a poucos metros."},"src":"https://turismocampodebelchite.es/eng/casa-natal-de-goya/l.39","sources":["https://turismocampodebelchite.es/eng/casa-natal-de-goya/l.39","https://es.wikipedia.org/wiki/Casa_natal_de_Goya","https://en.wikipedia.org/wiki/Fuendetodos"],"art":{"es":[{"h":"Historia","t":"La casa se construyó a principios del siglo XVIII y pertenecía a Miguel Lucientes, tío de Gracia Lucientes, la madre del pintor. Aquí nació Francisco de Goya en 1746, mientras su padre, el dorador José Goya, trabajaba en el retablo de la parroquia. La familia volvió después a Zaragoza.\n\nEn 1913 el pintor Ignacio Zuloaga y un grupo de artistas zaragozanos identificaron la casa y Zuloaga la compró. En 1928, con motivo del centenario de la muerte del pintor, se compró la casa vecina para alojar a una familia que cuidaba la vivienda y enseñaba la visita. Dañada durante la Guerra Civil, se reconstruyó en 1946. En 1982 se declaró monumento histórico y, tras una nueva restauración, reabrió en 1985."},{"h":"Qué ver","t":"Es una casa sencilla, y eso es lo interesante. En la planta baja están el zaguán, las cuadras y la cocina; una escalera de piedra sube a la sala y a dos alcobas, y arriba queda el granero bajo el tejado inclinado.\n\nEl mobiliario, los utensilios y los documentos gráficos ayudan a imaginar cómo era la vida en Fuendetodos en el siglo XVIII. En la iglesia parroquial de la Asunción, reconstruida después de la guerra, se conserva la pila donde fue bautizado Goya."}],"en":[{"h":"History","t":"The house was built in the early 18th century and belonged to Miguel Lucientes, uncle of Gracia Lucientes, the painter's mother. Francisco de Goya was born here in 1746, while his father, the gilder José Goya, was working on the altarpiece of the parish church. The family later went back to Zaragoza.\n\nIn 1913 the painter Ignacio Zuloaga and a group of Zaragoza artists identified the house, and Zuloaga bought it. In 1928, for the centenary of the painter's death, the house next door was bought to provide a home for a family who looked after the birthplace and showed visitors round. Damaged during the Civil War, it was rebuilt in 1946. In 1982 it was declared a historic monument and, after a new restoration, it reopened in 1985."},{"h":"What to see","t":"It is a simple house, and that is what makes it interesting. On the ground floor are the entrance hall, the stables and the kitchen; a stone staircase leads up to the living room and two bedrooms, and at the top is the granary under the sloping roof.\n\nThe furniture, utensils and pictures help you imagine what life was like in Fuendetodos in the 18th century. The parish church of the Asunción, rebuilt after the war, keeps the font in which Goya was baptised."}],"fr":[{"h":"Histoire","t":"La maison fut construite au début du XVIIIe siècle et appartenait à Miguel Lucientes, oncle de Gracia Lucientes, la mère du peintre. Francisco de Goya y naquit en 1746, alors que son père, le doreur José Goya, travaillait au retable de l'église paroissiale. La famille retourna ensuite à Saragosse.\n\nEn 1913, le peintre Ignacio Zuloaga et un groupe d'artistes de Saragosse identifièrent la maison, et Zuloaga l'acheta. En 1928, pour le centenaire de la mort du peintre, on acheta la maison voisine afin d'y loger une famille qui entretenait la demeure et la faisait visiter. Endommagée pendant la guerre civile, elle fut reconstruite en 1946. En 1982, elle fut déclarée monument historique et, après une nouvelle restauration, rouvrit en 1985."},{"h":"À voir","t":"C'est une maison simple, et c'est ce qui la rend intéressante. Au rez-de-chaussée se trouvent le vestibule, les écuries et la cuisine ; un escalier de pierre mène à la salle et à deux alcôves, et tout en haut se trouve le grenier sous le toit en pente.\n\nLe mobilier, les ustensiles et les documents graphiques aident à imaginer la vie à Fuendetodos au XVIIIe siècle. L'église paroissiale de l'Asunción, reconstruite après la guerre, conserve les fonts baptismaux où Goya fut baptisé."}],"de":[{"h":"Geschichte","t":"Das Haus wurde Anfang des 18. Jahrhunderts gebaut und gehörte Miguel Lucientes, einem Onkel von Gracia Lucientes, der Mutter des Malers. Hier wurde Francisco de Goya 1746 geboren, während sein Vater, der Vergolder José Goya, am Altar der Pfarrkirche arbeitete. Später kehrte die Familie nach Saragossa zurück.\n\n1913 identifizierten der Maler Ignacio Zuloaga und eine Gruppe von Künstlern aus Saragossa das Haus, und Zuloaga kaufte es. 1928, zum hundertsten Todestag des Malers, wurde das Nachbarhaus erworben, um dort eine Familie unterzubringen, die das Geburtshaus pflegte und Besucher führte. Im Bürgerkrieg beschädigt, wurde es 1946 wieder aufgebaut. 1982 wurde es zum historischen Denkmal erklärt und nach einer erneuten Restaurierung 1985 wiedereröffnet."},{"h":"Sehenswert","t":"Es ist ein einfaches Haus, und gerade das macht es interessant. Im Erdgeschoss liegen Eingangsflur, Ställe und Küche; eine Steintreppe führt hinauf zur Stube und zu zwei Schlafkammern, und ganz oben liegt der Getreidespeicher unter dem schrägen Dach.\n\nMöbel, Gerätschaften und Bilddokumente helfen, sich das Leben in Fuendetodos im 18. Jahrhundert vorzustellen. In der nach dem Krieg wieder aufgebauten Pfarrkirche de la Asunción ist das Taufbecken erhalten, in dem Goya getauft wurde."}],"pt":[{"h":"História","t":"A casa foi construída no início do século XVIII e pertencia a Miguel Lucientes, tio de Gracia Lucientes, a mãe do pintor. Aqui nasceu Francisco de Goya em 1746, enquanto o pai, o dourador José Goya, trabalhava no retábulo da igreja paroquial. Mais tarde, a família regressou a Saragoça.\n\nEm 1913, o pintor Ignacio Zuloaga e um grupo de artistas de Saragoça identificaram a casa e Zuloaga comprou-a. Em 1928, no centenário da morte do pintor, comprou-se a casa vizinha para alojar uma família que cuidava da habitação e mostrava a visita. Danificada durante a Guerra Civil, foi reconstruída em 1946. Em 1982 foi declarada monumento histórico e, após um novo restauro, reabriu em 1985."},{"h":"O que ver","t":"É uma casa simples, e é isso que a torna interessante. No rés-do-chão ficam o vestíbulo, as cavalariças e a cozinha; uma escada de pedra sobe para a sala e para duas alcovas, e lá em cima fica o celeiro sob o telhado inclinado.\n\nO mobiliário, os utensílios e os documentos gráficos ajudam a imaginar como era a vida em Fuendetodos no século XVIII. Na igreja paroquial da Asunción, reconstruída depois da guerra, conserva-se a pia onde Goya foi batizado."}]},"status":"pending"},{"id":"museo-grabado","town":"Fuendetodos","cat":"museo","lat":41.3431,"lon":-0.9579,"coord_src":null,"q":["Museo del Grabado de Goya, Fuendetodos"],"fq":["Museo del Grabado de Goya Fuendetodos","Fuendetodos museo grabado"],"name":{"es":"Museo del Grabado de Goya","en":"Goya Engraving Museum","fr":"Musée de la gravure de Goya","de":"Goya-Radierungsmuseum","pt":"Museu da Gravura de Goya"},"when":{"es":"Abierto en 1989 · Las cuatro series de Goya","en":"Opened in 1989 · Goya's four print series","fr":"Ouvert en 1989 · Les quatre séries de Goya","de":"Eröffnet 1989 · Goyas vier Grafikzyklen","pt":"Aberto em 1989 · As quatro séries de Goya"},"desc":{"es":"Un museo dedicado a la obra gráfica de Goya, a pocos metros de su casa natal. Reúne estampas de sus cuatro grandes series: Caprichos, Desastres de la guerra, Tauromaquia y Disparates.","en":"A museum devoted to Goya's prints, a few metres from his birthplace. It brings together prints from his four great series: the Caprichos, the Disasters of War, the Tauromaquia and the Disparates.","fr":"Un musée consacré à l'œuvre gravé de Goya, à quelques mètres de sa maison natale. Il réunit des estampes de ses quatre grandes séries : les Caprices, les Désastres de la guerre, la Tauromachie et les Disparates.","de":"Ein Museum für Goyas Druckgrafik, wenige Meter von seinem Geburtshaus entfernt. Es zeigt Blätter aus seinen vier großen Zyklen: Caprichos, Schrecken des Krieges, Tauromaquia und Disparates.","pt":"Um museu dedicado à obra gráfica de Goya, a poucos metros da sua casa natal. Reúne estampas das suas quatro grandes séries: Caprichos, Desastres da Guerra, Tauromaquia e Disparates."},"visit":{"es":"Se visita con entrada; la sala de la planta baja acoge exposiciones temporales. Confirma horarios y si hay entrada conjunta con la Casa Natal en la oficina de turismo o en la Fundación Fuendetodos Goya.","en":"Admission by ticket; the ground-floor room hosts temporary exhibitions. Check opening times, and whether there is a joint ticket with the Birthplace, at the tourist office or with the Fundación Fuendetodos Goya.","fr":"Entrée payante ; la salle du rez-de-chaussée accueille des expositions temporaires. Vérifiez les horaires, et l'existence d'un billet couplé avec la maison natale, à l'office de tourisme ou auprès de la Fundación Fuendetodos Goya.","de":"Besichtigung mit Eintrittskarte; im Raum im Erdgeschoss finden Wechselausstellungen statt. Öffnungszeiten und ein mögliches Kombiticket mit dem Geburtshaus beim Fremdenverkehrsamt oder bei der Fundación Fuendetodos Goya erfragen.","pt":"Visita com bilhete; a sala do rés-do-chão acolhe exposições temporárias. Confirme horários, e se existe bilhete conjunto com a Casa Natal, no posto de turismo ou na Fundación Fuendetodos Goya."},"src":"https://en.wikipedia.org/wiki/Museo_del_Grabado_de_Goya","sources":["https://en.wikipedia.org/wiki/Museo_del_Grabado_de_Goya","https://turismocampodebelchite.es/eng/museo-del-grabado/l.47","https://es.wikipedia.org/wiki/Fuendetodos","https://turismocampodebelchite.es/eng/patrimonio-cultural/p.123"],"art":{"es":[{"h":"Historia","t":"El museo abrió en 1989 en una casa de piedra de tres plantas, típica de la zona, adaptada para exposición. La Diputación Provincial de Zaragoza y el Ayuntamiento de Fuendetodos financiaron su rehabilitación. La colección ha crecido con donaciones de artistas y con compras en subastas.\n\nFuendetodos cuenta además con un taller de grabado y una programación de exposiciones que mantienen el vínculo del pueblo con el arte gráfico."},{"h":"Qué ver","t":"La planta baja tiene la recepción, la tienda y una sala de exposiciones temporales. En la primera planta se exponen 22 estampas de los Disparates, 40 de la Tauromaquia, dedicada al arte de torear, y 82 de los Desastres de la guerra; en la segunda, 80 de los Caprichos.\n\nLos Caprichos se publicaron en 1799 y son una sátira de la sociedad de su tiempo. Los Desastres tienen un significado especial en esta comarca: Goya los grabó a partir de la Guerra de la Independencia y muestran la violencia que sufrieron soldados y civiles. Verlos a unos kilómetros de Belchite invita a pensar en las guerras de cualquier época."}],"en":[{"h":"History","t":"The museum opened in 1989 in a three-storey stone house, typical of the area, converted for exhibitions. Zaragoza Provincial Council and Fuendetodos Town Council paid for its restoration. The collection has grown through donations from artists and purchases at auction.\n\nFuendetodos also has a printmaking workshop and a programme of exhibitions that keep the village's link with printmaking alive."},{"h":"What to see","t":"The ground floor has the reception, the shop and a temporary exhibition room. On the first floor are 22 prints from the Disparates, 40 from the Tauromaquia, devoted to the art of bullfighting, and 82 from the Disasters of War; on the second, 80 from the Caprichos.\n\nThe Caprichos were published in 1799 and satirise the society of their time. The Disasters have a special meaning in this area: Goya engraved them in response to the Peninsular War, and they show the violence suffered by soldiers and civilians. Seeing them a few kilometres from Belchite invites you to think about the wars of any age."}],"fr":[{"h":"Histoire","t":"Le musée a ouvert en 1989 dans une maison en pierre de trois niveaux, typique de la région, aménagée pour les expositions. La Diputación Provincial de Saragosse et la mairie de Fuendetodos ont financé sa réhabilitation. La collection s'est enrichie de dons d'artistes et d'achats aux enchères.\n\nFuendetodos possède aussi un atelier de gravure et une programmation d'expositions qui entretiennent le lien du village avec l'art de l'estampe."},{"h":"À voir","t":"Le rez-de-chaussée accueille l'accueil, la boutique et une salle d'expositions temporaires. Au premier étage sont exposées 22 estampes des Disparates, 40 de la Tauromachie, consacrée à l'art de toréer, et 82 des Désastres de la guerre ; au deuxième, 80 des Caprices.\n\nLes Caprices furent publiés en 1799 et font la satire de la société de leur temps. Les Désastres ont une résonance particulière dans cette région : Goya les grava à partir de la guerre d'Indépendance espagnole, et ils montrent la violence subie par les soldats et les civils. Les voir à quelques kilomètres de Belchite invite à penser aux guerres de toutes les époques."}],"de":[{"h":"Geschichte","t":"Das Museum wurde 1989 in einem dreistöckigen, für die Gegend typischen Steinhaus eröffnet, das für Ausstellungen umgebaut wurde. Die Provinzverwaltung von Saragossa und die Gemeinde Fuendetodos finanzierten die Sanierung. Die Sammlung ist durch Schenkungen von Künstlern und durch Ankäufe auf Auktionen gewachsen.\n\nFuendetodos hat außerdem eine Radierwerkstatt und ein Ausstellungsprogramm, die die Verbindung des Dorfes zur Druckgrafik lebendig halten."},{"h":"Sehenswert","t":"Im Erdgeschoss befinden sich Empfang, Shop und ein Raum für Wechselausstellungen. Im ersten Stock sind 22 Blätter der Disparates, 40 der Tauromaquia, die der Kunst des Stierkampfs gewidmet ist, und 82 der Schrecken des Krieges ausgestellt; im zweiten 80 der Caprichos.\n\nDie Caprichos erschienen 1799 und sind eine Satire auf die Gesellschaft ihrer Zeit. Die Schrecken des Krieges haben in dieser Gegend eine besondere Bedeutung: Goya schuf sie ausgehend vom Spanischen Unabhängigkeitskrieg, und sie zeigen die Gewalt, die Soldaten und Zivilisten erlitten. Sie wenige Kilometer von Belchite entfernt zu sehen, lädt dazu ein, über die Kriege aller Zeiten nachzudenken."}],"pt":[{"h":"História","t":"O museu abriu em 1989 numa casa de pedra de três pisos, típica da zona, adaptada para exposições. A Diputación Provincial de Saragoça e a Câmara Municipal de Fuendetodos financiaram a sua reabilitação. A coleção cresceu com doações de artistas e com compras em leilões.\n\nFuendetodos tem ainda uma oficina de gravura e uma programação de exposições que mantêm viva a ligação da aldeia à arte da gravura."},{"h":"O que ver","t":"No rés-do-chão ficam a receção, a loja e uma sala de exposições temporárias. No primeiro piso expõem-se 22 estampas dos Disparates, 40 da Tauromaquia, dedicada à arte de tourear, e 82 dos Desastres da Guerra; no segundo, 80 dos Caprichos.\n\nOs Caprichos foram publicados em 1799 e são uma sátira à sociedade do seu tempo. Os Desastres têm um significado especial nesta comarca: Goya gravou-os a partir da Guerra Peninsular, e mostram a violência sofrida por soldados e civis. Vê-los a poucos quilómetros de Belchite convida a pensar nas guerras de qualquer época."}]},"status":"pending"},{"id":"trincheras-sierra-gorda","town":"Fuendetodos","cat":"memoria","lat":41.34361,"lon":-0.90944,"coord_src":"https://turismocampodebelchite.es/files/Campo%20de%20Belchite%2006%20Memoria%20de%20la%20contienda.pdf","q":["Sierra Gorda, Fuendetodos","Vértice Sierra Gorda"],"fq":["Fuendetodos trincheras Sierra Gorda","Fuendetodos guerra civil fortín"],"name":{"es":"Fortines republicanos de Sierra Gorda","en":"Republican forts of Sierra Gorda","fr":"Fortins républicains de la Sierra Gorda","de":"Republikanische Forts der Sierra Gorda","pt":"Fortins republicanos da Sierra Gorda"},"when":{"es":"Guerra Civil · Línea del frente","en":"Civil War · Front line","fr":"Guerre civile · Ligne de front","de":"Bürgerkrieg · Frontlinie","pt":"Guerra Civil · Linha da frente"},"desc":{"es":"Fortines de piedra y restos de acuartelamientos levantados por el ejército republicano en el cerro de Sierra Gorda, al norte de Fuendetodos. Desde aquí se vigilaba la carretera de Belchite.","en":"Stone forts and the remains of troop quarters built by the Republican army on the hill of Sierra Gorda, north of Fuendetodos. From here the Belchite road was watched.","fr":"Fortins en pierre et vestiges de cantonnements construits par l'armée républicaine sur la colline de la Sierra Gorda, au nord de Fuendetodos. On y surveillait la route de Belchite.","de":"Steinforts und Reste von Truppenunterkünften, die die republikanische Armee auf dem Hügel Sierra Gorda nördlich von Fuendetodos errichtete. Von hier aus wurde die Straße nach Belchite überwacht.","pt":"Fortins de pedra e restos de aquartelamentos construídos pelo exército republicano no cerro da Sierra Gorda, a norte de Fuendetodos. Daqui vigiava-se a estrada de Belchite."},"visit":{"es":"Acceso libre a pie por caminos de monte, sin equipamiento ni servicios. Pide indicaciones en Fuendetodos o en la oficina de turismo, lleva agua y no muevas piedras ni restos.","en":"Open access on foot along hill tracks, with no facilities or services. Ask for directions in Fuendetodos or at the tourist office, carry water and do not move stones or remains.","fr":"Accès libre à pied par des chemins de colline, sans aménagement ni services. Demandez votre chemin à Fuendetodos ou à l'office de tourisme, emportez de l'eau et ne déplacez ni pierres ni vestiges.","de":"Frei zugänglich zu Fuß über Bergwege, ohne Einrichtungen oder Service. Fragen Sie in Fuendetodos oder beim Fremdenverkehrsamt nach dem Weg, nehmen Sie Wasser mit und bewegen Sie keine Steine oder Überreste.","pt":"Acesso livre a pé por caminhos de monte, sem equipamentos nem serviços. Peça indicações em Fuendetodos ou no posto de turismo, leve água e não mexa em pedras nem vestígios."},"src":"https://turismocampodebelchite.es/eng/trincheras-de-la-sierra-gorda/l.13","sources":["https://turismocampodebelchite.es/eng/trincheras-de-la-sierra-gorda/l.13","https://turismocampodebelchite.es/files/Campo%20de%20Belchite%2006%20Memoria%20de%20la%20contienda.pdf","https://es.wikipedia.org/wiki/Fuendetodos"],"art":{"es":[{"h":"Historia","t":"Durante la guerra Fuendetodos quedó como un enclave en zona republicana, con posiciones del bando sublevado en Belchite y Villanueva de Huerva, según la comarca. El ejército republicano fortificó las laderas del cerro de Sierra Gorda, entre el noreste y el suroeste.\n\nDesde el Vértice de Sierra Gorda se controlaba la carretera hacia Belchite y se observaba la posición sublevada de Jaulín, conocida como Vértice Parapetos. El propio pueblo sufrió la guerra: la iglesia de la Asunción quedó en gran parte destruida."},{"h":"Qué ver","t":"Se conservan fortines de piedra seca a lo largo de la ladera. En las partes altas hay restos que probablemente fueron alojamientos de la tropa, y en el Cabezo de Frontón queda un puesto de observación.\n\nJunto con las posiciones del Saso, en el otro lado del frente, permiten entender cómo era una guerra de posiciones: líneas que se miraban desde cerros cercanos durante meses. La comarca recoge otros restos de ese frente, como el enclave artillero del Vértice Lobo y el observatorio de Los Barbis, cerca de Belchite. Desde Fuendetodos, la visita se combina bien con la casa natal de Goya y el Museo del Grabado."}],"en":[{"h":"History","t":"During the war Fuendetodos was an enclave in the Republican zone, with rebel positions at Belchite and Villanueva de Huerva, according to the comarca. The Republican army fortified the slopes of the Sierra Gorda hill, from north-east to south-west.\n\nFrom the Vértice de Sierra Gorda the road to Belchite was controlled and the rebel position at Jaulín, known as Vértice Parapetos, was observed. The village itself suffered in the war: the church of the Asunción was largely destroyed."},{"h":"What to see","t":"Dry-stone forts survive along the slope. On the higher ground there are remains that were probably troop quarters, and on the Cabezo de Frontón an observation post survives.\n\nTogether with the El Saso positions, on the other side of the front, they help you understand what positional warfare was like: lines that watched each other from nearby hills for months. The comarca lists other remains of that front, such as the Vértice Lobo artillery post and the Los Barbis observation post, near Belchite. From Fuendetodos, the visit combines well with Goya's birthplace and the Engraving Museum."}],"fr":[{"h":"Histoire","t":"Pendant la guerre, Fuendetodos forma une enclave en zone républicaine, face à des positions insurgées à Belchite et à Villanueva de Huerva, selon la comarca. L'armée républicaine fortifia les versants de la colline de la Sierra Gorda, du nord-est au sud-ouest.\n\nDepuis le Vértice de Sierra Gorda, on contrôlait la route de Belchite et on observait la position insurgée de Jaulín, appelée Vértice Parapetos. Le village lui-même souffrit de la guerre : l'église de l'Asunción fut en grande partie détruite."},{"h":"À voir","t":"Des fortins en pierre sèche subsistent le long du versant. Sur les hauteurs se trouvent des vestiges qui furent probablement des cantonnements de troupe, et au Cabezo de Frontón demeure un poste d'observation.\n\nAvec les positions d'El Saso, de l'autre côté du front, ils aident à comprendre ce qu'était une guerre de positions : des lignes qui s'observaient pendant des mois depuis des collines voisines. La comarca recense d'autres vestiges de ce front, comme la position d'artillerie du Vértice Lobo et l'observatoire de Los Barbis, près de Belchite. Depuis Fuendetodos, la visite se combine bien avec la maison natale de Goya et le Musée de la gravure."}],"de":[{"h":"Geschichte","t":"Während des Krieges war Fuendetodos nach Angaben der Comarca eine Enklave in der republikanischen Zone, mit aufständischen Stellungen in Belchite und Villanueva de Huerva. Die republikanische Armee befestigte die Hänge des Hügels Sierra Gorda von Nordosten bis Südwesten.\n\nVom Vértice de Sierra Gorda aus kontrollierte man die Straße nach Belchite und beobachtete die aufständische Stellung bei Jaulín, den sogenannten Vértice Parapetos. Auch das Dorf selbst litt unter dem Krieg: Die Kirche de la Asunción wurde weitgehend zerstört."},{"h":"Sehenswert","t":"Entlang des Hangs sind Forts aus Trockenmauerwerk erhalten. Auf den höheren Lagen gibt es Reste, die wahrscheinlich Truppenunterkünfte waren, und auf dem Cabezo de Frontón steht noch ein Beobachtungsposten.\n\nZusammen mit den Stellungen von El Saso auf der anderen Seite der Front machen sie verständlich, was ein Stellungskrieg war: Linien, die sich monatelang von benachbarten Hügeln aus beobachteten. Die Comarca verzeichnet weitere Reste dieser Front, etwa die Artilleriestellung am Vértice Lobo und den Beobachtungsposten Los Barbis bei Belchite. Von Fuendetodos aus lässt sich der Besuch gut mit Goyas Geburtshaus und dem Radierungsmuseum verbinden."}],"pt":[{"h":"História","t":"Durante a guerra, Fuendetodos ficou como um enclave em zona republicana, com posições do lado sublevado em Belchite e Villanueva de Huerva, segundo a comarca. O exército republicano fortificou as encostas do cerro da Sierra Gorda, de nordeste a sudoeste.\n\nA partir do Vértice de Sierra Gorda controlava-se a estrada para Belchite e observava-se a posição sublevada de Jaulín, conhecida como Vértice Parapetos. A própria aldeia sofreu com a guerra: a igreja da Asunción ficou em grande parte destruída."},{"h":"O que ver","t":"Conservam-se fortins de pedra seca ao longo da encosta. Nas partes altas há restos que provavelmente foram alojamentos da tropa, e no Cabezo de Frontón resta um posto de observação.\n\nJuntamente com as posições de El Saso, do outro lado da frente, ajudam a perceber o que era uma guerra de posições: linhas que se observavam durante meses a partir de cerros próximos. A comarca regista outros vestígios dessa frente, como o posto de artilharia do Vértice Lobo e o observatório de Los Barbis, perto de Belchite. A partir de Fuendetodos, a visita combina bem com a casa natal de Goya e o Museu da Gravura."}]},"status":"pending"},{"id":"presa-almonacid","town":"Almonacid de la Cuba","cat":"hidraulico","lat":41.27483,"lon":-0.78819,"coord_src":"https://es.wikipedia.org/wiki/Presa_romana_de_Almonacid_de_la_Cuba","q":["Presa romana de Almonacid de la Cuba","La Cuba, Almonacid de la Cuba"],"fq":["Category:Almonacid de la Cuba Dam","Presa romana de Almonacid de la Cuba"],"name":{"es":"Presa romana de Almonacid de la Cuba","en":"Roman dam of Almonacid de la Cuba","fr":"Barrage romain d'Almonacid de la Cuba","de":"Römische Talsperre von Almonacid de la Cuba","pt":"Barragem romana de Almonacid de la Cuba"},"when":{"es":"Siglo I d. C. · 34 metros de altura","en":"1st century AD · 34 metres high","fr":"Ier siècle apr. J.-C. · 34 mètres de haut","de":"1. Jh. n. Chr. · 34 Meter hoch","pt":"Século I d. C. · 34 metros de altura"},"desc":{"es":"Una presa romana sobre el río Aguasvivas que sigue funcionando como azud. Con 34 metros, se considera la presa romana conservada más alta.","en":"A Roman dam on the River Aguasvivas that still works as a weir. At 34 metres, it is considered the tallest surviving Roman dam.","fr":"Un barrage romain sur l'Aguasvivas qui fonctionne toujours comme seuil de dérivation. Avec ses 34 mètres, il est considéré comme le plus haut barrage romain conservé.","de":"Eine römische Talsperre am Fluss Aguasvivas, die bis heute als Wehr dient. Mit 34 Metern gilt sie als die höchste erhaltene römische Talsperre.","pt":"Uma barragem romana sobre o rio Aguasvivas que continua a funcionar como açude. Com 34 metros, é considerada a barragem romana conservada mais alta."},"visit":{"es":"Hay un recorrido circular por pasarelas con puente colgante y el mirador de La Cuba. Se ha ofrecido entrada combinada con el Pueblo Viejo de Belchite a través de belchite.es; confirma condiciones en la oficina de turismo. Desde Almonacid sale también una senda a Letux de 6,3 km.","en":"There is a circular walk along footbridges with a suspension bridge and the La Cuba viewpoint. A combined ticket with Belchite's Pueblo Viejo has been offered through belchite.es; check current conditions with the tourist office. A 6.3 km path also runs from Almonacid to Letux.","fr":"Un circuit en boucle emprunte des passerelles, avec un pont suspendu et le belvédère de La Cuba. Un billet couplé avec le Pueblo Viejo de Belchite a été proposé via belchite.es ; vérifiez les conditions à l'office de tourisme. Un sentier de 6,3 km relie aussi Almonacid à Letux.","de":"Ein Rundweg führt über Stege mit einer Hängebrücke und zum Aussichtspunkt La Cuba. Über belchite.es wurde ein Kombiticket mit dem Pueblo Viejo von Belchite angeboten; aktuelle Bedingungen beim Fremdenverkehrsamt erfragen. Von Almonacid führt auch ein 6,3 km langer Weg nach Letux.","pt":"Há um percurso circular por passadiços, com ponte suspensa e o miradouro de La Cuba. Já foi oferecido um bilhete conjunto com o Pueblo Viejo de Belchite através de belchite.es; confirme as condições no posto de turismo. De Almonacid sai também um trilho de 6,3 km até Letux."},"src":"https://turismocampodebelchite.es/eng/presa-romana-de-almonacid-de-la-cuba/l.103","sources":["https://turismocampodebelchite.es/eng/presa-romana-de-almonacid-de-la-cuba/l.103","https://es.wikipedia.org/wiki/Presa_romana_de_Almonacid_de_la_Cuba","https://zaragozala.com/zaragoza-provincia/el-pueblo-viejo-de-belchite-y-la-presa-romana-de-almonacid-de-la-cuba-podran-visitarse-con-una-entrada-combinada/","https://turismocampodebelchite.es/campo-de-belchite-rutas-del-aguasvivas/p.190"],"art":{"es":[{"h":"Historia","t":"La presa se construyó en el siglo I, en época de Augusto según la Wikipedia, y se modificó después hasta alcanzar su forma definitiva. Era una de las tres presas romanas que regulaban el Aguasvivas. Tuvo periodos de abandono y se volvió a usar como azud en época musulmana.\n\nCon el tiempo el embalse se llenó de sedimentos y la presa pasó a funcionar como azud: desvía agua hacia los regadíos de Belchite por un canal de unos 8 km de origen romano. Está declarada Bien de Interés Cultural."},{"h":"Qué ver","t":"Mide unos 120 metros de largo, 34 de alto y 27 de ancho, y su embalse llegó a tener una capacidad de unos 6 hectómetros cúbicos. Desde las pasarelas se aprecia el grosor del muro.\n\nFíjate en que no es una ruina: es una obra hidráulica que, casi dos mil años después y tras muchas reparaciones, sigue llevando agua a los campos. Si quieres llegar andando, una ruta de 14,5 km sale de Belchite y pasa por el Pozo de los Chorros, la presa y los restos artilleros del Mojón del Lobo."}],"en":[{"h":"History","t":"The dam was built in the 1st century, in the time of Augustus according to Wikipedia, and was later altered until it reached its final form. It was one of three Roman dams that regulated the Aguasvivas. It went through periods of abandonment and was used again as a weir in the Muslim period.\n\nOver time the reservoir filled with sediment and the dam began to work as a weir: it diverts water to the irrigated land of Belchite through a canal of Roman origin about 8 km long. It is listed as a Bien de Interés Cultural."},{"h":"What to see","t":"It is about 120 metres long, 34 metres high and 27 metres wide, and its reservoir once held around 6 cubic hectometres. From the footbridges you can appreciate the thickness of the wall.\n\nNote that this is not a ruin: it is a piece of hydraulic engineering that, almost two thousand years later and after many repairs, still carries water to the fields. If you want to arrive on foot, a 14.5 km route leaves Belchite and passes the Pozo de los Chorros, the dam and the artillery remains of the Mojón del Lobo."}],"fr":[{"h":"Histoire","t":"Le barrage fut construit au Ier siècle, à l'époque d'Auguste selon Wikipédia, puis modifié jusqu'à atteindre sa forme définitive. C'était l'un des trois barrages romains qui régulaient l'Aguasvivas. Il connut des périodes d'abandon et fut réutilisé comme seuil à l'époque musulmane.\n\nAvec le temps, la retenue s'est comblée de sédiments et le barrage est devenu un seuil de dérivation : il envoie l'eau vers les terres irriguées de Belchite par un canal d'origine romaine d'environ 8 km. Il est classé Bien de Interés Cultural."},{"h":"À voir","t":"Il mesure environ 120 mètres de long, 34 de haut et 27 de large, et sa retenue atteignait une capacité d'environ 6 hectomètres cubes. Depuis les passerelles, on mesure l'épaisseur du mur.\n\nNotez que ce n'est pas une ruine : c'est un ouvrage hydraulique qui, près de deux mille ans plus tard et après de nombreuses réparations, apporte toujours l'eau aux champs. Pour y venir à pied, un itinéraire de 14,5 km part de Belchite et passe par le Pozo de los Chorros, le barrage et les vestiges d'artillerie du Mojón del Lobo."}],"de":[{"h":"Geschichte","t":"Die Talsperre wurde im 1. Jahrhundert gebaut, laut Wikipedia zur Zeit des Augustus, und später bis zu ihrer endgültigen Form umgebaut. Sie war eine von drei römischen Talsperren, die den Aguasvivas regulierten. Sie war zeitweise verlassen und wurde in muslimischer Zeit wieder als Wehr genutzt.\n\nMit der Zeit verlandete der Stausee, und die Sperre wurde zum Wehr: Sie leitet Wasser über einen etwa 8 km langen Kanal römischen Ursprungs auf die Bewässerungsfelder von Belchite. Sie steht als Bien de Interés Cultural unter Schutz."},{"h":"Sehenswert","t":"Sie ist etwa 120 Meter lang, 34 Meter hoch und 27 Meter breit, und ihr Stausee fasste einst rund 6 Kubikhektometer. Von den Stegen aus erkennt man, wie dick die Mauer ist.\n\nBeachten Sie: Dies ist keine Ruine, sondern ein Wasserbauwerk, das fast zweitausend Jahre später und nach vielen Reparaturen noch immer Wasser auf die Felder bringt. Wer zu Fuß kommen möchte: Ein 14,5 km langer Weg beginnt in Belchite und führt am Pozo de los Chorros, an der Talsperre und an den Artillerieresten des Mojón del Lobo vorbei."}],"pt":[{"h":"História","t":"A barragem foi construída no século I, na época de Augusto segundo a Wikipédia, e mais tarde modificada até atingir a sua forma definitiva. Era uma das três barragens romanas que regulavam o Aguasvivas. Teve períodos de abandono e voltou a ser usada como açude na época muçulmana.\n\nCom o tempo, a albufeira encheu-se de sedimentos e a barragem passou a funcionar como açude: desvia água para os regadios de Belchite por um canal de origem romana com cerca de 8 km. Está classificada como Bien de Interés Cultural."},{"h":"O que ver","t":"Mede cerca de 120 metros de comprimento, 34 de altura e 27 de largura, e a sua albufeira chegou a ter uma capacidade de cerca de 6 hectómetros cúbicos. Dos passadiços percebe-se a espessura do muro.\n\nRepare que não é uma ruína: é uma obra hidráulica que, quase dois mil anos depois e após muitas reparações, continua a levar água aos campos. Se quiser chegar a pé, um percurso de 14,5 km sai de Belchite e passa pelo Pozo de los Chorros, pela barragem e pelos restos de artilharia do Mojón del Lobo."}]},"status":"pending"},{"id":"villa-la-malena","town":"Azuara","cat":"arqueologia","lat":41.25644,"lon":-0.84647,"coord_src":"https://es.wikipedia.org/wiki/Villa_romana_de_La_Malena","q":["Villa romana de La Malena, Azuara"],"fq":["Villa romana de La Malena","La Malena Azuara mosaico"],"name":{"es":"Villa romana de La Malena","en":"La Malena Roman villa","fr":"Villa romaine de La Malena","de":"Römische Villa La Malena","pt":"Villa romana de La Malena"},"when":{"es":"Siglos I-V d. C. · Mosaicos","en":"1st-5th centuries AD · Mosaics","fr":"Ier-Ve siècles apr. J.-C. · Mosaïques","de":"1.-5. Jh. n. Chr. · Mosaike","pt":"Séculos I-V d. C. · Mosaicos"},"desc":{"es":"Una gran villa romana a unos 2 km de Azuara, con mosaicos en una veintena de estancias. El más conocido representa las bodas de Cadmo y Harmonía.","en":"A large Roman villa about 2 km from Azuara, with mosaics in some twenty rooms. The best known shows the wedding of Cadmus and Harmonia.","fr":"Une grande villa romaine à environ 2 km d'Azuara, avec des mosaïques dans une vingtaine de pièces. La plus connue représente les noces de Cadmos et Harmonie.","de":"Eine große römische Villa etwa 2 km von Azuara entfernt, mit Mosaiken in rund zwanzig Räumen. Das bekannteste zeigt die Hochzeit von Kadmos und Harmonia.","pt":"Uma grande villa romana a cerca de 2 km de Azuara, com mosaicos em cerca de vinte divisões. O mais conhecido representa as bodas de Cadmo e Harmonia."},"visit":{"es":"Los restos están cubiertos y no se visitan por libre. El centro de interpretación se visita con cita previa a través del Ayuntamiento de Azuara; pide el contacto en la oficina de turismo. La senda Letux-Azuara pasa cerca.","en":"The remains are covered and cannot be visited independently. The interpretation centre can be visited by appointment through Azuara Town Council; ask the tourist office for contact details. The Letux-Azuara path passes nearby.","fr":"Les vestiges sont recouverts et ne se visitent pas librement. Le centre d'interprétation se visite sur rendez-vous auprès de la mairie d'Azuara ; demandez le contact à l'office de tourisme. Le sentier Letux-Azuara passe à proximité.","de":"Die Reste sind abgedeckt und nicht frei zugänglich. Das Informationszentrum kann nach Voranmeldung über die Gemeinde Azuara besucht werden; die Kontaktdaten gibt das Fremdenverkehrsamt. Der Weg Letux-Azuara führt in der Nähe vorbei.","pt":"Os restos estão cobertos e não se visitam livremente. O centro de interpretação visita-se com marcação prévia através da Câmara Municipal de Azuara; peça o contacto no posto de turismo. O trilho Letux-Azuara passa perto."},"src":"https://turismocampodebelchite.es/eng/villa-romana-de-la-malena/l.106","sources":["https://turismocampodebelchite.es/eng/villa-romana-de-la-malena/l.106","https://es.wikipedia.org/wiki/Villa_romana_de_La_Malena"],"art":{"es":[{"h":"Historia","t":"La villa se descubrió a finales de los años ochenta durante trabajos agrícolas y se excavó en los años siguientes. Estuvo habitada entre los siglos I y V d. C. y vivió su mejor momento en el siglo IV, cuando se colocaron la mayoría de los mosaicos. Se abandonó a finales del siglo V.\n\nEn 1992 se declaró Bien de Interés Cultural como zona arqueológica. En 2017 se abrió un espacio museístico en Azuara y desde 2018 se trabaja en una estructura que protege los restos y recuerda el volumen de la villa."},{"h":"Qué ver","t":"La parte residencial tenía planta cuadrada, de unos 50 metros de lado, organizada en torno a un patio con estanque rodeado de pórticos. Alrededor se abrían unas cincuenta estancias.\n\nEn 22 de ellas aparecieron mosaicos de colores, geométricos en pasillos y entradas y figurativos en las salas principales. El de la estancia 26, con las bodas de Cadmo y Harmonía, se considera una obra destacada del mosaico romano en Hispania. También se hallaron pinturas murales, decoraciones de opus sectile, fragmentos de escultura, cerámica y monedas."}],"en":[{"h":"History","t":"The villa was discovered in the late 1980s during farm work and was excavated over the following years. It was inhabited between the 1st and 5th centuries AD and had its finest period in the 4th century, when most of the mosaics were laid. It was abandoned at the end of the 5th century.\n\nIn 1992 it was declared a Bien de Interés Cultural as an archaeological zone. In 2017 a museum space opened in Azuara, and since 2018 work has been under way on a structure that protects the remains and suggests the volume of the villa."},{"h":"What to see","t":"The residential part had a square plan, about 50 metres a side, arranged around a courtyard with a pool surrounded by porticoes. Some fifty rooms opened around it.\n\nColoured mosaics were found in 22 of them, geometric in corridors and doorways and figurative in the main rooms. The one in room 26, with the wedding of Cadmus and Harmonia, is regarded as an outstanding example of Roman mosaic in Hispania. Wall paintings, opus sectile decoration, fragments of sculpture, pottery and coins were also found."}],"fr":[{"h":"Histoire","t":"La villa fut découverte à la fin des années 1980 lors de travaux agricoles et fouillée les années suivantes. Habitée entre le Ier et le Ve siècle apr. J.-C., elle connut son apogée au IVe siècle, quand fut posée la plupart des mosaïques. Elle fut abandonnée à la fin du Ve siècle.\n\nEn 1992, elle fut déclarée Bien de Interés Cultural en tant que zone archéologique. En 2017, un espace muséal a ouvert à Azuara et, depuis 2018, on travaille à une structure qui protège les vestiges et évoque le volume de la villa."},{"h":"À voir","t":"La partie résidentielle, de plan carré d'environ 50 mètres de côté, s'organisait autour d'une cour avec bassin entourée de portiques. Une cinquantaine de pièces s'ouvraient tout autour.\n\nDans 22 d'entre elles, on a trouvé des mosaïques colorées, géométriques dans les couloirs et les entrées, figuratives dans les pièces principales. Celle de la pièce 26, avec les noces de Cadmos et Harmonie, est considérée comme une œuvre majeure de la mosaïque romaine en Hispanie. On a aussi découvert des peintures murales, des décors en opus sectile, des fragments de sculpture, de la céramique et des monnaies."}],"de":[{"h":"Geschichte","t":"Die Villa wurde Ende der 1980er Jahre bei Feldarbeiten entdeckt und in den folgenden Jahren ausgegraben. Sie war vom 1. bis zum 5. Jahrhundert n. Chr. bewohnt und erlebte ihre Blütezeit im 4. Jahrhundert, als die meisten Mosaike verlegt wurden. Ende des 5. Jahrhunderts wurde sie aufgegeben.\n\n1992 wurde sie als archäologische Zone zum Bien de Interés Cultural erklärt. 2017 wurde in Azuara ein Museumsraum eröffnet, und seit 2018 wird an einem Schutzbau gearbeitet, der die Reste schützt und das Volumen der Villa nachempfindet."},{"h":"Sehenswert","t":"Der Wohnteil hatte einen quadratischen Grundriss von etwa 50 Metern Seitenlänge und war um einen Hof mit Wasserbecken und Säulengängen angelegt. Ringsum lagen etwa fünfzig Räume.\n\nIn 22 davon fand man farbige Mosaike, geometrische in Gängen und Eingängen, figürliche in den Haupträumen. Das Mosaik in Raum 26 mit der Hochzeit von Kadmos und Harmonia gilt als herausragendes Werk der römischen Mosaikkunst in Hispanien. Außerdem fand man Wandmalereien, Opus-sectile-Dekor, Skulpturfragmente, Keramik und Münzen."}],"pt":[{"h":"História","t":"A villa foi descoberta no final dos anos oitenta durante trabalhos agrícolas e escavada nos anos seguintes. Esteve habitada entre os séculos I e V d. C. e viveu o seu melhor momento no século IV, quando foi colocada a maioria dos mosaicos. Foi abandonada no final do século V.\n\nEm 1992 foi declarada Bien de Interés Cultural como zona arqueológica. Em 2017 abriu um espaço museológico em Azuara e, desde 2018, trabalha-se numa estrutura que protege os restos e evoca o volume da villa."},{"h":"O que ver","t":"A parte residencial tinha planta quadrada, com cerca de 50 metros de lado, organizada em torno de um pátio com tanque rodeado de pórticos. À sua volta abriam-se umas cinquenta divisões.\n\nEm 22 delas apareceram mosaicos coloridos, geométricos nos corredores e entradas e figurativos nas salas principais. O da divisão 26, com as bodas de Cadmo e Harmonia, é considerado uma obra de destaque do mosaico romano na Hispânia. Foram também encontradas pinturas murais, decorações em opus sectile, fragmentos de escultura, cerâmica e moedas."}]},"status":"pending"},{"id":"aerodromo-plenas","town":"Plenas","cat":"memoria","lat":41.10917,"lon":-0.9475,"coord_src":"https://turismocampodebelchite.es/files/Campo%20de%20Belchite%2006%20Memoria%20de%20la%20contienda.pdf","q":["Aeródromo de Plenas","El Bombal, Plenas"],"fq":["Plenas aeródromo guerra civil","Plenas Zaragoza"],"name":{"es":"Aeródromo de Plenas","en":"Plenas airfield","fr":"Aérodrome de Plenas","de":"Flugplatz von Plenas","pt":"Aeródromo de Plenas"},"when":{"es":"Guerra Civil · Campo de aviación","en":"Civil War · Airfield","fr":"Guerre civile · Terrain d'aviation","de":"Bürgerkrieg · Feldflugplatz","pt":"Guerra Civil · Campo de aviação"},"desc":{"es":"Un campo de aviación de la Guerra Civil en un llano junto a Plenas, del que quedan tres edificios. Recuerda que la guerra en esta comarca también se libró en el aire.","en":"A Civil War airfield on a plain next to Plenas, of which three buildings survive. A reminder that the war in this area was also fought in the air.","fr":"Un terrain d'aviation de la guerre civile sur une plaine près de Plenas, dont il reste trois bâtiments. Il rappelle que, dans cette région, la guerre se livra aussi dans les airs.","de":"Ein Feldflugplatz aus dem Bürgerkrieg auf einer Ebene bei Plenas, von dem drei Gebäude erhalten sind. Er erinnert daran, dass der Krieg in dieser Gegend auch in der Luft geführt wurde.","pt":"Um campo de aviação da Guerra Civil numa planície junto a Plenas, do qual restam três edifícios. Lembra que a guerra nesta comarca também se travou no ar."},"visit":{"es":"Acceso libre desde Plenas. La senda Plenas-Moyuela (11,9 km) pasa por el antiguo aeródromo de El Bombal, por trincheras y por casas-cueva. Los edificios no están acondicionados: obsérvalos desde fuera.","en":"Open access from Plenas. The Plenas-Moyuela path (11.9 km) passes the old El Bombal airfield, trenches and cave houses. The buildings have not been made safe for visitors: look at them from outside.","fr":"Accès libre depuis Plenas. Le sentier Plenas-Moyuela (11,9 km) passe par l'ancien aérodrome d'El Bombal, des tranchées et des maisons troglodytes. Les bâtiments ne sont pas aménagés : observez-les de l'extérieur.","de":"Frei zugänglich von Plenas aus. Der Weg Plenas-Moyuela (11,9 km) führt am alten Flugplatz El Bombal, an Schützengräben und an Höhlenhäusern vorbei. Die Gebäude sind nicht für Besucher hergerichtet: nur von außen betrachten.","pt":"Acesso livre a partir de Plenas. O trilho Plenas-Moyuela (11,9 km) passa pelo antigo aeródromo de El Bombal, por trincheiras e por casas-gruta. Os edifícios não estão preparados para visitas: observe-os do exterior."},"src":"https://turismocampodebelchite.es/eng/aerodromo-de-plenas/l.9","sources":["https://turismocampodebelchite.es/eng/aerodromo-de-plenas/l.9","https://turismocampodebelchite.es/files/Campo%20de%20Belchite%2006%20Memoria%20de%20la%20contienda.pdf","https://es.wikipedia.org/wiki/Plenas","https://turismocampodebelchite.es/campo-de-belchite-rutas-del-aguasvivas/p.190"],"art":{"es":[{"h":"Historia","t":"El aeródromo se habilitó durante la Guerra Civil en una zona llana del término de Plenas, y según la comarca lo construyeron los propios vecinos. En esta parte del frente, Plenas estuvo un tiempo en zona republicana. Hoy es un pueblo de alrededor de un centenar de habitantes.\n\nLa comarca recoge que solo consta el aterrizaje de un avión durante la guerra: un aparato del bando sublevado que se quedó sin combustible. El piloto fue hecho prisionero y quedó libre cuando las tropas sublevadas tomaron la vecina Moyuela."},{"h":"Qué ver","t":"Se conservan tres edificios. Por su forma, pudieron servir de refugio, de alojamiento y quizá de polvorín; la guía de memoria de la comarca los describe como lugares donde se alojaban pilotos. La visita encaja bien con la senda hacia Moyuela, que añade trincheras, un lavadero, casas-cueva y la llamada encina de la Bomba. En esa senda el lugar aparece con el nombre de aeródromo de El Bombal. Otra senda corta, de 4,6 km, lleva desde Plenas a la ermita del Carrascal siguiendo el río Santa María."}],"en":[{"h":"History","t":"The airfield was set up during the Civil War on flat land in the municipality of Plenas, and according to the comarca it was built by the villagers themselves. On this part of the front, Plenas was in the Republican zone for a time. Today it is a village of around a hundred inhabitants.\n\nThe comarca records that only one plane is known to have landed here during the war: an aircraft from the rebel side that had run out of fuel. The pilot was taken prisoner and was freed when rebel troops took the neighbouring village of Moyuela."},{"h":"What to see","t":"Three buildings survive. Judging by their shape, they may have served as a shelter, as accommodation and perhaps as a powder store; the comarca's memory guide describes them as places where pilots were housed. The visit fits well with the path to Moyuela, which adds trenches, a wash house, cave houses and the so-called encina de la Bomba (the 'bomb holm oak'). On that path the site appears as El Bombal airfield. Another short path, 4.6 km long, leads from Plenas to the hermitage of El Carrascal along the River Santa María."}],"fr":[{"h":"Histoire","t":"L'aérodrome fut aménagé pendant la guerre civile sur un terrain plat de la commune de Plenas et, selon la comarca, construit par les habitants eux-mêmes. Sur cette partie du front, Plenas fut un temps en zone républicaine. C'est aujourd'hui un village d'une centaine d'habitants.\n\nLa comarca rapporte qu'un seul atterrissage est attesté pendant la guerre : un appareil du camp insurgé à court de carburant. Le pilote fut fait prisonnier, puis libéré lorsque les troupes insurgées prirent le village voisin de Moyuela."},{"h":"À voir","t":"Trois bâtiments sont conservés. D'après leur forme, ils ont pu servir d'abri, de logement et peut-être de poudrière ; le guide de mémoire de la comarca les décrit comme des lieux où logeaient des pilotes. La visite se combine bien avec le sentier vers Moyuela, qui ajoute des tranchées, un lavoir, des maisons troglodytes et le chêne vert appelé encina de la Bomba. Sur ce sentier, le site apparaît sous le nom d'aérodrome d'El Bombal. Un autre sentier court, de 4,6 km, mène de Plenas à l'ermitage d'El Carrascal en suivant le río Santa María."}],"de":[{"h":"Geschichte","t":"Der Flugplatz wurde während des Bürgerkriegs auf flachem Gelände der Gemeinde Plenas angelegt, nach Angaben der Comarca von den Dorfbewohnern selbst. In diesem Frontabschnitt lag Plenas eine Zeit lang in der republikanischen Zone. Heute hat das Dorf rund hundert Einwohner.\n\nDie Comarca berichtet, dass während des Krieges nur eine Landung belegt ist: ein Flugzeug der aufständischen Seite, dem der Treibstoff ausgegangen war. Der Pilot wurde gefangen genommen und kam frei, als aufständische Truppen das Nachbardorf Moyuela einnahmen."},{"h":"Sehenswert","t":"Drei Gebäude sind erhalten. Ihrer Form nach könnten sie als Schutzraum, als Unterkunft und vielleicht als Pulvermagazin gedient haben; der Gedenkführer der Comarca beschreibt sie als Orte, an denen Piloten untergebracht waren. Der Besuch lässt sich gut mit dem Weg nach Moyuela verbinden, an dem Schützengräben, ein Waschhaus, Höhlenhäuser und die sogenannte encina de la Bomba ('Bombeneiche') liegen. Auf diesem Weg erscheint der Ort als Flugplatz El Bombal. Ein weiterer kurzer Weg von 4,6 km führt von Plenas entlang des Río Santa María zur Einsiedelei El Carrascal."}],"pt":[{"h":"História","t":"O aeródromo foi preparado durante a Guerra Civil numa zona plana do concelho de Plenas e, segundo a comarca, construído pelos próprios habitantes. Neste troço da frente, Plenas esteve durante algum tempo em zona republicana. Hoje é uma aldeia de cerca de uma centena de habitantes.\n\nA comarca refere que só há registo de uma aterragem durante a guerra: um avião do lado sublevado que ficou sem combustível. O piloto foi feito prisioneiro e libertado quando as tropas sublevadas tomaram a vizinha Moyuela."},{"h":"O que ver","t":"Conservam-se três edifícios. Pela sua forma, podem ter servido de abrigo, de alojamento e talvez de paiol; o guia de memória da comarca descreve-os como lugares onde se alojavam pilotos. A visita combina bem com o trilho para Moyuela, que junta trincheiras, um lavadouro, casas-gruta e a chamada encina de la Bomba (a 'azinheira da bomba'). Nesse trilho, o local aparece com o nome de aeródromo de El Bombal. Outro trilho curto, de 4,6 km, leva de Plenas à ermida de El Carrascal, seguindo o rio Santa María."}]},"status":"pending"}],"towns":[{"name":"Belchite","lat":41.30654,"lon":-0.75464},{"name":"Almochuel","lat":41.28019,"lon":-0.54964},{"name":"Almonacid de la Cuba","lat":41.2795,"lon":-0.7924},{"name":"Azuara","lat":41.25731,"lon":-0.87136},{"name":"Codo","lat":41.33341,"lon":-0.69944},{"name":"Fuendetodos","lat":41.34135,"lon":-0.95946},{"name":"Lagata","lat":41.23982,"lon":-0.80472},{"name":"Lécera","lat":41.20322,"lon":-0.71069},{"name":"Letux","lat":41.25447,"lon":-0.8027},{"name":"Moneva","lat":41.12723,"lon":-0.82982},{"name":"Moyuela","lat":41.13214,"lon":-0.92475},{"name":"Plenas","lat":41.11214,"lon":-0.9641},{"name":"La Puebla de Albortón","lat":41.38488,"lon":-0.85516},{"name":"Samper del Salz","lat":41.23466,"lon":-0.82464},{"name":"Valmadrid","lat":41.4434,"lon":-0.88448}],"context":[],"routes":[{"id":"belchite-1937","cat":"memoria","mode":"walk","stops":["pueblo-nuevo","pueblo-viejo","iglesia-san-martin","el-trujal","campo-rusia","posiciones-saso"],"name":{"es":"Belchite 1937","en":"Belchite 1937","fr":"Belchite 1937","de":"Belchite 1937","pt":"Belchite 1937"},"summary":{"es":"Del pueblo nuevo a las ruinas y a los lugares de la posguerra: la batalla, sus víctimas y quién reconstruyó Belchite.","en":"From the new town to the ruins and the post-war sites: the battle, its victims and who rebuilt Belchite.","fr":"Du nouveau village aux ruines et aux lieux de l'après-guerre : la bataille, ses victimes et ceux qui reconstruisirent Belchite."," function hav(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lon-a.lon);const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
