/* Layout: one-screen app. Map is the stage; a reading panel sits beside it (stacked under it on phones).
   Palette drawn from the Ribera: limestone ground, Ebro teal, mudéjar brick, steppe ochre. */
:root{
  --bg:#ECEFEA; --panel:#FAFBF8; --panel-2:#F2F4EF; --ink:#18221E; --muted:#56635D; --faint:#646F6A;
  --line:#D5DBD3; --accent:#17646C; --accent-ink:#FFFFFF; --accent-soft:#D6E8E8;
  --land:#E2E6DB; --land-hi:#D5DCCB; --land-out:#EEF0EA; --edge:#9AA79C; --outline:#17646C;
  --water:#3C8D96; --water-soft:#BFDCDD; --label:#2E3A35;
  --c-pat:#A4502C; --c-gue:#5A6A33; --c-mus:#7A4A7F; --c-hid:#2A6CA1; --c-nat:#3C8550; --c-arq:#97702F; --c-cam:#B98A0E;
  --ok:#2E7D4F; --shadow:0 1px 2px rgba(20,34,30,.08),0 6px 18px rgba(20,34,30,.08);
  --f-display:"Spectral",Georgia,"Times New Roman",serif;
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --panel:#141C19; --panel-2:#19231F; --ink:#E5ECE8; --muted:#9FADA7; --faint:#7E8C86;
  --line:#26332E; --accent:#5DB6BE; --accent-ink:#0B1513; --accent-soft:#183437;
  --land:#1A2420; --land-hi:#21302A; --land-out:#111815; --edge:#3A4A43; --outline:#5DB6BE;
  --water:#3E8F98; --water-soft:#1B3A3D; --label:#C9D4CF;
  --c-pat:#E08A63; --c-gue:#A9B872; --c-mus:#C08BC5; --c-hid:#6FA9DA; --c-nat:#7CC48D; --c-arq:#D6AE68; --c-cam:#E5BD45;
  --ok:#69C08E; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --panel:#141C19; --panel-2:#19231F; --ink:#E5ECE8; --muted:#9FADA7; --faint:#7E8C86;

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

#app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:1001}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.brand svg{flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:1.28rem;line-height:1.1;letter-spacing:.01em}
.brand-sub{font-size:.74rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel-2)}
.langs button{border:0;background:transparent;padding:5px 10px;font-size:.78rem;font-weight:600;letter-spacing:.05em;cursor:pointer;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.demo-tag{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);border-radius:4px;padding:2px 6px}

main{display:grid;grid-template-columns:minmax(330px,410px) 1fr;min-height:0}
#panel{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
#mapwrap{position:relative;min-height:0;min-width:0}
#map{position:absolute;inset:0;background:var(--bg)}
@media (max-width:760px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(260px,46%) 1fr}
  #mapwrap{order:-1}
  #panel{border-right:0;border-top:1px solid var(--line)}

.note{font-size:.78rem;color:var(--faint);line-height:1.45}

/* Map */
.leaflet-container{font-family:var(--f-ui);background:var(--bg)}
.muni{fill:var(--land);stroke:var(--edge);stroke-width:.8}
.muni.out{fill:var(--land-out);stroke:var(--edge);stroke-opacity:.45;stroke-width:.6}
.muni.hl{fill:var(--land-hi)}
.comarca-outline{fill:none;stroke:var(--outline);stroke-width:2.2;stroke-dasharray:1 0}
.river-halo{stroke:var(--water-soft);stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.river{stroke:var(--water);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tiles-on .muni{fill-opacity:.0;stroke-opacity:.6}
.tiles-on .muni.out{fill-opacity:0}
.tiles-on .river,.tiles-on .river-halo{stroke-opacity:0}
.tiles-on .town-label,.tiles-on .river-label{display:none}
.tiles-on .comarca-outline{stroke-width:2.6;stroke-opacity:.85}
.route-line{stroke:var(--c);stroke-width:3.5;stroke-dasharray:2 7;stroke-linecap:round;fill:none}
.town-label{font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--label);white-space:nowrap;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 6px var(--bg);pointer-events:none;letter-spacing:.02em;transform:translate(-50%,7px);display:inline-block}
.town-label.out{font-weight:500;font-size:11px;color:var(--faint);font-style:italic}
.river-label{font-family:var(--f-display);font-style:italic;font-size:14px;color:var(--water);letter-spacing:.35em;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg);white-space:nowrap;pointer-events:none;transform:translate(-50%,-50%) rotate(-12deg);display:inline-block}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 6px;transform:rotate(-45deg);background:var(--c);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.35);border:2px solid var(--panel);transition:transform .15s}
.pin svg{width:15px;height:15px;transform:rotate(45deg);color:#fff}
.pin.sel{transform:rotate(-45deg) scale(1.28);border-color:var(--ink)}
.pin.dim{opacity:.28}
.zlow .pin{width:13px;height:13px;border-radius:50%;transform:translate(-2.5px,23.5px);border-width:1.5px}
.zlow .pin svg{display:none}
.zlow .pin.sel{transform:translate(-2.5px,23.5px) scale(1.6)}
.zfar .town-label.minor{display:none}
.stopnum{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--panel);font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--panel);transform:translate(14px,-40px);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.zlow .stopnum{transform:translate(4px,-14px)}
.leaflet-control-zoom a,.mapbtn{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:var(--shadow)!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 85%,transparent)!important;color:var(--muted)!important;font-size:10px!important}
.leaflet-control-attribution a{color:var(--accent)!important}
.leaflet-top.leaflet-left{left:env(safe-area-inset-left,0px)}
.layerbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;display:flex;flex-direction:column;gap:2px}
.layerbox button{border:0;background:none;text-align:left;padding:6px 10px;border-radius:6px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--muted)}
.layerbox button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.legend{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px 10px;font-size:.74rem;display:flex;flex-direction:column;gap:3px;max-width:180px}
.legend div{display:flex;align-items:center;gap:7px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
@media (max-width:760px){.legend{display:none}.layerbox{flex-direction:row;padding:3px;margin-left:max(10px,env(safe-area-inset-left,0px))!important}.layerbox button{padding:5px 8px;font-size:.72rem}.leaflet-bottom.leaflet-left{bottom:16px}}

/* Móvil: la página entera hace scroll; el mapa queda arriba y se va al bajar, así se lee a pantalla completa */
@media (max-width:760px){
  html,body{height:auto}
  #app{height:auto;display:block}
  main{display:flex;flex-direction:column}
  #mapwrap{order:-1;height:40vh;height:40svh;min-height:230px;flex:none}
  #panel{min-height:calc(100vh - 56px);min-height:calc(100svh - 56px)}
  nav.tabs{position:sticky;top:0;z-index:1002;background:var(--panel)}
  .view{overflow:visible;flex:none;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  #tomap{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:1500;display:flex;align-items:center;gap:7px;
    border:0;border-radius:999px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.86rem;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;
    transition:opacity .2s,transform .2s}
  #tomap svg{width:17px;height:17px}
  #tomap[data-off]{opacity:0;transform:translateY(12px);pointer-events:none}
}
@media (min-width:761px){#tomap{display:none}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:8px;font-size:.86rem;z-index:5000;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- avisos, pasaporte, agenda, gestión ---- */
.btn.primary span,.btn.primary{color:var(--accent-ink)}
.aviso{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--panel-2);border-radius:10px;padding:10px 12px;font-size:.88rem}
.aviso b{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.aviso.warn{border-left-color:#B4441F}.aviso.warn b{color:#B4441F}
.aviso.prize{border-left-color:#B8860B}.aviso.prize b{color:#8A6508}
.stampbox,.passcta{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel-2)}
.passcta{width:100%;cursor:pointer;font:inherit;color:var(--ink);text-align:left}
.passcta:hover{border-color:var(--accent)}
.passcta .go{margin-left:auto;font-size:1.4rem;color:var(--muted)}
.seal{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--c,var(--accent));color:var(--c,var(--accent))}
.seal svg{width:22px;height:22px}
.stampbox.done .seal{border-style:solid;background:var(--c);color:#fff}
.passcta.ag .seal{border-style:solid;border-radius:12px}
.passhead{display:flex;align-items:center;gap:16px}
.ring{--p:0;flex:none;width:92px;height:92px;border-radius:50%;display:grid;place-content:center;text-align:center;
  background:radial-gradient(closest-side,var(--panel) 78%,transparent 79%),conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
.ring b{font-size:1.6rem;line-height:1}.ring span{font-size:.75rem;color:var(--muted)}
.prow{display:grid;grid-template-columns:1fr;gap:4px;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);cursor:pointer;font:inherit;color:var(--ink)}
.prow .t{font-weight:600;font-size:.92rem}
.pbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.pbar i{display:block;height:100%;background:var(--c)}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin:6px 0 10px}
.stamp{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;cursor:pointer;font:inherit;color:var(--muted);padding:4px}
.stamp .seal{width:58px;height:58px;border-color:var(--line)}
.stamp.on .seal{border:2px solid var(--c);background:var(--c);color:#fff}
.stamp.on{color:var(--ink)}
.stamp .nm{font-size:.74rem;line-height:1.25;text-align:center;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ev{display:flex;gap:12px;border-bottom:1px solid var(--line);padding:10px 0}
.ev p{margin:2px 0 0;font-size:.88rem}
.cal{flex:none;width:52px;border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:center;background:var(--panel)}
.cal span{display:block;background:var(--accent);color:var(--accent-ink);font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 0}
.cal b{display:block;font-size:1.2rem;padding:4px 0}
.cal{align-self:flex-start}.cal.m{border:2px solid var(--accent)}.cal.m b{font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);padding:9px 0}
.bars.wide .bar{grid-template-columns:minmax(0,1.4fr) 1fr auto}.bars.wide .bar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.neg{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:8px 0}
.adm-nav{display:flex;flex-wrap:wrap;gap:6px}
.adm-nav a{font-size:.8rem;border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--ink);text-decoration:none;background:var(--panel-2)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.two-col{grid-template-columns:1fr}}
.foot-links{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;padding-bottom:8px}
.foot-links a{color:var(--muted)}
details summary{cursor:pointer;padding:4px 0}
.skip{position:absolute;left:-9999px;top:8px;z-index:9999;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;font-weight:700}
.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

</style>

<div id="cover" hidden></div>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<div id="app"><a class="skip" href="#panel" data-i="skipLink"></a>
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="var(--accent)"/><path d="M4 22c5-1 6-7 11-7s5 9 10 9 4-6 5-7" stroke="var(--accent-ink)" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="23" cy="10" r="2.6" fill="var(--accent-ink)"/></svg>
      <div style="min-width:0">
        <div class="brand-name">Campo de Belchite Explora</div>
        <div class="brand-sub" data-i="appSub"></div>
      </div>
    </div>
    <span class="demo-tag" data-i="demo"></span>
    <div class="langs" role="group" aria-label="Idioma / Language" id="langs"></div>
  </header>
  <main>
    <aside id="panel">
      <nav class="tabs" role="tablist" id="tabs">
        <button role="tab" data-tab="inicio" data-i="tabHome"></button>
        <button role="tab" data-tab="explorar" data-i="tabExplore"></button>
        <button role="tab" data-tab="rutas" data-i="tabRoutes"></button>
        <button role="tab" data-tab="agenda" data-i="tabAgenda"></button>
        <button role="tab" data-tab="pasaporte" data-i="tabPass"></button>
      </nav>
      <section class="view stack" id="v-inicio"></section>
      <section class="view stack" id="v-explorar" hidden></section>
      <section class="view stack" id="v-lugar" hidden></section>
      <section class="view stack" id="v-rutas" hidden></section>
      <section class="view stack" id="v-agenda" hidden></section>
      <section class="view stack" id="v-pasaporte" hidden></section>
      <section class="view stack" id="v-gestion" hidden></section>
    </aside>
    <div id="mapwrap"><div id="map" role="application" aria-label="Mapa"></div></div>
    <button type="button" id="tomap" data-off><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 4-6 3v13l6-3 6 3 6-3V4l-6 3-6-3z"/><path d="M9 4v13M15 7v13"/></svg><span data-i="tabMap"></span></button>
  </main>
</div>

 11 7 14.5L9 20h6l2-5.5c.7-3.5-.2-6.5-3-8.3V3\"/>"},"hidraulico":{"color":"--c-hid","icon":"<circle cx=\"12\" cy=\"12\" r=\"7.5\"/><circle cx=\"12\" cy=\"12\" r=\"1.8\"/><path d=\"M12 4.5v15M4.5 12h15M6.7 6.7l10.6 10.6M17.3 6.7 6.7 17.3\"/>"},"naturaleza":{"color":"--c-nat","icon":"<path d=\"M2.5 11c2.8-2.6 5.6-2.6 8 .3 2.4-2.9 5.2-2.9 8-.3\"/><path d=\"M8 17c1.6-1.5 3.2-1.5 4.6.2 1.4-1.7 3-1.7 4.6-.2\"/>"},"camino":{"color":"--c-cam","icon":"<path d=\"M12 20.5 3.5 9.2a9.5 9.5 0 0 1 17 0z\"/><path d=\"M12 20.5 8 6.5M12 20.5V5M12 20.5l4-14\"/>"}},"pois":[{"id":"pueblo-viejo","town":"Belchite","cat":"memoria","lat":41.3006,"lon":-0.74784,"coord_src":null,"q":["Pueblo Viejo de Belchite","Belchite Viejo","Calle Mayor, Belchite"],"fq":["Category:Belchite","Belchite pueblo viejo","Belchite ruinas"],"name":{"es":"Pueblo Viejo de Belchite","en":"Old Town of Belchite (Pueblo Viejo)","fr":"Vieux village de Belchite (Pueblo Viejo)","de":"Altes Dorf von Belchite (Pueblo Viejo)","pt":"Aldeia Velha de Belchite (Pueblo Viejo)"},"when":{"es":"Batalla de 1937 · Ruinas conservadas","en":"Battle of 1937 · Preserved ruins","fr":"Bataille de 1937 · Ruines conservées","de":"Schlacht von 1937 · Erhaltene Ruinen","pt":"Batalha de 1937 · Ruínas conservadas"},"desc":{"es":"Las ruinas del antiguo Belchite, destruido en los combates de agosto y septiembre de 1937 y nunca reconstruido. Recorrer sus calles es ver de cerca lo que una batalla deja en un pueblo y en su gente.","en":"The ruins of old Belchite, destroyed in the fighting of August and September 1937 and never rebuilt. Walking its streets shows you, up close, what a battle leaves behind in a town and its people.","fr":"Les ruines de l'ancien Belchite, détruit lors des combats d'août et septembre 1937 et jamais reconstruit. Parcourir ses rues, c'est voir de près ce qu'une bataille laisse dans un village et chez ses habitants.","de":"Die Ruinen des alten Belchite, das in den Kämpfen im August und September 1937 zerstört und nie wieder aufgebaut wurde. Wer durch seine Straßen geht, sieht aus der Nähe, was eine Schlacht in einem Ort und bei seinen Menschen hinterlässt.","pt":"As ruínas da antiga Belchite, destruída nos combates de agosto e setembro de 1937 e nunca reconstruída. Percorrer as suas ruas é ver de perto o que uma batalha deixa numa terra e na sua gente."},"visit":{"es":"El interior del Pueblo Viejo solo se recorre en visita guiada organizada por el Ayuntamiento de Belchite y la Fundación Pueblo Viejo, de día y también de noche. Las entradas se reservan en la web municipal (belchite.es); confirma horarios y duración en la oficina de turismo antes de ir.","en":"The inside of the Pueblo Viejo can only be seen on a guided tour run by Belchite Town Council and the Fundación Pueblo Viejo, by day and also at night. Tickets are booked on the council website (belchite.es); check times and length of the tour with the tourist office before you go.","fr":"L'intérieur du Pueblo Viejo ne se parcourt qu'en visite guidée, organisée par la mairie de Belchite et la Fundación Pueblo Viejo, de jour comme de nuit. Les billets se réservent sur le site de la mairie (belchite.es) ; vérifiez horaires et durée auprès de l'office de tourisme avant de venir.","de":"Das Innere des Pueblo Viejo ist nur mit einer Führung zugänglich, die die Gemeinde Belchite und die Fundación Pueblo Viejo tagsüber und auch nachts anbieten. Tickets werden auf der Website der Gemeinde (belchite.es) gebucht; Zeiten und Dauer vorher beim Fremdenverkehrsamt erfragen.","pt":"O interior do Pueblo Viejo só se percorre em visita guiada, organizada pela Câmara Municipal de Belchite e pela Fundación Pueblo Viejo, de dia e também à noite. Os bilhetes reservam-se no site municipal (belchite.es); confirme horários e duração no posto de turismo antes de ir."},"src":"https://turismocampodebelchite.es/files/Campo%20de%20Belchite%2006%20Memoria%20de%20la%20contienda.pdf","sources":["https://turismocampodebelchite.es/files/Campo%20de%20Belchite%2006%20Memoria%20de%20la%20contienda.pdf","https://es.wikipedia.org/wiki/Belchite","https://turismocampodebelchite.es/eng/conjunto-historico-del-pueblo-viejo-de-belchite/l.4","https://zaragozala.com/zaragoza-provincia/el-pueblo-viejo-de-belchite-supera-las-42-700-visitas-en-2025/","https://en.wikipedia.org/wiki/Battle_of_Belchite_(1937)","https://www.turismodearagon.com/2026/03/02/el-pueblo-viejo-de-belchite-declarado-espacio-de-interes-turistico-de-aragon/"],"art":{"es":[{"h":"Historia","t":"Al inicio de la guerra, en julio de 1936, Belchite quedó en manos de las tropas sublevadas. Un año después, el Ejército Popular de la República lanzó la ofensiva sobre Zaragoza y atacó el pueblo: los combates duraron del 24 de agosto al 6 de septiembre de 1937 y terminaron casa por casa. La comarca cifra en más de 5.000 las bajas entre soldados de ambos bandos y civiles. Dentro del pueblo había, junto a los defensores, varios miles de vecinos.\n\nEn marzo de 1938 el bando sublevado recuperó Belchite. Tras la guerra se prohibió reconstruir el casco antiguo y se levantó un pueblo nuevo al lado; los últimos vecinos dejaron las casas viejas en 1964."},{"h":"Qué ver","t":"La Calle Mayor es la parte mejor conservada, con casas del siglo XVI de ladrillo, mampostería y tapial. Desde ella se llega a la iglesia de San Martín de Tours, a la Torre del Reloj (antigua iglesia de San Juan, del siglo XVI) y a los restos de los conventos de San Agustín y San Rafael. La Torre del Reloj y San Agustín están declarados Bien de Interés Cultural. Al casco se entraba por dos arcos: el de la Villa, restaurado en 2008, y el de San Roque."},{"h":"Para entenderlo","t":"El estado de las ruinas no se debe solo a la artillería y a la aviación: más de ochenta años de abandono han hecho caer muchos muros. Desde 2000 se consolidan los edificios más importantes. En 2025 lo visitaron unas 42.700 personas, y en 2026 el Gobierno de Aragón lo declaró Espacio de Interés Turístico."}],"en":[{"h":"History","t":"At the start of the war, in July 1936, Belchite came under the control of the rebel troops. A year later the Republican People's Army launched its offensive on Zaragoza and attacked the town: the fighting lasted from 24 August to 6 September 1937 and ended house by house. The comarca puts casualties at more than 5,000 among soldiers on both sides and civilians. Alongside the defenders, several thousand townspeople were inside the town.\n\nIn March 1938 the rebel side retook Belchite. After the war, rebuilding the old town was forbidden and a new town was built next to it; the last residents left the old houses in 1964."},{"h":"What to see","t":"Calle Mayor is the best-preserved part, with 16th-century houses of brick, rubble masonry and rammed earth. From there you reach the church of San Martín de Tours, the Clock Tower (the former church of San Juan, 16th century) and the remains of the convents of San Agustín and San Rafael. The Clock Tower and San Agustín are listed as Bienes de Interés Cultural (protected heritage). The old town was entered through two arches: the Arco de la Villa, restored in 2008, and the Arco de San Roque."},{"h":"Understanding it","t":"The state of the ruins is not only down to artillery and aircraft: more than eighty years of abandonment have brought many walls down. Since 2000 the most important buildings have been stabilised. In 2025 about 42,700 people visited, and in 2026 the Government of Aragón declared it a Space of Tourist Interest."}],"fr":[{"h":"Histoire","t":"Au début de la guerre, en juillet 1936, Belchite passa aux mains des troupes insurgées. Un an plus tard, l'Armée populaire de la République lança son offensive sur Saragosse et attaqua le village : les combats durèrent du 24 août au 6 septembre 1937 et s'achevèrent maison par maison. La comarca évalue à plus de 5 000 les pertes parmi les soldats des deux camps et les civils. Aux côtés des défenseurs, plusieurs milliers d'habitants se trouvaient dans le village.\n\nEn mars 1938, le camp insurgé reprit Belchite. Après la guerre, il fut interdit de reconstruire le vieux village et un nouveau village fut bâti à côté ; les derniers habitants quittèrent les vieilles maisons en 1964."},{"h":"À voir","t":"La Calle Mayor est la partie la mieux conservée, avec des maisons du XVIe siècle en brique, moellons et pisé. Elle mène à l'église San Martín de Tours, à la Tour de l'Horloge (ancienne église San Juan, du XVIe siècle) et aux vestiges des couvents de San Agustín et San Rafael. La Tour de l'Horloge et San Agustín sont classés Bien de Interés Cultural (patrimoine protégé). On entrait dans le village par deux arcs : l'Arco de la Villa, restauré en 2008, et l'Arco de San Roque."},{"h":"Pour comprendre","t":"L'état des ruines n'est pas dû seulement à l'artillerie et à l'aviation : plus de quatre-vingts ans d'abandon ont fait tomber de nombreux murs. Depuis 2000, les bâtiments les plus importants sont consolidés. En 2025, environ 42 700 personnes l'ont visité, et en 2026 le Gouvernement d'Aragon l'a déclaré Espace d'intérêt touristique."}],"de":[{"h":"Geschichte","t":"Zu Beginn des Krieges, im Juli 1936, geriet Belchite unter die Kontrolle der aufständischen Truppen. Ein Jahr später startete die Volksarmee der Republik ihre Offensive auf Saragossa und griff den Ort an: Die Kämpfe dauerten vom 24. August bis zum 6. September 1937 und endeten im Häuserkampf. Die Comarca beziffert die Verluste unter Soldaten beider Seiten und Zivilisten auf mehr als 5.000. Neben den Verteidigern befanden sich mehrere tausend Einwohner im Ort.\n\nIm März 1938 eroberte die aufständische Seite Belchite zurück. Nach dem Krieg wurde der Wiederaufbau des alten Ortes verboten und daneben ein neues Dorf errichtet; die letzten Bewohner verließen die alten Häuser 1964."},{"h":"Sehenswert","t":"Die Calle Mayor ist der am besten erhaltene Teil, mit Häusern aus dem 16. Jahrhundert aus Ziegel, Bruchstein und Stampflehm. Von hier gelangt man zur Kirche San Martín de Tours, zum Uhrturm (der ehemaligen Kirche San Juan aus dem 16. Jahrhundert) und zu den Resten der Klöster San Agustín und San Rafael. Der Uhrturm und San Agustín stehen als Bien de Interés Cultural unter Denkmalschutz. Man betrat den Ort durch zwei Bögen: den Arco de la Villa, 2008 restauriert, und den Arco de San Roque."},{"h":"Zum Verständnis","t":"Der Zustand der Ruinen geht nicht nur auf Artillerie und Luftangriffe zurück: Mehr als achtzig Jahre Verfall haben viele Mauern einstürzen lassen. Seit 2000 werden die wichtigsten Gebäude gesichert. 2025 kamen rund 42.700 Besucher, und 2026 erklärte die Regierung von Aragonien den Ort zum Raum von touristischem Interesse."}],"pt":[{"h":"História","t":"No início da guerra, em julho de 1936, Belchite ficou nas mãos das tropas sublevadas. Um ano depois, o Exército Popular da República lançou a ofensiva sobre Saragoça e atacou a localidade: os combates duraram de 24 de agosto a 6 de setembro de 1937 e terminaram casa a casa. A comarca estima em mais de 5000 as baixas entre soldados dos dois lados e civis. Dentro da localidade estavam, a par dos defensores, vários milhares de habitantes.\n\nEm março de 1938, o lado sublevado recuperou Belchite. Depois da guerra, proibiu-se a reconstrução do núcleo antigo e construiu-se uma nova povoação ao lado; os últimos moradores deixaram as casas velhas em 1964."},{"h":"O que ver","t":"A Calle Mayor é a parte mais bem conservada, com casas do século XVI de tijolo, alvenaria e taipa. A partir dela chega-se à igreja de San Martín de Tours, à Torre do Relógio (antiga igreja de San Juan, do século XVI) e aos restos dos conventos de San Agustín e San Rafael. A Torre do Relógio e San Agustín estão classificados como Bien de Interés Cultural (património protegido). Entrava-se no núcleo por dois arcos: o Arco de la Villa, restaurado em 2008, e o Arco de San Roque."},{"h":"Para compreender","t":"O estado das ruínas não se deve apenas à artilharia e à aviação: mais de oitenta anos de abandono fizeram cair muitos muros. Desde 2000 que se consolidam os edifícios mais importantes. Em 2025 visitaram-no cerca de 42 700 pessoas e, em 2026, o Governo de Aragão declarou-o Espaço de Interesse Turístico."}]},"status":"pending"},{"id":"iglesia-san-martin","town":"Belchite","cat":"patrimonio","lat":41.29964,"lon":-0.74548,"coord_src":"https://es.wikipedia.org/wiki/Iglesia_de_San_Mart%C3%ADn_de_Tours_(Belchite_Viejo)","q":["Iglesia de San Martín de Tours, Belchite","San Martín de Tours, Pueblo Viejo de Belchite"],"fq":["Iglesia de San Martín de Tours Belchite","Belchite San Martin church ruins"],"name":{"es":"Iglesia de San Martín de Tours","en":"Church of San Martín de Tours","fr":"Église San Martín de Tours","de":"Kirche San Martín de Tours","pt":"Igreja de San Martín de Tours"},"when":{"es":"Siglos XV-XVIII · Mudéjar en ruinas","en":"15th-18th centuries · Mudéjar ruin","fr":"XVe-XVIIIe siècles · Mudéjar en ruine","de":"15.-18. Jahrhundert · Mudéjar-Ruine","pt":"Séculos XV-XVIII · Mudéjar em ruínas"},"desc":{"es":"La iglesia parroquial del Pueblo Viejo, sin tejado desde la guerra, con su torre mudéjar todavía en pie. Es la imagen más reconocible de Belchite.","en":"The parish church of the Pueblo Viejo, roofless since the war, with its Mudéjar tower still standing. It is the best-known image of Belchite.","fr":"L'église paroissiale du Pueblo Viejo, sans toit depuis la guerre, avec son clocher mudéjar toujours debout. C'est l'image la plus connue de Belchite.","de":"Die Pfarrkirche des Pueblo Viejo, seit dem Krieg ohne Dach, mit ihrem noch stehenden Mudéjar-Turm. Sie ist das bekannteste Bild von Belchite.","pt":"A igreja paroquial do Pueblo Viejo, sem telhado desde a guerra, com a sua torre mudéjar ainda de pé. É a imagem mais reconhecível de Belchite."},"visit":{"es":"Se ve dentro del recorrido guiado del Pueblo Viejo; no se accede por libre. Reserva la visita en belchite.es o en la oficina de turismo.","en":"It is seen as part of the guided tour of the Pueblo Viejo; there is no independent access. Book the tour on belchite.es or at the tourist office.","fr":"Elle se découvre lors de la visite guidée du Pueblo Viejo ; pas d'accès libre. Réservez la visite sur belchite.es ou à l'office de tourisme.","de":"Sie ist Teil der Führung durch das Pueblo Viejo; ein freier Zugang ist nicht möglich. Führung über belchite.es oder beim Fremdenverkehrsamt buchen.","pt":"Vê-se durante a visita guiada ao Pueblo Viejo; não há acesso livre. Reserve a visita em belchite.es ou no posto de turismo."},"src":"https://es.wikipedia.org/wiki/Iglesia_de_San_Mart%C3%ADn_de_Tours_(Belchite_Viejo)","sources":["https://es.wikipedia.org/wiki/Iglesia_de_San_Mart%C3%ADn_de_Tours_(Belchite_Viejo)","https://turismocampodebelchite.es/files/Campo%20de%20Belchite%2006%20Memoria%20de%20la%20contienda.pdf","https://en.wikipedia.org/wiki/Church_of_San_Mart%C3%ADn_de_Tours_(Old_Town_Belchite,_Zaragoza)"],"art":{"es":[{"h":"Historia","t":"El templo se levantó a comienzos del siglo XV como una iglesia gótico-mudéjar de una sola nave, ábside poligonal y bóvedas de crucería. Entre 1550 y 1560 se elevó la nave y se añadió una galería, y en el siglo XVIII se alargó la nave, se reformaron capillas y se abrió una gran portada barroca.\n\nDurante los combates de 1937 quedó muy dañada y después se dejó en ruinas, como el resto del casco viejo. Está declarada Bien de Interés Cultural."},{"h":"Qué ver","t":"Mira primero la torre, adosada al lado sur: tiene planta cuadrada y recuerda a los alminares almohades. El primer cuerpo es casi liso; el segundo se decora con zigzags, esquinillas y rombos de ladrillo; el tercero era el de las campanas y conserva el remate piramidal.\n\nDentro se ven todavía restos de yeserías, la portada barroca y el trazado de la nave. La cubierta ha desaparecido por completo, así que la luz del día entra directamente en toda la nave. Una columna del coro de esta iglesia se trasladó a la plaza central del pueblo nuevo."}],"en":[{"h":"History","t":"The church was built in the early 15th century as a Gothic-Mudéjar church with a single nave, a polygonal apse and rib vaults. Between 1550 and 1560 the nave was raised and a gallery added, and in the 18th century the nave was lengthened, chapels were remodelled and a large Baroque doorway was opened.\n\nDuring the fighting of 1937 it was badly damaged and was later left in ruins, like the rest of the old town. It is listed as a Bien de Interés Cultural."},{"h":"What to see","t":"Look at the tower first, attached to the south side: it has a square plan and recalls Almohad minarets. The first stage is almost plain; the second is decorated with zigzags, small angles and brick lozenges; the third held the bells and keeps its pyramid-shaped top.\n\nInside you can still see remains of plasterwork, the Baroque doorway and the outline of the nave. The roof has gone completely, so daylight falls straight into the whole nave. A column from this church's choir was moved to the main square of the new town."}],"fr":[{"h":"Histoire","t":"L'édifice fut construit au début du XVe siècle comme une église gothique-mudéjare à nef unique, abside polygonale et voûtes d'ogives. Entre 1550 et 1560, la nef fut surélevée et une galerie ajoutée ; au XVIIIe siècle, on allongea la nef, on remania des chapelles et on ouvrit un grand portail baroque.\n\nTrès endommagée lors des combats de 1937, elle fut ensuite laissée en ruine, comme le reste du vieux village. Elle est classée Bien de Interés Cultural."},{"h":"À voir","t":"Regardez d'abord le clocher, accolé au côté sud : de plan carré, il rappelle les minarets almohades. Le premier niveau est presque nu ; le deuxième est orné de zigzags, de petits angles et de losanges en brique ; le troisième abritait les cloches et conserve sa flèche pyramidale.\n\nÀ l'intérieur, on voit encore des restes de stucs, le portail baroque et le tracé de la nef. La toiture a entièrement disparu, si bien que la lumière du jour entre directement dans toute la nef. Une colonne du chœur de cette église a été transférée sur la place centrale du nouveau village."}],"de":[{"h":"Geschichte","t":"Die Kirche entstand Anfang des 15. Jahrhunderts als gotische Mudéjar-Kirche mit einem Schiff, polygonaler Apsis und Kreuzrippengewölben. Zwischen 1550 und 1560 wurde das Schiff erhöht und eine Galerie angefügt; im 18. Jahrhundert verlängerte man das Schiff, baute Kapellen um und öffnete ein großes Barockportal.\n\nIn den Kämpfen von 1937 wurde sie schwer beschädigt und danach, wie der Rest des alten Ortes, als Ruine belassen. Sie steht als Bien de Interés Cultural unter Schutz."},{"h":"Sehenswert","t":"Schauen Sie zuerst auf den Turm an der Südseite: Er hat einen quadratischen Grundriss und erinnert an almohadische Minarette. Das erste Geschoss ist fast schmucklos, das zweite mit Zickzackbändern, kleinen Winkeln und Rauten aus Ziegeln verziert; im dritten hingen die Glocken, und es hat seinen pyramidenförmigen Abschluss bewahrt.\n\nIm Inneren sind noch Reste von Stuck, das Barockportal und der Grundriss des Schiffs zu sehen. Das Dach ist vollständig verschwunden, sodass das Tageslicht direkt in das ganze Schiff fällt. Eine Säule aus dem Chor dieser Kirche wurde auf den zentralen Platz des neuen Dorfes gebracht."}],"pt":[{"h":"História","t":"O templo foi construído no início do século XV como igreja gótico-mudéjar de nave única, abside poligonal e abóbadas de cruzaria. Entre 1550 e 1560 a nave foi elevada e acrescentou-se uma galeria; no século XVIII a nave foi prolongada, remodelaram-se capelas e abriu-se um grande portal barroco.\n\nDurante os combates de 1937 ficou muito danificada e depois foi deixada em ruínas, como o resto do núcleo antigo. Está classificada como Bien de Interés Cultural."},{"h":"O que ver","t":"Olhe primeiro para a torre, adossada ao lado sul: tem planta quadrada e lembra os minaretes almóadas. O primeiro corpo é quase liso; o segundo é decorado com ziguezagues, pequenos ângulos e losangos de tijolo; o terceiro era o dos sinos e conserva o remate piramidal.\n\nNo interior ainda se veem restos de estuques, o portal barroco e o traçado da nave. A cobertura desapareceu por completo, por isso a luz do dia entra diretamente em toda a nave. Uma coluna do coro desta igreja foi levada para a praça central da povoação nova."}]},"status":"pending"},{"id":"el-trujal","town":"Belchite","cat":"memoria","lat":41.30405,"lon":-0.75214,"coord_src":null,"q":["Monumento a los Caídos, Belchite","El Trujal, Belchite"],"fq":["Belchite monumento caidos trujal","Belchite trujal"],"name":{"es":"El Trujal · Monumento a los Caídos","en":"El Trujal · Monument to the Fallen","fr":"El Trujal · Monument aux morts","de":"El Trujal · Denkmal für die Gefallenen","pt":"El Trujal · Monumento aos Caídos"},"when":{"es":"1937 · Fosa y lugar de memoria","en":"1937 · Grave and place of memory","fr":"1937 · Fosse et lieu de mémoire","de":"1937 · Grab und Gedenkort","pt":"1937 · Vala e lugar de memória"},"desc":{"es":"Un antiguo trujal, donde se prensaban uva y aceituna, que durante el asedio se usó como fosa improvisada. Hoy guarda restos de combatientes de los dos bandos y de civiles.","en":"An old press house, where grapes and olives were pressed, that was used as a makeshift grave during the siege. Today it holds the remains of combatants from both sides and of civilians.","fr":"Un ancien pressoir, où l'on pressait raisin et olives, utilisé comme fosse improvisée pendant le siège. Il abrite aujourd'hui les restes de combattants des deux camps et de civils.","de":"Eine alte Kelter, in der Trauben und Oliven gepresst wurden und die während der Belagerung als behelfsmäßiges Grab diente. Heute ruhen hier Kämpfer beider Seiten und Zivilisten.","pt":"Um antigo lagar, onde se prensavam uva e azeitona, que durante o cerco foi usado como vala improvisada. Hoje guarda restos de combatentes dos dois lados e de civis."},"visit":{"es":"Está en el entorno del Pueblo Viejo. Pregunta en la oficina de turismo o durante la visita guiada cómo acercarte. Es un lugar de enterramiento: se visita en silencio y con respeto.","en":"It lies close to the Pueblo Viejo. Ask at the tourist office or during the guided tour how to get there. It is a burial place: visit it quietly and respectfully.","fr":"Il se trouve aux abords du Pueblo Viejo. Demandez à l'office de tourisme ou pendant la visite guidée comment vous en approcher. C'est un lieu de sépulture : visitez-le en silence et avec respect.","de":"Sie liegt im Umfeld des Pueblo Viejo. Fragen Sie beim Fremdenverkehrsamt oder während der Führung, wie Sie hinkommen. Es ist eine Grabstätte: Besuchen Sie sie still und respektvoll.","pt":"Fica nas imediações do Pueblo Viejo. Pergunte no posto de turismo ou durante a visita guiada como lá chegar. É um lugar de sepultura: visite-o em silêncio e com respeito."},"src":"https://turismocampodebelchite.es/files/Campo%20de%20Belchite%2006%20Memoria%20de%20la%20contienda.pdf","sources":["https://turismocampodebelchite.es/files/Campo%20de%20Belchite%2006%20Memoria%20de%20la%20contienda.pdf","https://es.wikipedia.org/wiki/Belchite"],"art":{"es":[{"h":"Historia","t":"El Trujal era una instalación agrícola: una prensa para la uva y la aceituna, una de las bases de la economía del pueblo. Durante el asedio de agosto y septiembre de 1937 se utilizó como fosa común improvisada.\n\nCon el tiempo el lugar se convirtió en el Monumento a los Caídos de Belchite. Según la comarca, reúne los restos de combatientes de ambos bandos y de vecinos civiles muertos durante la batalla."},{"h":"Para entenderlo","t":"La batalla de Belchite dejó, según las cifras que maneja la comarca, más de 5.000 bajas entre militares de los dos ejércitos y población civil. Belchite tenía casi 4.000 habitantes en 1936; en el primer año de guerra la cifra bajó a unos 2.600 por la represión y los desplazamientos.\n\nEsos vecinos vivieron el cerco dentro del pueblo, junto a los defensores. El Trujal reúne en un mismo lugar a combatientes de los dos ejércitos y a vecinos, y por eso es un buen sitio para detenerse a pensar en todas las víctimas de la batalla. Recuerda que es un lugar de enterramiento."}],"en":[{"h":"History","t":"El Trujal was a farm building: a press for grapes and olives, one of the mainstays of the town's economy. During the siege of August and September 1937 it was used as a makeshift mass grave.\n\nOver time the site became Belchite's Monument to the Fallen. According to the comarca, it holds the remains of combatants from both sides and of civilian residents killed during the battle."},{"h":"Understanding it","t":"According to the figures used by the comarca, the Battle of Belchite left more than 5,000 casualties among soldiers of both armies and civilians. Belchite had almost 4,000 inhabitants in 1936; in the first year of the war the figure fell to about 2,600 because of repression and displacement.\n\nThose residents lived through the siege inside the town, alongside the defenders. El Trujal brings together combatants from both armies and townspeople in one place, which makes it a good spot to stop and think about all the victims of the battle. Remember that it is a burial place."}],"fr":[{"h":"Histoire","t":"El Trujal était une installation agricole : un pressoir à raisin et à olives, l'un des piliers de l'économie du village. Pendant le siège d'août et septembre 1937, il servit de fosse commune improvisée.\n\nAvec le temps, le lieu est devenu le Monument aux morts de Belchite. Selon la comarca, il réunit les restes de combattants des deux camps et d'habitants civils tués pendant la bataille."},{"h":"Pour comprendre","t":"Selon les chiffres retenus par la comarca, la bataille de Belchite fit plus de 5 000 victimes parmi les militaires des deux armées et la population civile. Belchite comptait près de 4 000 habitants en 1936 ; pendant la première année de guerre, ce chiffre tomba à environ 2 600 en raison de la répression et des déplacements.\n\nCes habitants vécurent le siège à l'intérieur du village, aux côtés des défenseurs. El Trujal rassemble en un même lieu des combattants des deux armées et des habitants : c'est un bon endroit pour s'arrêter et penser à toutes les victimes de la bataille. N'oubliez pas qu'il s'agit d'un lieu de sépulture."}],"de":[{"h":"Geschichte","t":"El Trujal war eine landwirtschaftliche Anlage: eine Presse für Trauben und Oliven, eine der Grundlagen der örtlichen Wirtschaft. Während der Belagerung im August und September 1937 diente sie als behelfsmäßiges Massengrab.\n\nMit der Zeit wurde der Ort zum Denkmal für die Gefallenen von Belchite. Nach Angaben der Comarca ruhen hier Kämpfer beider Seiten und zivile Einwohner, die während der Schlacht ums Leben kamen."},{"h":"Zum Verständnis","t":"Nach den Zahlen der Comarca forderte die Schlacht von Belchite mehr als 5.000 Opfer unter den Soldaten beider Armeen und der Zivilbevölkerung. Belchite hatte 1936 fast 4.000 Einwohner; im ersten Kriegsjahr sank die Zahl durch Repression und Vertreibung auf etwa 2.600.\n\nDiese Einwohner erlebten die Belagerung im Ort, an der Seite der Verteidiger. El Trujal vereint Kämpfer beider Armeen und Dorfbewohner an einem Ort und ist deshalb ein guter Platz, um innezuhalten und an alle Opfer der Schlacht zu denken. Denken Sie daran, dass es eine Grabstätte ist."}],"pt":[{"h":"História","t":"El Trujal era uma instalação agrícola: uma prensa para uva e azeitona, uma das bases da economia da terra. Durante o cerco de agosto e setembro de 1937 foi utilizado como vala comum improvisada.\n\nCom o tempo, o lugar tornou-se o Monumento aos Caídos de Belchite. Segundo a comarca, reúne os restos de combatentes dos dois lados e de habitantes civis mortos durante a batalha."},{"h":"Para compreender","t":"Segundo os números usados pela comarca, a batalha de Belchite causou mais de 5000 baixas entre militares dos dois exércitos e população civil. Belchite tinha quase 4000 habitantes em 1936; no primeiro ano de guerra o número desceu para cerca de 2600, devido à repressão e às deslocações.\n\nEsses habitantes viveram o cerco dentro da localidade, ao lado dos defensores. El Trujal reúne no mesmo lugar combatentes dos dois exércitos e moradores, e por isso é um bom sítio para parar e pensar em todas as vítimas da batalha. Lembre-se de que é um lugar de sepultura."}]},"status":"pending"},{"id":"pueblo-nuevo","town":"Belchite","cat":"memoria","lat":41.30654,"lon":-0.75464,"coord_src":"https://es.wikipedia.org/wiki/Belchite","q":["Plaza de la Bola, Belchite","Iglesia de San Martín de Tours, Belchite Pueblo Nuevo"],"fq":["Belchite pueblo nuevo","Belchite Regiones Devastadas"],"name":{"es":"Pueblo Nuevo de Belchite","en":"New Town of Belchite (Pueblo Nuevo)","fr":"Nouveau village de Belchite (Pueblo Nuevo)","de":"Neues Dorf von Belchite (Pueblo Nuevo)","pt":"Aldeia Nova de Belchite (Pueblo Nuevo)"},"when":{"es":"1940-1954 · Regiones Devastadas","en":"1940-1954 · Regiones Devastadas","fr":"1940-1954 · Regiones Devastadas","de":"1940-1954 · Regiones Devastadas","pt":"1940-1954 · Regiones Devastadas"},"desc":{"es":"El Belchite donde se vive hoy, levantado junto a las ruinas después de la guerra. Su trazado y sus edificios cuentan cómo se planificó la posguerra y quién trabajó en su construcción.","en":"The Belchite where people live today, built next to the ruins after the war. Its layout and buildings tell you how the post-war period was planned and who worked on its construction.","fr":"Le Belchite où l'on vit aujourd'hui, bâti à côté des ruines après la guerre. Son plan et ses bâtiments racontent comment fut organisé l'après-guerre et qui travailla à sa construction.","de":"Das Belchite, in dem heute gelebt wird, nach dem Krieg neben den Ruinen errichtet. Grundriss und Gebäude zeigen, wie die Nachkriegszeit geplant wurde und wer am Bau arbeitete.","pt":"A Belchite onde hoje se vive, construída ao lado das ruínas depois da guerra. O seu traçado e os seus edifícios contam como se planeou o pós-guerra e quem trabalhou na sua construção."},"visit":{"es":"Se recorre libremente a pie. Empieza en la Plaza de la Bola y sigue hasta la iglesia y la antigua Granja Escuela. La oficina de turismo está en la Ronda Zaragoza.","en":"Free to explore on foot. Start at the Plaza de la Bola and carry on to the church and the former Granja Escuela. The tourist office is on Ronda Zaragoza.","fr":"Visite libre à pied. Commencez par la Plaza de la Bola et continuez jusqu'à l'église et l'ancienne Granja Escuela. L'office de tourisme se trouve Ronda Zaragoza.","de":"Frei zu Fuß zu erkunden. Beginnen Sie an der Plaza de la Bola und gehen Sie weiter zur Kirche und zur ehemaligen Granja Escuela. Das Fremdenverkehrsamt liegt an der Ronda Zaragoza.","pt":"Percorre-se livremente a pé. Comece na Plaza de la Bola e siga até à igreja e à antiga Granja Escuela. O posto de turismo fica na Ronda Zaragoza."},"src":"https://turismocampodebelchite.es/files/Campo%20de%20Belchite%2006%20Memoria%20de%20la%20contienda.pdf","sources":["https://turismocampodebelchite.es/files/Campo%20de%20Belchite%2006%20Memoria%20de%20la%20contienda.pdf","https://es.wikipedia.org/wiki/Belchite","https://www.publico.es/politica/belchite-franco-mintio-pueblo-vio-5000-muertes.html","https://turismocampodebelchite.es/eng/belchite/l.205"],"art":{"es":[{"h":"Historia","t":"Por decreto de 7 de octubre de 1939, Belchite fue 'adoptado' por Franco y su reconstrucción se encargó a la Dirección General de Regiones Devastadas. En lugar de rehacer el casco antiguo, se decidió construir un pueblo nuevo al lado. La primera piedra se colocó a finales de mayo de 1940 y la inauguración oficial fue el 13 de octubre de 1954.\n\nEn las obras trabajó un destacamento de alrededor de mil presos republicanos. La comarca recoge que una amnistía de 1945 puso fin a su condición de penados en la obra, aunque muchos siguieron trabajando en libertad condicional. Las familias se trasladaron poco a poco; las últimas dejaron el Pueblo Viejo en 1964."},{"h":"Qué ver","t":"La Plaza de la Bola pertenece a la primera fase de obras (1944-1954). En la plaza central se colocó una columna procedente del coro de la iglesia vieja de San Martín. La nueva iglesia parroquial, también dedicada a San Martín de Tours, es neorrománica y tiene una torre de 47 metros.\n\nAl norte del casco está la antigua Granja Escuela, que perteneció a la Sección Femenina y hoy alberga el Museo Etnológico y el Centro de Interpretación de las Estepas."}],"en":[{"h":"History","t":"By a decree of 7 October 1939, Belchite was 'adopted' by Franco and its reconstruction was entrusted to the Dirección General de Regiones Devastadas (the state body for devastated areas). Instead of rebuilding the old town, it was decided to build a new town alongside. The foundation stone was laid at the end of May 1940 and the official inauguration took place on 13 October 1954.\n\nA detachment of around a thousand Republican prisoners worked on the building site. The comarca records that an amnesty in 1945 ended their status as convict labour, although many carried on working on conditional release. Families moved little by little; the last ones left the Pueblo Viejo in 1964."},{"h":"What to see","t":"The Plaza de la Bola belongs to the first building phase (1944-1954). A column from the choir of the old church of San Martín was placed in the main square. The new parish church, also dedicated to San Martín de Tours, is Neo-Romanesque and has a 47-metre tower.\n\nTo the north of the town is the former Granja Escuela (farm school), which belonged to the Sección Femenina and now houses the Ethnological Museum and the Steppe Interpretation Centre."}],"fr":[{"h":"Histoire","t":"Par un décret du 7 octobre 1939, Belchite fut « adopté » par Franco et sa reconstruction confiée à la Dirección General de Regiones Devastadas (l'organisme d'État chargé des zones dévastées). Plutôt que de reconstruire le vieux village, on décida d'en bâtir un nouveau juste à côté. La première pierre fut posée fin mai 1940 et l'inauguration officielle eut lieu le 13 octobre 1954.\n\nUn détachement d'environ mille prisonniers républicains travailla sur le chantier. La comarca rapporte qu'une amnistie de 1945 mit fin à leur statut de condamnés sur le chantier, même si beaucoup continuèrent à y travailler en liberté conditionnelle. Les familles s'installèrent peu à peu ; les dernières quittèrent le Pueblo Viejo en 1964."},{"h":"À voir","t":"La Plaza de la Bola appartient à la première phase des travaux (1944-1954). Sur la place centrale fut installée une colonne provenant du chœur de l'ancienne église San Martín. La nouvelle église paroissiale, elle aussi dédiée à saint Martin de Tours, est néo-romane et possède une tour de 47 mètres.\n\nAu nord du village se trouve l'ancienne Granja Escuela (ferme-école), qui appartenait à la Sección Femenina et abrite aujourd'hui le Musée ethnologique et le Centre d'interprétation des steppes."}],"de":[{"h":"Geschichte","t":"Mit einem Dekret vom 7. Oktober 1939 wurde Belchite von Franco 'adoptiert', und der Wiederaufbau wurde der Dirección General de Regiones Devastadas (der staatlichen Behörde für zerstörte Gebiete) übertragen. Statt den alten Ort wiederherzustellen, entschied man sich, daneben ein neues Dorf zu bauen. Der Grundstein wurde Ende Mai 1940 gelegt, die offizielle Einweihung fand am 13. Oktober 1954 statt.\n\nAuf der Baustelle arbeitete eine Abteilung von rund tausend republikanischen Gefangenen. Die Comarca berichtet, dass eine Amnestie 1945 ihren Status als Strafgefangene auf der Baustelle beendete, viele aber auf Bewährung weiterarbeiteten. Die Familien zogen nach und nach um; die letzten verließen das Pueblo Viejo 1964."},{"h":"Sehenswert","t":"Die Plaza de la Bola gehört zur ersten Bauphase (1944-1954). Auf dem zentralen Platz wurde eine Säule aus dem Chor der alten Kirche San Martín aufgestellt. Die neue Pfarrkirche, ebenfalls dem heiligen Martin von Tours geweiht, ist neoromanisch und hat einen 47 Meter hohen Turm.\n\nIm Norden des Ortes liegt die ehemalige Granja Escuela (landwirtschaftliche Schule), die der Sección Femenina gehörte und heute das Ethnologische Museum und das Steppen-Informationszentrum beherbergt."}],"pt":[{"h":"História","t":"Por decreto de 7 de outubro de 1939, Belchite foi 'adotada' por Franco e a sua reconstrução foi entregue à Dirección General de Regiones Devastadas (o organismo estatal para as zonas devastadas). Em vez de reconstruir o núcleo antigo, decidiu-se construir uma nova povoação ao lado. A primeira pedra foi lançada no final de maio de 1940 e a inauguração oficial realizou-se a 13 de outubro de 1954.\n\nNas obras trabalhou um destacamento de cerca de mil presos republicanos. A comarca refere que uma amnistia de 1945 pôs fim à sua condição de condenados na obra, embora muitos tenham continuado a trabalhar em liberdade condicional. As famílias mudaram-se aos poucos; as últimas deixaram o Pueblo Viejo em 1964."},{"h":"O que ver","t":"A Plaza de la Bola pertence à primeira fase das obras (1944-1954). Na praça central foi colocada uma coluna proveniente do coro da igreja velha de San Martín. A nova igreja paroquial, também dedicada a São Martinho de Tours, é neorromânica e tem uma torre de 47 metros.\n\nA norte da povoação fica a antiga Granja Escuela (quinta-escola), que pertenceu à Sección Femenina e hoje acolhe o Museu Etnológico e o Centro de Interpretação das Estepes."}]},"status":"pending"},{"id":"campo-rusia","town":"Belchite","cat":"memoria","lat":41.29194,"lon":-0.73056,"coord_src":"https://turismocampodebelchite.es/files/Campo%20de%20Belchite%2006%20Memoria%20de%20la%20contienda.pdf","q":["Campo de Rusia, Belchite","Ermita de la Virgen de los Desamparados, Belchite"],"fq":["Belchite campo Rusia","Belchite barracones Rusia"],"name":{"es":"Campo de desplazados 'Rusia'","en":"'Rusia' displaced persons' camp","fr":"Camp de déplacés « Rusia »","de":"Lager für Vertriebene 'Rusia'","pt":"Campo de deslocados 'Rusia'"},"when":{"es":"Posguerra · Barracones junto al Aguasvivas","en":"Post-war · Huts by the Aguasvivas","fr":"Après-guerre · Baraquements près de l'Aguasvivas","de":"Nachkriegszeit · Baracken am Aguasvivas","pt":"Pós-guerra · Barracões junto ao Aguasvivas"},"desc":{"es":"Restos de los barracones donde, tras la guerra, vivieron presos republicanos y familias de vecinos represaliados mientras se construía el pueblo nuevo. Es una parte de la historia de Belchite que durante décadas se contó poco.","en":"The remains of the huts where, after the war, Republican prisoners and the families of persecuted townspeople lived while the new town was being built. It is a part of Belchite's history that was rarely told for decades.","fr":"Les vestiges des baraquements où, après la guerre, vécurent des prisonniers républicains et des familles d'habitants victimes de la répression pendant la construction du nouveau village. Une part de l'histoire de Belchite longtemps peu racontée.","de":"Reste der Baracken, in denen nach dem Krieg republikanische Gefangene und Familien verfolgter Einwohner lebten, während das neue Dorf gebaut wurde. Ein Teil der Geschichte Belchites, über den jahrzehntelang wenig gesprochen wurde.","pt":"Restos dos barracões onde, depois da guerra, viveram presos republicanos e famílias de habitantes perseguidos enquanto se construía a povoação nova. É uma parte da história de Belchite de que durante décadas pouco se falou."},"visit":{"es":"Está fuera del casco, junto a la carretera A-222 y cerca del antiguo Seminario. No tiene equipamiento ni horario: se ve desde el exterior. Pregunta en la oficina de turismo cómo llegar y no entres en fincas privadas.","en":"It lies outside the town, by the A-222 road and near the former Seminary. There are no facilities or opening times: it is seen from outside. Ask at the tourist office how to get there and do not enter private land.","fr":"Il se trouve hors du village, au bord de la route A-222, près de l'ancien Séminaire. Pas d'aménagement ni d'horaires : il se voit de l'extérieur. Demandez le chemin à l'office de tourisme et n'entrez pas dans les propriétés privées.","de":"Es liegt außerhalb des Ortes, an der Straße A-222 und nahe dem ehemaligen Seminar. Es gibt keine Einrichtungen und keine Öffnungszeiten: Man sieht es von außen. Fragen Sie beim Fremdenverkehrsamt nach dem Weg und betreten Sie kein Privatgelände.","pt":"Fica fora da povoação, junto à estrada A-222 e perto do antigo Seminário. Não tem equipamentos nem horário: vê-se do exterior. Pergunte no posto de turismo como lá chegar e não entre em propriedades privadas."},"src":"https://turismocampodebelchite.es/files/Campo%20de%20Belchite%2006%20Memoria%20de%20la%20contienda.pdf","sources":["https://turismocampodebelchite.es/files/Campo%20de%20Belchite%2006%20Memoria%20de%20la%20contienda.pdf","https://es.wikipedia.org/wiki/Belchite","https://www.publico.es/politica/belchite-franco-mintio-pueblo-vio-5000-muertes.html","https://lamagiadeviajar.com/wp-content/uploads/2024/01/belchitemagia141.pdf"],"art":{"es":[{"h":"Historia","t":"Al terminar la guerra, Belchite tenía el casco viejo arrasado y muchos vecinos sin casa. En un meandro del río Aguasvivas, cerca de la ermita de la Virgen de los Desamparados, se levantaron quince barracones; la Wikipedia en español atribuye su construcción a Auxilio Social. El lugar empezó a llamarse 'Rusia' o 'la pequeña Rusia'.\n\nSegún la comarca, allí se alojó a familias republicanas y a familiares de presos republicanos, y los presos fueron obligados a trabajar en los primeros años de la construcción del pueblo nuevo. La Wikipedia sitúa su funcionamiento entre 1940 y 1945."},{"h":"Para entenderlo","t":"El historiador Stéphane Michonneau ha estudiado cómo Belchite ha recordado su pasado en el libro 'Fue ayer: Belchite. Un pueblo frente a la cuestión del pasado' (Prensas de la Universidad de Zaragoza). Durante décadas se habló poco de este campo, y sus restos son hoy escasos. Está cerca del antiguo Seminario, otra de las posiciones de la batalla que recoge la comarca.\n\nMirarlos ayuda a entender que el pueblo nuevo no se hizo solo con planos y ladrillos: en los primeros años también se levantó con el trabajo forzado de presos republicanos."}],"en":[{"h":"History","t":"When the war ended, Belchite's old town lay in ruins and many residents had no home. In a meander of the River Aguasvivas, near the hermitage of the Virgen de los Desamparados, fifteen huts were put up; the Spanish Wikipedia attributes their construction to Auxilio Social. The place came to be known as 'Rusia' or 'little Russia'.\n\nAccording to the comarca, Republican families and relatives of Republican prisoners were housed there, and the prisoners were forced to work during the first years of building the new town. Wikipedia dates its use to between 1940 and 1945."},{"h":"Understanding it","t":"The historian Stéphane Michonneau has studied how Belchite has remembered its past in the book 'Fue ayer: Belchite. Un pueblo frente a la cuestión del pasado' (Prensas de la Universidad de Zaragoza). For decades little was said about this camp, and few remains survive today. It is close to the former Seminary, another of the battle positions listed by the comarca.\n\nLooking at them helps you understand that the new town was not made only with plans and bricks: in its early years it was also built with the forced labour of Republican prisoners."}],"fr":[{"h":"Histoire","t":"À la fin de la guerre, le vieux Belchite était rasé et de nombreux habitants n'avaient plus de maison. Dans un méandre de l'Aguasvivas, près de l'ermitage de la Virgen de los Desamparados, quinze baraquements furent montés ; la Wikipédia en espagnol attribue leur construction à l'Auxilio Social. Le lieu prit le nom de « Rusia » ou « petite Russie ».\n\nSelon la comarca, on y logea des familles républicaines et des proches de prisonniers républicains, et les prisonniers furent contraints de travailler pendant les premières années de construction du nouveau village. Wikipédia situe son fonctionnement entre 1940 et 1945."},{"h":"Pour comprendre","t":"L'historien Stéphane Michonneau a étudié la manière dont Belchite se souvient de son passé dans le livre « Fue ayer: Belchite. Un pueblo frente a la cuestión del pasado » (Prensas de la Universidad de Zaragoza). Pendant des décennies, on a peu parlé de ce camp, et il en reste aujourd'hui peu de traces. Il est proche de l'ancien Séminaire, autre position de la bataille répertoriée par la comarca.\n\nLes regarder aide à comprendre que le nouveau village ne s'est pas fait seulement avec des plans et des briques : dans ses premières années, il a aussi été bâti grâce au travail forcé de prisonniers républicains."}],"de":[{"h":"Geschichte","t":"Bei Kriegsende lag der alte Ortskern von Belchite in Trümmern, und viele Einwohner hatten kein Zuhause. In einer Flussschleife des Aguasvivas, nahe der Einsiedelei der Virgen de los Desamparados, wurden fünfzehn Baracken errichtet; die spanische Wikipedia schreibt ihren Bau dem Auxilio Social zu. Der Ort wurde bald 'Rusia' oder 'Klein-Russland' genannt.\n\nNach Angaben der Comarca wurden dort republikanische Familien und Angehörige republikanischer Gefangener untergebracht, und die Gefangenen mussten in den ersten Jahren beim Bau des neuen Dorfes Zwangsarbeit leisten. Wikipedia datiert den Betrieb auf die Jahre 1940 bis 1945."},{"h":"Zum Verständnis","t":"Der Historiker Stéphane Michonneau hat in dem Buch 'Fue ayer: Belchite. Un pueblo frente a la cuestión del pasado' (Prensas de la Universidad de Zaragoza) untersucht, wie Belchite sich an seine Vergangenheit erinnert. Jahrzehntelang wurde über dieses Lager wenig gesprochen, und heute sind nur wenige Reste erhalten. Es liegt nahe dem ehemaligen Seminar, einer weiteren Stellung der Schlacht, die die Comarca verzeichnet.\n\nDer Blick auf diese Reste hilft zu verstehen, dass das neue Dorf nicht nur aus Plänen und Ziegeln entstand: In den ersten Jahren wurde es auch durch die Zwangsarbeit republikanischer Gefangener gebaut."}],"pt":[{"h":"História","t":"No fim da guerra, Belchite tinha o núcleo antigo arrasado e muitos habitantes sem casa. Num meandro do rio Aguasvivas, perto da ermida da Virgen de los Desamparados, ergueram-se quinze barracões; a Wikipédia em espanhol atribui a sua construção ao Auxilio Social. O lugar passou a chamar-se 'Rusia' ou 'a pequena Rússia'.\n\nSegundo a comarca, ali foram alojadas famílias republicanas e familiares de presos republicanos, e os presos foram obrigados a trabalhar nos primeiros anos da construção da povoação nova. A Wikipédia situa o seu funcionamento entre 1940 e 1945."},{"h":"Para compreender","t":"O historiador Stéphane Michonneau estudou a forma como Belchite recorda o seu passado no livro 'Fue ayer: Belchite. Un pueblo frente a la cuestión del pasado' (Prensas de la Universidad de Zaragoza). Durante décadas pouco se falou deste campo, e hoje restam poucos vestígios. Fica perto do antigo Seminário, outra das posições da batalha registadas pela comarca.\n\nOlhar para eles ajuda a perceber que a povoação nova não se fez apenas com plantas e tijolos: nos primeiros anos foi também construída com o trabalho forçado de presos republicanos."}]},"status":"pending"},{"id":"posiciones-saso","town":"Belchite","cat":"memoria","lat":41.30417,"lon":-0.72528,"coord_src":"https://turismocampodebelchite.es/files/Campo%20de%20Belchite%2006%20Memoria%20de%20la%20contienda.pdf","q":["Posiciones del Saso, Belchite","Carretera A-222 Belchite Azaila"],"fq":["Belchite Saso bunker","Belchite trincheras guerra civil"],"name":{"es":"Posiciones defensivas del Saso","en":"El Saso defensive positions","fr":"Positions défensives d'El Saso","de":"Verteidigungsstellungen von El Saso","pt":"Posições defensivas de El Saso"},"when":{"es":"1937 · Nidos de ametralladora y búnkeres","en":"1937 · Machine-gun nests and bunkers","fr":"1937 · Nids de mitrailleuse et bunkers","de":"1937 · MG-Nester und Bunker","pt":"1937 · Ninhos de metralhadora e bunkers"},"desc":{"es":"Restos de fortificaciones entre campos de cereal al este de Belchite: un nido de ametralladora de hormigón, un túnel bajo el cerro y dos búnkeres. Formaban parte de la defensa del pueblo en 1937.","en":"The remains of fortifications among cereal fields east of Belchite: a concrete machine-gun nest, a tunnel under the hill and two bunkers. They were part of the town's defences in 1937.","fr":"Vestiges de fortifications au milieu des champs de céréales, à l'est de Belchite : un nid de mitrailleuse en béton, un tunnel sous la colline et deux bunkers. Ils faisaient partie de la défense du village en 1937.","de":"Reste von Befestigungen zwischen Getreidefeldern östlich von Belchite: ein MG-Nest aus Beton, ein Tunnel unter dem Hügel und zwei Bunker. Sie gehörten 1937 zur Verteidigung des Ortes.","pt":"Restos de fortificações entre campos de cereal a leste de Belchite: um ninho de metralhadora de betão, um túnel sob o cerro e dois bunkers. Faziam parte da defesa da localidade em 1937."},"visit":{"es":"Acceso libre por pista, a la izquierda de la carretera de Azaila, junto al punto limpio; los dos búnkeres quedan al otro lado de la carretera. Lleva calzado cerrado, no te metas en el túnel y no muevas ningún resto.","en":"Open access along a track, on the left of the Azaila road, next to the recycling point; the two bunkers are on the other side of the road. Wear closed shoes, do not go into the tunnel and do not move any remains.","fr":"Accès libre par une piste, à gauche de la route d'Azaila, à côté de la déchetterie ; les deux bunkers sont de l'autre côté de la route. Portez des chaussures fermées, n'entrez pas dans le tunnel et ne déplacez aucun vestige.","de":"Frei zugänglich über einen Feldweg links der Straße nach Azaila, neben dem Wertstoffhof; die beiden Bunker liegen auf der anderen Straßenseite. Festes Schuhwerk tragen, nicht in den Tunnel gehen und keine Überreste bewegen.","pt":"Acesso livre por um caminho de terra, à esquerda da estrada de Azaila, junto ao ecocentro; os dois bunkers ficam do outro lado da estrada. Use calçado fechado, não entre no túnel e não mexa em nenhum vestígio."},"src":"https://turismocampodebelchite.es/eng/posiciones-defensivas-del-saso/l.5","sources":["https://turismocampodebelchite.es/eng/posiciones-defensivas-del-saso/l.5","https://turismocampodebelchite.es/files/Campo%20de%20Belchite%2006%20Memoria%20de%20la%20contienda.pdf","https://es.wikipedia.org/wiki/Codo_(Zaragoza)","https://en.wikipedia.org/wiki/Battle_of_Belchite_(1937)"],"art":{"es":[{"h":"Historia","t":"Cuando empezó la ofensiva republicana, en agosto de 1937, Belchite estaba rodeado de posiciones fortificadas por el bando sublevado. La del Saso está al este del pueblo, en dirección a Codo. La comarca la describe como una posición muy importante en la defensa de Belchite.\n\nLas tropas republicanas avanzaron desde Codo, que ocuparon el 24 de agosto. Ese mismo día, en Codo, murieron más de 140 de los 182 jóvenes del Tercio de Montserrat, en su mayoría catalanes, que combatían en el bando sublevado. Los combates en el entorno de Belchite se prolongaron hasta el 6 de septiembre."},{"h":"Qué ver","t":"En la posición principal se reconoce un nido de ametralladora circular de cemento y la boca de un túnel que atraviesa el cerro en dirección a Codo. Desde arriba se ve un olivar y, en el horizonte, Codo y la estepa de El Planerón. Al otro lado de la carretera, mirando al Aguasvivas y a la carretera de Lécera, quedan dos búnkeres.\n\nCerca de Codo, en el Calvario, hay otras posiciones defensivas recogidas por la comarca. Según la Wikipedia en inglés, las posiciones del Saso y del Seminario, del bando sublevado, se conservan y se pueden visitar."}],"en":[{"h":"History","t":"When the Republican offensive began in August 1937, Belchite was surrounded by positions fortified by the rebel side. El Saso lies east of the town, towards Codo. The comarca describes it as a very important position in the defence of Belchite.\n\nRepublican troops advanced from Codo, which they took on 24 August. That same day, in Codo, more than 140 of the 182 young men of the Tercio de Montserrat, most of them Catalans, fighting on the rebel side, were killed. The fighting around Belchite went on until 6 September."},{"h":"What to see","t":"At the main position you can make out a circular cement machine-gun nest and the mouth of a tunnel that runs through the hill towards Codo. From the top you can see an olive grove and, on the horizon, Codo and the El Planerón steppe. On the other side of the road, facing the Aguasvivas and the Lécera road, two bunkers survive.\n\nNear Codo, at El Calvario, there are other defensive positions listed by the comarca. According to the English Wikipedia, the rebel positions at El Saso and the Seminary are preserved and can be visited."}],"fr":[{"h":"Histoire","t":"Au début de l'offensive républicaine, en août 1937, Belchite était entouré de positions fortifiées par le camp insurgé. Celle d'El Saso se trouve à l'est du village, en direction de Codo. La comarca la décrit comme une position très importante dans la défense de Belchite.\n\nLes troupes républicaines avancèrent depuis Codo, qu'elles occupèrent le 24 août. Ce même jour, à Codo, plus de 140 des 182 jeunes du Tercio de Montserrat, pour la plupart catalans, qui combattaient dans le camp insurgé, trouvèrent la mort. Les combats autour de Belchite se prolongèrent jusqu'au 6 septembre."},{"h":"À voir","t":"Sur la position principale, on reconnaît un nid de mitrailleuse circulaire en ciment et l'entrée d'un tunnel qui traverse la colline en direction de Codo. D'en haut, on voit une oliveraie et, à l'horizon, Codo et la steppe d'El Planerón. De l'autre côté de la route, face à l'Aguasvivas et à la route de Lécera, subsistent deux bunkers.\n\nPrès de Codo, au Calvario, se trouvent d'autres positions défensives répertoriées par la comarca. Selon la Wikipédia en anglais, les positions insurgées d'El Saso et du Séminaire sont conservées et peuvent se visiter."}],"de":[{"h":"Geschichte","t":"Als die republikanische Offensive im August 1937 begann, war Belchite von Stellungen umgeben, die die aufständische Seite befestigt hatte. Die Stellung von El Saso liegt östlich des Ortes, in Richtung Codo. Die Comarca beschreibt sie als sehr wichtige Stellung bei der Verteidigung von Belchite.\n\nDie republikanischen Truppen rückten von Codo aus vor, das sie am 24. August einnahmen. Am selben Tag kamen in Codo mehr als 140 der 182 jungen Männer des Tercio de Montserrat ums Leben, überwiegend Katalanen, die auf aufständischer Seite kämpften. Die Kämpfe um Belchite dauerten bis zum 6. September."},{"h":"Sehenswert","t":"An der Hauptstellung erkennt man ein rundes MG-Nest aus Zement und den Eingang eines Tunnels, der den Hügel in Richtung Codo durchquert. Von oben sieht man einen Olivenhain und am Horizont Codo und die Steppe von El Planerón. Auf der anderen Straßenseite, mit Blick auf den Aguasvivas und die Straße nach Lécera, sind zwei Bunker erhalten.\n\nBei Codo, am Calvario, gibt es weitere Verteidigungsstellungen, die die Comarca verzeichnet. Laut der englischen Wikipedia sind die aufständischen Stellungen von El Saso und am Seminar erhalten und können besichtigt werden."}],"pt":[{"h":"História","t":"Quando começou a ofensiva republicana, em agosto de 1937, Belchite estava rodeada de posições fortificadas pelo lado sublevado. A de El Saso fica a leste da localidade, em direção a Codo. A comarca descreve-a como uma posição muito importante na defesa de Belchite.\n\nAs tropas republicanas avançaram a partir de Codo, que ocuparam a 24 de agosto. Nesse mesmo dia, em Codo, morreram mais de 140 dos 182 jovens do Tercio de Montserrat, na sua maioria catalães, que combatiam do lado sublevado. Os combates nos arredores de Belchite prolongaram-se até 6 de setembro."},{"h":"O que ver","t":"Na posição principal reconhece-se um ninho de metralhadora circular de cimento e a entrada de um túnel que atravessa o cerro em direção a Codo. Lá de cima vê-se um olival e, no horizonte, Codo e a estepe de El Planerón. Do outro lado da estrada, virados para o Aguasvivas e para a estrada de Lécera, restam dois bunkers.\n\nPerto de Codo, no Calvario, há outras posições defensivas registadas pela comarca. Segundo a Wikipédia em inglês, as posições sublevadas de El Saso e do Seminário estão conservadas e podem ser visitadas."}]},"status":"pending"},{"id":"santuario-pueyo","town":"Belchite","cat":"patrimonio","lat":41.31346,"lon":-0.7944,"coord_src":null,"q":["Santuario de Nuestra Señora del Pueyo, Belchite","Ermita del Pueyo, Belchite"],"fq":["Santuario del Pueyo Belchite","Virgen del Pueyo Belchite"],"name":{"es":"Santuario de Nuestra Señora del Pueyo","en":"Sanctuary of Nuestra Señora del Pueyo","fr":"Sanctuaire de Nuestra Señora del Pueyo","de":"Heiligtum Nuestra Señora del Pueyo","pt":"Santuário de Nuestra Señora del Pueyo"},"when":{"es":"Barroco · Cerro con poblado antiguo","en":"Baroque · Hill with an ancient settlement","fr":"Baroque · Colline et site antique","de":"Barock · Hügel mit antiker Siedlung","pt":"Barroco · Cerro com povoado antigo"},"desc":{"es":"El santuario de la patrona de Belchite, sobre un cerro a las afueras del pueblo. Bajo él y a su alrededor hay restos de un poblado celtibérico y romano.","en":"The sanctuary of Belchite's patron saint, on a hill on the outskirts of the town. Beneath and around it lie the remains of a Celtiberian and Roman settlement.","fr":"Le sanctuaire de la patronne de Belchite, sur une colline aux abords du village. Sous l'édifice et tout autour se trouvent les vestiges d'un habitat celtibère et romain.","de":"Das Heiligtum der Schutzpatronin von Belchite auf einem Hügel am Ortsrand. Darunter und ringsum liegen Reste einer keltiberischen und römischen Siedlung.","pt":"O santuário da padroeira de Belchite, num cerro nos arredores da localidade. Por baixo e à sua volta há restos de um povoado celtibérico e romano."},"visit":{"es":"Se llega en coche o andando por camino; el entorno exterior es de acceso libre. Para ver el interior, pregunta en la oficina de turismo. El martes siguiente al Domingo de Resurrección se celebra la romería.","en":"Reached by car or on foot along a track; the outside area is open access. To see the interior, ask at the tourist office. The pilgrimage is held on the Tuesday after Easter Sunday.","fr":"On y accède en voiture ou à pied par un chemin ; les abords sont en accès libre. Pour voir l'intérieur, renseignez-vous à l'office de tourisme. Le pèlerinage a lieu le mardi qui suit le dimanche de Pâques.","de":"Mit dem Auto oder zu Fuß über einen Weg erreichbar; das Außengelände ist frei zugänglich. Wegen einer Innenbesichtigung beim Fremdenverkehrsamt nachfragen. Am Dienstag nach Ostersonntag findet die Wallfahrt statt.","pt":"Chega-se de carro ou a pé por caminho; o espaço exterior é de acesso livre. Para ver o interior, pergunte no posto de turismo. Na terça-feira a seguir ao Domingo de Páscoa realiza-se a romaria."},"src":"https://turismocampodebelchite.es/eng/romeria-al-santuario-de-nuestra-senora-del-pueyo/e.31","sources":["https://turismocampodebelchite.es/eng/romeria-al-santuario-de-nuestra-senora-del-pueyo/e.31","https://lamagiadeviajar.com/wp-content/uploads/2024/01/belchitemagia141.pdf","https://es.wikipedia.org/wiki/Yacimiento_arqueol%C3%B3gico_de_Nuestra_Se%C3%B1ora_del_Pueyo","https://es.wikipedia.org/wiki/Belchite"],"art":{"es":[{"h":"Historia","t":"El santuario actual es un edificio barroco con una torre mudéjar del siglo XVI, aunque el culto en el cerro es más antiguo: la revista La Magia de Viajar sitúa sus orígenes en el siglo XIII. Nuestra Señora del Pueyo es la patrona de Belchite.\n\nEl cerro ha sido escenario de varias guerras: en 1809, durante la Guerra de la Independencia, hubo combates aquí, y en 1937 se excavaron trincheras."},{"h":"Curiosidades","t":"El cerro ocupa unas 1,5 hectáreas y esconde un yacimiento arqueológico con restos celtibéricos y romanos, con cerámicas de talleres conocidos del Imperio. El poblado creció en el siglo I, después de la fundación de Caesar Augusta, y pudo llegar a tener unos mil habitantes. Es posible que el santuario se levantara donde estuvo la plaza principal del poblado. Lo dieron a conocer en los años noventa Miguel Beltrán Lloris y José María Viladés; se excavó por primera vez en 2010 y de forma intensiva entre 2012 y 2015.\n\nCada año la romería sale en procesión desde la iglesia de Belchite, a unos 4 km, y, tras la misa, se come en el santuario o en el pinar de al lado."}],"en":[{"h":"History","t":"The present sanctuary is a Baroque building with a 16th-century Mudéjar tower, although worship on the hill is older: the magazine La Magia de Viajar dates its origins to the 13th century. Nuestra Señora del Pueyo is the patron saint of Belchite.\n\nThe hill has seen several wars: in 1809, during the Peninsular War, there was fighting here, and in 1937 trenches were dug."},{"h":"Did you know?","t":"The hill covers about 1.5 hectares and hides an archaeological site with Celtiberian and Roman remains, including pottery from well-known workshops of the Empire. The settlement grew in the 1st century, after Caesar Augusta was founded, and may have had up to a thousand inhabitants. The sanctuary may stand where the settlement's main square once was. It was brought to light in the 1990s by Miguel Beltrán Lloris and José María Viladés; it was first excavated in 2010 and intensively between 2012 and 2015.\n\nEvery year the pilgrimage sets off in procession from Belchite's church, about 4 km away, and after Mass people eat at the sanctuary or in the pine wood next to it."}],"fr":[{"h":"Histoire","t":"Le sanctuaire actuel est un édifice baroque doté d'une tour mudéjare du XVIe siècle, mais le culte sur la colline est plus ancien : la revue La Magia de Viajar en situe les origines au XIIIe siècle. Nuestra Señora del Pueyo est la patronne de Belchite.\n\nLa colline a connu plusieurs guerres : en 1809, pendant la guerre d'Indépendance espagnole, on s'y battit, et en 1937 on y creusa des tranchées."},{"h":"Le saviez-vous ?","t":"La colline couvre environ 1,5 hectare et cache un site archéologique aux vestiges celtibères et romains, avec des céramiques issues d'ateliers réputés de l'Empire. L'habitat se développa au Ier siècle, après la fondation de Caesar Augusta, et compta peut-être jusqu'à un millier d'habitants. Le sanctuaire a peut-être été élevé à l'emplacement de sa place principale. Le site fut révélé dans les années 1990 par Miguel Beltrán Lloris et José María Viladés ; il fut fouillé pour la première fois en 2010, puis de façon intensive entre 2012 et 2015.\n\nChaque année, le pèlerinage part en procession de l'église de Belchite, à environ 4 km, et, après la messe, on mange au sanctuaire ou dans la pinède voisine."}],"de":[{"h":"Geschichte","t":"Das heutige Heiligtum ist ein Barockbau mit einem Mudéjar-Turm aus dem 16. Jahrhundert, doch die Verehrung auf dem Hügel ist älter: Die Zeitschrift La Magia de Viajar datiert ihre Anfänge ins 13. Jahrhundert. Nuestra Señora del Pueyo ist die Schutzpatronin von Belchite.\n\nDer Hügel war Schauplatz mehrerer Kriege: 1809, im Spanischen Unabhängigkeitskrieg, wurde hier gekämpft, und 1937 hob man Schützengräben aus."},{"h":"Wussten Sie schon?","t":"Der Hügel umfasst etwa 1,5 Hektar und birgt eine archäologische Fundstätte mit keltiberischen und römischen Resten, darunter Keramik aus bekannten Werkstätten des Römischen Reiches. Die Siedlung wuchs im 1. Jahrhundert, nach der Gründung von Caesar Augusta, und hatte vielleicht bis zu tausend Einwohner. Möglicherweise steht das Heiligtum dort, wo einst ihr Hauptplatz lag. Bekannt gemacht wurde sie in den 1990er Jahren von Miguel Beltrán Lloris und José María Viladés; erstmals ausgegraben wurde sie 2010, intensiv zwischen 2012 und 2015.\n\nJedes Jahr zieht die Wallfahrt in einer Prozession von der rund 4 km entfernten Kirche von Belchite hinauf; nach der Messe isst man im Heiligtum oder im benachbarten Kiefernwald."}],"pt":[{"h":"História","t":"O santuário atua
