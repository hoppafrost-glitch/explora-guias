age.\n\nLe château dominait la rivière d'une dizaine de mètres. Lors des crues, les méandres de l'Èbre faisaient presque d'Alcalá une île, d'où sa ressemblance avec l'« ínsula »."},{"h":"Le saviez-vous ?","t":"Depuis 2005 se tient chaque année un marché cervantin situé au XVIe siècle, avec artisans, ateliers et théâtre. On y sert l'olla podrida, l'un des plats cités dans le Quichotte."}],"de":[{"h":"Geschichte","t":"Die Burg muslimischen Ursprungs gehörte zur Verteidigung Zaragozas am Ebro. Nach der Eroberung von 1118 fiel sie an die Krone. Heute sind nur Ruinen erhalten.\n\nAlcalá gehörte den Herzögen von Villahermosa, deren Palast in Pedrola ganz nah liegt. Deshalb schlug der Gelehrte Juan Antonio Pellicer im 18. Jahrhundert vor, die Insel Barataria des Don Quijote sei dieses Dorf. Der Roman sagt das nicht ausdrücklich, doch viele Wissenschaftler folgen dieser Deutung."},{"h":"Sehenswert","t":"2017 wurde eine Statue von Sancho Panza mit seinem Esel aufgestellt, ein Werk des örtlichen Künstlers Luis Hernández Albalate. Sie bildet ein Ensemble mit denen von Don Quijote und Cervantes an anderen Stellen im Dorf.\n\nDie Burg lag etwa zehn Meter über dem Fluss. Bei Hochwasser machten die Mäander des Ebro Alcalá fast zu einer Insel, weshalb es so gut zur «Ínsula» passt."},{"h":"Wussten Sie?","t":"Seit 2005 findet jedes Jahr ein Cervantes-Markt im Stil des 16. Jahrhunderts statt, mit Handwerkern, Werkstätten und Theater. Serviert wird Olla podrida, eines der im Don Quijote genannten Gerichte."}],"pt":[{"h":"História","t":"O castelo, de origem muçulmana, fazia parte das defesas de Saragoça à beira do Ebro. Depois da conquista de 1118 passou para a Coroa. Hoje restam apenas ruínas.\n\nAlcalá pertenceu aos duques de Villahermosa, cujo palácio de Pedrola fica muito perto. Por isso o erudito Juan Antonio Pellicer propôs no século XVIII que a Ilha Barataria do Quixote era esta aldeia. O romance não o diz expressamente, mas muitos académicos aceitam essa leitura."},{"h":"O que ver","t":"Em 2017 instalou-se uma escultura de Sancho Pança com o seu burro, obra do artista local Luis Hernández Albalate. Forma conjunto com as de Dom Quixote e de Cervantes, noutros pontos da aldeia.\n\nO castelo ficava cerca de dez metros acima do rio. Com as cheias, os meandros do Ebro quase transformavam Alcalá numa ilha, daí que encaixe tão bem na «ínsula»."},{"h":"Sabia que?","t":"Desde 2005 realiza-se todos os anos um Mercado Cervantino ambientado no século XVI, com artesãos, oficinas e teatro. Serve-se olla podrida, um dos pratos citados no Quixote."}]},"status":"pending"},{"id":"san-juan-remolinos","town":"Remolinos","cat":"patrimonio","lat":41.83802,"lon":-1.17522,"coord_src":null,"q":["Iglesia de San Juan Bautista, Remolinos","Remolinos"],"fq":["Category:Remolinos","Remolinos iglesia Goya"],"name":{"es":"Iglesia de San Juan Bautista","en":"Church of San Juan Bautista","fr":"Église San Juan Bautista","de":"Kirche San Juan Bautista","pt":"Igreja de San Juan Bautista"},"when":{"es":"Terminada en 1782 · Lienzos atribuidos a Goya","en":"Completed 1782 · Canvases attributed to Goya","fr":"Achevée en 1782 · Toiles attribuées à Goya","de":"1782 vollendet · Goya zugeschriebene Gemälde","pt":"Concluída em 1782 · Telas atribuídas a Goya"},"desc":{"es":"En las pechinas de la iglesia de Remolinos hay cuatro lienzos ovalados con los Padres de la Iglesia que se atribuyen a Goya. Se descubrieron casi por casualidad en 1915.","en":"In the pendentives of Remolinos church there are four oval canvases of the Fathers of the Church attributed to Goya. They were discovered almost by chance in 1915.","fr":"Dans les pendentifs de l'église de Remolinos, quatre toiles ovales des Pères de l'Église sont attribuées à Goya. Elles furent découvertes presque par hasard en 1915.","de":"In den Zwickeln der Kirche von Remolinos hängen vier ovale Gemälde der Kirchenväter, die Goya zugeschrieben werden. Sie wurden 1915 fast zufällig entdeckt.","pt":"Nos pendentes da igreja de Remolinos há quatro telas ovais com os Padres da Igreja atribuídas a Goya. Foram descobertas quase por acaso em 1915."},"visit":{"es":"Está en el centro de Remolinos. Se visita en horario de culto; pregunta en el Ayuntamiento por visitas fuera de ese horario.","en":"It is in the centre of Remolinos. You can visit during services; ask the town hall about visits at other times.","fr":"Elle se trouve au centre de Remolinos. Visite pendant les offices ; demandez à la mairie pour d'autres horaires.","de":"Sie liegt im Zentrum von Remolinos. Besichtigung während der Gottesdienste; nach anderen Zeiten fragen Sie im Rathaus.","pt":"Fica no centro de Remolinos. Visita-se durante o culto; pergunte na câmara municipal por visitas noutros horários."},"src":"https://fundaciongoyaenaragon.es/obra/san-ambrosio/100","sources":["https://fundaciongoyaenaragon.es/obra/san-ambrosio/100","https://es.hispanopedia.com/wiki/Remolinos"],"art":{"es":[{"h":"Historia","t":"La iglesia parroquial de San Juan Bautista dependía de la Orden de San Juan de Jerusalén, que nombraba a su cura. Una inscripción en el entablamento fecha el final de las obras en 1782.\n\nLos lienzos se fechan hacia 1772. Por la escala de las figuras, la Fundación Goya en Aragón plantea que pudieron pintarse para otro lugar y adaptarse después a los óvalos."},{"h":"Los cuatro lienzos","t":"Son cuatro óleos sobre lienzo, de unos 192 por 96 centímetros, que representan a San Ambrosio, San Agustín, San Jerónimo y San Gregorio Magno.\n\nEn 1915 el de San Agustín se cayó de su pechina y los curas del pueblo notaron su parecido con las pinturas de Goya en la cartuja de Aula Dei. En 1923 se publicaron como obra de Goya. La Fundación Goya en Aragón los cataloga como obra atribuida. Se restauraron en 1989 para una exposición sobre Goya en Venecia."},{"h":"Curiosidades","t":"Puede que los lienzos se recortaran para encajarlos en los óvalos, de modo que parte de las composiciones se habría perdido. También se discute si las inscripciones con los nombres de los santos son originales."}],"en":[{"h":"History","t":"The parish church of San Juan Bautista depended on the Order of Saint John of Jerusalem, which appointed its priest. An inscription on the entablature dates the end of the work to 1782.\n\nThe canvases are dated around 1772. Because of the scale of the figures, the Fundación Goya en Aragón suggests they may have been painted for another place and later fitted to the ovals."},{"h":"The four canvases","t":"They are four oils on canvas, about 192 by 96 centimetres, showing Saint Ambrose, Saint Augustine, Saint Jerome and Saint Gregory the Great.\n\nIn 1915 the Saint Augustine fell from its pendentive and the village priests noticed its likeness to Goya's paintings at the Aula Dei charterhouse. In 1923 they were published as works by Goya. The Fundación Goya en Aragón lists them as attributed works. They were restored in 1989 for a Goya exhibition in Venice."},{"h":"Did you know?","t":"The canvases may have been trimmed to fit the ovals, so part of the compositions would have been lost. It is also debated whether the inscriptions naming the saints are original."}],"fr":[{"h":"Histoire","t":"L'église paroissiale San Juan Bautista dépendait de l'ordre de Saint-Jean de Jérusalem, qui nommait son curé. Une inscription sur l'entablement date la fin des travaux de 1782.\n\nLes toiles sont datées vers 1772. En raison de l'échelle des figures, la Fundación Goya en Aragón suggère qu'elles ont pu être peintes pour un autre lieu puis adaptées aux ovales."},{"h":"Les quatre toiles","t":"Ce sont quatre huiles sur toile d'environ 192 sur 96 centimètres, représentant saint Ambroise, saint Augustin, saint Jérôme et saint Grégoire le Grand.\n\nEn 1915, le saint Augustin tomba de son pendentif et les prêtres du village remarquèrent sa ressemblance avec les peintures de Goya à la chartreuse d'Aula Dei. En 1923, elles furent publiées comme œuvres de Goya. La Fundación Goya en Aragón les classe comme œuvres attribuées. Elles furent restaurées en 1989 pour une exposition Goya à Venise."},{"h":"Le saviez-vous ?","t":"Les toiles ont peut-être été recoupées pour entrer dans les ovales, si bien qu'une partie des compositions aurait été perdue. On discute aussi de l'authenticité des inscriptions qui nomment les saints."}],"de":[{"h":"Geschichte","t":"Die Pfarrkirche San Juan Bautista unterstand dem Johanniterorden, der ihren Pfarrer ernannte. Eine Inschrift am Gebälk datiert das Ende der Bauarbeiten auf 1782.\n\nDie Gemälde werden um 1772 datiert. Wegen des Maßstabs der Figuren vermutet die Fundación Goya en Aragón, dass sie für einen anderen Ort gemalt und später den Ovalen angepasst wurden."},{"h":"Die vier Gemälde","t":"Es sind vier Ölbilder auf Leinwand, etwa 192 mal 96 Zentimeter groß, mit den Heiligen Ambrosius, Augustinus, Hieronymus und Gregor dem Großen.\n\n1915 fiel der Augustinus aus seinem Zwickel, und die Dorfpfarrer bemerkten die Ähnlichkeit mit Goyas Gemälden in der Kartause Aula Dei. 1923 wurden sie als Werke Goyas veröffentlicht. Die Fundación Goya en Aragón führt sie als zugeschriebene Werke. 1989 wurden sie für eine Goya-Ausstellung in Venedig restauriert."},{"h":"Wussten Sie?","t":"Die Bilder wurden möglicherweise beschnitten, um in die Ovale zu passen, sodass Teile der Kompositionen verloren gingen. Umstritten ist auch, ob die Inschriften mit den Namen der Heiligen original sind."}],"pt":[{"h":"História","t":"A igreja paroquial de San Juan Bautista dependia da Ordem de São João de Jerusalém, que nomeava o pároco. Uma inscrição no entablamento data o fim das obras em 1782.\n\nAs telas datam-se de cerca de 1772. Pela escala das figuras, a Fundación Goya en Aragón sugere que poderão ter sido pintadas para outro local e adaptadas depois aos ovais."},{"h":"As quatro telas","t":"São quatro óleos sobre tela, de cerca de 192 por 96 centímetros, que representam Santo Ambrósio, Santo Agostinho, São Jerónimo e São Gregório Magno.\n\nEm 1915 o Santo Agostinho caiu do seu pendente e os padres da aldeia notaram a semelhança com as pinturas de Goya na cartuxa de Aula Dei. Em 1923 foram publicadas como obras de Goya. A Fundación Goya en Aragón cataloga-as como obras atribuídas. Foram restauradas em 1989 para uma exposição sobre Goya em Veneza."},{"h":"Sabia que?","t":"As telas poderão ter sido recortadas para caber nos ovais, pelo que parte das composições se teria perdido. Também se discute se as inscrições com os nomes dos santos são originais."}]},"status":"pending"},{"id":"minas-sal-remolinos","town":"Remolinos","cat":"naturaleza","lat":41.8555,"lon":-1.15855,"coord_src":null,"q":["Minas de sal, Remolinos","Barranco de las Minas, Remolinos"],"fq":["Minas de sal Remolinos","Remolinos sal"],"name":{"es":"Ruta de las minas de sal","en":"Salt mines route","fr":"Itinéraire des mines de sel","de":"Weg der Salzminen","pt":"Percurso das minas de sal"},"when":{"es":"Explotadas desde la Edad Media · Ruta de unos 8 km","en":"Mined since the Middle Ages · About 8 km route","fr":"Exploitées depuis le Moyen Âge · Env. 8 km","de":"Seit dem Mittelalter abgebaut · Rundweg ca. 8 km","pt":"Exploradas desde a Idade Média · Cerca de 8 km"},"desc":{"es":"Bajo el monte de Remolinos hay sal de hace millones de años, de cuando los lagos cubrían el valle del Ebro. Una ruta circular de unos 8 km recorre por fuera las bocas de las viejas minas.","en":"Under the hill of Remolinos lies salt millions of years old, from when lakes covered the Ebro valley. A circular route of about 8 km passes the entrances of the old mines from outside.","fr":"Sous la colline de Remolinos se trouve du sel vieux de millions d'années, de l'époque où des lacs couvraient la vallée de l'Èbre. Un circuit d'environ 8 km longe de l'extérieur les entrées des anciennes mines.","de":"Unter dem Berg von Remolinos liegt Millionen Jahre altes Salz aus der Zeit, als Seen das Ebrotal bedeckten. Ein Rundweg von etwa 8 km führt außen an den Eingängen der alten Minen vorbei.","pt":"Debaixo do monte de Remolinos há sal com milhões de anos, do tempo em que lagos cobriam o vale do Ebro. Um percurso circular de cerca de 8 km passa por fora das entradas das velhas minas."},"visit":{"es":"La ruta empieza y termina cerca de las piscinas municipales y es de desnivel suave. Las bocaminas están cerradas: no entres en las galerías. Lleva agua y evita las horas de calor.","en":"The route starts and ends near the municipal swimming pools and climbs gently. The mine entrances are closed: do not go into the galleries. Take water and avoid the hottest hours.","fr":"Le circuit part et revient près des piscines municipales, en pente douce. Les entrées des mines sont fermées : n'entrez pas dans les galeries. Emportez de l'eau et évitez les heures chaudes.","de":"Der Weg beginnt und endet nahe dem städtischen Freibad und steigt sanft an. Die Mineneingänge sind verschlossen: Betreten Sie die Stollen nicht. Nehmen Sie Wasser mit und meiden Sie die heißesten Stunden.","pt":"O percurso começa e acaba perto das piscinas municipais e tem desnível suave. As entradas das minas estão fechadas: não entre nas galerias. Leve água e evite as horas de calor."},"src":"https://zaragozala.com/zaragoza-provincia/minas-sal-remolinos-historia-ruta/","sources":["https://zaragozala.com/zaragoza-provincia/minas-sal-remolinos-historia-ruta/","https://es.hispanopedia.com/wiki/Remolinos"],"art":{"es":[{"h":"Historia","t":"La sal se formó en el Mioceno, cuando el agua de los lagos que cubrían la depresión del Ebro se evaporó. En algunos puntos la capa supera los 100 metros de espesor.\n\nPuede que ya se explotara en época romana, pero las primeras noticias seguras son medievales. En 1909 había casi sesenta concesiones. La Mina Real dejó de sacar sal en 1989, y hoy solo trabaja la mina María del Carmen."},{"h":"La ruta","t":"El camino sube por el barranco de las Minas y pasa junto a bocaminas antiguas, edificios abandonados, la mina del Gallo, también llamada de Papeles, la Mina Real y el exterior de la María del Carmen.\n\nLas minas se excavaron por el sistema de cámaras y pilares: se dejan bloques de sal para sostener el monte. Algunas galerías miden unos 20 metros de ancho y 6 de alto."},{"h":"Curiosidades","t":"Una descripción del siglo XVII ya habla de grandes salas sostenidas por pilares de sal. Hacia 1950 se sacaban unas 15.000 toneladas al año, y en los años setenta casi diez veces más."}],"en":[{"h":"History","t":"The salt formed in the Miocene, when the water of the lakes covering the Ebro depression evaporated. In places the layer is over 100 metres thick.\n\nIt may already have been mined in Roman times, but the first reliable records are medieval. In 1909 there were almost sixty concessions. The Mina Real stopped extracting salt in 1989, and today only the María del Carmen mine is working."},{"h":"The route","t":"The path climbs the barranco de las Minas and passes old mine entrances, abandoned buildings, the Gallo mine, also called Papeles, the Mina Real and the outside of the María del Carmen.\n\nThe mines were dug by the room-and-pillar method: blocks of salt are left to hold up the hill. Some galleries are about 20 metres wide and 6 high."},{"h":"Did you know?","t":"A 17th-century description already mentions large chambers held up by pillars of salt. Around 1950 about 15,000 tonnes a year were extracted, and in the 1970s almost ten times more."}],"fr":[{"h":"Histoire","t":"Le sel s'est formé au Miocène, quand l'eau des lacs qui couvraient la dépression de l'Èbre s'est évaporée. Par endroits, la couche dépasse 100 mètres d'épaisseur.\n\nIl était peut-être déjà exploité à l'époque romaine, mais les premières mentions sûres sont médiévales. En 1909, on comptait près de soixante concessions. La Mina Real cessa d'extraire du sel en 1989, et aujourd'hui seule la mine María del Carmen est en activité."},{"h":"Le circuit","t":"Le chemin remonte le barranco de las Minas et passe devant d'anciennes entrées, des bâtiments abandonnés, la mine del Gallo, dite aussi de Papeles, la Mina Real et l'extérieur de la María del Carmen.\n\nLes mines furent creusées par chambres et piliers : on laisse des blocs de sel pour soutenir la colline. Certaines galeries mesurent environ 20 mètres de large et 6 de haut."},{"h":"Le saviez-vous ?","t":"Une description du XVIIe siècle parle déjà de grandes salles soutenues par des piliers de sel. Vers 1950, on extrayait environ 15 000 tonnes par an, et dans les années 1970 presque dix fois plus."}],"de":[{"h":"Geschichte","t":"Das Salz entstand im Miozän, als das Wasser der Seen in der Ebrosenke verdunstete. Stellenweise ist die Schicht über 100 Meter dick.\n\nVielleicht wurde es schon in römischer Zeit abgebaut, die ersten sicheren Nachrichten sind aber mittelalterlich. 1909 gab es fast sechzig Konzessionen. Die Mina Real stellte 1989 den Salzabbau ein; heute arbeitet nur noch die Mine María del Carmen."},{"h":"Der Weg","t":"Der Pfad führt durch den Barranco de las Minas an alten Mineneingängen, verlassenen Gebäuden, der Mine del Gallo, auch Papeles genannt, der Mina Real und der Außenseite der María del Carmen vorbei.\n\nDie Minen wurden im Kammerpfeilerbau angelegt: Salzblöcke bleiben stehen und tragen den Berg. Manche Stollen sind etwa 20 Meter breit und 6 Meter hoch."},{"h":"Wussten Sie?","t":"Schon eine Beschreibung aus dem 17. Jahrhundert spricht von großen Hallen, die von Salzpfeilern getragen werden. Um 1950 wurden etwa 15.000 Tonnen im Jahr gefördert, in den 1970er Jahren fast zehnmal so viel."}],"pt":[{"h":"História","t":"O sal formou-se no Miocénico, quando a água dos lagos que cobriam a depressão do Ebro se evaporou. Em alguns pontos a camada ultrapassa 100 metros de espessura.\n\nTalvez já fosse explorado na época romana, mas as primeiras notícias seguras são medievais. Em 1909 havia quase sessenta concessões. A Mina Real deixou de extrair sal em 1989, e hoje só trabalha a mina María del Carmen."},{"h":"O percurso","t":"O caminho sobe pelo barranco de las Minas e passa junto a entradas antigas, edifícios abandonados, a mina del Gallo, também chamada de Papeles, a Mina Real e o exterior da María del Carmen.\n\nAs minas foram escavadas pelo sistema de câmaras e pilares: deixam-se blocos de sal para sustentar o monte. Algumas galerias medem cerca de 20 metros de largura e 6 de altura."},{"h":"Sabia que?","t":"Uma descrição do século XVII já fala de grandes salas sustentadas por pilares de sal. Por volta de 1950 extraíam-se cerca de 15 000 toneladas por ano, e nos anos setenta quase dez vezes mais."}]},"status":"pending"},{"id":"san-pedro-gallur","town":"Gallur","cat":"patrimonio","lat":41.87007,"lon":-1.31808,"coord_src":null,"q":["Iglesia de San Pedro, Gallur","Gallur"],"fq":["Category:Gallur","Gallur iglesia San Pedro"],"name":{"es":"Iglesia de San Pedro","en":"Church of San Pedro","fr":"Église San Pedro","de":"Kirche San Pedro","pt":"Igreja de San Pedro"},"when":{"es":"1750-1773 · Neoclásica","en":"1750-1773 · Neoclassical","fr":"1750-1773 · Néoclassique","de":"1750-1773 · Klassizistisch","pt":"1750-1773 · Neoclássica"},"desc":{"es":"La iglesia de San Pedro se alza donde estuvo el castillo musulmán de Gallur. El primer cuerpo de su torre es del castillo, y dentro guarda un Cristo yacente del siglo XVIII.","en":"The church of San Pedro stands on the site of Gallur's Muslim castle. The first section of its tower belongs to the castle, and inside there is an 18th-century recumbent Christ.","fr":"L'église San Pedro s'élève à l'emplacement du château musulman de Gallur. Le premier corps de sa tour appartient au château, et elle abrite un Christ gisant du XVIIIe siècle.","de":"Die Kirche San Pedro steht an der Stelle der muslimischen Burg von Gallur. Das erste Geschoss ihres Turms gehört zur Burg, und innen bewahrt sie einen liegenden Christus aus dem 18. Jahrhundert.","pt":"A igreja de San Pedro ergue-se onde esteve o castelo muçulmano de Gallur. O primeiro corpo da torre pertence ao castelo, e lá dentro guarda um Cristo jacente do século XVIII."},"visit":{"es":"Está en lo alto del casco urbano de Gallur. Se visita en horario de culto.","en":"It is at the top of Gallur's old town. You can visit during services.","fr":"Elle est en haut du vieux Gallur. Visite pendant les offices.","de":"Sie liegt oben im Ortskern von Gallur. Besichtigung während der Gottesdienste.","pt":"Fica no alto do centro histórico de Gallur. Visita-se durante o culto."},"src":"https://es.hispanopedia.com/wiki/Gallur","sources":["https://es.hispanopedia.com/wiki/Gallur"],"art":{"es":[{"h":"Historia","t":"El templo actual se construyó entre 1750 y 1773, en estilo neoclásico. En la cara oriental se conservan restos de una iglesia barroca anterior, del siglo XVII.\n\nEl primer cuerpo de la torre pertenece al antiguo castillo. El resto de la torre se levantó en 1944 y se remodeló en 1993."},{"h":"Qué ver","t":"Tiene una sola nave de cuatro tramos cubierta con bóveda de lunetos. Fíjate en el órgano del coro, el retablo de la Sagrada Familia, la capilla de la Virgen de los Dolores con pinturas murales y la talla de San Pedro del altar mayor.\n\nTambién guarda un Cristo yacente del siglo XVIII y un cuadro de la Virgen del Carmen del siglo XVI."},{"h":"Curiosidades","t":"Gallur celebra el 22 de febrero la Cátedra de San Pedro. Según la tradición local, solo se celebra en Gallur, Antioquía y el Vaticano. El nombre del pueblo vendría de Pagus Gallorum, un asentamiento de galos."}],"en":[{"h":"History","t":"The present church was built between 1750 and 1773 in Neoclassical style. On its east side there are remains of an earlier 17th-century Baroque church.\n\nThe first section of the tower belongs to the old castle. The rest of the tower was built in 1944 and remodelled in 1993."},{"h":"What to see","t":"It has a single nave of four bays with a lunette vault. Note the choir organ, the Holy Family retable, the chapel of the Virgen de los Dolores with wall paintings and the carving of Saint Peter on the high altar.\n\nIt also keeps an 18th-century recumbent Christ and a 16th-century painting of the Virgen del Carmen."},{"h":"Did you know?","t":"On 22 February Gallur celebrates the Chair of Saint Peter. According to local tradition, it is celebrated only in Gallur, Antioch and the Vatican. The village's name would come from Pagus Gallorum, a settlement of Gauls."}],"fr":[{"h":"Histoire","t":"L'église actuelle fut construite entre 1750 et 1773 dans le style néoclassique. Côté est subsistent des restes d'une église baroque antérieure, du XVIIe siècle.\n\nLe premier corps de la tour appartient à l'ancien château. Le reste de la tour fut élevé en 1944 et remanié en 1993."},{"h":"À voir","t":"Elle a une seule nef de quatre travées couverte d'une voûte à lunettes. Remarquez l'orgue du chœur, le retable de la Sainte Famille, la chapelle de la Virgen de los Dolores avec ses peintures murales et la statue de saint Pierre du maître-autel.\n\nElle conserve aussi un Christ gisant du XVIIIe siècle et un tableau de la Virgen del Carmen du XVIe siècle."},{"h":"Le saviez-vous ?","t":"Le 22 février, Gallur fête la Chaire de saint Pierre. Selon la tradition locale, on ne la célèbre qu'à Gallur, Antioche et au Vatican. Le nom du village viendrait de Pagus Gallorum, un établissement de Gaulois."}],"de":[{"h":"Geschichte","t":"Die heutige Kirche wurde zwischen 1750 und 1773 im klassizistischen Stil erbaut. An der Ostseite sind Reste einer älteren Barockkirche aus dem 17. Jahrhundert erhalten.\n\nDas erste Geschoss des Turms gehört zur alten Burg. Der übrige Turm wurde 1944 errichtet und 1993 umgebaut."},{"h":"Sehenswert","t":"Sie hat ein einziges Schiff mit vier Jochen und Stichkappengewölbe. Beachten Sie die Chororgel, das Retabel der Heiligen Familie, die Kapelle der Virgen de los Dolores mit Wandmalereien und die Petrusfigur am Hochaltar.\n\nAußerdem bewahrt sie einen liegenden Christus aus dem 18. Jahrhundert und ein Bild der Virgen del Carmen aus dem 16. Jahrhundert."},{"h":"Wussten Sie?","t":"Am 22. Februar feiert Gallur das Fest Kathedra Petri. Nach örtlicher Überlieferung wird es nur in Gallur, Antiochia und im Vatikan gefeiert. Der Ortsname soll von Pagus Gallorum kommen, einer Siedlung von Galliern."}],"pt":[{"h":"História","t":"O templo atual foi construído entre 1750 e 1773, em estilo neoclássico. No lado oriental conservam-se restos de uma igreja barroca anterior, do século XVII.\n\nO primeiro corpo da torre pertence ao antigo castelo. O resto da torre foi erguido em 1944 e remodelado em 1993."},{"h":"O que ver","t":"Tem uma só nave de quatro tramos coberta com abóbada de lunetas. Repare no órgão do coro, no retábulo da Sagrada Família, na capela da Virgen de los Dolores com pinturas murais e na imagem de São Pedro do altar-mor.\n\nGuarda também um Cristo jacente do século XVIII e um quadro da Virgen del Carmen do século XVI."},{"h":"Sabia que?","t":"A 22 de fevereiro Gallur celebra a Cátedra de São Pedro. Segundo a tradição local, só se celebra em Gallur, Antioquia e no Vaticano. O nome da vila viria de Pagus Gallorum, um povoado de gauleses."}]},"status":"pending"},{"id":"puente-hierro-gallur","town":"Gallur","cat":"patrimonio","lat":41.8707,"lon":-1.3148,"coord_src":null,"q":["Puente de San Antonio, Gallur","Puente de hierro, Gallur"],"fq":["Puente Gallur Ebro","Gallur puente hierro"],"name":{"es":"Puente de hierro sobre el Ebro","en":"Iron bridge over the Ebro","fr":"Pont de fer sur l'Èbre","de":"Eisenbrücke über den Ebro","pt":"Ponte de ferro sobre o Ebro"},"when":{"es":"Principios del siglo XX · Hierro remachado","en":"Early 20th c. · Riveted iron","fr":"Début du XXe s. · Fer riveté","de":"Anfang 20. Jh. · Genietetes Eisen","pt":"Início do séc. XX · Ferro rebitado"},"desc":{"es":"El puente de San Antonio, de hierro remachado, cruza el Ebro en Gallur. Los vecinos lo llaman también de las Arcadas o de Hierro, y en junio se corren los encierros por él.","en":"The riveted-iron San Antonio bridge crosses the Ebro at Gallur. Locals also call it the bridge of the Arcades or the Iron Bridge, and in June bull runs are held across it.","fr":"Le pont San Antonio, en fer riveté, franchit l'Èbre à Gallur. Les habitants l'appellent aussi pont des Arcades ou pont de Fer, et en juin on y court les encierros.","de":"Die Brücke San Antonio aus genietetem Eisen überquert in Gallur den Ebro. Die Einheimischen nennen sie auch Arkaden- oder Eisenbrücke, und im Juni laufen die Stiertreiben darüber.","pt":"A ponte de San Antonio, de ferro rebitado, atravessa o Ebro em Gallur. Os habitantes chamam-lhe também ponte das Arcadas ou de Ferro, e em junho correm-se os encierros por ela."},"visit":{"es":"Se ve desde las orillas y se puede cruzar. Atención al tráfico.","en":"It can be seen from the banks and crossed. Watch out for traffic.","fr":"Il se voit depuis les rives et se traverse. Attention à la circulation.","de":"Sie ist vom Ufer aus zu sehen und kann überquert werden. Achten Sie auf den Verkehr.","pt":"Vê-se das margens e pode atravessar-se. Atenção ao trânsito."},"src":"https://es.hispanopedia.com/wiki/Gallur","sources":["https://es.hispanopedia.com/wiki/Gallur"],"art":{"es":[{"h":"Historia","t":"El puente se construyó a principios del siglo XX, con la técnica de hierro remachado que había popularizado Gustave Eiffel. Las fuentes dan como fechas 1902 y 1906.\n\nGallur está frente a la desembocadura del Arba en el Ebro y siempre fue un lugar de paso entre Zaragoza y Tudela."},{"h":"Qué ver","t":"Lo mejor es verlo desde la orilla, para apreciar la estructura de arcos de hierro. Junto al río se conservan dos pesqueras, antiguas balsas para criar pescado.\n\nLos días 13 y 29 de junio, en las fiestas de San Antonio y de San Pedro, hay encierros con reses bravas por el puente."}],"en":[{"h":"History","t":"The bridge was built in the early 20th century, using the riveted-iron technique popularised by Gustave Eiffel. Sources give 1902 and 1906 as dates.\n\nGallur faces the mouth of the Arba on the Ebro and was always a crossing point between Zaragoza and Tudela."},{"h":"What to see","t":"It is best seen from the bank, to appreciate its iron arches. By the river there are two old fish ponds, once used for breeding fish.\n\nOn 13 and 29 June, during the San Antonio and San Pedro festivities, there are bull runs across the bridge."}],"fr":[{"h":"Histoire","t":"Le pont fut construit au début du XXe siècle, selon la technique du fer riveté popularisée par Gustave Eiffel. Les sources donnent 1902 et 1906 comme dates.\n\nGallur fait face à l'embouchure de l'Arba dans l'Èbre et fut toujours un lieu de passage entre Saragosse et Tudela."},{"h":"À voir","t":"Le mieux est de le regarder depuis la rive pour apprécier ses arcs de fer. Au bord de la rivière subsistent deux anciens viviers à poissons.\n\nLes 13 et 29 juin, pendant les fêtes de San Antonio et de San Pedro, des encierros de taureaux traversent le pont."}],"de":[{"h":"Geschichte","t":"Die Brücke entstand Anfang des 20. Jahrhunderts in der Technik des genieteten Eisens, die Gustave Eiffel bekannt gemacht hatte. Die Quellen nennen 1902 und 1906.\n\nGallur liegt gegenüber der Mündung des Arba in den Ebro und war immer ein Übergang zwischen Zaragoza und Tudela."},{"h":"Sehenswert","t":"Am besten betrachtet man sie vom Ufer aus, um die Eisenbögen zu sehen. Am Fluss sind zwei alte Fischteiche erhalten, in denen früher Fische gezüchtet wurden.\n\nAm 13. und 29. Juni, zu den Festen San Antonio und San Pedro, gibt es Stiertreiben über die Brücke."}],"pt":[{"h":"História","t":"A ponte foi construída no início do século XX, com a técnica de ferro rebitado popularizada por Gustave Eiffel. As fontes indicam 1902 e 1906.\n\nGallur fica em frente da foz do Arba no Ebro e sempre foi um lugar de passagem entre Saragoça e Tudela."},{"h":"O que ver","t":"O melhor é vê-la da margem, para apreciar os arcos de ferro. Junto ao rio conservam-se dois antigos viveiros de peixe.\n\nA 13 e 29 de junho, nas festas de San Antonio e de San Pedro, há encierros de touros pela ponte."}]},"status":"pending"},{"id":"canal-gallur","town":"Gallur","cat":"hidraulico","lat":41.87551,"lon":-1.33157,"coord_src":null,"q":["Canal Imperial de Aragón, Gallur","Gallur canal"],"fq":["Canal Imperial Gallur","Category:Canal Imperial de Aragón"],"name":{"es":"El Canal Imperial en Gallur","en":"The Imperial Canal at Gallur","fr":"Le Canal impérial à Gallur","de":"Der Kaiserkanal in Gallur","pt":"O Canal Imperial em Gallur"},"when":{"es":"Siglos XVI-XVIII · Puerto del Canal Imperial","en":"16th-18th c. · Imperial Canal port","fr":"XVIe-XVIIIe s. · Port du Canal impérial","de":"16.-18. Jh. · Hafen des Kaiserkanals","pt":"Sécs. XVI-XVIII · Porto do Canal Imperial"},"desc":{"es":"El Canal Imperial de Aragón convirtió a Gallur en un punto de transporte entre Zaragoza y Tudela. Junto al canal quedan un puente de 1833, una fuente y la antigua bodega del canal.","en":"The Imperial Canal of Aragon made Gallur a transport point between Zaragoza and Tudela. Beside the canal there are a bridge from 1833, a fountain and the old canal warehouse.","fr":"Le Canal impérial d'Aragon fit de Gallur un point de transport entre Saragosse et Tudela. Au bord du canal subsistent un pont de 1833, une fontaine et l'ancien entrepôt du canal.","de":"Der Kaiserkanal von Aragonien machte Gallur zu einem Verkehrspunkt zwischen Zaragoza und Tudela. Am Kanal stehen eine Brücke von 1833, ein Brunnen und das alte Lagerhaus des Kanals.","pt":"O Canal Imperial de Aragão fez de Gallur um ponto de transporte entre Saragoça e Tudela. Junto ao canal ficam uma ponte de 1833, uma fonte e o antigo armazém do canal."},"visit":{"es":"El camino de sirga junto al canal es llano y apto para pasear o ir en bici.","en":"The towpath along the canal is flat and good for walking or cycling.","fr":"Le chemin de halage le long du canal est plat et idéal à pied ou à vélo.","de":"Der Treidelpfad am Kanal ist flach und eignet sich zum Spazieren oder Radfahren.","pt":"O caminho de sirga junto ao canal é plano e bom para passear ou andar de bicicleta."},"src":"https://es.hispanopedia.com/wiki/Gallur","sources":["https://es.hispanopedia.com/wiki/Gallur"],"art":{"es":[{"h":"Historia","t":"Las obras del canal empezaron en el siglo XVI como acequia Imperial. Con el canal, Gallur se convirtió en un centro de transporte entre Zaragoza y Tudela.\n\nLa antigua bodega del canal se inauguró en 1929. Fue bodega de vinos y licores y almacén agrícola, y hoy acoge exposiciones."},{"h":"Qué ver","t":"Busca el puente sobre el canal de 1833 y la fuente del Canal, de finales del siglo XIX, cerca de la plaza de España. En 1996 se inauguró un paso elevado sobre el canal.\n\nSi sigues el camino junto al agua, entenderás por qué esta obra cambió la Ribera, con el riego y el transporte por agua."}],"en":[{"h":"History","t":"Work on the canal began in the 16th century as the acequia Imperial. With the canal, Gallur became a transport centre between Zaragoza and Tudela.\n\nThe old canal warehouse opened in 1929. It was a wine and spirits store and a farm warehouse, and today it hosts exhibitions."},{"h":"What to see","t":"Look for the 1833 bridge over the canal and the late-19th-century Canal fountain near Plaza de España. In 1996 a raised crossing over the canal was opened.\n\nIf you follow the path by the water, you will see why this work changed the Ribera, through irrigation and water transport."}],"fr":[{"h":"Histoire","t":"Les travaux du canal commencèrent au XVIe siècle sous le nom d'acequia Imperial. Avec le canal, Gallur devint un centre de transport entre Saragosse et Tudela.\n\nL'ancien entrepôt du canal fut inauguré en 1929. Il servit de cave à vins et liqueurs et de magasin agricole, et accueille aujourd'hui des expositions."},{"h":"À voir","t":"Cherchez le pont de 1833 sur le canal et la fontaine du Canal, de la fin du XIXe siècle, près de la plaza de España. En 1996, un passage surélevé fut inauguré au-dessus du canal.\n\nEn suivant le chemin au bord de l'eau, vous comprendrez pourquoi cet ouvrage a changé la Ribera, grâce à l'irrigation et au transport par voie d'eau."}],"de":[{"h":"Geschichte","t":"Die Arbeiten am Kanal begannen im 16. Jahrhundert als Acequia Imperial. Mit dem Kanal wurde Gallur zu einem Verkehrszentrum zwischen Zaragoza und Tudela.\n\nDas alte Lagerhaus des Kanals wurde 1929 eröffnet. Es diente als Wein- und Likörkeller und als landwirtschaftliches Lager und zeigt heute Ausstellungen."},{"h":"Sehenswert","t":"Suchen Sie die Brücke von 1833 über den Kanal und den Kanalbrunnen vom Ende des 19. Jahrhunderts nahe der Plaza de España. 1996 wurde ein erhöhter Übergang über den Kanal eröffnet.\n\nWenn Sie dem Weg am Wasser folgen, verstehen Sie, warum dieses Bauwerk die Ribera verändert hat: durch Bewässerung und Transport auf dem Wasser."}],"pt":[{"h":"História","t":"As obras do canal começaram no século XVI como acequia Imperial. Com o canal, Gallur tornou-se um centro de transporte entre Saragoça e Tudela.\n\nO antigo armazém do canal foi inaugurado em 1929. Foi adega de vinhos e licores e armazém agrícola, e hoje acolhe exposições."},{"h":"O que ver","t":"Procure a ponte de 1833 sobre o canal e a fonte do Canal, do final do século XIX, perto da Plaza de España. Em 1996 inaugurou-se uma passagem elevada sobre o canal.\n\nSe seguir o caminho junto à água, perceberá porque esta obra mudou a Ribera, com a rega e o transporte por água."}]},"status":"pending"},{"id":"ermita-san-miguel-boquineni","town":"Boquiñeni","cat":"patrimonio","lat":41.85226,"lon":-1.26649,"coord_src":null,"q":["Ermita de San Miguel, Boquiñeni","Boquiñeni"],"fq":["Category:Boquiñeni","Boquiñeni"],"name":{"es":"Ermita de San Miguel","en":"Hermitage of San Miguel","fr":"Ermitage de San Miguel","de":"Einsiedelei San Miguel","pt":"Ermida de San Miguel"},"when":{"es":"Ermita y merendero · Milagro de 1864","en":"Hermitage and picnic area · Miracle of 1864","fr":"Ermitage et aire de pique-nique · Miracle de 1864","de":"Einsiedelei und Picknickplatz · Wunder von 1864","pt":"Ermida e parque de merendas · Milagre de 1864"},"desc":{"es":"La ermita de San Miguel es el lugar de las fiestas de mayo de Boquiñeni. Allí se lleva el Santo Cristo de la Capilla, por un milagro de lluvia de 1864, y junto a ella hay un merendero.","en":"The hermitage of San Miguel is the setting of Boquiñeni's May festivities. The Santo Cristo de la Capilla is carried here because of a rain miracle in 1864, and there is a picnic area beside it.","fr":"L'ermitage de San Miguel accueille les fêtes de mai de Boquiñeni. On y porte le Santo Cristo de la Capilla en souvenir d'un miracle de pluie de 1864, et une aire de pique-nique l'entoure.","de":"Die Einsiedelei San Miguel ist Schauplatz der Maifeste von Boquiñeni. Wegen eines Regenwunders von 1864 wird der Santo Cristo de la Capilla hierher getragen, und daneben liegt ein Picknickplatz.","pt":"A ermida de San Miguel é o lugar das festas de maio de Boquiñeni. Para lá se leva o Santo Cristo de la Capilla, por um milagre da chuva de 1864, e ao lado há um parque de merendas."},"visit":{"es":"Está en el término de Boquiñeni. Tiene mesas al aire libre. Por dentro abre en las fiestas.","en":"It is within Boquiñeni's municipal area. It has outdoor tables. The interior opens during the festivities.","fr":"Il se trouve sur la commune de Boquiñeni. Il y a des tables en plein air. L'intérieur ouvre pendant les fêtes.","de":"Sie liegt in der Gemarkung von Boquiñeni. Es gibt Tische im Freien. Innen ist sie zu den Festen geöffnet.","pt":"Fica no concelho de Boquiñeni. Tem mesas ao ar livre. O interior abre nas festas."},"src":"https://es.hispanopedia.com/wiki/Boqui%C3%B1eni","sources":["https://es.hispanopedia.com/wiki/Boqui%C3%B1eni"],"art":{"es":[{"h":"Historia","t":"En 1864, tras una larga sequía, la lluvia llegó después de llevar en procesión la imagen del Santo Cristo de la Capilla a esta ermita. Desde entonces, cada 24 de mayo, el Cristo vuelve a San Miguel.\n\nTambién se celebran actos el día de San Miguel y el de San Isidro Labrador."},{"h":"El Dance","t":"El 25 de mayo, día de San Gregorio, se representa el Dance de Boquiñeni, al que los vecinos llaman «de la soldadesca». Es una pastorada en la que se enfrentan un ángel, interpretado por una niña, y el diablo.\n\nBailan ocho danzantes con pantalón y camisa blanca y una banda con los colores de Aragón. Se representa de forma continua desde finales del siglo XIX, salvo en la Guerra Civil, y en 1998 celebró su centenario."}],"en":[{"h":"History","t":"In 1864, after a long drought, rain came after the image of the Santo Cristo de la Capilla was carried in procession to this hermitage. Since then, every 24 May, the Christ returns to San Miguel.\n\nCelebrations are also held on Saint Michael's day and on Saint Isidore's."},{"h":"The Dance","t":"On 25 May, Saint Gregory's day, the Dance of Boquiñeni is performed, which locals call «de la soldadesca». It is a pastoral play in which an angel, played by a girl, confronts the devil.\n\nEight dancers take part in white trousers and shirts with a sash in the colours of Aragon. It has been performed continuously since the late 19th century, except during the Civil War, and in 1998 it celebrated its centenary."}],"fr":[{"h":"Histoire","t":"En 1864, après une longue sécheresse, la pluie arriva après qu'on eut porté en procession l'image du Santo Cristo de la Capilla jusqu'à cet ermitage. Depuis, chaque 24 mai, le Christ retourne à San Miguel.\n\nDes célébrations ont aussi lieu le jour de la Saint-Michel et celui de saint Isidore."},{"h":"Le Dance","t":"Le 25 mai, jour de saint Grégoire, on représente le Dance de Boquiñeni, que les habitants appellent « de la soldadesca ». C'est une pastorale où un ange, joué par une fillette, affronte le diable.\n\nHuit danseurs y participent, en pantalon et chemise blancs avec une écharpe aux couleurs de l'Aragon. Il est joué sans interruption depuis la fin du XIXe siècle, sauf pendant la guerre civile, et a fêté son centenaire en 1998."}],"de":[{"h":"Geschichte","t":"1864 kam nach langer Dürre der Regen, nachdem das Bild des Santo Cristo de la Capilla in Prozession zu dieser Einsiedelei getragen worden war. Seitdem kehrt der Christus jedes Jahr am 24. Mai nach San Miguel zurück.\n\nAuch am Tag des heiligen Michael und des heiligen Isidor wird hier gefeiert."},{"h":"Der Dance","t":"Am 25. Mai, dem Tag des heiligen Gregor, wird der Dance von Boquiñeni aufgeführt, den die Einheimischen «de la soldadesca» nennen. Es ist ein Hirtenspiel, in dem ein Engel, gespielt von einem Mädchen, dem Teufel gegenübertritt.\n\nAcht Tänzer treten in weißer Hose und weißem Hemd mit einer Schärpe in den Farben Aragoniens auf. Er wird seit dem späten 19. Jahrhundert ununterbrochen aufgeführt, außer im Bürgerkrieg, und feierte 1998 sein hundertjähriges Bestehen."}],"pt":[{"h":"História","t":"Em 1864, depois de uma longa seca, a chuva chegou após levar em procissão a imagem do Santo Cristo de la Capilla a esta ermida. Desde então, todos os anos a 24 de maio, o Cristo volta a San Miguel.\n\nTambém se celebram atos no dia de São Miguel e no de Santo Isidro Lavrador."},{"h":"O Dance","t":"A 25 de maio, dia de São Gregório, representa-se o Dance de Boquiñeni, a que os habitantes chamam «de la soldadesca». É uma pastorada em que se enfrentam um anjo, interpretado por uma menina, e o diabo.\n\nDançam oito dançarinos de calça e camisa brancas e uma faixa com as cores de Aragão. Representa-se de forma contínua desde o final do século XIX, exceto durante a Guerra Civil, e em 1998 celebrou o centenário."}]},"status":"pending"},{"id":"galacho-fornazos","town":"Boquiñeni","cat":"naturaleza","lat":41.8491,"lon":-1.27458,"coord_src":null,"q":["Galacho de los Fornazos","Los Fornazos"],"fq":["Galacho Fornazos","Pradilla de Ebro Ebro"],"name":{"es":"Galacho de los Fornazos","en":"Galacho de los Fornazos","fr":"Galacho de los Fornazos","de":"Galacho de los Fornazos","pt":"Galacho de los Fornazos"},"when":{"es":"Humedal restaurado desde 2006 · 8,5 hectáreas","en":"Wetland restored since 2006 · 8.5 hectares","fr":"Zone humide restaurée depuis 2006 · 8,5 ha","de":"Seit 2006 renaturiert · 8,5 Hektar","pt":"Zona húmida recuperada desde 2006 · 8,5 ha"},"desc":{"es":"El galacho de los Fornazos es un antiguo brazo del Ebro entre Pradilla y Boquiñeni. La Confederación Hidrográfica del Ebro lo ha recuperado con lagunas, un sendero y un mirador para ver aves.","en":"The Galacho de los Fornazos is an old arm of the Ebro between Pradilla and Boquiñeni. The Ebro Basin Authority has restored it with ponds, a trail and a viewpoint for watching birds.","fr":"Le galacho de los Fornazos est un ancien bras de l'Èbre entre Pradilla et Boquiñeni. La Confédération hydrographique de l'Èbre l'a restauré avec des mares, un sentier et un belvédère pour observer les oiseaux.","de":"Der Galacho de los Fornazos ist ein alter Ebroarm zwischen Pradilla und Boquiñeni. Die Ebro-Flussgebietsbehörde hat ihn mit Teichen, einem Pfad und einem Aussichtspunkt zur Vogelbeobachtung wiederhergestellt.","pt":"O galacho de los Fornazos é um antigo braço do Ebro entre Pradilla e Boquiñeni. A Confederação Hidrográfica do Ebro recuperou-o com lagoas, um trilho e um miradouro para observar aves."},"visit":{"es":"Hay un sendero y un mirador. Lleva prismáticos, ve en silencio y respeta la vegetación de ribera.","en":"There is a trail and a viewpoint. Bring binoculars, keep quiet and respect the riverside vegetation.","fr":"Il y a un sentier et un belvédère. Apportez des jumelles, restez silencieux et respectez la végétation de la rive.","de":"Es gibt einen Pfad und einen Aussichtspunkt. Bringen Sie ein Fernglas mit, verhalten Sie sich ruhig und schonen Sie die Ufervegetation.","pt":"Há um trilho e um miradouro. Leve binóculos, mantenha silêncio e respeite a vegetação ribeirinha."},"src":"https://www.iagua.es/noticias/ebro/11/11/28/la-confederacion-hidrografica-del-ebro-celebra-un-dia-de-las-aves-en-el-galacho-de-los-fornazos-11988","sources":["https://www.iagua.es/noticias/ebro/11/11/28/la-confederacion-hidrografica-del-ebro-celebra-un-dia-de-las-aves-en-el-galacho-de-los-fornazos-11988","https://www.aragon.es/-/rio-ebro-sotos-y-mejanas-novillas-boqui%C3%B1eni","https://es.hispanopedia.com/wiki/Boqui%C3%B1eni"],"art":{"es":[{"h":"Historia","t":"Un galacho es un meandro abandonado por el río que queda como laguna. En 2006 la Confederación Hidrográfica del Ebro empezó a limpiar este y a abrir láminas de agua. Después vinieron plantaciones, un sendero y un mirador.\n\nLa última fase unió varias balsas mediante canales, y el humedal llegó a unas 8,5 hectáreas."},{"h":"Qué ver","t":"El galacho forma parte de los sotos y mejanas del Ebro, protegidos como Lugar de Importancia Comunitaria. En el entorno se han citado más de cien especies de aves, como garzas, cormoranes, ruiseñores y oropéndolas.\n\nHay carrizales en las zonas encharcadas y bosque de ribera de chopos, sauces y tamarices."}],"en":[{"h":"History","t":"A galacho is a meander abandoned by the river that remains as a lagoon. In 2006 the Confederación Hidrográfica del Ebro began clearing this one and opening water surfaces. Planting, a trail and a viewpoint followed.\n\nThe last phase linked several ponds with channels, and the wetland reached about 8.5 hectares."},{"h":"What to see","t":"The galacho is part of the Ebro riverside woods and gravel bars, protected as a Site of Community Importance. More than a hundred bird species have been recorded in the area, such as herons, cormorants, nightingales and golden orioles.\n\nThere are reed beds in the flooded areas and riverside woodland of poplars, willows and tamarisks."}],"fr":[{"h":"Histoire","t":"Un galacho est un méandre abandonné par le fleuve qui subsiste sous forme de lagune. En 2006, la Confederación Hidrográfica del Ebro commença à nettoyer celui-ci et à ouvrir des plans d'eau. Suivirent des plantations, un sentier et un belvédère.\n\nLa dernière phase relia plusieurs bassins par des canaux, et la zone humide atteignit environ 8,5 hectares."},{"h":"À voir","t":"Le galacho fait partie des sotos et mejanas de l'Èbre, protégés comme Site d'importance communautaire. Plus de cent espèces d'oiseaux ont été observées dans les environs, comme les hérons, les cormorans, les rossignols et les loriots.\n\nOn trouve des roselières dans les zones inondées et un bois de rive de peupliers, de saules et de tamaris."}],"de":[{"h":"Geschichte","t":"Ein Galacho ist eine vom Fluss verlassene Flussschleife, die als Lagune zurückbleibt. 2006 begann die Confederación Hidrográfica del Ebro, diesen zu säubern und Wasserflächen zu öffnen. Es folgten Pflanzungen, ein Pfad und ein Aussichtspunkt.\n\nIn der letzten Phase wurden mehrere Teiche durch Kanäle verbunden, und das Feuchtgebiet erreichte etwa 8,5 Hektar."},{"h":"Sehenswert","t":"Der Galacho gehört zu den Auwäldern und Kiesinseln des Ebro, die als Gebiet von gemeinschaftlicher Bedeutung geschützt sind. In der Umgebung wurden über hundert Vogelarten nachgewiesen, etwa Reiher, Kormorane, Nachtigallen und Pirole.\n\nIn den überfluteten Bereichen gibt es Röhricht und Auwald aus Pappeln, Weiden und Tamarisken."}],"pt":[{"h":"História","t":"Um galacho é um meandro abandonado pelo rio que fica como lagoa. Em 2006 a Confederación Hidrográfica del Ebro começou a limpar este e a abrir espelhos de água. Seguiram-se plantações, um trilho e um miradouro.\n\nA última fase ligou vários charcos por canais, e a zona húmida chegou a cerca de 8,5 hectares."},{"h":"O que ver","t":"O galacho faz parte dos sotos e mejanas do Ebro, protegidos como Sítio de Importância Comunitária. Na zona registaram-se mais de cem espécies de aves, como garças, corvos-marinhos, rouxinóis e papa-figos.\n\nHá caniçais nas áreas alagadas e bosque ribeirinho de choupos, salgueiros e tamargueiras."}]},"status":"pending"},{"id":"loteta","town":"Boquiñeni","cat":"naturaleza","lat":41.82499,"lon":-1.32657,"coord_src":null,"q":["Embalse de La Loteta","La Loteta"],"fq":["Embalse de La Loteta","La Loteta"],"name":{"es":"Embalse de La Loteta","en":"La Loteta reservoir","fr":"Réservoir de La Loteta","de":"Stausee La Loteta","pt":"Albufeira de La Loteta"},"when":{"es":"Terminado en 2008 · 105 hm³","en":"Completed 2008 · 105 hm³","fr":"Achevé en 2008 · 105 hm³","de":"2008 fertiggestellt · 105 hm³","pt":"Concluída em 2008 · 105 hm³"},"desc":{"es":"El embalse de La Loteta está donde se encuentran la Ribera Alta y el Campo de Borja. Recibe agua del embalse de Yesa y ayuda a regular el Canal Imperial. Es un buen lugar para el kitesurf y el windsurf.","en":"La Loteta reservoir lies where the Ribera Alta and the Campo de Borja meet. It receives water from the Yesa reservoir and helps regulate the Imperial Canal. It is a good place for kitesurfing and windsurfing.","fr":"Le réservoir de La Loteta se trouve à la rencontre de la Ribera Alta et du Campo de Borja. Il reçoit l'eau du réservoir de Yesa et aide à réguler le Canal impérial. C'est un bon spot de kitesurf et de planche à voile.","de":"Der Stausee La Loteta liegt dort, wo Ribera Alta und Campo de Borja aufeinandertreffen. Er erhält Wasser aus dem Stausee Yesa und hilft, den Kaiserkanal zu regulieren. Er ist ein guter Ort zum Kitesurfen und Windsurfen.","pt":"A albufeira de La Loteta fica onde se encontram a Ribera Alta e o Campo de Borja. Recebe água da albufeira de Yesa e ajuda a regular o Canal Imperial. É um bom lugar para kitesurf e windsurf."},"visit":{"es":"Pregunta el acceso en el Ayuntamiento de Boquiñeni. En la orilla no hay servicios: lleva agua y respeta las indicaciones de la Confederación Hidrográfica del Ebro.","en":"Ask Boquiñeni town hall about access. There are no facilities on the shore: take water and follow the instructions of the Ebro Basin Authority.","fr":"Renseignez-vous sur l'accès à la mairie de Boquiñeni. Il n'y a pas de services sur la rive : emportez de l'eau et respectez les consignes de la Confédération hydrographique de l'Èbre.","de":"Fragen Sie im Rathaus von Boquiñeni nach dem Zugang. Am Ufer gibt es keine Einrichtungen: Nehmen Sie Wasser mit und folgen Sie den Hinweisen der Ebro-Flussgebietsbehörde.","pt":"Pergunte o acesso na câmara municipal de Boquiñeni. Na margem não há serviços: leve água e respeite as indicações da Confederação Hidrográfica do Ebro."},"src":"https://www.iagua.es/data/infraestructuras/embalses/loteta","sources":["https://www.iagua.es/data/infraestructuras/embalses/loteta","https://es.hispanopedia.com/wiki/Boqui%C3%B1eni"],"art":{"es":[{"h":"Historia","t":"La obra terminó en 2008 y el embalse empezó a funcionar en 2010. Puede almacenar unos 105 hectómetros cúbicos y cubre unas 1.086 hectáreas.\n\nSe alimenta con agua que llega desde el embalse de Yesa. Su función es repartir mejor a lo largo del año el caudal del Canal Imperial de Aragón."},{"h":"Qué ver","t":"Parte del embalse está en el término de Boquiñeni, que va desde la orilla del Ebro, a 219 metros, hasta el Alto de la Loteta, a 307. El viento frecuente del valle, el cierzo, lo ha convertido en un lugar para el kitesurf y el windsurf."}],"en":[{"h":"History","t":"Construction finished in 2008 and the reservoir began operating in 2010. It can hold about 105 cubic hectometres and covers about 1,086 hectares.\n\nIt is fed with water coming from the Yesa reservoir. Its purpose is to spread the flow of the Imperial Canal of Aragon more evenly over the year."},{"h":"What to see","t":"Part of the reservoir lies within Boquiñeni, whose land runs from the bank of the Ebro, at 219 metres, to the Alto de la Loteta, at 307. The frequent wind of the valley, the cierzo, has made it a place for kitesurfing and windsurfing."}],"fr":[{"h":"Histoire","t":"Les travaux s'achevèrent en 2008 et le réservoir entra en service en 2010. Il peut contenir environ 105 hectomètres cubes et couvre environ 1 086 hectares.\n\nIl est alimenté par de l'eau venant du réservoir de Yesa. Son rôle est de mieux répartir sur l'année le débit du Canal impérial d'Aragon."},{"h":"À voir","t":"Une partie du réservoir se trouve sur la commune de Boquiñeni, qui s'étend de la rive de l'Èbre, à 219 mètres, jusqu'à l'Alto de la Loteta, à 307. Le vent fréquent de la vallée, le cierzo, en a fait un lieu de kitesurf et de planche à voile."}],"de":[{"h":"Geschichte","t":"Der Bau endete 2008, 2010 ging der Stausee in Betrieb. Er fasst etwa 105 Kubikhektometer und bedeckt rund 1.086 Hektar.\n\nGespeist wird er mit Wasser aus dem Stausee Yesa. Seine Aufgabe ist es, den Abfluss des Kaiserkanals von Aragonien gleichmäßiger über das Jahr zu verteilen."},{"h":"Sehenswert","t":"Ein Teil des Stausees liegt in der Gemarkung Boquiñeni, die vom Ebroufer auf 219 Metern bis zum Alto de la Loteta auf 307 Metern reicht. Der häufige Wind des Tals, der Cierzo, hat ihn zu einem Ort für Kitesurfen und Windsurfen gemacht."}],"pt":[{"h":"História","t":"A obra terminou em 2008 e a albufeira começou a funcionar em 2010. Pode armazenar cerca de 105 hectómetros cúbicos e cobre cerca de 1086 hectares.\n\nÉ alimentada com água que vem da albufeira de Yesa. A sua função é repartir melhor ao longo do ano o caudal do Canal Imperial de Aragão."},{"h":"O que ver","t":"Parte da albufeira fica no concelho de Boquiñeni, que vai da margem do Ebro, a 219 metros, até ao Alto de la Loteta, a 307. O vento frequente do vale, o cierzo, tornou-a um lugar para kitesurf e windsurf."}]},"status":"pending"},{"id":"iglesia-luceni","town":"Luceni","cat":"patrimonio","lat":41.82973,"lon":-1.23751,"coord_src":null,"q":["Iglesia de la Purificación, Luceni","Luceni"],"fq":["Category:Luceni","Luceni iglesia"],"name":{"es":"Iglesia de la Purificación","en":"Church of the Purificación","fr":"Église de la Purificación","de":"Kirche de la Purificación","pt":"Igreja da Purificación"},"when":{"es":"Siglo XIII · Retablo de piedra del siglo XV","en":"13th c. · 15th-century stone retable","fr":"XIIIe s. · Retable de pierre du XVe siècle","de":"13. Jh. · Steinretabel des 15. Jh.","pt":"Séc. XIII · Retábulo de pedra do séc. XV"},"desc":{"es":"La iglesia de la Purificación de Luceni es gótica, del siglo XIII. Guarda un retablo mayor de relieves de piedra del siglo XV y un Cristo yacente del XVII, en la línea de Gregorio Fernández.","en":"The church of the Purificación in Luceni is Gothic, from the 13th century. It holds a high-altar retable of 15th-century stone reliefs and a 17th-century recumbent Christ in the manner of Gregorio Fernández.","fr":"L'église de la Purificación de Luceni est gothique, du XIIIe siècle. Elle abrite un retable majeur de reliefs de pierre du XVe siècle et un Christ gisant du XVIIe dans la manière de Gregorio Fernández.","de":"Die Kirche de la Purificación in Luceni ist gotisch, aus dem 13. Jahrhundert. Sie bewahrt ein Hauptretabel mit Steinreliefs des 15. Jahrhunderts und einen liegenden Christus des 17. Jahrhunderts im Stil von Gregorio Fernández.","pt":"A igreja da Purificación de Luceni é gótica, do século XIII. Guarda um retábulo-mor de relevos de pedra do século XV e um Cristo jacente do XVII, ao estilo de Gregorio Fernández."},"visit":{"es":"Está en el centro de Luceni. Se visita en horario de culto.","en":"It is in the centre of Luceni. You can visit during services.","fr":"Elle se trouve au centre de Luceni. Visite pendant les offices.","de":"Sie liegt im Zentrum von Luceni. Besichtigung während der Gottesdienste.","pt":"Fica no centro de Luceni. Visita-se durante o culto."},"src":"https://es.hispanopedia.com/wiki/Luceni","sources":["https://es.hispanopedia.com/wiki/Luceni"],"art":{"es":[{"h":"Historia","t":"Alfonso I el Batallador conquistó Luceni en 1110. Fue después uno de los señoríos más antiguos de la familia Luna, y a mediados del siglo XIV pasó a María de Luna, reina por su boda con Martín I.\n\nLa iglesia es de una sola nave con cabecera plana, de estilo gótico y del siglo XIII."},{"h":"Qué ver","t":"El retablo mayor está dedicado a la Presentación del Niño Jesús en el Templo. Está hecho con relieves de piedra tallada de la segunda mitad del siglo XV.\n\nGuarda también un Cristo yacente del siglo XVII al estilo de Gregorio Fernández."}],"en":[{"h":"History","t":"Alfonso I the Battler conquered Luceni in 1110. It later became one of the oldest lordships of the Luna family, and in the mid-14th century it passed to María de Luna, queen through her marriage to Martin I.\n\nThe church has a single nave with a flat chancel, in Gothic style and from the 13th century."},{"h":"What to see","t":"The high-altar retable is dedicated to the Presentation of the Child Jesus in the Temple. It is made of carved stone reliefs from the second half of the 15th century.\n\nIt also keeps a 17th-century recumbent Christ in the style of Gregorio Fernández."}],"fr":[{"h":"Histoire","t":"Alphonse Ier le Batailleur conquit Luceni en 1110. Ce fut ensuite l'une des plus anciennes seigneuries de la famille Luna, et au milieu du XIVe siècle elle passa à María de Luna, reine par son mariage avec Martin Ier.\n\nL'église a une seule nef au chevet plat, de style gothique et du XIIIe siècle."},{"h":"À voir","t":"Le retable majeur est consacré à la Présentation de l'Enfant Jésus au Temple. Il est fait de reliefs de pierre sculptée de la seconde moitié du XVe siècle.\n\nElle conserve aussi un Christ gisant du XVIIe siècle dans le style de Gregorio Fernández."}],"de":[{"h":"Geschichte","t":"Alfons I. der Kämpfer eroberte Luceni 1110. Später war es eine der ältesten Herrschaften der Familie Luna und ging Mitte des 14. Jahrhunderts an María de Luna über, Königin durch ihre Ehe mit Martin I.\n\nDie Kirche hat ein einziges Schiff mit geradem Chorabschluss, im gotischen Stil und aus dem 13. Jahrhundert."},{"h":"Sehenswert","t":"Das Hauptretabel ist der Darstellung des Jesuskindes im Tempel gewidmet. Es besteht aus gemeißelten Steinreliefs aus der zweiten Hälfte des 15. Jahrhunderts.\n\nAußerdem bewahrt sie einen liegenden Christus aus dem 17. Jahrhundert im Stil von Gregorio Fernández."}],"pt":[{"h":"História","t":"Afonso I, o Batalhador, conquistou Luceni em 1110. Foi depois um dos senhorios mais antigos da família Luna e, em meados do século XIV, passou para María de Luna, rainha pelo casamento com Martim I.\n\nA igreja tem uma só nave com cabeceira plana, de estilo gótico e do século XIII."},{"h":"O que ver","t":"O retábulo-mor é dedicado à Apresentação do Menino Jesus no Templo. É feito de relevos de pedra lavrada da segunda metade do século XV.\n\nGuarda também um Cristo jacente do século XVII ao estilo de Gregorio Fernández."}]},"status":"pending"},{"id":"palacio-fuenclara-luceni","town":"Luceni","cat":"museo","lat":41.82878,"lon":-1.2389,"coord_src":null,"q":["Ayuntamiento, Luceni","Plaza de España, Luceni"],"fq":["Luceni palacio","Luceni plaza"],"name":{"es":"Palacio de los Condes de Fuenclara","en":"Palace of the Counts of Fuenclara","fr":"Palais des comtes de Fuenclara","de":"Palast der Grafen von Fuenclara","pt":"Palácio dos condes de Fuenclara"},"when":{"es":"Condes de Fuenclara · Museo etnográfico","en":"Counts of Fuenclara · Ethnographic museum","fr":"Comtes de Fuenclara · Musée ethnographique","de":"Grafen von Fuenclara · Volkskundemuseum","pt":"Condes de Fuenclara · Museu etnográfico"},"desc":{"es":"El palacio de los condes de Fuenclara, señores de Luceni hasta el siglo XIX, es hoy un edificio municipal. Sus bodegas abovedadas de ladrillo acogen un pequeño museo etnográfico.","en":"The palace of the Counts of Fuenclara, lords of Luceni until the 19th century, is now a municipal building. Its vaulted brick cellars house a small ethnographic museum.","fr":"Le palais des comtes de Fuenclara, seigneurs de Luceni jusqu'au XIXe siècle, est aujourd'hui un bâtiment municipal. Ses caves voûtées en brique abritent un petit musée ethnographique.","de":"Der Palast der Grafen von Fuenclara, bis ins 19. Jahrhundert Herren von Luceni, ist heute ein Gemeindegebäude. In seinen gewölbten Backsteinkellern befindet sich ein kleines Volkskundemuseum.","pt":"O palácio dos condes de Fuenclara, senhores de Luceni até ao século XIX, é hoje um edifício municipal. As suas adegas abobadadas de tijolo acolhem um pequeno museu etnográfico."},"visit":{"es":"Pregunta en el Ayuntamiento de Luceni por los horarios del museo etnográfico.","en":"Ask Luceni town hall for the ethnographic museum's opening times.","fr":"Demandez à la mairie de Luceni les horaires du musée ethnographique.","de":"Die Öffnungszeiten des Volkskundemuseums erfahren Sie im Rathaus von Luceni.","pt":"Pergunte na câmara municipal de Luceni os horários do museu etnográfico."},"src":"https://es.hispanopedia.com/wiki/Luceni","sources":["https://es.hispanopedia.com/wiki/Luceni"],"art":{"es":[{"h":"Historia","t":"En 1443 Bartolomé de Reus se hizo con el señorío y fundó el mayorazgo de Luceni y Boquiñeni. Después pasó a los condes de Fuenclara, que lo tuvieron hasta que se abolieron los señoríos a comienzos del siglo XIX.\n\nEn 1495 el pueblo tenía 39 fuegos, casi todos moriscos. Tras su expulsión en 1609 hubo que repoblarlo."},{"h":"Qué ver","t":"Es un edificio exento y alargado, de tres plantas y grandes bodegas. El interior se reformó para servicios municipales, y en las bodegas de ladrillo abovedadas se ha instalado un pequeño museo etnográfico.\n\nLuceni también conserva la escuela-capilla de la azucarera, con planta en forma de E. La azucarera abrió en 1911 y cerró en 1985."}],"en":[{"h":"History","t":"In 1443 Bartolomé de Reus acquired the lordship and founded the entailed estate of Luceni and Boquiñeni. It later passed to the Counts of Fuenclara, who held it until lordships were abolished in the early 19th century.\n\nIn 1495 the village had 39 households, almost all Moriscos. After their expulsion in 1609 it had to be repopulated."},{"h":"What to see","t":"It is a free-standing, elongated building with three floors and large cellars. The interior was remodelled for municipal services, and a small ethnographic museum has been set up in the vaulted brick cellars.\n\nLuceni also keeps the school-chapel of the sugar factory, with an E-shaped plan. The factory opened in 1911 and closed in 1985."}],"fr":[{"h":"Histoire","t":"En 1443, Bartolomé de Reus acquit la seigneurie et fonda le majorat de Luceni et Boquiñeni. Elle passa ensuite aux comtes de Fuenclara, qui la gardèrent jusqu'à l'abolition des seigneuries au début du XIXe siècle.\n\nEn 1495, le village comptait 39 feux, presque tous morisques. Après leur expulsion en 1609, il fallut le repeupler."},{"h":"À voir","t":"C'est un bâtiment isolé et allongé, de trois étages et de grandes caves. L'intérieur a été réaménagé pour des services municipaux, et un petit musée ethnographique occupe les caves voûtées en brique.\n\nLuceni conserve aussi l'école-chapelle de la sucrerie, au plan en forme de E. La sucrerie ouvrit en 1911 et ferma en 1985."}],"de":[{"h":"Geschichte","t":"1443 erwarb Bartolomé de Reus die Herrschaft und gründete das Majorat von Luceni und Boquiñeni. Später ging sie an die Grafen von Fuenclara, die sie bis zur Abschaffung der Herrschaften Anfang des 19. Jahrhunderts hielten.\n\n1495 hatte das Dorf 39 Herdstellen, fast alle von Morisken. Nach ihrer Vertreibung 1609 musste es neu besiedelt werden."},{"h":"Sehenswert","t":"Es ist ein freistehender, langgestreckter Bau mit drei Geschossen und großen Kellern. Das Innere wurde für Gemeindedienste umgebaut, und in den gewölbten Backsteinkellern wurde ein kleines Volkskundemuseum eingerichtet.\n\nLuceni bewahrt auch die Schulkapelle der Zuckerfabrik mit E-förmigem Grundriss. Die Fabrik öffnete 1911 und schloss 1985."}],"pt":[{"h":"História","t":"Em 1443 Bartolomé de Reus ficou com o senhorio e fundou o morgadio de Luceni e Boquiñeni. Depois passou para os condes de Fuenclara, que o mantiveram até à abolição dos senhorios no início do século XIX.\n\nEm 1495 a aldeia tinha 39 fogos, quase todos mouriscos. Após a sua expulsão em 1609 foi preciso repovoá-la."},{"h":"O que ver","t":"É um edifício isolado e alongado, de três pisos e grandes adegas. O interior foi remodelado para serviços municipais, e nas adegas abobadadas de tijolo instalou-se um pequeno museu etnográfico.\n\nLuceni conserva também a escola-capela da fábrica de açúcar, com planta em forma de E. A fábrica abriu em 1911 e fechou em 1985."}]},"status":"pending"},{"id":"el-castellar","town":"Torres de Berrellén","cat":"arqueologia","lat":41.78595,"lon":-1.06119,"coord_src":null,"q":["El Castellar, Torres de Berrellén","Ermita de la Virgen del Castellar"],"fq":["Category:El Castellar (Torres de Berrellén)","El Castellar Torres de Berrellén"],"name":{"es":"El Castellar","en":"El Castellar","fr":"El Castellar","de":"El Castellar","pt":"El Castellar"},"when":{"es":"Fundado en 1080 · Bien de Interés Cultural (2006)","en":"Founded 1080 · Site of Cultural Interest (2006)","fr":"Fondé en 1080 · Bien d'intérêt culturel (2006)","de":"1080 gegründet · Kulturgut (BIC, 2006)","pt":"Fundado em 1080 · Bem de Interesse Cultural (2006)"},"desc":{"es":"El Castellar es un pueblo medieval abandonado sobre un cortado de yeso, frente a Torres de Berrellén. Lo fundó Sancho Ramírez en 1080 para vigilar la Zaragoza musulmana, y solo se llega cruzando el Ebro.","en":"El Castellar is an abandoned medieval village on a gypsum cliff opposite Torres de Berrellén. Sancho Ramírez founded it in 1080 to watch over Muslim Zaragoza, and you can only reach it by crossing the Ebro.","fr":"El Castellar est un village médiéval abandonné sur une falaise de gypse, face à Torres de Berrellén. Sancho Ramírez le fonda en 1080 pour surveiller la Saragosse musulmane, et on n'y accède qu'en traversant l'Èbre.","de":"El Castellar ist ein verlassenes mittelalterliches Dorf auf einer Gipsklippe gegenüber Torres de Berrellén. Sancho Ramírez gründete es 1080, um das muslimische Zaragoza zu überwachen, und man erreicht es nur über den Ebro.","pt":"El Castellar é uma aldeia medieval abandonada sobre uma escarpa de gesso, em frente de Torres de Berrellén. Sancho Ramírez fundou-a em 1080 para vigiar a Saragoça muçulmana, e só se chega lá atravessando o Ebro."},"visit":{"es":"El yacimiento está en ruinas: no te acerques al borde del cortado ni subas a los muros. El acceso habitual es cruzar el río con la barca de Torres de Berrellén.","en":"The site is in ruins: keep away from the cliff edge and do not climb the walls. The usual access is to cross the river on the Torres de Berrellén ferry.","fr":"Le site est en ruine : restez loin du bord de la falaise et ne montez pas sur les murs. L'accès habituel consiste à traverser le fleuve avec le bac de Torres de Berrellén.","de":"Die Stätte ist eine Ruine: Halten Sie Abstand zur Klippenkante und klettern Sie nicht auf die Mauern. Üblicherweise überquert man den Fluss mit der Fähre von Torres de Berrellén.","pt":"O sítio está em ruínas: afaste-se da beira da escarpa e não suba aos muros. O acesso habitual é atravessar o rio na barca de Torres de Berrellén."},"src":"https://www.territoriomudejar.es/en/?p=23592","sources":["https://www.territoriomudejar.es/en/?p=23592","https://www.territoriomudejar.es/en/?p=26856","https://www.escapadarural.com/blog/como-llegar-el-castellar-barcaza-rio-ebro/","https://es.hispanopedia.com/wiki/Torres_de_Berrell%C3%A9n"],"art":{"es":[{"h":"Historia","t":"El rey Sancho Ramírez levantó la fortaleza en 1080, cerca de la medina islámica de Saraqusta. Fue una pieza clave en la conquista de Zaragoza por Alfonso I en 1118.\n\nLos vecinos recibieron tierras en la otra orilla del Ebro y construyeron allí casas de labor, las «torres», que acabaron siendo pueblos. Durante el siglo XV El Castellar se fue vaciando mientras crecía Torres de Berrellén."},{"h":"Qué ver","t":"Sobre el espolón de yeso, a unos 320 metros de altitud, quedan la puerta del recinto, restos de muralla, casas, conducciones de agua y enterramientos. El yeso era el principal material de construcción.\n\nEl único edificio en pie es la ermita de la Virgen del Castellar, del siglo XIX, que sustituyó a una iglesia medieval."},{"h":"Curiosidades","t":"Una leyenda cuenta que Alfonso I encerró aquí a su esposa, la reina Urraca, tras una disputa. Es solo una leyenda. El 8 de mayo y el último domingo de septiembre hay romería a la ermita."}],"en":[{"h":"History","t":"King Sancho Ramírez built the fortress in 1080, near the Islamic medina of Saraqusta. It was key to the conquest of Zaragoza by Alfonso I in 1118.\n\nThe inhabitants were granted land on the other bank of the Ebro and built farmhouses there, the «torres», which eventually became villages. During the 15th century El Castellar slowly emptied while Torres de Berrellén grew."},{"h":"What to see","t":"On the gypsum spur, about 320 metres above sea level, remain the gate of the enclosure, stretches of wall, houses, water channels and burials. Gypsum was the main building material.\n\nThe only standing building is the 19th-century hermitage of the Virgen del Castellar, which replaced a medieval church."},{"h":"Did you know?","t":"A legend says that Alfonso I shut his wife, Queen Urraca, in here after a quarrel. It is only a legend. On 8 May and the last Sunday of September there is a pilgrimage to the hermitage."}],"fr":[{"h":"Histoire","t":"Le roi Sancho Ramírez éleva la forteresse en 1080, près de la médina islamique de Saraqusta. Elle joua un rôle clé dans la conquête de Saragosse par Alphonse Ier en 1118.\n\nLes habitants reçurent des terres sur l'autre rive de l'Èbre et y bâtirent des fermes, les « torres », qui devinrent des villages. Au XVe siècle, El Castellar se vida peu à peu tandis que Torres de Berrellén grandissait."},{"h":"À voir","t":"Sur l'éperon de gypse, à environ 320 mètres d'altitude, subsistent la porte de l'enceinte, des pans de muraille, des maisons, des conduites d'eau et des sépultures. Le gypse était le principal matériau de construction.\n\nLe seul édifice debout est l'ermitage de la Virgen del Castellar, du XIXe siècle, qui remplaça une église médiévale."},{"h":"Le saviez-vous ?","t":"Une légende raconte qu'Alphonse Ier y enferma son épouse, la reine Urraca, après une dispute. Ce n'est qu'une légende. Le 8 mai et le dernier dimanche de septembre, un pèlerinage monte à l'ermitage."}],"de":[{"h":"Geschichte","t":"König Sancho Ramírez errichtete die Festung 1080 nahe der islamischen Medina von Saraqusta. Sie war entscheidend für die Eroberung Zaragozas durch Alfons I. im Jahr 1118.\n\nDie Bewohner erhielten Land am anderen Ebroufer und bauten dort Gehöfte, die «torres», aus denen Dörfer wurden. Im 15. Jahrhundert leerte sich El Castellar allmählich, während Torres de Berrellén wuchs."},{"h":"Sehenswert","t":"Auf dem Gipssporn, etwa 320 Meter hoch, sind das Tor der Anlage, Mauerreste, Häuser, Wasserleitungen und Gräber erhalten. Gips war das wichtigste Baumaterial.\n\nDas einzige stehende Gebäude ist die Einsiedelei der Virgen del Castellar aus dem 19. Jahrhundert, die eine mittelalterliche Kirche ersetzte."},{"h":"Wussten Sie?","t":"Einer Legende nach sperrte Alfons I. hier seine Frau, Königin Urraca, nach einem Streit ein. Es ist nur eine Legende. Am 8. Mai und am letzten Sonntag im September gibt es eine Wallfahrt zur Einsiedelei."}],"pt":[{"h":"História","t":"O rei Sancho Ramírez ergueu a fortaleza em 1080, perto da medina islâmica de Saraqusta. Foi decisiva na conquista de Saragoça por Afonso I em 1118.\n\nOs habitantes receberam terras na outra margem do Ebro e construíram ali casas de lavoura, as «torres», que acabaram por ser aldeias. Durante o século XV El Castellar foi-se esvaziando enquanto Torres de Berrellén crescia."},{"h":"O que ver","t":"Sobre o esporão de gesso, a cerca de 320 metros de altitude, restam a porta do recinto, troços de muralha, casas, condutas de água e sepulturas. O gesso era o principal material de construção.\n\nO único edifício de pé é a ermida da Virgen del Castellar, do século XIX, que substituiu uma igreja medieval."},{"h":"Sabia que?","t":"Uma lenda conta que Afonso I fechou aqui a esposa, a rainha Urraca, depois de uma discussão. É só uma lenda. A 8 de maio e no último domingo de setembro há romaria à ermida."}]},"status":"pending"},{"id":"barca-castellar","town":"Torres de Berrellén","cat":"hidraulico","lat":41.77564,"lon":-1.059,"coord_src":null,"q":["Barca, Torres de Berrellén","Torres de Berrellén Ebro"],"fq":["Barca Torres de Berrellén","Torres de Berrellén barca"],"name":{"es":"La barca de El Castellar","en":"The El Castellar ferry","fr":"Le bac d'El Castellar","de":"Die Fähre von El Castellar","pt":"A barca de El Castellar"},"when":{"es":"Paso documentado desde el siglo XIII","en":"Crossing recorded since the 13th c.","fr":"Passage attesté depuis le XIIIe siècle","de":"Übergang seit dem 13. Jh. belegt","pt":"Travessia documentada desde o séc. XIII"},"desc":{"es":"Una barca movida a mano con un cable y una polea cruza el Ebro en Torres de Berrellén. Es uno de los pocos pasos de barca que siguen en uso en el río.","en":"A ferry moved by hand along a cable with a pulley crosses the Ebro at Torres de Berrellén. It is one of the few ferry crossings still in use on the river.","fr":"Un bac mû à la main le long d'un câble, avec une poulie, traverse l'Èbre à Torres de Berrellén. C'est l'un des rares bacs encore en service sur le fleuve.","de":"Eine von Hand an einem Seil mit Umlenkrolle bewegte Fähre überquert in Torres de Berrellén den Ebro. Sie ist eine der wenigen Fähren, die auf dem Fluss noch in Betrieb sind.","pt":"Uma barca movida à mão ao longo de um cabo, com uma roldana, atravessa o Ebro em Torres de Berrellén. É uma das poucas travessias de barca ainda em uso no rio."},"visit":{"es":"No tiene un horario fijo publicado. Consulta en el Ayuntamiento de Torres de Berrellén antes de ir. Sigue siempre las indicaciones del barquero.","en":"There is no published fixed timetable. Check with Torres de Berrellén town hall before you go. Always follow the ferryman's instructions.","fr":"Il n'y a pas d'horaire fixe publié. Renseignez-vous à la mairie de Torres de Berrellén avant d'y aller. Suivez toujours les consignes du passeur.","de":"Es gibt keinen veröffentlichten festen Fahrplan. Erkundigen Sie sich vorher im Rathaus von Torres de Berrellén. Folgen Sie immer den Anweisungen des Fährmanns.","pt":"Não tem horário fixo publicado. Informe-se na câmara municipal de Torres de Berrellén antes de ir. Siga sempre as indicações do barqueiro."},"src":"https://www.escapadarural.com/blog/como-llegar-el-castellar-barcaza-rio-ebro/","sources":["https://www.escapadarural.com/blog/como-llegar-el-castellar-barcaza-rio-ebro/","https://www.territoriomudejar.es/en/?p=26856"],"art":{"es":[{"h":"Historia","t":"El paso de barca existe por lo menos desde el siglo XIII: documentos de Pedro III de Aragón de 1279 y 1280 lo ponen bajo control real.\n\nLa barca actual es moderna, pero funciona como las antiguas: se desliza sujeta a un cable que cruza el río."},{"h":"Qué ver","t":"El barquero la mueve a mano con una polea, algo que exige fuerza y oficio, sobre todo con mal tiempo. Puede llevar hasta cinco coches, según su tamaño, y más de cien personas.\n\nLos días de romería al Castellar, el 8 de mayo y el último domingo de septiembre, cruzan en ella muchos vecinos y devotos."}],"en":[{"h":"History","t":"The ferry crossing has existed at least since the 13th century: documents of Pedro III of Aragon from 1279 and 1280 place it under royal control.\n\nThe current boat is modern, but it works like the old ones: it slides along a cable stretched across the river."},{"h":"What to see","t":"The ferryman moves it by hand with a pulley, which takes strength and skill, especially in bad weather. It can carry up to five cars, depending on their size, and more than a hundred people.\n\nOn the pilgrimage days to El Castellar, 8 May and the last Sunday of September, many locals and pilgrims cross on it."}],"fr":[{"h":"Histoire","t":"Le passage existe au moins depuis le XIIIe siècle : des documents de Pierre III d'Aragon de 1279 et 1280 le placent sous contrôle royal.\n\nLe bac actuel est moderne, mais il fonctionne comme les anciens : il glisse le long d'un câble tendu d'une rive à l'autre."},{"h":"À voir","t":"Le passeur le manœuvre à la main avec une poulie, ce qui demande force et savoir-faire, surtout par mauvais temps. Il peut transporter jusqu'à cinq voitures, selon leur taille, et plus de cent personnes.\n\nLes jours de pèlerinage à El Castellar, le 8 mai et le dernier dimanche de septembre, de nombreux habitants et fidèles l'empruntent."}],"de":[{"h":"Geschichte","t":"Den Fährübergang gibt es mindestens seit dem 13. Jahrhundert: Urkunden Peters III. von Aragonien von 1279 und 1280 stellen ihn unter königliche Kontrolle.\n\nDas heutige Boot ist modern, funktioniert aber wie die alten: Es gleitet an einem über den Fluss gespannten Seil entlang."},{"h":"Sehenswert","t":"Der Fährmann bewegt sie von Hand mit einer Rolle, was Kraft und Geschick erfordert, besonders bei schlechtem Wetter. Sie kann bis zu fünf Autos, je nach Größe, und über hundert Menschen befördern.\n\nAn den Wallfahrtstagen nach El Castellar, am 8. Mai und am letzten Sonntag im September, setzen viele Einheimische und Pilger mit ihr über."}],"pt":[{"h":"História","t":"A travessia existe pelo menos desde o século XIII: documentos de Pedro III de Aragão de 1279 e 1280 colocam-na sob controlo real.\n\nA barca atual é moderna, mas funciona como as antigas: desliza presa a um cabo que atravessa o rio."},{"h":"O que ver","t":"O barqueiro move-a à mão com uma roldana, o que exige força e ofício, sobretudo com mau tempo. Pode levar até cinco carros, consoante o tamanho, e mais de cem pessoas.\n\nNos dias de romaria a El Castellar, 8 de maio e último domingo de setembro, muitos habitantes e devotos atravessam nela."}]},"status":"pending"},{"id":"san-andres-torres","town":"Torres de Berrellén","cat":"patrimonio","lat":41.75724,"lon":-1.06445,"coord_src":null,"q":["Iglesia de San Andrés, Torres de Berrellén","Torres de Berrellén"],"fq":["Category:Torres de Berrellén","Torres de Berrellén iglesia"],"name":{"es":"Iglesia de San Andrés","en":"Church of San Andrés","fr":"Église San Andrés","de":"Kirche San Andrés","pt":"Igreja de San Andrés"},"when":{"es":"Siglo XVI · Mudéjar y neomudéjar · BIC","en":"16th c. · Mudéjar and neo-Mudéjar · BIC","fr":"XVIe s. · Mudéjar et néo-mudéjar · BIC","de":"16. Jh. · Mudéjar und Neo-Mudéjar · BIC","pt":"Séc. XVI · Mudéjar e neomudéjar · BIC"},"desc":{"es":"La iglesia de San Andrés tiene dos torres: una mudéjar y otra neomudéjar. Es del siglo XVI y en el siglo XX se restauró a fondo, con ladrillo visto y un pórtico nuevo.","en":"The church of San Andrés has two towers: one Mudéjar and one neo-Mudéjar. It dates from the 16th century and was thoroughly restored in the 20th, with exposed brick and a new portico.","fr":"L'église San Andrés a deux tours : l'une mudéjare, l'autre néo-mudéjare. Elle date du XVIe siècle et fut profondément restaurée au XXe, avec brique apparente et nouveau portique.","de":"Die Kirche San Andrés hat zwei Türme: einen im Mudéjar- und einen im Neo-Mudéjar-Stil. Sie stammt aus dem 16. Jahrhundert und wurde im 20. Jahrhundert gründlich restauriert, mit Sichtziegeln und neuer Vorhalle.","pt":"A igreja de San Andrés tem duas torres: uma mudéjar e outra neomudéjar. É do século XVI e no século XX foi profundamente restaurada, com tijolo à vista e um novo pórtico."},"visit":{"es":"Está en el centro de Torres de Berrellén. Se visita en horario de culto.","en":"It is in the centre of Torres de Berrellén. You can visit during services.","fr":"Elle se trouve au centre de Torres de Berrellén. Visite pendant les offices.","de":"Sie liegt im Zentrum von Torres de Berrellén. Besichtigung während der Gottesdienste.","pt":"Fica no centro de Torres de Berrellén. Visita-se durante o culto."},"src":"https://www.territoriomudejar.es/en/?p=23592","sources":["https://www.territoriomudejar.es/en/?p=23592","https://es.hispanopedia.com/wiki/Torres_de_Berrell%C3%A9n"],"art":{"es":[{"h":"Historia","t":"El templo es del siglo XVI y está protegido como Bien de Interés Cultural. En el último tercio del siglo XX lo restauró el arquitecto José Lu
