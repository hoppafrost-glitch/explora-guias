/* Layout: one-screen app. Map is the stage; a reading panel sits beside it (stacked under it on phones).
   Palette drawn from the Ribera: limestone ground, Ebro teal, mudéjar brick, steppe ochre. */
:root{
  --bg:#ECEFEA; --panel:#FAFBF8; --panel-2:#F2F4EF; --ink:#18221E; --muted:#56635D; --faint:#646F6A;
  --line:#D5DBD3; --accent:#17646C; --accent-ink:#FFFFFF; --accent-soft:#D6E8E8;
  --land:#E2E6DB; --land-hi:#D5DCCB; --land-out:#EEF0EA; --edge:#9AA79C; --outline:#17646C;
  --water:#3C8D96; --water-soft:#BFDCDD; --label:#2E3A35;
  --c-pat:#A4502C; --c-gue:#5A6A33; --c-mus:#7A4A7F; --c-hid:#2A6CA1; --c-nat:#3C8550; --c-arq:#97702F; --c-cam:#B98A0E;
  --ok:#2E7D4F; --shadow:0 1px 2px rgba(20,34,30,.08),0 6px 18px rgba(20,34,30,.08);
  --f-display:"Spectral",Georgia,"Times New Roman",serif;
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --panel:#141C19; --panel-2:#19231F; --ink:#E5ECE8; --muted:#9FADA7; --faint:#7E8C86;
  --line:#26332E; --accent:#5DB6BE; --accent-ink:#0B1513; --accent-soft:#183437;
  --land:#1A2420; --land-hi:#21302A; --land-out:#111815; --edge:#3A4A43; --outline:#5DB6BE;
  --water:#3E8F98; --water-soft:#1B3A3D; --label:#C9D4CF;
  --c-pat:#E08A63; --c-gue:#A9B872; --c-mus:#C08BC5; --c-hid:#6FA9DA; --c-nat:#7CC48D; --c-arq:#D6AE68; --c-cam:#E5BD45;
  --ok:#69C08E; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --panel:#141C19; --panel-2:#19231F; --ink:#E5ECE8; --muted:#9FADA7; --faint:#7E8C86;
  --line:#26332E; --accent:#5DB6BE; --accent-ink:#0B1513; --accent-soft:#183437;

  --ok:#69C08E; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

#app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:1001}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.brand svg{flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:1.28rem;line-height:1.1;letter-spacing:.01em}
.brand-sub{font-size:.74rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel-2)}
.langs button{border:0;background:transparent;padding:5px 10px;font-size:.78rem;font-weight:600;letter-spacing:.05em;cursor:pointer;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.demo-tag{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);border-radius:4px;padding:2px 6px}

main{display:grid;grid-template-columns:minmax(330px,410px) 1fr;min-height:0}
#panel{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
#mapwrap{position:relative;min-height:0;min-width:0}
#map{position:absolute;inset:0;background:var(--bg)}
@media (max-width:760px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(260px,46%) 1fr}
  #mapwrap{order:-1}
  #panel{border-right:0;border-top:1px solid var(--line)}

.tbl th{color:var(--faint);font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em}
.tbl td.n{text-align:right}
.note{font-size:.78rem;color:var(--faint);line-height:1.45}

/* Map */
.leaflet-container{font-family:var(--f-ui);background:var(--bg)}
.muni{fill:var(--land);stroke:var(--edge);stroke-width:.8}
.muni.out{fill:var(--land-out);stroke:var(--edge);stroke-opacity:.45;stroke-width:.6}
.muni.hl{fill:var(--land-hi)}
.comarca-outline{fill:none;stroke:var(--outline);stroke-width:2.2;stroke-dasharray:1 0}
.river-halo{stroke:var(--water-soft);stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.river{stroke:var(--water);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tiles-on .muni{fill-opacity:.0;stroke-opacity:.6}
.tiles-on .muni.out{fill-opacity:0}
.tiles-on .river,.tiles-on .river-halo{stroke-opacity:0}
.tiles-on .town-label,.tiles-on .river-label{display:none}
.tiles-on .comarca-outline{stroke-width:2.6;stroke-opacity:.85}
.route-line{stroke:var(--c);stroke-width:3.5;stroke-dasharray:2 7;stroke-linecap:round;fill:none}
.town-label{font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--label);white-space:nowrap;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 6px var(--bg);pointer-events:none;letter-spacing:.02em;transform:translate(-50%,7px);display:inline-block}
.town-label.out{font-weight:500;font-size:11px;color:var(--faint);font-style:italic}
.river-label{font-family:var(--f-display);font-style:italic;font-size:14px;color:var(--water);letter-spacing:.35em;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg);white-space:nowrap;pointer-events:none;transform:translate(-50%,-50%) rotate(-12deg);display:inline-block}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 6px;transform:rotate(-45deg);background:var(--c);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.35);border:2px solid var(--panel);transition:transform .15s}
.pin svg{width:15px;height:15px;transform:rotate(45deg);color:#fff}
.pin.sel{transform:rotate(-45deg) scale(1.28);border-color:var(--ink)}
.pin.dim{opacity:.28}
.zlow .pin{width:13px;height:13px;border-radius:50%;transform:translate(-2.5px,23.5px);border-width:1.5px}
.zlow .pin svg{display:none}
.zlow .pin.sel{transform:translate(-2.5px,23.5px) scale(1.6)}
.zfar .town-label.minor{display:none}
.stopnum{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--panel);font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--panel);transform:translate(14px,-40px);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.zlow .stopnum{transform:translate(4px,-14px)}
.leaflet-control-zoom a,.mapbtn{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:var(--shadow)!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 85%,transparent)!important;color:var(--muted)!important;font-size:10px!important}
.leaflet-control-attribution a{color:var(--accent)!important}
.leaflet-top.leaflet-left{left:env(safe-area-inset-left,0px)}
.layerbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;display:flex;flex-direction:column;gap:2px}
.layerbox button{border:0;background:none;text-align:left;padding:6px 10px;border-radius:6px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--muted)}
.layerbox button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.legend{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px 10px;font-size:.74rem;display:flex;flex-direction:column;gap:3px;max-width:180px}
.legend div{display:flex;align-items:center;gap:7px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
@media (max-width:760px){.legend{display:none}.layerbox{flex-direction:row;padding:3px;margin-left:max(10px,env(safe-area-inset-left,0px))!important}.layerbox button{padding:5px 8px;font-size:.72rem}.leaflet-bottom.leaflet-left{bottom:16px}}

/* Móvil: la página entera hace scroll; el mapa queda arriba y se va al bajar, así se lee a pantalla completa */
@media (max-width:760px){
  html,body{height:auto}
  #app{height:auto;display:block}
  main{display:flex;flex-direction:column}
  #mapwrap{order:-1;height:40vh;height:40svh;min-height:230px;flex:none}
  #panel{min-height:calc(100vh - 56px);min-height:calc(100svh - 56px)}
  nav.tabs{position:sticky;top:0;z-index:1002;background:var(--panel)}
  .view{overflow:visible;flex:none;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  #tomap{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:1500;display:flex;align-items:center;gap:7px;
    border:0;border-radius:999px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.86rem;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;
    transition:opacity .2s,transform .2s}
  #tomap svg{width:17px;height:17px}
  #tomap[data-off]{opacity:0;transform:translateY(12px);pointer-events:none}
}
@media (min-width:761px){#tomap{display:none}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:8px;font-size:.86rem;z-index:5000;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- avisos, pasaporte, agenda, gestión ---- */
.btn.primary span,.btn.primary{color:var(--accent-ink)}
.aviso{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--panel-2);border-radius:10px;padding:10px 12px;font-size:.88rem}
.aviso b{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.aviso.warn{border-left-color:#B4441F}.aviso.warn b{color:#B4441F}
.aviso.prize{border-left-color:#B8860B}.aviso.prize b{color:#8A6508}
.stampbox,.passcta{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel-2)}
.passcta{width:100%;cursor:pointer;font:inherit;color:var(--ink);text-align:left}
.passcta:hover{border-color:var(--accent)}
.passcta .go{margin-left:auto;font-size:1.4rem;color:var(--muted)}
.seal{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--c,var(--accent));color:var(--c,var(--accent))}
.seal svg{width:22px;height:22px}
.stampbox.done .seal{border-style:solid;background:var(--c);color:#fff}
.passcta.ag .seal{border-style:solid;border-radius:12px}
.passhead{display:flex;align-items:center;gap:16px}
.ring{--p:0;flex:none;width:92px;height:92px;border-radius:50%;display:grid;place-content:center;text-align:center;
  background:radial-gradient(closest-side,var(--panel) 78%,transparent 79%),conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
.ring b{font-size:1.6rem;line-height:1}.ring span{font-size:.75rem;color:var(--muted)}
.prow{display:grid;grid-template-columns:1fr;gap:4px;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);cursor:pointer;font:inherit;color:var(--ink)}
.prow .t{font-weight:600;font-size:.92rem}
.pbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.pbar i{display:block;height:100%;background:var(--c)}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin:6px 0 10px}
.stamp{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;cursor:pointer;font:inherit;color:var(--muted);padding:4px}
.stamp .seal{width:58px;height:58px;border-color:var(--line)}
.stamp.on .seal{border:2px solid var(--c);background:var(--c);color:#fff}
.stamp.on{color:var(--ink)}
.stamp .nm{font-size:.74rem;line-height:1.25;text-align:center;overflow-wrap:break-word;hyphens:auto;max-width:100%}
.ev{display:flex;gap:12px;border-bottom:1px solid var(--line);padding:10px 0}
.ev p{margin:2px 0 0;font-size:.88rem}
.cal{flex:none;width:52px;border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:center;background:var(--panel)}
.cal span{display:block;background:var(--accent);color:var(--accent-ink);font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 0}
.cal b{display:block;font-size:1.2rem;padding:4px 0}
.cal{align-self:flex-start}.cal.m{border:2px solid var(--accent)}.cal.m b{font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);padding:9px 0}
.bars.wide .bar{grid-template-columns:minmax(0,1.4fr) 1fr auto}.bars.wide .bar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.neg{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:8px 0}
.adm-nav{display:flex;flex-wrap:wrap;gap:6px}
.adm-nav a{font-size:.8rem;border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--ink);text-decoration:none;background:var(--panel-2)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.two-col{grid-template-columns:1fr}}
.foot-links{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;padding-bottom:8px}
.foot-links a{color:var(--muted)}
details summary{cursor:pointer;padding:4px 0}
.skip{position:absolute;left:-9999px;top:8px;z-index:9999;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;font-weight:700}
.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

</style>

<div id="cover" hidden></div>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<div id="app"><a class="skip" href="#panel" data-i="skipLink"></a>
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="var(--accent)"/><path d="M4 22c5-1 6-7 11-7s5 9 10 9 4-6 5-7" stroke="var(--accent-ink)" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="23" cy="10" r="2.6" fill="var(--accent-ink)"/></svg>
      <div style="min-width:0">
        <h1 class="brand-name" style="margin:0">Ribera Alta del Ebro Explora</h1>
        <div class="brand-sub" data-i="appSub"></div>
      </div>
    </div>
    <span class="demo-tag" data-i="demo"></span>
    <div class="langs" role="group" aria-label="Idioma / Language" id="langs"></div>
  </header>
  <main>
    <aside id="panel">
      <nav class="tabs" role="tablist" id="tabs">
        <button role="tab" data-tab="inicio" data-i="tabHome"></button>
        <button role="tab" data-tab="explorar" data-i="tabExplore"></button>
        <button role="tab" data-tab="rutas" data-i="tabRoutes"></button>
        <button role="tab" data-tab="agenda" data-i="tabAgenda"></button>
        <button role="tab" data-tab="pasaporte" data-i="tabPass"></button>
      </nav>
      <section class="view stack" id="v-inicio"></section>
      <section class="view stack" id="v-explorar" hidden></section>
      <section class="view stack" id="v-lugar" hidden></section>
      <section class="view stack" id="v-rutas" hidden></section>
      <section class="view stack" id="v-agenda" hidden></section>
      <section class="view stack" id="v-pasaporte" hidden></section>
      <section class="view stack" id="v-gestion" hidden></section>
    </aside>
    <div id="mapwrap"><div id="map" role="application" aria-label="Mapa"></div></div>
    <button type="button" id="tomap" data-off><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 4-6 3v13l6-3 6 3 6-3V4l-6 3-6-3z"/><path d="M9 4v13M15 7v13"/></svg><span data-i="tabMap"></span></button>
  </main>
</div>

ultura-goya","categories":{"patrimonio":{"color":"--c-pat","icon":"<path d=\"M4 21V10l8-6 8 6v11\"/><path d=\"M9.5 21v-5.5a2.5 2.5 0 0 1 5 0V21\"/>"},"memoria":{"color":"--c-gue","icon":"<path d=\"M6 21V4\"/><path d=\"M6 4h11l-2.5 4L17 12H6\"/>"},"museo":{"color":"--c-mus","icon":"<path d=\"M3 9.5 12 4l9 5.5\"/><path d=\"M5.5 11v7M10 11v7M14 11v7M18.5 11v7\"/><path d=\"M3 20.5h18\"/>"},"arqueologia":{"color":"--c-arq","icon":"<path d=\"M9 3h6\"/><path d=\"M10 3v3.2C7.2 8 6.3 11 7 14.5L9 20h6l2-5.5c.7-3.5-.2-6.5-3-8.3V3\"/>"},"hidraulico":{"color":"--c-hid","icon":"<circle cx=\"12\" cy=\"12\" r=\"7.5\"/><circle cx=\"12\" cy=\"12\" r=\"1.8\"/><path d=\"M12 4.5v15M4.5 12h15M6.7 6.7l10.6 10.6M17.3 6.7 6.7 17.3\"/>"},"naturaleza":{"color":"--c-nat","icon":"<path d=\"M2.5 11c2.8-2.6 5.6-2.6 8 .3 2.4-2.9 5.2-2.9 8-.3\"/><path d=\"M8 17c1.6-1.5 3.2-1.5 4.6.2 1.4-1.7 3-1.7 4.6-.2\"/>"},"camino":{"color":"--c-cam","icon":"<path d=\"M12 20.5 3.5 9.2a9.5 9.5 0 0 1 17 0z\"/><path d=\"M12 20.5 8 6.5M12 20.5V5M12 20.5l4-14\"/>"}},"pois":[{"id":"san-pedro-alagon","town":"Alagón","cat":"patrimonio","lat":41.77022,"lon":-1.12197,"coord_src":null,"q":["Iglesia de San Pedro, Alagón","Torre de San Pedro, Alagón"],"fq":["Category:Iglesia de San Pedro (Alagón)","Torre San Pedro Alagón"],"name":{"es":"Iglesia y torre de San Pedro","en":"Church and tower of San Pedro","fr":"Église et tour de San Pedro","de":"Kirche und Turm San Pedro","pt":"Igreja e torre de San Pedro"},"when":{"es":"Hacia 1300 · Mudéjar aragonés","en":"Around 1300 · Aragonese Mudéjar","fr":"Vers 1300 · Mudéjar aragonais","de":"Um 1300 · Aragonesischer Mudéjar-Stil","pt":"Cerca de 1300 · Mudéjar aragonês"},"desc":{"es":"La iglesia de San Pedro es la joya mudéjar de la capital de la comarca. Su torre octogonal, exenta y de ladrillo, se ve desde toda la llanura y por dentro recuerda a los alminares almohades.","en":"The church of San Pedro is the Mudéjar jewel of the county town. Its free-standing octagonal brick tower can be seen across the plain, and inside it recalls an Almohad minaret.","fr":"L'église San Pedro est le joyau mudéjar du chef-lieu de la comarque. Sa tour octogonale en brique, isolée de l'église, se voit de toute la plaine et rappelle à l'intérieur les minarets almohades.","de":"Die Kirche San Pedro ist das Mudéjar-Juwel des Hauptorts der Comarca. Ihr freistehender achteckiger Backsteinturm ist in der ganzen Ebene zu sehen und erinnert innen an almohadische Minarette.","pt":"A igreja de San Pedro é a joia mudéjar da sede da comarca. A sua torre octogonal de tijolo, separada da igreja, vê-se de toda a planície e por dentro lembra os minaretes almóadas."},"visit":{"es":"Está en el centro de Alagón. Por dentro se visita en horario de culto o en visitas guiadas. Pregunta en el Ayuntamiento o en la oficina de turismo de Alagón por los horarios de apertura y las visitas guiadas.","en":"It is in the centre of Alagón. You can see the interior during services or on guided tours. Ask at the town hall or Alagón tourist office for opening times and guided tours.","fr":"Elle se trouve au centre d'Alagón. L'intérieur se visite pendant les offices ou lors de visites guidées. Renseignez-vous à la mairie ou à l'office de tourisme d'Alagón sur les horaires et les visites guidées.","de":"Sie liegt im Zentrum von Alagón. Innen ist sie während der Gottesdienste oder bei Führungen zu besichtigen. Öffnungszeiten und Führungen erfahren Sie im Rathaus oder im Tourismusbüro von Alagón.","pt":"Fica no centro de Alagón. O interior visita-se durante o culto ou em visitas guiadas. Informe-se na câmara municipal ou no posto de turismo de Alagón sobre horários e visitas guiadas."},"src":"https://www.territoriomudejar.es/patrimonio/alagon/?lang=en","sources":["https://www.territoriomudejar.es/patrimonio/alagon/?lang=en","https://www.ecured.cu/Alag%C3%B3n"],"art":{"es":[{"h":"Historia","t":"No se conoce la fecha exacta de su construcción. El profesor Gonzalo Borrás la sitúa hacia el año 1300 por su estilo y por los hechos que acogió la villa: las Cortes convocadas por Alfonso III en junio de 1288 y la boda de Pedro IV con María de Navarra en 1338. Algunas teorías la sitúan sobre una antigua mezquita.\n\nLa nave con su ábside poligonal es lo más antiguo. Después se añadieron capillas laterales, una galería de finales del Renacimiento y las capillas barrocas de Santa Ana y San Antonio."},{"h":"Qué ver","t":"La torre es octogonal y está separada del templo, junto a su esquina suroeste. Por fuera tiene tres cuerpos decorados con ladrillo en resalte. Por dentro sigue el esquema de los alminares almohades: una torre dentro de otra, con una escalera que sube entre ambas bajo pequeñas bóvedas de ladrillo. El reloj de sol se añadió en 1649.\n\nEl ábside tiene cinco lados por fuera y es semicircular por dentro. Junto con San Pablo de Zaragoza y Santa María de Tauste forma un grupo muy parecido en estructura y decoración."},{"h":"Curiosidades","t":"En la capilla del Santo Cristo hay un crucifijo de madera de hacia 1470 y yeserías con las armas del arzobispo Juan de Aragón. La parroquia conserva además una cruz procesional del platero zaragozano Juan de Ansa, de 1547."}],"en":[{"h":"History","t":"The exact building date is unknown. Professor Gonzalo Borrás places it around 1300, based on its style and on events held in the town: the Cortes summoned by Alfonso III in June 1288 and the wedding of Pedro IV and María of Navarre in 1338. Some theories place it on the site of an earlier mosque.\n\nThe nave with its polygonal apse is the oldest part. Side chapels, a late-Renaissance gallery and the Baroque chapels of Santa Ana and San Antonio were added later."},{"h":"What to see","t":"The tower is octagonal and stands apart from the church, by its south-west corner. Outside it has three sections decorated with projecting brick. Inside it follows the plan of Almohad minarets: a tower within a tower, with a staircase climbing between them under small brick vaults. The sundial was added in 1649.\n\nThe apse is five-sided outside and semicircular inside. Together with San Pablo in Zaragoza and Santa María in Tauste it forms a group very similar in structure and decoration."},{"h":"Did you know?","t":"The Santo Cristo chapel holds a wooden crucifix from around 1470 and plasterwork with the arms of Archbishop Juan de Aragón. The parish also keeps a processional cross made in 1547 by the Zaragoza silversmith Juan de Ansa."}],"fr":[{"h":"Histoire","t":"La date exacte de construction est inconnue. Le professeur Gonzalo Borrás la situe vers 1300, d'après son style et les événements accueillis par la ville : les Cortes convoquées par Alphonse III en juin 1288 et le mariage de Pierre IV avec Marie de Navarre en 1338. Certaines théories la placent sur une ancienne mosquée.\n\nLa nef et son abside polygonale sont la partie la plus ancienne. On y ajouta ensuite des chapelles latérales, une galerie de la fin de la Renaissance et les chapelles baroques de Santa Ana et San Antonio."},{"h":"À voir","t":"La tour est octogonale et séparée de l'église, à son angle sud-ouest. À l'extérieur, elle compte trois corps décorés de briques en saillie. À l'intérieur, elle suit le plan des minarets almohades : une tour dans une autre, avec un escalier qui monte entre les deux sous de petites voûtes de brique. Le cadran solaire fut ajouté en 1649.\n\nL'abside a cinq pans à l'extérieur et est semi-circulaire à l'intérieur. Avec San Pablo de Saragosse et Santa María de Tauste, elle forme un groupe très proche par sa structure et son décor."},{"h":"Le saviez-vous ?","t":"La chapelle du Santo Cristo abrite un crucifix en bois de vers 1470 et des stucs aux armes de l'archevêque Juan de Aragón. La paroisse conserve aussi une croix de procession de l'orfèvre saragossain Juan de Ansa, de 1547."}],"de":[{"h":"Geschichte","t":"Das genaue Baudatum ist unbekannt. Professor Gonzalo Borrás datiert sie um 1300, nach ihrem Stil und nach Ereignissen in der Stadt: den von Alfons III. im Juni 1288 einberufenen Cortes und der Hochzeit Peters IV. mit Maria von Navarra 1338. Einige Theorien vermuten an ihrer Stelle eine frühere Moschee.\n\nDas Schiff mit der polygonalen Apsis ist der älteste Teil. Später kamen Seitenkapellen, eine Galerie der Spätrenaissance und die barocken Kapellen Santa Ana und San Antonio hinzu."},{"h":"Sehenswert","t":"Der Turm ist achteckig und steht getrennt von der Kirche an ihrer Südwestecke. Außen hat er drei Geschosse mit Schmuck aus vorspringenden Ziegeln. Innen folgt er dem Schema almohadischer Minarette: ein Turm im Turm, mit einer Treppe dazwischen unter kleinen Ziegelgewölben. Die Sonnenuhr kam 1649 hinzu.\n\nDie Apsis ist außen fünfseitig und innen halbrund. Zusammen mit San Pablo in Zaragoza und Santa María in Tauste bildet die Kirche eine in Aufbau und Schmuck sehr ähnliche Gruppe."},{"h":"Wussten Sie?","t":"Die Kapelle des Santo Cristo birgt ein Holzkruzifix von etwa 1470 und Stuckarbeiten mit dem Wappen von Erzbischof Juan de Aragón. Die Pfarrei besitzt außerdem ein Vortragekreuz des Zaragozaner Silberschmieds Juan de Ansa von 1547."}],"pt":[{"h":"História","t":"Não se conhece a data exata da construção. O professor Gonzalo Borrás situa-a por volta de 1300, pelo estilo e pelos acontecimentos que a vila acolheu: as Cortes convocadas por Afonso III em junho de 1288 e o casamento de Pedro IV com Maria de Navarra em 1338. Algumas teorias colocam-na sobre uma antiga mesquita.\n\nA nave com a abside poligonal é a parte mais antiga. Depois acrescentaram-se capelas laterais, uma galeria do final do Renascimento e as capelas barrocas de Santa Ana e San Antonio."},{"h":"O que ver","t":"A torre é octogonal e está separada da igreja, junto ao seu canto sudoeste. Por fora tem três corpos decorados com tijolo em relevo. Por dentro segue o esquema dos minaretes almóadas: uma torre dentro de outra, com uma escada que sobe entre ambas sob pequenas abóbadas de tijolo. O relógio de sol foi acrescentado em 1649.\n\nA abside tem cinco lados por fora e é semicircular por dentro. Com San Pablo de Saragoça e Santa María de Tauste forma um grupo muito semelhante em estrutura e decoração."},{"h":"Sabia que?","t":"A capela do Santo Cristo guarda um crucifixo de madeira de cerca de 1470 e estuques com as armas do arcebispo Juan de Aragón. A paróquia conserva ainda uma cruz processional do ourives saragoçano Juan de Ansa, de 1547."}]},"status":"pending"},{"id":"casco-alagon","town":"Alagón","cat":"patrimonio","lat":41.77054,"lon":-1.12079,"coord_src":null,"q":["Plaza de España, Alagón","Alagón"],"fq":["Category:Alagón","Alagón casco"],"name":{"es":"Casco histórico de Alagón","en":"Historic centre of Alagón","fr":"Centre historique d'Alagón","de":"Altstadt von Alagón","pt":"Centro histórico de Alagón"},"when":{"es":"Villa medieval · Reconquistada en 1119","en":"Medieval town · Conquered in 1119","fr":"Ville médiévale · Conquise en 1119","de":"Mittelalterliche Stadt · 1119 erobert","pt":"Vila medieval · Conquistada em 1119"},"desc":{"es":"Alagón es la capital de la Ribera Alta del Ebro y una villa con mucha historia. Alfonso I la conquistó en 1119 y en 1136 se firmó aquí el Tratado de Alagón. Su casco conserva casas nobles del siglo XVI.","en":"Alagón is the capital of the Ribera Alta del Ebro and a town with a long history. Alfonso I conquered it in 1119, and the Treaty of Alagón was signed here in 1136. Its centre keeps 16th-century noble houses.","fr":"Alagón est le chef-lieu de la Ribera Alta del Ebro et une ville chargée d'histoire. Alphonse Ier la conquit en 1119 et le traité d'Alagón y fut signé en 1136. Son centre conserve des maisons nobles du XVIe siècle.","de":"Alagón ist der Hauptort der Ribera Alta del Ebro und eine geschichtsreiche Stadt. Alfons I. eroberte sie 1119, und 1136 wurde hier der Vertrag von Alagón geschlossen. Die Altstadt bewahrt Adelshäuser des 16. Jahrhunderts.","pt":"Alagón é a sede da Ribera Alta del Ebro e uma vila com muita história. Afonso I conquistou-a em 1119 e em 1136 assinou-se aqui o Tratado de Alagón. O centro conserva casas nobres do século XVI."},"visit":{"es":"El centro se recorre a pie en una hora. Un buen punto de partida es la plaza de la iglesia de San Pedro. Pregunta en el Ayuntamiento o en la oficina de turismo de Alagón por los horarios de apertura y las visitas guiadas.","en":"The centre can be walked in an hour. The square by San Pedro church is a good starting point. Ask at the town hall or Alagón tourist office for opening times and guided tours.","fr":"Le centre se parcourt à pied en une heure. La place de l'église San Pedro est un bon point de départ. Renseignez-vous à la mairie ou à l'office de tourisme d'Alagón sur les horaires et les visites guidées.","de":"Das Zentrum lässt sich in einer Stunde zu Fuß erkunden. Der Platz an der Kirche San Pedro ist ein guter Ausgangspunkt. Öffnungszeiten und Führungen erfahren Sie im Rathaus oder im Tourismusbüro von Alagón.","pt":"O centro percorre-se a pé numa hora. A praça da igreja de San Pedro é um bom ponto de partida. Informe-se na câmara municipal ou no posto de turismo de Alagón sobre horários e visitas guiadas."},"src":"https://www.ecured.cu/Alag%C3%B3n","sources":["https://www.ecured.cu/Alag%C3%B3n","https://www.territoriomudejar.es/patrimonio/alagon/?lang=en"],"art":{"es":[{"h":"Historia","t":"De la época musulmana se sabe poco, salvo que en la villa vivía una comunidad mozárabe. Alfonso I el Batallador la conquistó en 1119 y en diciembre de ese año nombró a su primer tenente, Lope Garcés Peregrino. En 1131 el rey hizo donaciones en Alagón al arzobispo de Auch, y en 1136 se acordó aquí el Tratado de Alagón.\n\nCerca del pueblo hay una necrópolis ibérica y restos de un puente romano."},{"h":"Qué ver","t":"Pasea entre San Pedro, la iglesia de San Antonio y la de San Juan Bautista. En la calle Jota Aragonesa, números 3 y 5, se conserva una casa noble del siglo XVI que encargó el protonotario Felipe Climent.\n\nMuy cerca quedan la ermita de la Virgen del Castillo y la antigua azucarera, y a unos dos kilómetros, junto al Jalón, El Caracol y las murallas del Canal Imperial."}],"en":[{"h":"History","t":"Little is known about the Muslim period, except that a Mozarabic community lived in the town. Alfonso I the Battler conquered it in 1119 and in December that year appointed its first governor, Lope Garcés Peregrino. In 1131 the king made grants in Alagón to the Archbishop of Auch, and in 1136 the Treaty of Alagón was agreed here.\n\nNear the town there is an Iberian cemetery and the remains of a Roman bridge."},{"h":"What to see","t":"Walk between San Pedro, the church of San Antonio and San Juan Bautista. At numbers 3 and 5 of Calle Jota Aragonesa stands a 16th-century noble house commissioned by the protonotary Felipe Climent.\n\nClose by are the Virgen del Castillo hermitage and the old sugar factory, and about two kilometres away, by the Jalón, El Caracol and the walls of the Imperial Canal."}],"fr":[{"h":"Histoire","t":"On sait peu de choses de l'époque musulmane, sinon qu'une communauté mozarabe vivait dans la ville. Alphonse Ier le Batailleur la conquit en 1119 et nomma en décembre son premier gouverneur, Lope Garcés Peregrino. En 1131, le roi fit des donations à Alagón à l'archevêque d'Auch, et en 1136 le traité d'Alagón y fut conclu.\n\nPrès de la ville se trouvent une nécropole ibère et les restes d'un pont romain."},{"h":"À voir","t":"Promenez-vous entre San Pedro, l'église San Antonio et San Juan Bautista. Aux numéros 3 et 5 de la calle Jota Aragonesa se dresse une maison noble du XVIe siècle commandée par le protonotaire Felipe Climent.\n\nTout près se trouvent l'ermitage de la Virgen del Castillo et l'ancienne sucrerie, et à environ deux kilomètres, au bord du Jalón, El Caracol et les murs du Canal impérial."}],"de":[{"h":"Geschichte","t":"Über die muslimische Zeit weiß man wenig, außer dass in der Stadt eine mozarabische Gemeinde lebte. Alfons I. der Kämpfer eroberte sie 1119 und ernannte im Dezember ihren ersten Statthalter, Lope Garcés Peregrino. 1131 machte der König in Alagón Schenkungen an den Erzbischof von Auch, und 1136 wurde hier der Vertrag von Alagón vereinbart.\n\nIn der Nähe gibt es eine iberische Nekropole und Reste einer römischen Brücke."},{"h":"Sehenswert","t":"Spazieren Sie zwischen San Pedro, der Kirche San Antonio und San Juan Bautista. In der Calle Jota Aragonesa Nr. 3 und 5 steht ein Adelshaus aus dem 16. Jahrhundert, das der Protonotar Felipe Climent bauen ließ.\n\nGanz in der Nähe liegen die Einsiedelei Virgen del Castillo und die alte Zuckerfabrik, und etwa zwei Kilometer entfernt, am Jalón, El Caracol und die Mauern des Kaiserkanals."}],"pt":[{"h":"História","t":"Da época muçulmana sabe-se pouco, exceto que na vila vivia uma comunidade moçárabe. Afonso I, o Batalhador, conquistou-a em 1119 e em dezembro desse ano nomeou o seu primeiro governador, Lope Garcés Peregrino. Em 1131 o rei fez doações em Alagón ao arcebispo de Auch, e em 1136 acordou-se aqui o Tratado de Alagón.\n\nPerto da vila há uma necrópole ibérica e restos de uma ponte romana."},{"h":"O que ver","t":"Passeie entre San Pedro, a igreja de San Antonio e San Juan Bautista. Na Calle Jota Aragonesa, números 3 e 5, conserva-se uma casa nobre do século XVI mandada fazer pelo protonotário Felipe Climent.\n\nMuito perto ficam a ermida da Virgen del Castillo e a antiga fábrica de açúcar, e a cerca de dois quilómetros, junto ao Jalón, El Caracol e as muralhas do Canal Imperial."}]},"status":"pending"},{"id":"casa-cultura-goya","town":"Alagón","cat":"museo","lat":41.76931,"lon":-1.12129,"coord_src":null,"q":["Casa de Cultura, Alagón","Iglesia de San Antonio de Padua, Alagón"],"fq":["Category:Iglesia de San Antonio de Padua (Alagón)","Alagón San Antonio iglesia"],"name":{"es":"San Antonio y el fresco atribuido a Goya","en":"San Antonio and the fresco attributed to Goya","fr":"San Antonio et la fresque attribuée à Goya","de":"San Antonio und das Goya zugeschriebene Fresko","pt":"San Antonio e o fresco atribuído a Goya"},"when":{"es":"Siglo XVIII · Fresco atribuido a Goya, hacia 1765","en":"18th c. · Fresco attributed to Goya, c. 1765","fr":"XVIIIe s. · Fresque attribuée à Goya, v. 1765","de":"18. Jh. · Goya zugeschriebenes Fresko, um 1765","pt":"Séc. XVIII · Fresco atribuído a Goya, c. 1765"},"desc":{"es":"La iglesia rococó de San Antonio y el antiguo colegio de los jesuitas guardan una sorpresa: en la bóveda de la escalera, hoy Casa de Cultura, hay un fresco atribuido a un Goya de unos 19 años.","en":"The Rococo church of San Antonio and the former Jesuit college hold a surprise: on the vault over the staircase, now the Casa de Cultura, there is a fresco attributed to a Goya of about 19.","fr":"L'église rococo de San Antonio et l'ancien collège des jésuites réservent une surprise : sur la voûte de l'escalier, aujourd'hui Maison de la culture, une fresque attribuée à un Goya d'environ 19 ans.","de":"Die Rokokokirche San Antonio und das ehemalige Jesuitenkolleg bergen eine Überraschung: Am Gewölbe des Treppenhauses, heute Kulturhaus, befindet sich ein Fresko, das einem etwa 19-jährigen Goya zugeschrieben wird.","pt":"A igreja rococó de San Antonio e o antigo colégio dos jesuítas guardam uma surpresa: na abóbada da escadaria, hoje Casa da Cultura, há um fresco atribuído a um Goya de cerca de 19 anos."},"visit":{"es":"La Casa de Cultura ocupa el antiguo colegio, junto a la iglesia de San Antonio. Pregunta en el Ayuntamiento o en la oficina de turismo de Alagón por los horarios de apertura y las visitas guiadas.","en":"The Casa de Cultura occupies the former college, next to San Antonio church. Ask at the town hall or Alagón tourist office for opening times and guided tours.","fr":"La Maison de la culture occupe l'ancien collège, à côté de l'église San Antonio. Renseignez-vous à la mairie ou à l'office de tourisme d'Alagón sur les horaires et les visites guidées.","de":"Das Kulturhaus befindet sich im ehemaligen Kolleg neben der Kirche San Antonio. Öffnungszeiten und Führungen erfahren Sie im Rathaus oder im Tourismusbüro von Alagón.","pt":"A Casa da Cultura ocupa o antigo colégio, junto à igreja de San Antonio. Informe-se na câmara municipal ou no posto de turismo de Alagón sobre horários e visitas guiadas."},"src":"https://fundaciongoyaenaragon.es/obra/exaltacion-del-nombre-de-jesus/611","sources":["https://fundaciongoyaenaragon.es/obra/exaltacion-del-nombre-de-jesus/611","https://www.ecured.cu/Alag%C3%B3n","https://www.territoriomudejar.es/patrimonio/alagon/?lang=en"],"art":{"es":[{"h":"Historia","t":"Los jesuitas se instalaron en Alagón hacia 1688. En la primera mitad del siglo XVIII levantaron la iglesia de San Antonio, de estilo rococó, con una cúpula de teja vidriada que recuerda a las del Pilar de Zaragoza.\n\nEn 1767 la Compañía de Jesús fue expulsada de España. Por eso el fresco de la escalera se fecha hacia 1765 o 1766: después habría sido muy difícil encargarlo."},{"h":"El fresco","t":"Se titula La exaltación del Nombre de Jesús y mide unos 3,5 por 2,5 metros. En el centro de un medallón de borde lobulado aparece el anagrama JHS rodeado de angelitos. Los colores son pocos: ocres, marrones, azules, verdes y blancos.\n\nLa Fundación Goya en Aragón lo cataloga como obra atribuida. Los angelitos se parecen a los de las puertas del relicario de Fuendetodos y muestran la influencia de Francisco Bayeu. Uno de ellos, abajo, parece sin terminar."},{"h":"Curiosidades","t":"La iglesia de San Antonio es la sede de las fiestas del 13 de junio, en honor a San Antonio de Padua. Su cúpula de teja de colores es uno de los perfiles más reconocibles de Alagón."}],"en":[{"h":"History","t":"The Jesuits settled in Alagón around 1688. In the first half of the 18th century they built the church of San Antonio, in Rococo style, with a glazed-tile dome that recalls those of the Pilar in Zaragoza.\n\nIn 1767 the Society of Jesus was expelled from Spain. That is why the staircase fresco is dated to around 1765 or 1766: after that it would hardly have been commissioned."},{"h":"The fresco","t":"It is called The Exaltation of the Name of Jesus and measures about 3.5 by 2.5 metres. In the centre of a lobed medallion the JHS monogram appears, surrounded by cherubs. The palette is limited: ochres, browns, blues, greens and whites.\n\nThe Fundación Goya en Aragón lists it as an attributed work. The cherubs resemble those on the reliquary doors at Fuendetodos and show the influence of Francisco Bayeu. One of them, at the bottom, looks unfinished."},{"h":"Did you know?","t":"San Antonio church is the centre of the 13 June festivities in honour of Saint Anthony of Padua. Its coloured-tile dome is one of the most recognisable features of Alagón's skyline."}],"fr":[{"h":"Histoire","t":"Les jésuites s'installèrent à Alagón vers 1688. Dans la première moitié du XVIIIe siècle, ils élevèrent l'église San Antonio, de style rococo, avec une coupole de tuiles vernissées qui rappelle celles du Pilar de Saragosse.\n\nEn 1767, la Compagnie de Jésus fut expulsée d'Espagne. C'est pourquoi la fresque de l'escalier est datée vers 1765 ou 1766 : plus tard, elle n'aurait guère pu être commandée."},{"h":"La fresque","t":"Elle s'intitule L'Exaltation du Nom de Jésus et mesure environ 3,5 sur 2,5 mètres. Au centre d'un médaillon lobé apparaît le monogramme JHS entouré d'angelots. La palette est réduite : ocres, bruns, bleus, verts et blancs.\n\nLa Fundación Goya en Aragón la classe comme œuvre attribuée. Les angelots ressemblent à ceux des portes du reliquaire de Fuendetodos et montrent l'influence de Francisco Bayeu. L'un d'eux, en bas, semble inachevé."},{"h":"Le saviez-vous ?","t":"L'église San Antonio est le cœur des fêtes du 13 juin en l'honneur de saint Antoine de Padoue. Sa coupole de tuiles colorées est l'une des silhouettes les plus reconnaissables d'Alagón."}],"de":[{"h":"Geschichte","t":"Die Jesuiten ließen sich um 1688 in Alagón nieder. In der ersten Hälfte des 18. Jahrhunderts errichteten sie die Kirche San Antonio im Rokokostil, mit einer Kuppel aus glasierten Ziegeln, die an die der Basilika del Pilar in Zaragoza erinnert.\n\n1767 wurde die Gesellschaft Jesu aus Spanien ausgewiesen. Deshalb wird das Fresko um 1765 oder 1766 datiert: Später wäre es kaum noch in Auftrag gegeben worden."},{"h":"Das Fresko","t":"Es heißt Die Verherrlichung des Namens Jesu und misst etwa 3,5 mal 2,5 Meter. In der Mitte eines gelappten Medaillons erscheint das Monogramm JHS, umgeben von Putten. Die Farbpalette ist knapp: Ocker, Braun, Blau, Grün und Weiß.\n\nDie Fundación Goya en Aragón führt es als zugeschriebenes Werk. Die Putten ähneln denen an den Reliquienschranktüren von Fuendetodos und zeigen den Einfluss von Francisco Bayeu. Eine Putte unten wirkt unvollendet."},{"h":"Wussten Sie?","t":"Die Kirche San Antonio ist Mittelpunkt des Festes am 13. Juni zu Ehren des heiligen Antonius von Padua. Ihre Kuppel aus farbigen Ziegeln gehört zu den markantesten Silhouetten von Alagón."}],"pt":[{"h":"História","t":"Os jesuítas instalaram-se em Alagón por volta de 1688. Na primeira metade do século XVIII ergueram a igreja de San Antonio, em estilo rococó, com uma cúpula de telha vidrada que lembra as do Pilar de Saragoça.\n\nEm 1767 a Companhia de Jesus foi expulsa de Espanha. Por isso o fresco da escadaria data-se de cerca de 1765 ou 1766: mais tarde dificilmente teria sido encomendado."},{"h":"O fresco","t":"Intitula-se A Exaltação do Nome de Jesus e mede cerca de 3,5 por 2,5 metros. No centro de um medalhão lobulado aparece o monograma JHS rodeado de anjinhos. A paleta é reduzida: ocres, castanhos, azuis, verdes e brancos.\n\nA Fundación Goya en Aragón cataloga-o como obra atribuída. Os anjinhos parecem-se com os das portas do relicário de Fuendetodos e mostram a influência de Francisco Bayeu. Um deles, em baixo, parece inacabado."},{"h":"Sabia que?","t":"A igreja de San Antonio é o centro das festas de 13 de junho em honra de Santo António de Pádua. A sua cúpula de telhas coloridas é uma das silhuetas mais reconhecíveis de Alagón."}]},"status":"pending"},{"id":"san-juan-alagon","town":"Alagón","cat":"patrimonio","lat":41.7719,"lon":-1.12274,"coord_src":null,"q":["Iglesia de San Juan Bautista, Alagón"],"fq":["Alagón San Juan Bautista iglesia","Category:Alagón"],"name":{"es":"Iglesia de San Juan Bautista","en":"Church of San Juan Bautista","fr":"Église San Juan Bautista","de":"Kirche San Juan Bautista","pt":"Igreja de San Juan Bautista"},"when":{"es":"Fundado en 1604 · Barroco del siglo XVIII","en":"Founded 1604 · 18th-century Baroque","fr":"Fondée en 1604 · Baroque du XVIIIe siècle","de":"Gegründet 1604 · Barock des 18. Jh.","pt":"Fundada em 1604 · Barroco do século XVIII"},"desc":{"es":"La iglesia de San Juan Bautista fue el templo de un convento de agustinos descalzos. Se fundó en 1604 sobre un antiguo hospital y lo que se ve hoy es obra barroca del siglo XVIII.","en":"The church of San Juan Bautista belonged to a convent of Discalced Augustinians. It was founded in 1604 on the site of an old hospital, and what you see today is 18th-century Baroque.","fr":"L'église San Juan Bautista appartenait à un couvent d'augustins déchaux. Fondée en 1604 sur un ancien hôpital, elle est aujourd'hui une œuvre baroque du XVIIIe siècle.","de":"Die Kirche San Juan Bautista gehörte zu einem Kloster der Unbeschuhten Augustiner. Es wurde 1604 an der Stelle eines alten Hospitals gegründet; der heutige Bau ist Barock des 18. Jahrhunderts.","pt":"A igreja de San Juan Bautista pertenceu a um convento de agostinhos descalços. Foi fundada em 1604 sobre um antigo hospital, e o que se vê hoje é obra barroca do século XVIII."},"visit":{"es":"Está en el casco urbano de Alagón. Pregunta en el Ayuntamiento o en la oficina de turismo de Alagón por los horarios de apertura y las visitas guiadas.","en":"It is in the town centre of Alagón. Ask at the town hall or Alagón tourist office for opening times and guided tours.","fr":"Elle se trouve dans le centre d'Alagón. Renseignez-vous à la mairie ou à l'office de tourisme d'Alagón sur les horaires et les visites guidées.","de":"Sie liegt im Ortskern von Alagón. Öffnungszeiten und Führungen erfahren Sie im Rathaus oder im Tourismusbüro von Alagón.","pt":"Fica no centro de Alagón. Informe-se na câmara municipal ou no posto de turismo de Alagón sobre horários e visitas guiadas."},"src":"https://www.ecured.cu/Alag%C3%B3n","sources":["https://www.ecured.cu/Alag%C3%B3n"],"art":{"es":[{"h":"Historia","t":"El convento de agustinos descalzos se fundó en 1604 en el solar de un antiguo hospital. Con la desamortización del siglo XIX quedó abandonado y se reabrió al culto en 1875.\n\nLa fábrica que se conserva es barroca, del siglo XVIII."},{"h":"Qué ver","t":"Fíjate en la fachada de ladrillo y en el interior barroco. Es una buena parada en el paseo entre San Pedro y San Antonio, porque permite comparar tres épocas de Alagón en pocos metros: el mudéjar, el barroco y el rococó."}],"en":[{"h":"History","t":"The convent of Discalced Augustinians was founded in 1604 on the site of an old hospital. With the 19th-century confiscations it was abandoned, and it reopened for worship in 1875.\n\nThe surviving building is Baroque, from the 18th century."},{"h":"What to see","t":"Look at the brick façade and the Baroque interior. It is a good stop on a walk between San Pedro and San Antonio, letting you compare three periods of Alagón within a few metres: Mudéjar, Baroque and Rococo."}],"fr":[{"h":"Histoire","t":"Le couvent des augustins déchaux fut fondé en 1604 sur l'emplacement d'un ancien hôpital. Avec les désamortissements du XIXe siècle il fut abandonné, puis rouvert au culte en 1875.\n\nL'édifice conservé est baroque, du XVIIIe siècle."},{"h":"À voir","t":"Observez la façade de brique et l'intérieur baroque. C'est une bonne étape entre San Pedro et San Antonio, qui permet de comparer en quelques mètres trois époques d'Alagón : le mudéjar, le baroque et le rococo."}],"de":[{"h":"Geschichte","t":"Das Kloster der Unbeschuhten Augustiner wurde 1604 auf dem Gelände eines alten Hospitals gegründet. Mit den Säkularisierungen des 19. Jahrhunderts wurde es verlassen und 1875 wieder für den Gottesdienst geöffnet.\n\nDer erhaltene Bau ist barock und stammt aus dem 18. Jahrhundert."},{"h":"Sehenswert","t":"Achten Sie auf die Backsteinfassade und das barocke Innere. Sie ist ein guter Halt zwischen San Pedro und San Antonio und erlaubt auf wenigen Metern den Vergleich dreier Epochen von Alagón: Mudéjar, Barock und Rokoko."}],"pt":[{"h":"História","t":"O convento dos agostinhos descalços foi fundado em 1604 no lugar de um antigo hospital. Com as desamortizações do século XIX ficou abandonado e reabriu ao culto em 1875.\n\nO edifício conservado é barroco, do século XVIII."},{"h":"O que ver","t":"Repare na fachada de tijolo e no interior barroco. É uma boa paragem entre San Pedro e San Antonio, que permite comparar em poucos metros três épocas de Alagón: o mudéjar, o barroco e o rococó."}]},"status":"pending"},{"id":"virgen-castillo-alagon","town":"Alagón","cat":"patrimonio","lat":41.77092,"lon":-1.12283,"coord_src":null,"q":["Ermita de la Virgen del Castillo, Alagón","Nuestra Señora del Castillo, Alagón"],"fq":["Alagón Virgen del Castillo","Category:Alagón"],"name":{"es":"Ermita de la Virgen del Castillo","en":"Hermitage of the Virgen del Castillo","fr":"Ermitage de la Virgen del Castillo","de":"Einsiedelei Virgen del Castillo","pt":"Ermida da Virgen del Castillo"},"when":{"es":"Siglo XVI, reconstruida tras 1808 · Patrona de Alagón","en":"16th c., rebuilt after 1808 · Patron of Alagón","fr":"XVIe s., reconstruit après 1808 · Patronne","de":"16. Jh., nach 1808 wiederaufgebaut · Patronin","pt":"Séc. XVI, reconstruída após 1808 · Padroeira"},"desc":{"es":"La ermita de la Virgen del Castillo se levanta junto a donde estuvo el castillo musulmán. Guarda la imagen de la patrona, de hacia 1300, ligada a la leyenda de la conquista de 1119.","en":"The hermitage of the Virgen del Castillo stands next to the site of the Muslim castle. It holds the image of the town's patron, from around 1300, linked to the legend of the 1119 conquest.","fr":"L'ermitage de la Virgen del Castillo se dresse près de l'ancien château musulman. Il abrite la statue de la patronne, de vers 1300, liée à la légende de la conquête de 1119.","de":"Die Einsiedelei der Virgen del Castillo steht neben dem Ort der muslimischen Burg. Sie birgt das Bild der Stadtpatronin von etwa 1300, verbunden mit der Legende der Eroberung von 1119.","pt":"A ermida da Virgen del Castillo ergue-se junto ao local do castelo muçulmano. Guarda a imagem da padroeira, de cerca de 1300, ligada à lenda da conquista de 1119."},"visit":{"es":"Está junto a la plaza del Castillo, en Alagón. Abre sobre todo en culto y fiestas; la fiesta grande es el 8 de septiembre. Pregunta en el Ayuntamiento o en la oficina de turismo de Alagón por los horarios de apertura y las visitas guiadas.","en":"It is by the Plaza del Castillo in Alagón. It opens mainly for services and festivities; the main feast is on 8 September. Ask at the town hall or Alagón tourist office for opening times and guided tours.","fr":"Il se trouve près de la plaza del Castillo, à Alagón. Il ouvre surtout pour les offices et les fêtes ; la grande fête est le 8 septembre. Renseignez-vous à la mairie ou à l'office de tourisme d'Alagón sur les horaires et les visites guidées.","de":"Sie liegt in Alagón. Geöffnet ist sie vor allem zu Gottesdiensten und Festen; das Hauptfest ist am 8. September. Öffnungszeiten und Führungen erfahren Sie im Rathaus oder im Tourismusbüro von Alagón.","pt":"Fica junto à Plaza del Castillo, em Alagón. Abre sobretudo no culto e nas festas; a festa grande é a 8 de setembro. Informe-se na câmara municipal ou no posto de turismo de Alagón sobre horários e visitas guiadas."},"src":"https://www.ecured.cu/Alag%C3%B3n","sources":["https://www.ecured.cu/Alag%C3%B3n","https://www.territoriomudejar.es/patrimonio/alagon/?lang=en"],"art":{"es":[{"h":"Historia","t":"La ermita es del siglo XVI y se construyó junto al antiguo castillo musulmán. Según la tradición, la Virgen se apareció durante la conquista cristiana de 1119.\n\nEn la Guerra de la Independencia, en 1808, el templo fue saqueado y después hubo que reconstruirlo."},{"h":"Qué ver","t":"La pieza principal es la imagen de la Virgen, de tradición románica y de hacia el año 1300. Es la patrona de Alagón y sus fiestas son el 8 de septiembre."}],"en":[{"h":"History","t":"The hermitage dates from the 16th century and was built next to the old Muslim castle. According to tradition, the Virgin appeared during the Christian conquest of 1119.\n\nDuring the Peninsular War, in 1808, the church was sacked and later had to be rebuilt."},{"h":"What to see","t":"The main piece is the image of the Virgin, in the Romanesque tradition and from around 1300. She is the patron of Alagón and her feast is on 8 September."}],"fr":[{"h":"Histoire","t":"L'ermitage date du XVIe siècle et fut construit près de l'ancien château musulman. Selon la tradition, la Vierge apparut lors de la conquête chrétienne de 1119.\n\nPendant la guerre d'Indépendance, en 1808, l'église fut pillée et dut ensuite être reconstruite."},{"h":"À voir","t":"La pièce maîtresse est la statue de la Vierge, de tradition romane et de vers 1300. Elle est la patronne d'Alagón et sa fête a lieu le 8 septembre."}],"de":[{"h":"Geschichte","t":"Die Einsiedelei stammt aus dem 16. Jahrhundert und wurde neben der alten muslimischen Burg erbaut. Der Überlieferung nach erschien die Jungfrau während der christlichen Eroberung von 1119.\n\nIm Unabhängigkeitskrieg wurde die Kirche 1808 geplündert und musste später wiederaufgebaut werden."},{"h":"Sehenswert","t":"Das wichtigste Stück ist das Marienbild in romanischer Tradition, um 1300 entstanden. Sie ist die Patronin von Alagón; ihr Fest ist am 8. September."}],"pt":[{"h":"História","t":"A ermida é do século XVI e foi construída junto ao antigo castelo muçulmano. Segundo a tradição, a Virgem apareceu durante a conquista cristã de 1119.\n\nNa Guerra Peninsular, em 1808, o templo foi saqueado e depois teve de ser reconstruído."},{"h":"O que ver","t":"A peça principal é a imagem da Virgem, de tradição românica e de cerca de 1300. É a padroeira de Alagón e a sua festa é a 8 de setembro."}]},"status":"pending"},{"id":"azucarera-alagon","town":"Alagón","cat":"patrimonio","lat":41.76967,"lon":-1.11173,"coord_src":null,"q":["Azucarera, Alagón","Azucarera de las Mercedes, Alagón"],"fq":["Azucarera Alagón","Alagón azucarera"],"name":{"es":"Azucarera de Nuestra Señora de las Mercedes","en":"Nuestra Señora de las Mercedes sugar factory","fr":"Sucrerie Nuestra Señora de las Mercedes","de":"Zuckerfabrik Nuestra Señora de las Mercedes","pt":"Fábrica de açúcar de las Mercedes"},"when":{"es":"1900-1993 · Bien Catalogado desde 2007","en":"1900-1993 · Listed heritage since 2007","fr":"1900-1993 · Patrimoine catalogué depuis 2007","de":"1900-1993 · Geschütztes Kulturgut seit 2007","pt":"1900-1993 · Bem catalogado desde 2007"},"desc":{"es":"La azucarera de Nuestra Señora de las Mercedes fue una de las primeras de Aragón. Recuerda los años en que la remolacha cambió la Ribera Alta y llenó sus pueblos de trabajo.","en":"The Nuestra Señora de las Mercedes sugar factory was one of the first in Aragon. It recalls the years when sugar beet transformed the Ribera Alta and filled its villages with work.","fr":"La sucrerie Nuestra Señora de las Mercedes fut l'une des premières d'Aragon. Elle rappelle les années où la betterave transforma la Ribera Alta et donna du travail à ses villages.","de":"Die Zuckerfabrik Nuestra Señora de las Mercedes war eine der ersten in Aragonien. Sie erinnert an die Jahre, in denen die Zuckerrübe die Ribera Alta veränderte und ihren Dörfern Arbeit brachte.","pt":"A fábrica de açúcar Nuestra Señora de las Mercedes foi uma das primeiras de Aragão. Recorda os anos em que a beterraba transformou a Ribera Alta e deu trabalho às suas aldeias."},"visit":{"es":"Se ve desde el exterior. Es un edificio cerrado: no entres en el recinto.","en":"You can see it from outside. The building is closed: do not enter the site.","fr":"Elle se voit de l'extérieur. Le bâtiment est fermé : n'entrez pas dans l'enceinte.","de":"Sie ist von außen zu sehen. Das Gebäude ist geschlossen: Betreten Sie das Gelände nicht.","pt":"Vê-se do exterior. O edifício está fechado: não entre no recinto."},"src":"https://www.ecured.cu/Alag%C3%B3n","sources":["https://www.ecured.cu/Alag%C3%B3n","https://www.territoriomudejar.es/patrimonio/alagon/?lang=en","https://es.hispanopedia.com/wiki/Luceni"],"art":{"es":[{"h":"Historia","t":"A principios del siglo XX el cultivo de la remolacha y las azucareras transformaron la Ribera Alta del Ebro. La de Alagón, dedicada a Nuestra Señora de las Mercedes, fue una de las primeras de Aragón y funcionó durante buena parte del siglo, hasta 1993.\n\nEn 2007 fue declarada Bien Catalogado del Patrimonio Cultural Aragonés."},{"h":"Qué ver","t":"Desde fuera se aprecian las naves de ladrillo y la chimenea, típicas de la arquitectura industrial de la época. Hubo otras azucareras en la comarca, como la de Luceni, que abrió en 1911 y cerró en 1985."}],"en":[{"h":"History","t":"In the early 20th century, sugar beet and sugar factories transformed the Ribera Alta del Ebro. Alagón's, dedicated to Nuestra Señora de las Mercedes, was one of the first in Aragon and worked for much of the century, until 1993.\n\nIn 2007 it was listed as a Bien Catalogado of Aragonese cultural heritage."},{"h":"What to see","t":"From outside you can make out the brick halls and the chimney, typical of the industrial architecture of the time. There were other sugar factories in the area, such as Luceni's, which opened in 1911 and closed in 1985."}],"fr":[{"h":"Histoire","t":"Au début du XXe siècle, la betterave sucrière et les sucreries transformèrent la Ribera Alta del Ebro. Celle d'Alagón, dédiée à Nuestra Señora de las Mercedes, fut l'une des premières d'Aragon et fonctionna une bonne partie du siècle, jusqu'en 1993.\n\nEn 2007, elle fut inscrite comme Bien Catalogado du patrimoine culturel aragonais."},{"h":"À voir","t":"De l'extérieur on distingue les halles de brique et la cheminée, typiques de l'architecture industrielle de l'époque. La comarque compta d'autres sucreries, comme celle de Luceni, ouverte en 1911 et fermée en 1985."}],"de":[{"h":"Geschichte","t":"Anfang des 20. Jahrhunderts veränderten Zuckerrüben und Zuckerfabriken die Ribera Alta del Ebro. Die Fabrik von Alagón, Nuestra Señora de las Mercedes geweiht, war eine der ersten in Aragonien und arbeitete einen Großteil des Jahrhunderts, bis 1993.\n\n2007 wurde sie als Bien Catalogado des aragonesischen Kulturerbes eingetragen."},{"h":"Sehenswert","t":"Von außen erkennt man die Backsteinhallen und den Schornstein, typisch für die Industriearchitektur jener Zeit. In der Comarca gab es weitere Zuckerfabriken, etwa in Luceni, die 1911 öffnete und 1985 schloss."}],"pt":[{"h":"História","t":"No início do século XX, a beterraba sacarina e as fábricas de açúcar transformaram a Ribera Alta del Ebro. A de Alagón, dedicada a Nuestra Señora de las Mercedes, foi uma das primeiras de Aragão e funcionou boa parte do século, até 1993.\n\nEm 2007 foi declarada Bien Catalogado do Património Cultural Aragonês."},{"h":"O que ver","t":"Do exterior distinguem-se as naves de tijolo e a chaminé, típicas da arquitetura industrial da época. Houve outras fábricas de açúcar na comarca, como a de Luceni, que abriu em 1911 e fechou em 1985."}]},"status":"pending"},{"id":"palacio-ducal-pedrola","town":"Pedrola","cat":"patrimonio","lat":41.7876,"lon":-1.21411,"coord_src":null,"q":["Palacio Ducal, Pedrola","Palacio de los Duques de Villahermosa, Pedrola"],"fq":["Category:Palacio de los Duques de Villahermosa (Pedrola)","Palacio Pedrola"],"name":{"es":"Palacio Ducal de Villahermosa","en":"Ducal Palace of Villahermosa","fr":"Palais ducal de Villahermosa","de":"Herzogspalast von Villahermosa","pt":"Palácio Ducal de Villahermosa"},"when":{"es":"Siglo XVI · Conjunto histórico-artístico (1976)","en":"16th c. · Historic-artistic ensemble (1976)","fr":"XVIe s. · Ensemble historique et artistique (1976)","de":"16. Jh. · Historisch-künstlerisches Ensemble (1976)","pt":"Séc. XVI · Conjunto histórico-artístico (1976)"},"desc":{"es":"El palacio de los duques de Villahermosa es el gran edificio de Pedrola. Aquí se alojó Cervantes en el invierno de 1568, y la tradición ve en él el palacio de los duques del Quijote.","en":"The palace of the Dukes of Villahermosa is Pedrola's great building. Cervantes stayed here in the winter of 1568, and tradition sees it as the palace of the dukes in Don Quixote.","fr":"Le palais des ducs de Villahermosa est le grand édifice de Pedrola. Cervantès y séjourna à l'hiver 1568, et la tradition y voit le palais des ducs du Quichotte.","de":"Der Palast der Herzöge von Villahermosa ist das große Bauwerk von Pedrola. Cervantes wohnte hier im Winter 1568, und die Überlieferung sieht darin den Palast der Herzöge aus dem Don Quijote.","pt":"O palácio dos duques de Villahermosa é o grande edifício de Pedrola. Cervantes hospedou-se aqui no inverno de 1568, e a tradição vê nele o palácio dos duques do Quixote."},"visit":{"es":"El palacio no siempre está abierto al público. Pregunta en el Ayuntamiento de Pedrola si hay visitas organizadas. La fachada se ve desde la plaza.","en":"The palace is not always open to the public. Ask at Pedrola town hall whether tours are organised. The façade can be seen from the square.","fr":"Le palais n'est pas toujours ouvert au public. Demandez à la mairie de Pedrola si des visites sont organisées. La façade se voit depuis la place.","de":"Der Palast ist nicht immer öffentlich zugänglich. Fragen Sie im Rathaus von Pedrola nach Führungen. Die Fassade ist vom Platz aus zu sehen.","pt":"O palácio nem sempre está aberto ao público. Pergunte na câmara municipal de Pedrola se há visitas organizadas. A fachada vê-se da praça."},"src":"https://es.hispanopedia.com/wiki/Pedrola","sources":["https://es.hispanopedia.com/wiki/Pedrola"],"art":{"es":[{"h":"Historia","t":"El palacio es de principios del siglo XVI, de estilo mudéjar aragonés y construido en ladrillo. Hacia el 30 de diciembre de 1568 llegó aquí Miguel de Cervantes, en el séquito del nuncio Giulio Acquaviva, que se alojó en el palacio del IV duque de Villahermosa, Martín de Aragón.\n\nEn la segunda parte del Quijote, Cervantes recoge recuerdos de aquella estancia. Por eso se identifica Pedrola con los duques que reciben a don Quijote y Sancho. En enero de 1976 el palacio y la iglesia parroquial fueron declarados conjunto histórico-artístico."},{"h":"Qué ver","t":"Desde fuera destaca el gran balconaje de la planta noble y la puerta principal. Dentro hay una biblioteca y un salón de baile, muebles de época, porcelanas de Sèvres, tapices de los Gobelinos y artesonados renacentistas.\n\nLa colección de pintura reúne obras de Roland de Mois, José Antolínez, Tiepolo, Francisco Bayeu y Sorolla, y en la biblioteca un retrato de Ramón Pignatelli pintado por Goya."},{"h":"Curiosidades","t":"Un pasadizo unía el palacio con la iglesia de Nuestra Señora de los Ángeles. Lo mandó construir Luisa de Borja y Aragón, duquesa de Villahermosa."}],"en":[{"h":"History","t":"The palace dates from the early 16th century, in Aragonese Mudéjar style and built of brick. Around 30 December 1568 Miguel de Cervantes arrived here in the retinue of the nuncio Giulio Acquaviva, who stayed in the palace of the 4th Duke of Villahermosa, Martín de Aragón.\n\nIn the second part of Don Quixote, Cervantes draws on memories of that stay. That is why Pedrola is identified with the dukes who host Don Quixote and Sancho. In January 1976 the palace and the parish church were declared a historic-artistic ensemble."},{"h":"What to see","t":"From outside, note the long balcony of the main floor and the main door. Inside there are a library and a ballroom, period furniture, Sèvres porcelain, Gobelins tapestries and Renaissance coffered ceilings.\n\nThe painting collection includes works by Roland de Mois, José Antolínez, Tiepolo, Francisco Bayeu and Sorolla, and in the library a portrait of Ramón Pignatelli by Goya."},{"h":"Did you know?","t":"A passage linked the palace with the church of Nuestra Señora de los Ángeles. It was built on the orders of Luisa de Borja y Aragón, Duchess of Villahermosa."}],"fr":[{"h":"Histoire","t":"Le palais date du début du XVIe siècle, de style mudéjar aragonais et construit en brique. Vers le 30 décembre 1568, Miguel de Cervantès y arriva dans la suite du nonce Giulio Acquaviva, logé dans le palais du IVe duc de Villahermosa, Martín de Aragón.\n\nDans la seconde partie du Quichotte, Cervantès puise dans les souvenirs de ce séjour. C'est pourquoi on identifie Pedrola aux ducs qui reçoivent don Quichotte et Sancho. En janvier 1976, le palais et l'église paroissiale furent déclarés ensemble historique et artistique."},{"h":"À voir","t":"De l'extérieur, remarquez le grand balcon de l'étage noble et la porte principale. À l'intérieur se trouvent une bibliothèque et une salle de bal, des meubles d'époque, des porcelaines de Sèvres, des tapisseries des Gobelins et des plafonds à caissons Renaissance.\n\nLa collection de peinture réunit des œuvres de Roland de Mois, José Antolínez, Tiepolo, Francisco Bayeu et Sorolla, et dans la bibliothèque un portrait de Ramón Pignatelli par Goya."},{"h":"Le saviez-vous ?","t":"Un passage reliait le palais à l'église Nuestra Señora de los Ángeles. Il fut construit sur ordre de Luisa de Borja y Aragón, duchesse de Villahermosa."}],"de":[{"h":"Geschichte","t":"Der Palast stammt aus dem frühen 16. Jahrhundert, im aragonesischen Mudéjar-Stil und aus Backstein. Um den 30. Dezember 1568 kam Miguel de Cervantes im Gefolge des Nuntius Giulio Acquaviva hierher, der im Palast des 4. Herzogs von Villahermosa, Martín de Aragón, wohnte.\n\nIm zweiten Teil des Don Quijote verarbeitet Cervantes Erinnerungen an diesen Aufenthalt. Deshalb wird Pedrola mit den Herzögen identifiziert, die Don Quijote und Sancho empfangen. Im Januar 1976 wurden Palast und Pfarrkirche zum historisch-künstlerischen Ensemble erklärt."},{"h":"Sehenswert","t":"Von außen fallen der lange Balkon des Hauptgeschosses und das Hauptportal auf. Innen gibt es eine Bibliothek und einen Ballsaal, Stilmöbel, Sèvres-Porzellan, Gobelin-Tapisserien und Kassettendecken der Renaissance.\n\nDie Gemäldesammlung umfasst Werke von Roland de Mois, José Antolínez, Tiepolo, Francisco Bayeu und Sorolla, und in der Bibliothek ein Porträt Ramón Pignatellis von Goya."},{"h":"Wussten Sie?","t":"Ein Gang verband den Palast mit der Kirche Nuestra Señora de los Ángeles. Er wurde auf Anordnung von Luisa de Borja y Aragón, Herzogin von Villahermosa, gebaut."}],"pt":[{"h":"História","t":"O palácio é do início do século XVI, de estilo mudéjar aragonês e construído em tijolo. Por volta de 30 de dezembro de 1568 chegou aqui Miguel de Cervantes, no séquito do núncio Giulio Acquaviva, que se hospedou no palácio do IV duque de Villahermosa, Martín de Aragón.\n\nNa segunda parte do Quixote, Cervantes recolhe memórias dessa estadia. Por isso se identifica Pedrola com os duques que recebem Dom Quixote e Sancho. Em janeiro de 1976 o palácio e a igreja paroquial foram declarados conjunto histórico-artístico."},{"h":"O que ver","t":"Por fora destaca-se a longa varanda do andar nobre e a porta principal. Lá dentro há uma biblioteca e um salão de baile, móveis de época, porcelanas de Sèvres, tapeçarias dos Gobelins e tetos de caixotões renascentistas.\n\nA coleção de pintura reúne obras de Roland de Mois, José Antolínez, Tiepolo, Francisco Bayeu e Sorolla, e na biblioteca um retrato de Ramón Pignatelli pintado por Goya."},{"h":"Sabia que?","t":"Uma passagem unia o palácio à igreja de Nuestra Señora de los Ángeles. Foi mandada construir por Luisa de Borja y Aragón, duquesa de Villahermosa."}]},"status":"pending"},{"id":"iglesia-angeles-pedrola","town":"Pedrola","cat":"patrimonio","lat":41.79023,"lon":-1.2147,"coord_src":null,"q":["Iglesia de Nuestra Señora de los Ángeles, Pedrola","Iglesia, Pedrola"],"fq":["Category:Pedrola","Pedrola iglesia"],"name":{"es":"Iglesia de Nuestra Señora de los Ángeles","en":"Church of Nuestra Señora de los Ángeles","fr":"Église Nuestra Señora de los Ángeles","de":"Kirche Nuestra Señora de los Ángeles","pt":"Igreja de Nuestra Señora de los Ángeles"},"when":{"es":"Siglos XIV-XVIII · Reforma de Juan de Villanueva","en":"14th-18th c. · Remodelled by Juan de Villanueva","fr":"XIVe-XVIIIe s. · Réforme de Juan de Villanueva","de":"14.-18. Jh. · Umbau durch Juan de Villanueva","pt":"Sécs. XIV-XVIII · Reforma de Juan de Villanueva"},"desc":{"es":"La iglesia de Nuestra Señora de los Ángeles creció junto al palacio ducal. En el siglo XVIII la amplió Juan de Villanueva, el arquitecto del Museo del Prado, y la decoró Francisco Bayeu.","en":"The church of Nuestra Señora de los Ángeles grew next to the ducal palace. In the 18th century it was enlarged by Juan de Villanueva, architect of the Prado Museum, and decorated by Francisco Bayeu.","fr":"L'église Nuestra Señora de los Ángeles s'est développée à côté du palais ducal. Au XVIIIe siècle, Juan de Villanueva, l'architecte du musée du Prado, l'agrandit et Francisco Bayeu la décora.","de":"Die Kirche Nuestra Señora de los Ángeles wuchs neben dem Herzogspalast. Im 18. Jahrhundert erweiterte sie Juan de Villanueva, der Architekt des Prado-Museums, und Francisco Bayeu schmückte sie aus.","pt":"A igreja de Nuestra Señora de los Ángeles cresceu junto ao palácio ducal. No século XVIII ampliou-a Juan de Villanueva, o arquiteto do Museu do Prado, e decorou-a Francisco Bayeu."},"visit":{"es":"Está junto al palacio, en el centro de Pedrola. Se visita en horario de culto; pregunta en el Ayuntamiento por otras visitas.","en":"It is next to the palace, in the centre of Pedrola. You can visit during services; ask the town hall about other visits.","fr":"Elle se trouve à côté du palais, au centre de Pedrola. Visite pendant les offices ; demandez à la mairie pour d'autres visites.","de":"Sie liegt neben dem Palast im Zentrum von Pedrola. Besichtigung während der Gottesdienste; nach anderen Besuchen fragen Sie im Rathaus.","pt":"Fica junto ao palácio, no centro de Pedrola. Visita-se durante o culto; pergunte na câmara municipal por outras visitas."},"src":"https://es.hispanopedia.com/wiki/Pedrola","sources":["https://es.hispanopedia.com/wiki/Pedrola"],"art":{"es":[{"h":"Historia","t":"El templo parte de una iglesia del siglo XIV y se amplió dos veces. En el siglo XVI la reforma la empezó Alfonso Felipe de Gurrea y Aragón y la terminó su hijo Martín.\n\nEn el siglo XVIII la pagaron Juan Pablo de Aragón-Azlor y María Manuela Pignatelli, y la dirigió Juan de Villanueva. Añadió un crucero y una cabecera rectos, de modo que la planta quedó en cruz latina."},{"h":"Qué ver","t":"Francisco Bayeu pintó las capillas del Sagrado Corazón y el retablo del altar mayor. La capilla de San José es obra de su discípulo José Beratón.\n\nLa torre es cuadrada, de tres cuerpos, y se apoya sobre un arco de medio punto. A finales del siglo XIX un rayo dañó su chapitel y se cambió por el cuerpo octogonal de hierro forjado que se ve hoy."}],"en":[{"h":"History","t":"The church grew from a 14th-century building and was enlarged twice. In the 16th century the work was begun by Alfonso Felipe de Gurrea y Aragón and finished by his son Martín.\n\nIn the 18th century it was paid for by Juan Pablo de Aragón-Azlor and María Manuela Pignatelli and directed by Juan de Villanueva. He added a straight transept and chancel, giving the church a Latin-cross plan."},{"h":"What to see","t":"Francisco Bayeu painted the chapels of the Sacred Heart and the high-altar retable. The chapel of San José is by his pupil José Beratón.\n\nThe tower is square, in three sections, and stands on a round arch. In the late 19th century lightning damaged its spire, which was replaced by the octagonal wrought-iron top you see today."}],"fr":[{"h":"Histoire","t":"L'église part d'un édifice du XIVe siècle et fut agrandie deux fois. Au XVIe siècle, les travaux furent commencés par Alfonso Felipe de Gurrea y Aragón et achevés par son fils Martín.\n\nAu XVIIIe siècle, ils furent financés par Juan Pablo de Aragón-Azlor et María Manuela Pignatelli et dirigés par Juan de Villanueva. Il ajouta un transept et un chevet droits, donnant à l'église un plan en croix latine."},{"h":"À voir","t":"Francisco Bayeu peignit les chapelles du Sacré-Cœur et le retable du maître-autel. La chapelle San José est l'œuvre de son élève José Beratón.\n\nLa tour est carrée, à trois corps, et repose sur un arc en plein cintre. À la fin du XIXe siècle, la foudre endommagea sa flèche, remplacée par le corps octogonal en fer forgé visible aujourd'hui."}],"de":[{"h":"Geschichte","t":"Die Kirche geht auf einen Bau des 14. Jahrhunderts zurück und wurde zweimal erweitert. Im 16. Jahrhundert begann Alfonso Felipe de Gurrea y Aragón den Umbau, sein Sohn Martín vollendete ihn.\n\nIm 18. Jahrhundert finanzierten ihn Juan Pablo de Aragón-Azlor und María Manuela Pignatelli, geleitet von Juan de Villanueva. Er fügte ein gerades Querschiff und einen geraden Chor hinzu, sodass ein lateinisches Kreuz entstand."},{"h":"Sehenswert","t":"Francisco Bayeu malte die Herz-Jesu-Kapellen und das Retabel des Hochaltars. Die Josefskapelle stammt von seinem Schüler José Beratón.\n\nDer Turm ist quadratisch, dreigeschossig und ruht auf einem Rundbogen. Ende des 19. Jahrhunderts beschädigte ein Blitz seine Spitze, die durch den heutigen achteckigen Aufsatz aus Schmiedeeisen ersetzt wurde."}],"pt":[{"h":"História","t":"O templo parte de uma igreja do século XIV e foi ampliado duas vezes. No século XVI a obra foi iniciada por Alfonso Felipe de Gurrea y Aragón e terminada pelo filho Martín.\n\nNo século XVIII foi paga por Juan Pablo de Aragón-Azlor e María Manuela Pignatelli e dirigida por Juan de Villanueva. Acrescentou um transepto e uma cabeceira retos, dando à igreja planta em cruz latina."},{"h":"O que ver","t":"Francisco Bayeu pintou as capelas do Sagrado Coração e o retábulo do altar-mor. A capela de San José é obra do seu discípulo José Beratón.\n\nA torre é quadrada, de três corpos, e assenta num arco de volta perfeita. No final do século XIX um raio danificou o coruchéu, substituído pelo corpo octogonal de ferro forjado que se vê hoje."}]},"status":"pending"},{"id":"insula-barataria","town":"Alcalá de Ebro","cat":"patrimonio","lat":41.81404,"lon":-1.19408,"coord_src":null,"q":["Castillo, Alcalá de Ebro","Alcalá de Ebro"],"fq":["Category:Alcalá de Ebro","Alcalá de Ebro Sancho Panza"],"name":{"es":"Castillo y la Ínsula Barataria","en":"The castle and the Ínsula Barataria","fr":"Le château et l'Ínsula Barataria","de":"Die Burg und die Ínsula Barataria","pt":"O castelo e a Ínsula Barataria"},"when":{"es":"Castillo musulmán · La «Ínsula Barataria»","en":"Muslim castle · The «Ínsula Barataria»","fr":"Château musulman · L'« Ínsula Barataria »","de":"Muslimische Burg · Die «Ínsula Barataria»","pt":"Castelo muçulmano · A «Ínsula Barataria»"},"desc":{"es":"Muchos estudiosos identifican Alcalá de Ebro con la Ínsula Barataria que gobernó Sancho Panza. El pueblo lo celebra con un mercado cervantino y esculturas de Sancho, don Quijote y Cervantes.","en":"Many scholars identify Alcalá de Ebro with the Ínsula Barataria governed by Sancho Panza. The village celebrates it with a Cervantes market and statues of Sancho, Don Quixote and Cervantes.","fr":"De nombreux spécialistes identifient Alcalá de Ebro à l'île de Barataria gouvernée par Sancho Panza. Le village la célèbre avec un marché cervantin et des statues de Sancho, de don Quichotte et de Cervantès.","de":"Viele Fachleute identifizieren Alcalá de Ebro mit der Insel Barataria, die Sancho Panza regierte. Das Dorf feiert dies mit einem Cervantes-Markt und Statuen von Sancho, Don Quijote und Cervantes.","pt":"Muitos estudiosos identificam Alcalá de Ebro com a Ilha Barataria governada por Sancho Pança. A aldeia celebra-o com um mercado cervantino e estátuas de Sancho, Dom Quixote e Cervantes."},"visit":{"es":"Las esculturas están repartidas por el pueblo y se ven a pie. El castillo está en ruinas: obsérvalo desde fuera.","en":"The statues are spread around the village and can be seen on foot. The castle is in ruins: view it from outside.","fr":"Les statues sont réparties dans le village et se voient à pied. Le château est en ruine : regardez-le de l'extérieur.","de":"Die Statuen sind im Dorf verteilt und zu Fuß erreichbar. Die Burg ist eine Ruine: Betrachten Sie sie von außen.","pt":"As estátuas estão espalhadas pela aldeia e veem-se a pé. O castelo está em ruínas: observe-o de fora."},"src":"https://zaragozala.com/zaragoza-provincia/alcala-de-ebro-la-insula-barataria-del-quijote/","sources":["https://zaragozala.com/zaragoza-provincia/alcala-de-ebro-la-insula-barataria-del-quijote/","https://es.hispanopedia.com/wiki/Alcal%C3%A1_de_Ebro","https://es.hispanopedia.com/wiki/Pedrola"],"art":{"es":[{"h":"Historia","t":"El castillo, de origen musulmán, formaba parte de las defensas de Zaragoza a orillas del Ebro. Tras la conquista de 1118 pasó a la Corona. Hoy solo quedan ruinas.\n\nAlcalá perteneció a los duques de Villahermosa, cuyo palacio de Pedrola está muy cerca. Por eso el erudito Juan Antonio Pellicer propuso en el siglo XVIII que la Ínsula Barataria del Quijote era este pueblo. La novela no lo dice expresamente, pero muchos académicos aceptan esa lectura."},{"h":"Qué ver","t":"En 2017 se instaló una escultura de Sancho Panza con su burro, obra del artista local Luis Hernández Albalate. Forma conjunto con las de don Quijote y de Cervantes, en otros puntos del pueblo.\n\nEl castillo quedaba a unos diez metros sobre el río. Con las crecidas, los meandros del Ebro casi convertían Alcalá en una isla, de ahí que encaje tan bien con la «ínsula»."},{"h":"Curiosidades","t":"Desde 2005 se celebra cada año un Mercado Cervantino ambientado en el siglo XVI, con artesanos, talleres y teatro. Se sirve olla podrida, uno de los platos que se citan en el Quijote."}],"en":[{"h":"History","t":"The castle, of Muslim origin, was part of Zaragoza's defences on the Ebro. After the conquest of 1118 it passed to the Crown. Today only ruins remain.\n\nAlcalá belonged to the Dukes of Villahermosa, whose palace in Pedrola is very close. That is why the 18th-century scholar Juan Antonio Pellicer proposed that the Ínsula Barataria of Don Quixote was this village. The novel does not say so explicitly, but many academics accept this reading."},{"h":"What to see","t":"In 2017 a statue of Sancho Panza with his donkey was installed, by the local artist Luis Hernández Albalate. It forms a set with those of Don Quixote and Cervantes, elsewhere in the village.\n\nThe castle stood about ten metres above the river. When the Ebro flooded, its meanders almost turned Alcalá into an island, which is why it fits the «ínsula» so well."},{"h":"Did you know?","t":"Since 2005 a Cervantes Market set in the 16th century has been held every year, with craftspeople, workshops and theatre. Olla podrida is served, one of the dishes mentioned in Don Quixote."}],"fr":[{"h":"Histoire","t":"Le château, d'origine musulmane, faisait partie des défenses de Saragosse au bord de l'Èbre. Après la conquête de 1118, il passa à la Couronne. Il n'en reste que des ruines.\n\nAlcalá appartenait aux ducs de Villahermosa, dont le palais de Pedrola est tout proche. C'est pourquoi l'érudit Juan Antonio Pellicer proposa au XVIIIe siècle que l'île de Barataria du Quichotte était ce village. Le roman ne le dit pas explicitement, mais beaucoup d'universitaires acceptent cette lecture."},{"h":"À voir","t":"En 2017 fut installée une statue de Sancho Panza avec son âne, œuvre de l'artiste local Luis Hernández Albalate. Elle forme un ensemble avec celles de don Quichotte et de Cervantès, ailleurs dans le vill
