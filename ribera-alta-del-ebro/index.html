is de la Figuera y Benito.\n\nAquella obra forró los muros originales con ladrillo visto, añadió un pórtico en la fachada sur y levantó una torre nueva a los pies de ese lado."},{"h":"Qué ver","t":"Compara las dos torres: la mudéjar antigua y la neomudéjar del siglo XX. Fíjate también en la decoración de cerámica vidriada.\n\nDesde Torres se ve El Castellar en lo alto del cortado, al otro lado del Ebro."}],"en":[{"h":"History","t":"The church dates from the 16th century and is protected as a Site of Cultural Interest. In the last third of the 20th century it was restored by the architect José Luis de la Figuera y Benito.\n\nThat work faced the original walls with exposed brick, added a portico on the south façade and raised a new tower at the foot of that side."},{"h":"What to see","t":"Compare the two towers: the old Mudéjar one and the 20th-century neo-Mudéjar one. Note the glazed ceramic decoration too.\n\nFrom Torres you can see El Castellar on top of the cliff, across the Ebro."}],"fr":[{"h":"Histoire","t":"L'église date du XVIe siècle et est protégée comme Bien d'intérêt culturel. Dans le dernier tiers du XXe siècle, elle fut restaurée par l'architecte José Luis de la Figuera y Benito.\n\nCes travaux habillèrent les murs d'origine de brique apparente, ajoutèrent un portique sur la façade sud et élevèrent une nouvelle tour au pied de ce côté."},{"h":"À voir","t":"Comparez les deux tours : l'ancienne mudéjare et la néo-mudéjare du XXe siècle. Remarquez aussi le décor de céramique vernissée.\n\nDepuis Torres, on voit El Castellar au sommet de la falaise, de l'autre côté de l'Èbre."}],"de":[{"h":"Geschichte","t":"Die Kirche stammt aus dem 16. Jahrhundert und ist als Kulturgut geschützt. Im letzten Drittel des 20. Jahrhunderts restaurierte sie der Architekt José Luis de la Figuera y Benito.\n\nDabei wurden die ursprünglichen Mauern mit Sichtziegeln verkleidet, an der Südfassade eine Vorhalle angebaut und am Fuß dieser Seite ein neuer Turm errichtet."},{"h":"Sehenswert","t":"Vergleichen Sie die beiden Türme: den alten Mudéjar-Turm und den Neo-Mudéjar-Turm des 20. Jahrhunderts. Achten Sie auch auf den Schmuck aus glasierter Keramik.\n\nVon Torres aus sieht man El Castellar oben auf der Klippe jenseits des Ebro."}],"pt":[{"h":"História","t":"O templo é do século XVI e está protegido como Bem de Interesse Cultural. No último terço do século XX foi restaurado pelo arquiteto José Luis de la Figuera y Benito.\n\nEssa obra revestiu os muros originais com tijolo à vista, acrescentou um pórtico na fachada sul e ergueu uma nova torre aos pés desse lado."},{"h":"O que ver","t":"Compare as duas torres: a mudéjar antiga e a neomudéjar do século XX. Repare também na decoração de cerâmica vidrada.\n\nDe Torres vê-se El Castellar no alto da escarpa, do outro lado do Ebro."}]},"status":"pending"},{"id":"escarpes-ebro","town":"Torres de Berrellén","cat":"naturaleza","lat":41.8,"lon":-1.11,"coord_src":null,"q":["Escarpes del Ebro, Torres de Berrellén","Río Ebro, Remolinos"],"fq":["Escarpes Ebro Remolinos","Ebro Torres de Berrellén"],"name":{"es":"Escarpes y sotos del Ebro","en":"Ebro cliffs and riverside woods","fr":"Falaises et bois de l'Èbre","de":"Steilhänge und Auwälder des Ebro","pt":"Escarpas e sotos do Ebro"},"when":{"es":"Espacio Red Natura 2000","en":"Natura 2000 site","fr":"Site Natura 2000","de":"Natura-2000-Gebiet","pt":"Espaço Rede Natura 2000"},"desc":{"es":"Entre Remolinos, Torres de Berrellén y Sobradiel, el Ebro corta la orilla izquierda en escarpes de yeso. Abajo crecen sotos de chopos y sauces con más de cien especies de aves.","en":"Between Remolinos, Torres de Berrellén and Sobradiel, the Ebro cuts the left bank into gypsum cliffs. Below grow woods of poplar and willow with more than a hundred bird species.","fr":"Entre Remolinos, Torres de Berrellén et Sobradiel, l'Èbre entaille la rive gauche en falaises de gypse. En contrebas poussent des bois de peupliers et de saules avec plus de cent espèces d'oiseaux.","de":"Zwischen Remolinos, Torres de Berrellén und Sobradiel schneidet der Ebro das linke Ufer in Gipssteilhänge. Darunter wachsen Pappel- und Weidenwälder mit über hundert Vogelarten.","pt":"Entre Remolinos, Torres de Berrellén e Sobradiel, o Ebro corta a margem esquerda em escarpas de gesso. Em baixo crescem bosques de choupos e salgueiros com mais de cem espécies de aves."},"visit":{"es":"Hay muchas pistas de tierra y es fácil confundirse de camino: lleva el mapa descargado. No te acerques al borde de los escarpes.","en":"There are many dirt tracks and it is easy to take the wrong one: download the map beforehand. Keep away from the cliff edges.","fr":"Il y a beaucoup de pistes et on se trompe facilement : téléchargez la carte à l'avance. Restez loin du bord des falaises.","de":"Es gibt viele Feldwege, und man verfährt sich leicht: Laden Sie die Karte vorher herunter. Halten Sie Abstand zu den Kanten der Steilhänge.","pt":"Há muitos caminhos de terra e é fácil enganar-se: descarregue o mapa antes. Afaste-se da beira das escarpas."},"src":"https://www.aragon.es/-/rio-ebro-escarpes-remolinos-torres-de-berrellen","sources":["https://www.aragon.es/-/rio-ebro-escarpes-remolinos-torres-de-berrellen"],"art":{"es":[{"h":"Paisaje","t":"El Ebro ha excavado un valle ancho en los materiales blandos de la depresión. En la orilla izquierda forma escarpes que se desmoronan por deslizamientos y caídas de rocas. En Remolinos, parte del escarpe queda tapado por derrubios.\n\nLa zona está en la Red Natura 2000: es Lugar de Importancia Comunitaria de los Sotos y Mejanas del Ebro y Zona de Especial Protección para las Aves de los Montes de Zuera, Castejón de Valdejasa y El Castellar."},{"h":"Fauna y flora","t":"Los sotos son de chopo, álamo, sauce, mimbrera y tamariz. Entre las aves que crían están el ruiseñor, la oropéndola, el pito real, el autillo y el cuco, y en el río se ven garzas, cormoranes, ánades reales y cercetas.\n\nTambién viven aquí la rata de agua, la gineta y el gato montés, y dos galápagos: el leproso y el europeo."}],"en":[{"h":"Landscape","t":"The Ebro has carved a wide valley in the soft materials of the depression. On the left bank it forms cliffs that crumble through landslides and rockfalls. At Remolinos, part of the cliff is buried by scree.\n\nThe area is part of the Natura 2000 network: it is a Site of Community Importance (Sotos y Mejanas del Ebro) and a Special Protection Area for Birds (Montes de Zuera, Castejón de Valdejasa y El Castellar)."},{"h":"Wildlife and plants","t":"The riverside woods are of black and white poplar, willow, osier and tamarisk. Breeding birds include the nightingale, golden oriole, green woodpecker, scops owl and cuckoo, and on the river you can see herons, cormorants, mallards and teal.\n\nWater voles, genets and wildcats also live here, as do two turtles: the Spanish pond turtle and the European pond turtle."}],"fr":[{"h":"Paysage","t":"L'Èbre a creusé une large vallée dans les matériaux tendres de la dépression. Sur la rive gauche, il forme des falaises qui s'effritent par glissements et chutes de pierres. À Remolinos, une partie de la falaise est recouverte d'éboulis.\n\nLa zone fait partie du réseau Natura 2000 : Site d'importance communautaire des Sotos y Mejanas del Ebro et Zone de protection spéciale pour les oiseaux des Montes de Zuera, Castejón de Valdejasa y El Castellar."},{"h":"Faune et flore","t":"Les bois de rive sont de peupliers noirs et blancs, saules, osiers et tamaris. Parmi les oiseaux nicheurs figurent le rossignol, le loriot, le pic vert, le petit-duc et le coucou, et sur le fleuve on voit hérons, cormorans, colverts et sarcelles.\n\nOn y trouve aussi le campagnol amphibie, la genette et le chat sauvage, ainsi que deux tortues : l'émyde lépreuse et la cistude d'Europe."}],"de":[{"h":"Landschaft","t":"Der Ebro hat ein breites Tal in die weichen Gesteine der Senke gegraben. Am linken Ufer bildet er Steilhänge, die durch Rutschungen und Steinschlag abbröckeln. Bei Remolinos ist ein Teil des Hangs von Schutt bedeckt.\n\nDas Gebiet gehört zum Netz Natura 2000: Es ist Gebiet von gemeinschaftlicher Bedeutung (Sotos y Mejanas del Ebro) und Vogelschutzgebiet (Montes de Zuera, Castejón de Valdejasa y El Castellar)."},{"h":"Tiere und Pflanzen","t":"Die Auwälder bestehen aus Schwarz- und Silberpappeln, Weiden, Korbweiden und Tamarisken. Zu den Brutvögeln zählen Nachtigall, Pirol, Grünspecht, Zwergohreule und Kuckuck, und am Fluss sieht man Reiher, Kormorane, Stockenten und Krickenten.\n\nAuch Schermaus, Ginsterkatze und Wildkatze leben hier sowie zwei Schildkröten: die Maurische Bachschildkröte und die Europäische Sumpfschildkröte."}],"pt":[{"h":"Paisagem","t":"O Ebro escavou um vale largo nos materiais brandos da depressão. Na margem esquerda forma escarpas que se desmoronam por deslizamentos e quedas de rochas. Em Remolinos, parte da escarpa está coberta por detritos.\n\nA zona faz parte da Rede Natura 2000: é Sítio de Importância Comunitária (Sotos y Mejanas del Ebro) e Zona de Proteção Especial para as Aves (Montes de Zuera, Castejón de Valdejasa y El Castellar)."},{"h":"Fauna e flora","t":"Os sotos são de choupo-negro e choupo-branco, salgueiro, vimeiro e tamargueira. Entre as aves que nidificam estão o rouxinol, o papa-figos, o peto-verde, o mocho-d'orelhas e o cuco, e no rio veem-se garças, corvos-marinhos, patos-reais e marrequinhas.\n\nVivem aqui também a rata-de-água, a geneta e o gato-bravo, e dois cágados: o cágado-mediterrânico e o cágado-de-carapaça-estriada."}]},"status":"pending"},{"id":"murallas-grisen","town":"Grisén","cat":"hidraulico","lat":41.74337,"lon":-1.14555,"coord_src":null,"q":["Murallas de Grisén","El Caracol, Grisén"],"fq":["Murallas de Grisén","Canal Imperial Jalón acueducto"],"name":{"es":"Murallas de Grisén y El Caracol","en":"Murallas de Grisén and El Caracol","fr":"Murallas de Grisén et El Caracol","de":"Murallas de Grisén und El Caracol","pt":"Murallas de Grisén e El Caracol"},"when":{"es":"Siglo XVIII · Canal Imperial sobre el Jalón","en":"18th c. · Imperial Canal over the Jalón","fr":"XVIIIe s. · Le Canal impérial sur le Jalón","de":"18. Jh. · Kaiserkanal über dem Jalón","pt":"Séc. XVIII · Canal Imperial sobre o Jalón"},"desc":{"es":"Las «murallas» de Grisén son en realidad el gran muro del siglo XVIII que lleva el Canal Imperial por encima del río Jalón. A su lado hay una zona recreativa con sotos y merenderos.","en":"The «walls» of Grisén are in fact the great 18th-century wall that carries the Imperial Canal over the river Jalón. Beside it there is a recreation area with riverside woods and picnic tables.","fr":"Les « murailles » de Grisén sont en réalité le grand mur du XVIIIe siècle qui porte le Canal impérial au-dessus du Jalón. À côté s'étend une aire de loisirs avec bois de rive et tables de pique-nique.","de":"Die «Mauern» von Grisén sind in Wirklichkeit die große Mauer aus dem 18. Jahrhundert, die den Kaiserkanal über den Fluss Jalón führt. Daneben liegt ein Erholungsgebiet mit Auwald und Picknicktischen.","pt":"As «muralhas» de Grisén são na verdade o grande muro do século XVIII que leva o Canal Imperial por cima do rio Jalón. Ao lado há uma zona de lazer com bosque ribeirinho e mesas de merendas."},"visit":{"es":"Está señalizado desde Grisén. Hay merenderos y recogida de basura. No subas a los muros del canal.","en":"It is signposted from Grisén. There are picnic tables and rubbish collection. Do not climb the canal walls.","fr":"Le site est fléché depuis Grisén. Il y a des tables de pique-nique et un ramassage des déchets. Ne montez pas sur les murs du canal.","de":"Von Grisén aus ist es ausgeschildert. Es gibt Picknicktische und Müllabfuhr. Klettern Sie nicht auf die Kanalmauern.","pt":"Está sinalizado a partir de Grisén. Há mesas de merendas e recolha de lixo. Não suba aos muros do canal."},"src":"https://es.hispanopedia.com/wiki/Gris%C3%A9n","sources":["https://es.hispanopedia.com/wiki/Gris%C3%A9n","https://www.aragon.es/-/rio-jalon-murallas-grisen","https://www.territoriomudejar.es/patrimonio/alagon/?lang=en"],"art":{"es":[{"h":"Historia","t":"Las murallas son del siglo XVIII. Sobre ellas corre el Canal Imperial de Aragón para poder cruzar el río Jalón. El conjunto se conoce también como El Caracol, cerca de Alagón.\n\nGrisén tuvo además estación de ferrocarril desde 1863, de la compañía M.Z.A."},{"h":"Qué ver","t":"Desde la orilla del Jalón se aprecia la altura del muro. Alrededor hay soto de chopos, álamos, sauces y fresnos, con carrizos y zarzas.\n\nFíjate en las aves: oropéndolas, lavanderas, chochines, rascones, fochas y garzas. En el río abundan los barbos."}],"en":[{"h":"History","t":"The walls date from the 18th century. On top of them runs the Imperial Canal of Aragon, so that it can cross the river Jalón. The complex is also known as El Caracol, near Alagón.\n\nGrisén also had a railway station from 1863, built by the M.Z.A. company."},{"h":"What to see","t":"From the bank of the Jalón you can appreciate the height of the wall. Around it there is woodland of black and white poplars, willows and ash trees, with reeds and brambles.\n\nLook out for birds: golden orioles, wagtails, wrens, water rails, coots and herons. Barbel are common in the river."}],"fr":[{"h":"Histoire","t":"Les murailles datent du XVIIIe siècle. Le Canal impérial d'Aragon court à leur sommet pour franchir le Jalón. L'ensemble est aussi connu sous le nom d'El Caracol, près d'Alagón.\n\nGrisén eut aussi une gare dès 1863, de la compagnie M.Z.A."},{"h":"À voir","t":"Depuis la rive du Jalón, on mesure la hauteur du mur. Autour pousse un bois de peupliers noirs et blancs, de saules et de frênes, avec roseaux et ronces.\n\nGuettez les oiseaux : loriots, bergeronnettes, troglodytes, râles d'eau, foulques et hérons. Les barbeaux abondent dans la rivière."}],"de":[{"h":"Geschichte","t":"Die Mauern stammen aus dem 18. Jahrhundert. Auf ihnen verläuft der Kaiserkanal von Aragonien, um den Jalón zu überqueren. Die Anlage ist auch als El Caracol bekannt, nahe Alagón.\n\nGrisén hatte außerdem seit 1863 einen Bahnhof der Gesellschaft M.Z.A."},{"h":"Sehenswert","t":"Vom Ufer des Jalón aus erkennt man die Höhe der Mauer. Ringsum wächst Auwald aus Schwarz- und Silberpappeln, Weiden und Eschen, mit Schilf und Brombeeren.\n\nAchten Sie auf die Vögel: Pirole, Stelzen, Zaunkönige, Wasserrallen, Blässhühner und Reiher. Im Fluss gibt es viele Barben."}],"pt":[{"h":"História","t":"As muralhas são do século XVIII. Sobre elas corre o Canal Imperial de Aragão para poder atravessar o rio Jalón. O conjunto é também conhecido como El Caracol, perto de Alagón.\n\nGrisén teve ainda estação de caminho de ferro desde 1863, da companhia M.Z.A."},{"h":"O que ver","t":"Da margem do Jalón aprecia-se a altura do muro. À volta há bosque de choupos, álamos, salgueiros e freixos, com caniços e silvas.\n\nRepare nas aves: papa-figos, alvéolas, carriças, frangos-d'água, galeirões e garças. No rio abundam os barbos."}]},"status":"pending"},{"id":"puente-jubo","town":"Pinseque","cat":"hidraulico","lat":41.73495,"lon":-1.11067,"coord_src":null,"q":["Puente Jubo, Pinseque","Pinseque canal"],"fq":["Puente Jubo","Pinseque"],"name":{"es":"Puente Jubo","en":"Puente Jubo","fr":"Puente Jubo","de":"Puente Jubo","pt":"Puente Jubo"},"when":{"es":"Siglo XVIII · Inacabado","en":"18th c. · Unfinished","fr":"XVIIIe s. · Inachevé","de":"18. Jh. · Unvollendet","pt":"Séc. XVIII · Inacabada"},"desc":{"es":"El Puente Jubo es un viejo puente peatonal sobre el Canal Imperial en Pinseque. Se hizo en el siglo XVIII con el canal, se quedó sin terminar y en el siglo XXI se le añadió una pasarela de hierro.","en":"The Puente Jubo is an old footbridge over the Imperial Canal at Pinseque. It was built in the 18th century along with the canal, was left unfinished, and in the 21st century an iron walkway was added.","fr":"Le Puente Jubo est un vieux pont piéton sur le Canal impérial à Pinseque. Construit au XVIIIe siècle avec le canal, il resta inachevé, et au XXIe siècle on y ajouta une passerelle en fer.","de":"Die Puente Jubo ist eine alte Fußgängerbrücke über den Kaiserkanal in Pinseque. Sie wurde im 18. Jahrhundert zusammen mit dem Kanal gebaut, blieb unvollendet und erhielt im 21. Jahrhundert einen eisernen Steg.","pt":"A Puente Jubo é uma velha ponte pedonal sobre o Canal Imperial em Pinseque. Foi feita no século XVIII com o canal, ficou por terminar e no século XXI recebeu um passadiço de ferro."},"visit":{"es":"Se llega por el camino de sirga del Canal Imperial, llano y apto para bici.","en":"You reach it along the Imperial Canal towpath, which is flat and suitable for cycling.","fr":"On y accède par le chemin de halage du Canal impérial, plat et praticable à vélo.","de":"Man erreicht sie über den Treidelpfad des Kaiserkanals, der flach und für Fahrräder geeignet ist.","pt":"Chega-se pelo caminho de sirga do Canal Imperial, plano e próprio para bicicleta."},"src":"https://es.hispanopedia.com/wiki/Pinseque","sources":["https://es.hispanopedia.com/wiki/Pinseque"],"art":{"es":[{"h":"Historia","t":"El puente se construyó en el siglo XVIII, al mismo tiempo que el Canal Imperial de Aragón, pero no llegó a terminarse.\n\nEn el siglo XXI se le añadió una pasarela de hierro para poder cruzarlo a pie."},{"h":"Qué ver","t":"Es una buena parada en un paseo por el canal entre Pinseque y Grisén. Fíjate en la fábrica antigua y en la pasarela moderna que la completa."}],"en":[{"h":"History","t":"The bridge was built in the 18th century, at the same time as the Imperial Canal of Aragon, but was never finished.\n\nIn the 21st century an iron walkway was added so that it could be crossed on foot."},{"h":"What to see","t":"It is a good stop on a walk along the canal between Pinseque and Grisén. Note the old masonry and the modern walkway that completes it."}],"fr":[{"h":"Histoire","t":"Le pont fut construit au XVIIIe siècle, en même temps que le Canal impérial d'Aragon, mais ne fut jamais achevé.\n\nAu XXIe siècle, une passerelle en fer fut ajoutée pour pouvoir le traverser à pied."},{"h":"À voir","t":"C'est une bonne étape sur une promenade le long du canal entre Pinseque et Grisén. Observez la maçonnerie ancienne et la passerelle moderne qui la complète."}],"de":[{"h":"Geschichte","t":"Die Brücke wurde im 18. Jahrhundert gleichzeitig mit dem Kaiserkanal von Aragonien gebaut, aber nie vollendet.\n\nIm 21. Jahrhundert kam ein eiserner Steg hinzu, damit man sie zu Fuß überqueren kann."},{"h":"Sehenswert","t":"Sie ist ein guter Halt auf einem Spaziergang am Kanal zwischen Pinseque und Grisén. Beachten Sie das alte Mauerwerk und den modernen Steg, der es ergänzt."}],"pt":[{"h":"História","t":"A ponte foi construída no século XVIII, ao mesmo tempo que o Canal Imperial de Aragão, mas nunca foi terminada.\n\nNo século XXI acrescentou-se um passadiço de ferro para a poder atravessar a pé."},{"h":"O que ver","t":"É uma boa paragem num passeio pelo canal entre Pinseque e Grisén. Repare na alvenaria antiga e no passadiço moderno que a completa."}]},"status":"pending"},{"id":"barboles","town":"Bárboles","cat":"patrimonio","lat":41.71239,"lon":-1.18755,"coord_src":null,"q":["Plaza Mayor, Bárboles","Iglesia de la Asunción, Bárboles"],"fq":["Category:Bárboles","Bárboles"],"name":{"es":"Arco del castillo e iglesia de Bárboles","en":"Castle arch and church of Bárboles","fr":"Arc du château et église de Bárboles","de":"Burgbogen und Kirche von Bárboles","pt":"Arco do castelo e igreja de Bárboles"},"when":{"es":"Arco del siglo XIV · Iglesia mudéjar","en":"14th-c. arch · Mudéjar church","fr":"Arc du XIVe s. · Église mudéjare","de":"Bogen des 14. Jh. · Mudéjar-Kirche","pt":"Arco do séc. XIV · Igreja mudéjar"},"desc":{"es":"En la plaza Mayor de Bárboles queda un arco de ladrillo del antiguo castillo, del siglo XIV. Muy cerca, la iglesia mudéjar de la Asunción tiene un artesonado del siglo XVI.","en":"On Bárboles' Plaza Mayor stands a brick arch from the old castle, from the 14th century. Close by, the Mudéjar church of the Asunción has a 16th-century coffered ceiling.","fr":"Sur la plaza Mayor de Bárboles subsiste un arc en brique de l'ancien château, du XIVe siècle. Tout près, l'église mudéjare de l'Asunción possède un plafond à caissons du XVIe siècle.","de":"An der Plaza Mayor von Bárboles steht ein Backsteinbogen der alten Burg aus dem 14. Jahrhundert. Ganz in der Nähe besitzt die Mudéjar-Kirche de la Asunción eine Kassettendecke des 16. Jahrhunderts.","pt":"Na Plaza Mayor de Bárboles resta um arco de tijolo do antigo castelo, do século XIV. Muito perto, a igreja mudéjar da Asunción tem um teto de caixotões do século XVI."},"visit":{"es":"Todo está en el centro del pueblo. La iglesia se visita en horario de culto.","en":"Everything is in the village centre. You can visit the church during services.","fr":"Tout se trouve au centre du village. L'église se visite pendant les offices.","de":"Alles liegt im Ortszentrum. Die Kirche ist während der Gottesdienste zu besichtigen.","pt":"Fica tudo no centro da aldeia. A igreja visita-se durante o culto."},"src":"https://es.hispanopedia.com/wiki/B%C3%A1rboles","sources":["https://es.hispanopedia.com/wiki/B%C3%A1rboles"],"art":{"es":[{"h":"Qué ver","t":"El arco del castillo es de ladrillo y de medio punto, del siglo XIV, a un lado de la plaza Mayor. Más tarde se le añadió el escudo de la villa y un remate en forma de pirámide.\n\nLa iglesia de la Asunción de Nuestra Señora es mudéjar y guarda un artesonado del siglo XVI."},{"h":"Fiestas","t":"El último domingo de mayo se hace la romería de Peramán en honor a la Virgen de la Ola. Peramán y Oitura son núcleos del municipio, además de Bárboles. Las fiestas de la Virgen del Rosario son el primer domingo de octubre."}],"en":[{"h":"What to see","t":"The castle arch is a brick round arch from the 14th century, on one side of the Plaza Mayor. The village's coat of arms and a pyramid-shaped top were added later.\n\nThe church of the Asunción de Nuestra Señora is Mudéjar and keeps a 16th-century coffered ceiling."},{"h":"Festivities","t":"On the last Sunday of May there is the Peramán pilgrimage in honour of the Virgen de la Ola. Peramán and Oitura are settlements of the municipality, besides Bárboles. The feast of the Virgen del Rosario is on the first Sunday of October."}],"fr":[{"h":"À voir","t":"L'arc du château, en brique et en plein cintre, date du XIVe siècle et borde la plaza Mayor. Le blason de la ville et un couronnement pyramidal y furent ajoutés plus tard.\n\nL'église de l'Asunción de Nuestra Señora est mudéjare et conserve un plafond à caissons du XVIe siècle."},{"h":"Fêtes","t":"Le dernier dimanche de mai a lieu le pèlerinage de Peramán en l'honneur de la Virgen de la Ola. Peramán et Oitura sont des hameaux de la commune, outre Bárboles. La fête de la Virgen del Rosario est le premier dimanche d'octobre."}],"de":[{"h":"Sehenswert","t":"Der Burgbogen ist ein Rundbogen aus Backstein aus dem 14. Jahrhundert an einer Seite der Plaza Mayor. Später kamen das Ortswappen und ein pyramidenförmiger Abschluss hinzu.\n\nDie Kirche de la Asunción de Nuestra Señora ist im Mudéjar-Stil erbaut und bewahrt eine Kassettendecke aus dem 16. Jahrhundert."},{"h":"Feste","t":"Am letzten Sonntag im Mai findet die Wallfahrt nach Peramán zu Ehren der Virgen de la Ola statt. Peramán und Oitura sind neben Bárboles Ortsteile der Gemeinde. Das Fest der Virgen del Rosario ist am ersten Sonntag im Oktober."}],"pt":[{"h":"O que ver","t":"O arco do castelo é de tijolo e de volta perfeita, do século XIV, num dos lados da Plaza Mayor. Mais tarde acrescentaram-se o brasão da vila e um remate em forma de pirâmide.\n\nA igreja da Asunción de Nuestra Señora é mudéjar e guarda um teto de caixotões do século XVI."},{"h":"Festas","t":"No último domingo de maio faz-se a romaria de Peramán em honra da Virgen de la Ola. Peramán e Oitura são povoações do concelho, além de Bárboles. A festa da Virgen del Rosario é no primeiro domingo de outubro."}]},"status":"pending"},{"id":"cabanas","town":"Cabañas de Ebro","cat":"patrimonio","lat":41.79562,"lon":-1.16327,"coord_src":null,"q":["Iglesia de San Ildefonso, Cabañas de Ebro","Cabañas de Ebro"],"fq":["Category:Cabañas de Ebro","Cabañas de Ebro"],"name":{"es":"San Ildefonso y el puerto romano","en":"San Ildefonso and the Roman port","fr":"San Ildefonso et le port romain","de":"San Ildefonso und der römische Hafen","pt":"San Ildefonso e o porto romano"},"when":{"es":"Finales del siglo XVII · Barroca","en":"Late 17th c. · Baroque","fr":"Fin du XVIIe s. · Baroque","de":"Ende 17. Jh. · Barock","pt":"Final do séc. XVII · Barroca"},"desc":{"es":"La iglesia de San Ildefonso de Cabañas de Ebro es barroca, de finales del siglo XVII, y en lugar de retablo tiene un gran lienzo del milagro del santo. Cerca está el «Cementerio de los Moros», de época romana.","en":"The church of San Ildefonso in Cabañas de Ebro is Baroque, from the late 17th century, and instead of a retable it has a large canvas of the saint's miracle. Nearby is the «Cementerio de los Moros», from Roman times.","fr":"L'église San Ildefonso de Cabañas de Ebro est baroque, de la fin du XVIIe siècle, et au lieu d'un retable elle a une grande toile du miracle du saint. Tout près se trouve le « Cementerio de los Moros », d'époque romaine.","de":"Die Kirche San Ildefonso in Cabañas de Ebro ist barock, vom Ende des 17. Jahrhunderts, und hat statt eines Retabels ein großes Gemälde vom Wunder des Heiligen. In der Nähe liegt der «Cementerio de los Moros» aus römischer Zeit.","pt":"A igreja de San Ildefonso de Cabañas de Ebro é barroca, do final do século XVII, e em vez de retábulo tem uma grande tela do milagre do santo. Perto fica o «Cementerio de los Moros», de época romana."},"visit":{"es":"La iglesia está en el centro y se visita en horario de culto. El yacimiento no está acondicionado para la visita.","en":"The church is in the centre and can be visited during services. The archaeological site is not prepared for visits.","fr":"L'église est au centre et se visite pendant les offices. Le site archéologique n'est pas aménagé pour la visite.","de":"Die Kirche liegt im Zentrum und ist während der Gottesdienste zu besichtigen. Die Fundstätte ist nicht für Besucher erschlossen.","pt":"A igreja fica no centro e visita-se durante o culto. O sítio arqueológico não está preparado para visitas."},"src":"https://es.hispanopedia.com/wiki/Caba%C3%B1as_de_Ebro","sources":["https://es.hispanopedia.com/wiki/Caba%C3%B1as_de_Ebro"],"art":{"es":[{"h":"Qué ver","t":"La iglesia tiene una sola nave con capillas laterales y bóveda de cañón con lunetos que llevan pequeñas vidrieras. La cabecera es cuadrada abajo y poligonal arriba gracias a unas pechinas. No tiene retablo: su lugar lo ocupa un gran lienzo del milagro de San Ildefonso."},{"h":"Historia","t":"El yacimiento del Cementerio de los Moros se considera el castellum de una villa romana y parte de un antiguo puerto fluvial en el Ebro.\n\nCabañas celebra San Ildefonso el 23 de enero y la Exaltación de la Santa Cruz el 14 de septiembre."}],"en":[{"h":"What to see","t":"The church has a single nave with side chapels and a barrel vault with lunettes holding small stained-glass windows. The chancel is square below and polygonal above thanks to pendentives. It has no retable: its place is taken by a large canvas of the miracle of Saint Ildefonsus."},{"h":"History","t":"The site known as the Cementerio de los Moros is considered the castellum of a Roman villa and part of an old river port on the Ebro.\n\nCabañas celebrates San Ildefonso on 23 January and the Exaltation of the Holy Cross on 14 September."}],"fr":[{"h":"À voir","t":"L'église a une seule nef avec des chapelles latérales et une voûte en berceau à lunettes munies de petits vitraux. Le chevet est carré en bas et polygonal en haut grâce à des pendentifs. Elle n'a pas de retable : une grande toile du miracle de saint Ildefonse en tient lieu."},{"h":"Histoire","t":"Le site appelé Cementerio de los Moros est considéré comme le castellum d'une villa romaine et une partie d'un ancien port fluvial sur l'Èbre.\n\nCabañas fête San Ildefonso le 23 janvier et l'Exaltation de la Sainte Croix le 14 septembre."}],"de":[{"h":"Sehenswert","t":"Die Kirche hat ein einziges Schiff mit Seitenkapellen und ein Tonnengewölbe mit Stichkappen und kleinen Glasfenstern. Der Chor ist unten quadratisch und oben dank Zwickeln polygonal. Ein Retabel fehlt: An seiner Stelle hängt ein großes Gemälde vom Wunder des heiligen Ildefons."},{"h":"Geschichte","t":"Die Fundstätte Cementerio de los Moros gilt als Castellum einer römischen Villa und als Teil eines alten Flusshafens am Ebro.\n\nCabañas feiert San Ildefonso am 23. Januar und die Kreuzerhöhung am 14. September."}],"pt":[{"h":"O que ver","t":"A igreja tem uma só nave com capelas laterais e abóbada de berço com lunetas que levam pequenos vitrais. A cabeceira é quadrada em baixo e poligonal em cima graças a pendentes. Não tem retábulo: o seu lugar é ocupado por uma grande tela do milagre de Santo Ildefonso."},{"h":"História","t":"O sítio do Cementerio de los Moros considera-se o castellum de uma villa romana e parte de um antigo porto fluvial no Ebro.\n\nCabañas celebra San Ildefonso a 23 de janeiro e a Exaltação da Santa Cruz a 14 de setembro."}]},"status":"pending"},{"id":"la-joyosa","town":"La Joyosa","cat":"patrimonio","lat":41.74466,"lon":-1.07306,"coord_src":null,"q":["Palacio, La Joyosa","Marlofa"],"fq":["Category:La Joyosa","La Joyosa"],"name":{"es":"La Joyosa y Marlofa","en":"La Joyosa and Marlofa","fr":"La Joyosa et Marlofa","de":"La Joyosa und Marlofa","pt":"La Joyosa e Marlofa"},"when":{"es":"Baronía desde 1425","en":"Barony since 1425","fr":"Baronnie depuis 1425","de":"Baronie seit 1425","pt":"Baronia desde 1425"},"desc":{"es":"La Joyosa fue cabeza de una baronía creada en 1425 y conserva el palacio del barón. El municipio tiene dos núcleos: La Joyosa y Marlofa.","en":"La Joyosa was the seat of a barony created in 1425 and keeps the baron's palace. The municipality has two villages: La Joyosa and Marlofa.","fr":"La Joyosa fut le chef-lieu d'une baronnie créée en 1425 et conserve le palais du baron. La commune compte deux villages : La Joyosa et Marlofa.","de":"La Joyosa war Hauptort einer 1425 geschaffenen Baronie und bewahrt den Palast des Barons. Die Gemeinde hat zwei Ortsteile: La Joyosa und Marlofa.","pt":"La Joyosa foi sede de uma baronia criada em 1425 e conserva o palácio do barão. O concelho tem duas povoações: La Joyosa e Marlofa."},"visit":{"es":"Todo se ve por fuera en un paseo corto. Las iglesias abren en horario de culto.","en":"Everything can be seen from outside on a short walk. The churches open during services.","fr":"Tout se voit de l'extérieur lors d'une courte promenade. Les églises ouvrent pendant les offices.","de":"Alles ist bei einem kurzen Spaziergang von außen zu sehen. Die Kirchen sind zu den Gottesdiensten geöffnet.","pt":"Tudo se vê por fora num passeio curto. As igrejas abrem durante o culto."},"src":"https://es.hispanopedia.com/wiki/La_Joyosa","sources":["https://es.hispanopedia.com/wiki/La_Joyosa"],"art":{"es":[{"h":"Qué ver","t":"En La Joyosa están la iglesia de Nuestra Señora del Puig y el palacio del barón de La Joyosa. En Marlofa, la iglesia de Nuestra Señora del Rosario.\n\nMarlofa eran antiguamente dos fincas de la baronía."},{"h":"Fiestas","t":"La Joyosa celebra a la Virgen del Puig el 8 de septiembre, y Marlofa a la Virgen del Rosario el primer fin de semana de octubre."}],"en":[{"h":"What to see","t":"In La Joyosa stand the church of Nuestra Señora del Puig and the palace of the Baron of La Joyosa. In Marlofa, the church of Nuestra Señora del Rosario.\n\nMarlofa was formerly two estates of the barony."},{"h":"Festivities","t":"La Joyosa celebrates the Virgen del Puig on 8 September, and Marlofa the Virgen del Rosario on the first weekend of October."}],"fr":[{"h":"À voir","t":"À La Joyosa se trouvent l'église Nuestra Señora del Puig et le palais du baron de La Joyosa. À Marlofa, l'église Nuestra Señora del Rosario.\n\nMarlofa était autrefois formée de deux domaines de la baronnie."},{"h":"Fêtes","t":"La Joyosa fête la Virgen del Puig le 8 septembre, et Marlofa la Virgen del Rosario le premier week-end d'octobre."}],"de":[{"h":"Sehenswert","t":"In La Joyosa stehen die Kirche Nuestra Señora del Puig und der Palast des Barons von La Joyosa. In Marlofa die Kirche Nuestra Señora del Rosario.\n\nMarlofa bestand früher aus zwei Gütern der Baronie."},{"h":"Feste","t":"La Joyosa feiert die Virgen del Puig am 8. September, Marlofa die Virgen del Rosario am ersten Oktoberwochenende."}],"pt":[{"h":"O que ver","t":"Em La Joyosa ficam a igreja de Nuestra Señora del Puig e o palácio do barão de La Joyosa. Em Marlofa, a igreja de Nuestra Señora del Rosario.\n\nMarlofa eram antigamente duas herdades da baronia."},{"h":"Festas","t":"La Joyosa celebra a Virgen del Puig a 8 de setembro, e Marlofa a Virgen del Rosario no primeiro fim de semana de outubro."}]},"status":"pending"},{"id":"azud-pleitas","town":"Pleitas","cat":"hidraulico","lat":41.7113,"lon":-1.2028,"coord_src":null,"q":["Azud de Pleitas","Pleitas"],"fq":["Category:Pleitas","Pleitas azud"],"name":{"es":"Azud e iglesia de Pleitas","en":"Pleitas weir and church","fr":"Barrage et église de Pleitas","de":"Wehr und Kirche von Pleitas","pt":"Açude e igreja de Pleitas"},"when":{"es":"Regulado desde 1316","en":"Regulated since 1316","fr":"Réglementé depuis 1316","de":"Seit 1316 geregelt","pt":"Regulado desde 1316"},"desc":{"es":"El azud de Pleitas desvía agua del Jalón a la acequia que riega Pleitas, Pedrola, Luceni y Urrea. Su reparto se fijó ya en 1316 por un laudo del arzobispo de Zaragoza.","en":"The Pleitas weir diverts water from the Jalón into the channel that irrigates Pleitas, Pedrola, Luceni and Urrea. Its sharing was already set in 1316 by a ruling of the Archbishop of Zaragoza.","fr":"Le barrage de Pleitas dérive l'eau du Jalón vers le canal qui irrigue Pleitas, Pedrola, Luceni et Urrea. Son partage fut fixé dès 1316 par une sentence de l'archevêque de Saragosse.","de":"Das Wehr von Pleitas leitet Wasser aus dem Jalón in den Kanal, der Pleitas, Pedrola, Luceni und Urrea bewässert. Seine Aufteilung wurde schon 1316 durch einen Schiedsspruch des Erzbischofs von Zaragoza festgelegt.","pt":"O açude de Pleitas desvia água do Jalón para a levada que rega Pleitas, Pedrola, Luceni e Urrea. A sua repartição foi fixada já em 1316 por uma sentença do arcebispo de Saragoça."},"visit":{"es":"Se ve desde la orilla. No camines sobre el azud: la corriente es peligrosa.","en":"View it from the bank. Do not walk on the weir: the current is dangerous.","fr":"Regardez-le depuis la rive. Ne marchez pas sur le barrage : le courant est dangereux.","de":"Betrachten Sie es vom Ufer aus. Gehen Sie nicht auf das Wehr: Die Strömung ist gefährlich.","pt":"Veja-o da margem. Não caminhe sobre o açude: a corrente é perigosa."},"src":"https://es.hispanopedia.com/wiki/Pleitas","sources":["https://es.hispanopedia.com/wiki/Pleitas"],"art":{"es":[{"h":"Historia","t":"En 1316 un laudo arbitral de Pedro de Luna, arzobispo de Zaragoza, reguló los derechos sobre el agua de la acequia de Pleitas, Pedrola, Luceni y Urrea. En 1626 se habla de la reconstrucción del azud y de la acequia.\n\nEn 1266 la viuda de Ximeno de Arenoso donó la villa y su castillo a la Orden de San Juan de Jerusalén, que tomó posesión en 1274."},{"h":"Qué ver","t":"Un azud es una presa baja que eleva el nivel del río para desviar el agua a una acequia. El de Pleitas es un buen ejemplo de los sistemas de riego que sostienen la huerta de la Ribera desde la Edad Media.\n\nEn el pueblo está también la iglesia de San Juan Bautista."}],"en":[{"h":"History","t":"In 1316 an arbitration ruling by Pedro de Luna, Archbishop of Zaragoza, regulated the water rights of the Pleitas, Pedrola, Luceni and Urrea channel. In 1626 the rebuilding of the weir and the channel is mentioned.\n\nIn 1266 the widow of Ximeno de Arenoso gave the village and its castle to the Order of Saint John of Jerusalem, which took possession in 1274."},{"h":"What to see","t":"A weir is a low dam that raises the river level to divert water into a channel. The Pleitas weir is a good example of the irrigation systems that have sustained the Ribera's market gardens since the Middle Ages.\n\nThe village also has the church of San Juan Bautista."}],"fr":[{"h":"Histoire","t":"En 1316, une sentence arbitrale de Pedro de Luna, archevêque de Saragosse, régla les droits d'eau du canal de Pleitas, Pedrola, Luceni et Urrea. En 1626, on mentionne la reconstruction du barrage et du canal.\n\nEn 1266, la veuve de Ximeno de Arenoso donna le village et son château à l'ordre de Saint-Jean de Jérusalem, qui en prit possession en 1274."},{"h":"À voir","t":"Un azud est un petit barrage qui élève le niveau de la rivière pour en dériver l'eau vers un canal. Celui de Pleitas illustre bien les systèmes d'irrigation qui font vivre les jardins de la Ribera depuis le Moyen Âge.\n\nLe village possède aussi l'église San Juan Bautista."}],"de":[{"h":"Geschichte","t":"1316 regelte ein Schiedsspruch von Pedro de Luna, Erzbischof von Zaragoza, die Wasserrechte am Kanal von Pleitas, Pedrola, Luceni und Urrea. 1626 ist vom Wiederaufbau des Wehrs und des Kanals die Rede.\n\n1266 schenkte die Witwe von Ximeno de Arenoso das Dorf und seine Burg dem Johanniterorden, der 1274 davon Besitz nahm."},{"h":"Sehenswert","t":"Ein Azud ist ein niedriges Wehr, das den Fluss anstaut, um Wasser in einen Kanal zu leiten. Das von Pleitas ist ein gutes Beispiel für die Bewässerungssysteme, die die Gärten der Ribera seit dem Mittelalter versorgen.\n\nIm Dorf steht außerdem die Kirche San Juan Bautista."}],"pt":[{"h":"História","t":"Em 1316 uma sentença arbitral de Pedro de Luna, arcebispo de Saragoça, regulou os direitos de água da levada de Pleitas, Pedrola, Luceni e Urrea. Em 1626 fala-se da reconstrução do açude e da levada.\n\nEm 1266 a viúva de Ximeno de Arenoso doou a vila e o seu castelo à Ordem de São João de Jerusalém, que tomou posse em 1274."},{"h":"O que ver","t":"Um açude é uma represa baixa que eleva o nível do rio para desviar a água para uma levada. O de Pleitas é um bom exemplo dos sistemas de rega que sustentam as hortas da Ribera desde a Idade Média.\n\nNa aldeia fica também a igreja de San Juan Bautista."}]},"status":"pending"}],"towns":[{"name":"Alagón","lat":41.77054,"lon":-1.12079},{"name":"Alcalá de Ebro","lat":41.81404,"lon":-1.19408},{"name":"Bárboles","lat":41.71241,"lon":-1.18775},{"name":"Boquiñeni","lat":41.8481,"lon":-1.25158},{"name":"Cabañas de Ebro","lat":41.79459,"lon":-1.16248},{"name":"Figueruelas","lat":41.76613,"lon":-1.17518},{"name":"Gallur","lat":41.86917,"lon":-1.31611},{"name":"Grisén","lat":41.74431,"lon":-1.16417},{"name":"La Joyosa","lat":41.74483,"lon":-1.07286},{"name":"Luceni","lat":41.82859,"lon":-1.23922},{"name":"Pedrola","lat":41.78744,"lon":-1.21423},{"name":"Pinseque","lat":41.73785,"lon":-1.10139},{"name":"Pleitas","lat":41.71128,"lon":-1.20282},{"name":"Pradilla de Ebro","lat":41.86044,"lon":-1.2632},{"name":"Remolinos","lat":41.83725,"lon":-1.17542},{"name":"Sobradiel","lat":41.73889,"lon":-1.03689},{"name":"Torres de Berrellén","lat":41.75726,"lon":-1.06455}],"context":[],"routes":[{"id":"alagon-monumental","cat":"patrimonio","mode":"walk","stops":["san-pedro-alagon","casco-alagon","casa-cultura-goya","san-juan-alagon","virgen-castillo-alagon","azucarera-alagon"],"name":{"es":"Alagón monumental","en":"Monumental Alagón","fr":"Alagón monumental","de":"Das monumentale Alagón","pt":"Alagón monumental"},"summary":{"es":"La capital de la comarca a pie: la torre mudéjar de San Pedro, la cúpula de San Antonio, el fresco atribuido a Goya y la patrona del Castillo.","en":"The county town on foot: the Mudéjar tower of San Pedro, the dome of San Antonio, the fresco attributed to Goya and the patron Virgin of the Castle.","fr":"Le chef-lieu à pied : la tour mudéjare de San Pedro, la coupole de San Antonio, la fresque /* ---------- distance ---------- */
function hav(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lon-a.lon);const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}

function setBasemap(k,silent){
  state.basemap=k; $$(".layerbox button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.k===k)));

  $("#map").classList.remove("tiles-on");

  map.setMaxZoom(18);
  const def=TILES[k]; let ok=0,bad=0,decided=false;
  tileLayer=L.tileLayer(def.url,def.opt);
  tileLayer.on("tileload",()=>{ok++; if(!decided){decided=true;$("#map").classList.add("tiles-on");}});
  tileLayer.on("tileerror",()=>{bad++; if(!decided&&bad>=3&&HASBASE){decided=true;map.removeLayer(tileLayer);tileLayer=null;state.basemap="ilustrado";map.setMaxZoom(15);$("#map").classList.remove("tiles-on");$$(".layerbox button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.k==="ilustrado")));if(!silent) toast(t("tilesBlocked"));}});

let routeGroup=L.layerGroup().addTo(map);
function drawRoute(r){
  routeGroup.clearLayers(); if(!r) return;
  const pts=r.stops.map(id=>BYID[id]).map(p=>[p.lat,p.lon]);
  const color=`var(${CATS[r.cat].color})`;
  const line=L.polyline(pts,{pane:"routes",className:"route-line",interactive:false});
  routeGroup.addLayer(line);
  setTimeout(()=>{const el=line.getElement();if(el) el.style.setProperty("--c",color);},0);
  r.stops.forEach((id,i)=>{const p=BYID[id];routeGroup.addLayer(L.marker([p.lat,p.lon],{pane:"stops",interactive:false,keyboard:false,icon:L.divIcon({className:"",html:`<div class="stopnum">${i+1}</div>`,iconSize:[0,0]})}));});
  map.flyToBounds(L.latLngBounds(pts),{padding:[50,50],duration:.8,maxZoom:15});
}
function routeStats(r){let km=0;const legs=[];for(let i=1;i<r.stops.length;i++){const d=hav(BYID[r.stops[i-1]],BYID[r.stops[i]])*1.25;legs.push(d);km+=d;}
  const speed={walk:4,bike:14,car:55}[r.mode];const mins=Math.round(km/speed*60+r.stops.length*(r.mode==="car"?35:20));return {km,legs,mins};}
function gmapsRoute(r){const pts=r.stops.map(id=>BYID[id]).map(p=>p.lat+","+p.lon);const mode={walk:"walking",bike:"bicycling",car:"driving"}[r.mode];
  return "https://www.google.com/maps/dir/?api=1&origin="+pts[0]+"&destination="+pts.at(-1)+(pts.length>2?"&waypoints="+encodeURIComponent(pts.slice(1,-1).join("|")):"")+"&travelmode="+mode;}
function fmtDur(m){const h=Math.floor(m/60),mm=m%60;return h?`${h} h${mm?" "+mm+" min":""}`:`${mm} min`;}

/* Respaldo: voz del dispositivo, solo si existe en el idioma elegido (nunca leer francés con voz española). */
function bestVoice(code){const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];const base=code.slice(0,2);
  const c=vs.filter(v=>(v.lang||"").replace("_","-").toLowerCase().startsWith(base));if(!c.length) return null;
  const score=v=>{const n=v.name||"";let s=0;if(/natural|neural/i.test(n)) s+=50;if(/online/i.test(n)) s+=20;if(/premium|enhanced|mejorada|siri/i.test(n)) s+=30;if(/google/i.test(n)) s+=15;
    if((v.lang||"").replace("_","-").toLowerCase()===code.toLowerCase()) s+=10;if(/compact|espeak/i.test(n)) s-=30;return s;};
  return c.sort((a,b)=>score(b)-score(a))[0];}
function speakTTS(p){
  if(!("speechSynthesis" in window)){toast(t("noAudio"));setPP(false);return;}
  const go=()=>{const code=LANGS.find(l=>l[0]===lang)[2];const v=bestVoice(code);
    if(!v){toast(t("noVoice"));setPP(false);return;}
    const txt=[L10(p.name),L10(p.desc),L10(p.more)].filter(Boolean).join(". ");
    const parts=txt.match(/[^.!?;]+[.!?;]*/g)||[txt];speechSynthesis.cancel();ttsOn=true;setPP(true);
    parts.forEach((s,i)=>{const u=new SpeechSynthesisUtterance(s.trim());u.voice=v;u.lang=v.lang;u.rate=.95*audRate;
      if(i===parts.length-1) u.onend=()=>{ttsOn=false;setPP(false);};u.onerror=()=>{ttsOn=false;setPP(false);};speechSynthesis.speak(u);});};
  if(speechSynthesis.getVoices().length) go(); else {let done=false;const f=()=>{if(done) return;done=true;go();};speechSynthesis.addEventListener("voiceschanged",f,{once:true});setTimeout(f,900);}
}

function b64utf8(s){const b=new TextEncoder().encode(s);let x="";for(let i=0;i<b.length;i+=8192) x+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(x);}

async function pbk(pass,salt,it){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);

async function sealToken(tok,pass){const it=310000,salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},await pbk(pass,salt,it),new TextEncoder().encode(tok));
  return {v:1,kdf:"PBKDF2-SHA256",it,salt:ub(salt),iv:ub(iv),ct:ub(ct)};}
async function unlockToken(pass){
  if(!PUBCFG){try{const r=await fetch("publish.json",{cache:"no-store"});if(r.ok) PUBCFG=await r.json();}catch(e){}}
  if(!PUBCFG||!PUBCFG.ct) throw new Error("nocfg");
  try{const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:bu(PUBCFG.iv)},await pbk(pass,bu(PUBCFG.salt),PUBCFG.it||310000),bu(PUBCFG.ct));return new TextDecoder().decode(pt);}
  catch(e){throw new Error("pass");}}

  const h={Authorization:"Bearer "+tok,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  let sha;const g=await fetch(api+"?ref="+br,{headers:h,cache:"no-store"});if(g.ok) sha=(await g.json()).sha; else if(g.status!==404) throw new Error("HTTP "+g.status);
  const body={message,content:b64utf8(text),branch:br};if(sha) body.sha=sha;
  const r=await fetch(api,{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},h),body:JSON.stringify(body)});
  if(!r.ok) throw new Error("HTTP "+r.status);}

function stampUrl(id){return (SITE||location.href.split("#")[0])+"#s-"+id;}

/* ---------- Contenido publicado por la comarca (contenido.json) ---------- */
const SITE=DATA.siteUrl||"";
const today=()=>new Date().toISOString().slice(0,10);
let EVENTS=(DATA.eventos||[]).slice(), NEGOCIOS=(DATA.negocios||[]).slice(), AVISOS=[], PREMIO=null, REMOTE={};
function mergeL(a,b){return Object.assign({},a||{},b||{});}
function applyPoiPatch(id,e){const p=BYID[id];if(!p||!e) return;
  ["name","desc","visit"].forEach(k=>{if(e[k]) p[k]=mergeL(p[k],e[k]);});
  if(e.status) p.status=e.status;
  if(e.cat&&CATS[e.cat]&&e.cat!==p.cat){p.cat=e.cat;if(markers[p.id]) markers[p.id].setIcon(pinIcon(p));}}
function addPoi(a){if(!a||!a.id||BYID[a.id]||!CATS[a.cat]) return;POIS.push(a);BYID[a.id]=a;if(typeof markers!=="undefined"&&!markers[a.id]) addMarker(a);}
function applyContent(c){if(!c||typeof c!=="object") return;
  (c.added||[]).forEach(addPoi);
  Object.keys(c.pois||{}).forEach(id=>applyPoiPatch(id,c.pois[id]));
  if(Array.isArray(c.avisos)) AVISOS=c.avisos.slice();
  if(Array.isArray(c.eventos)) EVENTS=c.eventos.slice();
  if(Array.isArray(c.negocios)) NEGOCIOS=c.negocios.slice();
  if(c.premio) PREMIO=c.premio;}
function applyLocal(){EDITS.added.forEach(addPoi);Object.keys(EDITS.byId).forEach(id=>applyPoiPatch(id,EDITS.byId[id]));
  if(Array.isArray(EDITS.avisos)) AVISOS=EDITS.avisos.slice();
  if(Array.isArray(EDITS.eventos)) EVENTS=EDITS.eventos.slice();
  if(EDITS.premio) PREMIO=EDITS.premio;}
function hasLocal(){return !!(Object.keys(EDITS.byId).length||EDITS.added.length||EDITS.avisos||EDITS.eventos||EDITS.premio);}
function buildContent(){const pois={};
  Object.keys(REMOTE.pois||{}).forEach(id=>pois[id]=Object.assign({},REMOTE.pois[id]));
  Object.keys(EDITS.byId).forEach(id=>{const a=pois[id]||{},b=EDITS.byId[id];pois[id]=Object.assign({},a,b,{name:mergeL(a.name,b.name),desc:mergeL(a.desc,b.desc),visit:mergeL(a.visit,b.visit)});});
  const added=(REMOTE.added||[]).filter(a=>!EDITS.added.some(b=>b.id===a.id)).concat(EDITS.added);
  const c={version:1,updated:new Date().toISOString(),pois,added,avisos:AVISOS};
  if(EDITS.eventos||REMOTE.eventos) c.eventos=EVENTS;
  if(PREMIO&&L10(PREMIO)) c.premio=PREMIO;
  return c;}
function activeAvisos(poi){const d=today();return AVISOS.filter(a=>a&&(!a.hasta||a.hasta>=d)&&(poi?a.poi===poi:!a.poi));}
function avisosHTML(poi){const L=activeAvisos(poi);if(!L.length) return "";
  return L.map(a=>`<div class="aviso ${a.tipo==="cierre"?"warn":""}" role="note"><b>${esc(t(a.tipo==="cierre"?"avisoCierre":"avisoInfo"))}</b><span>${esc(L10(a.txt))}${a.hasta?` <span class="small">· ${esc(t("avisoHasta",{d:fmtDate(a.hasta)}))}</span>`:""}</span></div>`).join("");}
function fmtDate(s){try{return new Date(s+"T12:00:00").toLocaleDateString(LANGS.find(l=>l[0]===lang)[2],{day:"numeric",month:"long",year:"numeric"});}catch(e){return s;}}
async function loadRemote(){if(!/^https?:/.test(location.protocol)) return false;
  try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),4000);
    const r=await fetch("contenido.json",{cache:"no-store",signal:ctl.signal});clearTimeout(tm);
    if(!r.ok) return false;REMOTE=await r.json();applyContent(REMOTE);applyLocal();return true;}catch(e){return false;}}

/* ---------- Estadísticas anónimas, sin cookies ---------- */
const STATS=DATA.stats||"";
let sentVisit=false;
function track(kind,id){try{
  if(!sentVisit&&kind!=="visita"){sentVisit=true;track("visita");}
  if(!STATS) return;
  const u=STATS+"?p="+encodeURIComponent("/"+kind+(id?"/"+id:""))+"&t="+encodeURIComponent(lang)+"&e=true&rnd="+Math.random().toString(36).slice(2,8);
  const im=new Image();im.referrerPolicy="no-referrer";im.src=u;}catch(e){}}

/* ---------- Pasaporte de sellos ---------- */
const PASS_KEY="rbx-pass-v1";
let PASS={};try{PASS=JSON.parse(store.get(PASS_KEY)||"{}")||{};}catch(e){PASS={};}
const STAMP_KM=0.3;
const passDemo=()=>store.get("rbx-passdemo")==="1";
function stamp(id,how){if(!BYID[id]||PASS[id]) return false;PASS[id]={t:Date.now(),h:how};store.set(PASS_KEY,JSON.stringify(PASS));track("sello",id);return true;}
const nStamps=()=>Object.keys(PASS).filter(id=>BYID[id]).length;
function routeDone(r){return r.stops.every(id=>PASS[id]);}
function stampBoxHTML(p){const s=PASS[p.id];
  return `<div class="stampbox${s?" done":""}" style="--c:var(${CATS[p.cat].color})"><div class="seal" aria-hidden="true">${s?svgI("check"):svgI("stamp")}</div>
   <div class="stack" style="gap:2px;min-width:0;flex:1"><b>${esc(t(s?"passStamped":"passStampTitle"))}</b><span class="small">${esc(s?t("passStampedOn",{d:new Date(s.t).toLocaleDateString(LANGS.find(l=>l[0]===lang)[2])}):t("passStampText"))}</span></div>
   ${s?`<button type="button" class="btn sm" id="topass">${esc(t("passOpen"))}</button>`:`<button type="button" class="btn primary sm" id="dostamp">${esc(t("passStampBtn"))}</button>`}</div>`;}
function bindStamp(p){const b=$("#dostamp");if(b) b.onclick=()=>tryStamp(p);const o=$("#topass");if(o) o.onclick=()=>setTab("pasaporte");}
function tryStamp(p){
  const ok=()=>{stamp(p.id,"gps");toast(t("passGot"));renderPlace();};
  if(passDemo()){ok();return;}
  if(!navigator.geolocation){toast(t("locErr"));return;}
  toast(t("locating"));
  try{navigator.geolocation.getCurrentPosition(pos=>{const d=hav({lat:pos.coords.latitude,lon:pos.coords.longitude},p);
    if(d<=STAMP_KM) ok(); else toast(t("passFar",{n:d<10?nf().format(d):Math.round(d)}));},
    ()=>toast(t("locErr")),{timeout:12000,maximumAge:30000,enableHighAccuracy:true});}catch(e){toast(t("locErr"));}}
function renderPass(){
  const v=$("#v-pasaporte");const n=nStamps(),N=POIS.length;
  const towns=[...new Set(POIS.map(p=>p.town))].sort((a,b)=>a.localeCompare(b,"es"));

  v.innerHTML=`<div class="stack" style="gap:4px"><div class="eyebrow">${esc(t("tabPass"))}</div><h2>${esc(t("passTitle"))}</h2><p class="lede">${esc(t("passIntro"))}</p></div>
   ${passDemo()?`<div class="aviso"><b>${esc(t("passDemoTag"))}</b><span>${esc(t("passDemoText"))}</span></div>`:""}
   <div class="passhead"><div class="ring" style="--p:${(n/N*100).toFixed(1)}"><b>${n}</b><span>/ ${N}</span></div>
    <div class="stack" style="gap:3px"><b>${esc(t("passCount",{n,N}))}</b><span class="small">${esc(t("passHow"))}</span></div></div>
   ${PREMIO&&L10(PREMIO)?`<div class="aviso prize"><b>${esc(t("passPrize"))}</b><span>${esc(L10(PREMIO))}</span></div>`:""}
   <div class="stack" style="gap:8px"><h3>${esc(t("passRoutes"))}</h3>
    ${routes.map(({r,k})=>`<button type="button" class="prow" data-r="${r.id}" style="--c:var(${CATS[r.cat].color})"><span class="t">${esc(L10(r.name))}</span><span class="pbar"><i style="width:${(k/r.stops.length*100).toFixed(0)}%"></i></span><span class="small">${k===r.stops.length?"✓ "+esc(t("passDone")):k+" / "+r.stops.length}</span></button>`).join("")}</div>
   <div class="stack" style="gap:6px"><h3>${esc(t("passAll"))}</h3>
    ${towns.map(tn=>`<div class="group-h">${esc(tn)}<span>${POIS.filter(p=>p.town===tn&&PASS[p.id]).length} / ${POIS.filter(p=>p.town===tn).length}</span></div>
     <div class="stamps">${POIS.filter(p=>p.town===tn).map(p=>`<button type="button" class="stamp${PASS[p.id]?" on":""}" data-id="${p.id}" style="--c:var(${CATS[p.cat].color})" aria-label="${esc(L10(p.name))}${PASS[p.id]?" · "+esc(t("passStamped")):""}"><span class="seal" aria-hidden="true">${PASS[p.id]?ICON(p.cat):""}</span><span class="nm">${esc(L10(p.name))}</span></button>`).join("")}</div>`).join("")}</div>
   <div class="card stack" style="gap:8px"><h3>${esc(t("passDiploma"))}</h3>
    <p class="small">${esc(t(canDiploma?"passDiplomaText":"passDiplomaLocked"))}</p>
    ${canDiploma?`<div class="field"><label for="dip-name">${esc(t("passYourName"))}</label><input id="dip-name" maxlength="40" autocomplete="name"></div>
    <button type="button" class="btn primary" id="dip-go" style="align-self:flex-start">${svgI("download")}<span>${esc(t("passDiplomaBtn"))}</span></button>`:""}</div>`;
  v.onclick=e=>{const b=e.target.closest("[data-id]");if(b){openPlace(b.dataset.id);return;}
    const r=e.target.closest("[data-r]");if(r){state.route=r.dataset.r;setTab("rutas",false);setHash("r-"+state.route);drawRoute(DATA.routes.find(x=>x.id===state.route));refreshMarkers();}};
  const g=$("#dip-go");if(g) g.onclick=()=>diploma(($("#dip-name").value||"").trim());

function diploma(name){
  const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const cs=getComputedStyle(document.documentElement);const col=v=>(cs.getPropertyValue(v)||"").trim()||"#17646C";
  x.fillStyle="#F7F4EC";x.fillRect(0,0,W,H);
  x.strokeStyle="#17646C";x.lineWidth=6;x.strokeRect(40,40,W-80,H-80);x.lineWidth=2;x.strokeRect(58,58,W-116,H-116);
  x.strokeStyle="#5B9BD5";x.lineWidth=10;x.lineCap="round";x.beginPath();x.moveTo(120,300);x.bezierCurveTo(330,200,420,380,600,300);x.bezierCurveTo(760,230,860,330,960,270);x.stroke();
  x.fillStyle="#18221E";x.textAlign="center";
  x.font="700 30px system-ui,sans-serif";x.fillText("COMARCA RIBERA ALTA DEL EBRO",W/2,150);
  x.font="700 76px Georgia,serif";x.fillText(t("passDipTitle"),W/2,410);
  x.font="400 34px system-ui,sans-serif";x.fillStyle="#56635D";x.fillText(t("passDipFor"),W/2,490);
  x.fillStyle="#18221E";x.font="700 60px Georgia,serif";x.fillText(name||t("passDipAnon"),W/2,570);
  const n=nStamps();x.font="400 36px system-ui,sans-serif";x.fillStyle="#18221E";x.fillText(t("passDipCount",{n,N:POIS.length}),W/2,645);
  const done=DATA.routes.filter(routeDone);
  x.font="400 28px system-ui,sans-serif";x.fillStyle="#56635D";
  done.slice(0,3).forEach((r,i)=>x.fillText("✓ "+L10(r.name),W/2,705+i*40));
  const cols=9,sz=58,gap=16,gx=(W-(cols*sz+(cols-1)*gap))/2,gy=840;
  POIS.slice(0,45).forEach((p,i)=>{const cx=gx+(i%cols)*(sz+gap)+sz/2,cy=gy+Math.floor(i/cols)*(sz+gap)+sz/2;
    x.beginPath();x.arc(cx,cy,sz/2-4,0,Math.PI*2);
    if(PASS[p.id]){x.fillStyle=col(CATS[p.cat].color);x.fill();}else{x.setLineDash([6,6]);x.strokeStyle="#B9C2BD";x.lineWidth=3;x.stroke();x.setLineDash([]);}});
  x.fillStyle="#56635D";x.font="400 24px system-ui,sans-serif";x.fillText(new Date().toLocaleDateString(LANGS.find(l=>l[0]===lang)[2],{day:"numeric",month:"long",year:"numeric"}),W/2,H-100);
  c.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="pasaporte-ribera-baja.png";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);track("diploma");},"image/png");
}

/* ---------- Agenda, dónde comer y dormir ---------- */
const MONTHS=m=>new Date(2026,m-1,15).toLocaleDateString(LANGS.find(l=>l[0]===lang)[2],{month:"long"});
function evOrder(e){const now=new Date();const cm=now.getMonth()+1;
  if(e.date){const d=new Date(e.date+"T12:00:00");const diff=(d-now)/864e5;return diff>=-1?diff:9999+diff;}
  const m=e.month||12;return ((m-cm+12)%12)*30.5;}
function renderAgenda(){

   <div class="stack" style="gap:8px"><h3>${esc(t("agEvents"))}</h3>
   ${ev.length?ev.map(e=>`<article class="ev">${e.date?`<div class="cal" aria-hidden="true"><span>${esc(new Date(e.date+"T12:00:00").toLocaleDateString(LANGS.find(l=>l[0]===lang)[2],{month:"short"}).replace(".",""))}</span><b>${+e.date.slice(8,10)}</b></div>`:`<div class="cal m" aria-hidden="true"><b>${esc(MONTHS(e.month).slice(0,3).replace(".",""))}</b></div>`}
     <div class="stack" style="gap:3px;min-width:0"><b>${esc(L10(e.name))}</b><span class="small"><b style="color:var(--ink)">${esc(e.mun)}</b> · ${esc(L10(e.when))}</span>${L10(e.desc)?`<p>${esc(L10(e.desc))}</p>`:""}${e.src?`<a class="small" href="${esc(e.src)}" target="_blank" rel="noopener">${esc(t("source"))}</a>`:""}</div></article>`).join(""):`<p class="small">${esc(t("agNone"))}</p>`}
   <p class="note">${esc(t("agNote"))}</p></div>

    <p class="note">${esc(t("agStayNote"))}</p></div>`:""}
   <div class="card stack" style="gap:6px"><h3>${esc(t("agBiz"))}</h3><p class="small">${esc(t("agBizText"))}</p>
    ${DATA.contact?`<div class="actions">${DATA.contact.tel?`<a class="btn" href="tel:${esc(DATA.contact.tel.replace(/\s/g,""))}">${esc(DATA.contact.tel)}</a>`:""}${DATA.contact.web?`<a class="btn" href="${esc(DATA.contact.web)}" target="_blank" rel="noopener">${esc(t("agWeb"))}</a>`:""}</div>`:""}</div>`;
  $("#ag-town").onchange=e=>{state.agTown=e.target.value;renderAgenda();};
}

function nextEventText(){const e=EVENTS.filter(e=>!(e.date&&e.date<today())).sort((a,b)=>evOrder(a)-evOrder(b))[0];return e?t("agNext",{x:L10(e.name)+" · "+e.mun}):t("agCtaText");}

function showCover(){
  let seen=false;try{seen=sessionStorage.getItem(SP+"rbx-cover")==="1";}catch(e){}
  if(seen) return;
  const c=$("#cover");const key=DATA.coverPhoto||"rueda";const ph=PH[key];
  const draw=()=>{c.innerHTML=`${phHTML(key,"patrimonio",1280)}<div class="shade"></div>
    <div class="brandc"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="rgba(255,255,255,.16)"/><path d="M4 22c5-1 6-7 11-7s5 9 10 9 4-6 5-7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="23" cy="10" r="2.6" fill="#fff"/></svg><span>Ribera Alta del Ebro Explora</span></div>
    <div class="clangs">${LANGS.map(([k,lab])=>`<button type="button" data-l="${k}" aria-pressed="${k===lang}">${lab}</button>`).join("")}</div>
    <div class="in"><div class="kick">${esc(t("coverKicker"))}</div><h1>${clauses(t("coverTitle"))}</h1><p>${esc(t("coverText"))}</p>
    <div class="row2"><button type="button" class="cbtn main" id="c-go">${esc(t("coverCta"))}</button><button type="button" class="cbtn" id="c-routes">${esc(t("coverRoutes"))}</button></div></div>
    ${ph?`<div class="credit">${esc(t("photo"))}: <a href="${esc(ph.page)}" target="_blank" rel="noopener">${esc(ph.author)}</a> · ${esc(ph.license)}</div>`:""}`;
    $("#c-go").onclick=()=>hideCover("inicio");$("#c-routes").onclick=()=>hideCover("rutas");
    $(".clangs",c).onclick=e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.l;store.set("rbx-lang",lang);applyLang();draw();};};
  draw();c.hidden=false;
  setTimeout(()=>{const g=$("#c-go");if(g) g.focus();},50);
}
function hideCover(tab){const c=$("#cover");c.hidden=true;c.innerHTML="";try{sessionStorage.setItem(SP+"rbx-cover","1");}catch(e){}
  if(tab&&tab!==state.tab) setTab(tab);setTimeout(()=>map.invalidateSize(),30);}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#cover").hidden) hideCover();});

/* ---------- hash routing ---------- */
function fromHash(){
  const h=(location.hash||"").slice(1);
  if(h&&!$("#cover").hidden){const c=$("#cover");c.hidden=true;c.innerHTML="";setTimeout(()=>map.invalidateSize(),30);}
  if(h.startsWith("p-")&&BYID[h.slice(2)]){state.sel=h.slice(2);track("ficha",state.sel);const p=BYID[state.sel];setTab("lugar",false);map.setView([p.lat,p.lon],14);return;}
  if(h.startsWith("r-")&&DATA.routes.some(r=>r.id===h.slice(2))){state.route=h.slice(2);setTab("rutas",false);drawRoute(DATA.routes.find(r=>r.id===state.route));return;}
  if(h.startsWith("s-")&&BYID[h.slice(2)]){const id=h.slice(2);track("qr",id);const got=stamp(id,"qr");state.sel=id;const p=BYID[id];setTab("lugar",false);setHash("p-"+id);map.setView([p.lat,p.lon],14);if(got) toast(t("passGot"));return;}
  if(h==="guias"){setTab("agenda",false);return;}
  if(["inicio","explorar","rutas","agenda","pasaporte","gestion"].includes(h)){setTab(h,false);return;}
  setTab("inicio",false);showCover();
}
window.addEventListener("hashchange",fromHash);
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(state.adding){stopAdding();if(state.tab==="gestion")renderAdmin();return;}const bk=$("#back")||$("#rback");if(bk&&!e.target.closest("input,textarea,select"))bk.click();});
applyLocal();
applyLang();
fromHash();
loadRemote().then(ok=>{if(ok){render(state.tab);refreshMarkers();}});
setTimeout(()=>map.invalidateSize(),60);
(function(){const b=$("#tomap"),mw=$("#mapwrap");if(!b||!mw) return;
  b.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
  const upd=()=>{const r=mw.getBoundingClientRect();if(isPhone()&&r.bottom<60) b.removeAttribute("data-off"); else b.setAttribute("data-off","");};
  window.addEventListener("scroll",upd,{passive:true});window.addEventListener("resize",upd);upd();})();
window.addEventListener("resize",()=>map.invalidateSize());
/* ---------- Modo pantalla (tótem / pantalla de la oficina de turismo): ?pantalla ---------- */
(function(){
  let qs;try{qs=new URLSearchParams(location.search);}catch(e){return;}
  if(!qs.has("pantalla")&&!qs.has("totem")) return;
  document.body.classList.add("kiosk");
  const IDLE=+(qs.get("espera")||90)*1000, PUB=(DATA.siteUrl||location.href.split("?")[0]).split("#")[0];
  const K={es:{take:"Llévatela en tu móvil",takeP:"Llévate esta ficha en tu móvil",touch:"Toca la pantalla para empezar",scan:"Escanea con la cámara: gratis, sin instalar nada"},
    en:{take:"Take it on your phone",takeP:"Take this page on your phone",touch:"Touch the screen to start",scan:"Scan with your camera: free, nothing to install"},
    fr:{take:"Emportez-la sur votre mobile",takeP:"Emportez cette fiche sur votre mobile",touch:"Touchez l'écran pour commencer",scan:"Scannez avec l'appareil photo : gratuit, rien à installer"},
    de:{take:"Nehmen Sie sie aufs Handy mit",takeP:"Diese Seite aufs Handy mitnehmen",touch:"Berühren Sie den Bildschirm",scan:"Mit der Kamera scannen: kostenlos, ohne Installation"},
    pt:{take:"Leve-a no seu telemóvel",takeP:"Leve esta ficha no seu telemóvel",touch:"Toque no ecrã para começar",scan:"Leia com a câmara: grátis, sem instalar nada"}};
  const k=n=>(K[lang]||K.es)[n];
  /* QR flotante: lleva al móvil lo que se está viendo */
  const fq=document.createElement("button");fq.type="button";fq.id="kq";fq.setAttribute("aria-label","QR");
  ($("#mapwrap")||document.body).appendChild(fq);
  let lastQ="";
  function updQ(){const id=state.tab==="lugar"&&state.sel?state.sel:null,rt=state.tab==="rutas"&&state.route?state.route:null;
    const url=PUB+(id?"#p-"+id:rt?"#r-"+rt:"");const lab=id?k("takeP"):k("take");const key=url+"|"+lab;if(key===lastQ) return;lastQ=key;
    fq.innerHTML=`<span class="kqr"></span><span class="kql">${esc(lab)}</span>`;qrInto(fq.querySelector(".kqr"),url);}
  setInterval(updQ,700);updQ();
  setInterval(()=>{const s=document.getElementById("kss");if(new Date().getHours()===4&&performance.now()>36e5&&s&&!s.hidden) location.reload();},6e5);
  /* Salvapantallas: fotos de los imprescindibles, QR grande y vuelta al inicio */
  const ss=document.createElement("div");ss.id="kss";ss.hidden=true;document.body.appendChild(ss);
  const ids=(MUST.length?MUST:POIS.map(p=>p.id)).filter(id=>BYID[id]&&PH[id]);
  let i=0,li=0,timer=null,rot=null;
  function slide(){const id=ids[i%ids.length],p=BYID[id];i++;
    const L=LANGS[li%LANGS.length][0];li++;const KK=K[L];
    ss.innerHTML=`${phHTML(id,p.cat,1600,"kbg")}<div class="kshade"></div>
      <div class="ktxt"><div class="kbrand">Ribera Alta del Ebro Explora</div><h2>${esc((p.name&&p.name[L])||L10(p.name))}</h2><p>${esc(p.town)}</p>
      <div class="ktouch">${esc(KK.touch)}</div></div>
      <div class="kqbig"><span class="kqr2"></span><b>${esc(KK.take)}</b><small>${esc(KK.scan)}</small></div>`;
    qrInto(ss.querySelector(".kqr2"),PUB);}
  function sleep(){if(!ss.hidden) return;stopAudio();closeLightbox();state.sel=null;if(state.route){state.route=null;drawRoute(null);}
    if(lang!=="es"){lang="es";store.set("rbx-lang","es");applyLang();}
    try{sessionStorage.setItem(SP+"rbx-cover","1");}catch(e){}const c=$("#cover");c.hidden=true;c.innerHTML="";
    setTab("inicio");window.scrollTo(0,0);i=Math.floor(Math.random()*ids.length);li=0;slide();ss.hidden=false;rot=setInterval(slide,9000);}
  function wake(e){if(!ss.hidden){if(e){e.preventDefault();e.stopPropagation();}ss.hidden=true;clearInterval(rot);ss.innerHTML="";setTimeout(()=>map.invalidateSize(),30);}
    clearTimeout(timer);timer=setTimeout(sleep,IDLE);}
  ss.addEventListener("pointerdown",wake,true);
  ["pointerdown","keydown","wheel","touchstart"].forEach(ev=>document.addEventListener(ev,()=>wake(),{passive:true,capture:true}));
  AUD.addEventListener("playing",()=>wake());AUD.addEventListener("timeupdate",()=>{if(!AUD.paused){clearTimeout(timer);timer=setTimeout(sleep,IDLE);}});
  window.addEventListener("hashchange",()=>{if(location.hash==="#gestion") setTab("inicio");});if(location.hash==="#gestion") setTab("inicio");
  wake();if(qs.has("dormir")) setTimeout(sleep,300);
})();

})();
</script>
