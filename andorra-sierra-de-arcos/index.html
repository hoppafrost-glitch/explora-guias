s e eventos na agenda. Adicione os eventos com a data exata deste ano.","agAdmList":"Ver a lista","evName":"Nome do evento","evAdd":"Adicionar à agenda","passAdmIntro":"Se a comarca oferecer um prémio a quem completar o passaporte (por exemplo, uma lembrança no posto de turismo), escreva-o aqui e aparecerá no passaporte.","passPrizePh":"Ex.: Mostre o diploma no posto de turismo e leve uma lembrança.","passDemoToggle":"Modo de demonstração: carimbar sem estar no lugar (só neste computador)","pubTitle":"Publicar","pubIntro":"As alterações ficam primeiro guardadas neste computador. Ao publicar com a palavra-passe, sobem para o site num ou dois minutos.","pubToken":"Chave de publicação","pubRemember":"Lembrar a chave neste computador","pubBtn":"Publicar alterações","pubDownload":"Descarregar contenido.json","pubNeedToken":"Falta a chave de publicação.","pubWorking":"A publicar…","pubOk":"Publicado. Os visitantes vão vê-lo num ou dois minutos.","pubErr":"Não foi possível publicar","popupBlocked":"O navegador bloqueou a janela. Permita as janelas pop-up.","qrPlates":"Placas QR para imprimir (PDF)","pubPass":"Palavra-passe de publicação","pubPass2":"Repita a palavra-passe","pubSetup":"Configurar a publicação (só da primeira vez)","pubSetupText":"Cole uma chave do GitHub com permissão de escrita só neste repositório e escolha uma palavra-passe com pelo menos 10 caracteres. A chave fica guardada cifrada com ela: depois basta a palavra-passe para publicar.","pubSetupBtn":"Guardar configuração","pubSetupOk":"Publicação configurada. A partir de agora basta a palavra-passe.","pubBadPass":"Palavra-passe incorreta.","pubBadToken":"O GitHub recusou a chave: pode ter expirado ou não ter permissão. Configure de novo a publicação.","pubPassShort":"A palavra-passe precisa de pelo menos 10 caracteres.","pubPassMismatch":"As palavras-passe não coincidem.","pubNoCfg":"A publicação ainda não está configurada. Abra «Configurar a publicação» abaixo."}};
</script>
<script>
(function(){
"use strict";
if(!window.L){var mw=document.getElementById("mapwrap");if(mw) mw.innerHTML='<div class="maperr">No se ha podido cargar el mapa. Comprueba la conexión y recarga la página.</div>';return;}
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LANGS=[["es","ES","es-ES"],["en","EN","en-GB"],["fr","FR","fr-FR"],["de","DE","de-DE"],["pt","PT","pt-PT"]];
const SP=(DATA&&DATA.storePrefix)||"";
const store={get(k){try{return localStorage.getItem(SP+k)}catch(e){return null}},set(k,v){try{localStorage.setItem(SP+k,v)}catch(e){}}};
let lang=store.get("rbx-lang")||((navigator.language||"es").slice(0,2));
if(!LANGS.some(l=>l[0]===lang)) lang="es";
const t=(k,vars)=>{let s=(I18N[lang]&&I18N[lang][k])??I18N.es[k]??k; if(vars) for(const v in vars) s=s.replace("{"+v+"}",vars[v]); return s;};
const L10=(o)=>o?(typeof o==="string"?o:(o[lang]||o.es||"")):"";
const nf=()=>new Intl.NumberFormat(lang==="en"?"en-GB":lang,{maximumFractionDigits:1});

const CATS=DATA.categories; // {id:{color:"--c-pat", icon:"svgpath"}}
const ICON=id=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${CATS[id].icon}</svg>`;
const POIS=DATA.pois, BYID=Object.fromEntries(POIS.map(p=>[p.id,p]));
const TOWNS=DATA.towns;
const PH=DATA.photos||{};
const imgURL=(f,w)=>"https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(f)+"?width="+w;
const IMG_BASE=DATA.imgBase||"img/";
const localImg=(key,w)=>IMG_BASE+key+(w<=330?"-s":"")+".jpg";
const GAL=DATA.gallery||{};
const galleryOf=id=>[id].concat(GAL[id]||[]).filter(k=>PH[k]);
const creditHTML=ph=>`${esc(t(ph.context?"photoContext":"photo"))}: <a href="${esc(ph.page)}" target="_blank" rel="noopener">${esc(ph.author)}</a> · ${esc(ph.license)} · Wikimedia Commons`;
const clauses=txt=>txt.split(/(?<=,)\s+/).map(x=>`<span class="nb">${esc(x)}</span>`).join(" ");
function phHTML(key,cat,w,cls,credit){const ph=PH[key];const c=CATS[cat]?CATS[cat].color:"--accent";
  return `<div class="ph ${cls||""}" style="--c:var(${c})">${CATS[cat]?ICON(cat):""}${ph?`<img src="${localImg(key,w)}" data-fb="${esc(imgURL(ph.file,w))}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">`:""}${credit&&ph?`<span class="credit">${creditHTML(ph)}</span>`:""}</div>`;}
document.addEventListener("error",e=>{const el=e.target;if(!el||el.tagName!=="IMG") return;
  if(el.dataset.fb&&!el.dataset.tried){el.dataset.tried="1";el.src=el.dataset.fb;return;}
  if(el.closest(".ph,.gal,.lb")) el.classList.add("broken");},true);
const state={cats:new Set(Object.keys(CATS)),town:"",q:"",sel:null,route:null,tab:"explorar",intro:store.get("rbx-intro")!=="0",basemap:"ilustrado",me:null,ed:{id:null,lang:"es",draft:null},adding:false};
/* ---------- local edits (demo of the content editor) ---------- */
const EDIT_KEY="rbx-edits-v1";
let EDITS={};try{EDITS=JSON.parse(store.get(EDIT_KEY)||"{}")||{};}catch(e){EDITS={};}
EDITS.byId=EDITS.byId||{};EDITS.added=Array.isArray(EDITS.added)?EDITS.added:[];
function saveEdits(){store.set(EDIT_KEY,JSON.stringify(EDITS));}

/* ---------- distance ---------- */
function hav(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lon-a.lon);const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}

/* ---------- toast ---------- */
let toastT;function toast(msg){let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);}el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},2600);}

/* ---------- map ---------- */
const map=L.map("map",{zoomControl:true,attributionControl:true,minZoom:9,maxZoom:18,zoomSnap:.25,
  maxBounds:DATA.maxBounds||[[40.85,-1.2],[41.95,0.45]],maxBoundsViscosity:.8,preferCanvas:false});
map.attributionControl.setPrefix(false);
const baseAttr=DATA.baseAttr||'Límites municipales: IGN-CNIG';
map.attributionControl.addAttribution(baseAttr);
const panes={};["base","river","routes","labels"].forEach((n,i)=>{panes[n]=map.createPane(n);panes[n].style.zIndex=350+i*10;});
panes.stops=map.createPane("stops");panes.stops.style.zIndex=650;panes.stops.style.pointerEvents="none";
panes.labels.style.pointerEvents="none";
const muniLayers={};
const HASBASE=!!(BASE&&BASE.features&&BASE.features.length);
const baseLayer=L.geoJSON(HASBASE?BASE:{type:"FeatureCollection",features:[]},{pane:"base",interactive:false,filter:f=>!f.properties.river,
  style:f=>f.properties.outline?{className:"comarca-outline",fill:false}:{className:"muni"+(f.properties.c?"":" out")},
  onEachFeature:(f,l)=>{if(f.properties.c) muniLayers[f.properties.n]=l;}}).addTo(map);
const riverFeat=HASBASE?BASE.features.find(f=>f.properties.river):null;
if(riverFeat){
  const ll=riverFeat.geometry.coordinates.map(c=>[c[1],c[0]]);
  L.polyline(ll,{pane:"river",className:"river-halo",interactive:false,smoothFactor:1}).addTo(map);
  L.polyline(ll,{pane:"river",className:"river",interactive:false,smoothFactor:1}).addTo(map);
}
// town & context labels
TOWNS.forEach(tw=>L.marker([tw.lat,tw.lon],{pane:"labels",interactive:false,keyboard:false,icon:L.divIcon({className:"",html:`<span class="town-label${tw.minor?" minor":""}">${esc(tw.name)}</span>`,iconSize:null})}).addTo(map));
(DATA.context||[]).forEach(tw=>L.marker([tw.lat,tw.lon],{pane:"labels",interactive:false,keyboard:false,icon:L.divIcon({className:"",html:`<span class="town-label out">${esc(tw.name)}</span>`,iconSize:null})}).addTo(map));
if(DATA.riverLabel) L.marker(DATA.riverLabel,{pane:"labels",interactive:false,keyboard:false,icon:L.divIcon({className:"",html:`<span class="river-label">${esc(DATA.riverName||"EBRO")}</span>`,iconSize:null})}).addTo(map);

const homeBounds=(()=>{if(DATA.fitPois) return L.latLngBounds(POIS.map(p=>[p.lat,p.lon]).concat(TOWNS.filter(t=>!t.minor).map(t=>[t.lat,t.lon]))).pad(0.08);
  if(HASBASE){const o=baseLayer.getLayers().find(l=>l.feature.properties.outline);return (o||baseLayer).getBounds();}
  return L.latLngBounds(POIS.map(p=>[p.lat,p.lon])).pad(0.15);})();
map.fitBounds(homeBounds,{padding:[16,16]});
map.setMaxZoom(15);

// basemaps (only used where the hosting allows external map tiles)
const TILES={
  mapa:{url:"https://www.ign.es/wmts/ign-base?layer=IGNBaseTodo&style=default&tilematrixset=GoogleMapsCompatible&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/png&TileMatrix={z}&TileCol={x}&TileRow={y}",opt:{maxZoom:18,attribution:'Mapa base © <a href="https://www.ign.es">IGN</a>'}},
  ortofoto:{url:"https://www.ign.es/wmts/pnoa-ma?layer=OI.OrthoimageCoverage&style=default&tilematrixset=GoogleMapsCompatible&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/jpeg&TileMatrix={z}&TileCol={x}&TileRow={y}",opt:{maxZoom:19,attribution:'PNOA © <a href="https://www.ign.es">IGN</a>'}}
};
let tileLayer=null;
function setBasemap(k,silent){
  state.basemap=k; $$(".layerbox button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.k===k)));
  if(tileLayer){map.removeLayer(tileLayer);tileLayer=null;}
  $("#map").classList.remove("tiles-on");
  if(k==="ilustrado"){map.setMaxZoom(15);return;}
  map.setMaxZoom(18);
  const def=TILES[k]; let ok=0,bad=0,decided=false;
  tileLayer=L.tileLayer(def.url,def.opt);
  tileLayer.on("tileload",()=>{ok++; if(!decided){decided=true;$("#map").classList.add("tiles-on");}});
  tileLayer.on("tileerror",()=>{bad++; if(!decided&&bad>=3&&HASBASE){decided=true;map.removeLayer(tileLayer);tileLayer=null;state.basemap="ilustrado";map.setMaxZoom(15);$("#map").classList.remove("tiles-on");$$(".layerbox button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.k==="ilustrado")));if(!silent) toast(t("tilesBlocked"));}});
  tileLayer.addTo(map); tileLayer.bringToBack();
}
const isPhone=()=>!!(window.matchMedia&&window.matchMedia("(max-width:760px)").matches);
const PHONE=window.matchMedia&&window.matchMedia("(max-width:760px)").matches;
const LayerCtl=L.Control.extend({options:{position:PHONE?"bottomleft":"topright"},onAdd(){const d=L.DomUtil.create("div","layerbox");L.DomEvent.disableClickPropagation(d);
  d.innerHTML=["mapa","ortofoto"].concat(HASBASE?["ilustrado"]:[]).map(k=>`<button type="button" data-k="${k}" aria-pressed="${k===state.basemap}"></button>`).join("");
  d.addEventListener("click",e=>{const b=e.target.closest("button");if(b) setBasemap(b.dataset.k);});return d;}});
map.addControl(new LayerCtl());
const LegendCtl=L.Control.extend({options:{position:"bottomright"},onAdd(){const d=L.DomUtil.create("div","legend");d.id="legend";return d;}});
map.addControl(new LegendCtl());

/* markers */
const markers={};
function pinIcon(p){return L.divIcon({className:"",html:`<div class="pin" style="--c:var(${CATS[p.cat].color})">${ICON(p.cat)}</div>`,iconSize:[30,30],iconAnchor:[4,30],popupAnchor:[11,-30]});}
function addMarker(p){
  const m=L.marker([p.lat,p.lon],{keyboard:true,title:L10(p.name),riseOnHover:true,icon:pinIcon(p)});
  m.on("click",()=>{if(state.adding){map.fire("click",{latlng:m.getLatLng()});return;} openPlace(p.id,{fly:false});});
  m.addTo(map); markers[p.id]=m;
}
POIS.forEach(addMarker);
function pinEl(id){const m=markers[id];return m&&m.getElement()?m.getElement().querySelector(".pin"):null;}
function visible(p){
  if(!state.cats.has(p.cat)) return false;
  if(state.town&&p.town!==state.town) return false;
  if(state.q){const q=norm(state.q);const hay=norm(L10(p.name)+" "+p.town+" "+L10(p.desc)+" "+t("cat_"+p.cat));if(!hay.includes(q)) return false;}
  return true;
}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}
function refreshMarkers(){
  const inRoute=state.route?new Set(DATA.routes.find(r=>r.id===state.route).stops):null;
  POIS.forEach(p=>{const m=markers[p.id];const show=inRoute?inRoute.has(p.id):visible(p);
    if(show&&!map.hasLayer(m)) m.addTo(map); if(!show&&map.hasLayer(m)) map.removeLayer(m);
    const el=pinEl(p.id); if(el) el.classList.toggle("sel",state.sel===p.id);});
  Object.entries(muniLayers).forEach(([n,l])=>{const el=l.getElement&&l.getElement();if(el) el.classList.toggle("hl",state.town===n);});
}

/* ---------- route drawing ---------- */
let routeGroup=L.layerGroup().addTo(map);
function drawRoute(r){
  routeGroup.clearLayers(); if(!r) return;
  const pts=r.stops.map(id=>BYID[id]).map(p=>[p.lat,p.lon]);
  const color=`var(${CATS[r.cat].color})`;
  const line=L.polyline(pts,{pane:"routes",className:"route-line",interactive:false});
  routeGroup.addLayer(line);
  setTimeout(()=>{const el=line.getElement();if(el) el.style.setProperty("--c",color);},0);
  r.stops.forEach((id,i)=>{const p=BYID[id];routeGroup.addLayer(L.marker([p.lat,p.lon],{pane:"stops",interactive:false,keyboard:false,icon:L.divIcon({className:"",html:`<div class="stopnum">${i+1}</div>`,iconSize:[0,0]})}));});
  map.flyToBounds(L.latLngBounds(pts),{padding:[50,50],duration:.8,maxZoom:15});
}
function routeStats(r){let km=0;const legs=[];for(let i=1;i<r.stops.length;i++){const d=hav(BYID[r.stops[i-1]],BYID[r.stops[i]])*1.25;legs.push(d);km+=d;}
  const speed={walk:4,bike:14,car:55}[r.mode];const mins=Math.round(km/speed*60+r.stops.length*(r.mode==="car"?35:20));return {km,legs,mins};}
function gmapsRoute(r){const pts=r.stops.map(id=>BYID[id]).map(p=>p.lat+","+p.lon);const mode={walk:"walking",bike:"bicycling",car:"driving"}[r.mode];
  return "https://www.google.com/maps/dir/?api=1&origin="+pts[0]+"&destination="+pts.at(-1)+(pts.length>2?"&waypoints="+encodeURIComponent(pts.slice(1,-1).join("|")):"")+"&travelmode="+mode;}
function fmtDur(m){const h=Math.floor(m/60),mm=m%60;return h?`${h} h${mm?" "+mm+" min":""}`:`${mm} min`;}

/* ---------- views ---------- */
function setTab(tab,push=true){closeLightbox();
  state.tab=tab;
  $$("#tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab||(tab==="lugar"&&b.dataset.tab==="explorar"))));
  if(tab==="inicio"&&!state.route) map.flyToBounds(homeBounds,{padding:[16,16],duration:.6});
  $$(".view").forEach(v=>v.hidden=v.id!=="v-"+tab);
  if(tab!=="rutas"&&tab!=="lugar"&&state.route){state.route=null;drawRoute(null);}
  render(tab);
  if(push) setHash(tab==="lugar"?"p-"+state.sel:tab);
  if(isPhone()){const y=$("#panel").getBoundingClientRect().top+window.scrollY;
    if(tab==="lugar"||window.scrollY>y) window.scrollTo({top:y,behavior:tab==="lugar"?"smooth":"auto"});}
  else $("#v-"+tab).scrollTop=0;
}
function setHash(h){try{if(location.hash!=="#"+h) history.replaceState(null,"","#"+h);}catch(e){}}
function render(tab){({inicio:renderHome,explorar:renderExplore,lugar:renderPlace,rutas:renderRoutes,agenda:renderAgenda,pasaporte:renderPass,gestion:renderAdmin}[tab]||(()=>{}))();refreshMarkers();}

const MUST=DATA.must||[];
function renderHome(){
  const v=$("#v-inicio");
  v.innerHTML=`<div class="home-hero">${phHTML(DATA.homeHero||"rueda","patrimonio",960)}<div class="shade"></div>
     <div class="txt"><span class="eyebrow" style="color:rgba(255,255,255,.8)">${esc(t("coverKicker"))}</span><h2>${clauses(t("coverTitle"))}</h2><p>${esc(t("coverText"))}</p></div></div>
   ${avisosHTML()}
   <div class="stats" style="margin-top:0"><span><b>${TOWNS.length}</b>${esc(t("statTowns"))}</span><span><b>${POIS.length}</b>${esc(t("statPlaces"))}</span><span><b>${DATA.routes.length}</b>${esc(t("statRoutes"))}</span><span><b>${LANGS.length}</b>${esc(t("statLangs"))}</span></div>
   <div class="quick"><button type="button" class="btn primary" id="h-explore">${svgI("map")}<span>${esc(t("explorePlaces",{n:POIS.length}))}</span></button>
     <button type="button" class="btn" id="h-near">${svgI("locate")}<span>${esc(t("nearMe"))}</span></button></div>
   <div class="stack" style="gap:8px"><div class="sec-h"><h3>${esc(t("homeMust"))}</h3><button type="button" class="linkbtn" id="h-all">${esc(t("seeAll"))} ›</button></div>
     <div class="hscroll" id="h-must">${MUST.filter(id=>BYID[id]).map(id=>{const p=BYID[id];return `<button type="button" class="card" data-id="${p.id}">${phHTML(p.id,p.cat,500)}<b>${esc(L10(p.name))}</b><span>${esc(p.town)}</span></button>`;}).join("")}</div></div>
   <div class="stack" style="gap:8px"><div class="sec-h"><h3>${esc(t("homeRoutes"))}</h3><button type="button" class="linkbtn" id="h-routes">${esc(t("seeAll"))} ›</button></div>

function bindPlayer(p){

function toggleAudio(p){
  if(ttsOn){stopAudio();return;}

/* Respaldo: voz del dispositivo, solo si existe en el idioma elegido (nunca leer francés con voz española). */
function bestVoice(code){const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];const base=code.slice(0,2);
  const c=vs.filter(v=>(v.lang||"").replace("_","-").toLowerCase().startsWith(base));if(!c.length) return null;
  const score=v=>{const n=v.name||"";let s=0;if(/natural|neural/i.test(n)) s+=50;if(/online/i.test(n)) s+=20;if(/premium|enhanced|mejorada|siri/i.test(n)) s+=30;if(/google/i.test(n)) s+=15;
    if((v.lang||"").replace("_","-").toLowerCase()===code.toLowerCase()) s+=10;if(/compact|espeak/i.test(n)) s-=30;return s;};
  return c.sort((a,b)=>score(b)-score(a))[0];}
function speakTTS(p){
  if(!("speechSynthesis" in window)){toast(t("noAudio"));setPP(false);return;}
  const go=()=>{const code=LANGS.find(l=>l[0]===lang)[2];const v=bestVoice(code);
    if(!v){toast(t("noVoice"));setPP(false);return;}
    const txt=[L10(p.name),L10(p.desc),L10(p.more)].filter(Boolean).join(". ");
    const parts=txt.match(/[^.!?;]+[.!?;]*/g)||[txt];speechSynthesis.cancel();ttsOn=true;setPP(true);
    parts.forEach((s,i)=>{const u=new SpeechSynthesisUtterance(s.trim());u.voice=v;u.lang=v.lang;u.rate=.95*audRate;
      if(i===parts.length-1) u.onend=()=>{ttsOn=false;setPP(false);};u.onerror=()=>{ttsOn=false;setPP(false);};speechSynthesis.speak(u);});};
  if(speechSynthesis.getVoices().length) go(); else {let done=false;const f=()=>{if(done) return;done=true;go();};speechSynthesis.addEventListener("voiceschanged",f,{once:true});setTimeout(f,900);}
}

function copyText(s){const done=()=>toast(t("copied"));try{navigator.clipboard.writeText(s).then(done,()=>fallbackCopy(s,done));}catch(e){fallbackCopy(s,done);}}
function fallbackCopy(s,done){const ta=document.createElement("textarea");ta.value=s;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy");}catch(e){}document.body.removeChild(ta);if(ok) done(); else toast(s);}
function svgI(n){const P={audio:'<path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="1.5"/>',nav:'<path d="M3 11 21 3l-8 18-2-8-8-2z"/>',link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',map:'<path d="m9 4-6 3v13l6-3 6 3 6-3V4l-6 3-6-3z"/><path d="M9 4v13M15 7v13"/>',locate:'<circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/><circle cx="12" cy="12" r="7.5"/>',plus:'<path d="M12 5v14M5 12h14"/>',undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',check:'<path d="m5 12 5 5 9-10"/>',download:'<path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/>',book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5"/>',play:'<path d="M8 5.5v13l11-6.5z" fill="currentColor"/>',pause:'<rect x="6.5" y="5.5" width="3.5" height="13" rx="1" fill="currentColor"/><rect x="14" y="5.5" width="3.5" height="13" rx="1" fill="currentColor"/>',stamp:'<circle cx="12" cy="12" r="8.5"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',cal:'<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',photos:'<rect x="3" y="5" width="14" height="12" rx="2"/><path d="M7 21h12a2 2 0 0 0 2-2V9"/><circle cx="8" cy="9.5" r="1.5"/><path d="m3 15 4-3 4 3 3-2 3 2"/>'};
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;}

function renderRoutes(){
  const v=$("#v-rutas");
  const r=state.route?DATA.routes.find(x=>x.id===state.route):null;
  if(!r){
    v.innerHTML=`<div class="stack" style="gap:4px"><div class="eyebrow">${esc(t("tabRoutes"))}</div><h2>${esc(t("routesTitle"))}</h2><p class="lede">${esc(t("routesIntro"))}</p></div>
     ${DATA.routes.map(r=>{const s=routeStats(r);return `<button type="button" class="route-card" data-r="${r.id}" style="--c:var(${CATS[r.cat].color})">
       ${phHTML(r.cover||r.stops[0],r.cat,960,"cover-ph")}
       <span class="pill"><span class="dot"></span>${esc(t("cat_"+r.cat))}</span><h3>${esc(L10(r.name))}</h3><p class="small">${esc(L10(r.summary))}</p>
       <span class="kv"><span><b>${r.stops.length}</b> ${esc(t("stopsWord"))}</span><span><b>${nf().format(s.km)}</b> km</span><span>${esc(t("mode_"+r.mode))} · <b>${fmtDur(s.mins)}</b></span></span></button>`;}).join("")}
     <p class="note">${esc(t("routesNote"))}</p>`;
    v.onclick=e=>{const b=e.target.closest("[data-r]");if(b){state.route=b.dataset.r;setHash("r-"+state.route);renderRoutes();drawRoute(DATA.routes.find(x=>x.id===state.route));refreshMarkers();}};
    return;
  }
  const s=routeStats(r);
  v.innerHTML=`<button type="button" class="back" id="rback">‹ ${esc(t("allRoutes"))}</button>
   <div class="detail-h" style="--c:var(${CATS[r.cat].color})"><span class="pill"><span class="dot"></span>${esc(t("cat_"+r.cat))}</span><h2>${esc(L10(r.name))}</h2>
   <div class="meta" style="font-variant-numeric:tabular-nums">${r.stops.length} ${esc(t("stopsWord"))} · ${nf().format(s.km)} km · ${esc(t("mode_"+r.mode))} · ${fmtDur(s.mins)}</div></div>
   <p class="desc">${esc(L10(r.summary))}</p>
   <div class="actions"><a class="btn primary" href="${gmapsRoute(r)}" target="_blank" rel="noopener">${svgI("nav")}<span>${esc(t("openGmaps"))}</span></a><button type="button" class="btn" id="rcopy">${svgI("link")}<span>${esc(t("copyRoute"))}</span></button></div>
   <ol class="stops" style="--c:var(${CATS[r.cat].color})">${r.stops.map((id,i)=>`<li><span><button type="button" data-id="${id}">${esc(L10(BYID[id].name))}</button><span class="leg">${esc(BYID[id].town)}${i?` · ${nf().format(s.legs[i-1])} km ${esc(t("fromPrev"))}`:""}</span></span></li>`).join("")}</ol>
   <p class="note">${esc(t("routesNote"))}</p>`;
  $("#rcopy").onclick=e=>{e.stopPropagation();copyText(location.href.split("#")[0]+"#r-"+r.id);};
  $("#rback").onclick=()=>{state.route=null;drawRoute(null);setHash("rutas");renderRoutes();refreshMarkers();map.flyToBounds(homeBounds,{padding:[16,16],duration:.7});};
  v.onclick=e=>{const b=e.target.closest("[data-id]");if(b){state.sel=b.dataset.id;const p=BYID[state.sel];setTab("lugar");map.flyTo([p.lat,p.lon],14,{duration:.7});}};
}

function renderAgenda(){
  const v=$("#v-agenda");const towns=[...new Set(TOWNS.map(x=>x.name))].sort((a,b)=>a.localeCompare(b,"es"));
  const f=state.agTown||"";const ev=EVENTS.filter(e=>!f||e.mun===f).filter(e=>!(e.date&&e.date<today())).sort((a,b)=>evOrder(a)-evOrder(b));
  const neg=NEGOCIOS.filter(n=>!f||n.mun===f);
  const types=[...new Set(neg.map(n=>n.type))];
  v.innerHTML=`<div class="stack" style="gap:4px"><div class="eyebrow">${esc(t("tabAgenda"))}</div><h2>${esc(t("agTitle"))}</h2><p class="lede">${esc(t("agIntro"))}</p></div>
   ${avisosHTML()}
   <div class="field"><label for="ag-town">${esc(t("fTown"))}</label><select id="ag-town"><option value="">${esc(t("allTowns"))}</option>${towns.map(x=>`<option ${x===f?"selected":""}>${esc(x)}</option>`).join("")}</select></div>
   <div class="stack" style="gap:8px"><h3>${esc(t("agEvents"))}</h3>
   ${ev.length?ev.map(e=>`<article class="ev">${e.date?`<div class="cal" aria-hidden="true"><span>${esc(new Date(e.date+"T12:00:00").toLocaleDateString(LANGS.find(l=>l[0]===lang)[2],{month:"short"}).replace(".",""))}</span><b>${+e.date.slice(8,10)}</b></div>`:`<div class="cal m" aria-hidden="true"><b>${esc(MONTHS(e.month).slice(0,3).replace(".",""))}</b></div>`}
     <div class="stack" style="gap:3px;min-width:0"><b>${esc(L10(e.name))}</b><span class="small"><b style="color:var(--ink)">${esc(e.mun)}</b> · ${esc(L10(e.when))}</span>${L10(e.desc)?`<p>${esc(L10(e.desc))}</p>`:""}${e.src?`<a class="small" href="${esc(e.src)}" target="_blank" rel="noopener">${esc(t("source"))}</a>`:""}</div></article>`).join(""):`<p class="small">${esc(t("agNone"))}</p>`}
   <p class="note">${esc(t("agNote"))}</p></div>
   ${neg.length?`<div class="stack" style="gap:8px"><h3>${esc(t("agStay"))}</h3>
    ${types.map(ty=>`<div class="group-h">${esc(t("neg_"+ty)||ty)}<span>${neg.filter(n=>n.type===ty).length}</span></div>${neg.filter(n=>n.type===ty).map(n=>`<div class="neg"><div class="stack" style="gap:2px;min-width:0"><b>${esc(n.name)}</b><span class="small">${esc(n.mun)}${n.addr?" · "+esc(n.addr):""}${n.cat?" · "+esc(n.cat):""}</span></div>${n.lat?`<a class="btn sm" href="https://www.google.com/maps/dir/?api=1&destination=${n.lat},${n.lon}" target="_blank" rel="noopener" aria-label="${esc(t("directions"))}: ${esc(n.name)}">${svgI("nav")}</a>`:""}</div>`).join("")}`).join("")}
    <p class="note">${esc(t("agStayNote"))}</p></div>`:""}
   <div class="card stack" style="gap:6px"><h3>${esc(t("agBiz"))}</h3><p class="small">${esc(t("agBizText"))}</p>
    ${DATA.contact?`<div class="actions">${DATA.contact.tel?`<a class="btn" href="tel:${esc(DATA.contact.tel.replace(/\s/g,""))}">${esc(DATA.contact.tel)}</a>`:""}${DATA.contact.web?`<a class="btn" href="${esc(DATA.contact.web)}" target="_blank" rel="noopener">${esc(t("agWeb"))}</a>`:""}</div>`:""}</div>`;
  $("#ag-town").onchange=e=>{state.agTown=e.target.value;renderAgenda();};
}

function nextEventText(){const e=EVENTS.filter(e=>!(e.date&&e.date<today())).sort((a,b)=>evOrder(a)-evOrder(b))[0];return e?t("agNext",{x:L10(e.name)+" · "+e.mun}):t("agCtaText");}
/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang=lang;
  $$("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));
  $("#langs").innerHTML=LANGS.map(([k,lab])=>`<button type="button" data-l="${k}" aria-pressed="${k===lang}" lang="${k}">${lab}</button>`).join("");
  $$(".layerbox button").forEach(b=>b.textContent=t("base_"+b.dataset.k));
  $("#legend").innerHTML=Object.keys(CATS).map(c=>`<div style="--c:var(${CATS[c].color})"><i></i>${esc(t("cat_"+c))}</div>`).join("");
  POIS.forEach(p=>{const el=markers[p.id].getElement();if(el) el.setAttribute("title",L10(p.name));});
  stopAudio();
  render(state.tab);
}
$("#langs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.l;store.set("rbx-lang",lang);applyLang();});
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.tab==="explorar") state.sel=null;setTab(b.dataset.tab);});
setBasemap("mapa",true);
function zoomClasses(){const z=map.getZoom(),el=$("#map");el.classList.toggle("zlow",z<11.4);el.classList.toggle("zfar",z<12);}
map.on("zoomend",zoomClasses);zoomClasses();

/* ---------- cover ---------- */
function showCover(){
  let seen=false;try{seen=sessionStorage.getItem(SP+"rbx-cover")==="1";}catch(e){}
  if(seen) return;
  const c=$("#cover");const key=DATA.coverPhoto||"rueda";const ph=PH[key];
  const draw=()=>{c.innerHTML=`${phHTML(key,"patrimonio",1280)}<div class="shade"></div>
    <div class="brandc"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="rgba(255,255,255,.16)"/><path d="M4 22c5-1 6-7 11-7s5 9 10 9 4-6 5-7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="23" cy="10" r="2.6" fill="#fff"/></svg><span>Andorra-Sierra de Arcos Explora</span></div>
    <div class="clangs">${LANGS.map(([k,lab])=>`<button type="button" data-l="${k}" aria-pressed="${k===lang}">${lab}</button>`).join("")}</div>
    <div class="in"><div class="kick">${esc(t("coverKicker"))}</div><h1>${clauses(t("coverTitle"))}</h1><p>${esc(t("coverText"))}</p>
    <div class="row2"><button type="button" class="cbtn main" id="c-go">${esc(t("coverCta"))}</button><button type="button" class="cbtn" id="c-routes">${esc(t("coverRoutes"))}</button></div></div>
    ${ph?`<div class="credit">${esc(t("photo"))}: <a href="${esc(ph.page)}" target="_blank" rel="noopener">${esc(ph.author)}</a> · ${esc(ph.license)}</div>`:""}`;
    $("#c-go").onclick=()=>hideCover("inicio");$("#c-routes").onclick=()=>hideCover("rutas");
    $(".clangs",c).onclick=e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.l;store.set("rbx-lang",lang);applyLang();draw();};};
  draw();c.hidden=false;
  setTimeout(()=>{const g=$("#c-go");if(g) g.focus();},50);
}
function hideCover(tab){const c=$("#cover");c.hidden=true;c.innerHTML="";try{sessionStorage.setItem(SP+"rbx-cover","1");}catch(e){}
  if(tab&&tab!==state.tab) setTab(tab);setTimeout(()=>map.invalidateSize(),30);}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#cover").hidden) hideCover();});

/* ---------- hash routing ---------- */
function fromHash(){
  const h=(location.hash||"").slice(1);
  if(h&&!$("#cover").hidden){const c=$("#cover");c.hidden=true;c.innerHTML="";setTimeout(()=>map.invalidateSize(),30);}
  if(h.startsWith("p-")&&BYID[h.slice(2)]){state.sel=h.slice(2);track("ficha",state.sel);const p=BYID[state.sel];setTab("lugar",false);map.setView([p.lat,p.lon],14);return;}
  if(h.startsWith("r-")&&DATA.routes.some(r=>r.id===h.slice(2))){state.route=h.slice(2);setTab("rutas",false);drawRoute(DATA.routes.find(r=>r.id===state.route));return;}
  if(h.startsWith("s-")&&BYID[h.slice(2)]){const id=h.slice(2);track("qr",id);const got=stamp(id,"qr");state.sel=id;const p=BYID[id];setTab("lugar",false);setHash("p-"+id);map.setView([p.lat,p.lon],14);if(got) toast(t("passGot"));return;}
  if(h==="guias"){setTab("agenda",false);return;}
  if(["inicio","explorar","rutas","agenda","pasaporte","gestion"].includes(h)){setTab(h,false);return;}
  setTab("inicio",false);showCover();
}
window.addEventListener("hashchange",fromHash);
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(state.adding){stopAdding();if(state.tab==="gestion")renderAdmin();return;}const bk=$("#back")||$("#rback");if(bk&&!e.target.closest("input,textarea,select"))bk.click();});
applyLocal();
applyLang();
fromHash();
loadRemote().then(ok=>{if(ok){render(state.tab);refreshMarkers();}});
setTimeout(()=>map.invalidateSize(),60);
(function(){const b=$("#tomap"),mw=$("#mapwrap");if(!b||!mw) return;
  b.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
  const upd=()=>{const r=mw.getBoundingClientRect();if(isPhone()&&r.bottom<60) b.removeAttribute("data-off"); else b.setAttribute("data-off","");};
  window.addEventListener("scroll",upd,{passive:true});window.addEventListener("resize",upd);upd();})();
window.addEventListener("resize",()=>map.invalidateSize());
})();
</script>
