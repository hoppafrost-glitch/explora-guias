/* Layout: one-screen app. Map is the stage; a reading panel sits beside it (stacked under it on phones).
   Palette drawn from the Ribera: limestone ground, Ebro teal, mudéjar brick, steppe ochre. */
:root{
  --bg:#ECEFEA; --panel:#FAFBF8; --panel-2:#F2F4EF; --ink:#18221E; --muted:#56635D; --faint:#646F6A;
  --line:#D5DBD3; --accent:#17646C; --accent-ink:#FFFFFF; --accent-soft:#D6E8E8;
  --land:#E2E6DB; --land-hi:#D5DCCB; --land-out:#EEF0EA; --edge:#9AA79C; --outline:#17646C;
  --water:#3C8D96; --water-soft:#BFDCDD; --label:#2E3A35;
  --c-pat:#A4502C; --c-gue:#5A6A33; --c-mus:#7A4A7F; --c-hid:#2A6CA1; --c-nat:#3C8550; --c-arq:#97702F; --c-cam:#B98A0E;
  --ok:#2E7D4F; --shadow:0 1px 2px rgba(20,34,30,.08),0 6px 18px rgba(20,34,30,.08);
  --f-display:"Spectral",Georgia,"Times New Roman",serif;
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --panel:#141C19; --panel-2:#19231F; --ink:#E5ECE8; --muted:#9FADA7; --faint:#7E8C86;
  --line:#26332E; --accent:#5DB6BE; --accent-ink:#0B1513; --accent-soft:#183437;
  --land:#1A2420; --land-hi:#21302A; --land-out:#111815; --edge:#3A4A43; --outline:#5DB6BE;
  --water:#3E8F98; --water-soft:#1B3A3D; --label:#C9D4CF;
  --c-pat:#E08A63; --c-gue:#A9B872; --c-mus:#C08BC5; --c-hid:#6FA9DA; --c-nat:#7CC48D; --c-arq:#D6AE68; --c-cam:#E5BD45;
  --ok:#69C08E; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --panel:#141C19; --panel-2:#19231F; --ink:#E5ECE8; --muted:#9FADA7; --faint:#7E8C86;
  --line:#26332E; --accent:#5DB6BE; --accent-ink:#0B1513; --accent-soft:#183437;

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

#app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:1001}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.brand svg{flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:1.28rem;line-height:1.1;letter-spacing:.01em}
.brand-sub{font-size:.74rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel-2)}
.langs button{border:0;background:transparent;padding:5px 10px;font-size:.78rem;font-weight:600;letter-spacing:.05em;cursor:pointer;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.demo-tag{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);border-radius:4px;padding:2px 6px}

main{display:grid;grid-template-columns:minmax(330px,410px) 1fr;min-height:0}
#panel{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
#mapwrap{position:relative;min-height:0;min-width:0}
#map{position:absolute;inset:0;background:var(--bg)}
@media (max-width:760px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(260px,46%) 1fr}
  #mapwrap{order:-1}
  #panel{border-right:0;border-top:1px solid var(--line)}

.note{font-size:.78rem;color:var(--faint);line-height:1.45}

/* Map */
.leaflet-container{font-family:var(--f-ui);background:var(--bg)}
.muni{fill:var(--land);stroke:var(--edge);stroke-width:.8}
.muni.out{fill:var(--land-out);stroke:var(--edge);stroke-opacity:.45;stroke-width:.6}
.muni.hl{fill:var(--land-hi)}
.comarca-outline{fill:none;stroke:var(--outline);stroke-width:2.2;stroke-dasharray:1 0}
.river-halo{stroke:var(--water-soft);stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.river{stroke:var(--water);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tiles-on .muni{fill-opacity:.0;stroke-opacity:.6}
.tiles-on .muni.out{fill-opacity:0}
.tiles-on .river,.tiles-on .river-halo{stroke-opacity:0}
.tiles-on .town-label,.tiles-on .river-label{display:none}
.tiles-on .comarca-outline{stroke-width:2.6;stroke-opacity:.85}
.route-line{stroke:var(--c);stroke-width:3.5;stroke-dasharray:2 7;stroke-linecap:round;fill:none}
.town-label{font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--label);white-space:nowrap;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 6px var(--bg);pointer-events:none;letter-spacing:.02em;transform:translate(-50%,7px);display:inline-block}
.town-label.out{font-weight:500;font-size:11px;color:var(--faint);font-style:italic}
.river-label{font-family:var(--f-display);font-style:italic;font-size:14px;color:var(--water);letter-spacing:.35em;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg);white-space:nowrap;pointer-events:none;transform:translate(-50%,-50%) rotate(-12deg);display:inline-block}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 6px;transform:rotate(-45deg);background:var(--c);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.35);border:2px solid var(--panel);transition:transform .15s}
.pin svg{width:15px;height:15px;transform:rotate(45deg);color:#fff}
.pin.sel{transform:rotate(-45deg) scale(1.28);border-color:var(--ink)}
.pin.dim{opacity:.28}
.zlow .pin{width:13px;height:13px;border-radius:50%;transform:translate(-2.5px,23.5px);border-width:1.5px}
.zlow .pin svg{display:none}
.zlow .pin.sel{transform:translate(-2.5px,23.5px) scale(1.6)}
.zfar .town-label.minor{display:none}
.stopnum{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--panel);font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--panel);transform:translate(14px,-40px);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.zlow .stopnum{transform:translate(4px,-14px)}
.leaflet-control-zoom a,.mapbtn{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:var(--shadow)!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 85%,transparent)!important;color:var(--muted)!important;font-size:10px!important}
.leaflet-control-attribution a{color:var(--accent)!important}
.leaflet-top.leaflet-left{left:env(safe-area-inset-left,0px)}
.layerbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;display:flex;flex-direction:column;gap:2px}
.layerbox button{border:0;background:none;text-align:left;padding:6px 10px;border-radius:6px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--muted)}
.layerbox button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.legend{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px 10px;font-size:.74rem;display:flex;flex-direction:column;gap:3px;max-width:180px}
.legend div{display:flex;align-items:center;gap:7px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
@media (max-width:760px){.legend{display:none}.layerbox{flex-direction:row;padding:3px;margin-left:max(10px,env(safe-area-inset-left,0px))!important}.layerbox button{padding:5px 8px;font-size:.72rem}.leaflet-bottom.leaflet-left{bottom:16px}}

/* Móvil: la página entera hace scroll; el mapa queda arriba y se va al bajar, así se lee a pantalla completa */
@media (max-width:760px){
  html,body{height:auto}
  #app{height:auto;display:block}
  main{display:flex;flex-direction:column}
  #mapwrap{order:-1;height:40vh;height:40svh;min-height:230px;flex:none}
  #panel{min-height:calc(100vh - 56px);min-height:calc(100svh - 56px)}
  nav.tabs{position:sticky;top:0;z-index:1002;background:var(--panel)}
  .view{overflow:visible;flex:none;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  #tomap{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:1500;display:flex;align-items:center;gap:7px;
    border:0;border-radius:999px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.86rem;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;
    transition:opacity .2s,transform .2s}
  #tomap svg{width:17px;height:17px}
  #tomap[data-off]{opacity:0;transform:translateY(12px);pointer-events:none}
}
@media (min-width:761px){#tomap{display:none}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:8px;font-size:.86rem;z-index:5000;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- avisos, pasaporte, agenda, gestión ---- */
.btn.primary span,.btn.primary{color:var(--accent-ink)}
.aviso{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--panel-2);border-radius:10px;padding:10px 12px;font-size:.88rem}
.aviso b{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.aviso.warn{border-left-color:#B4441F}.aviso.warn b{color:#B4441F}
.aviso.prize{border-left-color:#B8860B}.aviso.prize b{color:#8A6508}
.stampbox,.passcta{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel-2)}
.passcta{width:100%;cursor:pointer;font:inherit;color:var(--ink);text-align:left}
.passcta:hover{border-color:var(--accent)}
.passcta .go{margin-left:auto;font-size:1.4rem;color:var(--muted)}
.seal{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--c,var(--accent));color:var(--c,var(--accent))}
.seal svg{width:22px;height:22px}
.stampbox.done .seal{border-style:solid;background:var(--c);color:#fff}
.passcta.ag .seal{border-style:solid;border-radius:12px}
.passhead{display:flex;align-items:center;gap:16px}
.ring{--p:0;flex:none;width:92px;height:92px;border-radius:50%;display:grid;place-content:center;text-align:center;
  background:radial-gradient(closest-side,var(--panel) 78%,transparent 79%),conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
.ring b{font-size:1.6rem;line-height:1}.ring span{font-size:.75rem;color:var(--muted)}
.prow{display:grid;grid-template-columns:1fr;gap:4px;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);cursor:pointer;font:inherit;color:var(--ink)}
.prow .t{font-weight:600;font-size:.92rem}
.pbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.pbar i{display:block;height:100%;background:var(--c)}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin:6px 0 10px}
.stamp{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;cursor:pointer;font:inherit;color:var(--muted);padding:4px}
.stamp .seal{width:58px;height:58px;border-color:var(--line)}
.stamp.on .seal{border:2px solid var(--c);background:var(--c);color:#fff}
.stamp.on{color:var(--ink)}
.stamp .nm{font-size:.74rem;line-height:1.25;text-align:center;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ev{display:flex;gap:12px;border-bottom:1px solid var(--line);padding:10px 0}
.ev p{margin:2px 0 0;font-size:.88rem}
.cal{flex:none;width:52px;border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:center;background:var(--panel)}
.cal span{display:block;background:var(--accent);color:var(--accent-ink);font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 0}
.cal b{display:block;font-size:1.2rem;padding:4px 0}
.cal{align-self:flex-start}.cal.m{border:2px solid var(--accent)}.cal.m b{font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);padding:9px 0}
.bars.wide .bar{grid-template-columns:minmax(0,1.4fr) 1fr auto}.bars.wide .bar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.neg{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:8px 0}
.adm-nav{display:flex;flex-wrap:wrap;gap:6px}
.adm-nav a{font-size:.8rem;border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--ink);text-decoration:none;background:var(--panel-2)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.two-col{grid-template-columns:1fr}}
.foot-links{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;padding-bottom:8px}
.foot-links a{color:var(--muted)}
details summary{cursor:pointer;padding:4px 0}
.skip{position:absolute;left:-9999px;top:8px;z-index:9999;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;font-weight:700}
.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

</style>

<div id="cover" hidden></div>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<div id="app"><a class="skip" href="#panel" data-i="skipLink"></a>
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="var(--accent)"/><path d="M4 22c5-1 6-7 11-7s5 9 10 9 4-6 5-7" stroke="var(--accent-ink)" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="23" cy="10" r="2.6" fill="var(--accent-ink)"/></svg>
      <div style="min-width:0">
        <div class="brand-name">Andorra-Sierra de Arcos Explora</div>
        <div class="brand-sub" data-i="appSub"></div>
      </div>
    </div>
    <span class="demo-tag" data-i="demo"></span>
    <div class="langs" role="group" aria-label="Idioma / Language" id="langs"></div>
  </header>
  <main>
    <aside id="panel">
      <nav class="tabs" role="tablist" id="tabs">
        <button role="tab" data-tab="inicio" data-i="tabHome"></button>
        <button role="tab" data-tab="explorar" data-i="tabExplore"></button>
        <button role="tab" data-tab="rutas" data-i="tabRoutes"></button>
        <button role="tab" data-tab="agenda" data-i="tabAgenda"></button>
        <button role="tab" data-tab="pasaporte" data-i="tabPass"></button>
      </nav>
      <section class="view stack" id="v-inicio"></section>
      <section class="view stack" id="v-explorar" hidden></section>
      <section class="view stack" id="v-lugar" hidden></section>
      <section class="view stack" id="v-rutas" hidden></section>
      <section class="view stack" id="v-agenda" hidden></section>
      <section class="view stack" id="v-pasaporte" hidden></section>
      <section class="view stack" id="v-gestion" hidden></section>
    </aside>
    <div id="mapwrap"><div id="map" role="application" aria-label="Mapa"></div></div>
    <button type="button" id="tomap" data-off><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 4-6 3v13l6-3 6 3 6-3V4l-6 3-6-3z"/><path d="M9 4v13M15 7v13"/></svg><span data-i="tabMap"></span></button>
  </main>
</div>

 · Musée minier et puits San Juan","de":"MWINAS · Bergbaumuseum und Schacht San Juan","pt":"MWINAS · Museu Mineiro e Poço San Juan"},"when":{"es":"Mina de carbón del siglo XX · Museo desde 2005","en":"20th-century coal mine · Museum since 2005","fr":"Mine de charbon du XXe siècle · Musée depuis 2005","de":"Kohlebergwerk des 20. Jh. · Museum seit 2005","pt":"Mina de carvão do século XX · Museu desde 2005"},"desc":{"es":"El museo minero de la comarca ocupa las instalaciones del antiguo Pozo de San Juan, a las afueras de Andorra. Su castillete de hierro, de 44 metros, es la silueta que mejor resume la historia del carbón en esta tierra.","en":"The comarca's mining museum occupies the old San Juan pit on the outskirts of Andorra. Its 44-metre iron headframe is the outline that best sums up the history of coal in this land.","fr":"Le musée minier de la comarca occupe les installations de l'ancien puits San Juan, à la sortie d'Andorra. Son chevalement en fer de 44 mètres est la silhouette qui résume le mieux l'histoire du charbon sur cette terre.","de":"Das Bergbaumuseum der Comarca liegt auf dem Gelände des ehemaligen Schachts San Juan am Ortsrand von Andorra. Sein 44 Meter hoher eiserner Förderturm ist die Silhouette, die die Geschichte der Kohle in dieser Gegend am besten zusammenfasst.","pt":"O museu mineiro da comarca ocupa as instalações do antigo Poço San Juan, à saída de Andorra. A sua torre de extração em ferro, com 44 metros, é a silhueta que melhor resume a história do carvão nesta terra."},"visit":{"es":"Se visita con guía, normalmente los fines de semana y festivos y con reserva previa; la visita dura algo más de una hora y a veces la acompañan mineros jubilados. También funciona un tren minero a escala. Confirma horarios y reservas en el 978 880 927 o en la oficina de turismo comarcal.","en":"Visits are guided, usually at weekends and on public holidays and by prior booking; the tour lasts a little over an hour and retired miners sometimes join it. There is also a scale mining train. Check times and book on 978 880 927 or at the comarca tourist office.","fr":"La visite est guidée, en général le week-end et les jours fériés et sur réservation ; elle dure un peu plus d'une heure et d'anciens mineurs l'accompagnent parfois. Un petit train minier à l'échelle fonctionne aussi. Vérifiez les horaires et réservez au 978 880 927 ou à l'office de tourisme de la comarca.","de":"Besichtigt wird mit Führung, meist an Wochenenden und Feiertagen und nach Voranmeldung; die Führung dauert etwas über eine Stunde, und manchmal begleiten ehemalige Bergleute die Gruppe. Außerdem fährt ein maßstabsgetreuer Grubenzug. Zeiten und Reservierung unter 978 880 927 oder im Tourismusbüro der Comarca.","pt":"A visita é guiada, normalmente aos fins de semana e feriados e com marcação prévia; dura pouco mais de uma hora e por vezes é acompanhada por mineiros reformados. Há também um comboio mineiro à escala. Confirme horários e reservas pelo 978 880 927 ou no posto de turismo da comarca."},"src":"https://www.lacomarca.net/museo-minero-andorra-cumple-decadas-referente-cultural-turistico-pasado-industrial/","sources":["https://ninos.kiddle.co/MWINAS","https://www.erih.net/i-want-to-go-there/minero-mwinas-technology-and-mining-park","https://www.lacomarca.net/reportajes/experiencia-minera-3-propuestas-turisticas-disfrutar-bajo-tierra/","https://www.lacomarca.net/andorra-rinde-homenaje-mineros-jubilados-dia-santa-barbara/"],"art":{"es":[{"h":"Historia","t":"El Pozo de San Juan fue una mina de carbón que dejó de funcionar a comienzos de los años sesenta. Durante décadas sus edificios quedaron abandonados, hasta que en 2005 un grupo de vecinos empezó a rescatar máquinas que iban a desaparecer. De aquel esfuerzo voluntario nació el MWINAS, que cumplió veinte años en 2025.\n\nLa Asociación de Voluntarios del Pozo de San Juan ha sido clave: muchos de sus miembros son mineros jubilados que restauran piezas y enseñan el museo. A lo largo de los años, distintas administraciones han invertido cerca de un millón y medio de euros en el conjunto."},{"h":"Qué ver","t":"El castillete de extracción, de 44 metros y montado con remaches en caliente, subía y bajaba vagonetas y mineros. A su lado, el edificio de máquinas guarda el motor de extracción, una máquina inglesa Robey de principios de los años cincuenta.\n\nEn un antiguo almacén se reúnen fotografías, planos, herramientas y recreaciones del economato, la enfermería, la oficina y la lampistería. Fuera, un parque de grandes máquinas explica cómo cambió la extracción del lignito, y un tren a escala recorre las instalaciones. Entre las piezas recientes están la locomotora Samper, que llevaba carbón por el ferrocarril minero Andorra-Escatrón, y un camión de la central térmica."},{"h":"Curiosidades","t":"Cada 4 de diciembre, día de Santa Bárbara, Andorra homenajea en el museo a sus mineros jubilados, y se llevan flores a las imágenes de la santa que hay en el pozo."}],"en":[{"h":"History","t":"The San Juan pit was a coal mine that stopped working in the early 1960s. For decades its buildings lay abandoned, until in 2005 a group of local people began rescuing machines that were about to disappear. That volunteer effort gave rise to MWINAS, which turned twenty in 2025.\n\nThe San Juan Pit Volunteers' Association has been essential: many of its members are retired miners who restore pieces and show visitors round. Over the years, various public bodies have invested close to one and a half million euros in the site."},{"h":"What to see","t":"The 44-metre winding headframe, assembled with hot rivets, raised and lowered mine carts and miners. Beside it, the engine house holds the winding engine, an English Robey machine from the early 1950s.\n\nA former warehouse brings together photographs, plans, tools and recreations of the company shop, the infirmary, the office and the lamp room. Outside, a park of large machines shows how lignite extraction changed, and a scale train runs through the site. Recent additions include the Samper locomotive, which hauled coal on the Andorra-Escatrón mining railway, and a lorry from the power station."},{"h":"Did you know?","t":"Every 4 December, Saint Barbara's Day, Andorra pays tribute to its retired miners at the museum, and flowers are laid before the images of the saint at the pit."}],"fr":[{"h":"Histoire","t":"Le puits San Juan était une mine de charbon qui a cessé de fonctionner au début des années 1960. Pendant des décennies, ses bâtiments sont restés à l'abandon, jusqu'à ce qu'en 2005 un groupe d'habitants commence à sauver des machines promises à la disparition. De cet effort bénévole est né le MWINAS, qui a fêté ses vingt ans en 2025.\n\nL'Association des bénévoles du puits San Juan a joué un rôle essentiel : beaucoup de ses membres sont d'anciens mineurs qui restaurent les pièces et font visiter le musée. Au fil des années, différentes administrations ont investi près d'un million et demi d'euros dans l'ensemble."},{"h":"À voir","t":"Le chevalement d'extraction, haut de 44 mètres et assemblé avec des rivets posés à chaud, montait et descendait les wagonnets et les mineurs. À côté, le bâtiment des machines abrite la machine d'extraction, une machine anglaise Robey du début des années 1950.\n\nUn ancien entrepôt rassemble photographies, plans, outils et reconstitutions de l'économat, de l'infirmerie, du bureau et de la lampisterie. Dehors, un parc de grandes machines montre l'évolution de l'extraction du lignite, et un train à l'échelle parcourt le site. Parmi les pièces récentes figurent la locomotive Samper, qui transportait le charbon sur le chemin de fer minier Andorra-Escatrón, et un camion de la centrale thermique."},{"h":"Le saviez-vous ?","t":"Chaque 4 décembre, jour de la Sainte-Barbe, Andorra rend hommage à ses mineurs retraités au musée, et l'on dépose des fleurs devant les images de la sainte qui se trouvent au puits."}],"de":[{"h":"Geschichte","t":"Der Schacht San Juan war ein Kohlebergwerk, das Anfang der 1960er Jahre stillgelegt wurde. Jahrzehntelang standen die Gebäude leer, bis 2005 eine Gruppe von Einheimischen begann, Maschinen zu retten, die sonst verschwunden wären. Aus dieser ehrenamtlichen Arbeit entstand das MWINAS, das 2025 zwanzig Jahre alt wurde.\n\nDie Vereinigung der Freiwilligen des Schachts San Juan war dabei entscheidend: Viele Mitglieder sind ehemalige Bergleute, die Stücke restaurieren und Besucher führen. Im Laufe der Jahre haben verschiedene Behörden fast anderthalb Millionen Euro in die Anlage investiert."},{"h":"Sehenswert","t":"Der 44 Meter hohe Förderturm, mit heiß gesetzten Nieten montiert, beförderte Förderwagen und Bergleute hinauf und hinunter. Daneben steht im Maschinenhaus die Fördermaschine, eine englische Robey-Maschine aus den frühen 1950er Jahren.\n\nIn einem ehemaligen Lagerhaus sind Fotos, Pläne, Werkzeuge und Nachbauten des Werksladens, der Krankenstation, des Büros und der Lampenstube zu sehen. Draußen zeigt ein Park großer Maschinen, wie sich der Abbau von Braunkohle verändert hat, und ein Zug im Kleinformat fährt über das Gelände. Zu den neueren Stücken gehören die Lokomotive Samper, die Kohle auf der Grubenbahn Andorra-Escatrón zog, und ein Lastwagen des Wärmekraftwerks."},{"h":"Wussten Sie?","t":"Jedes Jahr am 4. Dezember, dem Tag der heiligen Barbara, ehrt Andorra im Museum seine Bergleute im Ruhestand, und an den Bildern der Heiligen am Schacht werden Blumen niedergelegt."}],"pt":[{"h":"História","t":"O Poço San Juan foi uma mina de carvão que deixou de funcionar no início dos anos sessenta. Durante décadas, os edifícios ficaram ao abandono, até que em 2005 um grupo de habitantes começou a resgatar máquinas que estavam prestes a desaparecer. Desse esforço voluntário nasceu o MWINAS, que fez vinte anos em 2025.\n\nA Associação de Voluntários do Poço San Juan foi decisiva: muitos dos seus membros são mineiros reformados que restauram peças e mostram o museu. Ao longo dos anos, várias administrações investiram perto de um milhão e meio de euros no conjunto."},{"h":"O que ver","t":"A torre de extração, com 44 metros e montada com rebites a quente, fazia subir e descer vagonetas e mineiros. Ao lado, o edifício das máquinas guarda a máquina de extração, uma máquina inglesa Robey do início dos anos cinquenta.\n\nNum antigo armazém reúnem-se fotografias, plantas, ferramentas e recriações do economato, da enfermaria, do escritório e da lampistaria. Lá fora, um parque de grandes máquinas mostra como mudou a extração da lenhite, e um comboio à escala percorre as instalações. Entre as peças recentes estão a locomotiva Samper, que transportava carvão pelo caminho de ferro mineiro Andorra-Escatrón, e um camião da central térmica."},{"h":"Curiosidades","t":"Todos os anos, a 4 de dezembro, dia de Santa Bárbara, Andorra homenageia no museu os seus mineiros reformados, e levam-se flores às imagens da santa que estão no poço."}]},"status":"pending"},{"id":"el-cabo","town":"Andorra","cat":"arqueologia","lat":40.97472,"lon":-0.44222,"coord_src":null,"q":["Poblado ibérico El Cabo, Andorra, Teruel","Parque arqueológico El Cabo, San Macario, Andorra"],"fq":["Poblado ibérico El Cabo Andorra","El Cabo Andorra Teruel iberos","San Macario Andorra Teruel"],"name":{"es":"Poblado íbero de El Cabo","en":"El Cabo Iberian Settlement","fr":"Village ibère d'El Cabo","de":"Iberersiedlung El Cabo","pt":"Povoado ibero de El Cabo"},"when":{"es":"Siglo V a. C. · Trasladado piedra a piedra","en":"5th century BC · Moved stone by stone","fr":"Ve siècle av. J.-C. · Déplacé pierre par pierre","de":"5. Jh. v. Chr. · Stein für Stein versetzt","pt":"Século V a. C. · Trasladado pedra a pedra"},"desc":{"es":"Un poblado íbero del siglo V a. C. que una mina a cielo abierto iba a hacer desaparecer. Se excavó entero y se reconstruyó en el monte de San Macario, sobre Andorra, con su calle, sus casas y su muralla.","en":"A 5th-century BC Iberian village that an open-cast mine was about to wipe out. It was fully excavated and rebuilt on San Macario hill, above Andorra, with its street, its houses and its wall.","fr":"Un village ibère du Ve siècle av. J.-C. qu'une mine à ciel ouvert allait faire disparaître. Il a été entièrement fouillé puis reconstruit sur le mont San Macario, au-dessus d'Andorra, avec sa rue, ses maisons et son rempart.","de":"Eine iberische Siedlung aus dem 5. Jahrhundert v. Chr., die ein Tagebau zu zerstören drohte. Sie wurde vollständig ausgegraben und auf dem Berg San Macario oberhalb von Andorra mit Straße, Häusern und Mauer wiederaufgebaut.","pt":"Um povoado ibero do século V a. C. que uma mina a céu aberto ia fazer desaparecer. Foi escavado por completo e reconstruído no monte de San Macario, sobre Andorra, com a sua rua, as suas casas e a sua muralha."},"visit":{"es":"El parque arqueológico está en el monte de San Macario y la necrópolis, a unos 400 metros al sur, junto a la carretera A-223. Las visitas guiadas, y las teatralizadas con reserva, se organizan a través de la oficina de turismo; confirma horarios allí.","en":"The archaeological park is on San Macario hill and the necropolis about 400 metres to the south, beside the A-223 road. Guided tours, and dramatised tours by booking, are arranged through the tourist office; check times there.","fr":"Le parc archéologique se trouve sur le mont San Macario et la nécropole à environ 400 mètres au sud, au bord de la route A-223. Les visites guidées, et les visites théâtralisées sur réservation, s'organisent par l'office de tourisme ; vérifiez les horaires sur place.","de":"Der archäologische Park liegt auf dem Berg San Macario, die Nekropole etwa 400 Meter südlich an der Straße A-223. Führungen und, nach Voranmeldung, szenische Führungen vermittelt das Tourismusbüro; dort auch die Zeiten erfragen.","pt":"O parque arqueológico fica no monte de San Macario e a necrópole cerca de 400 metros a sul, junto à estrada A-223. As visitas guiadas, e as teatralizadas mediante marcação, organizam-se através do posto de turismo; confirme lá os horários."},"src":"https://www.turismodearagon.com/ficha/parque-arqueologico-y-necropolis-de-el-cabo-andorra/","sources":["https://www.lacomarca.net/reportajes/tierra-iberos-ruta-legado-incalculable-andorra-sierra-arcos/","https://es.hispanopedia.com/wiki/Andorra_(Teruel)"],"art":{"es":[{"h":"Historia","t":"El poblado original estaba a unos dos kilómetros al oeste de Andorra, en terrenos que iba a ocupar una explotación minera a cielo abierto. En 1999 se excavó por completo y se recuperaron más de 40.000 restos, sobre todo cerámica, pero también hebillas, puntas de flecha, agujas, anillos y colgantes.\n\nLos elementos más importantes se trasladaron al monte de San Macario, donde se reconstruyó la planta del poblado en un terreno parecido al original. Por eso se presenta como el único poblado ibérico trasladado piedra a piedra."},{"h":"Qué ver","t":"Una calle central ordena entre cuarenta y cincuenta viviendas pequeñas, de 20 a 25 metros cuadrados en planta baja, que probablemente tenían altillo. Algunas se han levantado a altura completa para entender cómo eran por dentro. En el punto más alto están los dos espacios mayores, quizá la casa de la familia principal y un almacén.\n\nPor el lado más accesible el poblado se defendía con una muralla escalonada y una gran torre rectangular junto a la puerta. La necrópolis conserva seis túmulos circulares y un centro de interpretación explica la vida de sus habitantes."},{"h":"Curiosidades","t":"El segundo fin de semana de noviembre Andorra celebra Lakuerter Íbera, una recreación con clanes, mercado y desfiles que es Fiesta de Interés Turístico de Aragón desde 2018."}],"en":[{"h":"History","t":"The original settlement stood about two kilometres west of Andorra, on land due to be taken over by an open-cast mine. In 1999 it was fully excavated and more than 40,000 finds were recovered, mostly pottery but also buckles, arrowheads, needles, rings and pendants.\n\nThe most important elements were moved to San Macario hill, where the village plan was rebuilt on ground similar to the original. That is why it is presented as the only Iberian settlement moved stone by stone."},{"h":"What to see","t":"A central street is lined with forty to fifty small houses, 20 to 25 square metres on the ground floor, which probably had a mezzanine. Some have been raised to full height so you can see what they were like inside. At the highest point are the two largest spaces, perhaps the main family's house and a storeroom.\n\nOn its most accessible side the village was defended by a stepped wall and a large rectangular tower by the gate. The necropolis keeps six circular burial mounds, and a visitor centre explains the life of its inhabitants."},{"h":"Did you know?","t":"On the second weekend of November Andorra holds Lakuerter Íbera, a re-enactment with clans, a market and parades that has been a Festival of Tourist Interest of Aragon since 2018."}],"fr":[{"h":"Histoire","t":"Le village d'origine se trouvait à environ deux kilomètres à l'ouest d'Andorra, sur des terrains qu'allait occuper une exploitation minière à ciel ouvert. En 1999, il a été entièrement fouillé et plus de 40 000 vestiges ont été mis au jour, surtout de la céramique, mais aussi des boucles, des pointes de flèche, des aiguilles, des bagues et des pendentifs.\n\nLes éléments les plus importants ont été transférés sur le mont San Macario, où le plan du village a été reconstruit sur un terrain semblable à l'original. C'est pourquoi on le présente comme le seul village ibère déplacé pierre par pierre."},{"h":"À voir","t":"Une rue centrale dessert entre quarante et cinquante petites maisons de 20 à 25 mètres carrés au rez-de-chaussée, qui avaient probablement une mezzanine. Certaines ont été relevées sur toute leur hauteur pour comprendre à quoi elles ressemblaient à l'intérieur. Au point le plus haut se trouvent les deux plus grands espaces, peut-être la maison de la famille principale et un entrepôt.\n\nDu côté le plus accessible, le village était défendu par un rempart en gradins et une grande tour rectangulaire près de la porte. La nécropole conserve six tumulus circulaires et un centre d'interprétation explique la vie de ses habitants."},{"h":"Le saviez-vous ?","t":"Le deuxième week-end de novembre, Andorra célèbre Lakuerter Íbera, une reconstitution avec clans, marché et défilés, déclarée Fête d'intérêt touristique d'Aragon en 2018."}],"de":[{"h":"Geschichte","t":"Die ursprüngliche Siedlung lag etwa zwei Kilometer westlich von Andorra auf Gelände, das ein Tagebau beanspruchen sollte. 1999 wurde sie vollständig ausgegraben, und man barg mehr als 40.000 Funde, vor allem Keramik, aber auch Schnallen, Pfeilspitzen, Nadeln, Ringe und Anhänger.\n\nDie wichtigsten Bauteile wurden auf den Berg San Macario gebracht, wo der Grundriss der Siedlung auf einem ähnlichen Gelände wie dem ursprünglichen rekonstruiert wurde. Deshalb gilt sie als einzige iberische Siedlung, die Stein für Stein versetzt wurde."},{"h":"Sehenswert","t":"Eine Mittelstraße erschließt vierzig bis fünfzig kleine Häuser mit 20 bis 25 Quadratmetern im Erdgeschoss, die vermutlich ein Zwischengeschoss hatten. Einige wurden in voller Höhe wiederaufgebaut, damit man sieht, wie sie innen aussahen. Am höchsten Punkt liegen die beiden größten Räume, vielleicht das Haus der führenden Familie und ein Lager.\n\nAuf der am leichtesten zugänglichen Seite schützten eine gestufte Mauer und ein großer rechteckiger Turm am Tor die Siedlung. Die Nekropole bewahrt sechs runde Grabhügel, und ein Besucherzentrum erklärt das Leben ihrer Bewohner."},{"h":"Wussten Sie?","t":"Am zweiten Novemberwochenende feiert Andorra Lakuerter Íbera, ein Fest mit Clans, Markt und Umzügen, das seit 2018 als Fest von touristischem Interesse Aragoniens anerkannt ist."}],"pt":[{"h":"História","t":"O povoado original ficava a cerca de dois quilómetros a oeste de Andorra, em terrenos que iam ser ocupados por uma exploração mineira a céu aberto. Em 1999 foi escavado por completo e recuperaram-se mais de 40 000 vestígios, sobretudo cerâmica, mas também fivelas, pontas de flecha, agulhas, anéis e pendentes.\n\nOs elementos mais importantes foram levados para o monte de San Macario, onde se reconstruiu a planta do povoado num terreno semelhante ao original. Por isso é apresentado como o único povoado ibérico trasladado pedra a pedra."},{"h":"O que ver","t":"Uma rua central organiza entre quarenta e cinquenta casas pequenas, com 20 a 25 metros quadrados no rés do chão, que provavelmente tinham sótão. Algumas foram levantadas à altura total para se perceber como eram por dentro. No ponto mais alto ficam os dois espaços maiores, talvez a casa da família principal e um armazém.\n\nPelo lado mais acessível, o povoado defendia-se com uma muralha escalonada e uma grande torre retangular junto à porta. A necrópole conserva seis túmulos circulares e um centro interpretativo explica a vida dos seus habitantes."},{"h":"Curiosidades","t":"No segundo fim de semana de novembro, Andorra celebra Lakuerter Íbera, uma recriação com clãs, mercado e desfiles que é Festa de Interesse Turístico de Aragão desde 2018."}]},"status":"pending"},{"id":"san-pedro-oliete","town":"Oliete","cat":"arqueologia","lat":41.01874,"lon":-0.63443,"coord_src":null,"q":["Poblado ibérico Cabezo de San Pedro, Oliete","Ermita de San Pedro, Oliete"],"fq":["Cabezo de San Pedro Oliete","San Pedro Oliete poblado ibero","Oliete iberos torre"],"name":{"es":"Fortaleza íbera de San Pedro","en":"San Pedro Iberian Fortress","fr":"Forteresse ibère de San Pedro","de":"Iberische Festung San Pedro","pt":"Fortaleza ibera de San Pedro"},"when":{"es":"Siglos III-I a. C. · Conjunto de Interés Cultural","en":"3rd-1st century BC · Site of Cultural Interest","fr":"IIIe-Ier siècle av. J.-C. · Ensemble d'intérêt culturel","de":"3.-1. Jh. v. Chr. · Kulturgut-Ensemble","pt":"Séculos III-I a. C. · Conjunto de Interesse Cultural"},"desc":{"es":"Sobre una plataforma de roca que vigila el río Martín se levantan las torres de una fortaleza íbera. Una de ellas supera todavía los 13 metros de altura y es una de las imágenes de la comarca.","en":"On a rock platform overlooking the River Martín stand the towers of an Iberian fortress. One of them is still more than 13 metres high and is one of the images of the comarca.","fr":"Sur une plateforme rocheuse qui surveille le Martín se dressent les tours d'une forteresse ibère. L'une d'elles dépasse encore 13 mètres de haut et compte parmi les images de la comarca.","de":"Auf einer Felsplattform über dem Río Martín erheben sich die Türme einer iberischen Festung. Einer von ihnen ist noch über 13 Meter hoch und zählt zu den Wahrzeichen der Comarca.","pt":"Sobre uma plataforma rochosa que vigia o rio Martín erguem-se as torres de uma fortaleza ibera. Uma delas ainda ultrapassa os 13 metros de altura e é uma das imagens da comarca."},"visit":{"es":"Está a las afueras de Oliete, cerca de la ermita y de la Sima de San Pedro, y se puede visitar en la misma salida. En verano la comarca suele organizar visitas guiadas con reserva. En Oliete, el Centro de Interpretación de la Cultura Ibérica completa la visita; confirma horarios en la oficina de turismo.","en":"It is on the outskirts of Oliete, near the hermitage and the San Pedro sinkhole, so you can see them on the same outing. In summer the comarca usually runs guided tours by booking. In Oliete, the Iberian Culture Interpretation Centre completes the visit; check times at the tourist office.","fr":"Elle se trouve à la sortie d'Oliete, près de l'ermitage et du gouffre de San Pedro, que l'on peut voir lors de la même sortie. En été, la comarca organise généralement des visites guidées sur réservation. À Oliete, le Centre d'interprétation de la culture ibère complète la visite ; vérifiez les horaires à l'office de tourisme.","de":"Sie liegt am Ortsrand von Oliete, nahe der Einsiedelei und der Doline San Pedro, sodass sich beides bei einem Ausflug verbinden lässt. Im Sommer bietet die Comarca meist Führungen nach Voranmeldung an. In Oliete ergänzt das Interpretationszentrum der iberischen Kultur den Besuch; Zeiten im Tourismusbüro erfragen.","pt":"Fica à saída de Oliete, perto da ermida e do algar de San Pedro, e pode visitar-se no mesmo passeio. No verão, a comarca costuma organizar visitas guiadas com marcação. Em Oliete, o Centro de Interpretação da Cultura Ibérica completa a visita; confirme horários no posto de turismo."},"src":"https://www.lacomarca.net/reportajes/tierra-iberos-ruta-legado-incalculable-andorra-sierra-arcos/","sources":["https://es.hispanopedia.com/wiki/Oliete","https://www.lacomarca.net/hallado-nuevo-torreon-yacimiento-iberico-san-pedro/","https://www.lacomarca.net/productores-locales-poblados-iberos-o-cascos-historicos-andorra-sierra-de-arcos-ofrece-visitas-guiadas-a-sus-pueblos-durante-todo-el-verano/"],"art":{"es":[{"h":"Historia","t":"El Cabezo de San Pedro fue un poblado fortificado ocupado entre el siglo III a. C. y mediados del siglo I a. C. En su mejor momento llegó a ocupar unos 17.000 metros cuadrados, aunque hoy solo se ve la fortaleza del extremo. Su papel era sobre todo militar: controlaba los pasos y protegía otros poblados cercanos, como El Palomar.\n\nEn 2001 se declaró Conjunto de Interés Cultural. Las excavaciones siguen dando sorpresas, como el hallazgo reciente de un nuevo torreón."},{"h":"Qué ver","t":"La defensa combinaba un foso, una doble línea de muralla, la primera de cuatro metros de anchura, un paso de ronda y varias torres circulares. Una de ellas conserva más de 13 metros de alto, y sus dos torres originales se consideran las más antiguas de Aragón.\n\nA unos quince minutos a pie de Oliete está El Palomar, un poblado con calles en cuadrícula y casas de dos plantas que fue destruido hacia el año 74 a. C., durante las guerras sertorianas. El Centro de Interpretación de la Cultura Ibérica, en las antiguas escuelas, tiene maquetas y réplicas de herramientas y cerámicas."}],"en":[{"h":"History","t":"The Cabezo de San Pedro was a fortified settlement occupied from the 3rd century BC to the mid-1st century BC. At its height it covered some 17,000 square metres, although today only the fortress at one end can be seen. Its role was mainly military: it controlled the passes and protected other nearby villages, such as El Palomar.\n\nIn 2001 it was declared a Site of Cultural Interest. The excavations keep producing surprises, such as the recent discovery of a new tower."},{"h":"What to see","t":"The defences combined a ditch, a double line of walls, the first four metres thick, a wall walk and several round towers. One of them still stands more than 13 metres high, and its two original towers are considered the oldest in Aragon.\n\nAbout fifteen minutes' walk from Oliete lies El Palomar, a village with a grid of streets and two-storey houses that was destroyed around 74 BC, during the Sertorian Wars. The Iberian Culture Interpretation Centre, in the old school buildings, has models and replicas of tools and pottery."}],"fr":[{"h":"Histoire","t":"Le Cabezo de San Pedro était un village fortifié occupé entre le IIIe siècle av. J.-C. et le milieu du Ier siècle av. J.-C. À son apogée, il couvrait environ 17 000 mètres carrés, même si l'on ne voit aujourd'hui que la forteresse située à une extrémité. Son rôle était surtout militaire : il contrôlait les passages et protégeait d'autres villages proches, comme El Palomar.\n\nIl a été déclaré Ensemble d'intérêt culturel en 2001. Les fouilles réservent encore des surprises, comme la découverte récente d'une nouvelle tour."},{"h":"À voir","t":"La défense associait un fossé, une double ligne de remparts, la première large de quatre mètres, un chemin de ronde et plusieurs tours circulaires. L'une d'elles conserve plus de 13 mètres de haut, et ses deux tours d'origine sont considérées comme les plus anciennes d'Aragon.\n\nÀ environ quinze minutes à pied d'Oliete se trouve El Palomar, un village aux rues en damier et aux maisons à deux niveaux, détruit vers 74 av. J.-C., pendant les guerres sertoriennes. Le Centre d'interprétation de la culture ibère, installé dans les anciennes écoles, présente des maquettes et des répliques d'outils et de céramiques."}],"de":[{"h":"Geschichte","t":"Der Cabezo de San Pedro war eine befestigte Siedlung, die vom 3. Jahrhundert v. Chr. bis zur Mitte des 1. Jahrhunderts v. Chr. bewohnt war. In ihrer Blütezeit umfasste sie rund 17.000 Quadratmeter, heute ist jedoch nur die Festung an einem Ende sichtbar. Ihre Aufgabe war vor allem militärisch: Sie kontrollierte die Durchgänge und schützte andere Siedlungen in der Nähe, etwa El Palomar.\n\n2001 wurde sie zum Kulturgut-Ensemble erklärt. Die Grabungen bringen immer wieder Überraschungen, wie kürzlich den Fund eines weiteren Turms."},{"h":"Sehenswert","t":"Die Verteidigung bestand aus einem Graben, einer doppelten Mauer, deren erste vier Meter breit ist, einem Wehrgang und mehreren Rundtürmen. Einer davon ist noch über 13 Meter hoch, und ihre beiden ursprünglichen Türme gelten als die ältesten Aragoniens.\n\nEtwa fünfzehn Gehminuten von Oliete entfernt liegt El Palomar, eine Siedlung mit rechtwinkligem Straßennetz und zweistöckigen Häusern, die um 74 v. Chr. im Sertorianischen Krieg zerstört wurde. Das Interpretationszentrum der iberischen Kultur in der alten Schule zeigt Modelle sowie Nachbildungen von Werkzeugen und Keramik."}],"pt":[{"h":"História","t":"O Cabezo de San Pedro foi um povoado fortificado ocupado entre o século III a. C. e meados do século I a. C. No seu auge chegou a ocupar cerca de 17 000 metros quadrados, embora hoje só se veja a fortaleza da ponta. O seu papel era sobretudo militar: controlava as passagens e protegia outros povoados próximos, como El Palomar.\n\nEm 2001 foi declarado Conjunto de Interesse Cultural. As escavações continuam a trazer surpresas, como a descoberta recente de um novo torreão."},{"h":"O que ver","t":"A defesa combinava um fosso, uma dupla linha de muralha, a primeira com quatro metros de largura, um caminho de ronda e várias torres circulares. Uma delas conserva mais de 13 metros de altura, e as suas duas torres originais são consideradas as mais antigas de Aragão.\n\nA cerca de quinze minutos a pé de Oliete fica El Palomar, um povoado com ruas em quadrícula e casas de dois pisos, destruído por volta do ano 74 a. C., durante as guerras sertorianas. O Centro de Interpretação da Cultura Ibérica, nas antigas escolas, tem maquetas e réplicas de ferramentas e cerâmicas."}]},"status":"pending"},{"id":"sima-san-pedro","town":"Oliete","cat":"naturaleza","lat":41.02295,"lon":-0.63723,"coord_src":null,"q":["Sima de San Pedro, Oliete","Sima de San Pedro, Teruel"],"fq":["Sima de San Pedro Oliete","Sima de San Pedro Teruel"],"name":{"es":"Sima de San Pedro","en":"San Pedro Sinkhole","fr":"Gouffre de San Pedro","de":"Doline San Pedro","pt":"Algar de San Pedro"},"when":{"es":"Sima kárstica · Más de 100 m hasta el fondo","en":"Karst sinkhole · Over 100 m to the bottom","fr":"Gouffre karstique · Plus de 100 m jusqu'au fond","de":"Karstdoline · Über 100 m bis zum Grund","pt":"Algar cársico · Mais de 100 m até ao fundo"},"desc":{"es":"Un enorme pozo natural de unos 80 metros de diámetro, con paredes casi verticales y un lago en el fondo. Asomarse a la pasarela permite ver las aves que anidan en sus grietas.","en":"A huge natural shaft some 80 metres across, with almost vertical walls and a lake at the bottom. From the footbridge you can watch the birds that nest in its cracks.","fr":"Un immense puits naturel d'environ 80 mètres de diamètre, aux parois presque verticales, avec un lac au fond. Depuis la passerelle, on observe les oiseaux qui nichent dans ses fissures.","de":"Ein riesiger natürlicher Schacht von etwa 80 Metern Durchmesser mit fast senkrechten Wänden und einem See am Grund. Vom Steg aus sieht man die Vögel, die in seinen Spalten nisten.","pt":"Um enorme poço natural com cerca de 80 metros de diâmetro, paredes quase verticais e um lago no fundo. Da passarela vêem-se as aves que fazem ninho nas suas fendas."},"visit":{"es":"Está cerca de la ermita de San Pedro y de la fortaleza íbera, así que se visitan juntas. Una pasarela permite asomarse a la boca; no es recomendable con vértigo y no hay que salirse de la zona protegida. En verano hay visitas guiadas con reserva en la oficina de turismo.","en":"It is near the San Pedro hermitage and the Iberian fortress, so they are visited together. A footbridge lets you look into the mouth; it is not advisable if you suffer from vertigo, and do not leave the protected area. In summer there are guided tours by booking at the tourist office.","fr":"Il se trouve près de l'ermitage de San Pedro et de la forteresse ibère, que l'on visite donc ensemble. Une passerelle permet de regarder dans l'ouverture ; déconseillé aux personnes sujettes au vertige, et ne sortez pas de la zone protégée. En été, des visites guidées sont proposées sur réservation à l'office de tourisme.","de":"Sie liegt nahe der Einsiedelei San Pedro und der iberischen Festung, daher besucht man beides zusammen. Von einem Steg blickt man in die Öffnung; bei Höhenangst nicht empfehlenswert, und den geschützten Bereich bitte nicht verlassen. Im Sommer gibt es Führungen nach Voranmeldung im Tourismusbüro.","pt":"Fica perto da ermida de San Pedro e da fortaleza ibera, por isso visitam-se juntas. Uma passarela permite espreitar a boca; não é aconselhável a quem sofre de vertigens e não se deve sair da zona protegida. No verão há visitas guiadas com marcação no posto de turismo."},"src":"https://www.fascinatingspain.com/articulo/what-to-see-in-aragon/sima-de-san-pedro/20200504091618066744.html","sources":["https://www.lacomarca.net/nuevo-mirador-panoramico-sima-san-pedro-oliete/","https://es.hispanopedia.com/wiki/Oliete","https://www.festivalesdeespana.com/festival/romeria-ermita-san-pedro-oliete/2025"],"art":{"es":[{"h":"El paisaje","t":"La sima es de origen kárstico: el agua fue disolviendo la roca hasta abrir un pozo de unos 80 metros de diámetro. Desde la boca hay unos 86 metros hasta la superficie de un lago que tiene, a su vez, unos 22 metros de profundidad. El lago guarda más de medio millón de metros cúbicos y se alimenta de la escorrentía del barranco y de agua subterránea del río Martín.\n\nEn sus paredes se refugian más de 25 especies de vertebrados: anidan palomas bravías, chovas piquirrojas y gorriones chillones, y viven hasta siete especies de murciélagos. Cerca del camino de acceso crece una sabina albar, árbol escaso en la cuenca del Martín."},{"h":"Para entenderlo","t":"El balcón que existe se construyó para la espeleología, no para el turismo. En 2021 la comarca y el Parque Cultural del Río Martín presentaron el proyecto de un mirador panorámico al que se llegaría por un túnel, sin tocar la boca de la sima. Entonces la visitaban unas 15.000 personas al año.\n\nEl lunes de Pascua, Oliete sube en romería a la ermita de San Pedro y la comida campestre se hace en este paraje."}],"en":[{"h":"The landscape","t":"The sinkhole is karstic in origin: water slowly dissolved the rock until it opened a shaft about 80 metres across. From the mouth it is some 86 metres down to the surface of a lake which is itself about 22 metres deep. The lake holds over half a million cubic metres and is fed by run-off from the ravine and by groundwater from the River Martín.\n\nMore than 25 species of vertebrates shelter in its walls: rock doves, red-billed choughs and rock sparrows nest here, and up to seven species of bat live inside. Near the access path grows a Spanish juniper, a tree that is scarce in the Martín basin."},{"h":"Understanding it","t":"The existing balcony was built for caving, not for tourism. In 2021 the comarca and the Río Martín Cultural Park presented a project for a panoramic viewpoint reached through a tunnel, without touching the mouth of the sinkhole. At that time it received around 15,000 visitors a year.\n\nOn Easter Monday, Oliete goes up on pilgrimage to the San Pedro hermitage, and the country lunch is held right here."}],"fr":[{"h":"Le paysage","t":"Le gouffre est d'origine karstique : l'eau a peu à peu dissous la roche jusqu'à ouvrir un puits d'environ 80 mètres de diamètre. De l'ouverture, il y a quelque 86 mètres jusqu'à la surface d'un lac lui-même profond d'environ 22 mètres. Le lac contient plus d'un demi-million de mètres cubes et il est alimenté par le ruissellement du ravin et par l'eau souterraine du Martín.\n\nPlus de 25 espèces de vertébrés trouvent refuge dans ses parois : pigeons bisets, craves à bec rouge et moineaux soulcies y nichent, et jusqu'à sept espèces de chauves-souris y vivent. Près du chemin d'accès pousse un genévrier thurifère, arbre rare dans le bassin du Martín."},{"h":"Pour comprendre","t":"Le balcon actuel a été construit pour la spéléologie, pas pour le tourisme. En 2021, la comarca et le Parc culturel du Río Martín ont présenté le projet d'un belvédère panoramique accessible par un tunnel, sans toucher à l'ouverture du gouffre. Il recevait alors environ 15 000 visiteurs par an.\n\nLe lundi de Pâques, Oliete monte en pèlerinage à l'ermitage de San Pedro et le repas champêtre se tient ici même."}],"de":[{"h":"Die Landschaft","t":"Die Doline ist karstischen Ursprungs: Wasser hat den Fels nach und nach aufgelöst, bis sich ein Schacht von etwa 80 Metern Durchmesser öffnete. Von der Öffnung geht es rund 86 Meter hinab bis zur Oberfläche eines Sees, der selbst etwa 22 Meter tief ist. Der See fasst mehr als eine halbe Million Kubikmeter und wird vom Oberflächenwasser der Schlucht und vom Grundwasser des Río Martín gespeist.\n\nIn den Wänden finden mehr als 25 Wirbeltierarten Unterschlupf: Felsentauben, Alpenkrähen und Steinsperlinge nisten hier, und bis zu sieben Fledermausarten leben in der Doline. Am Zugangsweg wächst ein Spanischer Wacholder, ein im Einzugsgebiet des Martín seltener Baum."},{"h":"Zum Verständnis","t":"Der bestehende Balkon wurde für die Höhlenforschung gebaut, nicht für den Tourismus. 2021 stellten die Comarca und der Kulturpark Río Martín das Projekt eines Panoramaaussichtspunkts vor, der über einen Tunnel erreichbar sein und die Öffnung der Doline unberührt lassen sollte. Damals kamen rund 15.000 Besucher im Jahr.\n\nAm Ostermontag pilgert Oliete zur Einsiedelei San Pedro, und das Picknick findet genau hier statt."}],"pt":[{"h":"A paisagem","t":"O algar é de origem cársica: a água foi dissolvendo a rocha até abrir um poço com cerca de 80 metros de diâmetro. Da boca há uns 86 metros até à superfície de um lago que, por sua vez, tem cerca de 22 metros de profundidade. O lago guarda mais de meio milhão de metros cúbicos e é alimentado pela escorrência do barranco e por água subterrânea do rio Martín.\n\nNas suas paredes abrigam-se mais de 25 espécies de vertebrados: nidificam pombos-das-rochas, gralhas-de-bico-vermelho e pardais-francês, e vivem até sete espécies de morcegos. Perto do caminho de acesso cresce um zimbro-turífero, árvore rara na bacia do Martín."},{"h":"Para perceber","t":"A varanda que existe foi construída para a espeleologia, não para o turismo. Em 2021, a comarca e o Parque Cultural do Rio Martín apresentaram o projeto de um miradouro panorâmico acessível por um túnel, sem tocar na boca do algar. Na altura recebia cerca de 15 000 visitantes por ano.\n\nNa segunda-feira de Páscoa, Oliete sobe em romaria à ermida de San Pedro e o almoço campestre faz-se precisamente aqui."}]},"status":"pending"},{"id":"cueva-foradada","town":"Oliete","cat":"hidraulico","lat":40.98733,"lon":-0.69266,"coord_src":null,"q":["Embalse de Cueva Foradada, Oliete","Presa de Cueva Foradada"],"fq":["Embalse de Cueva Foradada","Cueva Foradada Oliete","Pantano Cueva Foradada"],"name":{"es":"Pantano de la Cueva Foradada","en":"Cueva Foradada Reservoir","fr":"Retenue de la Cueva Foradada","de":"Stausee Cueva Foradada","pt":"Albufeira da Cueva Foradada"},"when":{"es":"1903-1927 · Presa en el cañón del Martín","en":"1903-1927 · Dam in the Martín gorge","fr":"1903-1927 · Barrage dans le canyon du Martín","de":"1903-1927 · Staumauer in der Martín-Schlucht","pt":"1903-1927 · Barragem no desfiladeiro do Martín"},"desc":{"es":"Una presa de principios del siglo XX que cierra el cañón del río Martín cerca de Oliete. El agua, la roca y los buitres que planean sobre ella forman un paisaje que resume el valle del Martín.","en":"An early 20th-century dam closing the gorge of the River Martín near Oliete. Water, rock and the vultures gliding above form a landscape that sums up the Martín valley.","fr":"Un barrage du début du XXe siècle qui ferme le canyon du Martín près d'Oliete. L'eau, la roche et les vautours qui planent au-dessus composent un paysage qui résume la vallée du Martín.","de":"Eine Staumauer vom Anfang des 20. Jahrhunderts, die die Schlucht des Río Martín bei Oliete abriegelt. Wasser, Fels und die darüber kreisenden Geier ergeben ein Bild, das das Martín-Tal zusammenfasst.","pt":"Uma barragem do início do século XX que fecha o desfiladeiro do rio Martín perto de Oliete. A água, a rocha e os abutres que planam por cima formam uma paisagem que resume o vale do Martín."},"visit":{"es":"Está en el término de Oliete. Disfruta de las vistas del cañón desde los caminos y respeta las zonas de la presa cerradas al público. En verano la comarca incluye el pantano en una visita guiada junto con la Sima de San Pedro.","en":"It lies within the municipality of Oliete. Enjoy the views of the gorge from the paths and keep out of the dam areas that are closed to the public. In summer the comarca includes the reservoir in a guided tour together with the San Pedro sinkhole.","fr":"Elle se trouve sur la commune d'Oliete. Profitez des vues sur le canyon depuis les chemins et respectez les zones du barrage fermées au public. En été, la comarca inclut la retenue dans une visite guidée avec le gouffre de San Pedro.","de":"Er liegt im Gemeindegebiet von Oliete. Genießen Sie den Blick auf die Schlucht von den Wegen aus und betreten Sie keine für die Öffentlichkeit gesperrten Bereiche der Staumauer. Im Sommer bietet die Comarca eine Führung an, die den Stausee mit der Doline San Pedro verbindet.","pt":"Fica no concelho de Oliete. Aprecie as vistas do desfiladeiro a partir dos caminhos e respeite as zonas da barragem fechadas ao público. No verão, a comarca inclui a albufeira numa visita guiada juntamente com o algar de San Pedro."},"src":"https://es.hispanopedia.com/wiki/Oliete","sources":["https://www.iagua.es/data/infraestructuras/embalses/cueva-foradada","https://www.lacomarca.net/se-inicia-compleja-reparacion-toma-flotante-cueva-foradada/","https://www.lacomarca.net/parque-cultural-rio-martin-25-anos-compromiso-patrimonio-territorio/amp/"],"art":{"es":[{"h":"Historia","t":"El embalse de Cueva Foradada se construyó entre 1903 y 1927 para represar el río Martín. Fueron más de veinte años de obra en un cañón encajado entre paredes de roca.\n\nPertenece a la cuenca del Ebro y la Confederación Hidrográfica del Ebro hace un seguimiento periódico de sus aguas. Como toda presa centenaria, necesita cuidados: en los últimos años se ha reparado su toma flotante."},{"h":"El paisaje","t":"El pantano llena un tramo del cañón del Martín, donde el río ha cortado la sierra. Las orillas son refugio de buitres, águilas y cabras montesas, que se dejan ver con paciencia y unos prismáticos.\n\nEste valle forma parte del Parque Cultural del Río Martín, creado en 1995, que reúne arte rupestre, poblados íberos y paisajes como este en nueve municipios de tres comarcas. Desde la presa se entiende bien por qué el Martín ha sido, durante siglos, la columna vertebral de esta tierra. En el mismo término de Oliete están la fortaleza íbera y la sima de San Pedro, así que el pantano se combina bien con ellas en una misma jornada."}],"en":[{"h":"History","t":"The Cueva Foradada reservoir was built between 1903 and 1927 to dam the River Martín. It took more than twenty years of work in a gorge hemmed in by walls of rock.\n\nIt belongs to the Ebro basin, and the Ebro Hydrographic Confederation regularly monitors its water. Like any century-old dam it needs care: in recent years its floating intake has been repaired."},{"h":"The landscape","t":"The reservoir fills a stretch of the Martín gorge, where the river has cut through the range. Its banks are a refuge for vultures, eagles and Iberian ibex, which you can spot with patience and a pair of binoculars.\n\nThis valley is part of the Río Martín Cultural Park, created in 1995, which brings together rock art, Iberian villages and landscapes like this one across nine municipalities in three comarcas. From the dam it is easy to see why the Martín has been the backbone of this land for centuries. The Iberian fortress and the San Pedro sinkhole are in the same municipality of Oliete, so the reservoir combines well with them in a single day."}],"fr":[{"h":"Histoire","t":"La retenue de la Cueva Foradada a été construite entre 1903 et 1927 pour barrer le Martín. Il a fallu plus de vingt ans de travaux dans un canyon encaissé entre des parois rocheuses.\n\nElle appartient au bassin de l'Èbre, et la Confédération hydrographique de l'Èbre surveille régulièrement ses eaux. Comme tout barrage centenaire, il demande de l'entretien : ces dernières années, sa prise d'eau flottante a été réparée."},{"h":"Le paysage","t":"La retenue remplit un tronçon du canyon du Martín, là où la rivière a entaillé la sierra. Ses rives servent de refuge aux vautours, aux aigles et aux bouquetins ibériques, que l'on peut apercevoir avec de la patience et des jumelles.\n\nCette vallée fait partie du Parc culturel du Río Martín, créé en 1995, qui réunit art rupestre, villages ibères et paysages comme celui-ci dans neuf communes de trois comarcas. Depuis le barrage, on comprend bien pourquoi le Martín est depuis des siècles la colonne vertébrale de cette terre. La forteresse ibère et le gouffre de San Pedro se trouvent sur la même commune d'Oliete : la retenue se combine donc bien avec eux en une seule journée."}],"de":[{"h":"Geschichte","t":"Der Stausee Cueva Foradada wurde zwischen 1903 und 1927 errichtet, um den Río Martín aufzustauen. Mehr als zwanzig Jahre wurde in einer engen, von Felswänden eingefassten Schlucht gebaut.\n\nEr gehört zum Einzugsgebiet des Ebro, und die Ebro-Flussgebietsbehörde überwacht regelmäßig sein Wasser. Wie jede hundertjährige Staumauer braucht er Pflege: In den letzten Jahren wurde seine schwimmende Wasserentnahme repariert."},{"h":"Die Landschaft","t":"Der Stausee füllt einen Abschnitt der Martín-Schlucht, wo der Fluss das Gebirge durchschnitten hat. Seine Ufer sind Zufluchtsort für Geier, Adler und Iberiensteinböcke, die man mit etwas Geduld und einem Fernglas entdecken kann.\n\nDas Tal gehört zum 1995 gegründeten Kulturpark Río Martín, der Felskunst, iberische Siedlungen und Landschaften wie diese in neun Gemeinden aus drei Comarcas vereint. Von der Staumauer aus versteht man gut, warum der Martín seit Jahrhunderten das Rückgrat dieser Gegend ist. Die iberische Festung und die Doline San Pedro liegen in derselben Gemeinde Oliete, sodass sich der Stausee gut mit ihnen an einem Tag verbinden lässt."}],"pt":[{"h":"História","t":"A albufeira da Cueva Foradada foi construída entre 1903 e 1927 para represar o rio Martín. Foram mais de vinte anos de obra num desfiladeiro apertado entre paredes de rocha.\n\nPertence à bacia do Ebro, e a Confederação Hidrográfica do Ebro faz um acompanhamento periódico das suas águas. Como qualquer barragem centenária, precisa de cuidados: nos últimos anos foi reparada a sua tomada de água flutuante."},{"h":"A paisagem","t":"A albufeira enche um troço do desfiladeiro do Martín, onde o rio cortou a serra. As margens são refúgio de abutres, águias e cabras-monteses, que se deixam ver com paciência e uns binóculos.\n\nEste vale faz parte do Parque Cultural do Rio Martín, criado em 1995, que reúne arte rupestre, povoados iberos e paisagens como esta em nove municípios de três comarcas. Da barragem percebe-se bem porque é que o Martín tem sido, há séculos, a espinha dorsal desta terra. No mesmo concelho de Oliete ficam a fortaleza ibera e o algar de San Pedro, por isso a albufeira combina bem com eles num só dia."}]},"status":"pending"},{"id":"arte-rupestre-alacon","town":"Alacón","cat":"arqueologia","lat":41.06363,"lon":-0.70433,"coord_src":null,"q":["Barranco del Mortero, Alacón","Cerro Felío, Alacón","Mirador del Barranco del Mortero, Alacón"],"fq":["Barranco del Mortero Alacón","Cerro Felío Alacón","Alacón arte rupestre"],"name":{"es":"Abrigos del Barranco del Mortero y Cerro Felío","en":"Barranco del Mortero and Cerro Felío Rock Shelters","fr":"Abris du Barranco del Mortero et du Cerro Felío","de":"Felsdächer im Barranco del Mortero und am Cerro Felío","pt":"Abrigos do Barranco del Mortero e do Cerro Felío"},"when":{"es":"Arte rupestre · Patrimonio Mundial desde 1998","en":"Rock art · World Heritage since 1998","fr":"Art rupestre · Patrimoine mondial depuis 1998","de":"Felskunst · Welterbe seit 1998","pt":"Arte rupestre · Património Mundial desde 1998"},"desc":{"es":"En los barrancos de Alacón se conservan abrigos con pinturas prehistóricas que forman parte del arte rupestre del arco mediterráneo, Patrimonio Mundial. Un mirador accesible asoma a la cabecera del Barranco del Mortero.","en":"The ravines of Alacón hold rock shelters with prehistoric paintings that belong to the rock art of the Mediterranean Basin, a World Heritage Site. An accessible viewpoint looks over the head of the Barranco del Mortero.","fr":"Les ravins d'Alacón conservent des abris ornés de peintures préhistoriques qui appartiennent à l'art rupestre du bassin méditerranéen, inscrit au Patrimoine mondial. Un belvédère accessible donne sur la tête du Barranco del Mortero.","de":"In den Schluchten von Alacón sind Felsdächer mit prähistorischen Malereien erhalten, die zur Felskunst im Mittelmeerraum der Iberischen Halbinsel gehören, einem Welterbe. Ein barrierefreier Aussichtspunkt blickt auf den Beginn des Barranco del Mortero.","pt":"Nos barrancos de Alacón conservam-se abrigos com pinturas pré-históricas que fazem parte da arte rupestre do arco mediterrânico, Património Mundial. Um miradouro acessível debruça-se sobre a cabeceira do Barranco del Mortero."},"visit":{"es":"Los abrigos están protegidos y se visitan con guía y reserva previa a través del Parque Cultural del Río Martín, cuya sede es el Centro de Arte Rupestre Antonio Beltrán, en Ariño. El mirador del Barranco del Mortero, junto a la carretera TE-V-1101, es de acceso libre y está adaptado. La app 'Parque Cultural del Río Martín: Arte Rupestre' ayuda a ver las pinturas.","en":"The shelters are protected and can be visited with a guide and by prior booking through the Río Martín Cultural Park, whose headquarters is the Antonio Beltrán Rock Art Centre in Ariño. The Barranco del Mortero viewpoint, beside the TE-V-1101 road, is freely accessible and adapted. The 'Parque Cultural del Río Martín: Arte Rupestre' app helps you see the paintings.","fr":"Les abris sont protégés et se visitent avec un guide et sur réservation auprès du Parc culturel du Río Martín, dont le siège est le Centre d'art rupestre Antonio Beltrán, à Ariño. Le belvédère du Barranco del Mortero, au bord de la route TE-V-1101, est en accès libre et adapté. L'application « Parque Cultural del Río Martín: Arte Rupestre » aide à voir les peintures.","de":"Die Felsdächer sind geschützt und nur mit Führung und Voranmeldung über den Kulturpark Río Martín zu besichtigen, dessen Sitz das Felskunstzentrum Antonio Beltrán in Ariño ist. Der Aussichtspunkt am Barranco del Mortero an der Straße TE-V-1101 ist frei zugänglich und barrierefrei. Die App „Parque Cultural del Río Martín: Arte Rupestre“ hilft, die Malereien zu erkennen.","pt":"Os abrigos estão protegidos e visitam-se com guia e marcação prévia através do Parque Cultural do Rio Martín, cuja sede é o Centro de Arte Rupestre Antonio Beltrán, em Ariño. O miradouro do Barranco del Mortero, junto à estrada TE-V-1101, é de acesso livre e adaptado. A app 'Parque Cultural del Río Martín: Arte Rupestre' ajuda a ver as pinturas."},"src":"https://www.prehistour.eu/portfolio-item/abrigos-rupestres-del-parque-cultural-del-rio-martin/","sources":["https://masterturismo.unizar.es/wp-content/uploads/2023/10/SALIDA-DE-CAMPO-PARQUE-CULTURAL-RIO-MARTIN.pdf","https://www.lacomarca.net/reportajes/miradores-mas-imponentes-andorra-sierra-arcos/","https://www.lacomarca.net/los-abrigos-del-parque-cultural-del-rio-martin-en-realidad-aumentada-en-una-app/","https://es.hispanopedia.com/wiki/Alac%C3%B3n"],"art":{"es":[{"h":"Historia","t":"A partir de 1947, César Gasca dio a conocer las pinturas de la cabecera del Barranco del Mortero y del Cerro Felío. Desde entonces se han documentado en el Parque Cultural del Río Martín más de 52 abrigos con arte rupestre, y unos veinte han necesitado protección física.\n\nEn el Barranco del Mortero están, entre otros, la Covacha Ahumada, el Abrigo de los Trepadores y el Abrigo de los Borriquitos. Sus pinturas entraron en 1998 en la lista de Patrimonio Mundial de la UNESCO dentro del arte rupestre del arco mediterráneo."},{"h":"Para entenderlo","t":"En el parque conviven dos estilos. El levantino, de figuras humanas y animales en movimiento, se fecha aproximadamente entre hace 9.000 y 4.500 años. El esquemático, con signos y figuras muy simplificadas, entre hace 5.000 y 3.500 años.\n\nLa app de realidad aumentada del parque permite ampliar las pinturas o ver los calcos cuando la luz no ayuda. Desde el mirador del Mortero, el único de la comarca adaptado a personas con movilidad reducida, se ve el barranco y las bodegas excavadas en la roca. En la ladera norte del pueblo se cuentan unas quinientas, donde se elaboraba y guardaba el vino."}],"en":[{"h":"History","t":"From 1947 onwards, César Gasca made known the paintings at the head of the Barranco del Mortero and on Cerro Felío. Since then more than 52 shelters with rock art have been recorded in the Río Martín Cultural Park, and around twenty have needed physical protection.\n\nThe Barranco del Mortero includes, among others, the Covacha Ahumada, the Abrigo de los Trepadores and the Abrigo de los Borriquitos. In 1998 their paintings were added to the UNESCO World Heritage List as part of the rock art of the Mediterranean Basin."},{"h":"Understanding it","t":"Two styles exist side by side in the park. Levantine art, with human figures and animals in motion, dates roughly from 9,000 to 4,500 years ago. Schematic art, with signs and highly simplified figures, from 5,000 to 3,500 years ago.\n\nThe park's augmented-reality app lets you enlarge the paintings or see the tracings when the light is poor. From the Mortero viewpoint, the only one in the comarca adapted for people with reduced mobility, you can see the ravine and the cellars dug into the rock. Some five hundred line the northern slope of the village, where wine was made and stored."}],"fr":[{"h":"Histoire","t":"À partir de 1947, César Gasca a fait connaître les peintures de la tête du Barranco del Mortero et du Cerro Felío. Depuis, plus de 52 abris ornés ont été documentés dans le Parc culturel du Río Martín, et une vingtaine ont dû être protégés physiquement.\n\nLe Barranco del Mortero compte, entre autres, la Covacha Ahumada, l'Abrigo de los Trepadores et l'Abrigo de los Borriquitos. En 1998, leurs peintures ont été inscrites sur la Liste du patrimoine mondial de l'UNESCO au sein de l'art rupestre du bassin méditerranéen."},{"h":"Pour comprendre","t":"Deux styles coexistent dans le parc. L'art levantin, avec des figures humaines et des animaux en mouvement, date approximativement d'il y a 9 000 à 4 500 ans. L'art schématique, avec des signes et des figures très simplifiées, d'il y a 5 000 à 3 500 ans.\n\nL'application de réalité augmentée du parc permet d'agrandir les peintures ou de voir les relevés quand la lumière ne s'y prête pas. Depuis le belvédère du Mortero, le seul de la comarca adapté aux personnes à mobilité réduite, on voit le ravin et les caves creusées dans la roche. On en compte environ cinq cents sur le versant nord du village, où l'on faisait et conservait le vin."}],"de":[{"h":"Geschichte","t":"Ab 1947 machte César Gasca die Malereien am oberen Barranco del Mortero und am Cerro Felío bekannt. Seitdem wurden im Kulturpark Río Martín mehr als 52 Felsdächer mit Felskunst dokumentiert, und rund zwanzig mussten baulich geschützt werden.\n\nIm Barranco del Mortero liegen unter anderem die Covacha Ahumada, der Abrigo de los Trepadores und der Abrigo de los Borriquitos. 1998 wurden ihre Malereien als Teil der Felskunst im Mittelmeerraum der Iberischen Halbinsel in die UNESCO-Welterbeliste aufgenommen."},{"h":"Zum Verständnis","t":"Im Park gibt es zwei Stile. Die levantinische Kunst mit Menschen und Tieren in Bewegung wird etwa auf 9.000 bis 4.500 Jahre vor heute datiert. Die schematische Kunst mit Zeichen und stark vereinfachten Figuren auf 5.000 bis 3.500 Jahre vor heute.\n\nMit der Augmented-Reality-App des Parks lassen sich die Malereien vergrößern oder die Umzeichnungen ansehen, wenn das Licht nicht reicht. Vom Aussichtspunkt am Mortero, dem einzigen der Comarca, der für Menschen mit eingeschränkter Mobilität angepasst ist, sieht man die Schlucht und die in den Fels gehauenen Keller. Am Nordhang des Dorfes zählt man rund fünfhundert, in denen Wein gekeltert und gelagert wurde."}],"pt":[{"h":"História","t":"A partir de 1947, César Gasca deu a conhecer as pinturas da cabeceira do Barranco del Mortero e do Cerro Felío. Desde então documentaram-se no Parque Cultural do Rio Martín mais de 52 abrigos com arte rupestre, e cerca de vinte precisaram de proteção física.\n\nNo Barranco del Mortero ficam, entre outros, a Covacha Ahumada, o Abrigo de los Trepadores e o Abrigo de los Borriquitos. Em 1998 as suas pinturas entraram na Lista do Património Mundial da UNESCO, integradas na arte rupestre do arco mediterrânico."},{"h":"Para perceber","t":"No parque convivem dois estilos. O levantino, com figuras humanas e animais em movimento, data aproximadamente de há 9000 a 4500 anos. O esquemático, com sinais e figuras muito simplificadas, de há 5000 a 3500 anos.\n\nA app de realidade aumentada do parque permite ampliar as pinturas ou ver os decalques quando a luz não ajuda. Do miradouro do Mortero, o único da comarca adaptado a pessoas com mobilidade reduzida, vê-se o barranco e as adegas escavadas na rocha. Na encosta norte da aldeia contam-se cerca de quinhentas, onde se fazia e guardava o vinho."}]},"status":"pending"},{"id":"valcaria","town":"Ariño","cat":"museo","lat":41.02685,"lon":-0.58888,"coord_src":null,"q":["Valcaria, Ariño","Dinópolis Valcaria, Ariño, Teruel"],"fq":["Valcaria Ariño Dinópolis","Europelta carbonensis","Proa valdearinnoensis"],"name":{"es":"Valcaria · Dinosaurios de Ariño","en":"Valcaria · The Dinosaurs of Ariño","fr":"Valcaria · Les dinosaures d'Ariño","de":"Valcaria · Die Dinosaurier von Ariño","pt":"Valcaria · Os dinossauros de Ariño"},"when":{"es":"110 millones de años · Centro abierto en 2015","en":"110 million years ago · Centre opened in 2015","fr":"110 millions d'années · Centre ouvert en 2015","de":"110 Millionen Jahre · Zentrum seit 2015","pt":"110 milhões de anos · Centro aberto em 2015"},"desc":{"es":"La mina de carbón de Ariño sacó a la luz miles de fósiles de dinosaurios y otros animales del Cretácico. Valcaria, sede de Territorio Dinópolis, cuenta esa historia con reconstrucciones a escala.","en":"Ariño's coal mine brought to light thousands of fossils of dinosaurs and other Cretaceous animals. Valcaria, a Territorio Dinópolis centre, tells the story with scale reconstructions.","fr":"La mine de charbon d'Ariño a mis au jour des milliers de fossiles de dinosaures et d'autres animaux du Crétacé. Valcaria, centre de Territorio Dinópolis, raconte cette histoire avec des reconstitutions à l'échelle.","de":"Das Kohlebergwerk von Ariño brachte Tausende Fossilien von Dinosauriern und anderen Tieren der Kreidezeit ans Licht. Valcaria, ein Zentrum von Territorio Dinópolis, erzählt diese Geschichte mit maßstabsgetreuen Rekonstruktionen.","pt":"A mina de carvão de Ariño trouxe à luz milhares de fósseis de dinossauros e de outros animais do Cretácico. Valcaria, centro do Territorio Dinópolis, conta essa história com reconstituições à escala."},"visit":{"es":"Es uno de los centros de Territorio Dinópolis y abre según su calendario de temporada. Consulta fechas y entradas en Dinópolis (978 617 715) o en la oficina de turismo comarcal antes de ir.","en":"It is one of the Territorio Dinópolis centres and opens according to its seasonal calendar. Check dates and tickets with Dinópolis (978 617 715) or the comarca tourist office before you go.","fr":"C'est l'un des centres de Territorio Dinópolis ; il ouvre selon son calendrier de saison. Vérifiez dates et billets auprès de Dinópolis (978 617 715) ou de l'office de tourisme de la comarca avant de partir.","de":"Es ist eines der Zentren von Territorio Dinópolis und öffnet nach einem saisonalen Kalender. Termine und Eintritt vorab bei Dinópolis (978 617 715) oder im Tourismusbüro der Comarca erfragen.","pt":"É um dos centros do Territorio Dinópolis e abre segundo o seu calendário de temporada. Confirme datas e bilhetes na Dinópolis (978 617 715) ou no posto de turismo da comarca antes de ir."},"src":"https://fundaciondinopolis.org/wp-content/uploads/2025/05/fundamental-36-provincia-de-teruel-un-museo-paleontologico-83e.pdf","sources":["https://www.publico.es/ciencias/mina-dinosaurios.html","https://www.pa-community.com/articulos/dinopolis-estrena-la-proxima-temporada-un-nuevo-centro-y-un-nuevo-espectaculo","https://en.wikipedia.org/wiki/Proa_valdearinnoensis","https://www.turismodearagon.com/ficha/territorio-dinopolis/"],"art":{"es":[{"h":"Historia","t":"En la mina Santa María de Ariño, explotada a cielo abierto por el grupo SAMCA, los paleontólogos de la Fundación Dinópolis identificaron hacia 2010 varios niveles con fósiles. En pocos años recuperaron unos 7.000 restos repartidos en 121 concentraciones, de hace unos 110 millones de años.\n\nAllí aparecieron especies nuevas para la ciencia, como el anquilosaurio Europelta carbonensis, de unos 4,5 metros, y el iguanodontio Proa valdearinnoensis, de unos 8. Proa se describió en 2012: su nombre alude a la forma de proa de un hueso de la mandíbula, y el apellido, a Val de Ariño, nombre tradicional de las minas."},{"h":"Qué ver","t":"Valcaria se inauguró en 2015. Sus diez espacios recrean la vegetación y la fauna de hace unos 111 millones de años con reconstrucciones a distintas escalas, maquetas, paneles e interactivos sobre los fósiles sacados del carbón.\n\nDestacan las reconstrucciones de Europelta y el espacio dedicado a Proa, además de una zona que recrea el interior de una mina. Un audiovisual muestra el trabajo de los paleontólogos en la mina Santa María. Cerca del centro hay un yacimiento de huellas de dinosaurio."}],"en":[{"h":"History","t":"At the Santa María mine in Ariño, worked as an open-cast pit by the SAMCA group, palaeontologists from the Fundación Dinópolis identified several fossil-bearing layers around 2010. Within a few years they had recovered some 7,000 remains from 121 concentrations, around 110 million years old.\n\nSpecies new to science turned up there, such as the ankylosaur Europelta carbonensis, about 4.5 metres long, and the iguanodontian Proa valdearinnoensis, about 8 metres. Proa was described in 2012: its name refers to the prow-like shape of a jaw bone, and its species name to Val de Ariño, the traditional name of the mines."},{"h":"What to see","t":"Valcaria opened in 2015. Its ten areas recreate the plants and animals of some 111 million years ago with reconstructions at different scales, models, panels and interactive displays about the fossils taken from the coal.\n\nHighlights include the reconstructions of Europelta and the space devoted to Proa,
