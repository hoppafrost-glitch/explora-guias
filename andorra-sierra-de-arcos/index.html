 as well as an area recreating the inside of a mine. An audiovisual shows the palaeontologists at work in the Santa María mine. Near the centre there is a dinosaur footprint site."}],"fr":[{"h":"Histoire","t":"Dans la mine Santa María d'Ariño, exploitée à ciel ouvert par le groupe SAMCA, les paléontologues de la Fondation Dinópolis ont identifié vers 2010 plusieurs niveaux fossilifères. En quelques années, ils ont récupéré environ 7 000 restes répartis en 121 concentrations, vieux d'environ 110 millions d'années.\n\nDes espèces nouvelles pour la science y sont apparues, comme l'ankylosaure Europelta carbonensis, d'environ 4,5 mètres, et l'iguanodontien Proa valdearinnoensis, d'environ 8 mètres. Proa a été décrit en 2012 : son nom évoque la forme de proue d'un os de la mâchoire, et son nom d'espèce Val de Ariño, nom traditionnel des mines."},{"h":"À voir","t":"Valcaria a ouvert en 2015. Ses dix espaces recréent la végétation et la faune d'il y a environ 111 millions d'années avec des reconstitutions à différentes échelles, des maquettes, des panneaux et des dispositifs interactifs sur les fossiles extraits du charbon.\n\nOn remarque les reconstitutions d'Europelta et l'espace consacré à Proa, ainsi qu'une zone qui recrée l'intérieur d'une mine. Un audiovisuel montre le travail des paléontologues dans la mine Santa María. Près du centre se trouve un site d'empreintes de dinosaures."}],"de":[{"h":"Geschichte","t":"In der Mine Santa María in Ariño, die die SAMCA-Gruppe im Tagebau betrieb, entdeckten Paläontologen der Fundación Dinópolis um 2010 mehrere fossilführende Schichten. Innerhalb weniger Jahre bargen sie rund 7.000 Überreste aus 121 Fundkonzentrationen, etwa 110 Millionen Jahre alt.\n\nDort tauchten für die Wissenschaft neue Arten auf, etwa der Ankylosaurier Europelta carbonensis, rund 4,5 Meter lang, und der Iguanodontier Proa valdearinnoensis, rund 8 Meter. Proa wurde 2012 beschrieben: Der Name spielt auf die bugförmige Gestalt eines Kieferknochens an (proa bedeutet Bug), der Artname auf Val de Ariño, den traditionellen Namen der Minen."},{"h":"Sehenswert","t":"Valcaria wurde 2015 eröffnet. Seine zehn Bereiche lassen Pflanzen und Tiere von vor etwa 111 Millionen Jahren mit Rekonstruktionen in verschiedenen Maßstäben, Modellen, Tafeln und interaktiven Stationen zu den Fossilien aus der Kohle wiederaufleben.\n\nBesonders sind die Rekonstruktionen von Europelta und der Bereich zu Proa sowie ein Raum, der das Innere eines Bergwerks nachbildet. Ein Film zeigt die Paläontologen bei der Arbeit in der Mine Santa María. In der Nähe des Zentrums gibt es eine Fundstelle mit Dinosaurierspuren."}],"pt":[{"h":"História","t":"Na mina Santa María de Ariño, explorada a céu aberto pelo grupo SAMCA, os paleontólogos da Fundação Dinópolis identificaram por volta de 2010 vários níveis com fósseis. Em poucos anos recuperaram cerca de 7000 restos, distribuídos por 121 concentrações, com cerca de 110 milhões de anos.\n\nAli surgiram espécies novas para a ciência, como o anquilossauro Europelta carbonensis, com cerca de 4,5 metros, e o iguanodonte Proa valdearinnoensis, com cerca de 8. Proa foi descrito em 2012: o nome alude à forma de proa de um osso da mandíbula, e o nome da espécie a Val de Ariño, nome tradicional das minas."},{"h":"O que ver","t":"Valcaria foi inaugurado em 2015. Os seus dez espaços recriam a vegetação e a fauna de há cerca de 111 milhões de anos com reconstituições a várias escalas, maquetas, painéis e interativos sobre os fósseis retirados do carvão.\n\nDestacam-se as reconstituições de Europelta e o espaço dedicado a Proa, além de uma zona que recria o interior de uma mina. Um audiovisual mostra o trabalho dos paleontólogos na mina Santa María. Perto do centro há uma jazida de pegadas de dinossauro."}]},"status":"pending"},{"id":"balneario-arino","town":"Ariño","cat":"hidraulico","lat":41.04676,"lon":-0.58372,"coord_src":null,"q":["Balneario de Ariño","Carretera Ariño-Albalate km 2, Ariño"],"fq":["Balneario de Ariño","Ariño balneario Teruel"],"name":{"es":"Balneario de Ariño","en":"Ariño Spa","fr":"Station thermale d'Ariño","de":"Thermalbad Ariño","pt":"Termas de Ariño"},"when":{"es":"Aguas termales · Abierto en la década de 2010","en":"Thermal waters · Opened in the 2010s","fr":"Eaux thermales · Ouverte dans les années 2010","de":"Thermalwasser · Eröffnet in den 2010er Jahren","pt":"Águas termais · Abertas na década de 2010"},"desc":{"es":"Un balneario de aguas termales en el valle del Martín, al pie de la Sierra de Arcos. Nació como apuesta de Ariño para encontrar un futuro más allá de la mina.","en":"A thermal spa in the Martín valley, at the foot of the Sierra de Arcos. It was born as Ariño's bet on finding a future beyond the mine.","fr":"Une station thermale dans la vallée du Martín, au pied de la Sierra de Arcos. Elle est née du pari d'Ariño de trouver un avenir au-delà de la mine.","de":"Ein Thermalbad im Tal des Martín am Fuß der Sierra de Arcos. Es entstand als Versuch Ariños, eine Zukunft jenseits des Bergbaus zu finden.","pt":"Umas termas de águas termais no vale do Martín, ao pé da Sierra de Arcos. Nasceram como aposta de Ariño para encontrar um futuro para além da mina."},"visit":{"es":"Está en la carretera de Ariño a Albalate, en el kilómetro 2. Es un hotel balneario: el circuito termal y los tratamientos se reservan antes (978 077 077). En el término de Ariño están también los manantiales de Los Baños.","en":"It is on the Ariño to Albalate road, at kilometre 2. It is a spa hotel: the thermal circuit and treatments must be booked in advance (978 077 077). The Los Baños springs are also within the municipality of Ariño.","fr":"Elle se trouve sur la route d'Ariño à Albalate, au kilomètre 2. C'est un hôtel thermal : le circuit thermal et les soins se réservent à l'avance (978 077 077). Les sources de Los Baños se trouvent aussi sur la commune d'Ariño.","de":"Es liegt an der Straße von Ariño nach Albalate, bei Kilometer 2. Es ist ein Kurhotel: Thermalbereich und Anwendungen vorab reservieren (978 077 077). Im Gemeindegebiet von Ariño liegen auch die Quellen von Los Baños.","pt":"Ficam na estrada de Ariño para Albalate, ao quilómetro 2. É um hotel termal: o circuito termal e os tratamentos reservam-se com antecedência (978 077 077). No concelho de Ariño ficam também as nascentes de Los Baños."},"src":"https://www.spain.info/es/balneario/arino/","sources":["https://www.lacomarca.net/arino-apuesta-valor-local-para-superar-fin-mineria/","https://masterturismo.unizar.es/wp-content/uploads/2023/10/SALIDA-DE-CAMPO-PARQUE-CULTURAL-RIO-MARTIN.pdf"],"art":{"es":[{"h":"Historia","t":"Ariño vivió durante décadas del lignito. El proyecto del balneario arrancó en 2003 y empezó a funcionar a mediados de la década de 2010, primero en pruebas. A comienzos de 2019 cerraron las minas, y el balneario se convirtió en uno de los motores para diversificar la economía del pueblo.\n\nEn 2018 superó las 25.000 pernoctaciones y en 2019 daba trabajo a 55 personas, la mayoría de la comarca. Ese año logró una ayuda del Plan Miner para ampliar habitaciones y zona termal. Hoy la técnica de turismo de la comarca lo cita, junto al Monasterio del Olivar o Apadrinaunolivo, entre las novedades que han hecho crecer la oferta del territorio."},{"h":"El paisaje","t":"El edificio se abre al valle del Martín, abrazado por la Sierra de Arcos. En el mismo término, los manantiales de Los Baños son a la vez un punto de interés geológico y un lugar donde se ha documentado un asentamiento prehistórico del Epipaleolítico.\n\nEl balneario encaja con el lema del Plan de Sostenibilidad Turística de la comarca, 'Salud y Bienestar'. Desde aquí se puede seguir hacia el Centro de Arte Rupestre Antonio Beltrán, sede del Parque Cultural del Río Martín, o hacia los dinosaurios de Valcaria, ambos en Ariño."}],"en":[{"h":"History","t":"For decades Ariño lived off lignite. The spa project began in 2003 and started operating in the mid-2010s, at first on a trial basis. At the beginning of 2019 the mines closed, and the spa became one of the drivers for diversifying the village's economy.\n\nIn 2018 it exceeded 25,000 overnight stays, and in 2019 it employed 55 people, most of them from the comarca. That year it secured funding from the Plan Miner to add rooms and enlarge the thermal area. Today the comarca's tourism officer mentions it, alongside the Monasterio del Olivar and Apadrinaunolivo, among the new arrivals that have broadened what the area offers."},{"h":"The landscape","t":"The building opens onto the Martín valley, embraced by the Sierra de Arcos. In the same municipality, the Los Baños springs are both a site of geological interest and a place where an Epipalaeolithic prehistoric settlement has been recorded.\n\nThe spa fits the motto of the comarca's Sustainable Tourism Plan, 'Health and Wellbeing'. From here you can go on to the Antonio Beltrán Rock Art Centre, headquarters of the Río Martín Cultural Park, or to the dinosaurs of Valcaria, both in Ariño."}],"fr":[{"h":"Histoire","t":"Pendant des décennies, Ariño a vécu du lignite. Le projet de station thermale a démarré en 2003 et a commencé à fonctionner au milieu des années 2010, d'abord à l'essai. Début 2019, les mines ont fermé, et la station est devenue l'un des moteurs de la diversification de l'économie du village.\n\nEn 2018, elle a dépassé les 25 000 nuitées et, en 2019, elle employait 55 personnes, pour la plupart de la comarca. Cette année-là, elle a obtenu une aide du Plan Miner pour ajouter des chambres et agrandir l'espace thermal. Aujourd'hui, la technicienne du tourisme de la comarca la cite, avec le Monasterio del Olivar et Apadrinaunolivo, parmi les nouveautés qui ont enrichi l'offre du territoire."},{"h":"Le paysage","t":"Le bâtiment s'ouvre sur la vallée du Martín, enveloppé par la Sierra de Arcos. Sur la même commune, les sources de Los Baños sont à la fois un point d'intérêt géologique et un lieu où un habitat préhistorique de l'Épipaléolithique a été documenté.\n\nLa station s'accorde avec la devise du Plan de tourisme durable de la comarca, « Santé et bien-être ». D'ici, on peut poursuivre vers le Centre d'art rupestre Antonio Beltrán, siège du Parc culturel du Río Martín, ou vers les dinosaures de Valcaria, tous deux à Ariño."}],"de":[{"h":"Geschichte","t":"Jahrzehntelang lebte Ariño von der Braunkohle. Das Projekt des Thermalbads begann 2003, der Betrieb startete Mitte der 2010er Jahre, zunächst im Probebetrieb. Anfang 2019 schlossen die Minen, und das Bad wurde zu einem der Motoren, um die Wirtschaft des Dorfes breiter aufzustellen.\n\n2018 überschritt es 25.000 Übernachtungen, und 2019 beschäftigte es 55 Menschen, die meisten aus der Comarca. Im selben Jahr erhielt es Mittel aus dem Plan Miner, um Zimmer und Thermalbereich zu erweitern. Heute nennt die Tourismusfachfrau der Comarca es neben dem Monasterio del Olivar und Apadrinaunolivo unter den Neuheiten, die das Angebot der Gegend erweitert haben."},{"h":"Die Landschaft","t":"Das Gebäude öffnet sich zum Tal des Martín, umschlossen von der Sierra de Arcos. Im selben Gemeindegebiet sind die Quellen von Los Baños zugleich ein geologisch interessanter Ort und eine Stelle, an der eine prähistorische Siedlung aus dem Epipaläolithikum nachgewiesen wurde.\n\nDas Bad passt zum Motto des Plans für nachhaltigen Tourismus der Comarca, „Gesundheit und Wohlbefinden“. Von hier aus geht es weiter zum Felskunstzentrum Antonio Beltrán, Sitz des Kulturparks Río Martín, oder zu den Dinosauriern von Valcaria, beide in Ariño."}],"pt":[{"h":"História","t":"Durante décadas, Ariño viveu da lenhite. O projeto das termas arrancou em 2003 e começou a funcionar em meados da década de 2010, primeiro em período de testes. No início de 2019 as minas fecharam, e as termas tornaram-se um dos motores para diversificar a economia da aldeia.\n\nEm 2018 ultrapassaram as 25 000 dormidas e em 2019 empregavam 55 pessoas, a maioria da comarca. Nesse ano obtiveram um apoio do Plan Miner para ampliar quartos e zona termal. Hoje, a técnica de turismo da comarca cita-as, ao lado do Monasterio del Olivar e da Apadrinaunolivo, entre as novidades que fizeram crescer a oferta do território."},{"h":"A paisagem","t":"O edifício abre-se para o vale do Martín, abraçado pela Sierra de Arcos. No mesmo concelho, as nascentes de Los Baños são ao mesmo tempo um ponto de interesse geológico e um local onde se documentou um povoamento pré-histórico do Epipaleolítico.\n\nAs termas encaixam no lema do Plano de Sustentabilidade Turística da comarca, 'Saúde e Bem-estar'. Daqui pode seguir para o Centro de Arte Rupestre Antonio Beltrán, sede do Parque Cultural do Rio Martín, ou para os dinossauros de Valcaria, ambos em Ariño."}]},"status":"pending"},{"id":"monasterio-olivar","town":"Estercuel","cat":"patrimonio","lat":40.85283,"lon":-0.62938,"coord_src":null,"q":["Monasterio de El Olivar, Estercuel","Monasterio de Nuestra Señora del Olivar, Estercuel"],"fq":["Monasterio del Olivar Estercuel","Monasterio de El Olivar Teruel","Santa María del Olivar Estercuel"],"name":{"es":"Monasterio del Olivar","en":"El Olivar Monastery","fr":"Monastère d'El Olivar","de":"Kloster El Olivar","pt":"Mosteiro de El Olivar"},"when":{"es":"Mercedarios desde 1258 · Bien de Interés Cultural","en":"Mercedarians since 1258 · Heritage of Cultural Interest","fr":"Mercédaires depuis 1258 · Bien d'intérêt culturel","de":"Mercedarier seit 1258 · Kulturgut","pt":"Mercedários desde 1258 · Bem de Interesse Cultural"},"desc":{"es":"Un monasterio mercedario rodeado de pinares, a unos cuatro kilómetros de Estercuel. Tirso de Molina situó aquí su comedia 'La dama del Olivar' y hoy parte del edificio es una hospedería.","en":"A Mercedarian monastery surrounded by pine woods, about four kilometres from Estercuel. Tirso de Molina set his comedy 'La dama del Olivar' here, and today part of the building is a guesthouse.","fr":"Un monastère mercédaire entouré de pinèdes, à environ quatre kilomètres d'Estercuel. Tirso de Molina y a situé sa comédie « La dama del Olivar » et une partie du bâtiment est aujourd'hui une hôtellerie.","de":"Ein Mercedarierkloster inmitten von Kiefernwäldern, etwa vier Kilometer von Estercuel entfernt. Tirso de Molina siedelte hier seine Komödie „La dama del Olivar“ an, und heute ist ein Teil des Gebäudes ein Gästehaus.","pt":"Um mosteiro mercedário rodeado de pinhais, a cerca de quatro quilómetros de Estercuel. Tirso de Molina situou aqui a sua comédia 'La dama del Olivar' e hoje parte do edifício é uma hospedaria."},"visit":{"es":"Está a 4 km al norte de Estercuel por carretera. Parte del edificio funciona como hospedería; para visitar la iglesia y el claustro conviene llamar antes al monasterio (978 608 863). Desde aquí sale una pista al mirador de Moncoscol.","en":"It is 4 km north of Estercuel by road. Part of the building works as a guesthouse; to visit the church and cloister it is best to phone the monastery first (978 608 863). A track leads from here to the Moncoscol viewpoint.","fr":"Il se trouve à 4 km au nord d'Estercuel par la route. Une partie du bâtiment sert d'hôtellerie ; pour visiter l'église et le cloître, mieux vaut appeler le monastère avant (978 608 863). Une piste mène d'ici au belvédère de Moncoscol.","de":"Es liegt 4 km nördlich von Estercuel an der Straße. Ein Teil des Gebäudes dient als Gästehaus; für einen Besuch von Kirche und Kreuzgang am besten vorher im Kloster anrufen (978 608 863). Von hier führt eine Piste zum Aussichtspunkt Moncoscol.","pt":"Fica a 4 km a norte de Estercuel, por estrada. Parte do edifício funciona como hospedaria; para visitar a igreja e o claustro convém telefonar antes para o mosteiro (978 608 863). Daqui parte um caminho de terra até ao miradouro de Moncoscol."},"src":"https://monestirs.cat/monst/annex/espa/arago/Terol/eEl-Olivar.htm","sources":["https://es.hispanopedia.com/wiki/Estercuel","https://www.diocesisdeteruel.org/local/monasterio-de-el-olivar","https://www.festivalesdeespana.com/festival/magna-romeria-monasterio-olivar-pentecostes-estercuel"],"art":{"es":[{"h":"Historia","t":"La tradición habla de un santuario mariano de época visigoda, perdido durante la ocupación musulmana y recuperado cuando un pastor, Pedro Novés, encontró la imagen de la Virgen. En 1258 llegaron los primeros mercedarios y el señor del lugar, Gil de Atrosillo, les cedió la ermita y sus tierras.\n\nEl conjunto se rehízo en gran parte en los siglos XVI y XVII. Sufrió el saqueo de la Guerra de la Independencia y, tras la desamortización de 1836, pasó a manos privadas. La orden lo recuperó en 1878, lo convirtió en noviciado en 1881 y lo restauró tras los daños de la Guerra Civil."},{"h":"Qué ver","t":"La iglesia, con contrafuertes, uno de ellos mudéjar, se completa con el claustro, la sala capitular, el refectorio y una cajonera de sacristía del siglo XVII. Fue declarado Bien de Interés Cultural en 1982.\n\nEl edificio se asoma al valle del Escuriza. Tirso de Molina, que era mercedario, ambientó aquí 'La dama del Olivar'. El domingo de Pentecostés se celebra una romería a la que acuden vecinos de Estercuel y de pueblos cercanos, y el 9 de septiembre es la fiesta de la Virgen del Olivar."}],"en":[{"h":"History","t":"Tradition speaks of a Marian sanctuary from Visigothic times, lost during the Muslim occupation and recovered when a shepherd, Pedro Novés, found the image of the Virgin. In 1258 the first Mercedarians arrived and the local lord, Gil de Atrosillo, gave them the hermitage and its lands.\n\nThe complex was largely rebuilt in the 16th and 17th centuries. It was looted during the Peninsular War and, after the disentailment of 1836, passed into private hands. The order recovered it in 1878, made it a novitiate in 1881 and restored it after the damage of the Civil War."},{"h":"What to see","t":"The church, with buttresses, one of them Mudéjar, is complemented by the cloister, the chapter house, the refectory and a 17th-century sacristy chest of drawers. It was declared a Heritage of Cultural Interest in 1982.\n\nThe building looks out over the Escuriza valley. Tirso de Molina, himself a Mercedarian, set 'La dama del Olivar' here. On Whit Sunday a pilgrimage brings people from Estercuel and nearby villages, and 9 September is the feast of the Virgen del Olivar."}],"fr":[{"h":"Histoire","t":"La tradition parle d'un sanctuaire marial d'époque wisigothique, perdu pendant l'occupation musulmane et retrouvé lorsqu'un berger, Pedro Novés, découvrit l'image de la Vierge. En 1258, les premiers mercédaires arrivèrent et le seigneur des lieux, Gil de Atrosillo, leur céda l'ermitage et ses terres.\n\nL'ensemble a été en grande partie reconstruit aux XVIe et XVIIe siècles. Il fut pillé pendant la guerre d'indépendance espagnole et, après le désamortissement de 1836, passa en mains privées. L'ordre le récupéra en 1878, en fit un noviciat en 1881 et le restaura après les dégâts de la guerre civile."},{"h":"À voir","t":"L'église, avec ses contreforts, dont l'un mudéjar, est complétée par le cloître, la salle capitulaire, le réfectoire et un chasublier de sacristie du XVIIe siècle. Il a été déclaré Bien d'intérêt culturel en 1982.\n\nLe bâtiment domine la vallée de l'Escuriza. Tirso de Molina, lui-même mercédaire, y a situé « La dama del Olivar ». Le dimanche de Pentecôte, un pèlerinage réunit des habitants d'Estercuel et des villages voisins, et le 9 septembre est la fête de la Vierge del Olivar."}],"de":[{"h":"Geschichte","t":"Die Überlieferung spricht von einem Marienheiligtum aus westgotischer Zeit, das während der muslimischen Herrschaft verloren ging und wiederentdeckt wurde, als ein Hirte, Pedro Novés, das Bild der Jungfrau fand. 1258 kamen die ersten Mercedarier, und der Grundherr Gil de Atrosillo überließ ihnen die Einsiedelei und ihr Land.\n\nDie Anlage wurde im 16. und 17. Jahrhundert weitgehend neu gebaut. Im Unabhängigkeitskrieg wurde sie geplündert und kam nach der Säkularisation von 1836 in Privatbesitz. Der Orden erwarb sie 1878 zurück, machte sie 1881 zum Noviziat und restaurierte sie nach den Schäden des Bürgerkriegs."},{"h":"Sehenswert","t":"Zur Kirche mit ihren Strebepfeilern, einer davon im Mudéjar-Stil, gehören der Kreuzgang, der Kapitelsaal, das Refektorium und ein Sakristeischrank aus dem 17. Jahrhundert. 1982 wurde das Kloster zum Kulturgut erklärt.\n\nDas Gebäude blickt über das Tal des Escuriza. Tirso de Molina, selbst Mercedarier, ließ hier „La dama del Olivar“ spielen. Am Pfingstsonntag führt eine Wallfahrt Menschen aus Estercuel und Nachbardörfern hierher, und am 9. September wird das Fest der Virgen del Olivar gefeiert."}],"pt":[{"h":"História","t":"A tradição fala de um santuário mariano da época visigótica, perdido durante a ocupação muçulmana e recuperado quando um pastor, Pedro Novés, encontrou a imagem da Virgem. Em 1258 chegaram os primeiros mercedários e o senhor do lugar, Gil de Atrosillo, cedeu-lhes a ermida e as suas terras.\n\nO conjunto foi em grande parte refeito nos séculos XVI e XVII. Foi saqueado durante a Guerra Peninsular e, após a desamortização de 1836, passou para mãos privadas. A ordem recuperou-o em 1878, transformou-o em noviciado em 1881 e restaurou-o depois dos danos da Guerra Civil."},{"h":"O que ver","t":"A igreja, com contrafortes, um deles mudéjar, completa-se com o claustro, a sala do capítulo, o refeitório e um arcaz de sacristia do século XVII. Foi declarado Bem de Interesse Cultural em 1982.\n\nO edifício debruça-se sobre o vale do Escuriza. Tirso de Molina, que era mercedário, ambientou aqui 'La dama del Olivar'. No domingo de Pentecostes realiza-se uma romaria a que acorrem habitantes de Estercuel e de aldeias vizinhas, e a 9 de setembro é a festa da Virgem del Olivar."}]},"status":"pending"},{"id":"pasarelas-escuriza","town":"Alloza","cat":"naturaleza","lat":40.94646,"lon":-0.5935,"coord_src":null,"q":["Presa de Escuriza, Alloza","Embalse de Escuriza","Pantano de Escuriza"],"fq":["Embalse de Escuriza","Presa de Escuriza Alloza","Pasarelas río Escuriza"],"name":{"es":"Pasarelas del Escuriza","en":"Escuriza Footbridges","fr":"Passerelles de l'Escuriza","de":"Stege am Escuriza","pt":"Passadiços do Escuriza"},"when":{"es":"Presa centenaria · Senda con pasarelas","en":"Century-old dam · Path with footbridges","fr":"Barrage centenaire · Sentier à passerelles","de":"Hundertjährige Staumauer · Weg mit Stegen","pt":"Barragem centenária · Trilho com passadiços"},"desc":{"es":"Una senda desde Alloza que sigue el río Escuriza entre pinares y lo cruza por pasarelas hasta la presa de Escuriza, de más de cien años. Es uno de los paseos que más recomienda la propia comarca.","en":"A path from Alloza that follows the River Escuriza through pine woods and crosses it on footbridges up to the Escuriza dam, more than a hundred years old. It is one of the walks the comarca itself recommends most.","fr":"Un sentier au départ d'Alloza qui suit l'Escuriza à travers les pinèdes et la franchit sur des passerelles jusqu'au barrage d'Escuriza, plus que centenaire. C'est l'une des promenades que la comarca recommande le plus.","de":"Ein Weg ab Alloza, der dem Escuriza durch Kiefernwälder folgt und ihn auf Stegen überquert, bis zur über hundert Jahre alten Staumauer von Escuriza. Er gehört zu den Spaziergängen, die die Comarca selbst am häufigsten empfiehlt.","pt":"Um trilho a partir de Alloza que segue o rio Escuriza entre pinhais e o atravessa por passadiços até à barragem de Escuriza, com mais de cem anos. É um dos passeios que a própria comarca mais recomenda."},"visit":{"es":"La senda se señaliza desde Alloza por la carretera A-1402, en dirección a Crivillén y Venta de la Pintada; hay un pequeño aparcamiento a unos 250 metros de la antigua casa de los técnicos. Es un paseo sencillo, en buena parte por pista ancha. Lleva calzado cerrado, no te acerques a las torres de control de la presa y evita los días de crecida.","en":"The path is signposted from Alloza on the A-1402 road, towards Crivillén and Venta de la Pintada; there is a small car park about 250 metres from the old engineers' house. It is an easy walk, largely on a wide track. Wear closed shoes, keep away from the dam's control towers and avoid days when the river is in spate.","fr":"Le sentier est indiqué depuis Alloza sur la route A-1402, en direction de Crivillén et de Venta de la Pintada ; un petit parking se trouve à environ 250 mètres de l'ancienne maison des techniciens. C'est une promenade facile, en grande partie sur une large piste. Portez des chaussures fermées, ne vous approchez pas des tours de contrôle du barrage et évitez les jours de crue.","de":"Der Weg ist ab Alloza an der Straße A-1402 Richtung Crivillén und Venta de la Pintada ausgeschildert; ein kleiner Parkplatz liegt etwa 250 Meter vom alten Haus der Techniker entfernt. Es ist ein leichter Spaziergang, großenteils auf breitem Weg. Festes Schuhwerk tragen, Abstand zu den Kontrolltürmen der Staumauer halten und Tage mit Hochwasser meiden.","pt":"O trilho está sinalizado a partir de Alloza pela estrada A-1402, em direção a Crivillén e Venta de la Pintada; há um pequeno parque de estacionamento a cerca de 250 metros da antiga casa dos técnicos. É um passeio fácil, em boa parte por caminho largo. Use calçado fechado, não se aproxime das torres de controlo da barragem e evite os dias de cheia."},"src":"https://www.lacomarca.net/senda-presa-escuriza-rehabilitara-75000-euros/","sources":["https://www.loc.wiki/hiking-trails/pasarelas-del-rio-escuriza-alloza-teruel-151320421","https://www.lacomarca.net/nuevos-planes-sostenibilidad-turistica-invertiran-casi-5-millones-euros-comarcas-andorra-sierra-arcos-cinco-villas/","https://www.lacomarca.net/andorra-sierra-arcos-refuerza-marca-turistica-video-tierra-silencios-recorre-destinos-mas-iconicos/"],"art":{"es":[{"h":"Historia","t":"La presa de Escuriza, también llamada pantano de Híjar, tiene más de cien años y es una de las más antiguas de España: en la cuenca del Ebro solo la supera la de Arguis. Se reparte entre los términos de Alloza, Oliete y Estercuel. Las pasarelas originales se colocaron durante su construcción, y por ellas se ha llegado a la presa desde entonces.\n\nCon los años se deterioraron. Un estudio de inundabilidad obligó a elevar la mayor parte del trazado unos tres metros, y un proyecto financiado por el Fite, de unos 75.500 euros, preveía unos 60 metros de pasarelas nuevas con barandillas, la reparación de los escalones de piedra y paneles informativos."},{"h":"El paisaje","t":"El camino avanza entre pinares, pegado al río, hasta la base de la presa y la plataforma superior del muro. Las obras se programaron fuera de la época de cría de las aves del barranco.\n\nEl Plan de Sostenibilidad Turística de la comarca plantea un corredor verde por los ríos Escuriza y Estercuel, y las pasarelas aparecen en 'Tierra de silencios', el vídeo promocional de 2025. Río arriba, el Escuriza nace en Gargallo y su valle se ve desde el Monasterio del Olivar."}],"en":[{"h":"History","t":"The Escuriza dam, also known as the Híjar reservoir, is more than a hundred years old and one of the oldest in Spain: in the Ebro basin only the Arguis dam is older. It lies across the municipalities of Alloza, Oliete and Estercuel. The original footbridges were put in place during its construction, and people have reached the dam along them ever since.\n\nOver the years they deteriorated. A flood-risk study made it necessary to raise most of the route by about three metres, and a project funded by the Fite, of some 75,500 euros, planned around 60 metres of new footbridges with railings, repairs to the stone steps and information panels."},{"h":"The landscape","t":"The path runs through pine woods, close to the river, as far as the foot of the dam and the upper platform of the wall. The works were scheduled outside the breeding season of the ravine's birds.\n\nThe comarca's Sustainable Tourism Plan proposes a green corridor along the Escuriza and Estercuel rivers, and the footbridges appear in 'Tierra de silencios', the 2025 promotional video. Upstream, the Escuriza rises in Gargallo and its valley can be seen from the Monasterio del Olivar."}],"fr":[{"h":"Histoire","t":"Le barrage d'Escuriza, aussi appelé retenue d'Híjar, a plus de cent ans et compte parmi les plus anciens d'Espagne : dans le bassin de l'Èbre, seul celui d'Arguis est plus ancien. Il s'étend sur les communes d'Alloza, Oliete et Estercuel. Les passerelles d'origine ont été posées pendant sa construction, et c'est par elles que l'on rejoint le barrage depuis lors.\n\nAvec le temps, elles se sont dégradées. Une étude des risques d'inondation a obligé à surélever la majeure partie du tracé d'environ trois mètres, et un projet financé par le Fite, d'environ 75 500 euros, prévoyait une soixantaine de mètres de nouvelles passerelles avec garde-corps, la réparation des marches en pierre et des panneaux d'information."},{"h":"Le paysage","t":"Le chemin avance entre les pins, au plus près de la rivière, jusqu'au pied du barrage et à la plateforme supérieure du mur. Les travaux ont été programmés en dehors de la période de reproduction des oiseaux du ravin.\n\nLe Plan de tourisme durable de la comarca prévoit un corridor vert le long de l'Escuriza et de l'Estercuel, et les passerelles apparaissent dans « Tierra de silencios », la vidéo promotionnelle de 2025. En amont, l'Escuriza prend sa source à Gargallo et sa vallée se voit depuis le Monasterio del Olivar."}],"de":[{"h":"Geschichte","t":"Die Staumauer von Escuriza, auch Stausee von Híjar genannt, ist über hundert Jahre alt und eine der ältesten Spaniens: Im Ebro-Becken ist nur die von Arguis älter. Sie liegt auf den Gemeindegebieten von Alloza, Oliete und Estercuel. Die ursprünglichen Stege wurden beim Bau angelegt, und seitdem gelangt man über sie zur Staumauer.\n\nMit den Jahren verfielen sie. Eine Hochwasserstudie machte es nötig, den größten Teil der Strecke um etwa drei Meter anzuheben, und ein vom Fite finanziertes Projekt von rund 75.500 Euro sah etwa 60 Meter neue Stege mit Geländern, die Reparatur der Steinstufen und Infotafeln vor."},{"h":"Die Landschaft","t":"Der Weg führt durch Kiefernwald dicht am Fluss bis zum Fuß der Staumauer und zur oberen Plattform der Mauer. Die Arbeiten wurden außerhalb der Brutzeit der Vögel in der Schlucht geplant.\n\nDer Plan für nachhaltigen Tourismus der Comarca sieht einen grünen Korridor entlang der Flüsse Escuriza und Estercuel vor, und die Stege sind im Werbefilm „Tierra de silencios“ von 2025 zu sehen. Flussaufwärts entspringt der Escuriza in Gargallo, und sein Tal sieht man vom Monasterio del Olivar aus."}],"pt":[{"h":"História","t":"A barragem de Escuriza, também chamada albufeira de Híjar, tem mais de cem anos e é uma das mais antigas de Espanha: na bacia do Ebro só a de Arguis é mais antiga. Reparte-se pelos concelhos de Alloza, Oliete e Estercuel. Os passadiços originais foram colocados durante a sua construção, e é por eles que se chega à barragem desde então.\n\nCom os anos, degradaram-se. Um estudo de inundabilidade obrigou a elevar a maior parte do traçado cerca de três metros, e um projeto financiado pelo Fite, de cerca de 75 500 euros, previa uns 60 metros de passadiços novos com corrimões, a reparação dos degraus de pedra e painéis informativos."},{"h":"A paisagem","t":"O caminho avança entre pinhais, colado ao rio, até à base da barragem e à plataforma superior do paredão. As obras foram programadas fora da época de nidificação das aves do barranco.\n\nO Plano de Sustentabilidade Turística da comarca prevê um corredor verde pelos rios Escuriza e Estercuel, e os passadiços aparecem em 'Tierra de silencios', o vídeo promocional de 2025. Rio acima, o Escuriza nasce em Gargallo e o seu vale vê-se do Monasterio del Olivar."}]},"status":"pending"},{"id":"calvario-alloza","town":"Alloza","cat":"patrimonio","lat":40.96522,"lon":-0.53279,"coord_src":null,"q":["Calvario de Alloza","Ermita del Santo Sepulcro, Alloza"],"fq":["Calvario de Alloza","Alloza calvario cipreses","Ermita del Santo Sepulcro Alloza"],"name":{"es":"Calvario de Alloza","en":"Calvary of Alloza","fr":"Calvaire d'Alloza","de":"Kalvarienberg von Alloza","pt":"Calvário de Alloza"},"when":{"es":"Siglo XVIII · Quince capillas entre cipreses","en":"18th century · Fifteen chapels among cypresses","fr":"XVIIIe siècle · Quinze chapelles parmi les cyprès","de":"18. Jh. · Fünfzehn Kapellen zwischen Zypressen","pt":"Século XVIII · Quinze capelas entre ciprestes"},"desc":{"es":"Un vía crucis de unos 1.600 metros, con quince capillas y cipreses centenarios, que sube hasta la ermita del Santo Sepulcro. Es el símbolo de Alloza y el escenario de su fiesta de la Judiada.","en":"A Way of the Cross some 1,600 metres long, with fifteen chapels and century-old cypresses, climbing up to the hermitage of the Holy Sepulchre. It is the symbol of Alloza and the setting for its Judiada festival.","fr":"Un chemin de croix d'environ 1 600 mètres, avec quinze chapelles et des cyprès centenaires, qui monte jusqu'à l'ermitage du Saint-Sépulcre. C'est le symbole d'Alloza et le cadre de sa fête de la Judiada.","de":"Ein etwa 1.600 Meter langer Kreuzweg mit fünfzehn Kapellen und hundertjährigen Zypressen, der zur Einsiedelei des Heiligen Grabes hinaufführt. Er ist das Wahrzeichen von Alloza und Schauplatz des Festes der Judiada.","pt":"Uma via-sacra com cerca de 1600 metros, quinze capelas e ciprestes centenários, que sobe até à ermida do Santo Sepulcro. É o símbolo de Alloza e o palco da sua festa da Judiada."},"visit":{"es":"El recorrido exterior es libre y conviene hacerlo sin prisas. La ermita se abre en celebraciones y visitas guiadas; en verano la comarca ofrece una visita al Calvario y al parque escultórico. Confirma en la oficina de turismo.","en":"The outdoor route is open access and best enjoyed at a gentle pace. The hermitage opens for celebrations and guided tours; in summer the comarca offers a tour of the Calvary and the sculpture park. Check at the tourist office.","fr":"Le parcours extérieur est en accès libre et se savoure sans se presser. L'ermitage ouvre lors des célébrations et des visites guidées ; en été, la comarca propose une visite du Calvaire et du parc de sculptures. Renseignez-vous à l'office de tourisme.","de":"Der Weg im Freien ist frei zugänglich und lässt sich am besten ohne Eile genießen. Die Einsiedelei öffnet zu Feiern und Führungen; im Sommer bietet die Comarca eine Führung zum Kalvarienberg und zum Skulpturenpark an. Auskunft im Tourismusbüro.","pt":"O percurso exterior é de acesso livre e convém fazê-lo sem pressas. A ermida abre em celebrações e visitas guiadas; no verão, a comarca oferece uma visita ao Calvário e ao parque de escultura. Confirme no posto de turismo."},"src":"https://www.lacomarca.net/calvario-alloza-puesto-vacante-ermitano-lugar-unico/","sources":["https://es.hispanopedia.com/wiki/Alloza","https://www.lacomarca.net/alloza-impulsa-divulgacion-historia-patrimonio-calvario-jornadas/","https://www.festivalesdeespana.com/festival/fiesta-de-la-judiada-alloza"],"art":{"es":[{"h":"Historia","t":"La ermita del Santo Sepulcro, en lo más alto, es de principios del siglo XVIII. Tiene una sola nave de sillería y ladrillo, azulejería de 1788 y un baldaquino de columnas salomónicas de 1735 bajo el que reposa el Cristo Yacente. Conserva además doce pinturas de escuela flamenca sobre cobre del siglo XVII.\n\nEl conjunto lo cuida la Asociación Cultural Amigos del Calvario, que lo gestiona en concierto con el Arzobispado de Zaragoza. Junto a la ermita está la casa del ermitaño, hoy vacía."},{"h":"Qué ver","t":"El camino de unos 1.600 metros reúne quince capillas, una más de las catorce habituales, dedicada a la Resurrección. Las distancias se fijaron, según la tradición, siguiendo las medidas de los franciscanos para recrear la Pasión. Los cipreses centenarios están declarados Arboleda Singular de Aragón; en la parte baja destaca el llamado 'ciprés Madre' y, a sus pies, la fuente de las cinco llagas.\n\nCerca está el parque escultórico Los Barrancos, un paraje natural con obras de varios autores."},{"h":"Curiosidades","t":"El sábado de Pentecostés se celebra la Judiada: misa al aire libre en el Calvario, reparto de alubias cocinadas en grandes calderos y baile por la tarde."}],"en":[{"h":"History","t":"The hermitage of the Holy Sepulchre, at the very top, dates from the early 18th century. It has a single nave of ashlar and brick, tilework from 1788 and a baldachin with Solomonic columns from 1735, beneath which lies the Recumbent Christ. It also keeps twelve 17th-century Flemish-school paintings on copper.\n\nThe site is looked after by the Amigos del Calvario cultural association, which manages it under an agreement with the Archdiocese of Zaragoza. Next to the hermitage stands the hermit's house, empty today."},{"h":"What to see","t":"The 1,600-metre path has fifteen chapels, one more than the usual fourteen, dedicated to the Resurrection. According to tradition, the distances follow measurements set by the Franciscans to recreate the Passion. The century-old cypresses are listed as a Singular Grove of Aragon; in the lower part stands the so-called 'Mother Cypress' and, at its foot, the fountain of the Five Wounds.\n\nNearby is the Los Barrancos sculpture park, a natural setting with works by several artists."},{"h":"Did you know?","t":"On the Saturday of Pentecost the Judiada is held: open-air Mass at the Calvary, beans cooked in large cauldrons handed out to everyone, and dancing in the afternoon."}],"fr":[{"h":"Histoire","t":"L'ermitage du Saint-Sépulcre, tout en haut, date du début du XVIIIe siècle. Il possède une seule nef en pierre de taille et brique, des azulejos de 1788 et un baldaquin à colonnes torses de 1735 sous lequel repose le Christ gisant. Il conserve aussi douze peintures sur cuivre d'école flamande du XVIIe siècle.\n\nL'ensemble est entretenu par l'association culturelle Amigos del Calvario, qui le gère en accord avec l'archevêché de Saragosse. À côté de l'ermitage se trouve la maison de l'ermite, aujourd'hui vide."},{"h":"À voir","t":"Le chemin d'environ 1 600 mètres réunit quinze chapelles, une de plus que les quatorze habituelles, consacrée à la Résurrection. Selon la tradition, les distances suivent les mesures fixées par les franciscains pour recréer la Passion. Les cyprès centenaires sont classés Bosquet singulier d'Aragon ; en bas se distingue le « cyprès Mère » et, à son pied, la fontaine des cinq plaies.\n\nÀ proximité se trouve le parc de sculptures Los Barrancos, un site naturel avec des œuvres de plusieurs artistes."},{"h":"Le saviez-vous ?","t":"Le samedi de Pentecôte a lieu la Judiada : messe en plein air au Calvaire, distribution de haricots cuits dans de grands chaudrons et bal l'après-midi."}],"de":[{"h":"Geschichte","t":"Die Einsiedelei des Heiligen Grabes ganz oben stammt aus dem frühen 18. Jahrhundert. Sie hat ein einziges Schiff aus Quader- und Backstein, Fliesen von 1788 und einen Baldachin mit gedrehten Säulen von 1735, unter dem der liegende Christus ruht. Außerdem bewahrt sie zwölf Gemälde der flämischen Schule auf Kupfer aus dem 17. Jahrhundert.\n\nGepflegt wird die Anlage vom Kulturverein Amigos del Calvario, der sie in Absprache mit dem Erzbistum Zaragoza verwaltet. Neben der Einsiedelei steht das heute leere Haus des Einsiedlers."},{"h":"Sehenswert","t":"Der etwa 1.600 Meter lange Weg hat fünfzehn Kapellen, eine mehr als die üblichen vierzehn, der Auferstehung gewidmet. Der Überlieferung nach folgen die Abstände den Maßen, die die Franziskaner zur Nachbildung der Passion festlegten. Die hundertjährigen Zypressen sind als Besonderer Baumbestand Aragoniens geschützt; im unteren Teil steht die sogenannte „Mutterzypresse“ und zu ihren Füßen der Brunnen der fünf Wunden.\n\nIn der Nähe liegt der Skulpturenpark Los Barrancos, ein Naturgelände mit Werken mehrerer Künstler."},{"h":"Wussten Sie?","t":"Am Pfingstsamstag wird die Judiada gefeiert: Messe unter freiem Himmel am Kalvarienberg, Ausgabe von Bohnen aus großen Kesseln und Tanz am Nachmittag."}],"pt":[{"h":"História","t":"A ermida do Santo Sepulcro, lá no alto, é do início do século XVIII. Tem uma só nave de cantaria e tijolo, azulejaria de 1788 e um baldaquino de colunas salomónicas de 1735, sob o qual repousa o Cristo Jacente. Conserva ainda doze pinturas sobre cobre de escola flamenga do século XVII.\n\nO conjunto é cuidado pela Associação Cultural Amigos del Calvario, que o gere em acordo com a Arquidiocese de Saragoça. Junto à ermida fica a casa do ermitão, hoje vazia."},{"h":"O que ver","t":"O caminho de cerca de 1600 metros reúne quinze capelas, mais uma do que as catorze habituais, dedicada à Ressurreição. Segundo a tradição, as distâncias seguem as medidas fixadas pelos franciscanos para recriar a Paixão. Os ciprestes centenários estão classificados como Arvoredo Singular de Aragão; na parte baixa destaca-se o chamado 'cipreste Mãe' e, a seus pés, a fonte das cinco chagas.\n\nPerto fica o parque de escultura Los Barrancos, um espaço natural com obras de vários autores."},{"h":"Curiosidades","t":"No sábado de Pentecostes celebra-se a Judiada: missa ao ar livre no Calvário, distribuição de feijão cozinhado em grandes caldeirões e baile à tarde."}]},"status":"pending"},{"id":"crivillen-casco","town":"Crivillén","cat":"patrimonio","lat":40.88321,"lon":-0.57685,"coord_src":"https://es.hispanopedia.com/wiki/Crivill%C3%A9n","q":["Iglesia de San Martín de Tours, Crivillén","Crivillén, Teruel"],"fq":["Crivillén","Iglesia de San Martín Crivillén","Pablo Serrano Crivillén"],"name":{"es":"Crivillén, el pueblo de Pablo Serrano","en":"Crivillén, Pablo Serrano's Village","fr":"Crivillén, le village de Pablo Serrano","de":"Crivillén, das Dorf von Pablo Serrano","pt":"Crivillén, a aldeia de Pablo Serrano"},"when":{"es":"Casco histórico · Cuna de Pablo Serrano (1908)","en":"Historic centre · Birthplace of Pablo Serrano (1908)","fr":"Centre historique · Village natal de Pablo Serrano (1908)","de":"Altstadt · Geburtsort von Pablo Serrano (1908)","pt":"Centro histórico · Terra natal de Pablo Serrano (1908)"},"desc":{"es":"Un pueblo pequeño con iglesia declarada monumento, ayuntamiento renacentista y la casa natal del escultor Pablo Serrano. Desde sus ermitas se dominan los barrancos donde planean los buitres.","en":"A small village with a listed church, a Renaissance town hall and the house where the sculptor Pablo Serrano was born. From its hermitages you look down over ravines where vultures glide.","fr":"Un petit village avec une église classée monument, une mairie Renaissance et la maison natale du sculpteur Pablo Serrano. Depuis ses ermitages, on domine les ravins où planent les vautours.","de":"Ein kleines Dorf mit einer denkmalgeschützten Kirche, einem Renaissance-Rathaus und dem Geburtshaus des Bildhauers Pablo Serrano. Von seinen Einsiedeleien überblickt man Schluchten, über denen Geier kreisen.","pt":"Uma aldeia pequena com igreja classificada como monumento, câmara municipal renascentista e a casa natal do escultor Pablo Serrano. Das suas ermidas dominam-se os barrancos onde planam os abutres."},"visit":{"es":"El casco se recorre a pie. En verano la comarca organiza visitas guiadas con reserva. Para el Centro de Arte Contemporáneo Pablo Serrano y la iglesia, pregunta horarios en el ayuntamiento o en la oficina de turismo. Los miradores de Santa Bárbara y Pilatos están a las afueras.","en":"The village centre is explored on foot. In summer the comarca organises guided tours by booking. For the Pablo Serrano Contemporary Art Centre and the church, ask about opening times at the town hall or the tourist office. The Santa Bárbara and Pilatos viewpoints are on the outskirts.","fr":"Le centre se découvre à pied. En été, la comarca organise des visites guidées sur réservation. Pour le Centre d'art contemporain Pablo Serrano et l'église, demandez les horaires à la mairie ou à l'office de tourisme. Les belvédères de Santa Bárbara et de Pilatos sont à la sortie du village.","de":"Der Ortskern lässt sich zu Fuß erkunden. Im Sommer bietet die Comarca Führungen nach Voranmeldung an. Für das Zentrum für zeitgenössische Kunst Pablo Serrano und die Kirche die Öffnungszeiten im Rathaus oder im Tourismusbüro erfragen. Die Aussichtspunkte Santa Bárbara und Pilatos liegen am Ortsrand.","pt":"O centro percorre-se a pé. No verão, a comarca organiza visitas guiadas com marcação. Para o Centro de Arte Contemporânea Pablo Serrano e a igreja, pergunte os horários na câmara municipal ou no posto de turismo. Os miradouros de Santa Bárbara e de Pilatos ficam à saída da aldeia."},"src":"https://es.hispanopedia.com/wiki/Crivill%C3%A9n","sources":["https://en.wikipedia.org/wiki/Pablo_Serrano","https://www.lacomarca.net/reportajes/miradores-mas-imponentes-andorra-sierra-arcos/","https://www.lacomarca.net/productores-locales-poblados-iberos-o-cascos-historicos-andorra-sierra-de-arcos-ofrece-visitas-guiadas-a-sus-pueblos-durante-todo-el-verano/"],"art":{"es":[{"h":"Historia","t":"Pablo Serrano Aguilar nació en Crivillén el 8 de marzo de 1908 y murió en Madrid en 1985. Es una figura clave de la escultura española del siglo XX: trabajó junto a los artistas del grupo El Paso y es autor de series como 'Hombres con puerta' o los 'Ritmos en el espacio', además de la estatua de Indalecio Prieto en Madrid.\n\nEl pueblo conserva su casa natal y le dedica un Centro de Arte Contemporáneo. En Zaragoza, el museo que lleva su nombre abrió en 1994."},{"h":"Qué ver","t":"La iglesia parroquial de San Martín de Tours fue declarada monumento histórico-artístico en 1982. El ayuntamiento es de estilo renacentista y, a las afueras, la ermita de San Gil es barroca, de finales del siglo XVII.\n\nJunto a la ermita de Santa Bárbara, restaurada y accesible por la carretera A-1416, hay un mirador frecuentado por buitres; enfrente, el de Pilatos, al que se llega por las eras, tiene un dibujo de piedra en el suelo. Ambos asoman a los barrancos que rodean el pueblo. Las fiestas son por San Gil, el 1 de septiembre, y por San Martín, el 11 de noviembre."}],"en":[{"h":"History","t":"Pablo Serrano Aguilar was born in Crivillén on 8 March 1908 and died in Madrid in 1985. He is a key figure in 20th-century Spanish sculpture: he worked alongside the artists of the El Paso group and created series such as 'Men with Door' and 'Rhythms in Space', as well as the statue of Indalecio Prieto in Madrid.\n\nThe village keeps his birthplace and dedicates a Contemporary Art Centre to him. In Zaragoza, the museum that bears his name opened in 1994."},{"h":"What to see","t":"The parish church of San Martín de Tours was declared a historic-artistic monument in 1982. The town hall is in Renaissance style and, on the outskirts, the hermitage of San Gil is Baroque, from the late 17th century.\n\nBeside the restored hermitage of Santa Bárbara, reached by the A-1416 road, there is a viewpoint frequented by vultures; opposite, the Pilatos viewpoint, reached across the threshing floors, has a stone design on the ground. Both look out over the ravines around the village. The festivals are for San Gil on 1 September and San Martín on 11 November."}],"fr":[{"h":"Histoire","t":"Pablo Serrano Aguilar est né à Crivillén le 8 mars 1908 et mort à Madrid en 1985. C'est une figure clé de la sculpture espagnole du XXe siècle : il a travaillé aux côtés des artistes du groupe El Paso et a créé des séries comme « Hommes avec porte » ou « Rythmes dans l'espace », ainsi que la statue d'Indalecio Prieto à Madrid.\n\nLe village conserve sa maison natale et lui consacre un Centre d'art contemporain. À Saragosse, le musée qui porte son nom a ouvert en 1994."},{"h":"À voir","t":"L'église paroissiale San Martín de Tours a été déclarée monument historique et artistique en 1982. La mairie est de style Renaissance et, à la sortie du village, l'ermitage de San Gil est baroque, de la fin du XVIIe siècle.\n\nÀ côté de l'ermitage restauré de Santa Bárbara, accessible par la route A-1416, un belvédère est fréquenté par les vautours ; en face, celui de Pilatos, que l'on rejoint par les aires de battage, présente un dessin en pierre au sol. Tous deux donnent sur les ravins qui entourent le village. Les fêtes ont lieu pour la Saint-Gilles, le 1er septembre, et pour la Saint-Martin, le 11 novembre."}],"de":[{"h":"Geschichte","t":"Pablo Serrano Aguilar wurde am 8. März 1908 in Crivillén geboren und starb 1985 in Madrid. Er ist eine Schlüsselfigur der spanischen Bildhauerei des 20. Jahrhunderts: Er arbeitete mit den Künstlern der Gruppe El Paso zusammen und schuf Serien wie „Menschen mit Tür“ und „Rhythmen im Raum“ sowie die Statue von Indalecio Prieto in Madrid.\n\nDas Dorf bewahrt sein Geburtshaus und widmet ihm ein Zentrum für zeitgenössische Kunst. In Zaragoza wurde 1994 das Museum eröffnet, das seinen Namen trägt."},{"h":"Sehenswert","t":"Die Pfarrkirche San Martín de Tours wurde 1982 zum historisch-künstlerischen Denkmal erklärt. Das Rathaus ist im Renaissancestil gebaut, und am Ortsrand steht die barocke Einsiedelei San Gil aus dem späten 17. Jahrhundert.\n\nNeben der restaurierten Einsiedelei Santa Bárbara, erreichbar über die Straße A-1416, liegt ein Aussichtspunkt, an dem oft Geier zu sehen sind; gegenüber hat der Aussichtspunkt Pilatos, den man über die alten Dreschplätze erreicht, ein Steinmuster im Boden. Beide blicken auf die Schluchten rund um das Dorf. Gefeiert wird zu San Gil am 1. September und zu San Martín am 11. November."}],"pt":[{"h":"História","t":"Pablo Serrano Aguilar nasceu em Crivillén a 8 de março de 1908 e morreu em Madrid em 1985. É uma figura-chave da escultura espanhola do século XX: trabalhou ao lado dos artistas do grupo El Paso e criou séries como 'Homens com porta' e 'Ritmos no espaço', além da estátua de Indalecio Prieto em Madrid.\n\nA aldeia conserva a sua casa natal e dedica-lhe um Centro de Arte Contemporânea. Em Saragoça, o museu com o seu nome abriu em 1994."},{"h":"O que ver","t":"A igreja paroquial de San Martín de Tours foi declarada monumento histórico-artístico em 1982. A câmara municipal é de estilo renascentista e, à saída da aldeia, a ermida de San Gil é barroca, do final do século XVII.\n\nJunto à ermida de Santa Bárbara, restaurada e acessível pela estrada A-1416, há um miradouro frequentado por abutres; em frente, o de Pilatos, a que se chega pelas eiras, tem um desenho em pedra no chão. Ambos se debruçam sobre os barrancos que rodeiam a aldeia. As festas são por San Gil, a 1 de setembro, e por San Martín, a 11 de novembro."}]},"status":"pending"},{"id":"majalinontes","town":"Gargallo","cat":"camino","lat":40.79887,"lon":-0.59976,"coord_src":null,"q":["Senda de los Majalinontes, Gargallo","Gargallo, Teruel"],"fq":["Majalinontes Gargallo","Gargallo Teruel","Sierra de Majalinos"],"name":{"es":"Senda de los Majalinontes","en":"Majalinontes Trail","fr":"Sentier des Majalinontes","de":"Pfad der Majalinontes","pt":"Trilho dos Majalinontes"},"when":{"es":"Sendero familiar · Esculturas en el bosque","en":"Family trail · Sculptures in the woods","fr":"Sentier familial · Sculptures dans la forêt","de":"Familienweg · Skulpturen im Wald","pt":"Trilho familiar · Esculturas no bosque"},"desc":{"es":"Un paseo por el bosque de Gargallo en el que aparecen hasta ocho esculturas de personajes inspirados en la mitología. Es un plan pensado para ir con niños, a las puertas de la sierra de Majalinos.","en":"A walk through the woods of Gargallo where up to eight sculptures of characters inspired by mythology appear. It is designed for going with children, at the gateway to the Sierra de Majalinos.","fr":"Une promenade dans la forêt de Gargallo où apparaissent jusqu'à huit sculptures de personnages inspirés de la mythologie. Elle est pensée pour les enfants, aux portes de la sierra de Majalinos.","de":"Ein Spaziergang durch den Wald von Gargallo, auf dem bis zu acht Skulpturen von Figuren aus der Mythologie auftauchen. Er ist für Ausflüge mit Kindern gedacht, am Eingang zur Sierra de Majalinos.","pt":"Um passeio pelo bosque de Gargallo onde aparecem até oito esculturas de personagens inspiradas na mitologia. É um plano pensado para ir com crianças, às portas da serra de Majalinos."},"visit":{"es":"Es un recorrido sencillo, pensado para familias. En verano la comarca lo incluye en sus visitas guiadas con reserva. Pregunta en el ayuntamiento o en la oficina de turismo por el punto de inicio y el estado del sendero.","en":"It is an easy route, designed for families. In summer the comarca includes it in its guided tours by booking. Ask at the town hall or the tourist office about the starting point and the state of the trail.","fr":"C'est un parcours facile, pensé pour les familles. En été, la comarca l'inclut dans ses visites guidées sur réservation. Renseignez-vous à la mairie ou à l'office de tourisme sur le point de départ et l'état du sentier.","de":"Es ist ein leichter Weg für Familien. Im Sommer nimmt die Comarca ihn in ihre Führungen nach Voranmeldung auf. Nach Startpunkt und Zustand des Weges im Rathaus oder im Tourismusbüro fragen.","pt":"É um percurso fácil, pensado para famílias. No verão, a comarca inclui-o nas suas visitas guiadas com marcação. Pergunte na câmara municipal ou no posto de turismo pelo ponto de partida e pelo estado do trilho."},"src":"https://www.lacomarca.net/productores-locales-poblados-iberos-o-cascos-historicos-andorra-sierra-de-arcos-ofrece-visitas-guiadas-a-sus-pueblos-durante-todo-el-verano/","sources":["https://es.hispanopedia.com/wiki/Gargallo","https://www.lacomarca.net/reportajes/miradores-mas-imponentes-andorra-sierra-arcos/","https://www.mundomotero.com/ruta-del-silencio-a-1702-teruel-guia-completa-mapa-paradas"],"art":{"es":[{"h":"Qué ver","t":"Los Majalinontes son figuras escultóricas repartidas por el bosque, hasta ocho, que representan personajes inspirados en la mitología. El juego consiste en ir encontrándolas a lo largo de la senda, por eso funciona bien con niños. El nombre recuerda a la sierra de Majalinos, que cierra el horizonte al sur del pueblo.\n\nEn el propio Gargallo merece la pena ver la iglesia de Nuestra Señora de la Piedad, un templo barroco de 1707, y la ermita de San Blas, junto al cementerio, reconstruida después de la Guerra Civil."},{"h":"El paisaje","t":"En el término de Gargallo nace el río Escuriza. El mirador del pueblo, el único de la comarca dentro de un casco urbano, marca el inicio de la senda que baja por el valle del Escuriza hacia Crivillén.\n\nA unos treinta minutos a pie de la Venta de la Pintada, junto a la N-211, otro mirador mira a la sierra de Majalinos. La Venta es además el punto de partida de la Silent Route por la A-1702. Y en el mirador del Campillo, a 1.110 metros, florecen los gamones a finales de abril y principios de mayo."}],"en":[{"h":"What to see","t":"The Majalinontes are sculpted figures, up to eight of them, scattered through the woods and representing characters inspired by mythology. The game is to find them one by one along the path, which is why it works so well with children. The name recalls the Sierra de Majalinos, which closes the horizon south of the village.\n\nIn Gargallo itself it is worth seeing the church of Nuestra Señora de la Piedad, a Baroque building from 1707, and the hermitage of San Blas, beside the cemetery, rebuilt after the Civil War."},{"h":"The landscape","t":"The River Escuriza rises within the municipality of Gargallo. The village viewpoint, the only one in the comarca inside a built-up area, marks the start of the path that runs down the Escuriza valley towards Crivillén.\n\nAbout thirty minutes' walk from Venta de la Pintada, beside the N-211, another viewpoint looks towards the Sierra de Majalinos. The Venta is also the starting point of the Silent Route along the A-1702. And at the Campillo viewpoint, at 1,110 metres, the asphodels flower in late April and early May."}],"fr":[{"h":"À voir","t":"Les Majalinontes sont des figures sculptées, jusqu'à huit, disséminées dans la forêt et représentant des personnages inspirés de la mythologie. Le jeu consiste à les découvrir une à une le long du sentier, ce qui plaît beaucoup aux enfants. Leur nom rappelle la sierra de Majalinos, qui ferme l'horizon au sud du village.\n\nÀ Gargallo même, il vaut la peine de voir l'église Nuestra Señora de la Piedad, un édifice baroque de 1707, et l'ermitage de San Blas, près du cimetière, reconstruit après la guerre civile."},{"h":"Le paysage","t":"L'Escuriza prend sa source sur la commune de Gargallo. Le belvédère du village, le seul de la comarca situé dans une agglomération, marque le départ du sentier qui descend la vallée de l'Escuriza vers Crivillén.\n\nÀ une trentaine de minutes à pied de la Venta de la Pintada, au bord de la N-211, un autre belvédère regarde vers la sierra de Majalinos. La Venta est aussi le point de départ de la Silent Route par l'A-1702. Et au belvédère del Campillo, à 1 110 mètres, les asphodèles fleurissent fin avril et début mai."}],"de":[{"h":"Sehenswert","t":"Die Majalinontes sind bis zu acht Skulpturen, die im Wald verteilt stehen und Figuren aus der Mythologie darstellen. Das Spiel besteht darin, sie entlang des Weges nacheinander zu entdecken, deshalb kommt der Pfad bei Kindern gut an. Der Name erinnert an die Sierra de Majalinos, die den Horizont südlich des Dorfes abschließt.\n\nIn Gargallo selbst lohnen die Kirche Nuestra Señora de la Piedad, ein Barockbau von 1707, und die Einsiedelei San Blas am Friedhof, die nach dem Bürgerkrieg wiederaufgebaut wurde."},{"h":"Die Landschaft","t":"Im Gemeindegebiet von Gargallo entspringt der Escuriza. Der Aussichtspunkt des Dorfes, der einzige der Comarca innerhalb eines Ortes, markiert den Beginn des Weges, der durch das Escuriza-Tal nach Crivillén hinabführt.\n\nEtwa dreißig Gehminuten von der Venta de la Pintada an der N-211 entfernt blickt ein weiterer Aussichtspunkt auf die Sierra de Majalinos. Die Venta ist auch der Ausgangspunkt der Silent Route über die A-1702. Und am Aussichtspunkt Campillo auf 1.110 Metern blühen Ende April und Anfang Mai die Affodills."}],"pt":[{"h":"O que ver","t":"Os Majalinontes são figuras esculpidas, até oito, espalhadas pelo bosque e que representam personagens inspiradas na mitologia. O jogo consiste em ir descobrindo-as ao longo do trilho, por isso funciona bem com crianças. O nome lembra a serra de Majalinos, que fecha o horizonte a sul da aldeia.\n\nNa própria Gargallo vale a pena ver a igreja de Nuestra Señora de la Piedad, um templo barroco de 1707, e a ermida de San Blas, junto ao cemitério, reconstruída depois da Guerra Civil."},{"h":"A paisagem","t":"O rio Escuriza nasce no concelho de Gargallo. O miradouro da aldeia, o único da comarca dentro de uma povoação, marca o início do trilho que desce pelo vale do Escuriza até Crivillén.\n\nA cerca de trinta minutos a pé da Venta de la Pintada, junto à N-211, outro miradouro olha para a serra de Majalinos. A Venta é também o ponto de partida da Silent Route pela A-1702. E no miradouro do Campillo, a 1110 metros, as abróteas florescem no final de abril e início de maio."}]},"status":"pending"},{"id":"plaza-ejulve","town":"Ejulve","cat":"patrimonio","lat":40.77515,"lon":-0.55288,"coord_src":"https://es.hispanopedia.com/wiki/Ejulve","q":["Plaza Mayor, Ejulve","Ayuntamiento de Ejulve","Iglesia de Santa María la Mayor, Ejulve"],"fq":["Ejulve ayuntamiento","Ejulve plaza","Ejulve Teruel"],"name":{"es":"Plaza del Ayuntamiento de Ejulve","en":"Ejulve Town Hall Square","fr":"Place de la mairie d'Ejulve","de":"Rathausplatz von Ejulve","pt":"Praça da Câmara de Ejulve"},"when":{"es":"Siglos XVI-XVII · Lonja con escudo de 1563","en":"16th-17th centuries · Arcade with 1563 coat of arms","fr":"XVIe-XVIIe siècles · Arcades et blason de 1563","de":"16.-17. Jh. · Arkaden mit Wappen von 1563","pt":"Séculos XVI-XVII · Arcadas com brasão de 1563"},"desc":{"es":"La plaza Mayor de Ejulve reúne una casa consistorial del siglo XVI con cuatro arcos, una posada del XVII y casas solariegas. Es la puerta de entrada a la Silent Route y al Maestrazgo.","en":"Ejulve's main square brings together a 16th-century town hall with four arches, a 17th-century inn and manor houses. It is the gateway to the Silent Route and the Maestrazgo.","fr":"La grand-place d'Ejulve réunit une mairie du XVIe siècle à quatre arcades, une auberge du XVIIe et des maisons seigneuriales. C'est la porte d'entrée de la Silent Route et du Maestrazgo.","de":"Der Hauptplatz von Ejulve vereint ein Rathaus aus dem 16. Jahrhundert mit vier Bögen, eine Herberge aus dem 17. Jahrhundert und Herrenhäuser. Er ist das Tor zur Silent Route und zum Maestrazgo.","pt":"A praça principal de Ejulve reúne uns paços do concelho do século XVI com quatro arcos, uma estalagem do século XVII e casas solarengas. É a porta de entrada para a Silent Route e para o Maestrazgo."},"visit":{"es":"La plaza y las calles del casco se recorren libremente a pie. Para visitar la iglesia, pregunta en el ayuntamiento. Ejulve tiene servicios básicos y es una buena parada antes de seguir por la A-1702.","en":"The square and the streets of the old centre can be explored freely on foot. To visit the church, ask at the town hall. Ejulve has basic services and is a good stop before continuing along the A-1702.","fr":"La place et les rues du centre se parcourent librement à pied. Pour visiter l'église, renseignez-vous à la mairie. Ejulve dispose des services de base et c'est une bonne halte avant de continuer sur l'A-1702.","de":"Platz und Gassen des Ortskerns sind frei zu Fuß zugänglich. Für einen Besuch der Kirche im Rathaus fragen. Ejulve hat eine Grundversorgung und ist ein guter Halt, bevor es auf der A-1702 weitergeht.","pt":"A praça e as ruas do centro percorrem-se livremente a pé. Para visitar a igreja, pergunte na câmara municipal. Ejulve tem serviços básicos e é uma boa paragem antes de seguir pela A-1702."},"src":"https://es.hispanopedia.com/wiki/Ejulve","sources":["https://www.lacomarca.net/andorra-sierra-arcos-refuerza-marca-turistica-video-tierra-silencios-recorre-destinos-mas-iconicos/"],"art":{"es":[{"h":"Historia","t":"La casa consistorial es un edificio rectangular del siglo XVI que abre a la plaza Mayor con cuatro arcos en la planta baja. En la fachada luce un escudo con la fecha de 1563. Se restauró entre 1991 y 1994.\n\nEnfrente, la posada de la plaza es una casona de tres plantas del siglo XVII con planta baja de piedra; en los años sesenta acogió la central de teléfonos. No muy lejos, la casa Felicitas, del siglo XVI, fue convento durante los siglos XVII y XVIII."},{"h":"Qué ver","t":"La iglesia de Santa María la Mayor conserva la torre y parte de la fachada de un templo gótico anterior, una portada plateresca de finales del siglo XVI y diez capillas. El bombardeo de marzo de 1938 destruyó su tejado y sus bóvedas, que se rehicieron después.\n\nLa plaza es el escenario de las fiestas: en la semana de San Antón, en torno al 17 de enero, arde una gran hoguera, y en las fiestas mayores de septiembre se celebra la Melocotonada, cuando se lanzan melocotones desde las ventanas del ayuntamiento."}],"en":[{"h":"History","t":"The town hall is a rectangular 16th-century building that opens onto the main square with four arches on the ground floor. Its façade bears a coat of arms dated 1563. It was restored between 1991 and 1994.\n\nOpposite, the square's inn is a three-storey 17th-century mansion with a stone ground floor; in the 1960s it housed the telephone exchange. Not far away, Casa Felicitas, from the 16th century, was a convent during the 17th and 18th centuries."},{"h":"What to see","t":"The church of Santa María la Mayor keeps the tower and part of the façade of an earlier Gothic church, a Plateresque doorway from the late 16th century and ten chapels. The bombing of March 1938 destroyed its roof and vaults, which were later rebuilt.\n\nThe square is the stage for the festivals: in the week of San Antón, around 17 January, a large bonfire burns, and during the main festivals in September the Melocotonada takes place, when peaches are thrown from the town hall windows."}],"fr":[{"h":"Histoire","t":"La mairie est un bâtiment rectangulaire du XVIe siècle qui s'ouvre sur la grand-place par quatre arcades au rez-de-chaussée. Sa façade porte un blason daté de 1563. Elle a été restaurée entre 1991 et 1994.\n\nEn face, l'auberge de la place est une grande demeure de trois niveaux du XVIIe siècle au rez-de-chaussée en pierre ; dans les années 1960, elle a accueilli le central téléphonique. Non loin, la maison Felicitas, du XVIe siècle, fut un couvent aux XVIIe et XVIIIe siècles."},{"h":"À voir","t":"L'église Santa María la Mayor conserve la tour et une partie de la façade d'une église gothique antérieure, un portail plateresque de la fin du XVIe siècle et dix chapelles. Le bombardement de mars 1938 a détruit sa toiture et ses voûtes, reconstruites par la suite.\n\nLa place est le théâtre des fêtes : la semaine de la Saint-Antoine, vers le 17 janvier, un grand feu y brûle, et pendant les fêtes patronales de septembre a lieu la Melocotonada, quand on lance des pêches depuis les fenêtres de la mairie."}],"de":[{"h":"Geschichte","t":"Das Rathaus ist ein rechteckiger Bau aus dem 16. Jahrhundert, der sich mit vier Bögen im Erdgeschoss zum Hauptplatz öffnet. An der Fassade prangt ein Wappen mit der Jahreszahl 1563. Es wurde zwischen 1991 und 1994 restauriert.\n\nGegenüber steht die Herberge am Platz, ein dreigeschossiges Herrenhaus aus dem 17. Jahrhundert mit steinernem Erdgeschoss; in den 1960er Jahren war hier die Telefonvermittlung untergebracht. Nicht weit entfernt war die Casa Felicitas aus dem 16. Jahrhundert im 17. und 18. Jahrhundert ein Kloster."},{"h":"Sehenswert","t":"Die Kirche Santa María la Mayor bewahrt den Turm und einen Teil der Fassade einer älteren gotischen Kirche, ein plateresk gestaltetes Portal vom Ende des 16. Jahrhunderts und zehn Kapellen. Die Bombardierung im März 1938 zerstörte Dach und Gewölbe, die später wiederaufgebaut wurden.\n\nDer Platz ist Schauplatz der Feste: In der Woche von San Antón, um den 17. Januar, brennt ein großes Feuer, und bei den Hauptfesten im September findet die Melocotonada statt, bei der Pfirsiche aus den Fenstern des Rathauses geworfen werden."}],"pt":[{"h":"História","t":"Os paços do concelho são um edifício retangular do século XVI que se abre para a praça principal com quatro arcos no rés do chão. Na fachada ostenta um brasão com a data de 1563. Foram restaurados entre 1991 e 1994.\n\nEm frente, a estalagem da praça é um casarão de três pisos do século XVII com rés do chão em pedra; nos anos sessenta acolheu a central telefónica. Não muito longe, a casa Felicitas, do século XVI, foi convento durante os séculos XVII e XVIII."},{"h":"O que ver","t":"A igreja de Santa María la Mayor conserva a torre e parte da fachada de um templo gótico anterior, um portal plateresco do final do século XVI e dez capelas. O bombardeamento de março de 1938 destruiu o telhado e as abóbadas, que foram refeitos depois.\n\nA praça é o palco das festas: na semana de Santo Antão, por volta de 17 de janeiro, arde uma grande fogueira, e nas festas principais de setembro celebra-se a Melocotonada, quando se atiram pêssegos das janelas da câmara."}]},"status":"pending"},{"id":"santa-ana-ejulve","town":"Ejulve","cat":"naturaleza","lat":40.76912,"lon":-0.55154,"coord_src":null,"q":["Ermita de Santa Ana, Ejulve","Mirador de Santa Ana, Ejulve"],"fq":["Ermita de Santa Ana Ejulve","Silent Route A-1702","Ejulve Teruel paisaje"],"name":{"es":"Mirador de Santa Ana y Silent Route","en":"Santa Ana Viewpoint and the Silent Route","fr":"Belvédère de Santa Ana et Silent Route","de":"Aussichtspunkt Santa Ana und Silent Route","pt":"Miradouro de Santa Ana e Silent Route"},"when":{"es":"Ermita del siglo XV · Inicio de la A-1702","en":"15th-century hermitage · Start of the A-1702","fr":"Ermitage du XVe siècle · Début de l'A-1702","de":"Einsiedelei des 15. Jh. · Beginn der A-1702","pt":"Ermida do século XV · Início da A-1702"},"desc":{"es":"La ermita de la patrona de Ejulve, sobre una loma junto al manantial que abastece al pueblo, es el primer mirador de la Silent Route. Desde aquí la A-1702 se adentra en el Maestrazgo entre sierras.","en":"The hermitage of Ejulve's patron saint, on a hill by the spring that supplies the village, is the first viewpoint on the Silent Route. From here the A-1702 heads into the Maestrazgo between mountain ranges.","fr":"L'ermitage de la patronne d'Ejulve, sur une butte près de la source qui alimente le village, est le premier belvédère de la Silent Route. D'ici, l'A-1702 s'enfonce dans le Maestrazgo entre les sierras.","de":"Die Einsiedelei der Schutzpatronin von Ejulve auf einem Hügel an der Quelle, die das Dorf versorgt, ist der erste Aussichtspunkt der Silent Route. Von hier führt die A-1702 zwischen Bergketten hinein in den Maestrazgo.","pt":"A ermida da padroeira de Ejulve, numa colina junto à nascente que abastece a aldeia, é o primeiro miradouro da Silent Route. Daqui, a A-1702 entra no Maestrazgo entre serras."},"visit":{"es":"Se llega en coche por la A-1702 nada más salir de Ejulve; hay mesas para comer al aire libre. La Silent Route es una carretera de montaña con curvas: conduce con calma y para solo en los miradores y apartaderos.","en":"You reach it by car on the A-1702 just after leaving Ejulve; there are picnic tables. The Silent Route is a winding mountain road: drive calmly and stop only at viewpoints and lay-bys.","fr":"On y accède en voiture par l'A-1702 juste à la sortie d'Ejulve ; il y a des tables de pique-nique. La Silent Route est une route de montagne sinueuse : conduisez calmement et arrêtez-vous seulement aux belvédères et aux aires de stationnement.","de":"Man erreicht sie mit dem Auto über die A-1702 gleich hinter Ejulve; es gibt Picknicktische. Die Silent Route ist eine kurvige Bergstraße: ruhig fahren und nur an Aussichtspunkten und Haltebuchten anhalten.","pt":"Chega-se de carro pela A-1702, logo à saída de Ejulve; há mesas para piqueniques. A Silent Route é uma estrada de montanha com muitas curvas: conduza com calma e pare apenas nos miradouros e zonas de paragem."},"src":"https://www.lacomarca.net/reportajes/miradores-mas-imponentes-andorra-sierra-arcos/","sources":["https://es.hispanopedia.com/wiki/Ejulve","https://www.interregeurope.eu/good-practices/the-silent-route","https://www.mundomotero.com/ruta-del-silencio-a-1702-teruel-guia-completa-mapa-paradas","https://www.lacomarca.net/ma-angeles-tomas-tecnica-cultura-turismo-andorra-sierra-arcos-estamos-consiguiendo-posicionarnos-destino-turistico-emergente/"],"art":{"es":[{"h":"Historia","t":"La ermita de Santa Ana se levantó hacia finales del siglo XV y está dedicada a la patrona de Ejulve. Se alza sobre una loma, encima del manantial que da agua al pueblo. Junto a ella, el mirador ofrece vistas del caserío y de la cabecera del Guadalopillo.\n\nLa Silent Route nació antes de la pandemia como un producto turístico compartido por las comarcas de Andorra-Sierra de Arcos y Maestrazgo. Sigue la A-1702 durante unos 60 kilómetros, desde la Venta de la Pintada, en Gargallo, hasta el puerto de Cuarto Pelado, y su mascota es una cabra llamada Silencioso."},{"h":"El paisaje","t":"A partir de Ejulve empieza el tramo más escénico de la carretera. Más adelante esperan los miradores del barranco de Cueva Muñoz, del Cabezo Gordo y de los Órganos de Montoro, monumento natural en el límite con Villarluengo, y el del Alto Maestrazgo, con la cabra que sirve de logotipo a la ruta.\n\nEl incendio de 2009 abrió el paisaje de la sierra de Majalinos; cada primavera una andada, 'Nuestros montes no se olvidan', lo recuerda. En el término también están las masías de Ejulve, otro mirador al que se llega por pista y un último tramo a pie."}],"en":[{"h":"History","t":"The hermitage of Santa Ana was built towards the end of the 15th century and is dedicated to Ejulve's patron saint. It stands on a hill above the spring that supplies the village with water. Beside it, the viewpoint offers views of the village and the upper Guadalopillo valley.\n\nThe Silent Route was launched before the pandemic as a tourism product shared by the comarcas of Andorra-Sierra de Arcos and Maestrazgo. It follows the A-1702 for about 60 kilometres, from Venta de la Pintada, in Gargallo, to the Cuarto Pelado pass, and its mascot is a goat called Silencioso."},{"h":"The landscape","t":"The most scenic stretch of the road begins at Ejulve. Further on come the viewpoints of the Cueva Muñoz ravine, Cabezo Gordo and the Órganos de Montoro, a natural monument on the boundary with Villarluengo, and the Alto Maestrazgo viewpoint, with the goat that serves as the route's logo.\n\nThe 2009 fire opened up the landscape of the Sierra de Majalinos; every spring a walk, 'Nuestros montes no se olvidan' (Our hills are not forgotten), remembers it. The municipality also includes the Masías de Ejulve, another viewpoint reached by a track and a final stretch on foot."}],"fr":[{"h":"Histoire","t":"L'ermitage de Santa Ana a été construit vers la fin du XVe siècle et il est dédié à la patronne d'Ejulve. Il se dresse sur une butte, au-dessus de la source qui alimente le village en eau. À côté, le belvédère offre des vues sur le village et sur le haut Guadalopillo.\n\nLa Silent Route est née avant la pandémie comme un produit touristique partagé par les comarcas d'Andorra-Sierra de Arcos et du Maestrazgo. Elle suit l'A-1702 sur une soixantaine de kilomètres, de la Venta de la Pintada, à Gargallo, jusqu'au col de Cuarto Pelado, et sa mascotte est une chèvre appelée Silencioso."},{"h":"Le paysage","t":"C'est à partir d'Ejulve que commence le tronçon le plus spectaculaire de la route. Plus loin attendent les belvédères du ravin de Cueva Muñoz, du Cabezo Gordo et des Órganos de Montoro, monument naturel à la limite de Villarluengo, et celui de l'Alto Maestrazgo, avec la chèvre qui sert de logo à la route.\n\nL'incendie de 2009 a ouvert le paysage de la sierra de Majalinos ; chaque printemps, une marche, « Nuestros montes no se olvidan » (Nos montagnes ne s'oublient pas), le rappelle. La commune compte aussi les Masías de Ejulve, un autre belvédère que l'on rejoint par une piste puis un dernier tronçon à pied."}],"de":[{"h":"Geschichte","t":"Die Einsiedelei Santa Ana entstand gegen Ende des 15. Jahrhunderts und ist der Schutzpatronin von Ejulve geweiht. Sie steht auf einem Hügel über der Quelle, die das Dorf mit Wasser versorgt. Daneben bietet der Aussichtspunkt Blicke auf den Ort und das obere Tal des Guadalopillo.\n\nDie Silent Route entstand vor der Pandemie als gemeinsames touristisches Angebot der Comarcas Andorra-Sierra de Arcos und Maestrazgo. Sie folgt der A-1702 auf rund 60 Kilometern von der Venta de la Pintada in Gargallo bis zum Pass Cuarto Pelado, und ihr Maskottchen ist eine Ziege namens Silencioso."},{"h":"Die Landschaft","t":"Ab Ejulve beginnt der landschaftlich eindrucksvollste Abschnitt der Straße. Weiter vorn warten die Aussichtspunkte an der Schlucht Cueva Muñoz, am Cabezo Gordo und an den Órganos de Montoro, einem Naturdenkmal an der Grenze zu Villarluengo, sowie der Aussichtspunkt Alto Maestrazgo mit der Ziege, die als Logo der Route dient.\n\nDer Brand von 2009 hat die Landschaft der Sierra de Majalinos geöffnet; jedes Frühjahr erinnert eine Wanderung, „Nuestros montes no se olvidan“ (Unsere Berge werden nicht vergessen), daran. Zur Gemeinde gehören auch die Masías de Ejulve, ein weiterer Aussichtspunkt, den man über eine Piste und ein letztes Stück zu Fuß erreicht."}],"pt":[{"h":"História","t":"A ermida de Santa Ana foi construída por volta do final do século XV e é dedicada à padroeira de Ejulve. Ergue-se numa colina, por cima da nascente que dá água à aldeia. Ao lado, o miradouro oferece vistas do casario e da cabeceira do Guadalopillo.\n\nA Silent Route nasceu antes da pandemia como um produto turístico partilhado pelas comarcas de Andorra-Sierra de Arcos e Maestrazgo. Segue a A-1702 ao longo de cerca de 60 quilómetros, desde a Venta de la Pintada, em Gargallo, até ao porto de montanha de Cuarto Pelado, e a sua mascote é uma cabra chamada Silencioso."},{"h":"A paisagem","t":"A partir de Ejulve começa o troço mais cénico da estrada. Mais à frente esperam os miradouros do barranco de Cueva Muñoz, do Cabezo Gordo e dos Órganos de Montoro, monumento natural no limite com Villarluengo, e o do Alto Maestrazgo, com a cabra que serve de logótipo à rota.\n\nO incêndio de 2009 abriu a paisagem da serra de Majalinos; todas as primaveras uma caminhada, 'Nuestros montes no se olvidan' (Os nossos montes não se esquecem), recorda-o. No concelho ficam também as Masías de Ejulve, outro miradouro a que se chega por caminho de terra e um último troço a pé."}]},"status":"pending"}],"towns":[{"name":"Alacón","lat":41.02322,"lon":-0.69671},{"name":"Alloza","lat":40.9691,"lon":-0.52992},{"name":"Andorra","lat":40.97722,"lon":-0.44472},{"name":"Ariño","lat":41.033,"lon":-0.6},{"name":"Crivillén","lat":40.88321,"lon":-0.57685},{"name":"Ejulve","lat":40.77515,"lon":-0.55288},{"name":"Estercuel","lat":40.85533,"lon":-0.63188},{"name":"Gargallo","lat":40.83596,"lon":-0.58382},{"name":"Oliete","lat":40.99354,"lon":-0.67964}],"context":[],"routes":[{"id":"carbon-e-iberos","cat":"arqueologia","mode":"car","stops":["mwinas","el-cabo","valcaria","arte-rupestre-alacon","san-pedro-oliete","sima-san-pedro","cueva-foradada"],"name":{"es":"Carbón e íberos","en":"Coal and Iberians","fr":"Charbon et Ibères","de":"Kohle und Iberer","pt":"Carvão e iberos"},"summary":{"es":"De la mina de Andorra a las fortalezas íberas y la sima de Oliete, pasando por los dinosaurios de Ariño y el arte rupestre de Alacón.","en":"From the Andorra mine to the Iberian fortresses and the sinkhole of Oliete, by way of the dinosaurs of Ariño and the rock art of Alacón.","fr":"De la mine d'Andorra aux forteresses ibères et au gouffre d'Oliete, en passant par les dinosaures d'Ariño et l'art rupestre d'Alacón.","de":"Vom Bergwerk in Andorra zu den iberischen Festungen und der Doline von Oliete, vorbei an den Dinosauriern von Ariño und der Felskunst von Alacón.","pt":"Da mina de Andorra às fortalezas iberas e ao algar de Oliete, passando pelos dinossauros de Ariño e pela arte rupestre de Alacón."},"cover":"mwinas"},{"id":"tierra-de-silencios","cat":"naturaleza","mode":"car","stops":["calvario-alloza","pasarelas-escuriza","crivillen-casco","monasterio-olivar","majalinontes","plaza-ejulve","santa-ana-ejulve"],"name":{"es":"Tierra de silencios","en":"Land of Silences","fr":"Terre de silences","de":"Land der Stille","pt":"Terra de silêncios"},"summary":{"es":"Del Calvario de Alloza y el río Escuriza a la sierra, el Monasterio del Olivar y el arranque de la Silent Route en Ejulve.","en":"From the Calvary of Alloza and the River Escuriza up into the hills, the Monasterio del Olivar and the start of the Silent Route in Ejulve.","fr":"Du Calvaire d'Alloza et de l'Escuriza vers la sierra, le Monasterio del Olivar et le début de la Silent Route à Ejulve.","de":"Vom Kalvarienberg in Alloza und dem Escuriza hinauf in die Berge, zum Monasterio del Olivar und zum Beginn der Silent Route in Ejulve.","pt":"Do Calvário de Alloza e do rio Escuriza até à serra, ao Monasterio del Olivar e ao início da Silent Route em Ejulve."},"cover":"calvario-alloza"}],"adminSample":{"visits":3140,"foreign":32,"qrScans":860,"audio":1270,"stamps":640,"offline":210,"byLang":[["ES",2140],["EN",410],["FR",380],["DE",120],["PT",90]],"byMonth":[[4,310],[5,420],[6,380],[7,520],[8,690],[9,450],[10,370]],"top":[["mwinas",610],["el-cabo",420],["san-pedro-oliete",350],["sima-san-pedro",300],["cueva-foradada",240],["arte-rupestre-alacon",210],["valcaria",170]]},"eventos":[{"mun":"Estercuel","month":1,"src":"https://es.hispanopedia.com/wiki/Estercuel","name":{"es":"Sanantones y La Encamisada","en":"Sanantones and La Encamisada","fr":"Sanantones et La Encamisada","de":"Sanantones und La Encamisada","pt":"Sanantones e La Encamisada"},"when":{"es":"Fin de semana más próximo al 1
