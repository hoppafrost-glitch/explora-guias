/* Layout: one-screen app. Map is the stage; a reading panel sits beside it (stacked under it on phones).
   Palette drawn from the Ribera: limestone ground, Ebro teal, mudéjar brick, steppe ochre. */
:root{
  --bg:#ECEFEA; --panel:#FAFBF8; --panel-2:#F2F4EF; --ink:#18221E; --muted:#56635D; --faint:#646F6A;
  --line:#D5DBD3; --accent:#17646C; --accent-ink:#FFFFFF; --accent-soft:#D6E8E8;
  --land:#E2E6DB; --land-hi:#D5DCCB; --land-out:#EEF0EA; --edge:#9AA79C; --outline:#17646C;
  --water:#3C8D96; --water-soft:#BFDCDD; --label:#2E3A35;
  --c-pat:#A4502C; --c-gue:#5A6A33; --c-mus:#7A4A7F; --c-hid:#2A6CA1; --c-nat:#3C8550; --c-arq:#97702F; --c-cam:#B98A0E;
  --ok:#2E7D4F; --shadow:0 1px 2px rgba(20,34,30,.08),0 6px 18px rgba(20,34,30,.08);
  --f-display:"Spectral",Georgia,"Times New Roman",serif;
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --panel:#141C19; --panel-2:#19231F; --ink:#E5ECE8; --muted:#9FADA7; --faint:#7E8C86;
  --line:#26332E; --accent:#5DB6BE; --accent-ink:#0B1513; --accent-soft:#183437;
  --land:#1A2420; --land-hi:#21302A; --land-out:#111815; --edge:#3A4A43; --outline:#5DB6BE;
  --water:#3E8F98; --water-soft:#1B3A3D; --label:#C9D4CF;
  --c-pat:#E08A63; --c-gue:#A9B872; --c-mus:#C08BC5; --c-hid:#6FA9DA; --c-nat:#7CC48D; --c-arq:#D6AE68; --c-cam:#E5BD45;
  --ok:#69C08E; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --panel:#141C19; --panel-2:#19231F; --ink:#E5ECE8; --muted:#9FADA7; --faint:#7E8C86;
  --line:#26332E; --accent:#5DB6BE; --accent-ink:#0B1513; --accent-soft:#183437;

  --ok:#69C08E; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

#app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:1001}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.brand svg{flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:1.28rem;line-height:1.1;letter-spacing:.01em}
.brand-sub{font-size:.74rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel-2)}
.langs button{border:0;background:transparent;padding:5px 10px;font-size:.78rem;font-weight:600;letter-spacing:.05em;cursor:pointer;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.demo-tag{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);border-radius:4px;padding:2px 6px}

main{display:grid;grid-template-columns:minmax(330px,410px) 1fr;min-height:0}
#panel{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
#mapwrap{position:relative;min-height:0;min-width:0}
#map{position:absolute;inset:0;background:var(--bg)}
@media (max-width:760px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(260px,46%) 1fr}
  #mapwrap{order:-1}
  #panel{border-right:0;border-top:1px solid var(--line)}

.note{font-size:.78rem;color:var(--faint);line-height:1.45}

/* Map */
.leaflet-container{font-family:var(--f-ui);background:var(--bg)}
.muni{fill:var(--land);stroke:var(--edge);stroke-width:.8}
.muni.out{fill:var(--land-out);stroke:var(--edge);stroke-opacity:.45;stroke-width:.6}
.muni.hl{fill:var(--land-hi)}
.comarca-outline{fill:none;stroke:var(--outline);stroke-width:2.2;stroke-dasharray:1 0}
.river-halo{stroke:var(--water-soft);stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.river{stroke:var(--water);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tiles-on .muni{fill-opacity:.0;stroke-opacity:.6}
.tiles-on .muni.out{fill-opacity:0}
.tiles-on .river,.tiles-on .river-halo{stroke-opacity:0}
.tiles-on .town-label,.tiles-on .river-label{display:none}
.tiles-on .comarca-outline{stroke-width:2.6;stroke-opacity:.85}
.route-line{stroke:var(--c);stroke-width:3.5;stroke-dasharray:2 7;stroke-linecap:round;fill:none}
.town-label{font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--label);white-space:nowrap;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 6px var(--bg);pointer-events:none;letter-spacing:.02em;transform:translate(-50%,7px);display:inline-block}
.town-label.out{font-weight:500;font-size:11px;color:var(--faint);font-style:italic}
.river-label{font-family:var(--f-display);font-style:italic;font-size:14px;color:var(--water);letter-spacing:.35em;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg);white-space:nowrap;pointer-events:none;transform:translate(-50%,-50%) rotate(-12deg);display:inline-block}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 6px;transform:rotate(-45deg);background:var(--c);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.35);border:2px solid var(--panel);transition:transform .15s}
.pin svg{width:15px;height:15px;transform:rotate(45deg);color:#fff}
.pin.sel{transform:rotate(-45deg) scale(1.28);border-color:var(--ink)}
.pin.dim{opacity:.28}
.zlow .pin{width:13px;height:13px;border-radius:50%;transform:translate(-2.5px,23.5px);border-width:1.5px}
.zlow .pin svg{display:none}
.zlow .pin.sel{transform:translate(-2.5px,23.5px) scale(1.6)}
.zfar .town-label.minor{display:none}
.stopnum{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--panel);font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--panel);transform:translate(14px,-40px);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.zlow .stopnum{transform:translate(4px,-14px)}
.leaflet-control-zoom a,.mapbtn{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:var(--shadow)!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 85%,transparent)!important;color:var(--muted)!important;font-size:10px!important}
.leaflet-control-attribution a{color:var(--accent)!important}
.leaflet-top.leaflet-left{left:env(safe-area-inset-left,0px)}
.layerbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;display:flex;flex-direction:column;gap:2px}
.layerbox button{border:0;background:none;text-align:left;padding:6px 10px;border-radius:6px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--muted)}
.layerbox button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.legend{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px 10px;font-size:.74rem;display:flex;flex-direction:column;gap:3px;max-width:180px}
.legend div{display:flex;align-items:center;gap:7px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
@media (max-width:760px){.legend{display:none}.layerbox{flex-direction:row;padding:3px;margin-left:max(10px,env(safe-area-inset-left,0px))!important}.layerbox button{padding:5px 8px;font-size:.72rem}.leaflet-bottom.leaflet-left{bottom:16px}}

/* Móvil: la página entera hace scroll; el mapa queda arriba y se va al bajar, así se lee a pantalla completa */
@media (max-width:760px){
  html,body{height:auto}
  #app{height:auto;display:block}
  main{display:flex;flex-direction:column}
  #mapwrap{order:-1;height:40vh;height:40svh;min-height:230px;flex:none}
  #panel{min-height:calc(100vh - 56px);min-height:calc(100svh - 56px)}
  nav.tabs{position:sticky;top:0;z-index:1002;background:var(--panel)}
  .view{overflow:visible;flex:none;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  #tomap{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:1500;display:flex;align-items:center;gap:7px;
    border:0;border-radius:999px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.86rem;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;
    transition:opacity .2s,transform .2s}
  #tomap svg{width:17px;height:17px}
  #tomap[data-off]{opacity:0;transform:translateY(12px);pointer-events:none}
}
@media (min-width:761px){#tomap{display:none}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:8px;font-size:.86rem;z-index:5000;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- avisos, pasaporte, agenda, gestión ---- */
.btn.primary span,.btn.primary{color:var(--accent-ink)}
.aviso{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--panel-2);border-radius:10px;padding:10px 12px;font-size:.88rem}
.aviso b{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.aviso.warn{border-left-color:#B4441F}.aviso.warn b{color:#B4441F}
.aviso.prize{border-left-color:#B8860B}.aviso.prize b{color:#8A6508}
.stampbox,.passcta{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel-2)}
.passcta{width:100%;cursor:pointer;font:inherit;color:var(--ink);text-align:left}
.passcta:hover{border-color:var(--accent)}
.passcta .go{margin-left:auto;font-size:1.4rem;color:var(--muted)}
.seal{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--c,var(--accent));color:var(--c,var(--accent))}
.seal svg{width:22px;height:22px}
.stampbox.done .seal{border-style:solid;background:var(--c);color:#fff}
.passcta.ag .seal{border-style:solid;border-radius:12px}
.passhead{display:flex;align-items:center;gap:16px}
.ring{--p:0;flex:none;width:92px;height:92px;border-radius:50%;display:grid;place-content:center;text-align:center;
  background:radial-gradient(closest-side,var(--panel) 78%,transparent 79%),conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
.ring b{font-size:1.6rem;line-height:1}.ring span{font-size:.75rem;color:var(--muted)}
.prow{display:grid;grid-template-columns:1fr;gap:4px;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);cursor:pointer;font:inherit;color:var(--ink)}
.prow .t{font-weight:600;font-size:.92rem}
.pbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.pbar i{display:block;height:100%;background:var(--c)}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin:6px 0 10px}
.stamp{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;cursor:pointer;font:inherit;color:var(--muted);padding:4px}
.stamp .seal{width:58px;height:58px;border-color:var(--line)}
.stamp.on .seal{border:2px solid var(--c);background:var(--c);color:#fff}
.stamp.on{color:var(--ink)}
.stamp .nm{font-size:.74rem;line-height:1.25;text-align:center;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ev{display:flex;gap:12px;border-bottom:1px solid var(--line);padding:10px 0}
.ev p{margin:2px 0 0;font-size:.88rem}
.cal{flex:none;width:52px;border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:center;background:var(--panel)}
.cal span{display:block;background:var(--accent);color:var(--accent-ink);font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 0}
.cal b{display:block;font-size:1.2rem;padding:4px 0}
.cal{align-self:flex-start}.cal.m{border:2px solid var(--accent)}.cal.m b{font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);padding:9px 0}
.bars.wide .bar{grid-template-columns:minmax(0,1.4fr) 1fr auto}.bars.wide .bar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.neg{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:8px 0}
.adm-nav{display:flex;flex-wrap:wrap;gap:6px}
.adm-nav a{font-size:.8rem;border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--ink);text-decoration:none;background:var(--panel-2)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.two-col{grid-template-columns:1fr}}
.foot-links{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;padding-bottom:8px}
.foot-links a{color:var(--muted)}
details summary{cursor:pointer;padding:4px 0}
.skip{position:absolute;left:-9999px;top:8px;z-index:9999;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;font-weight:700}
.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

</style>

<div id="cover" hidden></div>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<div id="app"><a class="skip" href="#panel" data-i="skipLink"></a>
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="var(--accent)"/><path d="M4 22c5-1 6-7 11-7s5 9 10 9 4-6 5-7" stroke="var(--accent-ink)" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="23" cy="10" r="2.6" fill="var(--accent-ink)"/></svg>
      <div style="min-width:0">
        <div class="brand-name">Cinco Villas Explora</div>
        <div class="brand-sub" data-i="appSub"></div>
      </div>
    </div>
    <span class="demo-tag" data-i="demo"></span>
    <div class="langs" role="group" aria-label="Idioma / Language" id="langs"></div>
  </header>
  <main>
    <aside id="panel">
      <nav class="tabs" role="tablist" id="tabs">
        <button role="tab" data-tab="inicio" data-i="tabHome"></button>
        <button role="tab" data-tab="explorar" data-i="tabExplore"></button>
        <button role="tab" data-tab="rutas" data-i="tabRoutes"></button>
        <button role="tab" data-tab="agenda" data-i="tabAgenda"></button>
        <button role="tab" data-tab="pasaporte" data-i="tabPass"></button>
      </nav>
      <section class="view stack" id="v-inicio"></section>
      <section class="view stack" id="v-explorar" hidden></section>
      <section class="view stack" id="v-lugar" hidden></section>
      <section class="view stack" id="v-rutas" hidden></section>
      <section class="view stack" id="v-agenda" hidden></section>
      <section class="view stack" id="v-pasaporte" hidden></section>
      <section class="view stack" id="v-gestion" hidden></section>
    </aside>
    <div id="mapwrap"><div id="map" role="application" aria-label="Mapa"></div></div>
    <button type="button" id="tomap" data-off><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 4-6 3v13l6-3 6 3 6-3V4l-6 3-6-3z"/><path d="M9 4v13M15 7v13"/></svg><span data-i="tabMap"></span></button>
  </main>
</div>

t":42.4973,"lon":-1.2157,"coord_src":"https://es.wikipedia.org/wiki/Sos_del_Rey_Cat%C3%B3lico","q":["Sos del Rey Católico","Plaza de la Villa, Sos del Rey Católico"],"fq":["Sos del Rey Católico","Sos del Rey Católico calle","Sos del Rey Católico muralla"],"name":{"es":"Casco histórico de Sos del Rey Católico","en":"Historic centre of Sos del Rey Católico","fr":"Centre historique de Sos del Rey Católico","de":"Altstadt von Sos del Rey Católico","pt":"Centro histórico de Sos del Rey Católico"},"when":{"es":"Medieval · Conjunto histórico desde 1968","en":"Medieval · Historic ensemble since 1968","fr":"Médiéval · Ensemble historique depuis 1968","de":"Mittelalter · Historisches Ensemble seit 1968","pt":"Medieval · Conjunto histórico desde 1968"},"desc":{"es":"Sos se levanta sobre un cerro en la vieja frontera entre Aragón y Navarra. Su casco antiguo, de calles empedradas, murallas y casonas de piedra, fue declarado conjunto histórico-artístico en 1968.","en":"Sos stands on a hill on the old border between Aragon and Navarre. Its old town of cobbled streets, walls and stone mansions was declared a historic-artistic ensemble in 1968.","fr":"Sos se dresse sur une colline, sur l'ancienne frontière entre l'Aragon et la Navarre. Sa vieille ville de rues pavées, de remparts et de demeures de pierre a été déclarée ensemble historique et artistique en 1968.","de":"Sos liegt auf einem Hügel an der alten Grenze zwischen Aragonien und Navarra. Die Altstadt mit Pflastergassen, Mauern und Steinhäusern wurde 1968 zum historisch-künstlerischen Ensemble erklärt.","pt":"Sos ergue-se num cerro na antiga fronteira entre Aragão e Navarra. O seu centro antigo, de ruas empedradas, muralhas e casarões de pedra, foi declarado conjunto histórico-artístico em 1968."},"visit":{"es":"Se recorre a pie y por libre; calcula al menos dos horas. La oficina de turismo, en el Palacio de Sada, organiza visitas guiadas por la villa: confirma horarios antes de ir. Las calles son empinadas y empedradas, así que lleva calzado cómodo.","en":"Explore it on foot at your own pace; allow at least two hours. The tourist office in the Palacio de Sada runs guided tours of the town: check times before you go. The streets are steep and cobbled, so wear comfortable shoes.","fr":"Elle se parcourt à pied, librement ; comptez au moins deux heures. L'office de tourisme du Palacio de Sada organise des visites guidées de la ville : vérifiez les horaires avant de venir. Les rues sont pentues et pavées, prévoyez des chaussures confortables.","de":"Am besten zu Fuß und auf eigene Faust; mindestens zwei Stunden einplanen. Das Fremdenverkehrsamt im Palacio de Sada bietet Stadtführungen an: Zeiten vorher erfragen. Die Gassen sind steil und gepflastert, also bequeme Schuhe tragen.","pt":"Percorre-se a pé e livremente; conte com pelo menos duas horas. O posto de turismo, no Palacio de Sada, organiza visitas guiadas pela vila: confirme os horários antes de ir. As ruas são íngremes e empedradas, por isso leve calçado confortável."},"src":"https://es.wikipedia.org/wiki/Sos_del_Rey_Cat%C3%B3lico","sources":["https://es.wikipedia.org/wiki/Sos_del_Rey_Cat%C3%B3lico","https://en.wikipedia.org/wiki/Sos_del_Rey_Cat%C3%B3lico","https://turismocincovillas.com/wp-content/uploads/2024/05/Sos-del-Rey-Catolico_Palacio-de-Sada.pdf"],"art":{"es":[{"h":"Historia","t":"Sancho I de Pamplona ganó la plaza a los musulmanes en 907 y la convirtió en bastión de frontera. En 1044 Ramiro I la incorporó al reino de Aragón. En 1452 la reina Juana Enríquez dio a luz aquí al futuro Fernando II de Aragón, y con el tiempo la villa tomó el apellido «del Rey Católico». En 1711 pasó a ser cabeza de las Cinco Villas.\n\nEn el barrio alto vivió desde el siglo XII una comunidad judía de unas treinta familias. Tras el decreto de expulsión de 1492, muchos de sus miembros cruzaron la frontera hacia Navarra."},{"h":"Qué ver","t":"Las murallas góticas conservan siete puertas, entre ellas el Portal de Zaragoza y el Portal de la Reina. La plaza de la Villa era el mercado medieval: bajo sus soportales se celebraba el mercado semanal y todavía se ven las medidas grabadas para comprobar pesos y longitudes. En ella están la Casa de la Villa, renacentista de finales del siglo XVI, y la Lonja medieval, del siglo XV, hoy biblioteca.\n\nEn la antigua judería, la plaza de la Sartén guarda una casa con el hueco de una mezuzá en la puerta. Más arriba esperan el Palacio de Sada, la iglesia de San Esteban y la torre del castillo."},{"h":"Curiosidades","t":"En el verano de 1984 Luis García Berlanga rodó aquí La vaquilla, con guion de Rafael Azcona, y muchos vecinos hicieron de extras. Una ruta por el pueblo recuerda los escenarios del rodaje y el Palacio de Sada dedica una sala a la película."}],"en":[{"h":"History","t":"Sancho I of Pamplona took the stronghold from the Muslims in 907 and made it a border bastion. In 1044 Ramiro I brought it into the Kingdom of Aragon. In 1452 Queen Juana Enríquez gave birth here to the future Ferdinand II of Aragon, and in time the town took the surname \"del Rey Católico\". In 1711 it became the head town of the Cinco Villas.\n\nFrom the 12th century a Jewish community of some thirty families lived in the upper quarter. After the expulsion decree of 1492, many of them crossed the border into Navarre."},{"h":"What to see","t":"The Gothic walls keep seven gates, among them the Portal de Zaragoza and the Portal de la Reina. The Plaza de la Villa was the medieval market: the weekly market was held under its arcades, and you can still see the measures carved to check weights and lengths. Here stand the Casa de la Villa, a Renaissance town hall from the late 16th century, and the 15th-century Lonja, now the library.\n\nIn the former Jewish quarter, the Plaza de la Sartén has a house with the slot for a mezuzah in its doorway. Further up are the Palacio de Sada, the Church of San Esteban and the castle tower."},{"h":"Curiosities","t":"In the summer of 1984 Luis García Berlanga filmed La vaquilla here, with a script by Rafael Azcona, and many locals worked as extras. A route through the town recalls the filming locations, and the Palacio de Sada has a room devoted to the film."}],"fr":[{"h":"Histoire","t":"Sanche Ier de Pampelune prit la place aux musulmans en 907 et en fit un bastion frontalier. En 1044, Ramire Ier l'intégra au royaume d'Aragon. En 1452, la reine Juana Enríquez y mit au monde le futur Ferdinand II d'Aragon, et la ville finit par prendre le nom « del Rey Católico ». En 1711, elle devint chef-lieu des Cinco Villas.\n\nÀ partir du XIIe siècle, une communauté juive d'une trentaine de familles vécut dans le quartier haut. Après le décret d'expulsion de 1492, beaucoup de ses membres passèrent la frontière vers la Navarre."},{"h":"À voir","t":"Les remparts gothiques conservent sept portes, dont le Portal de Zaragoza et le Portal de la Reina. La Plaza de la Villa était le marché médiéval : le marché hebdomadaire se tenait sous ses arcades et l'on y voit encore les mesures gravées pour vérifier poids et longueurs. On y trouve la Casa de la Villa, mairie Renaissance de la fin du XVIe siècle, et la Lonja médiévale du XVe siècle, aujourd'hui bibliothèque.\n\nDans l'ancien quartier juif, la Plaza de la Sartén conserve une maison avec l'encoche d'une mezouza dans l'encadrement de la porte. Plus haut vous attendent le Palacio de Sada, l'église San Esteban et la tour du château."},{"h":"Curiosités","t":"À l'été 1984, Luis García Berlanga y tourna La vaquilla, sur un scénario de Rafael Azcona, et de nombreux habitants firent de la figuration. Un parcours dans le village rappelle les lieux du tournage et le Palacio de Sada consacre une salle au film."}],"de":[{"h":"Geschichte","t":"Sancho I. von Pamplona nahm den Ort 907 den Muslimen ab und machte ihn zur Grenzfestung. 1044 gliederte Ramiro I. ihn dem Königreich Aragonien ein. 1452 brachte Königin Juana Enríquez hier den späteren Ferdinand II. von Aragonien zur Welt, und mit der Zeit erhielt der Ort den Beinamen „del Rey Católico“. 1711 wurde er Hauptort der Cinco Villas.\n\nIm oberen Viertel lebte ab dem 12. Jahrhundert eine jüdische Gemeinde von etwa dreißig Familien. Nach dem Vertreibungsedikt von 1492 gingen viele von ihnen über die Grenze nach Navarra."},{"h":"Sehenswert","t":"Die gotische Stadtmauer hat sieben Tore bewahrt, darunter das Portal de Zaragoza und das Portal de la Reina. Die Plaza de la Villa war der mittelalterliche Markt: Unter ihren Arkaden fand der Wochenmarkt statt, und noch heute sieht man die eingemeißelten Maße zur Prüfung von Gewichten und Längen. Hier stehen die Casa de la Villa, ein Renaissance-Rathaus vom Ende des 16. Jahrhunderts, und die mittelalterliche Lonja aus dem 15. Jahrhundert, heute Bibliothek.\n\nIm einstigen jüdischen Viertel zeigt ein Haus an der Plaza de la Sartén die Aussparung für eine Mesusa im Türrahmen. Weiter oben warten der Palacio de Sada, die Kirche San Esteban und der Burgturm."},{"h":"Wissenswertes","t":"Im Sommer 1984 drehte Luis García Berlanga hier La vaquilla nach einem Drehbuch von Rafael Azcona, und viele Einheimische spielten als Statisten mit. Ein Rundgang erinnert an die Drehorte, und im Palacio de Sada ist dem Film ein eigener Saal gewidmet."}],"pt":[{"h":"História","t":"Sancho I de Pamplona tomou a praça aos muçulmanos em 907 e fez dela um bastião de fronteira. Em 1044, Ramiro I integrou-a no reino de Aragão. Em 1452, a rainha Juana Enríquez deu aqui à luz o futuro Fernando II de Aragão, e com o tempo a vila ganhou o apelido «del Rey Católico». Em 1711 passou a ser cabeça das Cinco Villas.\n\nNo bairro alto viveu, a partir do século XII, uma comunidade judaica de cerca de trinta famílias. Depois do decreto de expulsão de 1492, muitos dos seus membros atravessaram a fronteira para Navarra."},{"h":"O que ver","t":"As muralhas góticas conservam sete portas, entre elas o Portal de Zaragoza e o Portal de la Reina. A Plaza de la Villa era o mercado medieval: sob as suas arcadas realizava-se o mercado semanal e ainda se veem as medidas gravadas para conferir pesos e comprimentos. Ali ficam a Casa de la Villa, paços do concelho renascentistas do final do século XVI, e a Lonja medieval, do século XV, hoje biblioteca.\n\nNa antiga judiaria, a Plaza de la Sartén guarda uma casa com o encaixe de uma mezuzá na ombreira da porta. Mais acima esperam-no o Palacio de Sada, a igreja de San Esteban e a torre do castelo."},{"h":"Curiosidades","t":"No verão de 1984, Luis García Berlanga filmou aqui La vaquilla, com argumento de Rafael Azcona, e muitos habitantes participaram como figurantes. Um percurso pela vila recorda os locais de rodagem e o Palacio de Sada dedica uma sala ao filme."}]},"status":"pending"},{"id":"palacio-sada","town":"Sos del Rey Católico","cat":"museo","lat":42.49588,"lon":-1.21562,"coord_src":"https://lospueblosmasbonitosdeespana.org/en/recursos/palacio-de-sada-y-centro-de-interpretacion-de-fernando-ii-de-aragon-sos-del-rey-catolico","q":["Palacio de Sada, Sos del Rey Católico","Centro de Interpretación Fernando II de Aragón"],"fq":["Palacio de Sada Sos del Rey Católico","Palacio de Sada"],"name":{"es":"Palacio de Sada","en":"Palacio de Sada","fr":"Palacio de Sada","de":"Palacio de Sada","pt":"Palacio de Sada"},"when":{"es":"Cuna de Fernando II en 1452 · Palacio-fortaleza","en":"Birthplace of Ferdinand II in 1452 · Fortified palace","fr":"Naissance de Ferdinand II en 1452 · Palais fortifié","de":"Geburtshaus Ferdinands II., 1452 · Wehrpalast","pt":"Berço de Fernando II em 1452 · Palácio-fortaleza"},"desc":{"es":"En este palacio nació Fernando II de Aragón el 10 de marzo de 1452. Hoy acoge el Centro de Interpretación Fernando II de Aragón, una sala sobre La vaquilla y la oficina de turismo de Sos.","en":"Ferdinand II of Aragon was born in this palace on 10 March 1452. Today it houses the Ferdinand II of Aragon Interpretation Centre, a room about La vaquilla and the Sos tourist office.","fr":"Ferdinand II d'Aragon est né dans ce palais le 10 mars 1452. Il abrite aujourd'hui le Centre d'interprétation Ferdinand II d'Aragon, une salle consacrée à La vaquilla et l'office de tourisme de Sos.","de":"In diesem Palast wurde Ferdinand II. von Aragonien am 10. März 1452 geboren. Heute beherbergt er das Interpretationszentrum Ferdinand II. von Aragonien, einen Saal über La vaquilla und das Fremdenverkehrsamt von Sos.","pt":"Neste palácio nasceu Fernando II de Aragão, a 10 de março de 1452. Hoje acolhe o Centro de Interpretação Fernando II de Aragão, uma sala sobre La vaquilla e o posto de turismo de Sos."},"visit":{"es":"Visita interior con entrada; calcula unos 45 minutos. La oficina de turismo está en el propio palacio y desde aquí salen las visitas guiadas por la villa. Confirma horarios llamando antes.","en":"Visit inside with a ticket; allow about 45 minutes. The tourist office is in the palace itself and guided tours of the town start from here. Ring ahead to check opening times.","fr":"Visite intérieure payante ; comptez environ 45 minutes. L'office de tourisme se trouve dans le palais et les visites guidées de la ville partent d'ici. Appelez à l'avance pour vérifier les horaires.","de":"Innenbesichtigung mit Eintritt; etwa 45 Minuten einplanen. Das Fremdenverkehrsamt befindet sich im Palast selbst, und hier beginnen auch die Stadtführungen. Öffnungszeiten vorher telefonisch erfragen.","pt":"Visita ao interior com bilhete; conte com cerca de 45 minutos. O posto de turismo fica no próprio palácio e daqui partem as visitas guiadas pela vila. Telefone antes para confirmar horários."},"src":"https://turismocincovillas.com/wp-content/uploads/2024/05/Sos-del-Rey-Catolico_Palacio-de-Sada.pdf","sources":["https://turismocincovillas.com/wp-content/uploads/2024/05/Sos-del-Rey-Catolico_Palacio-de-Sada.pdf","https://lospueblosmasbonitosdeespana.org/en/recursos/palacio-de-sada-y-centro-de-interpretacion-de-fernando-ii-de-aragon-sos-del-rey-catolico","https://lospueblosmasbonitosdeespana.org/en/recursos/museo-la-vaquilla-sos-del-rey-catolico"],"art":{"es":[{"h":"Historia","t":"La reina Juana Enríquez, esposa de Juan II, buscó refugio en Sos cuando se acercaba el parto, en plena guerra entre su marido y el Príncipe de Viana. Quería que su hijo naciera en tierra aragonesa. Fernando, el futuro Rey Católico, nació en este palacio el 10 de marzo de 1452.\n\nLos Sada, infanzones de la villa, ganaron con ello privilegios e influencia; en el siglo XVII fueron marqueses de Campo Real y, en recuerdo del rey, siempre llamaron Fernando a su primogénito. El edificio se levantó sobre restos de un castillo anterior y se reformó en los siglos XVI y XVII. Está declarado Bien de Interés Cultural."},{"h":"Qué ver","t":"La fachada, de sillería y líneas horizontales, luce el escudo de los Sada en la entrada; la peña sobre la que se asienta le da aire de fortaleza. Dentro, el recorrido muestra cómo era una casa noble, la vida de Fernando II y las circunstancias de su nacimiento.\n\nUna sala con entrada propia está dedicada a La vaquilla, que Berlanga rodó en Sos en el verano de 1984: fotografías y material audiovisual sobre el rodaje y sobre cómo lo vivió el pueblo. Al salir, enfrente tienes la iglesia de San Esteban."}],"en":[{"h":"History","t":"Queen Juana Enríquez, wife of John II, took refuge in Sos as her due date approached, in the middle of the war between her husband and the Prince of Viana. She wanted her son to be born on Aragonese soil. Ferdinand, the future Catholic King, was born in this palace on 10 March 1452.\n\nThe Sada family, minor nobles of the town, gained privileges and influence as a result; in the 17th century they became Marquesses of Campo Real and, in memory of the king, always named their eldest son Fernando. The building rose on the remains of an earlier castle and was altered in the 16th and 17th centuries. It is listed as a Site of Cultural Interest."},{"h":"What to see","t":"The ashlar façade, with its horizontal lines, bears the Sada coat of arms at the entrance; the rock on which it sits gives it the air of a fortress. Inside, the tour shows what a noble house was like, the life of Ferdinand II and the circumstances of his birth.\n\nA room with its own entrance is devoted to La vaquilla, which Berlanga shot in Sos in the summer of 1984: photographs and audiovisual material about the filming and how the town lived it. As you leave, the Church of San Esteban is right opposite."}],"fr":[{"h":"Histoire","t":"La reine Juana Enríquez, épouse de Jean II, se réfugia à Sos à l'approche de l'accouchement, en pleine guerre entre son mari et le prince de Viane. Elle voulait que son fils naisse en terre aragonaise. Ferdinand, futur Roi Catholique, naquit dans ce palais le 10 mars 1452.\n\nLes Sada, petite noblesse de la ville, en tirèrent privilèges et influence ; au XVIIe siècle, ils devinrent marquis de Campo Real et, en souvenir du roi, appelèrent toujours Fernando leur fils aîné. L'édifice s'éleva sur les restes d'un château plus ancien et fut remanié aux XVIe et XVIIe siècles. Il est classé Bien d'intérêt culturel."},{"h":"À voir","t":"La façade en pierre de taille, aux lignes horizontales, porte le blason des Sada à l'entrée ; le rocher sur lequel elle repose lui donne un air de forteresse. À l'intérieur, le parcours montre une demeure noble de l'époque, la vie de Ferdinand II et les circonstances de sa naissance.\n\nUne salle à entrée indépendante est consacrée à La vaquilla, que Berlanga tourna à Sos à l'été 1984 : photographies et documents audiovisuels sur le tournage et sur la façon dont le village l'a vécu. En sortant, l'église San Esteban se trouve juste en face."}],"de":[{"h":"Geschichte","t":"Königin Juana Enríquez, Gemahlin Johanns II., suchte kurz vor der Niederkunft Zuflucht in Sos, mitten im Krieg zwischen ihrem Mann und dem Prinzen von Viana. Ihr Sohn sollte auf aragonesischem Boden zur Welt kommen. Ferdinand, der spätere Katholische König, wurde am 10. März 1452 in diesem Palast geboren.\n\nDie Familie Sada, niederer Adel des Ortes, gewann dadurch Privilegien und Einfluss; im 17. Jahrhundert wurden sie Marquis von Campo Real und nannten ihren Erstgeborenen zur Erinnerung an den König stets Fernando. Das Gebäude entstand auf den Resten einer älteren Burg und wurde im 16. und 17. Jahrhundert umgebaut. Es ist als Kulturgut von besonderem Interesse geschützt."},{"h":"Sehenswert","t":"Die Quaderfassade mit ihren waagerechten Linien trägt am Eingang das Wappen der Sada; der Fels, auf dem sie steht, verleiht ihr etwas Festungsartiges. Innen zeigt der Rundgang ein Adelshaus der Zeit, das Leben Ferdinands II. und die Umstände seiner Geburt.\n\nEin Saal mit eigenem Eingang ist La vaquilla gewidmet, die Berlanga im Sommer 1984 in Sos drehte: Fotos und audiovisuelles Material über die Dreharbeiten und wie der Ort sie erlebte. Gleich gegenüber steht die Kirche San Esteban."}],"pt":[{"h":"História","t":"A rainha Juana Enríquez, mulher de João II, refugiou-se em Sos quando se aproximava o parto, em plena guerra entre o marido e o Príncipe de Viana. Queria que o filho nascesse em terra aragonesa. Fernando, o futuro Rei Católico, nasceu neste palácio a 10 de março de 1452.\n\nOs Sada, pequena nobreza da vila, ganharam com isso privilégios e influência; no século XVII tornaram-se marqueses de Campo Real e, em memória do rei, chamaram sempre Fernando ao primogénito. O edifício ergueu-se sobre restos de um castelo anterior e foi remodelado nos séculos XVI e XVII. Está classificado como Bem de Interesse Cultural."},{"h":"O que ver","t":"A fachada de cantaria, de linhas horizontais, ostenta o brasão dos Sada à entrada; o rochedo onde assenta dá-lhe ar de fortaleza. No interior, o percurso mostra como era uma casa nobre da época, a vida de Fernando II e as circunstâncias do seu nascimento.\n\nUma sala com entrada própria é dedicada a La vaquilla, que Berlanga filmou em Sos no verão de 1984: fotografias e material audiovisual sobre a rodagem e sobre a forma como a vila a viveu. À saída, mesmo em frente, fica a igreja de San Esteban."}]},"status":"pending"},{"id":"san-esteban-sos","town":"Sos del Rey Católico","cat":"patrimonio","lat":42.49704,"lon":-1.21486,"coord_src":null,"q":["Iglesia de San Esteban, Sos del Rey Católico","Castillo de Sos del Rey Católico"],"fq":["Iglesia de San Esteban Sos del Rey Católico","Cripta Santa María del Perdón Sos","Castillo de Sos del Rey Católico"],"name":{"es":"Iglesia de San Esteban y castillo","en":"Church of San Esteban and castle","fr":"Église San Esteban et château","de":"Kirche San Esteban und Burg","pt":"Igreja de San Esteban e castelo"},"when":{"es":"Románico · En lo alto de la villa","en":"Romanesque · At the top of the town","fr":"Roman · Au sommet de la ville","de":"Romanik · Am höchsten Punkt des Ortes","pt":"Românico · No alto da vila"},"desc":{"es":"La iglesia de San Esteban ocupa la parte alta de Sos, junto a la torre del castillo. Bajo ella se abre la cripta de Santa María del Perdón, con restos de pintura mural.","en":"The Church of San Esteban occupies the upper part of Sos, beside the castle tower. Beneath it lies the crypt of Santa María del Perdón, with remains of wall paintings.","fr":"L'église San Esteban occupe la partie haute de Sos, à côté de la tour du château. En dessous s'ouvre la crypte de Santa María del Perdón, avec des restes de peintures murales.","de":"Die Kirche San Esteban liegt im oberen Teil von Sos, neben dem Burgturm. Darunter öffnet sich die Krypta Santa María del Perdón mit Resten von Wandmalereien.","pt":"A igreja de San Esteban ocupa a parte alta de Sos, junto à torre do castelo. Por baixo abre-se a cripta de Santa María del Perdón, com restos de pintura mural."},"visit":{"es":"La iglesia y la cripta suelen verse dentro de las visitas guiadas que salen de la oficina de turismo del Palacio de Sada; confirma horarios allí. El entorno de la torre del castillo es un buen mirador. Calcula unos 45 minutos.","en":"The church and crypt are usually seen on the guided tours that leave from the tourist office in the Palacio de Sada; check times there. The area around the castle tower is a fine viewpoint. Allow about 45 minutes.","fr":"L'église et la crypte se découvrent généralement lors des visites guidées qui partent de l'office de tourisme du Palacio de Sada ; vérifiez les horaires sur place. Les abords de la tour du château forment un beau belvédère. Comptez environ 45 minutes.","de":"Kirche und Krypta sieht man meist im Rahmen der Führungen, die am Fremdenverkehrsamt im Palacio de Sada beginnen; Zeiten dort erfragen. Rund um den Burgturm bietet sich ein schöner Ausblick. Etwa 45 Minuten einplanen.","pt":"A igreja e a cripta costumam ver-se nas visitas guiadas que partem do posto de turismo do Palacio de Sada; confirme ali os horários. A zona da torre do castelo é um bom miradouro. Conte com cerca de 45 minutos."},"src":"https://es.wikipedia.org/wiki/Sos_del_Rey_Cat%C3%B3lico","sources":["https://es.wikipedia.org/wiki/Sos_del_Rey_Cat%C3%B3lico","https://en.wikipedia.org/wiki/Sos_del_Rey_Cat%C3%B3lico"],"art":{"es":[{"h":"Historia","t":"El castillo se alzó en la peña Felizana, el punto más alto de la villa, para defender la frontera entre Navarra y Aragón. Primero fue de madera y después de piedra. Del castillo del siglo XII se conserva sobre todo la torre del homenaje, rehabilitada.\n\nA su lado se levantó la iglesia de San Esteban, románica, comenzada en la Edad Media y ampliada después. Un pasaje cubierto conduce a su portada principal desde la calle que sube de la plaza de la Villa."},{"h":"Qué ver","t":"Baja a la cripta de Santa María del Perdón. Tiene pequeñas capillas con pinturas murales sobre la vida de Cristo, hoy muy deterioradas, y capiteles esculpidos que se han relacionado con el maestro Esteban, uno de los arquitectos de la catedral de Santiago de Compostela.\n\nAl salir, sube a la explanada de la torre. Desde allí se ve todo el caserío de Sos, el trazado de las murallas y, en días claros, el Pirineo.\n\nFuera de las murallas quedan la ermita de Santa Lucía, de finales del siglo XII o comienzos del XIII, y, a unos 2 km, el monasterio de Valentuñana, de carmelitas descalzos, de finales del siglo XVII."}],"en":[{"h":"History","t":"The castle was built on the Peña Felizana, the highest point of the town, to defend the border between Navarre and Aragon. It was first made of wood and later of stone. Of the 12th-century castle the main survivor is the keep, now restored.\n\nBeside it rose the Romanesque Church of San Esteban, begun in the Middle Ages and enlarged later. A covered passage leads to its main doorway from the street that climbs up from the Plaza de la Villa."},{"h":"What to see","t":"Go down into the crypt of Santa María del Perdón. It has small chapels with wall paintings of the life of Christ, now badly deteriorated, and carved capitals that have been linked to Master Esteban, one of the architects of Santiago de Compostela Cathedral.\n\nAfterwards, climb to the open ground by the tower. From there you can see the whole of Sos, the line of the walls and, on clear days, the Pyrenees.\n\nOutside the walls are the hermitage of Santa Lucía, from the late 12th or early 13th century, and, about 2 km away, the Valentuñana monastery of Discalced Carmelites, from the late 17th century."}],"fr":[{"h":"Histoire","t":"Le château fut bâti sur la Peña Felizana, le point le plus haut de la ville, pour défendre la frontière entre la Navarre et l'Aragon. D'abord en bois, il fut ensuite construit en pierre. Du château du XIIe siècle subsiste surtout le donjon, restauré.\n\nÀ côté s'éleva l'église romane San Esteban, commencée au Moyen Âge puis agrandie. Un passage couvert mène à son portail principal depuis la rue qui monte de la Plaza de la Villa."},{"h":"À voir","t":"Descendez dans la crypte de Santa María del Perdón. Elle compte de petites chapelles ornées de peintures murales sur la vie du Christ, aujourd'hui très abîmées, et des chapiteaux sculptés que l'on a rapprochés de maître Esteban, l'un des architectes de la cathédrale de Saint-Jacques-de-Compostelle.\n\nEnsuite, montez sur l'esplanade de la tour. De là, on voit tout Sos, le tracé des remparts et, par temps clair, les Pyrénées.\n\nHors les murs se trouvent l'ermitage de Santa Lucía, de la fin du XIIe ou du début du XIIIe siècle, et, à environ 2 km, le monastère de Valentuñana, de carmélites déchaussés, de la fin du XVIIe siècle."}],"de":[{"h":"Geschichte","t":"Die Burg entstand auf der Peña Felizana, dem höchsten Punkt des Ortes, um die Grenze zwischen Navarra und Aragonien zu sichern. Zuerst war sie aus Holz, später aus Stein. Von der Burg des 12. Jahrhunderts ist vor allem der restaurierte Bergfried erhalten.\n\nDaneben wurde die romanische Kirche San Esteban errichtet, im Mittelalter begonnen und später erweitert. Ein überdachter Durchgang führt von der Gasse, die von der Plaza de la Villa heraufkommt, zu ihrem Hauptportal."},{"h":"Sehenswert","t":"Steigen Sie in die Krypta Santa María del Perdón hinab. Sie hat kleine Kapellen mit Wandmalereien zum Leben Christi, die heute stark beschädigt sind, und skulptierte Kapitelle, die man mit Meister Esteban in Verbindung gebracht hat, einem der Baumeister der Kathedrale von Santiago de Compostela.\n\nDanach geht es hinauf zum Platz am Turm. Von dort überblickt man ganz Sos, den Verlauf der Stadtmauer und an klaren Tagen die Pyrenäen.\n\nAußerhalb der Mauern liegen die Einsiedelei Santa Lucía vom Ende des 12. oder Anfang des 13. Jahrhunderts und, etwa 2 km entfernt, das Kloster Valentuñana der Unbeschuhten Karmeliten vom Ende des 17. Jahrhunderts."}],"pt":[{"h":"História","t":"O castelo foi erguido na Peña Felizana, o ponto mais alto da vila, para defender a fronteira entre Navarra e Aragão. Primeiro foi de madeira e depois de pedra. Do castelo do século XII conserva-se sobretudo a torre de menagem, reabilitada.\n\nAo lado ergueu-se a igreja românica de San Esteban, iniciada na Idade Média e ampliada mais tarde. Uma passagem coberta leva ao seu portal principal a partir da rua que sobe da Plaza de la Villa."},{"h":"O que ver","t":"Desça à cripta de Santa María del Perdón. Tem pequenas capelas com pinturas murais sobre a vida de Cristo, hoje muito deterioradas, e capitéis esculpidos que têm sido relacionados com o mestre Esteban, um dos arquitetos da catedral de Santiago de Compostela.\n\nDepois, suba à esplanada da torre. Dali vê-se toda a vila, o traçado das muralhas e, em dias limpos, os Pirenéus.\n\nFora das muralhas ficam a ermida de Santa Lucía, do final do século XII ou início do XIII, e, a cerca de 2 km, o mosteiro de Valentuñana, de carmelitas descalços, do final do século XVII."}]},"status":"pending"},{"id":"santa-maria-uncastillo","town":"Uncastillo","cat":"patrimonio","lat":42.43127,"lon":-1.2119,"coord_src":null,"q":["Iglesia de Santa María, Uncastillo","Santa María la Mayor, Uncastillo"],"fq":["Iglesia de Santa María Uncastillo","Uncastillo Santa María portada","Uncastillo iglesia Santa María"],"name":{"es":"Iglesia de Santa María","en":"Church of Santa María","fr":"Église Santa María","de":"Kirche Santa María","pt":"Igreja de Santa María"},"when":{"es":"Románico, consagrada en 1155 · Antigua colegiata","en":"Romanesque, consecrated in 1155 · Former collegiate church","fr":"Roman, consacrée en 1155 · Ancienne collégiale","de":"Romanik, geweiht 1155 · Ehemalige Stiftskirche","pt":"Românico, consagrada em 1155 · Antiga colegiada"},"desc":{"es":"Antigua colegiata y templo principal de Uncastillo. Su portada sur, con tres arquivoltas llenas de figuras, es una de las obras más destacadas del románico aragonés.","en":"The former collegiate church and main place of worship of Uncastillo. Its south doorway, with three archivolts packed with figures, is one of the finest works of Aragonese Romanesque.","fr":"Ancienne collégiale et principal lieu de culte d'Uncastillo. Son portail sud, aux trois voussures couvertes de figures, est l'une des œuvres majeures de l'art roman aragonais.","de":"Ehemalige Stiftskirche und Hauptkirche von Uncastillo. Ihr Südportal mit drei figurenreichen Archivolten gehört zu den herausragenden Werken der aragonesischen Romanik.","pt":"Antiga colegiada e principal templo de Uncastillo. O seu portal sul, com três arquivoltas cheias de figuras, é uma das obras mais notáveis do românico aragonês."},"visit":{"es":"Dentro está el Centro de Arte Religioso del Prepirineo; la visita al interior es con entrada. Calcula al menos una hora para iglesia, claustro y museo. La portada se ve libremente desde la calle. Confirma horarios en la oficina de turismo de Uncastillo.","en":"Inside is the Centro de Arte Religioso del Prepirineo; entry to the interior requires a ticket. Allow at least an hour for church, cloister and museum. The doorway can be seen freely from the street. Check opening times at the Uncastillo tourist office.","fr":"Elle abrite le Centro de Arte Religioso del Prepirineo ; l'accès à l'intérieur est payant. Comptez au moins une heure pour l'église, le cloître et le musée. Le portail se voit librement depuis la rue. Vérifiez les horaires à l'office de tourisme d'Uncastillo.","de":"Im Inneren befindet sich das Centro de Arte Religioso del Prepirineo; der Innenbesuch kostet Eintritt. Für Kirche, Kreuzgang und Museum mindestens eine Stunde einplanen. Das Portal ist von der Straße aus frei zu sehen. Öffnungszeiten beim Fremdenverkehrsamt Uncastillo erfragen.","pt":"No interior fica o Centro de Arte Religioso del Prepirineo; a visita ao interior é paga. Conte com pelo menos uma hora para igreja, claustro e museu. O portal vê-se livremente da rua. Confirme horários no posto de turismo de Uncastillo."},"src":"https://turismocincovillas.com/wp-content/uploads/2024/05/Iglesia-de-Santa-Maria_Uncastillo.pdf","sources":["https://turismocincovillas.com/wp-content/uploads/2024/05/Iglesia-de-Santa-Maria_Uncastillo.pdf","https://www.spain.info/es/lugares-interes/iglesia-santa-maria-mayor-uncastillo/"],"art":{"es":[{"h":"Historia","t":"Se construyó en el siglo XII, en tiempos de Ramiro II, sobre un templo anterior, y se consagró en 1155. Llegó a tener rango de colegiata. Su torre, con garitones en las esquinas y remate almenado, es de los siglos XIV y XV y se coronó en el XVI con un chapitel; sirve de referencia a quien llega por el camino de Sádaba.\n\nEn 1557 se le adosó el claustro, con bóvedas de crucería estrellada y portadas renacentistas, y en 1649 se colocó el retablo mayor barroco, con tablas de Jusepe Martínez."},{"h":"Qué ver","t":"Empieza por fuera. La portada sur tiene tres arcos de medio punto, sin tímpano, cubiertos de escenas y figuras; su escultura se relaciona con artistas llegados de Olorón, al otro lado del Pirineo. Mira también los canecillos del alero, cada uno con su escena, y el ajedrezado jaqués de las cornisas.\n\nDentro, una nave de seis tramos termina en un ábside semicircular. Busca la talla gótica de Santa María, del siglo XIII, y el coro con bóveda estrellada. El Centro de Arte Religioso del Prepirineo reúne retablos y orfebrería de las parroquias de la zona."}],"en":[{"h":"History","t":"It was built in the 12th century, in the time of Ramiro II, on the site of an earlier church, and consecrated in 1155. It came to hold the rank of collegiate church. Its tower, with corner turrets and battlements, dates from the 14th and 15th centuries and was crowned with a spire in the 16th; it is a landmark for anyone arriving on the road from Sádaba.\n\nIn 1557 the cloister was added, with star-ribbed vaults and Renaissance doorways, and in 1649 the Baroque high altarpiece was installed, with panels by Jusepe Martínez."},{"h":"What to see","t":"Start outside. The south doorway has three round arches, with no tympanum, covered in scenes and figures; its sculpture is linked to artists who came from Oloron, on the other side of the Pyrenees. Look too at the corbels under the eaves, each with its own scene, and the Jaca chequer pattern on the cornices.\n\nInside, a six-bay nave ends in a semicircular apse. Look for the Gothic statue of Santa María, from the 13th century, and the choir with its star vault. The Centro de Arte Religioso del Prepirineo gathers altarpieces and silverwork from the parishes of the area."}],"fr":[{"h":"Histoire","t":"Elle fut construite au XIIe siècle, sous Ramire II, à l'emplacement d'une église antérieure, et consacrée en 1155. Elle obtint le rang de collégiale. Sa tour, avec échauguettes d'angle et créneaux, date des XIVe et XVe siècles et fut coiffée d'une flèche au XVIe ; elle sert de repère à qui arrive par la route de Sádaba.\n\nEn 1557, on lui adjoignit le cloître, aux voûtes d'ogives en étoile et aux portes Renaissance, et en 1649 le grand retable baroque, avec des panneaux de Jusepe Martínez."},{"h":"À voir","t":"Commencez par l'extérieur. Le portail sud a trois arcs en plein cintre, sans tympan, couverts de scènes et de personnages ; sa sculpture est rattachée à des artistes venus d'Oloron, de l'autre côté des Pyrénées. Regardez aussi les modillons sous l'avant-toit, chacun avec sa scène, et le damier de Jaca des corniches.\n\nÀ l'intérieur, une nef de six travées s'achève par une abside semi-circulaire. Cherchez la statue gothique de Santa María, du XIIIe siècle, et le chœur à voûte étoilée. Le Centro de Arte Religioso del Prepirineo réunit retables et orfèvrerie des paroisses de la région."}],"de":[{"h":"Geschichte","t":"Sie wurde im 12. Jahrhundert, zur Zeit Ramiros II., an der Stelle einer älteren Kirche erbaut und 1155 geweiht. Später erhielt sie den Rang einer Stiftskirche. Ihr Turm mit Ecktürmchen und Zinnen stammt aus dem 14. und 15. Jahrhundert und bekam im 16. Jahrhundert einen Helm; er ist ein Orientierungspunkt für alle, die auf der Straße von Sádaba kommen.\n\n1557 kam der Kreuzgang mit Sterngewölben und Renaissanceportalen hinzu, 1649 der barocke Hochaltar mit Tafeln von Jusepe Martínez."},{"h":"Sehenswert","t":"Beginnen Sie außen. Das Südportal hat drei Rundbögen ohne Tympanon, übersät mit Szenen und Figuren; seine Skulptur wird Künstlern aus Oloron jenseits der Pyrenäen zugeschrieben. Achten Sie auch auf die Kragsteine unter dem Dach, jeder mit eigener Szene, und das Schachbrettfries von Jaca an den Gesimsen.\n\nInnen endet ein sechsjochiges Schiff in einer halbrunden Apsis. Suchen Sie die gotische Figur der Santa María aus dem 13. Jahrhundert und den Chor mit Sterngewölbe. Das Centro de Arte Religioso del Prepirineo zeigt Altarbilder und Goldschmiedearbeiten aus den Pfarreien der Umgebung."}],"pt":[{"h":"História","t":"Foi construída no século XII, no tempo de Ramiro II, sobre um templo anterior, e consagrada em 1155. Chegou a ter categoria de colegiada. A torre, com guaritas nos cantos e remate ameado, é dos séculos XIV e XV e recebeu no XVI um coruchéu; serve de referência a quem chega pela estrada de Sádaba.\n\nEm 1557 foi-lhe acrescentado o claustro, com abóbadas de nervuras estreladas e portais renascentistas, e em 1649 o retábulo-mor barroco, com painéis de Jusepe Martínez."},{"h":"O que ver","t":"Comece pelo exterior. O portal sul tem três arcos de volta perfeita, sem tímpano, cobertos de cenas e figuras; a sua escultura é associada a artistas vindos de Oloron, do outro lado dos Pirenéus. Repare também nos modilhões do beiral, cada um com a sua cena, e no xadrezado de Jaca das cornijas.\n\nNo interior, uma nave de seis tramos termina numa abside semicircular. Procure a imagem gótica de Santa María, do século XIII, e o coro com abóbada estrelada. O Centro de Arte Religioso del Prepirineo reúne retábulos e ourivesaria das paróquias da região."}]},"status":"pending"},{"id":"castillo-uncastillo","town":"Uncastillo","cat":"patrimonio","lat":42.36035,"lon":-1.13115,"coord_src":"https://castillosenaragon.es/wp-content/uploads/2019/04/CV.48.-FICHA-UNCASTILLO.-Castillo-1.pdf","q":["Castillo de Uncastillo","Peña Ayllón, Uncastillo"],"fq":["Castillo de Uncastillo","Uncastillo castillo torre","Uncastillo"],"name":{"es":"Castillo de Uncastillo","en":"Uncastillo Castle","fr":"Château d'Uncastillo","de":"Burg von Uncastillo","pt":"Castelo de Uncastillo"},"when":{"es":"Siglos X–XIV · Sobre la peña Ayllón","en":"10th–14th centuries · On the Peña Ayllón","fr":"Xe–XIVe siècles · Sur la Peña Ayllón","de":"10.–14. Jahrhundert · Auf der Peña Ayllón","pt":"Séculos X–XIV · Sobre a Peña Ayllón"},"desc":{"es":"El castillo que da nombre a la villa ocupa la peña Ayllón, en el centro del pueblo. Su torre restaurada es hoy un pequeño museo con terraza almenada.","en":"The castle that gives the town its name stands on the Peña Ayllón, in the middle of the village. Its restored tower is now a small museum with a battlemented terrace.","fr":"Le château qui a donné son nom à la ville occupe la Peña Ayllón, au cœur du village. Sa tour restaurée est aujourd'hui un petit musée avec une terrasse crénelée.","de":"Die Burg, der der Ort seinen Namen verdankt, thront auf der Peña Ayllón mitten im Dorf. Ihr restaurierter Turm ist heute ein kleines Museum mit Zinnenterrasse.","pt":"O castelo que dá nome à vila ocupa a Peña Ayllón, no centro da povoação. A sua torre restaurada é hoje um pequeno museu com terraço ameado."},"visit":{"es":"Se sube a pie desde el casco urbano. La torre está musealizada y la Fundación Uncastillo ofrece visitas guiadas al castillo y a la judería. Calcula una hora. Confirma horarios en la oficina de turismo.","en":"Walk up from the village centre. The tower houses a museum, and the Fundación Uncastillo offers guided tours of the castle and the Jewish quarter. Allow an hour. Check times at the tourist office.","fr":"On y monte à pied depuis le centre. La tour abrite un musée et la Fundación Uncastillo propose des visites guidées du château et du quartier juif. Comptez une heure. Vérifiez les horaires à l'office de tourisme.","de":"Zu Fuß vom Ortskern aus erreichbar. Im Turm befindet sich ein Museum, und die Fundación Uncastillo bietet Führungen durch Burg und jüdisches Viertel an. Etwa eine Stunde einplanen. Zeiten beim Fremdenverkehrsamt erfragen.","pt":"Sobe-se a pé a partir do centro. A torre tem um museu e a Fundación Uncastillo oferece visitas guiadas ao castelo e à judiaria. Conte com uma hora. Confirme horários no posto de turismo."},"src":"https://turismocincovillas.com/wp-content/uploads/2024/05/Castillo-y-Torreon_Uncastillo.pdf","sources":["https://turismocincovillas.com/wp-content/uploads/2024/05/Castillo-y-Torreon_Uncastillo.pdf","https://castillosenaragon.es/wp-content/uploads/2019/04/CV.48.-FICHA-UNCASTILLO.-Castillo-1.pdf","https://es.wikipedia.org/wiki/Uncastillo"],"art":{"es":[{"h":"Historia","t":"La historia local sitúa aquí una fortaleza a comienzos del siglo X, en tiempos de Sancho Garcés, para vigilar el acceso desde Sádaba. En 937 ya existía un gran castillo de madera, uno de los pocos que resistió los ataques de Abderramán III, primer califa de Córdoba.\n\nEn el siglo XIV Pedro IV mandó levantar un palacio gótico dirigido por Blasco Aznárez de Borau, el mismo maestro que reformó la Aljafería de Zaragoza. La restauración de la torre empezó en 2000 y la del palacio en 2003."},{"h":"Qué ver","t":"El recinto es ovalado, de unos 115 por 75 metros, y tiene dos niveles. En el inferior quedan restos de viviendas y aljibes; en el superior, la torre cuadrada, de unos 10 metros de lado y tres plantas, y la base de una segunda torre que apareció en las excavaciones. El palacio gótico conserva una torre-escalera y una planta baja con bóveda de crucería.\n\nDentro de la torre, el museo explica cómo Uncastillo pasó de puesto militar a fortaleza y a villa monumental. Desde la terraza se ve el trazado medieval del pueblo y las sierras de Luesia y de Uncastillo."}],"en":[{"h":"History","t":"Local history places a fortress here at the start of the 10th century, in the time of Sancho Garcés, to watch the approach from Sádaba. By 937 there was already a large wooden castle, one of the few that withstood the attacks of Abd al-Rahman III, the first Caliph of Córdoba.\n\nIn the 14th century Peter IV ordered a Gothic palace, directed by Blasco Aznárez de Borau, the same master who remodelled the Aljafería in Zaragoza. Restoration of the tower began in 2000 and of the palace in 2003."},{"h":"What to see","t":"The enclosure is oval, about 115 by 75 metres, on two levels. On the lower level there are remains of houses and cisterns; on the upper, the square tower, about 10 metres a side with three floors, and the base of a second tower uncovered during excavations. The Gothic palace keeps a stair tower and a ground floor with rib vaulting.\n\nInside the tower, the museum explains how Uncastillo went from military outpost to fortress to monumental town. From the terrace you can see the medieval layout of the village and the Luesia and Uncastillo ranges."}],"fr":[{"h":"Histoire","t":"L'histoire locale situe ici une forteresse au début du Xe siècle, à l'époque de Sanche Garcés, pour surveiller l'accès depuis Sádaba. En 937 existait déjà un grand château de bois, l'un des rares à résister aux attaques d'Abd al-Rahman III, premier calife de Cordoue.\n\nAu XIVe siècle, Pierre IV fit construire un palais gothique dirigé par Blasco Aznárez de Borau, le maître qui remania aussi l'Aljafería de Saragosse. La restauration de la tour commença en 2000 et celle du palais en 2003."},{"h":"À voir","t":"L'enceinte est ovale, d'environ 115 mètres sur 75, sur deux niveaux. En bas subsistent des restes d'habitations et des citernes ; en haut, la tour carrée, d'environ 10 mètres de côté et trois étages, et la base d'une seconde tour mise au jour lors des fouilles. Le palais gothique conserve une tour d'escalier et un rez-de-chaussée voûté d'ogives.\n\nDans la tour, le musée explique comment Uncastillo est passé de poste militaire à forteresse puis à ville monumentale. De la terrasse, on voit le tracé médiéval du village et les sierras de Luesia et d'Uncastillo."}],"de":[{"h":"Geschichte","t":"Die Ortsgeschichte verlegt eine Festung hier an den Beginn des 10. Jahrhunderts, in die Zeit Sancho Garcés', um den Zugang von Sádaba her zu überwachen. 937 gab es bereits eine große Holzburg, eine der wenigen, die den Angriffen Abd ar-Rahmans III., des ersten Kalifen von Córdoba, standhielten.\n\nIm 14. Jahrhundert ließ Peter IV. einen gotischen Palast errichten, unter der Leitung von Blasco Aznárez de Borau, demselben Meister, der die Aljafería in Zaragoza umbaute. Die Restaurierung des Turms begann 2000, die des Palastes 2003."},{"h":"Sehenswert","t":"Die Anlage ist oval, etwa 115 mal 75 Meter, auf zwei Ebenen. Unten finden sich Reste von Wohnhäusern und Zisternen, oben der quadratische Turm mit rund 10 Metern Seitenlänge und drei Stockwerken sowie der bei Grabungen freigelegte Sockel eines zweiten Turms. Der gotische Palast besitzt einen Treppenturm und ein Erdgeschoss mit Kreuzrippengewölbe.\n\nIm Turm erklärt das Museum, wie Uncastillo vom Militärposten zur Festung und zum Baudenkmal wurde. Von der Terrasse sieht man den mittelalterlichen Grundriss des Dorfes und die Bergketten von Luesia und Uncastillo."}],"pt":[{"h":"História","t":"A história local situa aqui uma fortaleza no início do século X, no tempo de Sancho Garcés, para vigiar o acesso a partir de Sádaba. Em 937 já existia um grande castelo de madeira, um dos poucos que resistiram aos ataques de Abderramão III, primeiro califa de Córdova.\n\nNo século XIV, Pedro IV mandou erguer um palácio gótico dirigido por Blasco Aznárez de Borau, o mesmo mestre que remodelou a Aljafería de Saragoça. O restauro da torre começou em 2000 e o do palácio em 2003."},{"h":"O que ver","t":"O recinto é oval, com cerca de 115 por 75 metros, em dois níveis. No inferior ficam restos de habitações e cisternas; no superior, a torre quadrada, com cerca de 10 metros de lado e três pisos, e a base de uma segunda torre descoberta nas escavações. O palácio gótico conserva uma torre de escada e um piso térreo com abóbada de nervuras.\n\nDentro da torre, o museu explica como Uncastillo passou de posto militar a fortaleza e a vila monumental. Do terraço vê-se o traçado medieval da povoação e as serras de Luesia e de Uncastillo."}]},"status":"pending"},{"id":"los-banales","town":"Uncastillo","cat":"arqueologia","lat":42.28856,"lon":-1.23034,"coord_src":"https://es.wikipedia.org/wiki/Los_Ba%C3%B1ales","q":["Los Bañales","Ciudad romana de Los Bañales","Termas de Los Bañales"],"fq":["Los Bañales","Los Bañales acueducto","Los Bañales termas"],"name":{"es":"Ciudad romana de Los Bañales","en":"Roman city of Los Bañales","fr":"Ville romaine de Los Bañales","de":"Römerstadt Los Bañales","pt":"Cidade romana de Los Bañales"},"when":{"es":"Época romana · Termas, foro y acueducto","en":"Roman period · Baths, forum and aqueduct","fr":"Époque romaine · Thermes, forum et aqueduc","de":"Römerzeit · Thermen, Forum und Aquädukt","pt":"Época romana · Termas, fórum e aqueduto"},"desc":{"es":"Restos de una ciudad romana cuyo nombre antiguo aún no se conoce con seguridad. Conserva termas, parte del foro y los pilares de un acueducto, y se investiga sin pausa desde 2008.","en":"Remains of a Roman city whose ancient name is still not known for certain. It preserves baths, part of the forum and the pillars of an aqueduct, and research has continued without a break since 2008.","fr":"Vestiges d'une ville romaine dont le nom antique n'est toujours pas connu avec certitude. Elle conserve des thermes, une partie du forum et les piliers d'un aqueduc, et les recherches s'y poursuivent sans interruption depuis 2008.","de":"Reste einer römischen Stadt, deren antiker Name bis heute nicht sicher bekannt ist. Erhalten sind Thermen, Teile des Forums und die Pfeiler eines Aquädukts; seit 2008 wird ununterbrochen geforscht.","pt":"Restos de uma cidade romana cujo nome antigo ainda não se conhece com segurança. Conserva termas, parte do fórum e os pilares de um aqueduto, e é investigada sem interrupção desde 2008."},"visit":{"es":"Yacimiento al aire libre entre Layana, Uncastillo y Sádaba. Se recorre por libre o con visita guiada: consulta fechas con la Fundación Uncastillo o en la oficina de turismo. Calcula hora y media, con agua y calzado cómodo. En Layana, un centro de interpretación sobre el paisaje rural romano completa la visita.","en":"An open-air site between Layana, Uncastillo and Sádaba. Visit on your own or on a guided tour: ask the Fundación Uncastillo or the tourist office for dates. Allow an hour and a half, with water and comfortable shoes. In Layana, an interpretation centre on the Roman rural landscape completes the visit.","fr":"Site en plein air entre Layana, Uncastillo et Sádaba. Visite libre ou guidée : renseignez-vous sur les dates auprès de la Fundación Uncastillo ou de l'office de tourisme. Comptez une heure et demie, avec de l'eau et de bonnes chaussures. À Layana, un centre d'interprétation sur le paysage rural romain complète la visite.","de":"Freiluftgelände zwischen Layana, Uncastillo und Sádaba. Besuch auf eigene Faust oder mit Führung: Termine bei der Fundación Uncastillo oder beim Fremdenverkehrsamt erfragen. Anderthalb Stunden einplanen, Wasser und bequeme Schuhe mitnehmen. In Layana ergänzt ein Interpretationszentrum zur römischen Agrarlandschaft den Besuch.","pt":"Sítio ao ar livre entre Layana, Uncastillo e Sádaba. Visita livre ou guiada: informe-se sobre datas junto da Fundación Uncastillo ou do posto de turismo. Conte com hora e meia, leve água e calçado confortável. Em Layana, um centro de interpretação sobre a paisagem rural romana completa a visita."},"src":"https://es.wikipedia.org/wiki/Los_Ba%C3%B1ales","sources":["https://es.wikipedia.org/wiki/Los_Ba%C3%B1ales","https://turismocincovillas.com/wp-content/uploads/2024/05/Centro-de-Interpretacion-Los-Banales_Layana.pdf","https://es.wikipedia.org/wiki/Layana"],"art":{"es":[{"h":"Historia","t":"Los romanos llegaron a esta zona hacia el 195 a. C. La ciudad, que quizá sea la Tarraga citada por Plinio, creció junto a la calzada que unía Caesar Augusta (Zaragoza) con Pompaelo (Pamplona). Hacia el siglo III d. C. la parte baja y monumental quedó casi abandonada y la población se replegó al cerro de El Pueyo, donde pudo seguir viviendo hasta el siglo IX.\n\nEstá protegida desde 1931 y es Bien de Interés Cultural desde 2003. Excavaron aquí José Galiay en los años cuarenta y Antonio Beltrán en los setenta. Desde 2008 la Fundación Uncastillo dirige un plan de investigación que ha sacado a la luz el foro."},{"h":"Qué ver","t":"Las termas, de finales del siglo I d. C., ocupan unos 530 m². Se distinguen el vestuario, la sala fría con su piscina, la templada, la caliente, una sauna y las letrinas. En la terraza de El Pueyo está el foro, donde aparecieron pedestales dedicados a Tiberio y a Lucio César.\n\nEl acueducto es la imagen más conocida: siguen en pie 32 de los más de 70 pilares que salvaban una hondonada de unos 350 metros. Traía el agua desde la presa de Cubalmena, en Biota, a unos 2 km."}],"en":[{"h":"History","t":"The Romans reached this area around 195 BC. The city, which may be the Tarraga mentioned by Pliny, grew up beside the road linking Caesar Augusta (Zaragoza) with Pompaelo (Pamplona). Around the 3rd century AD the lower, monumental part was almost abandoned and the population withdrew to the hill of El Pueyo, where it may have survived until the 9th century.\n\nIt has been protected since 1931 and has been a Site of Cultural Interest since 2003. José Galiay excavated here in the 1940s and Antonio Beltrán in the 1970s. Since 2008 the Fundación Uncastillo has led a research plan that has brought the forum to light."},{"h":"What to see","t":"The baths, from the late 1st century AD, cover some 530 m². You can make out the changing room, the cold room with its pool, the warm and hot rooms, a sweat room and the latrines. On the El Pueyo terrace lies the forum, where pedestals dedicated to Tiberius and Lucius Caesar were found.\n\nThe aqueduct is the best-known image: 32 of the more than 70 pillars that spanned a hollow of some 350 metres are still standing. It brought water from the Cubalmena dam, in Biota, about 2 km away."}],"fr":[{"h":"Histoire","t":"Les Romains arrivèrent dans la région vers 195 av. J.-C. La ville, peut-être la Tarraga citée par Pline, se développa le long de la voie reliant Caesar Augusta (Saragosse) à Pompaelo (Pampelune). Vers le IIIe siècle apr. J.-C., la partie basse et monumentale fut presque abandonnée et la population se replia sur la colline d'El Pueyo, où elle a pu se maintenir jusqu'au IXe siècle.\n\nLe site est protégé depuis 1931 et classé Bien d'intérêt culturel depuis 2003. José Galiay y fouilla dans les années 1940 et Antonio Beltrán dans les années 1970. Depuis 2008, la Fundación Uncastillo dirige un programme de recherche qui a mis au jour le forum."},{"h":"À voir","t":"Les thermes, de la fin du Ier siècle apr. J.-C., couvrent environ 530 m². On distingue le vestiaire, la salle froide avec son bassin, les salles tiède et chaude, une étuve et les latrines. Sur la terrasse d'El Pueyo se trouve le forum, où l'on a découvert des piédestaux dédiés à Tibère et à Lucius César.\n\nL'aqueduc est l'image la plus connue : 32 des plus de 70 piliers qui franchissaient une dépression d'environ 350 mètres sont encore debout. Il amenait l'eau depuis le barrage de Cubalmena, à Biota, à environ 2 km."}],"de":[{"h":"Geschichte","t":"Die Römer kamen um 195 v. Chr. in diese Gegend. Die Stadt, vielleicht das von Plinius erwähnte Tarraga, wuchs an der Straße zwischen Caesar Augusta (Zaragoza) und Pompaelo (Pamplona). Um das 3. Jahrhundert n. Chr. wurde der untere, monumentale Teil fast aufgegeben, und die Bewohner zogen sich auf den Hügel El Pueyo zurück, wo sie möglicherweise bis ins 9. Jahrhundert lebten.\n\nSeit 1931 steht die Stätte unter Schutz, seit 2003 ist sie Kulturgut von besonderem Interesse. José Galiay grub hier in den 1940er-Jahren, Antonio Beltrán in den 1970ern. Seit 2008 leitet die Fundación Uncastillo ein Forschungsprogramm, das das Forum freigelegt hat."},{"h":"Sehenswert","t":"Die Thermen vom Ende des 1. Jahrhunderts n. Chr. umfassen rund 530 m². Zu erkennen sind Umkleide, Kaltbad mit Becken, Lau- und Warmbad, ein Schwitzraum und die Latrinen. Auf der Terrasse von El Pueyo liegt das Forum, wo Sockel mit Weihungen an Tiberius und Lucius Caesar gefunden wurden.\n\nDas bekannteste Motiv ist das Aquädukt: 32 der über 70 Pfeiler, die eine rund 350 Meter breite Senke überbrückten, stehen noch. Es brachte das Wasser vom Damm von Cubalmena in Biota, etwa 2 km entfernt."}],"pt":[{"h":"História","t":"Os romanos chegaram a esta zona por volta de 195 a. C. A cidade, talvez a Tarraga citada por Plínio, cresceu junto à via que ligava Caesar Augusta (Saragoça) a Pompaelo (Pamplona). Por volta do século III d. C., a parte baixa e monumental ficou quase abandonada e a população recolheu-se ao cerro de El Pueyo, onde poderá ter vivido até ao século IX.\n\nEstá protegida desde 1931 e é Bem de Interesse Cultural desde 2003. José Galiay escavou aqui nos anos quarenta e Antonio Beltrán nos anos setenta. Desde 2008, a Fundación Uncastillo dirige um plano de investigação que pôs a descoberto o fórum."},{"h":"O que ver","t":"As termas, do final do século I d. C., ocupam cerca de 530 m². Distinguem-se o vestiário, a sala fria com a sua piscina, as salas tépida e quente, uma sauna e as latrinas. No terraço de El Pueyo fica o fórum, onde apareceram pedestais dedicados a Tibério e a Lúcio César.\n\nO aqueduto é a imagem mais conhecida: continuam de pé 32 dos mais de 70 pilares que venciam uma depressão de cerca de 350 metros. Trazia a água da barragem de Cubalmena, em Biota, a cerca de 2 km."}]},"status":"pending"},{"id":"mausoleo-atilios","town":"Sádaba","cat":"arqueologia","lat":42.29519,"lon":-1.26581,"coord_src":"https://es.wikipedia.org/wiki/Mausoleo_de_los_Atilios","q":["Mausoleo de los Atilios","Altar de los Moros, Sádaba"],"fq":["Mausoleo de los Atilios","Mausoleum of the Atilii","Sádaba mausoleo romano"],"name":{"es":"Mausoleo de los Atilios","en":"Mausoleum of the Atilii","fr":"Mausolée des Atilii","de":"Mausoleum der Atilier","pt":"Mausoléu dos Atílios"},"when":{"es":"Siglos II–III d. C. · Monumento funerario romano","en":"2nd–3rd century AD · Roman funerary monument","fr":"IIe–IIIe siècle apr. J.-C. · Monument funéraire romain","de":"2.–3. Jh. n. Chr. · Römisches Grabmonument","pt":"Séculos II–III d. C. · Monumento funerário romano"},"desc":{"es":"Junto a la carretera de Sádaba a Uncastillo se alza la fachada de un mausoleo romano. Tres generaciones de la familia de los Atilios quisieron ser recordadas aquí.","en":"Beside the road from Sádaba to Uncastillo stands the façade of a Roman mausoleum. Three generations of the Atilius family wished to be remembered here.","fr":"Au bord de la route de Sádaba à Uncastillo se dresse la façade d'un mausolée romain. Trois générations de la famille des Atilii voulurent qu'on se souvienne d'elles ici.","de":"An der Straße von Sádaba nach Uncastillo steht die Fassade eines römischen Mausoleums. Drei Generationen der Familie der Atilier wollten hier in Erinnerung bleiben.","pt":"Junto à estrada de Sádaba para Uncastillo ergue-se a fachada de um mausoléu romano. Três gerações da família dos Atílios quiseram ser recordadas aqui."},"visit":{"es":"Acceso libre, a unos 300 metros de la carretera A-1202 y muy cerca de Los Bañales. Se ve en unos 20 minutos. No hay servicios en el lugar.","en":"Free access, about 300 metres from the A-1202 road and very close to Los Bañales. It takes about 20 minutes to see. There are no facilities on site.","fr":"Accès libre, à environ 300 mètres de la route A-1202 et tout près de Los Bañales. La visite prend une vingtaine de minutes. Pas de services sur place.","de":"Frei zugänglich, etwa 300 Meter von der Straße A-1202 und ganz in der Nähe von Los Bañales. Für die Besichtigung genügen rund 20 Minuten. Vor Ort gibt es keine Einrichtungen.","pt":"Acesso livre, a cerca de 300 metros da estrada A-1202 e muito perto de Los Bañales. Vê-se em cerca de 20 minutos. Não há serviços no local."},"src":"https://es.wikipedia.org/wiki/Mausoleo_de_los_Atilios","sources":["https://es.wikipedia.org/wiki/Mausoleo_de_los_Atilios","https://en.wikipedia.org/wiki/Mausoleum_of_the_Atilii"],"art":{"es":[{"h":"Historia","t":"Lo levantó una familia de propietarios rurales romanizados, los Atilios, en los siglos II o III d. C. Solo se conserva la portada, de arenisca de la zona. En la comarca se le conocía como el «Altar de los Moros».\n\nFue declarado monumento histórico-artístico en 1931; por un error de la época, el decreto lo incluyó en la lista de Navarra en lugar de la de Zaragoza. Está en el norte del término de Sádaba, en el límite con Uncastillo y Layana, y es Bien de Interés Cultural. En 2016 se hizo una reconstrucción en 3D a partir de fotogrametría."},{"h":"Qué ver","t":"Fíjate en las tres inscripciones latinas de la fachada. Nombran a tres generaciones de la familia: un abuelo, un padre y Atilia Festa, que dejó escrito que hizo la obra en vida para sí misma, con la fórmula se viva fecit. Cada texto sigue el modelo de las lápidas romanas: nombre, filiación y tribu, aquí la Quirina.\n\nLa cercanía de Los Bañales ayuda a imaginar el paisaje de la época: una ciudad rodeada de fincas de familias acomodadas como esta, que mostraban su posición junto a los caminos."}],"en":[{"h":"History","t":"It was built by a family of Romanised rural landowners, the Atilii, in the 2nd or 3rd century AD. Only the façade survives, made of local sandstone. Locally it was known as the \"Altar de los Moros\" (Moors' Altar).\n\nIt was declared a historic-artistic monument in 1931; owing to an error of the time, the decree placed it on the list for Navarre instead of Zaragoza. It lies in the north of the Sádaba municipality, on the boundary with Uncastillo and Layana, and is a Site of Cultural Interest. In 2016 a 3D reconstruction was made from photogrammetry."},{"h":"What to see","t":"Look at the three Latin inscriptions on the façade. They name three generations of the family: a grandfather, a father and Atilia Festa, who recorded that she had the work made in her lifetime for herself, with the formula se viva fecit. Each text follows the model of Roman tombstones: name, parentage and voting tribe, here the Quirina.\n\nThe nearness of Los Bañales helps you picture the landscape of the time: a city surrounded by the estates of well-off families like this one, who displayed their status beside the roads."}],"fr":[{"h":"Histoire","t":"Il fut élevé par une famille de propriétaires ruraux romanisés, les Atilii, au IIe ou IIIe siècle apr. J.-C. Seule subsiste la façade, en grès local. Dans la région, on l'appelait l'« Altar de los Moros » (l'autel des Maures).\n\nIl fut déclaré monument historique et artistique en 1931 ; à cause d'une erreur de l'époque, le décret le plaça sur la liste de la Navarre au lieu de celle de Saragosse. Il se trouve au nord de la commune de Sádaba, à la limite d'Uncastillo et de Layana, et il est classé Bien d'intérêt culturel. En 2016, une reconstitution en 3D a été réalisée par photogrammétrie."},{"h":"À voir","t":"Observez les trois inscriptions latines de la façade. Elles nomment trois générations de la famille : un grand-père, un père et Atilia Festa, qui fit graver qu'elle avait fait faire l'ouvrage de son vivant pour elle-même, selon la formule se viva fecit. Chaque texte suit le modèle des épitaphes romaines : nom, filiation et tribu, ici la Quirina.\n\nLa proximité de Los Bañales aide à imaginer le paysage de l'époque : une ville entourée des domaines de familles aisées comme celle-ci, qui affichaient leur rang au bord des routes."}],"de":[{"h":"Geschichte","t":"Errichtet wurde es von einer romanisierten Grundbesitzerfamilie, den Atiliern, im 2. oder 3. Jahrhundert n. Chr. Erhalten ist nur die Fassade aus örtlichem Sandstein. In der Gegend hieß es „Altar de los Moros“ (Altar der Mauren).\n\n1931 wurde es zum historisch-künstlerischen Denkmal erklärt; wegen eines damaligen Fehlers führte der Erlass es in der Liste Navarras statt Zara
