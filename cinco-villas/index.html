gozas. Es liegt im Norden der Gemeinde Sádaba an der Grenze zu Uncastillo und Layana und ist Kulturgut von besonderem Interesse. 2016 entstand eine 3D-Rekonstruktion auf Grundlage der Fotogrammetrie."},{"h":"Sehenswert","t":"Achten Sie auf die drei lateinischen Inschriften an der Fassade. Sie nennen drei Generationen der Familie: einen Großvater, einen Vater und Atilia Festa, die festhalten ließ, dass sie das Werk zu Lebzeiten für sich selbst errichten ließ, mit der Formel se viva fecit. Jeder Text folgt dem Muster römischer Grabsteine: Name, Abstammung und Tribus, hier die Quirina.\n\nDie Nähe zu Los Bañales hilft, sich die damalige Landschaft vorzustellen: eine Stadt, umgeben von Gütern wohlhabender Familien wie dieser, die ihren Rang an den Straßen zur Schau stellten."}],"pt":[{"h":"História","t":"Foi erguido por uma família de proprietários rurais romanizados, os Atílios, nos séculos II ou III d. C. Só se conserva a fachada, de arenito da região. Na zona era conhecido como «Altar de los Moros» (Altar dos Mouros).\n\nFoi declarado monumento histórico-artístico em 1931; por um erro da época, o decreto incluiu-o na lista de Navarra em vez da de Saragoça. Fica no norte do concelho de Sádaba, no limite com Uncastillo e Layana, e é Bem de Interesse Cultural. Em 2016 foi feita uma reconstituição 3D a partir de fotogrametria."},{"h":"O que ver","t":"Repare nas três inscrições latinas da fachada. Nomeiam três gerações da família: um avô, um pai e Atília Festa, que deixou escrito que mandou fazer a obra em vida para si própria, com a fórmula se viva fecit. Cada texto segue o modelo das lápides romanas: nome, filiação e tribo, aqui a Quirina.\n\nA proximidade de Los Bañales ajuda a imaginar a paisagem da época: uma cidade rodeada pelas propriedades de famílias abastadas como esta, que exibiam a sua posição junto aos caminhos."}]},"status":"pending"},{"id":"castillo-sadaba","town":"Sádaba","cat":"patrimonio","lat":42.28127,"lon":-1.26731,"coord_src":null,"q":["Castillo de Sádaba","Calle del Castillo, Sádaba"],"fq":["Castillo de Sádaba","Sádaba castillo"],"name":{"es":"Castillo de Sádaba","en":"Sádaba Castle","fr":"Château de Sádaba","de":"Burg von Sádaba","pt":"Castelo de Sádaba"},"when":{"es":"Siglo XIII · Recinto de siete torres","en":"13th century · Enclosure with seven towers","fr":"XIIIe siècle · Enceinte à sept tours","de":"13. Jahrhundert · Anlage mit sieben Türmen","pt":"Século XIII · Recinto de sete torres"},"desc":{"es":"Un recinto rectangular de sillería con siete torres almenadas domina Sádaba. Está muy bien conservado y se puede recorrer por dentro, camino de ronda incluido.","en":"A rectangular ashlar enclosure with seven battlemented towers dominates Sádaba. It is very well preserved and you can walk around inside, wall walk included.","fr":"Une enceinte rectangulaire en pierre de taille, flanquée de sept tours crénelées, domine Sádaba. Très bien conservée, elle se visite à l'intérieur, chemin de ronde compris.","de":"Eine rechteckige Quaderanlage mit sieben zinnenbewehrten Türmen beherrscht Sádaba. Sie ist sehr gut erhalten und innen begehbar, einschließlich Wehrgang.","pt":"Um recinto retangular de cantaria com sete torres ameadas domina Sádaba. Está muito bem conservado e pode percorrer-se por dentro, incluindo o caminho de ronda."},"visit":{"es":"Se visita el interior y el camino de ronda sobre las almenas. Alberga la oficina de turismo comarcal, donde puedes confirmar horarios. Calcula unos 45 minutos. En verano acoge el Festival del Castillo.","en":"You can visit the interior and the wall walk along the battlements. It houses the district tourist office, where you can check opening times. Allow about 45 minutes. In summer it hosts the Festival del Castillo.","fr":"On visite l'intérieur et le chemin de ronde au-dessus des créneaux. Le château abrite l'office de tourisme de la comarca, où vous pourrez vérifier les horaires. Comptez environ 45 minutes. En été, il accueille le Festival del Castillo.","de":"Besichtigt werden das Innere und der Wehrgang über den Zinnen. In der Burg befindet sich das Fremdenverkehrsamt der Comarca, wo Sie die Öffnungszeiten erfragen können. Etwa 45 Minuten einplanen. Im Sommer findet hier das Festival del Castillo statt.","pt":"Visita-se o interior e o caminho de ronda sobre as ameias. Acolhe o posto de turismo da comarca, onde pode confirmar horários. Conte com cerca de 45 minutos. No verão recebe o Festival del Castillo."},"src":"https://turismocincovillas.com/wp-content/uploads/2024/05/Castillo_Sadaba.pdf","sources":["https://turismocincovillas.com/wp-content/uploads/2024/05/Castillo_Sadaba.pdf","https://www.spain.info/es/lugares-interes/castillo-sadaba/","https://es.wikipedia.org/wiki/S%C3%A1daba"],"art":{"es":[{"h":"Historia","t":"Sádaba fue tierra de frontera: en época califal estaba en el límite norte de la Marca Superior de al-Ándalus y más tarde entre los reinos de Aragón y Navarra. Alfonso I el Batallador mandó construir en 1125 un castillo más primitivo que el actual. El que vemos se relaciona con el siglo XIII: en 1223 consta ya un tenente, Fernando de Leret, en «Sádaba Nueva».\n\nSus muros altos y lisos, con pocas aberturas, se han relacionado con la arquitectura cisterciense."},{"h":"Qué ver","t":"El recinto mide unos 38 por 30 metros. Tiene cuatro torres en las esquinas y tres más en los lienzos; la llamada Torre del Rey guarda la puerta. Dentro quedan la capilla, que perteneció a la Orden de Malta, y el aljibe.\n\nCuenta la tradición que desde el aljibe partía un pasadizo hasta un convento carmelita, en el edificio de la actual farmacia, por el que escapaban el rey o el alcaide en tiempo de guerra.\n\nSube al camino de ronda: desde las almenas se domina la llanura de las Cinco Villas que el castillo vigilaba."}],"en":[{"h":"History","t":"Sádaba was frontier land: in the time of the Caliphate it lay on the northern edge of the Upper March of al-Andalus, and later between the kingdoms of Aragon and Navarre. Alfonso I the Battler had a more primitive castle built in 1125. The one we see is linked to the 13th century: by 1223 a governor, Fernando de Leret, is recorded in \"Sádaba Nueva\".\n\nIts tall, plain walls with few openings have been related to Cistercian architecture."},{"h":"What to see","t":"The enclosure measures about 38 by 30 metres. It has four corner towers and three more along the walls; the so-called Torre del Rey guards the gate. Inside are the chapel, which belonged to the Order of Malta, and the cistern.\n\nTradition says that a passage ran from the cistern to a Carmelite convent, in the building of today's pharmacy, through which the king or the governor escaped in times of war.\n\nClimb up to the wall walk: from the battlements you look out over the Cinco Villas plain that the castle once guarded."}],"fr":[{"h":"Histoire","t":"Sádaba fut une terre de frontière : à l'époque du califat, elle se trouvait à la limite nord de la Marche supérieure d'al-Andalus, puis entre les royaumes d'Aragon et de Navarre. Alphonse Ier le Batailleur fit construire en 1125 un château plus primitif que l'actuel. Celui que l'on voit est lié au XIIIe siècle : dès 1223, un gouverneur, Fernando de Leret, est attesté à « Sádaba Nueva ».\n\nSes murs hauts et lisses, percés de rares ouvertures, ont été rapprochés de l'architecture cistercienne."},{"h":"À voir","t":"L'enceinte mesure environ 38 mètres sur 30. Elle compte quatre tours d'angle et trois autres le long des courtines ; la tour dite Torre del Rey garde la porte. À l'intérieur se trouvent la chapelle, qui appartint à l'ordre de Malte, et la citerne.\n\nLa tradition raconte qu'un souterrain partait de la citerne jusqu'à un couvent carmélite, dans le bâtiment de l'actuelle pharmacie, par lequel le roi ou le gouverneur s'échappaient en temps de guerre.\n\nMontez au chemin de ronde : depuis les créneaux, on domine la plaine des Cinco Villas que le château surveillait."}],"de":[{"h":"Geschichte","t":"Sádaba war Grenzland: Zur Zeit des Kalifats lag es am Nordrand der Oberen Mark von al-Andalus, später zwischen den Königreichen Aragonien und Navarra. Alfons I. der Kämpfer ließ 1125 eine einfachere Burg als die heutige bauen. Die erhaltene wird mit dem 13. Jahrhundert verbunden: Schon 1223 ist ein Burgvogt, Fernando de Leret, in „Sádaba Nueva“ belegt.\n\nIhre hohen, glatten Mauern mit wenigen Öffnungen hat man mit der Zisterzienserarchitektur in Verbindung gebracht."},{"h":"Sehenswert","t":"Die Anlage misst etwa 38 mal 30 Meter. Sie hat vier Ecktürme und drei weitere an den Mauern; der sogenannte Torre del Rey bewacht das Tor. Im Inneren liegen die Kapelle, die dem Malteserorden gehörte, und die Zisterne.\n\nDer Überlieferung nach führte von der Zisterne ein Gang zu einem Karmelitinnenkloster im Gebäude der heutigen Apotheke, durch den der König oder der Burgvogt in Kriegszeiten flohen.\n\nSteigen Sie auf den Wehrgang: Von den Zinnen überblickt man die Ebene der Cinco Villas, die die Burg einst bewachte."}],"pt":[{"h":"História","t":"Sádaba foi terra de fronteira: na época califal ficava no limite norte da Marca Superior do al-Andalus e, mais tarde, entre os reinos de Aragão e Navarra. Afonso I, o Batalhador, mandou construir em 1125 um castelo mais primitivo do que o atual. O que vemos está ligado ao século XIII: em 1223 já consta um alcaide, Fernando de Leret, em «Sádaba Nueva».\n\nAs suas muralhas altas e lisas, com poucas aberturas, têm sido relacionadas com a arquitetura cisterciense."},{"h":"O que ver","t":"O recinto mede cerca de 38 por 30 metros. Tem quatro torres nos cantos e mais três nos panos de muralha; a chamada Torre del Rey guarda a porta. No interior ficam a capela, que pertenceu à Ordem de Malta, e a cisterna.\n\nConta a tradição que da cisterna partia uma passagem até um convento carmelita, no edifício da atual farmácia, por onde o rei ou o alcaide fugiam em tempo de guerra.\n\nSuba ao caminho de ronda: das ameias domina-se a planície das Cinco Villas que o castelo vigiava."}]},"status":"pending"},{"id":"castillo-biel","town":"Biel","cat":"patrimonio","lat":42.38771,"lon":-0.93647,"coord_src":"https://castillosenaragon.es/wp-content/uploads/2019/04/CV.-56.-FICHA-BIEL.pdf","q":["Castillo de Biel","Torre de Biel"],"fq":["Category:Biel castle","Castillo de Biel","Biel Zaragoza"],"name":{"es":"Castillo de Biel","en":"Biel Castle","fr":"Château de Biel","de":"Burg von Biel","pt":"Castelo de Biel"},"when":{"es":"Siglo XI · Torre-palacio románica","en":"11th century · Romanesque tower-palace","fr":"XIe siècle · Tour-palais romane","de":"11. Jahrhundert · Romanischer Wohnturm","pt":"Século XI · Torre-palácio românica"},"desc":{"es":"Una torre de 25 metros, levantada en el siglo XI, domina Biel y el paso entre Ejea y el antiguo condado de Aragón. Fue palacio del rey en tiempos de Sancho Ramírez.","en":"A 25-metre tower, built in the 11th century, dominates Biel and the pass between Ejea and the old County of Aragon. It was a royal palace in the time of Sancho Ramírez.","fr":"Une tour de 25 mètres, bâtie au XIe siècle, domine Biel et le passage entre Ejea et l'ancien comté d'Aragon. Elle fut palais royal à l'époque de Sanche Ramírez.","de":"Ein 25 Meter hoher Turm aus dem 11. Jahrhundert beherrscht Biel und den Übergang zwischen Ejea und der alten Grafschaft Aragonien. Zur Zeit Sancho Ramírez' war er königlicher Palast.","pt":"Uma torre de 25 metros, erguida no século XI, domina Biel e a passagem entre Ejea e o antigo condado de Aragão. Foi palácio do rei no tempo de Sancho Ramírez."},"visit":{"es":"La torre se contempla desde fuera, junto a la iglesia de San Martín; el acceso al interior es restringido, así que pregunta en el ayuntamiento o en la oficina de turismo si hay visitas. Pasear por el casco y la judería lleva una hora.","en":"The tower is seen from outside, next to the Church of San Martín; access to the interior is restricted, so ask the town hall or the tourist office whether visits are available. A stroll round the village and the Jewish quarter takes an hour.","fr":"La tour se contemple de l'extérieur, à côté de l'église San Martín ; l'accès à l'intérieur est restreint, demandez donc à la mairie ou à l'office de tourisme si des visites sont possibles. Une promenade dans le village et le quartier juif prend une heure.","de":"Der Turm ist von außen zu sehen, neben der Kirche San Martín; der Zugang zum Inneren ist eingeschränkt, fragen Sie daher im Rathaus oder beim Fremdenverkehrsamt nach Besichtigungen. Ein Bummel durch Ort und jüdisches Viertel dauert eine Stunde.","pt":"A torre contempla-se do exterior, junto à igreja de San Martín; o acesso ao interior é restrito, por isso pergunte na câmara municipal ou no posto de turismo se há visitas. Um passeio pela povoação e pela judiaria leva uma hora."},"src":"https://castillosenaragon.es/wp-content/uploads/2019/04/CV.-56.-FICHA-BIEL.pdf","sources":["https://castillosenaragon.es/wp-content/uploads/2019/04/CV.-56.-FICHA-BIEL.pdf","https://es.wikipedia.org/wiki/Biel_(Zaragoza)"],"art":{"es":[{"h":"Historia","t":"Las primeras noticias son de tiempos de Sancho III el Mayor de Navarra, y el primer tenente conocido fue Blasco Orioli, a mediados del siglo XI. En 1071 Sancho Ramírez la entregó en dote a su esposa, Felicia de Roucy; desde entonces aparece como castillo o palacio del rey, con sus hijos Fernando y Alfonso como tenentes. Cuando Alfonso subió al trono, en 1104, nombró tenente a Castán de Biel, origen de un linaje de señores de la villa.\n\nSe ha propuesto que la levantaran constructores europeos, quizá normandos que participaron en la cruzada de Barbastro. Es Bien de Interés Cultural."},{"h":"Qué ver","t":"Es una torre-palacio de planta irregular, de unos 105 m² por planta y 25 metros de altura, con cuatro arcos de medio punto en cada piso. Se asienta sobre una plataforma de roca en lo alto del pueblo y por fuera se ha consolidado y recubierto.\n\nAl bajar, recorre el casco: la iglesia de San Martín, románica en su planta y reformada en el siglo XVI, y la antigua judería, una de las más destacadas de las Cinco Villas."}],"en":[{"h":"History","t":"The first records date from the time of Sancho III the Great of Navarre, and the first known governor was Blasco Orioli, in the mid-11th century. In 1071 Sancho Ramírez gave it as a dowry to his wife, Felicia de Roucy; from then on it appears as the king's castle or palace, with his sons Ferdinand and Alfonso as governors. When Alfonso came to the throne in 1104 he appointed Castán de Biel governor, the origin of a line of lords of the town.\n\nIt has been suggested that it was built by European masons, perhaps Normans who took part in the crusade of Barbastro. It is a Site of Cultural Interest."},{"h":"What to see","t":"It is a tower-palace with an irregular plan, about 105 m² per floor and 25 metres high, with four round arches on each level. It stands on a rock platform at the top of the village, and its exterior has been consolidated and re-roofed.\n\nOn the way down, walk round the village: the Church of San Martín, Romanesque in plan and remodelled in the 16th century, and the former Jewish quarter, one of the most notable in the Cinco Villas."}],"fr":[{"h":"Histoire","t":"Les premières mentions remontent à l'époque de Sanche III le Grand de Navarre, et le premier gouverneur connu fut Blasco Orioli, au milieu du XIe siècle. En 1071, Sanche Ramírez la donna en dot à son épouse, Félicie de Roucy ; dès lors, elle apparaît comme château ou palais du roi, avec ses fils Ferdinand et Alphonse comme gouverneurs. Monté sur le trône en 1104, Alphonse nomma gouverneur Castán de Biel, à l'origine d'une lignée de seigneurs du lieu.\n\nOn a avancé qu'elle aurait été bâtie par des constructeurs européens, peut-être des Normands ayant pris part à la croisade de Barbastro. Elle est classée Bien d'intérêt culturel."},{"h":"À voir","t":"C'est une tour-palais au plan irrégulier, d'environ 105 m² par étage et 25 mètres de haut, avec quatre arcs en plein cintre à chaque niveau. Elle repose sur une plateforme rocheuse au sommet du village ; l'extérieur a été consolidé et la toiture refaite.\n\nEn redescendant, parcourez le village : l'église San Martín, romane par son plan et remaniée au XVIe siècle, et l'ancien quartier juif, l'un des plus remarquables des Cinco Villas."}],"de":[{"h":"Geschichte","t":"Die ersten Nachrichten stammen aus der Zeit Sanchos III. des Großen von Navarra; erster bekannter Burgvogt war Blasco Orioli Mitte des 11. Jahrhunderts. 1071 gab Sancho Ramírez die Burg seiner Gemahlin Felicia von Roucy als Mitgift; seitdem erscheint sie als Burg oder Palast des Königs, mit seinen Söhnen Ferdinand und Alfons als Vögten. Als Alfons 1104 den Thron bestieg, ernannte er Castán de Biel zum Vogt, Stammvater eines Geschlechts von Ortsherren.\n\nMan vermutet, dass europäische Baumeister sie errichteten, vielleicht Normannen, die am Kreuzzug von Barbastro teilgenommen hatten. Sie ist Kulturgut von besonderem Interesse."},{"h":"Sehenswert","t":"Es ist ein Wohnturm mit unregelmäßigem Grundriss, rund 105 m² pro Geschoss und 25 Meter hoch, mit vier Rundbögen auf jeder Ebene. Er steht auf einer Felsplattform am höchsten Punkt des Dorfes; außen wurde er gesichert und neu gedeckt.\n\nAuf dem Rückweg lohnt ein Rundgang: die Kirche San Martín, im Grundriss romanisch und im 16. Jahrhundert umgebaut, und das einstige jüdische Viertel, eines der bedeutendsten der Cinco Villas."}],"pt":[{"h":"História","t":"As primeiras notícias são do tempo de Sancho III, o Grande, de Navarra, e o primeiro alcaide conhecido foi Blasco Orioli, em meados do século XI. Em 1071, Sancho Ramírez deu-a em dote à mulher, Felícia de Roucy; desde então aparece como castelo ou palácio do rei, com os seus filhos Fernando e Afonso como alcaides. Quando Afonso subiu ao trono, em 1104, nomeou alcaide Castán de Biel, origem de uma linhagem de senhores da vila.\n\nJá se propôs que a tenham erguido construtores europeus, talvez normandos que participaram na cruzada de Barbastro. É Bem de Interesse Cultural."},{"h":"O que ver","t":"É uma torre-palácio de planta irregular, com cerca de 105 m² por piso e 25 metros de altura, com quatro arcos de volta perfeita em cada andar. Assenta numa plataforma de rocha no alto da povoação; por fora foi consolidada e recebeu nova cobertura.\n\nAo descer, percorra a povoação: a igreja de San Martín, românica na planta e remodelada no século XVI, e a antiga judiaria, uma das mais destacadas das Cinco Villas."}]},"status":"pending"},{"id":"san-salvador-ejea","town":"Ejea de los Caballeros","cat":"patrimonio","lat":42.12598,"lon":-1.14211,"coord_src":"https://castillosenaragon.es/wp-content/uploads/2019/04/CV.-3.-FICHA-EJEA-DE-LOS-CABALLEROS-igl-del-Salvador.pdf","q":["Iglesia de El Salvador, Ejea de los Caballeros","Iglesia del Salvador Ejea"],"fq":["Iglesia de El Salvador Ejea de los Caballeros","Ejea de los Caballeros iglesia Salvador","Ejea. Iglesia de San Salvador"],"name":{"es":"Iglesia de El Salvador","en":"Church of El Salvador","fr":"Église El Salvador","de":"Kirche El Salvador","pt":"Igreja de El Salvador"},"when":{"es":"Consagrada en 1222 · Iglesia-fortaleza","en":"Consecrated in 1222 · Fortress church","fr":"Consacrée en 1222 · Église-forteresse","de":"Geweiht 1222 · Wehrkirche","pt":"Consagrada em 1222 · Igreja-fortaleza"},"desc":{"es":"En una de las entradas de Ejea, El Salvador parece más un castillo que una iglesia: almenas, camino de ronda y dos torres. Dentro guarda un gran retablo gótico.","en":"At one of the entrances to Ejea, El Salvador looks more like a castle than a church: battlements, a wall walk and two towers. Inside it holds a large Gothic altarpiece.","fr":"À l'une des entrées d'Ejea, El Salvador ressemble davantage à un château qu'à une église : créneaux, chemin de ronde et deux tours. Elle abrite un grand retable gothique.","de":"An einem der Ortseingänge von Ejea wirkt El Salvador eher wie eine Burg als wie eine Kirche: Zinnen, Wehrgang und zwei Türme. Innen birgt sie einen großen gotischen Altar.","pt":"Numa das entradas de Ejea, El Salvador parece mais um castelo do que uma igreja: ameias, caminho de ronda e duas torres. No interior guarda um grande retábulo gótico."},"visit":{"es":"Las portadas se ven libremente desde la calle. Para el interior, confirma horarios y visitas guiadas en la oficina de turismo de Ejea. Calcula unos 45 minutos.","en":"The doorways can be seen freely from the street. For the interior, check opening times and guided tours at the Ejea tourist office. Allow about 45 minutes.","fr":"Les portails se voient librement depuis la rue. Pour l'intérieur, vérifiez horaires et visites guidées à l'office de tourisme d'Ejea. Comptez environ 45 minutes.","de":"Die Portale sind von der Straße aus frei zu sehen. Für das Innere Öffnungszeiten und Führungen beim Fremdenverkehrsamt Ejea erfragen. Etwa 45 Minuten einplanen.","pt":"Os portais veem-se livremente da rua. Para o interior, confirme horários e visitas guiadas no posto de turismo de Ejea. Conte com cerca de 45 minutos."},"src":"https://turismocincovillas.com/wp-content/uploads/2024/05/Iglesia-del-Salvador_Ejea-de-los-Caballeros.pdf","sources":["https://turismocincovillas.com/wp-content/uploads/2024/05/Iglesia-del-Salvador_Ejea-de-los-Caballeros.pdf","https://castillosenaragon.es/wp-content/uploads/2019/04/CV.-3.-FICHA-EJEA-DE-LOS-CABALLEROS-igl-del-Salvador.pdf"],"art":{"es":[{"h":"Historia","t":"Una inscripción al pie de uno de sus muros recuerda que la consagró en 1222 el obispo de Zaragoza, Ximeno de Luna. Es unos cincuenta años posterior a la iglesia de Santa María, que ocupa la parte alta de la villa.\n\nEntre los siglos XIV y XV se le añadió una envoltura defensiva gótica: almenas, un adarve sobre la nave y dos torres desiguales con matacanes y garitones. Por dentro conserva formas góticas; por fuera, lo que parece una envoltura guerrera. Ha sido restaurada varias veces y es Bien de Interés Cultural."},{"h":"Qué ver","t":"Las portadas norte y oeste salieron del taller del Maestro de Agüero. Busca los animales fantásticos, las grullas y una bailarina contorsionista junto a una arpista, que se ha interpretado como la firma del escultor.\n\nEl retablo mayor es obra gótica de Blasco de Grañén, que terminó Martín de Soria tras su muerte. Durante siglos sus tablas estuvieron tapadas por pinturas barrocas hasta que una restauración las recuperó. Hay quien ve al fondo de dos de ellas la Aljafería y la ciudad de Zaragoza."}],"en":[{"h":"History","t":"An inscription at the foot of one of its walls records that it was consecrated in 1222 by the Bishop of Zaragoza, Ximeno de Luna. It is some fifty years later than the Church of Santa María, which stands in the upper part of the town.\n\nIn the 14th and 15th centuries a Gothic defensive shell was added: battlements, a wall walk over the nave and two unequal towers with machicolations and bartizans. Inside it keeps Gothic forms; outside, it looks like armour. It has been restored several times and is a Site of Cultural Interest."},{"h":"What to see","t":"The north and west doorways came from the workshop of the Master of Agüero. Look for the fantastic beasts, the cranes and a contortionist dancer beside a harpist, which has been read as the sculptor's signature.\n\nThe high altarpiece is a Gothic work by Blasco de Grañén, completed by Martín de Soria after his death. For centuries its panels were covered by Baroque paintings until a restoration brought them back. Some people see the Aljafería and the city of Zaragoza in the background of two of them."}],"fr":[{"h":"Histoire","t":"Une inscription au pied de l'un de ses murs rappelle qu'elle fut consacrée en 1222 par l'évêque de Saragosse, Ximeno de Luna. Elle est postérieure d'une cinquantaine d'années à l'église Santa María, qui occupe la partie haute de la ville.\n\nAux XIVe et XVe siècles, on lui ajouta une enveloppe défensive gothique : créneaux, chemin de ronde au-dessus de la nef et deux tours inégales avec mâchicoulis et échauguettes. À l'intérieur, elle garde des formes gothiques ; à l'extérieur, elle semble en armure. Restaurée à plusieurs reprises, elle est classée Bien d'intérêt culturel."},{"h":"À voir","t":"Les portails nord et ouest sont sortis de l'atelier du Maître d'Agüero. Cherchez les animaux fantastiques, les grues et une danseuse contorsionniste à côté d'une harpiste, interprétée comme la signature du sculpteur.\n\nLe grand retable est une œuvre gothique de Blasco de Grañén, achevée par Martín de Soria après sa mort. Pendant des siècles, ses panneaux furent recouverts de peintures baroques, jusqu'à ce qu'une restauration les fasse réapparaître. Certains voient l'Aljafería et la ville de Saragosse à l'arrière-plan de deux d'entre eux."}],"de":[{"h":"Geschichte","t":"Eine Inschrift am Fuß einer ihrer Mauern berichtet, dass der Bischof von Zaragoza, Ximeno de Luna, sie 1222 weihte. Sie ist rund fünfzig Jahre jünger als die Kirche Santa María im oberen Teil des Ortes.\n\nIm 14. und 15. Jahrhundert erhielt sie eine gotische Wehrhülle: Zinnen, einen Wehrgang über dem Schiff und zwei ungleiche Türme mit Maschikulis und Erkertürmchen. Innen bewahrt sie gotische Formen, außen wirkt sie wie gepanzert. Sie wurde mehrmals restauriert und ist Kulturgut von besonderem Interesse."},{"h":"Sehenswert","t":"Nord- und Westportal stammen aus der Werkstatt des Meisters von Agüero. Suchen Sie die Fabelwesen, die Kraniche und eine Schlangentänzerin neben einer Harfenspielerin, die als Signatur des Bildhauers gedeutet wird.\n\nDer Hochaltar ist ein gotisches Werk von Blasco de Grañén, das Martín de Soria nach dessen Tod vollendete. Jahrhundertelang waren die Tafeln von barocken Gemälden überdeckt, bis eine Restaurierung sie wieder freilegte. Manche erkennen im Hintergrund zweier Tafeln die Aljafería und die Stadt Zaragoza."}],"pt":[{"h":"História","t":"Uma inscrição no pé de uma das suas paredes recorda que foi consagrada em 1222 pelo bispo de Saragoça, Ximeno de Luna. É cerca de cinquenta anos posterior à igreja de Santa María, que ocupa a parte alta da vila.\n\nEntre os séculos XIV e XV recebeu um invólucro defensivo gótico: ameias, um adarve sobre a nave e duas torres desiguais com matacães e guaritas. Por dentro conserva formas góticas; por fora, parece revestida de armadura. Foi restaurada várias vezes e é Bem de Interesse Cultural."},{"h":"O que ver","t":"Os portais norte e oeste saíram da oficina do Mestre de Agüero. Procure os animais fantásticos, os grous e uma bailarina contorcionista junto a uma harpista, interpretada como a assinatura do escultor.\n\nO retábulo-mor é obra gótica de Blasco de Grañén, terminada por Martín de Soria após a sua morte. Durante séculos, os painéis estiveram tapados por pinturas barrocas, até que um restauro os recuperou. Há quem veja ao fundo de dois deles a Aljafería e a cidade de Saragoça."}]},"status":"pending"},{"id":"santa-maria-tauste","town":"Tauste","cat":"patrimonio","lat":41.92114,"lon":-1.25687,"coord_src":null,"q":["Iglesia de Santa María, Tauste","Plaza Santa María, Tauste"],"fq":["Iglesia de Santa María Tauste","Tauste torre mudéjar","Tauste Santa María"],"name":{"es":"Iglesia de Santa María y torre alminar","en":"Church of Santa María and minaret tower","fr":"Église Santa María et tour-minaret","de":"Kirche Santa María und Minarettturm","pt":"Igreja de Santa María e torre-minarete"},"when":{"es":"Siglos XIII–XIV · Mudéjar aragonés","en":"13th–14th centuries · Aragonese Mudéjar","fr":"XIIIe–XIVe siècles · Mudéjar aragonais","de":"13.–14. Jahrhundert · Aragonesischer Mudéjar","pt":"Séculos XIII–XIV · Mudéjar aragonês"},"desc":{"es":"La gran iglesia de ladrillo de Tauste tiene una torre octogonal de tradición islámica que los vecinos llaman «la bien plantada». Dentro guarda un retablo de 1520 y un museo de arte sacro.","en":"Tauste's great brick church has an octagonal tower in the Islamic tradition that locals call \"la bien plantada\" (the well-planted one). Inside are an altarpiece from 1520 and a museum of sacred art.","fr":"La grande église de brique de Tauste possède une tour octogonale de tradition islamique que les habitants appellent « la bien plantada » (la bien campée). Elle abrite un retable de 1520 et un musée d'art sacré.","de":"Die große Backsteinkirche von Tauste hat einen achteckigen Turm in islamischer Tradition, den die Einheimischen „la bien plantada“ (die Wohlgestandene) nennen. Innen befinden sich ein Altar von 1520 und ein Museum für sakrale Kunst.","pt":"A grande igreja de tijolo de Tauste tem uma torre octogonal de tradição islâmica a que os habitantes chamam «la bien plantada» (a bem plantada). No interior há um retábulo de 1520 e um museu de arte sacra."},"visit":{"es":"Se visita el interior y el museo de arte sacro. La torre funciona como mirador: pregunta en la oficina de turismo de Tauste por horarios y por la subida. Calcula una hora.","en":"You can visit the interior and the museum of sacred art. The tower works as a viewpoint: ask the Tauste tourist office about opening times and climbing it. Allow an hour.","fr":"On visite l'intérieur et le musée d'art sacré. La tour sert de belvédère : renseignez-vous à l'office de tourisme de Tauste sur les horaires et la montée. Comptez une heure.","de":"Besichtigt werden das Innere und das Museum für sakrale Kunst. Der Turm dient als Aussichtspunkt: Beim Fremdenverkehrsamt Tauste nach Zeiten und Aufstieg fragen. Etwa eine Stunde einplanen.","pt":"Visita-se o interior e o museu de arte sacra. A torre funciona como miradouro: pergunte no posto de turismo de Tauste pelos horários e pela subida. Conte com uma hora."},"src":"https://turismocincovillas.com/wp-content/uploads/2024/05/Iglesia-de-Santa-Maria_Tauste.pdf","sources":["https://turismocincovillas.com/wp-content/uploads/2024/05/Iglesia-de-Santa-Maria_Tauste.pdf","https://turismocincovillas.com/wp-content/uploads/2024/05/Torre-Alminar_Tauste.pdf","https://www.spain.info/es/lugares-interes/iglesia-parroquial-santa-maria-tauste/","https://turismocincovillas.com/?p=9772"],"art":{"es":[{"h":"Historia","t":"Tauste, Tawst en época andalusí, fue una población musulmana importante de la taifa de Zaragoza. Alfonso I la conquistó en el siglo XII y en ella siguió viviendo una notable comunidad mudéjar. La iglesia se empezó en el primer tercio del siglo XIII y se terminó en el XIV, con reformas entre los siglos XVI y XVIII. Se hizo en ladrillo, a diferencia de las iglesias de piedra del norte de la comarca.\n\nLa torre se ha fechado tradicionalmente en el siglo XIII, pero estudios recientes plantean que pudo ser el alminar de una mezquita anterior."},{"h":"Qué ver","t":"La torre, de planta octogonal y 46 metros, son en realidad dos torres, una dentro de otra, con la escalera girando entre ambas. Su ladrillo forma arcos mixtilíneos, ventanas geminadas, mallas de cruces y motivos en escritura cúfica. Desde arriba se ven el valle del Ebro, las Bardenas, el Moncayo y el Pirineo.\n\nDentro, una nave gótica con capillas entre contrafuertes lleva al retablo mayor, de 1520, obra de Gil Morlanes el Joven con Juan de Salas y Gabriel Joly. La iglesia alberga además un museo de arte sacro."}],"en":[{"h":"History","t":"Tauste, Tawst in the days of al-Andalus, was an important Muslim town in the taifa of Zaragoza. Alfonso I conquered it in the 12th century and a sizeable Mudéjar community went on living there. The church was begun in the first third of the 13th century and finished in the 14th, with alterations between the 16th and 18th centuries. It was built in brick, unlike the stone churches in the north of the district.\n\nThe tower has traditionally been dated to the 13th century, but recent studies suggest it may have been the minaret of an earlier mosque."},{"h":"What to see","t":"The tower, octagonal and 46 metres high, is really two towers, one inside the other, with the staircase winding between them. Its brickwork forms mixtilinear arches, paired windows, lattices of crosses and motifs in Kufic script. From the top you can see the Ebro valley, the Bardenas, the Moncayo and the Pyrenees.\n\nInside, a Gothic nave with chapels between the buttresses leads to the high altarpiece of 1520, by Gil Morlanes the Younger with Juan de Salas and Gabriel Joly. The church also houses a museum of sacred art."}],"fr":[{"h":"Histoire","t":"Tauste, Tawst à l'époque d'al-Andalus, fut une importante localité musulmane de la taïfa de Saragosse. Alphonse Ier la conquit au XIIe siècle et une communauté mudéjare notable continua d'y vivre. L'église fut commencée dans le premier tiers du XIIIe siècle et achevée au XIVe, avec des remaniements entre le XVIe et le XVIIIe siècle. Elle fut bâtie en brique, contrairement aux églises de pierre du nord de la comarca.\n\nLa tour a traditionnellement été datée du XIIIe siècle, mais des études récentes suggèrent qu'elle aurait pu être le minaret d'une mosquée antérieure."},{"h":"À voir","t":"La tour, octogonale et haute de 46 mètres, se compose en réalité de deux tours, l'une dans l'autre, avec l'escalier qui tourne entre les deux. Sa brique dessine des arcs mixtilignes, des fenêtres géminées, des réseaux de croix et des motifs en écriture coufique. Du sommet, on voit la vallée de l'Èbre, les Bardenas, le Moncayo et les Pyrénées.\n\nÀ l'intérieur, une nef gothique avec des chapelles entre les contreforts mène au grand retable de 1520, œuvre de Gil Morlanes le Jeune avec Juan de Salas et Gabriel Joly. L'église abrite aussi un musée d'art sacré."}],"de":[{"h":"Geschichte","t":"Tauste, in andalusischer Zeit Tawst, war ein wichtiger muslimischer Ort der Taifa von Zaragoza. Alfons I. eroberte es im 12. Jahrhundert, und eine bedeutende Mudéjar-Gemeinde lebte weiter hier. Die Kirche wurde im ersten Drittel des 13. Jahrhunderts begonnen und im 14. vollendet, mit Umbauten zwischen dem 16. und 18. Jahrhundert. Gebaut ist sie aus Backstein, anders als die Steinkirchen im Norden der Comarca.\n\nDer Turm wurde traditionell ins 13. Jahrhundert datiert, doch neuere Studien halten es für möglich, dass er das Minarett einer älteren Moschee war."},{"h":"Sehenswert","t":"Der achteckige, 46 Meter hohe Turm besteht eigentlich aus zwei Türmen, einer im anderen, mit einer Treppe, die sich dazwischen emporwindet. Sein Backstein bildet Vielpassbögen, Zwillingsfenster, Kreuzgitter und Motive in kufischer Schrift. Von oben sieht man das Ebrotal, die Bardenas, den Moncayo und die Pyrenäen.\n\nInnen führt ein gotisches Schiff mit Kapellen zwischen den Strebepfeilern zum Hochaltar von 1520, einem Werk von Gil Morlanes dem Jüngeren mit Juan de Salas und Gabriel Joly. Die Kirche beherbergt außerdem ein Museum für sakrale Kunst."}],"pt":[{"h":"História","t":"Tauste, Tawst na época do al-Andalus, foi uma povoação muçulmana importante da taifa de Saragoça. Afonso I conquistou-a no século XII e nela continuou a viver uma comunidade mudéjar notável. A igreja começou-se no primeiro terço do século XIII e terminou-se no XIV, com reformas entre os séculos XVI e XVIII. Foi feita em tijolo, ao contrário das igrejas de pedra do norte da comarca.\n\nA torre foi tradicionalmente datada do século XIII, mas estudos recentes admitem que possa ter sido o minarete de uma mesquita anterior."},{"h":"O que ver","t":"A torre, octogonal e com 46 metros, são na verdade duas torres, uma dentro da outra, com a escada a girar entre ambas. O tijolo forma arcos mistilíneos, janelas geminadas, malhas de cruzes e motivos em escrita cúfica. Do alto veem-se o vale do Ebro, as Bardenas, o Moncayo e os Pirenéus.\n\nNo interior, uma nave gótica com capelas entre os contrafortes conduz ao retábulo-mor de 1520, obra de Gil Morlanes, o Jovem, com Juan de Salas e Gabriel Joly. A igreja alberga também um museu de arte sacra."}]},"status":"pending"},{"id":"despoblados-luna","town":"Luna","cat":"patrimonio","lat":42.23106,"lon":-0.90957,"coord_src":null,"q":["Hispaniés, Luna","Júnez, Luna","Lacasta, Luna"],"fq":["Lacasta Luna Zaragoza","Júnez despoblado","Hispaniés"],"name":{"es":"Despoblados de Hispaniés, Júnez y Lacasta","en":"Abandoned villages of Hispaniés, Júnez and Lacasta","fr":"Villages abandonnés d'Hispaniés, Júnez et Lacasta","de":"Wüstungen Hispaniés, Júnez und Lacasta","pt":"Aldeias abandonadas de Hispaniés, Júnez e Lacasta"},"when":{"es":"Siglo XI · Pueblos de frontera abandonados","en":"11th century · Abandoned frontier villages","fr":"XIe siècle · Villages frontaliers abandonnés","de":"11. Jahrhundert · Verlassene Grenzdörfer","pt":"Século XI · Aldeias de fronteira abandonadas"},"desc":{"es":"En el término de Luna quedan los restos de tres antiguos pueblos de la repoblación medieval, abandonados en la Edad Moderna. Hoy son ruinas en mitad del campo.","en":"In the Luna municipality lie the remains of three old villages from the medieval resettlement, abandoned in the early modern period. Today they are ruins out in the countryside.","fr":"Sur la commune de Luna subsistent les vestiges de trois anciens villages de la repopulation médiévale, abandonnés à l'époque moderne. Ce sont aujourd'hui des ruines en pleine campagne.","de":"Im Gemeindegebiet von Luna liegen die Reste dreier Dörfer aus der mittelalterlichen Wiederbesiedlung, die in der Neuzeit verlassen wurden. Heute sind es Ruinen mitten auf dem Land.","pt":"No concelho de Luna restam os vestígios de três antigas aldeias do repovoamento medieval, abandonadas na Idade Moderna. Hoje são ruínas no meio do campo."},"visit":{"es":"Están repartidos por el término de Luna y se llega por caminos rurales: pide indicaciones en Luna o en la oficina de turismo comarcal antes de ir. Son ruinas, así que no entres en construcciones inestables.","en":"They are spread across the Luna municipality and reached by farm tracks: ask for directions in Luna or at the district tourist office before setting out. They are ruins, so do not go into unstable structures.","fr":"Ils sont dispersés sur la commune de Luna et accessibles par des chemins ruraux : demandez votre route à Luna ou à l'office de tourisme de la comarca avant de partir. Ce sont des ruines, n'entrez pas dans les constructions instables.","de":"Sie liegen verstreut im Gemeindegebiet von Luna und sind über Feldwege erreichbar: Fragen Sie vorher in Luna oder beim Fremdenverkehrsamt der Comarca nach dem Weg. Es sind Ruinen, betreten Sie keine einsturzgefährdeten Gebäude.","pt":"Estão espalhadas pelo concelho de Luna e chega-se por caminhos rurais: peça indicações em Luna ou no posto de turismo da comarca antes de ir. São ruínas, por isso não entre em construções instáveis."},"src":"https://turismocincovillas.com/comarca-cinco-villas/despoblados-de-hispanies-junez-y-lacasta/","sources":["https://turismocincovillas.com/comarca-cinco-villas/despoblados-de-hispanies-junez-y-lacasta/","https://es.wikipedia.org/wiki/Luna_(Zaragoza)"],"art":{"es":[{"h":"Historia","t":"Estos núcleos formaron parte de la avanzadilla cristiana del siglo XI: unos se fundaron entonces y otros se repoblaron. Aparecen en documentos aragoneses medievales desde el siglo X y en tiempos del rey Sancho Ramírez, y tuvieron un papel en la repoblación del territorio. Siempre tuvieron pocos vecinos y se vaciaron del todo en la Edad Moderna.\n\nDe los pequeños núcleos del entorno de Luna, hoy solo Lacorvilla sigue habitado. Júnez llegó a dar nombre al municipio: en el censo de 1842 figuraba como «Luna y Júmez»."},{"h":"Para entenderlo","t":"Luna fue tierra de frontera y de repoblación. Para asegurar lo conquistado se asentaron pequeñas comunidades alrededor de una iglesia o una torre. Muchas no llegaron a crecer y acabaron abandonadas; sus restos, desafiando el paso del tiempo, cuentan lo frágil que fue aquel poblamiento.\n\nEn el propio pueblo de Luna puedes completar la visita con el molino de viento de piedra de sillería, de 8 metros de altura, cuyo redescubrimiento en 1977 impulsó el estudio de los molinos en Aragón, y con el santuario de Monlora."}],"en":[{"h":"History","t":"These settlements were part of the Christian vanguard of the 11th century: some were founded then and others resettled. They appear in medieval Aragonese documents from the 10th century and in the time of King Sancho Ramírez, and they played a part in resettling the territory. They always had few inhabitants and were completely emptied in the early modern period.\n\nOf the small settlements around Luna, only Lacorvilla is still inhabited today. Júnez once gave its name to the municipality: in the 1842 census it appeared as \"Luna y Júmez\"."},{"h":"Understanding it","t":"Luna was frontier and resettlement land. To secure what had been conquered, small communities were settled around a church or a tower. Many never grew and were eventually abandoned; their remains, defying the passage of time, show how fragile that settlement was.\n\nIn Luna itself you can round off the visit with the windmill built of dressed stone, 8 metres high, whose rediscovery in 1977 spurred the study of windmills in Aragon, and with the sanctuary of Monlora."}],"fr":[{"h":"Histoire","t":"Ces localités faisaient partie de l'avant-garde chrétienne du XIe siècle : certaines furent fondées à cette époque, d'autres repeuplées. Elles figurent dans des documents aragonais médiévaux dès le Xe siècle et à l'époque du roi Sanche Ramírez, et jouèrent un rôle dans la repopulation du territoire. Toujours peu peuplées, elles se vidèrent complètement à l'époque moderne.\n\nDes petits noyaux des environs de Luna, seul Lacorvilla est encore habité. Júnez donna même son nom à la commune : au recensement de 1842, elle figurait comme « Luna y Júmez »."},{"h":"Pour comprendre","t":"Luna fut une terre de frontière et de repopulation. Pour tenir les terres conquises, on installa de petites communautés autour d'une église ou d'une tour. Beaucoup ne grandirent jamais et finirent abandonnées ; leurs vestiges, qui défient le temps, racontent la fragilité de ce peuplement.\n\nÀ Luna même, vous pouvez compléter la visite par le moulin à vent en pierre de taille, haut de 8 mètres, dont la redécouverte en 1977 relança l'étude des moulins en Aragon, et par le sanctuaire de Monlora."}],"de":[{"h":"Geschichte","t":"Diese Siedlungen gehörten zur christlichen Vorhut des 11. Jahrhunderts: Einige wurden damals gegründet, andere neu besiedelt. Sie erscheinen in mittelalterlichen aragonesischen Urkunden seit dem 10. Jahrhundert und zur Zeit König Sancho Ramírez' und spielten eine Rolle bei der Wiederbesiedlung. Sie hatten stets wenige Bewohner und leerten sich in der Neuzeit vollständig.\n\nVon den kleinen Orten rund um Luna ist heute nur noch Lacorvilla bewohnt. Júnez gab sogar der Gemeinde ihren Namen: Im Zensus von 1842 hieß sie „Luna y Júmez“."},{"h":"Zum Verständnis","t":"Luna war Grenz- und Wiederbesiedlungsland. Um Eroberungen zu sichern, siedelte man kleine Gemeinschaften rund um eine Kirche oder einen Turm an. Viele wuchsen nie und wurden schließlich aufgegeben; ihre Reste, die der Zeit trotzen, erzählen, wie zerbrechlich diese Besiedlung war.\n\nIn Luna selbst können Sie den Besuch mit der 8 Meter hohen Windmühle aus Quadersteinen abrunden, deren Wiederentdeckung 1977 die Erforschung der Windmühlen in Aragonien anstieß, und mit dem Heiligtum von Monlora."}],"pt":[{"h":"História","t":"Estes núcleos fizeram parte da vanguarda cristã do século XI: uns foram fundados então e outros repovoados. Aparecem em documentos aragoneses medievais desde o século X e no tempo do rei Sancho Ramírez, e tiveram um papel no repovoamento do território. Sempre tiveram poucos habitantes e esvaziaram-se por completo na Idade Moderna.\n\nDos pequenos núcleos em redor de Luna, hoje só Lacorvilla continua habitado. Júnez chegou a dar nome ao concelho: no recenseamento de 1842 figurava como «Luna y Júmez»."},{"h":"Para perceber","t":"Luna foi terra de fronteira e de repovoamento. Para segurar o território conquistado, instalaram-se pequenas comunidades em torno de uma igreja ou de uma torre. Muitas nunca chegaram a crescer e acabaram abandonadas; os seus restos, desafiando o passar do tempo, mostram como foi frágil esse povoamento.\n\nNa própria vila de Luna pode completar a visita com o moinho de vento de cantaria, com 8 metros de altura, cuja redescoberta em 1977 impulsionou o estudo dos moinhos em Aragão, e com o santuário de Monlora."}]},"status":"pending"},{"id":"ermita-san-anton-pintano","town":"Los Pintanos","cat":"museo","lat":42.5264,"lon":-1.0186,"coord_src":null,"q":["Ermita de San Antón, Pintano","Centro de Interpretación de Arqueología, Pintano"],"fq":["Pintano ermita San Antón","Pintano","Los Pintanos"],"name":{"es":"Ermita de San Antón: Centro de Interpretación de Arqueología","en":"Ermita de San Antón: Archaeology Interpretation Centre","fr":"Ermita de San Antón : Centre d'interprétation de l'archéologie","de":"Ermita de San Antón: Archäologisches Interpretationszentrum","pt":"Ermita de San Antón: Centro de Interpretação de Arqueologia"},"when":{"es":"Abierto en 2007 · Arqueología prerromana","en":"Opened in 2007 · Pre-Roman archaeology","fr":"Ouvert en 2007 · Archéologie préromaine","de":"Eröffnet 2007 · Vorrömische Archäologie","pt":"Aberto em 2007 · Arqueologia pré-romana"},"desc":{"es":"En el centro de Pintano, una sencilla ermita que perteneció al monasterio de San Juan de la Peña acoge un centro sobre la arqueología de las Cinco Villas, nacido tras excavar una necrópolis celtibérica cercana.","en":"In the centre of Pintano, a simple hermitage that once belonged to the monastery of San Juan de la Peña houses a centre on the archaeology of the Cinco Villas, created after a nearby Celtiberian cemetery was excavated.","fr":"Au centre de Pintano, un modeste ermitage qui appartint au monastère de San Juan de la Peña abrite un centre consacré à l'archéologie des Cinco Villas, créé après la fouille d'une nécropole celtibère voisine.","de":"Mitten in Pintano beherbergt eine schlichte Einsiedelei, die einst dem Kloster San Juan de la Peña gehörte, ein Zentrum zur Archäologie der Cinco Villas, entstanden nach der Ausgrabung eines nahen keltiberischen Gräberfelds.","pt":"No centro de Pintano, uma ermida simples que pertenceu ao mosteiro de San Juan de la Peña acolhe um centro sobre a arqueologia das Cinco Villas, criado depois da escavação de uma necrópole celtibérica próxima."},"visit":{"es":"La visita es gratuita y se concierta con el Hostal Villa de Pintano, que se encarga del edificio: avisa antes de ir. Calcula entre 30 y 45 minutos.","en":"Entry is free and is arranged through the Hostal Villa de Pintano, which looks after the building: let them know before you go. Allow 30 to 45 minutes.","fr":"La visite est gratuite et s'organise auprès de l'Hostal Villa de Pintano, qui entretient le bâtiment : prévenez avant de venir. Comptez de 30 à 45 minutes.","de":"Der Eintritt ist frei; der Besuch wird über das Hostal Villa de Pintano vereinbart, das sich um das Gebäude kümmert: vorher Bescheid geben. 30 bis 45 Minuten einplanen.","pt":"A visita é gratuita e combina-se com o Hostal Villa de Pintano, que cuida do edifício: avise antes de ir. Conte com 30 a 45 minutos."},"src":"https://turismocincovillas.com/wp-content/uploads/2024/05/Los-pintanos_Ermita-de-San-Anton.pdf","sources":["https://turismocincovillas.com/wp-content/uploads/2024/05/Los-pintanos_Ermita-de-San-Anton.pdf"],"art":{"es":[{"h":"Historia","t":"La ermita de San Antón perteneció en su día al monasterio de San Juan de la Peña. El ayuntamiento la rehabilitó al mismo tiempo que se excavaba en la zona una necrópolis celtibérica del siglo VI a. C. Aquel hallazgo animó a abrir aquí, en 2007, un centro para dar a conocer los yacimientos arqueológicos del entorno."},{"h":"Qué ver","t":"Paneles, mapas y un audiovisual explican la prehistoria y la protohistoria de las Cinco Villas. Hay reproducciones de piezas representativas: vasos campaniformes, objetos del Neolítico final y del Bronce de Lobera, la estela de Luna y la reconstrucción de una tumba de la necrópolis celtibérica con su estela funeraria.\n\nTambién se presentan hallazgos de necrópolis de la Edad del Hierro de Sigüés, Artieda, Urriés y Undués de Lerda. Al salir, Pintano tiene la iglesia de Nuestra Señora de la Purificación y otras cuatro ermitas en los alrededores.\n\nLa visita encaja con la de la necrópolis de Lobera de Onsella y la de Los Bañales, para seguir el hilo del poblamiento desde la prehistoria hasta la época romana y medieval."}],"en":[{"h":"History","t":"The hermitage of San Antón once belonged to the monastery of San Juan de la Peña. The town council restored it at the same time as a Celtiberian cemetery from the 6th century BC was being excavated in the area. That find led to the opening here, in 2007, of a centre to present the archaeological sites of the surrounding area."},{"h":"What to see","t":"Panels, maps and an audiovisual explain the prehistory and protohistory of the Cinco Villas. There are replicas of key pieces: Bell Beaker vessels, objects from the Late Neolithic and the Bronze Age at Lobera, the Luna stele and a reconstruction of a tomb from the Celtiberian cemetery with its funerary stele.\n\nFinds from Iron Age cemeteries at Sigüés, Artieda, Urriés and Undués de Lerda are also shown. Back outside, Pintano has the Church of Nuestra Señora de la Purificación and four more hermitages nearby.\n\nThe visit fits well with the medieval cemetery of Lobera de Onsella and with Los Bañales, following the thread of settlement from prehistory to Roman and medieval times."}],"fr":[{"h":"Histoire","t":"L'ermitage de San Antón appartint autrefois au monastère de San Juan de la Peña. La commune le restaura au moment où l'on fouillait dans les environs une nécropole celtibère du VIe siècle av. J.-C. Cette découverte conduisit à ouvrir ici, en 2007, un centre pour faire connaître les sites archéologiques des alentours."},{"h":"À voir","t":"Panneaux, cartes et un audiovisuel présentent la préhistoire et la protohistoire des Cinco Villas. On y voit des reproductions de pièces représentatives : vases campaniformes, objets du Néolithique final et de l'âge du Bronze de Lobera, la stèle de Luna et la reconstitution d'une tombe de la nécropole celtibère avec sa stèle funéraire.\n\nDes trouvailles de nécropoles de l'âge du Fer de Sigüés, Artieda, Urriés et Undués de Lerda sont aussi présentées. En sortant, Pintano compte l'église Nuestra Señora de la Purificación et quatre autres ermitages aux alentours.\n\nLa visite se combine bien avec la nécropole médiévale de Lobera de Onsella et avec Los Bañales, pour suivre le fil du peuplement de la préhistoire à l'époque romaine et médiévale."}],"de":[{"h":"Geschichte","t":"Die Einsiedelei San Antón gehörte einst dem Kloster San Juan de la Peña. Die Gemeinde restaurierte sie zur selben Zeit, als in der Umgebung ein keltiberisches Gräberfeld aus dem 6. Jahrhundert v. Chr. ausgegraben wurde. Dieser Fund gab den Anstoß, hier 2007 ein Zentrum zu eröffnen, das die archäologischen Stätten der Umgebung vorstellt."},{"h":"Sehenswert","t":"Tafeln, Karten und ein Film erklären Vor- und Frühgeschichte der Cinco Villas. Zu sehen sind Nachbildungen wichtiger Stücke: Glockenbecher, Objekte aus dem Spätneolithikum und der Bronzezeit von Lobera, die Stele von Luna und die Rekonstruktion eines Grabes aus dem keltiberischen Gräberfeld mit seiner Grabstele.\n\nAuch Funde aus eisenzeitlichen Gräberfeldern von Sigüés, Artieda, Urriés und Undués de Lerda werden gezeigt. Draußen hat Pintano die Kirche Nuestra Señora de la Purificación und vier weitere Einsiedeleien in der Umgebung.\n\nDer Besuch lässt sich gut mit dem mittelalterlichen Gräberfeld von Lobera de Onsella und mit Los Bañales verbinden, um der Besiedlung von der Vorgeschichte bis in römische und mittelalterliche Zeit zu folgen."}],"pt":[{"h":"História","t":"A ermida de San Antón pertenceu em tempos ao mosteiro de San Juan de la Peña. A câmara municipal reabilitou-a ao mesmo tempo que se escavava na zona uma necrópole celtibérica do século VI a. C. Essa descoberta levou a abrir aqui, em 2007, um centro para dar a conhecer os sítios arqueológicos da região."},{"h":"O que ver","t":"Painéis, mapas e um audiovisual explicam a pré-história e a proto-história das Cinco Villas. Há réplicas de peças representativas: vasos campaniformes, objetos do Neolítico final e da Idade do Bronze de Lobera, a estela de Luna e a reconstituição de um túmulo da necrópole celtibérica com a sua estela funerária.\n\nTambém se apresentam achados de necrópoles da Idade do Ferro de Sigüés, Artieda, Urriés e Undués de Lerda. À saída, Pintano tem a igreja de Nuestra Señora de la Purificación e mais quatro ermidas nos arredores.\n\nA visita combina bem com a necrópole medieval de Lobera de Onsella e com Los Bañales, para seguir o fio do povoamento desde a pré-história até à época romana e medieval."}]},"status":"pending"},{"id":"necropolis-lobera","town":"Lobera de Onsella","cat":"arqueologia","lat":42.4762,"lon":-1.0191,"coord_src":null,"q":["Necrópolis medieval, Lobera de Onsella","Cerro de San Miguel, Lobera de Onsella"],"fq":["Lobera de Onsella","Lobera de Onsella necrópolis"],"name":{"es":"Necrópolis medieval de Lobera de Onsella","en":"Medieval cemetery of Lobera de Onsella","fr":"Nécropole médiévale de Lobera de Onsella","de":"Mittelalterliches Gräberfeld von Lobera de Onsella","pt":"Necrópole medieval de Lobera de Onsella"},"when":{"es":"Siglos X–XI · Hallazgo de 2014","en":"10th–11th centuries · Found in 2014","fr":"Xe–XIe siècles · Découverte en 2014","de":"10.–11. Jahrhundert · Entdeckt 2014","pt":"Séculos X–XI · Descoberta em 2014"},"desc":{"es":"En 2014, unas obras en una finca del cerro de San Miguel sacaron a la luz varias tumbas con restos humanos. Es una necrópolis de finales del siglo X y del XI, ligada probablemente a una iglesia desaparecida.","en":"In 2014, work on a plot on the hill of San Miguel uncovered several graves with human remains. It is a cemetery from the late 10th and the 11th centuries, probably linked to a lost church.","fr":"En 2014, des travaux sur un terrain de la colline de San Miguel ont mis au jour plusieurs tombes avec des restes humains. C'est une nécropole de la fin du Xe et du XIe siècle, probablement liée à une église disparue.","de":"2014 kamen bei Arbeiten auf einem Grundstück am Hügel San Miguel mehrere Gräber mit menschlichen Überresten zum Vorschein. Es ist ein Gräberfeld vom Ende des 10. und aus dem 11. Jahrhundert, wohl zu einer verschwundenen Kirche gehörig.","pt":"Em 2014, obras num terreno do cerro de San Miguel puseram a descoberto várias sepulturas com restos humanos. É uma necrópole do final do século X e do XI, provavelmente ligada a uma igreja desaparecida."},"visit":{"es":"Es un yacimiento en estudio: antes de ir, pregunta en el ayuntamiento o en la oficina de turismo comarcal si se puede visitar y cómo llegar. En el pueblo, el mirador junto a la iglesia y el callejón de Piquera se ven por libre en una hora.","en":"It is a site still under study: before you go, ask the town hall or the district tourist office whether it can be visited and how to get there. In the village, the viewpoint by the church and the Callejón de Piquera can be seen freely in an hour.","fr":"Le site est encore à l'étude : avant de venir, demandez à la mairie ou à l'office de tourisme de la comarca s'il se visite et comment y accéder. Dans le village, le belvédère près de l'église et le Callejón de Piquera se découvrent librement en une heure.","de":"Die Stätte wird noch erforscht: Fragen Sie vorher im Rathaus oder beim Fremdenverkehrsamt der Comarca, ob sie besichtigt werden kann und wie man hinkommt. Im Dorf lassen sich der Aussichtspunkt an der Kirche und der Callejón de Piquera in einer Stunde frei erkunden.","pt":"É um sítio ainda em estudo: antes de ir, pergunte na câmara municipal ou no posto de turismo da comarca se pode ser visitado e como chegar. Na povoação, o miradouro junto à igreja e o Callejón de Piquera veem-se livremente numa hora."},"src":"https://turismocincovillas.com/wp-content/uploads/2024/05/Necropolis-Medieval_Lobera-de-Onsella.pdf","sources":["https://turismocincovillas.com/wp-content/uploads/2024/05/Necropolis-Medieval_Lobera-de-Onsella.pdf","https://turismocincovillas.com/wp-content/uploads/2024/05/Mirador_Lobera-de-Onsella.pdf","https://turismocincovillas.com/?p=9203"],"art":{"es":[{"h":"Historia","t":"El hallazgo fue casual: un vecino que nivelaba una finca encontró las primeras sepulturas. Las excavaciones, dirigidas por José Ignacio Lorenzo, permitieron un estudio antropológico de los restos. La necrópolis se fecha a finales del siglo X y siguió en uso en el XI; por el tipo de enterramiento podría ser anterior a la de Corral de Calvo, en la vecina Luesia, fechada hacia 1027.\n\nLas necrópolis medievales solían formarse junto a una iglesia con derecho de enterramiento. Aquí el topónimo recuerda una iglesia de San Miguel perdida, que se espera localizar en futuras campañas."},{"h":"Qué ver","t":"Lobera se asoma al valle del Onsella, con la sierra de Santo Domingo al fondo. Desde la terraza de la iglesia, en lo más alto, hay una buena vista del valle. El callejón de Piquera mide unos 43 metros y en su punto más estrecho apenas 29 centímetros: los vecinos dicen que es la calle más estrecha del mundo.\n\nEl nombre medieval, Lupera, se relaciona con los lobos, y Onsella con los osos que vivían en la zona. Cada noche de San Juan el pueblo mantiene el rito de los herniados, recuperado en 2004."}],"en":[{"h":"History","t":"The find was by chance: a local resident levelling a plot came across the first graves. Excavations led by José Ignacio Lorenzo made an anthropological study of the remains possible. The cemetery dates from the late 10th century and remained in use in the 11th; judging by the type of burial it may be older than the one at Corral de Calvo, in neighbouring Luesia, dated to around 1027.\n\nMedieval cemeteries usually grew up beside a church with burial rights. Here the place name recalls a lost church of San Miguel, which it is hoped will be located in future digs."},{"h":"What to see","t":"Lobera looks out over the Onsella valley, with the Sierra de Santo Domingo behind. From the church terrace, at the highest point, there is a good view of the valley. The Callejón de Piquera is about 43 metres long and at its narrowest barely 29 centimetres wide: locals say it is the narrowest street in the world.\n\nThe medieval name, Lupera, is linked to wolves, and Onsella to the bears that lived in the area. Every Midsummer's Eve the village keeps up the rite of the herniated children, revived in 2004."}],"fr":[{"h":"Histoire","t":"La découverte fut fortuite : un habitant qui nivelait un terrain tomba sur les premières sépultures. Les fouilles, dirigées par José Ignacio Lorenzo, ont permis une étude anthropologique des restes. La nécropole date de la fin du Xe siècle et resta en usage au XIe ; d'après le type d'inhumation, elle pourrait être antérieure à celle de Corral de Calvo, dans la commune voisine de Luesia, datée vers 1027.\n\nLes nécropoles médiévales se formaient généralement près d'une église dotée du droit d'inhumation. Ici, le toponyme rappelle une église San Miguel disparue, que l'on espère retrouver lors de prochaines campagnes."},{"h":"À voir","t":"Lobera domine la vallée de l'Onsella, avec la Sierra de Santo Domingo en arrière-plan. Depuis la terrasse de l'église, au point le plus haut, la vue sur la vallée est belle. Le Callejón de Piquera mesure environ 43 mètres de long et, à son point le plus étroit, à peine 29 centimètres : les habitants disent que c'est la rue la plus étroite du monde.\n\nLe nom médiéval, Lupera, évoque les loups, et Onsella les ours qui vivaient dans la région. Chaque nuit de la Saint-Jean, le village perpétue le rite des enfants herniés, relancé en 2004."}],"de":[{"h":"Geschichte","t":"Der Fund war ein Zufall: Ein Einwohner, der ein Grundstück einebnete, stieß auf die ersten Gräber. Die Ausgrabungen unter der Leitung von José Ignacio Lorenzo ermöglichten eine anthropologische Untersuchung der Überreste. Das Gräberfeld stammt vom Ende des 10. Jahrhunderts und war noch im 11. in Gebrauch; nach der Bestattungsart könnte es älter sein als das von Corral de Calvo im benachbarten Luesia, das um 1027 datiert wird.\n\nMittelalterliche Gräberfelder entstanden meist an einer Kirche mit Begräbnisrecht. Hier erinnert der Flurname an eine verschwundene Kirche San Miguel, die man bei künftigen Grabungen zu finden hofft."},{"h":"Sehenswert","t":"Lobera blickt auf das Tal des Onsella, im Hintergrund die Sierra de Santo Domingo. Von der Terrasse der Kirche am höchsten Punkt hat man einen guten Blick über das Tal. Der Callejón de Piquera ist etwa 43 Meter lang und an der engsten Stelle kaum 29 Zentimeter breit: Die Einheimischen sagen, es sei die schmalste Gasse der Welt.\n\nDer mittelalterliche Name Lupera wird mit Wölfen in Verbindung gebracht, Onsella mit den Bären, die hier lebten. In jeder Johannisnacht pflegt das Dorf den Ritus der Bruchkranken, der 2004 wiederbelebt wurde."}],"pt":[{"h":"História","t":"A descoberta foi casual: um habitante que nivelava um terreno encontrou as primeiras sepulturas. As escavações, dirigidas por José Ignacio Lorenzo, permitiram um estudo antropológico dos restos. A necrópole data do final do século X e continuou em uso no XI; pelo tipo de enterramento, poderá ser anterior à de Corral de Calvo, na vizinha Luesia, datada de cerca de 1027.\n\nAs necrópoles medievais formavam-se habitualmente junto a uma igreja com direito de sepultura. Aqui, o topónimo recorda uma igreja de San Miguel perdida, que se espera localizar em futuras campanhas."},{"h":"O que ver","t":"Lobera debruça-se sobre o vale do Onsella, com a Sierra de Santo Domingo ao fundo. Do terraço da igreja, no ponto mais alto, há uma boa vista do vale. O Callejón de Piquera mede cerca de 43 metros e, no ponto mais estreito, mal chega a 29 centímetros: os habitantes dizem que é a rua mais estreita do mundo.\n\nO nome medieval, Lupera, relaciona-se com os lobos, e Onsella com os ursos que viviam na zona. Em cada noite de São João a aldeia mantém o rito dos herniados, recuperado em 2004."}]},"status":"pending"},{"id":"san-nicolas-el-frago","town":"El Frago","cat":"patrimonio","lat":42.27253,"lon":-0.93126,"coord_src":"https://castillosenaragon.es/wp-content/uploads/2019/04/CV.-6.-FICHA-EL-FRAGO-iglesia.pdf","q":["Iglesia de San Nicolás de Bari, El Frago","El Frago iglesia"],"fq":["Iglesia de San Nicolás de Bari El Frago","El Frago iglesia portada","El Frago"],"name":{"es":"Iglesia de San Nicolás de Bari","en":"Church of San Nicolás de Bari","fr":"Église San Nicolás de Bari","de":"Kirche San Nicolás de Bari","pt":"Igreja de San Nicolás de Bari"},"when":{"es":"Románico, finales del siglo XII · Iglesia fortificada","en":"Romanesque, late 12th century · Fortified church","fr":"Roman, fin du XIIe siècle · Église fortifiée","de":"Romanik, spätes 12. Jahrhundert · Wehrkirche","pt":"Românico, final do século XII · Igreja fortificada"},"desc":{"es":"En lo alto de El Frago, la iglesia de San Nicolás de Bari tiene aspecto de fortaleza. Su portada sur muestra la Adoración de los Reyes Magos y un calendario con las labores del campo.","en":"At the top of El Frago, the Church of San Nicolás de Bari looks like a fortress. Its south doorway shows the Adoration of the Magi and a calendar of farm work.","fr":"Au sommet d'El Frago, l'église San Nicolás de Bari a l'allure d'une forteresse. Son portail sud montre l'Adoration des Mages et un calendrier des travaux des champs.","de":"Hoch über El Frago wirkt die Kirche San Nicolás de Bari wie eine Festung. Ihr Südportal zeigt die Anbetung der Könige und einen Kalender mit den Arbeiten auf dem Feld.","pt":"No alto de El Frago, a igreja de San Nicolás de Bari tem aspeto de fortaleza. O seu portal sul mostra a Adoração dos Reis Magos e um calendário com os trabalhos do campo."},"visit":{"es":"Las portadas se ven libremente desde fuera. Para el interior, pregunta en el ayuntamiento o en la oficina de turismo comarcal. Calcula media hora, más un paseo por el pueblo.","en":"The doorways can be seen freely from outside. For the interior, ask at the town hall or the district tourist office. Allow half an hour, plus a stroll round the village.","fr":"Les portails se voient librement de l'extérieur. Pour l'intérieur, renseignez-vous à la mairie ou à l'office de tourisme de la comarca. Comptez une demi-heure, plus une promenade dans le village.","de":"Die Portale sind von außen frei zu sehen. Für das Innere im Rathaus oder beim Fremdenverkehrsamt der Comarca fragen. Eine halbe Stunde plus einen Bummel durchs Dorf einplanen.","pt":"Os portais veem-se livremente do exterior. Para o interior, pergunte na câmara municipal ou no posto de turismo da comarca. Conte com meia hora, mais um passeio pela aldeia."},"src":"https://turismocincovillas.com/wp-content/uploads/2024/05/El-Frago_Iglesia-de-San-Nicolas-de-Bari.pdf","sources":["https://turismocincovillas.com/wp-content/uploads/2024/05/El-Frago_Iglesia-de-San-Nicolas-de-Bari.pdf","https://castillosenaragon.es/wp-content/uploads/2019/04/CV.-6.-FICHA-EL-FRAGO-iglesia.pdf"],"art":{"es":[{"h":"Historia","t":"Se levantó sobre un cerro, en la margen izquierda del Arba de Biel, en una zona que fue frontera del reino de Aragón frente a la taifa de Zaragoza. Por eso es el edificio más voluminoso del pueblo y se fortificó, con un remate corrido de saeteras. Es románica, de sillería, con una sola nave cubierta con bóveda de medio cañón y ábside semicircular. En el siglo XVI se añadieron la torre y dos capillas con bóveda estrellada.\n\nSegún la tradición, Alfonso I el Batallador dio nombre al pueblo por lo accidentado del terreno, en las estribaciones del Prepirineo: el punto más alto del término es el pico del Fragal, de 852 metros."},{"h":"Qué ver","t":"Las dos portadas se atribuyen al Maestro de Agüero, escultor de finales del siglo XII. En la meridional, el tímpano muestra la Adoración de los Reyes Magos, y junto a ella aparece un calendario románico con los trabajos del campo de los doce meses: intenta reconocer cada mes por su tarea.\n\nDentro hay un retablo de la Virgen del Rosario del siglo XVI, atribuido a Juan de Anchieta, y en la cripta una talla gótica del Santo Cristo."}],"en":[{"h":"History","t":"It was built on a hill on the left bank of the Arba de Biel, in an area that was the frontier of the Kingdom of Aragon against the taifa of Zaragoza. That is why it is the bulkiest building in the village and was fortified, with a continuous parapet of arrow slits. It is Romanesque, of ashlar, with a single nave under a barrel vault and a semicircular apse. In the 16th century the tower and two chapels with star vaults were added.\n\nTradition says that Alfonso I the Battler named the village after its rugged terrain, in the foothills of the Pre-Pyrenees: the highest point of the municipality is the Pico del Fragal, at 852 metres."},{"h":"What to see","t":"Both doorways are attributed to the Master of Agüero, a sculptor of the late 12th century. On the southern one, the tympanum shows the Adoration of the Magi, and beside it is a Romanesque calendar with the farm labours of the twelve months: try to recognise each month by its task.\n\nInside there is a 16th-century altarpiece of the Virgen del Rosario, attributed to Juan de Anchieta, and in the crypt a Gothic carving of the Holy Christ."}],"fr":[{"h":"Histoire","t":"Elle fut bâtie sur une colline, sur la rive gauche de l'Arba de Biel, dans une zone qui fut la frontière du royaume d'Aragon face à la taïfa de Saragosse. C'est pourquoi elle est le bâtiment le plus massif du village et fut fortifiée, avec un couronnement continu percé de meurtrières. Romane, en pierre de taille, elle a une seule nef voûtée en berceau et une abside semi-circulaire. Au XVIe siècle, on y ajouta la tour et deux chapelles à voûte étoilée.\n\nSelon la tradition, Alphonse Ier le Batailleur nomma le village d'après son relief accidenté, dans les contreforts des Prépyrénées : le point culminant de la commune est le Pico del Fragal, à 852 mètres."},{"h":"À voir","t":"Les deux portails sont attribués au Maître d'Agüero, sculpteur de la fin du XIIe siècle. Sur le portail méridional, le tympan représente l'Adoration des Mages et, à côté, un calendrier roman montre les travaux agricoles des douze mois : essayez de reconnaître chaque mois à sa tâche.\n\nÀ l'intérieur se trouvent un retable de la Virgen del Rosario du XVIe siècle, attribué à Juan de Anchieta, et, dans la crypte, une sculpture gothique du Saint-Christ."}],"de":[{"h":"Geschichte","t":"Sie wurde auf einem Hügel am linken Ufer des Arba de Biel errichtet, in einem Gebiet, das Grenze des Königreichs Aragonien gegen die Taifa von Zaragoza war. Deshalb ist sie das massigste Gebäude des Dorfes und wurde befestigt, mit einem umlaufenden Abschluss aus Schießscharten. Sie ist romanisch, aus Quadern, mit einem einzigen tonnengewölbten Schiff und halbrunder Apsis. Im 16. Jahrhundert kamen der Turm und zwei Kapellen mit Sterngewölben hinzu.\n\nDer Überlieferung nach benannte Alfons I. der Kämpfer den Ort nach seinem zerklüfteten Gelände in den Ausläufern der Vorpyrenäen: Der höchste Punkt der Gemeinde ist der Pico del Fragal mit 852 Metern."},{"h":"Sehenswert","t":"Beide Portale werden dem Meister von Agüero zugeschrieben, einem Bildhauer des späten 12. Jahrhunderts. Am Südportal zeigt das Tympanon die Anbetung der Könige, daneben ein romanischer Kalender mit den Feldarbeiten der zwölf Monate: Versuchen Sie, jeden Monat an seiner Arbeit zu erkennen.\n\nInnen gibt es einen Altar der Virgen del Rosario aus dem 16. Jahrhundert, der Juan de Anchieta zugeschrieben wird, und in der Krypta eine gotische Christusfigur."}],"pt":[{"h":"História","t":"Foi erguida num cerro, na margem esquerda do Arba de Biel, numa zona que foi fronteira do reino de Aragão frente à taifa de Saragoça. Por isso é o edifício mais volumoso da aldeia e foi fortificada, com um remate contínuo de seteiras. É românica, de cantaria, com uma só nave coberta por abóbada de berço e abside semicircular. No século XVI acrescentaram-se a torre e duas capelas com abóbada estrelada.\n\nSegundo a tradição, Afonso I, o Batalhador, deu nome à aldeia pelo terreno acidentado, nos contrafortes do Pré-Pirenéu: o ponto mais alto do concelho é o Pico del Fragal, com 852 metros."},{"h":"O que ver","t":"Os dois portais atribuem-se ao Mestre de Agüero, escultor do final do século XII. No meridional, o tímpano mostra a Adoração dos Reis Magos e, junto a ele, um calendário românico com os trabalhos agrícolas dos doze meses: tente reconhecer cada mês pela sua tarefa.\n\nNo interior há um retábulo da Virgen del Rosario do século XVI, atribuído a Juan de Anchieta, e, na cripta, uma imagem gótica do Santo Cristo."}]},"status":"pending"}],"towns":[{"name":"Ardisa","lat":42.2009,"lon":-0.7582,"minor":true},{"name":"Asín","lat":42.2837,"lon":-1.0466,"minor":true},{"name":"Bagüés","lat":42.567,"lon":-0.933,"minor":true},{"name":"Biel","lat":42.3869,"lon":-0.9357},{"name":"Biota","lat":42.2613,"lon":-1.1885,"minor":true},{"name":"Castejón de Valdejasa","lat":41.9823,"lon":-0.9941,"minor":true},{"name":"Castiliscar","lat":42.367,"lon":-1.267,"minor":true},{"name":"Ejea de los Caballeros","lat":42.1292,"lon":-1.1372},{"name":"Erla","lat":42.115,"lon":-0.9476,"minor":true},{"name":"El Frago","lat":42.267,"lon":-0.933},{"name":"Isuerre","lat":42.4882,"lon":-1.056,"minor":true},{"name":"Layana","lat":42.2968,"lon":-1.245,"minor":true},{"name":"Lobera de Onsella","lat":42.4787,"lon":-1.0216},{"name":"Longás","lat":42.467,"lon":-0.933,"minor":true},{"name":"Luesia","lat":42.3697,"lon":-1.0232,"minor":true},{"name":"Luna","lat":42.1675,"lon":-0.9326},{"name":"Marracos","lat":42.0907,"lon":-0.7777,"minor":true},{"name":"Navardún","lat":42.517,"lon":-1.15,"minor":true},{"name":"Orés","lat":42.283,"lon":-1.0,"minor":true},{"name":"Las Pedrosas","lat":42.033,"lon":-0.883,"minor":true},{"name":"Piedratajada","lat":42.117,"lon":-0.8,"minor":true},{"name":"Los Pintanos","lat":42.5289 /* ---------- distance ---------- */
function hav(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lon-a.lon);const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}

const TILES={
  mapa:{url:"https://www.ign.es/wmts/ign-base?layer=IGNBaseTodo&style=default&tilematrixset=GoogleMapsCompatible&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/png&TileMatrix={z}&TileCol={x}&TileRow={y}",opt:{maxZoom:18,attribution:'Mapa base © <a href="https://www.ign.es">IGN</a>'}},
  ortofoto:{url:"https://www.ign.es/wmts/pnoa-ma?layer=OI.OrthoimageCoverage&style=default&tilematrixset=GoogleMapsCompatible&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/jpeg&TileMatrix={z}&TileCol={x}&TileRow={y}",opt:{maxZoom:19,attribution:'PNOA © <a href="https://www.ign.es">IGN</a>'}}

let tileLayer=null;
function setBasemap(k,silent){
  state.basemap=k; $$(".layerbox button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.k===k)));
  if(tileLayer){map.removeLayer(tileLayer);tileLayer=null;}
  $("#map").classList.remove("tiles-on");
  if(k==="ilustrado"){map.setMaxZoom(15);return;}
  map.setMaxZoom(18);
  const def=TILES[k]; let ok=0,bad=0,decided=false;
  tileLayer=L.tileLayer(def.url,def.opt);
  tileLayer.on("tileload",()=>{ok++; if(!decided){decided=true;$("#map").classList.add("tiles-on");}});
  tileLayer.on("tileerror",()=>{bad++; if(!decided&&bad>=3&&HASBASE){decided=true;map.removeLayer(tileLayer);tileLayer=null;state.basemap="ilustrado";map.setMaxZoom(15);$("#map").classList.remove("tiles-on");$$(".layerbox button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.k==="ilustrado")));if(!silent) toast(t("tilesBlocked"));}});
  tileLayer.addTo(map); tileLayer.bringToBack();
}

const markers={};
function pinIcon(p){return L.divIcon({className:"",html:`<div class="pin" style="--c:var(${CATS[p.cat].color})">${ICON(p.cat)}</div>`,iconSize:[30,30],iconAnchor:[4,30],popupAnchor:[11,-30]});}
function addMarker(p){
  const m=L.marker([p.lat,p.lon],{keyboard:true,title:L10(p.name),riseOnHover:true,icon:pinIcon(p)});

function pinEl(id){const m=markers[id];return m&&m.getElement()?m.getElement().querySelector(".pin"):null;}
function visible(p){
  if(!state.cats.has(p.cat)) return false;
  if(state.town&&p.town!==state.town) return false;
  if(state.q){const q=norm(state.q);const hay=norm(L10(p.name)+" "+p.town+" "+L10(p.desc)+" "+t("cat_"+p.cat));if(!hay.includes(q)) return false;}
  return true;
}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}
function refreshMarkers(){
  const inRoute=state.route?new Set(DATA.routes.find(r=>r.id===state.route).stops):null;
  POIS.forEach(p=>{const m=markers[p.id];const show=inRoute?inRoute.has(p.id):visible(p);
    if(show&&!map.hasLayer(m)) m.addTo(map); if(!show&&map.hasLayer(m)) map.removeLayer(m);
    const el=pinEl(p.id); if(el) el.classList.toggle("sel",state.sel===p.id);});

/* ---------- route drawing ---------- */
let routeGroup=L.layerGroup().addTo(map);
function drawRoute(r){
  routeGroup.clearLayers(); if(!r) return;
  const pts=r.stops.map(id=>BYID[id]).map(p=>[p.lat,p.lon]);
  const color=`var(${CATS[r.cat].color})`;
  const line=L.polyline(pts,{pane:"routes",className:"route-line",interactive:false});
  routeGroup.addLayer(line);
  setTimeout(()=>{const el=line.getElement();if(el) el.style.setProperty("--c",color);},0);
  r.stops.forEach((id,i)=>{const p=BYID[id];routeGroup.addLayer(L.marker([p.lat,p.lon],{pane:"stops",interactive:false,keyboard:false,icon:L.divIcon({className:"",html:`<div class="stopnum">${i+1}</div>`,iconSize:[0,0]})}));});
  map.flyToBounds(L.latLngBounds(pts),{padding:[50,50],duration:.8,maxZoom:15});
}
function routeStats(r){let km=0;const legs=[];for(let i=1;i<r.stops.length;i++){const d=hav(BYID[r.stops[i-1]],BYID[r.stops[i]])*1.25;legs.push(d);km+=d;}
  const speed={walk:4,bike:14,car:55}[r.mode];const mins=Math.round(km/speed*60+r.stops.length*(r.mode==="car"?35:20));return {km,legs,mins};}
function gmapsRoute(r){const pts=r.stops.map(id=>BYID[id]).map(p=>p.lat+","+p.lon);const mode={walk:"walking",bike:"bicycling",car:"driving"}[r.mode];
  return "https://www.google.com/maps/dir/?api=1&origin="+pts[0]+"&destination="+pts.at(-1)+(pts.length>2?"&waypoints="+encodeURIComponent(pts.slice(1,-1).join("|")):"")+"&travelmode="+mode;}
function fmtDur(m){const h=Math.floor(m/60),mm=m%60;return h?`${h} h${mm?" "+mm+" min":""}`:`${mm} min`;}

function nearList(list){return list.map(p=>({p,d:hav(state.me,p)})).sort((a,b)=>a.d-b.d).map(({p,d})=>rowHTML(p,`${p.town} · ${nf().format(d)} km`)).join("");}
let meMarker=null;
function nearMe(){
  if(state.me){state.me=null;if(meMarker){map.removeLayer(meMarker);meMarker=null;}renderExplore();return;}
  if(!navigator.geolocation){toast(t("locErr"));return;}
  toast(t("locating"));
  try{navigator.geolocation.getCurrentPosition(pos=>{
    state.me={lat:pos.coords.latitude,lon:pos.coords.longitude};
    if(meMarker) map.removeLayer(meMarker);
    const tt=$(".toast");if(tt) tt.hidden=true;
    meMarker=L.marker([state.me.lat,state.me.lon],{interactive:false,keyboard:false,zIndexOffset:1000,title:t("youAreHere"),icon:L.divIcon({className:"",html:'<div class="me-dot"></div>',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(map);

    if(far>40) toast(t("farAway",{n:Math.round(far)})); else map.flyTo([state.me.lat,state.me.lon],13,{duration:.7});
    renderExplore();
  },()=>toast(t("locErr")),{timeout:9000,maximumAge:60000});}catch(e){toast(t("locErr"));}
}

function bestVoice(code){const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];const base=code.slice(0,2);
  const c=vs.filter(v=>(v.lang||"").replace("_","-").toLowerCase().startsWith(base));if(!c.length) return null;
  const score=v=>{const n=v.name||"";let s=0;if(/natural|neural/i.test(n)) s+=50;if(/online/i.test(n)) s+=20;if(/premium|enhanced|mejorada|siri/i.test(n)) s+=30;if(/google/i.test(n)) s+=15;
    if((v.lang||"").replace("_","-").toLowerCase()===code.toLowerCase()) s+=10;if(/compact|espeak/i.test(n)) s-=30;return s;};
  return c.sort((a,b)=>score(b)-score(a))[0];}
function speakTTS(p){
  if(!("speechSynthesis" in window)){toast(t("noAudio"));setPP(false);return;}
  const go=()=>{const code=LANGS.find(l=>l[0]===lang)[2];const v=bestVoice(code);
    if(!v){toast(t("noVoice"));setPP(false);return;}
    const txt=[L10(p.name),L10(p.desc),L10(p.more)].filter(Boolean).join(". ");
    const parts=txt.match(/[^.!?;]+[.!?;]*/g)||[txt];speechSynthesis.cancel();ttsOn=true;setPP(true);
    parts.forEach((s,i)=>{const u=new SpeechSynthesisUtterance(s.trim());u.voice=v;u.lang=v.lang;u.rate=.95*audRate;
      if(i===parts.length-1) u.onend=()=>{ttsOn=false;setPP(false);};u.onerror=()=>{ttsOn=false;setPP(false);};speechSynthesis.speak(u);});};
  if(speechSynthesis.getVoices().length) go(); else {let done=false;const f=()=>{if(done) return;done=true;go();};speechSynthesis.addEventListener("voiceschanged",f,{once:true});setTimeout(f,900);}
}

function b64utf8(s){const b=new TextEncoder().encode(s);let x="";for(let i=0;i<b.length;i+=8192) x+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(x);}
let PUBCFG=null;
const ub=buf=>{const u=new Uint8Array(buf);let s="";for(let i=0;i<u.length;i++) s+=String.fromCharCode(u[i]);return btoa(s);};
