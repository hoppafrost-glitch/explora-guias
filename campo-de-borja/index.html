ded in the 16th century.\n\nThe castle built by the Templars is now hidden among later buildings. The village has plenty of brick houses, and the Casa de Navarro keeps 17th-century tapestries and portraits by Esquivel and Vicente López."},{"h":"The landscape","t":"Ambel stands at 575 metres, 10 km from Borja, among vineyards and centuries-old olive trees. From here the road climbs to Talamantes and the Moncayo, built in 1894, and the Ojo de Valjunquera spring is in the municipality."}],"fr":[{"h":"Histoire","t":"Le 21 juillet 1151, Raymond-Bérenger IV céda aux Templiers les châteaux et bourgs d'Ambel et d'Alberite en échange de Borja et de Magallón. Ambel dépendit de la commanderie de Novillas jusqu'en 1162, puis eut ses propres commandeurs.\n\nEn 1308, après la disparition du Temple, il passa à l'ordre de Saint-Jean de Jérusalem, dans la Châtellenie d'Amposta, et resta entre ses mains jusqu'à la désamortisation du XIXe siècle."},{"h":"À voir","t":"Le palais des Hospitaliers, d'origine du XIIe siècle, et l'église San Miguel Arcángel forment un seul ensemble. L'église fut élevée selon le mudéjar le plus classique et de nouveaux éléments y furent ajoutés au XVIe siècle.\n\nLe château construit par les Templiers est aujourd'hui dissimulé parmi des constructions plus récentes. Le village compte de nombreuses maisons en brique, et la Casa de Navarro conserve des tapisseries du XVIIe siècle et des portraits d'Esquivel et de Vicente López."},{"h":"Le paysage","t":"Ambel se trouve à 575 mètres, à 10 km de Borja, entre vignes et oliviers centenaires. D'ici part la route qui monte vers Talamantes et le Moncayo, construite en 1894, et la source de l'Ojo de Valjunquera se trouve sur la commune."}],"de":[{"h":"Geschichte","t":"Am 21. Juli 1151 überließ Raimund Berengar IV. den Templern die Burgen und Orte Ambel und Alberite im Tausch gegen Borja und Magallón. Ambel hing bis 1162 von der Komturei Novillas ab und hatte dann eigene Komture.\n\n1308, nach dem Ende des Templerordens, ging es an den Johanniterorden innerhalb der Kastellanei Amposta über und blieb bis zur Säkularisation im 19. Jahrhundert in dessen Besitz."},{"h":"Sehenswert","t":"Der Johanniterpalast mit Ursprung im 12. Jahrhundert und die Kirche San Miguel Arcángel bilden ein Ensemble. Die Kirche wurde im klassischsten Mudéjar-Stil errichtet, im 16. Jahrhundert kamen neue Elemente hinzu.\n\nDie von den Templern errichtete Burg ist heute zwischen späteren Bauten versteckt. Im Ort gibt es viele Backsteinhäuser, und die Casa de Navarro bewahrt Wandteppiche aus dem 17. Jahrhundert und Bildnisse von Esquivel und Vicente López."},{"h":"Die Landschaft","t":"Ambel liegt auf 575 Metern, 10 km von Borja, zwischen Weinbergen und jahrhundertealten Olivenbäumen. Von hier steigt die 1894 gebaute Straße nach Talamantes und zum Moncayo an, und in der Gemeinde liegt die Quelle Ojo de Valjunquera."}],"pt":[{"h":"História","t":"A 21 de julho de 1151, Raimundo Berengário IV cedeu aos templários os castelos e vilas de Ambel e Alberite em troca de Borja e Magallón. Ambel dependeu da comenda de Novillas até 1162 e depois teve comendadores próprios.\n\nEm 1308, após o fim do Templo, passou para a Ordem de São João de Jerusalém, dentro da Castelania de Amposta, e manteve-se nas suas mãos até à desamortização do século XIX."},{"h":"O que ver","t":"O palácio dos Hospitalários, com origem no século XII, e a igreja de San Miguel Arcángel formam um só conjunto. A igreja foi erguida segundo o mudéjar mais clássico e no século XVI acrescentaram-se-lhe novos elementos.\n\nO castelo construído pelos templários ficou camuflado entre edifícios posteriores. No centro abundam as casas de tijolo, e a Casa de Navarro conserva tapeçarias do século XVII e retratos de Esquivel e Vicente López."},{"h":"A paisagem","t":"Ambel fica a 575 metros, a 10 km de Borja, entre vinhas e oliveiras centenárias. Daqui parte a estrada que sobe a Talamantes e ao Moncayo, construída em 1894, e no município fica a nascente do Ojo de Valjunquera."}]},"status":"pending"},{"id":"ermita-rosario-ambel","town":"Ambel","cat":"patrimonio","lat":41.7956,"lon":-1.61778,"coord_src":null,"q":["Ermita de la Virgen del Rosario, Ambel","Virgen del Rosario, Ambel"],"fq":["Ermita Virgen del Rosario Ambel","Ambel torre mudéjar"],"name":{"es":"Iglesia de la Virgen del Rosario","en":"Church of the Virgen del Rosario","fr":"Église de la Virgen del Rosario","de":"Kirche der Virgen del Rosario","pt":"Igreja da Virgen del Rosario"},"when":{"es":"1778 · Barroca con torre mudéjar","en":"1778 · Baroque with Mudéjar tower","fr":"1778 · Baroque à tour mudéjare","de":"1778 · Barock mit Mudéjar-Turm","pt":"1778 · Barroca com torre mudéjar"},"desc":{"es":"La iglesia de la Virgen del Rosario, barroca de 1778, conserva la torre mudéjar de un edificio anterior y guarda la colección de arte de Ambel: retablos góticos, un calvario renacentista y el relicario de las Santas Reliquias.","en":"The church of the Virgen del Rosario, Baroque, from 1778, keeps the Mudéjar tower of an earlier building and holds Ambel's art collection: Gothic altarpieces, a Renaissance calvary and the reliquary of the Holy Relics.","fr":"L'église de la Virgen del Rosario, baroque, de 1778, conserve la tour mudéjare d'un édifice antérieur et abrite la collection d'art d'Ambel : retables gothiques, un calvaire Renaissance et le reliquaire des Saintes Reliques.","de":"Die barocke Kirche der Virgen del Rosario von 1778 bewahrt den Mudéjar-Turm eines älteren Baus und beherbergt Ambels Kunstsammlung: gotische Altäre, einen Renaissance-Kalvarienberg und das Reliquiar der Heiligen Reliquien.","pt":"A igreja da Virgen del Rosario, barroca de 1778, conserva a torre mudéjar de um edifício anterior e guarda a coleção de arte de Ambel: retábulos góticos, um calvário renascentista e o relicário das Santas Relíquias."},"visit":{"es":"Visitas con el Ayuntamiento o la parroquia; en las fiestas de finales de agosto está abierta.","en":"Visits through the town hall or the parish; it is open during the festivities at the end of August.","fr":"Visites avec la mairie ou la paroisse ; elle est ouverte pendant les fêtes de fin août.","de":"Besuche über Rathaus oder Pfarrei; zu den Festen Ende August geöffnet.","pt":"Visitas com a câmara ou a paróquia; está aberta nas festas de finais de agosto."},"src":"https://campodeborja.es/portfolio-item/ambel/","sources":["https://campodeborja.es/portfolio-item/ambel/","https://es.hispanopedia.com/wiki/Ambel_(Zaragoza)"],"art":{"es":[{"h":"Historia","t":"La ermita de la Virgen del Rosario se construyó en estilo barroco en 1778, sobre un edificio anterior del que mantiene la torre mudéjar. Está muy cerca de la parroquia de San Miguel."},{"h":"Qué ver","t":"Entre las dos iglesias reúnen la colección de arte de Ambel. Lo más destacado son unos retablos góticos y un calvario renacentista procedente de la capilla funeraria de los Montserrat.\n\nTambién hay piezas de orfebrería que sirven de soporte a las Santas Reliquias, entre ellas un Lignum Crucis."},{"h":"Tradiciones y fiestas","t":"Del 28 al 31 de agosto Ambel celebra las fiestas de las Santas Reliquias, en las que se representa uno de los dances más antiguos de Aragón. El 20 de enero es San Sebastián."}],"en":[{"h":"History","t":"The hermitage of the Virgen del Rosario was built in Baroque style in 1778 over an earlier building, whose Mudéjar tower it keeps. It stands very close to the parish church of San Miguel."},{"h":"What to see","t":"Between them, the two churches hold Ambel's art collection. The highlights are some Gothic altarpieces and a Renaissance calvary from the funerary chapel of the Montserrat family.\n\nThere are also pieces of silverwork that hold the Holy Relics, including a Lignum Crucis."},{"h":"Traditions and festivals","t":"From 28 to 31 August Ambel celebrates the festivities of the Holy Relics, when one of the oldest «dances» of Aragon is performed. 20 January is San Sebastián."}],"fr":[{"h":"Histoire","t":"L'ermitage de la Virgen del Rosario fut construit en style baroque en 1778, sur un édifice antérieur dont il conserve la tour mudéjare. Il se trouve tout près de l'église paroissiale San Miguel."},{"h":"À voir","t":"Les deux églises réunissent la collection d'art d'Ambel. Les pièces maîtresses sont des retables gothiques et un calvaire Renaissance provenant de la chapelle funéraire des Montserrat.\n\nIl y a aussi des pièces d'orfèvrerie servant de support aux Saintes Reliques, dont un Lignum Crucis."},{"h":"Traditions et fêtes","t":"Du 28 au 31 août, Ambel célèbre les fêtes des Saintes Reliques, où l'on danse l'une des plus anciennes « danses » d'Aragon. Le 20 janvier, c'est San Sebastián."}],"de":[{"h":"Geschichte","t":"Die Einsiedelei der Virgen del Rosario wurde 1778 im Barockstil über einem älteren Bau errichtet, dessen Mudéjar-Turm sie bewahrt. Sie steht ganz nahe der Pfarrkirche San Miguel."},{"h":"Sehenswert","t":"Beide Kirchen zusammen beherbergen die Kunstsammlung von Ambel. Höhepunkte sind gotische Altarretabel und ein Renaissance-Kalvarienberg aus der Grabkapelle der Familie Montserrat.\n\nDazu kommen Goldschmiedearbeiten, die die Heiligen Reliquien tragen, darunter ein Lignum Crucis."},{"h":"Brauchtum und Feste","t":"Vom 28. bis 31. August feiert Ambel die Feste der Heiligen Reliquien, bei denen einer der ältesten „Dances“ Aragoniens aufgeführt wird. Am 20. Januar ist San Sebastián."}],"pt":[{"h":"História","t":"A ermida da Virgen del Rosario foi construída em estilo barroco em 1778, sobre um edifício anterior de que mantém a torre mudéjar. Fica muito perto da igreja paroquial de San Miguel."},{"h":"O que ver","t":"As duas igrejas reúnem a coleção de arte de Ambel. O mais destacado são uns retábulos góticos e um calvário renascentista proveniente da capela funerária dos Montserrat.\n\nHá também peças de ourivesaria que servem de suporte às Santas Relíquias, entre elas um Lignum Crucis."},{"h":"Tradições e festas","t":"De 28 a 31 de agosto Ambel celebra as festas das Santas Relíquias, em que se representa um dos mais antigos «dances» de Aragão. A 20 de janeiro é San Sebastián."}]},"status":"pending"},{"id":"plaza-bisimbre","town":"Bisimbre","cat":"patrimonio","lat":41.85601,"lon":-1.44333,"coord_src":null,"q":["Iglesia de San Juan Bautista, Bisimbre","Bisimbre"],"fq":["Category:Bisimbre","Bisimbre iglesia"],"name":{"es":"San Juan Bautista y Nobleza Baturra","en":"San Juan Bautista and «Nobleza baturra»","fr":"San Juan Bautista et « Nobleza baturra »","de":"San Juan Bautista und „Nobleza baturra“","pt":"San Juan Bautista e «Nobleza baturra»"},"when":{"es":"Siglo XV · Gótico y la plaza de «Nobleza baturra»","en":"15th century · Gothic and the «Nobleza baturra» square","fr":"XVe siècle · Gothique et place de « Nobleza baturra »","de":"15. Jh. · Gotik und der Platz von „Nobleza baturra“","pt":"Séc. XV · Gótico e a praça de «Nobleza baturra»"},"desc":{"es":"En la plaza de Bisimbre se rodaron en 1935 escenas de «Nobleza baturra», la película de Florián Rey con Imperio Argentina. Hoy un monumento la recuerda frente a la iglesia gótica de San Juan Bautista.","en":"In 1935 scenes of «Nobleza baturra», Florián Rey's film starring Imperio Argentina, were shot in Bisimbre's square. Today a monument recalls it in front of the Gothic church of San Juan Bautista.","fr":"En 1935, des scènes de « Nobleza baturra », le film de Florián Rey avec Imperio Argentina, furent tournées sur la place de Bisimbre. Un monument le rappelle aujourd'hui face à l'église gothique San Juan Bautista.","de":"1935 wurden auf dem Platz von Bisimbre Szenen von „Nobleza baturra“ gedreht, dem Film von Florián Rey mit Imperio Argentina. Ein Denkmal vor der gotischen Kirche San Juan Bautista erinnert daran.","pt":"Em 1935 rodaram-se na praça de Bisimbre cenas de «Nobleza baturra», o filme de Florián Rey com Imperio Argentina. Hoje um monumento recorda-o em frente à igreja gótica de San Juan Bautista."},"visit":{"es":"Plaza de acceso libre; la iglesia abre en horario de culto.","en":"Square with free access; the church opens during services.","fr":"Place en accès libre ; l'église ouvre aux heures de culte.","de":"Platz frei zugänglich; die Kirche öffnet zu Gottesdiensten.","pt":"Praça de acesso livre; a igreja abre nas horas de culto."},"src":"https://campodeborja.es/portfolio-item/bisimbre/","sources":["https://campodeborja.es/portfolio-item/bisimbre/","https://es.hispanopedia.com/wiki/Bisimbre","https://campodeborja.es/wp-content/uploads/2024/03/Folleto-Campo-de-Borja-_EN_2024_v1.pdf"],"art":{"es":[{"h":"Historia","t":"La iglesia de San Juan Bautista es gótica, del siglo XV, construida en sillería; la comarca la presenta como un ejemplo de la arquitectura gótico-renacentista de los señoríos del valle del Huecha. Dentro hay retablos del siglo XVIII.\n\nTras la Reconquista, Bisimbre perteneció al monasterio de Santa Cristina de Somport y después a varios señores laicos; el último fue el marqués de Ayerbe."},{"h":"Nobleza baturra","t":"En 1935 Florián Rey rodó «Nobleza baturra» en Bisimbre, Borja y La Almunia de Doña Godina. La protagonista era Imperio Argentina.\n\nEl monumento a Imperio Argentina está en la plaza mayor, entre el Ayuntamiento y la fachada de la iglesia."},{"h":"Para entenderlo","t":"En el término quedan los restos del despoblado medieval de Bruñén y dos peirones o humilladeros. Bisimbre celebra sus fiestas de verano el segundo fin de semana de agosto, cuando se hacen rosquillas «a la sartén», y la Inmaculada del 7 al 10 de diciembre."}],"en":[{"h":"History","t":"The church of San Juan Bautista is Gothic, from the 15th century, built of ashlar; the comarca presents it as an example of the Gothic-Renaissance architecture of the lordships of the Huecha valley. Inside are 18th-century altarpieces.\n\nAfter the Reconquest, Bisimbre belonged to the monastery of Santa Cristina de Somport and then to several lay lords; the last was the Marquis of Ayerbe."},{"h":"Nobleza baturra","t":"In 1935 Florián Rey shot «Nobleza baturra» in Bisimbre, Borja and La Almunia de Doña Godina. The leading lady was Imperio Argentina.\n\nThe monument to Imperio Argentina is in the main square, between the town hall and the church front."},{"h":"Background","t":"In the municipality are the remains of the medieval deserted village of Bruñén and two «peirones», wayside shrines. Bisimbre holds its summer festivities on the second weekend of August, when «rosquillas a la sartén» are fried, and the Immaculate Conception from 7 to 10 December."}],"fr":[{"h":"Histoire","t":"L'église San Juan Bautista est gothique, du XVe siècle, construite en pierre de taille ; la comarque la présente comme un exemple de l'architecture gothique-Renaissance des seigneuries de la vallée de la Huecha. À l'intérieur se trouvent des retables du XVIIIe siècle.\n\nAprès la Reconquête, Bisimbre appartint au monastère de Santa Cristina de Somport, puis à plusieurs seigneurs laïcs ; le dernier fut le marquis d'Ayerbe."},{"h":"Nobleza baturra","t":"En 1935, Florián Rey tourna « Nobleza baturra » à Bisimbre, Borja et La Almunia de Doña Godina. La vedette était Imperio Argentina.\n\nLe monument à Imperio Argentina se trouve sur la grand-place, entre la mairie et la façade de l'église."},{"h":"Pour comprendre","t":"Sur la commune subsistent les restes du village médiéval abandonné de Bruñén et deux « peirones », oratoires de chemin. Bisimbre fête l'été le deuxième week-end d'août, quand on prépare les « rosquillas a la sartén », et l'Immaculée Conception du 7 au 10 décembre."}],"de":[{"h":"Geschichte","t":"Die Kirche San Juan Bautista ist gotisch, aus dem 15. Jahrhundert, aus Quadersteinen gebaut; die Comarca stellt sie als Beispiel der gotisch-renaissancehaften Architektur der Herrschaften im Huecha-Tal vor. Innen gibt es Altäre aus dem 18. Jahrhundert.\n\nNach der Reconquista gehörte Bisimbre dem Kloster Santa Cristina de Somport, dann mehreren weltlichen Herren; der letzte war der Marquis von Ayerbe."},{"h":"Nobleza baturra","t":"1935 drehte Florián Rey „Nobleza baturra“ in Bisimbre, Borja und La Almunia de Doña Godina. Die Hauptdarstellerin war Imperio Argentina.\n\nDas Denkmal für Imperio Argentina steht auf dem Hauptplatz zwischen Rathaus und Kirchenfassade."},{"h":"Hintergrund","t":"In der Gemeinde liegen die Reste der mittelalterlichen Wüstung Bruñén und zwei „peirones“, Wegkapellen. Bisimbre feiert sein Sommerfest am zweiten Augustwochenende, wenn „rosquillas a la sartén“ gebacken werden, und die Unbefleckte Empfängnis vom 7. bis 10. Dezember."}],"pt":[{"h":"História","t":"A igreja de San Juan Bautista é gótica, do século XV, construída em cantaria; a comarca apresenta-a como exemplo da arquitetura gótico-renascentista dos senhorios do vale do Huecha. Lá dentro há retábulos do século XVIII.\n\nApós a Reconquista, Bisimbre pertenceu ao mosteiro de Santa Cristina de Somport e depois a vários senhores laicos; o último foi o marquês de Ayerbe."},{"h":"Nobleza baturra","t":"Em 1935 Florián Rey rodou «Nobleza baturra» em Bisimbre, Borja e La Almunia de Doña Godina. A protagonista era Imperio Argentina.\n\nO monumento a Imperio Argentina está na praça principal, entre a câmara e a fachada da igreja."},{"h":"Para compreender","t":"No município restam os vestígios do povoado medieval abandonado de Bruñén e dois «peirones», alminhas de caminho. Bisimbre celebra as festas de verão no segundo fim de semana de agosto, quando se fazem «rosquillas a la sartén», e a Imaculada de 7 a 10 de dezembro."}]},"status":"pending"},{"id":"castillo-bulbuente","town":"Bulbuente","cat":"patrimonio","lat":41.81754,"lon":-1.60252,"coord_src":null,"q":["Castillo de Bulbuente","Bulbuente castillo"],"fq":["Category:Castillo de Bulbuente","Castillo Bulbuente"],"name":{"es":"Castillo-palacio de los abades de Veruela","en":"Castle-palace of the abbots of Veruela","fr":"Château-palais des abbés de Veruela","de":"Burgpalast der Äbte von Veruela","pt":"Castelo-palácio dos abades de Veruela"},"when":{"es":"Siglo XIII · Torre Bien de Interés Cultural","en":"13th century · Tower listed as Site of Cultural Interest","fr":"XIIIe siècle · Tour classée Bien d'intérêt culturel","de":"13. Jh. · Turm als Kulturgut geschützt","pt":"Séc. XIII · Torre classificada Bem de Interesse Cultural"},"desc":{"es":"Jaime I entregó Bulbuente y su castillo al monasterio de Veruela a mediados del siglo XIII. El castillo-palacio de los abades, con su torre declarada Bien de Interés Cultural, es hoy un hotel rural rehabilitado.","en":"James I gave Bulbuente and its castle to the monastery of Veruela in the mid-13th century. The castle-palace of the abbots, whose tower is a Site of Cultural Interest, is now a restored rural hotel.","fr":"Jacques Ier donna Bulbuente et son château au monastère de Veruela au milieu du XIIIe siècle. Le château-palais des abbés, dont la tour est Bien d'intérêt culturel, est aujourd'hui un hôtel rural restauré.","de":"Jakob I. schenkte Bulbuente und seine Burg Mitte des 13. Jahrhunderts dem Kloster Veruela. Der Burgpalast der Äbte, dessen Turm Kulturgut ist, ist heute ein restauriertes Landhotel.","pt":"Jaime I entregou Bulbuente e o seu castelo ao mosteiro de Veruela em meados do século XIII. O castelo-palácio dos abades, cuja torre é Bem de Interesse Cultural, é hoje um hotel rural recuperado."},"visit":{"es":"Se ve desde el exterior. Al ser alojamiento, las visitas dependen de la propiedad.","en":"Seen from outside. As it is accommodation, visits depend on the owners.","fr":"Se voit de l'extérieur. S'agissant d'un hébergement, les visites dépendent des propriétaires.","de":"Von außen zu sehen. Da es eine Unterkunft ist, hängen Besuche von den Eigentümern ab.","pt":"Vê-se do exterior. Por ser alojamento, as visitas dependem dos proprietários."},"src":"https://es.hispanopedia.com/wiki/Bulbuente","sources":["https://es.hispanopedia.com/wiki/Bulbuente","https://campodeborja.es/portfolio-item/bulbuente/","https://campodeborja.es/wp-content/uploads/2024/03/Folleto-Campo-de-Borja-_EN_2024_v1.pdf"],"art":{"es":[{"h":"Historia","t":"En 1195 Sancho VII de Navarra compró el castillo. En el siglo XIII el lugar pasó al monasterio de Veruela, que lo mantuvo hasta la desamortización de Mendizábal de 1835; entonces el castillo-palacio y dos molinos pasaron a manos privadas.\n\nEn 1610 la expulsión de los moriscos dejó el pueblo con 184 habitantes de 491. La nueva carta puebla de 1613 intentó repoblarlo."},{"h":"Qué ver","t":"La torre del castillo es Bien de Interés Cultural. Junto a ella, el palacio de los abades se ha rehabilitado como alojamiento; durante las obras aparecieron restos arquitectónicos importantes.\n\nEl Ayuntamiento ocupa una casa-palacio renacentista aragonesa del siglo XVI, y otras casas del pueblo conservan sus galerías de arquillos."},{"h":"Curiosidades","t":"A mediados de julio Bulbuente celebra la Feria de la Mora Encantada, con la representación de la leyenda que da nombre a la Hoya de la Mora Encantada. En el pueblo están también la fuente de los 20 caños y un puente sobre el Huecha de 1894."}],"en":[{"h":"History","t":"In 1195 Sancho VII of Navarre bought the castle. In the 13th century the place passed to the monastery of Veruela, which held it until Mendizábal's disentailment of 1835; the castle-palace and two mills then went into private hands.\n\nIn 1610 the expulsion of the Moriscos left the village with 184 inhabitants out of 491. A new settlement charter in 1613 tried to repopulate it."},{"h":"What to see","t":"The castle tower is a Site of Cultural Interest. Next to it, the abbots' palace has been restored as accommodation; significant architectural remains came to light during the works.\n\nThe town hall occupies a 16th-century Aragonese Renaissance mansion, and other houses in the village keep their galleries of small arches."},{"h":"Did you know?","t":"In mid-July Bulbuente holds the Fair of the Enchanted Moorish Girl, with a performance of the legend that gives its name to the Hoya de la Mora Encantada. The village also has the fountain of 20 spouts and an 1894 bridge over the Huecha."}],"fr":[{"h":"Histoire","t":"En 1195, Sanche VII de Navarre acheta le château. Au XIIIe siècle, le lieu passa au monastère de Veruela, qui le garda jusqu'à la désamortisation de Mendizábal en 1835 ; le château-palais et deux moulins passèrent alors en mains privées.\n\nEn 1610, l'expulsion des Morisques laissa le village avec 184 habitants sur 491. La nouvelle charte de peuplement de 1613 chercha à le repeupler."},{"h":"À voir","t":"La tour du château est Bien d'intérêt culturel. À côté, le palais des abbés a été restauré en hébergement ; pendant les travaux, d'importants vestiges architecturaux sont apparus.\n\nLa mairie occupe une demeure Renaissance aragonaise du XVIe siècle, et d'autres maisons du village conservent leurs galeries de petites arcades."},{"h":"Le saviez-vous ?","t":"À la mi-juillet, Bulbuente célèbre la Foire de la Mauresque enchantée, avec la représentation de la légende qui donne son nom à la Hoya de la Mora Encantada. Le village compte aussi la fontaine aux 20 becs et un pont de 1894 sur la Huecha."}],"de":[{"h":"Geschichte","t":"1195 kaufte Sancho VII. von Navarra die Burg. Im 13. Jahrhundert ging der Ort an das Kloster Veruela, das ihn bis zur Säkularisation Mendizábals 1835 behielt; dann kamen Burgpalast und zwei Mühlen in Privathand.\n\n1610 ließ die Vertreibung der Morisken das Dorf mit 184 von 491 Einwohnern zurück. Mit einem neuen Siedlungsbrief von 1613 versuchte man es wiederzubevölkern."},{"h":"Sehenswert","t":"Der Burgturm ist Kulturgut von besonderem Interesse. Daneben wurde der Abtspalast als Unterkunft restauriert; bei den Arbeiten kamen bedeutende bauliche Reste zutage.\n\nDas Rathaus befindet sich in einem aragonesischen Renaissancepalast aus dem 16. Jahrhundert, und weitere Häuser bewahren ihre Bogengalerien."},{"h":"Wussten Sie?","t":"Mitte Juli feiert Bulbuente den Markt der Verzauberten Maurin mit einer Aufführung der Legende, die der Hoya de la Mora Encantada ihren Namen gibt. Im Dorf gibt es außerdem den Brunnen der 20 Röhren und eine Brücke über die Huecha von 1894."}],"pt":[{"h":"História","t":"Em 1195 Sancho VII de Navarra comprou o castelo. No século XIII o lugar passou para o mosteiro de Veruela, que o manteve até à desamortização de Mendizábal de 1835; o castelo-palácio e dois moinhos passaram então para mãos privadas.\n\nEm 1610 a expulsão dos mouriscos deixou a aldeia com 184 habitantes de 491. A nova carta de povoamento de 1613 tentou repovoá-la."},{"h":"O que ver","t":"A torre do castelo é Bem de Interesse Cultural. Ao lado, o palácio dos abades foi recuperado como alojamento; durante as obras apareceram restos arquitetónicos importantes.\n\nA câmara ocupa uma casa-palácio renascentista aragonesa do século XVI, e outras casas da aldeia conservam as suas galerias de arquinhos."},{"h":"Curiosidades","t":"Em meados de julho Bulbuente celebra a Feira da Moura Encantada, com a representação da lenda que dá nome à Hoya de la Mora Encantada. Na aldeia ficam também a fonte dos 20 bicas e uma ponte sobre o Huecha de 1894."}]},"status":"pending"},{"id":"iglesia-bulbuente","town":"Bulbuente","cat":"patrimonio","lat":41.81791,"lon":-1.60166,"coord_src":null,"q":["Iglesia de Santa María, Bulbuente","Bulbuente"],"fq":["Category:Bulbuente","Bulbuente iglesia"],"name":{"es":"Iglesia de Santa María","en":"Church of Santa María","fr":"Église Santa María","de":"Kirche Santa María","pt":"Igreja de Santa María"},"when":{"es":"1533-1535 · Con tablas del retablo de Veruela","en":"1533–1535 · With panels from Veruela's altarpiece","fr":"1533-1535 · Avec des panneaux du retable de Veruela","de":"1533–1535 · Mit Tafeln des Altars von Veruela","pt":"1533-1535 · Com tábuas do retábulo de Veruela"},"desc":{"es":"La iglesia de Santa María se levantó entre 1533 y 1535 y guarda tablas del antiguo retablo mayor de Veruela y tres sargas de Jerónimo Cósida, de sus primeros trabajos.","en":"The church of Santa María was built between 1533 and 1535 and keeps panels from Veruela's former high altarpiece and three painted cloths by Jerónimo Cósida, among his earliest works.","fr":"L'église Santa María fut construite entre 1533 et 1535 et conserve des panneaux de l'ancien retable majeur de Veruela et trois toiles peintes de Jerónimo Cósida, parmi ses premières œuvres.","de":"Die Kirche Santa María wurde 1533–1535 erbaut und bewahrt Tafeln des ehemaligen Hochaltars von Veruela sowie drei bemalte Tücher von Jerónimo Cósida, zu seinen frühesten Werken gehörend.","pt":"A igreja de Santa María foi construída entre 1533 e 1535 e guarda tábuas do antigo retábulo-mor de Veruela e três sargas de Jerónimo Cósida, dos seus primeiros trabalhos."},"visit":{"es":"Abre en horario de culto; pregunta en el Ayuntamiento por visitas.","en":"Open during services; ask at the town hall about visits.","fr":"Ouverte aux heures de culte ; renseignez-vous à la mairie pour les visites.","de":"Zu Gottesdiensten geöffnet; für Besuche im Rathaus fragen.","pt":"Abre nas horas de culto; pergunte na câmara por visitas."},"src":"https://es.hispanopedia.com/wiki/Bulbuente","sources":["https://es.hispanopedia.com/wiki/Bulbuente","https://campodeborja.es/portfolio-item/bulbuente/"],"art":{"es":[{"h":"Historia","t":"El 2 de junio de 1533 fray Miguel Ximénez contrató con Juan de Arizábal la construcción de la iglesia. Se terminó en 1535 y costó 12.000 sueldos jaqueses. Se amplió entre 1827 y 1833, y en 2023 se rehabilitó la fachada principal."},{"h":"Qué ver","t":"Dentro se conservan tablas del retablo mayor que estuvo en Veruela y tres sargas, pinturas sobre tela, de Jerónimo Cósida, consideradas de sus primeros trabajos.\n\nLas obras de Veruela estuvieron antes en la ermita de San Bartolomé, construida entre 1631 y 1644, que hoy es un lugar de encuentro del pueblo."},{"h":"Tradiciones y fiestas","t":"El 24 de agosto, día de San Bartolomé, los cofrades cantan coplillas al amanecer, los danzantes recorren el pueblo con los dulzaineros y, después de la misa y la procesión, en la plaza de la iglesia se representa el Dance, con el diablo, los pastores y un ángel."}],"en":[{"h":"History","t":"On 2 June 1533 Fray Miguel Ximénez commissioned Juan de Arizábal to build the church. It was finished in 1535 and cost 12,000 «sueldos jaqueses». It was enlarged between 1827 and 1833, and the main façade was restored in 2023."},{"h":"What to see","t":"Inside are panels from the high altarpiece that stood at Veruela and three «sargas», paintings on cloth, by Jerónimo Cósida, considered among his earliest works.\n\nThe Veruela works were previously in the hermitage of San Bartolomé, built between 1631 and 1644, which is now a meeting place for the village."},{"h":"Traditions and festivals","t":"On 24 August, feast of San Bartolomé, the brotherhood sing verses at dawn, the dancers go round the village with the dulzaina players and, after mass and the procession, the Dance is performed in the church square, with the devil, the shepherds and an angel."}],"fr":[{"h":"Histoire","t":"Le 2 juin 1533, frère Miguel Ximénez confia à Juan de Arizábal la construction de l'église. Elle fut achevée en 1535 et coûta 12 000 sous de Jaca. Elle fut agrandie entre 1827 et 1833, et la façade principale fut restaurée en 2023."},{"h":"À voir","t":"À l'intérieur se trouvent des panneaux du retable majeur qui se trouvait à Veruela et trois « sargas », peintures sur toile, de Jerónimo Cósida, considérées parmi ses premiers travaux.\n\nLes œuvres de Veruela étaient auparavant dans l'ermitage San Bartolomé, construit entre 1631 et 1644, aujourd'hui lieu de rencontre du village."},{"h":"Traditions et fêtes","t":"Le 24 août, jour de la Saint-Barthélemy, les confrères chantent des couplets à l'aube, les danseurs parcourent le village avec les joueurs de dulzaina et, après la messe et la procession, on représente le Dance sur la place de l'église, avec le diable, les bergers et un ange."}],"de":[{"h":"Geschichte","t":"Am 2. Juni 1533 beauftragte Fray Miguel Ximénez Juan de Arizábal mit dem Bau der Kirche. Sie wurde 1535 fertig und kostete 12.000 Jaca-Sueldos. Zwischen 1827 und 1833 wurde sie erweitert, 2023 die Hauptfassade restauriert."},{"h":"Sehenswert","t":"Im Inneren befinden sich Tafeln des Hochaltars, der in Veruela stand, und drei „sargas“, Malereien auf Leinwand, von Jerónimo Cósida, die zu seinen frühesten Arbeiten zählen.\n\nDie Werke aus Veruela waren zuvor in der Einsiedelei San Bartolomé, erbaut 1631–1644, heute ein Treffpunkt des Dorfes."},{"h":"Brauchtum und Feste","t":"Am 24. August, dem Tag von San Bartolomé, singen die Bruderschaftsmitglieder im Morgengrauen Verse, die Tänzer ziehen mit den Dulzaina-Spielern durchs Dorf, und nach Messe und Prozession wird auf dem Kirchplatz der Dance aufgeführt, mit Teufel, Hirten und einem Engel."}],"pt":[{"h":"História","t":"A 2 de junho de 1533, frei Miguel Ximénez contratou Juan de Arizábal para construir a igreja. Ficou pronta em 1535 e custou 12 000 soldos jaqueses. Foi ampliada entre 1827 e 1833, e em 2023 recuperou-se a fachada principal."},{"h":"O que ver","t":"Lá dentro conservam-se tábuas do retábulo-mor que esteve em Veruela e três «sargas», pinturas sobre tecido, de Jerónimo Cósida, consideradas dos seus primeiros trabalhos.\n\nAs obras de Veruela estiveram antes na ermida de San Bartolomé, construída entre 1631 e 1644, hoje lugar de encontro da aldeia."},{"h":"Tradições e festas","t":"A 24 de agosto, dia de San Bartolomé, os confrades cantam coplas ao amanhecer, os dançantes percorrem a aldeia com os tocadores de dulzaina e, depois da missa e da procissão, representa-se o Dance na praça da igreja, com o diabo, os pastores e um anjo."}]},"status":"pending"},{"id":"palacio-bureta","town":"Bureta","cat":"patrimonio","lat":41.81744,"lon":-1.48865,"coord_src":null,"q":["Palacio de los Condes de Bureta","Bureta"],"fq":["Category:Palacio de los Condes de Bureta","Palacio Bureta"],"name":{"es":"Palacio de los Condes de Bureta","en":"Palace of the Counts of Bureta","fr":"Palais des comtes de Bureta","de":"Palast der Grafen von Bureta","pt":"Palácio dos Condes de Bureta"},"when":{"es":"Siglos XVI-XVIII · Casa de la condesa de los Sitios","en":"16th–18th c. · Home of the countess of the Sieges","fr":"XVIe–XVIIIe s. · Demeure de la comtesse des Sièges","de":"16.–18. Jh. · Haus der Gräfin der Belagerungen","pt":"Séc. XVI–XVIII · Casa da condessa dos Cercos"},"desc":{"es":"Junto al cauce del Huecha, el palacio de los Condes de Bureta sigue en manos de la familia y se visita con el propio conde. Aquí vivió la condesa de Bureta, heroína de los Sitios de Zaragoza.","en":"Beside the bed of the Huecha, the palace of the Counts of Bureta is still owned by the family and is shown by the count himself. The Countess of Bureta, heroine of the Sieges of Zaragoza, lived here.","fr":"Au bord du lit de la Huecha, le palais des comtes de Bureta appartient toujours à la famille et se visite avec le comte lui-même. Ici vécut la comtesse de Bureta, héroïne des Sièges de Saragosse.","de":"Am Bett der Huecha gehört der Palast der Grafen von Bureta noch der Familie und wird vom Grafen selbst gezeigt. Hier lebte die Gräfin von Bureta, Heldin der Belagerungen von Saragossa.","pt":"Junto ao leito do Huecha, o palácio dos Condes de Bureta continua nas mãos da família e é mostrado pelo próprio conde. Aqui viveu a condessa de Bureta, heroína dos Cercos de Saragoça."},"visit":{"es":"Visitas guiadas por el conde, de 1 h 15 min aproximadamente y unas 25 salas, con entrada. Confirma horarios antes de ir. Tiene casa de turismo rural y café-restaurante.","en":"Guided tours led by the count, about 1 h 15 min through some 25 rooms, with an entry fee. Check times before you go. There is a rural guesthouse and a café-restaurant.","fr":"Visites guidées par le comte, d'environ 1 h 15 à travers quelque 25 salles, avec entrée payante. Vérifiez les horaires avant de venir. Gîte rural et café-restaurant.","de":"Führungen durch den Grafen, etwa 1 Std. 15 Min. durch rund 25 Räume, mit Eintritt. Zeiten vorher erfragen. Mit Landhaus-Unterkunft und Café-Restaurant.","pt":"Visitas guiadas pelo conde, de cerca de 1 h 15 e umas 25 salas, com bilhete. Confirme horários antes de ir. Tem casa de turismo rural e café-restaurante."},"src":"https://elespanol.com/aragon/vivir/20250102/precioso-palacio-debes-visitar-cerca-zaragoza-tesoro-conocido-residencia-condes-trt/913408830_0.html","sources":["https://elespanol.com/aragon/vivir/20250102/precioso-palacio-debes-visitar-cerca-zaragoza-tesoro-conocido-residencia-condes-trt/913408830_0.html","https://campodeborja.es/portfolio-item/bureta/","https://campodeborja.es/wp-content/uploads/2024/04/es-ruta-corazon-moncayo.pdf"],"art":{"es":[{"h":"Historia","t":"El palacio se levanta sobre una torre defensiva y tiene un cuerpo principal del siglo XVI, rematado por una galería de arcos de medio punto. Más tarde se le añadieron dos alas neoclásicas a cada lado. En el siglo XIV el señorío estaba ligado a la familia Luna, y el título de conde de Bureta lo concedió Carlos II.\n\nUna condesa de Bureta tuvo un papel destacado en la defensa de Zaragoza durante los Sitios de la Guerra de la Independencia."},{"h":"Qué ver","t":"La visita recorre la biblioteca, la sala noble, la de música, la de billar, la habitación de la condesa, el comedor, la sala de té y el Salón Blanco o de los Caballeros. Arriba, una galería abierta mira al Moncayo y al Ebro.\n\nEl archivo guarda más de 14.000 documentos de los siglos XII al XIX. Se conservan también objetos personales de la condesa."},{"h":"Para entenderlo","t":"La iglesia parroquial de Santa Cruz, del siglo XVIII y con fachada barroca, forma parte del conjunto; en su cripta están enterrados algunos condes y dentro hay retablos de los siglos XVI y XVII.\n\nBureta celebra la Natividad de la Virgen el 8 de septiembre y la Purísima Votada el 23 de octubre."}],"en":[{"h":"History","t":"The palace stands on a defensive tower and has a 16th-century main block topped by a gallery of round arches. Two Neoclassical wings were later added, one on each side. In the 14th century the lordship was linked to the Luna family, and the title of Count of Bureta was granted by Charles II.\n\nA Countess of Bureta played a leading role in the defence of Zaragoza during the Sieges of the Peninsular War."},{"h":"What to see","t":"The tour takes in the library, the reception room, the music room, the billiard room, the countess's bedroom, the dining room, the tea room and the White Room or Knights' Room. Upstairs, an open gallery looks out to the Moncayo and the Ebro.\n\nThe archive holds more than 14,000 documents from the 12th to the 19th centuries. Personal belongings of the countess are also kept."},{"h":"Background","t":"The parish church of Santa Cruz, 18th-century with a Baroque façade, is part of the ensemble; some of the counts are buried in its crypt and inside are 16th- and 17th-century altarpieces.\n\nBureta celebrates the Nativity of the Virgin on 8 September and the Purísima Votada on 23 October."}],"fr":[{"h":"Histoire","t":"Le palais s'élève sur une tour défensive et possède un corps principal du XVIe siècle couronné d'une galerie d'arcs en plein cintre. Deux ailes néoclassiques furent ajoutées plus tard, une de chaque côté. Au XIVe siècle, la seigneurie était liée à la famille Luna, et le titre de comte de Bureta fut accordé par Charles II.\n\nUne comtesse de Bureta joua un rôle de premier plan dans la défense de Saragosse pendant les Sièges de la guerre d'Indépendance."},{"h":"À voir","t":"La visite parcourt la bibliothèque, le salon d'honneur, la salle de musique, la salle de billard, la chambre de la comtesse, la salle à manger, le salon de thé et le Salon blanc ou des Chevaliers. En haut, une galerie ouverte regarde vers le Moncayo et l'Èbre.\n\nLes archives conservent plus de 14 000 documents du XIIe au XIXe siècle. Des objets personnels de la comtesse sont également conservés."},{"h":"Pour comprendre","t":"L'église paroissiale de Santa Cruz, du XVIIIe siècle et à façade baroque, fait partie de l'ensemble ; certains comtes sont enterrés dans sa crypte et elle abrite des retables des XVIe et XVIIe siècles.\n\nBureta fête la Nativité de la Vierge le 8 septembre et la Purísima Votada le 23 octobre."}],"de":[{"h":"Geschichte","t":"Der Palast steht auf einem Wehrturm und hat einen Hauptbau aus dem 16. Jahrhundert mit einer Galerie aus Rundbögen. Später kamen zwei klassizistische Flügel hinzu, einer auf jeder Seite. Im 14. Jahrhundert war die Herrschaft mit der Familie Luna verbunden; den Titel Graf von Bureta verlieh Karl II.\n\nEine Gräfin von Bureta spielte eine führende Rolle bei der Verteidigung Saragossas während der Belagerungen im Unabhängigkeitskrieg."},{"h":"Sehenswert","t":"Die Führung zeigt Bibliothek, Empfangssaal, Musik- und Billardzimmer, das Zimmer der Gräfin, Speisesaal, Teesalon und den Weißen Saal oder Rittersaal. Oben blickt eine offene Galerie auf den Moncayo und den Ebro.\n\nDas Archiv verwahrt über 14.000 Dokumente aus dem 12. bis 19. Jahrhundert. Auch persönliche Gegenstände der Gräfin sind erhalten."},{"h":"Hintergrund","t":"Die Pfarrkirche Santa Cruz aus dem 18. Jahrhundert mit barocker Fassade gehört zum Ensemble; in ihrer Krypta sind einige Grafen bestattet, im Inneren stehen Altäre aus dem 16. und 17. Jahrhundert.\n\nBureta feiert Mariä Geburt am 8. September und die Purísima Votada am 23. Oktober."}],"pt":[{"h":"História","t":"O palácio ergue-se sobre uma torre defensiva e tem um corpo principal do século XVI rematado por uma galeria de arcos de volta perfeita. Mais tarde acrescentaram-se duas alas neoclássicas, uma de cada lado. No século XIV o senhorio estava ligado à família Luna, e o título de conde de Bureta foi concedido por Carlos II.\n\nUma condessa de Bureta teve um papel destacado na defesa de Saragoça durante os Cercos da Guerra da Independência."},{"h":"O que ver","t":"A visita percorre a biblioteca, a sala nobre, a de música, a de bilhar, o quarto da condessa, a sala de jantar, a sala de chá e o Salão Branco ou dos Cavaleiros. Em cima, uma galeria aberta olha para o Moncayo e o Ebro.\n\nO arquivo guarda mais de 14 000 documentos dos séculos XII a XIX. Conservam-se também objetos pessoais da condessa."},{"h":"Para compreender","t":"A igreja paroquial de Santa Cruz, do século XVIII e com fachada barroca, faz parte do conjunto; na sua cripta estão sepultados alguns condes e lá dentro há retábulos dos séculos XVI e XVII.\n\nBureta celebra a Natividade da Virgem a 8 de setembro e a Purísima Votada a 23 de outubro."}]},"status":"pending"},{"id":"burren","town":"Fréscano","cat":"arqueologia","lat":41.87308,"lon":-1.4266,"coord_src":null,"q":["Burrén, Fréscano","Cabezo de Burrén"],"fq":["Burrén Fréscano","Category:Fréscano"],"name":{"es":"Parque arqueológico de Burrén","en":"Burrén Archaeological Park","fr":"Parc archéologique de Burrén","de":"Archäologischer Park Burrén","pt":"Parque arqueológico de Burrén"},"when":{"es":"Primera Edad del Hierro · Bien de Interés Cultural","en":"Early Iron Age · Site of Cultural Interest","fr":"Premier âge du Fer · Bien d'intérêt culturel","de":"Ältere Eisenzeit · Kulturgut","pt":"Primeira Idade do Ferro · Bem de Interesse Cultural"},"desc":{"es":"En los cabezos de Burrén y Burrena, en Fréscano, vivieron comunidades de la primera Edad del Hierro. El parque arqueológico que los explica es, según la comarca, el primero de España dedicado a ese periodo.","en":"On the hills of Burrén and Burrena, in Fréscano, lived communities of the Early Iron Age. According to the comarca, the archaeological park that explains them is the first in Spain devoted to that period.","fr":"Sur les buttes de Burrén et Burrena, à Fréscano, vécurent des communautés du premier âge du Fer. Selon la comarque, le parc archéologique qui les présente est le premier d'Espagne consacré à cette période.","de":"Auf den Hügeln Burrén und Burrena in Fréscano lebten Gemeinschaften der älteren Eisenzeit. Laut der Comarca ist der archäologische Park, der sie erklärt, der erste Spaniens zu dieser Epoche.","pt":"Nos cabeços de Burrén e Burrena, em Fréscano, viveram comunidades da primeira Idade do Ferro. Segundo a comarca, o parque arqueológico que os explica é o primeiro de Espanha dedicado a esse período."},"visit":{"es":"Parque al aire libre con mirador en el Cabezo de Burrén. Pregunta en el Ayuntamiento de Fréscano por el museo arqueológico y las visitas guiadas.","en":"Open-air park with a viewpoint on the Cabezo de Burrén. Ask at Fréscano town hall about the archaeological museum and guided tours.","fr":"Parc en plein air avec belvédère sur le Cabezo de Burrén. Renseignez-vous à la mairie de Fréscano pour le musée archéologique et les visites guidées.","de":"Freiluftpark mit Aussichtspunkt auf dem Cabezo de Burrén. Für Museum und Führungen im Rathaus von Fréscano fragen.","pt":"Parque ao ar livre com miradouro no Cabezo de Burrén. Pergunte na câmara de Fréscano pelo museu arqueológico e pelas visitas guiadas."},"src":"https://campodeborja.es/portfolio-item/frescano/","sources":["https://campodeborja.es/portfolio-item/frescano/","https://campodeborja.es/wp-content/uploads/2024/03/Folleto-Campo-de-Borja-_EN_2024_v1.pdf","https://es.hispanopedia.com/wiki/Fr%C3%A9scano"],"art":{"es":[{"h":"Historia","t":"Los yacimientos de Burrén, Burrena y Morredón, todos Bien de Interés Cultural, documentan la ocupación del lugar desde la primera Edad del Hierro, con gentes de la cultura de los Campos de Urnas. Cerca se han hallado también asentamientos celtíberos, y la ocupación siguió hasta época romana.\n\nEn el Cabezo de la Cruz aparecieron cerámicas excisas, una técnica decorativa típica de esa época."},{"h":"Qué ver","t":"El parque permite recorrer los restos de las casas y los enterramientos, y desde el mirador del Cabezo de Burrén se domina la vega baja del Huecha. En el pueblo, el Museo Arqueológico y Ecomuseo completa la visita.\n\nCuriosamente, la piedra de la cantera de Burrén sirvió en 1405 para rehacer el Puente de Piedra y la Seo de Zaragoza."}],"en":[{"h":"History","t":"The sites of Burrén, Burrena and Morredón, all Sites of Cultural Interest, document the occupation of the area from the Early Iron Age by people of the Urnfield culture. Celtiberian settlements have also been found nearby, and occupation continued into Roman times.\n\nAt the Cabezo de la Cruz, pottery with excised decoration was found, a technique typical of the period."},{"h":"What to see","t":"The park lets you walk among the remains of houses and burials, and from the Cabezo de Burrén viewpoint you look out over the lower Huecha plain. In the village, the Archaeological Museum and Ecomuseum completes the visit.\n\nCuriously, stone from the Burrén quarry was used in 1405 to rebuild the Puente de Piedra and La Seo in Zaragoza."}],"fr":[{"h":"Histoire","t":"Les sites de Burrén, Burrena et Morredón, tous Biens d'intérêt culturel, attestent l'occupation du lieu dès le premier âge du Fer par des populations de la culture des Champs d'urnes. Des habitats celtibères ont aussi été découverts à proximité, et l'occupation se poursuivit jusqu'à l'époque romaine.\n\nAu Cabezo de la Cruz, on a trouvé des céramiques à décor excisé, une technique typique de cette période."},{"h":"À voir","t":"Le parc permet de parcourir les restes des maisons et des sépultures, et depuis le belvédère du Cabezo de Burrén on domine la plaine de la basse Huecha. Au village, le Musée archéologique et Écomusée complète la visite.\n\nDétail curieux : la pierre de la carrière de Burrén servit en 1405 à reconstruire le Puente de Piedra et La Seo de Saragosse."}],"de":[{"h":"Geschichte","t":"Die Fundstätten Burrén, Burrena und Morredón, alle Kulturgüter, belegen die Besiedlung seit der älteren Eisenzeit durch Menschen der Urnenfelderkultur. In der Nähe fand man auch keltiberische Siedlungen, und die Besiedlung reichte bis in römische Zeit.\n\nAm Cabezo de la Cruz kamen Keramiken mit Kerbschnittdekor zutage, einer typischen Technik jener Zeit."},{"h":"Sehenswert","t":"Der Park führt zu den Resten von Häusern und Gräbern, und vom Aussichtspunkt auf dem Cabezo de Burrén überblickt man die Ebene der unteren Huecha. Im Dorf ergänzt das Archäologische Museum und Ökomuseum den Besuch.\n\nKurios: Stein aus dem Steinbruch von Burrén diente 1405 zum Wiederaufbau des Puente de Piedra und der Seo in Saragossa."}],"pt":[{"h":"História","t":"As jazidas de Burrén, Burrena e Morredón, todas Bem de Interesse Cultural, documentam a ocupação do lugar desde a primeira Idade do Ferro, com gentes da cultura dos Campos de Urnas. Perto encontraram-se também povoados celtiberos, e a ocupação prolongou-se até à época romana.\n\nNo Cabezo de la Cruz apareceram cerâmicas excisas, uma técnica decorativa típica dessa época."},{"h":"O que ver","t":"O parque permite percorrer os restos das casas e dos enterramentos, e do miradouro do Cabezo de Burrén domina-se a várzea do baixo Huecha. Na aldeia, o Museu Arqueológico e Ecomuseu completa a visita.\n\nCuriosamente, a pedra da pedreira de Burrén serviu em 1405 para reconstruir a Puente de Piedra e La Seo de Saragoça."}]},"status":"pending"},{"id":"huerta-frescano","town":"Fréscano","cat":"patrimonio","lat":41.87302,"lon":-1.44855,"coord_src":null,"q":["Ermita de Santa María de la Huerta, Fréscano","Fréscano"],"fq":["Ermita Santa María de la Huerta Fréscano","Fréscano ermita"],"name":{"es":"Ermita de Santa María de la Huerta","en":"Ermita de Santa María de la Huerta","fr":"Ermitage Santa María de la Huerta","de":"Ermita de Santa María de la Huerta","pt":"Ermida de Santa María de la Huerta"},"when":{"es":"Románico de transición · Pinturas murales medievales","en":"Transitional Romanesque · Medieval wall paintings","fr":"Roman de transition · Peintures murales médiévales","de":"Übergang Romanik–Gotik · Mittelalterliche Wandmalereien","pt":"Românico de transição · Pinturas murais medievais"},"desc":{"es":"Junto al cementerio de Fréscano, la ermita de Santa María de la Huerta, de transición del románico al gótico, guarda en sus bóvedas un conjunto excepcional de pinturas murales de los siglos XIII y XIV. Es Bien de Interés Cultural desde 2001.","en":"Next to Fréscano cemetery, the hermitage of Santa María de la Huerta, in transition from Romanesque to Gothic, keeps an outstanding set of 13th- and 14th-century wall paintings in its vaults. It has been a Site of Cultural Interest since 2001.","fr":"À côté du cimetière de Fréscano, l'ermitage de Santa María de la Huerta, de transition entre roman et gothique, conserve dans ses voûtes un ensemble exceptionnel de peintures murales des XIIIe et XIVe siècles. Il est Bien d'intérêt culturel depuis 2001.","de":"Neben dem Friedhof von Fréscano bewahrt die Einsiedelei Santa María de la Huerta im Übergang von Romanik zu Gotik in ihren Gewölben herausragende Wandmalereien des 13. und 14. Jahrhunderts. Seit 2001 ist sie Kulturgut.","pt":"Junto ao cemitério de Fréscano, a ermida de Santa María de la Huerta, de transição do românico para o gótico, guarda nas abóbadas um conjunto excecional de pinturas murais dos séculos XIII e XIV. É Bem de Interesse Cultural desde 2001."},"visit":{"es":"Para ver el interior, pregunta en el Ayuntamiento de Fréscano. Se abre en las fiestas de Pascua.","en":"To see the interior, ask at Fréscano town hall. It opens for the Easter festivities.","fr":"Pour voir l'intérieur, renseignez-vous à la mairie de Fréscano. Il ouvre lors des fêtes de Pâques.","de":"Für das Innere im Rathaus von Fréscano fragen. Zu den Osterfesten geöffnet.","pt":"Para ver o interior, pergunte na câmara de Fréscano. Abre nas festas da Páscoa."},"src":"https://es.hispanopedia.com/wiki/Fr%C3%A9scano","sources":["https://es.hispanopedia.com/wiki/Fr%C3%A9scano","https://campodeborja.es/portfolio-item/frescano/"],"art":{"es":[{"h":"Historia","t":"La ermita tiene una sola nave con bóveda de cañón apuntado. En el siglo XVI se reformó y el presbiterio recibió una bóveda estrellada. Fue declarada Bien de Interés Cultural en 2001."},{"h":"Qué ver","t":"Lo más valioso son las pinturas murales de los siglos XIII y XIV, que parecen representar un Pantocrátor con los apóstoles. La comarca las considera un conjunto excepcional.\n\nEn el pueblo, el palacio renacentista de los duques de Villahermosa, de ladrillo y con un gran patio de columnas, está adosado a la iglesia barroca del Pilar, que tiene un retablo mayor del siglo XVII."},{"h":"Tradiciones y fiestas","t":"El Domingo de Resurrección los quintos adornan el pueblo con laurel y la Virgen baja en procesión desde esta ermita a la iglesia del Pilar; allí pasa una semana y vuelve el domingo siguiente. Las fiestas patronales del Pilar son del 12 al 16 de octubre, y el 2 de enero se celebra la Venida de la Virgen."}],"en":[{"h":"History","t":"The hermitage has a single nave with a pointed barrel vault. It was altered in the 16th century, when the chancel received a star vault. It was declared a Site of Cultural Interest in 2001."},{"h":"What to see","t":"The most valuable feature is the 13th- and 14th-century wall paintings, which appear to show a Christ in Majesty with the apostles. The comarca considers them an outstanding ensemble.\n\nIn the village, the Renaissance palace of the Dukes of Villahermosa, in brick and with a large columned courtyard, is joined to the Baroque church of El Pilar, which has a 17th-century high altarpiece."},{"h":"Traditions and festivals","t":"On Easter Sunday the young men of the year decorate the village with laurel and the Virgin is carried in procession from this hermitage to the church of El Pilar; she stays there a week and returns the following Sunday. The patron festivities of El Pilar run from 12 to 16 October, and on 2 January the Venida de la Virgen is celebrated."}],"fr":[{"h":"Histoire","t":"L'ermitage a une seule nef couverte d'un berceau brisé. Il fut remanié au XVIe siècle, lorsque le chœur reçut une voûte étoilée. Il fut déclaré Bien d'intérêt culturel en 2001."},{"h":"À voir","t":"Le plus précieux sont les peintures murales des XIIIe et XIVe siècles, qui semblent représenter un Christ en majesté avec les apôtres. La comarque les considère comme un ensemble exceptionnel.\n\nAu village, le palais Renaissance des ducs de Villahermosa, en brique et doté d'un grand patio à colonnes, est accolé à l'église baroque du Pilar, qui possède un retable majeur du XVIIe siècle."},{"h":"Traditions et fêtes","t":"Le dimanche de Pâques, les conscrits décorent le village de laurier et la Vierge descend en procession de cet ermitage à l'église du Pilar ; elle y passe une semaine et revient le dimanche suivant. Les fêtes patronales du Pilar ont lieu du 12 au 16 octobre, et le 2 janvier on célèbre la Venida de la Virgen."}],"de":[{"h":"Geschichte","t":"Die Einsiedelei hat ein einziges Schiff mit spitzbogigem Tonnengewölbe. Im 16. Jahrhundert wurde sie umgebaut, der Chor erhielt ein Sterngewölbe. 2001 wurde sie zum Kulturgut von besonderem Interesse erklärt."},{"h":"Sehenswert","t":"Am wertvollsten sind die Wandmalereien des 13. und 14. Jahrhunderts, die einen thronenden Christus mit den Aposteln darzustellen scheinen. Die Comarca hält sie für ein herausragendes Ensemble.\n\nIm Dorf grenzt der Renaissancepalast der Herzöge von Villahermosa, aus Backstein und mit großem Säulenhof, an die barocke Kirche El Pilar mit einem Hochaltar aus dem 17. Jahrhundert."},{"h":"Brauchtum und Feste","t":"Am Ostersonntag schmücken die jungen Männer des Jahrgangs das Dorf mit Lorbeer, und die Jungfrau wird in Prozession von dieser Einsiedelei in die Kirche El Pilar getragen; dort bleibt sie eine Woche und kehrt am folgenden Sonntag zurück. Das Patronatsfest El Pilar ist vom 12. bis 16. Oktober, am 2. Januar feiert man die Venida de la Virgen."}],"pt":[{"h":"História","t":"A ermida tem uma só nave com abóbada de berço quebrado. No século XVI foi reformada e o presbitério recebeu uma abóbada estrelada. Foi declarada Bem de Interesse Cultural em 2001."},{"h":"O que ver","t":"O mais valioso são as pinturas murais dos séculos XIII e XIV, que parecem representar um Pantocrator com os apóstolos. A comarca considera-as um conjunto excecional.\n\nNa aldeia, o palácio renascentista dos duques de Villahermosa, de tijolo e com um grande pátio de colunas, está encostado à igreja barroca do Pilar, que tem um retábulo-mor do século XVII."},{"h":"Tradições e festas","t":"No Domingo de Páscoa, os rapazes do ano enfeitam a aldeia com louro e a Virgem desce em procissão desta ermida até à igreja do Pilar; aí passa uma semana e volta no domingo seguinte. As festas do Pilar são de 12 a 16 de outubro, e a 2 de janeiro celebra-se a Venida de la Virgen."}]},"status":"pending"},{"id":"iglesia-fuendejalon","town":"Fuendejalón","cat":"patrimonio","lat":41.76075,"lon":-1.4723,"coord_src":null,"q":["Iglesia de San Juan Bautista, Fuendejalón","Fuendejalón"],"fq":["Category:Fuendejalón","Fuendejalón iglesia"],"name":{"es":"Iglesia de San Juan Bautista","en":"Church of San Juan Bautista","fr":"Église San Juan Bautista","de":"Kirche San Juan Bautista","pt":"Igreja de San Juan Bautista"},"when":{"es":"1567 · Gótico tardío con torre mudéjar","en":"1567 · Late Gothic with Mudéjar tower","fr":"1567 · Gothique tardif à tour mudéjare","de":"1567 · Spätgotik mit Mudéjar-Turm","pt":"1567 · Gótico tardio com torre mudéjar"},"desc":{"es":"La iglesia de San Juan Bautista es de piedra, de gótico tardío, con bóvedas estrelladas y una torre mudéjar de tres cuerpos. Durante siglos perteneció a la Orden de San Juan, cuya cruz de ocho puntas sigue en el escudo del pueblo.","en":"The church of San Juan Bautista is a late Gothic stone building with star vaults and a three-storey Mudéjar tower. For centuries it belonged to the Order of Saint John, whose eight-pointed cross is still on the village's coat of arms.","fr":"L'église San Juan Bautista est un édifice en pierre de gothique tardif, aux voûtes étoilées, avec une tour mudéjare de trois niveaux. Pendant des siècles, elle appartint à l'ordre de Saint-Jean, dont la croix à huit pointes figure toujours sur les armoiries du village.","de":"Die Kirche San Juan Bautista ist ein spätgotischer Steinbau mit Sterngewölben und einem dreigeschossigen Mudéjar-Turm. Jahrhundertelang gehörte sie dem Johanniterorden, dessen achtspitziges Kreuz noch im Ortswappen steht.","pt":"A igreja de San Juan Bautista é de pedra, de gótico tardio, com abóbadas estreladas e uma torre mudéjar de três corpos. Durante séculos pertenceu à Ordem de São João, cuja cruz de oito pontas continua no brasão da aldeia."},"visit":{"es":"Abre en horario de culto. Pertenece al arciprestazgo del Huecha, diócesis de Tarazona.","en":"Open during services. It belongs to the archpriestship of the Huecha, diocese of Tarazona.","fr":"Ouverte aux heures de culte. Elle relève de l'archiprêtré de la Huecha, diocèse de Tarazona.","de":"Zu Gottesdiensten geöffnet. Sie gehört zum Erzpriesteramt Huecha, Bistum Tarazona.","pt":"Abre nas horas de culto. Pertence ao arciprestado do Huecha, diocese de Tarazona."},"src":"https://es.hispanopedia.com/wiki/Fuendejal%C3%B3n","sources":["https://es.hispanopedia.com/wiki/Fuendejal%C3%B3n","https://campodeborja.es/portfolio-item/fuendejalon/"],"art":{"es":[{"h":"Historia","t":"El 29 de junio de 1257 doña Constanza entregó Fuendejalón a Giraldo, castellán de Amposta, y el pueblo pasó a depender de la Orden de San Juan de Jerusalén y de la encomienda de Mallén. De ahí la cruz de ocho puntas del escudo y la bandera.\n\nLa iglesia se construyó en la segunda mitad del siglo XVI; la fecha que se da para su obra es el 19 de agosto de 1567."},{"h":"Qué ver","t":"Es de sillería, con una nave con capillas entre contrafuertes, ábside de medio hexágono y bóveda de crucería estrellada. La torre tiene un cuerpo mudéjar de tres pisos que se estrechan al subir y un chapitel piramidal vidriado.\n\nEl retablo mayor, de finales del XVI, narra la vida de San Juan Bautista, y el templo conserva retablos de los siglos XVI al XVIII."},{"h":"Tradiciones y fiestas","t":"Del 23 al 26 de junio son las fiestas de San Juan; la víspera se colocan las «enramadas» en calles y casas. El primer domingo de julio hay feria de artesanía."}],"en":[{"h":"History","t":"On 29 June 1257 Doña Constanza handed Fuendejalón to Giraldo, castellan of Amposta, and the village came under the Order of Saint John of Jerusalem and the commandery of Mallén. Hence the eight-pointed cross on its coat of arms and flag.\n\nThe church was built in the second half of the 16th century; the date given for the work is 19 August 1567."},{"h":"What to see","t":"It is built of ashlar, with a nave with chapels between the buttresses, a half-hexagonal apse and a star-ribbed vault. The tower has a three-storey Mudéjar section that narrows as it rises and a glazed pyramidal spire.\n\nThe high altarpiece, from the late 16th century, tells the life of Saint John the Baptist, and the church has altarpieces from the 16th to the 18th centuries."},{"h":"Traditions and festivals","t":"From 23 to 26 June are the festivities of San Juan; on the eve, «enramadas», branches and greenery, are hung in the streets and on houses. On the first Sunday of July there is a craft fair."}],"fr":[{"h":"Histoire","t":"Le 29 juin 1257, doña Constanza remit Fuendejalón à Giraldo, châtelain d'Amposta, et le village passa sous la dépendance de l'ordre de Saint-Jean de Jérusalem et de la commanderie de Mallén. D'où la croix à huit pointes de ses armoiries et de son drapeau.\n\nL'église fut construite dans la seconde moitié du XVIe siècle ; la date donnée pour son chantier est le 19 août 1567."},{"h":"À voir","t":"Elle est en pierre de taille, avec une nef bordée de chapelles entre les contreforts, une abside en demi-hexagone et une voûte d'ogives étoilée. La tour comporte un corps mudéjar de trois niveaux en retrait et une flèche pyramidale vernissée.\n\nLe retable majeur, de la fin du XVIe siècle, raconte la vie de saint Jean-Baptiste, et l'église conserve des retables du XVIe au XVIIIe siècle."},{"h":"Traditions et fêtes","t":"Du 23 au 26 juin ont lieu les fêtes de la Saint-Jean ; la veille, on accroche des « enramadas », branchages, dans les rues et aux maisons. Le premier dimanche de juillet se tient une foire artisanale."}],"de":[{"h":"Geschichte","t":"Am 29. Juni 1257 übergab Doña Constanza Fuendejalón an Giraldo, Kastellan von Amposta, und der Ort kam unter den Johanniterorden und die Komturei Mallén. Daher das achtspitzige Kreuz in Wappen und Fahne.\n\nDie Kirche entstand in der zweiten Hälfte des 16. Jahrhunderts; als Baudatum wird der 19. August 1567 genannt."},{"h":"Sehenswert","t":"Sie ist aus Quadersteinen gebaut, mit einem Schiff mit Kapellen zwischen den Strebepfeilern, einer halbsechseckigen Apsis und Sternrippengewölbe. Der Turm hat einen dreigeschossigen Mudéjar-Teil, der sich nach oben verjüngt, und einen glasierten Pyramidenhelm.\n\nDer Hochaltar vom Ende des 16. Jahrhunderts erzählt das Leben Johannes des Täufers; die Kirche hat Altäre aus dem 16. bis 18. Jahrhundert."},{"h":"Brauchtum und Feste","t":"Vom 23. bis 26. Juni wird San Juan gefeiert; am Vorabend hängt man „enramadas“, Zweige und Grün, in Straßen und an Häusern auf. Am ersten Sonntag im Juli gibt es einen Handwerksmarkt."}],"pt":[{"h":"História","t":"A 29 de junho de 1257, D. Constança entregou Fuendejalón a Giraldo, castelão de Amposta, e a aldeia passou a depender da Ordem de São João de Jerusalém e da comenda de Mallén. Daí a cruz de oito pontas do brasão e da bandeira.\n\nA igreja foi construída na segunda metade do século XVI; a data apontada para a obra é 19 de agosto de 1567."},{"h":"O que ver","t":"É de cantaria, com uma nave com capelas entre contrafortes, abside de meio hexágono e abóbada de nervuras estrelada. A torre tem um corpo mudéjar de três pisos que se estreitam ao subir e um coruchéu piramidal vidrado.\n\nO retábulo-mor, de finais do século XVI, narra a vida de São João Batista, e o templo conserva retábulos dos séculos XVI a XVIII."},{"h":"Tradições e festas","t":"De 23 a 26 de junho são as festas de São João; na véspera colocam-se as «enramadas» nas ruas e nas casas. No primeiro domingo de julho há feira de artesanato."}]},"status":"pending"},{"id":"virgen-castillo-fuendejalon","town":"Fuendejalón","cat":"patrimonio","lat":41.76135,"lon":-1.4727,"coord_src":null,"q":["Ermita de la Virgen del Castillo, Fuendejalón","Fuendejalón"],"fq":["Ermita Virgen del Castillo Fuendejalón","Fuendejalón ermita"],"name":{"es":"Ermita de la Virgen del Castillo","en":"Ermita de la Virgen del Castillo","fr":"Ermitage de la Virgen del Castillo","de":"Ermita de la Virgen del Castillo","pt":"Ermida da Virgen del Castillo"},"when":{"es":"Finales del siglo XVIII · Sobre el antiguo castillo","en":"Late 18th century · On the old castle site","fr":"Fin du XVIIIe siècle · Sur l'ancien château","de":"Ende 18. Jh. · Auf der alten Burg","pt":"Finais do séc. XVIII · Sobre o antigo castelo"},"desc":{"es":"Sobre un macizo rocoso en pleno casco urbano, donde estuvo la fortaleza, se alza la ermita de la Virgen del Castillo, con una torre alta y esbelta y una Virgen románica del siglo XIII.","en":"On a rocky outcrop in the middle of the village, where the fortress once stood, rises the hermitage of the Virgen del Castillo, with a tall, slender tower and a 13th-century Romanesque Virgin.","fr":"Sur un éperon rocheux en plein village, là où se dressait la forteresse, s'élève l'ermitage de la Virgen del Castillo, avec une tour haute et élancée et une Vierge romane du XIIIe siècle.","de":"Auf einem Felsen mitten im Dorf, wo die Festung stand, erhebt sich die Einsiedelei der Virgen del Castillo mit hohem, schlankem Turm und einer romanischen Madonna aus dem 13. Jahrhundert.","pt":"Sobre um maciço rochoso em pleno centro, onde esteve a fortaleza, ergue-se a ermida da Virgen del Castillo, com uma torre alta e esbelta e uma Virgem românica do século XIII."},"visit":{"es":"Se sube a pie desde el centro. El interior abre en fiestas y en horario de culto.","en":"Walk up from the centre. The interior opens at festivals and during services.","fr":"On y monte à pied depuis le centre. L'intérieur ouvre lors des fêtes et aux heures de culte.","de":"Zu Fuß vom Zentrum. Das Innere öffnet an Festtagen und zu Gottesdiensten.","pt":"Sobe-se a pé desde o centro. O interior abre nas festas e nas horas de culto."},"src":"https://es.hispanopedia.com/wiki/Fuendejal%C3%B3n","sources":["https://es.hispanopedia.com/wiki/Fuendejal%C3%B3n","https://campodeborja.es/portfolio-item/fuendejalon/"],"art":{"es":[{"h":"Historia","t":"La ermita se construyó a finales del siglo XVIII sobre las ruinas de una antigua fortaleza. Guarda una Virgen sedente con el Niño, románica del siglo XIII, patrona de Fuendejalón."},{"h":"Qué ver","t":"Tiene planta de cruz latina, tres naves separadas por pilastras y bóveda de lunetos. En la cúpula del crucero, recién restaurada, se pintaron la gloria y coronación de la Virgen, con santos en las pechinas.\n\nFuera, la torre remata en un chapitel clásico muy agudo. Desde la roca se ve todo el pueblo y el llano de Plasencia."},{"h":"Tradiciones y fiestas","t":"Las fiestas mayores en honor a la Virgen del Castillo son a finales de mayo. El cuarto domingo de octubre, en las Fiestas de los Mozos, cinco jóvenes llevan el estandarte y la peana de la Virgen en procesión."}],"en":[{"h":"History","t":"The hermitage was built at the end of the 18th century on the ruins of an old fortress. It keeps a seated Romanesque Virgin and Child from the 13th century, patron of Fuendejalón."},{"h":"What to see","t":"It has a Latin-cross plan, three naves separated by pilasters and a vault with lunettes. In the recently restored crossing dome, the glory and coronation of the Virgin are painted, with saints on the pendentives.\n\nOutside, the tower ends in a very sharp classical spire. From the rock you see the whole village and the Plasencia plain."},{"h":"Traditions and festivals","t":"The main festivities in honour of the Virgen del Castillo are at the end of May. On the fourth Sunday of October, at the Fiestas de los Mozos, five young men carry the banner and the Virgin's pedestal in procession."}],"fr":[{"h":"Histoire","t":"L'ermitage fut construit à la fin du XVIIIe siècle sur les ruines d'une ancienne forteresse. Il conserve une Vierge assise à l'Enfant, romane du XIIIe siècle, patronne de Fuendejalón."},{"h":"À voir","t":"Il a un plan en croix latine, trois nefs séparées par des pilastres et une voûte à lunettes. Dans la coupole de la croisée, récemment restaurée, sont peints la gloire et le couronnement de la Vierge, avec des saints sur les pendentifs.\n\nÀ l'extérieur, la tour se termine par une flèche classique très aiguë. Depuis le rocher, on voit tout le village et la plaine de Plasencia."},{"h":"Traditions et fêtes","t":"Les grandes fêtes en l'honneur de la Virgen del Castillo ont lieu fin mai. Le quatrième dimanche d'octobre, aux Fiestas de los Mozos, cinq jeunes gens portent la bannière et le socle de la Vierge en procession."}],"de":[{"h":"Geschichte","t":"Die Einsiedelei wurde Ende des 18. Jahrhunderts auf den Ruinen einer alten Festung erbaut. Sie bewahrt eine sitzende romanische Madonna mit Kind aus dem 13. Jahrhundert, die Patronin von Fuendejalón."},{"h":"Sehenswert","t":"Sie hat einen lateinischen Kreuzgrundriss, drei durch Pfeiler getrennte Schiffe und ein Stichkappengewölbe. In der kürzlich restaurierten Vierungskuppel sind Glorie und Krönung Mariens gemalt, mit Heiligen in den Pendentifs.\n\nAußen endet der Turm in einem sehr spitzen klassischen Helm. Vom Felsen aus sieht man das ganze Dorf und die Ebene von Plasencia."},{"h":"Brauchtum und Feste","t":"Die Hauptfeste zu Ehren der Virgen del Castillo sind Ende Mai. Am vierten Sonntag im Oktober, bei den Fiestas de los Mozos, tragen fünf junge Männer Banner und Sockel der Jungfrau in Prozession."}],"pt":[{"h":"História","t":"A ermida foi construída no fim do século XVIII sobre as ruínas de uma antiga fortaleza. Guarda uma Virgem sentada com o Menino, românica do século XIII, padroeira de Fuendejalón."},{"h":"O que ver","t":"Tem planta de cruz latina, três naves separadas por pilastras e abóbada de lunetas. Na cúpula do cruzeiro, recentemente restaurada, pintaram-se a glória e coroação da Virgem, com santos nos pendentes.\n\nPor fora, a torre remata num coruchéu clássico muito agudo. Da rocha vê-se toda a aldeia e a planície de Plasencia."},{"h":"Tradições e festas","t":"As festas maiores em honra da Virgen del Castillo são no fim de maio. No quarto domingo de outubro, nas Fiestas de los Mozos, cinco rapazes levam o estandarte e o andor da Virgem em procissão."}]},"status":"pending"},{"id":"museo-churro","town":"Fuendejalón","cat":"museo","lat":41.75988,"lon":-1.47024,"coord_src":null,"q":["Museo El Churro, Fuendejalón","Bodega El Churro"],"fq":["Fuendejalón bodega","Fuendejalón"],"name":{"es":"Museo-bodega El Churro","en":"El Churro cellar museum","fr":"Cave-musée El Churro","de":"Keller-Museum El Churro","pt":"Museu-adega El Churro"},"when":{"es":"Bodega y museo del jotero Ángel «el Churro»","en":"Cellar and museum of the jota singer «el Churro»","fr":"Cave et musée du chanteur de jota « el Churro »","de":"Keller und Museum des Jota-Sängers „el Churro“","pt":"Adega e museu do cantor de jota «el Churro»"},"desc":{"es":"Fuendejalón es pueblo de vino y de jota. La bodega del legendario jotero Ángel «el Churro» se ha convertido en un museo con una cepa de garnacha de 1896, herramientas, una cocina aragonesa y una máquina de cine de los años veinte.","en":"Fuendejalón is a village of wine and jota. The cellar of the legendary jota singer Ángel «el Churro» has become a museum with a Garnacha vine from 1896, tools, an Aragonese kitchen and a 1920s film projector.","fr":"Fuendejalón est un village de vin et de jota. La cave du légendaire chanteur de jota Ángel « el Churro » est devenue un musée avec un cep de grenache de 1896, des outils, une cuisine aragonaise et un projecteur de cinéma des années 1920.","de":"Fuendejalón ist ein Dorf des Weins und der Jota. Der Keller des legendären Jota-Sängers Ángel „el Churro“ ist heute ein Museum mit einem Garnacha-Rebstock von 1896, Werkzeugen, einer aragonesischen Küche und einem Filmprojektor der 1920er-Jahre.","pt":"Fuendejalón é terra de vinho e de jota. A adega do lendário cantor de jota Ángel «el Churro» é hoje um museu com uma cepa de garnacha de 1896, ferramentas, uma cozinha aragonesa e um projetor de cinema dos anos 1920."},"visit":{"es":"Pregunta horario y visitas en el Ayuntamiento de Fuendejalón o en la oficina comarcal (976 852 858).","en":"Ask about opening times and visits at Fuendejalón town hall or the comarca office (976 852 858).","fr":"Renseignez-vous sur les horaires et les visites à la mairie de Fuendejalón ou au bureau de la comarque (976 852 858).","de":"Zeiten und Besuche im Rathaus von Fuendejalón oder im Büro der Comarca (976 852 858) erfragen.","pt":"Pergunte horários e visitas na câmara de Fuendejalón ou no gabinete da comarca (976 852 858)."},"src":"https://es.hispanopedia.com/wiki/Fuendejal%C3%B3n","sources":["https://es.hispanopedia.com/wiki/Fuendejal%C3%B3n","https://campodeborja.es/portfolio-item/fuendejalon/","https://campodeborja.es/wp-content/uploads/2024/03/Folleto-Campo-de-Borja-_EN_2024_v1.pdf"],"art":{"es":[{"h":"Qué ver","t":"El museo explica la elaboración del vino y conserva una cepa de garnacha negra de 1896. Hay herramientas antiguas del campo y maquinaria, la recreación de una cocina aragonesa, radios y discos antiguos y una máquina de cine de la década de 1920.\n\nBajo el pueblo hay muchas bodegas subterráneas donde se cría el vino; la de El Churro es la más conocida."},{"h":"Historia","t":"Fuendejalón ha dado grandes voces de la jota, como Joaquín Rodríguez, Lorenzo Navascués, Genaro Domínguez y Ángel «el Churro». El pueblo dedica un monumento a sus joteros y organiza un certamen cada año.\n\nEn septiembre de 1936 fue fusilada aquí María Domínguez, exalcaldesa de Gallur, una de las primeras mujeres alcaldesas de España; está enterrada en el pueblo."},{"h":"Para entenderlo","t":"El vino es la principal fuente de ingresos del pueblo y sus caldos forman parte de la Denominación de Origen Campo de Borja. Bodegas Aragonesas, en el término, ofrece visitas."}],"en":[{"h":"What to see","t":"The museum explains how wine is made and keeps a black Garnacha vine from 1896. There are old farm tools and machinery, a reconstructed Aragonese kitchen, old radios and records and a film projector from the 1920s.\n\nBeneath the village are many underground cellars where wine is aged; El Churro's is the best known."},{"h":"History","t":"Fuendejalón has produced great jota singers, such as Joaquín Rodríguez, Lorenzo Navascués, Genaro Domínguez and Ángel «el Churro». The village has a monument to its singers and holds a contest every year.\n\nIn September 1936 María Domínguez, former mayor of Gallur and one of Spain's first women mayors, was shot here; she is buried in the village."},{"h":"Background","t":"Wine is the village's main source of income and its wines belong to the Campo de Borja Designation of Origin. Bodegas Aragonesas, in the municipality, offers visits."}],"fr":[{"h":"À voir","t":"Le musée explique l'élaboration du vin et conserve un cep de grenache noir de 1896. On y voit d'anciens outils agricoles et des machines, la reconstitution d'une cuisine aragonaise, des radios et des disques anciens et un projecteur de cinéma des années 1920.\n\nSous le village se trouvent de nombreuses caves souterraines où vieillit le vin ; celle d'El Churro est la plus connue."},{"h":"Histoire","t":"Fuendejalón a donné de grandes voix de la jota, comme Joaquín Rodríguez, Lorenzo Navascués, Genaro Domínguez et Ángel « el Churro ». Le village dédie un monument à ses chanteurs et organise un concours chaque année.\n\nEn septembre 1936, María Domínguez, ancienne maire de Gallur et l'une des premières femmes maires d'Espagne, fut fusillée ici ; elle est enterrée au village."},{"h":"Pour comprendre","t":"Le vin est la principale source de revenus du village et ses vins relèvent de l'Appellation d'origine Campo de Borja. Bodegas Aragonesas, sur la commune, propose des visites."}],"de":[{"h":"Sehenswert","t":"Das Museum erklärt die Weinbereitung und bewahrt einen schwarzen Garnacha-Rebstock von 1896. Es gibt alte Landwirtschaftsgeräte und Maschinen, die Nachbildung einer aragonesischen Küche, alte Radios und Schallplatten und einen Filmprojektor aus den 1920er-Jahren.\n\nUnter dem Dorf liegen viele unterirdische Keller, in denen Wein reift; der von El Churro ist der bekannteste."},{"h":"Geschichte","t":"Fuendejalón brachte große Jota-Stimmen hervor, etwa Joaquín Rodríguez, Lorenzo Navascués, Genaro Domínguez und Ángel „el Churro“. Das Dorf widmet seinen Sängern ein Denkmal und veranstaltet jedes Jahr einen Wettbewerb.\n\nIm September 1936 wurde hier María Domínguez erschossen, ehemalige Bürgermeisterin von Gallur und eine der ersten Bürgermeisterinnen Spaniens; sie ist im Dorf begraben."},{"h":"Hintergrund","t":"Der Wein ist die wichtigste Einnahmequelle des Dorfes, seine Weine gehören zur Herkunftsbezeichnung Campo de Borja. Bodegas Aragonesas in der Gemeinde bietet Besichtigungen an."}],"pt":[{"h":"O que ver","t":"O museu explica a elaboração do vinho e conserva uma cepa de garnacha tinta de 1896. Há ferramentas agrícolas antigas e maquinaria, a recriação de uma cozinha aragonesa, rádios e discos antigos e um projetor de cinema da década de 1920.\n\nDebaixo da aldeia há muitas adegas subterrâneas onde o vinho estagia; a de El Churro é a mais conhecida."},{"h":"História","t":"Fuendejalón deu grandes vozes da jota, como Joaquín Rodríguez, Lorenzo Navascués, Genaro Domínguez e Ángel «el Churro». A aldeia dedica um monumento aos seus cantores e organiza um concurso todos os anos.\n\nEm setembro de 1936 foi fuzilada aqui María Domínguez, ex-presidente da câmara de Gallur e uma das primeiras mulheres presidentes de câmara em Espanha; está sepultada na aldeia."},{"h":"Para compreender","t":"O vinho é a principal fonte de rendimento da aldeia e os seus vinhos fazem parte da Denominação de Origem Campo de Borja. A Bodegas Aragonesas, no município, oferece visitas."}]},"status":"pending"},{"id":"san-lorenzo-magallon","town":"Magallón","cat":"patrimonio","lat":41.83406,"lon":-1.46082,"coord_src":null,"q":["Iglesia de San Lorenzo, Magallón","Magallón"],"fq":["Category:Iglesia de San Lorenzo (Magallón)","Magallón San Lorenzo"],"name":{"es":"Iglesia de San Lorenzo","en":"Church of San Lorenzo","fr":"Église San Lorenzo","de":"Kirche San Lorenzo","pt":"Igreja de San Lorenzo"},"when":{"es":"1533-1609 · Iglesia de salón sobre el castillo","en":"1533–1609 · Hall church on the castle site","fr":"1533-1609 · Église-halle sur le château","de":"1533–1609 · Hallenkirche auf der Burg","pt":"1533-1609 · Igreja-salão sobre o castelo"},"desc":{"es":"La iglesia de San Lorenzo, gótica tardía, se levantó con la piedra del castillo, cuya torre del homenaje es hoy su campanario. Tiene el altar mayor al oeste y un muro norte sin ventanas por el cierzo.","en":"The late Gothic church of San Lorenzo was built with stone from the castle, whose keep is now its bell tower. Its high altar faces west and its north wall has no windows because of the cierzo wind.","fr":"L'église San Lorenzo, de gothique tardif, fut bâtie avec la pierre du château, dont le donjon sert aujourd'hui de clocher. Son autel majeur est à l'ouest et son mur nord n'a pas de fenêtres à cause du cierzo.","de":"Die spätgotische Kirche San Lorenzo wurde mit Steinen der Burg gebaut, deren Bergfried heute Glockenturm ist. Ihr Hochaltar steht im Westen, und die Nordwand hat wegen des Cierzo-Windes keine Fenster.","pt":"A igreja de San Lorenzo, de gótico tardio, foi erguida com a pedra do castelo, cuja torre de menagem é hoje o campanário. Tem o altar-mor a oeste e a parede norte sem janelas por causa do cierzo."},"visit":{"es":"Abre en horario de culto. La platería litúrgica se guarda bajo custodia y no está expuesta.","en":"Open during services. The liturgical silverware is kept in safe custody and is not on display.","fr":"Ouverte aux heures de culte. L'orfèvrerie liturgique est gardée en lieu sûr et n'est pas exposée.","de":"Zu Gottesdiensten geöffnet. Das liturgische Silber wird verwahrt und ist nicht ausgestellt.","pt":"Abre nas horas de culto. A prataria litúrgica está guardada em custódia e não se expõe."},"src":"https://es.hispanopedia.com/wiki/Magall%C3%B3n","sources":["https://es.hispanopedia.com/wiki/Magall%C3%B3n","https://campodeborja.es/portfolio-item/magallon/"],"art":{"es":[{"h":"Historia","t":"El castillo de Magallón se construyó probablemente entre 1130 y 1200 y fue destruido en 1369, durante la guerra de los dos Pedros. Solo sobrevive la torre del homenaje, que hace de campanario.\n\nLa iglesia se empezó en 1533, con piedra trabajada por canteros de Pozuelo de Aragón, y se bendijo en 1609."},{"h":"Qué ver","t":"Es una iglesia de salón, de una nave con pilares cilíndricos, bóvedas de crucería y cabecera de cinco lados. El altar mayor está al oeste, al revés de lo habitual, y el muro norte no tiene ventanas para protegerse del cierzo.\n\nEl retablo mayor es barroco, con columnas salomónicas y pinturas de Vicente Berdusán. Hay una pila bautismal de cerámica de Muel fechada en 1783, otra de mármol de 1768 y un órgano de 1805. En 1985 se descubrió un osario bajo el templo."},{"h":"Tradiciones y fiestas","t":"Magallón celebra San Lorenzo el 10 de agosto y la Santa Cruz el 14 de septiembre. El último sábado de mayo sube en romería a la ermita de San Sebastián de la Loteta, del siglo XVII, junto al embalse."}],"en":[{"h":"History","t":"Magallón castle was probably built between 1130 and 1200 and was destroyed in 1369, during the War of the Two Peters. Only the keep survives, now serving as the bell tower.\n\nThe church was begun in 1533, with stone worked by masons from Pozuelo de Aragón, and was blessed in 1609."},{"h":"What
