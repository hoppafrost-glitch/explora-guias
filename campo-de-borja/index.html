to see","t":"It is a hall church, with a single nave on cylindrical piers, rib vaults and a five-sided apse. The high altar is at the west end, the opposite of the usual arrangement, and the north wall has no windows as protection from the cierzo.\n\nThe Baroque high altarpiece has Solomonic columns and paintings by Vicente Berdusán. There is a Muel ceramic font dated 1783, a marble font from 1768 and an organ from 1805. In 1985 an ossuary was discovered beneath the church."},{"h":"Traditions and festivals","t":"Magallón celebrates San Lorenzo on 10 August and the Holy Cross on 14 September. On the last Saturday of May it goes on pilgrimage to the 17th-century hermitage of San Sebastián de la Loteta, next to the reservoir."}],"fr":[{"h":"Histoire","t":"Le château de Magallón fut probablement construit entre 1130 et 1200 et détruit en 1369, pendant la guerre des Deux Pierre. Seul subsiste le donjon, qui sert de clocher.\n\nL'église fut commencée en 1533, avec de la pierre taillée par des tailleurs de Pozuelo de Aragón, et bénie en 1609."},{"h":"À voir","t":"C'est une église-halle, à une nef sur piliers cylindriques, voûtes d'ogives et chevet à cinq pans. L'autel majeur est à l'ouest, à l'inverse de l'usage, et le mur nord n'a pas de fenêtres pour se protéger du cierzo.\n\nLe retable majeur est baroque, avec des colonnes torses et des peintures de Vicente Berdusán. On y voit des fonts baptismaux en céramique de Muel datés de 1783, d'autres en marbre de 1768 et un orgue de 1805. En 1985, on découvrit un ossuaire sous l'église."},{"h":"Traditions et fêtes","t":"Magallón célèbre San Lorenzo le 10 août et la Sainte-Croix le 14 septembre. Le dernier samedi de mai, il monte en pèlerinage à l'ermitage San Sebastián de la Loteta, du XVIIe siècle, près du réservoir."}],"de":[{"h":"Geschichte","t":"Die Burg von Magallón entstand vermutlich zwischen 1130 und 1200 und wurde 1369 im Krieg der zwei Peter zerstört. Erhalten ist nur der Bergfried, der als Glockenturm dient.\n\nDie Kirche wurde 1533 begonnen, mit Steinen, die Steinmetze aus Pozuelo de Aragón bearbeiteten, und 1609 geweiht."},{"h":"Sehenswert","t":"Es ist eine Hallenkirche mit einem Schiff auf Rundpfeilern, Rippengewölben und fünfseitiger Apsis. Der Hochaltar steht im Westen, umgekehrt als üblich, und die Nordwand hat zum Schutz vor dem Cierzo keine Fenster.\n\nDer barocke Hochaltar hat gedrehte Säulen und Gemälde von Vicente Berdusán. Es gibt ein Keramiktaufbecken aus Muel von 1783, eines aus Marmor von 1768 und eine Orgel von 1805. 1985 entdeckte man unter der Kirche ein Beinhaus."},{"h":"Brauchtum und Feste","t":"Magallón feiert San Lorenzo am 10. August und das Heilige Kreuz am 14. September. Am letzten Samstag im Mai pilgert man zur Einsiedelei San Sebastián de la Loteta aus dem 17. Jahrhundert am Stausee."}],"pt":[{"h":"História","t":"O castelo de Magallón foi construído provavelmente entre 1130 e 1200 e destruído em 1369, na guerra dos Dois Pedros. Só sobrevive a torre de menagem, que serve de campanário.\n\nA igreja começou-se em 1533, com pedra trabalhada por canteiros de Pozuelo de Aragón, e foi benzida em 1609."},{"h":"O que ver","t":"É uma igreja-salão, de uma nave com pilares cilíndricos, abóbadas de nervuras e cabeceira de cinco lados. O altar-mor fica a oeste, ao contrário do habitual, e a parede norte não tem janelas para se proteger do cierzo.\n\nO retábulo-mor é barroco, com colunas salomónicas e pinturas de Vicente Berdusán. Há uma pia batismal de cerâmica de Muel datada de 1783, outra de mármore de 1768 e um órgão de 1805. Em 1985 descobriu-se um ossário debaixo do templo."},{"h":"Tradições e festas","t":"Magallón celebra San Lorenzo a 10 de agosto e a Santa Cruz a 14 de setembro. No último sábado de maio sobe em romaria à ermida de San Sebastián de la Loteta, do século XVII, junto à albufeira."}]},"status":"pending"},{"id":"huerta-magallon","town":"Magallón","cat":"patrimonio","lat":41.83436,"lon":-1.45772,"coord_src":null,"q":["Santa María de la Huerta, Magallón","Convento de los Dominicos, Magallón"],"fq":["Category:Iglesia de Santa María de la Huerta (Magallón)","Magallón Santa María de la Huerta"],"name":{"es":"Santa María de la Huerta y convento de los Dominicos","en":"Santa María de la Huerta and the Dominican convent","fr":"Santa María de la Huerta et couvent dominicain","de":"Santa María de la Huerta und Dominikanerkloster","pt":"Santa María de la Huerta e convento dos Dominicanos"},"when":{"es":"Desde 1350 · Mudéjar con ábside de siete lados","en":"From 1350 · Mudéjar with a seven-sided apse","fr":"Dès 1350 · Mudéjar à abside heptagonale","de":"Ab 1350 · Mudéjar mit siebenseitiger Apsis","pt":"Desde 1350 · Mudéjar com abside de sete lados"},"desc":{"es":"Santa María de la Huerta es una iglesia mudéjar en ruinas, Bien de Interés Cultural, con un ábside de siete lados: Aragón solo tiene dos así. Junto a ella, el antiguo convento de los Dominicos es hoy Casa de Cultura.","en":"Santa María de la Huerta is a ruined Mudéjar church, a Site of Cultural Interest, with a seven-sided apse: Aragon has only two like it. Next to it, the former Dominican convent is now the House of Culture.","fr":"Santa María de la Huerta est une église mudéjare en ruine, Bien d'intérêt culturel, à l'abside à sept pans : l'Aragon n'en compte que deux de ce type. À côté, l'ancien couvent des Dominicains est aujourd'hui la Maison de la culture.","de":"Santa María de la Huerta ist eine Mudéjar-Kirchenruine, Kulturgut, mit siebenseitiger Apsis: Aragonien hat nur zwei davon. Daneben ist das ehemalige Dominikanerkloster heute Kulturhaus.","pt":"Santa María de la Huerta é uma igreja mudéjar em ruínas, Bem de Interesse Cultural, com uma abside de sete lados: Aragão só tem duas assim. Ao lado, o antigo convento dos Dominicanos é hoje Casa da Cultura."},"visit":{"es":"Hoy funciona como Auditorio Ramón Salvador; se ve por dentro en los actos que acoge. Pregunta en el Ayuntamiento.","en":"It now serves as the Auditorio Ramón Salvador; you can see the inside during events. Ask at the town hall.","fr":"Elle sert aujourd'hui d'Auditorio Ramón Salvador ; on peut voir l'intérieur lors des manifestations. Renseignez-vous à la mairie.","de":"Heute als Auditorio Ramón Salvador genutzt; bei Veranstaltungen von innen zu sehen. Im Rathaus fragen.","pt":"Funciona hoje como Auditorio Ramón Salvador; vê-se por dentro nos eventos que acolhe. Pergunte na câmara."},"src":"https://es.hispanopedia.com/wiki/Magall%C3%B3n","sources":["https://es.hispanopedia.com/wiki/Magall%C3%B3n","https://campodeborja.es/portfolio-item/magallon/","https://campodeborja.es/wp-content/uploads/2024/03/Folleto-Campo-de-Borja-_EN_2024_v1.pdf"],"art":{"es":[{"h":"Historia","t":"Las obras empezaron en 1350 sobre una ermita en la que, según la tradición, Jaime I descansó y rezó en agosto de 1257. Se conservan el ábside, dos torres, las torrecillas de escalera, los contrafuertes, los muros y restos de esgrafiados.\n\nEl convento de los Dominicos se construyó en 1612 y hoy acoge la Casa de Cultura y el Ayuntamiento."},{"h":"Qué ver","t":"Fíjate en el ábside de siete lados, con rasgos de influencia levantina. Aunque está en ruinas y sin cubierta en parte, la comarca destaca que conserva su belleza.\n\nEn la plaza de España, porticada, está la ermita barroca de Nuestra Señora del Rosario, de 1641 y ampliada a mediados del XVIII, que guarda al Santo Cristo patrón."},{"h":"Para entenderlo","t":"Magallón fue asentamiento ibérico, la Caravis romana, ciudad musulmana desde 714 hasta 1119 y villa real desde 1430. Tuvo comunidades judía y musulmana; el cementerio islámico de El Quez, en el término vecino de Alberite, da idea de su tamaño. Cerca del pueblo hay un puente de origen romano sobre el Huecha, el de Fornoles, muy modificado."}],"en":[{"h":"History","t":"Work began in 1350 on the site of a hermitage where, according to tradition, James I rested and prayed in August 1257. The apse, two towers, the stair turrets, buttresses, walls and traces of sgraffito survive.\n\nThe Dominican convent was built in 1612 and now houses the House of Culture and the town hall."},{"h":"What to see","t":"Look at the seven-sided apse, with features showing influence from the Levant. Although partly roofless and ruined, the comarca stresses that it keeps its beauty.\n\nIn the arcaded Plaza de España stands the Baroque hermitage of Nuestra Señora del Rosario, from 1641 and enlarged in the mid-18th century, which keeps the patron Santo Cristo."},{"h":"Background","t":"Magallón was an Iberian settlement, the Roman Caravis, a Muslim town from 714 to 1119 and a royal town from 1430. It had Jewish and Muslim communities; the Islamic cemetery of El Quez, in neighbouring Alberite, gives an idea of their size. Near the village is the Fornoles bridge over the Huecha, of Roman origin and much altered."}],"fr":[{"h":"Histoire","t":"Les travaux commencèrent en 1350 sur un ermitage où, selon la tradition, Jacques Ier se reposa et pria en août 1257. Il en subsiste l'abside, deux tours, les tourelles d'escalier, les contreforts, les murs et des restes de sgraffites.\n\nLe couvent des Dominicains fut construit en 1612 et abrite aujourd'hui la Maison de la culture et la mairie."},{"h":"À voir","t":"Observez l'abside à sept pans, aux traits d'influence levantine. Bien qu'en ruine et en partie sans toiture, la comarque souligne qu'elle a gardé sa beauté.\n\nSur la Plaza de España à arcades se dresse l'ermitage baroque Nuestra Señora del Rosario, de 1641 et agrandi au milieu du XVIIIe siècle, qui abrite le Santo Cristo patron."},{"h":"Pour comprendre","t":"Magallón fut un habitat ibère, la Caravis romaine, une ville musulmane de 714 à 1119 et une ville royale à partir de 1430. Elle eut des communautés juive et musulmane ; le cimetière islamique d'El Quez, sur la commune voisine d'Alberite, donne une idée de leur importance. Près du village se trouve le pont de Fornoles sur la Huecha, d'origine romaine et très remanié."}],"de":[{"h":"Geschichte","t":"1350 begann der Bau über einer Einsiedelei, in der der Überlieferung nach Jakob I. im August 1257 rastete und betete. Erhalten sind Apsis, zwei Türme, Treppentürmchen, Strebepfeiler, Mauern und Reste von Sgraffiti.\n\nDas Dominikanerkloster entstand 1612 und beherbergt heute Kulturhaus und Rathaus."},{"h":"Sehenswert","t":"Achten Sie auf die siebenseitige Apsis mit levantinischen Einflüssen. Obwohl teils ohne Dach und verfallen, hebt die Comarca hervor, dass sie ihre Schönheit bewahrt hat.\n\nAn der Laubenplaza de España steht die barocke Einsiedelei Nuestra Señora del Rosario von 1641, Mitte des 18. Jahrhunderts erweitert, mit dem Santo Cristo, dem Schutzpatron."},{"h":"Hintergrund","t":"Magallón war iberische Siedlung, das römische Caravis, muslimische Stadt von 714 bis 1119 und ab 1430 königliche Stadt. Es hatte jüdische und muslimische Gemeinden; der islamische Friedhof El Quez im benachbarten Alberite zeigt ihre Größe. Nahe dem Dorf steht die Brücke von Fornoles über die Huecha, römischen Ursprungs und stark verändert."}],"pt":[{"h":"História","t":"As obras começaram em 1350 sobre uma ermida onde, segundo a tradição, Jaime I descansou e rezou em agosto de 1257. Conservam-se a abside, duas torres, os torreões de escada, os contrafortes, os muros e restos de esgrafitos.\n\nO convento dos Dominicanos foi construído em 1612 e acolhe hoje a Casa da Cultura e a câmara."},{"h":"O que ver","t":"Repare na abside de sete lados, com traços de influência levantina. Embora em ruínas e em parte sem cobertura, a comarca sublinha que conserva a sua beleza.\n\nNa Plaza de España, com arcadas, fica a ermida barroca de Nuestra Señora del Rosario, de 1641 e ampliada em meados do século XVIII, que guarda o Santo Cristo padroeiro."},{"h":"Para compreender","t":"Magallón foi povoado ibérico, a Caravis romana, cidade muçulmana de 714 a 1119 e vila real desde 1430. Teve comunidades judaica e muçulmana; o cemitério islâmico de El Quez, no município vizinho de Alberite, dá ideia da sua dimensão. Perto da aldeia fica a ponte de Fornoles sobre o Huecha, de origem romana e muito modificada."}]},"status":"pending"},{"id":"malejan","town":"Maleján","cat":"patrimonio","lat":41.82737,"lon":-1.54939,"coord_src":null,"q":["Iglesia de la Visitación, Maleján","Maleján"],"fq":["Category:Maleján","Maleján"],"name":{"es":"Maleján: almunia, castillo y la Visitación","en":"Maleján: almunia, castle and La Visitación","fr":"Maleján : almunia, château et la Visitación","de":"Maleján: Almunia, Burg und La Visitación","pt":"Maleján: almunia, castelo e a Visitación"},"when":{"es":"Almunia de la taifa de Zaragoza · Iglesia del siglo XVI","en":"Almunia of the taifa of Zaragoza · 16th-century church","fr":"Almunia de la taïfa de Saragosse · Église du XVIe s.","de":"Almunia der Taifa von Saragossa · Kirche 16. Jh.","pt":"Almunia da taifa de Saragoça · Igreja do séc. XVI"},"desc":{"es":"Un rey de la taifa de Zaragoza mandó construir en Maleján una almunia, una finca de recreo. Aún quedan restos de la mezquita, un arco y torres de la fortaleza, junto a la pequeña iglesia de la Visitación.","en":"A king of the taifa of Zaragoza had an almunia, a country estate, built in Maleján. Remains of the mosque, an arch and towers of the fortress still survive, next to the small church of La Visitación.","fr":"Un roi de la taïfa de Saragosse fit construire à Maleján une almunia, un domaine d'agrément. Il reste des vestiges de la mosquée, un arc et des tours de la forteresse, à côté de la petite église de la Visitación.","de":"Ein König der Taifa von Saragossa ließ in Maleján eine Almunia, ein Landgut, errichten. Erhalten sind Reste der Moschee, ein Bogen und Türme der Festung, neben der kleinen Kirche La Visitación.","pt":"Um rei da taifa de Saragoça mandou construir em Maleján uma almunia, uma quinta de recreio. Restam vestígios da mesquita, um arco e torres da fortaleza, junto à pequena igreja da Visitación."},"visit":{"es":"Paseo libre por el casco. El museo «La Fuente del Molino» está en el pueblo; pregunta en el Ayuntamiento.","en":"Free stroll through the village. The «La Fuente del Molino» museum is in the village; ask at the town hall.","fr":"Promenade libre dans le village. Le musée « La Fuente del Molino » se trouve au village ; renseignez-vous à la mairie.","de":"Freier Rundgang. Das Museum „La Fuente del Molino“ ist im Dorf; im Rathaus fragen.","pt":"Passeio livre pela aldeia. O museu «La Fuente del Molino» fica na aldeia; pergunte na câmara."},"src":"https://campodeborja.es/portfolio-item/malejan/","sources":["https://campodeborja.es/portfolio-item/malejan/","https://campodeborja.es/wp-content/uploads/2024/03/Folleto-Campo-de-Borja-_EN_2024_v1.pdf","https://www.campaners.com/php/torrepdf.php?numer=7204"],"art":{"es":[{"h":"Historia","t":"Los restos de la decoración de la mezquita, un arco y algunas torres de la fortaleza estuvieron ocultos durante mucho tiempo tras construcciones modernas. El trazado medieval del pueblo se conserva en buena parte, aunque cambió con la repoblación del siglo XVII, tras la expulsión de los moriscos.\n\nTras la Reconquista perteneció al monasterio de Veruela hasta el siglo XV; después fue señorío laico, y su último señor fue el conde de Fuenclara."},{"h":"Qué ver","t":"La iglesia de la Visitación, pequeña y del siglo XVI, se levantó junto al antiguo castillo y conserva retablos de época anterior. Tiene una torre espadaña con dos campanas.\n\nEl museo «La Fuente del Molino» guarda un antiguo molino de aceite de principios del siglo XX. Desde el mirador del Valle del Huecha se ve el río entre sus sotos, con las cumbres del Moncayo al fondo."},{"h":"Tradiciones y fiestas","t":"En mayo se celebra el Santo Cristo y del 4 al 9 de agosto las fiestas de Santa Bárbara; el 4 de diciembre es su día. El mural de la «Subida del Mayo» y el dance del pueblo recuerdan sus tradiciones."}],"en":[{"h":"History","t":"The remains of the mosque's decoration, an arch and some towers of the fortress were hidden for a long time behind modern buildings. The village's medieval layout survives in large part, although it changed with the resettlement of the 17th century, after the expulsion of the Moriscos.\n\nAfter the Reconquest it belonged to the monastery of Veruela until the 15th century; it then became a lay lordship, the last lord being the Count of Fuenclara."},{"h":"What to see","t":"The church of La Visitación, small and 16th-century, was built next to the old castle and keeps altarpieces from an earlier period. It has a bell gable with two bells.\n\nThe «La Fuente del Molino» museum keeps an early 20th-century olive mill. From the Huecha Valley viewpoint you see the river among its riverside woods, with the peaks of the Moncayo behind."},{"h":"Traditions and festivals","t":"The Santo Cristo is celebrated in May and the festivities of Santa Bárbara from 4 to 9 August; her feast day is 4 December. The «Subida del Mayo» mural and the village dance recall its traditions."}],"fr":[{"h":"Histoire","t":"Les restes du décor de la mosquée, un arc et quelques tours de la forteresse restèrent longtemps cachés derrière des constructions modernes. Le tracé médiéval du village est en grande partie conservé, bien qu'il ait changé avec le repeuplement du XVIIe siècle, après l'expulsion des Morisques.\n\nAprès la Reconquête, il appartint au monastère de Veruela jusqu'au XVe siècle ; il devint ensuite une seigneurie laïque, dont le dernier seigneur fut le comte de Fuenclara."},{"h":"À voir","t":"L'église de la Visitación, petite et du XVIe siècle, fut élevée à côté de l'ancien château et conserve des retables d'une époque antérieure. Elle possède un clocher-mur à deux cloches.\n\nLe musée « La Fuente del Molino » conserve un ancien moulin à huile du début du XXe siècle. Depuis le belvédère de la vallée de la Huecha, on voit la rivière entre ses bosquets, avec les sommets du Moncayo en fond."},{"h":"Traditions et fêtes","t":"En mai on célèbre le Santo Cristo et du 4 au 9 août les fêtes de Santa Bárbara ; sa fête est le 4 décembre. La fresque de la « Subida del Mayo » et la danse du village rappellent ses traditions."}],"de":[{"h":"Geschichte","t":"Die Reste der Moscheedekoration, ein Bogen und einige Türme der Festung waren lange hinter modernen Bauten verborgen. Der mittelalterliche Grundriss des Dorfes ist großenteils erhalten, änderte sich aber mit der Neubesiedlung im 17. Jahrhundert nach der Vertreibung der Morisken.\n\nNach der Reconquista gehörte es bis ins 15. Jahrhundert dem Kloster Veruela, dann wurde es weltliche Herrschaft; der letzte Herr war der Graf von Fuenclara."},{"h":"Sehenswert","t":"Die kleine Kirche La Visitación aus dem 16. Jahrhundert wurde neben der alten Burg gebaut und bewahrt ältere Altäre. Sie hat einen Glockengiebel mit zwei Glocken.\n\nDas Museum „La Fuente del Molino“ zeigt eine Ölmühle vom Anfang des 20. Jahrhunderts. Vom Aussichtspunkt über das Huecha-Tal sieht man den Fluss zwischen seinen Auwäldern, dahinter die Gipfel des Moncayo."},{"h":"Brauchtum und Feste","t":"Im Mai feiert man den Santo Cristo und vom 4. bis 9. August die Feste der Santa Bárbara; ihr Tag ist der 4. Dezember. Das Wandbild „Subida del Mayo“ und der Dance des Dorfes erinnern an seine Bräuche."}],"pt":[{"h":"História","t":"Os restos da decoração da mesquita, um arco e algumas torres da fortaleza estiveram muito tempo escondidos por construções modernas. O traçado medieval da aldeia conserva-se em boa parte, embora tenha mudado com o repovoamento do século XVII, após a expulsão dos mouriscos.\n\nApós a Reconquista pertenceu ao mosteiro de Veruela até ao século XV; depois foi senhorio laico, e o seu último senhor foi o conde de Fuenclara."},{"h":"O que ver","t":"A igreja da Visitación, pequena e do século XVI, foi erguida junto ao antigo castelo e conserva retábulos de época anterior. Tem uma sineira com dois sinos.\n\nO museu «La Fuente del Molino» guarda um antigo lagar de azeite do início do século XX. Do miradouro do Vale do Huecha vê-se o rio entre os seus sotos, com os cumes do Moncayo ao fundo."},{"h":"Tradições e festas","t":"Em maio celebra-se o Santo Cristo e de 4 a 9 de agosto as festas de Santa Bárbara; o seu dia é 4 de dezembro. O mural da «Subida del Mayo» e o dance da aldeia recordam as suas tradições."}]},"status":"pending"},{"id":"iglesia-mallen","town":"Mallén","cat":"patrimonio","lat":41.90069,"lon":-1.41877,"coord_src":null,"q":["Iglesia de Nuestra Señora de los Ángeles, Mallén","Mallén iglesia"],"fq":["Category:Mallén","Mallén iglesia"],"name":{"es":"Iglesia de Nuestra Señora de los Ángeles","en":"Church of Nuestra Señora de los Ángeles","fr":"Église Nuestra Señora de los Ángeles","de":"Kirche Nuestra Señora de los Ángeles","pt":"Igreja de Nuestra Señora de los Ángeles"},"when":{"es":"Ábside románico · Villa sanjuanista durante 700 años","en":"Romanesque apse · Hospitaller town for 700 years","fr":"Abside romane · Bourg des Hospitaliers 700 ans","de":"Romanische Apsis · 700 Jahre Johanniterort","pt":"Abside românica · Vila hospitalária durante 700 anos"},"desc":{"es":"Mallén fue villa de los Hospitalarios durante unos 700 años. Su iglesia de Nuestra Señora de los Ángeles conserva un ábside románico declarado Bien de Interés Cultural.","en":"Mallén belonged to the Hospitallers for some 700 years. Its church of Nuestra Señora de los Ángeles keeps a Romanesque apse listed as a Site of Cultural Interest.","fr":"Mallén appartint aux Hospitaliers pendant quelque 700 ans. Son église Nuestra Señora de los Ángeles conserve une abside romane classée Bien d'intérêt culturel.","de":"Mallén gehörte rund 700 Jahre den Johannitern. Seine Kirche Nuestra Señora de los Ángeles bewahrt eine romanische Apsis, die als Kulturgut geschützt ist.","pt":"Mallén pertenceu aos Hospitalários durante cerca de 700 anos. A sua igreja de Nuestra Señora de los Ángeles conserva uma abside românica classificada como Bem de Interesse Cultural."},"visit":{"es":"Abre en horario de culto. Pregunta en el Ayuntamiento por visitas.","en":"Open during services. Ask at the town hall about visits.","fr":"Ouverte aux heures de culte. Renseignez-vous à la mairie pour les visites.","de":"Zu Gottesdiensten geöffnet. Für Besuche im Rathaus fragen.","pt":"Abre nas horas de culto. Pergunte na câmara por visitas."},"src":"https://es.hispanopedia.com/wiki/Mall%C3%A9n","sources":["https://es.hispanopedia.com/wiki/Mall%C3%A9n","https://campodeborja.es/portfolio-item/mallen/","https://campodeborja.es/wp-content/uploads/2024/03/Folleto-Campo-de-Borja-_EN_2024_v1.pdf"],"art":{"es":[{"h":"Historia","t":"Mallén se identifica con la Balsio romana, una mansión o parada de la vía de Tarraco a Asturica. Alfonso I la tomó en 1119, la repobló con mozárabes en 1126 y en 1132 le dio fueros y la donó a templarios y hospitalarios. Desde 1151 fue de la Orden de San Juan, que mantuvo su jurisdicción hasta principios del siglo XIX.\n\nEn 1209 se reunieron aquí Pedro II de Aragón y Sancho VIII de Navarra, y en 1452 el castillo sirvió de prisión al príncipe de Viana."},{"h":"Qué ver","t":"El ábside románico de la iglesia es la pieza más antigua del pueblo. La plaza de la Iglesia y la plaza Pablo Iglesias, donde estuvo el castillo en lo alto, son el centro histórico.\n\nA las afueras, la ermita de la Virgen del Puy es de 1751, con paseo y parque."},{"h":"Para entenderlo","t":"Mallén está entre el Huecha y el Ebro, en el corredor del Ebro, y por aquí pasan el Camino Jacobeo del Ebro y el Camino Ignaciano. Las fiestas mayores, del Santo Cristo de la Columna, son el primer domingo de septiembre."}],"en":[{"h":"History","t":"Mallén is identified with Roman Balsio, a staging post on the road from Tarraco to Asturica. Alfonso I took it in 1119, resettled it with Mozarabs in 1126 and in 1132 granted it a charter and gave it to the Templars and Hospitallers. From 1151 it belonged to the Order of Saint John, which kept jurisdiction until the early 19th century.\n\nIn 1209 Peter II of Aragon and Sancho VIII of Navarre met here, and in 1452 the castle served as a prison for the Prince of Viana."},{"h":"What to see","t":"The Romanesque apse of the church is the oldest piece in town. The Plaza de la Iglesia and the Plaza Pablo Iglesias, where the castle stood on the high ground, form the historic centre.\n\nOn the outskirts, the hermitage of the Virgen del Puy dates from 1751, with a promenade and park."},{"h":"Background","t":"Mallén lies between the Huecha and the Ebro, in the Ebro corridor, and the Ebro Way of Saint James and the Ignatian Way pass through it. The main festivities, of the Santo Cristo de la Columna, are on the first Sunday of September."}],"fr":[{"h":"Histoire","t":"Mallén est identifiée à la Balsio romaine, un relais de la voie de Tarraco à Asturica. Alphonse Ier la prit en 1119, la repeupla de Mozarabes en 1126 et en 1132 lui accorda des fors et la donna aux Templiers et aux Hospitaliers. À partir de 1151, elle appartint à l'ordre de Saint-Jean, qui garda sa juridiction jusqu'au début du XIXe siècle.\n\nEn 1209, Pierre II d'Aragon et Sanche VIII de Navarre s'y rencontrèrent, et en 1452 le château servit de prison au prince de Viane."},{"h":"À voir","t":"L'abside romane de l'église est le plus ancien élément du bourg. La Plaza de la Iglesia et la Plaza Pablo Iglesias, où se dressait le château sur la hauteur, forment le centre historique.\n\nAux abords, l'ermitage de la Virgen del Puy date de 1751, avec promenade et parc."},{"h":"Pour comprendre","t":"Mallén se trouve entre la Huecha et l'Èbre, dans le couloir de l'Èbre, et le Chemin jacquaire de l'Èbre et le Chemin ignatien y passent. Les grandes fêtes, du Santo Cristo de la Columna, ont lieu le premier dimanche de septembre."}],"de":[{"h":"Geschichte","t":"Mallén wird mit dem römischen Balsio gleichgesetzt, einer Station an der Straße von Tarraco nach Asturica. Alfons I. nahm es 1119, besiedelte es 1126 mit Mozarabern neu und gab ihm 1132 Stadtrechte und schenkte es Templern und Johannitern. Ab 1151 gehörte es dem Johanniterorden, der die Gerichtsbarkeit bis Anfang des 19. Jahrhunderts behielt.\n\n1209 trafen sich hier Peter II. von Aragonien und Sancho VIII. von Navarra, und 1452 diente die Burg als Gefängnis des Prinzen von Viana."},{"h":"Sehenswert","t":"Die romanische Apsis der Kirche ist das älteste Stück des Ortes. Die Plaza de la Iglesia und die Plaza Pablo Iglesias, wo oben die Burg stand, bilden das historische Zentrum.\n\nAm Ortsrand stammt die Einsiedelei der Virgen del Puy von 1751, mit Promenade und Park."},{"h":"Hintergrund","t":"Mallén liegt zwischen Huecha und Ebro, im Ebro-Korridor; hier verlaufen der Jakobsweg des Ebro und der Ignatiusweg. Das Hauptfest des Santo Cristo de la Columna ist am ersten Sonntag im September."}],"pt":[{"h":"História","t":"Mallén é identificada com a Balsio romana, uma mansio ou paragem da via de Tarraco a Asturica. Afonso I tomou-a em 1119, repovoou-a com moçárabes em 1126 e em 1132 deu-lhe foros e doou-a a templários e hospitalários. Desde 1151 pertenceu à Ordem de São João, que manteve a jurisdição até ao início do século XIX.\n\nEm 1209 reuniram-se aqui Pedro II de Aragão e Sancho VIII de Navarra, e em 1452 o castelo serviu de prisão ao príncipe de Viana."},{"h":"O que ver","t":"A abside românica da igreja é a peça mais antiga da vila. A Plaza de la Iglesia e a Plaza Pablo Iglesias, onde estava o castelo no alto, são o centro histórico.\n\nNos arredores, a ermida da Virgen del Puy é de 1751, com passeio e parque."},{"h":"Para compreender","t":"Mallén fica entre o Huecha e o Ebro, no corredor do Ebro, e por aqui passam o Caminho Jacobeu do Ebro e o Caminho Inaciano. As festas maiores, do Santo Cristo de la Columna, são no primeiro domingo de setembro."}]},"status":"pending"},{"id":"palacios-mallen","town":"Mallén","cat":"patrimonio","lat":41.90461,"lon":-1.42054,"coord_src":null,"q":["Palacio de los Zapata, Mallén","Palacio de Navas, Mallén"],"fq":["Mallén palacio","Mallén casa"],"name":{"es":"Palacios de Mallén","en":"Mallén's palaces","fr":"Palais de Mallén","de":"Paläste von Mallén","pt":"Palácios de Mallén"},"when":{"es":"Siglos XVII-XVIII · Casas nobles","en":"17th–18th c. · Noble houses","fr":"XVIIe–XVIIIe s. · Demeures nobles","de":"17.–18. Jh. · Adelshäuser","pt":"Séc. XVII–XVIII · Casas nobres"},"desc":{"es":"Las casas de los Zapata, los Navas y los Frontines recuerdan las familias que gobernaron Mallén. Junto al cerro de El Convento, a orillas del Huecha, hay restos de la ciudad romana.","en":"The houses of the Zapata, Navas and Frontines families recall the families who ran Mallén. Next to El Convento hill, on the bank of the Huecha, are remains of the Roman town.","fr":"Les maisons des Zapata, des Navas et des Frontines rappellent les familles qui dirigèrent Mallén. Près de la colline d'El Convento, au bord de la Huecha, se trouvent des vestiges de la ville romaine.","de":"Die Häuser der Zapata, Navas und Frontines erinnern an die Familien, die Mallén lenkten. Am Hügel El Convento, am Ufer der Huecha, liegen Reste der römischen Stadt.","pt":"As casas dos Zapata, dos Navas e dos Frontines recordam as famílias que governaram Mallén. Junto ao cerro de El Convento, na margem do Huecha, há restos da cidade romana."},"visit":{"es":"Se ven desde la calle. El yacimiento de El Convento no está musealizado.","en":"Seen from the street. The El Convento site is not set up for visitors.","fr":"Se voient depuis la rue. Le site d'El Convento n'est pas aménagé pour la visite.","de":"Von der Straße aus zu sehen. Die Fundstätte El Convento ist nicht für Besucher erschlossen.","pt":"Veem-se da rua. A jazida de El Convento não está musealizada."},"src":"https://campodeborja.es/portfolio-item/mallen/","sources":["https://campodeborja.es/portfolio-item/mallen/","https://es.hispanopedia.com/wiki/Mall%C3%A9n","https://campodeborja.es/wp-content/uploads/2024/03/Folleto-Campo-de-Borja-_EN_2024_v1.pdf"],"art":{"es":[{"h":"Historia","t":"La casa de los Zapata es del siglo XVIII y el palacio de los Navas del XVII. La comarca cita también la casa-palacio de los Frontines y la de los Pérez Petinto.\n\nEn 1706, en la Guerra de Sucesión, las tropas del archiduque saquearon la villa; Felipe V le concedió después el título de «Leal y siempre fidelísima». En 1808 los franceses ocuparon el castillo, que en 1813 quedó muy dañado y fue desmantelado."},{"h":"Yacimiento de El Convento","t":"En el cerro de El Convento, cerca del pueblo y junto al Huecha, se han hallado restos romanos, entre ellos terra sigillata hispánica de los siglos I y II. Allí se sitúa la Balsio de los itinerarios romanos."},{"h":"Curiosidades","t":"Un vecino de Mallén, Santos González Roncal, fue uno de los «últimos de Filipinas», los soldados que resistieron en Baler hasta 1899. Un parque lleva su nombre y un mural del pueblo recuerda aquella historia."}],"en":[{"h":"History","t":"The Zapata house dates from the 18th century and the Navas palace from the 17th. The comarca also lists the Frontines mansion and the Pérez Petinto house.\n\nIn 1706, in the War of the Spanish Succession, the Archduke's troops sacked the town; Philip V later granted it the title «Leal y siempre fidelísima». In 1808 the French occupied the castle, which was badly damaged in 1813 and dismantled."},{"h":"El Convento site","t":"On El Convento hill, near the town and next to the Huecha, Roman remains have been found, including Hispanic terra sigillata pottery from the 1st and 2nd centuries. The Balsio of the Roman itineraries is placed here."},{"h":"Did you know?","t":"A local man, Santos González Roncal, was one of the «last of the Philippines», the soldiers who held out at Baler until 1899. A park bears his name and a mural in town recalls the story."}],"fr":[{"h":"Histoire","t":"La maison des Zapata date du XVIIIe siècle et le palais des Navas du XVIIe. La comarque cite aussi la demeure des Frontines et la maison des Pérez Petinto.\n\nEn 1706, pendant la guerre de Succession, les troupes de l'archiduc pillèrent le bourg ; Philippe V lui accorda ensuite le titre de « Leal y siempre fidelísima ». En 1808, les Français occupèrent le château, très endommagé en 1813 puis démantelé."},{"h":"Site d'El Convento","t":"Sur la colline d'El Convento, près du bourg et à côté de la Huecha, on a trouvé des vestiges romains, dont de la sigillée hispanique des Ier et IIe siècles. On y situe la Balsio des itinéraires romains."},{"h":"Le saviez-vous ?","t":"Un habitant de Mallén, Santos González Roncal, fut l'un des « derniers des Philippines », les soldats qui résistèrent à Baler jusqu'en 1899. Un parc porte son nom et une fresque du village rappelle cette histoire."}],"de":[{"h":"Geschichte","t":"Das Haus der Zapata stammt aus dem 18. Jahrhundert, der Palast der Navas aus dem 17. Die Comarca nennt auch das Herrenhaus der Frontines und das Haus der Pérez Petinto.\n\n1706, im Erbfolgekrieg, plünderten die Truppen des Erzherzogs den Ort; Philipp V. verlieh ihm danach den Titel „Leal y siempre fidelísima“. 1808 besetzten die Franzosen die Burg, die 1813 schwer beschädigt und dann abgetragen wurde."},{"h":"Fundstätte El Convento","t":"Auf dem Hügel El Convento, nahe dem Ort an der Huecha, fand man römische Reste, darunter hispanische Terra Sigillata aus dem 1. und 2. Jahrhundert. Hier wird das Balsio der römischen Itinerare verortet."},{"h":"Wussten Sie?","t":"Ein Einwohner von Mallén, Santos González Roncal, war einer der „Letzten der Philippinen“, der Soldaten, die in Baler bis 1899 ausharrten. Ein Park trägt seinen Namen, und ein Wandbild im Ort erinnert an die Geschichte."}],"pt":[{"h":"História","t":"A casa dos Zapata é do século XVIII e o palácio dos Navas do XVII. A comarca cita também a casa-palácio dos Frontines e a dos Pérez Petinto.\n\nEm 1706, na Guerra da Sucessão, as tropas do arquiduque saquearam a vila; Filipe V concedeu-lhe depois o título de «Leal y siempre fidelísima». Em 1808 os franceses ocuparam o castelo, que em 1813 ficou muito danificado e foi desmantelado."},{"h":"Jazida de El Convento","t":"No cerro de El Convento, perto da vila e junto ao Huecha, encontraram-se restos romanos, entre eles terra sigillata hispânica dos séculos I e II. Aí se situa a Balsio dos itinerários romanos."},{"h":"Curiosidades","t":"Um vizinho de Mallén, Santos González Roncal, foi um dos «últimos das Filipinas», os soldados que resistiram em Baler até 1899. Um parque tem o seu nome e um mural da vila recorda essa história."}]},"status":"pending"},{"id":"palacio-novillas","town":"Novillas","cat":"patrimonio","lat":41.93523,"lon":-1.39309,"coord_src":null,"q":["Palacio de los Comendadores, Novillas","Palacio de la Orden de San Juan, Novillas"],"fq":["Category:Novillas","Palacio Novillas"],"name":{"es":"Palacio de los Comendadores","en":"Palace of the Commanders","fr":"Palais des Commandeurs","de":"Palast der Komture","pt":"Palácio dos Comendadores"},"when":{"es":"Siglo XVI · Casa de la encomienda sanjuanista","en":"16th century · House of the Hospitaller commandery","fr":"XVIe siècle · Maison de la commanderie de Saint-Jean","de":"16. Jh. · Haus der Johanniterkomturei","pt":"Séc. XVI · Casa da comenda de São João"},"desc":{"es":"Novillas fue la encomienda templaria más próspera del valle medio del Ebro. El palacio de los Comendadores, que la Orden de San Juan levantó en el siglo XVI sobre el castillo, tiene tres pisos y una galería de arquillos.","en":"Novillas was the most prosperous Templar commandery in the middle Ebro valley. The Palace of the Commanders, built by the Order of Saint John in the 16th century over the castle, has three storeys and a gallery of small arches.","fr":"Novillas fut la commanderie templière la plus prospère de la moyenne vallée de l'Èbre. Le palais des Commandeurs, que l'ordre de Saint-Jean éleva au XVIe siècle sur le château, a trois étages et une galerie de petites arcades.","de":"Novillas war die wohlhabendste Templerkomturei im mittleren Ebrotal. Der Palast der Komture, den der Johanniterorden im 16. Jahrhundert über der Burg errichtete, hat drei Geschosse und eine Galerie kleiner Bögen.","pt":"Novillas foi a comenda templária mais próspera do vale médio do Ebro. O palácio dos Comendadores, que a Ordem de São João ergueu no século XVI sobre o castelo, tem três pisos e uma galeria de arquinhos."},"visit":{"es":"Se ve desde el exterior. Pregunta en el Ayuntamiento por el acceso al interior.","en":"Seen from outside. Ask at the town hall about access to the interior.","fr":"Se voit de l'extérieur. Renseignez-vous à la mairie pour l'accès à l'intérieur.","de":"Von außen zu sehen. Für das Innere im Rathaus fragen.","pt":"Vê-se do exterior. Pergunte na câmara pelo acesso ao interior."},"src":"https://es.hispanopedia.com/wiki/Novillas","sources":["https://es.hispanopedia.com/wiki/Novillas","https://campodeborja.es/portfolio-item/novillas/","https://campodeborja.es/wp-content/uploads/2024/03/Folleto-Campo-de-Borja-_EN_2024_v1.pdf"],"art":{"es":[{"h":"Historia","t":"En 1132 Alfonso I dio carta puebla a los mozárabes de Novillas desde su castillo. En 1135 la villa pasó a templarios y hospitalarios, y en 1151 los templarios cambiaron sus posesiones de Mallén para quedarse con toda Novillas, que fue su gran encomienda del valle medio del Ebro. Su cartulario de 1117 a 1198 se guarda en el Archivo Histórico Nacional.\n\nTras el Temple pasó a la Orden de San Juan, que mantuvo la encomienda de 1314 a 1841."},{"h":"Qué ver","t":"El palacio de los Comendadores, casa conventual de la orden, es de estilo gótico-mudéjar aragonés: tres plantas, grandes arcos para ventanas y balcones y una galería de pequeños arcos en lo alto.\n\nDel castillo templario del siglo XII quedan restos de muros y la base de una torre. La iglesia de Nuestra Señora de la Esperanza, del siglo XVIII, se levantó sobre otra románica y guarda retablos de los siglos XVI y XVII."},{"h":"Tradiciones y fiestas","t":"Novillas celebra el Día del Puente en julio, en recuerdo de la inauguración del puente sobre el Ebro en 1982; la Virgen del Rosario, con el paloteado; y San Nicasio, patrón, el 14 de diciembre."}],"en":[{"h":"History","t":"In 1132 Alfonso I granted a settlement charter to the Mozarabs of Novillas from its castle. In 1135 the town passed to the Templars and Hospitallers, and in 1151 the Templars exchanged their holdings in Mallén to keep the whole of Novillas, which became their great commandery of the middle Ebro valley. Its cartulary for 1117–1198 is kept in the National Historical Archive.\n\nAfter the Temple it passed to the Order of Saint John, which held the commandery from 1314 to 1841."},{"h":"What to see","t":"The Palace of the Commanders, the order's conventual house, is in Aragonese Gothic-Mudéjar style: three floors, large arches framing windows and balconies, and a gallery of small arches at the top.\n\nOf the 12th-century Templar castle, parts of the walls and the base of a tower survive. The church of Nuestra Señora de la Esperanza, 18th-century, was built over a Romanesque one and keeps 16th- and 17th-century altarpieces."},{"h":"Traditions and festivals","t":"Novillas celebrates the Bridge Day in July, recalling the opening of the bridge over the Ebro in 1982; the Virgin of the Rosary, with the «paloteado» stick dance; and San Nicasio, its patron, on 14 December."}],"fr":[{"h":"Histoire","t":"En 1132, Alphonse Ier accorda une charte de peuplement aux Mozarabes de Novillas depuis son château. En 1135, le bourg passa aux Templiers et aux Hospitaliers, et en 1151 les Templiers échangèrent leurs biens de Mallén pour garder tout Novillas, qui devint leur grande commanderie de la moyenne vallée de l'Èbre. Son cartulaire de 1117 à 1198 est conservé à l'Archivo Histórico Nacional.\n\nAprès le Temple, elle passa à l'ordre de Saint-Jean, qui conserva la commanderie de 1314 à 1841."},{"h":"À voir","t":"Le palais des Commandeurs, maison conventuelle de l'ordre, est de style gothique-mudéjar aragonais : trois niveaux, de grands arcs pour les fenêtres et balcons et une galerie de petites arcades en haut.\n\nDu château templier du XIIe siècle subsistent des restes de murs et la base d'une tour. L'église Nuestra Señora de la Esperanza, du XVIIIe siècle, fut bâtie sur une église romane et conserve des retables des XVIe et XVIIe siècles."},{"h":"Traditions et fêtes","t":"Novillas célèbre le Día del Puente en juillet, en souvenir de l'inauguration du pont sur l'Èbre en 1982 ; la Vierge du Rosaire, avec la danse des bâtons ; et San Nicasio, son patron, le 14 décembre."}],"de":[{"h":"Geschichte","t":"1132 gab Alfons I. den Mozarabern von Novillas von der Burg aus einen Siedlungsbrief. 1135 ging der Ort an Templer und Johanniter, und 1151 tauschten die Templer ihren Besitz in Mallén, um ganz Novillas zu behalten, das ihre große Komturei im mittleren Ebrotal wurde. Ihr Kartular von 1117 bis 1198 liegt im Archivo Histórico Nacional.\n\nNach den Templern ging sie an den Johanniterorden, der die Komturei von 1314 bis 1841 hielt."},{"h":"Sehenswert","t":"Der Palast der Komture, Konventshaus des Ordens, ist im aragonesischen gotischen Mudéjar-Stil gebaut: drei Geschosse, große Bögen für Fenster und Balkone und oben eine Galerie kleiner Bögen.\n\nVon der Templerburg des 12. Jahrhunderts sind Mauerreste und der Sockel eines Turms erhalten. Die Kirche Nuestra Señora de la Esperanza aus dem 18. Jahrhundert steht über einer romanischen und bewahrt Altäre aus dem 16. und 17. Jahrhundert."},{"h":"Brauchtum und Feste","t":"Novillas feiert im Juli den Brückentag zur Erinnerung an die Einweihung der Ebrobrücke 1982, die Rosenkranzmadonna mit dem Stocktanz „paloteado“ und am 14. Dezember den Schutzpatron San Nicasio."}],"pt":[{"h":"História","t":"Em 1132 Afonso I deu carta de povoamento aos moçárabes de Novillas a partir do seu castelo. Em 1135 a vila passou para templários e hospitalários, e em 1151 os templários trocaram os seus bens de Mallén para ficar com toda Novillas, que foi a sua grande comenda do vale médio do Ebro. O seu cartulário de 1117 a 1198 guarda-se no Archivo Histórico Nacional.\n\nApós o Templo passou para a Ordem de São João, que manteve a comenda de 1314 a 1841."},{"h":"O que ver","t":"O palácio dos Comendadores, casa conventual da ordem, é de estilo gótico-mudéjar aragonês: três pisos, grandes arcos para janelas e varandas e uma galeria de pequenos arcos no alto.\n\nDo castelo templário do século XII restam troços de muralha e a base de uma torre. A igreja de Nuestra Señora de la Esperanza, do século XVIII, foi erguida sobre outra românica e guarda retábulos dos séculos XVI e XVII."},{"h":"Tradições e festas","t":"Novillas celebra o Día del Puente em julho, em memória da inauguração da ponte sobre o Ebro em 1982; a Virgem do Rosário, com a dança dos paus; e San Nicasio, padroeiro, a 14 de dezembro."}]},"status":"pending"},{"id":"fortin-novillas","town":"Novillas","cat":"naturaleza","lat":41.93286,"lon":-1.39149,"coord_src":null,"q":["Fuerte, Novillas","Novillas Ebro"],"fq":["Novillas Ebro","Novillas fuerte"],"name":{"es":"Fortín y sotos del Ebro","en":"Fort and Ebro riverside woods","fr":"Fortin et forêts riveraines de l'Èbre","de":"Fort und Auwälder am Ebro","pt":"Fortim e sotos do Ebro"},"when":{"es":"Guerras carlistas · Sotos del Ebro","en":"Carlist Wars · Ebro riverside woods","fr":"Guerres carlistes · Forêts riveraines de l'Èbre","de":"Karlistenkriege · Auwälder am Ebro","pt":"Guerras carlistas · Sotos do Ebro"},"desc":{"es":"Novillas es el primer pueblo aragonés por el que pasa el Ebro. A su orilla quedan un pequeño fortín de las guerras carlistas y sotos de ribera de gran valor ecológico, y aquí desemboca el Huecha.","en":"Novillas is the first village in Aragon the Ebro flows through. On its bank stand a small fort from the Carlist Wars and riverside woods of great ecological value, and here the Huecha joins the Ebro.","fr":"Novillas est le premier village aragonais traversé par l'Èbre. Sur sa rive subsistent un petit fortin des guerres carlistes et des forêts riveraines de grande valeur écologique, et c'est ici que la Huecha se jette dans l'Èbre.","de":"Novillas ist das erste aragonesische Dorf, das der Ebro durchfließt. Am Ufer stehen ein kleines Fort aus den Karlistenkriegen und Auwälder von großem ökologischem Wert; hier mündet die Huecha.","pt":"Novillas é a primeira aldeia aragonesa por onde passa o Ebro. Na margem restam um pequeno fortim das guerras carlistas e sotos ribeirinhos de grande valor ecológico, e aqui desagua o Huecha."},"visit":{"es":"Acceso libre por caminos de ribera. Atención a las crecidas del Ebro en invierno y primavera.","en":"Free access along riverside tracks. Beware of Ebro floods in winter and spring.","fr":"Accès libre par les chemins de berge. Attention aux crues de l'Èbre en hiver et au printemps.","de":"Freier Zugang über Uferwege. Vorsicht bei Ebro-Hochwasser im Winter und Frühjahr.","pt":"Acesso livre por caminhos de margem. Atenção às cheias do Ebro no inverno e na primavera."},"src":"https://campodeborja.es/portfolio-item/novillas/","sources":["https://campodeborja.es/portfolio-item/novillas/","https://es.hispanopedia.com/wiki/Novillas","https://campodeborja.es/wp-content/uploads/2024/03/Folleto-Campo-de-Borja-_EN_2024_v1.pdf"],"art":{"es":[{"h":"Historia","t":"El fortín, también llamado fuerte fusilero, es una pequeña construcción defensiva a orillas del Ebro levantada durante las guerras carlistas. Cerca quedan restos de una torre islámica de los siglos IX al XI y de la torre-castillo que controlaba el paso del río."},{"h":"El paisaje","t":"Los sotos y mejanas son bosques de ribera e islas del río que el Ebro va formando y deshaciendo. La comarca destaca su alto valor ecológico y su fauna.\n\nEl GR 99, el Camino Natural del Ebro, pasa por Novillas. El Canal Imperial de Aragón y el de Tauste riegan la huerta del término."},{"h":"Para entenderlo","t":"El Ebro manda en Novillas: entre las crecidas del siglo XXI, la de febrero de 2015 llegó a 8,36 metros. Por eso los sotos cambian de forma de un año a otro."}],"en":[{"h":"History","t":"The fort, also called the rifle fort, is a small defensive building on the bank of the Ebro, built during the Carlist Wars. Nearby are remains of a 9th–11th-century Islamic tower and of the tower-castle that controlled the river crossing."},{"h":"The landscape","t":"«Sotos» and «mejanas» are riverside woods and river islands that the Ebro keeps forming and reshaping. The comarca highlights their high ecological value and wildlife.\n\nThe GR 99, the Ebro Nature Trail, passes through Novillas. The Imperial Canal of Aragon and the Tauste Canal irrigate the farmland."},{"h":"Background","t":"The Ebro rules Novillas: among the floods of the 21st century, the one of February 2015 reached 8.36 metres. That is why the riverside woods change shape from one year to the next."}],"fr":[{"h":"Histoire","t":"Le fortin, appelé aussi fort des fusiliers, est une petite construction défensive au bord de l'Èbre, élevée pendant les guerres carlistes. Tout près subsistent les restes d'une tour islamique des IXe–XIe siècles et de la tour-château qui contrôlait le passage du fleuve."},{"h":"Le paysage","t":"Les « sotos » et « mejanas » sont des forêts riveraines et des îles que l'Èbre forme et défait sans cesse. La comarque souligne leur grande valeur écologique et leur faune.\n\nLe GR 99, chemin naturel de l'Èbre, passe par Novillas. Le Canal impérial d'Aragon et le canal de Tauste irriguent les terres du village."},{"h":"Pour comprendre","t":"L'Èbre commande à Novillas : parmi les crues du XXIe siècle, celle de février 2015 atteignit 8,36 mètres. C'est pourquoi les forêts riveraines changent de forme d'une année à l'autre."}],"de":[{"h":"Geschichte","t":"Das Fort, auch Schützenfort genannt, ist ein kleiner Wehrbau am Ebroufer aus den Karlistenkriegen. In der Nähe stehen Reste eines islamischen Turms aus dem 9.–11. Jahrhundert und des Burgturms, der den Flussübergang kontrollierte."},{"h":"Die Landschaft","t":"„Sotos“ und „mejanas“ sind Auwälder und Flussinseln, die der Ebro ständig neu formt. Die Comarca hebt ihren hohen ökologischen Wert und ihre Tierwelt hervor.\n\nDer GR 99, der Naturweg des Ebro, führt durch Novillas. Der Kaiserkanal von Aragonien und der Kanal von Tauste bewässern die Felder."},{"h":"Hintergrund","t":"Der Ebro bestimmt Novillas: Unter den Hochwassern des 21. Jahrhunderts erreichte das vom Februar 2015 8,36 Meter. Deshalb ändern die Auwälder von Jahr zu Jahr ihre Form."}],"pt":[{"h":"História","t":"O fortim, também chamado forte de fuzileiros, é uma pequena construção defensiva na margem do Ebro, erguida durante as guerras carlistas. Perto restam vestígios de uma torre islâmica dos séculos IX a XI e da torre-castelo que controlava a passagem do rio."},{"h":"A paisagem","t":"Os «sotos» e «mejanas» são bosques ribeirinhos e ilhas do rio que o Ebro vai formando e desfazendo. A comarca destaca o seu alto valor ecológico e a sua fauna.\n\nO GR 99, o Caminho Natural do Ebro, passa por Novillas. O Canal Imperial de Aragão e o canal de Tauste regam a horta do município."},{"h":"Para compreender","t":"O Ebro manda em Novillas: entre as cheias do século XXI, a de fevereiro de 2015 chegou aos 8,36 metros. Por isso os sotos mudam de forma de um ano para o outro."}]},"status":"pending"},{"id":"geiser-pozuelo","town":"Pozuelo de Aragón","cat":"naturaleza","lat":41.76237,"lon":-1.4289,"coord_src":null,"q":["Géiser de Pozuelo de Aragón","Pozo artesiano, Pozuelo de Aragón"],"fq":["Pozuelo de Aragón géiser","Category:Pozuelo de Aragón"],"name":{"es":"El géiser de Pozuelo","en":"The Pozuelo «geyser»","fr":"Le « geyser » de Pozuelo","de":"Der „Geysir“ von Pozuelo","pt":"O «géiser» de Pozuelo"},"when":{"es":"1988 · Pozo artesiano · Lugar de Interés Geológico","en":"1988 · Artesian well · Site of Geological Interest","fr":"1988 · Puits artésien · Lieu d'intérêt géologique","de":"1988 · Artesischer Brunnen · Geotop","pt":"1988 · Poço artesiano · Lugar de Interesse Geológico"},"desc":{"es":"A 400 metros de Pozuelo de Aragón, un pozo perforado en 1988 lanza sin parar un chorro de agua de 2 a 3 metros de altura a unos 28 grados. Lo llaman «el géiser» y está en el catálogo de Lugares de Interés Geológico de Aragón.","en":"400 metres from Pozuelo de Aragón, a well drilled in 1988 sends up a constant jet of water 2 to 3 metres high at about 28 °C. People call it «the geyser» and it is listed among Aragon's Sites of Geological Interest.","fr":"À 400 mètres de Pozuelo de Aragón, un puits foré en 1988 projette sans arrêt un jet d'eau de 2 à 3 mètres de haut à environ 28 °C. On l'appelle « le geyser » et il figure au catalogue des Lieux d'intérêt géologique d'Aragon.","de":"400 Meter von Pozuelo de Aragón entfernt schießt ein 1988 gebohrter Brunnen ununterbrochen einen 2 bis 3 Meter hohen Wasserstrahl mit etwa 28 °C in die Höhe. Man nennt ihn „den Geysir“; er steht im Katalog der Geotope Aragoniens.","pt":"A 400 metros de Pozuelo de Aragón, um poço perfurado em 1988 lança sem parar um jorro de água de 2 a 3 metros de altura a cerca de 28 graus. Chamam-lhe «o géiser» e está no catálogo de Lugares de Interesse Geológico de Aragão."},"visit":{"es":"Por una pista de tierra desde la carretera CV-620 hacia Fuendejalón, junto al barranco de Huechaseca. Acceso libre.","en":"Along a dirt track from the CV-620 road towards Fuendejalón, next to the Huechaseca ravine. Free access.","fr":"Par une piste en terre depuis la route CV-620 vers Fuendejalón, près du ravin de Huechaseca. Accès libre.","de":"Über eine Erdpiste von der Straße CV-620 Richtung Fuendejalón, neben der Schlucht Huechaseca. Frei zugänglich.","pt":"Por um caminho de terra desde a estrada CV-620 em direção a Fuendejalón, junto à ravina de Huechaseca. Acesso livre."},"src":"https://es.hispanopedia.com/wiki/Pozuelo_de_Arag%C3%B3n","sources":["https://es.hispanopedia.com/wiki/Pozuelo_de_Arag%C3%B3n","https://campodeborja.es/portfolio-item/pozuelo-de-aragon/","https://campodeborja.es/wp-content/uploads/2024/03/Folleto-Campo-de-Borja-_EN_2024_v1.pdf"],"art":{"es":[{"h":"Historia","t":"El pozo se perforó en 1988, dentro de los sondeos de búsqueda de agua de los años setenta y ochenta. Desde entonces no ha dejado de manar."},{"h":"Para entenderlo","t":"No es un géiser volcánico: es un pozo artesiano. Llega, a 325 metros de profundidad, a un acuífero jurásico confinado, en el que el agua está a presión; por eso sube sola y sale con fuerza.\n\nLos minerales del agua corroen el tubo de hierro y han formado alrededor un cono rojizo."},{"h":"El paisaje","t":"Pozuelo está en los llanos de Plasencia, entre el Huecha y el Jalón, una zona sin ríos en la que el pueblo se asentó junto al manantial que le da nombre."}],"en":[{"h":"History","t":"The well was drilled in 1988, during the search for water in the 1970s and 1980s. It has never stopped flowing since."},{"h":"Background","t":"It is not a volcanic geyser but an artesian well. At a depth of 325 metres it reaches a confined Jurassic aquifer in which the water is under pressure; that is why it rises by itself and gushes out.\n\nThe minerals in the water corrode the iron pipe and have built a reddish cone around it."},{"h":"The landscape","t":"Pozuelo lies on the Plasencia plain, between the Huecha and the Jalón, an area with no rivers, where the village grew up next to the spring that gives it its name."}],"fr":[{"h":"Histoire","t":"Le puits fut foré en 1988, lors des sondages de recherche d'eau des années 1970 et 1980. Depuis, il n'a jamais cessé de jaillir."},{"h":"Pour comprendre","t":"Ce n'est pas un geyser volcanique mais un puits artésien. À 325 mètres de profondeur, il atteint un aquifère jurassique captif, où l'eau est sous pression ; c'est pourquoi elle monte d'elle-même et jaillit avec force.\n\nLes minéraux de l'eau corrodent le tube de fer et ont formé autour un cône rougeâtre."},{"h":"Le paysage","t":"Pozuelo se trouve dans la plaine de Plasencia, entre la Huecha et le Jalón, une zone sans rivières où le village s'est établi près de la source qui lui donne son nom."}],"de":[{"h":"Geschichte","t":"Der Brunnen wurde 1988 im Rahmen der Wassersuche der 1970er- und 1980er-Jahre gebohrt. Seitdem sprudelt er ununterbrochen."},{"h":"Hintergrund","t":"Es ist kein vulkanischer Geysir, sondern ein artesischer Brunnen. In 325 Metern Tiefe erreicht er einen gespannten Aquifer aus dem Jura, in dem das Wasser unter Druck steht; deshalb steigt es von selbst auf und schießt heraus.\n\nDie Mineralien des Wassers zersetzen das Eisenrohr und haben einen rötlichen Kegel gebildet."},{"h":"Die Landschaft","t":"Pozuelo liegt in der Ebene von Plasencia zwischen Huecha und Jalón, einem Gebiet ohne Flüsse, wo sich das Dorf neben der namensgebenden Quelle ansiedelte."}],"pt":[{"h":"História","t":"O poço foi perfurado em 1988, no âmbito das sondagens de procura de água dos anos 1970 e 1980. Desde então nunca parou de jorrar."},{"h":"Para compreender","t":"Não é um géiser vulcânico: é um poço artesiano. A 325 metros de profundidade chega a um aquífero jurássico confinado, onde a água está sob pressão; por isso sobe sozinha e sai com força.\n\nOs minerais da água corroem o tubo de ferro e formaram à volta um cone avermelhado."},{"h":"A paisagem","t":"Pozuelo fica na planície de Plasencia, entre o Huecha e o Jalón, uma zona sem rios onde a aldeia se instalou junto à nascente que lhe dá nome."}]},"status":"pending"},{"id":"iglesia-tabuenca","town":"Tabuenca","cat":"patrimonio","lat":41.69533,"lon":-1.54354,"coord_src":null,"q":["Iglesia de San Juan Bautista, Tabuenca","Tabuenca"],"fq":["Tabuenca iglesia","Category:Tabuenca"],"name":{"es":"Iglesia de San Juan Bautista y casa-museo","en":"Church of San Juan Bautista and house museum","fr":"Église San Juan Bautista et maison-musée","de":"Kirche San Juan Bautista und Hausmuseum","pt":"Igreja de San Juan Bautista e casa-museu"},"when":{"es":"Siglo XVI · Gótico-mudéjar · Casa-museo etnográfica","en":"16th century · Gothic-Mudéjar · Ethnographic house museum","fr":"XVIe siècle · Gothique-mudéjar · Maison-musée","de":"16. Jh. · Gotik-Mudéjar · Volkskundliches Hausmuseum","pt":"Séc. XVI · Gótico-mudéjar · Casa-museu etnográfica"},"desc":{"es":"Tabuenca se agrupa bajo su iglesia de San Juan Bautista, gótico-mudéjar, a la que se sube por una amplia escalinata. Cerca, el antiguo hospital es hoy una casa-museo que enseña cómo era un hogar aragonés de los siglos XIX y XX.","en":"Tabuenca clusters below its Gothic-Mudéjar church of San Juan Bautista, reached by a broad flight of steps. Nearby, the former hospital is now a house museum showing what an Aragonese home was like in the 19th and 20th centuries.","fr":"Tabuenca se blottit sous son église gothique-mudéjare San Juan Bautista, à laquelle on accède par un large escalier. Tout près, l'ancien hôpital est aujourd'hui une maison-musée qui montre un foyer aragonais des XIXe et XXe siècles.","de":"Tabuenca drängt sich unter seiner gotisch-mudéjaren Kirche San Juan Bautista, zu der eine breite Treppe hinaufführt. In der Nähe ist das alte Hospital heute ein Hausmuseum, das ein aragonesisches Heim des 19. und 20. Jahrhunderts zeigt.","pt":"Tabuenca agrupa-se sob a sua igreja gótico-mudéjar de San Juan Bautista, a que se sobe por uma ampla escadaria. Perto, o antigo hospital é hoje uma casa-museu que mostra como era um lar aragonês dos séculos XIX e XX."},"visit":{"es":"La iglesia abre en horario de culto; para la casa-museo, pregunta en el Ayuntamiento.","en":"The church opens during services; for the house museum, ask at the town hall.","fr":"L'église ouvre aux heures de culte ; pour la maison-musée, renseignez-vous à la mairie.","de":"Die Kirche öffnet zu Gottesdiensten; für das Hausmuseum im Rathaus fragen.","pt":"A igreja abre nas horas de culto; para a casa-museu, pergunte na câmara."},"src":"https://es.hispanopedia.com/wiki/Tabuenca","sources":["https://es.hispanopedia.com/wiki/Tabuenca","https://campodeborja.es/portfolio-item/tabuenca/"],"art":{"es":[{"h":"Historia","t":"La iglesia es del siglo XVI, con una nave cubierta con bóveda de crucería estrellada y una torre cuadrada con decoración mudéjar rematada por un cuerpo octogonal. En el siglo XVIII se cambió su orientación, se derribó el ábside original y se añadieron crucero y cabecera nuevos.\n\nEl 13 de diciembre de 1808 los franceses saquearon el pueblo; tras el levantamiento de los vecinos, las represalias costaron la vida a 39 personas y se incendió la iglesia."},{"h":"Qué ver","t":"Dentro hay varios retablos renacentistas. El Ayuntamiento es del siglo XVI, con lonja renacentista, y el Arco de la Villa era la puerta del recinto amurallado.\n\nEl antiguo Hospital de Beneficencia, restaurado en 2006, es una casa-museo con patio, cuadra, cocina, comedor, dormitorio y granero."},{"h":"Tradiciones y fiestas","t":"El cuarto domingo de Cuaresma la Virgen de Rodanas sube en romería a la ermita de San Miguel de los Santos para pedir agua, y se come el «pastel de los Santos». Las fiestas del Niño Perdido son en torno al 8 de septiembre, con subasta de palos y estandartes y concurso de vino artesano."}],"en":[{"h":"History","t":"The church dates from the 16th century, with a nave covered by a star-ribbed vault and a square tower with Mudéjar decoration topped by an octagonal section. In the 18th century its orientation was changed, the original apse was demolished and a new transept and east end were added.\n\nOn 13 December 1808 the French sacked the village; after the villagers rose up, the reprisals cost 39 lives and the church was set on fire."},{"h":"What to see","t":"Inside are several Renaissance altarpieces. The town hall is 16th-century, with a Renaissance loggia, and the Arco de la Villa was the gate of the walled enclosure.\n\nThe former Charity Hospital, restored in 2006, is a house museum with courtyard, stable, kitchen, dining room, bedroom and granary."},{"h":"Traditions and festivals","t":"On the fourth Sunday of Lent the Virgen de Rodanas is carried on pilgrimage to the hermitage of San Miguel de los Santos to pray for rain, and the «pastel de los Santos» pie is eaten. The festivities of the Niño Perdido are around 8 September, with an auction of staffs and banners and a home-made wine contest."}],"fr":[{"h":"Histoire","t":"L'église date du XVIe siècle, avec une nef couverte d'une voûte d'ogives étoilée et une tour carrée à décor mudéjar couronnée d'un corps octogonal. Au XVIIIe siècle, on changea son orientation, on démolit l'abside d'origine et on ajouta un nouveau transept et un nouveau chevet.\n\nLe 13 décembre 1808, les Français pillèrent le village ; après le soulèvement des habitants, les représailles firent 39 morts et l'église fut incendiée."},{"h":"À voir","t":"À l'intérieur se trouvent plusieurs retables Renaissance. La mairie est du XVIe siècle, avec une loggia Renaissance, et l'Arco de la Villa était la porte de l'enceinte.\n\nL'ancien Hôpital de bienfaisance, restauré en 2006, est une maison-musée avec cour, écurie, cuisine, salle à manger, chambre et grenier."},{"h":"Traditions et fêtes","t":"Le quatrième dimanche de Carême, la Virgen de Rodanas monte en pèlerinage à l'ermitage San Miguel de los Santos pour demander la pluie, et l'on mange le « pastel de los Santos ». Les fêtes du Niño Perdido ont lieu autour du 8 septembre, avec une vente aux enchères de bâtons et de bannières et un concours de vin artisanal."}],"de":[{"h":"Geschichte","t":"Die Kirche stammt aus dem 16. Jahrhundert, mit einem Schiff unter Sternrippengewölbe und einem quadratischen Turm mit Mudéjar-Dekor und achteckigem Abschluss. Im 18. Jahrhundert änderte man ihre Ausrichtung, riss die ursprüngliche Apsis ab und fügte Querschiff und neuen Chor an.\n\nAm 13. Dezember 1808 plünderten die Franzosen das Dorf; nach dem Aufstand der Bewohner kosteten die Vergeltungsmaßnahmen 39 Menschen das Leben, und die Kirche wurde angezündet."},{"h":"Sehenswert","t":"Im Inneren stehen mehrere Renaissancealtäre. Das Rathaus stammt aus dem 16. Jahrhundert, mit Renaissance-Loggia, und der Arco de la Villa war das Tor der Ummauerung.\n\nDas ehemalige Armenhospital, 2006 restauriert, ist ein Hausmuseum mit Hof, Stall, Küche, Esszimmer, Schlafzimmer und Speicher."},{"h":"Brauchtum und Feste","t":"Am vierten Fastensonntag wird die Virgen de Rodanas zur Einsiedelei San Miguel de los Santos getragen, um Regen zu erbitten, und man isst den „pastel de los Santos“. Die Feste des Niño Perdido sind um den 8. September, mit Versteigerung von Stäben und Bannern und einem Wettbewerb für handwerklichen Wein."}],"pt":[{"h":"História","t":"A igreja é do século XVI, com uma nave coberta por abóbada de nervuras estrelada e uma torre quadrada com decoração mudéjar rematada por um corpo octogonal. No século XVIII mudou-se a sua orientação, demoliu-se a abside original e acrescentaram-se cruzeiro e cabeceira novos.\n\nA 13 de dezembro de 1808 os franceses saquearam a aldeia; após o levantamento dos moradores, as represálias custaram a vida a 39 pessoas e a igreja foi incendiada."},{"h":"O que ver","t":"Lá dentro há vários retábulos renascentistas. A câmara é do século XVI, com logia renascentista, e o Arco de la Villa era a porta do recinto amuralhado.\n\nO antigo Hospital de Beneficência, restaurado em 2006, é uma casa-museu com pátio, cavalariça, cozinha, sala de jantar, quarto e celeiro."},{"h":"Tradições e festas","t":"No quarto domingo da Quaresma a Virgen de Rodanas sobe em romaria à ermida de San Miguel de los Santos para pedir chuva, e come-se o «pastel de los Santos». As festas do Niño Perdido são por volta de 8 de setembro, com leilão de paus e estandartes e concurso de vinho artesanal."}]},"status":"pending"},{"id":"san-miguel-talamantes","town":"Talamantes","cat":"patrimonio","lat":41.72774,"lon":-1.67821,"coord_src":null,"q":["Ermita de San Miguel, Talamantes","Talamantes"],"fq":["Talamantes ermita San Miguel","Category:Talamantes"],"name":{"es":"Ermita de San Miguel","en":"Ermita de San Miguel","fr":"Ermitage San Miguel","de":"Ermita de San Miguel","pt":"Ermida de San Miguel"},"when":{"es":"Siglo XIII · Ermita románica","en":"13th century · Romanesque hermitage","fr":"XIIIe siècle · Ermitage roman","de":"13. Jh. · Romanische Einsiedelei","pt":"Séc. XIII · Ermida românica"},"desc":{"es":"Al otro lado del barranco de Talamantes, la ermita de San Miguel es un templo románico del siglo XIII de una sola nave y ábside semicircular, en un paraje de mucha belleza al pie de las Peñas de Herrera.","en":"Across the Talamantes ravine, the hermitage of San Miguel is a 13th-century Romanesque church with a single nave and a semicircular apse, in a beautiful setting below the Peñas de Herrera.","fr":"De l'autre côté du ravin de Talamantes, l'ermitage San Miguel est un sanctuaire roman du XIIIe siècle à nef unique et abside semi-circulaire, dans un très beau site au pied des Peñas de Herrera.","de":"Jenseits der Schlucht von Talamantes ist die Einsiedelei San Miguel eine romanische Kirche aus dem 13. Jahrhundert mit einem Schiff und halbrunder Apsis, in schöner Lage unter den Peñas de Herrera.","pt":"Do outro lado da ravina de Talamantes, a ermida de San Miguel é um templo românico do século XIII de uma só nave e abside semicircular, num lugar de grande beleza ao pé das Peñas de Herrera."},"visit":{"es":"A pie desde el pueblo cruzando el barranco. El interior abre en las fiestas de finales de septiembre.","en":"On foot from the village across the ravine. The interior opens during the festivities at the end of September.","fr":"À pied depuis le village en traversant le ravin. L'intérieur ouvre lors des fêtes de fin septembre.","de":"Zu Fuß vom Dorf über die Schlucht. Das Innere öffnet zu den Festen Ende September.","pt":"A pé desde a aldeia atravessando a ravina. O interior abre nas festas do fim de setembro."},"src":"https://campodeborja.es/portfolio-item/talamantes/","sources":["https://campodeborja.es/portfolio-item/talamantes/","https://es.hispanopedia.com/wiki/Talamantes"],"art":{"es":[{"h":"Historia","t":"La ermita de San Miguel es románica, del siglo XIII según la comarca. Tiene una sola nave y ábside semicircular.\n\nEn el pueblo, la iglesia parroquial de San Pedro Apóstol es del siglo XVI y conserva pinturas murales góticas. En lo alto del cerro quedan restos del castillo atalaya, de la época sanjuanista."},{"h":"El paisaje","t":"Talamantes, a 924 metros, es el pueblo más alto de la comarca y el último de su carretera. Está en la confluencia de los barrancos de Valdeherrera y Valdetreviño, donde un puente medieval cruza el barranco."},{"h":"Tradiciones y fiestas","t":"Las fiestas patronales en honor a San Miguel Arcángel son del 27 al 29 de septiembre, y un mural del pueblo recuerda el Dance en su honor. En la segunda semana de agosto se celebra la semana cultural."}],"en":[{"h":"History","t":"The hermitage of San Miguel is Romanesque, from the 13th century according to the comarca. It has a single nave and a semicircular apse.\n\nIn the village, the parish church of San Pedro Apóstol dates from the 16th century and keeps Gothic wall paintings. On top of the hill are the remains of the watchtower castle, from the Hospitaller period."},{"h":"The landscape","t":"Talamantes, at 924 metres, is the highest village in the comarca and the last on its road. It lies where the Valdeherrera and Valdetreviño ravines meet, and a medieval bridge crosses the ravine there."},{"h":"Traditions and festivals","t":"The patron festivities in honour of Saint Michael the Archangel run from 27 to 29 September, and a mural in the village recalls the Dance in his honour. The cultural week is held in the second week of August."}],"fr":[{"h":"Histoire","t":"L'ermitage San Miguel est roman, du XIIIe siècle selon la comarque. Il a une seule nef et une abside semi-circulaire.\n\nAu village, l'église paroissiale San Pedro Apóstol date du XVIe siècle et conserve des peintures murales gothiques. Au sommet de la colline subsistent les restes du château-tour de guet, de l'époque des Hospitaliers."},{"h":"Le paysage","t":"Talamantes, à 924 mètres, est le village le plus haut de la comarque et le dernier de sa route. Il se trouve au confluent des ravins de Valdeherrera et de Valdetreviño, où un pont médiéval franchit le ravin."},{"h":"Traditions et fêtes","t":"Les fêtes patronales en l'honneur de saint Michel Archange ont lieu du 27 au 29 septembre, et une fresque du village rappelle la Danse en son honneur. La semaine culturelle se tient la deuxième semaine d'août."}],"de":[{"h":"Geschichte","t":"Die Einsiedelei San Miguel ist romanisch, laut der Comarca aus dem 13. Jahrhundert. Sie hat ein einziges Schiff und eine halbrunde Apsis.\n\nIm Dorf stammt die Pfarrkirche San Pedro Apóstol aus dem 16. Jahrhundert und bewahrt gotische Wandmalereien. Oben auf dem Hügel stehen Reste der Wachturmburg aus der Johanniterzeit."},{"h":"Die Landschaft","t":"Talamantes liegt auf 924 Metern und ist das höchste Dorf der Comarca und das letzte an seiner Straße. Es liegt am Zusammenfluss der Schluchten Valdeherrera und Valdetreviño, wo eine mittelalterliche Brücke die Schlucht quert."},{"h":"Brauchtum und Feste","t":"Das Patronatsfest zu Ehren des Erzengels Michael ist vom 27. bis 29. September; ein Wandbild im Dorf erinnert an den Dance zu seinen Ehren. Die Kulturwoche findet in der zweiten Augustwoche statt."}],"pt":[{"h":"História","t":"A ermida de San Miguel é românica, do século XIII segundo a comarca. Tem uma só nave e abside semicircular.\n\nNa aldeia, a igreja paroquial de San Pedro Apóstol é do século XVI e conserva pinturas murais góticas. No alto do cerro restam vestígios do castelo-atalaia, da época dos Hospitalários."},{"h":"A paisagem","t":"Talamantes, a 924 metros, é a aldeia mais alta da comarca e a última da sua estrada. Fica na confluência das ravinas de Valdeherrera e Valdetreviño, onde uma ponte medieval atravessa a ravina."},{"h":"Tradições e festas","t":"As festas em honra de São Miguel Arcanjo são de 27 a 29 de setembro, e um mural da aldeia recorda o Dance em sua honra. Na segunda semana de agosto realiza-se a semana cultural."}]},"status":"pending"},{"id":"moncayo-talamantes","town":"Talamantes","cat":"naturaleza","lat":41.73262,"lon":-1.71576,"coord_src":null,"q":["Peñas de Herrera","Talamantes"],"fq":["Peñas de Herrera","Talamantes Moncayo"],"name":{"es":"Peñas de Herrera y barrancos de Talamantes","en":"Peñas de Herrera and the Talamantes ravines","fr":"Peñas de Herrera et ravins de Talamantes","de":"Peñas de Herrera und Schluchten von Talamantes","pt":"Peñas de Herrera e ravinas de Talamantes"},"when":{"es":"Parque Natural del Moncayo · Peñas de Herrera","en":"Moncayo Natural Park · Peñas de Herrera","fr":"Parc naturel du Moncayo · Peñas de Herrera","de":"Naturpark Moncayo · Peñas de Herrera","pt":"Parque Natural do Moncayo · Peñas de Herrera"},"desc":{"es":"Parte del término de Talamantes está dentro del Parque Natural del Moncayo. Bajo las Peñas de Herrera salen sendas por los barrancos y hacia la sierra, entre ellas el GR 90 y la vuelta al Moncayo.","en":"Part of Talamantes lies within the Moncayo Natural Park. Below the Peñas de Herrera, paths set off along the ravines and up towards the range, among them the GR 90 and the round of the Moncayo.","fr":"Une partie de la commune de Talamantes se trouve dans le parc naturel du Moncayo. Sous les Peñas de Herrera partent des sentiers le long des ravins et vers le massif, dont le GR 90 et le tour du Moncayo.","de":"Ein Teil der Gemeinde Talamantes liegt im Naturpark Moncayo. Unter den Peñas de Herrera beginnen Wege durch die Schluchten und hinauf ins Gebirge, darunter der GR 90 und die Moncayo-Runde.","pt":"Parte do município de Talamantes está dentro do Parque Natural do Moncayo. Sob as Peñas de Herrera partem trilhos pelas ravinas e em direção à serra, entre eles o GR 90 e a volta ao Moncayo."},"visit":{"es":"Rutas de montaña: lleva agua, mapa y calzado adecuado, y consulta el tiempo; en invierno puede haber nieve y hielo.","en":"Mountain routes: take water, a map and suitable footwear, and check the weather; in winter there may be snow and ice.","fr":"Itinéraires de montagne : emportez de l'eau, une carte et des chaussures adaptées, et consultez la météo ; en hiver il peut y avoir neige et verglas.","de":"Bergtouren: Wasser, Karte und geeignetes Schuhwerk mitnehmen und das Wetter prüfen; im Winter kann es Schnee und Eis geben.","pt":"Percursos de montanha: leve água, mapa e calçado adequado, e consulte a meteorologia; no inverno pode haver neve e gelo."},"src":"https://campodeborja.es/portfolio-item/talamantes/","sources":["https://campodeborja.es/portfolio-item/talamantes/","https://es.hispanopedia.com/wiki/Talamantes","https://es.hispanopedia.com/wiki/Campo_de_Borja"],"art":{"es":[{"h":"El paisaje","t":"El Parque Natural del Moncayo se creó en 1978 como Dehesa del Moncayo y cambió de nombre en 1998. Ocupa unas 11.144 hectáreas, entre los 600 metros del río Huecha y los 2.315 del cerro de San Miguel, y Talamantes es uno de sus municipios.\n\nEl pueblo se levanta bajo los Picos o Peñas de Herrera; La Tonda, la Fuente Menera y Valdetreviño son otros parajes de valor del término."},{"h":"Rutas","t":"El GR 90 es el camino principal de la zona. La comarca propone también el GR 260 de la vuelta al Moncayo, la excursión de Talamantes al Collado de la Era, el sendero S-4 del barranco de Talamantes, el barranco de Valdeplata y el mirador de Escoplé.\n\nUna pista asfaltada une el pueblo con Añón y Alcalá de Moncayo."},{"h":"Para entenderlo","t":"El Moncayo es la máxima altura del Sistema Ibérico y marca el clima de la comarca: el agua que se filtra en sus laderas recarga los acuíferos que alimentan manantiales del valle del Huecha."}],"en":[{"h":"The landscape","t":"The Moncayo Natural Park was created in 1978 as the Dehesa del Moncayo and renamed in 1998. It covers about 11,144 hectares, between 600 metres at the Huecha river and 2,315 at the Cerro de San Miguel, and Talamantes is one of its municipalities.\n\nThe village sits below the Picos or Peñas de Herrera; La Tonda, the Fuente Menera and Valdetreviño are other places of note in the area."},{"h":"Routes","t":"The GR 90 is the main path in the area. The comarca also suggests the GR 260 round of the Moncayo, the walk from Talamantes to the Collado de la Era, the S-4 trail along the Talamantes ravine, the Valdeplata ravine and the Escoplé viewpoint.\n\nA paved track links the village with Añón and Alcalá de Moncayo."},{"h":"Background","t":"The Moncayo is the highest peak of the Iberian System and shapes the area's climate: water that seeps into its slopes recharges the aquifers that feed springs in the Huecha valley."}],"fr":[{"h":"Le paysage","t":"Le parc naturel du Moncayo fut créé en 1978 sous le nom de Dehesa del Moncayo et rebaptisé en 1998. Il couvre environ 11 144 hectares, entre les 600 mètres de la Huecha et les 2 315 du Cerro de San Miguel, et Talamantes est l'une de ses communes.\n\nLe village se dresse sous les Picos ou Peñas de Herrera ; La Tonda, la Fuente Menera et Valdetreviño sont d'autres sites remarquables du territoire."},{"h":"Itinéraires","t":"Le GR 90 est le principal chemin de la zone. La comarque propose aussi le GR 260 du tour du Moncayo, l'excursion de Talamantes au Collado de la Era, le sentier S-4 du ravin de Talamantes, le ravin de Valdeplata et le belvédère d'Escoplé.\n\nUne piste goudronnée relie le village à Añón et à Alcalá de Moncayo."},{"h":"Pour comprendre","t":"Le Moncayo est le point culminant du Système ibérique et marque le climat de la comarque : l'eau qui s'infiltre sur ses pentes recharge les aquifères qui alimentent des sources de la vallée de la Huecha."}],"de":[{"h":"Die Landschaft","t":"Der Naturpark Moncayo wurde 1978 als Dehesa del Moncayo gegründet und 1998 umbenannt. Er umfasst etwa 11.144 Hektar zwischen 600 Metern am Fluss Huecha und 2.315 am Cerro de San Miguel; Talamantes ist eine seiner Gemeinden.\n\nDas Dorf liegt unter den Picos oder Peñas de Herrera; La Tonda, die Fuente Menera und Valdetreviño sind weitere sehenswerte Orte der Gemeinde."},{"h":"Wege","t":"Der GR 90 ist der Hauptweg der Gegend. Die Comarca schlägt außerdem den GR 260 rund um den Moncayo vor, die Tour von Talamantes zum Collado de la Era, den Weg S-4 durch die Schlucht von Talamantes, die Schlucht von Valdeplata und den Aussichtspunkt Escoplé.\n\nEine asphaltierte Piste verbindet das Dorf mit Añón und Alcalá de Moncayo."},{"h":"Hintergrund","t":"Der Moncayo ist der höchste Gipfel des Iberischen Gebirges und prägt das Klima der Gegend: Das an seinen Hängen versickernde Wasser speist die Grundwasserleiter, aus denen Quellen im Huecha-Tal entspringen."}],"pt":[{"h":"A paisagem","t":"O Parque Natural do Moncayo foi criado em 1978 como Dehesa del Moncayo e mudou de nome em 1998. Ocupa cerca de 11 144 hectares, entre os 600 metros do rio Huecha e os 2315 do Cerro de San Miguel, e Talamantes é um dos seus municípios.\n\nA aldeia ergue-se sob os Picos ou Peñas de Herrera; La Tonda, a Fuente Menera e Valdetreviño são outros lugares de valor do município."},{"h":"Percursos","t":"O GR 90 é o caminho principal da zona. A comarca propõe também o GR 260 da volta ao Moncayo, a excursão de Talamantes ao Collado de la Era, o trilho S-4 da ravina de Talamantes, a ravina de Valdeplata e o miradouro de Escoplé.\n\nUma estrada asfaltada liga a aldeia a Añón e Alcalá de Moncayo."},{"h":"Para compreender","t":"O Moncayo é o ponto mais alto do Sistema Ibérico e marca o clima da comarca: a água que se infiltra nas suas encostas recarrega os aquíferos que alimentam nascentes do vale do Huecha."}]},"status":"pending"}],"towns":[{"name":"Borja","lat":41.83482,"lon":-1.53375},{"name":"Agón","lat":41.85645,"lon":-1.45331},{"name":"Ainzón","lat":41.81607,"lon":-1.5197},{"name":"Alberite de San Juan","lat":41.82028,"lon":-1.47096},{"name":"Albeta","lat":41.8265,"lon":-1.5012},{"name":"Ambel","lat":41.79535,"lon":-1.6156},{"name":"Bisimbre","lat":41.85601,"lon":-1.44333},{"name":"Bulbuente","lat":41.81929,"lon":-1.60244},{"name":"Bureta","lat":41.815,"lon":-1.4876},{"name":"Fréscano","lat":41.87432,"lon":-1.44955},{"name":"Fuendejalón","l
