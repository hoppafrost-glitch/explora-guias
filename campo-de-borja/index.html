:[{"h":"Geschichte","t":"Das Wandbild stammt von Elías García Martínez, Lehrer an einer Kunstschule in Saragossa, und hing jahrzehntelang unbeachtet in einer Kapelle des Heiligtums. Im Sommer 2012 versuchte Cecilia Giménez, eine 81-jährige Einwohnerin und Verehrerin des Heiligtums, es zu restaurieren, weil es stark beschädigt war.\n\nAm 7. August 2012 veröffentlichte das Centro de Estudios Borjanos die Nachricht auf seiner Website; die Regionalpresse griff sie auf, und binnen weniger Tage berichteten Medien in aller Welt."},{"h":"Sehenswert","t":"Das Original ist hinter Glas geschützt. Nahe dem Eingang erklärt ein Raum die Geschichte des Bildes und seiner Restaurierung, und seit März 2016 informiert ein Interpretationszentrum über den ganzen Vorgang.\n\nAußerdem gibt es einen Raum mit Versionen des Ecce Homo von zeitgenössischen Künstlern, eine Fotowand, an der man sein Gesicht ins Bild stecken kann, und einen Laden mit Andenken und Wein aus Borja."},{"h":"Wussten Sie?","t":"Schätzungsweise haben seit 2012 mehr als 300.000 Menschen aus etwa 130 Ländern das Heiligtum besucht; die Besucher markieren ihre Herkunft auf einer Karte. Das Heiligtum gehört einer Stiftung, deren einziger Träger die Stadt Borja ist.\n\nDas Ecce Homo ist heute Borjas bekanntestes Ziel und für viele Reisende das Tor zum Rest der Gegend."}],"pt":[{"h":"História","t":"A pintura mural é obra de Elías García Martínez, professor numa escola de arte de Saragoça, e esteve durante décadas numa capela do santuário sem chamar a atenção. No verão de 2012, Cecilia Giménez, uma moradora de 81 anos devota do santuário, tentou restaurá-la porque estava muito deteriorada.\n\nA 7 de agosto de 2012 o Centro de Estudios Borjanos publicou a notícia no seu site; a imprensa regional pegou nela e em poucos dias o caso estava nos meios de comunicação de todo o mundo."},{"h":"O que ver","t":"O mural original está protegido por um vidro. Perto da entrada, uma sala explica a história do quadro e do restauro, e desde março de 2016 funciona um centro interpretativo sobre todo o processo.\n\nHá também um espaço com versões do Ecce Homo de artistas contemporâneos, um photocall para pôr a cara no quadro e uma loja com recordações e vinho de Borja."},{"h":"Curiosidades","t":"Calcula-se que mais de 300 000 pessoas de uns 130 países visitaram o santuário desde 2012, e os visitantes marcam a sua origem num mapa. O santuário pertence a uma fundação cujo único patrono é a Câmara de Borja.\n\nO Ecce Homo é hoje a visita mais conhecida de Borja e, para muitos viajantes, a porta de entrada para o resto da comarca."}]},"status":"pending"},{"id":"bodegas-cerro-borja","town":"Borja","cat":"patrimonio","lat":41.84111,"lon":-1.54018,"coord_src":null,"q":["Bodegas, Borja","La Corona, Borja"],"fq":["Bodegas Borja Zaragoza cerro","Borja bodegas cuevas"],"name":{"es":"Bodegas excavadas del cerro","en":"Hillside wine cellars","fr":"Caves creusées dans les collines","de":"Weinkeller in den Hügeln","pt":"Adegas escavadas nos cerros"},"when":{"es":"Desde el siglo XIX · Bodegas excavadas en la roca","en":"From the 19th century · Cellars dug into the rock","fr":"Dès le XIXe siècle · Caves creusées dans la roche","de":"Ab dem 19. Jh. · In den Fels gegrabene Keller","pt":"Desde o séc. XIX · Adegas escavadas na rocha"},"desc":{"es":"Los cerros que rodean Borja están agujereados por bodegas excavadas a mano. En la comarca llegó a haber unas 400; en Borja quedan alrededor de un centenar, en la Cueva Esquilar, La Corona y bajo el cerro del castillo.","en":"The hills around Borja are honeycombed with cellars dug by hand. The area once had around 400; about a hundred remain in Borja, at Cueva Esquilar, La Corona and below the castle hill.","fr":"Les collines autour de Borja sont percées de caves creusées à la main. La comarque en a compté environ 400 ; il en reste une centaine à Borja, à la Cueva Esquilar, à La Corona et sous la colline du château.","de":"Die Hügel rund um Borja sind von handgegrabenen Kellern durchlöchert. In der Comarca gab es etwa 400; in Borja sind rund hundert erhalten, an der Cueva Esquilar, in La Corona und unter dem Burghügel.","pt":"Os cerros à volta de Borja estão furados por adegas escavadas à mão. Na comarca chegou a haver cerca de 400; em Borja restam uma centena, na Cueva Esquilar, em La Corona e por baixo do cerro do castelo."},"visit":{"es":"La mayoría son particulares: se ven por fuera, con sus puertas y respiraderos en la ladera. Para visitar una por dentro, pregunta en la oficina de turismo o en las bodegas de la Ruta de la Garnacha.","en":"Most are private: you see them from outside, with their doors and vents on the hillside. To visit one inside, ask at the tourist office or at the wineries of the Ruta de la Garnacha.","fr":"La plupart sont privées : on les voit de l'extérieur, avec leurs portes et leurs soupiraux sur le versant. Pour en visiter une, demandez à l'office de tourisme ou aux caves de la Ruta de la Garnacha.","de":"Die meisten sind privat: Man sieht sie von außen, mit Türen und Lüftungsschächten am Hang. Um einen von innen zu sehen, fragen Sie im Fremdenverkehrsamt oder bei den Kellereien der Ruta de la Garnacha.","pt":"A maioria é particular: veem-se por fora, com as portas e os respiradouros na encosta. Para visitar uma por dentro, pergunte no posto de turismo ou nas adegas da Ruta de la Garnacha."},"src":"https://es.hispanopedia.com/wiki/Borja_(Zaragoza)","sources":["https://es.hispanopedia.com/wiki/Borja_(Zaragoza)","https://campodeborja.es/portfolio-item/borja/","https://campodeborja.es/ruta-de-la-garnacha/"],"art":{"es":[{"h":"Historia","t":"La primera petición documentada para excavar una bodega en Borja es de 1863. La plaga de la filoxera, que arrasó los viñedos europeos en el siglo XIX, llegó a Borja en 1899.\n\nHoy algunas se han convertido en viviendas o merenderos, y muchas siguen sirviendo para guardar vino de elaboración casera."},{"h":"Qué ver","t":"Una bodega típica tiene un pasillo de entrada que baja hacia una sala principal abovedada, salas laterales, hornacinas para las velas y una lumbrera, un respiradero que sale a la superficie. Desde fuera reconocerás las lumbreras como pequeñas chimeneas entre los matorrales.\n\nLas zonas con más bodegas son la Cueva Esquilar, La Corona y las laderas al sur del cerro del castillo."},{"h":"Para entenderlo","t":"La temperatura constante bajo tierra es la clave: el vino se conservaba sin frío artificial. La comarca es hoy la Denominación de Origen Campo de Borja y se presenta como el «Imperio de la Garnacha»; la Ruta de la Garnacha, creada en 2009, reúne bodegas, restaurantes y alojamientos de la zona."}],"en":[{"h":"History","t":"The first recorded request to dig a cellar in Borja dates from 1863. Phylloxera, the plague that devastated Europe's vineyards in the 19th century, reached Borja in 1899.\n\nToday some have been turned into homes or picnic spots, and many are still used to keep home-made wine."},{"h":"What to see","t":"A typical cellar has an entrance passage sloping down to a vaulted main room, side rooms, niches for candles and a «lumbrera», a vent that comes up to the surface. From outside you will recognise the vents as small chimneys among the scrub.\n\nThe areas with most cellars are Cueva Esquilar, La Corona and the slopes south of the castle hill."},{"h":"Background","t":"The constant temperature underground is the key: wine kept without any artificial cooling. The area is now the Campo de Borja Designation of Origin and calls itself the «Empire of Garnacha»; the Ruta de la Garnacha, created in 2009, brings together wineries, restaurants and places to stay."}],"fr":[{"h":"Histoire","t":"La première demande documentée pour creuser une cave à Borja date de 1863. Le phylloxéra, le fléau qui ravagea les vignobles européens au XIXe siècle, atteignit Borja en 1899.\n\nAujourd'hui, certaines sont devenues des logements ou des lieux de pique-nique, et beaucoup servent encore à garder du vin fait maison."},{"h":"À voir","t":"Une cave typique a un couloir d'entrée qui descend vers une salle principale voûtée, des salles latérales, des niches pour les bougies et une « lumbrera », un soupirail qui débouche à la surface. De l'extérieur, vous reconnaîtrez les soupiraux à leurs petites cheminées parmi les broussailles.\n\nLes zones qui en comptent le plus sont la Cueva Esquilar, La Corona et les versants au sud de la colline du château."},{"h":"Pour comprendre","t":"La température constante sous terre est la clé : le vin se conservait sans froid artificiel. La comarque est aujourd'hui l'Appellation d'origine Campo de Borja et se présente comme l'« Empire de la Garnacha » ; la Ruta de la Garnacha, créée en 2009, réunit caves, restaurants et hébergements."}],"de":[{"h":"Geschichte","t":"Der erste dokumentierte Antrag, in Borja einen Keller zu graben, stammt von 1863. Die Reblaus, die im 19. Jahrhundert die Weinberge Europas verwüstete, erreichte Borja 1899.\n\nHeute sind einige zu Wohnungen oder Picknickorten umgebaut, und viele dienen noch zur Lagerung von selbstgemachtem Wein."},{"h":"Sehenswert","t":"Ein typischer Keller hat einen abfallenden Eingangsgang zu einem gewölbten Hauptraum, Nebenräume, Nischen für Kerzen und eine „lumbrera“, einen Lüftungsschacht an die Oberfläche. Von außen erkennen Sie die Schächte als kleine Schornsteine im Gestrüpp.\n\nAm dichtesten liegen sie an der Cueva Esquilar, in La Corona und an den Hängen südlich des Burghügels."},{"h":"Hintergrund","t":"Entscheidend ist die gleichbleibende Temperatur unter der Erde: Der Wein hielt sich ohne künstliche Kühlung. Die Gegend ist heute die Herkunftsbezeichnung Campo de Borja und nennt sich „Imperium der Garnacha“; die 2009 gegründete Ruta de la Garnacha vereint Kellereien, Restaurants und Unterkünfte."}],"pt":[{"h":"História","t":"O primeiro pedido documentado para escavar uma adega em Borja é de 1863. A filoxera, a praga que arrasou as vinhas europeias no século XIX, chegou a Borja em 1899.\n\nHoje algumas foram convertidas em casas ou merendeiros, e muitas continuam a servir para guardar vinho caseiro."},{"h":"O que ver","t":"Uma adega típica tem um corredor de entrada que desce para uma sala principal abobadada, salas laterais, nichos para as velas e uma «lumbrera», um respiradouro que sai à superfície. De fora reconhecerá os respiradouros como pequenas chaminés entre o mato.\n\nAs zonas com mais adegas são a Cueva Esquilar, La Corona e as encostas a sul do cerro do castelo."},{"h":"Para compreender","t":"A temperatura constante debaixo da terra é a chave: o vinho conservava-se sem frio artificial. A comarca é hoje a Denominação de Origem Campo de Borja e apresenta-se como o «Império da Garnacha»; a Ruta de la Garnacha, criada em 2009, reúne adegas, restaurantes e alojamentos."}]},"status":"pending"},{"id":"calvario-muela","town":"Borja","cat":"naturaleza","lat":41.85636,"lon":-1.57729,"coord_src":null,"q":["Ermita del Calvario, Borja","La Muela, Borja"],"fq":["Ermita del Calvario Borja","Muela de Borja"],"name":{"es":"Ermita del Calvario y la Muela","en":"Ermita del Calvario and the Muela","fr":"Ermitage du Calvario et la Muela","de":"Ermita del Calvario und die Muela","pt":"Ermida do Calvario e a Muela"},"when":{"es":"1565-1566 · Ermita circular a 840 metros","en":"1565–1566 · Round hermitage at 840 metres","fr":"1565-1566 · Ermitage circulaire à 840 mètres","de":"1565–1566 · Runde Einsiedelei auf 840 Metern","pt":"1565-1566 · Ermida circular a 840 metros"},"desc":{"es":"En lo alto de la Muela, a 840 metros, una ermita circular de sillería del siglo XVI vigila Borja. Es el mejor mirador de la ciudad y la puerta a los caminos de la Muela.","en":"On top of the Muela, at 840 metres, a round 16th-century ashlar hermitage watches over Borja. It is the best viewpoint over the town and the gateway to the Muela's tracks.","fr":"Au sommet de la Muela, à 840 mètres, un ermitage circulaire en pierre de taille du XVIe siècle veille sur Borja. C'est le meilleur belvédère sur la ville et la porte des chemins de la Muela.","de":"Oben auf der Muela, in 840 Metern Höhe, wacht eine runde Einsiedelei aus Quadersteinen aus dem 16. Jahrhundert über Borja. Sie ist der beste Aussichtspunkt über der Stadt und Ausgangspunkt der Wege der Muela.","pt":"No alto da Muela, a 840 metros, uma ermida circular de cantaria do século XVI vigia Borja. É o melhor miradouro da cidade e a porta para os caminhos da Muela."},"visit":{"es":"Se sube a pie o en bici por pistas desde Borja. Lleva agua y evita las horas de calor en verano. El interior de la ermita abre en celebraciones.","en":"Reached on foot or by bike along tracks from Borja. Take water and avoid the hottest hours in summer. The hermitage opens for celebrations.","fr":"On y monte à pied ou à vélo par des pistes depuis Borja. Prenez de l'eau et évitez les heures chaudes en été. L'intérieur ouvre lors des célébrations.","de":"Zu Fuß oder mit dem Rad über Pisten von Borja aus. Wasser mitnehmen und im Sommer die heißen Stunden meiden. Das Innere öffnet zu Festen.","pt":"Sobe-se a pé ou de bicicleta por caminhos desde Borja. Leve água e evite as horas de calor no verão. O interior abre nas celebrações."},"src":"https://es.hispanopedia.com/wiki/Borja_(Zaragoza)","sources":["https://es.hispanopedia.com/wiki/Borja_(Zaragoza)","https://campodeborja.es/portfolio-item/borja/"],"art":{"es":[{"h":"Historia","t":"La ermita del Calvario se construyó entre 1565 y 1566 en piedra sillar, con planta circular, algo poco habitual en Aragón. En 1586 se trasladó aquí desde la colegiata un crucifijo y se añadieron capillas laterales. Guarda una imagen de Cristo del siglo XVI.\n\nBorja tiene otras ermitas en sus alrededores, como la del Santo Sepulcro, barroca de 1690, a 1,6 km de la ciudad."},{"h":"El paisaje","t":"La Muela es una plataforma que supera los 700 metros, cortada por barrancos, al norte del río Huecha. Desde el Calvario se ven el casco de Borja, el valle y, hacia el oeste, el Moncayo.\n\nLa comarca señala en esta zona los miradores del Alto de la Muela y del Balcón del Buste, y una red de senderos que une la Muela con el Santuario de Misericordia."},{"h":"Curiosidades","t":"En la Muela está la Cueva de Moncín, con pinturas rupestres incluidas desde 1998 en el arte rupestre del arco mediterráneo, Patrimonio Mundial. No se visita libremente: si te interesa, pregunta en el Museo Arqueológico."}],"en":[{"h":"History","t":"The Ermita del Calvario was built between 1565 and 1566 in dressed stone, with a circular plan, something unusual in Aragon. In 1586 a crucifix was brought here from the collegiate church and side chapels were added. It keeps a 16th-century figure of Christ.\n\nBorja has other hermitages nearby, such as the Santo Sepulcro, Baroque, from 1690, 1.6 km from town."},{"h":"The landscape","t":"The Muela is a plateau over 700 metres high, cut by ravines, north of the Huecha river. From the Calvario you can see the old town of Borja, the valley and, to the west, the Moncayo.\n\nThe comarca points out the Alto de la Muela and Balcón del Buste viewpoints here, and a network of trails linking the Muela with the Santuario de Misericordia."},{"h":"Did you know?","t":"The Muela is home to the Cueva de Moncín, with rock paintings included since 1998 in the rock art of the Mediterranean Basin, a World Heritage Site. It cannot be visited freely: if you are interested, ask at the Archaeological Museum."}],"fr":[{"h":"Histoire","t":"L'ermitage du Calvario fut construit entre 1565 et 1566 en pierre de taille, sur un plan circulaire, peu courant en Aragon. En 1586, on y transféra un crucifix de la collégiale et on ajouta des chapelles latérales. Il conserve une image du Christ du XVIe siècle.\n\nBorja a d'autres ermitages aux alentours, comme celui du Santo Sepulcro, baroque, de 1690, à 1,6 km de la ville."},{"h":"Le paysage","t":"La Muela est un plateau de plus de 700 mètres, entaillé de ravins, au nord de la Huecha. Depuis le Calvario, on voit la vieille ville de Borja, la vallée et, à l'ouest, le Moncayo.\n\nLa comarque signale ici les belvédères de l'Alto de la Muela et du Balcón del Buste, et un réseau de sentiers qui relie la Muela au sanctuaire de Misericordia."},{"h":"Le saviez-vous ?","t":"Sur la Muela se trouve la Cueva de Moncín, dont les peintures rupestres font partie depuis 1998 de l'art rupestre du bassin méditerranéen, patrimoine mondial. Elle ne se visite pas librement : si cela vous intéresse, renseignez-vous au Musée archéologique."}],"de":[{"h":"Geschichte","t":"Die Ermita del Calvario wurde 1565–1566 aus Quadersteinen auf rundem Grundriss gebaut, in Aragonien eher ungewöhnlich. 1586 brachte man ein Kruzifix aus der Stiftskirche hierher und fügte Seitenkapellen an. Sie bewahrt eine Christusfigur aus dem 16. Jahrhundert.\n\nBorja hat weitere Einsiedeleien in der Umgebung, etwa die barocke des Santo Sepulcro von 1690, 1,6 km von der Stadt."},{"h":"Die Landschaft","t":"Die Muela ist eine von Schluchten durchzogene Hochfläche von über 700 Metern nördlich des Flusses Huecha. Vom Calvario sieht man die Altstadt von Borja, das Tal und im Westen den Moncayo.\n\nDie Comarca weist hier die Aussichtspunkte Alto de la Muela und Balcón del Buste aus sowie ein Wegenetz, das die Muela mit dem Santuario de Misericordia verbindet."},{"h":"Wussten Sie?","t":"Auf der Muela liegt die Cueva de Moncín, deren Felsmalereien seit 1998 zur Felskunst im Mittelmeerraum gehören, einem Welterbe. Sie ist nicht frei zugänglich: Bei Interesse im Archäologischen Museum nachfragen."}],"pt":[{"h":"História","t":"A ermida do Calvario foi construída entre 1565 e 1566 em pedra de cantaria, com planta circular, algo pouco habitual em Aragão. Em 1586 trouxe-se para aqui um crucifixo da colegiada e acrescentaram-se capelas laterais. Guarda uma imagem de Cristo do século XVI.\n\nBorja tem outras ermidas nos arredores, como a do Santo Sepulcro, barroca, de 1690, a 1,6 km da cidade."},{"h":"A paisagem","t":"A Muela é uma plataforma com mais de 700 metros, cortada por ravinas, a norte do rio Huecha. Do Calvario veem-se o centro de Borja, o vale e, a oeste, o Moncayo.\n\nA comarca assinala aqui os miradouros do Alto de la Muela e do Balcón del Buste, e uma rede de trilhos que liga a Muela ao Santuário de Misericordia."},{"h":"Curiosidades","t":"Na Muela fica a Cueva de Moncín, com pinturas rupestres incluídas desde 1998 na arte rupestre do arco mediterrânico, Património Mundial. Não se visita livremente: se lhe interessar, pergunte no Museu Arqueológico."}]},"status":"pending"},{"id":"estanca-borja","town":"Borja","cat":"naturaleza","lat":41.88879,"lon":-1.51939,"coord_src":null,"q":["La Estanca, Borja","Laguna de la Estanca, Borja"],"fq":["Estanca de Borja","Category:Casa de la Estanca (Borja)"],"name":{"es":"Laguna y Casa de la Estanca","en":"La Estanca lagoon and house","fr":"Lagune et maison de La Estanca","de":"Lagune und Haus La Estanca","pt":"Lagoa e Casa de la Estanca"},"when":{"es":"Siglo XVI · Laguna y casa mudéjar","en":"16th century · Lagoon and Mudéjar house","fr":"XVIe siècle · Lagune et maison mudéjare","de":"16. Jh. · Lagune und Mudéjar-Haus","pt":"Séc. XVI · Lagoa e casa mudéjar"},"desc":{"es":"A unos 6 km de Borja, la Estanca es una laguna rodeada de chopos y carrizo, buen lugar para ver aves. A su lado, la Casa de la Estanca es un edificio del siglo XVI con decoración mudéjar, Bien de Interés Cultural desde 2001.","en":"About 6 km from Borja, La Estanca is a lagoon fringed with poplars and reeds, a good spot for birdwatching. Next to it, the Casa de la Estanca is a 16th-century building with Mudéjar decoration, a Site of Cultural Interest since 2001.","fr":"À environ 6 km de Borja, La Estanca est une lagune bordée de peupliers et de roseaux, un bon endroit pour observer les oiseaux. À côté, la Casa de la Estanca est un édifice du XVIe siècle à décor mudéjar, Bien d'intérêt culturel depuis 2001.","de":"Etwa 6 km von Borja liegt La Estanca, eine von Pappeln und Schilf gesäumte Lagune, gut zur Vogelbeobachtung. Daneben steht die Casa de la Estanca, ein Bau aus dem 16. Jahrhundert mit Mudéjar-Dekor, seit 2001 Kulturgut.","pt":"A cerca de 6 km de Borja, La Estanca é uma lagoa rodeada de choupos e caniço, bom lugar para observar aves. Ao lado, a Casa de la Estanca é um edifício do século XVI com decoração mudéjar, Bem de Interesse Cultural desde 2001."},"visit":{"es":"Acceso libre al entorno de la laguna por camino. La casa es de propiedad particular y se ve por fuera.","en":"Free access to the lagoon surroundings by track. The house is privately owned and seen from outside.","fr":"Accès libre aux abords de la lagune par chemin. La maison est privée et se voit de l'extérieur.","de":"Freier Zugang zur Umgebung der Lagune über Wege. Das Haus ist in Privatbesitz und von außen zu sehen.","pt":"Acesso livre aos arredores da lagoa por caminho. A casa é privada e vê-se por fora."},"src":"https://es.hispanopedia.com/wiki/Borja_(Zaragoza)","sources":["https://es.hispanopedia.com/wiki/Borja_(Zaragoza)","https://campodeborja.es/portfolio-item/borja/","https://campodeborja.es/portfolio-item/ornitologia/"],"art":{"es":[{"h":"Historia","t":"La Casa de la Estanca es un edificio civil del siglo XVI con decoración mudéjar en ladrillo. Fue declarada Bien de Interés Cultural en 2001."},{"h":"El paisaje","t":"La comarca la incluye entre sus espacios naturales y en su propuesta de ornitología. Los caminos que la rodean son un buen sitio para pasear y observar aves con prismáticos.\n\nDesde aquí se ve la sierra del Moncayo, que marca el clima de toda la parte occidental de la comarca y alimenta los manantiales del valle."},{"h":"Para entenderlo","t":"El Campo de Borja es tierra de cierzo y de pocas lluvias. Lagunas como la Estanca, o las de Agón y Plantados en el bajo Huecha, son islas de humedad en un paisaje de viñas, olivos y cereal."}],"en":[{"h":"History","t":"The Casa de la Estanca is a 16th-century civil building with Mudéjar brick decoration. It was declared a Site of Cultural Interest in 2001."},{"h":"The landscape","t":"The comarca includes it among its natural areas and in its birdwatching suggestions. The tracks around it are a good place for a walk and for watching birds with binoculars.\n\nFrom here you can see the Moncayo range, which shapes the climate of the whole western part of the area and feeds the valley's springs."},{"h":"Background","t":"Campo de Borja is a land of cierzo wind and little rain. Lagoons such as La Estanca, or those of Agón and Plantados in the lower Huecha, are islands of moisture in a landscape of vines, olives and cereal."}],"fr":[{"h":"Histoire","t":"La Casa de la Estanca est un édifice civil du XVIe siècle à décor mudéjar en brique. Elle fut déclarée Bien d'intérêt culturel en 2001."},{"h":"Le paysage","t":"La comarque l'inclut parmi ses espaces naturels et dans ses propositions d'ornithologie. Les chemins qui l'entourent se prêtent à la promenade et à l'observation des oiseaux aux jumelles.\n\nD'ici, on voit le massif du Moncayo, qui marque le climat de toute la partie ouest de la comarque et alimente les sources de la vallée."},{"h":"Pour comprendre","t":"Le Campo de Borja est une terre de cierzo et de faibles pluies. Des lagunes comme La Estanca, ou celles d'Agón et de Plantados dans la basse Huecha, sont des îlots d'humidité dans un paysage de vignes, d'oliviers et de céréales."}],"de":[{"h":"Geschichte","t":"Die Casa de la Estanca ist ein Profanbau aus dem 16. Jahrhundert mit Backsteindekor im Mudéjar-Stil. 2001 wurde sie zum Kulturgut von besonderem Interesse erklärt."},{"h":"Die Landschaft","t":"Die Comarca zählt sie zu ihren Naturräumen und zu ihren Vorschlägen für Vogelbeobachtung. Die Wege ringsum eignen sich für einen Spaziergang und zum Beobachten von Vögeln mit dem Fernglas.\n\nVon hier sieht man das Moncayo-Massiv, das das Klima im ganzen Westen der Gegend prägt und die Quellen des Tals speist."},{"h":"Hintergrund","t":"Das Campo de Borja ist ein Land des Cierzo-Windes und geringer Niederschläge. Lagunen wie La Estanca oder die von Agón und Plantados an der unteren Huecha sind Feuchtinseln in einer Landschaft aus Reben, Oliven und Getreide."}],"pt":[{"h":"História","t":"A Casa de la Estanca é um edifício civil do século XVI com decoração mudéjar em tijolo. Foi declarada Bem de Interesse Cultural em 2001."},{"h":"A paisagem","t":"A comarca inclui-a entre os seus espaços naturais e na sua proposta de observação de aves. Os caminhos à volta são bons para passear e observar aves com binóculos.\n\nDaqui vê-se a serra do Moncayo, que marca o clima de toda a parte ocidental da comarca e alimenta as nascentes do vale."},{"h":"Para compreender","t":"O Campo de Borja é terra de cierzo e de pouca chuva. Lagoas como La Estanca, ou as de Agón e Plantados no baixo Huecha, são ilhas de humidade numa paisagem de vinhas, oliveiras e cereal."}]},"status":"pending"},{"id":"ainzon-casco","town":"Ainzón","cat":"patrimonio","lat":41.81696,"lon":-1.52113,"coord_src":null,"q":["Arco de San Antón, Ainzón","Plaza Marcos Zapata, Ainzón"],"fq":["Category:Ainzón","Ainzón Zaragoza"],"name":{"es":"Arco de San Antón y palacio de los abades","en":"Arco de San Antón and the abbots' palace","fr":"Arco de San Antón et palais des abbés","de":"Arco de San Antón und Abtspalast","pt":"Arco de San Antón e palácio dos abades"},"when":{"es":"Siglos XV-XVIII · Villa de los abades de Veruela","en":"15th–18th c. · Town of the abbots of Veruela","fr":"XVe–XVIIIe s. · Bourg des abbés de Veruela","de":"15.–18. Jh. · Ort der Äbte von Veruela","pt":"Séc. XV–XVIII · Vila dos abades de Veruela"},"desc":{"es":"Ainzón se asienta en una loma sobre el valle del Huecha, rodeada de viñas. El arco de San Antón, el palacio de los abades de Veruela y sus casonas con escudo cuentan cuatro siglos de historia; la ruta del Moncayo la llama «capital del Imperio de la Garnacha».","en":"Ainzón sits on a low hill above the Huecha valley, surrounded by vineyards. The arch of San Antón, the palace of the abbots of Veruela and its houses with coats of arms tell four centuries of history; the Moncayo route calls it «capital of the Empire of Garnacha».","fr":"Ainzón s'étend sur une colline au-dessus de la vallée de la Huecha, entourée de vignes. L'arc de San Antón, le palais des abbés de Veruela et ses demeures à blason racontent quatre siècles d'histoire ; la route du Moncayo la nomme « capitale de l'Empire de la Garnacha ».","de":"Ainzón liegt auf einer Anhöhe über dem Huecha-Tal, umgeben von Weinbergen. Der Bogen von San Antón, der Palast der Äbte von Veruela und die Häuser mit Wappen erzählen vier Jahrhunderte Geschichte; die Moncayo-Route nennt es „Hauptstadt des Imperiums der Garnacha“.","pt":"Ainzón assenta numa colina sobre o vale do Huecha, rodeada de vinhas. O arco de San Antón, o palácio dos abades de Veruela e as casas brasonadas contam quatro séculos de história; a rota do Moncayo chama-lhe «capital do Império da Garnacha»."},"visit":{"es":"Paseo libre por el casco. Pregunta en el Ayuntamiento o en la oficina comarcal (976 852 858) por las visitas a bodegas.","en":"Free stroll through the old town. Ask at the town hall or the comarca office (976 852 858) about winery visits.","fr":"Promenade libre dans le vieux bourg. Renseignez-vous à la mairie ou au bureau de la comarque (976 852 858) pour les visites de caves.","de":"Freier Rundgang durch den Ortskern. Für Kellereibesuche im Rathaus oder im Büro der Comarca (976 852 858) fragen.","pt":"Passeio livre pelo centro. Pergunte na câmara ou no gabinete da comarca (976 852 858) pelas visitas a adegas."},"src":"https://campodeborja.es/portfolio-item/ainzon/","sources":["https://campodeborja.es/portfolio-item/ainzon/","https://es.hispanopedia.com/wiki/Ainzón","https://campodeborja.es/wp-content/uploads/2024/04/es-ruta-corazon-moncayo.pdf","https://campodeborja.es/wp-content/uploads/2024/03/Folleto-Campo-de-Borja-_EN_2024_v1.pdf"],"art":{"es":[{"h":"Historia","t":"Alfonso I el Batallador la reconquistó en 1121. A finales del siglo XIV formó parte del señorío de la reina María de Luna y a mediados del XV la compró el monasterio de Veruela, cuyos abades fueron señores de la villa hasta 1835.\n\nSu nombre podría venir del árabe «ayn», fuente, lo que apunta a un origen musulmán. Felipe V le dio el título de «Muy Leal» por su papel en la defensa de Borja durante la Guerra de Sucesión."},{"h":"Qué ver","t":"El arco de San Antón es el único resto de las antiguas puertas de la villa. El palacio de los abades de Veruela, muy transformado, envuelve lo que queda del castillo medieval.\n\nRecorre el casco para ver casas de los siglos XVI, XVII y XVIII con escudos familiares, la plaza de Marcos Zapata con su fuente y el lavadero, y un puente sobre el barranco que la comarca describe como románico."},{"h":"Tradiciones y fiestas","t":"El 15 de septiembre se celebra la Fiesta de la Vendimia, que el folleto comarcal destaca por su valor turístico y gastronómico, y entre el 13 y el 17 de septiembre son las fiestas del Santo Cristo. En la villa hay bodegas de la Denominación de Origen Campo de Borja y en la época contemporánea se elaboraron aquí cavas de calidad.\n\nAinzón es la cuna del poeta y dramaturgo Marcos Zapata, que da nombre a la plaza."}],"en":[{"h":"History","t":"Alfonso I the Battler took it in 1121. At the end of the 14th century it was part of the lordship of Queen María de Luna, and in the mid-15th century it was bought by the monastery of Veruela, whose abbots were lords of the town until 1835.\n\nIts name may come from the Arabic «ayn», spring, suggesting a Muslim origin. Philip V gave it the title «Muy Leal» for its part in the defence of Borja during the War of the Spanish Succession."},{"h":"What to see","t":"The arch of San Antón is the only surviving gate of the old town walls. The heavily altered palace of the abbots of Veruela wraps around what is left of the medieval castle.\n\nWalk through the old town to see 16th-, 17th- and 18th-century houses with family coats of arms, the Plaza de Marcos Zapata with its fountain and the wash house, and a bridge over the ravine that the comarca describes as Romanesque."},{"h":"Traditions and festivals","t":"On 15 September Ainzón holds its Grape Harvest Festival, which the comarca's leaflet highlights for its tourist and food value, and from 13 to 17 September are the festivities of the Santo Cristo. The town has wineries of the Campo de Borja Designation of Origin, and in modern times quality sparkling wines were made here.\n\nAinzón is the birthplace of the poet and playwright Marcos Zapata, after whom the square is named."}],"fr":[{"h":"Histoire","t":"Alphonse Ier le Batailleur la reconquit en 1121. À la fin du XIVe siècle, elle fit partie de la seigneurie de la reine María de Luna, et au milieu du XVe elle fut achetée par le monastère de Veruela, dont les abbés furent seigneurs du bourg jusqu'en 1835.\n\nSon nom pourrait venir de l'arabe « ayn », source, ce qui suggère une origine musulmane. Philippe V lui accorda le titre de « Muy Leal » pour son rôle dans la défense de Borja pendant la guerre de Succession."},{"h":"À voir","t":"L'arc de San Antón est le seul vestige des anciennes portes du bourg. Le palais des abbés de Veruela, très transformé, englobe ce qui reste du château médiéval.\n\nParcourez le vieux bourg pour voir des maisons des XVIe, XVIIe et XVIIIe siècles ornées de blasons, la Plaza de Marcos Zapata avec sa fontaine et le lavoir, et un pont sur le ravin que la comarque décrit comme roman."},{"h":"Traditions et fêtes","t":"Le 15 septembre a lieu la Fête des Vendanges, que la brochure de la comarque met en avant pour sa valeur touristique et gastronomique, et du 13 au 17 septembre les fêtes du Santo Cristo. Le bourg compte des caves de l'Appellation d'origine Campo de Borja et, à l'époque contemporaine, on y élabora des vins mousseux de qualité.\n\nAinzón est la ville natale du poète et dramaturge Marcos Zapata, qui donne son nom à la place."}],"de":[{"h":"Geschichte","t":"Alfons I. der Kämpfer eroberte es 1121. Ende des 14. Jahrhunderts gehörte es zur Herrschaft von Königin María de Luna, Mitte des 15. kaufte es das Kloster Veruela, dessen Äbte bis 1835 Herren des Ortes waren.\n\nDer Name könnte vom arabischen „ayn“, Quelle, kommen, was auf einen muslimischen Ursprung deutet. Philipp V. verlieh ihm den Titel „Muy Leal“ für seine Rolle bei der Verteidigung Borjas im Erbfolgekrieg."},{"h":"Sehenswert","t":"Der Bogen von San Antón ist das einzige erhaltene alte Tor des Ortes. Der stark veränderte Palast der Äbte von Veruela umschließt die Reste der mittelalterlichen Burg.\n\nIm Ortskern sehen Sie Häuser aus dem 16., 17. und 18. Jahrhundert mit Familienwappen, die Plaza de Marcos Zapata mit Brunnen und Waschhaus sowie eine Brücke über die Schlucht, die die Comarca als romanisch beschreibt."},{"h":"Brauchtum und Feste","t":"Am 15. September findet das Weinlesefest statt, das der Prospekt der Comarca wegen seines touristischen und kulinarischen Werts hervorhebt, und vom 13. bis 17. September die Feste des Santo Cristo. Im Ort gibt es Kellereien der Herkunftsbezeichnung Campo de Borja, und in jüngerer Zeit wurden hier hochwertige Schaumweine hergestellt.\n\nAinzón ist der Geburtsort des Dichters und Dramatikers Marcos Zapata, nach dem der Platz benannt ist."}],"pt":[{"h":"História","t":"Afonso I, o Batalhador, conquistou-a em 1121. No fim do século XIV fez parte do senhorio da rainha María de Luna e em meados do XV foi comprada pelo mosteiro de Veruela, cujos abades foram senhores da vila até 1835.\n\nO nome pode vir do árabe «ayn», fonte, o que aponta para uma origem muçulmana. Filipe V deu-lhe o título de «Muy Leal» pelo seu papel na defesa de Borja durante a Guerra da Sucessão."},{"h":"O que ver","t":"O arco de San Antón é o único resto das antigas portas da vila. O palácio dos abades de Veruela, muito transformado, envolve o que resta do castelo medieval.\n\nPercorra o centro para ver casas dos séculos XVI, XVII e XVIII com brasões de família, a Plaza de Marcos Zapata com a sua fonte e o lavadouro, e uma ponte sobre a ravina que a comarca descreve como românica."},{"h":"Tradições e festas","t":"A 15 de setembro celebra-se a Festa da Vindima, que o folheto comarcal destaca pelo seu valor turístico e gastronómico, e de 13 a 17 de setembro as festas do Santo Cristo. A vila tem adegas da Denominação de Origem Campo de Borja e, na época contemporânea, aqui se elaboraram espumantes de qualidade.\n\nAinzón é a terra natal do poeta e dramaturgo Marcos Zapata, que dá nome à praça."}]},"status":"pending"},{"id":"iglesia-piedad-ainzon","town":"Ainzón","cat":"patrimonio","lat":41.81694,"lon":-1.51911,"coord_src":null,"q":["Iglesia de Nuestra Señora de la Piedad, Ainzón","Iglesia, Ainzón"],"fq":["Iglesia Ainzón","Category:Iglesia de Nuestra Señora de la Piedad (Ainzón)"],"name":{"es":"Iglesia de Nuestra Señora de la Piedad","en":"Church of Nuestra Señora de la Piedad","fr":"Église Nuestra Señora de la Piedad","de":"Kirche Nuestra Señora de la Piedad","pt":"Igreja de Nuestra Señora de la Piedad"},"when":{"es":"Siglo XVII · Barroca con decoración rococó","en":"17th century · Baroque with Rococo decoration","fr":"XVIIe siècle · Baroque à décor rococo","de":"17. Jh. · Barock mit Rokoko-Dekor","pt":"Séc. XVII · Barroca com decoração rococó"},"desc":{"es":"La parroquia de Ainzón es un templo barroco con decoración rococó que guarda tallas góticas de gran interés, sobre todo el Santo Cristo de la Capilla.","en":"Ainzón's parish church is a Baroque building with Rococo decoration that keeps Gothic carvings of great interest, above all the Santo Cristo de la Capilla.","fr":"L'église paroissiale d'Ainzón est un édifice baroque à décor rococo qui conserve des sculptures gothiques de grand intérêt, surtout le Santo Cristo de la Capilla.","de":"Die Pfarrkirche von Ainzón ist ein Barockbau mit Rokoko-Dekor, der gotische Schnitzfiguren von großem Interesse bewahrt, vor allem den Santo Cristo de la Capilla.","pt":"A igreja paroquial de Ainzón é um templo barroco com decoração rococó que guarda talhas góticas de grande interesse, sobretudo o Santo Cristo de la Capilla."},"visit":{"es":"Abre en horario de culto. Para el museo parroquial, pregunta en el Ayuntamiento.","en":"Open during services. For the parish museum, ask at the town hall.","fr":"Ouverte aux heures de culte. Pour le musée paroissial, renseignez-vous à la mairie.","de":"Zu Gottesdiensten geöffnet. Für das Pfarrmuseum im Rathaus fragen.","pt":"Abre nas horas de culto. Para o museu paroquial, pergunte na câmara."},"src":"https://campodeborja.es/portfolio-item/ainzon/","sources":["https://campodeborja.es/portfolio-item/ainzon/","https://es.hispanopedia.com/wiki/Ainzón","https://campodeborja.es/wp-content/uploads/2024/04/es-ruta-corazon-moncayo.pdf"],"art":{"es":[{"h":"Historia","t":"La iglesia de Nuestra Señora de la Piedad es barroca; la ruta del Moncayo de Slow Driving Aragón la sitúa en el siglo XVII. Se decoró después al gusto rococó.\n\nEl Santo Cristo y una imagen de la Virgen que se veneran aquí pertenecieron antes a un calvario."},{"h":"Qué ver","t":"Dentro destacan las tallas góticas, en especial el Santo Cristo de la Capilla, y unas tablas pintadas atribuidas a Juan Fernández Rodríguez. La comarca incluye el Museo Parroquial de Ainzón entre sus puntos de interés.\n\nLa ermita de San Roque y San Sebastián, del siglo XVII, pasó a manos particulares tras la desamortización."},{"h":"Tradiciones y fiestas","t":"El Santo Cristo es el centro de las fiestas de septiembre, del 13 al 17. El 15 y el 16 de agosto se celebran la Asunción y San Roque, y el 20 de enero San Sebastián."}],"en":[{"h":"History","t":"The church of Nuestra Señora de la Piedad is Baroque; Slow Driving Aragón's Moncayo route dates it to the 17th century. It was later decorated in the Rococo taste.\n\nThe Santo Cristo and an image of the Virgin venerated here once belonged to a calvary."},{"h":"What to see","t":"Inside, the Gothic carvings stand out, especially the Santo Cristo de la Capilla, as do panel paintings attributed to Juan Fernández Rodríguez. The comarca lists Ainzón's Parish Museum among its points of interest.\n\nThe hermitage of San Roque and San Sebastián, from the 17th century, passed into private hands after the disentailment."},{"h":"Traditions and festivals","t":"The Santo Cristo is at the heart of the September festivities, from 13 to 17. On 15 and 16 August the Assumption and San Roque are celebrated, and San Sebastián on 20 January."}],"fr":[{"h":"Histoire","t":"L'église Nuestra Señora de la Piedad est baroque ; la route du Moncayo de Slow Driving Aragón la situe au XVIIe siècle. Elle fut ensuite décorée au goût rococo.\n\nLe Santo Cristo et une image de la Vierge vénérés ici appartenaient autrefois à un calvaire."},{"h":"À voir","t":"À l'intérieur se distinguent les sculptures gothiques, en particulier le Santo Cristo de la Capilla, et des panneaux peints attribués à Juan Fernández Rodríguez. La comarque compte le Musée paroissial d'Ainzón parmi ses points d'intérêt.\n\nL'ermitage de San Roque et San Sebastián, du XVIIe siècle, passa en mains privées après la désamortisation."},{"h":"Traditions et fêtes","t":"Le Santo Cristo est au cœur des fêtes de septembre, du 13 au 17. Les 15 et 16 août on célèbre l'Assomption et San Roque, et le 20 janvier San Sebastián."}],"de":[{"h":"Geschichte","t":"Die Kirche Nuestra Señora de la Piedad ist barock; die Moncayo-Route von Slow Driving Aragón datiert sie ins 17. Jahrhundert. Später wurde sie im Rokoko-Geschmack ausgestattet.\n\nDer Santo Cristo und ein Marienbild, die hier verehrt werden, gehörten früher zu einem Kalvarienberg."},{"h":"Sehenswert","t":"Im Inneren fallen die gotischen Figuren auf, besonders der Santo Cristo de la Capilla, sowie Tafelbilder, die Juan Fernández Rodríguez zugeschrieben werden. Die Comarca führt das Pfarrmuseum von Ainzón unter ihren Sehenswürdigkeiten.\n\nDie Einsiedelei San Roque und San Sebastián aus dem 17. Jahrhundert ging nach der Säkularisation in Privatbesitz über."},{"h":"Brauchtum und Feste","t":"Der Santo Cristo steht im Mittelpunkt der Septemberfeste vom 13. bis 17. Am 15. und 16. August feiert man Mariä Himmelfahrt und San Roque, am 20. Januar San Sebastián."}],"pt":[{"h":"História","t":"A igreja de Nuestra Señora de la Piedad é barroca; a rota do Moncayo da Slow Driving Aragón situa-a no século XVII. Foi depois decorada ao gosto rococó.\n\nO Santo Cristo e uma imagem da Virgem aqui venerados pertenceram antes a um calvário."},{"h":"O que ver","t":"Lá dentro destacam-se as talhas góticas, em especial o Santo Cristo de la Capilla, e umas tábuas pintadas atribuídas a Juan Fernández Rodríguez. A comarca inclui o Museu Paroquial de Ainzón entre os seus pontos de interesse.\n\nA ermida de San Roque e San Sebastián, do século XVII, passou para mãos particulares após a desamortização."},{"h":"Tradições e festas","t":"O Santo Cristo é o centro das festas de setembro, de 13 a 17. A 15 e 16 de agosto celebram-se a Assunção e San Roque, e a 20 de janeiro San Sebastián."}]},"status":"pending"},{"id":"ganarul","town":"Agón","cat":"patrimonio","lat":41.84079,"lon":-1.44504,"coord_src":null,"q":["Ermita de Gañarul, Agón","Gañarul"],"fq":["Gañarul","Ermita Gañarul Agón"],"name":{"es":"Ermita de Gañarul","en":"Ermita de Gañarul","fr":"Ermitage de Gañarul","de":"Ermita de Gañarul","pt":"Ermida de Gañarul"},"when":{"es":"Siglo XVI · Ermita mudéjar","en":"16th century · Mudéjar hermitage","fr":"XVIe siècle · Ermitage mudéjar","de":"16. Jh. · Mudéjar-Einsiedelei","pt":"Séc. XVI · Ermida mudéjar"},"desc":{"es":"A las afueras de Agón, la ermita de Gañarul es un pequeño templo mudéjar del siglo XVI con una torre restaurada. La comarca la considera de los ejemplos más bellos de arquitectura popular de su época.","en":"On the outskirts of Agón, the hermitage of Gañarul is a small 16th-century Mudéjar church with a restored tower. The comarca considers it one of the finest examples of the popular architecture of its time.","fr":"Aux abords d'Agón, l'ermitage de Gañarul est un petit sanctuaire mudéjar du XVIe siècle à la tour restaurée. La comarque le considère comme l'un des plus beaux exemples d'architecture populaire de son époque.","de":"Am Rand von Agón ist die Einsiedelei von Gañarul eine kleine Mudéjar-Kirche aus dem 16. Jahrhundert mit restauriertem Turm. Die Comarca zählt sie zu den schönsten Beispielen der Volksarchitektur ihrer Zeit.","pt":"Nos arredores de Agón, a ermida de Gañarul é um pequeno templo mudéjar do século XVI com uma torre restaurada. A comarca considera-a um dos exemplos mais belos de arquitetura popular da sua época."},"visit":{"es":"Exterior libre. El interior abre en la fiesta del 13 de mayo; pregunta en el Ayuntamiento de Agón.","en":"Exterior free. The interior opens for the festival on 13 May; ask at Agón town hall.","fr":"Extérieur libre. L'intérieur ouvre lors de la fête du 13 mai ; renseignez-vous à la mairie d'Agón.","de":"Außen frei. Das Innere öffnet zum Fest am 13. Mai; im Rathaus von Agón fragen.","pt":"Exterior livre. O interior abre na festa de 13 de maio; pergunte na câmara de Agón."},"src":"https://campodeborja.es/portfolio-item/agon/","sources":["https://campodeborja.es/portfolio-item/agon/","https://es.hispanopedia.com/wiki/Ag%C3%B3n","https://campodeborja.es/wp-content/uploads/2024/03/Folleto-Campo-de-Borja-_EN_2024_v1.pdf"],"art":{"es":[{"h":"Historia","t":"La ermita de Nuestra Señora de Gañarul se construyó en el siglo XVI. Su rasgo más llamativo es la torre mudéjar, restaurada recientemente.\n\nLa talla gótica de la Virgen de Gañarul que presidía la ermita se guarda hoy en la iglesia parroquial de Agón."},{"h":"Qué ver","t":"Es un templo pequeño de ladrillo en medio de la huerta del bajo Huecha. Rodéalo para ver la torre y la cabecera, y la relación del edificio con los campos que lo rodean.\n\nEl Camino de Santiago castellano-aragonés pasa por Agón, así que muchos peregrinos la ven al llegar al pueblo."},{"h":"Tradiciones y fiestas","t":"El 13 de mayo Agón celebra la fiesta de la Virgen de Gañarul. Las otras fiestas del pueblo son San Pedro Mártir de Verona, del 28 de abril al 1 de mayo, y Nuestra Señora de los Ángeles, del 28 de julio al 2 de agosto."}],"en":[{"h":"History","t":"The hermitage of Nuestra Señora de Gañarul was built in the 16th century. Its most striking feature is the Mudéjar tower, recently restored.\n\nThe Gothic carving of the Virgin of Gañarul that once presided over the hermitage is now kept in Agón's parish church."},{"h":"What to see","t":"It is a small brick church amid the orchards of the lower Huecha. Walk round it to see the tower and the east end, and how the building relates to the fields around it.\n\nThe Castilian-Aragonese Way of Saint James passes through Agón, so many pilgrims see it as they arrive in the village."},{"h":"Traditions and festivals","t":"On 13 May Agón celebrates the feast of the Virgin of Gañarul. The village's other festivals are San Pedro Mártir de Verona, from 28 April to 1 May, and Nuestra Señora de los Ángeles, from 28 July to 2 August."}],"fr":[{"h":"Histoire","t":"L'ermitage Nuestra Señora de Gañarul fut construit au XVIe siècle. Son trait le plus frappant est la tour mudéjare, récemment restaurée.\n\nLa statue gothique de la Vierge de Gañarul qui présidait l'ermitage est aujourd'hui conservée dans l'église paroissiale d'Agón."},{"h":"À voir","t":"C'est un petit édifice en brique au milieu des vergers de la basse Huecha. Faites-en le tour pour voir la tour et le chevet, et le rapport du bâtiment avec les champs qui l'entourent.\n\nLe chemin de Saint-Jacques castillan-aragonais passe par Agón, si bien que de nombreux pèlerins le voient en arrivant au village."},{"h":"Traditions et fêtes","t":"Le 13 mai, Agón célèbre la fête de la Vierge de Gañarul. Les autres fêtes du village sont San Pedro Mártir de Verona, du 28 avril au 1er mai, et Nuestra Señora de los Ángeles, du 28 juillet au 2 août."}],"de":[{"h":"Geschichte","t":"Die Einsiedelei Nuestra Señora de Gañarul wurde im 16. Jahrhundert gebaut. Auffälligstes Merkmal ist der kürzlich restaurierte Mudéjar-Turm.\n\nDie gotische Figur der Jungfrau von Gañarul, die einst die Einsiedelei schmückte, steht heute in der Pfarrkirche von Agón."},{"h":"Sehenswert","t":"Es ist ein kleiner Backsteinbau inmitten der Gärten an der unteren Huecha. Gehen Sie herum, um Turm und Chor zu sehen und wie der Bau mit den Feldern ringsum zusammenspielt.\n\nDer kastilisch-aragonesische Jakobsweg führt durch Agón, sodass viele Pilger sie bei der Ankunft im Dorf sehen."},{"h":"Brauchtum und Feste","t":"Am 13. Mai feiert Agón das Fest der Jungfrau von Gañarul. Die anderen Feste des Dorfes sind San Pedro Mártir de Verona vom 28. April bis 1. Mai und Nuestra Señora de los Ángeles vom 28. Juli bis 2. August."}],"pt":[{"h":"História","t":"A ermida de Nuestra Señora de Gañarul foi construída no século XVI. O traço mais marcante é a torre mudéjar, recentemente restaurada.\n\nA talha gótica da Virgem de Gañarul que presidia à ermida guarda-se hoje na igreja paroquial de Agón."},{"h":"O que ver","t":"É um pequeno templo de tijolo no meio da horta do baixo Huecha. Dê-lhe a volta para ver a torre e a cabeceira, e a relação do edifício com os campos à volta.\n\nO Caminho de Santiago castelhano-aragonês passa por Agón, por isso muitos peregrinos veem-na ao chegar à aldeia."},{"h":"Tradições e festas","t":"A 13 de maio Agón celebra a festa da Virgem de Gañarul. As outras festas da aldeia são San Pedro Mártir de Verona, de 28 de abril a 1 de maio, e Nuestra Señora de los Ángeles, de 28 de julho a 2 de agosto."}]},"status":"pending"},{"id":"iglesia-agon","town":"Agón","cat":"patrimonio","lat":41.85645,"lon":-1.45331,"coord_src":null,"q":["Iglesia de Nuestra Señora de los Ángeles, Agón","Agón"],"fq":["Category:Agón","Iglesia Agón Zaragoza"],"name":{"es":"Iglesia de los Ángeles y torre de Agón","en":"Church of Los Ángeles and the tower of Agón","fr":"Église de Los Ángeles et tour d'Agón","de":"Kirche Los Ángeles und Turm von Agón","pt":"Igreja de Los Ángeles e torre de Agón"},"when":{"es":"Gótico tardío · Torre mudéjar y torre del castillo","en":"Late Gothic · Mudéjar tower and castle tower","fr":"Gothique tardif · Tour mudéjare et tour du château","de":"Spätgotik · Mudéjar-Turm und Burgturm","pt":"Gótico tardio · Torre mudéjar e torre do castelo"},"desc":{"es":"La parroquia de Agón, de gótico tardío y torre mudéjar, comparte plaza con los restos de la torre del castillo medieval. En el Ayuntamiento hay una réplica del Bronce de Agón, una ley romana sobre el riego.","en":"Agón's late Gothic parish church, with its Mudéjar tower, shares the square with the remains of the medieval castle's tower. The town hall holds a replica of the Bronze of Agón, a Roman law on irrigation.","fr":"L'église paroissiale d'Agón, de gothique tardif avec une tour mudéjare, partage la place avec les restes de la tour du château médiéval. La mairie conserve une réplique du Bronze d'Agón, une loi romaine sur l'irrigation.","de":"Die spätgotische Pfarrkirche von Agón mit Mudéjar-Turm teilt sich den Platz mit den Resten des mittelalterlichen Burgturms. Im Rathaus steht eine Nachbildung der Bronze von Agón, eines römischen Bewässerungsgesetzes.","pt":"A igreja paroquial de Agón, de gótico tardio e torre mudéjar, partilha a praça com os restos da torre do castelo medieval. Na câmara há uma réplica do Bronze de Agón, uma lei romana sobre a rega."},"visit":{"es":"Exterior libre. La réplica del bronce está en el Ayuntamiento; el original, en el Museo de Zaragoza.","en":"Exterior free. The replica of the bronze is in the town hall; the original is in the Museum of Zaragoza.","fr":"Extérieur libre. La réplique du bronze est à la mairie ; l'original, au Musée de Saragosse.","de":"Außen frei. Die Nachbildung ist im Rathaus, das Original im Museum von Saragossa.","pt":"Exterior livre. A réplica do bronze está na câmara; o original, no Museu de Saragoça."},"src":"https://campodeborja.es/portfolio-item/agon/","sources":["https://campodeborja.es/portfolio-item/agon/","https://campodeborja.es/wp-content/uploads/2024/03/Folleto-Campo-de-Borja-_EN_2024_v1.pdf","https://es.hispanopedia.com/wiki/Ag%C3%B3n"],"art":{"es":[{"h":"Historia","t":"La iglesia de Nuestra Señora de los Ángeles es de gótico tardío con torre mudéjar. Junto a ella se conservan los restos de la torre vigía del castillo medieval.\n\nEn el Cabecico Aguilera se han hallado restos de un poblado ibérico, los primeros habitantes conocidos del término."},{"h":"El Bronce de Agón","t":"En 1992 apareció en Agón una placa de bronce de época del emperador Adriano. Recoge las normas para usar y mantener una acequia, el «rivus Hiberiensis», que pasaba junto a varias poblaciones.\n\nEs un testimonio de la importancia que el agua ha tenido en la comarca desde la Antigüedad. El original está en el Museo de Zaragoza."},{"h":"El paisaje","t":"El río Huecha divide el término en dos y el pueblo está en su orilla. Cerca están los humedales de El Prao y la laguna de Agón, zonas endorreicas que la comarca destaca por su valor natural."}],"en":[{"h":"History","t":"The church of Nuestra Señora de los Ángeles is late Gothic with a Mudéjar tower. Next to it are the remains of the watchtower of the medieval castle.\n\nAt Cabecico Aguilera the remains of an Iberian settlement have been found, the earliest known inhabitants of the area."},{"h":"The Bronze of Agón","t":"In 1992 a bronze plaque from the time of Emperor Hadrian was found in Agón. It sets out the rules for using and maintaining an irrigation channel, the «rivus Hiberiensis», which ran past several settlements.\n\nIt bears witness to how important water has been in the area since ancient times. The original is in the Museum of Zaragoza."},{"h":"The landscape","t":"The Huecha river divides the municipality in two and the village sits on its bank. Nearby are the El Prao wetlands and the Agón lagoon, endorheic areas that the comarca highlights for their natural value."}],"fr":[{"h":"Histoire","t":"L'église Nuestra Señora de los Ángeles est de gothique tardif avec une tour mudéjare. À côté se dressent les restes de la tour de guet du château médiéval.\n\nAu Cabecico Aguilera, on a découvert les vestiges d'un habitat ibère, les premiers habitants connus du territoire."},{"h":"Le Bronze d'Agón","t":"En 1992, on découvrit à Agón une plaque de bronze de l'époque de l'empereur Hadrien. Elle fixe les règles d'usage et d'entretien d'un canal d'irrigation, le « rivus Hiberiensis », qui passait près de plusieurs agglomérations.\n\nC'est un témoignage de l'importance de l'eau dans la comarque depuis l'Antiquité. L'original est au Musée de Saragosse."},{"h":"Le paysage","t":"La Huecha partage la commune en deux et le village se trouve sur sa rive. Tout près se trouvent les zones humides d'El Prao et la lagune d'Agón, des milieux endoréiques que la comarque met en valeur pour leur intérêt naturel."}],"de":[{"h":"Geschichte","t":"Die Kirche Nuestra Señora de los Ángeles ist spätgotisch mit Mudéjar-Turm. Daneben stehen die Reste des Wachturms der mittelalterlichen Burg.\n\nAm Cabecico Aguilera fand man Reste einer iberischen Siedlung, der ältesten bekannten Bewohner der Gegend."},{"h":"Die Bronze von Agón","t":"1992 wurde in Agón eine Bronzetafel aus der Zeit Kaiser Hadrians gefunden. Sie regelt Nutzung und Unterhalt eines Bewässerungskanals, des „rivus Hiberiensis“, der an mehreren Siedlungen vorbeiführte.\n\nSie bezeugt, wie wichtig das Wasser in der Gegend seit der Antike war. Das Original befindet sich im Museum von Saragossa."},{"h":"Die Landschaft","t":"Die Huecha teilt die Gemeinde in zwei Hälften, das Dorf liegt an ihrem Ufer. In der Nähe liegen die Feuchtgebiete von El Prao und die Lagune von Agón, abflusslose Gebiete, die die Comarca wegen ihres Naturwerts hervorhebt."}],"pt":[{"h":"História","t":"A igreja de Nuestra Señora de los Ángeles é de gótico tardio com torre mudéjar. Junto a ela conservam-se os restos da torre de vigia do castelo medieval.\n\nNo Cabecico Aguilera encontraram-se restos de um povoado ibérico, os primeiros habitantes conhecidos do território."},{"h":"O Bronze de Agón","t":"Em 1992 apareceu em Agón uma placa de bronze da época do imperador Adriano. Recolhe as normas para usar e manter um canal de rega, o «rivus Hiberiensis», que passava junto a várias povoações.\n\nÉ um testemunho da importância que a água tem tido na comarca desde a Antiguidade. O original está no Museu de Saragoça."},{"h":"A paisagem","t":"O rio Huecha divide o município em dois e a aldeia fica na sua margem. Perto estão as zonas húmidas de El Prao e a lagoa de Agón, áreas endorreicas que a comarca destaca pelo seu valor natural."}]},"status":"pending"},{"id":"iglesia-alberite","town":"Alberite de San Juan","cat":"patrimonio","lat":41.82056,"lon":-1.47128,"coord_src":null,"q":["Iglesia, Alberite de San Juan","Alberite de San Juan"],"fq":["Category:Alberite de San Juan","Alberite de San Juan iglesia"],"name":{"es":"Iglesia de Alberite y El Quez","en":"Church of Alberite and El Quez","fr":"Église d'Alberite et El Quez","de":"Kirche von Alberite und El Quez","pt":"Igreja de Alberite e El Quez"},"when":{"es":"Siglo XIV · Ábside mudéjar sanjuanista","en":"14th century · Hospitaller Mudéjar apse","fr":"XIVe siècle · Abside mudéjare des Hospitaliers","de":"14. Jh. · Mudéjar-Apsis der Johanniter","pt":"Séc. XIV · Abside mudéjar dos Hospitalários"},"desc":{"es":"Alberite fue encomienda templaria y luego de la Orden de San Juan. De esa época queda su iglesia, con un ábside mudéjar del siglo XIV, el arco del Lugar y una necrópolis islámica con nevera en El Quez.","en":"Alberite was a Templar commandery and later belonged to the Order of Saint John. From that time it keeps its church, with a 14th-century Mudéjar apse, the Arco del Lugar and an Islamic necropolis with an ice house at El Quez.","fr":"Alberite fut une commanderie templière puis appartint à l'ordre de Saint-Jean. De cette époque, elle conserve son église à abside mudéjare du XIVe siècle, l'Arco del Lugar et une nécropole islamique avec glacière à El Quez.","de":"Alberite war Templerkomturei und gehörte dann dem Johanniterorden. Aus dieser Zeit stammen die Kirche mit Mudéjar-Apsis aus dem 14. Jahrhundert, der Arco del Lugar und eine islamische Nekropole mit Eiskeller in El Quez.","pt":"Alberite foi comenda templária e depois da Ordem de São João. Dessa época restam a igreja, com uma abside mudéjar do século XIV, o Arco del Lugar e uma necrópole islâmica com poço de gelo em El Quez."},"visit":{"es":"Exterior libre. El Quez está en el término municipal; pregunta en el Ayuntamiento cómo llegar.","en":"Exterior free. El Quez is within the municipality; ask at the town hall how to get there.","fr":"Extérieur libre. El Quez se trouve sur la commune ; demandez à la mairie comment s'y rendre.","de":"Außen frei. El Quez liegt in der Gemeinde; im Rathaus nach dem Weg fragen.","pt":"Exterior livre. El Quez fica no município; pergunte na câmara como lá chegar."},"src":"https://campodeborja.es/portfolio-item/alberite-de-san-juan/","sources":["https://campodeborja.es/portfolio-item/alberite-de-san-juan/","https://es.hispanopedia.com/wiki/Alberite_de_San_Juan","https://campodeborja.es/wp-content/uploads/2024/03/Folleto-Campo-de-Borja-_EN_2024_v1.pdf"],"art":{"es":[{"h":"Historia","t":"Su nombre árabe significa «la posta». En 1141 Pedro Taresa y su madre donaron el castillo de Alberite a la Orden del Temple, y en 1151 Ramón Berenguer IV entregó la villa a los templarios a cambio de Borja y Magallón. Con Ambel formó una de las encomiendas templarias de la comarca.\n\nTras la disolución del Temple pasó a la Orden de San Juan de Jerusalén. En 1916 cambió su nombre de «Alberite» a Alberite de San Juan."},{"h":"Qué ver","t":"La iglesia parroquial tiene un ábside mudéjar del siglo XIV y su torre formó, con una antigua torre islámica, el sistema defensivo de la villa. En la misma plaza quedan escasos restos del castillo.\n\nEl arco del Lugar es la puerta del antiguo recinto amurallado, de origen islámico."},{"h":"El Quez","t":"En la partida de El Quez se descubrió una extensa necrópolis islámica; sus restos hablan de la importancia de la población musulmana de la zona, también de la vecina Magallón. Allí se conserva una nevera, uno de los pocos pozos de hielo que quedan en la comarca."}],"en":[{"h":"History","t":"Its Arabic name means «the post station». In 1141 Pedro Taresa and his mother gave the castle of Alberite to the Knights Templar, and in 1151 Ramon Berenguer IV handed the town to the Templars in exchange for Borja and Magallón. Together with Ambel it formed one of the Templar commanderies of the area.\n\nAfter the dissolution of the Temple it passed to the Order of Saint John of Jerusalem. In 1916 its name changed from «Alberite» to Alberite de San Juan."},{"h":"What to see","t":"The parish church has a 14th-century Mudéjar apse, and its tower formed, with an old Islamic tower, the town's defensive system. A few remains of the castle stand in the same square.\n\nThe Arco del Lugar is the gate of the old walled enclosure, of Islamic origin."},{"h":"El Quez","t":"In the area known as El Quez an extensive Islamic necropolis was discovered; its remains speak of the size of the Muslim population in the area, including neighbouring Magallón. An ice house survives there, one of the few left in the comarca."}],"fr":[{"h":"Histoire","t":"Son nom arabe signifie « le relais de poste ». En 1141, Pedro Taresa et sa mère donnèrent le château d'Alberite à l'ordre du Temple, et en 1151 Raymond-Bérenger IV remit le bourg aux Templiers en échange de Borja et de Magallón. Avec Ambel, il forma l'une des commanderies templières de la comarque.\n\nAprès la dissolution du Temple, il passa à l'ordre de Saint-Jean de Jérusalem. En 1916, son nom passa d'« Alberite » à Alberite de San Juan."},{"h":"À voir","t":"L'église paroissiale possède une abside mudéjare du XIVe siècle, et sa tour forma, avec une ancienne tour islamique, le système défensif du bourg. Sur la même place subsistent de rares restes du château.\n\nL'Arco del Lugar est la porte de l'ancienne enceinte, d'origine islamique."},{"h":"El Quez","t":"Au lieu-dit El Quez, on découvrit une vaste nécropole islamique ; ses vestiges témoignent de l'importance de la population musulmane de la zone, y compris de la voisine Magallón. Une glacière y est conservée, l'une des rares qui subsistent dans la comarque."}],"de":[{"h":"Geschichte","t":"Der arabische Name bedeutet „die Poststation“. 1141 schenkten Pedro Taresa und seine Mutter die Burg Alberite dem Templerorden, und 1151 übergab Raimund Berengar IV. den Ort den Templern im Tausch gegen Borja und Magallón. Zusammen mit Ambel bildete er eine der Templerkomtureien der Gegend.\n\nNach der Auflösung des Templerordens ging er an den Johanniterorden über. 1916 wurde der Name von „Alberite“ in Alberite de San Juan geändert."},{"h":"Sehenswert","t":"Die Pfarrkirche hat eine Mudéjar-Apsis aus dem 14. Jahrhundert, und ihr Turm bildete zusammen mit einem alten islamischen Turm die Verteidigung des Ortes. Am selben Platz stehen spärliche Reste der Burg.\n\nDer Arco del Lugar ist das Tor der alten Ummauerung, islamischen Ursprungs."},{"h":"El Quez","t":"In der Flur El Quez wurde eine ausgedehnte islamische Nekropole entdeckt; ihre Funde zeugen von der Größe der muslimischen Bevölkerung, auch im benachbarten Magallón. Dort ist ein Eiskeller erhalten, einer der wenigen, die es in der Comarca noch gibt."}],"pt":[{"h":"História","t":"O nome árabe significa «a posta». Em 1141 Pedro Taresa e a mãe doaram o castelo de Alberite à Ordem do Templo, e em 1151 Raimundo Berengário IV entregou a vila aos templários em troca de Borja e Magallón. Com Ambel formou uma das comendas templárias da comarca.\n\nApós a extinção do Templo passou para a Ordem de São João de Jerusalém. Em 1916 o nome mudou de «Alberite» para Alberite de San Juan."},{"h":"O que ver","t":"A igreja paroquial tem uma abside mudéjar do século XIV e a sua torre formou, com uma antiga torre islâmica, o sistema defensivo da vila. Na mesma praça restam poucos vestígios do castelo.\n\nO Arco del Lugar é a porta do antigo recinto amuralhado, de origem islâmica."},{"h":"El Quez","t":"Na zona de El Quez descobriu-se uma extensa necrópole islâmica; os seus restos falam da dimensão da população muçulmana da zona, também da vizinha Magallón. Aí conserva-se um poço de gelo, um dos poucos que restam na comarca."}]},"status":"pending"},{"id":"iglesia-albeta","town":"Albeta","cat":"patrimonio","lat":41.8265,"lon":-1.50119,"coord_src":null,"q":["Iglesia de Santiago Apóstol, Albeta","Albeta"],"fq":["Category:Albeta","Albeta iglesia"],"name":{"es":"Iglesia de Santiago Apóstol","en":"Church of Santiago Apóstol","fr":"Église Santiago Apóstol","de":"Kirche Santiago Apóstol","pt":"Igreja de Santiago Apóstol"},"when":{"es":"Siglo XVI · Bóvedas estrelladas","en":"16th century · Star-ribbed vaults","fr":"XVIe siècle · Voûtes étoilées","de":"16. Jh. · Sternrippengewölbe","pt":"Séc. XVI · Abóbadas estreladas"},"desc":{"es":"La iglesia de Santiago es el edificio principal de Albeta, un pueblo pequeño entre el Huecha y la acequia de Marbadón. Guarda una Virgen del Rosario a la que la tradición atribuía el poder de curar a «locos y embrujados».","en":"The church of Santiago is the main building of Albeta, a small village between the Huecha and the Marbadón irrigation channel. It keeps a Virgin of the Rosary to which tradition attributed the power to cure «the mad and the bewitched».","fr":"L'église Santiago est le principal monument d'Albeta, petit village entre la Huecha et le canal de Marbadón. Elle conserve une Vierge du Rosaire à laquelle la tradition attribuait le pouvoir de guérir « les fous et les ensorcelés ».","de":"Die Kirche Santiago ist das wichtigste Bauwerk von Albeta, einem kleinen Dorf zwischen der Huecha und dem Kanal von Marbadón. Sie bewahrt eine Rosenkranzmadonna, der man nachsagte, „Verrückte und Verhexte“ zu heilen.","pt":"A igreja de Santiago é o edifício principal de Albeta, uma aldeia pequena entre o Huecha e o canal de Marbadón. Guarda uma Virgem do Rosário a quem a tradição atribuía o poder de curar «loucos e enfeitiçados»."},"visit":{"es":"Abre en horario de culto y en fiestas.","en":"Open during services and at festivals.","fr":"Ouverte aux heures de culte et lors des fêtes.","de":"Zu Gottesdiensten und an Festtagen geöffnet.","pt":"Abre nas horas de culto e nas festas."},"src":"https://campodeborja.es/portfolio-item/iglesia-parroquial-de-santiago-apostol/","sources":["https://campodeborja.es/portfolio-item/iglesia-parroquial-de-santiago-apostol/","https://campodeborja.es/portfolio-item/albeta/"],"art":{"es":[{"h":"Historia","t":"La iglesia de Santiago Apóstol es del siglo XVI. Tiene una nave de dos tramos cubierta con bóvedas de crucería estrellada y una cabecera semicircular, quizá de origen románico, reforzada con contrafuertes.\n\nA los lados de la nave se abren dos capillas barrocas cuadradas con cúpulas sobre pechinas."},{"h":"Qué ver","t":"Por fuera, el lado sur es el más rico: una capilla de dos pisos, una portada de medio punto y una espadaña con dos cuerpos de vanos pareados rematada por un frontón.\n\nDentro está la imagen de la Virgen del Rosario. Según la leyenda, curaba a los «locos y embrujados». En el pueblo hay además dos casas solariegas y un pilar mudéjar en el camino a Borja."},{"h":"Tradiciones y fiestas","t":"Albeta celebra San Antón el 17 de enero, Santiago el 25 de julio y la Virgen del Rosario el primer domingo de octubre."}],"en":[{"h":"History","t":"The church of Santiago Apóstol dates from the 16th century. It has a two-bay nave with star-ribbed vaults and a semicircular apse, possibly Romanesque in origin, reinforced with buttresses.\n\nTwo square Baroque chapels with domes on pendentives open off the sides of the nave."},{"h":"What to see","t":"Outside, the south side is the richest: a two-storey chapel, a round-arched doorway and a bell gable with two tiers of paired openings topped by a pediment.\n\nInside is the image of the Virgin of the Rosary. According to legend, she cured «the mad and the bewitched». The village also has two manor houses and a Mudéjar pillar on the road to Borja."},{"h":"Traditions and festivals","t":"Albeta celebrates San Antón on 17 January, Santiago on 25 July and the Virgin of the Rosary on the first Sunday of October."}],"fr":[{"h":"Histoire","t":"L'église Santiago Apóstol date du XVIe siècle. Elle a une nef de deux travées couverte de voûtes d'ogives étoilées et un chevet semi-circulaire, peut-être d'origine romane, renforcé de contreforts.\n\nDeux chapelles baroques carrées, couvertes de coupoles sur pendentifs, s'ouvrent de part et d'autre de la nef."},{"h":"À voir","t":"À l'extérieur, le côté sud est le plus riche : une chapelle à deux niveaux, un portail en plein cintre et un clocher-mur à deux étages de baies géminées couronné d'un fronton.\n\nÀ l'intérieur se trouve l'image de la Vierge du Rosaire. Selon la légende, elle guérissait « les fous et les ensorcelés ». Le village compte aussi deux maisons seigneuriales et un pilier mudéjar sur la route de Borja."},{"h":"Traditions et fêtes","t":"Albeta célèbre San Antón le 17 janvier, Santiago le 25 juillet et la Vierge du Rosaire le premier dimanche d'octobre."}],"de":[{"h":"Geschichte","t":"Die Kirche Santiago Apóstol stammt aus dem 16. Jahrhundert. Sie hat ein Schiff mit zwei Jochen und Sternrippengewölben und eine halbrunde, vielleicht romanische Apsis mit Strebepfeilern.\n\nSeitlich des Schiffs öffnen sich zwei quadratische Barockkapellen mit Kuppeln auf Pendentifs."},{"h":"Sehenswert","t":"Außen ist die Südseite am reichsten: eine zweigeschossige Kapelle, ein Rundbogenportal und ein Glockengiebel mit zwei Reihen gekuppelter Öffnungen und Dreiecksgiebel.\n\nIm Inneren steht die Rosenkranzmadonna. Der Legende nach heilte sie „Verrückte und Verhexte“. Im Dorf gibt es außerdem zwei Herrenhäuser und einen Mudéjar-Bildstock an der Straße nach Borja."},{"h":"Brauchtum und Feste","t":"Albeta feiert San Antón am 17. Januar, Santiago am 25. Juli und die Rosenkranzmadonna am ersten Sonntag im Oktober."}],"pt":[{"h":"História","t":"A igreja de Santiago Apóstol é do século XVI. Tem uma nave de dois tramos coberta com abóbadas de nervuras estreladas e uma cabeceira semicircular, talvez de origem românica, reforçada com contrafortes.\n\nDos lados da nave abrem-se duas capelas barrocas quadradas com cúpulas sobre pendentes."},{"h":"O que ver","t":"Por fora, o lado sul é o mais rico: uma capela de dois pisos, um portal de volta perfeita e uma sineira com dois corpos de vãos geminados rematada por um frontão.\n\nLá dentro está a imagem da Virgem do Rosário. Segundo a lenda, curava «loucos e enfeitiçados». Na aldeia há ainda duas casas solarengas e um pilar mudéjar no caminho para Borja."},{"h":"Tradições e festas","t":"Albeta celebra San Antón a 17 de janeiro, Santiago a 25 de julho e a Virgem do Rosário no primeiro domingo de outubro."}]},"status":"pending"},{"id":"ojo-albeta","town":"Albeta","cat":"naturaleza","lat":41.82663,"lon":-1.50193,"coord_src":null,"q":["Ojo de Albeta","Albeta"],"fq":["Ojo de Albeta","Albeta Huecha"],"name":{"es":"Ojo de Albeta y valle del Huecha","en":"Ojo de Albeta and the Huecha valley","fr":"Ojo de Albeta et vallée de la Huecha","de":"Ojo de Albeta und Huecha-Tal","pt":"Ojo de Albeta e vale do Huecha"},"when":{"es":"Manantial de aguas medicinales · Valle del Huecha","en":"Medicinal spring · Huecha valley","fr":"Source d'eaux médicinales · Vallée de la Huecha","de":"Heilquelle · Huecha-Tal","pt":"Nascente de águas medicinais · Vale do Huecha"},"desc":{"es":"El Ojo de Albeta es un manantial de aguas medicinales conocido desde la Antigüedad; a su alrededor han aparecido monedas romanas. Hoy es un parque con pilar votivo, junto al Centro de Interpretación del Valle del Huecha.","en":"The Ojo de Albeta is a spring of medicinal water known since antiquity; Roman coins have been found around it. Today it is a park with a votive pillar, next to the Huecha Valley Interpretation Centre.","fr":"L'Ojo de Albeta est une source d'eaux médicinales connue depuis l'Antiquité ; on a trouvé des monnaies romaines dans ses environs. C'est aujourd'hui un parc avec un pilier votif, à côté du Centre d'interprétation de la vallée de la Huecha.","de":"Der Ojo de Albeta ist eine seit der Antike bekannte Heilquelle; in ihrer Umgebung wurden römische Münzen gefunden. Heute ist er ein Park mit Votivsäule neben dem Interpretationszentrum des Huecha-Tals.","pt":"O Ojo de Albeta é uma nascente de águas medicinais conhecida desde a Antiguidade; à sua volta apareceram moedas romanas. Hoje é um parque com pilar votivo, junto ao Centro Interpretativo do Vale do Huecha."},"visit":{"es":"Parque de acceso libre. Pregunta en el Ayuntamiento por el horario del centro de interpretación.","en":"Park with free access. Ask at the town hall about the interpretation centre's opening times.","fr":"Parc en accès libre. Renseignez-vous à la mairie pour les horaires du centre d'interprétation.","de":"Park frei zugänglich. Öffnungszeiten des Zentrums im Rathaus erfragen.","pt":"Parque de acesso livre. Pergunte na câmara pelo horário do centro interpretativo."},"src":"https://campodeborja.es/portfolio-item/albeta/","sources":["https://campodeborja.es/portfolio-item/albeta/","https://campodeborja.es/wp-content/uploads/2024/03/Folleto-Campo-de-Borja-_EN_2024_v1.pdf"],"art":{"es":[{"h":"Historia","t":"El manantial se conoce desde antiguo y en su entorno se han encontrado monedas romanas. Cerca del pueblo está la villa romana de La Gorrona, con termas, de los siglos I o II, que todavía puede dar sorpresas a los arqueólogos.\n\nAlbeta tuvo un antiguo molino de agua; el cubo del molino de la Hiedra aparece entre los elementos que la comarca muestra del pueblo."},{"h":"Qué ver","t":"El parque del Ojo, con su pilar votivo, es un rincón verde junto al agua. Al lado, el Centro de Interpretación del Valle del Huecha explica el río que vertebra la comarca.\n\nEl folleto comarcal añade el mirador del Valle del Huecha y el molino de la Hiedra y el batán."},{"h":"El paisaje","t":"Albeta ocupa solo 2,6 km² entre el río Huecha y la acequia de Marbadón. Desde el pueblo hay vistas al Moncayo."}],"en":[{"h":"History","t":"The spring has been known since ancient times and Roman coins have been found around it. Near the village is the Roman villa of La Gorrona, with baths, from the 1st or 2nd century, which may still hold surprises for archaeologists.\n\nAlbeta once had a water mill; the mill race of the Molino de la Hiedra is among the features the comarca shows of the village."},{"h":"What to see","t":"The park of the Ojo, with its votive pillar, is a green corner by the water. Next to it, the Huecha Valley Interpretation Centre explains the river that runs through the heart of the area.\n\nThe comarca's leaflet adds the Huecha Valley viewpoint and the Hiedra mill and fulling mill."},{"h":"The landscape","t":"Albeta covers just 2.6 km² between the Huecha river and the Marbadón channel. From the village there are views of the Moncayo."}],"fr":[{"h":"Histoire","t":"La source est connue depuis l'Antiquité et des monnaies romaines ont été trouvées aux alentours. Près du village se trouve la villa romaine de La Gorrona, avec des thermes, des Ier ou IIe siècles, qui peut encore réserver des surprises aux archéologues.\n\nAlbeta eut un ancien moulin à eau ; le bief du moulin de la Hiedra figure parmi les éléments que la comarque présente du village."},{"h":"À voir","t":"Le parc de l'Ojo, avec son pilier votif, est un coin de verdure au bord de l'eau. À côté, le Centre d'interprétation de la vallée de la Huecha explique la rivière qui structure la comarque.\n\nLa brochure de la comarque ajoute le belvédère de la vallée de la Huecha ainsi que le moulin de la Hiedra et le moulin à foulon."},{"h":"Le paysage","t":"Albeta n'occupe que 2,6 km² entre la Huecha et le canal de Marbadón. Depuis le village, on a vue sur le Moncayo."}],"de":[{"h":"Geschichte","t":"Die Quelle ist seit alters bekannt, in ihrer Umgebung fand man römische Münzen. Nahe dem Dorf liegt die römische Villa La Gorrona mit Thermen aus dem 1. oder 2. Jahrhundert, die den Archäologen noch Überraschungen bereiten kann.\n\nAlbeta hatte eine alte Wassermühle; der Schacht der Molino de la Hiedra gehört zu den Dingen, die die Comarca vom Dorf zeigt."},{"h":"Sehenswert","t":"Der Park des Ojo mit seiner Votivsäule ist ein grüner Winkel am Wasser. Daneben erklärt das Interpretationszentrum des Huecha-Tals den Fluss, der die Comarca durchzieht.\n\nDer Prospekt der Comarca nennt außerdem den Aussichtspunkt über das Huecha-Tal sowie Mühle und Walkmühle de la Hiedra."},{"h":"Die Landschaft","t":"Albeta umfasst nur 2,6 km² zwischen der Huecha und dem Kanal von Marbadón. Vom Dorf aus sieht man den Moncayo."}],"pt":[{"h":"História","t":"A nascente é conhecida desde a Antiguidade e nos arredores encontraram-se moedas romanas. Perto da aldeia fica a villa romana de La Gorrona, com termas, dos séculos I ou II, que ainda pode trazer surpresas aos arqueólogos.\n\nAlbeta teve um antigo moinho de água; o cubo do moinho de la Hiedra está entre os elementos que a comarca mostra da aldeia."},{"h":"O que ver","t":"O parque do Ojo, com o seu pilar votivo, é um recanto verde junto à água. Ao lado, o Centro Interpretativo do Vale do Huecha explica o rio que atravessa a comarca.\n\nO folheto comarcal acrescenta o miradouro do Vale do Huecha e o moinho de la Hiedra e o pisão."},{"h":"A paisagem","t":"Albeta ocupa apenas 2,6 km² entre o rio Huecha e o canal de Marbadón. Da aldeia há vistas para o Moncayo."}]},"status":"pending"},{"id":"palacio-hospitalarios-ambel","town":"Ambel","cat":"patrimonio","lat":41.79598,"lon":-1.61688,"coord_src":null,"q":["Palacio de los Hospitalarios, Ambel","Iglesia de San Miguel Arcángel, Ambel"],"fq":["Category:Ambel","Palacio Hospitalarios Ambel"],"name":{"es":"Palacio de los Hospitalarios y San Miguel","en":"Palace of the Hospitallers and San Miguel","fr":"Palais des Hospitaliers et San Miguel","de":"Johanniterpalast und San Miguel","pt":"Palácio dos Hospitalários e San Miguel"},"when":{"es":"Siglos XII-XVI · Legado de templarios y sanjuanistas","en":"12th–16th c. · Legacy of Templars and Hospitallers","fr":"XIIe–XVIe s. · Héritage des Templiers et Hospitaliers","de":"12.–16. Jh. · Erbe von Templern und Johannitern","pt":"Séc. XII–XVI · Legado de templários e hospitalários"},"desc":{"es":"En Ambel, el palacio de los Hospitalarios y la parroquia de San Miguel forman un conjunto monumental heredado de las órdenes militares: primero el Temple, desde 1151, y después la Orden de San Juan.","en":"In Ambel, the palace of the Hospitallers and the parish church of San Miguel form a monumental ensemble inherited from the military orders: first the Templars, from 1151, and then the Order of Saint John.","fr":"À Ambel, le palais des Hospitaliers et l'église paroissiale San Miguel forment un ensemble monumental hérité des ordres militaires : d'abord le Temple, à partir de 1151, puis l'ordre de Saint-Jean.","de":"In Ambel bilden der Palast der Johanniter und die Pfarrkirche San Miguel ein Ensemble aus dem Erbe der Ritterorden: zuerst der Templer ab 1151, dann des Johanniterordens.","pt":"Em Ambel, o palácio dos Hospitalários e a igreja paroquial de San Miguel formam um conjunto monumental herdado das ordens militares: primeiro o Templo, desde 1151, e depois a Ordem de São João."},"visit":{"es":"Exterior libre. Pregunta en el Ayuntamiento por las visitas al interior.","en":"Exterior free. Ask at the town hall about visiting the interior.","fr":"Extérieur libre. Renseignez-vous à la mairie pour visiter l'intérieur.","de":"Außen frei. Für das Innere im Rathaus fragen.","pt":"Exterior livre. Pergunte na câmara pelas visitas ao interior."},"src":"https://campodeborja.es/portfolio-item/ambel/","sources":["https://campodeborja.es/portfolio-item/ambel/","https://es.hispanopedia.com/wiki/Ambel_(Zaragoza)","https://campodeborja.es/wp-content/uploads/2024/03/Folleto-Campo-de-Borja-_EN_2024_v1.pdf"],"art":{"es":[{"h":"Historia","t":"El 21 de julio de 1151 Ramón Berenguer IV cedió a los templarios los castillos y villas de Ambel y Alberite a cambio de Borja y Magallón. Ambel dependió de la encomienda de Novillas hasta 1162 y después tuvo comendadores propios.\n\nEn 1308, tras la desaparición del Temple, pasó a la Orden de San Juan de Jerusalén, dentro de la Castellanía de Amposta, y siguió en sus manos hasta la desamortización del siglo XIX."},{"h":"Qué ver","t":"El palacio de los Hospitalarios, con origen en el siglo XII, y la iglesia de San Miguel Arcángel forman un único conjunto. La parroquia se levantó según el mudéjar más clásico y en el siglo XVI se le añadieron nuevos elementos.\n\nEl castillo que construyeron los templarios ha quedado camuflado entre edificios posteriores. En el casco abundan las casas de ladrillo, y la casa de Navarro conserva tapices del siglo XVII y retratos de Esquivel y Vicente López."},{"h":"El paisaje","t":"Ambel está a 575 metros, a 10 km de Borja, entre viñas y olivos centenarios. Desde aquí parte la carretera que sube a Talamantes y al Moncayo, construida en 1894, y en el término está el manantial del Ojo de Valjunquera."}],"en":[{"h":"History","t":"On 21 July 1151 Ramon Berenguer IV gave the castles and towns of Ambel and Alberite to the Templars in exchange for Borja and Magallón. Ambel depended on the commandery of Novillas until 1162 and then had its own commanders.\n\nIn 1308, after the end of the Temple, it passed to the Order of Saint John of Jerusalem, within the Castellany of Amposta, and stayed in its hands until the disentailment of the 19th century."},{"h":"What to see","t":"The palace of the Hospitallers, of 12th-century origin, and the church of San Miguel Arcángel form a single ensemble. The church was built in the most classic Mudéjar style and new elements were ad
