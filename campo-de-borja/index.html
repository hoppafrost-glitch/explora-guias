/* Layout: one-screen app. Map is the stage; a reading panel sits beside it (stacked under it on phones).
   Palette drawn from the Ribera: limestone ground, Ebro teal, mudéjar brick, steppe ochre. */
:root{
  --bg:#ECEFEA; --panel:#FAFBF8; --panel-2:#F2F4EF; --ink:#18221E; --muted:#56635D; --faint:#646F6A;
  --line:#D5DBD3; --accent:#17646C; --accent-ink:#FFFFFF; --accent-soft:#D6E8E8;
  --land:#E2E6DB; --land-hi:#D5DCCB; --land-out:#EEF0EA; --edge:#9AA79C; --outline:#17646C;
  --water:#3C8D96; --water-soft:#BFDCDD; --label:#2E3A35;
  --c-pat:#A4502C; --c-gue:#5A6A33; --c-mus:#7A4A7F; --c-hid:#2A6CA1; --c-nat:#3C8550; --c-arq:#97702F; --c-cam:#B98A0E;
  --ok:#2E7D4F; --shadow:0 1px 2px rgba(20,34,30,.08),0 6px 18px rgba(20,34,30,.08);
  --f-display:"Spectral",Georgia,"Times New Roman",serif;
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --panel:#141C19; --panel-2:#19231F; --ink:#E5ECE8; --muted:#9FADA7; --faint:#7E8C86;
  --line:#26332E; --accent:#5DB6BE; --accent-ink:#0B1513; --accent-soft:#183437;
  --land:#1A2420; --land-hi:#21302A; --land-out:#111815; --edge:#3A4A43; --outline:#5DB6BE;
  --water:#3E8F98; --water-soft:#1B3A3D; --label:#C9D4CF;
  --c-pat:#E08A63; --c-gue:#A9B872; --c-mus:#C08BC5; --c-hid:#6FA9DA; --c-nat:#7CC48D; --c-arq:#D6AE68; --c-cam:#E5BD45;
  --ok:#69C08E; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --panel:#141C19; --panel-2:#19231F; --ink:#E5ECE8; --muted:#9FADA7; --faint:#7E8C86;
  --line:#26332E; --accent:#5DB6BE; --accent-ink:#0B1513; --accent-soft:#183437;

  --ok:#69C08E; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

#app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:1001}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.brand svg{flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:1.28rem;line-height:1.1;letter-spacing:.01em}
.brand-sub{font-size:.74rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel-2)}
.langs button{border:0;background:transparent;padding:5px 10px;font-size:.78rem;font-weight:600;letter-spacing:.05em;cursor:pointer;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.demo-tag{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);border-radius:4px;padding:2px 6px}

main{display:grid;grid-template-columns:minmax(330px,410px) 1fr;min-height:0}
#panel{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
#mapwrap{position:relative;min-height:0;min-width:0}
#map{position:absolute;inset:0;background:var(--bg)}
@media (max-width:760px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(260px,46%) 1fr}
  #mapwrap{order:-1}
  #panel{border-right:0;border-top:1px solid var(--line)}

.tbl th{color:var(--faint);font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em}
.tbl td.n{text-align:right}
.note{font-size:.78rem;color:var(--faint);line-height:1.45}

/* Map */
.leaflet-container{font-family:var(--f-ui);background:var(--bg)}
.muni{fill:var(--land);stroke:var(--edge);stroke-width:.8}
.muni.out{fill:var(--land-out);stroke:var(--edge);stroke-opacity:.45;stroke-width:.6}
.muni.hl{fill:var(--land-hi)}
.comarca-outline{fill:none;stroke:var(--outline);stroke-width:2.2;stroke-dasharray:1 0}
.river-halo{stroke:var(--water-soft);stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.river{stroke:var(--water);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tiles-on .muni{fill-opacity:.0;stroke-opacity:.6}
.tiles-on .muni.out{fill-opacity:0}
.tiles-on .river,.tiles-on .river-halo{stroke-opacity:0}
.tiles-on .town-label,.tiles-on .river-label{display:none}
.tiles-on .comarca-outline{stroke-width:2.6;stroke-opacity:.85}
.route-line{stroke:var(--c);stroke-width:3.5;stroke-dasharray:2 7;stroke-linecap:round;fill:none}
.town-label{font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--label);white-space:nowrap;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 6px var(--bg);pointer-events:none;letter-spacing:.02em;transform:translate(-50%,7px);display:inline-block}
.town-label.out{font-weight:500;font-size:11px;color:var(--faint);font-style:italic}
.river-label{font-family:var(--f-display);font-style:italic;font-size:14px;color:var(--water);letter-spacing:.35em;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg);white-space:nowrap;pointer-events:none;transform:translate(-50%,-50%) rotate(-12deg);display:inline-block}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 6px;transform:rotate(-45deg);background:var(--c);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.35);border:2px solid var(--panel);transition:transform .15s}
.pin svg{width:15px;height:15px;transform:rotate(45deg);color:#fff}
.pin.sel{transform:rotate(-45deg) scale(1.28);border-color:var(--ink)}
.pin.dim{opacity:.28}
.zlow .pin{width:13px;height:13px;border-radius:50%;transform:translate(-2.5px,23.5px);border-width:1.5px}
.zlow .pin svg{display:none}
.zlow .pin.sel{transform:translate(-2.5px,23.5px) scale(1.6)}
.zfar .town-label.minor{display:none}
.stopnum{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--panel);font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--panel);transform:translate(14px,-40px);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.zlow .stopnum{transform:translate(4px,-14px)}
.leaflet-control-zoom a,.mapbtn{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:var(--shadow)!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 85%,transparent)!important;color:var(--muted)!important;font-size:10px!important}
.leaflet-control-attribution a{color:var(--accent)!important}
.leaflet-top.leaflet-left{left:env(safe-area-inset-left,0px)}
.layerbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;display:flex;flex-direction:column;gap:2px}
.layerbox button{border:0;background:none;text-align:left;padding:6px 10px;border-radius:6px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--muted)}
.layerbox button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.legend{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px 10px;font-size:.74rem;display:flex;flex-direction:column;gap:3px;max-width:180px}
.legend div{display:flex;align-items:center;gap:7px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
@media (max-width:760px){.legend{display:none}.layerbox{flex-direction:row;padding:3px;margin-left:max(10px,env(safe-area-inset-left,0px))!important}.layerbox button{padding:5px 8px;font-size:.72rem}.leaflet-bottom.leaflet-left{bottom:16px}}

/* Móvil: la página entera hace scroll; el mapa queda arriba y se va al bajar, así se lee a pantalla completa */
@media (max-width:760px){
  html,body{height:auto}
  #app{height:auto;display:block}
  main{display:flex;flex-direction:column}
  #mapwrap{order:-1;height:40vh;height:40svh;min-height:230px;flex:none}
  #panel{min-height:calc(100vh - 56px);min-height:calc(100svh - 56px)}
  nav.tabs{position:sticky;top:0;z-index:1002;background:var(--panel)}
  .view{overflow:visible;flex:none;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  #tomap{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:1500;display:flex;align-items:center;gap:7px;
    border:0;border-radius:999px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.86rem;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;
    transition:opacity .2s,transform .2s}
  #tomap svg{width:17px;height:17px}
  #tomap[data-off]{opacity:0;transform:translateY(12px);pointer-events:none}
}
@media (min-width:761px){#tomap{display:none}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:8px;font-size:.86rem;z-index:5000;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- avisos, pasaporte, agenda, gestión ---- */
.btn.primary span,.btn.primary{color:var(--accent-ink)}
.aviso{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--panel-2);border-radius:10px;padding:10px 12px;font-size:.88rem}
.aviso b{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.aviso.warn{border-left-color:#B4441F}.aviso.warn b{color:#B4441F}
.aviso.prize{border-left-color:#B8860B}.aviso.prize b{color:#8A6508}
.stampbox,.passcta{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel-2)}
.passcta{width:100%;cursor:pointer;font:inherit;color:var(--ink);text-align:left}
.passcta:hover{border-color:var(--accent)}
.passcta .go{margin-left:auto;font-size:1.4rem;color:var(--muted)}
.seal{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--c,var(--accent));color:var(--c,var(--accent))}
.seal svg{width:22px;height:22px}
.stampbox.done .seal{border-style:solid;background:var(--c);color:#fff}
.passcta.ag .seal{border-style:solid;border-radius:12px}
.passhead{display:flex;align-items:center;gap:16px}
.ring{--p:0;flex:none;width:92px;height:92px;border-radius:50%;display:grid;place-content:center;text-align:center;
  background:radial-gradient(closest-side,var(--panel) 78%,transparent 79%),conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
.ring b{font-size:1.6rem;line-height:1}.ring span{font-size:.75rem;color:var(--muted)}
.prow{display:grid;grid-template-columns:1fr;gap:4px;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);cursor:pointer;font:inherit;color:var(--ink)}
.prow .t{font-weight:600;font-size:.92rem}
.pbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.pbar i{display:block;height:100%;background:var(--c)}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin:6px 0 10px}
.stamp{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;cursor:pointer;font:inherit;color:var(--muted);padding:4px}
.stamp .seal{width:58px;height:58px;border-color:var(--line)}
.stamp.on .seal{border:2px solid var(--c);background:var(--c);color:#fff}
.stamp.on{color:var(--ink)}
.stamp .nm{font-size:.74rem;line-height:1.25;text-align:center;overflow-wrap:break-word;hyphens:auto;max-width:100%}
.ev{display:flex;gap:12px;border-bottom:1px solid var(--line);padding:10px 0}
.ev p{margin:2px 0 0;font-size:.88rem}
.cal{flex:none;width:52px;border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:center;background:var(--panel)}
.cal span{display:block;background:var(--accent);color:var(--accent-ink);font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 0}
.cal b{display:block;font-size:1.2rem;padding:4px 0}
.cal{align-self:flex-start}.cal.m{border:2px solid var(--accent)}.cal.m b{font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);padding:9px 0}
.bars.wide .bar{grid-template-columns:minmax(0,1.4fr) 1fr auto}.bars.wide .bar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.neg{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:8px 0}
.adm-nav{display:flex;flex-wrap:wrap;gap:6px}
.adm-nav a{font-size:.8rem;border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--ink);text-decoration:none;background:var(--panel-2)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.two-col{grid-template-columns:1fr}}
.foot-links{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;padding-bottom:8px}
.foot-links a{color:var(--muted)}
details summary{cursor:pointer;padding:4px 0}
.skip{position:absolute;left:-9999px;top:8px;z-index:9999;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;font-weight:700}
.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

</style>

<div id="cover" hidden></div>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<div id="app"><a class="skip" href="#panel" data-i="skipLink"></a>
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="var(--accent)"/><path d="M4 22c5-1 6-7 11-7s5 9 10 9 4-6 5-7" stroke="var(--accent-ink)" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="23" cy="10" r="2.6" fill="var(--accent-ink)"/></svg>
      <div style="min-width:0">
        <h1 class="brand-name" style="margin:0">Campo de Borja Explora</h1>
        <div class="brand-sub" data-i="appSub"></div>
      </div>
    </div>
    <span class="demo-tag" data-i="demo"></span>
    <div class="langs" role="group" aria-label="Idioma / Language" id="langs"></div>
  </header>
  <main>
    <aside id="panel">
      <nav class="tabs" role="tablist" id="tabs">
        <button role="tab" data-tab="inicio" data-i="tabHome"></button>
        <button role="tab" data-tab="explorar" data-i="tabExplore"></button>
        <button role="tab" data-tab="rutas" data-i="tabRoutes"></button>
        <button role="tab" data-tab="agenda" data-i="tabAgenda"></button>
        <button role="tab" data-tab="pasaporte" data-i="tabPass"></button>
      </nav>
      <section class="view stack" id="v-inicio"></section>
      <section class="view stack" id="v-explorar" hidden></section>
      <section class="view stack" id="v-lugar" hidden></section>
      <section class="view stack" id="v-rutas" hidden></section>
      <section class="view stack" id="v-agenda" hidden></section>
      <section class="view stack" id="v-pasaporte" hidden></section>
      <section class="view stack" id="v-gestion" hidden></section>
    </aside>
    <div id="mapwrap"><div id="map" role="application" aria-label="Mapa"></div></div>
    <button type="button" id="tomap" data-off><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 4-6 3v13l6-3 6 3 6-3V4l-6 3-6-3z"/><path d="M9 4v13M15 7v13"/></svg><span data-i="tabMap"></span></button>
  </main>
</div>

l8-6 8 6v11\"/><path d=\"M9.5 21v-5.5a2.5 2.5 0 0 1 5 0V21\"/>"},"memoria":{"color":"--c-gue","icon":"<path d=\"M6 21V4\"/><path d=\"M6 4h11l-2.5 4L17 12H6\"/>"},"museo":{"color":"--c-mus","icon":"<path d=\"M3 9.5 12 4l9 5.5\"/><path d=\"M5.5 11v7M10 11v7M14 11v7M18.5 11v7\"/><path d=\"M3 20.5h18\"/>"},"arqueologia":{"color":"--c-arq","icon":"<path d=\"M9 3h6\"/><path d=\"M10 3v3.2C7.2 8 6.3 11 7 14.5L9 20h6l2-5.5c.7-3.5-.2-6.5-3-8.3V3\"/>"},"hidraulico":{"color":"--c-hid","icon":"<circle cx=\"12\" cy=\"12\" r=\"7.5\"/><circle cx=\"12\" cy=\"12\" r=\"1.8\"/><path d=\"M12 4.5v15M4.5 12h15M6.7 6.7l10.6 10.6M17.3 6.7 6.7 17.3\"/>"},"naturaleza":{"color":"--c-nat","icon":"<path d=\"M2.5 11c2.8-2.6 5.6-2.6 8 .3 2.4-2.9 5.2-2.9 8-.3\"/><path d=\"M8 17c1.6-1.5 3.2-1.5 4.6.2 1.4-1.7 3-1.7 4.6-.2\"/>"},"camino":{"color":"--c-cam","icon":"<path d=\"M12 20.5 3.5 9.2a9.5 9.5 0 0 1 17 0z\"/><path d=\"M12 20.5 8 6.5M12 20.5V5M12 20.5l4-14\"/>"}},"pois":[{"id":"colegiata-borja","town":"Borja","cat":"patrimonio","lat":41.835,"lon":-1.532,"coord_src":null,"q":["Colegiata de Santa María, Borja","Iglesia de Santa María, Borja"],"fq":["Category:Colegiata de Santa María (Borja)","Colegiata Borja"],"name":{"es":"Colegiata de Santa María","en":"Collegiate Church of Santa María","fr":"Collégiale Santa María","de":"Stiftskirche Santa María","pt":"Colegiada de Santa María"},"when":{"es":"Siglos XV-XVIII · Mudéjar por fuera, barroca por dentro","en":"15th–18th c. · Mudéjar outside, Baroque inside","fr":"XVe–XVIIIe s. · Mudéjare dehors, baroque dedans","de":"15.–18. Jh. · Außen Mudéjar, innen Barock","pt":"Séc. XV–XVIII · Mudéjar por fora, barroca por dentro"},"desc":{"es":"La antigua colegiata es el templo mayor de Borja y el resumen de su historia: cada época le añadió algo. Por fuera domina el ladrillo mudéjar; por dentro, el barroco. Aquí se venera a la Virgen de la Peana, patrona de la ciudad.","en":"The former collegiate church is Borja's main church and a summary of its history: every era added something. Mudéjar brickwork dominates outside, Baroque inside. This is where the Virgen de la Peana, the town's patron, is venerated.","fr":"L'ancienne collégiale est la grande église de Borja et le résumé de son histoire : chaque époque y a ajouté quelque chose. À l'extérieur domine la brique mudéjare ; à l'intérieur, le baroque. On y vénère la Virgen de la Peana, patronne de la ville.","de":"Die ehemalige Stiftskirche ist die Hauptkirche von Borja und eine Zusammenfassung seiner Geschichte: Jede Epoche hat etwas hinzugefügt. Außen dominiert Mudéjar-Backstein, innen der Barock. Hier wird die Virgen de la Peana verehrt, die Schutzpatronin der Stadt.","pt":"A antiga colegiada é a igreja principal de Borja e o resumo da sua história: cada época acrescentou-lhe algo. Por fora domina o tijolo mudéjar; por dentro, o barroco. Aqui venera-se a Virgen de la Peana, padroeira da cidade."},"visit":{"es":"Se visita por dentro en horario de culto o con las visitas que organiza la oficina de turismo de Borja (plaza de España, 1). Confirma horarios allí. El claustro y el museo tienen acceso propio.","en":"You can see the interior during services or on the tours run by Borja tourist office (Plaza de España, 1). Check times there. The cloister and the museum have their own entrance.","fr":"L'intérieur se visite aux heures de culte ou lors des visites organisées par l'office de tourisme de Borja (Plaza de España, 1). Vérifiez les horaires sur place. Le cloître et le musée ont leur propre accès.","de":"Das Innere ist während der Gottesdienste oder bei den Führungen des Fremdenverkehrsamts von Borja (Plaza de España, 1) zu sehen. Zeiten dort erfragen. Kreuzgang und Museum haben einen eigenen Eingang.","pt":"Visita-se por dentro nas horas de culto ou nas visitas organizadas pelo posto de turismo de Borja (Plaza de España, 1). Confirme os horários lá. O claustro e o museu têm acesso próprio."},"src":"https://es.hispanopedia.com/wiki/Borja_(Zaragoza)","sources":["https://es.hispanopedia.com/wiki/Borja_(Zaragoza)","https://campodeborja.es/portfolio-item/borja/","https://campodeborja.es/wp-content/uploads/2024/04/es-ruta-corazon-moncayo.pdf"],"art":{"es":[{"h":"Historia","t":"La iglesia de Santa María es el resultado de varias obras superpuestas, de ahí la mezcla de estilos que se ve desde la calle. Tiene una sola nave con cabecera poligonal, un exterior de tradición mudéjar y un interior que se vistió de barroco, con un retablo mayor y un órgano que destacan en el conjunto.\n\nEl claustro es del siglo XV y el pórtico de entrada se añadió en el XIX. Durante el asedio de octubre de 1706, en la Guerra de Sucesión, Borja se puso del lado borbónico y fue saqueada por los partidarios del archiduque Carlos; en una de las torres todavía se distingue la huella de un impacto de cañón de aquellos días."},{"h":"Qué ver","t":"Fíjate primero en la torre mudéjar, que es el perfil más reconocible de la ciudad. Dentro, el retablo mayor y el órgano dominan la nave, y en la sacristía se han conservado tablas góticas.\n\nEl templo guarda a la Virgen de la Peana, patrona de Borja. Sus fiestas son el primer domingo de mayo y en ellas sale el Rosario de Cristal, con más de 120 faroles, declarado Fiesta de Interés Turístico de Aragón en 2005."},{"h":"Curiosidades","t":"Cuando se empezaba a construir el claustro, en 1451, apareció escondida una imagen de la Virgen con la inscripción «Mater misericordia». Según la tradición se había ocultado ante la llegada de los musulmanes. Ese hallazgo está en el origen del Santuario de Misericordia, en la Muela.\n\nJunto a la colegiata, el Museo de la Colegiata reúne parte de su patrimonio en un edificio del siglo XVI restaurado en 2003."}],"en":[{"h":"History","t":"The church of Santa María is the result of several overlapping building campaigns, hence the mix of styles you can see from the street. It has a single nave with a polygonal apse, a Mudéjar-tradition exterior and an interior dressed in Baroque, where the main altarpiece and the organ stand out.\n\nThe cloister dates from the 15th century and the entrance porch was added in the 19th. During the siege of October 1706, in the War of the Spanish Succession, Borja sided with the Bourbons and was sacked by supporters of Archduke Charles; the mark of a cannonball from those days can still be seen on one of the towers."},{"h":"What to see","t":"Look first at the Mudéjar tower, the most recognisable feature of the town's skyline. Inside, the main altarpiece and the organ dominate the nave, and Gothic panel paintings have survived in the sacristy.\n\nThe church houses the Virgen de la Peana, patron of Borja. Her festival is on the first Sunday in May and features the Rosario de Cristal, a procession of more than 120 glass lanterns, declared a Festival of Tourist Interest of Aragon in 2005."},{"h":"Did you know?","t":"When work began on the cloister in 1451, a hidden image of the Virgin was found bearing the inscription «Mater misericordia». Tradition says it had been hidden when the Muslims arrived. That discovery lies behind the Santuario de Misericordia, up on the Muela.\n\nNext to the church, the Collegiate Museum displays part of its heritage in a 16th-century building restored in 2003."}],"fr":[{"h":"Histoire","t":"L'église Santa María est le fruit de plusieurs chantiers superposés, d'où le mélange de styles visible depuis la rue. Elle a une seule nef à chevet polygonal, un extérieur de tradition mudéjare et un intérieur habillé de baroque, où se distinguent le retable majeur et l'orgue.\n\nLe cloître date du XVe siècle et le porche d'entrée a été ajouté au XIXe. Lors du siège d'octobre 1706, pendant la guerre de Succession d'Espagne, Borja prit le parti des Bourbons et fut pillée par les partisans de l'archiduc Charles ; sur l'une des tours on distingue encore la trace d'un boulet de canon de ces jours-là."},{"h":"À voir","t":"Regardez d'abord la tour mudéjare, la silhouette la plus reconnaissable de la ville. À l'intérieur, le retable majeur et l'orgue dominent la nef, et des panneaux gothiques ont été conservés dans la sacristie.\n\nL'église abrite la Virgen de la Peana, patronne de Borja. Sa fête a lieu le premier dimanche de mai avec le Rosario de Cristal, une procession de plus de 120 lanternes, déclarée Fête d'intérêt touristique d'Aragon en 2005."},{"h":"Le saviez-vous ?","t":"En 1451, au début des travaux du cloître, on découvrit une image cachée de la Vierge portant l'inscription « Mater misericordia ». Selon la tradition, elle avait été dissimulée à l'arrivée des musulmans. Cette découverte est à l'origine du sanctuaire de Misericordia, sur la Muela.\n\nÀ côté de la collégiale, le Musée de la Collégiale présente une partie de son patrimoine dans un bâtiment du XVIe siècle restauré en 2003."}],"de":[{"h":"Geschichte","t":"Die Kirche Santa María ist das Ergebnis mehrerer übereinanderliegender Bauphasen, daher die Stilmischung, die man von der Straße aus sieht. Sie hat ein einziges Schiff mit polygonalem Chor, ein Äußeres in Mudéjar-Tradition und ein barock ausgestattetes Inneres, in dem Hochaltar und Orgel hervorstechen.\n\nDer Kreuzgang stammt aus dem 15. Jahrhundert, die Vorhalle wurde im 19. angefügt. Bei der Belagerung im Oktober 1706 im Spanischen Erbfolgekrieg stand Borja auf Seiten der Bourbonen und wurde von Anhängern Erzherzog Karls geplündert; an einem der Türme ist noch die Spur eines Kanonentreffers aus jenen Tagen zu erkennen."},{"h":"Sehenswert","t":"Achten Sie zuerst auf den Mudéjar-Turm, das bekannteste Profil der Stadt. Im Inneren beherrschen Hochaltar und Orgel das Schiff, in der Sakristei sind gotische Tafeln erhalten.\n\nDie Kirche beherbergt die Virgen de la Peana, Patronin von Borja. Ihr Fest ist am ersten Sonntag im Mai, mit dem Rosario de Cristal, einer Prozession mit über 120 Laternen, seit 2005 Fest von touristischem Interesse in Aragonien."},{"h":"Wussten Sie?","t":"Als 1451 der Bau des Kreuzgangs begann, fand man ein verborgenes Marienbild mit der Inschrift „Mater misericordia“. Der Überlieferung nach war es bei der Ankunft der Muslime versteckt worden. Dieser Fund steht am Anfang des Santuario de Misericordia auf der Muela.\n\nNeben der Kirche zeigt das Museum der Stiftskirche einen Teil ihrer Schätze in einem Gebäude aus dem 16. Jahrhundert, das 2003 restauriert wurde."}],"pt":[{"h":"História","t":"A igreja de Santa María é o resultado de várias obras sobrepostas, daí a mistura de estilos que se vê da rua. Tem uma só nave com cabeceira poligonal, um exterior de tradição mudéjar e um interior vestido de barroco, onde se destacam o retábulo-mor e o órgão.\n\nO claustro é do século XV e o pórtico de entrada foi acrescentado no XIX. Durante o cerco de outubro de 1706, na Guerra da Sucessão Espanhola, Borja tomou o partido dos Bourbons e foi saqueada pelos partidários do arquiduque Carlos; numa das torres ainda se distingue a marca de um impacto de canhão desses dias."},{"h":"O que ver","t":"Repare primeiro na torre mudéjar, o perfil mais reconhecível da cidade. Lá dentro, o retábulo-mor e o órgão dominam a nave, e na sacristia conservam-se tábuas góticas.\n\nO templo guarda a Virgen de la Peana, padroeira de Borja. A sua festa é no primeiro domingo de maio, com o Rosario de Cristal, uma procissão de mais de 120 lanternas, declarada Festa de Interesse Turístico de Aragão em 2005."},{"h":"Curiosidades","t":"Quando se começou a construir o claustro, em 1451, apareceu escondida uma imagem da Virgem com a inscrição «Mater misericordia». Segundo a tradição, tinha sido ocultada à chegada dos muçulmanos. Esse achado está na origem do Santuário de Misericordia, na Muela.\n\nJunto à colegiada, o Museu da Colegiada reúne parte do seu património num edifício do século XVI restaurado em 2003."}]},"status":"pending"},{"id":"casa-conchas","town":"Borja","cat":"patrimonio","lat":41.83528,"lon":-1.53263,"coord_src":null,"q":["Casa de las Conchas, Borja","Palacio de los Vera, Borja"],"fq":["Category:Casa de las Conchas (Borja)","Casa de las Conchas Borja"],"name":{"es":"Casa de las Conchas","en":"Casa de las Conchas","fr":"Casa de las Conchas","de":"Casa de las Conchas","pt":"Casa de las Conchas"},"when":{"es":"1522 · Bien de Interés Cultural","en":"1522 · Site of Cultural Interest","fr":"1522 · Bien d'intérêt culturel","de":"1522 · Kulturgut von besonderem Interesse","pt":"1522 · Bem de Interesse Cultural"},"desc":{"es":"La casa más famosa de Borja debe su nombre a un detalle que hay que buscar de cerca: los clavos de la puerta tienen forma de concha. Es el palacio de los Vera, levantado en 1522, y la mejor casa noble de la ciudad.","en":"Borja's most famous house takes its name from a detail you have to look at closely: the nails on its door are shaped like shells. It is the palace of the Vera family, built in 1522, and the finest noble house in town.","fr":"La maison la plus célèbre de Borja doit son nom à un détail qu'il faut regarder de près : les clous de la porte ont la forme de coquilles. C'est le palais des Vera, élevé en 1522, et la plus belle demeure noble de la ville.","de":"Das berühmteste Haus von Borja verdankt seinen Namen einem Detail, das man aus der Nähe betrachten muss: Die Nägel der Tür haben die Form von Muscheln. Es ist der Palast der Familie Vera, 1522 erbaut, und das schönste Adelshaus der Stadt.","pt":"A casa mais famosa de Borja deve o nome a um pormenor que é preciso ver de perto: os pregos da porta têm forma de concha. É o palácio dos Vera, construído em 1522, e a melhor casa nobre da cidade."},"visit":{"es":"Se ve desde la calle, en el casco antiguo. Pregunta en la oficina de turismo si hay visitas al interior.","en":"Seen from the street, in the old town. Ask at the tourist office whether the interior can be visited.","fr":"Se voit depuis la rue, dans la vieille ville. Demandez à l'office de tourisme si l'intérieur se visite.","de":"Von der Straße aus zu sehen, in der Altstadt. Fragen Sie im Fremdenverkehrsamt, ob das Innere besichtigt werden kann.","pt":"Vê-se da rua, no centro histórico. Pergunte no posto de turismo se há visitas ao interior."},"src":"https://es.hispanopedia.com/wiki/Borja_(Zaragoza)","sources":["https://es.hispanopedia.com/wiki/Borja_(Zaragoza)","https://campodeborja.es/portfolio-item/borja/","https://campodeborja.es/wp-content/uploads/2024/03/Folleto-Campo-de-Borja-_EN_2024_v1.pdf","https://campodeborja.es/wp-content/uploads/2024/04/es-ruta-corazon-moncayo.pdf"],"art":{"es":[{"h":"Historia","t":"El palacio de los Vera se construyó en 1522, en el momento de mayor prosperidad de Borja. Los siglos XV y XVI llenaron la ciudad de casas hidalgas y palacios, porque Borja era una plaza fuerte en la frontera entre Aragón, Navarra y Castilla y un mercado importante del valle del Huecha.\n\nEn 1978 fue declarada Bien de Interés Cultural."},{"h":"Qué ver","t":"El nombre lo dan los clavos de hierro forjado de la puerta principal, con forma de concha. Mira también la portada y el alero: las casas nobles de Borja de los siglos XVI al XIX tienen aleros de madera labrada y portadas de medio punto, y esta es el ejemplo más completo.\n\nLa ruta Slow Driving del Moncayo la presenta como la casa más importante de la ciudad, y es una buena primera parada antes de subir al casco antiguo."},{"h":"Para entenderlo","t":"La casa forma parte de un conjunto histórico-artístico: el casco viejo de Borja creció alrededor del antiguo castillo y del Cinto, el barrio donde vivió la comunidad judía hasta su expulsión a finales del siglo XV. Caminar desde aquí hacia la plaza del Mercado es recorrer la ciudad de los siglos XV y XVI."}],"en":[{"h":"History","t":"The Vera palace was built in 1522, at the height of Borja's prosperity. The 15th and 16th centuries filled the town with noble houses and palaces, because Borja was a stronghold on the border between Aragon, Navarre and Castile and an important market for the Huecha valley.\n\nIn 1978 it was declared a Site of Cultural Interest."},{"h":"What to see","t":"The name comes from the wrought-iron nails on the main door, shaped like shells. Look too at the doorway and the eaves: Borja's noble houses of the 16th to 19th centuries have carved wooden eaves and round-arched doorways, and this is the most complete example.\n\nThe Slow Driving route around the Moncayo describes it as the most important house in town, and it makes a good first stop before heading up into the old quarter."},{"h":"Background","t":"The house is part of a historic and artistic ensemble: Borja's old town grew up around the former castle and the Cinto, the quarter where the Jewish community lived until its expulsion at the end of the 15th century. Walking from here to the Plaza del Mercado takes you through the town of the 15th and 16th centuries."}],"fr":[{"h":"Histoire","t":"Le palais des Vera fut construit en 1522, au moment de la plus grande prospérité de Borja. Les XVe et XVIe siècles remplirent la ville de demeures nobles et de palais, car Borja était une place forte à la frontière entre l'Aragon, la Navarre et la Castille et un marché important de la vallée de la Huecha.\n\nEn 1978, il fut déclaré Bien d'intérêt culturel."},{"h":"À voir","t":"Le nom vient des clous en fer forgé de la porte principale, en forme de coquille. Observez aussi le portail et l'avant-toit : les maisons nobles de Borja des XVIe au XIXe siècles ont des avant-toits en bois sculpté et des portails en plein cintre, et celle-ci en est l'exemple le plus complet.\n\nLa route Slow Driving du Moncayo la présente comme la maison la plus importante de la ville ; c'est une bonne première étape avant de monter vers la vieille ville."},{"h":"Pour comprendre","t":"La maison fait partie d'un ensemble historique et artistique : le vieux Borja s'est développé autour de l'ancien château et du Cinto, le quartier où vécut la communauté juive jusqu'à son expulsion à la fin du XVe siècle. Marcher d'ici jusqu'à la Plaza del Mercado, c'est parcourir la ville des XVe et XVIe siècles."}],"de":[{"h":"Geschichte","t":"Der Palast der Vera wurde 1522 errichtet, in der Blütezeit Borjas. Das 15. und 16. Jahrhundert füllten die Stadt mit Adelshäusern und Palästen, denn Borja war eine Festung an der Grenze zwischen Aragonien, Navarra und Kastilien und ein wichtiger Markt des Huecha-Tals.\n\n1978 wurde er zum Kulturgut von besonderem Interesse erklärt."},{"h":"Sehenswert","t":"Der Name kommt von den schmiedeeisernen Nägeln des Haupttors in Muschelform. Achten Sie auch auf Portal und Dachvorsprung: Die Adelshäuser Borjas aus dem 16. bis 19. Jahrhundert haben geschnitzte Holzgesimse und Rundbogenportale, und dieses ist das vollständigste Beispiel.\n\nDie Slow-Driving-Route am Moncayo nennt es das wichtigste Haus der Stadt; ein guter erster Halt, bevor man in die Altstadt hinaufgeht."},{"h":"Hintergrund","t":"Das Haus gehört zu einem historisch-künstlerischen Ensemble: Die Altstadt von Borja wuchs um die ehemalige Burg und den Cinto, das Viertel, in dem die jüdische Gemeinde bis zu ihrer Vertreibung Ende des 15. Jahrhunderts lebte. Wer von hier zur Plaza del Mercado geht, durchquert die Stadt des 15. und 16. Jahrhunderts."}],"pt":[{"h":"História","t":"O palácio dos Vera foi construído em 1522, no momento de maior prosperidade de Borja. Os séculos XV e XVI encheram a cidade de casas fidalgas e palácios, porque Borja era uma praça-forte na fronteira entre Aragão, Navarra e Castela e um mercado importante do vale do Huecha.\n\nEm 1978 foi declarada Bem de Interesse Cultural."},{"h":"O que ver","t":"O nome vem dos pregos de ferro forjado da porta principal, em forma de concha. Repare também no portal e no beiral: as casas nobres de Borja dos séculos XVI a XIX têm beirais de madeira lavrada e portais de volta perfeita, e esta é o exemplo mais completo.\n\nA rota Slow Driving do Moncayo apresenta-a como a casa mais importante da cidade, e é uma boa primeira paragem antes de subir ao centro histórico."},{"h":"Para compreender","t":"A casa faz parte de um conjunto histórico-artístico: o centro antigo de Borja cresceu à volta do antigo castelo e do Cinto, o bairro onde viveu a comunidade judaica até à sua expulsão no fim do século XV. Caminhar daqui até à Plaza del Mercado é percorrer a cidade dos séculos XV e XVI."}]},"status":"pending"},{"id":"plaza-mercado-borja","town":"Borja","cat":"patrimonio","lat":41.83426,"lon":-1.53308,"coord_src":null,"q":["Plaza de España, Borja","Ayuntamiento de Borja"],"fq":["Category:Casa Consistorial de Borja","Plaza del Mercado Borja","Ayuntamiento Borja Zaragoza"],"name":{"es":"Plaza del Mercado y Casa Consistorial","en":"Plaza del Mercado and Town Hall","fr":"Plaza del Mercado et hôtel de ville","de":"Plaza del Mercado und Rathaus","pt":"Plaza del Mercado e Câmara Municipal"},"when":{"es":"Siglo XVI · Plaza porticada y ayuntamiento","en":"16th century · Arcaded square and town hall","fr":"XVIe siècle · Place à arcades et hôtel de ville","de":"16. Jh. · Laubenplatz und Rathaus","pt":"Séc. XVI · Praça porticada e câmara municipal"},"desc":{"es":"La antigua «plaza de adentro» es el salón de Borja: soportales, el palacio de los Angulo con su portada barroca y un ayuntamiento de ladrillo de 1534 que guarda un Salón de Reyes con retratos del siglo XVII.","en":"The old «inner square» is Borja's living room: arcades, the Angulo palace with its Baroque doorway, and a brick town hall from 1534 with a Hall of Kings hung with 17th-century royal portraits.","fr":"L'ancienne « place du dedans » est le salon de Borja : des arcades, le palais des Angulo avec son portail baroque et un hôtel de ville en brique de 1534 qui conserve une Salle des Rois ornée de portraits du XVIIe siècle.","de":"Der alte „innere Platz“ ist das Wohnzimmer von Borja: Laubengänge, der Palast der Angulo mit barockem Portal und ein Backsteinrathaus von 1534 mit einem Königssaal voller Bildnisse aus dem 17. Jahrhundert.","pt":"A antiga «praça de dentro» é a sala de visitas de Borja: arcadas, o palácio dos Angulo com o seu portal barroco e uma câmara municipal de tijolo de 1534 que guarda um Salão dos Reis com retratos do século XVII."},"visit":{"es":"Espacio público, libre. La oficina de turismo de Borja está en la plaza de España, 1, y allí informan de las visitas al Salón de Reyes.","en":"Public space, free access. Borja tourist office is at Plaza de España, 1, and can tell you about visits to the Hall of Kings.","fr":"Espace public, accès libre. L'office de tourisme de Borja se trouve Plaza de España, 1 ; il renseigne sur les visites de la Salle des Rois.","de":"Öffentlicher Raum, frei zugänglich. Das Fremdenverkehrsamt von Borja ist an der Plaza de España, 1, und informiert über Besuche im Königssaal.","pt":"Espaço público, acesso livre. O posto de turismo de Borja fica na Plaza de España, 1, e informa sobre as visitas ao Salão dos Reis."},"src":"https://es.hispanopedia.com/wiki/Borja_(Zaragoza)","sources":["https://es.hispanopedia.com/wiki/Borja_(Zaragoza)","https://campodeborja.es/portfolio-item/borja/","https://campodeborja.es/wp-content/uploads/2024/04/es-ruta-corazon-moncayo.pdf"],"art":{"es":[{"h":"Historia","t":"La Casa Consistorial se levantó en 1534, obra del maestro de obras Antón de Veoxa. Es un edificio de ladrillo de tradición renacentista, con puerta adintelada de piedra, balcones de forja y un alero de madera restaurado.\n\nLa plaza porticada, conocida antes como «plaza de adentro», fue el centro comercial de la ciudad. Borja recibió el título de ciudad de Alfonso V en 1438 y vivió en los siglos XV y XVI su mejor momento como mercado de la comarca."},{"h":"Qué ver","t":"Recorre los soportales y busca el palacio de los Angulo, del siglo XVI, con una portada barroca muy vistosa. En la plaza está también el llamado Torreón de los Borja, de propiedad particular, que acoge exposiciones.\n\nDentro del ayuntamiento, el Salón de Reyes conserva retratos de monarcas del siglo XVII. Pregunta si se puede visitar."},{"h":"Curiosidades","t":"A menudo se dice que los Borgia, la familia de los papas Calixto III y Alejandro VI, salieron de aquí. La relación nunca se ha podido demostrar, pero el nombre de la ciudad sigue unido a esa historia.\n\nEn 1708 Felipe V añadió al escudo de Borja un león y una flor de lis y le dio los títulos de «Muy Ilustre» y «Fidelísima» por su apoyo durante la Guerra de Sucesión."}],"en":[{"h":"History","t":"The town hall was built in 1534 by the master builder Antón de Veoxa. It is a Renaissance-tradition brick building, with a stone lintelled door, wrought-iron balconies and restored wooden eaves.\n\nThe arcaded square, once known as the «plaza de adentro», was the town's commercial centre. Borja was granted the title of city by Alfonso V in 1438 and enjoyed its golden age in the 15th and 16th centuries as the market town of the area."},{"h":"What to see","t":"Walk under the arcades and find the 16th-century Angulo palace with its eye-catching Baroque doorway. The square is also home to the so-called Torreón de los Borja, privately owned, which hosts exhibitions.\n\nInside the town hall, the Hall of Kings keeps portraits of 17th-century monarchs. Ask whether it can be visited."},{"h":"Did you know?","t":"It is often said that the Borgias, the family of popes Callixtus III and Alexander VI, came from here. The link has never been proven, but the town's name remains tied to the story.\n\nIn 1708 Philip V added a lion and a fleur-de-lis to Borja's coat of arms and gave it the titles «Muy Ilustre» and «Fidelísima» for its support during the War of the Spanish Succession."}],"fr":[{"h":"Histoire","t":"L'hôtel de ville fut construit en 1534 par le maître d'œuvre Antón de Veoxa. C'est un bâtiment en brique de tradition Renaissance, avec une porte à linteau de pierre, des balcons en fer forgé et un avant-toit en bois restauré.\n\nLa place à arcades, appelée autrefois « plaza de adentro », était le centre commercial de la ville. Borja reçut le titre de cité d'Alphonse V en 1438 et connut aux XVe et XVIe siècles son âge d'or comme marché de la région."},{"h":"À voir","t":"Parcourez les arcades et cherchez le palais des Angulo, du XVIe siècle, au portail baroque très spectaculaire. Sur la place se trouve aussi le Torreón de los Borja, propriété privée, qui accueille des expositions.\n\nDans l'hôtel de ville, la Salle des Rois conserve des portraits de monarques du XVIIe siècle. Demandez si elle se visite."},{"h":"Le saviez-vous ?","t":"On dit souvent que les Borgia, la famille des papes Calixte III et Alexandre VI, venaient d'ici. Le lien n'a jamais pu être prouvé, mais le nom de la ville reste attaché à cette histoire.\n\nEn 1708, Philippe V ajouta aux armoiries de Borja un lion et une fleur de lys et lui accorda les titres de « Muy Ilustre » et « Fidelísima » pour son soutien pendant la guerre de Succession."}],"de":[{"h":"Geschichte","t":"Das Rathaus wurde 1534 vom Baumeister Antón de Veoxa errichtet. Es ist ein Backsteinbau in Renaissance-Tradition mit steinernem Türsturz, schmiedeeisernen Balkonen und einem restaurierten Holzgesims.\n\nDer Laubenplatz, früher „plaza de adentro“ genannt, war das Handelszentrum der Stadt. Alfons V. verlieh Borja 1438 das Stadtrecht; im 15. und 16. Jahrhundert erlebte es seine beste Zeit als Markt der Gegend."},{"h":"Sehenswert","t":"Gehen Sie unter den Lauben entlang und suchen Sie den Palast der Angulo aus dem 16. Jahrhundert mit seinem auffälligen Barockportal. Am Platz steht auch der sogenannte Torreón de los Borja, in Privatbesitz, in dem Ausstellungen stattfinden.\n\nIm Rathaus bewahrt der Königssaal Bildnisse von Monarchen aus dem 17. Jahrhundert. Fragen Sie, ob er zu besichtigen ist."},{"h":"Wussten Sie?","t":"Oft heißt es, die Borgia, die Familie der Päpste Calixtus III. und Alexander VI., stammten von hier. Belegt ist das nie worden, doch der Name der Stadt bleibt mit dieser Geschichte verbunden.\n\n1708 fügte Philipp V. dem Wappen Borjas einen Löwen und eine Lilie hinzu und verlieh die Titel „Muy Ilustre“ und „Fidelísima“ für die Unterstützung im Erbfolgekrieg."}],"pt":[{"h":"História","t":"A Câmara Municipal foi construída em 1534 pelo mestre de obras Antón de Veoxa. É um edifício de tijolo de tradição renascentista, com porta de lintel de pedra, varandas de ferro forjado e um beiral de madeira restaurado.\n\nA praça porticada, conhecida antes como «plaza de adentro», era o centro comercial da cidade. Borja recebeu o título de cidade de Afonso V em 1438 e viveu nos séculos XV e XVI o seu melhor momento como mercado da região."},{"h":"O que ver","t":"Percorra as arcadas e procure o palácio dos Angulo, do século XVI, com um portal barroco muito vistoso. Na praça fica também o chamado Torreón de los Borja, de propriedade privada, que acolhe exposições.\n\nDentro da câmara, o Salão dos Reis conserva retratos de monarcas do século XVII. Pergunte se se pode visitar."},{"h":"Curiosidades","t":"Diz-se muitas vezes que os Bórgia, a família dos papas Calisto III e Alexandre VI, saíram daqui. A ligação nunca foi provada, mas o nome da cidade continua ligado a essa história.\n\nEm 1708, Filipe V acrescentou ao brasão de Borja um leão e uma flor-de-lis e deu-lhe os títulos de «Muy Ilustre» e «Fidelísima» pelo seu apoio na Guerra da Sucessão."}]},"status":"pending"},{"id":"san-miguel-borja","town":"Borja","cat":"museo","lat":41.83378,"lon":-1.53561,"coord_src":null,"q":["Iglesia de San Miguel, Borja","Museo Arqueológico de Borja"],"fq":["Category:Iglesia de San Miguel (Borja)","San Miguel Borja iglesia"],"name":{"es":"Iglesia de San Miguel y Museo Arqueológico","en":"Church of San Miguel and Archaeological Museum","fr":"Église San Miguel et Musée archéologique","de":"Kirche San Miguel und Archäologisches Museum","pt":"Igreja de San Miguel e Museu Arqueológico"},"when":{"es":"Siglo XIII · Hoy Museo Arqueológico","en":"13th century · Now the Archaeological Museum","fr":"XIIIe siècle · Aujourd'hui Musée archéologique","de":"13. Jh. · Heute Archäologisches Museum","pt":"Séc. XIII · Hoje Museu Arqueológico"},"desc":{"es":"Una de las iglesias más antiguas de Borja, junto al convento de Santa Clara, hoy convertida en Museo Arqueológico. Es el sitio para entender quién vivió aquí antes de la ciudad: celtíberos, romanos y musulmanes.","en":"One of Borja's oldest churches, next to the convent of Santa Clara, now converted into the Archaeological Museum. It is the place to understand who lived here before the town: Celtiberians, Romans and Muslims.","fr":"L'une des plus anciennes églises de Borja, à côté du couvent de Santa Clara, aujourd'hui transformée en Musée archéologique. C'est le lieu pour comprendre qui vivait ici avant la ville : Celtibères, Romains et musulmans.","de":"Eine der ältesten Kirchen Borjas, neben dem Kloster Santa Clara, heute Archäologisches Museum. Hier versteht man, wer vor der Stadt hier lebte: Keltiberer, Römer und Muslime.","pt":"Uma das igrejas mais antigas de Borja, junto ao convento de Santa Clara, hoje transformada em Museu Arqueológico. É o lugar para perceber quem viveu aqui antes da cidade: celtiberos, romanos e muçulmanos."},"visit":{"es":"Museo con horario propio, sobre todo fines de semana. Confírmalo en la oficina de turismo de Borja. El Centro de Estudios Borjanos colabora con el Ayuntamiento en su gestión.","en":"Museum with its own opening hours, mainly at weekends. Check with Borja tourist office. The Centro de Estudios Borjanos helps the town council run it.","fr":"Musée aux horaires propres, surtout le week-end. Renseignez-vous à l'office de tourisme de Borja. Le Centro de Estudios Borjanos collabore à sa gestion avec la mairie.","de":"Museum mit eigenen Öffnungszeiten, vor allem am Wochenende. Im Fremdenverkehrsamt erfragen. Das Centro de Estudios Borjanos betreibt es gemeinsam mit der Stadt.","pt":"Museu com horário próprio, sobretudo ao fim de semana. Confirme no posto de turismo de Borja. O Centro de Estudios Borjanos colabora com a câmara na sua gestão."},"src":"https://campodeborja.es/portfolio-item/borja/","sources":["https://campodeborja.es/portfolio-item/borja/","https://es.hispanopedia.com/wiki/Borja_(Zaragoza)"],"art":{"es":[{"h":"Historia","t":"La iglesia de San Miguel, en la plaza de San Francisco, es de comienzos del siglo XIII y está unida al convento de Santa Clara. Su estilo mezcla el gótico y el mudéjar.\n\nHoy alberga el Museo Arqueológico de Borja, que gestionan el Ayuntamiento y el Centro de Estudios Borjanos, la institución que desde la casa de María de Aguilar investiga y divulga la historia de la comarca."},{"h":"Qué ver","t":"El museo recorre la historia del territorio: Bursau, el poblado celtíbero que en el siglo V antes de Cristo ya acuñaba moneda; los asentamientos romanos en las laderas; y Burŷa, la ciudad musulmana de la que salieron los Banu Qasi.\n\nAl lado, el convento de Santa Clara tiene iglesia barroca del siglo XVII con retablo del XVIII y su propio museo."},{"h":"Para entenderlo","t":"Muy cerca, en la Muela, está la Cueva de Moncín, cuyas pinturas forman parte del arte rupestre del arco mediterráneo reconocido por la UNESCO en 1998. No se visita libremente, pero el museo ayuda a situarla en el tiempo."}],"en":[{"h":"History","t":"The church of San Miguel, in Plaza de San Francisco, dates from the early 13th century and is joined to the convent of Santa Clara. Its style mixes Gothic and Mudéjar.\n\nToday it houses Borja's Archaeological Museum, run by the town council and the Centro de Estudios Borjanos, the institution that researches and promotes the history of the area from the house of María de Aguilar."},{"h":"What to see","t":"The museum traces the history of the territory: Bursau, the Celtiberian settlement that was already minting coins in the 5th century BC; the Roman settlements on the hillsides; and Burŷa, the Muslim town that gave rise to the Banu Qasi.\n\nNext door, the convent of Santa Clara has a 17th-century Baroque church with an 18th-century altarpiece and its own museum."},{"h":"Background","t":"Nearby, on the Muela, is the Cueva de Moncín, whose paintings are part of the rock art of the Mediterranean Basin recognised by UNESCO in 1998. It cannot be visited freely, but the museum helps you place it in time."}],"fr":[{"h":"Histoire","t":"L'église San Miguel, sur la Plaza de San Francisco, date du début du XIIIe siècle et est reliée au couvent de Santa Clara. Son style mêle gothique et mudéjar.\n\nElle abrite aujourd'hui le Musée archéologique de Borja, géré par la mairie et le Centro de Estudios Borjanos, l'institution qui, depuis la maison de María de Aguilar, étudie et fait connaître l'histoire de la comarque."},{"h":"À voir","t":"Le musée retrace l'histoire du territoire : Bursau, l'agglomération celtibère qui frappait déjà monnaie au Ve siècle av. J.-C. ; les établissements romains sur les versants ; et Burŷa, la ville musulmane d'où sont issus les Banu Qasi.\n\nÀ côté, le couvent de Santa Clara possède une église baroque du XVIIe siècle avec un retable du XVIIIe et son propre musée."},{"h":"Pour comprendre","t":"Tout près, sur la Muela, se trouve la Cueva de Moncín, dont les peintures font partie de l'art rupestre du bassin méditerranéen reconnu par l'UNESCO en 1998. Elle ne se visite pas librement, mais le musée aide à la situer dans le temps."}],"de":[{"h":"Geschichte","t":"Die Kirche San Miguel an der Plaza de San Francisco stammt vom Anfang des 13. Jahrhunderts und ist mit dem Kloster Santa Clara verbunden. Ihr Stil verbindet Gotik und Mudéjar.\n\nHeute beherbergt sie das Archäologische Museum von Borja, betrieben von der Stadt und dem Centro de Estudios Borjanos, das vom Haus der María de Aguilar aus die Geschichte der Comarca erforscht und vermittelt."},{"h":"Sehenswert","t":"Das Museum zeichnet die Geschichte der Gegend nach: Bursau, die keltiberische Siedlung, die schon im 5. Jahrhundert v. Chr. Münzen prägte; die römischen Siedlungen an den Hängen; und Burŷa, die muslimische Stadt, aus der die Banu Qasi hervorgingen.\n\nNebenan hat das Kloster Santa Clara eine Barockkirche aus dem 17. Jahrhundert mit Altar aus dem 18. und ein eigenes Museum."},{"h":"Hintergrund","t":"Ganz in der Nähe, auf der Muela, liegt die Cueva de Moncín, deren Malereien zur Felskunst im Mittelmeerraum gehören, die die UNESCO 1998 anerkannte. Sie ist nicht frei zugänglich, aber das Museum hilft, sie zeitlich einzuordnen."}],"pt":[{"h":"História","t":"A igreja de San Miguel, na Plaza de San Francisco, é do início do século XIII e está unida ao convento de Santa Clara. O seu estilo mistura o gótico e o mudéjar.\n\nHoje acolhe o Museu Arqueológico de Borja, gerido pela câmara e pelo Centro de Estudios Borjanos, a instituição que, a partir da casa de María de Aguilar, investiga e divulga a história da comarca."},{"h":"O que ver","t":"O museu percorre a história do território: Bursau, o povoado celtibero que já cunhava moeda no século V a.C.; os povoamentos romanos nas encostas; e Burŷa, a cidade muçulmana de onde saíram os Banu Qasi.\n\nAo lado, o convento de Santa Clara tem igreja barroca do século XVII com retábulo do XVIII e museu próprio."},{"h":"Para compreender","t":"Muito perto, na Muela, fica a Cueva de Moncín, cujas pinturas fazem parte da arte rupestre do arco mediterrânico reconhecida pela UNESCO em 1998. Não se visita livremente, mas o museu ajuda a situá-la no tempo."}]},"status":"pending"},{"id":"concepcion-borja","town":"Borja","cat":"patrimonio","lat":41.83415,"lon":-1.53179,"coord_src":null,"q":["Convento de la Concepción, Borja","Convento de Concepcionistas, Borja"],"fq":["Category:Convento de la Concepción (Borja)","Convento Concepción Borja"],"name":{"es":"Convento de la Concepción","en":"Convent of La Concepción","fr":"Couvent de la Concepción","de":"Kloster La Concepción","pt":"Convento da Concepción"},"when":{"es":"Siglo XVII · Barroco, Bien de Interés Cultural","en":"17th century · Baroque, Site of Cultural Interest","fr":"XVIIe siècle · Baroque, Bien d'intérêt culturel","de":"17. Jh. · Barock, Kulturgut","pt":"Séc. XVII · Barroco, Bem de Interesse Cultural"},"desc":{"es":"El convento de la Concepción es la mejor muestra del barroco de Borja: un claustro y una iglesia decorada con frescos. Es Bien de Interés Cultural.","en":"The convent of La Concepción is the finest example of Baroque in Borja: a cloister and a church decorated with frescoes. It is a Site of Cultural Interest.","fr":"Le couvent de la Concepción est le meilleur exemple du baroque de Borja : un cloître et une église ornée de fresques. Il est classé Bien d'intérêt culturel.","de":"Das Kloster La Concepción ist das beste Beispiel des Barocks in Borja: ein Kreuzgang und eine mit Fresken geschmückte Kirche. Es ist Kulturgut von besonderem Interesse.","pt":"O convento da Concepción é a melhor amostra do barroco de Borja: um claustro e uma igreja decorada com frescos. É Bem de Interesse Cultural."},"visit":{"es":"Comunidad religiosa: el interior solo se ve en horario de culto o en visitas concertadas. Pregunta en la oficina de turismo.","en":"A religious community: the interior can only be seen during services or on arranged visits. Ask at the tourist office.","fr":"Communauté religieuse : l'intérieur ne se voit qu'aux heures de culte ou lors de visites organisées. Renseignez-vous à l'office de tourisme.","de":"Ordensgemeinschaft: Das Innere ist nur zu Gottesdiensten oder bei vereinbarten Besuchen zu sehen. Fragen Sie im Fremdenverkehrsamt.","pt":"Comunidade religiosa: o interior só se vê nas horas de culto ou em visitas combinadas. Pergunte no posto de turismo."},"src":"https://campodeborja.es/wp-content/uploads/2024/04/es-ruta-corazon-moncayo.pdf","sources":["https://campodeborja.es/wp-content/uploads/2024/04/es-ruta-corazon-moncayo.pdf","https://campodeborja.es/portfolio-item/borja/","https://es.hispanopedia.com/wiki/Borja_(Zaragoza)"],"art":{"es":[{"h":"Historia","t":"La iglesia de la Concepción es del siglo XVII y está declarada Bien de Interés Cultural. Forma parte de un convento que todavía conserva su claustro.\n\nEl siglo XVII fue en Borja una época de recesión económica; aun así, las comunidades religiosas siguieron levantando y decorando sus conventos."},{"h":"Qué ver","t":"La ruta del Moncayo de Slow Driving Aragón la destaca como la mejor muestra del barroco local, con un claustro y una iglesia decorada con frescos.\n\nEn el mismo paseo verás otros edificios de la época: la iglesia de Santo Domingo, convertida en auditorio municipal, y la fachada barroca de ladrillo de San Bartolomé, lo único que quedó cuando se derribó el templo en los años sesenta."},{"h":"Para entenderlo","t":"Borja llegó a tener varios conventos dentro de su casco urbano: Santa Clara, la Concepción, Santo Domingo y los Capuchinos, cuyo edificio pasó a ser el Hospital del Sancti Spiritus tras la desamortización de 1868. Sus fachadas siguen marcando el paisaje de las calles del centro."}],"en":[{"h":"History","t":"The church of La Concepción dates from the 17th century and is listed as a Site of Cultural Interest. It belongs to a convent that still has its cloister.\n\nThe 17th century was a time of economic recession in Borja; even so, the religious communities went on building and decorating their convents."},{"h":"What to see","t":"Slow Driving Aragón's Moncayo route singles it out as the best example of local Baroque, with a cloister and a church decorated with frescoes.\n\nOn the same walk you will see other buildings of the period: the church of Santo Domingo, now the municipal auditorium, and the Baroque brick façade of San Bartolomé, all that remained when the church was demolished in the 1960s."},{"h":"Background","t":"Borja once had several convents within its old town: Santa Clara, La Concepción, Santo Domingo and the Capuchins, whose building became the Hospital del Sancti Spiritus after the disentailment of 1868. Their façades still shape the streets of the centre."}],"fr":[{"h":"Histoire","t":"L'église de la Concepción date du XVIIe siècle et est classée Bien d'intérêt culturel. Elle fait partie d'un couvent qui conserve encore son cloître.\n\nLe XVIIe siècle fut à Borja une période de récession économique ; malgré cela, les communautés religieuses continuèrent à bâtir et à décorer leurs couvents."},{"h":"À voir","t":"La route du Moncayo de Slow Driving Aragón la signale comme le meilleur exemple du baroque local, avec un cloître et une église ornée de fresques.\n\nDans la même promenade, vous verrez d'autres édifices de l'époque : l'église Santo Domingo, devenue auditorium municipal, et la façade baroque en brique de San Bartolomé, seul vestige de l'église démolie dans les années 1960."},{"h":"Pour comprendre","t":"Borja compta plusieurs couvents dans sa vieille ville : Santa Clara, la Concepción, Santo Domingo et les Capucins, dont le bâtiment devint l'Hôpital du Sancti Spiritus après la désamortisation de 1868. Leurs façades marquent encore le paysage des rues du centre."}],"de":[{"h":"Geschichte","t":"Die Kirche La Concepción stammt aus dem 17. Jahrhundert und ist Kulturgut von besonderem Interesse. Sie gehört zu einem Kloster, das seinen Kreuzgang bewahrt hat.\n\nDas 17. Jahrhundert war in Borja eine Zeit wirtschaftlichen Niedergangs; trotzdem bauten und schmückten die Ordensgemeinschaften ihre Klöster weiter."},{"h":"Sehenswert","t":"Die Moncayo-Route von Slow Driving Aragón hebt es als bestes Beispiel des örtlichen Barocks hervor, mit Kreuzgang und einer mit Fresken geschmückten Kirche.\n\nAuf demselben Spaziergang sehen Sie weitere Bauten der Zeit: die Kirche Santo Domingo, heute städtisches Auditorium, und die barocke Backsteinfassade von San Bartolomé, alles, was beim Abriss der Kirche in den 1960er-Jahren übrig blieb."},{"h":"Hintergrund","t":"Borja hatte mehrere Klöster in seiner Altstadt: Santa Clara, La Concepción, Santo Domingo und die Kapuziner, deren Gebäude nach der Säkularisation von 1868 zum Hospital del Sancti Spiritus wurde. Ihre Fassaden prägen noch heute die Straßen des Zentrums."}],"pt":[{"h":"História","t":"A igreja da Concepción é do século XVII e está classificada como Bem de Interesse Cultural. Faz parte de um convento que ainda conserva o claustro.\n\nO século XVII foi em Borja uma época de recessão económica; ainda assim, as comunidades religiosas continuaram a construir e a decorar os seus conventos."},{"h":"O que ver","t":"A rota do Moncayo da Slow Driving Aragón destaca-o como a melhor amostra do barroco local, com um claustro e uma igreja decorada com frescos.\n\nNo mesmo passeio verá outros edifícios da época: a igreja de Santo Domingo, convertida em auditório municipal, e a fachada barroca de tijolo de San Bartolomé, tudo o que restou quando o templo foi demolido nos anos 1960."},{"h":"Para compreender","t":"Borja chegou a ter vários conventos dentro do centro: Santa Clara, a Concepción, Santo Domingo e os Capuchinhos, cujo edifício passou a ser o Hospital do Sancti Spiritus após a desamortização de 1868. As suas fachadas continuam a marcar a paisagem das ruas do centro."}]},"status":"pending"},{"id":"santuario-misericordia","town":"Borja","cat":"patrimonio","lat":41.85484,"lon":-1.57545,"coord_src":null,"q":["Santuario de Misericordia, Borja","Santuario de la Misericordia"],"fq":["Category:Santuario de Misericordia (Borja)","Santuario Misericordia Borja"],"name":{"es":"Santuario de Misericordia","en":"Santuario de Misericordia","fr":"Sanctuaire de Misericordia","de":"Santuario de Misericordia","pt":"Santuário de Misericordia"},"when":{"es":"Siglos XVI-XVIII · Espacio de Interés Turístico","en":"16th–18th c. · Site of Tourist Interest","fr":"XVIe–XVIIIe s. · Espace d'intérêt touristique","de":"16.–18. Jh. · Ort von touristischem Interesse","pt":"Séc. XVI–XVIII · Espaço de Interesse Turístico"},"desc":{"es":"En la Muela, a unos 5 km de Borja y a 672 metros de altitud, el santuario es un caserón de ladrillo entre pinares y fuentes, con vistas a todo el Campo de Borja. Es Espacio de Interés Turístico de Aragón.","en":"On the Muela, about 5 km from Borja and 672 metres up, the sanctuary is a large brick house among pine woods and springs, with views over the whole Campo de Borja. It is a Site of Tourist Interest of Aragon.","fr":"Sur la Muela, à environ 5 km de Borja et à 672 mètres d'altitude, le sanctuaire est une grande demeure en brique entre pinèdes et sources, avec vue sur tout le Campo de Borja. Il est Espace d'intérêt touristique d'Aragon.","de":"Auf der Muela, etwa 5 km von Borja und 672 Meter hoch, ist das Heiligtum ein großes Backsteinhaus zwischen Kiefern und Quellen, mit Blick über das ganze Campo de Borja. Es ist Ort von touristischem Interesse in Aragonien.","pt":"Na Muela, a cerca de 5 km de Borja e a 672 metros de altitude, o santuário é um casarão de tijolo entre pinhais e fontes, com vista sobre todo o Campo de Borja. É Espaço de Interesse Turístico de Aragão."},"visit":{"es":"Abierto a visitas; el Ayuntamiento recomienda llamar antes al 607 391 752 para confirmar horario. Hay restaurante, merenderos con asadores, camping y pistas forestales para caminar.","en":"Open to visitors; the town council recommends calling 607 391 752 first to check opening times. There is a restaurant, picnic areas with barbecues, a campsite and forest tracks for walking.","fr":"Ouvert aux visites ; la mairie conseille d'appeler d'abord le 607 391 752 pour vérifier les horaires. Restaurant, aires de pique-nique avec barbecues, camping et pistes forestières pour marcher.","de":"Zu besichtigen; die Stadt empfiehlt, vorher unter 607 391 752 die Zeiten zu erfragen. Restaurant, Picknickplätze mit Grillstellen, Campingplatz und Forstwege zum Wandern.","pt":"Aberto a visitas; a câmara recomenda ligar antes para o 607 391 752 para confirmar o horário. Há restaurante, merendeiros com grelhadores, parque de campismo e caminhos florestais."},"src":"https://campodeborja.es/portfolio-item/santuario-de-la-misericordia/","sources":["https://campodeborja.es/portfolio-item/santuario-de-la-misericordia/","https://es.hispanopedia.com/wiki/Borja_(Zaragoza)","https://campodeborja.es/wp-content/uploads/2024/04/es-ruta-corazon-moncayo.pdf"],"art":{"es":[{"h":"Historia","t":"En 1451, al empezar las obras del claustro de la colegiata, apareció una imagen de la Virgen con la inscripción «Mater misericordia». En 1539 se pidió permiso para levantar una ermita sobre otra anterior dedicada a santa Eulalia; se terminó en 1546 y al año siguiente llegaron las primeras procesiones.\n\nEntre 1560 y 1567 se construyó el caserón, y en las décadas siguientes se añadieron el Cabildo Viejo, la «habitación de la Virgen» y nuevas cuadras. La escalera principal es de 1681, el segundo piso se completó entre 1713 y 1731 y el tercero en 1795. Desde 1868 es propiedad del Ayuntamiento de Borja."},{"h":"Qué ver","t":"Entra por el patio de acceso del siglo XVI y sube por la escalera barroca de doble tiro. La iglesia tiene un presbiterio pentagonal con bóveda de crucería estrellada, un retablo mayor barroco de la segunda mitad del siglo XVIII y una Virgen con el Niño románica.\n\nEn una capilla lateral está el Ecce Homo que dio la vuelta al mundo en 2012 (tiene su propia ficha en esta guía)."},{"h":"El paisaje","t":"El santuario está en la Muela Alta, en las faldas del Moncayo, rodeado de pinos y conocido por sus manantiales. Desde el mirador se ven los campos de viña de toda la comarca.\n\nEl 25 de agosto, día después de San Bartolomé, Borja sube aquí en romería, y el 15 de agosto el santuario celebra sus propias fiestas."}],"en":[{"h":"History","t":"In 1451, when work began on the cloister of the collegiate church, an image of the Virgin was found with the inscription «Mater misericordia». In 1539 permission was sought to build a hermitage over an older one dedicated to Saint Eulalia; it was finished in 1546 and the first processions arrived the following year.\n\nThe large house was built between 1560 and 1567, and in the following decades the Cabildo Viejo, the «Virgin's room» and new stables were added. The main staircase dates from 1681, the second floor was completed between 1713 and 1731 and the third in 1795. Since 1868 it has belonged to Borja town council."},{"h":"What to see","t":"Enter through the 16th-century courtyard and climb the Baroque double staircase. The church has a pentagonal chancel with a star-ribbed vault, a Baroque main altarpiece from the second half of the 18th century and a Romanesque Virgin and Child.\n\nIn a side chapel is the Ecce Homo that went round the world in 2012 (it has its own entry in this guide)."},{"h":"The landscape","t":"The sanctuary stands on the Muela Alta, on the slopes of the Moncayo, surrounded by pines and known for its springs. From the viewpoint you can see the vineyards of the whole area.\n\nOn 25 August, the day after San Bartolomé, Borja comes up here on pilgrimage, and on 15 August the sanctuary holds its own festival."}],"fr":[{"h":"Histoire","t":"En 1451, au début des travaux du cloître de la collégiale, on trouva une image de la Vierge portant l'inscription « Mater misericordia ». En 1539, on demanda l'autorisation d'élever un ermitage sur un autre plus ancien dédié à sainte Eulalie ; il fut achevé en 1546 et les premières processions arrivèrent l'année suivante.\n\nLa grande maison fut construite entre 1560 et 1567, et au cours des décennies suivantes on ajouta le Cabildo Viejo, la « chambre de la Vierge » et de nouvelles écuries. L'escalier principal date de 1681, le deuxième étage fut achevé entre 1713 et 1731 et le troisième en 1795. Depuis 1868, il appartient à la mairie de Borja."},{"h":"À voir","t":"Entrez par la cour du XVIe siècle et montez l'escalier baroque à double volée. L'église a un chœur pentagonal couvert d'une voûte d'ogives étoilée, un retable majeur baroque de la seconde moitié du XVIIIe siècle et une Vierge à l'Enfant romane.\n\nDans une chapelle latérale se trouve l'Ecce Homo qui a fait le tour du monde en 2012 (il a sa propre fiche dans ce guide)."},{"h":"Le paysage","t":"Le sanctuaire se trouve sur la Muela Alta, sur les pentes du Moncayo, entouré de pins et connu pour ses sources. Depuis le belvédère, on voit les vignobles de toute la comarque.\n\nLe 25 août, lendemain de la Saint-Barthélemy, Borja monte ici en pèlerinage, et le 15 août le sanctuaire célèbre sa propre fête."}],"de":[{"h":"Geschichte","t":"Als 1451 der Bau des Kreuzgangs der Stiftskirche begann, fand man ein Marienbild mit der Inschrift „Mater misericordia“. 1539 bat man um Erlaubnis, über einer älteren, der heiligen Eulalia geweihten Einsiedelei eine neue zu bauen; sie wurde 1546 fertig, im Jahr darauf kamen die ersten Prozessionen.\n\nZwischen 1560 und 1567 entstand das große Haus, in den folgenden Jahrzehnten kamen der Cabildo Viejo, die „Kammer der Jungfrau“ und neue Ställe hinzu. Die Haupttreppe stammt von 1681, das zweite Stockwerk wurde 1713–1731 vollendet, das dritte 1795. Seit 1868 gehört es der Stadt Borja."},{"h":"Sehenswert","t":"Treten Sie durch den Hof aus dem 16. Jahrhundert ein und steigen Sie die barocke Doppeltreppe hinauf. Die Kirche hat einen fünfeckigen Chor mit Sternrippengewölbe, einen barocken Hochaltar aus der zweiten Hälfte des 18. Jahrhunderts und eine romanische Madonna mit Kind.\n\nIn einer Seitenkapelle befindet sich das Ecce Homo, das 2012 um die Welt ging (es hat einen eigenen Eintrag in diesem Führer)."},{"h":"Die Landschaft","t":"Das Heiligtum liegt auf der Muela Alta, an den Hängen des Moncayo, umgeben von Kiefern und bekannt für seine Quellen. Vom Aussichtspunkt sieht man die Weinberge der ganzen Gegend.\n\nAm 25. August, dem Tag nach San Bartolomé, pilgert Borja hierher, und am 15. August feiert das Heiligtum sein eigenes Fest."}],"pt":[{"h":"História","t":"Em 1451, ao começarem as obras do claustro da colegiada, apareceu uma imagem da Virgem com a inscrição «Mater misericordia». Em 1539 pediu-se licença para construir uma ermida sobre outra mais antiga dedicada a santa Eulália; ficou pronta em 1546 e no ano seguinte chegaram as primeiras procissões.\n\nEntre 1560 e 1567 construiu-se o casarão e, nas décadas seguintes, acrescentaram-se o Cabildo Viejo, o «quarto da Virgem» e novas cavalariças. A escadaria principal é de 1681, o segundo piso completou-se entre 1713 e 1731 e o terceiro em 1795. Desde 1868 pertence à Câmara de Borja."},{"h":"O que ver","t":"Entre pelo pátio do século XVI e suba pela escadaria barroca de dois lanços. A igreja tem um presbitério pentagonal com abóbada de nervuras estrelada, um retábulo-mor barroco da segunda metade do século XVIII e uma Virgem com o Menino românica.\n\nNuma capela lateral está o Ecce Homo que deu a volta ao mundo em 2012 (tem ficha própria neste guia)."},{"h":"A paisagem","t":"O santuário fica na Muela Alta, nas faldas do Moncayo, rodeado de pinheiros e conhecido pelas suas nascentes. Do miradouro veem-se as vinhas de toda a comarca.\n\nA 25 de agosto, dia seguinte a San Bartolomé, Borja sobe aqui em romaria, e a 15 de agosto o santuário celebra a sua própria festa."}]},"status":"pending"},{"id":"ecce-homo","town":"Borja","cat":"museo","lat":41.85462,"lon":-1.575,"coord_src":null,"q":["Santuario de Misericordia, Borja","Centro de Interpretación Ecce Homo"],"fq":["Category:Ecce Homo (Elías García Martínez)","Ecce Homo Borja"],"name":{"es":"Ecce Homo y su centro de interpretación","en":"Ecce Homo and its interpretation centre","fr":"L'Ecce Homo et son centre d'interprétation","de":"Ecce Homo und Interpretationszentrum","pt":"Ecce Homo e o seu centro interpretativo"},"when":{"es":"2012 · El cuadro que dio la vuelta al mundo","en":"2012 · The painting that went round the world","fr":"2012 · Le tableau qui a fait le tour du monde","de":"2012 · Das Bild, das um die Welt ging","pt":"2012 · O quadro que deu a volta ao mundo"},"desc":{"es":"Un Ecce Homo pintado en la pared del santuario por Elías García Martínez se hizo famoso en todo el mundo en 2012 tras un intento de restauración. Hoy tiene centro de interpretación y miles de visitantes al año.","en":"An Ecce Homo painted on the sanctuary wall by Elías García Martínez became world-famous in 2012 after an attempted restoration. Today it has an interpretation centre and thousands of visitors a year.","fr":"Un Ecce Homo peint sur le mur du sanctuaire par Elías García Martínez est devenu célèbre dans le monde entier en 2012 après une tentative de restauration. Il a aujourd'hui un centre d'interprétation et des milliers de visiteurs par an.","de":"Ein von Elías García Martínez an die Wand des Heiligtums gemaltes Ecce Homo wurde 2012 nach einem Restaurierungsversuch weltberühmt. Heute hat es ein Interpretationszentrum und Tausende Besucher im Jahr.","pt":"Um Ecce Homo pintado na parede do santuário por Elías García Martínez tornou-se famoso em todo o mundo em 2012 após uma tentativa de restauro. Hoje tem centro interpretativo e milhares de visitantes por ano."},"visit":{"es":"Se visita dentro del Santuario de Misericordia, con entrada. Hay sala de interpretación y tienda. Confirma horario en el 607 391 752.","en":"Visited inside the Santuario de Misericordia, with an entry fee. There is an interpretation room and a shop. Check opening times on 607 391 752.","fr":"Se visite à l'intérieur du sanctuaire de Misericordia, avec entrée payante. Salle d'interprétation et boutique. Vérifiez les horaires au 607 391 752.","de":"Im Santuario de Misericordia zu besichtigen, mit Eintritt. Mit Ausstellungsraum und Laden. Zeiten unter 607 391 752 erfragen.","pt":"Visita-se dentro do Santuário de Misericordia, com bilhete. Há sala interpretativa e loja. Confirme horários no 607 391 752."},"src":"https://www.directoalpaladar.com/viajes/he-vuelto-decada-despues-a-ver-importante-meme-espanol-historia-sigue-haciendo-mucha-gracia","sources":["https://www.directoalpaladar.com/viajes/he-vuelto-decada-despues-a-ver-importante-meme-espanol-historia-sigue-haciendo-mucha-gracia","https://campodeborja.es/portfolio-item/santuario-de-la-misericordia/","https://es.hispanopedia.com/wiki/Borja_(Zaragoza)","https://campodeborja.es/wp-content/uploads/2024/04/es-ruta-corazon-moncayo.pdf"],"art":{"es":[{"h":"Historia","t":"La pintura mural es obra de Elías García Martínez, profesor de una escuela de arte de Zaragoza, y estuvo durante décadas en una capilla del santuario sin llamar la atención. En el verano de 2012, Cecilia Giménez, una vecina de 81 años y devota del santuario, intentó restaurarla porque estaba muy deteriorada.\n\nEl 7 de agosto de 2012 el Centro de Estudios Borjanos publicó la noticia en su web; la prensa regional la recogió y en pocos días el caso estaba en medios de todo el mundo."},{"h":"Qué ver","t":"El mural original está protegido detrás de un cristal. Cerca de la entrada, una sala explica la historia del cuadro y de su restauración, y desde marzo de 2016 funciona un centro de interpretación sobre todo el proceso.\n\nHay también un espacio con versiones del Ecce Homo hechas por artistas contemporáneos, un photocall para poner tu cara en el cuadro y una tienda con recuerdos y vino de Borja."},{"h":"Curiosidades","t":"Se calcula que más de 300.000 personas de unos 130 países han visitado el santuario desde 2012, y los visitantes marcan su procedencia en un mapa. El santuario es propiedad de una fundación cuyo único patrono es el Ayuntamiento de Borja.\n\nEl Ecce Homo es hoy la visita más conocida de Borja, y para muchos viajeros es la puerta de entrada al resto de la comarca."}],"en":[{"h":"History","t":"The mural is the work of Elías García Martínez, a teacher at an art school in Zaragoza, and for decades it hung in a chapel of the sanctuary without attracting attention. In the summer of 2012 Cecilia Giménez, an 81-year-old local woman devoted to the sanctuary, tried to restore it because it was badly deteriorated.\n\nOn 7 August 2012 the Centro de Estudios Borjanos published the news on its website; the regional press picked it up and within days the story was in the media all over the world."},{"h":"What to see","t":"The original mural is protected behind glass. Near the entrance, a room explains the story of the painting and its restoration, and since March 2016 an interpretation centre has covered the whole process.\n\nThere is also a space with versions of the Ecce Homo by contemporary artists, a photo booth where you can put your face in the painting, and a shop selling souvenirs and Borja wine."},{"h":"Did you know?","t":"It is estimated that more than 300,000 people from some 130 countries have visited the sanctuary since 2012, and visitors mark where they come from on a map. The sanctuary belongs to a foundation whose sole trustee is Borja town council.\n\nThe Ecce Homo is now Borja's best-known attraction, and for many travellers it is the gateway to the rest of the area."}],"fr":[{"h":"Histoire","t":"La peinture murale est l'œuvre d'Elías García Martínez, professeur dans une école d'art de Saragosse, et elle resta pendant des décennies dans une chapelle du sanctuaire sans attirer l'attention. À l'été 2012, Cecilia Giménez, une habitante de 81 ans dévouée au sanctuaire, tenta de la restaurer car elle était très abîmée.\n\nLe 7 août 2012, le Centro de Estudios Borjanos publia la nouvelle sur son site ; la presse régionale la reprit et en quelques jours l'affaire faisait le tour des médias du monde entier."},{"h":"À voir","t":"La peinture originale est protégée derrière une vitre. Près de l'entrée, une salle raconte l'histoire du tableau et de sa restauration, et depuis mars 2016 un centre d'interprétation présente tout le processus.\n\nIl y a aussi un espace avec des versions de l'Ecce Homo réalisées par des artistes contemporains, un photocall pour mettre son visage dans le tableau et une boutique de souvenirs et de vin de Borja."},{"h":"Le saviez-vous ?","t":"On estime que plus de 300 000 personnes venues de quelque 130 pays ont visité le sanctuaire depuis 2012, et les visiteurs indiquent leur provenance sur une carte. Le sanctuaire appartient à une fondation dont l'unique patron est la mairie de Borja.\n\nL'Ecce Homo est aujourd'hui la visite la plus connue de Borja et, pour beaucoup de voyageurs, la porte d'entrée vers le reste de la comarque."}],"de"
